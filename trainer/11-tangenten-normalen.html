<head>

    <title>Tangenten &amp; Normalen - Mathepfade</title>

<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-tangenten-normalen';
    const THEMA_CONFIG = { name: 'Tangenten & Normalen', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 -- Grundbegriffe
      { id:1, level:1, typ:"mc", frage:"Was ist die Steigung einer Tangente an \\(f\\) im Punkt \\(x_0\\)?", optionen:["\\(f(x_0)\\)","\\(f'(x_0)\\)","\\(\\frac{1}{f'(x_0)}\\)","\\(-f'(x_0)\\)"], korrekt:1, tipp:"Die Ableitung liefert die Steigung.", loesungsweg:"Die Tangente schmiegt sich im Punkt \\((x_0|f(x_0))\\) an den Graphen an und hat deshalb genau dessen Steigung dort: $$m_t = f'(x_0)$$ Der Funktionswert \\(f(x_0)\\) liefert dagegen nur den Berührpunkt, nicht die Steigung — beides wird leicht verwechselt." },
      { id:2, level:1, typ:"mc", frage:"Welche Bedingung gilt für die Normalensteigung \\(m_n\\) zur Tangentensteigung \\(m_t\\)?", optionen:["\\(m_n = m_t\\)","\\(m_n = -m_t\\)","\\(m_n \\cdot m_t = -1\\)","\\(m_n + m_t = 0\\)"], korrekt:2, tipp:"Normalen stehen senkrecht auf Tangenten.", loesungsweg:"Orthogonalitätsbedingung: \\(m_n \\cdot m_t = -1\\), also \\(m_n = -\\frac{1}{m_t}\\)." },
      { id:3, level:1, typ:"mc", frage:"Die Tangentengleichung lautet:", optionen:["\\(y = f(x_0) + f'(x_0)(x - x_0)\\)","\\(y = f(x_0) \\cdot x\\)","\\(y = f'(x_0) \\cdot x\\)","\\(y = f(x) - f(x_0)\\)"], korrekt:0, tipp:"Punkt-Steigungs-Form.", loesungsweg:"Bekannt sind der Berührpunkt \\((x_0|f(x_0))\\) und die Steigung \\(f'(x_0)\\). Eingesetzt in die Punkt-Steigungs-Form \\(y = m(x-x_0)+y_0\\): $$t(x) = f(x_0) + f'(x_0)(x-x_0)$$ Probe: \\(t(x_0) = f(x_0)\\) ✓ — die Tangente geht tatsächlich durch den Berührpunkt." },
      { id:4, level:1, typ:"numerisch", frage:"Sei \\(f(x) = x^2\\). Berechne \\(f'(3)\\).", loesung:6, toleranz:0, tipp:"\\(f'(x) = 2x\\).", loesungsweg:"\\(f'(x) = 2x\\), also \\(f'(3) = 6\\)." },
      { id:5, level:1, typ:"numerisch", frage:"Sei \\(f(x) = x^3\\). Berechne die Tangentensteigung in \\(x_0 = 2\\).", loesung:12, toleranz:0, tipp:"\\(f'(x) = 3x^2\\).", loesungsweg:"\\(f'(2) = 3 \\cdot 4 = 12\\)." },
      { id:6, level:1, typ:"mc", frage:"Die Normalensteigung zu \\(m_t = 2\\) ist:", optionen:["\\(2\\)","\\(-2\\)","\\(\\frac{1}{2}\\)","\\(-\\frac{1}{2}\\)"], korrekt:3, tipp:"Kehrwert mit Minus.", loesungsweg:"Tangente und Normale stehen senkrecht aufeinander, für ihre Steigungen gilt also \\(m_t \\cdot m_n = -1\\): $$m_n = -\\frac{1}{m_t} = -\\frac12$$ Der Kehrwert allein (\\(\\tfrac12\\)) genügt nicht, das Minuszeichen gehört dazu." },
      // LEVEL 2 -- Tangente aufstellen
      { id:7, level:2, typ:"numerisch", frage:"\\(f(x) = x^2\\), Tangente in \\(x_0 = 1\\): \\(t(x) = 2x + c\\). Bestimme \\(c\\).", loesung:-1, toleranz:0, tipp:"Punkt \\((1,1)\\) einsetzen.", loesungsweg:"\\(t(x) = 1 + 2(x-1) = 2x - 1\\), also \\(c = -1\\)." },
      { id:8, level:2, typ:"numerisch", frage:"\\(f(x) = x^2 - 4\\), Tangente in \\(x_0 = 2\\). y-Achsenabschnitt?", loesung:-8, toleranz:0, tipp:"Berührpunkt und Steigung bestimmen, dann die Gerade an der Stelle \\(0\\) auswerten.", loesungsweg:"Berührpunkt und Steigung: $$f(2) = 4-4 = 0, \\qquad f'(x) = 2x \\;\\Rightarrow\\; f'(2) = 4$$ Tangente: $$t(x) = 0 + 4(x-2) = 4x - 8$$ Der y-Achsenabschnitt ist \\(t(0) = -8\\)." },
      { id:9, level:2, typ:"numerisch", frage:"\\(f(x) = x^3\\), Tangentensteigung in \\(x_0 = -1\\)?", loesung:3, toleranz:0, tipp:"\\(f'(x) = 3x^2\\).", loesungsweg:"$$f'(x) = 3x^2 \\;\\Rightarrow\\; f'(-1) = 3 \\cdot (-1)^2 = 3$$ Das Ergebnis ist positiv, denn \\((-1)^2 = 1\\) — die Funktion \\(x^3\\) steigt auch links der \\(y\\)-Achse." },
      { id:10, level:2, typ:"numerisch", frage:"\\(f(x) = \\frac{1}{2}x^2\\), Tangentensteigung in \\(x_0 = 4\\)?", loesung:4, toleranz:0, tipp:"\\(f'(x)=x\\).", loesungsweg:"$$f'(x) = \\tfrac12 \\cdot 2x = x \\;\\Rightarrow\\; f'(4) = 4$$ Der Faktor \\(\\tfrac12\\) kürzt sich mit dem Exponenten \\(2\\) weg." },
      { id:11, level:2, typ:"mc", frage:"\\(f(x)=x^2\\): Tangente in \\(x_0=0\\) ist …", optionen:["\\(y=0\\)","\\(y=x\\)","\\(y=-x\\)","\\(y=x^2\\)"], korrekt:0, tipp:"\\(f'(0)=0\\).", loesungsweg:"$$f'(x) = 2x \\;\\Rightarrow\\; f'(0) = 0$$ Die Tangente ist also waagerecht und geht durch den Punkt \\((0|0)\\): $$y = 0$$ Das ist die \\(x\\)-Achse. Sie berührt die Parabel im Scheitel, ohne sie zu schneiden." },
      { id:12, level:2, typ:"numerisch", frage:"\\(f(x)=2x^2-3x+1\\), \\(f'(2)=?\\)", loesung:5, toleranz:0, tipp:"\\(f'(x)=4x-3\\).", loesungsweg:"$$f'(x) = 4x-3 \\;\\Rightarrow\\; f'(2) = 8-3 = 5$$ Das konstante Glied \\(+1\\) fällt beim Ableiten weg." },
      // LEVEL 3 -- Normale aufstellen
      { id:13, level:3, typ:"numerisch", frage:"\\(f(x)=x^2\\), \\(x_0=2\\). Normalensteigung?", loesung:-0.25, toleranz:0.01, tipp:"Erst die Tangentensteigung, daraus der negative Kehrwert.", loesungsweg:"Zuerst die Tangentensteigung: $$f'(x) = 2x \\;\\Rightarrow\\; f'(2) = 4$$ Die Normale steht senkrecht darauf, es gilt also \\(m_t \\cdot m_n = -1\\): $$m_n = -\\frac{1}{4} = -0{,}25$$ Die Tangente steigt steil, die Normale fällt deshalb flach." },
      { id:14, level:3, typ:"numerisch", frage:"\\(f(x)=x^3+1\\), \\(x_0=1\\). Normalensteigung? (4 Dezimalen)", loesung:-0.3333, toleranz:0.005, tipp:"Ableiten, einsetzen, dann den negativen Kehrwert bilden.", loesungsweg:"Tangentensteigung: $$f'(x) = 3x^2 \\;\\Rightarrow\\; f'(1) = 3$$ Die additive Konstante \\(1\\) verschiebt den Graphen nur nach oben und ändert die Steigung nicht. Daraus die Normalensteigung: $$m_n = -\\frac13 \\approx -0{,}3333$$" },
      { id:15, level:3, typ:"numerisch", frage:"\\(f(x)=\\sqrt{x}\\), \\(x_0=4\\). \\(f'(4)=?\\)", loesung:0.25, toleranz:0.01, tipp:"\\(f'(x)=\\frac{1}{2\\sqrt{x}}\\).", loesungsweg:"Die Wurzel wird als Potenz geschrieben: \\(\\sqrt x = x^{1/2}\\), also $$f'(x) = \\frac12 x^{-1/2} = \\frac{1}{2\\sqrt x}$$ Einsetzen: $$f'(4) = \\frac{1}{2 \\cdot 2} = 0{,}25$$ Die Wurzelfunktion wird nach rechts immer flacher — der kleine Steigungswert passt dazu." },
      { id:16, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x}\\), \\(x_0=2\\). Normalensteigung?", loesung:4, toleranz:0, tipp:"Schreibe den Bruch als Potenz, leite ab und bilde erst dann den negativen Kehrwert.", loesungsweg:"Mit \\(\\frac1x = x^{-1}\\) folgt $$f'(x) = -x^{-2} = -\\frac{1}{x^2} \\;\\Rightarrow\\; m_t = f'(2) = -\\frac14$$ Der negative Kehrwert davon ist $$m_n = -\\frac{1}{-\\frac14} = 4$$ Aus einer flach fallenden Tangente wird eine steil steigende Normale." },
      { id:17, level:3, typ:"mc", frage:"Welche Gerade ist die Normale an \\(f(x)=x^2-4x\\) im Punkt \\((1\\,|\\,{-3})\\)?", optionen:["\\(y=\\frac{1}{2}x-\\frac{7}{2}\\)","\\(y=-2x-1\\)","\\(y=-\\frac{1}{2}x-\\frac{5}{2}\\)","\\(y=2x-5\\)"], korrekt:0, tipp:"Erst die Tangentensteigung, daraus die Normalensteigung, dann den Punkt einsetzen.", loesungsweg:"Tangentensteigung: $$f'(x) = 2x-4 \\;\\Rightarrow\\; f'(1) = -2$$ Daraus die Normalensteigung \\(m_n = -\\frac{1}{-2} = \\frac12\\). Mit dem Punkt \\((1\\,|\\,{-3})\\): $$n(x) = -3 + \\frac12(x-1) = \\frac12 x - \\frac72$$ Die Gerade \\(y = -2x-1\\) ist die Tangente; \\(y = -\\frac12 x - \\frac52\\) hat den Kehrwert ohne Vorzeichenwechsel." },
      { id:18, level:3, typ:"numerisch", frage:"\\(f(x)=x^2-2x\\), in welchem \\(x_0\\) ist die Tangente waagerecht?", loesung:1, toleranz:0, tipp:"\\(f'(x)=0\\).", loesungsweg:"\\(2x-2=0 \\Rightarrow x=1\\)." },
      // LEVEL 4 -- Tangente und Normale anwenden, Umkehraufgaben
      { id:19, level:4, typ:"numerisch", frage:"Die Tangente an \\(f(x) = x^2 - 2x\\) im Punkt mit \\(x_0 = 3\\) schneidet die \\(y\\)-Achse. Bei welchem \\(y\\)-Wert?", loesung:-9, toleranz:0, tipp:"Bestimme zuerst Berührpunkt und Steigung, dann die Geradengleichung.", loesungsweg:"Berührpunkt und Steigung: $$f(3) = 9-6 = 3, \\qquad f'(x) = 2x-2 \\;\\Rightarrow\\; f'(3) = 4$$ Punkt-Steigungs-Form: $$t(x) = 3 + 4(x-3) = 4x - 9$$ Der \\(y\\)-Achsenabschnitt ist \\(t(0) = -9\\). Er liegt deutlich unter dem Berührpunkt, weil die Tangente von dort aus über drei Einheiten mit der Steigung \\(4\\) abfällt." },
      { id:20, level:4, typ:"numerisch", frage:"Unter welchem Winkel schneidet die Tangente an \\(f(x) = x^2\\) an der Stelle \\(x_0 = 0{,}5\\) die \\(x\\)-Achse? (in Grad)", loesung:45, toleranz:0.5, tipp:"Zwischen der Steigung einer Geraden und ihrem Steigungswinkel vermittelt der Tangens.", loesungsweg:"Zuerst die Steigung der Tangente: $$f'(x) = 2x \\;\\Rightarrow\\; f'(0{,}5) = 1$$ Für den Steigungswinkel \\(\\alpha\\) einer Geraden gilt \\(m = \\tan\\alpha\\), also $$\\tan\\alpha = 1 \\;\\Rightarrow\\; \\alpha = 45°$$ Die Steigung \\(1\\) bedeutet anschaulich: ein Schritt nach rechts, ein Schritt nach oben — das ist die Winkelhalbierende." },
      { id:21, level:4, typ:"mc", frage:"Welche Gerade ist die Normale an \\(f(x) = x^2\\) im Punkt \\((1|1)\\)?", optionen:["\\(y=-\\frac{1}{2}x+\\frac{3}{2}\\)","\\(y=2x-1\\)","\\(y=-2x+3\\)","\\(y=\\frac{1}{2}x+\\frac{1}{2}\\)"], korrekt:0, tipp:"Erst die Tangentensteigung, daraus die Normalensteigung, dann den Punkt einsetzen.", loesungsweg:"Tangentensteigung: \\(f'(1) = 2\\). Daraus die Normalensteigung: $$m_n = -\\frac{1}{2}$$ Mit dem Punkt \\((1|1)\\): $$n(x) = 1 - \\frac12(x-1) = -\\frac12 x + \\frac32$$ Die Gerade \\(y = 2x-1\\) wäre die Tangente, \\(y = -2x+3\\) benutzt das negative Doppelte statt des negativen Kehrwerts." },
      { id:22, level:4, typ:"numerisch", frage:"Wie groß ist die Steigung der Normalen an \\(f(x) = x^3 - 3x^2\\) an der Stelle \\(x_0 = 1\\)? (4 Dezimalen)", loesung:0.3333, toleranz:0.005, tipp:"Bestimme die Tangentensteigung und bilde daraus den negativen Kehrwert.", loesungsweg:"Ableitung und Steigung im Punkt: $$f'(x) = 3x^2 - 6x \\;\\Rightarrow\\; f'(1) = 3 - 6 = -3$$ Die Normale steht senkrecht dazu: $$m_n = -\\frac{1}{-3} = \\frac13 \\approx 0{,}3333$$ Weil die Tangente fällt, steigt die Normale — die beiden Vorzeichen heben sich auf." },
      { id:23, level:4, typ:"numerisch", frage:"Ein Hangprofil wird durch \\(f(x) = -0{,}05x^2 + 2\\) beschrieben (alle Angaben in Metern). An der Stelle \\(x = 10\\) wird eine Stütze senkrecht zum Hang gesetzt. Welche Steigung hat sie?", loesung:1, toleranz:0, tipp:"Senkrecht zum Hang heißt senkrecht zur Tangente an dieser Stelle.", loesungsweg:"Die Hangneigung an der Stelle \\(10\\) ist $$f'(x) = -0{,}1x \\;\\Rightarrow\\; f'(10) = -1$$ Die Stütze verläuft senkrecht dazu, also entlang der Normalen: $$m_n = -\\frac{1}{-1} = 1$$ Der Hang fällt dort mit \\(45°\\), die Stütze steigt entsprechend mit \\(45°\\) an." },
      { id:24, level:4, typ:"numerisch", frage:"Die Tangenten an \\(f(x) = x^2\\) in den Punkten mit \\(x_0 = 1\\) und \\(x_0 = 3\\) schneiden sich. Berechne den \\(x\\)-Wert des Schnittpunkts.", loesung:2, toleranz:0, tipp:"Stelle beide Geradengleichungen auf und setze sie gleich.", loesungsweg:"Erste Tangente: \\(f(1)=1\\), \\(f'(1)=2\\), also $$t_1(x) = 1 + 2(x-1) = 2x-1$$ Zweite Tangente: \\(f(3)=9\\), \\(f'(3)=6\\), also $$t_2(x) = 9 + 6(x-3) = 6x-9$$ Gleichsetzen: $$2x-1 = 6x-9 \\;\\Rightarrow\\; 4x = 8 \\;\\Rightarrow\\; x = 2$$ Der Schnittpunkt liegt genau über der Mitte der beiden Berührstellen — bei der Normalparabel ist das immer so." },
      // LEVEL 5 -- Berührbedingung, Tangente durch einen Punkt, Parameter
      { id:25, level:5, typ:"numerisch", frage:"Vom Punkt \\(P(0\\,|\\,{-4})\\) aus gibt es zwei Tangenten an den Graphen von \\(f(x) = x^2\\). Gib die positive Berührstelle an.", loesung:2, toleranz:0, tipp:"Stelle die Tangente an einer allgemeinen Stelle \\(x_0\\) auf und fordere, dass sie durch \\(P\\) geht.", loesungsweg:"Tangente an der noch unbekannten Stelle \\(x_0\\): $$t(x) = x_0^2 + 2x_0(x - x_0)$$ Sie soll durch \\(P\\) gehen, also \\(t(0) = -4\\): $$x_0^2 - 2x_0^2 = -x_0^2 = -4$$ $$x_0^2 = 4 \\;\\Rightarrow\\; x_0 = \\pm 2$$ Es gibt also tatsächlich zwei Berührstellen, \\(-2\\) und \\(2\\); gefragt ist die positive. Der Punkt \\(P\\) liegt unterhalb der Parabel — nur von dort aus sind zwei Tangenten möglich." },
      { id:26, level:5, typ:"numerisch", frage:"Für welchen Wert von \\(a\\) berührt die Gerade \\(y = x + a\\) den Graphen von \\(f(x) = \\sqrt{x}\\)? (2 Dezimalen)", loesung:0.25, toleranz:0.005, tipp:"Berühren verlangt zwei Übereinstimmungen: in der Steigung und im Funktionswert.", loesungsweg:"Gleiche Steigung zuerst: $$f'(x) = \\frac{1}{2\\sqrt x} = 1 \\;\\Rightarrow\\; \\sqrt x = \\frac12 \\;\\Rightarrow\\; x = 0{,}25$$ An dieser Stelle müssen auch die Werte übereinstimmen: $$f(0{,}25) = 0{,}5 \\;\\stackrel{!}{=}\\; 0{,}25 + a \\;\\Rightarrow\\; a = 0{,}25$$ Die Wurzelfunktion wird nach rechts immer flacher; die Steigung \\(1\\) tritt deshalb nur an einer einzigen Stelle auf, und es gibt genau eine solche Berührgerade." },
      { id:27, level:5, typ:"mc", frage:"Welche Bedingungen müssen erfüllt sein, damit sich die Graphen von \\(f\\) und \\(g\\) an der Stelle \\(x_0\\) berühren?", optionen:["\\(f(x_0)=g(x_0)\\) und \\(f'(x_0)=g'(x_0)\\)","\\(f(x_0)=g(x_0)\\) und \\(f'(x_0)=-g'(x_0)\\)","\\(f'(x_0)=g'(x_0)\\) und \\(f''(x_0)=g''(x_0)\\)","\\(f(x_0)=g(x_0)\\) und \\(f'(x_0) \\cdot g'(x_0)=-1\\)"], korrekt:0, tipp:"Berühren bedeutet: gemeinsamer Punkt und gemeinsame Tangente.", loesungsweg:"Berühren heißt, dass die Graphen einen Punkt gemeinsam haben <b>und</b> dort dieselbe Tangente besitzen: $$f(x_0) = g(x_0) \\qquad\\text{und}\\qquad f'(x_0) = g'(x_0)$$ Die Bedingung mit dem Produkt \\(-1\\) beschreibt dagegen ein <b>senkrechtes</b> Schneiden, und übereinstimmende zweite Ableitungen sagen nichts über einen gemeinsamen Punkt aus." },
      { id:28, level:5, typ:"numerisch", frage:"Die Normale an \\(f(x) = x^2\\) im Punkt \\((1|1)\\) schneidet die Parabel ein zweites Mal. Gib den \\(x\\)-Wert an. (1 Dezimale)", loesung:-1.5, toleranz:0.01, tipp:"Stelle zuerst die Normale auf und setze sie anschließend mit der Funktion gleich.", loesungsweg:"Normalensteigung: \\(f'(1) = 2\\), also \\(m_n = -\\frac12\\), und damit $$n(x) = 1 - \\frac12(x-1) = -\\frac12 x + \\frac32$$ Gleichsetzen mit der Parabel: $$x^2 = -\\frac12 x + \\frac32 \\;\\Rightarrow\\; 2x^2 + x - 3 = 0$$ $$x = \\frac{-1 \\pm \\sqrt{1+24}}{4} = \\frac{-1 \\pm 5}{4}$$ Das ergibt \\(x = 1\\) (der bekannte Punkt) und \\(x = -1{,}5\\) — der gesuchte zweite Schnittpunkt. Anders als eine Tangente durchsetzt die Normale den Graphen." },
      { id:29, level:5, typ:"numerisch", frage:"An zwei Stellen verläuft die Tangente an \\(f(x) = x^3 - 3x\\) parallel zur Geraden \\(y = 9x + 1\\). Gib die negative Stelle an.", loesung:-2, toleranz:0, tipp:"Parallele Geraden haben dieselbe Steigung — daraus entsteht eine Gleichung für die Stelle.", loesungsweg:"Parallel heißt gleiche Steigung, also \\(f'(x) = 9\\): $$3x^2 - 3 = 9 \\;\\Rightarrow\\; 3x^2 = 12 \\;\\Rightarrow\\; x^2 = 4$$ $$x = 2 \\quad\\text{oder}\\quad x = -2$$ Beide Stellen erfüllen die Bedingung; gefragt ist die negative, also \\(x = -2\\). Wegen der Punktsymmetrie von \\(x^3-3x\\) treten solche Steigungen stets paarweise auf." },
      { id:30, level:5, typ:"numerisch", frage:"Für welchen Wert von \\(c\\) verläuft die Tangente an \\(f(x) = x^2 + c\\) an der Stelle \\(x_0 = 2\\) durch den Ursprung?", loesung:4, toleranz:0, tipp:"Stelle die Tangente mit dem Buchstaben auf und fordere den Wert null an der Stelle null.", loesungsweg:"Berührpunkt und Steigung: \\(f(2) = 4 + c\\) und \\(f'(2) = 4\\). Damit $$t(x) = (4+c) + 4(x-2)$$ Durch den Ursprung heißt \\(t(0) = 0\\): $$4 + c - 8 = 0 \\;\\Rightarrow\\; c = 4$$ Probe: \\(f(x) = x^2+4\\) hat in \\((2|8)\\) die Tangente \\(t(x) = 4x\\), und die geht durch \\((0|0)\\) ✓" },
      // LEVEL 6 -- Abi-Format: mehrschrittig mit Begründungsanteil
      { id:31, level:6, typ:"numerisch", frage:"Ein Tunnelquerschnitt wird für \\(-4 \\le x \\le 4\\) durch \\(f(x) = 6 - 0{,}25x^2\\) beschrieben (in Metern). An der Stelle \\(x = 2\\) wird ein gerader Balken längs der Tangente angebracht. In welcher Höhe trifft dieser Balken die Tunnelachse \\(x = 0\\)?", loesung:7, toleranz:0, tipp:"Stellen Sie die Tangente im angegebenen Punkt auf und werten Sie sie auf der Achse aus.", loesungsweg:"Berührpunkt und Steigung: $$f(2) = 6 - 1 = 5, \\qquad f'(x) = -0{,}5x \\;\\Rightarrow\\; f'(2) = -1$$ Tangente: $$t(x) = 5 - (x - 2) = -x + 7$$ Auf der Tunnelachse ist \\(x = 0\\), also $$t(0) = 7\\;\\text{m}$$ Der Balken liegt dort einen Meter über dem Scheitel des Querschnitts (\\(f(0) = 6\\)) — er berührt das Profil nur bei \\(x = 2\\) und verläuft sonst außerhalb." },
      { id:32, level:6, typ:"numerisch", frage:"Zeigen Sie, dass die Tangente an \\(f(x) = x^3\\) an jeder Stelle \\(x_0 \\neq 0\\) den Graphen ein zweites Mal schneidet, und geben Sie diese zweite Stelle für \\(x_0 = 3\\) an.", loesung:-6, toleranz:0, tipp:"Setzen Sie Tangente und Funktion gleich; die Berührstelle ist eine doppelte Lösung.", loesungsweg:"Tangente an der Stelle \\(3\\): \\(f(3) = 27\\), \\(f'(3) = 27\\), also $$t(x) = 27 + 27(x-3) = 27x - 54$$ Gleichsetzen: $$x^3 = 27x - 54 \\;\\Rightarrow\\; x^3 - 27x + 54 = 0$$ Die Berührstelle \\(x = 3\\) ist eine <b>doppelte</b> Nullstelle, deshalb lässt sich der Term als $$(x-3)^2(x+6) = 0$$ schreiben. Die dritte Lösung ist $$x = -6$$ Allgemein zerfällt die Gleichung in \\((x-x_0)^2(x+2x_0) = 0\\); für \\(x_0 \\neq 0\\) ist \\(-2x_0\\) stets eine weitere Stelle. Nur im Wendepunkt \\(x_0 = 0\\) fallen alle drei Lösungen zusammen." },
      { id:33, level:6, typ:"mc", frage:"Beurteilen Sie: <b>Eine Tangente kann den Graphen niemals schneiden, sie berührt ihn nur.</b>", optionen:["Falsch: eine Wendetangente durchsetzt den Graphen im Berührpunkt","Richtig: Berühren und Schneiden schließen einander stets aus","Falsch: jede Tangente schneidet den Graphen an mindestens zwei Stellen","Richtig, sofern die Funktion überall differenzierbar ist"], korrekt:0, tipp:"Denken Sie an den Graphen von \\(x^3\\) im Ursprung.", loesungsweg:"Berühren und Schneiden schließen einander nicht aus. Die Tangente an \\(f(x) = x^3\\) im Ursprung ist die \\(x\\)-Achse: Sie berührt den Graphen dort und wechselt zugleich von der einen auf die andere Seite — der Graph liegt links unterhalb, rechts oberhalb. Solche Tangenten heißen <b>Wendetangenten</b>. Dass <b>jede</b> Tangente den Graphen zusätzlich schneidet, stimmt allerdings auch nicht: die Tangente im Scheitel einer Parabel tut es nicht." },
      { id:34, level:6, typ:"numerisch", frage:"An welcher Stelle \\(x_0 > 0\\) schließt die Tangente an \\(f(x) = x^2\\) mit der \\(x\\)-Achse einen Winkel von \\(60°\\) ein? (3 Dezimalen)", loesung:0.866, toleranz:0.005, tipp:"Bestimmen Sie zuerst die Steigung, die zu diesem Winkel gehört, und dann die Stelle dazu.", loesungsweg:"Aus dem Winkel wird über \\(m = \\tan\\alpha\\) die Steigung: $$m = \\tan 60° = \\sqrt3 \\approx 1{,}7321$$ Diese Steigung muss die Ableitung liefern: $$f'(x) = 2x = \\sqrt3 \\;\\Rightarrow\\; x = \\frac{\\sqrt3}{2} \\approx 0{,}866$$ Die Bedingung \\(x_0 > 0\\) schließt die symmetrische Stelle \\(-0{,}866\\) aus, an der die Tangente mit \\(-60°\\) fällt. Gegenüber der Vorwärtsaufgabe sind hier beide Schritte umgekehrt zu durchlaufen." },
      { id:35, level:6, typ:"numerisch", frage:"Die Normale an \\(f(x) = x^2\\) an einer Stelle \\(x_0 > 0\\) verläuft durch den Punkt \\((0|3)\\). Bestimmen Sie \\(x_0\\). (3 Dezimalen)", loesung:1.581, toleranz:0.005, tipp:"Stellen Sie die Normale an einer allgemeinen Stelle auf und setzen Sie die Bedingung für den Punkt ein.", loesungsweg:"Normalensteigung an der Stelle \\(x_0\\): \\(m_n = -\\frac{1}{2x_0}\\), also $$n(x) = x_0^2 - \\frac{1}{2x_0}(x - x_0)$$ Bedingung \\(n(0) = 3\\): $$x_0^2 + \\frac12 = 3 \\;\\Rightarrow\\; x_0^2 = 2{,}5 \\;\\Rightarrow\\; x_0 = \\sqrt{2{,}5} \\approx 1{,}581$$ Bemerkenswert ist, dass sich \\(x_0\\) herauskürzt und nur der feste Summand \\(\\frac12\\) bleibt: jede Normale der Normalparabel trifft die \\(y\\)-Achse genau \\(0{,}5\\) über dem Berührpunkt. Die negative Lösung scheidet wegen \\(x_0 > 0\\) aus." },
      { id:36, level:6, typ:"mc", frage:"Beurteilen Sie: <b>An einer Stelle mit waagerechter Tangente ist die Normale eine senkrechte Gerade.</b>", optionen:["Richtig: zu \\(m_t = 0\\) gibt es keinen negativen Kehrwert","Falsch: die Normale verläuft dann ebenfalls waagerecht","Falsch: die Normale hat dann die Steigung \\(-1\\)","Richtig, aber nur in Extrempunkten, nicht in Sattelpunkten"], korrekt:0, tipp:"Zeichnen Sie sich die Lage von Tangente und Normale im Scheitel einer Parabel auf.", loesungsweg:"Die Normalensteigung ist \\(m_n = -\\frac{1}{m_t}\\). Für \\(m_t = 0\\) ist dieser Bruch nicht definiert — es gibt also keine Steigung, und genau das kennzeichnet eine <b>senkrechte</b> Gerade der Form \\(x = x_0\\). Anschaulich: steht die Tangente waagerecht, so steht die dazu senkrechte Gerade lotrecht. Ob an der Stelle ein Extrem- oder ein Sattelpunkt liegt, spielt dabei keine Rolle." }];
