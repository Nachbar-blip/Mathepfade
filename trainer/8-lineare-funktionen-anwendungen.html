<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineare Funktionen - Anwendungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-lineare-funktionen-anwendungen';
    const THEMA_CONFIG = { name: 'Lineare Funktionen - Anwendungen', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Ein Taxi kostet 3 € Grundgebühr + 2 €/km. Welche Funktion beschreibt die Kosten?", optionen: ["\\(K(x) = 2x\\)", "\\(K(x) = 3x + 2\\)", "\\(K(x) = 2x + 3\\)", "\\(K(x) = 5x\\)"], korrekt: 2, tipp: "Fix + variabel.", loesungsweg: "Grundgebühr: \\(n = 3\\). Pro km: \\(m = 2\\). \\(K(x) = 2x + 3\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Ein Handytarif: 10 € Grundgebühr + 0,05 € pro Minute. Funktion?", optionen: ["\\(K(x) = 10x + 0{,}05\\)", "\\(K(x) = 0{,}05x + 10\\)", "\\(K(x) = 10{,}05x\\)", "\\(K(x) = 0{,}5x + 10\\)"], korrekt: 1, tipp: "Grundgebühr = \\(n\\).", loesungsweg: "Die Grundgebühr fällt einmal an — sie ist der \\(y\\)-Achsenabschnitt \\(n\\); der Minutenpreis ist der Anstieg \\(m\\): $$K(x) = 0{,}05x + 10$$ Probe für \\(100\\) Minuten: \\(5 + 10 = 15\\,€\\) ✓ Bei \\(10x + 0{,}05\\) wären die Rollen vertauscht — dann kostete jede Minute \\(10\\,€\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Auto fährt gleichmäßig 60 km/h los bei \\(s = 20\\) km. Wegfunktion?", optionen: ["\\(s(t) = 60t\\)", "\\(s(t) = 20t + 60\\)", "\\(s(t) = 60t + 20\\)", "\\(s(t) = 80t\\)"], korrekt: 2, tipp: "Anfangsweg + Geschwindigkeit·Zeit.", loesungsweg: "Der Anfangsweg ist der \\(y\\)-Achsenabschnitt, die Geschwindigkeit der Anstieg: $$s(t) = 60t + 20$$ Probe für \\(t = 0\\): \\(s = 20\\,\\text{km}\\) ✓ und nach \\(2\\) Stunden \\(140\\,\\text{km}\\). Die Einheiten passen zusammen: \\(\\tfrac{\\text{km}}{\\text{h}} \\cdot \\text{h} = \\text{km}\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "Taxi: 3 € + 2 €/km. Kosten für 5 km in €?", loesung: 13, toleranz: 0, tipp: "\\(2 \\cdot 5 + 3\\).", loesungsweg: "$$K(5) = 2 \\cdot 5 + 3 = 13\\,€$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Handytarif: 10 € + 0,05 €/min. Kosten bei 200 min in €?", loesung: 20, toleranz: 0, tipp: "\\(0{,}05 \\cdot 200 + 10\\).", loesungsweg: "$$K(200) = 0{,}05 \\cdot 200 + 10 = 10 + 10 = 20\\,€$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Auto mit \\(s(t) = 60t + 20\\) (km). Ort nach 2 h (km)?", loesung: 140, toleranz: 0, tipp: "Einsetzen.", loesungsweg: "$$s(2) = 120 + 20 = 140\\,\\text{km}$$" },
      // LEVEL 2
      { id: 7, level: 2, typ: "mc", frage: "Tank: 50 L, Verbrauch 5 L/h. Funktion für Restmenge?", optionen: ["\\(R(t) = 50t - 5\\)", "\\(R(t) = -5t + 50\\)", "\\(R(t) = 5t + 50\\)", "\\(R(t) = 50 + 5t\\)"], korrekt: 1, tipp: "Negativer Anstieg (Abnahme).", loesungsweg: "Abnahme → \\(m = -5\\), Anfang \\(n = 50\\). \\(R(t) = -5t + 50\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Fitness-Abo: 20 € Anmeldung + 15 €/Monat. Für 6 Monate?", optionen: ["90 €", "110 €", "120 €", "100 €"], korrekt: 1, tipp: "\\(15 \\cdot 6 + 20\\).", loesungsweg: "\\(K(6) = 15 \\cdot 6 + 20 = 90 + 20 = 110\\,€\\)." },
      { id: 9, level: 2, typ: "mc", frage: "Welcher Graph beschreibt \"je mehr Zeit, desto mehr Strecke\" (gleichmäßig)?", optionen: ["Gerade fallend", "Gerade steigend", "Parabel", "Waagerechte"], korrekt: 1, tipp: "Wachstum.", loesungsweg: "Gleichmäßige Zunahme = steigende Gerade (\\(m > 0\\))." },
      { id: 10, level: 2, typ: "numerisch", frage: "Tank \\(R(t) = -5t + 50\\). Nach wie vielen Stunden ist er leer?", loesung: 10, toleranz: 0, tipp: "\\(R = 0\\).", loesungsweg: "$$-5t + 50 = 0 \\implies t = 10$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Kerze \\(h(t) = -2t + 24\\) (cm, t in h). Höhe nach 5 h (cm)?", loesung: 14, toleranz: 0, tipp: "Einsetzen.", loesungsweg: "$$h(5) = -10 + 24 = 14\\,\\text{cm}$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Kerze \\(h(t) = -2t + 24\\). Wann aufgebraucht (h)?", loesung: 12, toleranz: 0, tipp: "\\(h = 0\\).", loesungsweg: "$$-2t + 24 = 0 \\implies t = 12$$" },
      // LEVEL 3
      { id: 13, level: 3, typ: "mc", frage: "Zwei Tarife: A = 2x + 5, B = 3x + 2. Für welches \\(x\\) kosten sie gleich?", optionen: ["\\(x = 1\\)", "\\(x = 3\\)", "\\(x = 5\\)", "\\(x = 7\\)"], korrekt: 1, tipp: "\\(A = B\\).", loesungsweg: "\\(2x + 5 = 3x + 2 \\Rightarrow x = 3\\)." },
      { id: 14, level: 3, typ: "mc", frage: "Ein Behälter enthält 100 L, füllt sich mit 8 L/min. Welche Füllung hat er nach 10 min?", optionen: ["80 L", "108 L", "180 L", "800 L"], korrekt: 2, tipp: "\\(F(t) = 8t + 100\\).", loesungsweg: "\\(F(10) = 80 + 100 = 180\\,L\\)." },
      { id: 15, level: 3, typ: "mc", frage: "Sparbuch: 200 € + 25 €/Monat. Nach wie vielen Monaten sind 500 € erreicht?", optionen: ["10", "12", "15", "20"], korrekt: 1, tipp: "\\(25t + 200 = 500\\).", loesungsweg: "\\(25t = 300 \\Rightarrow t = 12\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Tarif A: \\(20 + 0{,}10 \\cdot m\\). Tarif B: \\(0{,}30 \\cdot m\\). Schnittstelle (min)?", loesung: 100, toleranz: 0, tipp: "A = B.", loesungsweg: "$$20 + 0{,}1m = 0{,}3m \\implies 20 = 0{,}2m \\implies m = 100$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "\\(K_1(x) = 3x + 12\\), \\(K_2(x) = 5x\\). Schnittpunkt bei \\(x =\\) ?", loesung: 6, toleranz: 0, tipp: "\\(3x + 12 = 5x\\).", loesungsweg: "$$2x = 12 \\implies x = 6$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Auto A startet bei \\(s=0\\), 80 km/h. Auto B startet bei \\(s=40\\), 60 km/h. Nach wie vielen Stunden sind sie gleichauf?", loesung: 2, toleranz: 0, tipp: "\\(80t = 60t + 40\\).", loesungsweg: "$$80t = 60t + 40 \\implies 20t = 40 \\implies t = 2$$" },
      // LEVEL 4
      { id: 19, level: 4, typ: "mc", frage: "Eine Firma hat monatliche Fixkosten von \\(500\\,€\\); jedes Stück kostet zusätzlich \\(20\\,€\\). Wie hoch sind die Gesamtkosten bei \\(50\\) Stück?", optionen: ["\\(1000\\,€\\)", "\\(1500\\,€\\)", "\\(1200\\,€\\)", "\\(2500\\,€\\)"], korrekt: 1, tipp: "Fixkosten fallen einmal an, Stückkosten pro Stück.", loesungsweg: "Kostenfunktion aus dem Text: Fixkosten sind das absolute Glied, Stückkosten der Anstieg: $$K(x) = 20x + 500, \\qquad K(50) = 1000 + 500 = 1500\\,€$$ Ohne Fixkosten wären es nur \\(1000\\,€\\) — das ist der typische Fehler." },
      { id: 20, level: 4, typ: "mc", frage: "Verkaufspreis \\(E(x) = 50x\\), Kosten \\(K(x) = 20x + 600\\). Gewinnschwelle bei \\(x =\\) ?", optionen: ["10", "15", "20", "30"], korrekt: 2, tipp: "\\(E = K\\).", loesungsweg: "\\(50x = 20x + 600 \\Rightarrow 30x = 600 \\Rightarrow x = 20\\)." },
      { id: 21, level: 4, typ: "mc", frage: "Der Umfang eines Rechtecks hängt von einer Seitenlänge ab: \\(U(x) = 2x + 14\\). Für welches \\(x\\) beträgt der Umfang \\(30\\)?", optionen: ["\\(x = 8\\)", "\\(x = 10\\)", "\\(x = 14\\)", "\\(x = 16\\)"], korrekt: 0, tipp: "Der Funktionswert ist gegeben, gesucht ist die Stelle.", loesungsweg: "Umkehraufgabe: \\(U(x) = 30\\) nach \\(x\\) auflösen: $$2x + 14 = 30 \\;\\Rightarrow\\; 2x = 16 \\;\\Rightarrow\\; x = 8$$ Deutung: Die andere Seite ist \\(7\\) lang, denn \\(2 \\cdot 8 + 2 \\cdot 7 = 30\\) ✓" },
      { id: 22, level: 4, typ: "numerisch", frage: "In einem Pool sind \\(500\\,\\text{L}\\) Wasser; er wird mit \\(40\\,\\text{L}\\) pro Minute gefüllt. Nach wie vielen Minuten sind \\(1500\\,\\text{L}\\) erreicht?", loesung: 25, toleranz: 0, tipp: "Wie viele Liter fehlen noch, und wie viele kommen pro Minute dazu?", loesungsweg: "Modell: \\(V(t) = 40t + 500\\). Gesucht ist \\(t\\) mit \\(V(t) = 1500\\): $$40t + 500 = 1500 \\;\\Rightarrow\\; 40t = 1000 \\;\\Rightarrow\\; t = 25$$ Probe: \\(40 \\cdot 25 = 1000\\,\\text{L}\\) kommen dazu, \\(500 + 1000 = 1500\\) ✓" },
      { id: 23, level: 4, typ: "numerisch", frage: "Der Gewinn eines Standes beträgt \\(G(x) = 12x - 240\\) (in €, \\(x\\) = verkaufte Stücke). Ab welcher Stückzahl macht der Stand keinen Verlust mehr?", loesung: 20, toleranz: 0, tipp: "Kein Verlust heißt: Gewinn ist mindestens null.", loesungsweg: "Gewinnschwelle ist die Nullstelle: $$12x - 240 = 0 \\;\\Rightarrow\\; x = 20$$ Deutung: \\(240\\,€\\) feste Kosten müssen durch \\(12\\,€\\) Gewinn pro Stück gedeckt werden, \\(240 : 12 = 20\\). Ab dem 21. Stück wird tatsächlich Gewinn gemacht." },
      { id: 24, level: 4, typ: "numerisch", frage: "Ein Onlineshop berechnet \\(50\\,€\\) Versandpauschale und \\(25\\,€\\) pro Artikel. Wie viele Artikel kann man für genau \\(300\\,€\\) bestellen?", loesung: 10, toleranz: 0, tipp: "Die Pauschale zuerst abziehen.", loesungsweg: "Modell: \\(K(x) = 25x + 50\\). Umkehraufgabe: $$25x + 50 = 300 \\;\\Rightarrow\\; 25x = 250 \\;\\Rightarrow\\; x = 10$$ Probe: \\(10 \\cdot 25 + 50 = 300\\) ✓ Wer die Pauschale vergisst, rechnet \\(300 : 25 = 12\\) — zu viel." },
      // LEVEL 5
      { id: 25, level: 5, typ: "mc", frage: "Ein Wassertank enthält \\(800\\,\\text{L}\\) und wird mit \\(30\\,\\text{L}\\) pro Minute geleert. Paul stellt auf: \\(V(t) = 800 + 30t\\) und erhält nach \\(10\\) Minuten \\(1100\\,\\text{L}\\). Was ist dazu zu sagen?", optionen: ["Falsch — der Tank wird geleert, also \\(V(t) = 800 - 30t\\); nach \\(10\\) Minuten sind es \\(500\\,\\text{L}\\)", "Richtig", "Falsch — es gilt \\(V(t) = 30t - 800\\), nach \\(10\\) Minuten sind es \\(-500\\,\\text{L}\\)", "Falsch — es gilt \\(V(t) = 800 - 30t\\), nach \\(10\\) Minuten sind es \\(770\\,\\text{L}\\)"], korrekt: 0, tipp: "Kann in einem Tank, der geleert wird, mehr Wasser sein als am Anfang?", loesungsweg: "Abnahme bedeutet negativen Anstieg: $$V(t) = 800 - 30t, \\qquad V(10) = 800 - 300 = 500\\,\\text{L}$$ Pauls Funktion beschreibt einen Tank, der <b>gefüllt</b> wird. Die Variante \\(770\\,\\text{L}\\) zieht die \\(30\\,\\text{L}\\) nur einmal statt zehnmal ab." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Taxiunternehmen verlangt eine feste Grundgebühr und einen festen Preis pro Kilometer. Eine Fahrt über \\(4\\,\\text{km}\\) kostet \\(11\\,€\\), eine Fahrt über \\(10\\,\\text{km}\\) kostet \\(23\\,€\\). Wie hoch ist die Grundgebühr in €?", loesung: 3, toleranz: 0, tipp: "Was kosten die \\(6\\) zusätzlichen Kilometer?", loesungsweg: "Zwei Punkte des Graphen: \\((4|11)\\) und \\((10|23)\\). Kilometerpreis: $$m = \\frac{23 - 11}{10 - 4} = 2\\,€/\\text{km}$$ Grundgebühr: \\(11 = 2 \\cdot 4 + n \\Rightarrow n = 3\\,€\\). Probe: \\(2 \\cdot 10 + 3 = 23\\) ✓" },
      { id: 27, level: 5, typ: "numerisch", frage: "Eine Kerze ist zu Beginn \\(30\\,\\text{cm}\\) lang und brennt gleichmäßig ab. Nach \\(2\\) Stunden ist sie noch \\(25\\,\\text{cm}\\) lang. Nach wie vielen Stunden insgesamt ist sie nur noch \\(12{,}5\\,\\text{cm}\\) lang?", loesung: 7, toleranz: 0, tipp: "Zuerst herausfinden, wie viel Zentimeter pro Stunde abbrennen.", loesungsweg: "Abbrandrate: \\(5\\,\\text{cm}\\) in \\(2\\) Stunden, also \\(2{,}5\\,\\text{cm/h}\\): $$h(t) = 30 - 2{,}5t$$ $$30 - 2{,}5t = 12{,}5 \\;\\Rightarrow\\; 2{,}5t = 17{,}5 \\;\\Rightarrow\\; t = 7$$ Probe: \\(30 - 17{,}5 = 12{,}5\\) ✓" },
      { id: 28, level: 5, typ: "mc", frage: "Handytarif: \\(8\\,€\\) Grundgebühr und \\(0{,}10\\,€\\) pro Minute. Mia rechnet für \\(150\\) Minuten: \\(8 \\cdot 150 + 0{,}10 = 1200{,}10\\,€\\). Was ist dazu zu sagen?", optionen: ["Falsch — die Grundgebühr zählt einmal, der Minutenpreis mal Minuten: \\(0{,}10 \\cdot 150 + 8 = 23\\,€\\)", "Richtig", "Falsch — \\(0{,}10 \\cdot 150 = 15\\,€\\), die Grundgebühr zählt nicht mit", "Falsch — \\((8 + 0{,}10) \\cdot 150 = 1215\\,€\\)"], korrekt: 0, tipp: "Welche Größe hängt von den Minuten ab, welche nicht?", loesungsweg: "Der Anstieg ist der Preis <b>pro Minute</b>, das absolute Glied die einmalige Grundgebühr: $$K(x) = 0{,}10x + 8, \\qquad K(150) = 15 + 8 = 23\\,€$$ Mia hat die Rollen von \\(m\\) und \\(n\\) vertauscht. Plausibilitätsprobe: \\(1200\\,€\\) für \\(150\\) Minuten kann nicht stimmen." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Schwimmbecken wird gleichmäßig gefüllt. Um 9:00 Uhr enthält es \\(2000\\,\\text{L}\\), um 9:45 Uhr \\(3350\\,\\text{L}\\). Wie viele Liter waren um 8:00 Uhr im Becken?", loesung: 200, toleranz: 0, tipp: "Erst die Zuflussrate pro Minute, dann eine Stunde zurückrechnen.", loesungsweg: "Zufluss: \\(1350\\,\\text{L}\\) in \\(45\\) Minuten, also $$\\frac{1350}{45} = 30\\,\\text{L/min}$$ Von 8:00 bis 9:00 Uhr sind \\(60\\) Minuten, also \\(60 \\cdot 30 = 1800\\,\\text{L}\\) zugeflossen: \\(2000 - 1800 = 200\\,\\text{L}\\). Probe: \\(200 + 105 \\cdot 30 = 3350\\) ✓" },
      { id: 30, level: 5, typ: "numerisch", frage: "Ein Radfahrer ist um 14:00 Uhr \\(5\\,\\text{km}\\) vom Bahnhof entfernt und fährt gleichmäßig vom Bahnhof weg. Um 14:20 Uhr ist er \\(13\\,\\text{km}\\) entfernt. Wie weit (in km) ist er um 15:00 Uhr vom Bahnhof entfernt?", loesung: 29, toleranz: 0, tipp: "Wie viele Kilometer schafft er in \\(20\\) Minuten, wie viele in \\(60\\)?", loesungsweg: "In \\(20\\) Minuten legt er \\(8\\,\\text{km}\\) zurück, also \\(0{,}4\\,\\text{km/min}\\): $$s(t) = 5 + 0{,}4t$$ Um 15:00 Uhr ist \\(t = 60\\): \\(s(60) = 5 + 24 = 29\\,\\text{km}\\). Kontrolle: \\(60\\) Minuten sind dreimal \\(20\\) Minuten, also \\(5 + 3 \\cdot 8 = 29\\) ✓" },
      // LEVEL 6
      { id: 31, level: 6, typ: "mc", frage: "Tarif A: \\(12\\,€\\) Grundgebühr und \\(0{,}20\\,€\\) pro Minute. Tarif B: keine Grundgebühr, \\(0{,}50\\,€\\) pro Minute. Behauptung: „Wer weniger als \\(40\\) Minuten im Monat telefoniert, fährt mit B besser.“", optionen: ["Richtig — bei \\(40\\) Minuten kosten beide \\(20\\,€\\); darunter ist B billiger, darüber A", "Falsch — A ist immer günstiger, weil der Minutenpreis niedriger ist", "Falsch — die Grenze liegt bei \\(24\\) Minuten", "Falsch — B ist bis \\(60\\) Minuten günstiger"], korrekt: 0, tipp: "Wo kosten beide Tarife gleich viel?", loesungsweg: "Gleichsetzen: $$12 + 0{,}2x = 0{,}5x \\;\\Rightarrow\\; 12 = 0{,}3x \\;\\Rightarrow\\; x = 40$$ Fallunterscheidung: Für \\(x < 40\\) ist \\(0{,}5x < 12 + 0{,}2x\\) (z. B. \\(x = 20\\): \\(10\\,€\\) gegen \\(16\\,€\\)), B ist günstiger. Für \\(x > 40\\) gewinnt A. Die Behauptung stimmt." },
      { id: 32, level: 6, typ: "mc", frage: "Stromanbieter A: \\(25\\,€\\) Grundgebühr im Jahr und \\(0{,}15\\,€\\) pro kWh. Anbieter B: \\(40\\,€\\) Grundgebühr und \\(0{,}15\\,€\\) pro kWh. Bei welchem Verbrauch kosten beide gleich viel?", optionen: ["Bei keinem — gleicher Preis pro kWh, die Graphen sind parallel; B ist immer \\(15\\,€\\) teurer", "Bei \\(100\\,\\text{kWh}\\)", "Bei \\(0\\,\\text{kWh}\\)", "Bei \\(15\\,\\text{kWh}\\)"], korrekt: 0, tipp: "Vergleiche die Anstiege der beiden Kostenfunktionen.", loesungsweg: "Gleichsetzen: $$25 + 0{,}15x = 40 + 0{,}15x \\;\\Rightarrow\\; 25 = 40$$ Das ist falsch, egal welches \\(x\\) man wählt — es gibt keinen Schnittpunkt. Gleicher Anstieg und verschiedene absolute Glieder: parallele Geraden, der Abstand von \\(15\\,€\\) bleibt bei jedem Verbrauch." },
      { id: 33, level: 6, typ: "numerisch", frage: "Ein Bus fährt mit gleichbleibender Geschwindigkeit. \\(10\\) Minuten nach der Abfahrt sind noch \\(40\\,\\text{km}\\) bis zum Ziel, nach \\(25\\) Minuten noch \\(22\\,\\text{km}\\). Wie lang ist die gesamte Strecke in km?", loesung: 52, toleranz: 0, tipp: "Gesucht ist die Reststrecke zum Zeitpunkt \\(0\\).", loesungsweg: "Zwei Punkte: \\((10|40)\\) und \\((25|22)\\). In \\(15\\) Minuten schrumpft die Reststrecke um \\(18\\,\\text{km}\\): $$m = \\frac{22 - 40}{25 - 10} = -1{,}2\\,\\text{km/min}$$ Reststrecke \\(r(t) = -1{,}2t + n\\); mit \\((10|40)\\): \\(40 = -12 + n\\), \\(n = 52\\). Die Gesamtstrecke ist \\(r(0) = 52\\,\\text{km}\\). Probe: \\(52 - 1{,}2 \\cdot 25 = 22\\) ✓" },
      { id: 34, level: 6, typ: "numerisch", frage: "Ein Wanderer startet um 8:00 Uhr mit \\(4\\,\\text{km/h}\\). Um 9:30 Uhr folgt ihm ein Radfahrer auf demselben Weg mit \\(16\\,\\text{km/h}\\). Wie viele Kilometer vom Start entfernt holt der Radfahrer den Wanderer ein?", loesung: 8, toleranz: 0, tipp: "Wie weit ist der Wanderer um 9:30 Uhr schon gekommen?", loesungsweg: "Um 9:30 Uhr hat der Wanderer \\(1{,}5 \\cdot 4 = 6\\,\\text{km}\\) Vorsprung. Mit \\(t\\) in Stunden ab 9:30 Uhr: $$6 + 4t = 16t \\;\\Rightarrow\\; 6 = 12t \\;\\Rightarrow\\; t = 0{,}5$$ Der Radfahrer fährt \\(16 \\cdot 0{,}5 = 8\\,\\text{km}\\). Probe: Wanderer \\(6 + 4 \\cdot 0{,}5 = 8\\,\\text{km}\\) ✓" },
      { id: 35, level: 6, typ: "numerisch", frage: "Kerze A ist \\(24\\,\\text{cm}\\) lang und wird pro Stunde \\(3\\,\\text{cm}\\) kürzer. Kerze B ist \\(18\\,\\text{cm}\\) lang und wird pro Stunde \\(1{,}5\\,\\text{cm}\\) kürzer. Beide werden gleichzeitig angezündet. Nach wie vielen Stunden sind sie gleich lang?", loesung: 4, toleranz: 0, tipp: "A hat \\(6\\,\\text{cm}\\) Vorsprung, verliert aber pro Stunde \\(1{,}5\\,\\text{cm}\\) mehr.", loesungsweg: "Gleichsetzen: $$24 - 3t = 18 - 1{,}5t \\;\\Rightarrow\\; 6 = 1{,}5t \\;\\Rightarrow\\; t = 4$$ Beide sind dann \\(12\\,\\text{cm}\\) lang. Danach ist A die kürzere Kerze — bis zu diesem Zeitpunkt war sie die längere. Die Geraden sind nicht parallel, weil die Abbrandraten verschieden sind." },
      { id: 36, level: 6, typ: "mc", frage: "Ein Handwerker verlangt \\(40\\,€\\) Anfahrt und \\(35\\,€\\) pro Arbeitsstunde. Behauptung: „Für die doppelte Arbeitszeit zahlt man das Doppelte.“", optionen: ["Falsch — die Anfahrt verdoppelt sich nicht: \\(2\\,\\text{h}\\) kosten \\(110\\,€\\), \\(4\\,\\text{h}\\) kosten \\(180\\,€\\)", "Richtig — die Kosten sind linear", "Richtig, aber nur bei ganzen Stunden", "Falsch — man zahlt mehr als das Doppelte: \\(4\\,\\text{h}\\) kosten \\(220\\,€\\)"], korrekt: 0, tipp: "Rechne ein Beispiel mit \\(2\\) und \\(4\\) Stunden.", loesungsweg: "Kosten: \\(K(t) = 35t + 40\\). $$K(2) = 110\\,€, \\qquad K(4) = 180\\,€ \\neq 220\\,€$$ Linear heißt nicht proportional: „Doppelte Zeit, doppelter Preis“ gilt nur, wenn der Graph durch den Ursprung geht, also ohne Anfahrtspauschale." }];
    </script>

</body>
