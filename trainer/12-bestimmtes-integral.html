<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-bestimmtes-integral';
    const THEMA_CONFIG = { name: 'Bestimmtes Integral', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Was bedeutet \\(\\int_a^b f(x)\\,dx\\)?", optionen: ["Ableitung an der Stelle \\(b\\)", "Bestimmtes Integral von \\(a\\) bis \\(b\\)", "Summe aller Funktionswerte", "Differenz \\(f(b) - f(a)\\)"], korrekt: 1, tipp: "Mit Integrationsgrenzen.", loesungsweg: "Das <b>bestimmte Integral</b> hat feste Grenzen und liefert eine Zahl — anschaulich die orientierte Fläche zwischen Graph und \\(x\\)-Achse. Berechnet wird es über eine Stammfunktion: $$\\int_a^b f(x)\\,dx = F(b) - F(a)$$ Das ist der Hauptsatz der Differential- und Integralrechnung. Die Differenz \\(f(b)-f(a)\\) wäre dagegen etwas ganz anderes — dort steht \\(f\\) statt \\(F\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Hauptsatz: \\(\\int_a^b f(x)dx = \\)", optionen: ["\\(F(b) - F(a)\\)", "\\(f(b) - f(a)\\)", "\\(F(a) - F(b)\\)", "\\(F(b) + F(a)\\)"], korrekt: 0, tipp: "Obere Grenze minus untere Grenze.", loesungsweg: "Hauptsatz der Differential- und Integralrechnung: \\(\\int_a^b f(x)dx = F(b)-F(a)\\)." },
      { id: 3, level: 1, typ: "numerisch", frage: "Berechne \\(\\int_0^1 1\\,dx\\).", loesung: 1, toleranz: 0, tipp: "Welche Funktion hat die Ableitung \\(1\\)? Setze danach die beiden Grenzen ein.", loesungsweg: "$$\\int_0^1 1\\,dx = [x]_0^1 = 1 - 0 = 1$$" },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne \\(\\int_0^2 x\\,dx\\).", loesung: 2, toleranz: 0, tipp: "\\(F(x) = \\frac{x^2}{2}\\).", loesungsweg: "$$\\int_0^2 x\\,dx = \\left[\\tfrac{x^2}{2}\\right]_0^2 = 2 - 0 = 2$$" },
      { id: 5, level: 1, typ: "mc", frage: "Was ist \\(\\int_a^a f(x)dx\\)?", optionen: ["\\(f(a)\\)", "\\(F(a)\\)", "\\(0\\)", "undefiniert"], korrekt: 2, tipp: "Gleiche Grenzen.", loesungsweg: "Bei gleichen Grenzen hebt sich die Differenz auf: $$\\int_a^a f(x)\\,dx = F(a) - F(a) = 0$$ Anschaulich: Ein Flächenstück ohne Breite hat den Inhalt null — gleichgültig, wie groß \\(f(a)\\) ist." },
      { id: 6, level: 1, typ: "mc", frage: "Wenn Grenzen vertauscht werden: \\(\\int_b^a f dx = \\)", optionen: ["\\(\\int_a^b f dx\\)", "\\(-\\int_a^b f dx\\)", "\\(0\\)", "\\(\\frac{1}{\\int_a^b f dx}\\)"], korrekt: 1, tipp: "Vorzeichenwechsel.", loesungsweg: "Beim Vertauschen der Grenzen kehrt sich die Reihenfolge in der Differenz um: $$\\int_b^a f\\,dx = F(a)-F(b) = -\\left(F(b)-F(a)\\right) = -\\int_a^b f\\,dx$$ Das Integral wechselt also das Vorzeichen. Deshalb ist auf die Reihenfolge der Grenzen stets zu achten." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne das bestimmte Integral \\(\\int_0^2 2x\\,dx\\) mit dem Hauptsatz.", loesung: 4, toleranz: 0, tipp: "\\(F(x) = x^2\\).", loesungsweg: "$$[x^2]_0^2 = 4 - 0 = 4$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Bestimme eine Stammfunktion von \\(f(x)=x^2\\) und berechne damit \\(\\int_1^3 x^2\\,dx\\) (als Bruch oder als Dezimalzahl).", loesung: 8.667, toleranz: 0.01, tipp: "Potenzregel: Exponent um eins erhöhen und durch den neuen Exponenten teilen; danach obere minus untere Grenze.", loesungsweg: "$$\\left[\\tfrac{x^3}{3}\\right]_1^3 = \\tfrac{27}{3} - \\tfrac{1}{3} = \\tfrac{26}{3} \\approx 8{,}67$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne \\(\\int_0^3 (2x + 1)\\,dx\\). Integriere dazu summandenweise.", loesung: 12, toleranz: 0, tipp: "\\(F(x) = x^2 + x\\).", loesungsweg: "$$[x^2 + x]_0^3 = 9 + 3 - 0 = 12$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Berechne \\(\\int_{-1}^{1} x^2\\,dx\\) und achte beim Einsetzen der unteren Grenze auf das Vorzeichen (Ergebnis als Dezimalzahl).", loesung: 0.667, toleranz: 0.01, tipp: "Beim Einsetzen der negativen unteren Grenze wird eine ungerade Potenz negativ; achte auf das Minus vor der Klammer.", loesungsweg: "$$\\left[\\tfrac{x^3}{3}\\right]_{-1}^{1} = \\tfrac{1}{3} + \\tfrac{1}{3} = \\tfrac{2}{3}$$" },
      { id: 11, level: 2, typ: "mc", frage: "Welchen Wert hat das bestimmte Integral \\(\\int_0^1 4x^3\\,dx\\)?", optionen: ["\\(1\\)", "\\(4\\)", "\\(\\frac{1}{4}\\)", "\\(12\\)"], korrekt: 0, tipp: "\\(F(x) = x^4\\).", loesungsweg: "$$[x^4]_0^1 = 1 - 0 = 1$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(\\int_0^2 3\\,dx\\) und deute das Ergebnis als Flächeninhalt eines Rechtecks.", loesung: 6, toleranz: 0, tipp: "Konstante: \\(3 \\cdot (2-0)\\).", loesungsweg: "$$\\int_0^2 3\\,dx = 3 \\cdot 2 = 6$$" },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "Berechne \\(\\int_0^2 (3x^2 - 2x)\\,dx\\). Bilde zuerst eine Stammfunktion des gesamten Terms.", loesung: 4, toleranz: 0, tipp: "\\(F(x) = x^3 - x^2\\).", loesungsweg: "$$[x^3 - x^2]_0^2 = 8 - 4 = 4$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Berechne \\(\\int_1^2 (x^2 + 1)\\,dx\\) und gib das Ergebnis als Dezimalzahl an.", loesung: 3.333, toleranz: 0.01, tipp: "\\(F(x) = \\frac{x^3}{3} + x\\).", loesungsweg: "$$\\left[\\tfrac{x^3}{3} + x\\right]_1^2 = (\\tfrac{8}{3}+2)-(\\tfrac{1}{3}+1) = \\tfrac{7}{3}+1 = \\tfrac{10}{3} \\approx 3{,}33$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Berechne \\(\\int_{-2}^{2} x^3\\,dx\\) und erkläre das Ergebnis mit der Lage des Graphen zur \\(x\\)-Achse.", loesung: 0, toleranz: 0, tipp: "Rechne das Integral zunächst gewöhnlich aus und vergleiche das Ergebnis danach mit der Lage des Graphen links und rechts des Ursprungs.", loesungsweg: "$$\\int_{-2}^{2} x^3\\,dx = \\left[\\frac{x^4}{4}\\right]_{-2}^{2} = \\frac{16}{4} - \\frac{16}{4} = 4 - 4 = 0$$ <b>Deutung:</b> \\(f(x)=x^3\\) ist punktsymmetrisch zum Ursprung. Links der Null verläuft der Graph unterhalb der \\(x\\)-Achse und liefert einen negativen Beitrag, rechts davon oberhalb und liefert den betragsgleichen positiven Beitrag. Im Integral heben sich beide auf. Der <b>Flächeninhalt</b> ist deshalb keineswegs null — er beträgt \\(2 \\cdot 4 = 8\\); das Integral misst den orientierten Inhalt." },
      { id: 16, level: 3, typ: "mc", frage: "Welchen Wert hat \\(\\int_0^{\\pi} \\sin x\\,dx\\)? Verwende eine Stammfunktion des Sinus.", optionen: ["\\(0\\)", "\\(1\\)", "\\(2\\)", "\\(\\pi\\)"], korrekt: 2, tipp: "Die Stammfunktion des Sinus trägt ein Minuszeichen; die Kosinuswerte an den beiden Grenzen sind aus dem Einheitskreis bekannt.", loesungsweg: "$$[-\\cos x]_0^\\pi = -(-1) - (-1) = 2$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Berechne \\(\\int_0^1 e^x\\,dx\\) als Dezimalzahl mit drei Nachkommastellen.", loesung: 1.718, toleranz: 0.01, tipp: "Die e-Funktion ist ihre eigene Stammfunktion; achte beim Einsetzen der unteren Grenze darauf, dass \\(e^0\\) nicht null ist.", loesungsweg: "Die e-Funktion ist ihre eigene Stammfunktion: $$\\int_0^1 e^x dx = \\left[e^x\\right]_0^1 = e - 1 \\approx 1{,}718$$ Denn \\(e^0 = 1\\) — der untere Wert ist nicht null." },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\(\\int_1^{e} \\frac{1}{x}\\,dx\\). Nutze die Stammfunktion des Kehrwerts.", loesung: 1, toleranz: 0.01, tipp: "\\(\\ln e - \\ln 1\\).", loesungsweg: "$$[\\ln x]_1^e = \\ln e - \\ln 1 = 1 - 0 = 1$$" },
      // LEVEL 4 -- Hauptsatz anwenden, Modell aus Text, Umkehraufgabe
      { id: 19, level: 4, typ: "numerisch", frage: "Von einer Funktion \\(f\\) ist nur bekannt, dass \\(F(x) = x^3 - 2x\\) eine Stammfunktion von \\(f\\) ist. Berechne \\(\\int_1^3 f(x)\\,dx\\).", loesung: 22, toleranz: 0.01, tipp: "Der Hauptsatz braucht nur die Stammfunktion an den beiden Grenzen, nicht den Term von \\(f\\).", loesungsweg: "Der Hauptsatz verlangt keine Kenntnis von \\(f\\) selbst: $$\\int_1^3 f(x)\\,dx = F(3) - F(1)$$ Mit \\(F(3) = 27 - 6 = 21\\) und \\(F(1) = 1 - 2 = -1\\) folgt $$21 - (-1) = 22$$ Das Minuszeichen vor \\(F(1)\\) und das negative \\(F(1)\\) ergeben zusammen ein Plus — hier verrechnet man sich leicht." },
      { id: 20, level: 4, typ: "numerisch", frage: "In einen Tank fließt Wasser mit der Zuflussrate \\(z(t) = 0{,}5t + 2\\), gemessen in Litern pro Minute. Wie viele Liter fließen in den ersten 8 Minuten zu?", loesung: 32, toleranz: 0.1, tipp: "Eine Rate aufsummieren heißt integrieren; die Grenzen sind die beiden Zeitpunkte.", loesungsweg: "Die zugeflossene Menge ist das Integral der Rate über die Zeit: $$\\int_0^8 (0{,}5t + 2)\\,dt = \\left[0{,}25t^2 + 2t\\right]_0^8$$ $$= 0{,}25 \\cdot 64 + 16 = 16 + 16 = 32$$ Es fließen also 32 Liter zu. Die Einheit folgt aus Rate mal Zeit: Liter pro Minute mal Minute." },
      { id: 21, level: 4, typ: "numerisch", frage: "Berechne \\(\\int_0^1 (3x+1)^3\\,dx\\). Gib das Ergebnis als Dezimalzahl an.", loesung: 21.25, toleranz: 0.02, tipp: "Bei einer linearen inneren Funktion lässt sich die Stammfunktion erraten — dann muss der Faktor der inneren Ableitung ausgeglichen werden.", loesungsweg: "Zur Potenz gehört die Stammfunktion \\(\\tfrac{(3x+1)^4}{4}\\); weil die innere Funktion die Ableitung \\(3\\) hat, muss noch durch \\(3\\) geteilt werden: $$F(x) = \\frac{(3x+1)^4}{12}$$ $$\\int_0^1 (3x+1)^3\\,dx = \\frac{4^4}{12} - \\frac{1^4}{12} = \\frac{256 - 1}{12} = \\frac{255}{12} = 21{,}25$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Für welche Zahl \\(b > 0\\) gilt \\(\\int_0^b (x^2 - 4)\\,dx = 0\\)? Gib \\(b\\) auf zwei Nachkommastellen an.", loesung: 3.46, toleranz: 0.02, tipp: "Stelle das Integral als Term in \\(b\\) auf und setze ihn gleich null; die Lösung \\(b = 0\\) ist ausgeschlossen.", loesungsweg: "Zuerst das Integral als Term in \\(b\\): $$\\int_0^b (x^2-4)\\,dx = \\left[\\tfrac{x^3}{3} - 4x\\right]_0^b = \\frac{b^3}{3} - 4b$$ Nullsetzen und \\(b\\) ausklammern: $$b\\left(\\frac{b^2}{3} - 4\\right) = 0$$ Wegen \\(b > 0\\) fällt \\(b = 0\\) weg, es bleibt \\(b^2 = 12\\), also $$b = 2\\sqrt{3} \\approx 3{,}46$$ Bis zu dieser Stelle heben sich der negative Anteil links von \\(x = 2\\) und der positive Anteil rechts davon genau auf." },
      { id: 23, level: 4, typ: "numerisch", frage: "Berechne \\(\\int_0^{\\pi/2} (\\cos x + \\sin x)\\,dx\\).", loesung: 2, toleranz: 0.01, tipp: "Beide Summanden einzeln integrieren und auf das Vorzeichen bei der Stammfunktion des Sinus achten.", loesungsweg: "Stammfunktion des Sinus ist \\(-\\cos x\\), die des Kosinus \\(\\sin x\\): $$\\left[\\sin x - \\cos x\\right]_0^{\\pi/2}$$ $$= (1 - 0) - (0 - 1) = 1 + 1 = 2$$ Das Minuszeichen der Stammfunktion des Sinus liefert den zweiten Beitrag — wer es vergisst, erhält null." },
      { id: 24, level: 4, typ: "numerisch", frage: "Die Grenzkosten einer Produktion betragen \\(K'(x) = 0{,}6x + 4\\) (in Euro je Stück). Um wie viele Euro steigen die Gesamtkosten, wenn die Produktion von 10 auf 20 Stück erhöht wird?", loesung: 130, toleranz: 0.5, tipp: "Die Grenzkosten sind die Ableitung der Kostenfunktion — gesucht ist also die Differenz der Kostenfunktion an den beiden Stellen.", loesungsweg: "Gesucht ist \\(K(20) - K(10)\\); nach dem Hauptsatz ist das das Integral der Grenzkosten: $$\\int_{10}^{20} (0{,}6x + 4)\\,dx = \\left[0{,}3x^2 + 4x\\right]_{10}^{20}$$ $$= (120 + 80) - (30 + 40) = 200 - 70 = 130$$ Die Kosten steigen um 130 Euro. Die Kostenfunktion selbst wird dafür nicht gebraucht — die Fixkosten kürzen sich heraus." },
      // LEVEL 5 -- zwei Bedingungen, Verfahren kombinieren, Fehler finden
      { id: 25, level: 5, typ: "mc", frage: "Vorgelegt wird die Rechnung: \\(\\int_{-2}^{0} x^2\\,dx = \\left[\\tfrac{x^3}{3}\\right]_{-2}^{0} = 0 - \\left(-\\tfrac{8}{3}\\right) = -\\tfrac{8}{3}\\). Wie ist diese Rechnung zu beurteilen?", optionen: ["Richtig, der Wert ist negativ.", "Falsch: die Differenz ergibt \\(+\\tfrac{8}{3}\\).", "Falsch: die Stammfunktion muss \\(3x^2\\) lauten.", "Falsch: die beiden Grenzen sind zu vertauschen."], korrekt: 1, tipp: "Rechne die angeschriebene Differenz Schritt für Schritt nach und vergleiche mit der Lage des Graphen zur \\(x\\)-Achse.", loesungsweg: "Stammfunktion und Ansatz sind richtig, der letzte Schritt ist es nicht: $$0 - \\left(-\\frac{8}{3}\\right) = 0 + \\frac{8}{3} = \\frac{8}{3}$$ Aus dem doppelten Minus wird ein Plus. Dass das Vorzeichen falsch sein muss, sieht man auch ohne Rechnung: \\(x^2\\) ist auf dem ganzen Intervall positiv, das Integral kann nicht negativ sein. Die Stammfunktion \\(\\tfrac{x^3}{3}\\) ist korrekt — \\(3x^2\\) wäre die Ableitung." },
      { id: 26, level: 5, typ: "numerisch", frage: "Eine Funktion hat die Form \\(f(x) = ax^2 + b\\). Bekannt ist \\(\\int_0^1 f(x)\\,dx = 2\\) und \\(f(1) = 3\\). Bestimme \\(a\\).", loesung: 1.5, toleranz: 0.01, tipp: "Jede der beiden Angaben liefert eine Gleichung in \\(a\\) und \\(b\\); löse das entstehende System.", loesungsweg: "Erste Bedingung: $$\\int_0^1 (ax^2+b)\\,dx = \\left[\\tfrac{a}{3}x^3 + bx\\right]_0^1 = \\frac{a}{3} + b = 2$$ Zweite Bedingung: \\(f(1) = a + b = 3\\). Subtraktion der ersten von der zweiten Gleichung: $$a - \\frac{a}{3} = 1 \\;\\Longrightarrow\\; \\frac{2a}{3} = 1 \\;\\Longrightarrow\\; a = 1{,}5$$ Damit ist \\(b = 1{,}5\\); beide Bedingungen sind erfüllt." },
      { id: 27, level: 5, typ: "numerisch", frage: "Berechne \\(\\int_0^4 |x - 3|\\,dx\\).", loesung: 5, toleranz: 0.01, tipp: "Der Betrag zerlegt das Intervall an der Stelle, an der das Innere das Vorzeichen wechselt; auf jedem Teil ist der Betrag ein gewöhnlicher linearer Term.", loesungsweg: "Das Innere wechselt bei \\(x = 3\\) das Vorzeichen. Links davon ist \\(|x-3| = 3-x\\), rechts davon \\(x-3\\): $$\\int_0^3 (3-x)\\,dx + \\int_3^4 (x-3)\\,dx$$ $$= \\left[3x - \\tfrac{x^2}{2}\\right]_0^3 + \\left[\\tfrac{x^2}{2} - 3x\\right]_3^4$$ $$= (9 - 4{,}5) + \\left((8-12) - (4{,}5-9)\\right) = 4{,}5 + 0{,}5 = 5$$ Ohne die Zerlegung erhält man \\(\\int_0^4 (x-3)\\,dx = -4\\) — einen negativen Wert, obwohl der Integrand nirgends negativ ist." },
      { id: 28, level: 5, typ: "numerisch", frage: "Bekannt sind \\(\\int_0^4 f(x)\\,dx = 10\\), \\(\\int_0^2 f(x)\\,dx = 3\\) und \\(\\int_2^4 g(x)\\,dx = 5\\). Berechne \\(\\int_2^4 \\left(f(x) + 2g(x)\\right)\\,dx\\).", loesung: 17, toleranz: 0.01, tipp: "Das gesuchte Teilintervall erhält man als Differenz zweier bekannter Integrale; danach hilft die Linearität.", loesungsweg: "Aus der Intervalladditivität folgt zuerst $$\\int_2^4 f = \\int_0^4 f - \\int_0^2 f = 10 - 3 = 7$$ Dann greift die Linearität: $$\\int_2^4 (f + 2g) = \\int_2^4 f + 2\\int_2^4 g = 7 + 2 \\cdot 5 = 17$$ Beide Schritte sind nötig — die Zahl aus dem großen Intervall darf nicht direkt eingesetzt werden, sie gehört zu einem anderen Bereich." },
      { id: 29, level: 5, typ: "mc", frage: "Vorgelegt wird die Rechnung: \\(\\int_0^2 x \\cdot x^2\\,dx = \\left(\\int_0^2 x\\,dx\\right) \\cdot \\left(\\int_0^2 x^2\\,dx\\right) = 2 \\cdot \\tfrac{8}{3} = \\tfrac{16}{3}\\). Wie ist diese Rechnung zu beurteilen?", optionen: ["Richtig, Produkte darf man aufteilen.", "Falsch: der Wert ist \\(4\\), Produkte teilt man nicht auf.", "Falsch: der Wert ist \\(\\tfrac{8}{3}\\), die Faktoren sind zu addieren.", "Falsch: der Wert ist \\(16\\), die Grenzen sind zu verdoppeln."], korrekt: 1, tipp: "Fasse den Integranden zuerst zu einer einzigen Potenz zusammen und rechne das Integral direkt aus.", loesungsweg: "Der Integrand ist \\(x \\cdot x^2 = x^3\\), also $$\\int_0^2 x^3\\,dx = \\left[\\tfrac{x^4}{4}\\right]_0^2 = \\frac{16}{4} = 4$$ Die vorgelegte Rechnung liefert \\(\\tfrac{16}{3} \\approx 5{,}33\\) und ist damit auch im Ergebnis falsch. Die Linearität gilt nur für Summen und konstante Faktoren — das Integral eines Produkts ist nicht das Produkt der Integrale." },
      { id: 30, level: 5, typ: "numerisch", frage: "Für welche Zahl \\(a > 0\\) gilt \\(\\int_0^a e^{2x}\\,dx = 10\\)? Gib \\(a\\) auf drei Nachkommastellen an.", loesung: 1.522, toleranz: 0.01, tipp: "Integriere zuerst mit dem Parameter als obere Grenze; die entstehende Exponentialgleichung wird mit dem natürlichen Logarithmus aufgelöst.", loesungsweg: "Zuerst das Integral als Term in \\(a\\): $$\\int_0^a e^{2x}\\,dx = \\left[\\tfrac12 e^{2x}\\right]_0^a = \\frac{e^{2a} - 1}{2}$$ Gleichsetzen und umstellen: $$\\frac{e^{2a}-1}{2} = 10 \\;\\Longrightarrow\\; e^{2a} = 21 \\;\\Longrightarrow\\; 2a = \\ln 21$$ $$a = \\frac{\\ln 21}{2} \\approx \\frac{3{,}0445}{2} \\approx 1{,}522$$ Der Faktor \\(\\tfrac12\\) der Stammfunktion darf dabei nicht verloren gehen." },
      // LEVEL 6 -- Abi-Format: mehrschrittig mit Begründungsanteil
      { id: 31, level: 6, typ: "numerisch", frage: "In ein Regenrückhaltebecken fließt Wasser mit der Rate \\(z(t) = 12 - 3t\\) (in Kubikmetern pro Stunde), wobei \\(t\\) die Zeit in Stunden ab Regenbeginn ist. Zeigen Sie, dass der Zufluss nach 4 Stunden versiegt, und berechnen Sie die in diesen 4 Stunden insgesamt zugeflossene Wassermenge in Kubikmetern.", loesung: 24, toleranz: 0.1, tipp: "Versiegen bedeutet Rate null — prüfe das mit Einsetzen; die Gesamtmenge ist das Integral der Rate.", loesungsweg: "<b>Versiegen:</b> \\(z(4) = 12 - 3 \\cdot 4 = 0\\), der Zufluss hört nach genau 4 Stunden auf; vorher ist \\(z(t) > 0\\). <b>Menge:</b> $$\\int_0^4 (12 - 3t)\\,dt = \\left[12t - 1{,}5t^2\\right]_0^4$$ $$= 48 - 1{,}5 \\cdot 16 = 48 - 24 = 24$$ Es fließen 24 Kubikmeter zu. Anschaulich ist das die Dreiecksfläche unter der Geraden \\(z\\): halbe Grundseite mal Höhe." },
      { id: 32, level: 6, typ: "numerisch", frage: "Beim Abkühlen eines Werkstücks gilt für die Temperatur \\(T(t) = 20 + 60 \\cdot e^{-0{,}5t}\\) (in Grad Celsius, \\(t\\) in Minuten). Berechnen Sie den mittleren Funktionswert von \\(T\\) über den ersten 4 Minuten, also die mittlere Temperatur in diesem Zeitraum (auf eine Nachkommastelle).", loesung: 45.9, toleranz: 0.3, tipp: "Der mittlere Funktionswert über einem Intervall ergibt sich aus dem Integral über dieses Intervall und seiner Länge; integriere den konstanten Summanden und den e-Term getrennt.", loesungsweg: "$$\\frac{1}{4}\\int_0^4 \\left(20 + 60e^{-0{,}5t}\\right)dt = \\frac{1}{4}\\left[20t - 120 e^{-0{,}5t}\\right]_0^4$$ Der Faktor \\(-120\\) entsteht aus \\(60 : (-0{,}5)\\). Einsetzen: $$\\frac{1}{4}\\left((80 - 120e^{-2}) - (0 - 120)\\right) = \\frac{1}{4}\\left(200 - 120 \\cdot 0{,}1353\\right)$$ $$= \\frac{1}{4} \\cdot 183{,}76 \\approx 45{,}9$$ Die mittlere Temperatur liegt bei etwa 45,9 Grad Celsius — deutlich über dem Endwert von 20 Grad, weil das Werkstück am Anfang noch heiß ist." },
      { id: 33, level: 6, typ: "mc", frage: "Beurteilen Sie die Aussage: „Gilt \\(\\int_a^b f(x)\\,dx = 0\\), so ist \\(f\\) auf dem ganzen Intervall \\([a;b]\\) die Nullfunktion.“", optionen: ["Zutreffend, das Integral misst den Flächeninhalt.", "Widerlegt: Vorzeichen können sich aufheben.", "Zutreffend, sofern die Grenzen verschieden sind.", "Nur bei nicht stetigen Funktionen widerlegbar."], korrekt: 1, tipp: "Suchen Sie eine Funktion, die nicht überall null ist und deren Integral dennoch verschwindet — ein Vorzeichenwechsel im Intervall genügt.", loesungsweg: "Die Aussage ist falsch; ein Gegenbeispiel genügt zur Widerlegung. Für \\(f(x) = x\\) auf \\([-1;1]\\) gilt $$\\int_{-1}^{1} x\\,dx = \\left[\\tfrac{x^2}{2}\\right]_{-1}^{1} = \\tfrac12 - \\tfrac12 = 0$$ obwohl \\(f\\) nur an einer einzigen Stelle null ist. Das Integral liefert den <b>orientierten</b> Flächeninhalt: der Anteil unterhalb der Achse zählt negativ und hebt den Anteil oberhalb auf. Richtig ist die Umkehrung: ist \\(f\\) die Nullfunktion, so ist das Integral null. Zusätzlich trifft die Aussage zu, wenn \\(f\\) stetig und überall größer oder gleich null ist." },
      { id: 34, level: 6, typ: "numerisch", frage: "Gegeben ist die Funktionenschar \\(f_k(x) = x^2 - k\\) mit \\(k > 0\\). Zeigen Sie, dass \\(\\int_0^{\\sqrt{k}} f_k(x)\\,dx\\) für jedes \\(k > 0\\) negativ ist, und bestimmen Sie \\(k\\) so, dass dieses Integral den Wert \\(-18\\) hat.", loesung: 9, toleranz: 0.05, tipp: "Berechnen Sie das Integral allgemein mit \\(k\\); die obere Grenze ist gerade die positive Nullstelle des Integranden.", loesungsweg: "Allgemein gilt $$\\int_0^{\\sqrt{k}} (x^2 - k)\\,dx = \\left[\\tfrac{x^3}{3} - kx\\right]_0^{\\sqrt{k}} = \\frac{k\\sqrt{k}}{3} - k\\sqrt{k} = -\\frac{2}{3}k\\sqrt{k}$$ <b>Vorzeichen:</b> für \\(k > 0\\) ist \\(k\\sqrt{k} > 0\\), der Term also stets negativ. Das passt zur Lage des Graphen: auf dem Intervall verläuft die Parabel vollständig unterhalb der \\(x\\)-Achse, denn \\(\\sqrt{k}\\) ist ihre positive Nullstelle. <b>Bedingung:</b> $$-\\tfrac{2}{3}k\\sqrt{k} = -18 \\;\\Longrightarrow\\; k\\sqrt{k} = 27 \\;\\Longrightarrow\\; k^{3} = 729$$ also \\(k = 9\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "In ein Löschwasserbecken fließt Wasser mit der Rate \\(z(t) = 8 - 2t\\) (in Kubikmetern pro Stunde), gleichzeitig wird ununterbrochen mit \\(2\\) Kubikmetern pro Stunde abgepumpt (\\(0 \\le t \\le 4\\)). Bestimmen Sie zunächst den Zeitpunkt, zu dem der Inhalt am größten ist, und geben Sie dann als Antwort die Zunahme des Inhalts bis zu diesem Zeitpunkt in Kubikmetern an.", loesung: 9, toleranz: 0.1, tipp: "Bilden Sie zuerst die Rate der Änderung des Inhalts als Differenz von Zufluss und Abfluss; der Inhalt wächst genau so lange, wie diese Rate positiv ist.", loesungsweg: "<b>Netto-Rate:</b> $$n(t) = (8-2t) - 2 = 6 - 2t$$ <b>Größter Inhalt:</b> \\(n(t) > 0\\) für \\(t < 3\\) und \\(n(t) < 0\\) danach; der Inhalt wächst also bis \\(t = 3\\) und nimmt anschließend ab. Zur Zeit \\(t = 3\\) ist er am größten. <b>Zunahme:</b> $$\\int_0^3 (6-2t)\\,dt = \\left[6t - t^2\\right]_0^3 = 18 - 9 = 9$$ Der Inhalt nimmt bis dahin um 9 Kubikmeter zu. Über \\(t = 3\\) hinaus zu integrieren wäre ein Fehler — der negative Anteil danach würde die Zunahme kleinrechnen, obwohl nach dem Höchststand gefragt ist." },
      { id: 36, level: 6, typ: "numerisch", frage: "Für \\(a > 0\\) betrachtet man \\(I(a) = \\int_0^a (2x - 6)\\,dx\\). Begründen Sie, dass \\(I(a)\\) für kleine \\(a\\) negativ ist, und bestimmen Sie die Stelle \\(a\\), an der \\(I(a)\\) den kleinsten Wert annimmt.", loesung: 3, toleranz: 0.05, tipp: "Stellen Sie \\(I(a)\\) als Funktionsterm in \\(a\\) auf und behandeln Sie diesen Term wie eine gewöhnliche Funktion, deren Minimum gesucht ist.", loesungsweg: "Integrieren mit \\(a\\) als obere Grenze: $$I(a) = \\left[x^2 - 6x\\right]_0^a = a^2 - 6a$$ <b>Vorzeichen:</b> für \\(0 < a < 6\\) ist \\(a(a-6) < 0\\); das passt dazu, dass der Integrand \\(2x-6\\) links von \\(x = 3\\) negativ ist. <b>Minimum:</b> \\(I\\) ist eine nach oben geöffnete Parabel mit den Nullstellen \\(0\\) und \\(6\\); ihr Scheitel liegt in der Mitte. Rechnerisch: \\(I'(a) = 2a - 6 = 0\\) ergibt \\(a = 3\\), und \\(I''(a) = 2 > 0\\) sichert das Minimum. Genau bis dorthin sammelt sich negativer Beitrag, danach kommt positiver hinzu." }];
