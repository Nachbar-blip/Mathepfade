<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzgesetze - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '7-potenzgesetze';
    const THEMA_CONFIG = { name: 'Potenzgesetze', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht: Potenzen verstehen ==========
      {
        id: 1,
        level: 1,
        typ: "mc",
        frage: "Was bedeutet \\(3^4\\)?",
        optionen: ["\\(3 + 3 + 3 + 3\\)", "\\(3 \\cdot 4\\)", "\\(3 \\cdot 3 \\cdot 3 \\cdot 3\\)", "\\(4 \\cdot 4 \\cdot 4\\)"],
        korrekt: 2,
        tipp: "Die Hochzahl gibt an, wie oft die Basis mit sich selbst multipliziert wird.",
        loesungsweg: "\\(3^4 = 3 \\cdot 3 \\cdot 3 \\cdot 3 = 81\\). Die Basis ist 3, der Exponent ist 4."
      },
      {
        id: 2,
        level: 1,
        typ: "numerisch",
        frage: "Berechne \\(2^5\\).",
        loesung: 32,
        toleranz: 0,
        tipp: "\\(2 \\cdot 2 \\cdot 2 \\cdot 2 \\cdot 2\\).",
        loesungsweg: "$$2^5 = 2 \\cdot 2 \\cdot 2 \\cdot 2 \\cdot 2 = 32$$"
      },
      {
        id: 3,
        level: 1,
        typ: "mc",
        frage: "Wie heißt die Zahl unten in \\(5^3\\)?",
        optionen: ["Exponent", "Basis", "Koeffizient", "Potenzwert"],
        korrekt: 1,
        tipp: "Die untere Zahl ist die, die vervielfacht wird.",
        loesungsweg: "In \\(5^3\\) ist \\(5\\) die <b>Basis</b> und \\(3\\) der <b>Exponent</b>."
      },
      {
        id: 4,
        level: 1,
        typ: "numerisch",
        frage: "Berechne \\(10^3\\).",
        loesung: 1000,
        toleranz: 0,
        tipp: "\\(10 \\cdot 10 \\cdot 10\\).",
        loesungsweg: "$$10^3 = 10 \\cdot 10 \\cdot 10 = 1000$$"
      },
      {
        id: 5,
        level: 1,
        typ: "mc",
        frage: "Welcher Wert ist \\(7^1\\)?",
        optionen: ["\\(0\\)", "\\(1\\)", "\\(7\\)", "\\(14\\)"],
        korrekt: 2,
        tipp: "Jede Zahl hoch 1 ist sie selbst.",
        loesungsweg: "\\(a^1 = a\\), also \\(7^1 = 7\\)."
      },
      {
        id: 6,
        level: 1,
        typ: "numerisch",
        frage: "Berechne \\(4^2\\).",
        loesung: 16,
        toleranz: 0,
        tipp: "\\(4 \\cdot 4\\).",
        loesungsweg: "$$4^2 = 4 \\cdot 4 = 16$$"
      },
      // ========== LEVEL 2 -- leicht: Produktregel gleiche Basis ==========
      {
        id: 7,
        level: 2,
        typ: "mc",
        frage: "Vereinfache: \\(a^3 \\cdot a^4\\).",
        optionen: ["\\(a^{12}\\)", "\\(a^7\\)", "\\(2a^7\\)", "\\(a^{3+4+1}\\)"],
        korrekt: 1,
        tipp: "Gleiche Basis: Exponenten addieren.",
        loesungsweg: "$$a^3 \\cdot a^4 = a^{3+4} = a^7$$"
      },
      {
        id: 8,
        level: 2,
        typ: "numerisch",
        frage: "Berechne \\(2^3 \\cdot 2^2\\) als Zahl.",
        loesung: 32,
        toleranz: 0,
        tipp: "\\(2^{3+2} = 2^5\\).",
        loesungsweg: "$$2^3 \\cdot 2^2 = 2^5 = 32$$"
      },
      {
        id: 9,
        level: 2,
        typ: "mc",
        frage: "Vereinfache: \\(x^5 \\cdot x\\).",
        optionen: ["\\(x^5\\)", "\\(x^6\\)", "\\(2x^5\\)", "\\(x^{5\\cdot 1}\\)"],
        korrekt: 1,
        tipp: "\\(x = x^1\\). Exponenten addieren.",
        loesungsweg: "$$x^5 \\cdot x^1 = x^{5+1} = x^6$$"
      },
      {
        id: 10,
        level: 2,
        typ: "numerisch",
        frage: "Berechne \\(3^2 \\cdot 3^3\\).",
        loesung: 243,
        toleranz: 0,
        tipp: "\\(3^5\\).",
        loesungsweg: "$$3^2 \\cdot 3^3 = 3^5 = 243$$"
      },
      {
        id: 11,
        level: 2,
        typ: "mc",
        frage: "Vereinfache: \\(b^2 \\cdot b^6\\).",
        optionen: ["\\(b^{12}\\)", "\\(b^4\\)", "\\(b^8\\)", "\\(2b^8\\)"],
        korrekt: 2,
        tipp: "Exponenten addieren: \\(2 + 6\\).",
        loesungsweg: "Beim Multiplizieren gleicher Basen werden die Exponenten addiert: $$b^2 \\cdot b^6 = b^{2+6} = b^8$$ Ausgeschrieben stehen zwei plus sechs Faktoren \\(b\\) nebeneinander — zusammen acht. Multipliziert werden die Exponenten dagegen beim Potenzieren einer Potenz."
      },
      {
        id: 12,
        level: 2,
        typ: "numerisch",
        frage: "Berechne \\(5^2 \\cdot 5^1\\).",
        loesung: 125,
        toleranz: 0,
        tipp: "\\(5^3\\).",
        loesungsweg: "$$5^2 \\cdot 5 = 5^3 = 125$$"
      },
      // ========== LEVEL 3 -- nervenschonend: Quotientenregel ==========
      {
        id: 13,
        level: 3,
        typ: "mc",
        frage: "Vereinfache: \\(\\frac{a^7}{a^3}\\).",
        optionen: ["\\(a^{10}\\)", "\\(a^{21}\\)", "\\(a^4\\)", "\\(a^{7/3}\\)"],
        korrekt: 2,
        tipp: "Gleiche Basis dividieren: Exponenten subtrahieren.",
        loesungsweg: "$$\\frac{a^7}{a^3} = a^{7-3} = a^4$$"
      },
      {
        id: 14,
        level: 3,
        typ: "numerisch",
        frage: "Berechne \\(\\frac{2^6}{2^3}\\).",
        loesung: 8,
        toleranz: 0,
        tipp: "\\(2^{6-3} = 2^3\\).",
        loesungsweg: "$$\\frac{2^6}{2^3} = 2^3 = 8$$"
      },
      {
        id: 15,
        level: 3,
        typ: "mc",
        frage: "Vereinfache: \\(\\frac{x^5 \\cdot x^2}{x^3}\\).",
        optionen: ["\\(x^{10}\\)", "\\(x^4\\)", "\\(x^6\\)", "\\(x^0\\)"],
        korrekt: 1,
        tipp: "Erst Zähler zusammenfassen: \\(x^7\\). Dann \\(x^{7-3}\\).",
        loesungsweg: "$$\\frac{x^5 \\cdot x^2}{x^3} = \\frac{x^7}{x^3} = x^4$$"
      },
      {
        id: 16,
        level: 3,
        typ: "numerisch",
        frage: "Berechne \\(\\frac{10^5}{10^2}\\).",
        loesung: 1000,
        toleranz: 0,
        tipp: "\\(10^3\\).",
        loesungsweg: "$$\\frac{10^5}{10^2} = 10^3 = 1000$$"
      },
      {
        id: 17,
        level: 3,
        typ: "mc",
        frage: "Was ergibt \\(a^5 : a^5\\) (für \\(a \\ne 0\\))?",
        optionen: ["\\(a^{10}\\)", "\\(a^0 = 1\\)", "\\(0\\)", "\\(a\\)"],
        korrekt: 1,
        tipp: "Gleiche Potenzen dividiert: Ergebnis ist 1.",
        loesungsweg: "$$\\frac{a^5}{a^5} = a^{5-5} = a^0 = 1$$"
      },
      {
        id: 18,
        level: 3,
        typ: "numerisch",
        frage: "Berechne \\(\\frac{7^4}{7^2}\\).",
        loesung: 49,
        toleranz: 0,
        tipp: "\\(7^2\\).",
        loesungsweg: "$$\\frac{7^4}{7^2} = 7^2 = 49$$"
      },
      // ========== LEVEL 4 -- Potenzgesetz selbst wählen, Umkehraufgaben ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Vereinfache \\(\\frac{(x^2)^3 \\cdot x^4}{x^5}\\) zu einer Potenz \\(x^k\\). Gib \\(k\\) an.", loesung: 5, toleranz: 0, tipp: "Zuerst die Klammer auflösen, dann Zähler und Nenner getrennt betrachten.", loesungsweg: "Drei Potenzgesetze greifen nacheinander: Potenz einer Potenz, Produkt und Quotient gleicher Basis. $$\\frac{(x^2)^3 \\cdot x^4}{x^5} = \\frac{x^6 \\cdot x^4}{x^5} = \\frac{x^{10}}{x^5} = x^{10-5} = x^5$$ Also \\(k = 5\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Für welche natürliche Zahl \\(n\\) gilt \\(3^n \\cdot 3^4 = 3^{10}\\)?", loesung: 6, toleranz: 0, tipp: "Was passiert mit den Exponenten beim Multiplizieren gleicher Basen?", loesungsweg: "Links stehen zwei Potenzen mit gleicher Basis, ihre Exponenten addieren sich: $$3^n \\cdot 3^4 = 3^{n+4}$$ Zwei Potenzen mit gleicher Basis sind genau dann gleich, wenn die Exponenten übereinstimmen: $$n + 4 = 10 \\;\\Rightarrow\\; n = 6$$ Probe: \\(3^6 \\cdot 3^4 = 729 \\cdot 81 = 59\\,049 = 3^{10}\\) ✓" },
      { id: 21, level: 4, typ: "numerisch", frage: "Schreibe \\((2a^3)^2\\) in der Form \\(k \\cdot a^m\\). Gib den Koeffizienten \\(k\\) an.", loesung: 4, toleranz: 0, tipp: "Der Exponent außen wirkt auf jeden Faktor in der Klammer.", loesungsweg: "Ein Produkt wird potenziert, indem jeder Faktor potenziert wird: $$(2a^3)^2 = 2^2 \\cdot (a^3)^2 = 4 \\cdot a^6$$ Also \\(k = 4\\) und \\(m = 6\\). Der häufigste Fehler ist, die \\(2\\) unpotenziert zu lassen und \\(2a^6\\) zu schreiben." },
      { id: 22, level: 4, typ: "numerisch", frage: "Berechne \\(\\frac{4^5}{2^7}\\) ohne Taschenrechner.", loesung: 8, toleranz: 0, tipp: "Beide Potenzen lassen sich auf dieselbe Basis bringen.", loesungsweg: "Die Basen sind verschieden, aber \\(4 = 2^2\\). Damit wird der Zähler zu einer Zweierpotenz: $$4^5 = (2^2)^5 = 2^{10}$$ Jetzt greift das Quotientengesetz: $$\\frac{2^{10}}{2^7} = 2^{10-7} = 2^3 = 8$$ Ohne diese Umformung müsste man \\(1024 : 128\\) rechnen — dasselbe Ergebnis, aber mit unhandlichen Zahlen." },
      { id: 23, level: 4, typ: "numerisch", frage: "Ein Quadrat hat die Seitenlänge \\(2^5\\,\\text{cm}\\). Sein Flächeninhalt ist eine Zweierpotenz \\(2^k\\,\\text{cm}^2\\). Gib \\(k\\) an.", loesung: 10, toleranz: 0, tipp: "Flächeninhalt eines Quadrats: Seite mal Seite.", loesungsweg: "Der Flächeninhalt ist das Quadrat der Seitenlänge: $$A = (2^5)^2 = 2^{5 \\cdot 2} = 2^{10}\\,\\text{cm}^2$$ Also \\(k = 10\\). Ausgerechnet: \\(32\\,\\text{cm} \\cdot 32\\,\\text{cm} = 1024\\,\\text{cm}^2\\) ✓" },
      { id: 24, level: 4, typ: "numerisch", frage: "Berechne \\(\\frac{6^4}{3^4}\\) ohne Taschenrechner.", loesung: 16, toleranz: 0, tipp: "Die Exponenten sind gleich, die Basen nicht.", loesungsweg: "Bei gleichem Exponenten darf man die Basen zuerst dividieren: $$\\frac{6^4}{3^4} = \\left(\\frac63\\right)^4 = 2^4 = 16$$ Probe: \\(\\frac{1296}{81} = 16\\) ✓ Der Umweg über die großen Zahlen ist unnötig." },
      // ========== LEVEL 5 -- Fehler finden, Parameter aus zwei Bedingungen, Sachaufgaben ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler vereinfacht:<br>Schritt 1: \\((a^2)^3 \\cdot a^4 = a^6 \\cdot a^4\\)<br>Schritt 2: \\(a^6 \\cdot a^4 = a^{24}\\)<br>Schritt 3: \\(a^{24} : a^4 = a^{20}\\)<br>Welcher Schritt ist der erste fehlerhafte?", optionen: ["Schritt 2 — beim Multiplizieren gleicher Basen werden die Exponenten addiert: \\(a^{10}\\)", "Schritt 1 — es müsste \\((a^2)^3 = a^5\\) heißen", "Schritt 3 — beim Dividieren werden die Exponenten dividiert: \\(a^6\\)", "Kein Schritt ist fehlerhaft"], korrekt: 0, tipp: "Prüfe jeden Schritt mit einer konkreten Zahl, etwa \\(a = 2\\).", loesungsweg: "Schritt 1 ist richtig: Beim Potenzieren einer Potenz werden die Exponenten multipliziert, \\((a^2)^3 = a^6\\). In Schritt 2 wurde dieselbe Regel fälschlich auf ein Produkt angewendet — dort werden die Exponenten <b>addiert</b>: $$a^6 \\cdot a^4 = a^{6+4} = a^{10}, \\quad \\text{nicht } a^{24}$$ Kontrolle mit \\(a = 2\\): \\(64 \\cdot 16 = 1024 = 2^{10}\\), aber \\(2^{24}\\) wäre über \\(16\\) Millionen. Schritt 3 ist für sich genommen richtig gerechnet, baut aber auf dem falschen Wert auf; korrekt wäre \\(a^{10} : a^4 = a^6\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Für natürliche Zahlen \\(a > 1\\) und \\(n\\) gilt \\(a^n \\cdot a^3 = 256\\) und \\((a^n)^2 = 1024\\). Bestimme \\(a + n\\).", loesung: 7, toleranz: 0, tipp: "Schreibe beide Ergebnisse als Potenzen derselben kleinen Basis.", loesungsweg: "Beide Zahlen sind Zweierpotenzen: \\(256 = 2^8\\) und \\(1024 = 2^{10}\\). Mit den Potenzgesetzen werden die Bedingungen zu $$a^{n+3} = 2^8 \\qquad\\text{und}\\qquad a^{2n} = 2^{10}$$ Versuch \\(a = 2\\): Aus der zweiten Gleichung folgt \\(2n = 10\\), also \\(n = 5\\); die erste ergibt \\(n + 3 = 8\\), also ebenfalls \\(n = 5\\) ✓ Andere Basen scheitern: Für \\(a = 4\\) müsste \\(4^{2n} = 4^5\\) sein, \\(n\\) wäre nicht ganzzahlig. Also \\(a = 2\\), \\(n = 5\\) und \\(a + n = 7\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Würfel hat die Kantenlänge \\(3^2\\,\\text{cm}\\). Wie viele Würfel mit der Kantenlänge \\(3\\,\\text{cm}\\) haben zusammen dasselbe Volumen?", loesung: 27, toleranz: 0, tipp: "Vergleiche die beiden Volumina als Dreierpotenzen.", loesungsweg: "Volumen des großen Würfels: $$V = (3^2)^3 = 3^6\\,\\text{cm}^3$$ Volumen eines kleinen Würfels: \\(3^3\\,\\text{cm}^3\\). Der Quotient gibt die Anzahl: $$\\frac{3^6}{3^3} = 3^{6-3} = 3^3 = 27$$ Anschaulich: Entlang jeder Kante passen \\(9 : 3 = 3\\) kleine Würfel, insgesamt \\(3 \\cdot 3 \\cdot 3 = 27\\)." },
      { id: 28, level: 5, typ: "mc", frage: "Eine Schülerin rechnet \\(2^3 \\cdot 3^2 = 6^5\\). Was ist dazu zu sagen?", optionen: ["Falsch — die Potenzgesetze verlangen gleiche Basen oder gleiche Exponenten, hier trifft beides nicht zu; richtig ist \\(8 \\cdot 9 = 72\\)", "Falsch — die Basen dürfen multipliziert werden, aber die Exponenten auch: \\(6^6\\)", "Richtig — Basen und Exponenten werden jeweils zusammengefasst", "Falsch — richtig wäre \\(5^5\\), weil Basis und Exponent vertauscht sind"], korrekt: 0, tipp: "Wie groß ist \\(6^5\\) ungefähr, wie groß \\(2^3 \\cdot 3^2\\)?", loesungsweg: "Für \\(a^m \\cdot a^n\\) braucht man gleiche Basen, für \\(a^n \\cdot b^n\\) gleiche Exponenten. Bei \\(2^3 \\cdot 3^2\\) ist beides verschieden — es gibt kein Potenzgesetz, das hier greift. Man muss ausrechnen: $$2^3 \\cdot 3^2 = 8 \\cdot 9 = 72$$ Dagegen ist \\(6^5 = 7776\\). Die Größenordnung entlarvt den Fehler sofort." },
      { id: 29, level: 5, typ: "numerisch", frage: "Für welche Zahl \\(x\\) gilt \\(8^x = 2^{12}\\)?", loesung: 4, toleranz: 0, tipp: "Schreibe die \\(8\\) als Zweierpotenz.", loesungsweg: "Damit man Exponenten vergleichen kann, müssen die Basen gleich sein. Mit \\(8 = 2^3\\): $$8^x = (2^3)^x = 2^{3x}$$ Gleiche Basis, also gleiche Exponenten: $$3x = 12 \\;\\Rightarrow\\; x = 4$$ Probe: \\(8^4 = 4096 = 2^{12}\\) ✓" },
      { id: 30, level: 5, typ: "numerisch", frage: "Ein Schüler meint: „\\(2^{10}\\) ist ungefähr tausend, also ist \\(2^{20}\\) ungefähr zweitausend.\" Um welchen Faktor ist \\(2^{20}\\) tatsächlich größer als \\(2^{10}\\)?", loesung: 1024, toleranz: 0, tipp: "Bilde den Quotienten der beiden Potenzen.", loesungsweg: "Der Faktor ist der Quotient: $$\\frac{2^{20}}{2^{10}} = 2^{20-10} = 2^{10} = 1024$$ Die Verdopplung des Exponenten verdoppelt nicht den Wert, sondern quadriert ihn: \\(2^{20} = (2^{10})^2 \\approx 1000^2 = 1\\,000\\,000\\). Der Schüler verwechselt Multiplikation im Exponenten mit Multiplikation des Werts." },
      // ========== LEVEL 6 -- Gesetze begründen, Behauptungen prüfen, Sonderfälle ==========
      { id: 31, level: 6, typ: "mc", frage: "Warum gilt \\(a^m \\cdot a^n = a^{m+n}\\) für natürliche Zahlen \\(m\\) und \\(n\\)?", optionen: ["\\(a^m\\) ist ein Produkt aus \\(m\\) Faktoren \\(a\\), \\(a^n\\) eines aus \\(n\\) Faktoren \\(a\\); zusammen sind es \\(m + n\\) Faktoren \\(a\\)", "Weil Exponenten immer addiert werden, sobald zwei Potenzen nebeneinander stehen", "Weil \\(a^m \\cdot a^n = (a \\cdot a)^{m \\cdot n}\\) gilt und sich das kürzen lässt", "Das lässt sich nicht begründen, es ist eine Vereinbarung wie \\(a^0 = 1\\)"], korrekt: 0, tipp: "Schreibe \\(a^2 \\cdot a^3\\) als Produkt einzelner Faktoren.", loesungsweg: "Die Begründung steckt in der Definition der Potenz als wiederholtes Produkt: $$a^m \\cdot a^n = \\underbrace{a \\cdot \\ldots \\cdot a}_{m\\ \\text{Faktoren}} \\cdot \\underbrace{a \\cdot \\ldots \\cdot a}_{n\\ \\text{Faktoren}} = \\underbrace{a \\cdot \\ldots \\cdot a}_{m+n\\ \\text{Faktoren}} = a^{m+n}$$ Beispiel: \\(a^2 \\cdot a^3 = (a \\cdot a)(a \\cdot a \\cdot a) = a^5\\). Die Regel „Exponenten addieren\" gilt nur bei <b>gleicher Basis</b> und beim <b>Multiplizieren</b> — sie ist eine Folge der Definition, keine Vereinbarung." },
      { id: 32, level: 6, typ: "mc", frage: "Behauptung: „Für alle natürlichen Zahlen gilt \\((a^m)^n = a^{(m^n)}\\).\" Stimmt das?", optionen: ["Nein — Gegenbeispiel \\(a = 2\\), \\(m = 3\\), \\(n = 2\\): \\((2^3)^2 = 64\\), aber \\(2^{(3^2)} = 512\\); richtig ist \\(a^{m \\cdot n}\\)", "Ja — beim Potenzieren einer Potenz wird der Exponent potenziert", "Ja, aber nur wenn \\(m = n\\) ist", "Nein — richtig wäre \\((a^m)^n = a^{m+n}\\)"], korrekt: 0, tipp: "Rechne beide Seiten für kleine Zahlen aus.", loesungsweg: "Ein Gegenbeispiel widerlegt die Behauptung: $$(2^3)^2 = 8^2 = 64, \\qquad 2^{(3^2)} = 2^9 = 512$$ Richtig ist \\((a^m)^n = a^{m \\cdot n}\\), denn \\(a^m\\) wird \\(n\\)-mal als Faktor genommen, das sind \\(m \\cdot n\\) Faktoren \\(a\\). Für \\(m = n = 2\\) fallen beide Formeln zufällig zusammen (\\(2 \\cdot 2 = 2^2\\)), das ist aber kein Beleg für die Behauptung." },
      { id: 33, level: 6, typ: "mc", frage: "Welche Zahl ist größer: \\(2^{300}\\) oder \\(3^{200}\\)? Begründe ohne Taschenrechner.", optionen: ["\\(3^{200}\\), denn \\(2^{300} = (2^3)^{100} = 8^{100}\\) und \\(3^{200} = (3^2)^{100} = 9^{100}\\), und \\(8^{100} < 9^{100}\\)", "\\(2^{300}\\), weil der Exponent \\(300\\) deutlich größer ist als \\(200\\)", "Beide sind gleich groß, weil \\(2 \\cdot 300 = 3 \\cdot 200\\) ist", "Das lässt sich ohne Taschenrechner nicht entscheiden"], korrekt: 0, tipp: "Bringe beide Potenzen auf denselben Exponenten.", loesungsweg: "Der größte gemeinsame Teiler der Exponenten ist \\(100\\). Beide Potenzen lassen sich darauf umschreiben: $$2^{300} = (2^3)^{100} = 8^{100}, \\qquad 3^{200} = (3^2)^{100} = 9^{100}$$ Bei gleichem Exponenten entscheidet die Basis: \\(8 < 9\\), also \\(2^{300} < 3^{200}\\). Ein größerer Exponent allein sagt nichts — er muss gegen die kleinere Basis abgewogen werden." },
      { id: 34, level: 6, typ: "numerisch", frage: "Ein Schüler behauptet: \\(2^n + 2^n = 2^{2n}\\). Für welche natürliche Zahl \\(n\\) stimmt diese Gleichung?", loesung: 1, toleranz: 0, tipp: "Fasse die linke Seite zuerst richtig zusammen.", loesungsweg: "Die linke Seite ist eine Summe gleicher Summanden, kein Produkt: $$2^n + 2^n = 2 \\cdot 2^n = 2^{n+1}$$ Die Behauptung stimmt also genau dann, wenn \\(n + 1 = 2n\\), also für \\(n = 1\\): \\(2 + 2 = 4 = 2^2\\) ✓ Für alle anderen \\(n\\) ist sie falsch, etwa \\(n = 3\\): \\(8 + 8 = 16\\), aber \\(2^6 = 64\\). Potenzgesetze gelten für Produkte, nicht für Summen." },
      { id: 35, level: 6, typ: "numerisch", frage: "Wie viele Ziffern hat die Zahl \\(2^{10} \\cdot 5^8\\)? Bestimme die Anzahl ohne Taschenrechner.", loesung: 9, toleranz: 0, tipp: "Zerlege \\(2^{10}\\) so, dass ein Faktor denselben Exponenten wie \\(5^8\\) hat.", loesungsweg: "Gleiche Exponenten erlauben das Zusammenfassen der Basen: $$2^{10} \\cdot 5^8 = 2^2 \\cdot 2^8 \\cdot 5^8 = 4 \\cdot (2 \\cdot 5)^8 = 4 \\cdot 10^8$$ Das ist eine \\(4\\) mit acht Nullen: \\(400\\,000\\,000\\), also \\(9\\) Ziffern. Die Aufgabe steht und fällt mit der Idee, aus \\(2^{10}\\) den Anteil \\(2^8\\) abzuspalten." },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Bakterium teilt sich alle \\(20\\) Minuten in zwei. Nach wie vielen Stunden sind aus einem Bakterium \\(2^{12}\\) Bakterien geworden?", loesung: 4, toleranz: 0, tipp: "Wie viele Teilungen sind nötig, und wie lange dauern sie zusammen?", loesungsweg: "Nach \\(k\\) Teilungen gibt es \\(2^k\\) Bakterien. Für \\(2^{12}\\) sind also \\(12\\) Teilungen nötig — hier wird der Exponent gesucht, nicht der Wert. $$12 \\cdot 20\\,\\text{min} = 240\\,\\text{min} = 4\\,\\text{h}$$ Zur Einordnung: \\(2^{12} = 4096\\) Bakterien nach nur vier Stunden; nach acht Stunden wären es bereits \\(2^{24}\\), über \\(16\\) Millionen." }];
    </script>

</body>
