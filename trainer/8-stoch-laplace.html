<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laplace-Wahrscheinlichkeit - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-stoch-laplace';
    const THEMA_CONFIG = { name: 'Laplace-Wahrscheinlichkeit', bereich: 'stochastik' };
    const AUFGABEN = [
      // ===== LEVEL 1 - babyleicht: Grundbegriffe =====
      { id:1, level:1, typ:"mc", frage:"Was ist ein Laplace-Experiment?", optionen:["alle Ergebnisse gleich wahrscheinlich","nur zwei Ergebnisse","unendlich viele Ergebnisse","abhängige Ergebnisse"], korrekt:0, tipp:"Gleiche Chancen.", loesungsweg:"Ein Zufallsexperiment, bei dem alle Ergebnisse gleich wahrscheinlich sind." },
      { id:2, level:1, typ:"mc", frage:"Wie berechnet man die Laplace-Wahrscheinlichkeit?", optionen:["günstige/mögliche","mögliche/günstige","günstige·mögliche","günstige-mögliche"], korrekt:0, tipp:"Bruch.", loesungsweg:"\\(P=\\frac{\\text{günstige}}{\\text{mögliche}}\\)." },
      { id:3, level:1, typ:"numerisch", frage:"Würfel: Wahrscheinlichkeit für eine 6? (3 Dez)", loesung:0.167, toleranz:0.005, tipp:"\\(1/6\\).", loesungsweg:"\\(\\frac{1}{6}\\approx0{,}167\\)." },
      { id:4, level:1, typ:"numerisch", frage:"Münzwurf: Wahrscheinlichkeit für Kopf? (1 Dez)", loesung:0.5, toleranz:0.01, tipp:"\\(1/2\\).", loesungsweg:"\\(\\frac{1}{2}=0{,}5\\)." },
      { id:5, level:1, typ:"mc", frage:"Welchen Wert hat eine Wahrscheinlichkeit immer?", optionen:["zwischen 0 und 1","größer als 1","negativ","genau 2"], korrekt:0, tipp:"\\(0\\le P\\le 1\\).", loesungsweg:"Eine Wahrscheinlichkeit liegt stets zwischen 0 und 1." },
      { id:6, level:1, typ:"numerisch", frage:"Würfel: Wahrscheinlichkeit für eine gerade Zahl? (1 Dez)", loesung:0.5, toleranz:0.01, tipp:"3 von 6 sind gerade.", loesungsweg:"\\(\\frac{3}{6}=0{,}5\\)." },
      // ===== LEVEL 2 - leicht: einfacher Würfel / Münze =====
      { id:7, level:2, typ:"numerisch", frage:"Würfel: P für eine Zahl kleiner als 3? (3 Dez)", loesung:0.333, toleranz:0.005, tipp:"Günstig: 1 und 2.", loesungsweg:"\\(\\frac{2}{6}=\\frac{1}{3}\\approx0{,}333\\)." },
      { id:8, level:2, typ:"numerisch", frage:"Würfel: P für eine Primzahl (2, 3, 5)? (1 Dez)", loesung:0.5, toleranz:0.01, tipp:"3 Primzahlen.", loesungsweg:"\\(\\frac{3}{6}=0{,}5\\)." },
      { id:9, level:2, typ:"numerisch", frage:"Glücksrad mit 8 gleichen Feldern: P für ein bestimmtes Feld? (3 Dez)", loesung:0.125, toleranz:0.005, tipp:"\\(1/8\\).", loesungsweg:"\\(\\frac{1}{8}=0{,}125\\)." },
      { id:10, level:2, typ:"mc", frage:"Würfel: Wie viele günstige Ergebnisse für 'höchstens 4'?", optionen:["4","3","2","6"], korrekt:0, tipp:"1, 2, 3, 4.", loesungsweg:"Höchstens 4 heißt 1, 2, 3 oder 4 \\(\\Rightarrow\\) 4 Ergebnisse." },
      { id:11, level:2, typ:"numerisch", frage:"Karten 1 bis 10 ziehen: P für eine durch 5 teilbare Zahl? (1 Dez)", loesung:0.2, toleranz:0.01, tipp:"5 und 10.", loesungsweg:"\\(\\frac{2}{10}=0{,}2\\)." },
      { id:12, level:2, typ:"numerisch", frage:"Würfel: P für die Augenzahl 7? (1 Dez)", loesung:0, toleranz:0, tipp:"Unmögliches Ereignis.", loesungsweg:"Es gibt keine 7 \\(\\Rightarrow\\) \\(P=0\\)." },
      // ===== LEVEL 3 - nervenschonend: Urnen / Kugeln =====
      { id:13, level:3, typ:"numerisch", frage:"Urne: 3 rote, 2 blaue Kugeln. P für rot? (1 Dez)", loesung:0.6, toleranz:0.01, tipp:"\\(3/5\\).", loesungsweg:"\\(\\frac{3}{5}=0{,}6\\)." },
      { id:14, level:3, typ:"numerisch", frage:"Urne: 4 weiße, 6 schwarze Kugeln. P für weiß? (1 Dez)", loesung:0.4, toleranz:0.01, tipp:"\\(4/10\\).", loesungsweg:"\\(\\frac{4}{10}=0{,}4\\)." },
      { id:15, level:3, typ:"numerisch", frage:"Tüte: 5 rote, 3 grüne, 2 gelbe Bonbons. P für grün? (1 Dez)", loesung:0.3, toleranz:0.01, tipp:"\\(3/10\\).", loesungsweg:"\\(\\frac{3}{10}=0{,}3\\)." },
      { id:16, level:3, typ:"mc", frage:"Was ist das Gegenereignis von 'mindestens eine 6'?", optionen:["keine 6","genau eine 6","höchstens eine 6","immer eine 6"], korrekt:0, tipp:"Verneinung.", loesungsweg:"Das Gegenteil von 'mindestens eine' ist 'keine'." },

      { id:18, level:3, typ:"numerisch", frage:"P für rot ist 0,3. Wahrscheinlichkeit für 'nicht rot'? (1 Dez)", loesung:0.7, toleranz:0.01, tipp:"\\(1-P\\).", loesungsweg:"\\(1-0{,}3=0{,}7\\)." },
      // ===== LEVEL 4 - mittel: zweistufige Laplace-Experimente =====
      { id:19, level:4, typ:"numerisch", frage:"Zwei Würfel: Anzahl aller möglichen Ergebnisse?", loesung:36, toleranz:0, tipp:"\\(6\\cdot6\\).", loesungsweg:"\\(6\\cdot6=36\\)." },
      { id:20, level:4, typ:"numerisch", frage:"Zwei Würfel: P für Augensumme 7? (3 Dez)", loesung:0.167, toleranz:0.005, tipp:"6 günstige von 36.", loesungsweg:"\\(\\frac{6}{36}=\\frac{1}{6}\\approx0{,}167\\)." },
      { id:21, level:4, typ:"numerisch", frage:"Zwei Würfel: P für einen Pasch (gleiche Augen)? (3 Dez)", loesung:0.167, toleranz:0.005, tipp:"6 Päsche von 36.", loesungsweg:"\\(\\frac{6}{36}=\\frac{1}{6}\\approx0{,}167\\)." },
      { id:22, level:4, typ:"numerisch", frage:"Zwei Würfel: P für Augensumme 12? (4 Dez)", loesung:0.0278, toleranz:0.002, tipp:"Nur (6,6).", loesungsweg:"\\(\\frac{1}{36}\\approx0{,}0278\\)." },
      { id:23, level:4, typ:"numerisch", frage:"Zwei Münzen: P für zweimal Kopf? (2 Dez)", loesung:0.25, toleranz:0.01, tipp:"\\(\\frac{1}{4}\\).", loesungsweg:"\\(\\frac{1}{4}=0{,}25\\)." },
      { id:24, level:4, typ:"mc", frage:"Zwei Würfel, P für Augensumme 2 oder 12. Welche ist die kleinste Summenwahrscheinlichkeit?", optionen:["2 und 12 sind gleich klein","7 ist am kleinsten","6 ist am kleinsten","alle gleich"], korrekt:0, tipp:"Je 1 günstiges Ergebnis.", loesungsweg:"Summe 2 und 12 haben je nur 1 Ergebnis \\(\\Rightarrow\\) beide am kleinsten." },

      { id:25, level:5, typ:"numerisch", frage:"Zwei Würfel: P für 'Augensumme mindestens 4'. Gegenereignis nutzen. (3 Dez)", loesung:0.917, toleranz:0.005, tipp:"Gegenereignis: Summe 2 oder 3 (3 Ergebnisse).", loesungsweg:"\\(1-\\frac{3}{36}=\\frac{33}{36}\\approx0{,}917\\)." },
      { id:26, level:5, typ:"numerisch", frage:"Würfel zweimal: P für 'mindestens eine 6'. (3 Dez)", loesung:0.306, toleranz:0.005, tipp:"\\(1-(5/6)^2\\).", loesungsweg:"\\(1-\\frac{25}{36}=\\frac{11}{36}\\approx0{,}306\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Urne 10 Kugeln (4 rot). Zwei ohne Zurücklegen. P für beide rot? (3 Dez)", loesung:0.133, toleranz:0.005, tipp:"\\(\\frac{4}{10}\\cdot\\frac{3}{9}\\).", loesungsweg:"\\(\\frac{4}{10}\\cdot\\frac{3}{9}=\\frac{12}{90}\\approx0{,}133\\)." },
      { id:28, level:5, typ:"numerisch", frage:"Karten 1 bis 20: P für eine durch 3 oder 5 teilbare Zahl? (2 Dez)", loesung:0.45, toleranz:0.01, tipp:"Teilbar durch 3: 6, durch 5: 4, durch 15: 1.", loesungsweg:"\\(\\frac{6+4-1}{20}=\\frac{9}{20}=0{,}45\\)." },
      { id:29, level:5, typ:"numerisch", frage:"Zwei Würfel: P für 'Produkt der Augen gerade'. (3 Dez)", loesung:0.75, toleranz:0.005, tipp:"Gegenereignis: beide ungerade (9 von 36).", loesungsweg:"\\(1-\\frac{9}{36}=\\frac{27}{36}=0{,}75\\)." },
      { id:30, level:5, typ:"mc", frage:"Warum rechnet man oft über das Gegenereignis?", optionen:["weil es weniger Fälle hat","weil es immer 0 ergibt","weil P dann größer wird","das ist verboten"], korrekt:0, tipp:"Aufwand sparen.", loesungsweg:"Das Gegenereignis hat oft weniger zu zählende Fälle; \\(P=1-P(\\bar A)\\)." },
      // ===== LEVEL 6 - wagnerisch: Transfer & Kombinatorik =====
      { id:31, level:6, typ:"numerisch", frage:"6 aus 49 (eine feste Reihe): Anzahl der Möglichkeiten? Gib \\(\\binom{49}{6}\\) an.", loesung:13983816, toleranz:0, tipp:"\\(\\binom{49}{6}\\).", loesungsweg:"\\(\\binom{49}{6}=13\\,983\\,816\\)." },
      { id:32, level:6, typ:"numerisch", frage:"6 aus 49: Wahrscheinlichkeit für 6 Richtige als \\(1/N\\). Gib den Nenner \\(N\\) an.", loesung:13983816, toleranz:0, tipp:"\\(P=1/\\binom{49}{6}\\).", loesungsweg:"\\(P=\\frac{1}{13\\,983\\,816}\\), also \\(N=13\\,983\\,816\\)." },
      { id:33, level:6, typ:"numerisch", frage:"Drei Würfel: P für drei gleiche Augen (Pasch)? (4 Dez)", loesung:0.0278, toleranz:0.002, tipp:"\\(\\frac{6}{216}\\).", loesungsweg:"\\(\\frac{6}{6^3}=\\frac{6}{216}\\approx0{,}0278\\)." },
      { id:34, level:6, typ:"numerisch", frage:"Geburtstagsproblem klein: 3 Personen, P dass alle an verschiedenen Wochentagen Geburtstag haben (7 Tage)? (3 Dez)", loesung:0.612, toleranz:0.005, tipp:"\\(\\frac{7\\cdot6\\cdot5}{7^3}\\).", loesungsweg:"\\(\\frac{7\\cdot6\\cdot5}{343}=\\frac{210}{343}\\approx0{,}612\\)." },
      { id:35, level:6, typ:"numerisch", frage:"Urne 5 Kugeln (2 rot, 3 blau), 2 ohne Zurücklegen. P für genau eine rote? (3 Dez)", loesung:0.6, toleranz:0.005, tipp:"\\(\\frac{\\binom{2}{1}\\binom{3}{1}}{\\binom{5}{2}}\\).", loesungsweg:"\\(\\frac{2\\cdot3}{10}=\\frac{6}{10}=0{,}6\\)." },
      { id:36, level:6, typ:"mc", frage:"Wann ist die Laplace-Formel NICHT anwendbar?", optionen:["wenn Ergebnisse ungleich wahrscheinlich sind","beim fairen Würfel","bei der fairen Münze","beim Glücksrad mit gleichen Feldern"], korrekt:0, tipp:"Gleichwahrscheinlichkeit nötig.", loesungsweg:"Die Laplace-Formel gilt nur, wenn alle Ergebnisse gleich wahrscheinlich sind." }
    ];
    </script>
