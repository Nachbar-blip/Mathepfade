<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laplace-Wahrscheinlichkeit - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-stoch-laplace';
    const THEMA_CONFIG = { name: 'Laplace-Wahrscheinlichkeit', bereich: 'stochastik' };
    const AUFGABEN = [
      // ===== LEVEL 1 - babyleicht: Grundbegriffe =====
      { id:1, level:1, typ:"mc", frage:"Was ist ein Laplace-Experiment?", optionen:["alle Ergebnisse gleich wahrscheinlich","nur zwei Ergebnisse","unendlich viele Ergebnisse","abhängige Ergebnisse"], korrekt:0, tipp:"Gleiche Chancen.", loesungsweg:"Ein Laplace-Experiment ist ein Zufallsexperiment, bei dem alle Ergebnisse <b>gleich wahrscheinlich</b> sind — Würfel, Münze, Glücksrad mit gleich großen Feldern. Nur dann darf man Wahrscheinlichkeiten durch Abzählen bestimmen." },
      { id:2, level:1, typ:"mc", frage:"Wie berechnet man die Laplace-Wahrscheinlichkeit?", optionen:["günstige/mögliche","mögliche/günstige","günstige·mögliche","günstige-mögliche"], korrekt:0, tipp:"Bruch.", loesungsweg:"Sind alle Ergebnisse gleich wahrscheinlich, verteilt sich die Gesamtwahrscheinlichkeit \\(1\\) gleichmäßig auf sie: $$P = \\frac{\\text{Anzahl der günstigen Ergebnisse}}{\\text{Anzahl aller möglichen Ergebnisse}}$$ Die Voraussetzung der Gleichwahrscheinlichkeit ist entscheidend — bei einem gezinkten Würfel gilt die Formel nicht." },
      { id:3, level:1, typ:"numerisch", frage:"Würfel: Wahrscheinlichkeit für eine 6? (3 Dez)", loesung:0.167, toleranz:0.005, tipp:"\\(1/6\\).", loesungsweg:"Ein Würfel hat sechs gleich wahrscheinliche Augenzahlen, eine davon ist die \\(6\\): $$P = \\frac{1}{6} \\approx 0{,}167$$" },
      { id:4, level:1, typ:"numerisch", frage:"Münzwurf: Wahrscheinlichkeit für Kopf? (1 Dez)", loesung:0.5, toleranz:0.01, tipp:"\\(1/2\\).", loesungsweg:"Zwei gleich wahrscheinliche Ergebnisse, eines davon günstig: $$P = \\frac{1}{2} = 0{,}5$$" },
      { id:5, level:1, typ:"mc", frage:"Welchen Wert hat eine Wahrscheinlichkeit immer?", optionen:["zwischen 0 und 1","größer als 1","negativ","genau 2"], korrekt:0, tipp:"\\(0\\le P\\le 1\\).", loesungsweg:"Eine Wahrscheinlichkeit liegt stets zwischen \\(0\\) (unmögliches Ereignis) und \\(1\\) (sicheres Ereignis): $$0 \\le P \\le 1$$" },
      { id:6, level:1, typ:"numerisch", frage:"Würfel: Wahrscheinlichkeit für eine gerade Zahl? (1 Dez)", loesung:0.5, toleranz:0.01, tipp:"3 von 6 sind gerade.", loesungsweg:"Gerade Augenzahlen sind \\(2\\), \\(4\\) und \\(6\\) — drei von sechs: $$P = \\frac{3}{6} = 0{,}5$$" },
      // ===== LEVEL 2 - leicht: einfacher Würfel / Münze =====
      { id:7, level:2, typ:"numerisch", frage:"Würfel: P für eine Zahl kleiner als 3? (3 Dez)", loesung:0.333, toleranz:0.005, tipp:"Günstig: 1 und 2.", loesungsweg:"Kleiner als \\(3\\) sind die Augenzahlen \\(1\\) und \\(2\\): $$P = \\frac{2}{6} = \\frac13 \\approx 0{,}333$$ Die \\(3\\) selbst zählt nicht mit, weil „kleiner als\" sie ausschließt." },
      { id:8, level:2, typ:"numerisch", frage:"Würfel: P für eine Primzahl (2, 3, 5)? (1 Dez)", loesung:0.5, toleranz:0.01, tipp:"3 Primzahlen.", loesungsweg:"Primzahlen auf dem Würfel sind \\(2\\), \\(3\\) und \\(5\\) — die \\(1\\) ist keine Primzahl: $$P = \\frac{3}{6} = 0{,}5$$" },
      { id:9, level:2, typ:"numerisch", frage:"Glücksrad mit 8 gleichen Feldern: P für ein bestimmtes Feld? (3 Dez)", loesung:0.125, toleranz:0.005, tipp:"\\(1/8\\).", loesungsweg:"Acht gleich große Felder, eines davon günstig: $$P = \\frac{1}{8} = 0{,}125$$" },
      { id:10, level:2, typ:"mc", frage:"Würfel: Wie viele günstige Ergebnisse für „höchstens 4\"?", optionen:["4","3","2","6"], korrekt:0, tipp:"1, 2, 3, 4.", loesungsweg:"„Höchstens 4\" schließt die \\(4\\) ein: \\(\\{1, 2, 3, 4\\}\\) — vier Ergebnisse, also \\(P = \\frac46\\)." },
      { id:11, level:2, typ:"numerisch", frage:"Karten 1 bis 10 ziehen: P für eine durch 5 teilbare Zahl? (1 Dez)", loesung:0.2, toleranz:0.01, tipp:"5 und 10.", loesungsweg:"Durch \\(5\\) teilbar sind \\(5\\) und \\(10\\): $$P = \\frac{2}{10} = 0{,}2$$" },
      { id:12, level:2, typ:"numerisch", frage:"Würfel: P für die Augenzahl 7? (1 Dez)", loesung:0, toleranz:0, tipp:"Unmögliches Ereignis.", loesungsweg:"Die \\(7\\) kommt auf dem Würfel nicht vor — ein <b>unmögliches</b> Ereignis: $$P = \\frac{0}{6} = 0$$" },
      // ===== LEVEL 3 - nervenschonend: Urnen / Kugeln =====
      { id:13, level:3, typ:"numerisch", frage:"Urne: 3 rote, 2 blaue Kugeln. P für rot? (1 Dez)", loesung:0.6, toleranz:0.01, tipp:"\\(3/5\\).", loesungsweg:"Insgesamt \\(3+2 = 5\\) Kugeln, davon \\(3\\) rot: $$P = \\frac{3}{5} = 0{,}6$$" },
      { id:14, level:3, typ:"numerisch", frage:"Urne: 4 weiße, 6 schwarze Kugeln. P für weiß? (1 Dez)", loesung:0.4, toleranz:0.01, tipp:"\\(4/10\\).", loesungsweg:"Insgesamt \\(4+6 = 10\\) Kugeln, davon \\(4\\) weiß: $$P = \\frac{4}{10} = 0{,}4$$" },
      { id:15, level:3, typ:"numerisch", frage:"Tüte: 5 rote, 3 grüne, 2 gelbe Bonbons. P für grün? (1 Dez)", loesung:0.3, toleranz:0.01, tipp:"\\(3/10\\).", loesungsweg:"Insgesamt \\(5+3+2 = 10\\) Bonbons, davon \\(3\\) grün: $$P = \\frac{3}{10} = 0{,}3$$" },
      { id:16, level:3, typ:"mc", frage:"Was ist das Gegenereignis von „mindestens eine 6\"?", optionen:["keine 6","genau eine 6","höchstens eine 6","immer eine 6"], korrekt:0, tipp:"Verneinung.", loesungsweg:"Das Gegenereignis enthält genau die Ergebnisse, die <b>nicht</b> zum Ereignis gehören. „Mindestens eine 6\" heißt eine oder mehr — das Gegenteil ist „<b>keine</b> 6\". „Genau eine\" oder „höchstens eine\" überschneiden sich mit dem Ereignis und sind deshalb keine Gegenereignisse." },
      { id:17, level:3, typ:"numerisch", frage:"Urne mit 12 Kugeln, 9 davon günstig. P? (2 Dez)", loesung:0.75, toleranz:0.01, tipp:"\\(9/12\\).", loesungsweg:"Günstig durch möglich, dann kürzen: $$P = \\frac{9}{12} = \\frac{3}{4} = 0{,}75$$" },
      { id:18, level:3, typ:"numerisch", frage:"P für rot ist 0,3. Wahrscheinlichkeit für 'nicht rot'? (1 Dez)", loesung:0.7, toleranz:0.01, tipp:"\\(1-P\\).", loesungsweg:"Ein Ereignis und sein Gegenereignis ergänzen sich zur Gesamtwahrscheinlichkeit \\(1\\): $$P(\\text{nicht rot}) = 1 - P(\\text{rot}) = 1 - 0{,}3 = 0{,}7$$ Das gilt immer und ist oft der schnellste Weg." },
      // ===== LEVEL 4 - mittel: Modell aus Text, Umkehraufgaben =====
      { id:19, level:4, typ:"numerisch", frage:"In einer Urne liegen 20 Kugeln. Die Wahrscheinlichkeit, eine rote zu ziehen, beträgt 0,35. Wie viele rote Kugeln liegen in der Urne?", loesung:7, toleranz:0, tipp:"Die Laplace-Formel rückwärts lesen.", loesungsweg:"Aus \\(P = \\frac{\\text{günstig}}{\\text{möglich}}\\) folgt $$\\text{günstig} = 0{,}35 \\cdot 20 = 7$$ Also \\(7\\) rote Kugeln — Probe: \\(\\frac{7}{20} = 0{,}35\\) ✓" },
      { id:20, level:4, typ:"numerisch", frage:"Zwei Würfel werden geworfen. Wie groß ist die Wahrscheinlichkeit für die Augensumme 9? (3 Dez)", loesung:0.111, toleranz:0.005, tipp:"Alle Paare mit Summe 9 aufschreiben — die Reihenfolge zählt.", loesungsweg:"Ergebnismenge: \\(6 \\cdot 6 = 36\\) gleich wahrscheinliche Paare. Summe \\(9\\): \\((3,6), (4,5), (5,4), (6,3)\\) — vier Paare: $$P = \\frac{4}{36} = \\frac19 \\approx 0{,}111$$ Wer nur „\\(3+6\\) und \\(4+5\\)\" zählt, vergisst die vertauschten Würfel." },
      { id:21, level:4, typ:"mc", frage:"Aus den elf Buchstaben des Wortes MISSISSIPPI wird einer zufällig gezogen. Welcher Bruch gibt die Wahrscheinlichkeit für ein S an?", optionen:["\\(\\frac{4}{11}\\)","\\(\\frac{1}{4}\\)","\\(\\frac{1}{11}\\)","\\(\\frac{4}{4}\\)"], korrekt:0, tipp:"Günstig sind alle S, möglich sind alle Buchstaben — auch die doppelten.", loesungsweg:"Das Wort hat \\(11\\) Buchstaben (M, I, I, I, I, S, S, S, S, P, P), davon \\(4\\) S: $$P(S) = \\frac{4}{11}$$ \\(\\frac14\\) wäre richtig, wenn nur die vier <b>verschiedenen</b> Buchstaben je einmal gezogen würden — die sind aber nicht gleich wahrscheinlich." },
      { id:22, level:4, typ:"numerisch", frage:"Ein Glücksrad hat 12 gleich große Felder. Wie viele davon müssen blau sein, damit die Wahrscheinlichkeit für „nicht blau\" 0,75 beträgt?", loesung:3, toleranz:0, tipp:"Erst \\(P(\\text{blau})\\) über das Gegenereignis.", loesungsweg:"$$P(\\text{blau}) = 1 - 0{,}75 = 0{,}25$$ Von \\(12\\) Feldern sind also \\(0{,}25 \\cdot 12 = 3\\) blau." },
      { id:23, level:4, typ:"numerisch", frage:"Eine Münze und ein Würfel werden gleichzeitig geworfen. Wie groß ist die Wahrscheinlichkeit für „Kopf und eine gerade Augenzahl\"? (2 Dez)", loesung:0.25, toleranz:0.01, tipp:"Wie viele Kombinationen aus Münzseite und Augenzahl gibt es insgesamt?", loesungsweg:"Ergebnismenge: \\(2 \\cdot 6 = 12\\) gleich wahrscheinliche Paare. Günstig: Kopf mit \\(2\\), \\(4\\) oder \\(6\\) — drei Paare: $$P = \\frac{3}{12} = \\frac14 = 0{,}25$$" },
      { id:24, level:4, typ:"numerisch", frage:"Aus den Zahlen 1 bis 30 wird eine zufällig gezogen. Wie groß ist die Wahrscheinlichkeit, dass sie durch 4 teilbar ist? (3 Dez)", loesung:0.233, toleranz:0.005, tipp:"Zähle die Vielfachen von 4 bis 30.", loesungsweg:"Vielfache von \\(4\\) bis \\(30\\): \\(4, 8, 12, 16, 20, 24, 28\\) — sieben Zahlen: $$P = \\frac{7}{30} \\approx 0{,}233$$" },
      // ===== LEVEL 5 - anspruchsvoll: Fehler finden, zwei Bedingungen, zweischrittig =====
      { id:25, level:5, typ:"mc", frage:"Zwei Münzen werden geworfen. Mila sagt: „Es gibt drei Ergebnisse — zweimal Kopf, zweimal Zahl, einmal jedes. Also ist \\(P(\\text{einmal jedes}) = \\frac13\\).\" Was ist dazu zu sagen?", optionen: ["Richtig — drei Ergebnisse, eines davon passt, also \\(P = \\frac13\\).", "Falsch: Die drei Fälle sind nicht gleich wahrscheinlich; „einmal jedes“ umfasst KZ und ZK, also \\(P = \\frac12\\).", "Falsch: \\(P = \\frac14\\), weil es vier gleich wahrscheinliche Ergebnisse gibt und eines davon passt.", "Falsch: \\(P = \\frac23\\), weil zwei der drei Fälle mindestens einen Kopf enthalten und damit passen."], korrekt:1, tipp:"Sind Milas drei „Ergebnisse\" wirklich gleich wahrscheinlich?", loesungsweg:"Die Laplace-Formel gilt nur für <b>gleich wahrscheinliche</b> Ergebnisse. Die sind hier \\(KK, KZ, ZK, ZZ\\) — vier Stück, jedes mit \\(\\frac14\\). „Einmal jedes\" besteht aus \\(KZ\\) und \\(ZK\\): $$P = \\frac{2}{4} = \\frac12$$ Milas Einteilung fasst zwei Ergebnisse zu einem zusammen und macht die Fälle ungleich wahrscheinlich." },
      { id:26, level:5, typ:"numerisch", frage:"In einer Tüte sind 5 rote, 3 blaue und 2 gelbe Bonbons. Eine gelbe wird herausgenommen und gegessen. Wie groß ist danach die Wahrscheinlichkeit, beim nächsten Griff eine rote zu ziehen? (3 Dez)", loesung:0.556, toleranz:0.005, tipp:"Die Gesamtzahl hat sich geändert.", loesungsweg:"Nach dem Essen sind noch \\(5 + 3 + 1 = 9\\) Bonbons da, die roten sind unverändert \\(5\\): $$P = \\frac{5}{9} \\approx 0{,}556$$ Vorher wären es \\(\\frac{5}{10} = 0{,}5\\) gewesen — der Nenner ist gesunken." },
      { id:27, level:5, typ:"numerisch", frage:"In einer Urne liegen rote und blaue Kugeln, und zwar 4 rote mehr als blaue. Die Wahrscheinlichkeit für blau beträgt 0,4. Wie viele Kugeln liegen insgesamt in der Urne?", loesung:20, toleranz:0, tipp:"Anzahl der blauen Kugeln \\(b\\) — dann sind es \\(b + 4\\) rote.", loesungsweg:"Mit \\(b\\) blauen und \\(b + 4\\) roten Kugeln: $$\\frac{b}{2b + 4} = 0{,}4 \\implies b = 0{,}8b + 1{,}6 \\implies 0{,}2b = 1{,}6 \\implies b = 8$$ Also \\(8\\) blaue, \\(12\\) rote, zusammen \\(20\\). Probe: \\(\\frac{8}{20} = 0{,}4\\) ✓" },
      { id:28, level:5, typ:"mc", frage:"Zwei Würfel. Tim behauptet: „Augensumme 5 und Augensumme 10 sind gleich wahrscheinlich, denn beide haben zwei Zerlegungen: \\(1+4\\), \\(2+3\\) bzw. \\(4+6\\), \\(5+5\\).\" Was ist dazu zu sagen?", optionen: ["Richtig — zwei Zerlegungen hier, zwei Zerlegungen dort, also sind beide Summen gleich wahrscheinlich.", "Falsch: \\((5,5)\\) gibt es nur einmal, \\((4,6)\\) und \\((6,4)\\) zweimal — Summe 5 hat 4 Paare, Summe 10 nur 3.", "Falsch: Beide haben je \\(\\frac{2}{36}\\), weil jede Zerlegung genau einem der 36 Paare entspricht.", "Falsch: Summe 10 ist häufiger, weil die beteiligten Zahlen größer sind und öfter gewürfelt werden."], korrekt:1, tipp:"Zähle die Paare \\((\\text{1. Würfel}, \\text{2. Würfel})\\), nicht die Zerlegungen.", loesungsweg:"Gleich wahrscheinlich sind die \\(36\\) <b>Paare</b>. Summe \\(5\\): \\((1,4), (4,1), (2,3), (3,2)\\) — vier Paare, \\(P = \\frac{4}{36}\\). Summe \\(10\\): \\((4,6), (6,4), (5,5)\\) — nur drei, \\(P = \\frac{3}{36}\\). Ein Pasch wie \\((5,5)\\) lässt sich nicht vertauschen und zählt deshalb nur einmal." },
      { id:29, level:5, typ:"numerisch", frage:"Zwei Würfel werden geworfen. Wie groß ist die Wahrscheinlichkeit für „Augensumme mindestens 6\"? (3 Dez)", loesung:0.722, toleranz:0.005, tipp:"Das Gegenereignis hat weniger Fälle.", loesungsweg:"Gegenereignis „Summe höchstens \\(5\\)\": Summe \\(2\\): 1 Paar, \\(3\\): 2, \\(4\\): 3, \\(5\\): 4 — zusammen \\(10\\) von \\(36\\). $$P = 1 - \\frac{10}{36} = \\frac{26}{36} \\approx 0{,}722$$" },
      { id:30, level:5, typ:"numerisch", frage:"In einer Klasse sind 12 Mädchen und 8 Jungen. 5 der Mädchen und 2 der Jungen tragen eine Brille. Ein Kind wird ausgelost. Wie groß ist die Wahrscheinlichkeit, dass es ein Junge <b>ohne</b> Brille ist? (1 Dez)", loesung:0.3, toleranz:0.01, tipp:"Erst die günstigen Kinder abzählen.", loesungsweg:"Jungen ohne Brille: \\(8 - 2 = 6\\). Insgesamt \\(20\\) Kinder: $$P = \\frac{6}{20} = 0{,}3$$" },
      // ===== LEVEL 6 - wagnerisch: Behauptungen prüfen, Sonderfälle, Mengen =====
      { id:31, level:6, typ:"mc", frage:"Behauptung: „Beim Werfen zweier Würfel ist jede Augensumme von 2 bis 12 gleich wahrscheinlich, also je \\(\\frac{1}{11}\\).\" Stimmt das?", optionen: ["Ja — es gibt elf mögliche Summen, und jede davon ist ein Ergebnis wie jedes andere auch.", "Nein — gleich wahrscheinlich sind die 36 Paare, nicht die Summen; die 7 ist mit \\(\\frac{6}{36}\\) am häufigsten.", "Nein — es gibt zwölf Summen von 1 bis 12, also je \\(\\frac{1}{12}\\) statt \\(\\frac{1}{11}\\).", "Ja, aber nur, wenn die Würfel unterscheidbar sind — sonst zählen manche Summen doppelt."], korrekt:1, tipp:"Auf wie viele Arten entsteht die Summe 2, auf wie viele die Summe 7?", loesungsweg:"Die Laplace-Annahme gilt für die \\(36\\) Paare. Summe \\(2\\) entsteht nur durch \\((1,1)\\), Summe \\(7\\) durch sechs Paare: $$P(2) = \\frac{1}{36}, \\qquad P(7) = \\frac{6}{36}$$ Die Summen sind also <b>nicht</b> gleich wahrscheinlich — die Laplace-Formel darf nicht auf die Summen angewendet werden." },
      { id:32, level:6, typ:"numerisch", frage:"Ein Glücksrad hat lauter gleich große Felder, drei davon sind Gewinnfelder. Die Gewinnwahrscheinlichkeit beträgt 0,12. Wie viele Felder hat das Rad?", loesung:25, toleranz:0, tipp:"Günstig ist bekannt, möglich ist gesucht.", loesungsweg:"$$\\frac{3}{n} = 0{,}12 \\implies n = \\frac{3}{0{,}12} = 25$$ Das Rad hat \\(25\\) Felder." },
      { id:33, level:6, typ:"numerisch", frage:"Ein Würfel wird einmal geworfen. \\(A\\): „Augenzahl ist eine Primzahl\", \\(B\\): „Augenzahl ist gerade\". Wie groß ist \\(P(A \\cup B)\\), also die Wahrscheinlichkeit, dass \\(A\\) <b>oder</b> \\(B\\) eintritt? (3 Dez)", loesung:0.833, toleranz:0.005, tipp:"Schreibe beide Mengen auf — eine Zahl liegt in beiden.", loesungsweg:"\\(A = \\{2, 3, 5\\}\\), \\(B = \\{2, 4, 6\\}\\). Die Vereinigung ist $$A \\cup B = \\{2, 3, 4, 5, 6\\}$$ — fünf Zahlen, weil die \\(2\\) nur einmal zählt: $$P(A \\cup B) = \\frac{5}{6} \\approx 0{,}833$$ Einfach \\(\\frac36 + \\frac36 = 1\\) zu rechnen wäre falsch — die \\(2\\) würde doppelt gezählt." },
      { id:34, level:6, typ:"mc", frage:"Behauptung: „Beim Lotto ist die Reihe 1, 2, 3, 4, 5, 6 unwahrscheinlicher als 3, 17, 22, 28, 41, 45, weil so eine geordnete Reihe fast nie kommt.\" Stimmt das?", optionen: ["Ja — geordnete Reihen sind seltener, weil die Kugeln vor der Ziehung zufällig gemischt werden.", "Nein — bei einer Laplace-Ziehung ist jede Sechser-Kombination gleich wahrscheinlich; die zweite wirkt nur zufälliger.", "Nein — die Reihe 1 bis 6 ist sogar wahrscheinlicher, weil kleine Zahlen öfter gezogen werden als große.", "Das hängt von der Ziehungsmaschine ab — manche mischen die Kugeln besser durch als andere."], korrekt:1, tipp:"Weiß die Ziehungsmaschine, welche Zahlen „geordnet\" aussehen?", loesungsweg:"Jede einzelne Kugel wird mit gleicher Wahrscheinlichkeit gezogen, und die Maschine kennt keine Muster. Deshalb ist jede feste Sechser-Kombination gleich wahrscheinlich — \\(1\\) bis \\(6\\) genauso wie jede andere. Dass „geordnete\" Reihen selten <b>erscheinen</b>, liegt nur daran, dass es viel mehr ungeordnet aussehende Kombinationen gibt, nicht daran, dass eine bestimmte davon wahrscheinlicher wäre." },
      { id:35, level:6, typ:"numerisch", frage:"In einer Urne liegen 6 rote und einige blaue Kugeln. Wie viele blaue müssen es sein, damit die Wahrscheinlichkeit für rot genau \\(\\frac14\\) beträgt?", loesung:18, toleranz:0, tipp:"Die roten sind ein Viertel — was ist dann der Rest?", loesungsweg:"Mit \\(x\\) blauen Kugeln: $$\\frac{6}{6 + x} = \\frac14 \\implies 24 = 6 + x \\implies x = 18$$ Die \\(6\\) roten sind ein Viertel von \\(24\\), die \\(18\\) blauen die übrigen drei Viertel." },
      { id:36, level:6, typ:"numerisch", frage:"Zwei Würfel werden geworfen. \\(A\\): „Augensumme 7\", \\(B\\): „Pasch\". Wie groß ist \\(P(A \\cap B)\\), also die Wahrscheinlichkeit, dass <b>beides</b> zugleich eintritt? (Dezimalzahl)", loesung:0, toleranz:0, tipp:"Kann ein Pasch die Summe 7 haben?", loesungsweg:"Ein Pasch \\((k, k)\\) hat die Summe \\(2k\\), also immer eine <b>gerade</b> Zahl. Die \\(7\\) ist ungerade — kein Paar liegt in beiden Mengen: $$A \\cap B = \\{\\} \\implies P(A \\cap B) = 0$$ Die Ereignisse sind unvereinbar, obwohl beide einzeln die Wahrscheinlichkeit \\(\\frac{6}{36}\\) haben." }];
    </script>

</body>
