<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geraden im Raum - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-geraden-raum';
    const THEMA_CONFIG = { name: 'Geraden im Raum', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Parameterform einer Geraden \\(g\\):", optionen: ["\\(\\vec x = \\vec a \\cdot \\vec u\\)", "\\(\\vec x = \\vec a + t \\cdot \\vec u\\)", "\\(\\vec x = t\\vec a\\)", "\\(\\vec x = \\vec a - \\vec u\\)"], korrekt: 1, tipp: "Aufpunkt + t · Richtungsvektor.", loesungsweg: "$$g: \\vec x = \\vec a + t \\cdot \\vec u$$" },
      { id: 2, level: 1, typ: "mc", frage: "Bei \\(g: \\vec x = \\vec a + t \\vec u\\) ist \\(\\vec u\\) der:", optionen: ["Ortsvektor", "Richtungsvektor", "Aufpunkt", "Normalenvektor"], korrekt: 1, tipp: "Zeigt die Richtung an.", loesungsweg: "\\(\\vec u\\) ist der <b>Richtungsvektor</b>." },
      { id: 3, level: 1, typ: "mc", frage: "Eine Gerade durch \\(A(1|2|3)\\) und \\(B(4|5|6)\\). Ein Richtungsvektor ist:", optionen: ["\\(\\vec{AB}\\)", "\\(\\vec{OA}\\)", "\\(\\vec{OB}\\)", "\\(\\vec 0\\)"], korrekt: 0, tipp: "Von A nach B.", loesungsweg: "\\(\\vec u = \\vec{AB} = B - A = \\begin{pmatrix}3\\\\3\\\\3\\end{pmatrix}\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix} + t \\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}\\). Erste Komponente des Punktes für \\(t=2\\):", loesung: 3, toleranz: 0, tipp: "\\(1 + 2 \\cdot 1\\).", loesungsweg: "Punkt: \\((3|2|2)\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Ein Richtungsvektor \\(\\vec u\\) darf sein:", optionen: ["Nullvektor", "jeder Vektor außer \\(\\vec 0\\)", "nur Einheitsvektor", "nur ganzzahlige Komponenten"], korrekt: 1, tipp: "Nur nicht \\(\\vec 0\\).", loesungsweg: "Richtungsvektor muss \\(\\neq \\vec 0\\) sein." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}2\\\\0\\\\1\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\) für \\(t=0\\). Dritte Komponente:", loesung: 1, toleranz: 0, tipp: "\\(t=0\\) → Aufpunkt.", loesungsweg: "Aufpunkt \\((2|0|1)\\)." },
      // LEVEL 2 -- Punktprobe
      { id: 7, level: 2, typ: "mc", frage: "Liegt \\(P(3|2|3)\\) auf \\(g: \\vec x = \\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\)?", optionen: ["Ja, \\(t=2\\)", "Nein", "Ja, \\(t=1\\)", "Ja, \\(t=3\\)"], korrekt: 0, tipp: "Setze gleich und prüfe jedes \\(t\\).", loesungsweg: "\\(1+t=3 \\Rightarrow t=2\\). Probe: \\(0+2=2 \\checkmark\\), \\(1+2=3 \\checkmark\\). Ja, \\(t=2\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Liegt \\(P(4|4|4)\\) auf \\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\)?", optionen: ["Ja, \\(t=4\\)", "Nein", "Ja, \\(t=2\\)", "Ja, \\(t=0\\)"], korrekt: 0, tipp: "\\(t=4\\) liefert \\((4|4|4)\\).", loesungsweg: "\\(\\vec x(4) = \\begin{pmatrix}4\\\\4\\\\4\\end{pmatrix}\\). Ja, \\(t=4\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Für welches \\(t\\) liegt \\(P(5|3|7)\\) auf \\(g: \\vec x = \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}+t\\begin{pmatrix}2\\\\1\\\\3\\end{pmatrix}\\)?", loesung: 2, toleranz: 0, tipp: "\\(1+2t=5\\).", loesungsweg: "\\(1+2t=5 \\Rightarrow t=2\\). Probe: \\(1+2=3, 1+6=7 \\checkmark\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Liegt \\(P(2|3|0)\\) auf \\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\)?", optionen: ["Ja", "Nein", "Nur wenn \\(t>0\\)", "Nicht entscheidbar"], korrekt: 1, tipp: "Komponenten müssen zu <b>einem</b> \\(t\\) passen.", loesungsweg: "\\(t=2\\) aus erster, \\(t=3\\) aus zweiter. Widerspruch, also Nein." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}+t\\begin{pmatrix}2\\\\0\\\\3\\end{pmatrix}\\). Für welches \\(t\\) ist Höhe (3. Komp.) = 6?", loesung: 2, toleranz: 0, tipp: "\\(0+3t=6\\).", loesungsweg: "\\(3t = 6 \\Rightarrow t = 2\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Was ist keine gültige Geradendarstellung?", optionen: ["\\(\\vec x = \\vec a + t\\vec u\\)", "\\(\\vec x = \\vec b + s\\vec u\\) mit \\(B\\) auf \\(g\\)", "\\(\\vec x = \\vec a + t\\vec 0\\)", "\\(\\vec x = \\vec a + t(2\\vec u)\\)"], korrekt: 2, tipp: "Richtungsvektor \\(\\neq \\vec 0\\).", loesungsweg: "Mit \\(\\vec 0\\) bekommt man keinen Punkt außer \\(\\vec a\\) — keine Gerade." },
      // LEVEL 3 -- Lagebeziehung
      { id: 13, level: 3, typ: "mc", frage: "Zwei Geraden sind <b>parallel</b>, wenn:", optionen: ["sie sich schneiden", "ihre Richtungsvektoren kollinear sind", "Aufpunkte gleich sind", "sie windschief sind"], korrekt: 1, tipp: "Richtungsvektoren parallel.", loesungsweg: "\\(g \\parallel h \\iff \\vec u_g \\parallel \\vec u_h\\)." },
      { id: 14, level: 3, typ: "mc", frage: "Zwei Geraden sind <b>identisch</b>, wenn:", optionen: ["sie parallel sind", "sie parallel sind und <b>ein</b> gemeinsamer Punkt existiert", "sie sich schneiden", "nie"], korrekt: 1, tipp: "Parallel + Punkt der einen auf anderer.", loesungsweg: "Parallele Geraden mit gemeinsamem Punkt sind identisch." },
      { id: 15, level: 3, typ: "mc", frage: "Zwei nicht-parallele Geraden, die sich nicht schneiden, heißen:", optionen: ["parallel", "identisch", "windschief", "orthogonal"], korrekt: 2, tipp: "Typisch im Raum.", loesungsweg: "<b>Windschiefe</b> Geraden: nicht parallel, kein Schnittpunkt." },
      { id: 16, level: 3, typ: "mc", frage: "\\(g: \\vec u_g = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\), \\(h: \\vec u_h = \\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}\\). Beziehung?", optionen: ["parallel oder identisch", "windschief", "schneiden sich garantiert", "orthogonal"], korrekt: 0, tipp: "\\(\\vec u_h = 2\\vec u_g\\).", loesungsweg: "Richtungsvektoren kollinear → parallel oder identisch." },
      { id: 17, level: 3, typ: "mc", frage: "\\(\\vec u_g = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\), \\(\\vec u_h = \\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\). Kollinear?", optionen: ["Ja", "Nein", "Nur wenn beide skalar sind", "Unentscheidbar"], korrekt: 1, tipp: "Kein Faktor möglich.", loesungsweg: "Keine Zahl \\(r\\) bringt \\(\\vec u_g\\) in \\(\\vec u_h\\). Nicht kollinear." },
      { id: 18, level: 3, typ: "numerisch", frage: "Für welches \\(k\\) ist \\(\\vec u_h = \\begin{pmatrix}k\\\\6\\\\9\\end{pmatrix}\\) parallel zu \\(\\vec u_g = \\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}\\)?", loesung: 3, toleranz: 0, tipp: "Faktor \\(\\frac{3}{2}\\).", loesungsweg: "\\(\\vec u_h = \\tfrac{3}{2}\\vec u_g\\), also \\(k = \\tfrac{3}{2} \\cdot 2 = 3\\)." },
      // LEVEL 4 -- Schnittpunkt
      { id: 19, level: 4, typ: "mc", frage: "Schnittpunkt zweier Geraden finden:", optionen: ["Parametergleichsetzen, LGS lösen", "Richtungsvektoren addieren", "Aufpunkte halbieren", "Gar nicht möglich"], korrekt: 0, tipp: "LGS mit 2 Parametern.", loesungsweg: "Setze \\(\\vec a_g + t\\vec u_g = \\vec a_h + s\\vec u_h\\) und löse." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(g: \\vec x = t\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\), \\(h: \\vec x = \\begin{pmatrix}2\\\\0\\\\0\\end{pmatrix} + s\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\). Schnittpunkt \\(S\\). Erste Koord.:", loesung: 2, toleranz: 0, tipp: "\\(y=0 \\Rightarrow s=0\\). Dann \\(t=2\\).", loesungsweg: "\\(s=0\\), \\(t=2\\), \\(S=(2|0|0)\\)." },
      { id: 21, level: 4, typ: "mc", frage: "Wie prüft man, ob Geraden windschief sind?", optionen: ["Richtungsvektoren und Punktprobe", "Nur Aufpunkte vergleichen", "Nur Beträge", "Immer per Formel"], korrekt: 0, tipp: "Nicht parallel + kein Schnittpunkt.", loesungsweg: "Richtungsvektoren nicht kollinear + LGS hat keine Lösung → windschief." },
      { id: 22, level: 4, typ: "numerisch", frage: "Gesucht ist \\(t\\), sodass \\(\\vec x(t) = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\) den Punkt \\((3|2|2)\\) liefert.", loesung: 2, toleranz: 0, tipp: "\\(1+t=3\\).", loesungsweg: "\\(t = 2\\)." },
      { id: 23, level: 4, typ: "mc", frage: "\\(g: \\vec x = t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\), \\(h: \\vec x = \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix} + s\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\). Lagebeziehung?", optionen: ["identisch", "parallel", "windschief", "schneiden sich in einem Punkt"], korrekt: 0, tipp: "\\((1|1|1)\\) liegt auf \\(g\\) (\\(t=1\\)).", loesungsweg: "Richtungsvektoren gleich + \\((1|1|1) \\in g\\) → identisch." },
      { id: 24, level: 4, typ: "mc", frage: "\\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\), \\(h: \\vec x = \\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}+s\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\). Lage?", optionen: ["identisch", "parallel", "windschief", "schneiden sich"], korrekt: 1, tipp: "Richtungsvektoren gleich, aber \\((0|1|0) \\notin g\\).", loesungsweg: "Parallel, aber nicht identisch." },
      // LEVEL 5 -- Spurpunkte
      { id: 25, level: 5, typ: "mc", frage: "Spurpunkt mit der \\(xy\\)-Ebene ist der Punkt mit:", optionen: ["\\(x=0\\)", "\\(y=0\\)", "\\(z=0\\)", "\\(x=y=z\\)"], korrekt: 2, tipp: "\\(xy\\)-Ebene: \\(z=0\\).", loesungsweg: "Punkt auf \\(xy\\)-Ebene hat \\(z = 0\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\2\\\\4\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\-2\\end{pmatrix}\\). Spurpunkt mit \\(xy\\)-Ebene: erste Koord.", loesung: 3, toleranz: 0, tipp: "\\(4 - 2t = 0 \\Rightarrow t=2\\).", loesungsweg: "\\(t=2\\): \\(\\vec x = (3|4|0)\\). Erste Koord: 3." },
      { id: 27, level: 5, typ: "numerisch", frage: "\\(g\\) schneidet \\(xz\\)-Ebene: \\(g: \\vec x = \\begin{pmatrix}0\\\\4\\\\1\\end{pmatrix}+t\\begin{pmatrix}1\\\\-2\\\\0\\end{pmatrix}\\). Wert von \\(t\\):", loesung: 2, toleranz: 0, tipp: "\\(y=0 \\Rightarrow 4-2t=0\\).", loesungsweg: "\\(t=2\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Spurpunkt von \\(g: \\vec x = \\begin{pmatrix}2\\\\0\\\\3\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\) mit \\(xy\\)-Ebene. Zweite Koord.:", loesung: -3, toleranz: 0, tipp: "\\(z=0 \\Rightarrow t=-3\\).", loesungsweg: "\\(t=-3\\): \\(\\vec x = (-1|-3|0)\\)." },
      { id: 29, level: 5, typ: "mc", frage: "Wenn Richtungsvektor in \\(xy\\)-Ebene liegt (\\(z\\)-Komp.=0) und Aufpunkt \\(z\\neq 0\\):", optionen: ["Gerade liegt parallel zur \\(xy\\)-Ebene", "Schneidet \\(xy\\)-Ebene immer", "Ist die \\(xy\\)-Ebene", "liegt in \\(z\\)-Achse"], korrekt: 0, tipp: "\\(z\\) bleibt konstant.", loesungsweg: "Da \\(z\\) konstant \\(\\neq 0\\) bleibt, Gerade parallel zur \\(xy\\)-Ebene." },
      { id: 30, level: 5, typ: "numerisch", frage: "Gerade \\(g\\) durch \\(A(1|1|1)\\) mit Richtung \\(\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}\\). Spurpunkt \\(xy\\)-Ebene: dritte Koord.:", loesung: 0, toleranz: 0, tipp: "Definition xy-Ebene.", loesungsweg: "\\(z=0 \\Rightarrow t=-1\\). Punkt \\((1|1|0)\\)." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "Gerade durch \\(A(1|2|3)\\) und \\(B(4|6|7)\\). Länge der Strecke \\(AB\\):", loesung: 6.403, toleranz: 0.05, tipp: "\\(|\\vec{AB}| = \\sqrt{9+16+16}\\).", loesungsweg: "\\(\\sqrt{41} \\approx 6{,}40\\)." },
      { id: 32, level: 6, typ: "mc", frage: "Abitur: \\(g\\) und \\(h\\) sind windschief. Ihre Lagebeziehung kann man auch so ausdrücken:", optionen: ["Sie liegen in einer Ebene", "Sie liegen <b>nicht</b> in einer gemeinsamen Ebene", "Sie sind orthogonal", "Sie schneiden sich"], korrekt: 1, tipp: "Windschief ↔ keine gemeinsame Ebene.", loesungsweg: "Windschiefe Geraden liegen nicht in einer gemeinsamen Ebene." },
      { id: 33, level: 6, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}\\). Für welches \\(t>0\\) hat der Punkt Abstand 9 vom Ursprung?", loesung: 3, toleranz: 0.01, tipp: "\\(|t \\vec u| = |t| \\cdot 3 = 9\\).", loesungsweg: "\\(|\\vec u|=3, |t|\\cdot 3 = 9 \\Rightarrow t=3\\) (positiv)." },
      { id: 34, level: 6, typ: "mc", frage: "\\(g: \\vec x = A + t\\vec{AB}\\). Für \\(t=\\frac{1}{2}\\) liefert dies:", optionen: ["den Punkt \\(A\\)", "den Punkt \\(B\\)", "den Mittelpunkt von \\(AB\\)", "einen Punkt außerhalb"], korrekt: 2, tipp: "Halbweg von A nach B.", loesungsweg: "\\(t=\\tfrac{1}{2}\\) → Mittelpunkt der Strecke \\(AB\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Gerade \\(g: \\vec x = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix} + t\\begin{pmatrix}2\\\\1\\\\2\\end{pmatrix}\\). Für welches \\(t\\) gilt \\(y=0\\)?", loesung: -2, toleranz: 0, tipp: "\\(2+t=0 \\Rightarrow t=-2\\).", loesungsweg: "\\(2+t=0 \\Rightarrow t=-2\\). Probe \\(z\\): \\(3+2\\cdot(-2)=-1 \\neq 0\\), also kein Schnitt mit \\(x\\)-Achse." },
      { id: 36, level: 6, typ: "numerisch", frage: "Abstand Punkt-Gerade: \\(P(3|0|0)\\), \\(g: \\vec x = t\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\) (\\(x\\)-Achse). Abstand:", loesung: 0, toleranz: 0, tipp: "\\(P\\) liegt auf der \\(x\\)-Achse.", loesungsweg: "\\(P=(3|0|0)\\) liegt auf \\(g\\) (\\(t=3\\)). Abstand \\(= 0\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
