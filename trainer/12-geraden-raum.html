    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-geraden-raum';
    const THEMA_CONFIG = { name: 'Geraden im Raum', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Parameterform einer Geraden \\(g\\):", optionen: ["\\(\\vec x = \\vec a \\cdot \\vec u\\)", "\\(\\vec x = \\vec a + t \\cdot \\vec u\\)", "\\(\\vec x = t\\vec a\\)", "\\(\\vec x = \\vec a - \\vec u\\)"], korrekt: 1, tipp: "Aufpunkt + t · Richtungsvektor.", loesungsweg: "Eine Gerade ist festgelegt durch einen Punkt, an dem sie vorbeikommt, und eine Richtung: $$g: \\vec x = \\vec a + t \\cdot \\vec u, \\quad t \\in \\mathbb{R}$$ Der Parameter \\(t\\) durchläuft alle reellen Zahlen; jeder Wert liefert genau einen Punkt der Geraden. Ein <b>Produkt</b> zweier Vektoren ergäbe dagegen gar keinen Punkt." },
      { id: 2, level: 1, typ: "mc", frage: "Bei \\(g: \\vec x = \\vec a + t \\vec u\\) ist \\(\\vec u\\) der:", optionen: ["Ortsvektor", "Richtungsvektor", "Aufpunkt", "Normalenvektor"], korrekt: 1, tipp: "Zeigt die Richtung an.", loesungsweg: "\\(\\vec a\\) führt vom Ursprung zu einem festen Punkt der Geraden (Stütz- oder Ortsvektor); \\(\\vec u\\) gibt an, in welche Richtung es von dort aus weitergeht — es ist der <b>Richtungsvektor</b>. Er ist nicht eindeutig: Jedes Vielfache \\(k\\vec u\\) mit \\(k \\ne 0\\) beschreibt dieselbe Gerade." },
      { id: 3, level: 1, typ: "mc", frage: "Eine Gerade durch \\(A(1|2|3)\\) und \\(B(4|5|6)\\). Ein Richtungsvektor ist:", optionen: ["\\(\\vec{AB}\\)", "\\(\\vec{OA}\\)", "\\(\\vec{OB}\\)", "\\(\\vec 0\\)"], korrekt: 0, tipp: "Von A nach B.", loesungsweg: "\\(\\vec u = \\vec{AB} = B - A = \\begin{pmatrix}3\\\\3\\\\3\\end{pmatrix}\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix} + t \\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}\\). Erste Komponente des Punktes für \\(t=2\\):", loesung: 3, toleranz: 0, tipp: "\\(1 + 2 \\cdot 1\\).", loesungsweg: "Einsetzen von \\(t = 2\\): $$\\vec x(2) = \\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix} + 2\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix} = \\begin{pmatrix}3\\\\2\\\\2\\end{pmatrix}$$ Die erste Komponente ist \\(1 + 2 \\cdot 1 = 3\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Ein Richtungsvektor \\(\\vec u\\) darf sein:", optionen: ["Nullvektor", "jeder Vektor außer \\(\\vec 0\\)", "nur Einheitsvektor", "nur ganzzahlige Komponenten"], korrekt: 1, tipp: "Nur nicht \\(\\vec 0\\).", loesungsweg: "Der Richtungsvektor darf alles sein — nur nicht der Nullvektor: $$\\vec u \\ne \\vec 0$$ Denn mit \\(\\vec u = \\vec 0\\) läge für jedes \\(t\\) derselbe Punkt \\(\\vec a\\) vor; es entstünde keine Gerade, sondern ein einzelner Punkt. Ganzzahlige Komponenten oder die Länge \\(1\\) sind dagegen nicht verlangt." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}2\\\\0\\\\1\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\) für \\(t=0\\). Dritte Komponente:", loesung: 1, toleranz: 0, tipp: "\\(t=0\\) → Aufpunkt.", loesungsweg: "Für \\(t = 0\\) verschwindet der Richtungsanteil, übrig bleibt der Aufpunkt: $$\\vec x(0) = \\begin{pmatrix}2\\\\0\\\\1\\end{pmatrix}$$ Die dritte Komponente ist \\(1\\). Der Stützvektor ist also stets der Punkt, den man für \\(t = 0\\) erhält." },
      // LEVEL 2 -- Punktprobe
      { id: 7, level: 2, typ: "mc", frage: "Liegt \\(P(3|2|3)\\) auf \\(g: \\vec x = \\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\)?", optionen: ["Ja, \\(t=2\\)", "Nein", "Ja, \\(t=1\\)", "Ja, \\(t=3\\)"], korrekt: 0, tipp: "Setze gleich und prüfe jedes \\(t\\).", loesungsweg: "\\(1+t=3 \\Rightarrow t=2\\). Probe: \\(0+2=2 \\checkmark\\), \\(1+2=3 \\checkmark\\). Ja, \\(t=2\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Liegt \\(P(4|4|4)\\) auf \\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\)?", optionen: ["Ja, \\(t=4\\)", "Nein", "Ja, \\(t=2\\)", "Ja, \\(t=0\\)"], korrekt: 0, tipp: "\\(t=4\\) liefert \\((4|4|4)\\).", loesungsweg: "\\(\\vec x(4) = \\begin{pmatrix}4\\\\4\\\\4\\end{pmatrix}\\). Ja, \\(t=4\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Für welches \\(t\\) liegt \\(P(5|3|7)\\) auf \\(g: \\vec x = \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}+t\\begin{pmatrix}2\\\\1\\\\3\\end{pmatrix}\\)?", loesung: 2, toleranz: 0, tipp: "\\(1+2t=5\\).", loesungsweg: "\\(1+2t=5 \\Rightarrow t=2\\). Probe: \\(1+2=3, 1+6=7 \\checkmark\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Liegt \\(P(2|3|0)\\) auf \\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\)?", optionen: ["Ja", "Nein", "Nur wenn \\(t>0\\)", "Nicht entscheidbar"], korrekt: 1, tipp: "Komponenten müssen zu <b>einem</b> \\(t\\) passen.", loesungsweg: "\\(t=2\\) aus erster, \\(t=3\\) aus zweiter. Widerspruch, also Nein." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}+t\\begin{pmatrix}2\\\\0\\\\3\\end{pmatrix}\\). Für welches \\(t\\) ist Höhe (3. Komp.) = 6?", loesung: 2, toleranz: 0, tipp: "\\(0+3t=6\\).", loesungsweg: "\\(3t = 6 \\Rightarrow t = 2\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Was ist keine gültige Geradendarstellung?", optionen: ["\\(\\vec x = \\vec a + t\\vec u\\)", "\\(\\vec x = \\vec b + s\\vec u\\) mit \\(B\\) auf \\(g\\)", "\\(\\vec x = \\vec a + t\\vec 0\\)", "\\(\\vec x = \\vec a + t(2\\vec u)\\)"], korrekt: 2, tipp: "Richtungsvektor \\(\\neq \\vec 0\\).", loesungsweg: "Mit \\(\\vec 0\\) bekommt man keinen Punkt außer \\(\\vec a\\) — keine Gerade." },
      // LEVEL 3 -- Lagebeziehung
      { id: 13, level: 3, typ: "mc", frage: "Zwei Geraden sind <b>parallel</b>, wenn:", optionen: ["sie sich schneiden", "ihre Richtungsvektoren kollinear sind", "Aufpunkte gleich sind", "sie windschief sind"], korrekt: 1, tipp: "Richtungsvektoren parallel.", loesungsweg: "Parallelität hängt allein von der Richtung ab: Zwei Geraden sind genau dann parallel, wenn ihre Richtungsvektoren <b>kollinear</b> sind, also $$\\vec u_h = k \\cdot \\vec u_g \\quad\\text{für ein } k \\ne 0$$ Ob sie zusätzlich identisch sind, entscheidet erst die Punktprobe mit einem Aufpunkt." },
      { id: 14, level: 3, typ: "mc", frage: "Zwei Geraden sind <b>identisch</b>, wenn:", optionen: ["sie parallel sind", "sie parallel sind und <b>ein</b> gemeinsamer Punkt existiert", "sie sich schneiden", "nie"], korrekt: 1, tipp: "Parallel + Punkt der einen auf anderer.", loesungsweg: "Parallele Geraden mit gemeinsamem Punkt sind identisch." },
      { id: 15, level: 3, typ: "mc", frage: "Zwei nicht-parallele Geraden, die sich nicht schneiden, heißen:", optionen: ["parallel", "identisch", "windschief", "orthogonal"], korrekt: 2, tipp: "Typisch im Raum.", loesungsweg: "<b>Windschiefe</b> Geraden: nicht parallel, kein Schnittpunkt." },
      { id: 16, level: 3, typ: "mc", frage: "\\(g: \\vec u_g = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\), \\(h: \\vec u_h = \\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}\\). Beziehung?", optionen: ["parallel oder identisch", "windschief", "schneiden sich garantiert", "orthogonal"], korrekt: 0, tipp: "\\(\\vec u_h = 2\\vec u_g\\).", loesungsweg: "Richtungsvektoren kollinear → parallel oder identisch." },
      { id: 17, level: 3, typ: "mc", frage: "\\(\\vec u_g = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\), \\(\\vec u_h = \\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\). Kollinear?", optionen: ["Ja", "Nein", "Nur wenn beide skalar sind", "Unentscheidbar"], korrekt: 1, tipp: "Kein Faktor möglich.", loesungsweg: "Keine Zahl \\(r\\) bringt \\(\\vec u_g\\) in \\(\\vec u_h\\). Nicht kollinear." },
      { id: 18, level: 3, typ: "numerisch", frage: "Für welches \\(k\\) ist \\(\\vec u_h = \\begin{pmatrix}k\\\\6\\\\9\\end{pmatrix}\\) parallel zu \\(\\vec u_g = \\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}\\)?", loesung: 3, toleranz: 0, tipp: "Faktor \\(\\frac{3}{2}\\).", loesungsweg: "\\(\\vec u_h = \\tfrac{3}{2}\\vec u_g\\), also \\(k = \\tfrac{3}{2} \\cdot 2 = 3\\)." },
      // LEVEL 4 -- Schnittpunkt
      { id: 19, level: 4, typ: "mc", frage: "Schnittpunkt zweier Geraden finden:", optionen: ["Parametergleichsetzen, LGS lösen", "Richtungsvektoren addieren", "Aufpunkte halbieren", "Gar nicht möglich"], korrekt: 0, tipp: "LGS mit 2 Parametern.", loesungsweg: "Beide Parameterdarstellungen beschreiben denselben Punkt, wenn $$\\vec a_g + t\\vec u_g = \\vec a_h + s\\vec u_h$$ Komponentenweise entsteht daraus ein lineares Gleichungssystem mit den beiden Unbekannten \\(t\\) und \\(s\\) und drei Gleichungen. Zwei Gleichungen liefern \\(t\\) und \\(s\\); mit der <b>dritten</b> muss die Probe gemacht werden — geht sie nicht auf, sind die Geraden windschief." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(g: \\vec x = t\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\), \\(h: \\vec x = \\begin{pmatrix}2\\\\0\\\\0\\end{pmatrix} + s\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\). Schnittpunkt \\(S\\). Erste Koord.:", loesung: 2, toleranz: 0, tipp: "\\(y=0 \\Rightarrow s=0\\). Dann \\(t=2\\).", loesungsweg: "\\(s=0\\), \\(t=2\\), \\(S=(2|0|0)\\)." },
      { id: 21, level: 4, typ: "mc", frage: "Wie prüft man, ob Geraden windschief sind?", optionen: ["Richtungsvektoren und Punktprobe", "Nur Aufpunkte vergleichen", "Nur Beträge", "Immer per Formel"], korrekt: 0, tipp: "Nicht parallel + kein Schnittpunkt.", loesungsweg: "Richtungsvektoren nicht kollinear + LGS hat keine Lösung → windschief." },
      { id: 22, level: 4, typ: "numerisch", frage: "Gesucht ist \\(t\\), sodass \\(\\vec x(t) = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\) den Punkt \\((3|2|2)\\) liefert.", loesung: 2, toleranz: 0, tipp: "\\(1+t=3\\).", loesungsweg: "Die erste Komponente genügt zur Bestimmung: $$1 + t = 3 \\;\\Rightarrow\\; t = 2$$ Probe mit den übrigen Komponenten: \\(0+2 = 2\\) ✓ und \\(0+2 = 2\\) ✓ — der Punkt liegt also tatsächlich auf der Geraden. Ohne diese Probe wäre nur gezeigt, dass eine Komponente passt." },
      { id: 23, level: 4, typ: "mc", frage: "\\(g: \\vec x = t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\), \\(h: \\vec x = \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix} + s\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\). Lagebeziehung?", optionen: ["identisch", "parallel", "windschief", "schneiden sich in einem Punkt"], korrekt: 0, tipp: "\\((1|1|1)\\) liegt auf \\(g\\) (\\(t=1\\)).", loesungsweg: "Beide Richtungsvektoren sind gleich, die Geraden sind also mindestens parallel. Der Aufpunkt von \\(h\\) liegt zudem auf \\(g\\): $$\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix} = 1 \\cdot \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix} \\quad (t=1)$$ Damit sind die Geraden <b>identisch</b>. Genau dieser zweite Schritt unterscheidet echte Parallelität von Identität." },
      { id: 24, level: 4, typ: "mc", frage: "\\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\), \\(h: \\vec x = \\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}+s\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\). Lage?", optionen: ["identisch", "parallel", "windschief", "schneiden sich"], korrekt: 1, tipp: "Richtungsvektoren gleich, aber \\((0|1|0) \\notin g\\).", loesungsweg: "Parallel, aber nicht identisch." },
      // LEVEL 5 -- Schnittpunkt, Punktprobe, Parameter
      { id: 25, level: 5, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\-2\\\\3\\end{pmatrix}+t\\begin{pmatrix}1\\\\2\\\\1\\end{pmatrix}\\) und \\(h: \\vec x = \\begin{pmatrix}1\\\\3\\\\4\\end{pmatrix}+s\\begin{pmatrix}2\\\\-1\\\\1\\end{pmatrix}\\) schneiden sich. Dritte Koordinate des Schnittpunkts:", loesung: 5, toleranz: 0, tipp: "Setze die Parametergleichungen gleich; zwei Zeilen bestimmen die Parameter, die dritte ist die Kontrolle.", loesungsweg: "Gleichsetzen ergibt \\(1+t = 1+2s\\), \\(-2+2t = 3-s\\) und \\(3+t = 4+s\\). Zeile 1: \\(t = 2s\\). In Zeile 2: \\(-2+4s = 3-s\\), also \\(s = 1\\) und \\(t = 2\\). Kontrolle in Zeile 3: \\(3+2 = 4+1\\) — erfüllt. Schnittpunkt \\(S(3|2|5)\\), dritte Koordinate \\(5\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Schüler prüft, ob \\(P(4|3|5)\\) auf \\(g: \\vec x = \\begin{pmatrix}1\\\\1\\\\2\\end{pmatrix}+t\\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}\\) liegt: aus \\(4 = 1+t\\) folgt \\(t = 3\\), und \\(2+3 = 5\\) passt — also liege \\(P\\) auf \\(g\\). Welche zweite Koordinate müsste \\(P\\) haben, damit der Schluss stimmt?", loesung: 1, toleranz: 0, tipp: "Eine Punktprobe ist erst vollständig, wenn alle drei Zeilen mit demselben Parameter erfüllt sind.", loesungsweg: "Die zweite Zeile lautet \\(y = 1 + t \\cdot 0 = 1\\), und zwar für jedes \\(t\\). Der Schüler hat sie übersprungen: wegen \\(3 \\neq 1\\) liegt \\(P(4|3|5)\\) <b>nicht</b> auf \\(g\\). Nur \\((4|1|5)\\) liegt auf \\(g\\), die zweite Koordinate müsste also \\(1\\) sein." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für welches \\(a\\) schneidet \\(g: \\vec x = \\begin{pmatrix}1\\\\2\\\\a\\end{pmatrix}+t\\begin{pmatrix}2\\\\-1\\\\1\\end{pmatrix}\\) die \\(xy\\)-Ebene in einem Punkt mit der ersten Koordinate 5?", loesung: -2, toleranz: 0, tipp: "Zwei Bedingungen: die dritte Koordinate ist im Spurpunkt null, die erste ist vorgegeben. Bestimme den Parameter aus der vorgegebenen Koordinate.", loesungsweg: "Erste Zeile: \\(1+2t = 5\\), also \\(t = 2\\). Dritte Zeile im Spurpunkt: \\(a+t = 0\\), also \\(a = -2\\). Der Spurpunkt ist dann \\((5|0|0)\\); Probe mit der zweiten Zeile: \\(2-2 = 0\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}+t\\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}\\) und \\(h: \\vec x = \\begin{pmatrix}5\\\\10\\\\15\\end{pmatrix}+s\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\) sind identisch. Für welches \\(t\\) liefert \\(g\\) den Aufpunkt von \\(h\\)?", loesung: 2, toleranz: 0, tipp: "Für Identität braucht es beides: kollineare Richtungen und einen gemeinsamen Punkt. Die Punktprobe liefert den gesuchten Parameter.", loesungsweg: "Die Richtungen sind kollinear: \\(\\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix} = 2\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\). Punktprobe mit dem Aufpunkt von \\(h\\): \\(5 = 1+2t\\) gibt \\(t = 2\\); Kontrolle \\(2+4 \\cdot 2 = 10\\) und \\(3+6 \\cdot 2 = 15\\) — beide Zeilen stimmen. Damit liegt der Aufpunkt von \\(h\\) auf \\(g\\), und bei kollinearen Richtungen folgt daraus Identität." },
      { id: 29, level: 5, typ: "numerisch", frage: "Die Gerade \\(g\\) verläuft durch \\(A(1|1|2)\\) und \\(B(5|9|2)\\). Auf ihr liegt der Punkt \\(P(3|y|2)\\). Bestimmen Sie \\(y\\):", loesung: 5, toleranz: 0, tipp: "Stelle zuerst die Gleichung von \\(g\\) auf und lies den Parameter aus der ersten Zeile ab.", loesungsweg: "\\(\\vec{AB} = \\begin{pmatrix}4\\\\8\\\\0\\end{pmatrix}\\), also \\(g: \\vec x = \\begin{pmatrix}1\\\\1\\\\2\\end{pmatrix}+t\\begin{pmatrix}4\\\\8\\\\0\\end{pmatrix}\\). Aus \\(3 = 1+4t\\) folgt \\(t = 0{,}5\\), damit \\(y = 1+8 \\cdot 0{,}5 = 5\\). Die dritte Zeile ist mit \\(2 = 2\\) erfüllt, \\(P\\) liegt also tatsächlich auf \\(g\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Auf \\(g: \\vec x = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}+t\\begin{pmatrix}2\\\\-1\\\\2\\end{pmatrix}\\) liegt ein Punkt \\(P\\) mit \\(t > 0\\), der vom Aufpunkt \\(A(1|2|3)\\) den Abstand 9 hat. Erste Koordinate von \\(P\\):", loesung: 7, toleranz: 0, tipp: "Ein Parameterschritt führt um die Länge des Richtungsvektors weiter — bestimme diese Länge zuerst.", loesungsweg: "\\(|\\vec u| = \\sqrt{4+1+4} = 3\\). Der Abstand vom Aufpunkt beträgt \\(|t| \\cdot 3\\); aus \\(3t = 9\\) und \\(t > 0\\) folgt \\(t = 3\\). Damit \\(P(7|-1|9)\\), die erste Koordinate ist \\(7\\). Für \\(t = -3\\) ergäbe sich der zweite Punkt \\((-5|5|-3)\\) mit demselben Abstand." },
      // LEVEL 6 -- Abi-Format: Bahnen, Sichtlinien, Spurpunkte
      { id: 31, level: 6, typ: "numerisch", frage: "Zwei Flugzeuge bewegen sich auf \\(f_1: \\vec x = \\begin{pmatrix}0\\\\0\\\\2\\end{pmatrix}+t\\begin{pmatrix}4\\\\3\\\\0\\end{pmatrix}\\) und \\(f_2: \\vec x = \\begin{pmatrix}12\\\\0\\\\2\\end{pmatrix}+s\\begin{pmatrix}0\\\\3\\\\0\\end{pmatrix}\\) (Längen in km; \\(t\\) und \\(s\\) in Minuten nach 12 Uhr). Zeigen Sie, dass sich die Bahnen kreuzen, und geben Sie die zweite Koordinate des Kreuzungspunkts an:", loesung: 9, toleranz: 0, tipp: "Bahnen gleichsetzen; prüfe am Ende zusätzlich, ob beide Parameter denselben Zeitpunkt bezeichnen.", loesungsweg: "Zeile 1: \\(4t = 12\\), also \\(t = 3\\). Zeile 2: \\(3t = 3s\\), also \\(s = 3\\). Zeile 3: \\(2 = 2\\) — erfüllt. Kreuzungspunkt \\((12|9|2)\\), zweite Koordinate \\(9\\). Weil \\(t = s = 3\\) ist, sind beide Flugzeuge um 12:03 Uhr an derselben Stelle: hier kreuzen sich nicht nur die Bahnen, es besteht Kollisionsgefahr." },
      { id: 32, level: 6, typ: "numerisch", frage: "Ein Kran führt seinen Haken längs \\(k: \\vec x = \\begin{pmatrix}2\\\\1\\\\8\\end{pmatrix}+t\\begin{pmatrix}3\\\\4\\\\-1\\end{pmatrix}\\) (Angaben in Metern, \\(t\\) in Sekunden). Zeigen Sie, dass der Haken den Punkt \\(P(14|17|4)\\) erreicht, und geben Sie an, wie weit er bis dahin vom Startpunkt gekommen ist (in m, auf 2 NK):", loesung: 20.4, toleranz: 0.05, tipp: "Erst die Punktprobe mit allen drei Zeilen, dann die Länge des Richtungsvektors als Maßstab für die Zeit.", loesungsweg: "Punktprobe: \\(2+3t = 14\\) gibt \\(t = 4\\); Kontrolle \\(1+4 \\cdot 4 = 17\\) und \\(8-4 = 4\\) — beide Zeilen stimmen, der Haken ist nach 4 s in \\(P\\). Weg: \\(|\\vec u| = \\sqrt{9+16+1} = \\sqrt{26}\\), also \\(4\\sqrt{26} \\approx 20{,}40\\) m. Ohne die beiden Kontrollzeilen wäre der Nachweis nicht geführt." },
      { id: 33, level: 6, typ: "numerisch", frage: "Eine waagerechte Traverse verläuft geradlinig von \\(T_1(0|4|6)\\) nach \\(T_2(12|4|6)\\) (Angaben in Metern). Eine Sichtlinie beginnt in \\(P(0|0|0)\\) und hat die Richtung \\(\\begin{pmatrix}2\\\\2\\\\3\\end{pmatrix}\\). Beurteilen Sie, ob sie die Traverse trifft, und geben Sie die erste Koordinate des Treffpunkts an:", loesung: 4, toleranz: 0, tipp: "Stelle beide Geraden auf und prüfe am Schluss, ob der gemeinsame Punkt überhaupt zwischen den Endpunkten der Traverse liegt.", loesungsweg: "Traverse: \\(\\vec x = \\begin{pmatrix}0\\\\4\\\\6\\end{pmatrix}+u\\begin{pmatrix}12\\\\0\\\\0\\end{pmatrix}\\) mit \\(0 \\le u \\le 1\\). Sichtlinie: \\(\\vec x = t\\begin{pmatrix}2\\\\2\\\\3\\end{pmatrix}\\). Zeile 2: \\(2t = 4\\), also \\(t = 2\\); Zeile 3: \\(3 \\cdot 2 = 6\\) — erfüllt. Zeile 1: \\(4 = 12u\\), also \\(u = \\tfrac{1}{3}\\), und dieser Wert liegt zwischen 0 und 1. Die Sichtlinie trifft die Traverse in \\((4|4|6)\\); ohne die Prüfung von \\(u\\) wäre der Treffer nicht gesichert." },
      { id: 34, level: 6, typ: "numerisch", frage: "Die Gerade \\(g: \\vec x = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}+t\\begin{pmatrix}2\\\\1\\\\a\\end{pmatrix}\\) soll die \\(xy\\)-Ebene in einem Punkt mit der ersten Koordinate 7 treffen. Bestimmen Sie \\(a\\) und beurteilen Sie im Lösungsweg, für welches \\(a\\) es überhaupt keinen Spurpunkt gibt:", loesung: -1, toleranz: 0, tipp: "Der Parameter folgt aus der ersten Zeile; die dritte Zeile entscheidet danach über den gesuchten Wert — und darüber, wann sie gar nicht null werden kann.", loesungsweg: "Erste Zeile: \\(1+2t = 7\\), also \\(t = 3\\). Dritte Zeile im Spurpunkt: \\(3+3a = 0\\), also \\(a = -1\\); der Spurpunkt ist \\((7|5|0)\\). Fallunterscheidung: für \\(a = 0\\) bleibt die dritte Koordinate konstant 3, die Gerade verläuft parallel zur \\(xy\\)-Ebene und hat keinen Spurpunkt. Für jedes \\(a \\neq 0\\) gibt es genau einen." },
      { id: 35, level: 6, typ: "numerisch", frage: "Zwei Straßen verlaufen in der Ebene \\(z = 0\\): die eine durch \\(A(0|0|0)\\) und \\(B(10|5|0)\\), die andere durch \\(C(0|9|0)\\) und \\(D(12|3|0)\\) (Angaben in Hektometern). Bestimmen Sie die zweite Koordinate der Kreuzung:", loesung: 4.5, toleranz: 0.05, tipp: "Beide Straßen als Geraden ansetzen und gleichsetzen; die dritte Zeile ist hier von selbst erfüllt.", loesungsweg: "\\(g: \\vec x = t\\begin{pmatrix}10\\\\5\\\\0\\end{pmatrix}\\) und \\(h: \\vec x = \\begin{pmatrix}0\\\\9\\\\0\\end{pmatrix}+s\\begin{pmatrix}12\\\\-6\\\\0\\end{pmatrix}\\). Gleichsetzen: \\(10t = 12s\\) und \\(5t = 9-6s\\). Aus der ersten Zeile \\(t = 1{,}2s\\); eingesetzt: \\(6s = 9-6s\\), also \\(s = 0{,}75\\) und \\(t = 0{,}9\\). Die Kreuzung liegt in \\((9|4{,}5|0)\\), die zweite Koordinate ist \\(4{,}5\\)." },
      { id: 36, level: 6, typ: "mc", frage: "Beurteilen Sie die Behauptung: Zu ein und derselben Geraden gibt es unendlich viele verschiedene Parametergleichungen.", optionen: ["Richtig, Aufpunkt und Länge der Richtung sind frei", "Falsch, die Parameterform einer Geraden ist eindeutig", "Richtig, aber nur bei Geraden durch den Ursprung", "Falsch, nur der Aufpunkt darf gewechselt werden"], korrekt: 0, tipp: "Überlege, welche Punkte als Aufpunkt taugen und welche Vektoren dieselbe Richtung beschreiben.", loesungsweg: "Als Aufpunkt taugt jeder Punkt der Geraden, und als Richtungsvektor jedes Vielfache \\(r\\vec u\\) mit \\(r \\neq 0\\). Beides ist unendlich oft wählbar, etwa \\(\\vec x = t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\) und \\(\\vec x = \\begin{pmatrix}2\\\\2\\\\2\\end{pmatrix}+s\\begin{pmatrix}3\\\\3\\\\3\\end{pmatrix}\\) — dieselbe Gerade. Deshalb beweist man Gleichheit zweier Geraden nie durch Vergleich der Gleichungen, sondern über Richtung und Punktprobe." }];
