<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK: Kurvendiskussion erweitert - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-lk-kurvendisk-erweitert';
    const THEMA_CONFIG = { name: 'LK: Kurvendiskussion erweitert', bereich: 'analysis' };
    const AUFGABEN = [
      // L1
      { id:1, level:1, typ:"mc", frage:"Zur Kurvendiskussion gehören:", optionen:["Nur Extrema","D, Nullstellen, Symmetrie, Extrema, Wendep., Asymptoten","Nur die 2. Ableitung","Nur Skizze"], korrekt:1, tipp:"Vollständiger Katalog.", loesungsweg:"Eine vollständige Kurvendiskussion arbeitet ein festes Schema ab: Definitionsbereich, Symmetrie, Achsenschnittpunkte, Extrempunkte über \\(f'\\), Wendepunkte über \\(f''\\), Verhalten im Unendlichen und Asymptoten. Erst alle Teile zusammen ergeben ein vollständiges Bild des Graphen — einzelne Extrema sagen noch nichts über den Verlauf." },
      { id:2, level:1, typ:"mc", frage:"\\(f(x)=x^3-3x\\) ist:", optionen:["achsensymmetrisch","punktsymmetrisch","beides","weder-noch"], korrekt:1, tipp:"Nur ungerade Exponenten.", loesungsweg:"Prüfen durch Einsetzen von \\(-x\\): $$f(-x) = (-x)^3 - 3(-x) = -x^3 + 3x = -f(x)$$ Das ist genau die Bedingung für Punktsymmetrie zum Ursprung. Sie tritt auf, weil nur <b>ungerade</b> Exponenten vorkommen." },
      { id:3, level:1, typ:"numerisch", frage:"\\(f(x)=x^3-3x\\): Nullstelle \\(x>0\\)?", loesung:1.732, toleranz:0.01, tipp:"\\(x(x^2-3)=0\\).", loesungsweg:"Ausklammern macht die Nullstellen sichtbar: $$x^3 - 3x = x(x^2 - 3) = 0$$ Also \\(x = 0\\) oder \\(x^2 = 3\\). Die positive Lösung ist \\(\\sqrt{3} \\approx 1{,}732\\)." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=x^3-3x\\): Tiefpunkt \\(x>0\\)?", loesung:1, toleranz:0, tipp:"\\(f'=3x^2-3=0\\).", loesungsweg:"$$f'(x) = 3x^2 - 3 = 0 \\;\\Rightarrow\\; x^2 = 1 \\;\\Rightarrow\\; x = \\pm 1$$ Wegen \\(f''(x) = 6x\\) ist \\(f''(1) = 6 > 0\\) — bei \\(x = 1\\) liegt also der Tiefpunkt, bei \\(x = -1\\) der Hochpunkt." },
      { id:5, level:1, typ:"numerisch", frage:"\\(f(x)=x^3-3x\\): y-Wert des Tiefpunkts?", loesung:-2, toleranz:0, tipp:"\\(f(1)=1-3\\).", loesungsweg:"$$f(1) = 1^3 - 3 \\cdot 1 = 1 - 3 = -2$$ Der Tiefpunkt ist also \\(T(1 \\mid -2)\\)." },
      { id:6, level:1, typ:"numerisch", frage:"\\(f(x)=x^3-3x\\): Wendestelle?", loesung:0, toleranz:0, tipp:"\\(f''=6x=0\\).", loesungsweg:"$$f''(x) = 6x = 0 \\;\\Rightarrow\\; x = 0$$ Dort wechselt die Krümmung von rechts- auf linksgekrümmt. Bei punktsymmetrischen Funktionen dritten Grades liegt der Wendepunkt stets im Ursprung." },
      // L2
      { id:7, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): Nullstellen \\(x>0\\)?", loesung:2, toleranz:0, tipp:"\\(x^2(x^2-4)\\).", loesungsweg:"$$x^4 - 4x^2 = x^2(x^2 - 4) = 0$$ Also \\(x = 0\\) (doppelt) oder \\(x^2 = 4\\). Die positive Nullstelle ist \\(x = 2\\). Bei \\(x = 0\\) berührt der Graph die Achse nur, weil die Nullstelle doppelt ist." },
      { id:8, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): Tiefpunkt \\(x>0\\)?", loesung:1.414, toleranz:0.02, tipp:"\\(f'=4x^3-8x=4x(x^2-2)\\).", loesungsweg:"$$f'(x) = 4x^3 - 8x = 4x(x^2 - 2) = 0$$ Also \\(x = 0\\) oder \\(x = \\pm\\sqrt2\\). Die positive Extremstelle ist \\(\\sqrt2 \\approx 1{,}414\\); wegen \\(f''(\\sqrt2) > 0\\) handelt es sich um einen Tiefpunkt." },
      { id:9, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): y-Wert des Tiefpunkts?", loesung:-4, toleranz:0, tipp:"\\(f(\\sqrt 2)=4-8\\).", loesungsweg:"$$f(\\sqrt2) = (\\sqrt2)^4 - 4(\\sqrt2)^2 = 4 - 8 = -4$$ Der Tiefpunkt ist \\(T(\\sqrt2 \\mid -4)\\); wegen der Achsensymmetrie gibt es einen zweiten bei \\(-\\sqrt2\\)." },
      { id:10, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): Wendestelle \\(x>0\\)?", loesung:0.816, toleranz:0.02, tipp:"\\(f''=12x^2-8=0\\).", loesungsweg:"$$f''(x) = 12x^2 - 8 = 0 \\;\\Rightarrow\\; x^2 = \\frac{2}{3}$$ $$x = \\sqrt{\\tfrac23} \\approx 0{,}816$$" },
      { id:11, level:2, typ:"mc", frage:"\\(x^4\\)-Funktion Symmetrie:", optionen:["Punktsymm.","Achsensymm. zur y-Achse","beides","keine"], korrekt:1, tipp:"Nur gerade Exp.", loesungsweg:"Setzt man \\(-x\\) ein, ändern gerade Exponenten nichts: \\((-x)^4 = x^4\\) und \\((-x)^2 = x^2\\). Also gilt \\(f(-x) = f(x)\\) — der Graph ist achsensymmetrisch zur \\(y\\)-Achse. Ein einzelner ungerader Term würde diese Symmetrie zerstören." },
      { id:12, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): y-Achsenabschnitt?", loesung:0, toleranz:0, tipp:"\\(f(0)=0\\).", loesungsweg:"$$f(0) = 0^4 - 4 \\cdot 0^2 = 0$$ Der Graph geht also durch den Ursprung." },
      // L3
      { id:13, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): Nullstellen (pos, doppelt)?", loesung:3, toleranz:0, tipp:"\\(x(x-3)^2\\).", loesungsweg:"\\(x=0\\) oder \\(x=3\\) (doppelt)." },
      { id:14, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): Hochpunkt \\(x\\)?", loesung:1, toleranz:0, tipp:"\\(f'=3x^2-12x+9=0\\).", loesungsweg:"\\(x=1\\) (und \\(x=3\\))." },
      { id:15, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): y-Wert des Hochpunkts?", loesung:4, toleranz:0, tipp:"\\(f(1)=1-6+9\\).", loesungsweg:"$$f(1) = 1 - 6 + 9 = 4$$ Der Hochpunkt ist \\(H(1 \\mid 4)\\)." },
      { id:16, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): Wendestelle?", loesung:2, toleranz:0, tipp:"\\(f''=6x-12=0\\).", loesungsweg:"$$f''(x) = 6x - 12 = 0 \\;\\Rightarrow\\; x = 2$$ Zwischen Hochpunkt (\\(x=1\\)) und Tiefpunkt (\\(x=3\\)) liegt der Wendepunkt genau in der Mitte — das ist bei Funktionen dritten Grades immer so." },
      { id:17, level:3, typ:"numerisch", frage:"Wendepunkt y-Wert?", loesung:2, toleranz:0, tipp:"\\(f(2)=8-24+18\\).", loesungsweg:"$$f(2) = 8 - 24 + 18 = 2$$ Der Wendepunkt ist \\(W(2 \\mid 2)\\)." },
      { id:18, level:3, typ:"numerisch", frage:"Tangente im Wendepunkt: Steigung?", loesung:-3, toleranz:0, tipp:"\\(f'(2)=12-24+9\\).", loesungsweg:"Die Steigung der Wendetangente ist \\(f'\\) an der Wendestelle. Mit \\(f'(x) = 3x^2 - 12x + 9\\): $$f'(2) = 12 - 24 + 9 = -3$$ Die Wendetangente hat hier die kleinste Steigung des ganzen Graphen." },
      // L4
      { id:19, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{4}x^4-x^2\\): Nullstellen \\(x>0\\)?", loesung:2, toleranz:0, tipp:"\\(\\frac{1}{4}x^2(x^2-4)\\).", loesungsweg:"$$\\tfrac14 x^4 - x^2 = \\tfrac14 x^2(x^2 - 4) = 0$$ Also \\(x = 0\\) (doppelt) oder \\(x = \\pm 2\\). Die positive Nullstelle ist \\(2\\)." },
      { id:20, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{4}x^4-x^2\\): Tiefpunkt \\(x>0\\)?", loesung:1.414, toleranz:0.02, tipp:"\\(f'=x^3-2x=0\\).", loesungsweg:"$$f'(x) = x^3 - 2x = x(x^2 - 2) = 0$$ Die positive Extremstelle ist \\(\\sqrt2 \\approx 1{,}414\\)." },
      { id:21, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{4}x^4-x^2\\): y-Wert des Tiefpunkts?", loesung:-1, toleranz:0, tipp:"\\(f(\\sqrt 2)=1-2\\).", loesungsweg:"$$f(\\sqrt2) = \\tfrac14 \\cdot 4 - 2 = 1 - 2 = -1$$" },
      { id:22, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{4}x^4-x^2\\): Wendestelle \\(x>0\\)?", loesung:0.816, toleranz:0.02, tipp:"\\(f''=3x^2-2=0\\).", loesungsweg:"$$f''(x) = 3x^2 - 2 = 0 \\;\\Rightarrow\\; x^2 = \\tfrac23$$ $$x = \\sqrt{\\tfrac23} \\approx 0{,}816$$" },
      { id:23, level:4, typ:"numerisch", frage:"\\(f(x)=x\\cdot e^{-x}\\): Hochpunkt \\(x\\)?", loesung:1, toleranz:0, tipp:"\\(f'=(1-x)e^{-x}\\).", loesungsweg:"Produktregel mit innerer Ableitung \\(-1\\): $$f'(x) = e^{-x} - xe^{-x} = (1-x)e^{-x}$$ Da \\(e^{-x}\\) nie null wird, folgt \\(1 - x = 0\\), also \\(x = 1\\). Wegen des Vorzeichenwechsels von \\(+\\) nach \\(-\\) ist es ein Hochpunkt." },
      { id:24, level:4, typ:"numerisch", frage:"Hochpunkt y-Wert (gerundet)?", loesung:0.37, toleranz:0.02, tipp:"\\(1/e\\).", loesungsweg:"$$f(1) = 1 \\cdot e^{-1} = \\frac{1}{e} \\approx 0{,}368$$ Das ist der größte Wert, den die Funktion überhaupt annimmt." },
      // L5
      { id:25, level:5, typ:"numerisch", frage:"\\(f(x)=x\\cdot e^{-x}\\): Wendestelle?", loesung:2, toleranz:0, tipp:"\\(f''=(x-2)e^{-x}\\).", loesungsweg:"Nochmaliges Ableiten von \\(f'(x) = (1-x)e^{-x}\\) mit der Produktregel: $$f''(x) = -e^{-x} - (1-x)e^{-x} = (x-2)e^{-x}$$ Nullsetzen liefert \\(x = 2\\)." },
      { id:26, level:5, typ:"numerisch", frage:"\\(f(x)=\\ln x - x\\): Extremstelle \\(x>0\\)?", loesung:1, toleranz:0, tipp:"\\(f'=1/x-1=0\\).", loesungsweg:"$$f'(x) = \\frac{1}{x} - 1 = 0 \\;\\Rightarrow\\; \\frac1x = 1 \\;\\Rightarrow\\; x = 1$$ Die Stelle liegt im Definitionsbereich \\(x > 0\\) und ist damit brauchbar." },
      { id:27, level:5, typ:"numerisch", frage:"Extremwert (y)?", loesung:-1, toleranz:0, tipp:"\\(\\ln 1 -1\\).", loesungsweg:"$$f(1) = \\ln 1 - 1 = 0 - 1 = -1$$" },
      { id:28, level:5, typ:"mc", frage:"Maximum oder Minimum?", optionen:["Min","Max","Sattel","Pol"], korrekt:1, tipp:"\\(f''=-1/x^2<0\\).", loesungsweg:"$$f''(x) = -\\frac{1}{x^2}$$ Für jedes \\(x > 0\\) ist das negativ, der Graph also durchweg rechtsgekrümmt. An der Extremstelle liegt daher ein <b>Maximum</b>. Daraus folgt nebenbei \\(\\ln x \\leq x - 1\\) für alle \\(x>0\\)." },
      { id:29, level:5, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x^2+1}\\): Wendestelle \\(x>0\\)?", loesung:0.577, toleranz:0.05, tipp:"\\(f''=0 \\Rightarrow x=\\pm 1/\\sqrt 3\\).", loesungsweg:"Mit der Quotientenregel ergibt sich \\(f'(x) = \\frac{2x}{(x^2+1)^2}\\) und weiter $$f''(x) = \\frac{2 - 6x^2}{(x^2+1)^3}$$ Ein Bruch ist null, wenn der Zähler null ist: \\(6x^2 = 2\\), also \\(x = \\frac{1}{\\sqrt3} \\approx 0{,}577\\)." },
      { id:30, level:5, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x^2+1}\\): waagerechte Asymptote?", loesung:1, toleranz:0, tipp:"Gleiche Grade.", loesungsweg:"Zähler und Nenner haben denselben Grad; für große \\(|x|\\) entscheiden die höchsten Potenzen: $$\\frac{x^2}{x^2+1} \\to \\frac{x^2}{x^2} = 1$$ Die Asymptote ist also \\(y = 1\\). Der Wert \\(1\\) wird nie erreicht, weil der Nenner stets um \\(1\\) größer ist als der Zähler." },
      // L6
      { id:31, level:6, typ:"numerisch", frage:"\\(f(x)=(x^2-1)e^{-x}\\): \\(f(0)=?\\)", loesung:-1, toleranz:0, tipp:"Einsetzen.", loesungsweg:"$$f(0) = (0 - 1) \\cdot e^{0} = -1 \\cdot 1 = -1$$" },
      { id:32, level:6, typ:"numerisch", frage:"\\(f(x)=(x^2-1)e^{-x}\\): pos. Nullstelle?", loesung:1, toleranz:0, tipp:"\\(x^2=1\\).", loesungsweg:"Ein Produkt ist null, wenn ein Faktor null ist. Da \\(e^{-x} \\neq 0\\), bleibt: $$x^2 - 1 = 0 \\;\\Rightarrow\\; x = \\pm 1$$ Die positive Nullstelle ist \\(1\\)." },
      { id:33, level:6, typ:"numerisch", frage:"\\(f(x)=\\sin x\\) auf \\([0,2\\pi]\\): Wendestelle \\(x\\in(0,\\pi)\\)?", loesung:3.14, toleranz:0.02, tipp:"\\(f''=-\\sin x=0\\).", loesungsweg:"$$f''(x) = -\\sin x = 0 \\;\\Rightarrow\\; \\sin x = 0$$ Im Intervall \\((0; \\pi]\\) trifft das auf \\(x = \\pi \\approx 3{,}14\\) zu. Dort wechselt die Sinuskurve von der Rechts- in die Linkskrümmung." },
      { id:34, level:6, typ:"numerisch", frage:"\\(f(x)=x^3-3x^2+4\\): Wendestelle?", loesung:1, toleranz:0, tipp:"\\(f''=6x-6\\).", loesungsweg:"$$f''(x) = 6x - 6 = 0 \\;\\Rightarrow\\; x = 1$$" },
      { id:35, level:6, typ:"numerisch", frage:"Wendepunkt y?", loesung:2, toleranz:0, tipp:"\\(f(1)=1-3+4\\).", loesungsweg:"$$f(1) = 1 - 3 + 4 = 2$$ Der Wendepunkt ist \\(W(1 \\mid 2)\\)." },
      { id:36, level:6, typ:"numerisch", frage:"Steigung der Wendetangente?", loesung:-3, toleranz:0, tipp:"\\(f'(1)=3-6\\).", loesungsweg:"Mit \\(f'(x) = 3x^2 - 6x\\): $$f'(1) = 3 - 6 = -3$$ Die Wendetangente fällt also mit der Steigung \\(-3\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
