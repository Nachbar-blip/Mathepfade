<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-lk-kurvendisk-erweitert';
    const THEMA_CONFIG = { name: 'eA: Kurvendiskussion erweitert', bereich: 'analysis' };
    const AUFGABEN = [
      // L1
      { id:1, level:1, typ:"mc", frage:"Zur Kurvendiskussion gehören:", optionen:["Nur Extrema","D, Nullstellen, Symmetrie, Extrema, Wendep., Asymptoten","Nur die 2. Ableitung","Nur Skizze"], korrekt:1, tipp:"Vollständiger Katalog.", loesungsweg:"Eine vollständige Kurvendiskussion arbeitet ein festes Schema ab: Definitionsbereich, Symmetrie, Achsenschnittpunkte, Extrempunkte über \\(f'\\), Wendepunkte über \\(f''\\), Verhalten im Unendlichen und Asymptoten. Erst alle Teile zusammen ergeben ein vollständiges Bild des Graphen — einzelne Extrema sagen noch nichts über den Verlauf." },
      { id:2, level:1, typ:"mc", frage:"\\(f(x)=x^3-3x\\) ist:", optionen:["achsensymmetrisch","punktsymmetrisch","beides","weder-noch"], korrekt:1, tipp:"Nur ungerade Exponenten.", loesungsweg:"Prüfen durch Einsetzen von \\(-x\\): $$f(-x) = (-x)^3 - 3(-x) = -x^3 + 3x = -f(x)$$ Das ist genau die Bedingung für Punktsymmetrie zum Ursprung. Sie tritt auf, weil nur <b>ungerade</b> Exponenten vorkommen." },
      { id:3, level:1, typ:"numerisch", frage:"\\(f(x)=x^3-3x\\): Nullstelle \\(x>0\\)?", loesung:1.732, toleranz:0.01, tipp:"\\(x(x^2-3)=0\\).", loesungsweg:"Ausklammern macht die Nullstellen sichtbar: $$x^3 - 3x = x(x^2 - 3) = 0$$ Also \\(x = 0\\) oder \\(x^2 = 3\\). Die positive Lösung ist \\(\\sqrt{3} \\approx 1{,}732\\)." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=x^3-3x\\): Tiefpunkt \\(x>0\\)?", loesung:1, toleranz:0, tipp:"\\(f'=3x^2-3=0\\).", loesungsweg:"$$f'(x) = 3x^2 - 3 = 0 \\;\\Rightarrow\\; x^2 = 1 \\;\\Rightarrow\\; x = \\pm 1$$ Wegen \\(f''(x) = 6x\\) ist \\(f''(1) = 6 > 0\\) — bei \\(x = 1\\) liegt also der Tiefpunkt, bei \\(x = -1\\) der Hochpunkt." },
      { id:5, level:1, typ:"numerisch", frage:"\\(f(x)=x^3-3x\\): y-Wert des Tiefpunkts?", loesung:-2, toleranz:0, tipp:"\\(f(1)=1-3\\).", loesungsweg:"$$f(1) = 1^3 - 3 \\cdot 1 = 1 - 3 = -2$$ Der Tiefpunkt ist also \\(T(1 \\mid -2)\\)." },
      { id:6, level:1, typ:"numerisch", frage:"\\(f(x)=x^3-3x\\): Wendestelle?", loesung:0, toleranz:0, tipp:"\\(f''=6x=0\\).", loesungsweg:"$$f''(x) = 6x = 0 \\;\\Rightarrow\\; x = 0$$ Dort wechselt die Krümmung von rechts- auf linksgekrümmt. Bei punktsymmetrischen Funktionen dritten Grades liegt der Wendepunkt stets im Ursprung." },
      // L2
      { id:7, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): Nullstellen \\(x>0\\)?", loesung:2, toleranz:0, tipp:"\\(x^2(x^2-4)\\).", loesungsweg:"$$x^4 - 4x^2 = x^2(x^2 - 4) = 0$$ Also \\(x = 0\\) (doppelt) oder \\(x^2 = 4\\). Die positive Nullstelle ist \\(x = 2\\). Bei \\(x = 0\\) berührt der Graph die Achse nur, weil die Nullstelle doppelt ist." },
      { id:8, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): Tiefpunkt \\(x>0\\)?", loesung:1.414, toleranz:0.02, tipp:"\\(f'=4x^3-8x=4x(x^2-2)\\).", loesungsweg:"$$f'(x) = 4x^3 - 8x = 4x(x^2 - 2) = 0$$ Also \\(x = 0\\) oder \\(x = \\pm\\sqrt2\\). Die positive Extremstelle ist \\(\\sqrt2 \\approx 1{,}414\\); wegen \\(f''(\\sqrt2) > 0\\) handelt es sich um einen Tiefpunkt." },
      { id:9, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): y-Wert des Tiefpunkts?", loesung:-4, toleranz:0, tipp:"\\(f(\\sqrt 2)=4-8\\).", loesungsweg:"$$f(\\sqrt2) = (\\sqrt2)^4 - 4(\\sqrt2)^2 = 4 - 8 = -4$$ Der Tiefpunkt ist \\(T(\\sqrt2 \\mid -4)\\); wegen der Achsensymmetrie gibt es einen zweiten bei \\(-\\sqrt2\\)." },
      { id:10, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): Wendestelle \\(x>0\\)?", loesung:0.816, toleranz:0.02, tipp:"\\(f''=12x^2-8=0\\).", loesungsweg:"$$f''(x) = 12x^2 - 8 = 0 \\;\\Rightarrow\\; x^2 = \\frac{2}{3}$$ $$x = \\sqrt{\\tfrac23} \\approx 0{,}816$$" },
      { id:11, level:2, typ:"mc", frage:"\\(x^4\\)-Funktion Symmetrie:", optionen:["Punktsymm.","Achsensymm. zur y-Achse","beides","keine"], korrekt:1, tipp:"Nur gerade Exp.", loesungsweg:"Setzt man \\(-x\\) ein, ändern gerade Exponenten nichts: \\((-x)^4 = x^4\\) und \\((-x)^2 = x^2\\). Also gilt \\(f(-x) = f(x)\\) — der Graph ist achsensymmetrisch zur \\(y\\)-Achse. Ein einzelner ungerader Term würde diese Symmetrie zerstören." },
      { id:12, level:2, typ:"numerisch", frage:"\\(f(x)=x^4-4x^2\\): y-Achsenabschnitt?", loesung:0, toleranz:0, tipp:"\\(f(0)=0\\).", loesungsweg:"$$f(0) = 0^4 - 4 \\cdot 0^2 = 0$$ Der Graph geht also durch den Ursprung." },
      // L3
      { id:13, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): Nullstellen (pos, doppelt)?", loesung:3, toleranz:0, tipp:"Klammere zuerst so weit wie möglich aus; der verbleibende Klammerterm ist eine binomische Formel.", loesungsweg:"Ausklammern und die Klammer als binomische Formel erkennen: $$x^3-6x^2+9x = x\\left(x^2-6x+9\\right) = x(x-3)^2$$ Ein Produkt ist null, wenn ein Faktor null ist: \\(x=0\\) oder \\(x=3\\). Die zweite Nullstelle ist <b>doppelt</b>, weil ihr Faktor quadriert auftritt — der Graph berührt dort die \\(x\\)-Achse, statt sie zu schneiden. Gesucht war die positive Nullstelle, also \\(x = 3\\)." },
      { id:14, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): Hochpunkt \\(x\\)?", loesung:1, toleranz:0, tipp:"Setze die erste Ableitung null und entscheide danach mit der zweiten Ableitung, welche der Stellen der Hochpunkt ist.", loesungsweg:"Ableiten und null setzen: $$f'(x) = 3x^2-12x+9 = 3(x-1)(x-3) = 0$$ Also \\(x=1\\) oder \\(x=3\\). Art bestimmen mit \\(f''(x) = 6x-12\\): $$f''(1) = -6 < 0 \\quad\\text{(Hochpunkt)}$$ $$f''(3) = 6 > 0 \\quad\\text{(Tiefpunkt)}$$ Der Hochpunkt liegt also bei \\(x = 1\\)." },
      { id:15, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): y-Wert des Hochpunkts?", loesung:4, toleranz:0, tipp:"\\(f(1)=1-6+9\\).", loesungsweg:"$$f(1) = 1 - 6 + 9 = 4$$ Der Hochpunkt ist \\(H(1 \\mid 4)\\)." },
      { id:16, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): Wendestelle?", loesung:2, toleranz:0, tipp:"\\(f''=6x-12=0\\).", loesungsweg:"$$f''(x) = 6x - 12 = 0 \\;\\Rightarrow\\; x = 2$$ Zwischen Hochpunkt (\\(x=1\\)) und Tiefpunkt (\\(x=3\\)) liegt der Wendepunkt genau in der Mitte — das ist bei Funktionen dritten Grades immer so." },
      { id:17, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): Welchen \\(y\\)-Wert hat der Wendepunkt?", loesung:2, toleranz:0, tipp:"\\(f(2)=8-24+18\\).", loesungsweg:"$$f(2) = 8 - 24 + 18 = 2$$ Der Wendepunkt ist \\(W(2 \\mid 2)\\)." },
      { id:18, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-6x^2+9x\\): Welche Steigung hat die Tangente im Wendepunkt?", loesung:-3, toleranz:0, tipp:"\\(f'(2)=12-24+9\\).", loesungsweg:"Die Steigung der Wendetangente ist \\(f'\\) an der Wendestelle. Mit \\(f'(x) = 3x^2 - 12x + 9\\): $$f'(2) = 12 - 24 + 9 = -3$$ Die Wendetangente hat hier die kleinste Steigung des ganzen Graphen." },
      // L4 -- AFB II: zusammengesetzte Terme, Verfahren waehlen, Modell, Umkehraufgabe
      { id:19, level:4, typ:"numerisch", frage:"An welcher Stelle hat der Graph von \\(f(x)=(x-2)\\,e^{x}\\) einen Extrempunkt?", loesung:1, toleranz:0, tipp:"Der Term ist ein Produkt aus zwei Faktoren, die beide von \\(x\\) abhängen; klammere nach dem Ableiten den Exponentialterm aus.", loesungsweg:"Produktregel mit \\(u = x-2\\), \\(u' = 1\\), \\(v = e^{x}\\), \\(v' = e^{x}\\): $$f'(x) = e^{x} + (x-2)e^{x} = e^{x}(x-1)$$ Der Faktor \\(e^{x}\\) wird nie null, also entscheidet die Klammer: $$x - 1 = 0 \\;\\Rightarrow\\; x = 1$$ Links von \\(1\\) ist \\(f'\\) negativ, rechts positiv — der Graph fällt erst und steigt dann, es ist ein Tiefpunkt mit \\(f(1) = -e\\)." },
      { id:20, level:4, typ:"numerisch", frage:"Wie viele Stellen mit waagerechter Tangente hat der Graph von \\(f(x)=x^{2}e^{x}\\)?", loesung:2, toleranz:0, tipp:"Leite ab, klammere so weit wie möglich aus und zähle anschließend die Nullstellen der verbleibenden Faktoren.", loesungsweg:"Produktregel und danach ausklammern: $$f'(x) = 2x\\,e^{x} + x^{2}e^{x} = e^{x}\\,x(x+2)$$ Der Exponentialterm ist stets von null verschieden. Ein Produkt ist null, wenn ein Faktor null ist: $$x = 0 \\quad\\text{oder}\\quad x = -2$$ Es sind also \\(2\\) Stellen. Bei \\(x=-2\\) liegt ein Hochpunkt, bei \\(x=0\\) ein Tiefpunkt — dazwischen fällt der Graph." },
      { id:21, level:4, typ:"numerisch", frage:"An welcher Stelle im Intervall \\([0;\\pi]\\) hat der Graph von \\(f(x)=\\sin(2x)\\) seinen Hochpunkt (gerundet)?", loesung:0.785, toleranz:0.01, tipp:"Leite die zusammengesetzte Funktion ab und überlege, wo der entstehende Kosinusterm im angegebenen Intervall null wird.", loesungsweg:"Kettenregel mit der inneren Funktion \\(u = 2x\\): $$f'(x) = 2\\cos(2x) = 0 \\;\\Rightarrow\\; \\cos(2x) = 0$$ Im Intervall \\([0;\\pi]\\) durchläuft \\(2x\\) die Werte von \\(0\\) bis \\(2\\pi\\); der Kosinus ist dort bei \\(2x = \\frac{\\pi}{2}\\) und \\(2x = \\frac{3\\pi}{2}\\) null. Das ergibt \\(x = \\frac{\\pi}{4}\\) und \\(x = \\frac{3\\pi}{4}\\). Der Sinus nimmt bei \\(2x = \\frac{\\pi}{2}\\) seinen größten Wert an, der Hochpunkt liegt also bei $$x = \\frac{\\pi}{4} \\approx 0{,}785$$ An der zweiten Stelle liegt der Tiefpunkt." },
      { id:22, level:4, typ:"numerisch", frage:"An welcher Stelle mit \\(x>0\\) hat der Graph von \\(f(x)=x\\,e^{-x^{2}}\\) seinen Hochpunkt (gerundet)?", loesung:0.707, toleranz:0.01, tipp:"Hier greifen zwei Regeln ineinander: der Term ist ein Produkt, und der Exponent ist selbst eine Funktion von \\(x\\).", loesungsweg:"Produktregel, dabei der zweite Faktor nach der Kettenregel: $$f'(x) = 1 \\cdot e^{-x^{2}} + x \\cdot (-2x)e^{-x^{2}} = e^{-x^{2}}\\left(1 - 2x^{2}\\right)$$ Der Exponentialterm ist nie null, also: $$1 - 2x^{2} = 0 \\;\\Rightarrow\\; x^{2} = \\frac12 \\;\\Rightarrow\\; x = \\frac{1}{\\sqrt2} \\approx 0{,}707$$ Für \\(x>0\\) wechselt \\(f'\\) dort von \\(+\\) nach \\(-\\) — ein Hochpunkt. Wegen der Punktsymmetrie liegt bei \\(-\\frac{1}{\\sqrt2}\\) der Tiefpunkt." },
      { id:23, level:4, typ:"numerisch", frage:"Ein Werkstück kühlt ab; seine Temperatur beträgt \\(T(t)=20+60\\,e^{-0{,}2t}\\) in Grad Celsius, wobei \\(t\\) die Zeit in Minuten ist. Nach welcher Zeit hat es \\(35\\) Grad erreicht (gerundet in Minuten)?", loesung:6.93, toleranz:0.05, tipp:"Setze die gesuchte Temperatur ein und stelle die Gleichung so um, dass der Exponentialterm allein steht.", loesungsweg:"Bedingung aufstellen und den Exponentialterm freistellen: $$20 + 60\\,e^{-0{,}2t} = 35 \\;\\Rightarrow\\; 60\\,e^{-0{,}2t} = 15 \\;\\Rightarrow\\; e^{-0{,}2t} = 0{,}25$$ Logarithmieren: $$-0{,}2t = \\ln 0{,}25 \\approx -1{,}3863 \\;\\Rightarrow\\; t \\approx 6{,}93$$ Der Summand \\(20\\) ist die Raumtemperatur — sie wird nie unterschritten, weshalb er vor dem Logarithmieren unbedingt abgezogen werden muss." },
      { id:24, level:4, typ:"numerisch", frage:"An welcher Stelle im Intervall \\([0;2\\pi]\\) hat der Graph von \\(f(x)=\\cos x + \\frac{x}{2}\\) einen Tiefpunkt (gerundet)?", loesung:2.618, toleranz:0.02, tipp:"Bestimme zuerst alle Stellen mit waagerechter Tangente und entscheide danach über die zweite Ableitung, welche davon der Tiefpunkt ist.", loesungsweg:"Erster Schritt — waagerechte Tangenten: $$f'(x) = -\\sin x + \\tfrac12 = 0 \\;\\Rightarrow\\; \\sin x = \\tfrac12$$ Im Intervall \\([0;2\\pi]\\) trifft das auf \\(x = \\frac{\\pi}{6}\\) und \\(x = \\frac{5\\pi}{6}\\) zu. Zweiter Schritt — Art bestimmen mit \\(f''(x) = -\\cos x\\): $$f''\\left(\\tfrac{\\pi}{6}\\right) = -\\tfrac{\\sqrt3}{2} < 0 \\quad\\text{(Hochpunkt)}$$ $$f''\\left(\\tfrac{5\\pi}{6}\\right) = +\\tfrac{\\sqrt3}{2} > 0 \\quad\\text{(Tiefpunkt)}$$ Der Tiefpunkt liegt also bei $$x = \\frac{5\\pi}{6} \\approx 2{,}618$$ Ohne den zweiten Schritt wäre die erste Stelle die naheliegende, aber falsche Antwort." },
      // L5 -- AFB III: zwei Verfahren verbinden, Parameter aus Bedingung, Fehler finden
      { id:25, level:5, typ:"numerisch", frage:"Bestimme die positive Wendestelle des Graphen von \\(f(x)=\\left(x^{2}-3\\right)e^{x}\\) (gerundet).", loesung:0.236, toleranz:0.005, tipp:"Zweimal ableiten, jeweils mit der Produktregel, danach den Exponentialterm ausklammern und die verbleibende quadratische Gleichung lösen.", loesungsweg:"Erste Ableitung: $$f'(x) = 2x\\,e^{x} + \\left(x^{2}-3\\right)e^{x} = e^{x}\\left(x^{2}+2x-3\\right)$$ Zweite Ableitung, wieder mit der Produktregel: $$f''(x) = e^{x}\\left(x^{2}+2x-3\\right) + e^{x}(2x+2) = e^{x}\\left(x^{2}+4x-1\\right)$$ Nullsetzen; der Exponentialterm scheidet aus: $$x^{2}+4x-1 = 0 \\;\\Rightarrow\\; x = -2 \\pm \\sqrt{5}$$ Die positive Lösung ist $$x = -2+\\sqrt5 \\approx 0{,}2361$$ Die zweite Wendestelle liegt bei \\(-2-\\sqrt5 \\approx -4{,}236\\); da \\(f''\\) dort das Vorzeichen wechselt, sind es echte Wendepunkte." },
      { id:26, level:5, typ:"mc", frage:"Ein Schüler sucht die Extremstellen von \\(f(x)=x^{2}e^{-x}\\) und rechnet: \\(f'(x) = 2x \\cdot \\left(-e^{-x}\\right) = -2x\\,e^{-x}\\), also sei \\(x=0\\) die einzige Extremstelle. Welche Beurteilung trifft zu?", optionen:["Die Produktregel fehlt; richtig ist \\(f'(x)=e^{-x}\\left(2x-x^{2}\\right)\\) mit zwei Stellen","Die Kettenregel fehlt; der innere Term liefert zusätzlich den Faktor \\(-1\\)","Die Rechnung stimmt; \\(x=0\\) ist tatsächlich die einzige Extremstelle","Der Fehler liegt am Vorzeichen; richtig ist \\(f'(x)=2x\\,e^{-x}\\) mit einer Stelle"], korrekt:0, tipp:"Prüfe, ob beide Faktoren des Terms beim Ableiten berücksichtigt wurden, und leite selbst sauber ab.", loesungsweg:"Der Term ist ein <b>Produkt</b> zweier Funktionen von \\(x\\); es genügt nicht, jeden Faktor einzeln abzuleiten und zu multiplizieren. Richtig: $$f'(x) = 2x\\,e^{-x} + x^{2}\\left(-e^{-x}\\right) = e^{-x}\\left(2x - x^{2}\\right) = e^{-x}\\,x(2-x)$$ Nullsetzen liefert \\(x = 0\\) und \\(x = 2\\) — die zweite Stelle ist dem Schüler entgangen. Bei \\(x=0\\) liegt ein Tiefpunkt (der Graph berührt dort die \\(x\\)-Achse), bei \\(x=2\\) ein Hochpunkt mit \\(f(2)=\\frac{4}{e^{2}} \\approx 0{,}54\\). Die Kettenregel hat der Schüler übrigens richtig angewandt; sie ist nicht die Fehlerquelle." },
      { id:27, level:5, typ:"numerisch", frage:"Der Graph von \\(f(x)=x^{3}+a\\,e^{x}\\) hat an der Stelle \\(x=2\\) einen Wendepunkt. Bestimme \\(a\\) gerundet.", loesung:-1.624, toleranz:0.01, tipp:"Übersetze die Angabe über den Wendepunkt in eine Bedingung an die zweite Ableitung, werte diese an der genannten Stelle aus und löse nach dem Parameter auf.", loesungsweg:"Zweimal ableiten; der Exponentialterm bleibt dabei erhalten: $$f'(x) = 3x^{2} + a\\,e^{x} \\;\\Rightarrow\\; f''(x) = 6x + a\\,e^{x}$$ Bedingung \\(f''(2) = 0\\): $$12 + a\\,e^{2} = 0 \\;\\Rightarrow\\; a = -\\frac{12}{e^{2}} \\approx -1{,}6240$$ Nachweis, dass es wirklich ein Wendepunkt ist: $$f'''(x) = 6 + a\\,e^{x} \\;\\Rightarrow\\; f'''(2) = 6 - 12 = -6 \\neq 0$$ Die zweite Ableitung wechselt dort also das Vorzeichen. Die Bedingung \\(f''=0\\) allein genügt nie — sonst könnte auch ein Flachpunkt vorliegen." },
      { id:28, level:5, typ:"numerisch", frage:"Welchen größten Funktionswert nimmt \\(f(x)=\\sin x + \\cos x\\) im Intervall \\([0;2\\pi]\\) an (gerundet)?", loesung:1.414, toleranz:0.01, tipp:"Erst die Stellen mit waagerechter Tangente bestimmen, dann dort die Funktionswerte berechnen und mit den Randwerten vergleichen.", loesungsweg:"Erster Schritt — waagerechte Tangenten: $$f'(x) = \\cos x - \\sin x = 0 \\;\\Rightarrow\\; \\tan x = 1$$ Im Intervall \\([0;2\\pi]\\) trifft das auf \\(x = \\frac{\\pi}{4}\\) und \\(x = \\frac{5\\pi}{4}\\) zu. Zweiter Schritt — Werte vergleichen: $$f\\left(\\tfrac{\\pi}{4}\\right) = \\tfrac{\\sqrt2}{2} + \\tfrac{\\sqrt2}{2} = \\sqrt2 \\approx 1{,}414$$ $$f\\left(\\tfrac{5\\pi}{4}\\right) = -\\sqrt2 \\approx -1{,}414$$ Die Randwerte sind \\(f(0) = f(2\\pi) = 1\\) und damit kleiner. Der größte Wert ist also \\(\\sqrt2\\)." },
      { id:29, level:5, typ:"numerisch", frage:"Welche Steigung hat die Tangente an den Graphen von \\(f(x)=e^{-x^{2}}\\) an dessen positiver Wendestelle (gerundet)?", loesung:-0.858, toleranz:0.01, tipp:"Zwei Schritte: zuerst die Wendestelle über die zweite Ableitung bestimmen, dann dort die erste Ableitung auswerten.", loesungsweg:"Erster Schritt — Wendestelle. Mit der Kettenregel: $$f'(x) = -2x\\,e^{-x^{2}}$$ und mit der Produktregel weiter $$f''(x) = -2e^{-x^{2}} + 4x^{2}e^{-x^{2}} = e^{-x^{2}}\\left(4x^{2}-2\\right)$$ Nullsetzen: \\(4x^{2} = 2\\), also \\(x = \\frac{1}{\\sqrt2} \\approx 0{,}707\\) (positive Lösung). Zweiter Schritt — Steigung dort: $$f'\\left(\\tfrac{1}{\\sqrt2}\\right) = -2 \\cdot \\tfrac{1}{\\sqrt2} \\cdot e^{-1/2} = -\\sqrt2\\,e^{-0{,}5} \\approx -0{,}8578$$ Das ist zugleich die größte Steigung dem Betrage nach — an der Wendestelle fällt die Glockenkurve am steilsten." },
      { id:30, level:5, typ:"numerisch", frage:"Für welches \\(a>0\\) hat der Graph von \\(f(x)=a\\sin x + x\\) im Intervall \\([0;2\\pi]\\) genau eine Stelle mit waagerechter Tangente?", loesung:1, toleranz:0, tipp:"Stelle die Ableitungsgleichung nach dem Kosinuswert um und überlege, wie die Anzahl der Lösungen von diesem Wert abhängt.", loesungsweg:"Ableiten und umstellen: $$f'(x) = a\\cos x + 1 = 0 \\;\\Rightarrow\\; \\cos x = -\\frac{1}{a}$$ Die Anzahl der Lösungen hängt davon ab, wo \\(-\\frac1a\\) liegt: <br>für \\(a<1\\) ist \\(-\\frac1a < -1\\) — der Kosinus nimmt solche Werte nie an, es gibt keine Lösung; <br>für \\(a=1\\) ist \\(-\\frac1a = -1\\), und der Kosinus erreicht \\(-1\\) im Intervall genau einmal, bei \\(x=\\pi\\); <br>für \\(a>1\\) liegt \\(-\\frac1a\\) zwischen \\(-1\\) und \\(0\\), das ergibt zwei Lösungen. Genau eine Stelle gibt es also für $$a = 1$$" },
      // L6 -- AFB III: Behauptung pruefen, Fallunterscheidung, Abi-Format eA
      { id:31, level:6, typ:"mc", frage:"Beurteilen Sie: „Die Werte von \\(f(x)=x^{2}e^{-x}\\) wachsen für große \\(x\\) über alle Grenzen, weil \\(x^{2}\\) über alle Grenzen wächst.“ Welche Beurteilung trägt?", optionen:["Sie trifft nicht zu: \\(e^{-x}\\) fällt schneller, als \\(x^{2}\\) wächst, die Werte streben gegen \\(0\\)","Sie trifft zu: ein Produkt aus einem wachsenden und einem positiven Faktor wächst stets","Sie trifft nicht zu: für große \\(x\\) wird \\(e^{-x}\\) negativ und das Produkt damit ebenfalls","Sie trifft zu, allerdings erst jenseits des Hochpunkts bei \\(x=2\\) statt von Anfang an"], korrekt:0, tipp:"Vergleiche, wie schnell die beiden Faktoren sich ändern, und prüfe die Behauptung an einer großen Zahl.", loesungsweg:"Maßgeblich ist, welcher Faktor sich durchsetzt. Die Exponentialfunktion fällt schneller, als jede Potenz wächst: $$\\lim_{x \\to \\infty} x^{2}e^{-x} = 0$$ Zahlenprobe: \\(f(10) = \\frac{100}{e^{10}} \\approx 0{,}0045\\), \\(f(20) = \\frac{400}{e^{20}} \\approx 8 \\cdot 10^{-7}\\) — die Werte werden kleiner, nicht größer. Die dritte Antwort ist falsch, weil \\(e^{-x}\\) für jedes \\(x\\) positiv bleibt; sie wird nur beliebig klein. Der Graph hat bei \\(x=2\\) seinen Hochpunkt und nähert sich danach der \\(x\\)-Achse von oben." },
      { id:32, level:6, typ:"numerisch", frage:"Wie viele Stellen mit waagerechter Tangente hat der Graph von \\(f(x)=\\sin(2x)+x\\) im Intervall \\([0;2\\pi]\\)?", loesung:4, toleranz:0, tipp:"Setze die Ableitung null, stelle nach dem Kosinuswert um und bedenke, welchen Bereich das Doppelte von \\(x\\) dabei durchläuft.", loesungsweg:"Ableiten mit der Kettenregel: $$f'(x) = 2\\cos(2x) + 1 = 0 \\;\\Rightarrow\\; \\cos(2x) = -\\frac12$$ Während \\(x\\) das Intervall \\([0;2\\pi]\\) durchläuft, durchläuft \\(2x\\) das doppelt so lange Intervall \\([0;4\\pi]\\) — der Kosinus vollendet dort <b>zwei</b> volle Perioden. Pro Periode wird der Wert \\(-\\frac12\\) zweimal angenommen, insgesamt also viermal: $$2x \\in \\left\\{\\tfrac{2\\pi}{3},\\ \\tfrac{4\\pi}{3},\\ \\tfrac{8\\pi}{3},\\ \\tfrac{10\\pi}{3}\\right\\}$$ $$x \\in \\left\\{\\tfrac{\\pi}{3},\\ \\tfrac{2\\pi}{3},\\ \\tfrac{4\\pi}{3},\\ \\tfrac{5\\pi}{3}\\right\\}$$ Es sind \\(4\\) Stellen. Wer die Verdopplung des Arguments übersieht, kommt fälschlich auf zwei." },
      { id:33, level:6, typ:"numerisch", frage:"Gegeben ist \\(f(x)=(x-4)\\,e^{x}\\). Zeigen Sie, dass der Graph genau einen Extrempunkt und genau einen Wendepunkt besitzt, und geben Sie die \\(x\\)-Koordinate des Wendepunkts an.", loesung:2, toleranz:0, tipp:"Bilde beide Ableitungen mit der Produktregel und begründe jeweils, warum der Exponentialterm für die Nullstellensuche ausscheidet.", loesungsweg:"Erste Ableitung: $$f'(x) = e^{x} + (x-4)e^{x} = e^{x}(x-3)$$ Der Faktor \\(e^{x}\\) ist stets positiv, also gibt es genau eine Nullstelle, bei \\(x=3\\); dort wechselt \\(f'\\) von \\(-\\) nach \\(+\\) — genau ein Extrempunkt, ein Tiefpunkt. Zweite Ableitung: $$f''(x) = e^{x}(x-3) + e^{x} = e^{x}(x-2)$$ Wieder genau eine Nullstelle, bei \\(x=2\\), mit Vorzeichenwechsel von \\(-\\) nach \\(+\\) — genau ein Wendepunkt. Seine \\(x\\)-Koordinate ist $$x = 2$$ Der zugehörige Punkt ist \\(\\left(2 \\mid -2e^{2}\\right)\\); der Wendepunkt liegt links vom Tiefpunkt." },
      { id:34, level:6, typ:"numerisch", frage:"Gegeben ist die Schar \\(f_a(x)=x^{2}e^{-ax}\\) mit \\(a>0\\). Zeigen Sie, dass jeder Graph genau einen Hochpunkt besitzt, und bestimmen Sie \\(a\\) so, dass dieser Hochpunkt die \\(y\\)-Koordinate \\(1\\) hat (gerundet).", loesung:0.736, toleranz:0.005, tipp:"Bestimme die Stellen mit waagerechter Tangente in Abhängigkeit vom Parameter, ordne ihnen über den Vorzeichenwechsel die Art zu und setze erst dann die Bedingung an die Höhe an.", loesungsweg:"Ableiten mit Produkt- und Kettenregel: $$f_a'(x) = 2x\\,e^{-ax} - a x^{2}e^{-ax} = x\\,e^{-ax}(2 - ax)$$ Nullstellen: \\(x = 0\\) und \\(x = \\frac{2}{a}\\). Weil \\(f_a(x) = x^{2}e^{-ax} \\geq 0\\) ist und der Graph an der ersten Stelle die \\(x\\)-Achse berührt, liegt dort ein Tiefpunkt; an der zweiten wechselt \\(f_a'\\) von \\(+\\) nach \\(-\\) — genau ein Hochpunkt, und zwar für jedes \\(a>0\\). Seine Höhe: $$f_a\\left(\\tfrac{2}{a}\\right) = \\frac{4}{a^{2}}e^{-2}$$ Bedingung ansetzen: $$\\frac{4}{a^{2}e^{2}} = 1 \\;\\Rightarrow\\; a^{2} = \\frac{4}{e^{2}} \\;\\Rightarrow\\; a = \\frac{2}{e} \\approx 0{,}7358$$ Nur die positive Wurzel kommt wegen \\(a>0\\) in Frage." },
      { id:35, level:6, typ:"mc", frage:"Beurteilen Sie: „Der Graph von \\(f(x)=\\sin x \\cdot e^{-x}\\) schneidet die \\(x\\)-Achse unendlich oft.“ Welche Beurteilung trägt?", optionen:["Sie trifft zu: \\(e^{-x}\\) ist nie null, und \\(\\sin x\\) hat unendlich viele Nullstellen","Sie trifft nicht zu: für große \\(x\\) ist der Funktionswert zu klein für einen Schnitt","Sie trifft nicht zu: das Produkt zweier Funktionen hat höchstens endlich viele Nullstellen","Sie trifft zu: der Faktor \\(e^{-x}\\) erzeugt selbst unendlich viele Nullstellen"], korrekt:0, tipp:"Untersuche die beiden Faktoren getrennt auf Nullstellen und überlege, welcher davon überhaupt welche beisteuern kann.", loesungsweg:"Ein Produkt ist genau dann null, wenn ein Faktor null ist. Der Faktor \\(e^{-x}\\) ist für jedes \\(x\\) positiv und liefert daher keine einzige Nullstelle. Übrig bleibt: $$\\sin x = 0 \\;\\Rightarrow\\; x = k\\pi,\\quad k \\in \\mathbb{Z}$$ Das sind unendlich viele Stellen, die Behauptung trifft also zu. Dass die Funktionswerte zwischen den Nullstellen für große \\(x\\) winzig werden, ändert daran nichts — klein ist nicht null. Der Graph ist eine gedämpfte Schwingung: Sie wird immer flacher, kreuzt die Achse aber weiterhin in gleichen Abständen \\(\\pi\\)." },
      { id:36, level:6, typ:"numerisch", frage:"Gegeben ist \\(f(x)=x\\sqrt{4-x^{2}}\\) auf dem Intervall \\([-2;2]\\). Bestimmen Sie den größten Funktionswert.", loesung:2, toleranz:0, tipp:"Der Term ist ein Produkt, dessen zweiter Faktor eine Wurzel ist; nach dem Ableiten lässt sich alles über einen gemeinsamen Nenner zusammenfassen.", loesungsweg:"Produktregel, der Wurzelterm nach der Kettenregel: $$f'(x) = \\sqrt{4-x^{2}} + x \\cdot \\frac{-2x}{2\\sqrt{4-x^{2}}} = \\sqrt{4-x^{2}} - \\frac{x^{2}}{\\sqrt{4-x^{2}}}$$ Auf einen Nenner bringen: $$f'(x) = \\frac{\\left(4-x^{2}\\right) - x^{2}}{\\sqrt{4-x^{2}}} = \\frac{4-2x^{2}}{\\sqrt{4-x^{2}}}$$ Ein Bruch ist null, wenn der Zähler null ist: \\(x^{2} = 2\\), also \\(x = \\pm\\sqrt2\\). Werte vergleichen: $$f\\left(\\sqrt2\\right) = \\sqrt2 \\cdot \\sqrt{4-2} = \\sqrt2 \\cdot \\sqrt2 = 2$$ $$f\\left(-\\sqrt2\\right) = -2$$ An den Rändern ist \\(f(\\pm 2) = 0\\). Der größte Wert ist also \\(2\\). Der Definitionsbereich ergibt sich aus \\(4-x^{2} \\geq 0\\) und stimmt mit dem angegebenen Intervall überein." }];
