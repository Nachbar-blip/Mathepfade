<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumgeometrie: Anwendungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-raumgeometrie-anwendungen';
    const THEMA_CONFIG = { name: 'Raumgeometrie: Anwendungen', bereich: 'geometrie' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"1 Liter entspricht wie viel cm³?", optionen:["10","100","1000","10000"], korrekt:2, tipp:"Einheit.", loesungsweg:"Ein Liter ist als das Volumen eines Würfels mit \\(10\\,\\text{cm}\\) Kantenlänge festgelegt: $$10 \\cdot 10 \\cdot 10 = 1000\\,\\text{cm}^3$$ Daraus folgt auch \\(1\\,\\text{ml} = 1\\,\\text{cm}^3\\)." },
      { id:2, level:1, typ:"mc", frage:"1 m³ entspricht wie viel Liter?", optionen:["100","1000","10000","100000"], korrekt:1, tipp:"Volumeneinheit.", loesungsweg:"Ein Kubikmeter ist ein Würfel mit \\(100\\,\\text{cm}\\) Kantenlänge: $$100^3 = 1\\,000\\,000\\,\\text{cm}^3 = 1000\\,\\text{l}$$ Bei Volumen ist der Umrechnungsfaktor also \\(1000\\), nicht \\(100\\) wie bei Flächen." },
      { id:3, level:1, typ:"numerisch", frage:"Badewanne \\(160\\times 70\\times 50\\,\\text{cm}\\). Max Inhalt in Litern.", loesung:560, toleranz:1, tipp:"\\(V/1000\\).", loesungsweg:"$$V = 160 \\cdot 70 \\cdot 50 = 560\\,000\\,\\text{cm}^3$$ Geteilt durch \\(1000\\): \\(560\\) Liter." },
      { id:4, level:1, typ:"numerisch", frage:"Wasser-Glas (Zylinder) \\(r=3\\,\\text{cm}, h=10\\,\\text{cm}\\). Inhalt (ml, 2 Dez).", loesung:282.74, toleranz:1, tipp:"\\(90\\pi\\).", loesungsweg:"$$V = \\pi \\cdot 3^2 \\cdot 10 = 90\\pi \\approx 282{,}74\\,\\text{cm}^3$$ Wegen \\(1\\,\\text{cm}^3 = 1\\,\\text{ml}\\) sind das rund \\(283\\) Milliliter." },
      { id:5, level:1, typ:"numerisch", frage:"Paketkarton \\(40\\times 30\\times 20\\,\\text{cm}\\). Oberfläche (cm²).", loesung:5200, toleranz:0, tipp:"\\(2(ab+bc+ac)\\).", loesungsweg:"Ein Quader hat drei Paare gegenüberliegender Flächen: $$O = 2(40\\cdot30 + 30\\cdot20 + 40\\cdot20) = 2(1200 + 600 + 800) = 5200\\,\\text{cm}^2$$" },
      { id:6, level:1, typ:"mc", frage:"1 ha entspricht …", optionen:["100 m²","1000 m²","10000 m²","1 km²"], korrekt:2, tipp:"Einheit Fläche.", loesungsweg:"Ein Hektar ist ein Quadrat mit \\(100\\,\\text{m}\\) Seitenlänge: $$100 \\cdot 100 = 10\\,000\\,\\text{m}^2$$ Hundert Hektar ergeben einen Quadratkilometer." },
      { id:7, level:2, typ:"numerisch", frage:"Swimmingpool \\(8\\times 4\\times 1{,}5\\,\\text m\\). Volumen m³.", loesung:48, toleranz:0, tipp:"Quader.", loesungsweg:"$$V = 8 \\cdot 4 \\cdot 1{,}5 = 48\\,\\text{m}^3$$" },
      { id:8, level:2, typ:"numerisch", frage:"Swimmingpool \\(8\\times 4\\times 1{,}5\\,\\text m\\). Wasserverbrauch in Liter.", loesung:48000, toleranz:10, tipp:"m³·1000.", loesungsweg:"Aus dem Volumen in Kubikmetern werden mit dem Faktor \\(1000\\) Liter: $$48\\,\\text{m}^3 \\cdot 1000 = 48\\,000\\,\\text{l}$$" },
      { id:9, level:2, typ:"numerisch", frage:"Zylindrische Regentonne \\(r=0{,}4\\,\\text m, h=1\\,\\text m\\). Inhalt (l, 0 Dez).", loesung:503, toleranz:2, tipp:"\\(\\pi\\cdot 0{,}16\\cdot 1\\,\\text m^3\\).", loesungsweg:"$$V = \\pi \\cdot 0{,}4^2 \\cdot 1 = 0{,}16\\pi \\approx 0{,}503\\,\\text{m}^3$$ In Litern: rund \\(503\\)." },
      { id:10, level:2, typ:"numerisch", frage:"Pool \\(8\\times 4\\,\\text m\\), Tiefe 1,5m. Wie lange dauert Füllen bei 20 l/min (h, 1 Dez)?", loesung:40.0, toleranz:0.2, tipp:"\\(48000/20=2400\\) min.", loesungsweg:"Der Pool fasst \\(48\\,000\\) Liter, es fließen \\(20\\) Liter pro Minute: $$\\frac{48\\,000}{20} = 2400 \\text{ Minuten}$$ $$\\frac{2400}{60} = 40{,}0 \\text{ Stunden}$$" },
      { id:11, level:2, typ:"numerisch", frage:"Zuckerwürfel Kante 1 cm. Dichte 1,6 g/cm³. Masse g?", loesung:1.6, toleranz:0.05, tipp:"\\(V\\cdot\\rho\\).", loesungsweg:"Der Würfel hat das Volumen \\(1^3 = 1\\,\\text{cm}^3\\). Masse ist Volumen mal Dichte: $$m = 1 \\cdot 1{,}6 = 1{,}6\\,\\text{g}$$" },
      { id:12, level:2, typ:"mc", frage:"Wie viele Würfel Kante 2 cm passen in einen Würfel Kante 6 cm?", optionen:["9","18","27","36"], korrekt:2, tipp:"\\(3^3\\).", loesungsweg:"In jede Kantenrichtung passen \\(6 : 2 = 3\\) kleine Würfel, und das in allen drei Richtungen: $$3 \\cdot 3 \\cdot 3 = 27$$ Über die Volumen gerechnet kommt dasselbe heraus: \\(216 : 8 = 27\\)." },
      { id:13, level:3, typ:"numerisch", frage:"Konservendose: \\(r=4\\,\\text{cm}, h=12\\,\\text{cm}\\). Etikettengröße (Mantel, cm², 2 Dez)?", loesung:301.59, toleranz:1, tipp:"\\(2\\pi rh\\).", loesungsweg:"Das Etikett umschließt den Mantel, nicht die Deckel: $$M = 2\\pi r h = 2\\pi \\cdot 4 \\cdot 12 = 96\\pi \\approx 301{,}59\\,\\text{cm}^2$$" },
      { id:14, level:3, typ:"numerisch", frage:"Dachboden (Prisma, Dreieckquerschnitt Basis 8m, Höhe 3m), Länge 10m. Volumen m³.", loesung:120, toleranz:0, tipp:"\\(G=12\\).", loesungsweg:"Der Querschnitt ist ein Dreieck mit \\(G = \\frac{8 \\cdot 3}{2} = 12\\,\\text{m}^2\\). Das Prisma ist \\(10\\,\\text{m}\\) lang: $$V = 12 \\cdot 10 = 120\\,\\text{m}^3$$" },
      { id:15, level:3, typ:"numerisch", frage:"Schokolade (Quader) \\(15\\times 7\\times 1\\,\\text{cm}\\), Dichte 1,3 g/cm³. Masse g?", loesung:136.5, toleranz:0.5, tipp:"\\(V\\cdot\\rho\\).", loesungsweg:"Volumen: \\(15 \\cdot 7 \\cdot 1 = 105\\,\\text{cm}^3\\). Masse ist Volumen mal Dichte: $$m = 105 \\cdot 1{,}3 = 136{,}5\\,\\text{g}$$" },
      { id:16, level:3, typ:"numerisch", frage:"Kugel-Eiskugel (\\(r=2{,}5\\,\\text{cm}\\)) passt in Waffel-Kegel (\\(r=3, h=10\\)). Platz (ml, 2 Dez)?", loesung:28.80, toleranz:1, tipp:"\\(V_K-V_{Kugel}=30\\pi-\\frac{4}{3}\\pi\\cdot 15{,}625\\).", loesungsweg:"\\(V_{Kegel}=\\frac{1}{3}\\pi\\cdot 3^2\\cdot 10=30\\pi\\approx 94{,}25\\); \\(V_{Kugel}=\\frac{4}{3}\\pi(2{,}5)^3=\\frac{4}{3}\\pi\\cdot 15{,}625\\approx 65{,}45\\); Differenz \\(\\approx 28{,}80\\,\\text{cm}^3\\)." },
      { id:17, level:3, typ:"numerisch", frage:"Holzbrett \\(200\\times 20\\times 3\\,\\text{cm}\\). Volumen cm³.", loesung:12000, toleranz:0, tipp:"Produkt.", loesungsweg:"$$V = 200 \\cdot 20 \\cdot 3 = 12\\,000\\,\\text{cm}^3$$ Das entspricht \\(12\\) Litern." },
      { id:18, level:3, typ:"mc", frage:"Welche Einheit passt zu Rauminhalt?", optionen:["m²","m","m³","m/s"], korrekt:2, tipp:"Volumen.", loesungsweg:"Ein Rauminhalt erstreckt sich in drei Richtungen — Länge mal Breite mal Höhe —, deshalb steht die Einheit in der dritten Potenz: \\(\\text{m}^3\\). Flächen haben \\(\\text{m}^2\\), Längen \\(\\text{m}\\), und \\(\\text{m/s}\\) ist eine Geschwindigkeit." },
      { id:19, level:4, typ:"numerisch", frage:"Eine zylindrische Regentonne ist \\(1{,}2\\,\\text{m}\\) hoch und fasst genau \\(300\\) Liter. Wie groß ist ihr Innendurchmesser in cm? Runde auf eine Dezimale.", loesung:56.4, toleranz:0.3, tipp:"Rechne zuerst die Liter in \\(\\text{m}^3\\) um und überlege, welche Größe im Volumen des Zylinders noch unbekannt ist.", loesungsweg:"\\(300\\,\\text{l} = 0{,}3\\,\\text{m}^3\\). Aus \\(V = \\pi r^2 h\\) folgt $$r^2 = \\frac{0{,}3}{\\pi \\cdot 1{,}2} \\approx 0{,}0796 \\quad\\Rightarrow\\quad r \\approx 0{,}282\\,\\text{m}$$ Der Durchmesser ist das Doppelte: \\(d \\approx 0{,}564\\,\\text{m} = 56{,}4\\,\\text{cm}\\)." },
      { id:20, level:4, typ:"numerisch", frage:"Eine Lagerhalle besteht aus einem quaderförmigen Unterbau (\\(20\\,\\text{m}\\) lang, \\(12\\,\\text{m}\\) breit, \\(4\\,\\text{m}\\) hoch) und einem Satteldach darüber, dessen First \\(3\\,\\text{m}\\) über der Wandoberkante liegt und über die ganze Länge verläuft. Wie viel Kubikmeter Luft enthält die Halle?", loesung:1320, toleranz:0, tipp:"Der Dachraum ist ein Prisma; sein Querschnitt ist ein Dreieck mit der Hallenbreite als Grundseite.", loesungsweg:"Unterbau: \\(20 \\cdot 12 \\cdot 4 = 960\\,\\text{m}^3\\). Dachraum: Dreiecksprisma mit Querschnitt \\(\\frac{12 \\cdot 3}{2} = 18\\,\\text{m}^2\\) und Länge \\(20\\,\\text{m}\\): \\(18 \\cdot 20 = 360\\,\\text{m}^3\\). $$V = 960 + 360 = 1320\\,\\text{m}^3$$" },
      { id:21, level:4, typ:"numerisch", frage:"Ein würfelförmiger Wassertank fasst \\(512\\) Liter. Wie lang ist seine Kante in cm?", loesung:80, toleranz:0, tipp:"Rechne die Liter in \\(\\text{cm}^3\\) um; gesucht ist die Zahl, deren dritte Potenz das Volumen ergibt.", loesungsweg:"\\(512\\,\\text{l} = 512\\,000\\,\\text{cm}^3\\). Aus \\(a^3 = 512\\,000\\) folgt $$a = \\sqrt[3]{512\\,000} = 80\\,\\text{cm}$$ denn \\(80^3 = 512\\,000\\)." },
      { id:22, level:4, typ:"numerisch", frage:"Eine zylindrische Betonsäule (Durchmesser \\(40\\,\\text{cm}\\), Höhe \\(2{,}5\\,\\text{m}\\)) steht auf dem Boden und soll rundum und oben gestrichen werden. Wie viel Quadratmeter Fläche sind das? Runde auf zwei Dezimalen.", loesung:3.27, toleranz:0.02, tipp:"Überlege, welche Teile der Oberfläche gestrichen werden und welche nicht.", loesungsweg:"Der Boden wird nicht gestrichen. Radius \\(r = 0{,}2\\,\\text{m}\\). Mantel: \\(2\\pi r h = 2\\pi \\cdot 0{,}2 \\cdot 2{,}5 \\approx 3{,}14\\,\\text{m}^2\\). Deckfläche: \\(\\pi r^2 = \\pi \\cdot 0{,}04 \\approx 0{,}13\\,\\text{m}^2\\). $$A \\approx 3{,}14 + 0{,}13 = 3{,}27\\,\\text{m}^2$$" },
      { id:23, level:4, typ:"numerisch", frage:"Ein kegelförmiger Trichter (Öffnung \\(12\\,\\text{cm}\\) Durchmesser, Höhe \\(9\\,\\text{cm}\\)) ist randvoll mit Wasser. Unten fließen gleichmäßig \\(20\\,\\text{ml}\\) pro Sekunde ab. Nach wie vielen Sekunden ist der Trichter leer? Runde auf eine Dezimale.", loesung:17.0, toleranz:0.1, tipp:"Bestimme zuerst, wie viele Milliliter im Trichter sind; \\(1\\,\\text{ml} = 1\\,\\text{cm}^3\\).", loesungsweg:"Radius \\(r = 6\\,\\text{cm}\\). $$V = \\tfrac{1}{3}\\pi \\cdot 6^2 \\cdot 9 = 108\\pi \\approx 339{,}3\\,\\text{cm}^3 = 339{,}3\\,\\text{ml}$$ Bei \\(20\\,\\text{ml/s}\\): \\(339{,}3 : 20 \\approx 17{,}0\\,\\text{s}\\)." },
      { id:24, level:4, typ:"mc", frage:"Zwei Kerzen aus demselben Wachs: eine zylindrische mit Radius \\(3\\,\\text{cm}\\) und Höhe \\(10\\,\\text{cm}\\), eine kegelförmige mit Radius \\(6\\,\\text{cm}\\) und Höhe \\(10\\,\\text{cm}\\). Welche Aussage über die Wachsmengen stimmt?", optionen:["Der Kegel enthält \\(30\\pi\\,\\text{cm}^3\\) mehr Wachs", "Der Zylinder enthält \\(30\\pi\\,\\text{cm}^3\\) mehr Wachs", "Beide enthalten genau gleich viel Wachs", "Der Kegel enthält \\(10\\pi\\,\\text{cm}^3\\) mehr Wachs"], korrekt:0, tipp:"Berechne beide Volumen getrennt und lasse \\(\\pi\\) als Faktor stehen.", loesungsweg:"Zylinder: \\(\\pi \\cdot 3^2 \\cdot 10 = 90\\pi\\). Kegel: \\(\\tfrac{1}{3}\\pi \\cdot 6^2 \\cdot 10 = 120\\pi\\). $$120\\pi - 90\\pi = 30\\pi\\,\\text{cm}^3$$ Der Kegel enthält trotz des Faktors \\(\\tfrac13\\) mehr Wachs, weil der doppelte Radius vierfach in die Grundfläche eingeht." },
      { id:25, level:5, typ:"mc", frage:"Für das Volumen einer Kugel mit Radius \\(3\\,\\text{cm}\\) rechnet jemand: \\(V = \\tfrac{4}{3}\\pi \\cdot 3^2 = 12\\pi \\approx 37{,}7\\,\\text{cm}^3\\). Was ist dazu zu sagen?", optionen:["Falsch, der Radius gehört in der dritten Potenz hinein", "Falsch, der Faktor müsste \\(\\tfrac{3}{4}\\) statt \\(\\tfrac{4}{3}\\) sein", "Die Rechnung ist vollständig richtig und fertig", "Falsch, bei Kugeln steht \\(2\\pi\\) statt \\(\\pi\\) in der Formel"], korrekt:0, tipp:"Ein Volumen hat die Einheit \\(\\text{cm}^3\\); prüfe, ob die Länge so oft vorkommt.", loesungsweg:"Das Kugelvolumen ist \\(V = \\tfrac{4}{3}\\pi r^3\\); der Radius geht in der dritten Potenz ein, denn ein Volumen braucht drei Längen. Richtig: $$V = \\tfrac{4}{3}\\pi \\cdot 3^3 = 36\\pi \\approx 113{,}1\\,\\text{cm}^3$$ Mit \\(r^2\\) wäre die Einheit nur \\(\\text{cm}^2\\)." },
      { id:26, level:5, typ:"numerisch", frage:"Ein Getreidesilo besteht aus einem stehenden Zylinder (Durchmesser \\(3\\,\\text{m}\\), Höhe \\(5\\,\\text{m}\\)) und darunter einem kegelförmigen Auslauf gleichen Durchmessers mit \\(1{,}5\\,\\text{m}\\) Höhe. Weizen hat die Dichte \\(0{,}75\\,\\text{t/m}^3\\). Wie viele Tonnen Weizen fasst das volle Silo? Runde auf eine Dezimale.", loesung:29.2, toleranz:0.1, tipp:"Zwei Teilkörper mit demselben Radius, aber verschiedenen Höhen; die Masse folgt aus dem Gesamtvolumen.", loesungsweg:"Radius \\(r = 1{,}5\\,\\text{m}\\). Zylinder: \\(\\pi \\cdot 1{,}5^2 \\cdot 5 = 11{,}25\\pi\\). Kegel: \\(\\tfrac13 \\pi \\cdot 1{,}5^2 \\cdot 1{,}5 = 1{,}125\\pi\\). $$V = 12{,}375\\pi \\approx 38{,}88\\,\\text{m}^3$$ Masse: \\(38{,}88 \\cdot 0{,}75 \\approx 29{,}2\\,\\text{t}\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Ein Quader hat eine quadratische Grundfläche; seine Höhe ist doppelt so lang wie eine Grundkante. Sein Volumen beträgt \\(250\\,\\text{cm}^3\\). Wie groß ist seine Oberfläche in \\(\\text{cm}^2\\)?", loesung:250, toleranz:0, tipp:"Bezeichne die Grundkante mit \\(a\\) und drücke die Höhe durch \\(a\\) aus; dann ist das Volumen ein Term in \\(a\\).", loesungsweg:"Mit Grundkante \\(a\\) und Höhe \\(2a\\): \\(V = a \\cdot a \\cdot 2a = 2a^3 = 250\\), also \\(a^3 = 125\\) und \\(a = 5\\,\\text{cm}\\), \\(h = 10\\,\\text{cm}\\). $$O = 2 \\cdot 5^2 + 4 \\cdot 5 \\cdot 10 = 50 + 200 = 250\\,\\text{cm}^2$$" },
      { id:28, level:5, typ:"mc", frage:"Für die Oberfläche eines Zylinders mit \\(r = 2\\,\\text{cm}\\) und \\(h = 5\\,\\text{cm}\\) rechnet jemand: \\(O = 2\\pi \\cdot 2 \\cdot 5 = 20\\pi\\,\\text{cm}^2\\). Was ist dazu zu sagen?", optionen:["Es fehlen beide Kreisflächen, richtig sind \\(28\\pi\\,\\text{cm}^2\\)", "Der Mantel ist falsch, richtig sind \\(2\\pi r^2 = 8\\pi\\,\\text{cm}^2\\)", "Die Rechnung ist vollständig richtig und fertig", "Es fehlt eine Kreisfläche, richtig sind \\(24\\pi\\,\\text{cm}^2\\)"], korrekt:0, tipp:"Stelle dir das Zylindernetz vor: Aus welchen Teilen besteht es?", loesungsweg:"\\(20\\pi\\) ist nur der Mantel. Ein Zylinder hat zusätzlich zwei Kreisflächen: $$O = 2\\pi r h + 2\\pi r^2 = 20\\pi + 2\\pi \\cdot 4 = 28\\pi\\,\\text{cm}^2 \\approx 88\\,\\text{cm}^2$$" },
      { id:29, level:5, typ:"numerisch", frage:"Ein quaderförmiges Aquarium (innen \\(80\\,\\text{cm}\\) lang, \\(40\\,\\text{cm}\\) breit, \\(50\\,\\text{cm}\\) hoch) ist zu drei Vierteln mit Wasser gefüllt. Dann werden Steine mit insgesamt \\(8\\) Litern Volumen hineingelegt, die ganz unter Wasser liegen. Wie hoch steht das Wasser danach in cm? Runde auf eine Dezimale.", loesung:40.0, toleranz:0.1, tipp:"Die Steine verdrängen Wasser; die Grundfläche des Beckens bleibt dieselbe.", loesungsweg:"Wasserhöhe vorher: \\(\\tfrac34 \\cdot 50 = 37{,}5\\,\\text{cm}\\). Grundfläche \\(80 \\cdot 40 = 3200\\,\\text{cm}^2\\). Die Steine (\\(8000\\,\\text{cm}^3\\)) heben den Spiegel um $$\\frac{8000}{3200} = 2{,}5\\,\\text{cm}$$ Neue Höhe: \\(37{,}5 + 2{,}5 = 40{,}0\\,\\text{cm}\\)." },
      { id:30, level:5, typ:"numerisch", frage:"Eine Kugel und ein Zylinder haben denselben Radius \\(6\\,\\text{cm}\\) und dasselbe Volumen. Wie hoch ist der Zylinder in cm?", loesung:8, toleranz:0.01, tipp:"Setze die beiden Volumenterme gleich; \\(\\pi\\) und der Radius kürzen sich teilweise heraus.", loesungsweg:"$$\\tfrac{4}{3}\\pi \\cdot 6^3 = \\pi \\cdot 6^2 \\cdot h \\quad\\Rightarrow\\quad h = \\tfrac{4}{3} \\cdot 6 = 8\\,\\text{cm}$$ Allgemein gilt \\(h = \\tfrac43 r\\); ein Zylinder muss also etwas höher als der Kugeldurchmesser sein, um die Kugel volumenmäßig aufzuwiegen." },
      { id:31, level:6, typ:"mc", frage:"Behauptung: „Verdoppelt man bei einem Zylinder den Radius und halbiert die Höhe, so bleibt das Volumen gleich.“ Stimmt das?", optionen:["Nein, das Volumen verdoppelt sich dabei", "Ja, beide Änderungen heben sich genau auf", "Nein, das Volumen vervierfacht sich dabei", "Nein, das Volumen halbiert sich dabei"], korrekt:0, tipp:"Setze \\(2r\\) und \\(\\tfrac{h}{2}\\) in den Volumenterm ein und vergleiche mit \\(\\pi r^2 h\\).", loesungsweg:"$$V_{neu} = \\pi (2r)^2 \\cdot \\tfrac{h}{2} = \\pi \\cdot 4r^2 \\cdot \\tfrac{h}{2} = 2\\pi r^2 h = 2V$$ Der Radius geht quadratisch ein, die Höhe nur linear; die Behauptung ist falsch, das Volumen verdoppelt sich." },
      { id:32, level:6, typ:"numerisch", frage:"Ein Modell eines Öltanks im Maßstab \\(1:20\\) fasst \\(2\\) Liter. Wie viele Kubikmeter fasst der echte Tank?", loesung:16, toleranz:0, tipp:"Überlege, mit welcher Potenz des Maßstabsfaktors ein Volumen wächst.", loesungsweg:"Alle Längen werden mit \\(k = 20\\) gestreckt, Volumen wachsen mit \\(k^3\\): $$2\\,\\text{l} \\cdot 20^3 = 2 \\cdot 8000 = 16\\,000\\,\\text{l} = 16\\,\\text{m}^3$$" },
      { id:33, level:6, typ:"numerisch", frage:"Für ein Denkmal wird zuerst ein Modell im Maßstab \\(1:25\\) gebaut. Zum Lackieren des Modells werden \\(0{,}08\\,\\text{m}^2\\) Fläche gestrichen. Wie viele Quadratmeter sind es beim Original?", loesung:50, toleranz:0, tipp:"Hier wird eine Fläche gestreckt, kein Volumen; achte auf die passende Potenz.", loesungsweg:"Flächen wachsen mit \\(k^2\\): $$0{,}08 \\cdot 25^2 = 0{,}08 \\cdot 625 = 50\\,\\text{m}^2$$ Beim Volumen wäre es \\(25^3 = 15\\,625\\)-mal so viel; für die Lackfläche zählt aber nur \\(k^2\\)." },
      { id:34, level:6, typ:"numerisch", frage:"Ein zylindrisches Glas mit Innendurchmesser \\(8\\,\\text{cm}\\) enthält Wasser. Eine Metallkugel wird ganz untergetaucht, dabei steigt der Wasserspiegel um \\(1{,}5\\,\\text{cm}\\). Wie groß ist der Radius der Kugel in cm? Runde auf zwei Dezimalen.", loesung:2.62, toleranz:0.02, tipp:"Das verdrängte Wasser bildet einen flachen Zylinder; sein Volumen ist das Kugelvolumen.", loesungsweg:"Verdrängtes Wasser: \\(\\pi \\cdot 4^2 \\cdot 1{,}5 = 24\\pi\\,\\text{cm}^3\\). Gleichsetzen mit \\(\\tfrac43 \\pi r^3\\): $$r^3 = \\frac{24\\pi \\cdot 3}{4\\pi} = 18 \\quad\\Rightarrow\\quad r = \\sqrt[3]{18} \\approx 2{,}62\\,\\text{cm}$$" },
      { id:35, level:6, typ:"mc", frage:"Ein Kegel und eine quadratische Pyramide haben dieselbe Höhe und gleich große Grundflächen. Behauptung: „Der Kegel hat das größere Volumen, weil er rund ist.“ Stimmt das?", optionen:["Nein, beide Volumen sind genau gleich groß", "Ja, runde Körper fassen bei gleicher Höhe mehr", "Nein, die Pyramide hat das größere Volumen", "Nur bei gleichem Umfang der Grundfläche gleich"], korrekt:0, tipp:"Vergleiche die Volumenformeln der beiden Spitzkörper: Welche Größen gehen ein?", loesungsweg:"Für jeden Spitzkörper gilt \\(V = \\tfrac13 \\cdot G \\cdot h\\), unabhängig von der Form der Grundfläche. Stimmen \\(G\\) und \\(h\\) überein, sind die Volumen gleich: $$V_{Kegel} = \\tfrac13 G h = V_{Pyramide}$$ Die Form der Grundfläche spielt für das Volumen keine Rolle, wohl aber für die Oberfläche." },
      { id:36, level:6, typ:"numerisch", frage:"Zwei Kegel sind zueinander ähnlich. Der kleine ist \\(5\\,\\text{cm}\\) hoch und hat das Volumen \\(40\\,\\text{cm}^3\\); der große ist \\(7{,}5\\,\\text{cm}\\) hoch. Wie groß ist das Volumen des großen Kegels in \\(\\text{cm}^3\\)?", loesung:135, toleranz:0.1, tipp:"Bestimme zuerst den Streckfaktor aus den Höhen; Volumen wachsen nicht mit demselben Faktor.", loesungsweg:"Streckfaktor \\(k = \\frac{7{,}5}{5} = 1{,}5\\). Volumen wachsen mit \\(k^3\\): $$V = 40 \\cdot 1{,}5^3 = 40 \\cdot 3{,}375 = 135\\,\\text{cm}^3$$ Mit \\(k\\) oder \\(k^2\\) käme man auf \\(60\\) bzw. \\(90\\), beides falsch." }];
    </script>

</body>
