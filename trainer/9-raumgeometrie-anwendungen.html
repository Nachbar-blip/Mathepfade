<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumgeometrie: Anwendungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-raumgeometrie-anwendungen';
    const THEMA_CONFIG = { name: 'Raumgeometrie: Anwendungen', bereich: 'geometrie' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"1 Liter entspricht wie viel cm³?", optionen:["10","100","1000","10000"], korrekt:2, tipp:"Einheit.", loesungsweg:"Ein Liter ist als das Volumen eines Würfels mit \\(10\\,\\text{cm}\\) Kantenlänge festgelegt: $$10 \\cdot 10 \\cdot 10 = 1000\\,\\text{cm}^3$$ Daraus folgt auch \\(1\\,\\text{ml} = 1\\,\\text{cm}^3\\)." },
      { id:2, level:1, typ:"mc", frage:"1 m³ entspricht wie viel Liter?", optionen:["100","1000","10000","100000"], korrekt:1, tipp:"Volumeneinheit.", loesungsweg:"Ein Kubikmeter ist ein Würfel mit \\(100\\,\\text{cm}\\) Kantenlänge: $$100^3 = 1\\,000\\,000\\,\\text{cm}^3 = 1000\\,\\text{l}$$ Bei Volumen ist der Umrechnungsfaktor also \\(1000\\), nicht \\(100\\) wie bei Flächen." },
      { id:3, level:1, typ:"numerisch", frage:"Badewanne \\(160\\times 70\\times 50\\,\\text{cm}\\). Max Inhalt in Litern.", loesung:560, toleranz:1, tipp:"\\(V/1000\\).", loesungsweg:"$$V = 160 \\cdot 70 \\cdot 50 = 560\\,000\\,\\text{cm}^3$$ Geteilt durch \\(1000\\): \\(560\\) Liter." },
      { id:4, level:1, typ:"numerisch", frage:"Wasser-Glas (Zylinder) \\(r=3\\,\\text{cm}, h=10\\,\\text{cm}\\). Inhalt (ml, 2 Dez).", loesung:282.74, toleranz:1, tipp:"\\(90\\pi\\).", loesungsweg:"$$V = \\pi \\cdot 3^2 \\cdot 10 = 90\\pi \\approx 282{,}74\\,\\text{cm}^3$$ Wegen \\(1\\,\\text{cm}^3 = 1\\,\\text{ml}\\) sind das rund \\(283\\) Milliliter." },
      { id:5, level:1, typ:"numerisch", frage:"Paketkarton \\(40\\times 30\\times 20\\,\\text{cm}\\). Oberfläche (cm²).", loesung:5200, toleranz:0, tipp:"\\(2(ab+bc+ac)\\).", loesungsweg:"Ein Quader hat drei Paare gegenüberliegender Flächen: $$O = 2(40\\cdot30 + 30\\cdot20 + 40\\cdot20) = 2(1200 + 600 + 800) = 5200\\,\\text{cm}^2$$" },
      { id:6, level:1, typ:"mc", frage:"1 ha entspricht …", optionen:["100 m²","1000 m²","10000 m²","1 km²"], korrekt:2, tipp:"Einheit Fläche.", loesungsweg:"Ein Hektar ist ein Quadrat mit \\(100\\,\\text{m}\\) Seitenlänge: $$100 \\cdot 100 = 10\\,000\\,\\text{m}^2$$ Hundert Hektar ergeben einen Quadratkilometer." },
      { id:7, level:2, typ:"numerisch", frage:"Swimmingpool \\(8\\times 4\\times 1{,}5\\,\\text m\\). Volumen m³.", loesung:48, toleranz:0, tipp:"Quader.", loesungsweg:"$$V = 8 \\cdot 4 \\cdot 1{,}5 = 48\\,\\text{m}^3$$" },
      { id:8, level:2, typ:"numerisch", frage:"Swimmingpool \\(8\\times 4\\times 1{,}5\\,\\text m\\). Wasserverbrauch in Liter.", loesung:48000, toleranz:10, tipp:"m³·1000.", loesungsweg:"Aus dem Volumen in Kubikmetern werden mit dem Faktor \\(1000\\) Liter: $$48\\,\\text{m}^3 \\cdot 1000 = 48\\,000\\,\\text{l}$$" },
      { id:9, level:2, typ:"numerisch", frage:"Zylindrische Regentonne \\(r=0{,}4\\,\\text m, h=1\\,\\text m\\). Inhalt (l, 0 Dez).", loesung:503, toleranz:2, tipp:"\\(\\pi\\cdot 0{,}16\\cdot 1\\,\\text m^3\\).", loesungsweg:"$$V = \\pi \\cdot 0{,}4^2 \\cdot 1 = 0{,}16\\pi \\approx 0{,}503\\,\\text{m}^3$$ In Litern: rund \\(503\\)." },
      { id:10, level:2, typ:"numerisch", frage:"Pool \\(8\\times 4\\,\\text m\\), Tiefe 1,5m. Wie lange dauert Füllen bei 20 l/min (h, 1 Dez)?", loesung:40.0, toleranz:0.2, tipp:"\\(48000/20=2400\\) min.", loesungsweg:"Der Pool fasst \\(48\\,000\\) Liter, es fließen \\(20\\) Liter pro Minute: $$\\frac{48\\,000}{20} = 2400 \\text{ Minuten}$$ $$\\frac{2400}{60} = 40{,}0 \\text{ Stunden}$$" },
      { id:11, level:2, typ:"numerisch", frage:"Zuckerwürfel Kante 1 cm. Dichte 1,6 g/cm³. Masse g?", loesung:1.6, toleranz:0.05, tipp:"\\(V\\cdot\\rho\\).", loesungsweg:"Der Würfel hat das Volumen \\(1^3 = 1\\,\\text{cm}^3\\). Masse ist Volumen mal Dichte: $$m = 1 \\cdot 1{,}6 = 1{,}6\\,\\text{g}$$" },
      { id:12, level:2, typ:"mc", frage:"Wie viele Würfel Kante 2 cm passen in einen Würfel Kante 6 cm?", optionen:["9","18","27","36"], korrekt:2, tipp:"\\(3^3\\).", loesungsweg:"In jede Kantenrichtung passen \\(6 : 2 = 3\\) kleine Würfel, und das in allen drei Richtungen: $$3 \\cdot 3 \\cdot 3 = 27$$ Über die Volumen gerechnet kommt dasselbe heraus: \\(216 : 8 = 27\\)." },
      { id:13, level:3, typ:"numerisch", frage:"Konservendose: \\(r=4\\,\\text{cm}, h=12\\,\\text{cm}\\). Etikettengröße (Mantel, cm², 2 Dez)?", loesung:301.59, toleranz:1, tipp:"\\(2\\pi rh\\).", loesungsweg:"Das Etikett umschließt den Mantel, nicht die Deckel: $$M = 2\\pi r h = 2\\pi \\cdot 4 \\cdot 12 = 96\\pi \\approx 301{,}59\\,\\text{cm}^2$$" },
      { id:14, level:3, typ:"numerisch", frage:"Dachboden (Prisma, Dreieckquerschnitt Basis 8m, Höhe 3m), Länge 10m. Volumen m³.", loesung:120, toleranz:0, tipp:"\\(G=12\\).", loesungsweg:"Der Querschnitt ist ein Dreieck mit \\(G = \\frac{8 \\cdot 3}{2} = 12\\,\\text{m}^2\\). Das Prisma ist \\(10\\,\\text{m}\\) lang: $$V = 12 \\cdot 10 = 120\\,\\text{m}^3$$" },
      { id:15, level:3, typ:"numerisch", frage:"Schokolade (Quader) \\(15\\times 7\\times 1\\,\\text{cm}\\), Dichte 1,3 g/cm³. Masse g?", loesung:136.5, toleranz:0.5, tipp:"\\(V\\cdot\\rho\\).", loesungsweg:"Volumen: \\(15 \\cdot 7 \\cdot 1 = 105\\,\\text{cm}^3\\). Masse ist Volumen mal Dichte: $$m = 105 \\cdot 1{,}3 = 136{,}5\\,\\text{g}$$" },
      { id:16, level:3, typ:"numerisch", frage:"Kugel-Eiskugel (\\(r=2{,}5\\,\\text{cm}\\)) passt in Waffel-Kegel (\\(r=3, h=10\\)). Platz (ml, 2 Dez)?", loesung:28.80, toleranz:1, tipp:"\\(V_K-V_{Kugel}=30\\pi-\\frac{4}{3}\\pi\\cdot 15{,}625\\).", loesungsweg:"\\(V_{Kegel}=\\frac{1}{3}\\pi\\cdot 3^2\\cdot 10=30\\pi\\approx 94{,}25\\); \\(V_{Kugel}=\\frac{4}{3}\\pi(2{,}5)^3=\\frac{4}{3}\\pi\\cdot 15{,}625\\approx 65{,}45\\); Differenz \\(\\approx 28{,}80\\,\\text{cm}^3\\)." },
      { id:17, level:3, typ:"numerisch", frage:"Holzbrett \\(200\\times 20\\times 3\\,\\text{cm}\\). Volumen cm³.", loesung:12000, toleranz:0, tipp:"Produkt.", loesungsweg:"$$V = 200 \\cdot 20 \\cdot 3 = 12\\,000\\,\\text{cm}^3$$ Das entspricht \\(12\\) Litern." },
      { id:18, level:3, typ:"mc", frage:"Welche Einheit passt zu Rauminhalt?", optionen:["m²","m","m³","m/s"], korrekt:2, tipp:"Volumen.", loesungsweg:"Ein Rauminhalt erstreckt sich in drei Richtungen — Länge mal Breite mal Höhe —, deshalb steht die Einheit in der dritten Potenz: \\(\\text{m}^3\\). Flächen haben \\(\\text{m}^2\\), Längen \\(\\text{m}\\), und \\(\\text{m/s}\\) ist eine Geschwindigkeit." },
      { id:19, level:4, typ:"numerisch", frage:"Heizöltank (Zylinder liegend), \\(r=0{,}6\\,\\text m, L=2\\,\\text m\\). Maximalfüllung l (0 Dez).", loesung:2262, toleranz:5, tipp:"\\(\\pi r^2 L\\) in m³.", loesungsweg:"Der liegende Tank ist ein Zylinder mit der Länge als Höhe: $$V = \\pi \\cdot 0{,}6^2 \\cdot 2 = 0{,}72\\pi \\approx 2{,}262\\,\\text{m}^3$$ In Litern also rund \\(2262\\)." },
      { id:20, level:4, typ:"numerisch", frage:"Anstiegswinkel Gerade durch \\((0,0), (4,3)\\) (1 Dez Grad).", loesung:36.9, toleranz:0.2, tipp:"\\(\\arctan(3/4)\\).", loesungsweg:"Die Steigung der Geraden ist \\(\\frac{3}{4}\\); der Winkel folgt über den Tangens: $$\\alpha = \\arctan\\frac{3}{4} \\approx 36{,}9°$$" },
      { id:21, level:4, typ:"numerisch", frage:"Kegel-Sandhaufen \\(r=1{,}5\\,\\text m, h=1{,}2\\,\\text m\\). Volumen m³ (2 Dez).", loesung:2.83, toleranz:0.05, tipp:"\\(\\frac{1}{3}\\pi r^2 h\\).", loesungsweg:"$$V = \\tfrac{1}{3}\\pi r^2 h = \\tfrac{1}{3}\\pi \\cdot 2{,}25 \\cdot 1{,}2 = 0{,}9\\pi \\approx 2{,}83\\,\\text{m}^3$$" },
      { id:22, level:4, typ:"numerisch", frage:"Zelt (Pyramide quadratische Basis 3m, Höhe 2m). Volumen m³.", loesung:6, toleranz:0, tipp:"\\(\\frac{1}{3}\\cdot 9\\cdot 2\\).", loesungsweg:"Quadratische Grundfläche \\(3^2 = 9\\,\\text{m}^2\\): $$V = \\tfrac{1}{3} \\cdot 9 \\cdot 2 = 6\\,\\text{m}^3$$" },
      { id:23, level:4, typ:"numerisch", frage:"Getränkekarton Quader \\(7\\times 7\\times 20\\,\\text{cm}\\). In Liter (2 Dez).", loesung:0.98, toleranz:0.02, tipp:"\\(980/1000\\).", loesungsweg:"$$V = 7 \\cdot 7 \\cdot 20 = 980\\,\\text{cm}^3$$ Geteilt durch \\(1000\\): \\(0{,}98\\) Liter — ein Karton fasst also knapp einen Liter." },
      { id:24, level:4, typ:"mc", frage:"Verdopple alle Kanten eines Würfels. Volumen wird …", optionen:["2x","4x","6x","8x"], korrekt:3, tipp:"\\(2^3\\).", loesungsweg:"Beim Würfel geht die Kante dreifach ein: $$V_{neu} = (2a)^3 = 8a^3$$ Das Volumen wird also <b>achtfach</b>. Die Oberfläche wächst dagegen nur vierfach, weil sie aus Quadraten besteht." },
      { id:25, level:5, typ:"numerisch", frage:"Berg (Kegelform, \\(r=200\\,\\text m, h=150\\,\\text m\\)). Volumen (m³, 0 Dez).", loesung:6283185, toleranz:10000, tipp:"\\(\\frac{1}{3}\\pi\\cdot 40000\\cdot 150\\).", loesungsweg:"$$V = \\tfrac{1}{3}\\pi \\cdot 200^2 \\cdot 150 = \\tfrac{1}{3}\\pi \\cdot 40\\,000 \\cdot 150 = 2\\,000\\,000\\pi$$ $$\\approx 6\\,283\\,185\\,\\text{m}^3$$" },
      { id:26, level:5, typ:"numerisch", frage:"Schrägdach (Prisma mit Trapezquerschnitt: Parallelseiten 2 und 4 m, Höhe 1 m; Länge 8 m). Volumen m³.", loesung:24, toleranz:0.1, tipp:"\\(G=\\frac{(2+4)\\cdot 1}{2}=3\\).", loesungsweg:"Der Trapezquerschnitt hat den Flächeninhalt $$G = \\frac{(2+4) \\cdot 1}{2} = 3\\,\\text{m}^2$$ $$V = 3 \\cdot 8 = 24\\,\\text{m}^3$$" },
      { id:27, level:5, typ:"numerisch", frage:"Dichte Stahl 7,85 g/cm³. Stahlkugel \\(r=3\\,\\text{cm}\\). Masse g (2 Dez).", loesung:887.81, toleranz:5, tipp:"\\(V=\\frac{4}{3}\\pi\\cdot 27 = 36\\pi\\approx 113{,}097\\).", loesungsweg:"Kugelvolumen: \\(V = \\tfrac43 \\pi \\cdot 3^3 = 36\\pi \\approx 113{,}10\\,\\text{cm}^3\\). Masse ist Volumen mal Dichte: $$m = 113{,}10 \\cdot 7{,}85 \\approx 887{,}81\\,\\text{g}$$" },
      { id:28, level:5, typ:"numerisch", frage:"Würfel Oberfläche 150 cm². Volumen cm³.", loesung:125, toleranz:0.1, tipp:"\\(a^2=25\\Rightarrow a=5\\).", loesungsweg:"Die Oberfläche besteht aus \\(6\\) gleichen Quadraten: \\(6a^2 = 150\\), also \\(a^2 = 25\\) und \\(a = 5\\). $$V = 5^3 = 125\\,\\text{cm}^3$$ Der Umweg über die Kantenlänge ist nötig — aus der Oberfläche lässt sich das Volumen nicht direkt ablesen." },
      { id:29, level:5, typ:"numerisch", frage:"Raum \\(5\\times 4\\times 2{,}5\\,\\text m\\). Luftvolumen m³. (Heizlastberechnung)", loesung:50, toleranz:0, tipp:"Quader.", loesungsweg:"$$V = 5 \\cdot 4 \\cdot 2{,}5 = 50\\,\\text{m}^3$$" },
      { id:30, level:5, typ:"mc", frage:"Zwei ähnliche Körper mit Maßstab 1:3 haben Volumenverhältnis …", optionen:["1:3","1:6","1:9","1:27"], korrekt:3, tipp:"Dritte Potenz.", loesungsweg:"Längen wachsen mit dem Faktor \\(k\\), Flächen mit \\(k^2\\) und Volumen mit \\(k^3\\) — weil alle drei Richtungen gestreckt werden: $$1^3 : 3^3 = 1 : 27$$ Ein dreifach vergrößertes Modell braucht also siebenundzwanzigmal so viel Material." },
      { id:31, level:6, typ:"numerisch", frage:"Ein Silo: Zylinder (\\(r=2\\,\\text m, h=6\\,\\text m\\)) + Kegeldach (\\(h=3\\,\\text m\\)). Gesamtvolumen m³ (2 Dez).", loesung:87.96, toleranz:1, tipp:"\\(24\\pi+4\\pi=28\\pi\\).", loesungsweg:"Zylinderteil: \\(\\pi \\cdot 2^2 \\cdot 6 = 24\\pi\\). Kegeldach: \\(\\tfrac13 \\pi \\cdot 4 \\cdot 3 = 4\\pi\\). $$V = 24\\pi + 4\\pi = 28\\pi \\approx 87{,}96\\,\\text{m}^3$$ Beide Teile haben denselben Radius, gerechnet wird aber mit ihren eigenen Höhen." },
      { id:32, level:6, typ:"numerisch", frage:"Eine Straße mit 8% Steigung; Winkel (1 Dez Grad).", loesung:4.6, toleranz:0.2, tipp:"\\(\\arctan 0{,}08\\).", loesungsweg:"Acht Prozent Steigung heißt: auf \\(100\\,\\text{m}\\) waagerecht \\(8\\,\\text{m}\\) Höhengewinn, also \\(\\tan\\alpha = 0{,}08\\): $$\\alpha = \\arctan 0{,}08 \\approx 4{,}6°$$ Der Winkel ist deutlich kleiner, als die Prozentzahl vermuten lässt." },
      { id:33, level:6, typ:"numerisch", frage:"Hohlkugel: Außen-\\(r=5\\), Innen-\\(r=4\\). Materialvolumen (2 Dez).", loesung:255.51, toleranz:2, tipp:"\\(\\frac{4}{3}\\pi(125-64)\\).", loesungsweg:"Das Material ist die äußere Kugel ohne den Hohlraum: $$V = \\tfrac43\\pi\\left(5^3 - 4^3\\right) = \\tfrac43\\pi(125-64) = \\frac{244\\pi}{3} \\approx 255{,}51$$ Die Differenz der Radien darf nicht zuerst gebildet werden — \\((5-4)^3 = 1\\) wäre völlig falsch." },
      { id:34, level:6, typ:"numerisch", frage:"Schotterpile (Kegel), max Böschungswinkel 30°. Radius 2m. Höhe (m, 2 Dez)?", loesung:1.15, toleranz:0.05, tipp:"\\(h=r\\tan 30°\\).", loesungsweg:"Der Böschungswinkel liegt zwischen Grundfläche und Mantellinie; Höhe und Radius sind die Katheten: $$h = r \\cdot \\tan 30° = 2 \\cdot \\frac{1}{\\sqrt{3}} \\approx 1{,}15\\,\\text{m}$$ Steiler geht es nicht — bei größerem Winkel rutscht der Schotter ab." },
      { id:35, level:6, typ:"numerisch", frage:"Zylinder mit gleicher Grund- und Mantelfläche: \\(\\pi r^2=2\\pi rh\\); bei \\(r=4\\): \\(h\\)?", loesung:2, toleranz:0.01, tipp:"\\(h=r/2\\).", loesungsweg:"Gleichsetzen von Grund- und Mantelfläche: $$\\pi r^2 = 2\\pi r h$$ Kürzen von \\(\\pi r\\): \\(r = 2h\\), also \\(h = \\frac{r}{2} = \\frac{4}{2} = 2\\)." },
      { id:36, level:6, typ:"numerisch", frage:"Ein Pyramidendach (quadrat. Grund 12m, Höhe 5m). Deckungsfläche (Mantel, m², 2 Dez).", loesung:187.45, toleranz:1, tipp:"\\(h_s=\\sqrt{25+36}=\\sqrt{61}\\); Mantel \\(4\\cdot\\frac{12\\cdot\\sqrt{61}}{2}\\).", loesungsweg:"\\(h_s=\\sqrt{5^2+6^2}=\\sqrt{61}\\); Mantel \\(=4\\cdot\\frac{12\\cdot\\sqrt{61}}{2}=24\\sqrt{61}\\approx 187{,}45\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
