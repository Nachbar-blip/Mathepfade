<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-lk-funktionsscharen';
    const THEMA_CONFIG = { name: 'eA: Funktionsscharen', bereich: 'analysis' };
    const AUFGABEN = [
      // L1
      { id:1, level:1, typ:"mc", frage:"Was ist eine Funktionsschar?", optionen:["eine Menge von Funktionen mit einem Parameter","eine einzelne Funktion mit einem festen Term","eine Folge von Zahlen mit einem Index","eine Gleichung mit zwei Unbekannten"], korrekt:0, tipp:"Achte darauf, ob der Buchstabe im Term eine Zahl vertritt oder die Stelle auf der \\(x\\)-Achse.", loesungsweg:"Eine Funktionsschar ist eine ganze <b>Familie</b> von Funktionen, die sich in einem Buchstaben unterscheiden — dem Parameter. Setzt man für ihn eine feste Zahl ein, erhält man eine einzelne Funktion der Schar: $$f_a(x) = x^2 + a \\;\\longrightarrow\\; f_1(x) = x^2+1,\\quad f_2(x) = x^2+2$$ Alle diese Graphen zusammen bilden die Schar. Eine Folge ist etwas anderes: Sie ordnet natürlichen Zahlen einzelne Werte zu, keine ganzen Funktionen." },
      { id:2, level:1, typ:"mc", frage:"Bei \\(f_a(x)=x^2+a\\) ist \\(a\\):", optionen:["Variable","Parameter","Konstante 0","Exponent"], korrekt:1, tipp:"Nicht die unabhängige Variable.", loesungsweg:"\\(x\\) ist die unabhängige Variable, entlang derer der Graph gezeichnet wird. \\(a\\) bleibt dabei fest und wählt aus, <b>welcher</b> Graph gezeichnet wird — es ist der Scharparameter. Jedes feste \\(a\\) liefert eine eigene Funktion; alle zusammen bilden die Schar." },
      { id:3, level:1, typ:"numerisch", frage:"\\(f_a(x)=x^2+a\\), \\(f_3(2)=?\\)", loesung:7, toleranz:0, tipp:"\\(a=3\\) einsetzen.", loesungsweg:"Erst den Parameter festlegen, dann die Stelle einsetzen: $$f_3(2) = 2^2 + 3 = 4 + 3 = 7$$" },
      { id:4, level:1, typ:"numerisch", frage:"\\(f_a(x)=ax^2\\), \\(f_2(3)=?\\)", loesung:18, toleranz:0, tipp:"\\(2\\cdot 9\\).", loesungsweg:"$$f_2(3) = 2 \\cdot 3^2 = 2 \\cdot 9 = 18$$" },
      { id:5, level:1, typ:"mc", frage:"\\(f_a(x)=x^2-a\\): Nullstellen (für \\(a>0\\)):", optionen:["\\(x=0\\)","\\(x=\\pm\\sqrt{a}\\)","\\(x=a\\)","keine"], korrekt:1, tipp:"\\(x^2=a\\).", loesungsweg:"$$x^2 - a = 0 \\;\\Rightarrow\\; x^2 = a \\;\\Rightarrow\\; x = \\pm\\sqrt{a}$$ Für \\(a > 0\\) gibt es zwei Nullstellen, für \\(a = 0\\) eine doppelte und für \\(a < 0\\) gar keine — der Parameter entscheidet also über die Anzahl." },
      { id:6, level:1, typ:"numerisch", frage:"\\(f_a(x)=x^2-a\\) hat doppelte Nullstelle bei \\(a=?\\)", loesung:0, toleranz:0, tipp:"Nur dann \\(x=0\\) doppelt.", loesungsweg:"Zwei Nullstellen \\(\\pm\\sqrt a\\) fallen genau dann zusammen, wenn \\(\\sqrt a = 0\\) ist: $$a = 0$$ Dann lautet die Funktion \\(f(x) = x^2\\) und berührt die \\(x\\)-Achse im Ursprung." },
      // L2 -- Ableitungen mit Param.
      { id:7, level:2, typ:"mc", frage:"\\(f_a(x)=ax^3-3x\\), \\(f_a'(x)=?\\)", optionen:["\\(3ax^2-3\\)","\\(3ax^2+3\\)","\\(3ax-3x\\)","\\(ax^2-3x\\)"], korrekt:0, tipp:"Behandle den Parameter beim Ableiten wie eine feste Zahl.", loesungsweg:"Der Parameter \\(a\\) wird beim Ableiten wie eine Zahl behandelt: $$f_a'(x) = 3ax^2 - 3$$ Abgeleitet wird stets nach \\(x\\), nicht nach \\(a\\)." },
      { id:8, level:2, typ:"numerisch", frage:"\\(f_a(x)=ax^3-3x\\): Extremstelle \\(x>0\\) (abh. von \\(a>0\\))? Bsp. \\(a=3\\): \\(x_0=?\\)", loesung:0.577, toleranz:0.05, tipp:"Setze die Ableitung null und löse die entstehende Gleichung nach \\(x\\) auf; der Parameter bleibt dabei stehen.", loesungsweg:"Ableiten und null setzen: $$f_a'(x) = 3ax^2 - 3 = 0 \\;\\Rightarrow\\; x^2 = \\frac{1}{a} \\;\\Rightarrow\\; x = \\pm\\frac{1}{\\sqrt a}$$ Für \\(a > 0\\) gibt es also zwei Extremstellen, symmetrisch zum Ursprung. Die positive ist \\(x = \\frac{1}{\\sqrt a}\\). Mit \\(a = 3\\): $$x = \\frac{1}{\\sqrt 3} \\approx 0{,}577$$" },
      { id:9, level:2, typ:"numerisch", frage:"\\(f_k(x)=x^3-kx\\), Extremstelle \\(x>0\\) für \\(k=12\\)?", loesung:2, toleranz:0, tipp:"Setze die Ableitung null und löse die entstehende Gleichung nach \\(x\\) auf.", loesungsweg:"$$f_k'(x) = 3x^2 - k = 0 \\;\\Rightarrow\\; x = \\pm\\sqrt{\\tfrac{k}{3}}$$ Mit \\(k = 12\\): \\(x = \\sqrt{4} = 2\\)." },
      { id:10, level:2, typ:"numerisch", frage:"\\(f_t(x)=x^2-2tx\\): Tiefpunkt \\(x=?\\) (in \\(t\\)). Für \\(t=5\\): \\(x=?\\)", loesung:5, toleranz:0, tipp:"Leite ab und setze null; das Ergebnis enthält den Parameter.", loesungsweg:"$$f_t'(x) = 2x - 2t = 0 \\;\\Rightarrow\\; 2x = 2t \\;\\Rightarrow\\; x = t$$ Die Extremstelle ist also der Parameter selbst. Wegen \\(f_t''(x) = 2 > 0\\) handelt es sich um einen Tiefpunkt. Für \\(t = 5\\) liegt er bei \\(x = 5\\) — jeder Graph der Schar ist dieselbe Normalparabel, nur nach rechts verschoben." },
      { id:11, level:2, typ:"numerisch", frage:"\\(f_t(x)=x^2-2tx\\), \\(t=5\\): \\(y\\)-Wert Tiefpunkt?", loesung:-25, toleranz:0, tipp:"Bestimme zuerst die Stelle des Tiefpunkts und setze sie dann in den Funktionsterm ein.", loesungsweg:"$$f_t'(x) = 2x - 2t = 0 \\;\\Rightarrow\\; x = t$$ Einsetzen: \\(f_t(t) = t^2 - 2t^2 = -t^2\\). Für \\(t = 5\\) also $$y = -25$$" },
      { id:12, level:2, typ:"mc", frage:"\\(f_a(x)=e^{ax}\\), \\(f_a'(x)=?\\)", optionen:["\\(e^{ax}\\)","\\(ae^{ax}\\)","\\(xe^{ax}\\)","\\(a^2e^{ax}\\)"], korrekt:1, tipp:"Kettenregel.", loesungsweg:"Kettenregel mit der inneren Funktion \\(u = ax\\) und \\(u' = a\\): $$f_a'(x) = e^{ax} \\cdot a = ae^{ax}$$ Der Parameter \\(a\\) wird wie eine feste Zahl behandelt und tritt als Faktor heraus; im Exponenten bleibt er zugleich stehen." },
      // L3 -- Ortskurven
      { id:13, level:3, typ:"numerisch", frage:"\\(f_t(x)=x^2-2tx\\): Tiefpunkte \\((t, -t^2)\\). Ortskurve \\(y=?\\) bei \\(x=3\\)", loesung:-9, toleranz:0, tipp:"Ersetze in den angegebenen Koordinaten den Parameter durch \\(x\\); so entsteht die Gleichung der Ortskurve.", loesungsweg:"Die Tiefpunkte haben die Koordinaten \\((t \\mid -t^2)\\). Ersetzt man \\(t\\) durch \\(x\\), ergibt sich die Ortskurve \\(y = -x^2\\): $$y(3) = -9$$ Die Ortskurve entsteht immer so — Parameter eliminieren und als Funktion von \\(x\\) schreiben." },
      { id:14, level:3, typ:"mc", frage:"Ortskurve = …", optionen:["Eine Funktion der Schar","Kurve aller Hoch-/Tiefpunkte","Nullstellenmenge","Tangente"], korrekt:1, tipp:"Überlege, was sich beim Durchlaufen des Parameters bewegt und welche Spur dabei entsteht.", loesungsweg:"Jeder Graph der Schar hat seinen eigenen Hoch- oder Tiefpunkt. Lässt man den Parameter alle zulässigen Werte durchlaufen, wandern diese Punkte und beschreiben dabei eine Kurve — die <b>Ortskurve</b>. Rechnerisch erhält man sie, indem man die Koordinaten des Extrempunkts in Abhängigkeit vom Parameter aufschreibt und den Parameter dann aus beiden Gleichungen eliminiert. Dasselbe Verfahren funktioniert für Wendepunkte." },
      { id:15, level:3, typ:"numerisch", frage:"\\(f_a(x)=x^3-3a^2 x\\): Hochpunkt bei \\(x=-a\\) (\\(a>0\\)), \\(y\\)-Wert? Für \\(a=1\\)", loesung:2, toleranz:0, tipp:"Setze den Parameter ein und werte den Funktionsterm an der angegebenen Stelle aus.", loesungsweg:"Für \\(a = 1\\) lautet die Funktion \\(f_1(x) = x^3 - 3x\\), der Hochpunkt liegt bei \\(x = -a = -1\\): $$f_1(-1) = (-1)^3 - 3 \\cdot 1^2 \\cdot (-1) = -1 + 3 = 2$$ Dass dort wirklich ein Hochpunkt liegt, bestätigt \\(f_1''(-1) = 6 \\cdot (-1) = -6 < 0\\)." },
      { id:16, level:3, typ:"numerisch", frage:"\\(f_a(x)=x^3-3a^2x\\), \\(a=2\\): y-Wert des Hochpunkts?", loesung:16, toleranz:0, tipp:"Setze zuerst den Parameter ein, dann die Stelle des Hochpunkts; achte auf die Vorzeichen der Potenzen.", loesungsweg:"Mit \\(a = 2\\) liegt der Hochpunkt bei \\(x = -a = -2\\). Einsetzen in \\(f_a(x) = x^3 - 3a^2x\\): $$f_2(-2) = (-2)^3 - 3 \\cdot 2^2 \\cdot (-2) = -8 + 24 = 16$$ Allgemein ist der Hochpunktwert \\(f_a(-a) = -a^3 + 3a^3 = 2a^3\\); für \\(a = 2\\) ergibt das \\(2 \\cdot 8\\)." },
      { id:17, level:3, typ:"mc", frage:"\\(f_a(x)=x^2+ax+1\\): Scheitelpunkt hat \\(x_s=?\\)", optionen:["\\(-\\frac{a}{2}\\)","\\(+\\frac{a}{2}\\)","\\(-2a\\)","\\(+2a\\)"], korrekt:0, tipp:"Leite ab, setze null und löse nach \\(x\\) auf; der Parameter bleibt dabei stehen.", loesungsweg:"$$f_a'(x) = 2x + a = 0 \\;\\Rightarrow\\; x_s = -\\frac{a}{2}$$ Der Scheitel wandert mit wachsendem \\(a\\) also nach links." },
      { id:18, level:3, typ:"numerisch", frage:"\\(f_a(x)=x^2+ax+1\\), \\(a=4\\): y-Wert des Scheitels?", loesung:-3, toleranz:0, tipp:"Bestimme zuerst die Scheitelstelle in Abhängigkeit vom Parameter und werte den Term dort aus.", loesungsweg:"Mit \\(x_s = -\\frac{a}{2} = -2\\): $$f_4(-2) = 4 - 8 + 1 = -3$$ Allgemein gilt \\(y_s = 1 - \\frac{a^2}{4}\\)." },
      // L4 -- Gemeinsame Punkte
      { id:19, level:4, typ:"numerisch", frage:"\\(f_a(x)=x^3+ax\\) hat bei welchem \\(x\\) den Wert unabh. von \\(a\\)?", loesung:0, toleranz:0, tipp:"Koeffizient von \\(a\\) muss Null sein.", loesungsweg:"Gesucht ist die Stelle, an der der Parameter herausfällt. Der Term mit \\(a\\) ist \\(ax\\); er verschwindet für jedes \\(a\\) genau dann, wenn $$x = 0$$ Dort haben alle Graphen der Schar denselben Wert \\(f_a(0) = 0\\) — ein gemeinsamer Punkt." },
      { id:20, level:4, typ:"numerisch", frage:"Für welches \\(a>0\\) hat der Graph von \\(f_a(x)=ax^{3}-6x\\) an der Stelle \\(x=1\\) eine waagerechte Tangente?", loesung:2, toleranz:0, tipp:"Übersetze die Angabe über die Tangente in eine Bedingung an die Ableitung und setze die genannte Stelle ein.", loesungsweg:"Waagerechte Tangente heißt \\(f_a'(1) = 0\\). Ableiten, der Parameter bleibt dabei stehen: $$f_a'(x) = 3ax^{2}-6$$ Stelle einsetzen: $$f_a'(1) = 3a - 6 = 0 \\;\\Rightarrow\\; a = 2$$ Dies ist eine Umkehraufgabe: Gegeben ist die Lage der Stelle, gesucht der Parameter. Probe: \\(f_2'(x) = 6x^{2}-6\\) ist bei \\(x=1\\) tatsächlich null." },
      { id:21, level:4, typ:"numerisch", frage:"Für welches \\(k\\) verläuft der Graph von \\(f_k(x)=kx^{3}+2x\\) durch den Punkt \\(P(2 \\mid 20)\\)?", loesung:2, toleranz:0, tipp:"Setze die Koordinaten des Punktes in den Funktionsterm ein; es entsteht eine Gleichung, in der nur noch der Parameter unbekannt ist.", loesungsweg:"Punktprobe — beide Koordinaten einsetzen: $$f_k(2) = k \\cdot 2^{3} + 2 \\cdot 2 = 8k + 4$$ Dieser Wert soll \\(20\\) betragen: $$8k + 4 = 20 \\;\\Rightarrow\\; 8k = 16 \\;\\Rightarrow\\; k = 2$$ Aus der ganzen Schar wird durch den einen Punkt also genau ein Graph ausgewählt: \\(f_2(x) = 2x^{3}+2x\\). Probe: \\(f_2(2) = 16+4 = 20\\)." },
      { id:22, level:4, typ:"numerisch", frage:"\\(f_k(x)=kx^2-k+2\\) hat Fixpunkt bei \\(x=?\\) (\\(x>0\\))", loesung:1, toleranz:0, tipp:"Sortiere den Term nach dem Parameter und überlege, wann dessen Anteil für jedes \\(k\\) verschwindet.", loesungsweg:"Der Term wird nach dem Parameter sortiert: $$f_k(x) = k x^2 - k + 2 = k\\left(x^2 - 1\\right) + 2$$ Der Parameter fällt genau dann heraus, wenn seine Klammer null ist: $$x^2 - 1 = 0 \\;\\Rightarrow\\; x = \\pm 1$$ Gesucht ist die positive Stelle, also \\(x = 1\\). Dort hat jeder Graph der Schar denselben Wert \\(f_k(1) = 2\\) — der gemeinsame Punkt ist \\((1 \\mid 2)\\)." },
      { id:23, level:4, typ:"numerisch", frage:"\\(f_a(x)=x^3-3ax\\): Wendestelle?", loesung:0, toleranz:0, tipp:"Überlege, welche Ableitung über Wendestellen entscheidet, und was beim zweimaligen Ableiten mit dem Parameter geschieht.", loesungsweg:"$$f_a''(x) = 6x = 0 \\;\\Rightarrow\\; x = 0$$ Der Parameter steht nur im linearen Term \\(-3ax\\) und verschwindet beim zweimaligen Ableiten. Die Wendestelle ist daher für die ganze Schar dieselbe." },
      { id:24, level:4, typ:"mc", frage:"\\(f_a(x)=x^3-3ax\\): \\(f_a\\) hat Extrema für:", optionen:["alle \\(a\\)","nur \\(a>0\\)","nur \\(a<0\\)","nie"], korrekt:1, tipp:"\\(f_a'(x)=3x^2-3a\\) — wann hat \\(f_a'\\) zwei Nullstellen mit Vorzeichenwechsel?", loesungsweg:"$$f_a'(x) = 3x^2 - 3a = 0 \\;\\Rightarrow\\; x^2 = a$$ Zwei verschiedene Lösungen gibt es nur für \\(a > 0\\). Bei \\(a = 0\\) fallen sie zusammen (Sattelpunkt, kein Extremum), bei \\(a < 0\\) gibt es gar keine reelle Lösung — dann ist die Funktion streng monoton steigend." },
      // L5 -- AFB III: Ortskurve, Fehler finden, Parameter aus zwei Bedingungen
      { id:25, level:5, typ:"numerisch", frage:"Die Tiefpunkte aller Graphen der Schar \\(f_t(x) = x^2 - 2tx + t\\) liegen auf einer gemeinsamen Kurve. Welchen \\(y\\)-Wert hat diese Kurve an der Stelle \\(x = 3\\)?", loesung:-6, toleranz:0, tipp:"Bestimme die Koordinaten des Tiefpunkts in Abhängigkeit vom Parameter und beseitige den Parameter anschließend aus beiden Koordinaten.", loesungsweg:"Erster Schritt — Tiefpunkt in Abhängigkeit von \\(t\\): $$f_t'(x) = 2x - 2t = 0 \\;\\Rightarrow\\; x = t$$ Wegen \\(f_t''(x) = 2 > 0\\) ist es für jedes \\(t\\) ein Tiefpunkt. Sein \\(y\\)-Wert: $$f_t(t) = t^2 - 2t^2 + t = -t^2 + t$$ Zweiter Schritt — Parameter eliminieren: Aus \\(x = t\\) folgt \\(t = x\\), eingesetzt ergibt sich die Ortskurve $$y = -x^2 + x$$ An der Stelle \\(3\\): $$y = -9 + 3 = -6$$" },
      { id:26, level:5, typ:"mc", frage:"Für \\(f_a(x) = x^3 - 3a^2x\\) mit \\(a > 0\\) liegt der Hochpunkt bei \\(x = -a\\). Ein Schüler schreibt: „Die Ortskurve der Hochpunkte ist \\(y = x^3 - 3a^2x\\).“ Welche Beurteilung trifft zu?", optionen:["Falsch: der Parameter muss verschwinden, richtig ist \\(y = -2x^3\\)","Falsch: die Ortskurve ist die Ableitung, also \\(y = 3x^2 - 3a^2\\)","Richtig: die Hochpunkte liegen ja alle auf Graphen der Schar","Falsch: eine Ortskurve gibt es nicht, die Hochpunkte wandern nicht"], korrekt:0, tipp:"Prüfe, ob in der angegebenen Gleichung noch der Parameter steht, und überlege, was eine Ortskurve als Funktionsgleichung leisten muss.", loesungsweg:"Eine Ortskurve muss eine Gleichung zwischen \\(x\\) und \\(y\\) allein sein — steht darin noch der Parameter, beschreibt sie keine einzelne Kurve. Hochpunkt: \\(x = -a\\), also \\(a = -x\\) (beachte \\(x < 0\\)). Zugehöriger \\(y\\)-Wert: $$f_a(-a) = -a^3 + 3a^3 = 2a^3$$ Parameter ersetzen: \\(a^3 = (-x)^3 = -x^3\\), also $$y = 2 \\cdot (-x^3) = -2x^3$$ Der angegebene Term ist dagegen nur der Funktionsterm der Schar selbst — er beschreibt jeden einzelnen Graphen, nicht die Spur der Hochpunkte. Probe für \\(a = 1\\): Hochpunkt \\((-1 \\mid 2)\\), und \\(-2 \\cdot (-1)^3 = 2\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Von der Schar \\(f_{a,b}(x) = ax^{2} + bx\\) ist bekannt, dass jeder Graph durch \\(P(2 \\mid 6)\\) geht und dort die Steigung \\(5\\) hat. Bestimme \\(a\\).", loesung:1, toleranz:0, tipp:"Übersetze beide Angaben in je eine Gleichung in \\(a\\) und \\(b\\) und löse das entstehende System.", loesungsweg:"Erste Bedingung — Punktprobe: $$f_{a,b}(2) = 4a + 2b = 6$$ Zweite Bedingung — Steigung über die Ableitung \\(f_{a,b}'(x) = 2ax + b\\): $$f_{a,b}'(2) = 4a + b = 5$$ Subtrahiert man die zweite Gleichung von der ersten, fällt \\(a\\) heraus: $$b = 1$$ Rückeinsetzen: $$4a + 1 = 5 \\;\\Rightarrow\\; a = 1$$ Zwei Bedingungen legen aus der Zweiparameter-Schar also genau einen Graphen fest: \\(f(x) = x^{2}+x\\). Probe: \\(f(2) = 6\\) und \\(f'(2) = 5\\)." },
      { id:28, level:5, typ:"numerisch", frage:"Alle Graphen der Schar \\(f_k(x) = kx^2 + (1-k)x\\) haben außer dem Ursprung noch eine weitere Stelle gemeinsam. Gib sie an.", loesung:1, toleranz:0, tipp:"Sortiere den Funktionsterm nach dem Parameter und suche die Stellen, an denen dessen Anteil für jedes \\(k\\) null wird.", loesungsweg:"Term nach dem Parameter sortieren: $$f_k(x) = kx^2 + x - kx = x + k\\left(x^2 - x\\right)$$ Ein gemeinsamer Punkt liegt dort, wo der Parameteranteil für jedes \\(k\\) verschwindet: $$x^2 - x = 0 \\;\\Rightarrow\\; x(x-1) = 0 \\;\\Rightarrow\\; x = 0 \\text{ oder } x = 1$$ Der Ursprung war schon genannt, gesucht ist also \\(x = 1\\). Dort gilt für jedes \\(k\\): \\(f_k(1) = k + 1 - k = 1\\), der gemeinsame Punkt ist \\((1 \\mid 1)\\)." },
      { id:29, level:5, typ:"numerisch", frage:"Für welches \\(k > 0\\) nimmt die Funktion \\(f_k(x) = x \\cdot e^{-kx}\\) den größten Funktionswert \\(2\\) an (gerundet)?", loesung:0.184, toleranz:0.005, tipp:"Bestimme zuerst Stelle und Wert des Maximums allgemein in \\(k\\) und setze den Wert dann mit der Vorgabe gleich.", loesungsweg:"Erster Schritt — Maximum allgemein: Produkt- und Kettenregel liefern $$f_k'(x) = e^{-kx} - kx e^{-kx} = (1 - kx)e^{-kx}$$ Da \\(e^{-kx}\\) nie null wird, folgt \\(x = \\frac{1}{k}\\); der Vorzeichenwechsel von \\(+\\) nach \\(-\\) zeigt ein Maximum an. Sein Wert: $$f_k\\left(\\tfrac1k\\right) = \\frac{1}{k}e^{-1} = \\frac{1}{ke}$$ Zweiter Schritt — Bedingung: $$\\frac{1}{ke} = 2 \\;\\Rightarrow\\; k = \\frac{1}{2e} \\approx 0{,}1839$$ Je kleiner der Parameter, desto höher das Maximum." },
      { id:30, level:5, typ:"numerisch", frage:"Der Graph von \\(f_t(x) = t \\cdot x(2-x)\\) mit \\(t > 0\\) schließt mit der \\(x\\)-Achse ein Flächenstück ein. Für welches \\(t\\) hat es den Inhalt \\(4\\)?", loesung:3, toleranz:0, tipp:"Bestimme zuerst die Stellen, zwischen denen die Fläche liegt, und drücke ihren Inhalt in Abhängigkeit vom Parameter aus.", loesungsweg:"Erster Schritt — Grenzen: \\(f_t(x) = 0\\) für \\(x = 0\\) und \\(x = 2\\); dazwischen ist der Graph wegen \\(t > 0\\) oberhalb der Achse. Zweiter Schritt — Inhalt in Abhängigkeit von \\(t\\): $$A(t) = \\int_0^2 t\\left(2x - x^2\\right)dx = t\\left[x^2 - \\frac{x^3}{3}\\right]_0^2 = t\\left(4 - \\frac83\\right) = \\frac{4t}{3}$$ Dritter Schritt — Bedingung: $$\\frac{4t}{3} = 4 \\;\\Rightarrow\\; t = 3$$ Der Inhalt wächst also proportional zum Parameter, weil \\(t\\) den Graphen nur in \\(y\\)-Richtung streckt." },
      // L6 -- AFB III: Behauptung prüfen, Fallunterscheidung, Abi-Format eA
      { id:31, level:6, typ:"mc", frage:"Beurteilen Sie: „Je zwei verschiedene Graphen der Schar \\(f_k(x) = x^2 + kx + k\\) schneiden einander in genau einem Punkt.“ Welche Beurteilung trägt?", optionen:["Sie trifft zu: die Differenz zweier Terme wird nur bei \\(x = -1\\) null","Sie trifft nicht zu: zwei verschiedene Parabeln schneiden einander stets zweimal","Sie trifft nicht zu: die Graphen sind verschobene Parabeln ohne Schnittpunkt","Sie trifft zu: alle Graphen gehen durch den Scheitel der Normalparabel"], korrekt:0, tipp:"Bilde die Differenz zweier Scharfunktionen mit verschiedenen Parametern und untersuche, wo sie null wird.", loesungsweg:"Für \\(k \\neq m\\) bildet man die Differenz: $$f_k(x) - f_m(x) = (k-m)x + (k-m) = (k-m)(x+1)$$ Da \\(k - m \\neq 0\\) ist, wird das Produkt genau bei \\(x = -1\\) null — und nur dort. Es gibt also stets genau einen Schnittpunkt. Sein \\(y\\)-Wert ist für jedes \\(k\\) derselbe: $$f_k(-1) = 1 - k + k = 1$$ Alle Graphen der Schar laufen demnach durch den festen Punkt \\((-1 \\mid 1)\\), nicht durch den Ursprung. Zwei Parabeln mit gleichem Leitkoeffizienten können sich nie zweimal schneiden, weil sich der quadratische Term in der Differenz weghebt." },
      { id:32, level:6, typ:"numerisch", frage:"Für welchen Wert von \\(k\\) berühren die Graphen von \\(f_k(x) = x^2 + k\\) und \\(g(x) = 4x\\) einander?", loesung:4, toleranz:0, tipp:"Berühren heißt, dass die Gleichung der Schnittstellen genau eine Lösung hat; untersuche, wovon die Lösungsanzahl abhängt.", loesungsweg:"Schnittstellen: $$x^2 + k = 4x \\;\\Rightarrow\\; x^2 - 4x + k = 0$$ Berührung bedeutet genau eine Lösung, die Diskriminante muss also null sein: $$D = (-4)^2 - 4k = 16 - 4k = 0 \\;\\Rightarrow\\; k = 4$$ Probe: \\(x^2 - 4x + 4 = (x-2)^2\\), die doppelte Lösung ist \\(x = 2\\) mit \\(y = 8\\). Für \\(k < 4\\) gibt es zwei Schnittpunkte, für \\(k > 4\\) keinen — die Gerade läuft dann unter der Parabel hindurch." },
      { id:33, level:6, typ:"numerisch", frage:"Gegeben ist die Schar \\(f_a(x) = a \\cdot x \\cdot e^{-x}\\) mit \\(a > 0\\). Zeigen Sie, dass alle Graphen der Schar ihre Wendestelle an derselben Stelle haben, und geben Sie für \\(a = 5\\) den dortigen Funktionswert gerundet an.", loesung:1.353, toleranz:0.01, tipp:"Leite zweimal ab, klammere den Exponentialterm aus und begründe, warum der Parameter für die Lage der Nullstelle ohne Bedeutung ist.", loesungsweg:"Zweimal ableiten, jeweils mit der Produktregel: $$f_a'(x) = a(1-x)e^{-x}$$ $$f_a''(x) = a\\left(-e^{-x} - (1-x)e^{-x}\\right) = a(x-2)e^{-x}$$ Nullsetzen: Der Faktor \\(a\\) ist nach Voraussetzung ungleich null, und \\(e^{-x}\\) wird nie null. Übrig bleibt $$x - 2 = 0 \\;\\Rightarrow\\; x = 2$$ unabhängig vom Parameter — er streckt den Graphen nur in \\(y\\)-Richtung und verschiebt deshalb keine Stelle. Der Vorzeichenwechsel von \\(f_a''\\) bei \\(2\\) sichert den Wendepunkt. Für \\(a = 5\\): $$f_5(2) = 5 \\cdot 2 \\cdot e^{-2} = \\frac{10}{e^2} \\approx 1{,}3534$$" },
      { id:34, level:6, typ:"numerisch", frage:"Die Schar \\(f_a(x) = x^3 - ax\\) mit \\(a \\in \\mathbb{R}\\) hat je nach Parameter eine oder drei Nullstellen. Gib die größte ganze Zahl \\(a\\) an, für die der Graph die \\(x\\)-Achse nur an einer einzigen Stelle trifft.", loesung:0, toleranz:0, tipp:"Zerlege den Term in Faktoren und untersuche, wann der zweite Faktor weitere Nullstellen beisteuert; der Grenzfall gehört mitgeprüft.", loesungsweg:"Ausklammern: $$x^3 - ax = x\\left(x^2 - a\\right) = 0$$ Eine Nullstelle ist stets \\(x = 0\\). Die Klammer liefert \\(x^2 = a\\), und hier ist zu unterscheiden: <br>für \\(a > 0\\) zwei weitere Nullstellen \\(\\pm\\sqrt a\\), insgesamt drei; <br>für \\(a = 0\\) fallen sie mit \\(x = 0\\) zusammen — der Graph von \\(x^3\\) trifft die Achse nur einmal; <br>für \\(a < 0\\) hat \\(x^2 = a\\) keine reelle Lösung, es bleibt die eine Nullstelle. Genau eine Nullstelle gibt es also für \\(a \\leq 0\\); die größte ganze Zahl darin ist \\(0\\). Der Grenzfall \\(a = 0\\) gehört dazu und wird leicht übersehen." },
      { id:35, level:6, typ:"numerisch", frage:"Gegeben ist die Schar \\(f_t(x) = x^2 - 2tx + t^2 + t\\) mit \\(t \\in \\mathbb{R}\\). Zeigen Sie, dass jeder Graph genau einen Tiefpunkt besitzt, und geben Sie die kleinste ganze Zahl \\(t\\) an, für die dieser Tiefpunkt oberhalb der \\(x\\)-Achse liegt.", loesung:1, toleranz:0, tipp:"Bestimme den Tiefpunkt allgemein in \\(t\\), formuliere die Lage über der Achse als Ungleichung und prüfe den Grenzfall gesondert.", loesungsweg:"Nachweis für beliebiges \\(t\\): $$f_t'(x) = 2x - 2t = 0 \\;\\Rightarrow\\; x = t$$ Das ist die einzige Lösung, und wegen \\(f_t''(x) = 2 > 0\\) liegt dort stets ein Tiefpunkt. Sein \\(y\\)-Wert: $$f_t(t) = t^2 - 2t^2 + t^2 + t = t$$ Der Tiefpunkt ist also \\(T(t \\mid t)\\) — alle Tiefpunkte liegen auf der Geraden \\(y = x\\). Oberhalb der \\(x\\)-Achse heißt \\(t > 0\\). Der Grenzfall \\(t = 0\\) scheidet aus, weil der Tiefpunkt dann im Ursprung <b>auf</b> der Achse liegt. Kleinste passende ganze Zahl: \\(t = 1\\)." },
      { id:36, level:6, typ:"numerisch", frage:"Gegeben ist die Schar \\(f_k(x) = x^3 - 3k^2x + 2k^3\\) mit \\(k > 0\\). Zeigen Sie, dass jeder Graph die \\(x\\)-Achse an der Stelle \\(x = k\\) berührt, und bestimmen Sie für \\(k = 3\\) die davon verschiedene Nullstelle.", loesung:-6, toleranz:0, tipp:"Berührung verlangt zwei Nachweise an derselben Stelle; für die weitere Nullstelle hilft eine Zerlegung des Terms in Faktoren.", loesungsweg:"Erster Nachweis — die Stelle ist eine Nullstelle: $$f_k(k) = k^3 - 3k^3 + 2k^3 = 0$$ Zweiter Nachweis — dort ist die Tangente waagerecht: $$f_k'(x) = 3x^2 - 3k^2 \\;\\Rightarrow\\; f_k'(k) = 3k^2 - 3k^2 = 0$$ Beides zusammen ist eine Berührung der \\(x\\)-Achse, also eine doppelte Nullstelle. Der Term zerfällt deshalb in $$f_k(x) = (x-k)^2(x+2k)$$ Die dritte Nullstelle ist \\(x = -2k\\). Für \\(k = 3\\): $$x = -6$$ Probe: \\((-6)^3 - 27 \\cdot (-6) + 54 = -216 + 162 + 54 = 0\\)." }];
