<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK: Funktionsscharen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-lk-funktionsscharen';
    const THEMA_CONFIG = { name: 'LK: Funktionsscharen', bereich: 'analysis' };
    const AUFGABEN = [
      // L1
      { id:1, level:1, typ:"mc", frage:"Was ist eine Funktionsschar?", optionen:["Eine einzige Funktion","Eine Menge von Funktionen mit Parameter","Eine Folge","Eine Gleichung"], korrekt:1, tipp:"Parameter \\(a, k, t, \\ldots\\)", loesungsweg:"Funktionenfamilie abhängig vom Parameter." },
      { id:2, level:1, typ:"mc", frage:"Bei \\(f_a(x)=x^2+a\\) ist \\(a\\):", optionen:["Variable","Parameter","Konstante 0","Exponent"], korrekt:1, tipp:"Nicht die unabhängige Variable.", loesungsweg:"\\(x\\) ist die unabhängige Variable, entlang derer der Graph gezeichnet wird. \\(a\\) bleibt dabei fest und wählt aus, <b>welcher</b> Graph gezeichnet wird — es ist der Scharparameter. Jedes feste \\(a\\) liefert eine eigene Funktion; alle zusammen bilden die Schar." },
      { id:3, level:1, typ:"numerisch", frage:"\\(f_a(x)=x^2+a\\), \\(f_3(2)=?\\)", loesung:7, toleranz:0, tipp:"\\(a=3\\) einsetzen.", loesungsweg:"Erst den Parameter festlegen, dann die Stelle einsetzen: $$f_3(2) = 2^2 + 3 = 4 + 3 = 7$$" },
      { id:4, level:1, typ:"numerisch", frage:"\\(f_a(x)=ax^2\\), \\(f_2(3)=?\\)", loesung:18, toleranz:0, tipp:"\\(2\\cdot 9\\).", loesungsweg:"$$f_2(3) = 2 \\cdot 3^2 = 2 \\cdot 9 = 18$$" },
      { id:5, level:1, typ:"mc", frage:"\\(f_a(x)=x^2-a\\): Nullstellen (für \\(a>0\\)):", optionen:["\\(x=0\\)","\\(x=\\pm\\sqrt{a}\\)","\\(x=a\\)","keine"], korrekt:1, tipp:"\\(x^2=a\\).", loesungsweg:"$$x^2 - a = 0 \\;\\Rightarrow\\; x^2 = a \\;\\Rightarrow\\; x = \\pm\\sqrt{a}$$ Für \\(a > 0\\) gibt es zwei Nullstellen, für \\(a = 0\\) eine doppelte und für \\(a < 0\\) gar keine — der Parameter entscheidet also über die Anzahl." },
      { id:6, level:1, typ:"numerisch", frage:"\\(f_a(x)=x^2-a\\) hat doppelte Nullstelle bei \\(a=?\\)", loesung:0, toleranz:0, tipp:"Nur dann \\(x=0\\) doppelt.", loesungsweg:"Zwei Nullstellen \\(\\pm\\sqrt a\\) fallen genau dann zusammen, wenn \\(\\sqrt a = 0\\) ist: $$a = 0$$ Dann lautet die Funktion \\(f(x) = x^2\\) und berührt die \\(x\\)-Achse im Ursprung." },
      // L2 -- Ableitungen mit Param.
      { id:7, level:2, typ:"mc", frage:"\\(f_a(x)=ax^3-3x\\), \\(f_a'(x)=?\\)", optionen:["\\(3ax^2-3\\)","\\(ax^2\\)","\\(3a-3\\)","\\(3x^2\\)"], korrekt:0, tipp:"Normal ableiten.", loesungsweg:"Der Parameter \\(a\\) wird beim Ableiten wie eine Zahl behandelt: $$f_a'(x) = 3ax^2 - 3$$ Abgeleitet wird stets nach \\(x\\), nicht nach \\(a\\)." },
      { id:8, level:2, typ:"numerisch", frage:"\\(f_a(x)=ax^3-3x\\): Extremstelle \\(x>0\\) (abh. von \\(a>0\\))? Bsp. \\(a=3\\): \\(x_0=?\\)", loesung:0.577, toleranz:0.05, tipp:"\\(x=\\sqrt{1/a}\\).", loesungsweg:"\\(3ax^2-3=0 \\Rightarrow x=\\frac{1}{\\sqrt a}\\); bei \\(a=3\\): \\(\\approx 0{,}577\\)." },
      { id:9, level:2, typ:"numerisch", frage:"\\(f_k(x)=x^3-kx\\), Extremstelle \\(x>0\\) für \\(k=12\\)?", loesung:2, toleranz:0, tipp:"\\(x=\\sqrt{k/3}\\).", loesungsweg:"$$f_k'(x) = 3x^2 - k = 0 \\;\\Rightarrow\\; x = \\pm\\sqrt{\\tfrac{k}{3}}$$ Mit \\(k = 12\\): \\(x = \\sqrt{4} = 2\\)." },
      { id:10, level:2, typ:"numerisch", frage:"\\(f_t(x)=x^2-2tx\\): Tiefpunkt \\(x=?\\) (in \\(t\\)). Für \\(t=5\\): \\(x=?\\)", loesung:5, toleranz:0, tipp:"\\(2x-2t=0\\).", loesungsweg:"\\(x=t=5\\)." },
      { id:11, level:2, typ:"numerisch", frage:"\\(f_t(x)=x^2-2tx\\), \\(t=5\\): \\(y\\)-Wert Tiefpunkt?", loesung:-25, toleranz:0, tipp:"\\(f(t)=-t^2\\).", loesungsweg:"$$f_t'(x) = 2x - 2t = 0 \\;\\Rightarrow\\; x = t$$ Einsetzen: \\(f_t(t) = t^2 - 2t^2 = -t^2\\). Für \\(t = 5\\) also $$y = -25$$" },
      { id:12, level:2, typ:"mc", frage:"\\(f_a(x)=e^{ax}\\), \\(f_a'(x)=?\\)", optionen:["\\(e^{ax}\\)","\\(ae^{ax}\\)","\\(xe^{ax}\\)","\\(a^2e^{ax}\\)"], korrekt:1, tipp:"Kettenregel.", loesungsweg:"Kettenregel mit der inneren Funktion \\(u = ax\\) und \\(u' = a\\): $$f_a'(x) = e^{ax} \\cdot a = ae^{ax}$$ Der Parameter \\(a\\) wird wie eine feste Zahl behandelt und tritt als Faktor heraus; im Exponenten bleibt er zugleich stehen." },
      // L3 -- Ortskurven
      { id:13, level:3, typ:"numerisch", frage:"\\(f_t(x)=x^2-2tx\\): Tiefpunkte \\((t, -t^2)\\). Ortskurve \\(y=?\\) bei \\(x=3\\)", loesung:-9, toleranz:0, tipp:"\\(y=-x^2\\).", loesungsweg:"Die Tiefpunkte haben die Koordinaten \\((t \\mid -t^2)\\). Ersetzt man \\(t\\) durch \\(x\\), ergibt sich die Ortskurve \\(y = -x^2\\): $$y(3) = -9$$ Die Ortskurve entsteht immer so — Parameter eliminieren und als Funktion von \\(x\\) schreiben." },
      { id:14, level:3, typ:"mc", frage:"Ortskurve = …", optionen:["Eine Funktion der Schar","Kurve aller Hoch-/Tiefpunkte","Nullstellenmenge","Tangente"], korrekt:1, tipp:"Aller Extrempunkte.", loesungsweg:"Kurve aller Extrem- bzw. Wendepunkte." },
      { id:15, level:3, typ:"numerisch", frage:"\\(f_a(x)=x^3-3a^2 x\\): Hochpunkt bei \\(x=-a\\) (\\(a>0\\)), \\(y\\)-Wert? Für \\(a=1\\)", loesung:2, toleranz:0, tipp:"\\(f(-1)=-1+3=2\\).", loesungsweg:"$$f_1(-1) = (-1)^3 - 3 \\cdot 1 \\cdot (-1) = -1 + 3 = 2$$" },
      { id:16, level:3, typ:"numerisch", frage:"\\(f_a(x)=x^3-3a^2x\\), \\(a=2\\): y-Wert des Hochpunkts?", loesung:16, toleranz:0, tipp:"\\(f(-2)=-8+24=16\\).", loesungsweg:"$$f_2(-2) = (-2)^3 - 3 \\cdot 4 \\cdot (-2) = -8 + 24 = 16$$" },
      { id:17, level:3, typ:"mc", frage:"\\(f_a(x)=x^2+ax+1\\): Scheitelpunkt hat \\(x_s=?\\)", optionen:["\\(a\\)","\\(-a\\)","\\(a/2\\)","\\(-a/2\\)"], korrekt:3, tipp:"\\(f'=2x+a=0\\).", loesungsweg:"$$f_a'(x) = 2x + a = 0 \\;\\Rightarrow\\; x_s = -\\frac{a}{2}$$ Der Scheitel wandert mit wachsendem \\(a\\) also nach links." },
      { id:18, level:3, typ:"numerisch", frage:"\\(f_a(x)=x^2+ax+1\\), \\(a=4\\): y-Wert des Scheitels?", loesung:-3, toleranz:0, tipp:"\\(y=1-a^2/4\\).", loesungsweg:"Mit \\(x_s = -\\frac{a}{2} = -2\\): $$f_4(-2) = 4 - 8 + 1 = -3$$ Allgemein gilt \\(y_s = 1 - \\frac{a^2}{4}\\)." },
      // L4 -- Gemeinsame Punkte
      { id:19, level:4, typ:"numerisch", frage:"\\(f_a(x)=x^3+ax\\) hat bei welchem \\(x\\) den Wert unabh. von \\(a\\)?", loesung:0, toleranz:0, tipp:"Koeffizient von \\(a\\) muss Null sein.", loesungsweg:"Gesucht ist die Stelle, an der der Parameter herausfällt. Der Term mit \\(a\\) ist \\(ax\\); er verschwindet für jedes \\(a\\) genau dann, wenn $$x = 0$$ Dort haben alle Graphen der Schar denselben Wert \\(f_a(0) = 0\\) — ein gemeinsamer Punkt." },
      { id:20, level:4, typ:"numerisch", frage:"Alle Funktionen \\(f_a(x)=x^2-a x^2+1\\) gehen durch Punkt mit \\(y=?\\) bei \\(x=0\\)", loesung:1, toleranz:0, tipp:"\\(f_a(0)=1\\).", loesungsweg:"$$f_a(0) = 0 - a \\cdot 0 + 1 = 1$$ Der Term mit \\(a\\) enthält den Faktor \\(x^2\\) und verschwindet bei \\(x = 0\\). Alle Graphen gehen daher durch \\((0 \\mid 1)\\)." },
      { id:21, level:4, typ:"numerisch", frage:"\\(f_a(x)=a(x-1)^2\\): Alle Graphen schneiden sich in \\((x_0,0)\\). \\(x_0=?\\)", loesung:1, toleranz:0, tipp:"Immer \\(f_a(1)=0\\).", loesungsweg:"$$f_a(1) = a(1-1)^2 = a \\cdot 0 = 0$$ Gleichgültig welches \\(a\\) — das Ergebnis ist null. Der gemeinsame Punkt ist also \\((1 \\mid 0)\\)." },
      { id:22, level:4, typ:"numerisch", frage:"\\(f_k(x)=kx^2-k+2\\) hat Fixpunkt bei \\(x=?\\) (\\(x>0\\))", loesung:1, toleranz:0, tipp:"Kompetent: \\(kx^2-k=k(x^2-1)\\), Null bei \\(x=\\pm 1\\).", loesungsweg:"\\(x=1\\), \\(y=2\\)." },
      { id:23, level:4, typ:"numerisch", frage:"\\(f_a(x)=x^3-3ax\\): Wendestelle?", loesung:0, toleranz:0, tipp:"\\(f''(x)=6x=0\\).", loesungsweg:"$$f_a''(x) = 6x = 0 \\;\\Rightarrow\\; x = 0$$ Der Parameter steht nur im linearen Term \\(-3ax\\) und verschwindet beim zweimaligen Ableiten. Die Wendestelle ist daher für die ganze Schar dieselbe." },
      { id:24, level:4, typ:"mc", frage:"\\(f_a(x)=x^3-3ax\\): \\(f_a\\) hat Extrema für:", optionen:["alle \\(a\\)","nur \\(a>0\\)","nur \\(a<0\\)","nie"], korrekt:1, tipp:"\\(f_a'(x)=3x^2-3a\\) — wann hat \\(f_a'\\) zwei Nullstellen mit Vorzeichenwechsel?", loesungsweg:"$$f_a'(x) = 3x^2 - 3a = 0 \\;\\Rightarrow\\; x^2 = a$$ Zwei verschiedene Lösungen gibt es nur für \\(a > 0\\). Bei \\(a = 0\\) fallen sie zusammen (Sattelpunkt, kein Extremum), bei \\(a < 0\\) gibt es gar keine reelle Lösung — dann ist die Funktion streng monoton steigend." },
      // L5 -- Parameterabhängige Extrema
      { id:25, level:5, typ:"numerisch", frage:"\\(f_a(x)=x^3-ax\\), \\(a>0\\): Abstand Hoch-Tiefpunkt auf x-Achse für \\(a=3\\)?", loesung:2, toleranz:0, tipp:"Stellen \\(\\pm\\sqrt{a/3}=\\pm 1\\).", loesungsweg:"Die Extremstellen liegen bei \\(x = \\pm\\sqrt{\\tfrac{a}{3}}\\). Für \\(a = 3\\) also bei \\(\\pm 1\\); ihr Abstand auf der \\(x\\)-Achse beträgt $$2\\sqrt{\\tfrac{a}{3}} = 2 \\cdot 1 = 2$$" },
      { id:26, level:5, typ:"numerisch", frage:"\\(f_a(x)=a x^3-3x\\), Hochpunkt-\\(y\\)-Wert in \\(a\\)? Für \\(a=1\\) (pos. Extr bei \\(x=-1\\))?", loesung:2, toleranz:0, tipp:"\\(f(-1)=-a+3\\).", loesungsweg:"$$f_a(-1) = a \\cdot (-1)^3 - 3 \\cdot (-1) = -a + 3$$ Für \\(a = 1\\) ergibt das \\(2\\). Der Hochpunktwert hängt also linear vom Parameter ab." },
      { id:27, level:5, typ:"numerisch", frage:"\\(f_k(x)=kx^2+x\\): Tiefpunkt \\(x=?\\) für \\(k=1\\)", loesung:-0.5, toleranz:0.01, tipp:"\\(f'=2kx+1=0\\).", loesungsweg:"\\(x=-\\frac{1}{2k}=-0{,}5\\)." },
      { id:28, level:5, typ:"numerisch", frage:"\\(f_a(x)=ax\\cdot e^{-x}\\): Extremstelle?", loesung:1, toleranz:0, tipp:"\\(f'=a(1-x)e^{-x}\\).", loesungsweg:"Produktregel mit dem konstanten Faktor \\(a\\): $$f_a'(x) = a\\left(e^{-x} - xe^{-x}\\right) = a(1-x)e^{-x}$$ Da \\(a \\neq 0\\) und \\(e^{-x} \\neq 0\\), bleibt \\(1 - x = 0\\), also \\(x = 1\\) — <b>unabhängig</b> vom Parameter. Der Faktor \\(a\\) streckt den Graphen nur in \\(y\\)-Richtung." },
      { id:29, level:5, typ:"numerisch", frage:"\\(f_a(x)=x^2-a\\), \\(a>0\\): Welchen y-Wert hat jeder Graph an seiner Nullstelle \\(x=\\sqrt a\\)?", loesung:0, toleranz:0, tipp:"Nullstelle.", loesungsweg:"An einer Nullstelle ist der Funktionswert definitionsgemäß null: $$f_a(\\sqrt a) = (\\sqrt a)^2 - a = a - a = 0$$ Die Frage prüft, ob der Begriff Nullstelle sicher sitzt — gerechnet werden muss nichts." },
      { id:30, level:5, typ:"numerisch", frage:"\\(f_a(x)=x^3-3a^2 x+2a^3\\): Tiefpunkt \\(x=a\\), \\(y=?\\) für \\(a=2\\)", loesung:0, toleranz:0, tipp:"\\(f(a)=a^3-3a^3+2a^3=0\\).", loesungsweg:"$$f_a(a) = a^3 - 3a^2 \\cdot a + 2a^3 = a^3 - 3a^3 + 2a^3 = 0$$ Das Ergebnis ist null für <b>jedes</b> \\(a\\): Alle Tiefpunkte dieser Schar liegen auf der \\(x\\)-Achse." },
      // L6 -- Transfer
      { id:31, level:6, typ:"numerisch", frage:"\\(f_t(x)=x\\cdot e^{-tx}\\), \\(t>0\\): Maximum bei \\(x=1/t\\). Wert bei \\(t=1\\)?", loesung:0.37, toleranz:0.02, tipp:"\\(1/e\\).", loesungsweg:"$$f_1\\left(\\tfrac11\\right) = f_1(1) = 1 \\cdot e^{-1} = \\frac{1}{e} \\approx 0{,}368$$ Allgemein ist der Maximalwert \\(\\frac{1}{te}\\) — er sinkt also mit wachsendem \\(t\\)." },
      { id:32, level:6, typ:"numerisch", frage:"Hochpunkte der Schar liegen bei \\((1/t,\\ 1/(te))\\). Welchen konstanten Wert hat \\(y/x\\)?", loesung:0.37, toleranz:0.02, tipp:"\\(\\frac{1}{e}\\).", loesungsweg:"\\(\\frac{y}{x}=\\frac{1/(te)}{1/t}=\\frac{1}{e}\\approx 0{,}368\\) — konstant, unabhängig von \\(t\\). (Das Produkt \\(x\\cdot y=\\frac{1}{et^2}\\) wäre dagegen nicht konstant.)" },
      { id:33, level:6, typ:"numerisch", frage:"\\(f_3(x)=x^2-6x+9 = (x-3)^2\\): Nullstelle \\(x=?\\)", loesung:3, toleranz:0, tipp:"Doppelte Nullstelle.", loesungsweg:"\\((x-3)^2=0 \\Rightarrow x=3\\)." },
      { id:34, level:6, typ:"mc", frage:"\\(f_a(x)=ax^3+x^2\\) hat Wendestelle bei:", optionen:["\\(x=0\\)","\\(x=-1/(3a)\\)","\\(x=1/a\\)","hängt nicht ab"], korrekt:1, tipp:"\\(f''=6ax+2=0\\).", loesungsweg:"$$f_a''(x) = 6ax + 2 = 0 \\;\\Rightarrow\\; x = -\\frac{2}{6a} = -\\frac{1}{3a}$$ Hier bleibt der Parameter erhalten: Die Wendestelle wandert mit \\(a\\). Für \\(a = 0\\) gäbe es gar keine Wendestelle, weil dann nur noch die Parabel \\(x^2\\) übrig bliebe." },
      { id:35, level:6, typ:"numerisch", frage:"\\(f_a(x)=x^2+a\\): Integrationskonstante der Stammfkt. unter \\([0,2]\\), \\(\\int_0^2 f_a\\,dx\\) für \\(a=1\\)?", loesung:4.67, toleranz:0.1, tipp:"\\(\\frac{8}{3}+2\\).", loesungsweg:"$$\\int_0^2 (x^2+1)\\,dx = \\left[\\tfrac{x^3}{3} + x\\right]_0^2 = \\tfrac83 + 2 \\approx 4{,}67$$" },
      { id:36, level:6, typ:"numerisch", frage:"Allgemein \\(\\int_0^2 (x^2+a)dx=?\\) für \\(a=3\\)", loesung:8.67, toleranz:0.1, tipp:"\\(\\frac{8}{3}+6\\).", loesungsweg:"$$\\int_0^2 (x^2+3)\\,dx = \\left[\\tfrac{x^3}{3} + 3x\\right]_0^2 = \\tfrac83 + 6 \\approx 8{,}67$$ Allgemein ergibt sich \\(\\tfrac83 + 2a\\) — der Parameter geht linear ein, weil er über die Intervalllänge \\(2\\) integriert wird." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
