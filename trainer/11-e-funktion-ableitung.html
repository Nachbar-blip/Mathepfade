<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Funktion ableiten - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-e-funktion-ableitung';
    const THEMA_CONFIG = { name: 'e-Funktion ableiten', bereich: 'analysis' };
    const AUFGABEN = [
      // L1 -- Grundregel
      { id:1, level:1, typ:"mc", frage:"Ableitung von \\(e^x\\):", optionen:["\\(x\\cdot e^{x-1}\\)","\\(e^x\\)","\\(e^{x+1}\\)","\\(\\ln x\\)"], korrekt:1, tipp:"Die e-Funktion ist ihre eigene Ableitung.", loesungsweg:"Die \\(e\\)-Funktion ist die einzige Funktion, die sich beim Ableiten nicht verändert: $$(e^x)' = e^x$$ Genau deshalb ist sie in der Analysis so zentral. Die Potenzregel \\((x^n)' = nx^{n-1}\\) gilt hier <b>nicht</b> — bei \\(e^x\\) steht das \\(x\\) im Exponenten, nicht in der Basis." },
      { id:2, level:1, typ:"mc", frage:"Stammfunktion von \\(e^x\\):", optionen:["\\(e^{x+1}\\)","\\(e^x+C\\)","\\(\\ln x\\)","\\(\\frac{e^x}{x}\\)"], korrekt:1, tipp:"Selber, plus C.", loesungsweg:"Weil \\(e^x\\) beim Ableiten unverändert bleibt, ist sie auch ihre eigene Stammfunktion: $$F(x) = e^x + C$$ Die Integrationskonstante \\(C\\) gehört dazu, denn jede um eine Konstante verschobene Funktion hat dieselbe Ableitung." },
      { id:3, level:1, typ:"numerisch", frage:"\\(f(x)=e^x\\), \\(f'(0)=?\\)", loesung:1, toleranz:0, tipp:"\\(e^0=1\\).", loesungsweg:"Wegen \\(f'(x) = e^x\\) gilt an der Stelle \\(0\\): $$f'(0) = e^0 = 1$$ Der Graph von \\(e^x\\) hat im Punkt \\((0\\mid1)\\) also genau die Steigung \\(1\\)." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=3e^x\\), \\(f'(x)\\) bei \\(x=0\\)?", loesung:3, toleranz:0, tipp:"Faktor bleibt.", loesungsweg:"Ein konstanter Faktor bleibt beim Ableiten stehen: \\(f'(x) = 3e^x\\). Einsetzen von \\(x = 0\\): $$f'(0) = 3 \\cdot e^0 = 3 \\cdot 1 = 3$$" },
      { id:5, level:1, typ:"mc", frage:"\\((5e^x)'=?\\)", optionen:["\\(5e^x\\)","\\(5xe^{x-1}\\)","\\(e^{5x}\\)","\\(5\\)"], korrekt:0, tipp:"Konstanter Faktor.", loesungsweg:"Nach der Faktorregel wird nur die Funktion abgeleitet, der Vorfaktor bleibt: $$(5e^x)' = 5 \\cdot (e^x)' = 5e^x$$" },
      { id:6, level:1, typ:"mc", frage:"\\((e^x+x)'=?\\)", optionen:["\\(e^x\\)","\\(e^x+1\\)","\\(e^{x+1}\\)","\\(x e^x\\)"], korrekt:1, tipp:"Summenregel.", loesungsweg:"Nach der Summenregel wird jeder Summand einzeln abgeleitet: $$(e^x)' = e^x \\quad \\text{und} \\quad (x)' = 1$$ $$(e^x + x)' = e^x + 1$$" },
      // L2 -- Kettenregel
      { id:7, level:2, typ:"mc", frage:"\\((e^{2x})'=?\\)", optionen:["\\(e^{2x}\\)","\\(2e^{2x}\\)","\\(2xe^{2x-1}\\)","\\(e^2\\)"], korrekt:1, tipp:"Kettenregel: innere Abl. mal e-fkt.", loesungsweg:"Hier greift die Kettenregel: äußere Ableitung mal innere Ableitung. Die äußere Funktion \\(e^u\\) bleibt beim Ableiten sie selbst, die innere \\(u = 2x\\) liefert \\(u' = 2\\): $$(e^{2x})' = e^{2x} \\cdot 2 = 2e^{2x}$$" },
      { id:8, level:2, typ:"mc", frage:"\\((e^{-x})'=?\\)", optionen:["\\(e^{-x}\\)","\\(-e^{-x}\\)","\\(-xe^{-x}\\)","\\(e^x\\)"], korrekt:1, tipp:"Innere Abl. \\(=-1\\).", loesungsweg:"Die innere Funktion ist \\(u = -x\\) mit \\(u' = -1\\): $$(e^{-x})' = e^{-x} \\cdot (-1) = -e^{-x}$$ Das Minuszeichen ist der Grund, warum \\(e^{-x}\\) fällt statt zu steigen." },
      { id:9, level:2, typ:"mc", frage:"\\((e^{3x+1})'=?\\)", optionen:["\\(3e^{3x+1}\\)","\\(e^{3x+1}\\)","\\(e^3\\)","\\((3x+1)e^{3x}\\)"], korrekt:0, tipp:"Innere Abl. 3.", loesungsweg:"Die innere Funktion ist \\(u = 3x+1\\) mit \\(u' = 3\\): $$(e^{3x+1})' = e^{3x+1} \\cdot 3 = 3e^{3x+1}$$ Die \\(+1\\) verschiebt den Graphen nur und hat auf die innere Ableitung keinen Einfluss." },
      { id:10, level:2, typ:"numerisch", frage:"\\(f(x)=e^{2x}\\), \\(f'(0)=?\\)", loesung:2, toleranz:0, tipp:"\\(2\\cdot1\\).", loesungsweg:"Mit \\(f'(x) = 2e^{2x}\\) folgt: $$f'(0) = 2 \\cdot e^{0} = 2 \\cdot 1 = 2$$" },
      { id:11, level:2, typ:"numerisch", frage:"\\(f(x)=e^{-2x}\\), \\(f'(0)=?\\)", loesung:-2, toleranz:0, tipp:"Innere Abl. \\(-2\\).", loesungsweg:"Die innere Ableitung ist \\(-2\\), also \\(f'(x) = -2e^{-2x}\\): $$f'(0) = -2 \\cdot e^{0} = -2$$ Die negative Steigung passt zum fallenden Verlauf von \\(e^{-2x}\\)." },
      { id:12, level:2, typ:"mc", frage:"\\((e^{x^2})'=?\\)", optionen:["\\(e^{x^2}\\)","\\(2xe^{x^2}\\)","\\(x^2 e^{x^2-1}\\)","\\(2e^{2x}\\)"], korrekt:1, tipp:"Innere Abl. \\(2x\\).", loesungsweg:"Innere Funktion \\(u = x^2\\) mit \\(u' = 2x\\): $$(e^{x^2})' = e^{x^2} \\cdot 2x = 2xe^{x^2}$$" },
      // L3 -- Produktregel
      { id:13, level:3, typ:"mc", frage:"\\((xe^x)'=?\\)", optionen:["\\(e^x\\)","\\(xe^x\\)","\\((1+x)e^x\\)","\\(xe^{x-1}\\)"], korrekt:2, tipp:"Produktregel.", loesungsweg:"Produktregel mit \\(u = x\\) und \\(v = e^x\\): $$u'v + uv' = 1 \\cdot e^x + x \\cdot e^x = (1+x)e^x$$ Das Ausklammern von \\(e^x\\) ist typisch und macht die Nullstellen der Ableitung sichtbar." },
      { id:14, level:3, typ:"mc", frage:"\\((x^2 e^x)'=?\\)", optionen:["\\(2xe^x\\)","\\(x^2 e^x\\)","\\((2x+x^2)e^x\\)","\\(x(x+2)\\)"], korrekt:2, tipp:"Produkt.", loesungsweg:"Produktregel mit \\(u = x^2\\) und \\(v = e^x\\): $$2x \\cdot e^x + x^2 \\cdot e^x = (x^2 + 2x)e^x$$ Ausgeklammert: \\(x(x+2)e^x\\) — die Ableitung hat also die Nullstellen \\(0\\) und \\(-2\\)." },
      { id:15, level:3, typ:"numerisch", frage:"\\(f(x)=xe^x\\), \\(f'(0)=?\\)", loesung:1, toleranz:0, tipp:"\\((1+0)\\cdot 1\\).", loesungsweg:"Mit \\(f'(x) = (1+x)e^x\\) folgt: $$f'(0) = (1+0) \\cdot e^0 = 1 \\cdot 1 = 1$$" },
      { id:16, level:3, typ:"numerisch", frage:"\\(f(x)=xe^x\\), \\(f'(1)\\) (gerundet)?", loesung:5.44, toleranz:0.1, tipp:"\\(2e\\).", loesungsweg:"Mit \\(f'(x) = (1+x)e^x\\) folgt: $$f'(1) = (1+1) \\cdot e^1 = 2e \\approx 2 \\cdot 2{,}718 \\approx 5{,}44$$" },
      { id:17, level:3, typ:"mc", frage:"\\(((x-1)e^x)'=?\\)", optionen:["\\(e^x\\)","\\(xe^x\\)","\\((x-1)e^x\\)","\\((x-2)e^x\\)"], korrekt:1, tipp:"\\(1\\cdot e^x+(x-1)e^x\\).", loesungsweg:"Produktregel mit \\(u = x-1\\) und \\(v = e^x\\): $$1 \\cdot e^x + (x-1)e^x = e^x\\big(1 + x - 1\\big) = xe^x$$ Die beiden Einsen heben sich auf — deshalb ist das Ergebnis so schlicht." },
      { id:18, level:3, typ:"numerisch", frage:"\\(f(x)=(x-1)e^x\\): Nullstelle von \\(f'\\)?", loesung:0, toleranz:0, tipp:"\\(xe^x=0\\).", loesungsweg:"Die Ableitung lautet \\(f'(x) = xe^x\\). Ein Produkt ist null, wenn ein Faktor null ist. Weil \\(e^x\\) für kein \\(x\\) null wird, bleibt nur: $$x = 0$$ Diese Überlegung — die \\(e\\)-Funktion wird nie null — braucht man bei fast jeder Nullstellensuche mit \\(e\\)." },
      // L4 -- Extrema
      { id:19, level:4, typ:"numerisch", frage:"\\(f(x)=xe^{-x}\\): Extremstelle?", loesung:1, toleranz:0, tipp:"\\(f'(x)=(1-x)e^{-x}\\).", loesungsweg:"Produktregel mit innerer Ableitung \\(-1\\): $$f'(x) = 1 \\cdot e^{-x} + x \\cdot (-e^{-x}) = (1-x)e^{-x}$$ Nullsetzen: Da \\(e^{-x} \\neq 0\\), muss \\(1 - x = 0\\) sein, also \\(x = 1\\)." },
      { id:20, level:4, typ:"numerisch", frage:"\\(f(x)=xe^{-x}\\), \\(f(1)\\) (gerundet)?", loesung:0.37, toleranz:0.02, tipp:"\\(1/e\\).", loesungsweg:"$$f(1) = 1 \\cdot e^{-1} = \\frac{1}{e} \\approx \\frac{1}{2{,}718} \\approx 0{,}37$$ Das ist zugleich der Hochpunktwert der Funktion." },
      { id:21, level:4, typ:"numerisch", frage:"\\(f(x)=x^2 e^{-x}\\): positive Extremstelle?", loesung:2, toleranz:0, tipp:"\\(f'=(2x-x^2)e^{-x}=0\\).", loesungsweg:"\\(x=0\\) oder \\(x=2\\); positiv: \\(x=2\\)." },
      { id:22, level:4, typ:"numerisch", frage:"\\(f(x)=e^x-x\\): Extremstelle?", loesung:0, toleranz:0, tipp:"\\(e^x-1=0\\).", loesungsweg:"$$f'(x) = e^x - 1 = 0 \\;\\Rightarrow\\; e^x = 1 \\;\\Rightarrow\\; x = 0$$ Die \\(e\\)-Funktion nimmt den Wert \\(1\\) genau an der Stelle \\(0\\) an." },
      { id:23, level:4, typ:"numerisch", frage:"\\(f(x)=e^x-x\\), Wert im Extremum?", loesung:1, toleranz:0, tipp:"\\(f(0)=1-0\\).", loesungsweg:"An der Extremstelle \\(x = 0\\) ist der Funktionswert: $$f(0) = e^0 - 0 = 1$$ Wegen \\(f''(x) = e^x > 0\\) handelt es sich um einen Tiefpunkt — \\(e^x\\) liegt also nie unter \\(x+1\\)." },
      { id:24, level:4, typ:"mc", frage:"\\(f(x)=e^{-x^2}\\): zweite Ableitung bei \\(x=0\\) Vorzeichen?", optionen:["positiv","negativ","null","unklar"], korrekt:1, tipp:"Hochpunkt bei 0.", loesungsweg:"Mit \\(f'(x) = -2xe^{-x^2}\\) liefert die Produktregel $$f''(x) = (-2 + 4x^2)e^{-x^2}$$ An der Stelle \\(0\\): \\(f''(0) = -2 \\cdot 1 = -2 < 0\\). Negative zweite Ableitung bedeutet Rechtskrümmung, also ein <b>Hochpunkt</b> — die Glockenkurve hat dort ihren Gipfel." },
      // L5 -- Wendepunkte
      { id:25, level:5, typ:"numerisch", frage:"\\(f(x)=xe^{-x}\\): Wendestelle?", loesung:2, toleranz:0, tipp:"\\(f''(x)=(x-2)e^{-x}=0\\).", loesungsweg:"Aus \\(f'(x) = (1-x)e^{-x}\\) folgt mit der Produktregel $$f''(x) = -e^{-x} - (1-x)e^{-x} = (x-2)e^{-x}$$ Nullsetzen: \\(e^{-x} \\neq 0\\), also \\(x - 2 = 0\\) und damit \\(x = 2\\)." },
      { id:26, level:5, typ:"numerisch", frage:"\\(f(x)=e^{-x^2}\\): positive Wendestelle (gerundet)?", loesung:0.707, toleranz:0.05, tipp:"\\(x=1/\\sqrt{2}\\).", loesungsweg:"Mit \\(f''(x) = (4x^2 - 2)e^{-x^2}\\) und \\(e^{-x^2} \\neq 0\\) gilt: $$4x^2 - 2 = 0 \\;\\Rightarrow\\; x^2 = \\tfrac12 \\;\\Rightarrow\\; x = \\frac{1}{\\sqrt2} \\approx 0{,}707$$ Die zweite Wendestelle liegt symmetrisch bei \\(-0{,}707\\)." },
      { id:27, level:5, typ:"numerisch", frage:"\\(f(x)=(x+1)e^x\\), \\(f'(x)=?\\) bei \\(x=0\\)", loesung:2, toleranz:0, tipp:"\\(f'=(x+2)e^x\\).", loesungsweg:"Produktregel mit \\(u = x+1\\), \\(v = e^x\\): $$f'(x) = 1 \\cdot e^x + (x+1)e^x = (x+2)e^x$$ An der Stelle \\(0\\): \\(f'(0) = 2 \\cdot 1 = 2\\)." },
      { id:28, level:5, typ:"numerisch", frage:"\\(f(x)=\\frac{e^x}{x}\\), \\(x>0\\): Extremstelle?", loesung:1, toleranz:0, tipp:"Quotientenregel: \\(\\frac{(x-1)e^x}{x^2}=0\\).", loesungsweg:"Quotientenregel mit \\(u = e^x\\), \\(v = x\\): $$f'(x) = \\frac{e^x \\cdot x - e^x \\cdot 1}{x^2} = \\frac{(x-1)e^x}{x^2}$$ Ein Bruch ist null, wenn der Zähler null ist. Da \\(e^x \\neq 0\\), folgt \\(x = 1\\)." },
      { id:29, level:5, typ:"mc", frage:"Tangente an \\(f(x)=e^x\\) in \\(x=0\\):", optionen:["\\(y=x\\)","\\(y=x+1\\)","\\(y=e^x\\)","\\(y=1\\)"], korrekt:1, tipp:"\\(f(0)=1, f'(0)=1\\).", loesungsweg:"Die Tangente in \\(x_0\\) lautet \\(t(x) = f(x_0) + f'(x_0)(x - x_0)\\). Hier ist \\(f(0) = 1\\) und \\(f'(0) = 1\\): $$t(x) = 1 + 1 \\cdot (x - 0) = x + 1$$ Diese Tangente liegt überall unterhalb von \\(e^x\\) — daraus folgt die oft benutzte Abschätzung \\(e^x \\geq x+1\\)." },
      { id:30, level:5, typ:"numerisch", frage:"\\(f(x)=e^x\\): Tangente in \\(x_0=1\\), Steigung?", loesung:2.72, toleranz:0.05, tipp:"\\(f'(1)=e\\).", loesungsweg:"Die Steigung der Tangente ist der Wert der Ableitung an der Berührstelle: $$f'(1) = e^1 = e \\approx 2{,}72$$" },
      // L6 -- Transfer
      { id:31, level:6, typ:"numerisch", frage:"\\(f(x)=e^{2x}-e^x\\): Nullstelle?", loesung:0, toleranz:0, tipp:"\\(e^x(e^x-1)=0\\).", loesungsweg:"Ausklammern macht die Nullstellen sichtbar: $$e^{2x} - e^x = e^x(e^x - 1) = 0$$ Der Faktor \\(e^x\\) wird nie null, also muss \\(e^x - 1 = 0\\) gelten, das heißt \\(e^x = 1\\) und damit \\(x = 0\\)." },
      { id:32, level:6, typ:"numerisch", frage:"\\(f(x)=e^{2x}-e^x\\): \\(f'(x)=0\\) für \\(x=?\\) (gerundet)", loesung:-0.69, toleranz:0.05, tipp:"\\(2e^{2x}=e^x \\Rightarrow e^x=1/2\\).", loesungsweg:"$$f'(x) = 2e^{2x} - e^x = 0 \\;\\Rightarrow\\; 2e^{2x} = e^x$$ Division durch \\(e^x\\) (erlaubt, da nie null): \\(2e^x = 1\\), also \\(e^x = \\tfrac12\\). Logarithmieren: $$x = \\ln\\tfrac12 = -\\ln 2 \\approx -0{,}69$$" },
      { id:33, level:6, typ:"numerisch", frage:"\\(f(x)=\\ln x\\), \\(f'(2)\\) (gerundet)?", loesung:0.5, toleranz:0.01, tipp:"\\(f'=1/x\\).", loesungsweg:"Die Ableitung des natürlichen Logarithmus ist \\(f'(x) = \\frac{1}{x}\\): $$f'(2) = \\frac{1}{2} = 0{,}5$$" },
      { id:34, level:6, typ:"numerisch", frage:"\\(\\int_0^1 e^x dx\\) (gerundet)?", loesung:1.72, toleranz:0.05, tipp:"\\(e-1\\).", loesungsweg:"Stammfunktion von \\(e^x\\) ist \\(e^x\\): $$\\int_0^1 e^x\\,dx = \\left[e^x\\right]_0^1 = e^1 - e^0 = e - 1 \\approx 1{,}72$$" },
      { id:35, level:6, typ:"numerisch", frage:"\\(\\int e^{2x} dx=?\\) Koeffizient bei \\(e^{2x}\\)?", loesung:0.5, toleranz:0.01, tipp:"\\(\\frac{1}{2}e^{2x}+C\\).", loesungsweg:"Die innere Ableitung von \\(2x\\) ist \\(2\\); beim Integrieren muss deshalb durch \\(2\\) geteilt werden: $$\\int e^{2x}\\,dx = \\tfrac12 e^{2x} + C$$ Der gesuchte Koeffizient ist \\(0{,}5\\). Probe durch Ableiten: \\(\\left(\\tfrac12 e^{2x}\\right)' = \\tfrac12 \\cdot 2e^{2x} = e^{2x}\\) ✓" },
      { id:36, level:6, typ:"mc", frage:"\\((e^x \\sin x)'=?\\)", optionen:["\\(e^x\\sin x\\)","\\(e^x(\\sin x+\\cos x)\\)","\\(e^x\\cos x\\)","\\(-e^x\\sin x\\)"], korrekt:1, tipp:"Produktregel.", loesungsweg:"Produktregel mit \\(u = e^x\\) und \\(v = \\sin x\\): $$e^x \\cdot \\sin x + e^x \\cdot \\cos x = e^x(\\sin x + \\cos x)$$ Das Ausklammern von \\(e^x\\) ist hier wie bei allen Produkten mit der \\(e\\)-Funktion der letzte Schritt." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
