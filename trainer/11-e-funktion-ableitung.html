<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-e-funktion-ableitung';
    const THEMA_CONFIG = { name: 'e-Funktion ableiten', bereich: 'analysis' };
    const AUFGABEN = [
      // L1 -- Grundregel
      { id:1, level:1, typ:"mc", frage:"Ableitung von \\(e^x\\):", optionen:["\\(x\\cdot e^{x-1}\\)","\\(e^x\\)","\\(e^{x+1}\\)","\\(\\ln x\\)"], korrekt:1, tipp:"Die e-Funktion ist ihre eigene Ableitung.", loesungsweg:"Die \\(e\\)-Funktion ist die einzige Funktion, die sich beim Ableiten nicht verändert: $$(e^x)' = e^x$$ Genau deshalb ist sie in der Analysis so zentral. Die Potenzregel \\((x^n)' = nx^{n-1}\\) gilt hier <b>nicht</b> — bei \\(e^x\\) steht das \\(x\\) im Exponenten, nicht in der Basis." },
      { id:2, level:1, typ:"numerisch", frage:"Welche Steigung hat der Graph von \\(f(x)=e^x\\) an der Stelle \\(x=1\\)? Runde auf zwei Nachkommastellen.", loesung:2.72, toleranz:0.01, tipp:"Erst die Ableitung bilden, dann die Stelle einsetzen.", loesungsweg:"Die \\(e\\)-Funktion ist ihre eigene Ableitung: $$f'(x) = e^x$$ Die Steigung an der Stelle \\(x=1\\) ist damit $$f'(1) = e^1 = e \\approx 2{,}72$$ Bemerkenswert: An jeder Stelle stimmt die Steigung mit dem Funktionswert überein, denn \\(f'(x)=f(x)\\). Bei \\(x=1\\) ist also auch der Funktionswert \\(2{,}72\\)." },
      { id:3, level:1, typ:"numerisch", frage:"\\(f(x)=e^x\\), \\(f'(0)=?\\)", loesung:1, toleranz:0, tipp:"\\(e^0=1\\).", loesungsweg:"Wegen \\(f'(x) = e^x\\) gilt an der Stelle \\(0\\): $$f'(0) = e^0 = 1$$ Der Graph von \\(e^x\\) hat im Punkt \\((0\\mid1)\\) also genau die Steigung \\(1\\)." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=3e^x\\), \\(f'(x)\\) bei \\(x=0\\)?", loesung:3, toleranz:0, tipp:"Faktor bleibt.", loesungsweg:"Ein konstanter Faktor bleibt beim Ableiten stehen: \\(f'(x) = 3e^x\\). Einsetzen von \\(x = 0\\): $$f'(0) = 3 \\cdot e^0 = 3 \\cdot 1 = 3$$" },
      { id:5, level:1, typ:"mc", frage:"\\((5e^x)'=?\\)", optionen:["\\(5e^x\\)","\\(5xe^{x-1}\\)","\\(e^{5x}\\)","\\(5\\)"], korrekt:0, tipp:"Konstanter Faktor.", loesungsweg:"Nach der Faktorregel wird nur die Funktion abgeleitet, der Vorfaktor bleibt: $$(5e^x)' = 5 \\cdot (e^x)' = 5e^x$$" },
      { id:6, level:1, typ:"mc", frage:"\\((e^x+x)'=?\\)", optionen:["\\(e^x\\)","\\(e^x+1\\)","\\(e^{x+1}\\)","\\(x e^x\\)"], korrekt:1, tipp:"Summenregel.", loesungsweg:"Nach der Summenregel wird jeder Summand einzeln abgeleitet: $$(e^x)' = e^x \\quad \\text{und} \\quad (x)' = 1$$ $$(e^x + x)' = e^x + 1$$" },
      // L2 -- Kettenregel
      { id:7, level:2, typ:"mc", frage:"\\((e^{2x})'=?\\)", optionen:["\\(e^{2x}\\)","\\(2e^{2x}\\)","\\(2xe^{2x-1}\\)","\\(e^2\\)"], korrekt:1, tipp:"Kettenregel: innere Abl. mal e-fkt.", loesungsweg:"Hier greift die Kettenregel: äußere Ableitung mal innere Ableitung. Die äußere Funktion \\(e^u\\) bleibt beim Ableiten sie selbst, die innere \\(u = 2x\\) liefert \\(u' = 2\\): $$(e^{2x})' = e^{2x} \\cdot 2 = 2e^{2x}$$" },
      { id:8, level:2, typ:"mc", frage:"\\((e^{-x})'=?\\)", optionen:["\\(e^{-x}\\)","\\(-e^{-x}\\)","\\(-xe^{-x}\\)","\\(e^x\\)"], korrekt:1, tipp:"Innere Abl. \\(=-1\\).", loesungsweg:"Die innere Funktion ist \\(u = -x\\) mit \\(u' = -1\\): $$(e^{-x})' = e^{-x} \\cdot (-1) = -e^{-x}$$ Das Minuszeichen ist der Grund, warum \\(e^{-x}\\) fällt statt zu steigen." },
      { id:9, level:2, typ:"mc", frage:"\\((e^{3x+1})'=?\\)", optionen:["\\(3e^{3x+1}\\)","\\(e^{3x+1}\\)","\\(e^3\\)","\\((3x+1)e^{3x}\\)"], korrekt:0, tipp:"Innere Abl. 3.", loesungsweg:"Die innere Funktion ist \\(u = 3x+1\\) mit \\(u' = 3\\): $$(e^{3x+1})' = e^{3x+1} \\cdot 3 = 3e^{3x+1}$$ Die \\(+1\\) verschiebt den Graphen nur und hat auf die innere Ableitung keinen Einfluss." },
      { id:10, level:2, typ:"numerisch", frage:"Für \\(f(x)=e^{2x}\\): Welchen Wert hat die Ableitung an der Stelle \\(x=0\\)?", loesung:2, toleranz:0, tipp:"Erst die Kettenregel anwenden, dann die Stelle einsetzen.", loesungsweg:"Die äußere Funktion \\(e^u\\) bleibt beim Ableiten erhalten, die innere Funktion \\(u=2x\\) liefert den Faktor \\(2\\): $$f'(x) = 2 \\cdot e^{2x}$$ Einsetzen von \\(x=0\\) mit \\(e^0=1\\): $$f'(0) = 2 \\cdot e^{0} = 2 \\cdot 1 = 2$$ Wer den inneren Faktor vergisst, erhält fälschlich \\(1\\)." },
      { id:11, level:2, typ:"numerisch", frage:"\\(f(x)=e^{-2x}\\), \\(f'(0)=?\\)", loesung:-2, toleranz:0, tipp:"Innere Abl. \\(-2\\).", loesungsweg:"Die innere Ableitung ist \\(-2\\), also \\(f'(x) = -2e^{-2x}\\): $$f'(0) = -2 \\cdot e^{0} = -2$$ Die negative Steigung passt zum fallenden Verlauf von \\(e^{-2x}\\)." },
      { id:12, level:2, typ:"mc", frage:"Wie lautet die Ableitung von \\(f(x)=e^{x^2}\\)?", optionen:["\\(e^{x^2}\\)","\\(2x\\,e^{x^2}\\)","\\(x^2\\,e^{x^2-1}\\)","\\(2\\,e^{2x}\\)"], korrekt:1, tipp:"Die innere Funktion steht im Exponenten — leite sie getrennt ab.", loesungsweg:"Kettenregel mit äußerer Funktion \\(e^u\\) und innerer Funktion \\(u(x)=x^2\\): $$f'(x) = e^{u} \\cdot u'(x) = e^{x^2} \\cdot 2x = 2x\\,e^{x^2}$$ Die Potenzregel \\((x^n)'=nx^{n-1}\\) gilt hier <b>nicht</b>, denn \\(x\\) steht im Exponenten und nicht in der Basis — deshalb ist \\(x^2e^{x^2-1}\\) falsch. Und \\(e^{x^2}\\) ist nicht dasselbe wie \\(e^{2x}\\)." },
      // L3 -- Produktregel
      { id:13, level:3, typ:"mc", frage:"\\((xe^x)'=?\\)", optionen:["\\(e^x\\)","\\(xe^x\\)","\\((1+x)e^x\\)","\\(xe^{x-1}\\)"], korrekt:2, tipp:"Produktregel.", loesungsweg:"Produktregel mit \\(u = x\\) und \\(v = e^x\\): $$u'v + uv' = 1 \\cdot e^x + x \\cdot e^x = (1+x)e^x$$ Das Ausklammern von \\(e^x\\) ist typisch und macht die Nullstellen der Ableitung sichtbar." },
      { id:14, level:3, typ:"mc", frage:"\\((x^2 e^x)'=?\\)", optionen:["\\(2xe^x\\)","\\(x^2 e^x\\)","\\((2x+x^2)e^x\\)","\\(x(x+2)\\)"], korrekt:2, tipp:"Produkt.", loesungsweg:"Produktregel mit \\(u = x^2\\) und \\(v = e^x\\): $$2x \\cdot e^x + x^2 \\cdot e^x = (x^2 + 2x)e^x$$ Ausgeklammert: \\(x(x+2)e^x\\) — die Ableitung hat also die Nullstellen \\(0\\) und \\(-2\\)." },
      { id:15, level:3, typ:"numerisch", frage:"Für \\(f(x)=x\\,e^x\\): Welchen Wert hat die Ableitung an der Stelle \\(x=0\\)?", loesung:1, toleranz:0, tipp:"Produktregel anwenden und erst danach einsetzen.", loesungsweg:"Produktregel mit \\(u=x\\), \\(u'=1\\) und \\(v=e^x\\), \\(v'=e^x\\): $$f'(x) = 1 \\cdot e^x + x \\cdot e^x = (1+x)e^x$$ Einsetzen von \\(x=0\\): $$f'(0) = (1+0)\\cdot e^0 = 1 \\cdot 1 = 1$$ Wer nur einen der beiden Summanden bildet, erhält \\(0\\) oder \\(1\\cdot e^0\\) ohne Begründung — die Produktregel verlangt beide Terme." },
      { id:16, level:3, typ:"numerisch", frage:"\\(f(x)=xe^x\\), \\(f'(1)\\) (gerundet)?", loesung:5.44, toleranz:0.1, tipp:"\\(2e\\).", loesungsweg:"Mit \\(f'(x) = (1+x)e^x\\) folgt: $$f'(1) = (1+1) \\cdot e^1 = 2e \\approx 2 \\cdot 2{,}718 \\approx 5{,}44$$" },
      { id:17, level:3, typ:"mc", frage:"\\(((x-1)e^x)'=?\\)", optionen:["\\(e^x\\)","\\(xe^x\\)","\\((x-1)e^x\\)","\\((x-2)e^x\\)"], korrekt:1, tipp:"\\(1\\cdot e^x+(x-1)e^x\\).", loesungsweg:"Produktregel mit \\(u = x-1\\) und \\(v = e^x\\): $$1 \\cdot e^x + (x-1)e^x = e^x\\big(1 + x - 1\\big) = xe^x$$ Die beiden Einsen heben sich auf — deshalb ist das Ergebnis so schlicht." },
      { id:18, level:3, typ:"numerisch", frage:"\\(f(x)=(x-1)e^x\\): Nullstelle von \\(f'\\)?", loesung:0, toleranz:0, tipp:"\\(xe^x=0\\).", loesungsweg:"Die Ableitung lautet \\(f'(x) = xe^x\\). Ein Produkt ist null, wenn ein Faktor null ist. Weil \\(e^x\\) für kein \\(x\\) null wird, bleibt nur: $$x = 0$$ Diese Überlegung — die \\(e\\)-Funktion wird nie null — braucht man bei fast jeder Nullstellensuche mit \\(e\\)." },
      // L4 -- Extrema
      { id:19, level:4, typ:"numerisch", frage:"Welche Steigung hat die Tangente an den Graphen von \\(f(x)=(3x-2)e^{x}\\) an der Stelle \\(x=2\\)? Runde auf zwei Nachkommastellen.", loesung:51.72, toleranz:0.3, tipp:"Zuerst mit der passenden Regel für ein Produkt ableiten, danach zusammenfassen und einsetzen.", loesungsweg:"Produktregel mit \\(u=3x-2\\), \\(u'=3\\) und \\(v=e^{x}\\), \\(v'=e^{x}\\): $$f'(x) = 3e^{x} + (3x-2)e^{x}$$ Ausklammern von \\(e^{x}\\) und Zusammenfassen: $$f'(x) = \\big(3+3x-2\\big)e^{x} = (3x+1)e^{x}$$ Einsetzen der Stelle \\(x=2\\): $$f'(2) = 7e^{2} \\approx 7 \\cdot 7{,}389 \\approx 51{,}72$$ Wer nur einen der beiden Summanden bildet, erhält \\(3e^2\\approx 22{,}17\\) oder \\(4e^2\\approx 29{,}56\\)." },
      { id:20, level:4, typ:"numerisch", frage:"Welche Steigung hat die Tangente an den Graphen von \\(f(x)=e^{-0{,}5x}\\) an der Stelle \\(x=2\\)? Runde auf drei Nachkommastellen.", loesung:-0.184, toleranz:0.004, tipp:"Die Tangentensteigung ist der Ableitungswert an der Stelle — achte auf das Vorzeichen der inneren Ableitung.", loesungsweg:"Kettenregel: die innere Funktion \\(-0{,}5x\\) hat die Ableitung \\(-0{,}5\\), also $$f'(x) = -0{,}5\\,e^{-0{,}5x}$$ An der Stelle \\(x=2\\): $$f'(2) = -0{,}5 \\cdot e^{-1} = -\\frac{0{,}5}{2{,}71828} \\approx -0{,}184$$ Die negative Steigung passt zum fallenden Verlauf: \\(f\\) ist eine Zerfallsfunktion. Ohne das Minus der inneren Ableitung käme \\(+0{,}184\\) heraus." },
      { id:21, level:4, typ:"numerisch", frage:"Für \\(f(x)=a\\cdot e^{2x}\\) soll die Steigung an der Stelle \\(x=1\\) genau \\(4\\) betragen. Bestimme \\(a\\) auf drei Nachkommastellen.", loesung:0.271, toleranz:0.004, tipp:"Stelle die Ableitung mit dem unbekannten Faktor auf und löse die entstehende Gleichung nach ihm auf.", loesungsweg:"Der konstante Faktor bleibt beim Ableiten stehen, die Kettenregel liefert zusätzlich den Faktor \\(2\\): $$f'(x) = 2a\\,e^{2x}$$ Die Bedingung \\(f'(1)=4\\) ergibt $$2a\\,e^{2} = 4 \\;\\Rightarrow\\; a = \\frac{2}{e^{2}} \\approx \\frac{2}{7{,}389} \\approx 0{,}271$$ Kontrolle: \\(2 \\cdot 0{,}271 \\cdot e^2 \\approx 4{,}00\\)." },
      { id:22, level:4, typ:"mc", frage:"Welcher Term ist die Ableitung von \\(f(x)=(2x-1)e^{2x}\\)?", optionen:["\\(4x\\,e^{2x}\\)","\\(2e^{2x}\\)","\\((4x-2)e^{2x}\\)","\\(2(2x-1)e^{2x}\\)"], korrekt:0, tipp:"Zwei Regeln sind nötig; fasse am Ende zusammen, indem du \\(e^{2x}\\) ausklammerst.", loesungsweg:"Produktregel mit \\(u=2x-1\\), \\(u'=2\\) und \\(v=e^{2x}\\), \\(v'=2e^{2x}\\): $$f'(x) = 2e^{2x} + (2x-1)\\cdot 2e^{2x}$$ Ausklammern von \\(e^{2x}\\) und Zusammenfassen: $$f'(x) = \\big(2 + 4x - 2\\big)e^{2x} = 4x\\,e^{2x}$$ Die Distraktoren entstehen, wenn nur ein Summand gebildet (\\(2e^{2x}\\) bzw. \\(2(2x-1)e^{2x}\\)) oder beim Zusammenfassen die \\(-2\\) nicht gegen die \\(+2\\) gekürzt wird." },
      { id:23, level:4, typ:"numerisch", frage:"Ein Bestand wächst nach \\(N(t)=800\\,e^{0{,}06t}\\) (\\(t\\) in Jahren). Wie groß ist die momentane Änderungsrate nach \\(10\\) Jahren, in Stück pro Jahr? Runde auf eine Nachkommastelle.", loesung:87.5, toleranz:1.0, tipp:"Die momentane Änderungsrate ist der Wert der Ableitung zu diesem Zeitpunkt.", loesungsweg:"Ableiten mit Kettenregel; der Faktor \\(800\\) bleibt, die innere Ableitung ist \\(0{,}06\\): $$N'(t) = 800 \\cdot 0{,}06 \\cdot e^{0{,}06t} = 48\\,e^{0{,}06t}$$ Zum Zeitpunkt \\(t=10\\): $$N'(10) = 48 \\cdot e^{0{,}6} \\approx 48 \\cdot 1{,}8221 \\approx 87{,}5$$ Der Bestand wächst dort also um rund \\(88\\) Stück pro Jahr. Der Bestand selbst ist zu diesem Zeitpunkt \\(N(10)\\approx 1458\\) — Bestand und Änderungsrate dürfen nicht verwechselt werden." },
      { id:24, level:4, typ:"numerisch", frage:"Für \\(f(x)=x\\,e^{2x}\\) ist der Wert der zweiten Ableitung an der Stelle \\(x=1\\) gesucht. Runde auf zwei Nachkommastellen.", loesung:59.11, toleranz:0.4, tipp:"Zweimal ableiten; beim zweiten Mal wird erneut die Produktregel gebraucht.", loesungsweg:"<b>Erste Ableitung</b> mit Produkt- und Kettenregel: $$f'(x) = 1\\cdot e^{2x} + x\\cdot 2e^{2x} = (1+2x)e^{2x}$$ <b>Zweite Ableitung</b>, wieder mit der Produktregel: $$f''(x) = 2e^{2x} + (1+2x)\\cdot 2e^{2x} = \\big(2+2+4x\\big)e^{2x} = (4+4x)e^{2x}$$ Einsetzen: $$f''(1) = 8e^{2} \\approx 8 \\cdot 7{,}389 \\approx 59{,}11$$ Der häufigste Fehler ist, beim zweiten Ableiten den Faktor \\(2\\) aus der Kettenregel zu vergessen; dann kommt nur die Hälfte heraus." },
      // L5 -- Wendepunkte
      { id:25, level:5, typ:"mc", frage:"Ein Schüler leitet \\(f(x)=e^{2x}\\cdot e^{3x}\\) mit der Produktregel ab und schreibt \\(f'(x)=2e^{2x}\\cdot 3e^{3x}=6e^{5x}\\). Beurteile diese Rechnung.", optionen:["Falsch: die Produktregel wurde als Produkt der Ableitungen benutzt; richtig ist \\(5e^{5x}\\).","Richtig: die Produktregel wurde sauber angewendet und danach korrekt zusammengefasst.","Falsch: die Exponenten werden multipliziert statt addiert; richtig ist \\(6e^{6x}\\).","Falsch: es fehlt ein Summand; richtig ist \\(2e^{2x}+3e^{3x}\\) ohne Zusammenfassen."], korrekt:0, tipp:"Prüfe zuerst, ob die Produktregel überhaupt so lautet — und ob der Term nicht viel einfacher zu schreiben ist.", loesungsweg:"Die Produktregel lautet \\((uv)'=u'v+uv'\\), <b>nicht</b> \\(u'\\cdot v'\\). Hier ist der Umweg aber gar nicht nötig: mit dem Potenzgesetz gilt $$f(x) = e^{2x}\\cdot e^{3x} = e^{5x}$$ und damit nach der Kettenregel $$f'(x) = 5e^{5x}$$ Auch die korrekt angewendete Produktregel führt darauf: \\(2e^{2x}e^{3x}+e^{2x}\\cdot 3e^{3x} = (2+3)e^{5x} = 5e^{5x}\\). Der Faktor \\(6\\) entsteht nur aus der falschen Regel." },
      { id:26, level:5, typ:"numerisch", frage:"Für \\(f(x)=(ax+b)e^x\\) gilt \\(f(1)=0\\) und \\(f'(1)=2e\\). Bestimme \\(a\\).", loesung:2, toleranz:0, tipp:"Die erste Bedingung verknüpft \\(a\\) und \\(b\\); setze diese Beziehung in die abgeleitete zweite ein.", loesungsweg:"Aus \\(f(1)=(a+b)e=0\\) und \\(e\\neq 0\\) folgt \\(b=-a\\). Die Ableitung nach der Produktregel ist $$f'(x) = a\\,e^x + (ax+b)e^x = (ax+a+b)e^x$$ An der Stelle \\(x=1\\) mit \\(b=-a\\): $$f'(1) = (a+a+b)e = (2a-a)e = a\\,e$$ Die Bedingung \\(f'(1)=2e\\) liefert \\(a=2\\), damit \\(b=-2\\). Kontrolle mit \\(f(x)=(2x-2)e^x\\): \\(f(1)=0\\) und \\(f'(x)=2xe^x\\), also \\(f'(1)=2e\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Die Tangente an den Graphen von \\(f(x)=x\\,e^{-x}\\) an der Stelle \\(x=2\\) schneidet die \\(y\\)-Achse. Bestimme den \\(y\\)-Wert dieses Schnittpunkts auf drei Nachkommastellen.", loesung:0.541, toleranz:0.01, tipp:"Erst Funktionswert und Ableitungswert an der Stelle bestimmen, dann die Tangentengleichung aufstellen und auswerten.", loesungsweg:"<b>Schritt 1.</b> Produktregel: \\(f'(x) = e^{-x} - x e^{-x} = (1-x)e^{-x}\\). An der Stelle \\(x=2\\): $$f(2) = 2e^{-2} \\approx 0{,}2707, \\qquad f'(2) = -1\\cdot e^{-2} \\approx -0{,}1353$$ <b>Schritt 2.</b> Tangente in der Punkt-Steigungs-Form: $$y = f(2) + f'(2)\\,(x-2)$$ <b>Schritt 3.</b> Auswerten an der \\(y\\)-Achse: $$y = 2e^{-2} + (-e^{-2})(0-2) = 2e^{-2}+2e^{-2} = 4e^{-2} \\approx 0{,}541$$ Der Schnittpunkt ist \\((0;0{,}541)\\)." },
      { id:28, level:5, typ:"numerisch", frage:"An welcher Stelle hat die Tangente an den Graphen von \\(f(x)=e^{2x}\\) die Steigung \\(6\\)? Runde auf drei Nachkommastellen.", loesung:0.549, toleranz:0.006, tipp:"Setze den Ableitungsterm gleich der geforderten Steigung und löse die Exponentialgleichung.", loesungsweg:"Die Tangentensteigung an einer Stelle \\(x\\) ist der Ableitungswert: $$f'(x) = 2e^{2x}$$ Die Forderung lautet also $$2e^{2x} = 6 \\;\\Rightarrow\\; e^{2x} = 3$$ Erst nachdem der Vorfaktor beseitigt ist, darf logarithmiert werden: $$2x = \\ln 3 \\;\\Rightarrow\\; x = \\frac{\\ln 3}{2} \\approx \\frac{1{,}0986}{2} \\approx 0{,}549$$ Kontrolle: \\(2e^{2\\cdot 0{,}549} = 2e^{1{,}098} \\approx 6{,}00\\). Wer sofort logarithmiert, erhält \\(\\ln 2 + 2x = \\ln 6\\) — dasselbe Ergebnis, nur umständlicher." },
      { id:29, level:5, typ:"mc", frage:"Jemand gibt die Tangente an den Graphen von \\(f(x)=e^{3x}\\) an der Stelle \\(x=1\\) mit \\(y=e^{3}+e^{3}(x-1)\\) an. Beurteile diese Tangentengleichung.", optionen:["Falsch: die Steigung ist \\(f'(1)=3e^{3}\\), richtig ist \\(y=e^{3}+3e^{3}(x-1)\\).","Richtig: Berührpunkt und Steigung sind hier beide gleich \\(e^{3}\\).","Falsch: der Berührpunkt liegt bei \\(3e^{3}\\), richtig ist \\(y=3e^{3}+e^{3}(x-1)\\).","Falsch: bei der \\(e\\)-Funktion lautet jede Tangente \\(y=e^{3}\\cdot x\\) ohne Klammerterm."], korrekt:0, tipp:"Prüfe getrennt, ob der Berührpunkt und ob die Steigung richtig eingesetzt wurden.", loesungsweg:"Der Berührpunkt ist korrekt: \\(f(1)=e^{3}\\). Die Steigung stimmt jedoch nicht, denn die Kettenregel liefert den inneren Faktor \\(3\\): $$f'(x) = 3e^{3x} \\;\\Rightarrow\\; f'(1) = 3e^{3}$$ Die richtige Tangente lautet also $$y = e^{3} + 3e^{3}(x-1)$$ Der Fehler entsteht, wenn man \\(e^{3x}\\) wie \\(e^{x}\\) behandelt und den Exponenten nur mitschleppt. Zahlenprobe an der Stelle \\(x=1{,}1\\): die Funktion liefert \\(e^{3{,}3}\\approx 27{,}11\\), die richtige Tangente \\(20{,}09+6{,}03\\approx 26{,}12\\), die falsche nur \\(20{,}09+2{,}01\\approx 22{,}10\\)." },
      { id:30, level:5, typ:"numerisch", frage:"Ein Zerfall wird durch \\(f(x)=a\\cdot e^{-0{,}5x}\\) beschrieben. An der Stelle \\(x=4\\) beträgt die momentane Abnahmerate genau \\(3\\). Wie groß ist dort der Funktionswert?", loesung:6, toleranz:0.05, tipp:"Stelle Ableitungsterm und Funktionsterm nebeneinander — sie unterscheiden sich nur um einen konstanten Faktor.", loesungsweg:"Ableiten mit der Kettenregel: $$f'(x) = -0{,}5\\,a\\,e^{-0{,}5x} = -0{,}5\\cdot f(x)$$ Die Ableitung ist also stets das \\(-0{,}5\\)-fache des Funktionswertes. Die Abnahmerate \\(3\\) bedeutet \\(f'(4) = -3\\), damit $$-0{,}5\\cdot f(4) = -3 \\;\\Rightarrow\\; f(4) = 6$$ Der Parameter \\(a\\) wird dafür gar nicht gebraucht; wer ihn dennoch bestimmen will, erhält aus \\(0{,}5\\,a\\,e^{-2}=3\\) den Wert \\(a=6e^{2}\\approx 44{,}3\\) und damit ebenfalls \\(f(4)=6e^{2}\\cdot e^{-2}=6\\)." },
      // L6 -- Transfer
      { id:31, level:6, typ:"mc", frage:"Die tägliche Besucherzahl einer Ausstellung wird durch \\(B(t)=120\\,t\\,e^{-0{,}2t}\\) beschrieben (\\(t\\) in Tagen seit der Eröffnung). Beurteile die Behauptung: „Am siebten Tag nimmt die Besucherzahl noch zu.“", optionen:["Falsch: \\(B'(7)\\approx -11{,}8\\) Besucher pro Tag, die Zahl geht dort bereits zurück.","Richtig: \\(B'(7)\\approx 11{,}8\\) Besucher pro Tag, die Zahl steigt zu diesem Zeitpunkt noch.","Richtig: wegen \\(B(7)\\approx 207\\) ist die Besucherzahl positiv und nimmt deshalb zu.","Falsch: die Besucherzahl ist konstant, weil Zuwachs und Rückgang sich stets ausgleichen."], korrekt:0, tipp:"Über Zu- oder Abnahme entscheidet nicht die Besucherzahl selbst, sondern das Vorzeichen ihrer Ableitung an dieser Stelle.", loesungsweg:"Produktregel mit \\(u=120t\\) und \\(v=e^{-0{,}2t}\\), \\(v'=-0{,}2e^{-0{,}2t}\\): $$B'(t) = 120e^{-0{,}2t} - 24t\\,e^{-0{,}2t} = 120e^{-0{,}2t}\\left(1-0{,}2t\\right)$$ Der Faktor \\(120e^{-0{,}2t}\\) ist stets positiv, das Vorzeichen hängt allein an \\(1-0{,}2t\\). Für \\(t=7\\) ist \\(1-1{,}4 = -0{,}4\\), also $$B'(7) = 120e^{-1{,}4}\\cdot(-0{,}4) \\approx 29{,}59\\cdot(-0{,}4) \\approx -11{,}8$$ Die Besucherzahl geht also bereits zurück — die Behauptung ist falsch. Der Umschwung liegt bei \\(t=5\\); dass \\(B(7)\\approx 207\\) noch groß ist, sagt über die Richtung der Änderung nichts aus." },
      { id:32, level:6, typ:"numerisch", frage:"Ein Wirkstoff wird nach \\(M(t)=a\\cdot e^{-0{,}3t}\\) abgebaut (\\(M\\) in mg, \\(t\\) in Stunden). Zwei Stunden nach der Einnahme beträgt die momentane Abbaurate genau \\(9\\) mg pro Stunde. Bestimme \\(a\\) auf eine Nachkommastelle.", loesung:54.7, toleranz:0.4, tipp:"Die Abbaurate ist der Betrag der Ableitung; stelle die entstehende Gleichung nach dem unbekannten Faktor um.", loesungsweg:"Ableiten mit der Kettenregel; der Faktor \\(a\\) bleibt stehen: $$M'(t) = -0{,}3\\,a\\,e^{-0{,}3t}$$ Die Abbaurate ist der Betrag davon, also lautet die Bedingung $$0{,}3\\,a\\,e^{-0{,}6} = 9$$ Umstellen nach \\(a\\): $$a = \\frac{9}{0{,}3\\,e^{-0{,}6}} = 30\\,e^{0{,}6} \\approx 30 \\cdot 1{,}8221 \\approx 54{,}7$$ Kontrolle: \\(M'(2) = -0{,}3\\cdot 54{,}7\\cdot e^{-0{,}6} \\approx -9{,}0\\). Wer den Exponenten vergisst und \\(0{,}3a=9\\) rechnet, erhält fälschlich \\(a=30\\)." },
      { id:33, level:6, typ:"numerisch", frage:"Vom Ursprung aus wird eine Tangente an den Graphen von \\(f(x)=e^{x}\\) gelegt. An welcher Stelle berührt sie den Graphen?", loesung:1, toleranz:0, tipp:"Stelle die Tangente an einer noch unbekannten Berührstelle auf und fordere, dass sie durch den Ursprung geht.", loesungsweg:"Die Tangente an der noch unbekannten Stelle \\(x_0\\) lautet $$y = e^{x_0} + e^{x_0}\\left(x-x_0\\right)$$ denn \\(f(x_0)=f'(x_0)=e^{x_0}\\). Die Forderung, dass sie durch den Ursprung \\((0;0)\\) geht, liefert $$0 = e^{x_0} + e^{x_0}\\left(0-x_0\\right) = e^{x_0}\\left(1-x_0\\right)$$ Da \\(e^{x_0}\\) nie null wird, bleibt \\(x_0 = 1\\). Die Tangente ist also \\(y = e\\,x\\) mit Berührpunkt \\((1;e)\\). Kontrolle: \\(e\\cdot 1 = e = f(1)\\), und die Steigung \\(e\\) stimmt mit \\(f'(1)\\) überein." },
      { id:34, level:6, typ:"mc", frage:"Eine Wirkstoffkonzentration wird durch \\(K(t)=12\\,e^{-0{,}3t}+3\\) beschrieben (in mg/l, \\(t\\) in Stunden). Beurteile: „Die Abbaurate wird immer kleiner, und der Wirkstoff verschwindet trotzdem nie vollständig.“", optionen:["Beides trifft zu: \\(|K'(t)|=3{,}6e^{-0{,}3t}\\) geht gegen null, und \\(K(t)\\) bleibt stets über \\(3\\).","Beides trifft nicht zu: die Abbaurate ist konstant, und die Konzentration erreicht irgendwann null.","Nur der erste Teil trifft zu: die Abbaurate sinkt, die Konzentration erreicht aber den Wert null.","Nur der zweite Teil trifft zu: die Konzentration bleibt positiv, die Abbaurate wächst dabei an."], korrekt:0, tipp:"Prüfe die beiden Teilbehauptungen getrennt — eine betrifft die Ableitung, die andere den Funktionsterm mit seinem konstanten Summanden.", loesungsweg:"<b>Erster Teil.</b> Die Kettenregel liefert $$K'(t) = -3{,}6\\,e^{-0{,}3t}$$ Der Betrag \\(3{,}6e^{-0{,}3t}\\) wird mit wachsendem \\(t\\) immer kleiner und nähert sich null, etwa \\(K'(2)\\approx -1{,}98\\), \\(K'(10)\\approx -0{,}18\\). Die Abbaurate sinkt also tatsächlich. <b>Zweiter Teil.</b> Der Summand \\(12e^{-0{,}3t}\\) ist für jedes \\(t\\) positiv, also gilt stets $$K(t) = 12e^{-0{,}3t}+3 > 3$$ Die Konzentration nähert sich der waagerechten Asymptote \\(y=3\\) von oben und wird niemals null. Beide Teilbehauptungen treffen also zu. Bemerkenswert ist der Zusammenhang: \\(K'(t) = -0{,}3\\cdot\\left(K(t)-3\\right)\\) — die Rate ist proportional zum Anteil oberhalb der Asymptote." },
      { id:35, level:6, typ:"numerisch", frage:"Ein Tank füllt sich nach \\(V(t)=500\\left(1-e^{-0{,}2t}\\right)\\) (in Litern, \\(t\\) in Minuten). Zu welchem Zeitpunkt beträgt die Zuflussrate genau \\(40\\) Liter pro Minute? Runde auf zwei Nachkommastellen.", loesung:4.58, toleranz:0.06, tipp:"Die Zuflussrate ist die Ableitung des Volumens; setze sie gleich dem geforderten Wert.", loesungsweg:"Ableiten: die Konstante \\(500\\) fällt weg, und \\(-e^{-0{,}2t}\\) liefert wegen der inneren Ableitung \\(-0{,}2\\) ein positives Ergebnis: $$V'(t) = 500 \\cdot 0{,}2\\,e^{-0{,}2t} = 100\\,e^{-0{,}2t}$$ Gleichsetzen mit \\(40\\): $$100\\,e^{-0{,}2t} = 40 \\;\\Rightarrow\\; e^{-0{,}2t} = 0{,}4 \\;\\Rightarrow\\; t = \\frac{\\ln 2{,}5}{0{,}2} \\approx 4{,}58$$ Nach rund \\(4{,}6\\) Minuten fließen also noch \\(40\\) Liter pro Minute zu. Die Rate fällt monoton von anfangs \\(100\\) auf null, der Tank nähert sich \\(500\\) Litern." },
      { id:36, level:6, typ:"numerisch", frage:"Zwei Lagerbestände zerfallen nach \\(A(t)=800\\,e^{-0{,}05t}\\) und \\(B(t)=500\\,e^{-0{,}02t}\\) (in Gramm, \\(t\\) in Jahren). Zu welchem Zeitpunkt sind die Beträge ihrer momentanen Abnahmeraten gleich groß? Runde auf eine Nachkommastelle.", loesung:46.2, toleranz:0.5, tipp:"Leite beide Modelle ab, setze die Beträge gleich und fasse die \\(e\\)-Potenzen zu einer einzigen zusammen.", loesungsweg:"Beide Modelle ableiten: $$A'(t) = -40\\,e^{-0{,}05t}, \\qquad B'(t) = -10\\,e^{-0{,}02t}$$ Gleichsetzen der Beträge: $$40\\,e^{-0{,}05t} = 10\\,e^{-0{,}02t} \\;\\Rightarrow\\; \\frac{e^{-0{,}05t}}{e^{-0{,}02t}} = \\frac{10}{40}$$ Mit \\(\\frac{e^{a}}{e^{b}}=e^{a-b}\\) wird daraus \\(e^{-0{,}03t}=0{,}25\\), also $$t = \\frac{\\ln 4}{0{,}03} \\approx \\frac{1{,}3863}{0{,}03} \\approx 46{,}2 \\text{ Jahre}$$ Kontrolle: \\(A'(46{,}2)\\approx -3{,}97\\) und \\(B'(46{,}2)\\approx -3{,}97\\). Bestand \\(A\\) ist anfangs viermal so schnell im Abbau; weil sein Exponent aber stärker negativ ist, holt \\(B\\) auf — nach rund \\(46\\) Jahren sind beide Raten gleich, danach baut \\(B\\) schneller ab." }];
    </script>
