    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-quadratwurzeln';
    const THEMA_CONFIG = { name: 'Quadratwurzeln', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht: Grundbegriffe ==========
      { id: 1, level: 1, typ: "mc", frage: "Was ist \\(\\sqrt{9}\\)?", optionen: ["\\(3\\)", "\\(4{,}5\\)", "\\(81\\)", "\\(-3\\)"], korrekt: 0, tipp: "Welche Zahl mal sich selbst ergibt 9?", loesungsweg: "\\(3 \\cdot 3 = 9\\), also \\(\\sqrt{9} = 3\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "Berechne \\(\\sqrt{25}\\).", loesung: 5, toleranz: 0, tipp: "\\(5 \\cdot 5 = 25\\).", loesungsweg: "Gesucht ist die nichtnegative Zahl, die mit sich selbst multipliziert \\(25\\) ergibt: $$5 \\cdot 5 = 25 \\;\\Rightarrow\\; \\sqrt{25} = 5$$ Obwohl auch \\((-5)^2 = 25\\) gilt, ist die Wurzel per Definition nie negativ." },
      { id: 3, level: 1, typ: "numerisch", frage: "Berechne \\(\\sqrt{64}\\).", loesung: 8, toleranz: 0, tipp: "\\(8 \\cdot 8 = 64\\).", loesungsweg: "$$8 \\cdot 8 = 64 \\;\\Rightarrow\\; \\sqrt{64} = 8$$" },
      { id: 4, level: 1, typ: "mc", frage: "Wie heißt die Zahl unter dem Wurzelzeichen?", optionen: ["Exponent", "Radikand", "Koeffizient", "Basis"], korrekt: 1, tipp: "Lateinisch radix = Wurzel.", loesungsweg: "Die Zahl unter der Wurzel heißt <b>Radikand</b>." },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne \\(\\sqrt{100}\\).", loesung: 10, toleranz: 0, tipp: "Welche Zahl ergibt mit sich selbst multipliziert 100?", loesungsweg: "$$10 \\cdot 10 = 100 \\;\\Rightarrow\\; \\sqrt{100} = 10$$ Bei Zehnerpotenzen halbiert sich die Zahl der Nullen: \\(\\sqrt{10\\,000} = 100\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Welche Zahl ist eine Quadratzahl?", optionen: ["\\(12\\)", "\\(18\\)", "\\(49\\)", "\\(50\\)"], korrekt: 2, tipp: "\\(49 = 7 \\cdot 7\\).", loesungsweg: "Eine Quadratzahl entsteht durch Multiplikation einer natürlichen Zahl mit sich selbst. Von den angebotenen Zahlen trifft das nur auf \\(49\\) zu: $$49 = 7 \\cdot 7 = 7^2$$ Die Nachbarn \\(50\\) und \\(48\\) liegen zwischen \\(7^2 = 49\\) und \\(8^2 = 64\\), sind also keine." },
      // ========== LEVEL 2 -- leicht: Wurzeln ziehen ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne \\(\\sqrt{144}\\).", loesung: 12, toleranz: 0, tipp: "Die Quadratzahlen bis 15 sollte man kennen.", loesungsweg: "$$12 \\cdot 12 = 144 \\;\\Rightarrow\\; \\sqrt{144} = 12$$ Die Quadratzahlen bis \\(144\\) sollte man auswendig kennen — sie sind die Grundlage fast aller Wurzelaufgaben." },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne \\(\\sqrt{0{,}25}\\).", loesung: 0.5, toleranz: 0.001, tipp: "\\(0{,}5 \\cdot 0{,}5 = 0{,}25\\).", loesungsweg: "$$0{,}5 \\cdot 0{,}5 = 0{,}25 \\;\\Rightarrow\\; \\sqrt{0{,}25} = 0{,}5$$ Bemerkenswert: Die Wurzel ist hier <b>größer</b> als die Zahl selbst. Das gilt für alle Zahlen zwischen \\(0\\) und \\(1\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne \\(\\sqrt{\\frac{4}{9}}\\) als Dezimalzahl (gerundet auf 4 Stellen).", loesung: 0.6667, toleranz: 0.001, tipp: "\\(\\sqrt{\\frac{4}{9}} = \\frac{2}{3}\\).", loesungsweg: "$$\\sqrt{\\frac{4}{9}} = \\frac{\\sqrt{4}}{\\sqrt{9}} = \\frac{2}{3} \\approx 0{,}6667$$" },
      { id: 10, level: 2, typ: "mc", frage: "Welcher Wert ist \\(\\sqrt{169}\\)?", optionen: ["\\(11\\)", "\\(12\\)", "\\(13\\)", "\\(14\\)"], korrekt: 2, tipp: "\\(13 \\cdot 13 = 169\\).", loesungsweg: "\\(13^2 = 169\\), also \\(\\sqrt{169} = 13\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Berechne \\(\\sqrt{81} + \\sqrt{16}\\).", loesung: 13, toleranz: 0, tipp: "\\(\\sqrt{81} = 9\\), \\(\\sqrt{16} = 4\\).", loesungsweg: "Jede Wurzel einzeln ziehen, dann addieren: $$\\sqrt{81} + \\sqrt{16} = 9 + 4 = 13$$ Zusammenfassen zu \\(\\sqrt{81+16} = \\sqrt{97} \\approx 9{,}85\\) wäre falsch — für Summen gibt es kein Wurzelgesetz." },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(\\sqrt{400}\\).", loesung: 20, toleranz: 0, tipp: "Zerlege den Radikanden in 4 und 100.", loesungsweg: "Zerlegen hilft: \\(400 = 4 \\cdot 100\\), also $$\\sqrt{400} = \\sqrt4 \\cdot \\sqrt{100} = 2 \\cdot 10 = 20$$" },
      // ========== LEVEL 3 -- Wurzelgesetze ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Berechne \\(\\sqrt{2} \\cdot \\sqrt{8}\\).", loesung: 4, toleranz: 0, tipp: "\\(\\sqrt{a}\\cdot\\sqrt{b}=\\sqrt{ab}\\).", loesungsweg: "$$\\sqrt{2}\\cdot\\sqrt{8} = \\sqrt{16} = 4$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Berechne \\(\\frac{\\sqrt{50}}{\\sqrt{2}}\\).", loesung: 5, toleranz: 0, tipp: "\\(\\frac{\\sqrt{a}}{\\sqrt{b}} = \\sqrt{\\frac{a}{b}}\\).", loesungsweg: "$$\\sqrt{\\frac{50}{2}} = \\sqrt{25} = 5$$" },
      { id: 15, level: 3, typ: "mc", frage: "Welche Vereinfachung von \\(\\sqrt{18}\\) ist richtig?", optionen: ["\\(2\\sqrt{3}\\)", "\\(3\\sqrt{2}\\)", "\\(9\\sqrt{2}\\)", "\\(\\sqrt{9} \\cdot 2\\)"], korrekt: 1, tipp: "\\(18 = 9 \\cdot 2\\).", loesungsweg: "$$\\sqrt{18} = \\sqrt{9 \\cdot 2} = 3\\sqrt{2}$$" },
      { id: 16, level: 3, typ: "mc", frage: "Vereinfache \\(\\sqrt{72}\\).", optionen: ["\\(6\\sqrt{2}\\)", "\\(8\\sqrt{3}\\)", "\\(6\\sqrt{3}\\)", "\\(12\\sqrt{2}\\)"], korrekt: 0, tipp: "\\(72 = 36 \\cdot 2\\).", loesungsweg: "$$\\sqrt{72} = \\sqrt{36 \\cdot 2} = 6\\sqrt{2}$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Berechne \\(\\sqrt{3} \\cdot \\sqrt{12}\\).", loesung: 6, toleranz: 0, tipp: "\\(\\sqrt{3 \\cdot 12} = \\sqrt{36}\\).", loesungsweg: "Für Produkte gilt \\(\\sqrt a \\cdot \\sqrt b = \\sqrt{ab}\\): $$\\sqrt3 \\cdot \\sqrt{12} = \\sqrt{36} = 6$$ Einzeln gerechnet wären es \\(1{,}732 \\cdot 3{,}464\\) — das Zusammenfassen macht die Aufgabe exakt lösbar." },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\((\\sqrt{7})^2\\).", loesung: 7, toleranz: 0, tipp: "\\((\\sqrt{a})^2 = a\\) für \\(a \\geq 0\\).", loesungsweg: "Quadrieren und Wurzelziehen heben einander auf, solange der Radikand nicht negativ ist: $$\\left(\\sqrt7\\right)^2 = 7$$ Deshalb muss man \\(\\sqrt7 \\approx 2{,}6458\\) hier gar nicht ausrechnen." },
      // ========== LEVEL 4 -- Verfahren selbst wählen: teilweise radizieren, zusammenfassen, Nenner rational ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Ein quadratisches Grundstück hat den Flächeninhalt \\(200\\,\\text{m}^2\\). Seine Seitenlänge lässt sich in der Form \\(k\\sqrt{2}\\,\\text{m}\\) schreiben. Gib \\(k\\) an.", loesung: 10, toleranz: 0, tipp: "Welche Rechenoperation führt vom Flächeninhalt zur Seitenlänge? Danach teilweise radizieren.", loesungsweg: "Die Seitenlänge ist die Quadratwurzel des Flächeninhalts: $$a = \\sqrt{200} = \\sqrt{100 \\cdot 2} = 10\\sqrt2\\,\\text{m} \\approx 14{,}14\\,\\text{m}$$ Also \\(k = 10\\). Der Radikand wird in die größte enthaltene Quadratzahl und einen Rest zerlegt; nur die Quadratzahl verlässt die Wurzel." },
      { id: 20, level: 4, typ: "mc", frage: "Welche der beiden Zahlen \\(2\\sqrt{11}\\) und \\(3\\sqrt{5}\\) ist größer? Entscheide ohne Taschenrechner.", optionen: ["\\(2\\sqrt{11}\\), weil \\(11 > 5\\) ist", "\\(3\\sqrt{5}\\), weil \\(\\sqrt{45} > \\sqrt{44}\\) ist", "Beide sind gleich groß, denn \\(2 \\cdot 11 = 22\\) und \\(3 \\cdot 5 = 15\\) ergeben \\(\\sqrt{22}\\) und \\(\\sqrt{15}\\)", "Ohne Taschenrechner nicht entscheidbar"], korrekt: 1, tipp: "Bringe den Vorfaktor jeweils unter die Wurzel.", loesungsweg: "Der Vorfaktor wandert quadriert unter die Wurzel: $$2\\sqrt{11} = \\sqrt{4 \\cdot 11} = \\sqrt{44}, \\qquad 3\\sqrt5 = \\sqrt{9 \\cdot 5} = \\sqrt{45}$$ Bei zwei Wurzeln entscheidet der Radikand: \\(45 > 44\\), also ist \\(3\\sqrt5\\) größer — wenn auch nur knapp (\\(6{,}708\\) gegenüber \\(6{,}633\\)). Weder der Vorfaktor noch der Radikand allein entscheidet den Vergleich." },
      { id: 21, level: 4, typ: "numerisch", frage: "Schreibe \\(\\frac{6}{\\sqrt{3}}\\) ohne Wurzel im Nenner in der Form \\(a\\sqrt{3}\\). Gib \\(a\\) an.", loesung: 2, toleranz: 0, tipp: "Mit \\(\\sqrt3\\) erweitern.", loesungsweg: "Erweitern mit \\(\\sqrt3\\) macht den Nenner rational: $$\\frac{6}{\\sqrt3} = \\frac{6\\sqrt3}{\\sqrt3 \\cdot \\sqrt3} = \\frac{6\\sqrt3}{3} = 2\\sqrt3$$ Der Nenner wird zu \\(\\left(\\sqrt3\\right)^2 = 3\\), gegen den sich die \\(6\\) kürzen lässt. Also \\(a = 2\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Von welcher Zahl ist \\(4\\sqrt{3}\\) die Quadratwurzel?", loesung: 48, toleranz: 0, tipp: "Welche Rechenoperation macht das Wurzelziehen rückgängig?", loesungsweg: "Gesucht ist die Zahl \\(a\\) mit \\(\\sqrt a = 4\\sqrt3\\). Quadrieren hebt das Wurzelziehen auf: $$a = \\left(4\\sqrt3\\right)^2 = 4^2 \\cdot \\left(\\sqrt3\\right)^2 = 16 \\cdot 3 = 48$$ Probe: \\(\\sqrt{48} = \\sqrt{16 \\cdot 3} = 4\\sqrt3\\) ✓ Wer nur den Vorfaktor quadriert, erhält \\(16\\sqrt3\\) — das ist keine Zahl ohne Wurzel." },
      { id: 23, level: 4, typ: "mc", frage: "Zwischen welchen beiden aufeinanderfolgenden natürlichen Zahlen liegt \\(\\sqrt{70}\\)? Entscheide ohne Taschenrechner.", optionen: ["zwischen \\(6\\) und \\(7\\), denn \\(70 : 10 = 7\\)", "zwischen \\(7\\) und \\(8\\), denn \\(7^2 = 49\\) und \\(8^2 = 64\\)", "zwischen \\(8\\) und \\(9\\), denn \\(8^2 = 64\\) und \\(9^2 = 81\\)", "zwischen \\(35\\) und \\(36\\), denn \\(70 : 2 = 35\\)"], korrekt: 2, tipp: "Suche die beiden Quadratzahlen, zwischen denen der Radikand liegt.", loesungsweg: "Die Quadratzahlen in der Nähe von \\(70\\) sind \\(64 = 8^2\\) und \\(81 = 9^2\\). Weil das Wurzelziehen die Reihenfolge erhält, gilt $$64 < 70 < 81 \\;\\Rightarrow\\; 8 < \\sqrt{70} < 9$$ Da \\(70\\) näher an \\(64\\) liegt, ist \\(\\sqrt{70} \\approx 8{,}4\\) (genauer \\(8{,}37\\)). Halbieren oder Teilen des Radikanden durch \\(10\\) hat mit dem Wurzelziehen nichts zu tun." },
      { id: 24, level: 4, typ: "numerisch", frage: "Ein Quadrat hat den Umfang \\(8\\sqrt{3}\\,\\text{cm}\\). Berechne seinen Flächeninhalt in \\(\\text{cm}^2\\).", loesung: 12, toleranz: 0, tipp: "Vom Umfang zur Seitenlänge, von der Seitenlänge zur Fläche.", loesungsweg: "Aus dem Umfang folgt die Seitenlänge: $$a = \\frac{8\\sqrt3}{4} = 2\\sqrt3\\,\\text{cm}$$ Der Flächeninhalt ist das Quadrat der Seite: $$A = \\left(2\\sqrt3\\right)^2 = 4 \\cdot 3 = 12\\,\\text{cm}^2$$ Obwohl Umfang und Seitenlänge irrational sind, ist der Flächeninhalt eine natürliche Zahl — das Quadrieren beseitigt die Wurzel." },
      // ========== LEVEL 5 -- Fehler finden, zweischrittige Sachaufgaben, Parameter ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler rechnet:<br>Schritt 1: \\(\\sqrt{8} \\cdot \\sqrt{2} = \\sqrt{16}\\)<br>Schritt 2: \\(\\sqrt{16} = \\pm 4\\)<br>Schritt 3: Also ist \\(\\sqrt{8} \\cdot \\sqrt{2} = \\pm 4\\).<br>Welcher Schritt ist der erste fehlerhafte?", optionen: ["Schritt 2 — eine Quadratwurzel ist nie negativ, \\(\\sqrt{16} = 4\\)", "Schritt 1 — zwei Wurzeln darf man nicht zu einer zusammenfassen", "Schritt 3 — es müsste \\(\\sqrt{8} \\cdot \\sqrt{2} = 16\\) heißen", "Kein Schritt ist fehlerhaft"], korrekt: 0, tipp: "Welche Werte kann \\(\\sqrt{16}\\) per Definition annehmen?", loesungsweg: "Schritt 1 ist richtig: Für Produkte gilt \\(\\sqrt a \\cdot \\sqrt b = \\sqrt{ab}\\), also \\(\\sqrt8 \\cdot \\sqrt2 = \\sqrt{16}\\). In Schritt 2 steckt der Fehler: Die Quadratwurzel ist als die <b>nichtnegative</b> Zahl definiert, deren Quadrat den Radikanden ergibt. $$\\sqrt{16} = 4, \\quad \\text{nicht } \\pm 4$$ Das Zeichen \\(\\pm\\) gehört zum Lösen der Gleichung \\(x^2 = 16\\), nicht zum Wurzelziehen. Schritt 3 übernimmt nur den Fehler." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein quadratisches Beet hat den Flächeninhalt \\(72\\,\\text{m}^2\\). Es soll rundherum eingezäunt werden. Wie viele Meter Zaun sind nötig? Runde auf zwei Dezimalstellen.", loesung: 33.94, toleranz: 0.05, tipp: "Erst die Seitenlänge, dann den Umfang bestimmen.", loesungsweg: "Aus dem Flächeninhalt folgt die Seitenlänge: $$a = \\sqrt{72} = \\sqrt{36 \\cdot 2} = 6\\sqrt2 \\approx 8{,}485\\,\\text{m}$$ Der Zaun entspricht dem Umfang des Quadrats: $$U = 4a = 24\\sqrt2 \\approx 33{,}94\\,\\text{m}$$ Wer mit dem gerundeten Wert \\(8{,}49\\) weiterrechnet, erhält \\(33{,}96\\) — deshalb möglichst erst am Ende runden." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für welche positive Zahl \\(a\\) gilt \\(\\sqrt{a} \\cdot \\sqrt{18} = 12\\)?", loesung: 8, toleranz: 0, tipp: "Beide Seiten quadrieren.", loesungsweg: "Das Produkt zweier Wurzeln ist die Wurzel des Produkts: $$\\sqrt{a} \\cdot \\sqrt{18} = \\sqrt{18a} = 12$$ Quadrieren beider Seiten: $$18a = 144 \\;\\Rightarrow\\; a = 8$$ Probe: \\(\\sqrt8 \\cdot \\sqrt{18} = \\sqrt{144} = 12\\) ✓" },
      { id: 28, level: 5, typ: "mc", frage: "Eine Schülerin schreibt: \\(\\sqrt{50} = \\sqrt{25} \\cdot \\sqrt{2} = 25\\sqrt{2}\\). Was ist dazu zu sagen?", optionen: ["Die Zerlegung ist richtig, aber \\(\\sqrt{25} = 5\\), also \\(\\sqrt{50} = 5\\sqrt{2}\\)", "Die Zerlegung ist falsch, \\(\\sqrt{50}\\) lässt sich nicht vereinfachen", "Richtig wäre \\(\\sqrt{50} = \\sqrt{25} + \\sqrt{2}\\)", "Die Rechnung ist vollständig richtig"], korrekt: 0, tipp: "Prüfe jeden Schritt einzeln — welcher Wert hat \\(\\sqrt{25}\\)?", loesungsweg: "Der erste Schritt stimmt: \\(50 = 25 \\cdot 2\\), und Produkte unter der Wurzel darf man trennen. Der Fehler liegt im zweiten Schritt — die Wurzel aus \\(25\\) wurde vergessen: $$\\sqrt{50} = \\sqrt{25} \\cdot \\sqrt2 = 5\\sqrt2 \\approx 7{,}07$$ Der Wert \\(25\\sqrt2 \\approx 35{,}4\\) ist offensichtlich viel zu groß, denn \\(\\sqrt{50}\\) liegt zwischen \\(\\sqrt{49} = 7\\) und \\(\\sqrt{64} = 8\\). Eine solche Größenabschätzung entlarvt den Fehler sofort." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Rechteck hat die Seitenlängen \\(\\sqrt{12}\\,\\text{cm}\\) und \\(\\sqrt{27}\\,\\text{cm}\\). Berechne seinen Umfang in cm. Runde auf zwei Dezimalstellen.", loesung: 17.32, toleranz: 0.05, tipp: "Beide Wurzeln lassen sich als Vielfache derselben Wurzel schreiben.", loesungsweg: "Teilweise radizieren macht die beiden Seiten vergleichbar: $$\\sqrt{12} = \\sqrt{4 \\cdot 3} = 2\\sqrt3, \\qquad \\sqrt{27} = \\sqrt{9 \\cdot 3} = 3\\sqrt3$$ Der Umfang ist die doppelte Summe der Seiten: $$U = 2 \\cdot (2\\sqrt3 + 3\\sqrt3) = 10\\sqrt3 \\approx 17{,}32\\,\\text{cm}$$ Der Flächeninhalt wäre übrigens \\(\\sqrt{12} \\cdot \\sqrt{27} = \\sqrt{324} = 18\\,\\text{cm}^2\\) — ganzzahlig, obwohl beide Seiten irrational sind." },
      { id: 30, level: 5, typ: "numerisch", frage: "Für welche Zahl \\(x\\) gilt \\((\\sqrt{x} + 3)(\\sqrt{x} - 3) = 11\\)?", loesung: 20, toleranz: 0, tipp: "Die linke Seite ist ein Produkt der Form \\((a+b)(a-b)\\).", loesungsweg: "Die linke Seite hat die Form der dritten binomischen Formel \\((a+b)(a-b) = a^2 - b^2\\): $$(\\sqrt x + 3)(\\sqrt x - 3) = \\left(\\sqrt x\\right)^2 - 3^2 = x - 9$$ Damit wird die Gleichung linear: $$x - 9 = 11 \\;\\Rightarrow\\; x = 20$$ Probe: \\((\\sqrt{20}+3)(\\sqrt{20}-3) = 20 - 9 = 11\\) ✓" },
      // ========== LEVEL 6 -- Behauptungen prüfen, Sonderfälle, Umkehraufgaben ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Für alle \\(a, b \\geq 0\\) gilt \\(\\sqrt{a + b} = \\sqrt{a} + \\sqrt{b}\\).\" Stimmt das?", optionen: ["Nein — Gegenbeispiel \\(a = 9\\), \\(b = 16\\): \\(\\sqrt{25} = 5\\), aber \\(3 + 4 = 7\\); Gleichheit gilt nur, wenn \\(a\\) oder \\(b\\) null ist", "Ja — Wurzelziehen ist eine Rechenart, die sich auf jeden Summanden anwenden lässt", "Ja, aber nur wenn \\(a\\) und \\(b\\) Quadratzahlen sind", "Nein — richtig wäre \\(\\sqrt{a+b} = \\sqrt{a} \\cdot \\sqrt{b}\\)"], korrekt: 0, tipp: "Ein einziges Gegenbeispiel widerlegt eine Für-alle-Behauptung.", loesungsweg: "Ein Gegenbeispiel genügt: $$\\sqrt{9+16} = \\sqrt{25} = 5, \\qquad \\sqrt9 + \\sqrt{16} = 3 + 4 = 7$$ Die Behauptung ist also falsch — auch für Quadratzahlen. Allgemein gilt \\(\\left(\\sqrt a + \\sqrt b\\right)^2 = a + 2\\sqrt{ab} + b\\), und das ist nur dann gleich \\(a + b\\), wenn \\(\\sqrt{ab} = 0\\), also \\(a = 0\\) oder \\(b = 0\\). Die Wurzelgesetze gelten für Produkte und Quotienten, nicht für Summen." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für welche reellen Zahlen \\(x\\) gilt \\(\\sqrt{x^2} = -x\\)? Gib die größte Zahl an, für die die Gleichung erfüllt ist.", loesung: 0, toleranz: 0, tipp: "Setze einmal eine positive und einmal eine negative Zahl ein.", loesungsweg: "Wegen \\(\\sqrt{x^2} = |x|\\) lautet die Gleichung \\(|x| = -x\\). Fallunterscheidung: Für \\(x > 0\\) steht links eine positive, rechts eine negative Zahl — keine Lösung. Für \\(x \\le 0\\) ist \\(|x| = -x\\) gerade die Definition des Betrags, also erfüllt. $$\\text{Lösungsmenge: } x \\le 0$$ Die größte dieser Zahlen ist \\(0\\). Probe mit \\(x = -3\\): \\(\\sqrt{9} = 3 = -(-3)\\) ✓" },
      { id: 33, level: 6, typ: "numerisch", frage: "Die Zahlen \\(\\sqrt{20}\\), \\(\\sqrt{45}\\) und \\(\\sqrt{k}\\) lassen sich alle als Vielfache von \\(\\sqrt{5}\\) mit natürlichem Vorfaktor schreiben. Bestimme \\(k\\), wenn \\(k\\) zwischen \\(100\\) und \\(150\\) liegt.", loesung: 125, toleranz: 0, tipp: "Welche Form muss \\(k\\) haben, damit sich \\(\\sqrt{5}\\) herausziehen lässt?", loesungsweg: "\\(\\sqrt{20} = 2\\sqrt5\\) und \\(\\sqrt{45} = 3\\sqrt5\\), weil \\(20 = 2^2 \\cdot 5\\) und \\(45 = 3^2 \\cdot 5\\). Allgemein gilt $$\\sqrt{k} = m\\sqrt5 \\iff k = m^2 \\cdot 5$$ Gesucht ist also ein Vielfaches von \\(5\\) mit quadratischem Vorfaktor zwischen \\(100\\) und \\(150\\): \\(m^2\\) muss zwischen \\(20\\) und \\(30\\) liegen, das erfüllt nur \\(m = 5\\). $$k = 25 \\cdot 5 = 125, \\qquad \\sqrt{125} = 5\\sqrt5$$" },
      { id: 34, level: 6, typ: "mc", frage: "Ein Schüler argumentiert: „\\(\\sqrt{2}\\) und \\(\\sqrt{8}\\) sind irrational, deshalb ist auch ihr Produkt \\(\\sqrt{2} \\cdot \\sqrt{8}\\) irrational.\" Ist die Schlussfolgerung richtig?", optionen: ["Ja — Produkte irrationaler Zahlen sind immer irrational", "Nein — \\(\\sqrt{8}\\) ist rational, weil \\(8\\) eine gerade Zahl ist", "Nein — das Produkt ist \\(\\sqrt{16} = 4\\), also rational", "Ja — das Produkt ist \\(\\sqrt{10}\\), und \\(10\\) ist keine Quadratzahl"], korrekt: 2, tipp: "Berechne das Produkt zuerst.", loesungsweg: "Beide Faktoren sind tatsächlich irrational, aber die Schlussfolgerung ist falsch: $$\\sqrt2 \\cdot \\sqrt8 = \\sqrt{16} = 4$$ Das Produkt ist eine natürliche Zahl. Anders als bei rationalen Zahlen ist die Menge der irrationalen Zahlen bezüglich der Multiplikation nicht abgeschlossen — auch \\(\\sqrt2 \\cdot \\sqrt2 = 2\\) zeigt das. Ob ein Produkt von Wurzeln rational ist, entscheidet der Radikand des Produkts, nicht die Faktoren. \\(\\sqrt8\\) selbst ist irrational, denn \\(8\\) ist keine Quadratzahl." },
      { id: 35, level: 6, typ: "numerisch", frage: "Schreibe \\(\\frac{1}{\\sqrt{5} - 2}\\) ohne Wurzel im Nenner. Das Ergebnis hat die Form \\(a + b\\sqrt{5}\\). Gib \\(a\\) an.", loesung: 2, toleranz: 0, tipp: "Mit welchem Term muss man erweitern, damit im Nenner eine binomische Formel entsteht?", loesungsweg: "Erweitern mit \\(\\sqrt5\\) allein hilft nicht, weil der Nenner eine Differenz ist. Erweitern mit \\(\\sqrt5 + 2\\) erzeugt im Nenner die dritte binomische Formel: $$\\frac{1}{\\sqrt5 - 2} = \\frac{\\sqrt5 + 2}{(\\sqrt5 - 2)(\\sqrt5 + 2)} = \\frac{\\sqrt5 + 2}{5 - 4} = 2 + \\sqrt5$$ Also \\(a = 2\\) und \\(b = 1\\). Probe: \\(\\sqrt5 - 2 \\approx 0{,}236\\), Kehrwert \\(\\approx 4{,}236 = 2 + 2{,}236\\) ✓" },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Quadrat wird durch ein Quadrat mit doppeltem Flächeninhalt ersetzt. Ein Schüler behauptet, die Seitenlänge verdopple sich dann ebenfalls. Um wie viel Prozent wächst die Seitenlänge tatsächlich? Runde auf ganze Prozent.", loesung: 41, toleranz: 0.5, tipp: "Wähle eine konkrete Seitenlänge und vergleiche die Wurzeln.", loesungsweg: "Hat das alte Quadrat die Seite \\(a\\), so ist die neue Fläche \\(2a^2\\) und die neue Seite $$a_{\\text{neu}} = \\sqrt{2a^2} = \\sqrt2 \\cdot a \\approx 1{,}414\\,a$$ Die Seite wächst also nur um etwa \\(41\\,\\%\\), nicht um \\(100\\,\\%\\). Die Behauptung ist falsch: Bei doppelter Seitenlänge würde sich die Fläche vervierfachen, denn \\((2a)^2 = 4a^2\\). Flächen wachsen quadratisch mit der Seite, Seiten wachsen mit der Wurzel der Fläche." }];
