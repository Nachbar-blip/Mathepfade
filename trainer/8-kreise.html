<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreise - Umfang &amp; Fläche - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-kreise';
    const THEMA_CONFIG = { name: 'Kreise - Umfang & Fläche', bereich: 'geometrie' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "mc", frage: "Der Durchmesser \\(d\\) eines Kreises ist ...", optionen: ["halb so groß wie der Radius", "doppelt so groß wie der Radius", "gleich dem Radius", "Pi mal Radius"], korrekt: 1, tipp: "Radius = halber Durchmesser.", loesungsweg: "Der Durchmesser verläuft durch den Mittelpunkt von Rand zu Rand und besteht damit aus zwei Radien: $$d = 2r$$ Umgekehrt ist der Radius der halbe Durchmesser. Diese Unterscheidung entscheidet in fast jeder Kreisaufgabe über das richtige Ergebnis." },
      { id: 2, level: 1, typ: "mc", frage: "Welche Formel gibt den Umfang an?", optionen: ["\\(U = \\pi r^2\\)", "\\(U = 2\\pi r\\)", "\\(U = \\pi r\\)", "\\(U = \\pi d^2\\)"], korrekt: 1, tipp: "Umfang hängt linear von \\(r\\) ab.", loesungsweg: "$$U = 2\\pi r = \\pi d$$" },
      { id: 3, level: 1, typ: "mc", frage: "Welche Formel gibt die Kreisfläche an?", optionen: ["\\(A = 2\\pi r\\)", "\\(A = \\pi r^2\\)", "\\(A = \\pi d\\)", "\\(A = \\pi r\\)"], korrekt: 1, tipp: "Fläche ist quadratisch in \\(r\\).", loesungsweg: "$$A = \\pi r^2$$ Der Radius geht quadratisch ein — das verlangt schon die Einheit: Eine Fläche wird in Quadratzentimetern gemessen. \\(2\\pi r\\) wäre dagegen der Umfang." },
      { id: 4, level: 1, typ: "numerisch", frage: "Durchmesser \\(d = 9\\,\\text{cm}\\). Radius \\(r\\) in cm?", loesung: 4.5, toleranz: 0.01, tipp: "Der Radius ist der halbe Durchmesser.", loesungsweg: "$$r = \\frac{d}{2} = \\frac{9}{2} = 4{,}5\\,\\text{cm}$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Radius \\(r = 5\\,\\text{cm}\\). Durchmesser \\(d\\) in cm?", loesung: 10, toleranz: 0, tipp: "\\(d = 2r\\).", loesungsweg: "$$d = 2 \\cdot 5 = 10\\,\\text{cm}$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Durchmesser \\(d = 14\\,\\text{cm}\\). Radius \\(r\\) in cm?", loesung: 7, toleranz: 0, tipp: "\\(r = d/2\\).", loesungsweg: "$$r = 14/2 = 7\\,\\text{cm}$$" },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 3\\,\\text{cm}\\). Umfang in cm (auf 2 Nachkommastellen, \\(\\pi = 3{,}14\\))?", loesung: 18.84, toleranz: 0.05, tipp: "\\(U = 2\\pi r\\).", loesungsweg: "$$U = 2 \\cdot 3{,}14 \\cdot 3 = 18{,}84\\,\\text{cm}$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 4\\,\\text{cm}\\). Fläche in cm\\(^2\\) (\\(\\pi = 3{,}14\\))?", loesung: 50.24, toleranz: 0.05, tipp: "\\(A = \\pi r^2\\).", loesungsweg: "$$A = 3{,}14 \\cdot 16 = 50{,}24\\,\\text{cm}^2$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Durchmesser \\(d = 10\\,\\text{cm}\\). Umfang in cm (\\(\\pi = 3{,}14\\))?", loesung: 31.4, toleranz: 0.05, tipp: "\\(U = \\pi d\\).", loesungsweg: "$$U = 3{,}14 \\cdot 10 = 31{,}4\\,\\text{cm}$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 2\\,\\text{cm}\\). Fläche in cm\\(^2\\) (\\(\\pi = 3{,}14\\))?", loesung: 12.56, toleranz: 0.05, tipp: "\\(A = \\pi \\cdot 4\\).", loesungsweg: "$$A = 3{,}14 \\cdot 4 = 12{,}56\\,\\text{cm}^2$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Kreis \\(r = 10\\,\\text{cm}\\). Umfang in cm (\\(\\pi = 3{,}14\\))?", loesung: 62.8, toleranz: 0.1, tipp: "\\(U = 2\\pi r\\).", loesungsweg: "$$U = 2 \\cdot 3{,}14 \\cdot 10 = 62{,}8\\,\\text{cm}$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(d = 6\\,\\text{cm}\\). Fläche in cm\\(^2\\) (\\(\\pi = 3{,}14\\))?", loesung: 28.26, toleranz: 0.1, tipp: "\\(r = 3\\), \\(A = \\pi r^2\\).", loesungsweg: "$$A = 3{,}14 \\cdot 9 = 28{,}26\\,\\text{cm}^2$$" },
      // ========== LEVEL 3 ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Umfang \\(U = 31{,}4\\,\\text{cm}\\). Radius in cm (\\(\\pi = 3{,}14\\))?", loesung: 5, toleranz: 0.05, tipp: "\\(r = U / (2\\pi)\\).", loesungsweg: "$$r = \\frac{31{,}4}{2 \\cdot 3{,}14} = 5\\,\\text{cm}$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Fläche \\(A = 78{,}5\\,\\text{cm}^2\\). Radius in cm (\\(\\pi = 3{,}14\\))?", loesung: 5, toleranz: 0.1, tipp: "\\(r = \\sqrt{A/\\pi}\\).", loesungsweg: "$$r = \\sqrt{78{,}5 / 3{,}14} = \\sqrt{25} = 5$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Ein Rad dreht sich mit Radius \\(30\\,\\text{cm}\\). Wie weit in m bei einer Umdrehung (\\(\\pi = 3{,}14\\))?", loesung: 1.884, toleranz: 0.01, tipp: "Der zurückgelegte Weg ist der Umfang des Rades. Achte auf die Einheit: gefragt ist in Metern.", loesungsweg: "$$U = 2 \\cdot 3{,}14 \\cdot 0{,}3 = 1{,}884\\,\\text{m}$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "Kreisring: Außenradius \\(5\\,\\text{cm}\\), Innenradius \\(3\\,\\text{cm}\\). Fläche in cm\\(^2\\) (\\(\\pi = 3{,}14\\))?", loesung: 50.24, toleranz: 0.1, tipp: "\\(A = \\pi(R^2 - r^2) = \\pi \\cdot 16\\).", loesungsweg: "$$A = 3{,}14 \\cdot (25 - 9) = 50{,}24\\,\\text{cm}^2$$" },
      { id: 17, level: 3, typ: "mc", frage: "Wenn der Radius verdoppelt wird, vervielfacht sich die Fläche um den Faktor ...", optionen: ["\\(2\\)", "\\(3\\)", "\\(4\\)", "\\(8\\)"], korrekt: 2, tipp: "Fläche hängt von \\(r^2\\) ab.", loesungsweg: "Der Radius steht in der Flächenformel im Quadrat, also wirkt sich seine Verdopplung quadratisch aus: $$A_{neu} = \\pi (2r)^2 = 4\\pi r^2 = 4A$$ Die Fläche wird <b>vervierfacht</b>, der Umfang dagegen nur verdoppelt." },
      { id: 18, level: 3, typ: "numerisch", frage: "Pizza mit \\(d = 30\\,\\text{cm}\\). Fläche in cm\\(^2\\) (\\(\\pi = 3{,}14\\))?", loesung: 706.5, toleranz: 1, tipp: "\\(r = 15\\), \\(A = \\pi r^2\\).", loesungsweg: "$$A = 3{,}14 \\cdot 225 = 706{,}5\\,\\text{cm}^2$$" },
      // ========== LEVEL 4 ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Ein Kreis hat den Flächeninhalt \\(200{,}96\\,\\text{cm}^2\\). Wie groß ist sein Umfang in cm (\\(\\pi = 3{,}14\\))?", loesung: 50.24, toleranz: 0.3, tipp: "Aus der Fläche lässt sich der Radius gewinnen.", loesungsweg: "Zuerst den Radius aus der Fläche: $$r^2 = \\frac{A}{\\pi} = \\frac{200{,}96}{3{,}14} = 64 \\implies r = 8\\,\\text{cm}$$ Dann den Umfang: $$U = 2 \\cdot 3{,}14 \\cdot 8 = 50{,}24\\,\\text{cm}$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Ein runder Tisch hat \\(1{,}2\\,\\text{m}\\) Durchmesser. Eine runde Tischdecke soll rundum \\(20\\,\\text{cm}\\) überhängen. Wie viel Stoff in m\\(^2\\) braucht die Tischdecke (\\(\\pi = 3{,}14\\), 2 Nachkommastellen)?", loesung: 2.01, toleranz: 0.02, tipp: "Der Überhang vergrößert den Radius, nicht den Durchmesser.", loesungsweg: "Der Tisch hat den Radius \\(0{,}6\\,\\text{m}\\); mit dem Überhang von \\(0{,}2\\,\\text{m}\\) hat die Decke den Radius \\(0{,}8\\,\\text{m}\\): $$A = 3{,}14 \\cdot 0{,}8^2 = 3{,}14 \\cdot 0{,}64 \\approx 2{,}01\\,\\text{m}^2$$ Wer die \\(20\\,\\text{cm}\\) zum Durchmesser addiert, rechnet mit \\(r = 0{,}7\\) und bekommt zu wenig Stoff." },
      { id: 21, level: 4, typ: "mc", frage: "Ein kreisrundes Beet mit \\(4\\,\\text{m}\\) Durchmesser soll mit einer Steinkante eingefasst werden. Welche Rechnung liefert die benötigte Länge der Einfassung in m?", optionen: ["\\(3{,}14 \\cdot 4\\)", "\\(3{,}14 \\cdot 2^2\\)", "\\(2 \\cdot 3{,}14 \\cdot 4\\)", "\\(3{,}14 \\cdot 4^2\\)"], korrekt: 0, tipp: "Gesucht ist eine Länge, und gegeben ist der Durchmesser.", loesungsweg: "Die Einfassung läuft am Rand entlang, gesucht ist also der <b>Umfang</b>. Mit dem Durchmesser gilt \\(U = \\pi d\\): $$U = 3{,}14 \\cdot 4 = 12{,}56\\,\\text{m}$$ \\(2 \\cdot 3{,}14 \\cdot 4\\) setzt den Durchmesser als Radius ein und ist doppelt so groß; \\(3{,}14 \\cdot 2^2\\) ist die Fläche des Beetes." },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Kreis hat den Umfang \\(43{,}96\\,\\text{cm}\\). Wie groß ist sein Flächeninhalt in cm\\(^2\\) (\\(\\pi = 3{,}14\\))?", loesung: 153.86, toleranz: 0.5, tipp: "Der Umfang verrät den Radius.", loesungsweg: "Erst den Radius aus dem Umfang: $$r = \\frac{U}{2\\pi} = \\frac{43{,}96}{6{,}28} = 7\\,\\text{cm}$$ Dann die Fläche: $$A = 3{,}14 \\cdot 7^2 = 153{,}86\\,\\text{cm}^2$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Ein Fahrradreifen hat \\(70\\,\\text{cm}\\) Durchmesser. Wie viele <b>vollständige</b> Umdrehungen macht das Rad auf einer Strecke von \\(100\\,\\text{m}\\) (\\(\\pi = 3{,}14\\))?", loesung: 45, toleranz: 0, tipp: "Eine Umdrehung bringt das Rad genau einen Umfang weiter.", loesungsweg: "Pro Umdrehung legt das Rad seinen Umfang zurück: $$U = 3{,}14 \\cdot 0{,}7\\,\\text{m} = 2{,}198\\,\\text{m}$$ $$\\frac{100}{2{,}198} \\approx 45{,}5$$ Also \\(45\\) vollständige Umdrehungen — die angefangene 46. zählt nicht." },
      { id: 24, level: 4, typ: "numerisch", frage: "Ein runder Gartenteich hat \\(6\\,\\text{m}\\) Durchmesser. Rundherum wird ein \\(1\\,\\text{m}\\) breiter Kiesweg angelegt. Wie viel m\\(^2\\) Kies werden gebraucht (\\(\\pi = 3{,}14\\))?", loesung: 21.98, toleranz: 0.1, tipp: "Der Weg ist ein Kreisring.", loesungsweg: "Der Teich hat den Radius \\(3\\,\\text{m}\\), Teich und Weg zusammen den Radius \\(4\\,\\text{m}\\). Der Weg ist die Differenz der beiden Kreisflächen: $$A = 3{,}14 \\cdot (4^2 - 3^2) = 3{,}14 \\cdot 7 = 21{,}98\\,\\text{m}^2$$" },
      // ========== LEVEL 5 ==========
      { id: 25, level: 5, typ: "mc", frage: "Lena berechnet die Fläche eines Kreises mit dem Durchmesser \\(10\\,\\text{cm}\\): \\(A = 3{,}14 \\cdot 10^2 = 314\\,\\text{cm}^2\\). Was ist dazu zu sagen?", optionen: ["Die Rechnung ist richtig.", "Falsch: In die Flächenformel gehört der Radius \\(5\\), richtig sind \\(78{,}5\\,\\text{cm}^2\\).", "Falsch: Der Faktor \\(2\\) fehlt, richtig sind \\(628\\,\\text{cm}^2\\).", "Falsch: Die Fläche ist \\(3{,}14 \\cdot 10 = 31{,}4\\,\\text{cm}^2\\)."], korrekt: 1, tipp: "Welche Größe steht in der Flächenformel im Quadrat?", loesungsweg: "In \\(A = \\pi r^2\\) steht der <b>Radius</b>, nicht der Durchmesser. Mit \\(r = 5\\,\\text{cm}\\): $$A = 3{,}14 \\cdot 5^2 = 78{,}5\\,\\text{cm}^2$$ Lenas Wert ist viermal zu groß, weil \\(10^2 = 4 \\cdot 5^2\\). Der Faktor \\(2\\) gehört in die Umfangsformel, und \\(3{,}14 \\cdot 10\\) wäre der Umfang." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein halbkreisförmiges Fenster hat einen Rahmen von \\(25{,}7\\,\\text{cm}\\) Länge — Bogen und gerade Unterkante zusammen. Wie groß ist der Radius in cm (\\(\\pi = 3{,}14\\))?", loesung: 5, toleranz: 0.1, tipp: "Der Rahmen besteht aus einem halben Kreisumfang und einem Durchmesser.", loesungsweg: "Der Bogen ist der halbe Umfang \\(\\pi r\\), die Unterkante der Durchmesser \\(2r\\): $$3{,}14 r + 2r = 5{,}14 r = 25{,}7 \\implies r = 5\\,\\text{cm}$$ Wer die Unterkante vergisst, erhält \\(r \\approx 8{,}2\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Eine kreisrunde Rasenfläche hat den Umfang \\(94{,}2\\,\\text{m}\\). Ein Beutel Dünger reicht für \\(100\\,\\text{m}^2\\). Wie viele Beutel müssen gekauft werden (\\(\\pi = 3{,}14\\))?", loesung: 8, toleranz: 0, tipp: "Vom Umfang zum Radius, vom Radius zur Fläche.", loesungsweg: "Radius aus dem Umfang: $$r = \\frac{94{,}2}{2 \\cdot 3{,}14} = 15\\,\\text{m}$$ Fläche: $$A = 3{,}14 \\cdot 15^2 = 706{,}5\\,\\text{m}^2$$ Das sind \\(7{,}065\\) Beutel — gekauft werden müssen \\(8\\), sonst bleibt ein Rest ungedüngt." },
      { id: 28, level: 5, typ: "mc", frage: "Tom berechnet den Umfang eines Kreises mit \\(r = 4\\,\\text{cm}\\): \\(U = 2 \\cdot 3{,}14 \\cdot 4^2 = 100{,}48\\,\\text{cm}\\). Was ist dazu zu sagen?", optionen: ["Die Rechnung ist richtig.", "Falsch: Beim Umfang wird der Radius nicht quadriert, richtig sind \\(25{,}12\\,\\text{cm}\\).", "Falsch: Der Faktor \\(2\\) gehört nicht in die Formel, richtig sind \\(50{,}24\\,\\text{cm}\\).", "Falsch: Beim Umfang muss der Durchmesser quadriert werden, richtig sind \\(200{,}96\\,\\text{cm}\\)."], korrekt: 1, tipp: "Der Umfang ist eine Länge — die Einheit verrät, ob quadriert wird.", loesungsweg: "Der Umfang ist eine Länge, deshalb geht der Radius nur einfach ein: $$U = 2 \\cdot 3{,}14 \\cdot 4 = 25{,}12\\,\\text{cm}$$ Toms Rechnung mischt Umfangsformel (Faktor \\(2\\)) und Flächenformel (\\(r^2\\)). Ohne den Faktor \\(2\\), aber mit \\(r^2\\), käme die Fläche \\(50{,}24\\,\\text{cm}^2\\) heraus." },
      { id: 29, level: 5, typ: "numerisch", frage: "Zwei Kreise haben zusammen den Umfang \\(62{,}8\\,\\text{cm}\\). Der Radius des größeren Kreises ist dreimal so groß wie der des kleineren. Wie groß ist der Radius des kleineren Kreises in cm (\\(\\pi = 3{,}14\\))?", loesung: 2.5, toleranz: 0.05, tipp: "Beide Umfänge mit demselben \\(r\\) aufschreiben und addieren.", loesungsweg: "Kleiner Kreis: Radius \\(r\\), großer Kreis: Radius \\(3r\\). Summe der Umfänge: $$2\\pi r + 2\\pi \\cdot 3r = 8\\pi r = 62{,}8$$ $$r = \\frac{62{,}8}{8 \\cdot 3{,}14} = 2{,}5\\,\\text{cm}$$ Probe: \\(2 \\cdot 3{,}14 \\cdot (2{,}5 + 7{,}5) = 62{,}8\\) ✓" },
      { id: 30, level: 5, typ: "numerisch", frage: "Eine Laufbahn besteht aus einem Rechteck \\(80\\,\\text{m} \\times 40\\,\\text{m}\\) und je einem Halbkreis an den beiden kurzen Seiten. Wie lang ist eine Runde am äußeren Rand in m (\\(\\pi = 3{,}14\\))?", loesung: 285.6, toleranz: 0.5, tipp: "Zwei Halbkreise ergeben einen ganzen Kreis; die kurzen Rechteckseiten liegen innen.", loesungsweg: "Die Runde besteht aus den beiden langen Seiten und den zwei Halbkreisen, die zusammen einen Kreis mit \\(d = 40\\,\\text{m}\\) bilden: $$2 \\cdot 80 + 3{,}14 \\cdot 40 = 160 + 125{,}6 = 285{,}6\\,\\text{m}$$ Die kurzen Seiten von \\(40\\,\\text{m}\\) gehören nicht zur Laufstrecke — sie sind nur die Durchmesser." },
      // ========== LEVEL 6 ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Zwei Kreise mit den Radien \\(3\\,\\text{cm}\\) und \\(4\\,\\text{cm}\\) haben zusammen genau so viel Fläche wie ein Kreis mit dem Radius \\(7\\,\\text{cm}\\).\" Stimmt das?", optionen: ["Ja, weil \\(3 + 4 = 7\\).", "Nein — die Flächen verhalten sich wie \\(r^2\\); gleich groß wäre ein Kreis mit \\(r = 5\\,\\text{cm}\\).", "Nein — gleich groß wäre ein Kreis mit \\(r = 3{,}5\\,\\text{cm}\\).", "Ja, das gilt sogar für die Umfänge und die Flächen zugleich."], korrekt: 1, tipp: "Vergleiche \\(\\pi \\cdot 3^2 + \\pi \\cdot 4^2\\) mit \\(\\pi \\cdot 7^2\\).", loesungsweg: "Flächen addieren sich über die Radien<b>quadrate</b>: $$\\pi \\cdot 3^2 + \\pi \\cdot 4^2 = 9\\pi + 16\\pi = 25\\pi$$ Ein Kreis mit \\(r = 7\\) hat aber \\(49\\pi\\) — fast das Doppelte. Gleich groß ist ein Kreis mit \\(r^2 = 25\\), also \\(r = 5\\,\\text{cm}\\). Für die <b>Umfänge</b> stimmt die Addition der Radien dagegen, weil \\(U\\) linear in \\(r\\) ist." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für welchen Radius hat ein Kreis den gleichen Zahlenwert für Umfang (in cm) und Flächeninhalt (in cm\\(^2\\))?", loesung: 2, toleranz: 0, tipp: "Beide Formeln gleichsetzen — \\(\\pi\\) kürzt sich.", loesungsweg: "Gleichsetzen: $$2\\pi r = \\pi r^2$$ Durch \\(\\pi r\\) teilen (für \\(r \\neq 0\\)): $$2 = r$$ Für \\(r < 2\\) ist der Umfang zahlenmäßig größer als die Fläche, für \\(r > 2\\) überholt die Fläche, weil sie mit \\(r^2\\) wächst." },
      { id: 33, level: 6, typ: "numerisch", frage: "Ein Kreisring hat den Außenradius \\(10\\,\\text{cm}\\). Der Innenkreis soll genau <b>halb</b> so groß sein wie der Außenkreis. Wie groß muss der Innenradius sein (2 Nachkommastellen)?", loesung: 7.07, toleranz: 0.02, tipp: "Die Fläche halbiert sich nicht bei halbem Radius.", loesungsweg: "Der Innenkreis soll die halbe Fläche haben: $$\\pi r^2 = \\frac12 \\cdot \\pi \\cdot 10^2 \\implies r^2 = 50$$ $$r = \\sqrt{50} \\approx 7{,}07\\,\\text{cm}$$ Halber Radius (\\(5\\,\\text{cm}\\)) ergäbe nur ein Viertel der Fläche." },
      { id: 34, level: 6, typ: "mc", frage: "Behauptung: „Der Umfang eines Halbkreises ist halb so groß wie der Umfang des ganzen Kreises.\" Stimmt das?", optionen: ["Ja, denn der Halbkreis ist die Hälfte des Kreises.", "Nein — zum halben Kreisbogen kommt noch der Durchmesser als gerade Seite dazu.", "Ja, aber nur bei \\(r = 1\\).", "Nein — der Umfang des Halbkreises ist genau so groß wie der des ganzen Kreises."], korrekt: 1, tipp: "Was begrenzt den Halbkreis außer dem Bogen?", loesungsweg: "Der Halbkreis wird vom Bogen <b>und</b> vom Durchmesser begrenzt: $$U_{\\text{Halb}} = \\pi r + 2r = (\\pi + 2) r$$ Der halbe Kreisumfang wäre nur \\(\\pi r\\). Der Umfang des Halbkreises ist also mehr als die Hälfte — bei \\(r = 10\\) etwa \\(51{,}4\\) statt \\(31{,}4\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Seil liegt straff um den Äquator der Erde (Umfang etwa \\(40\\,000\\,\\text{km}\\)). Es wird um \\(6{,}28\\,\\text{m}\\) verlängert und überall gleich weit vom Boden abgehoben. Wie viele Meter ist es dann überall vom Boden entfernt (\\(\\pi = 3{,}14\\))?", loesung: 1, toleranz: 0.01, tipp: "Nur die Änderung des Umfangs zählt, nicht der Umfang selbst.", loesungsweg: "Wächst der Radius um \\(x\\), so wächst der Umfang um $$2\\pi (r + x) - 2\\pi r = 2\\pi x$$ Der Erdradius kürzt sich heraus. Mit \\(2\\pi x = 6{,}28\\,\\text{m}\\): $$x = \\frac{6{,}28}{6{,}28} = 1\\,\\text{m}$$ Das Ergebnis ist unabhängig von der Größe der Kugel — bei einem Fußball wäre es dasselbe." },
      { id: 36, level: 6, typ: "mc", frage: "Eine Pizzeria bietet eine Pizza mit \\(24\\,\\text{cm}\\) Durchmesser für \\(6\\,€\\) und eine mit \\(32\\,\\text{cm}\\) für \\(10\\,€\\) an. Welche Pizza ist pro cm\\(^2\\) günstiger?", optionen: ["Die kleine — sie kostet weniger.", "Die große — sie hat rund \\(1{,}8\\)-mal so viel Fläche, kostet aber nur \\(1{,}67\\)-mal so viel.", "Beide gleich — der Preis wächst mit dem Durchmesser.", "Die kleine — \\(24 : 6 = 4\\) ist größer als \\(32 : 10 = 3{,}2\\)."], korrekt: 1, tipp: "Vergleiche die Flächen, nicht die Durchmesser.", loesungsweg: "Flächen (\\(\\pi = 3{,}14\\)): $$A_{24} = 3{,}14 \\cdot 12^2 \\approx 452\\,\\text{cm}^2, \\quad A_{32} = 3{,}14 \\cdot 16^2 \\approx 804\\,\\text{cm}^2$$ Die große hat \\(804 : 452 \\approx 1{,}8\\)-mal so viel Fläche, kostet aber nur \\(10 : 6 \\approx 1{,}67\\)-mal so viel. Pro cm\\(^2\\): kleine \\(\\approx 1{,}33\\,\\text{ct}\\), große \\(\\approx 1{,}24\\,\\text{ct}\\). Wer nur Durchmesser vergleicht, übersieht, dass die Fläche quadratisch wächst." }];
    </script>

</body>
</html>
