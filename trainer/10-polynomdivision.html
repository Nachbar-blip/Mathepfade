<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polynomdivision - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-polynomdivision';
    const THEMA_CONFIG = { name: 'Polynomdivision', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht: Grundidee ==========
      { id: 1, level: 1, typ: "mc", frage: "Wozu dient die Polynomdivision?", optionen: ["Um Zahlen zu multiplizieren", "Um Polynome in Faktoren zu zerlegen bzw. durch lineare Terme zu teilen", "Um Gleichungen zu addieren", "Um Wurzeln zu ziehen"], korrekt: 1, tipp: "Ähnlich wie schriftliche Division bei Zahlen.", loesungsweg: "Die Polynomdivision zerlegt ein Polynom durch Division durch ein anderes Polynom (meist linearen Term)." },
      { id: 2, level: 1, typ: "mc", frage: "Wenn \\(x = a\\) eine Nullstelle von \\(f(x)\\) ist, dann ist …", optionen: ["\\(f(x)\\) durch \\(x\\) teilbar", "\\(f(x)\\) durch \\((x - a)\\) teilbar", "\\(f(x) = 0\\) überall", "\\(f(x) = a\\)"], korrekt: 1, tipp: "Linearfaktor der Nullstelle.", loesungsweg: "Ist \\(a\\) Nullstelle, so ist \\((x - a)\\) ein Linearfaktor von \\(f(x)\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Was erhält man bei der Division \\((x^2 - 4) : (x - 2)\\)?", optionen: ["\\(x - 2\\)", "\\(x + 2\\)", "\\(x^2\\)", "\\(2\\)"], korrekt: 1, tipp: "3. binomische Formel: \\(x^2 - 4 = (x-2)(x+2)\\).", loesungsweg: "\\(\\frac{(x-2)(x+2)}{x-2} = x + 2\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "\\((x^2 - 9) : (x - 3) = x + ?\\). Gib \\(?\\) an.", loesung: 3, toleranz: 0, tipp: "3. binomische Formel.", loesungsweg: "\\(x^2 - 9 = (x-3)(x+3)\\), also Ergebnis \\(x + 3\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Welcher Divisor ergibt Rest 0 bei \\(f(x) = x^2 - 5x + 6\\)?", optionen: ["\\((x - 1)\\)", "\\((x - 2)\\)", "\\((x - 4)\\)", "\\((x + 2)\\)"], korrekt: 1, tipp: "Teste, ob \\(f(a) = 0\\).", loesungsweg: "\\(f(2) = 4 - 10 + 6 = 0\\). Also ist \\((x - 2)\\) Teiler." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\((2x^2) : x = ?\\) Gib den Exponenten von \\(x\\) im Ergebnis an.", loesung: 1, toleranz: 0, tipp: "\\(x^2 / x = x^{2-1}\\).", loesungsweg: "\\(\\frac{2x^2}{x} = 2x\\), also Exponent \\(1\\)." },
      // ========== LEVEL 2 -- leicht: Einfache Division ==========
      { id: 7, level: 2, typ: "mc", frage: "\\((x^2 + 5x + 6) : (x + 2) = ?\\)", optionen: ["\\(x + 2\\)", "\\(x + 3\\)", "\\(x - 3\\)", "\\(x + 6\\)"], korrekt: 1, tipp: "\\((x+2)(x+3) = x^2 + 5x + 6\\).", loesungsweg: "\\(x^2 + 5x + 6 = (x+2)(x+3)\\), also Ergebnis \\(x + 3\\)." },
      { id: 8, level: 2, typ: "mc", frage: "\\((x^2 - 7x + 12) : (x - 3) = ?\\)", optionen: ["\\(x - 4\\)", "\\(x + 4\\)", "\\(x - 12\\)", "\\(x + 3\\)"], korrekt: 0, tipp: "Faktorisiere: \\((x-3)(x-4)\\).", loesungsweg: "\\(x^2 - 7x + 12 = (x-3)(x-4)\\), also \\(x - 4\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\((x^2 - 4x - 5) : (x - 5) = x + ?\\). Gib \\(?\\) an.", loesung: 1, toleranz: 0, tipp: "\\((x-5)(x+1)\\).", loesungsweg: "\\(x^2 - 4x - 5 = (x-5)(x+1)\\), also \\(x + 1\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Rest der Division \\((x^2 + 3x + 5) : (x + 1)\\)?", loesung: 3, toleranz: 0, tipp: "Ergebnis \\(x + 2\\) Rest \\(3\\). Oder: \\(f(-1) = 1 - 3 + 5 = 3\\).", loesungsweg: "Division ergibt \\(x + 2\\) Rest \\(3\\). Kontrolle: \\(f(-1) = 1 - 3 + 5 = 3\\)." },
      { id: 11, level: 2, typ: "mc", frage: "Wie lautet der erste Schritt bei \\((x^3 + \\dots) : (x - 2)\\)?", optionen: ["\\(x^3 : x = x^2\\), dann \\(x^2 \\cdot (x - 2) = x^3 - 2x^2\\) abziehen", "Einfach ausklammern", "Durch \\(2\\) teilen", "Mit \\(x\\) multiplizieren"], korrekt: 0, tipp: "Höchste Potenz des Zählers durch höchste des Nenners.", loesungsweg: "Erster Schritt: \\(x^3 : x = x^2\\). Dann \\(x^2 \\cdot (x - 2) = x^3 - 2x^2\\) abziehen." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\((x^3 - x) : x = x^2 - ?\\). Gib \\(?\\) an.", loesung: 1, toleranz: 0, tipp: "Ausklammern: \\(x(x^2 - 1)\\).", loesungsweg: "\\(\\frac{x^3 - x}{x} = x^2 - 1\\)." },
      // ========== LEVEL 3 -- nervenschonend: Schritt-für-Schritt ==========
      { id: 13, level: 3, typ: "mc", frage: "\\((x^3 - 3x^2 + 2x) : x = ?\\)", optionen: ["\\(x^2 - 3x + 2\\)", "\\(x^2 + 3x + 2\\)", "\\(x - 3 + 2\\)", "\\(x^3 - 3x\\)"], korrekt: 0, tipp: "Jeden Summanden durch \\(x\\) teilen.", loesungsweg: "\\(\\frac{x^3 - 3x^2 + 2x}{x} = x^2 - 3x + 2\\)." },
      { id: 14, level: 3, typ: "mc", frage: "\\((x^3 - 8) : (x - 2) = ?\\)", optionen: ["\\(x^2 + 2x + 4\\)", "\\(x^2 - 2x + 4\\)", "\\(x^2 + 4\\)", "\\(x - 4\\)"], korrekt: 0, tipp: "\\(a^3 - b^3 = (a - b)(a^2 + ab + b^2)\\).", loesungsweg: "\\(x^3 - 8 = (x - 2)(x^2 + 2x + 4)\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Bei \\((x^3 - 6x^2 + 11x - 6) : (x - 1)\\): Was ist der Koeffizient von \\(x^2\\) im Ergebnis?", loesung: 1, toleranz: 0, tipp: "Ergebnis: \\(x^2 - 5x + 6\\).", loesungsweg: "Polynomdivision ergibt \\(x^2 - 5x + 6\\). Koeffizient von \\(x^2\\): \\(1\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Bei \\((x^3 - 6x^2 + 11x - 6) : (x - 1)\\): Absolutglied des Ergebnisses?", loesung: 6, toleranz: 0, tipp: "Ergebnis: \\(x^2 - 5x + 6\\).", loesungsweg: "Das Ergebnis \\(x^2 - 5x + 6\\) hat Absolutglied \\(6\\)." },
      { id: 17, level: 3, typ: "mc", frage: "\\((x^3 + 1) : (x + 1) = ?\\)", optionen: ["\\(x^2 - x + 1\\)", "\\(x^2 + x + 1\\)", "\\(x^2 + 1\\)", "\\(x - 1\\)"], korrekt: 0, tipp: "\\(a^3 + b^3 = (a + b)(a^2 - ab + b^2)\\).", loesungsweg: "\\(x^3 + 1 = (x + 1)(x^2 - x + 1)\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Ist \\(x = 2\\) Nullstelle von \\(f(x) = x^3 - 3x^2 + 4\\)? Antworte mit 1 (ja) oder 0 (nein).", loesung: 1, toleranz: 0, tipp: "\\(f(2) = 8 - 12 + 4 = 0\\).", loesungsweg: "\\(f(2) = 8 - 12 + 4 = 0\\) — ja, also Antwort \\(1\\)." },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "mc", frage: "\\((2x^3 - 3x^2 - 11x + 6) : (x - 3) = ?\\)", optionen: ["\\(2x^2 + 3x - 2\\)", "\\(2x^2 - 3x + 2\\)", "\\(x^2 + 3x - 2\\)", "\\(2x^2 - 11x + 6\\)"], korrekt: 0, tipp: "Erster Schritt: \\(2x^3 : x = 2x^2\\).", loesungsweg: "Division ergibt \\(2x^2 + 3x - 2\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Bei \\((x^4 - 1) : (x - 1)\\): Wie lautet das Absolutglied im Ergebnis?", loesung: 1, toleranz: 0, tipp: "Ergebnis: \\(x^3 + x^2 + x + 1\\).", loesungsweg: "\\(x^4 - 1 = (x - 1)(x^3 + x^2 + x + 1)\\). Absolutglied: \\(1\\)." },
      { id: 21, level: 4, typ: "mc", frage: "Fehlende Potenz im Dividenden \\(x^3 + 2x - 5\\): Was fehlt?", optionen: ["\\(x^4\\)", "\\(x^2\\) (mit Koeffizient 0)", "\\(x^5\\)", "Nichts fehlt"], korrekt: 1, tipp: "Bei Polynomdivision immer Lücken mit \\(0 \\cdot x^k\\) füllen.", loesungsweg: "Es fehlt der \\(x^2\\)-Term. Bei der Division schreibe \\(x^3 + 0 x^2 + 2x - 5\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\((x^3 - 2x^2 - 5x + 6) : (x - 1)\\). Rest?", loesung: 0, toleranz: 0, tipp: "\\(f(1) = 1 - 2 - 5 + 6\\).", loesungsweg: "\\(f(1) = 1 - 2 - 5 + 6 = 0\\). Division geht auf, Rest \\(0\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Bei \\((x^3 - 2x^2 - 5x + 6) : (x - 1)\\): Koeffizient von \\(x\\) im Ergebnis?", loesung: -1, toleranz: 0, tipp: "Ergebnis: \\(x^2 - x - 6\\).", loesungsweg: "Division: \\(x^2 - x - 6\\). Der Koeffizient von \\(x\\) ist \\(-1\\).<br>Prüfung: \\((x-1)(x^2 - x - 6) = x^3 - 2x^2 - 5x + 6\\) ✓ (Hinweis: \\(-6\\) ist das Absolutglied, nicht der gesuchte Koeffizient.)" },
      { id: 24, level: 4, typ: "numerisch", frage: "Rest von \\((x^3 + 2x^2 + 3) : (x + 1)\\)?", loesung: 4, toleranz: 0, tipp: "\\(f(-1) = -1 + 2 + 3 = 4\\).", loesungsweg: "Nach dem Restsatz: Rest \\(= f(-1) = -1 + 2 + 0 + 3 = 4\\)." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "mc", frage: "Nullstellenbestimmung von \\(f(x) = x^3 - 4x^2 + x + 6\\), gegeben: \\(x = 3\\) ist Nullstelle. Restliche Nullstellen?", optionen: ["\\(1, -2\\)", "\\(-1, 2\\)", "\\(2, -3\\)", "\\(0, 1\\)"], korrekt: 1, tipp: "Dividiere durch \\((x-3)\\), dann pq-Formel.", loesungsweg: "Nach Division: \\(x^2 - x - 2 = (x-2)(x+1)\\). Nullstellen: \\(-1, 2\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "\\((x^4 - 5x^2 + 4) : (x - 1)\\). Gib den Wert des Ergebnisses an der Stelle \\(x = 0\\).", loesung: -4, toleranz: 0, tipp: "Ergebnis: \\(x^3 + x^2 - 4x - 4\\). Bei \\(x = 0\\): \\(-4\\).", loesungsweg: "Nach Division: \\(x^3 + x^2 - 4x - 4\\). Für \\(x = 0\\): \\(-4\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Finde durch Raten eine Nullstelle von \\(f(x) = x^3 - 7x + 6\\). Gib die kleinste ganzzahlige Nullstelle an.", loesung: -3, toleranz: 0, tipp: "Teste Teiler von 6: \\(\\pm 1, \\pm 2, \\pm 3, \\pm 6\\). \\(f(1) = 0\\), \\(f(2) = 0\\), \\(f(-3) = 0\\).", loesungsweg: "\\(f(1) = 0\\), \\(f(2) = 0\\), \\(f(-3) = -27 + 21 + 6 = 0\\). Kleinste: \\(-3\\)." },
      { id: 28, level: 5, typ: "mc", frage: "Nach Division \\((x^3 - 7x + 6) : (x - 1)\\) — was ergibt sich?", optionen: ["\\(x^2 + x - 6\\)", "\\(x^2 - x + 6\\)", "\\(x^2 - 7\\)", "\\(x^2 + 6\\)"], korrekt: 0, tipp: "Setze mit Koeffizienten \\(1, 0, -7, 6\\) an (HornerSchema).", loesungsweg: "Division ergibt \\(x^2 + x - 6\\). Probe: \\((x-1)(x^2 + x - 6) = x^3 + x^2 - 6x - x^2 - x + 6 = x^3 - 7x + 6\\) ✓" },
      { id: 29, level: 5, typ: "numerisch", frage: "\\(x^2 + x - 6\\) hat Nullstellen \\(2\\) und \\(-3\\). Zusammen mit \\(x = 1\\) aus Polynomdivision — wie viele Nullstellen hat \\(f(x) = x^3 - 7x + 6\\) insgesamt?", loesung: 3, toleranz: 0, tipp: "Zähle: 1, 2, -3.", loesungsweg: "Drei Nullstellen: \\(1, 2, -3\\)." },
      { id: 30, level: 5, typ: "mc", frage: "Wenn bei \\((f(x)) : (x - a)\\) der Rest \\(0\\) ist, bedeutet das …", optionen: ["\\(a\\) ist Nullstelle", "\\(f\\) hat Grad 0", "\\(a = 0\\)", "\\(f\\) ist konstant"], korrekt: 0, tipp: "Restsatz.", loesungsweg: "Rest \\(0\\) bedeutet \\((x-a) | f(x)\\), also ist \\(a\\) Nullstelle." },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "numerisch", frage: "\\(f(x) = x^3 - 6x^2 + 11x - 6\\). Alle drei Nullstellen sind ganzzahlig. Gib das Produkt der drei Nullstellen an.", loesung: 6, toleranz: 0, tipp: "Vieta: Produkt = \\(-\\frac{d}{a}\\) bei \\(ax^3 + \\dots + d\\).", loesungsweg: "Nullstellen \\(1, 2, 3\\) (prüfen: \\(f(1) = 0\\) usw.). Produkt: \\(1 \\cdot 2 \\cdot 3 = 6\\). Vieta: \\(-\\frac{-6}{1} = 6\\) ✓" },
      { id: 32, level: 6, typ: "mc", frage: "Ein Polynom \\(f(x)\\) vom Grad 4 hat Nullstellen \\(1, -1, 2, -2\\) und Leitkoeffizient \\(1\\). Ausgeschrieben?", optionen: ["\\(x^4 - 5x^2 + 4\\)", "\\(x^4 + 5x^2 + 4\\)", "\\(x^4 - 4\\)", "\\((x-1)(x-2)\\)"], korrekt: 0, tipp: "\\((x-1)(x+1)(x-2)(x+2) = (x^2-1)(x^2-4)\\).", loesungsweg: "\\((x^2-1)(x^2-4) = x^4 - 5x^2 + 4\\)." },
      { id: 33, level: 6, typ: "numerisch", frage: "Rest von \\((x^5 - x^3 + 2) : (x - 1)\\)?", loesung: 2, toleranz: 0, tipp: "Restsatz: \\(f(1) = 1 - 1 + 2\\).", loesungsweg: "Nach dem Restsatz: Rest \\(= f(1) = 1 - 1 + 2 = 2\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für welches \\(c\\) ist \\((x^3 + cx + 2)\\) durch \\((x + 1)\\) teilbar?", loesung: 1, toleranz: 0, tipp: "\\(f(-1) = 0\\): \\(-1 - c + 2 = 0\\).", loesungsweg: "\\(f(-1) = (-1)^3 + c(-1) + 2 = 1 - c\\). Für Teilbarkeit durch \\((x+1)\\) muss \\(f(-1) = 0\\) sein: \\(1 - c = 0 \\implies c = 1\\). (Probe \\(c=3\\): \\(f(-1) = -1 - 3 + 2 = -2 \\neq 0\\).)" },
      { id: 35, level: 6, typ: "mc", frage: "Warum ist die Polynomdivision wichtig zur Nullstellenbestimmung?", optionen: ["Sie ist immer einfacher als die pq-Formel", "Sie reduziert den Grad, sodass man bei Grad ≥ 3 die restlichen Nullstellen z. B. mit pq-Formel bestimmt", "Sie findet automatisch alle Nullstellen", "Sie ersetzt die Ableitung"], korrekt: 1, tipp: "Bei Grad ≥ 3 erraten + Polynomdivision + pq-Formel.", loesungsweg: "Nach dem Raten einer Nullstelle reduziert die Division den Grad um 1; der Rest lässt sich oft mit der pq-Formel lösen." },
      { id: 36, level: 6, typ: "numerisch", frage: "\\(f(x) = x^3 - 3x^2 - 10x + 24\\). Eine Nullstelle ist \\(x = 2\\). Nach Division durch \\((x-2)\\): Summe der verbleibenden zwei Nullstellen?", loesung: 1, toleranz: 0, tipp: "Nach Division: \\(x^2 - x - 12 = (x-4)(x+3)\\). Verbleibende Nullstellen: \\(4\\) und \\(-3\\).", loesungsweg: "Division ergibt \\(x^2 - x - 12\\). Nullstellen: \\(4, -3\\). Summe: \\(4 + (-3) = 1\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
