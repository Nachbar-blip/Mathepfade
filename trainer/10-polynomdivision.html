<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-polynomdivision';
    const THEMA_CONFIG = { name: 'Grenzwerte und Asymptoten', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht: Grundidee ==========
      { id: 1, level: 1, typ: "mc", frage: "Wie verhält sich \\(f(x) = x^2\\) für \\(x \\to \\infty\\)?", optionen: ["\\(f(x) \\to \\infty\\)", "\\(f(x) \\to -\\infty\\)", "\\(f(x) \\to 0\\)", "\\(f(x) \\to 1\\)"], korrekt: 0, tipp: "Setze einige große Zahlen ein und beobachte die Werte.", loesungsweg: "Für wachsendes \\(x\\) wächst das Quadrat noch schneller: \\(10^2 = 100\\), \\(100^2 = 10\\,000\\). Man schreibt $$\\lim_{x \\to \\infty} x^2 = \\infty$$" },
      { id: 2, level: 1, typ: "mc", frage: "Wie verhält sich \\(f(x) = x^3\\) für \\(x \\to -\\infty\\)?", optionen: ["\\(f(x) \\to \\infty\\)", "\\(f(x) \\to -\\infty\\)", "\\(f(x) \\to 0\\)", "\\(f(x) \\to 1\\)"], korrekt: 1, tipp: "Achte auf das Vorzeichen, wenn eine negative Zahl dreimal mit sich selbst multipliziert wird.", loesungsweg: "Bei ungeradem Exponenten bleibt das Vorzeichen erhalten: \\((-10)^3 = -1000\\), \\((-100)^3 = -1\\,000\\,000\\). Also $$\\lim_{x \\to -\\infty} x^3 = -\\infty$$" },
      { id: 3, level: 1, typ: "mc", frage: "Wie verhält sich \\(f(x) = \\frac1x\\) für \\(x \\to \\infty\\)?", optionen: ["\\(f(x) \\to \\infty\\)", "\\(f(x) \\to 1\\)", "\\(f(x) \\to 0\\)", "\\(f(x) \\to -\\infty\\)"], korrekt: 2, tipp: "Je größer der Nenner, desto kleiner der Bruch.", loesungsweg: "Der Nenner wächst, der Bruch wird immer kleiner: \\(\\frac1{100} = 0{,}01\\). Man schreibt $$\\lim_{x \\to \\infty} \\frac1x = 0$$ Der Wert null wird dabei nie erreicht." },
      { id: 4, level: 1, typ: "numerisch", frage: "Für \\(f(x) = \\frac1x\\): Berechne \\(f(1000)\\) als Dezimalzahl.", loesung: 0.001, toleranz: 0.0001, tipp: "Teile eins durch den angegebenen Wert.", loesungsweg: "$$f(1000) = \\frac{1}{1000} = 0{,}001$$ Der Wert liegt schon sehr nahe bei null." },
      { id: 5, level: 1, typ: "numerisch", frage: "Welchem Wert nähert sich \\(f(x) = \\frac{1}{x^2}\\) für \\(x \\to \\infty\\)?", loesung: 0, toleranz: 0, tipp: "Setze ein paar große Zahlen ein und beobachte, wie sich der Bruch verändert.", loesungsweg: "Der Nenner wächst noch schneller als bei \\(\\frac1x\\): $$f(10) = 0{,}01, \\qquad f(100) = 0{,}0001$$ Die Werte unterschreiten jede positive Schranke, also \\(\\lim\\limits_{x \\to \\infty} \\frac{1}{x^2} = 0\\). Der Wert null wird dabei nie erreicht." },
      { id: 6, level: 1, typ: "numerisch", frage: "Für eine Funktion \\(f\\) gilt \\(\\lim\\limits_{x \\to \\infty} f(x) = 3\\). Welchen Wert hat dann die Zahl \\(b\\) in der waagerechten Asymptote \\(y = b\\)?", loesung: 3, toleranz: 0, tipp: "Die waagerechte Asymptote gibt die Höhe an, in der sich der Graph einpendelt.", loesungsweg: "Die Funktionswerte nähern sich für große \\(x\\) dem Wert \\(3\\). Die Gerade $$y = 3$$ ist damit waagerechte Asymptote, also \\(b = 3\\)." },
      // ========== LEVEL 2 -- leicht: Einfache Division ==========
      { id: 7, level: 2, typ: "mc", frage: "Wie verhält sich \\(f(x) = 2x^3 - 5x + 1\\) für \\(x \\to \\infty\\)?", optionen: ["\\(f(x) \\to \\infty\\)", "\\(f(x) \\to -\\infty\\)", "\\(f(x) \\to 0\\)", "\\(f(x) \\to 2\\)"], korrekt: 0, tipp: "Für sehr große \\(x\\) entscheidet das Glied mit dem höchsten Exponenten.", loesungsweg: "Der Summand \\(2x^3\\) wächst weit schneller als \\(-5x\\) und die Konstante. Also $$\\lim_{x \\to \\infty} \\left(2x^3 - 5x + 1\\right) = \\infty$$ Man spricht vom Glied höchsten Grades als dem bestimmenden Glied." },
      { id: 8, level: 2, typ: "mc", frage: "Wie verhält sich \\(f(x) = -4x^2 + 3\\) für \\(x \\to -\\infty\\)?", optionen: ["\\(f(x) \\to \\infty\\)", "\\(f(x) \\to -\\infty\\)", "\\(f(x) \\to 3\\)", "\\(f(x) \\to 0\\)"], korrekt: 1, tipp: "Bestimme zuerst das Vorzeichen des Gliedes höchsten Grades für negative \\(x\\).", loesungsweg: "Für \\(x \\to -\\infty\\) wird \\(x^2\\) beliebig groß und positiv; der Faktor \\(-4\\) dreht das Vorzeichen um: $$\\lim_{x \\to -\\infty} \\left(-4x^2+3\\right) = -\\infty$$ Bei geradem Exponenten verhält sich die Funktion an beiden Rändern gleich." },
      { id: 9, level: 2, typ: "numerisch", frage: "An welcher Stelle hat der Graph von \\(f(x) = \\frac{1}{x-4}\\) eine senkrechte Asymptote?", loesung: 4, toleranz: 0, tipp: "Suche die Stelle, an der der Nenner null wird.", loesungsweg: "Der Nenner wird null für $$x - 4 = 0 \\;\\Longrightarrow\\; x = 4$$ Dort ist die Funktion nicht definiert, die Werte wachsen in der Nähe über alle Grenzen: \\(x = 4\\) ist senkrechte Asymptote." },
      { id: 10, level: 2, typ: "mc", frage: "Wie verhält sich \\(f(x) = -x^3 + 2x\\) für \\(x \\to \\infty\\)?", optionen: ["\\(f(x) \\to \\infty\\)", "\\(f(x) \\to -\\infty\\)", "\\(f(x) \\to 2\\)", "\\(f(x) \\to 0\\)"], korrekt: 1, tipp: "Prüfe, welches Glied für große \\(x\\) den Ausschlag gibt, und achte auf dessen Vorzeichen.", loesungsweg: "Das Glied höchsten Grades ist \\(-x^3\\); es wächst betragsmäßig weit schneller als \\(2x\\), ist für positive \\(x\\) aber negativ: $$f(10) = -1000 + 20 = -980$$ Also \\(\\lim\\limits_{x \\to \\infty}\\left(-x^3+2x\\right) = -\\infty\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Wie viele senkrechte Asymptoten hat der Graph von \\(f(x) = \\frac{1}{\\left(x-1\\right)\\left(x+5\\right)}\\)?", loesung: 2, toleranz: 0, tipp: "Der Nenner ist ein Produkt — überlege, wann ein Produkt null wird.", loesungsweg: "Ein Produkt ist null, sobald ein Faktor null ist: $$x - 1 = 0 \\;\\text{oder}\\; x + 5 = 0 \\;\\Longrightarrow\\; x = 1 \\;\\text{oder}\\; x = -5$$ Der Zähler \\(1\\) ist an beiden Stellen nicht null, es gibt also <b>2</b> senkrechte Asymptoten." },
      { id: 12, level: 2, typ: "numerisch", frage: "Der Graph von \\(f(x) = \\frac1x + 2\\) hat die waagerechte Asymptote \\(y = b\\). Bestimme \\(b\\).", loesung: 2, toleranz: 0, tipp: "Überlege, wohin der Bruch für große \\(x\\) strebt, und was dann vom Term übrig bleibt.", loesungsweg: "Für \\(x \\to \\infty\\) geht \\(\\frac1x\\) gegen null, übrig bleibt die Konstante: $$\\lim_{x \\to \\infty}\\left(\\frac1x + 2\\right) = 0 + 2 = 2$$ Die Asymptote ist \\(y = 2\\), also \\(b = 2\\)." },
      // ========== LEVEL 3 -- nervenschonend: Schritt-für-Schritt ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Bestimme die Zahl \\(b\\) der waagerechten Asymptote \\(y = b\\) von \\(f(x) = \\frac{3x+1}{x-2}\\).", loesung: 3, toleranz: 0, tipp: "Vergleiche für große \\(x\\) die Glieder höchsten Grades in Zähler und Nenner.", loesungsweg: "Für sehr große \\(x\\) bestimmen \\(3x\\) und \\(x\\) den Wert: $$\\frac{3x+1}{x-2} \\approx \\frac{3x}{x} = 3$$ Also \\(\\lim\\limits_{x \\to \\infty} f(x) = 3\\) und die Asymptote ist \\(y = 3\\). Probe: \\(f(1000) = \\frac{3001}{998} \\approx 3{,}007\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Bestimme die Zahl \\(b\\) der waagerechten Asymptote \\(y = b\\) von \\(f(x) = \\frac{4x-1}{x^2+2}\\).", loesung: 0, toleranz: 0, tipp: "Vergleiche die Grade von Zähler und Nenner und überlege, welcher Teil schneller wächst.", loesungsweg: "Der Nenner hat den höheren Grad, er wächst also deutlich schneller als der Zähler: $$f(100) = \\frac{399}{10\\,002} \\approx 0{,}04$$ Der Bruch strebt gegen null, die Asymptote ist \\(y = 0\\), also \\(b = 0\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Der Graph von \\(f(x) = \\frac{2x+1}{x^2-4x}\\) hat zwei senkrechte Asymptoten. Gib die größere Stelle an.", loesung: 4, toleranz: 0, tipp: "Im Nenner lässt sich etwas ausklammern; wende danach den Satz vom Nullprodukt an.", loesungsweg: "Nenner ausklammern: $$x^2 - 4x = x\\left(x-4\\right)$$ Nullstellen des Nenners sind \\(0\\) und \\(4\\); der Zähler \\(2x+1\\) ist dort nicht null. An beiden Stellen liegt eine senkrechte Asymptote, die größere ist <b>\\(x = 4\\)</b>." },
      { id: 16, level: 3, typ: "numerisch", frage: "Der Graph von \\(f(x) = 2^x + 3\\) nähert sich für \\(x \\to -\\infty\\) einer waagerechten Asymptote \\(y = b\\). Bestimme \\(b\\).", loesung: 3, toleranz: 0, tipp: "Überlege zuerst, wohin die Potenz allein für stark negative \\(x\\) strebt.", loesungsweg: "Für \\(x \\to -\\infty\\) gilt \\(2^x \\to 0\\), etwa \\(2^{-10} \\approx 0{,}001\\). Damit $$\\lim_{x \\to -\\infty}\\left(2^x + 3\\right) = 0 + 3 = 3$$ Die Asymptote \\(y = 3\\) ist die um \\(3\\) nach oben verschobene \\(x\\)-Achse." },
      { id: 17, level: 3, typ: "numerisch", frage: "Der Graph von \\(f(x) = 0{,}5^x - 4\\) nähert sich für \\(x \\to \\infty\\) einer waagerechten Asymptote \\(y = b\\). Bestimme \\(b\\).", loesung: -4, toleranz: 0, tipp: "Die Basis liegt zwischen null und eins — überlege, was die Potenz dann für große \\(x\\) macht.", loesungsweg: "Wegen \\(0 < 0{,}5 < 1\\) gilt \\(0{,}5^x \\to 0\\) für \\(x \\to \\infty\\). Damit $$\\lim_{x \\to \\infty}\\left(0{,}5^x - 4\\right) = 0 - 4 = -4$$ Die Asymptote ist \\(y = -4\\)." },
      { id: 18, level: 3, typ: "mc", frage: "Wie verhält sich \\(f(x) = \\frac{x^2+1}{x+1}\\) für \\(x \\to \\infty\\)?", optionen: ["\\(f(x) \\to 1\\)", "\\(f(x) \\to \\infty\\)", "\\(f(x) \\to 0\\)", "\\(f(x) \\to -\\infty\\)"], korrekt: 1, tipp: "Vergleiche die Grade von Zähler und Nenner miteinander.", loesungsweg: "Der Zähler hat den höheren Grad, er wächst also deutlich schneller: $$\\frac{x^2+1}{x+1} \\approx \\frac{x^2}{x} = x \\longrightarrow \\infty$$ Probe: \\(f(100) = \\frac{10\\,001}{101} \\approx 99\\). Eine waagerechte Asymptote gibt es hier nicht." },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Eine Wertetabelle zu \\(f\\) zeigt \\(f(10) = 2{,}9\\), \\(f(100) = 2{,}99\\) und \\(f(1000) = 2{,}999\\). Welchem Wert nähert sich \\(f(x)\\) für \\(x \\to \\infty\\)?", loesung: 3, toleranz: 0, tipp: "Achte darauf, wie groß der Abstand zu einer glatten Zahl von Zeile zu Zeile noch ist.", loesungsweg: "Der Abstand zu \\(3\\) beträgt \\(0{,}1\\), dann \\(0{,}01\\), dann \\(0{,}001\\) — er wird beliebig klein. Also $$\\lim_{x \\to \\infty} f(x) = 3$$ Der Graph nähert sich der Geraden \\(y = 3\\) von unten, ohne sie zu erreichen." },
      { id: 20, level: 4, typ: "numerisch", frage: "Eine Funktion der Form \\(f(x) = \\frac{c}{x-d}\\) hat die senkrechte Asymptote \\(x = -3\\). Bestimme \\(d\\).", loesung: -3, toleranz: 0, tipp: "Die senkrechte Asymptote liegt dort, wo der Nenner null wird — stelle diese Bedingung auf.", loesungsweg: "Der Nenner wird null für \\(x = d\\). Da die Asymptote bei \\(-3\\) liegt, ist $$d = -3$$ Die Funktion lautet also \\(f(x) = \\frac{c}{x+3}\\) — im Nenner steht ein Plus, obwohl die Asymptote negativ ist." },
      { id: 21, level: 4, typ: "mc", frage: "Welche Funktion hat die waagerechte Asymptote \\(y = 0\\) und die senkrechte Asymptote \\(x = 2\\)?", optionen: ["\\(f(x) = \\frac{1}{x-2}\\)", "\\(f(x) = \\frac{1}{x+2}\\)", "\\(f(x) = \\frac{x-2}{x}\\)", "\\(f(x) = \\frac{2}{x} + 1\\)"], korrekt: 0, tipp: "Prüfe je Funktion getrennt die Nennernullstelle und das Verhalten für große \\(x\\).", loesungsweg: "Bei \\(\\frac{1}{x-2}\\) wird der Nenner bei \\(x = 2\\) null, und für große \\(x\\) geht der Bruch gegen null: $$\\lim_{x \\to \\infty}\\frac{1}{x-2} = 0$$ Die zweite Funktion hat die Asymptote \\(x = -2\\), die dritte nähert sich \\(y = 1\\), die vierte ebenfalls \\(y = 1\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Bestimme \\(\\lim\\limits_{x \\to \\infty} \\frac{4x^2-x}{2x^2+7}\\).", loesung: 2, toleranz: 0, tipp: "Klammere die höchste Potenz in Zähler und Nenner aus und kürze sie.", loesungsweg: "Ausklammern von \\(x^2\\): $$\\frac{x^2\\left(4 - \\frac1x\\right)}{x^2\\left(2 + \\frac{7}{x^2}\\right)} = \\frac{4 - \\frac1x}{2 + \\frac{7}{x^2}} \\longrightarrow \\frac42 = 2$$ Der Grenzwert ist \\(2\\). Probe: \\(f(1000) \\approx 1{,}9995\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Der Graph von \\(f(x) = \\frac{x+1}{x^2-9}\\) hat zwei senkrechte Asymptoten. Gib die positive Stelle an.", loesung: 3, toleranz: 0, tipp: "Der Nenner lässt sich mit einer binomischen Formel zerlegen; prüfe danach, ob der Zähler an denselben Stellen null wird.", loesungsweg: "Nenner zerlegen: $$x^2 - 9 = (x-3)(x+3)$$ Nullstellen des Nenners sind \\(3\\) und \\(-3\\); der Zähler \\(x+1\\) ist dort nicht null. Also liegen bei beiden Stellen senkrechte Asymptoten, die positive ist <b>\\(x = 3\\)</b>." },
      { id: 24, level: 4, typ: "mc", frage: "Eine Fischpopulation in einem See wächst und nähert sich langfristig einem Bestand von 5000 Tieren an; heute sind es 2000. Welcher Term beschreibt den Bestand nach \\(t\\) Jahren?", optionen: ["\\(5000 - 3000 \\cdot 0{,}9^t\\)", "\\(5000 \\cdot 0{,}9^t\\)", "\\(2000 \\cdot 1{,}1^t\\)", "\\(5000 + 3000 \\cdot 1{,}1^t\\)"], korrekt: 0, tipp: "Setze \\(t = 0\\) ein und überlege getrennt, welchem Wert sich der Term für große \\(t\\) nähert.", loesungsweg: "Für \\(t = 0\\) liefert der erste Term \\(5000 - 3000 = 2000\\) — der heutige Bestand. Für \\(t \\to \\infty\\) geht \\(0{,}9^t\\) gegen null, also $$\\lim_{t \\to \\infty}\\left(5000 - 3000 \\cdot 0{,}9^t\\right) = 5000$$ Die Gerade \\(y = 5000\\) ist waagerechte Asymptote. Die übrigen Terme streben gegen \\(0\\) beziehungsweise über alle Grenzen." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = \\frac{ax+b}{x-1}\\) hat die waagerechte Asymptote \\(y = 2\\) und verläuft durch den Punkt \\(P(2 \\mid 7)\\). Bestimme \\(b\\).", loesung: 3, toleranz: 0, tipp: "Die Asymptote legt einen der beiden Parameter fest, der Punkt anschließend den zweiten.", loesungsweg: "Bei gleichem Grad ist die waagerechte Asymptote der Quotient der Vorfaktoren: \\(\\frac{a}{1} = 2\\), also \\(a = 2\\). Punktprobe: $$f(2) = \\frac{2 \\cdot 2 + b}{2-1} = 4 + b = 7 \\;\\Longrightarrow\\; b = 3$$ Die Funktion lautet \\(f(x) = \\frac{2x+3}{x-1}\\)." },
      { id: 26, level: 5, typ: "mc", frage: "Zu \\(f(x) = \\frac{2x+1}{x+5}\\) wird notiert: „Zähler und Nenner wachsen beide über alle Grenzen, also ist der Grenzwert für \\(x \\to \\infty\\) gleich \\(1\\).“ Wie ist das zu bewerten?", optionen: ["Richtig, beide Teile heben sich auf", "Falsch, der Grenzwert ist \\(2\\)", "Falsch, der Grenzwert ist \\(0\\)", "Falsch, es gibt keinen Grenzwert"], korrekt: 1, tipp: "Vergleiche die Vorfaktoren der höchsten Potenzen, statt nur auf das Wachstum zu schauen.", loesungsweg: "Dass beide über alle Grenzen wachsen, sagt über den Quotienten nichts. Entscheidend ist das Verhältnis: $$\\frac{2x+1}{x+5} \\approx \\frac{2x}{x} = 2$$ Der Grenzwert ist <b>2</b>. Probe: \\(f(1000) = \\frac{2001}{1005} \\approx 1{,}991\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = \\frac{ax+b}{x+c}\\) hat die senkrechte Asymptote \\(x = -2\\), die waagerechte Asymptote \\(y = 5\\) und die Nullstelle \\(x = 1\\). Bestimme \\(b\\).", loesung: -5, toleranz: 0, tipp: "Werte die drei Angaben nacheinander aus — jede legt einen der Parameter fest; die Nullstelle betrifft nur den Zähler.", loesungsweg: "Die senkrechte Asymptote liegt an der Nennernullstelle: \\(-2 + c = 0\\), also \\(c = 2\\). Die waagerechte Asymptote liefert \\(a = 5\\). Eine Nullstelle entsteht, wenn der Zähler null wird: $$5 \\cdot 1 + b = 0 \\;\\Longrightarrow\\; b = -5$$ Die Funktion lautet \\(f(x) = \\frac{5x-5}{x+2}\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Eine Funktion \\(f(x) = \\frac{a}{x-d} + e\\) hat die senkrechte Asymptote \\(x = 2\\) und die waagerechte Asymptote \\(y = 3\\); außerdem gilt \\(f(4) = 8\\). Bestimme \\(a\\).", loesung: 10, toleranz: 0, tipp: "Die beiden Asymptoten legen zwei der drei Parameter fest, der Funktionswert dann den dritten.", loesungsweg: "Senkrechte Asymptote: \\(d = 2\\). Für große \\(x\\) geht der Bruch gegen null, übrig bleibt \\(e\\) — also \\(e = 3\\). Einsetzen des Funktionswertes: $$\\frac{a}{4-2} + 3 = 8 \\;\\Longrightarrow\\; \\frac{a}{2} = 5 \\;\\Longrightarrow\\; a = 10$$ Die Funktion lautet \\(f(x) = \\frac{10}{x-2} + 3\\)." },
      { id: 29, level: 5, typ: "mc", frage: "Zu \\(f(x) = \\frac{1}{x^2+1}\\) wird behauptet: „Der Graph hat die senkrechte Asymptote \\(x = -1\\), weil der Nenner dort null wird.“ Wie ist das zu bewerten?", optionen: ["Richtig, der Nenner verschwindet dort", "Falsch, der Nenner wird nie null", "Falsch, die Asymptote liegt bei \\(x = 1\\)", "Falsch, die Asymptote liegt bei \\(x = 0\\)"], korrekt: 1, tipp: "Setze den behaupteten Wert ein und prüfe den Nenner wirklich nach.", loesungsweg: "Einsetzen: \\((-1)^2 + 1 = 2 \\neq 0\\). Allgemein gilt $$x^2 + 1 \\ge 1 > 0 \\quad \\text{für alle } x$$ Der Nenner wird also nie null, die Funktion ist überall definiert und hat <b>keine</b> senkrechte Asymptote. Waagerechte Asymptote ist \\(y = 0\\)." },
      { id: 30, level: 5, typ: "mc", frage: "Zu \\(f(x) = \\frac{x^2+3x}{2x+1}\\) wird notiert: „Die Vorfaktoren der höchsten Potenzen sind \\(1\\) und \\(2\\), der Grenzwert für \\(x \\to \\infty\\) ist also \\(\\tfrac12\\).“ Wie ist das zu bewerten?", optionen: ["Richtig, die Vorfaktoren entscheiden", "Falsch, der Term wächst über alle Grenzen", "Falsch, der Grenzwert ist \\(2\\)", "Falsch, der Grenzwert ist \\(0\\)"], korrekt: 1, tipp: "Prüfe zuerst, ob die Regel, die hier angewandt wurde, für diese beiden Grade überhaupt gilt.", loesungsweg: "Der Quotient der Vorfaktoren gilt nur bei <b>gleichem</b> Grad. Hier ist der Zählergrad größer: $$\\frac{x^2+3x}{2x+1} \\approx \\frac{x^2}{2x} = \\frac{x}{2} \\longrightarrow \\infty$$ Probe: \\(f(1000) \\approx 500{,}9\\). Es gibt also keinen Grenzwert und keine waagerechte Asymptote." },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Ein Graph schneidet seine waagerechte Asymptote nie.“ Prüfe die Behauptung.", optionen: ["Richtig, er nähert sich ihr nur an", "Falsch, \\(f(x) = \\frac{x}{x^2+1}\\) schneidet sie", "Richtig, sonst wäre es keine Asymptote", "Falsch, jeder Graph schneidet sie einmal"], korrekt: 1, tipp: "Suche eine Funktion, deren Grenzwert null ist und die trotzdem irgendwo den Wert null annimmt.", loesungsweg: "Für \\(f(x) = \\frac{x}{x^2+1}\\) ist \\(y = 0\\) waagerechte Asymptote, denn der Nenner wächst schneller. Zugleich gilt $$f(0) = \\frac{0}{1} = 0$$ Der Graph <b>schneidet</b> die Asymptote also im Ursprung. Entscheidend ist nur das Verhalten für sehr große \\(|x|\\), nicht das in der Mitte — die Behauptung ist falsch." },
      { id: 32, level: 6, typ: "numerisch", frage: "Gegeben sind \\(\\frac{2x+1}{x-3}\\), \\(\\frac{x^2+1}{x+4}\\), \\(\\frac{5}{x^2+1}\\) und \\(\\frac{3x}{x+1}\\). Bei wie vielen dieser Funktionen besitzt der Graph eine waagerechte Asymptote?", loesung: 3, toleranz: 0, tipp: "Vergleiche je Funktion den Grad des Zählers mit dem des Nenners.", loesungsweg: "Fallunterscheidung nach den Graden: Gleicher Grad ergibt die Asymptote aus dem Verhältnis der Vorfaktoren — \\(y = 2\\) bzw. \\(y = 3\\). Kleinerer Zählergrad ergibt \\(y = 0\\). Größerer Zählergrad ergibt keine waagerechte Asymptote: $$\\frac{x^2+1}{x+4} \\longrightarrow \\infty$$ Also haben <b>3</b> der vier Funktionen eine waagerechte Asymptote." },
      { id: 33, level: 6, typ: "numerisch", frage: "Für welche Exponenten \\(n\\) hat \\(f(x) = \\frac{x^n+1}{x^2+3}\\) die waagerechte Asymptote \\(y = 0\\)? Gib die größte natürliche Zahl \\(n\\) an, für die das zutrifft.", loesung: 1, toleranz: 0, tipp: "Unterscheide danach, ob der Zählergrad kleiner, gleich oder größer als der Nennergrad ist.", loesungsweg: "Der Nenner hat den Grad \\(2\\). Fallunterscheidung: Für \\(n < 2\\) wächst der Nenner schneller, der Bruch geht gegen null. Für \\(n = 2\\) ergibt sich \\(y = 1\\), für \\(n > 2\\) wächst der Bruch über alle Grenzen. Also gilt \\(y = 0\\) genau für \\(n \\le 1\\); die größte natürliche Zahl ist <b>1</b>. Probe mit \\(n = 1\\): \\(f(1000) \\approx 0{,}001\\)." },
      { id: 34, level: 6, typ: "mc", frage: "Behauptung: „Ist \\(y = b\\) waagerechte Asymptote für \\(x \\to \\infty\\), so ist sie es auch für \\(x \\to -\\infty\\).“ Prüfe die Behauptung.", optionen: ["Richtig, Asymptoten gelten immer beidseitig", "Falsch, bei \\(f(x) = 2^x + 2\\) nur einseitig", "Richtig, sofern der Nenner linear ist", "Falsch, es gibt nie zwei Asymptoten"], korrekt: 1, tipp: "Suche eine Funktion, die sich an den beiden Rändern völlig verschieden verhält.", loesungsweg: "Gegenbeispiel \\(f(x) = 2^x + 2\\): Für \\(x \\to -\\infty\\) gilt \\(2^x \\to 0\\), also ist \\(y = 2\\) dort waagerechte Asymptote. Für \\(x \\to \\infty\\) dagegen $$2^x + 2 \\longrightarrow \\infty$$ dort gibt es gar keine waagerechte Asymptote. Bei gebrochenen Funktionen mit gleichem Grad stimmen beide Ränder zwar überein, allgemein gilt das aber <b>nicht</b> — die Behauptung ist falsch." },
      { id: 35, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x) = \\frac{ax+b}{x-c}\\) hat die senkrechte Asymptote \\(x = 1\\) und die waagerechte Asymptote \\(y = -2\\); außerdem gilt \\(f(3) = -5{,}5\\). Bestimme \\(b\\).", loesung: -5, toleranz: 0, tipp: "Werte die drei Angaben nacheinander aus; jede legt einen der Parameter fest.", loesungsweg: "Die senkrechte Asymptote liefert \\(c = 1\\), die waagerechte \\(a = -2\\). Aus dem Funktionswert: $$f(3) = \\frac{-6+b}{2} = -5{,}5 \\;\\Longrightarrow\\; -6 + b = -11 \\;\\Longrightarrow\\; b = -5$$ Die Funktion lautet \\(f(x) = \\frac{-2x-5}{x-1}\\). Probe: \\(f(3) = \\frac{-11}{2} = -5{,}5\\) ✓" },
      { id: 36, level: 6, typ: "mc", frage: "Behauptung: „Für \\(x \\to \\infty\\) nähert sich \\(2^x - x^5\\) dem Wert null, weil beide Teile über alle Grenzen wachsen.“ Prüfe die Behauptung.", optionen: ["Richtig, die Teile heben sich auf", "Falsch, der Term wächst über alle Grenzen", "Falsch, der Term strebt gegen \\(-\\infty\\)", "Richtig, aber erst ab sehr großen \\(x\\)"], korrekt: 1, tipp: "Vergleiche an zwei weit auseinanderliegenden Stellen, welcher der beiden Teile den anderen überholt.", loesungsweg: "Bei \\(x = 10\\) ist \\(2^{10} = 1024\\) noch viel kleiner als \\(10^5 = 100\\,000\\). Bei \\(x = 100\\) dagegen: $$2^{100} \\approx 1{,}27 \\cdot 10^{30} \\quad\\text{gegen}\\quad 100^5 = 10^{10}$$ Exponentielles Wachstum überholt jede Potenzfunktion, also strebt der Term über alle Grenzen. Dass beide Teile wachsen, sagt für sich genommen nichts über die Differenz — die Behauptung ist falsch." }];
