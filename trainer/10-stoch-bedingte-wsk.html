<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedingte Wahrscheinlichkeit - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-stoch-bedingte-wsk';
    const THEMA_CONFIG = { name: 'Bedingte Wahrscheinlichkeit', bereich: 'stochastik' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundlagen ==========
      { id: 1, level: 1, typ: "mc", frage: "Wie liest man \\(P(A|B)\\)?", optionen: ["A und B", "A oder B", "A unter der Bedingung B", "A ohne B"], korrekt: 2, tipp: "Der senkrechte Strich bedeutet „unter der Bedingung\".", loesungsweg: "\\(P(A|B)\\) = Wahrscheinlichkeit von A unter der Bedingung, dass B bereits eingetreten ist." },
      { id: 2, level: 1, typ: "mc", frage: "Welche Formel definiert die bedingte Wahrscheinlichkeit?", optionen: ["\\(P(A|B) = P(A) \\cdot P(B)\\)", "\\(P(A|B) = \\tfrac{P(A \\cap B)}{P(B)}\\)", "\\(P(A|B) = P(A) + P(B)\\)", "\\(P(A|B) = \\tfrac{P(A)}{P(B)}\\)"], korrekt: 1, tipp: "Im Zähler steht die Wahrscheinlichkeit des gemeinsamen Auftretens.", loesungsweg: "\\(P(A|B) = \\tfrac{P(A \\cap B)}{P(B)}\\), vorausgesetzt \\(P(B) > 0\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Wann sind zwei Ereignisse \\(A, B\\) stochastisch unabhängig?", optionen: ["Wenn \\(P(A \\cap B) = 0\\)", "Wenn \\(P(A \\cap B) = P(A) \\cdot P(B)\\)", "Wenn \\(P(A) = P(B)\\)", "Wenn sie sich ausschließen"], korrekt: 1, tipp: "Multiplikationsregel der Wahrscheinlichkeiten.", loesungsweg: "Unabhängigkeit: \\(P(A \\cap B) = P(A) \\cdot P(B)\\). Äquivalent: \\(P(A|B) = P(A)\\)." },
      { id: 4, level: 1, typ: "mc", frage: "\\(P(A) = 0{,}4, P(B) = 0{,}5\\), und \\(A, B\\) unabhängig. Berechne \\(P(A \\cap B)\\).", optionen: ["\\(0{,}9\\)", "\\(0{,}2\\)", "\\(0{,}1\\)", "\\(0{,}45\\)"], korrekt: 1, tipp: "Bei Unabhängigkeit: Produkt.", loesungsweg: "\\(0{,}4 \\cdot 0{,}5 = 0{,}2\\)." },
      { id: 5, level: 1, typ: "mc", frage: "In einer Urne sind 3 rote und 2 blaue Kugeln. \\(P(\\text{rot})\\) = ?", optionen: ["\\(\\tfrac{2}{5}\\)", "\\(\\tfrac{3}{5}\\)", "\\(\\tfrac{1}{3}\\)", "\\(\\tfrac{1}{2}\\)"], korrekt: 1, tipp: "Günstig durch gesamt.", loesungsweg: "\\(P(\\text{rot}) = \\tfrac{3}{5}\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Ein Würfel wird 1x geworfen. \\(P(\\text{gerade Zahl})\\) = ?", optionen: ["\\(\\tfrac{1}{6}\\)", "\\(\\tfrac{1}{3}\\)", "\\(\\tfrac{1}{2}\\)", "\\(\\tfrac{2}{3}\\)"], korrekt: 2, tipp: "2, 4, 6 sind gerade → 3 von 6.", loesungsweg: "\\(P = \\tfrac{3}{6} = \\tfrac{1}{2}\\)." },
      // ========== LEVEL 2 — Vierfeldertafel ==========
      { id: 7, level: 2, typ: "numerisch", frage: "100 Personen: 60 Frauen, davon 30 Sportler. 40 Männer, davon 20 Sportler. Wie groß ist \\(P(\\text{Frau})\\)? (Dezimal)", loesung: 0.6, toleranz: 0.01, tipp: "60 von 100.", loesungsweg: "\\(P(F) = \\tfrac{60}{100} = 0{,}6\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Gleiche Situation: \\(P(\\text{Sportler})\\)?", loesung: 0.5, toleranz: 0.01, tipp: "30 + 20 = 50 Sportler von 100.", loesungsweg: "\\(P(S) = \\tfrac{50}{100} = 0{,}5\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Gleiche Situation: \\(P(\\text{Frau und Sportlerin}) = P(F \\cap S)\\)?", loesung: 0.3, toleranz: 0.01, tipp: "30 Frauen sind Sportler.", loesungsweg: "\\(P(F \\cap S) = \\tfrac{30}{100} = 0{,}3\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Gleiche Situation: \\(P(S|F)\\) — wie wahrscheinlich ist Sport, gegeben die Person ist eine Frau?", loesung: 0.5, toleranz: 0.01, tipp: "\\(\\tfrac{P(S \\cap F)}{P(F)} = \\tfrac{0{,}3}{0{,}6}\\). Oder: 30 von 60 Frauen.", loesungsweg: "\\(P(S|F) = \\tfrac{30}{60} = 0{,}5\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Gleiche Situation: \\(P(F|S)\\) — wie wahrscheinlich ist Frau, gegeben Sportler?", loesung: 0.6, toleranz: 0.01, tipp: "30 Frauen von 50 Sportlern.", loesungsweg: "\\(P(F|S) = \\tfrac{30}{50} = 0{,}6\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Sind \\(F\\) und \\(S\\) in obigem Beispiel unabhängig?", optionen: ["Ja", "Nein", "Kann man nicht sagen", "Nur bei Frauen"], korrekt: 0, tipp: "Vergleiche \\(P(S) = 0{,}5\\) mit \\(P(S|F) = 0{,}5\\).", loesungsweg: "\\(P(S|F) = 0{,}5 = P(S)\\) — also unabhängig. Auch \\(P(F \\cap S) = 0{,}3 = 0{,}6 \\cdot 0{,}5\\)." },
      // ========== LEVEL 3 — Baumdiagramm + Pfadregel ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Aus einer Urne (4 rote, 6 blaue Kugeln) wird 2x ohne Zurücklegen gezogen. Berechne \\(P(\\text{rot, rot})\\) (3 Dezimalen).", loesung: 0.133, toleranz: 0.005, tipp: "\\(\\tfrac{4}{10} \\cdot \\tfrac{3}{9}\\).", loesungsweg: "\\(P(rr) = \\tfrac{4}{10} \\cdot \\tfrac{3}{9} = \\tfrac{12}{90} \\approx 0{,}133\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Gleiche Urne, mit Zurücklegen, 2x ziehen. \\(P(\\text{rot, rot})\\) (2 Dezimalen).", loesung: 0.16, toleranz: 0.005, tipp: "\\(\\tfrac{4}{10} \\cdot \\tfrac{4}{10}\\).", loesungsweg: "\\(P(rr) = 0{,}4^2 = 0{,}16\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Eine Krankheit trifft 1 % der Bevölkerung. Ein Test ist zu 99 % zuverlässig (richtig positiv) und 98 % spezifisch (richtig negativ). Wie groß ist \\(P(\\text{positiv} \\cap \\text{krank})\\) (4 Dezimalen)?", loesung: 0.0099, toleranz: 0.0005, tipp: "\\(P(\\text{krank}) \\cdot P(\\text{positiv}|\\text{krank}) = 0{,}01 \\cdot 0{,}99\\).", loesungsweg: "\\(0{,}01 \\cdot 0{,}99 = 0{,}0099\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "(Gleiche Situation:) Wie groß ist \\(P(\\text{positiv})\\) insgesamt (4 Dezimalen)?", loesung: 0.0297, toleranz: 0.001, tipp: "\\(0{,}01 \\cdot 0{,}99 + 0{,}99 \\cdot 0{,}02\\) (falsch positiv).", loesungsweg: "\\(P(+) = 0{,}01 \\cdot 0{,}99 + 0{,}99 \\cdot 0{,}02 = 0{,}0099 + 0{,}0198 = 0{,}0297\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "(Gleiche Situation:) Berechne \\(P(\\text{krank}|\\text{positiv})\\) (2 Dezimalen — Bayes).", loesung: 0.33, toleranz: 0.02, tipp: "\\(\\tfrac{P(\\text{krank} \\cap \\text{positiv})}{P(\\text{positiv})} = \\tfrac{0{,}0099}{0{,}0297}\\).", loesungsweg: "\\(P(k|+) = \\tfrac{0{,}0099}{0{,}0297} \\approx 0{,}333\\). Obwohl der Test „99% sicher\" ist, ist bei positivem Test die tatsächliche Erkrankungswahrscheinlichkeit nur 33% — wegen der niedrigen Vorabwahrscheinlichkeit!" },
      { id: 18, level: 3, typ: "mc", frage: "Pfadregel: Entlang eines Pfades im Baumdiagramm werden die Wahrscheinlichkeiten …", optionen: ["addiert", "multipliziert", "subtrahiert", "geteilt"], korrekt: 1, tipp: "Multiplikations-Pfadregel.", loesungsweg: "Entlang eines Pfades: multiplizieren. Summenregel: bei mehreren günstigen Pfaden addieren." },
      // ========== LEVEL 4 — Bayes ==========
      { id: 19, level: 4, typ: "mc", frage: "Der Satz von Bayes lautet:", optionen: ["\\(P(A|B) = P(A) \\cdot P(B)\\)", "\\(P(A|B) = \\tfrac{P(B|A) \\cdot P(A)}{P(B)}\\)", "\\(P(A|B) = \\tfrac{P(A)}{P(B)}\\)", "\\(P(A|B) = P(B|A)\\)"], korrekt: 1, tipp: "Der Satz verknüpft \\(P(A|B)\\) und \\(P(B|A)\\).", loesungsweg: "\\(P(A|B) = \\tfrac{P(B|A) P(A)}{P(B)}\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Urne: 4 rote, 6 blaue, ziehe 2 ohne Zurücklegen. \\(P(\\text{2. rot} | \\text{1. rot})\\)?", loesung: 0.333, toleranz: 0.01, tipp: "Nach 1 roter Kugel: 3 von 9 Kugeln sind rot.", loesungsweg: "\\(P = \\tfrac{3}{9} \\approx 0{,}333\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Zwei Schüler: 70 % bestehen die Klausur. \\(P(\\text{beide bestehen})\\) bei Unabhängigkeit (2 Dezimalen)?", loesung: 0.49, toleranz: 0.01, tipp: "\\(0{,}7 \\cdot 0{,}7\\).", loesungsweg: "\\(0{,}7^2 = 0{,}49\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(P(A) = 0{,}3, P(B) = 0{,}5, P(A \\cap B) = 0{,}2\\). Berechne \\(P(A|B)\\) (1 Dezimale).", loesung: 0.4, toleranz: 0.01, tipp: "\\(\\tfrac{P(A \\cap B)}{P(B)} = \\tfrac{0{,}2}{0{,}5}\\).", loesungsweg: "\\(P(A|B) = \\tfrac{0{,}2}{0{,}5} = 0{,}4\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(P(A) = 0{,}3, P(B) = 0{,}5, P(A \\cap B) = 0{,}2\\). Berechne \\(P(B|A)\\) (3 Dezimalen).", loesung: 0.667, toleranz: 0.01, tipp: "\\(\\tfrac{P(A \\cap B)}{P(A)}\\).", loesungsweg: "\\(P(B|A) = \\tfrac{0{,}2}{0{,}3} \\approx 0{,}667\\)." },
      { id: 24, level: 4, typ: "mc", frage: "Wenn \\(A, B\\) unabhängig sind, gilt stets:", optionen: ["\\(P(A|B) = 0\\)", "\\(P(A|B) = P(A)\\)", "\\(P(A|B) = P(B)\\)", "\\(P(A|B) = 1\\)"], korrekt: 1, tipp: "Die Bedingung ändert die W. nicht.", loesungsweg: "Bei Unabhängigkeit beeinflusst \\(B\\) die Wahrscheinlichkeit von \\(A\\) nicht: \\(P(A|B) = P(A)\\)." },
      // ========== LEVEL 5 — Anwendungen ==========
      { id: 25, level: 5, typ: "numerisch", frage: "In einer Schule: 60 % lernen Englisch, 40 % Französisch, 20 % beides. Berechne \\(P(\\text{Französisch} | \\text{Englisch})\\) (3 Dezimalen).", loesung: 0.333, toleranz: 0.01, tipp: "\\(\\tfrac{0{,}2}{0{,}6}\\).", loesungsweg: "\\(P(F|E) = \\tfrac{0{,}2}{0{,}6} = \\tfrac{1}{3} \\approx 0{,}333\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "In einer Urne: 3 rote, 5 blaue. 2x ohne Zurücklegen. \\(P(\\text{gleichfarbig})\\) (3 Dezimalen).", loesung: 0.464, toleranz: 0.01, tipp: "\\(P(rr) + P(bb) = \\tfrac{3}{8}\\tfrac{2}{7} + \\tfrac{5}{8}\\tfrac{4}{7}\\).", loesungsweg: "\\(\\tfrac{6}{56} + \\tfrac{20}{56} = \\tfrac{26}{56} \\approx 0{,}464\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Aus 100 Glühbirnen sind 5 defekt. Man zieht 2 ohne Zurücklegen. \\(P(\\text{mindestens 1 defekt})\\) (3 Dezimalen).", loesung: 0.098, toleranz: 0.005, tipp: "\\(1 - P(\\text{keine defekt})\\).", loesungsweg: "\\(P(\\text{keine def.}) = \\tfrac{95}{100} \\cdot \\tfrac{94}{99} \\approx 0{,}9019 \\Rightarrow 1 - 0{,}9019 = 0{,}0981\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Zwei Würfel werden geworfen. \\(P(\\text{Summe} = 7 | \\text{erster Würfel} = 3)\\)?", loesung: 0.167, toleranz: 0.01, tipp: "Nur 4 auf dem 2. Würfel ergibt Summe 7.", loesungsweg: "Bei 1. Würfel = 3 ist \\(P = \\tfrac{1}{6} \\approx 0{,}167\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "In Firma X sind 70 % Männer. Von den Männern sind 40 % Ingenieure, von den Frauen 20 %. Wahrscheinlichkeit, dass ein zufällig Ausgewählter Ingenieur ist (2 Dezimalen).", loesung: 0.34, toleranz: 0.01, tipp: "\\(0{,}7 \\cdot 0{,}4 + 0{,}3 \\cdot 0{,}2\\).", loesungsweg: "\\(P = 0{,}28 + 0{,}06 = 0{,}34\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "(Gleiche Firma:) Ein zufälliger Ingenieur — wie groß ist \\(P(\\text{Mann}|\\text{Ingenieur})\\) (3 Dezimalen)?", loesung: 0.824, toleranz: 0.01, tipp: "Bayes: \\(\\tfrac{0{,}28}{0{,}34}\\).", loesungsweg: "\\(P(M|I) = \\tfrac{0{,}28}{0{,}34} \\approx 0{,}824\\)." },
      // ========== LEVEL 6 — Transfer ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Drei Maschinen produzieren: M1 50 % (Ausschussrate 2 %), M2 30 % (3 %), M3 20 % (5 %). Gesamtausschussrate (4 Dezimalen)?", loesung: 0.0290, toleranz: 0.001, tipp: "\\(0{,}5 \\cdot 0{,}02 + 0{,}3 \\cdot 0{,}03 + 0{,}2 \\cdot 0{,}05\\).", loesungsweg: "\\(0{,}01 + 0{,}009 + 0{,}01 = 0{,}029\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "(Gleiche Situation:) Ein Stück ist defekt. \\(P(\\text{von M3})\\) (3 Dezimalen)?", loesung: 0.345, toleranz: 0.01, tipp: "\\(\\tfrac{0{,}2 \\cdot 0{,}05}{0{,}029}\\).", loesungsweg: "\\(\\tfrac{0{,}01}{0{,}029} \\approx 0{,}345\\)." },
      { id: 33, level: 6, typ: "numerisch", frage: "Ziehen ohne Zurücklegen aus 5 Karten (3 Herz, 2 Kreuz). \\(P(\\text{1. Herz} \\cap \\text{2. Kreuz})\\) (3 Dezimalen).", loesung: 0.3, toleranz: 0.01, tipp: "\\(\\tfrac{3}{5} \\cdot \\tfrac{2}{4}\\).", loesungsweg: "\\(\\tfrac{3}{5} \\cdot \\tfrac{2}{4} = \\tfrac{6}{20} = 0{,}3\\)." },
      { id: 34, level: 6, typ: "mc", frage: "Was ist bei \\(P(A \\cup B) = P(A) + P(B)\\) stets wahr?", optionen: ["A und B sind unabhängig", "A und B sind unvereinbar (disjunkt)", "A und B sind gleich", "A ist Teilmenge von B"], korrekt: 1, tipp: "Nur dann verschwindet der Durchschnittsterm.", loesungsweg: "\\(P(A \\cup B) = P(A) + P(B) - P(A \\cap B)\\). Also \\(P(A \\cap B) = 0\\), d. h. A und B sind unvereinbar." },
      { id: 35, level: 6, typ: "numerisch", frage: "\\(P(A) = 0{,}6, P(B) = 0{,}5, P(A \\cup B) = 0{,}8\\). Berechne \\(P(A \\cap B)\\).", loesung: 0.3, toleranz: 0.01, tipp: "\\(P(A \\cup B) = P(A) + P(B) - P(A \\cap B)\\).", loesungsweg: "\\(0{,}8 = 0{,}6 + 0{,}5 - x \\Rightarrow x = 0{,}3\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Zwei Personen geben unabhängig voneinander richtige Antwort mit Wsk. 0{,}8 bzw. 0{,}7. \\(P(\\text{mind. eine richtig})\\) (3 Dezimalen).", loesung: 0.94, toleranz: 0.01, tipp: "\\(1 - P(\\text{beide falsch}) = 1 - 0{,}2 \\cdot 0{,}3\\).", loesungsweg: "\\(1 - 0{,}06 = 0{,}94\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
