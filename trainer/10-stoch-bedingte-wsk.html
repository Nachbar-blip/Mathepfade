<head>

    <title>Bedingte Wahrscheinlichkeit - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-stoch-bedingte-wsk';
    const THEMA_CONFIG = { name: 'Bedingte Wahrscheinlichkeit', bereich: 'stochastik' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundlagen ==========
      { id: 1, level: 1, typ: "mc", frage: "Wie liest man \\(P(A|B)\\)?", optionen: ["A und B", "A oder B", "A unter der Bedingung B", "A ohne B"], korrekt: 2, tipp: "Der senkrechte Strich bedeutet „unter der Bedingung\".", loesungsweg: "\\(P(A|B)\\) = Wahrscheinlichkeit von A unter der Bedingung, dass B bereits eingetreten ist." },
      { id: 2, level: 1, typ: "mc", frage: "Welche Formel definiert die bedingte Wahrscheinlichkeit?", optionen: ["\\(P(A|B) = P(A) \\cdot P(B)\\)", "\\(P(A|B) = \\tfrac{P(A \\cap B)}{P(B)}\\)", "\\(P(A|B) = P(A) + P(B)\\)", "\\(P(A|B) = \\tfrac{P(A)}{P(B)}\\)"], korrekt: 1, tipp: "Im Zähler steht die Wahrscheinlichkeit des gemeinsamen Auftretens.", loesungsweg: "Die bedingte Wahrscheinlichkeit schränkt den Ergebnisraum auf \\(B\\) ein. Man fragt also, welcher Anteil von \\(B\\) zugleich in \\(A\\) liegt: $$P(A|B) = \\frac{P(A \\cap B)}{P(B)}, \\qquad P(B) > 0$$ Im Zähler steht das <b>gemeinsame</b> Auftreten, im Nenner die Bedingung." },
      { id: 3, level: 1, typ: "mc", frage: "Wann sind zwei Ereignisse \\(A, B\\) stochastisch unabhängig?", optionen: ["Wenn \\(P(A \\cap B) = 0\\)", "Wenn \\(P(A \\cap B) = P(A) \\cdot P(B)\\)", "Wenn \\(P(A) = P(B)\\)", "Wenn sie sich ausschließen"], korrekt: 1, tipp: "Multiplikationsregel der Wahrscheinlichkeiten.", loesungsweg: "Unabhängigkeit: \\(P(A \\cap B) = P(A) \\cdot P(B)\\). Äquivalent: \\(P(A|B) = P(A)\\)." },
      { id: 4, level: 1, typ: "mc", frage: "\\(P(A) = 0{,}4, P(B) = 0{,}5\\), und \\(A, B\\) unabhängig. Berechne \\(P(A \\cap B)\\).", optionen: ["\\(0{,}9\\)", "\\(0{,}2\\)", "\\(0{,}1\\)", "\\(0{,}45\\)"], korrekt: 1, tipp: "Bei Unabhängigkeit: Produkt.", loesungsweg: "Unabhängigkeit bedeutet gerade, dass sich die Wahrscheinlichkeiten multiplizieren: $$P(A \\cap B) = P(A) \\cdot P(B) = 0{,}4 \\cdot 0{,}5 = 0{,}2$$ Ohne die Voraussetzung der Unabhängigkeit wäre diese Rechnung unzulässig." },
      { id: 5, level: 1, typ: "mc", frage: "In einer Urne sind 3 rote und 2 blaue Kugeln. \\(P(\\text{rot})\\) = ?", optionen: ["\\(\\tfrac{2}{5}\\)", "\\(\\tfrac{3}{5}\\)", "\\(\\tfrac{1}{3}\\)", "\\(\\tfrac{1}{2}\\)"], korrekt: 1, tipp: "Günstig durch gesamt.", loesungsweg: "Nach Laplace: günstige durch mögliche Fälle. $$P(\\text{rot}) = \\frac{3}{3+2} = \\frac35$$" },
      { id: 6, level: 1, typ: "mc", frage: "Ein Würfel wird 1x geworfen. \\(P(\\text{gerade Zahl})\\) = ?", optionen: ["\\(\\tfrac{1}{6}\\)", "\\(\\tfrac{1}{3}\\)", "\\(\\tfrac{1}{2}\\)", "\\(\\tfrac{2}{3}\\)"], korrekt: 2, tipp: "2, 4, 6 sind gerade → 3 von 6.", loesungsweg: "\\(P = \\tfrac{3}{6} = \\tfrac{1}{2}\\)." },
      // ========== LEVEL 2 — Vierfeldertafel ==========
      { id: 7, level: 2, typ: "numerisch", frage: "100 Personen: 60 Frauen, davon 30 Sportler. 40 Männer, davon 20 Sportler. Wie groß ist \\(P(\\text{Frau})\\)? (Dezimal)", loesung: 0.6, toleranz: 0.01, tipp: "60 von 100.", loesungsweg: "\\(P(F) = \\tfrac{60}{100} = 0{,}6\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "100 Personen: 60 Frauen, davon 30 Sportler; 40 M\u00e4nner, davon 20 Sportler. Wie gro\u00df ist \\(P(\\text{Sportler})\\)?", loesung: 0.5, toleranz: 0.01, tipp: "30 + 20 = 50 Sportler von 100.", loesungsweg: "\\(P(S) = \\tfrac{50}{100} = 0{,}5\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "100 Personen: 60 Frauen, davon 30 Sportler; 40 M\u00e4nner, davon 20 Sportler. Wie gro\u00df ist \\(P(\\text{Frau und Sportlerin}) = P(F \\cap S)\\)?", loesung: 0.3, toleranz: 0.01, tipp: "30 Frauen sind Sportler.", loesungsweg: "\\(P(F \\cap S) = \\tfrac{30}{100} = 0{,}3\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "100 Personen: 60 Frauen, davon 30 Sportler; 40 M\u00e4nner, davon 20 Sportler. Wie gro\u00df ist \\(P(S|F)\\) \u2014 wie wahrscheinlich ist Sport, gegeben die Person ist eine Frau?", loesung: 0.5, toleranz: 0.01, tipp: "\\(\\tfrac{P(S \\cap F)}{P(F)} = \\tfrac{0{,}3}{0{,}6}\\). Oder: 30 von 60 Frauen.", loesungsweg: "\\(P(S|F) = \\tfrac{30}{60} = 0{,}5\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "100 Personen: 60 Frauen, davon 30 Sportler; 40 M\u00e4nner, davon 20 Sportler. Wie gro\u00df ist \\(P(F|S)\\) \u2014 wie wahrscheinlich ist Frau, gegeben Sportler?", loesung: 0.6, toleranz: 0.01, tipp: "30 Frauen von 50 Sportlern.", loesungsweg: "\\(P(F|S) = \\tfrac{30}{50} = 0{,}6\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Unter 100 Personen sind 60 Frauen, davon 30 Sportlerinnen; von den 40 Männern treiben 20 Sport. Sind die Merkmale Geschlecht (\\(F\\)) und Sport (\\(S\\)) stochastisch unabhängig?", optionen: ["Ja", "Nein", "Kann man nicht sagen", "Nur bei den Frauen"], korrekt: 0, tipp: "Vergleiche den Sportleranteil in einer Teilgruppe mit dem Anteil in der Gesamtgruppe.", loesungsweg: "\\(P(S) = \\tfrac{50}{100} = 0{,}5\\) und \\(P(S|F) = \\tfrac{30}{60} = 0{,}5\\) — die Bedingung ändert nichts, also unabhängig. Auch das Produktkriterium passt: \\(P(F \\cap S) = 0{,}3 = 0{,}6 \\cdot 0{,}5\\)." },
      // ========== LEVEL 3 — Baumdiagramm + Pfadregel ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Aus einer Urne (4 rote, 6 blaue Kugeln) wird 2x ohne Zurücklegen gezogen. Berechne \\(P(\\text{rot, rot})\\) (3 Dezimalen).", loesung: 0.133, toleranz: 0.005, tipp: "\\(\\tfrac{4}{10} \\cdot \\tfrac{3}{9}\\).", loesungsweg: "\\(P(rr) = \\tfrac{4}{10} \\cdot \\tfrac{3}{9} = \\tfrac{12}{90} \\approx 0{,}133\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Aus einer Urne (4 rote, 6 blaue Kugeln) wird 2x MIT Zur\u00fccklegen gezogen. \\(P(\\text{rot, rot})\\) (2 Dezimalen).", loesung: 0.16, toleranz: 0.005, tipp: "\\(\\tfrac{4}{10} \\cdot \\tfrac{4}{10}\\).", loesungsweg: "\\(P(rr) = 0{,}4^2 = 0{,}16\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Eine Krankheit trifft 1 % der Bevölkerung. Ein Test ist zu 99 % zuverlässig (richtig positiv) und 98 % spezifisch (richtig negativ). Wie groß ist \\(P(\\text{positiv} \\cap \\text{krank})\\) (4 Dezimalen)?", loesung: 0.0099, toleranz: 0.0005, tipp: "\\(P(\\text{krank}) \\cdot P(\\text{positiv}|\\text{krank}) = 0{,}01 \\cdot 0{,}99\\).", loesungsweg: "Nach der Pfadregel wird entlang des Pfades „krank und positiv\" multipliziert: $$P(\\text{krank}) \\cdot P(\\text{positiv}|\\text{krank}) = 0{,}01 \\cdot 0{,}99 = 0{,}0099$$ Gesucht ist hier der <b>Schnitt</b>, nicht die bedingte Wahrscheinlichkeit — die Spezifität von \\(98\\,\\%\\) spielt für diesen Pfad keine Rolle." },
      { id: 16, level: 3, typ: "numerisch", frage: "Eine Krankheit trifft 1 % der Bevölkerung. Ein Test erkennt 99 % der Kranken und schlägt bei 2 % der Gesunden fälschlich an. Wie groß ist \\(P(\\text{positiv})\\) insgesamt? (4 Dezimalen)", loesung: 0.0297, toleranz: 0.001, tipp: "Zwei Pfade des Baumdiagramms führen zu einem positiven Ergebnis: Kranke und fälschlich getestete Gesunde.", loesungsweg: "\\(P(+) = 0{,}01 \\cdot 0{,}99 + 0{,}99 \\cdot 0{,}02 = 0{,}0099 + 0{,}0198 = 0{,}0297\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Eine Krankheit trifft 1 % der Bevölkerung. Ein Test erkennt 99 % der Kranken und schlägt bei 2 % der Gesunden fälschlich an. Eine Person ist positiv getestet. Wie groß ist \\(P(\\text{krank}|\\text{positiv})\\)? (2 Dezimalen)", loesung: 0.33, toleranz: 0.02, tipp: "Teile den Pfad der positiv getesteten Kranken durch die Wahrscheinlichkeit aller positiven Ergebnisse.", loesungsweg: "\\(P(k|+) = \\tfrac{0{,}0099}{0{,}0297} \\approx 0{,}333\\). Obwohl der Test „zu 99 % sicher“ heißt, ist bei positivem Ergebnis nur etwa jede dritte Person wirklich krank — die geringe Grundrate von 1 % erzeugt sehr viele falsch positive Fälle." },
      { id: 18, level: 3, typ: "mc", frage: "Pfadregel: Entlang eines Pfades im Baumdiagramm werden die Wahrscheinlichkeiten …", optionen: ["addiert", "multipliziert", "subtrahiert", "geteilt"], korrekt: 1, tipp: "Multiplikations-Pfadregel.", loesungsweg: "Entlang eines Pfades: multiplizieren. Summenregel: bei mehreren günstigen Pfaden addieren." },
      // ========== LEVEL 4 — Bayes ==========
      { id: 19, level: 4, typ: "numerisch", frage: "In einer Klasse mit 25 Schülern spielen 15 ein Instrument, 10 singen im Chor, 6 tun beides. Ein Schüler dieser Klasse singt im Chor. Mit welcher Wahrscheinlichkeit spielt er auch ein Instrument? (1 Dezimale)", loesung: 0.6, toleranz: 0.01, tipp: "Die Bedingung schränkt die Grundmenge ein: Nur die Chorsänger zählen noch.", loesungsweg: "Die Bedingung „singt im Chor“ macht die 10 Chorsänger zur neuen Grundmenge. Von ihnen spielen 6 auch ein Instrument: $$P(I \\mid C) = \\frac{6}{10} = 0{,}6$$ Ohne Bedingung wäre \\(P(I) = \\tfrac{15}{25} = 0{,}6\\) — hier zufällig derselbe Wert, die beiden Merkmale sind also unabhängig. Die Zahl 25 wird für die bedingte Wahrscheinlichkeit gar nicht gebraucht." },
      { id: 20, level: 4, typ: "numerisch", frage: "Urne: 4 rote, 6 blaue, ziehe 2 ohne Zurücklegen. \\(P(\\text{2. rot} | \\text{1. rot})\\)?", loesung: 0.333, toleranz: 0.01, tipp: "Nach 1 roter Kugel: 3 von 9 Kugeln sind rot.", loesungsweg: "Ohne Zurücklegen ändert die erste Ziehung die Urne: Nach einer entnommenen roten Kugel bleiben \\(3\\) rote unter \\(9\\) Kugeln. $$P(\\text{2. rot} \\mid \\text{1. rot}) = \\frac39 = \\frac13 \\approx 0{,}333$$ Ursprünglich lag die Wahrscheinlichkeit bei \\(\\tfrac{4}{10} = 0{,}4\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Zwei Schüler: 70 % bestehen die Klausur. \\(P(\\text{beide bestehen})\\) bei Unabhängigkeit (2 Dezimalen)?", loesung: 0.49, toleranz: 0.01, tipp: "\\(0{,}7 \\cdot 0{,}7\\).", loesungsweg: "Bei Unabhängigkeit wird multipliziert: $$0{,}7 \\cdot 0{,}7 = 0{,}49$$ Knapp die Hälfte also — deutlich weniger als die \\(70\\,\\%\\) des Einzelnen. Je mehr unabhängige Bedingungen zugleich erfüllt sein müssen, desto kleiner wird die Wahrscheinlichkeit." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(P(A) = 0{,}3, P(B) = 0{,}5, P(A \\cap B) = 0{,}2\\). Berechne \\(P(A|B)\\) (1 Dezimale).", loesung: 0.4, toleranz: 0.01, tipp: "\\(\\tfrac{P(A \\cap B)}{P(B)} = \\tfrac{0{,}2}{0{,}5}\\).", loesungsweg: "\\(P(A|B) = \\tfrac{0{,}2}{0{,}5} = 0{,}4\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(P(A) = 0{,}3, P(B) = 0{,}5, P(A \\cap B) = 0{,}2\\). Berechne \\(P(B|A)\\) (3 Dezimalen).", loesung: 0.667, toleranz: 0.01, tipp: "\\(\\tfrac{P(A \\cap B)}{P(A)}\\).", loesungsweg: "$$P(B|A) = \\frac{P(A \\cap B)}{P(A)} = \\frac{0{,}2}{0{,}3} \\approx 0{,}667$$ Im Nenner steht die <b>Bedingung</b> \\(A\\). Umgekehrt wäre \\(P(A|B) = \\tfrac{0{,}2}{0{,}5} = 0{,}4\\) — ein ganz anderer Wert." },
      { id: 24, level: 4, typ: "mc", frage: "Wenn \\(A, B\\) unabhängig sind, gilt stets:", optionen: ["\\(P(A|B) = 0\\)", "\\(P(A|B) = P(A)\\)", "\\(P(A|B) = P(B)\\)", "\\(P(A|B) = 1\\)"], korrekt: 1, tipp: "Die Bedingung ändert die W. nicht.", loesungsweg: "Bei Unabhängigkeit beeinflusst \\(B\\) die Wahrscheinlichkeit von \\(A\\) nicht: \\(P(A|B) = P(A)\\)." },
      // ========== LEVEL 5 — Anwendungen ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Von 200 Haushalten besitzen 120 ein Fahrrad und 80 ein Auto; 30 Haushalte besitzen beides. Wie groß ist die Wahrscheinlichkeit, dass ein zufällig gewählter Haushalt genau eines der beiden Fahrzeuge besitzt? (2 Dezimalen)", loesung: 0.7, toleranz: 0.01, tipp: "Trage die vier Zellen einer Vierfeldertafel ein; „genau eines“ sind zwei dieser Zellen.", loesungsweg: "Erst die Tafel füllen: nur Fahrrad \\(120 - 30 = 90\\), nur Auto \\(80 - 30 = 50\\), beides \\(30\\), keines \\(200 - 90 - 50 - 30 = 30\\). „Genau eines“ umfasst die beiden Einzel-Zellen: $$P = \\frac{90 + 50}{200} = \\frac{140}{200} = 0{,}70$$ Wer \\(\\tfrac{120 + 80}{200} = 1{,}0\\) rechnet, zählt die 30 Doppelbesitzer zweimal und meint außerdem „mindestens eines“." },
      { id: 26, level: 5, typ: "mc", frage: "Gegeben sind \\(P(A) = 0{,}4\\), \\(P(B) = 0{,}25\\) und \\(P(A \\cap B) = 0{,}1\\). Jemand rechnet \\(P(B \\mid A) = \\tfrac{0{,}1}{0{,}25} = 0{,}4\\). Was ist daran falsch?", optionen: ["Im Nenner muss die Bedingung \\(A\\) stehen, nicht \\(B\\)", "Im Zähler muss das Produkt \\(P(A) \\cdot P(B)\\) stehen", "Die beiden Einzelwahrscheinlichkeiten sind zu addieren", "Der Bruch ist am Ende noch mit \\(100\\) zu erweitern"], korrekt: 0, tipp: "Schreibe die Definition der bedingten Wahrscheinlichkeit hin und sieh nach, welches Ereignis dort im Nenner steht.", loesungsweg: "Die Definition lautet \\(P(B \\mid A) = \\tfrac{P(A \\cap B)}{P(A)}\\) — im Nenner steht immer die <b>Bedingung</b>. Richtig ist also $$P(B \\mid A) = \\frac{0{,}1}{0{,}4} = 0{,}25$$ Der gerechnete Wert \\(0{,}4\\) ist gerade \\(P(A \\mid B)\\); die beiden Größen wurden vertauscht. Als Kontrolle: \\(P(A) \\cdot P(B) = 0{,}4 \\cdot 0{,}25 = 0{,}1 = P(A \\cap B)\\), die Ereignisse sind unabhängig, und tatsächlich ist \\(P(B \\mid A) = 0{,}25 = P(B)\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Unter 400 Befragten sind 250 weiblich und 160 tragen eine Brille. Wie viele weibliche Brillenträgerinnen müsste die Vierfeldertafel enthalten, damit Geschlecht und Brille stochastisch unabhängig wären?", loesung: 100, toleranz: 0.5, tipp: "Bestimme zuerst die beiden Randwahrscheinlichkeiten und überlege, was Unabhängigkeit über die Eckzelle verlangt.", loesungsweg: "Randwahrscheinlichkeiten: \\(P(w) = \\tfrac{250}{400} = 0{,}625\\) und \\(P(B) = \\tfrac{160}{400} = 0{,}4\\). Unabhängigkeit verlangt $$P(w \\cap B) = P(w) \\cdot P(B) = 0{,}625 \\cdot 0{,}4 = 0{,}25$$ also \\(0{,}25 \\cdot 400 = 100\\) Personen in dieser Zelle. Der Anteil der Brillenträger müsste dann in beiden Geschlechtergruppen gleich \\(40\\,\\%\\) sein." },
      { id: 28, level: 5, typ: "numerisch", frage: "Von 300 Schülern haben 180 ein Haustier und 150 treiben Sport im Verein; 210 Schüler tun mindestens eines von beidem. Ein Schüler hat ein Haustier. Wie groß ist die Wahrscheinlichkeit, dass er auch im Verein Sport treibt? (3 Dezimalen)", loesung: 0.667, toleranz: 0.005, tipp: "Aus den drei Angaben lässt sich die Zahl der Schüler mit beiden Merkmalen erschließen; erst danach folgt die Bedingung.", loesungsweg: "Aus \\(n(H \\cup S) = n(H) + n(S) - n(H \\cap S)\\) folgt $$n(H \\cap S) = 180 + 150 - 210 = 120$$ Damit ist $$P(S \\mid H) = \\frac{120}{180} = \\frac23 \\approx 0{,}667$$ Zwei Schritte also: erst die Schnittmenge aus der Vereinigung, dann die Bedingung. Die 300 tauchen im Ergebnis nicht auf." },
      { id: 29, level: 5, typ: "numerisch", frage: "Zwei unabhängige Ereignisse \\(A\\) und \\(B\\) erfüllen \\(P(A) = 0{,}3\\) und \\(P(A \\cup B) = 0{,}58\\). Wie groß ist \\(P(B)\\)? (1 Dezimale)", loesung: 0.4, toleranz: 0.005, tipp: "Setze in den Additionssatz ein, was die Unabhängigkeit über den Schnitt aussagt, und löse nach der Unbekannten auf.", loesungsweg: "Additionssatz \\(P(A \\cup B) = P(A) + P(B) - P(A \\cap B)\\), dazu wegen Unabhängigkeit \\(P(A \\cap B) = 0{,}3 \\cdot P(B)\\). Mit \\(x = P(B)\\): $$0{,}3 + x - 0{,}3x = 0{,}58 \\;\\Rightarrow\\; 0{,}7x = 0{,}28 \\;\\Rightarrow\\; x = 0{,}4$$ Zwei Bedingungen sind nötig: der Additionssatz allein lässt \\(P(B)\\) offen, die Unabhängigkeit macht die Gleichung lösbar. Probe: \\(0{,}3 + 0{,}4 - 0{,}12 = 0{,}58\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Von 500 Befragten nutzen 300 den Bus und 200 sind unter 30 Jahre alt; 140 der Unter-30-Jährigen nutzen den Bus. Um wie viele Personen müsste diese Zahl 140 kleiner sein, damit Alter und Busnutzung unabhängig wären?", loesung: 20, toleranz: 0.5, tipp: "Berechne, welchen Wert die Eckzelle bei Unabhängigkeit haben müsste, und vergleiche ihn mit dem beobachteten.", loesungsweg: "Randwahrscheinlichkeiten \\(P(Bus) = \\tfrac{300}{500} = 0{,}6\\) und \\(P(U30) = \\tfrac{200}{500} = 0{,}4\\). Bei Unabhängigkeit wäre $$n(Bus \\cap U30) = 0{,}6 \\cdot 0{,}4 \\cdot 500 = 120$$ Beobachtet sind \\(140\\), also \\(140 - 120 = 20\\) Personen zu viel. Junge Befragte fahren in dieser Stichprobe häufiger Bus als der Durchschnitt: \\(\\tfrac{140}{200} = 0{,}7 > 0{,}6\\)." },
      // ========== LEVEL 6 — Transfer ==========
      { id: 31, level: 6, typ: "mc", frage: "„Zwei Ereignisse \\(A\\) und \\(B\\) mit \\(P(A) > 0\\) und \\(P(B) > 0\\), die sich gegenseitig ausschließen, sind stochastisch unabhängig.“ Trifft das zu?", optionen: ["Ja, denn ausschließende Ereignisse beeinflussen sich nicht", "Ja, sofern zusätzlich \\(P(A) = P(B)\\) erfüllt ist", "Nein, solche Ereignisse sind sogar stets abhängig", "Nein, aber nur im Fall \\(P(A) + P(B) = 1\\)"], korrekt: 2, tipp: "Setze beide Seiten der Unabhängigkeitsbedingung für ausschließende Ereignisse hin und vergleiche sie.", loesungsweg: "Ausschließend heißt \\(P(A \\cap B) = 0\\). Unabhängigkeit verlangt \\(P(A \\cap B) = P(A) \\cdot P(B)\\), und dieses Produkt ist bei \\(P(A) > 0\\) und \\(P(B) > 0\\) echt größer als Null. Beides zugleich ist unmöglich: $$0 = P(A \\cap B) \\neq P(A) \\cdot P(B) > 0$$ Die Behauptung ist also falsch, und zwar ohne jede Zusatzbedingung. Anschaulich: Tritt \\(A\\) ein, so ist \\(B\\) ausgeschlossen — das ist der stärkste denkbare Einfluss, \\(P(B \\mid A) = 0\\). „Ausschließend“ und „unabhängig“ sind verschiedene Begriffe, die oft verwechselt werden." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für zwei Ereignisse ist \\(P(A) = 0{,}6\\) und \\(P(B) = 0{,}3\\) bekannt, über den Schnitt ist nichts gegeben. Wie klein kann \\(P(A \\cup B)\\) höchstens werden? (1 Dezimale)", loesung: 0.6, toleranz: 0.005, tipp: "Überlege, welche Lage der beiden Ereignisse die Vereinigung so klein wie möglich macht, und prüfe, ob diese Lage zulässig ist.", loesungsweg: "Im Additionssatz \\(P(A \\cup B) = 0{,}9 - P(A \\cap B)\\) wird die Vereinigung am kleinsten, wenn der Schnitt am größten ist. Es gilt stets \\(P(A \\cap B) \\leq \\min(P(A), P(B)) = 0{,}3\\), und dieser Grenzfall ist zulässig: er bedeutet \\(B \\subseteq A\\). Dann ist $$P(A \\cup B) = 0{,}9 - 0{,}3 = 0{,}6 = P(A)$$ Der andere Grenzfall wäre \\(P(A \\cap B) = 0\\) mit \\(P(A \\cup B) = 0{,}9\\). Die Vereinigung liegt also zwischen \\(0{,}6\\) und \\(0{,}9\\), mehr lässt sich ohne Angabe zum Schnitt nicht sagen." },
      { id: 33, level: 6, typ: "numerisch", frage: "Eine Vierfeldertafel erfasst 400 Personen; die Merkmale \\(A\\) und \\(B\\) sind darin stochastisch unabhängig. Es gilt \\(P(A) = 0{,}25\\), und die Zelle „\\(A\\) und nicht \\(B\\)“ enthält 60 Einträge. Wie viele Einträge stehen in der Zelle „nicht \\(A\\) und \\(B\\)“?", loesung: 120, toleranz: 0.5, tipp: "Arbeite die Zeile von \\(A\\) vollständig aus, gewinne daraus über die Unabhängigkeit \\(P(B)\\) und fülle dann die Spalte von \\(B\\).", loesungsweg: "Zeile \\(A\\): \\(0{,}25 \\cdot 400 = 100\\) Einträge, davon 60 ohne \\(B\\), also \\(100 - 60 = 40\\) mit \\(B\\). Die Unabhängigkeit liefert \\(P(B)\\): $$\\frac{40}{400} = 0{,}1 = 0{,}25 \\cdot P(B) \\;\\Rightarrow\\; P(B) = 0{,}4$$ Spalte \\(B\\) umfasst damit \\(0{,}4 \\cdot 400 = 160\\) Einträge, davon 40 in der Zeile \\(A\\). Es bleiben $$160 - 40 = 120$$ Einträge für „nicht \\(A\\) und \\(B\\)“. Kontrolle: \\(\\tfrac{120}{300} = 0{,}4 = P(B)\\) — der \\(B\\)-Anteil ist in beiden Zeilen gleich, wie die Unabhängigkeit verlangt." },
      { id: 34, level: 6, typ: "mc", frage: "„Gilt \\(P(A \\mid B) > P(A)\\), so gilt auch \\(P(B \\mid A) > P(B)\\).“ Trifft das zu?", optionen: ["Ja, beides ist gleichwertig zu \\(P(A \\cap B) > P(A) \\cdot P(B)\\)", "Ja, aber nur wenn \\(A\\) und \\(B\\) unabhängig voneinander sind", "Nein, aus der einen Ungleichung folgt stets die umgekehrte", "Nein, die Rollen von Bedingung und Ereignis sind nie tauschbar"], korrekt: 0, tipp: "Multipliziere beide Ungleichungen mit dem jeweiligen Nenner und vergleiche, was übrig bleibt.", loesungsweg: "Aus \\(P(A \\mid B) = \\tfrac{P(A \\cap B)}{P(B)} > P(A)\\) wird durch Multiplikation mit \\(P(B) > 0\\) $$P(A \\cap B) > P(A) \\cdot P(B)$$ Genau dieselbe Ungleichung entsteht aus \\(P(B \\mid A) > P(B)\\), wenn man mit \\(P(A) > 0\\) multipliziert. Beide Aussagen sind also gleichwertig, die Behauptung trifft zu. Achtung auf den Unterschied: Die <b>Werte</b> \\(P(A \\mid B)\\) und \\(P(B \\mid A)\\) sind im Allgemeinen verschieden — gleichwertig ist nur die Frage, ob sie über oder unter der jeweiligen unbedingten Wahrscheinlichkeit liegen." },
      { id: 35, level: 6, typ: "numerisch", frage: "Für zwei Ereignisse gilt \\(P(A) = 0{,}4\\), \\(P(B \\mid A) = 0{,}25\\) und \\(P(B \\mid \\overline{A}) = 0{,}4\\). Wie groß ist \\(P(A \\mid \\overline{B})\\)? (3 Dezimalen)", loesung: 0.455, toleranz: 0.005, tipp: "Rechne die drei Angaben zuerst in die vier Zellen einer Vierfeldertafel um; die gesuchte Größe steht dann in einer Spalte.", loesungsweg: "Die vier Zellen: \\(P(A \\cap B) = 0{,}4 \\cdot 0{,}25 = 0{,}1\\) und \\(P(A \\cap \\overline{B}) = 0{,}4 - 0{,}1 = 0{,}3\\); ferner \\(P(\\overline{A} \\cap B) = 0{,}6 \\cdot 0{,}4 = 0{,}24\\) und \\(P(\\overline{A} \\cap \\overline{B}) = 0{,}6 - 0{,}24 = 0{,}36\\). Die Spalte \\(\\overline{B}\\) hat die Summe \\(0{,}3 + 0{,}36 = 0{,}66\\), also $$P(A \\mid \\overline{B}) = \\frac{0{,}3}{0{,}66} \\approx 0{,}455$$ Der Weg führt zwingend über die Tafel: Die gegebenen Größen sind entlang der Zeilen bedingt, gefragt ist eine Bedingung entlang einer Spalte. Wegen \\(P(B \\mid A) \\neq P(B \\mid \\overline{A})\\) sind die Merkmale abhängig, deshalb ist \\(P(A \\mid \\overline{B}) = 0{,}455\\) auch größer als \\(P(A) = 0{,}4\\)." },
      { id: 36, level: 6, typ: "mc", frage: "„Sind \\(A\\) und \\(B\\) stochastisch unabhängig, so sind auch \\(A\\) und \\(\\overline{B}\\) stochastisch unabhängig.“ Trifft das zu?", optionen: ["Ja, das folgt aus \\(P(A \\cap \\overline{B}) = P(A) - P(A \\cap B)\\)", "Ja, jedoch ausschließlich im Sonderfall \\(P(B) = 0{,}5\\)", "Nein, ein Ereignis und sein Gegenereignis sind immer abhängig", "Nein, denn \\(P(A \\cap \\overline{B})\\) ist in diesem Fall gleich Null"], korrekt: 0, tipp: "Zerlege \\(A\\) in den Teil, der in \\(B\\) liegt, und den Rest, und setze dann die Unabhängigkeit ein.", loesungsweg: "Das Ereignis \\(A\\) zerfällt in \\(A \\cap B\\) und \\(A \\cap \\overline{B}\\), also $$P(A \\cap \\overline{B}) = P(A) - P(A \\cap B) = P(A) - P(A) \\cdot P(B) = P(A) \\cdot (1 - P(B))$$ und \\(1 - P(B)\\) ist gerade \\(P(\\overline{B})\\). Damit ist die Unabhängigkeitsbedingung für \\(A\\) und \\(\\overline{B}\\) erfüllt, die Behauptung trifft zu — ohne Sonderfall. Der dritte Vorschlag verwechselt „unabhängig“ mit „ausschließend“: \\(B\\) und \\(\\overline{B}\\) schließen sich aus, aber hier stehen \\(A\\) und \\(\\overline{B}\\) nebeneinander. Ebenso lässt sich zeigen, dass dann auch \\(\\overline{A}\\) und \\(\\overline{B}\\) unabhängig sind." }];
