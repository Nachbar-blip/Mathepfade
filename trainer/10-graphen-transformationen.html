<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-graphen-transformationen';
    const THEMA_CONFIG = { name: 'Graphen-Transformationen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht ==========
      { id: 1, level: 1, typ: "mc", frage: "\\(f(x) = x^2\\). Was bewirkt \\(g(x) = f(x) + 3\\)?", optionen: ["Verschiebung um 3 nach oben", "Verschiebung um 3 nach rechts", "Streckung", "Spiegelung"], korrekt: 0, tipp: "\\(+3\\) am Ende: vertikale Verschiebung.", loesungsweg: "\\(f(x) + c\\) verschiebt den Graphen um \\(c\\) nach oben (hier \\(+3\\))." },
      { id: 2, level: 1, typ: "mc", frage: "\\(g(x) = f(x) - 2\\). Wohin?", optionen: ["2 nach oben", "2 nach unten", "2 nach rechts", "2 nach links"], korrekt: 1, tipp: "Minus = nach unten.", loesungsweg: "Die \\(-2\\) steht <b>außerhalb</b> der Funktion und wirkt deshalb auf die \\(y\\)-Werte: Jeder Funktionswert wird um \\(2\\) kleiner. $$g(x) = f(x) - 2$$ Der Graph wandert also um \\(2\\) nach unten. Äußere Änderungen wirken in \\(y\\)-Richtung und so, wie das Vorzeichen es nahelegt." },
      { id: 3, level: 1, typ: "mc", frage: "\\(g(x) = f(x - 4)\\). Wohin?", optionen: ["4 nach rechts", "4 nach links", "4 nach oben", "4 nach unten"], korrekt: 0, tipp: "Minus IN der Klammer = nach rechts (gegensinnig!).", loesungsweg: "\\(f(x - c)\\): Verschiebung um \\(c\\) nach rechts. Also \\(4\\) nach rechts." },
      { id: 4, level: 1, typ: "mc", frage: "\\(g(x) = f(x + 5)\\). Wohin?", optionen: ["5 nach rechts", "5 nach links", "5 nach oben", "5 nach unten"], korrekt: 1, tipp: "Plus IN der Klammer = nach links.", loesungsweg: "Die \\(+5\\) steht <b>in</b> der Klammer und wirkt damit auf das Argument: \\(g\\) erreicht schon bei \\(x = -5\\) den Wert, den \\(f\\) erst bei \\(0\\) hat. $$g(x) = f(x+5)$$ Der Graph verschiebt sich also um \\(5\\) nach <b>links</b> — innere Änderungen wirken entgegen dem Vorzeichen." },
      { id: 5, level: 1, typ: "mc", frage: "\\(g(x) = -f(x)\\). Was passiert?", optionen: ["Spiegelung an der x-Achse", "Spiegelung an der y-Achse", "Verschiebung", "Streckung"], korrekt: 0, tipp: "Minus vor der Funktion.", loesungsweg: "Das Minus steht vor der ganzen Funktion, kehrt also jeden \\(y\\)-Wert um: Aus \\(f(x)\\) wird \\(-f(x)\\). $$g(x) = -f(x)$$ Das ist die Spiegelung an der \\(x\\)-Achse. Alle Nullstellen bleiben dabei erhalten, denn \\(-0 = 0\\)." },
      { id: 6, level: 1, typ: "mc", frage: "\\(g(x) = f(-x)\\). Was passiert?", optionen: ["Spiegelung an der x-Achse", "Spiegelung an der y-Achse", "Verschiebung", "Streckung"], korrekt: 1, tipp: "Minus bei \\(x\\).", loesungsweg: "Hier wird das Argument gespiegelt: \\(g\\) nimmt bei \\(-x\\) den Wert an, den \\(f\\) bei \\(x\\) hat. $$g(x) = f(-x)$$ Das ist die Spiegelung an der \\(y\\)-Achse. Ist \\(f\\) achsensymmetrisch, ändert sich nichts — genau das bedeutet \\(f(-x) = f(x)\\)." },
      // ========== LEVEL 2 -- leicht ==========
      { id: 7, level: 2, typ: "mc", frage: "\\(g(x) = 2 f(x)\\). Was passiert?", optionen: ["Streckung um 2 in y-Richtung", "Streckung um 2 in x-Richtung", "Verschiebung", "Stauchung"], korrekt: 0, tipp: "Faktor vor \\(f\\).", loesungsweg: "\\(a \\cdot f(x)\\) mit \\(a > 1\\): Streckung in y-Richtung um Faktor \\(a\\)." },
      { id: 8, level: 2, typ: "mc", frage: "\\(g(x) = \\frac{1}{2} f(x)\\). Was passiert?", optionen: ["Streckung um 2", "Stauchung in y-Richtung", "Spiegelung", "Verschiebung"], korrekt: 1, tipp: "Faktor zwischen 0 und 1 = Stauchung.", loesungsweg: "Der Faktor steht vor der Funktion und wirkt auf die \\(y\\)-Werte; er halbiert sie: $$g(x) = \\tfrac12 f(x)$$ Für \\(0 < a < 1\\) entsteht eine <b>Stauchung</b> in \\(y\\)-Richtung, der Graph wird flacher. Bei \\(a > 1\\) wäre es eine Streckung. Die Nullstellen bleiben in beiden Fällen unverändert." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(f(x) = x^2\\). Wie lautet \\(g(x) = f(x - 3)\\) ausgeschrieben als Term?<br>Gib den Funktionswert \\(g(3)\\) an.", loesung: 0, toleranz: 0, tipp: "\\(g(x) = (x - 3)^2\\). \\(g(3) = 0\\).", loesungsweg: "\\(g(x) = (x-3)^2\\). \\(g(3) = 0^2 = 0\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(f(x) = x^2\\). Für \\(g(x) = f(x) + 5\\): Berechne \\(g(0)\\).", loesung: 5, toleranz: 0, tipp: "\\(g(0) = 0^2 + 5\\).", loesungsweg: "\\(g(0) = 0 + 5 = 5\\)." },
      { id: 11, level: 2, typ: "mc", frage: "Gegeben ist \\(f(x) = x^2\\). Welcher Graph gehört zu \\(g(x) = (x + 2)^2\\)?", optionen: ["Parabel, Scheitel bei \\((2, 0)\\)", "Parabel, Scheitel bei \\((-2, 0)\\)", "Parabel, Scheitel bei \\((0, 2)\\)", "Parabel, Scheitel bei \\((0, -2)\\)"], korrekt: 1, tipp: "\\((x + 2)\\): Verschiebung um \\(-2\\) (also nach links).", loesungsweg: "Scheitel verschiebt sich um 2 nach links: \\((-2, 0)\\)." },
      { id: 12, level: 2, typ: "mc", frage: "\\(f(x) = x^2\\). Welche Form hat \\(g(x) = -x^2 + 1\\)?", optionen: ["Nach oben geöffnete Parabel mit Scheitel \\((0,1)\\)", "Nach unten geöffnete Parabel mit Scheitel \\((0,1)\\)", "Gerade", "Hyperbel"], korrekt: 1, tipp: "Minus vor \\(x^2\\): nach unten geöffnet. \\(+1\\) verschiebt nach oben.", loesungsweg: "\\(-x^2\\): Spiegelung (nach unten geöffnet). \\(+1\\): Scheitel bei \\((0, 1)\\)." },
      // ========== LEVEL 3 -- nervenschonend ==========
      { id: 13, level: 3, typ: "mc", frage: "\\(f(x) = x^2\\) wird zuerst um 3 nach rechts, dann um 2 nach oben verschoben. Wie lautet \\(g(x)\\)?", optionen: ["\\((x + 3)^2 + 2\\)", "\\((x - 3)^2 + 2\\)", "\\((x - 3)^2 - 2\\)", "\\((x + 3)^2 - 2\\)"], korrekt: 1, tipp: "Rechts: \\((x - 3)\\). Oben: \\(+ 2\\).", loesungsweg: "Rechts verschieben heißt: in der Klammer subtrahieren. Nach oben verschieben heißt: außen addieren. $$g(x) = (x-3)^2 + 2$$ Der Scheitel wandert von \\((0;0)\\) nach \\((3;2)\\). Probe: \\(g(3) = 0+2 = 2\\) ✓" },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(g(x) = (x - 2)^2 + 3\\). Wo liegt der Scheitel? Gib die x-Koordinate an.", loesung: 2, toleranz: 0, tipp: "Scheitelpunktform: Scheitel \\((d, e)\\) bei \\((x - d)^2 + e\\).", loesungsweg: "In der Scheitelpunktform \\(g(x) = (x-d)^2 + e\\) liegt der Scheitel bei \\((d|e)\\). Hier also: $$g(x) = (x-2)^2 + 3 \\;\\Rightarrow\\; S(2|3)$$ Die \\(x\\)-Koordinate ist \\(2\\) — das Vorzeichen in der Klammer kehrt sich um, denn \\((x-2)\\) wird genau bei \\(x = 2\\) null." },
      { id: 15, level: 3, typ: "numerisch", frage: "\\(g(x) = (x - 2)^2 + 3\\). y-Koordinate des Scheitels?", loesung: 3, toleranz: 0, tipp: "Konstante am Ende.", loesungsweg: "Die Konstante hinter dem Quadrat ist die \\(y\\)-Koordinate des Scheitels: $$g(x) = (x-2)^2 + 3 \\;\\Rightarrow\\; S(2|3)$$ Da \\((x-2)^2 \\ge 0\\) ist, ist \\(3\\) zugleich der kleinste Funktionswert." },
      { id: 16, level: 3, typ: "mc", frage: "\\(f(x) = x^2\\). Welche Transformation ergibt Scheitel \\((-1, 4)\\)?", optionen: ["\\((x - 1)^2 + 4\\)", "\\((x + 1)^2 + 4\\)", "\\((x + 1)^2 - 4\\)", "\\((x - 1)^2 - 4\\)"], korrekt: 1, tipp: "Links: \\((x + 1)\\). Oben: \\(+ 4\\).", loesungsweg: "Der Scheitel soll bei \\((-1|4)\\) liegen. In der Form \\((x-d)^2+e\\) ist \\(d = -1\\), also \\(x-(-1) = x+1\\): $$g(x) = (x+1)^2 + 4$$ Probe: \\(g(-1) = 0+4 = 4\\) ✓ Eine Verschiebung nach links erzeugt ein Pluszeichen in der Klammer." },
      { id: 17, level: 3, typ: "mc", frage: "\\(g(x) = 2(x - 1)^2\\). Was passiert?", optionen: ["Streckung und Verschiebung nach rechts", "Streckung und Verschiebung nach links", "Stauchung", "Nur Verschiebung"], korrekt: 0, tipp: "Faktor 2 und \\((x - 1)\\).", loesungsweg: "Faktor 2: Streckung in y-Richtung. \\((x - 1)\\): Verschiebung um 1 nach rechts." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(g(x) = 2(x - 1)^2\\). Berechne \\(g(3)\\).", loesung: 8, toleranz: 0, tipp: "\\(2 \\cdot (3 - 1)^2 = 2 \\cdot 4\\).", loesungsweg: "$$g(3) = 2 \\cdot (3-1)^2 = 2 \\cdot 4 = 8$$" },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "mc", frage: "\\(g(x) = -2(x + 1)^2 + 3\\). Welche Aussage stimmt?", optionen: ["Nach oben geöffnet, Scheitel \\((1, 3)\\)", "Nach unten geöffnet, Scheitel \\((-1, 3)\\)", "Nach oben geöffnet, Scheitel \\((-1, 3)\\)", "Nach unten geöffnet, Scheitel \\((1, -3)\\)"], korrekt: 1, tipp: "Minus: nach unten. \\((x + 1)\\): Scheitel bei \\(x = -1\\).", loesungsweg: "Faktor \\(-2\\): nach unten geöffnet. Scheitel \\((-1, 3)\\)." },
      { id: 20, level: 4, typ: "mc", frage: "\\(f(x) = x^2 - 2x\\). Welche Verschiebung führt zur Scheitelform?", optionen: ["\\((x - 1)^2 - 1\\)", "\\((x + 1)^2 + 1\\)", "\\((x - 1)^2 + 1\\)", "\\(x^2 + 1\\)"], korrekt: 0, tipp: "Quadratische Ergänzung: \\(x^2 - 2x = (x - 1)^2 - 1\\).", loesungsweg: "Quadratische Ergänzung: Die Hälfte des Koeffizienten von \\(x\\) ist \\(-1\\), deren Quadrat \\(1\\). $$x^2-2x = x^2-2x+1-1 = (x-1)^2 - 1$$ Der Scheitel liegt also bei \\((1|-1)\\). Probe: \\((x-1)^2-1 = x^2-2x+1-1 = x^2-2x\\) ✓" },
      { id: 21, level: 4, typ: "numerisch", frage: "Für \\(f(x) = x^2\\) ist \\(g(x) = f(2x)\\). Berechne \\(g(3)\\).", loesung: 36, toleranz: 0, tipp: "Setze zuerst in die innere Klammer ein und wende danach die Funktion \\(f\\) auf dieses Zwischenergebnis an.", loesungsweg: "Der Faktor wirkt im Argument: $$g(3) = f(2 \\cdot 3) = f(6) = 6^2 = 36$$ Der Graph von \\(g\\) ist gegenüber dem von \\(f\\) in \\(x\\)-Richtung gestaucht — \\(g\\) erreicht schon bei \\(3\\) den Wert, den \\(f\\) erst bei \\(6\\) hat." },
      { id: 22, level: 4, typ: "mc", frage: "Was bewirkt \\(g(x) = f(2x)\\)?", optionen: ["Streckung in x-Richtung um Faktor 2", "Stauchung in x-Richtung um Faktor 2", "Streckung in y-Richtung", "Stauchung in y-Richtung"], korrekt: 1, tipp: "\\(f(bx)\\) mit \\(b > 1\\): Stauchung.", loesungsweg: "\\(f(bx)\\) mit \\(b > 1\\): Stauchung in x-Richtung um Faktor \\(\\frac{1}{b}\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Scheitel von \\(f(x) = x^2 + 4x + 7\\)? x-Koordinate?", loesung: -2, toleranz: 0, tipp: "Quadratische Ergänzung: \\((x+2)^2 + 3\\).", loesungsweg: "\\(x^2 + 4x + 7 = (x+2)^2 + 3\\). Scheitel \\((-2, 3)\\); x-Koordinate \\(= -2\\)." },
      { id: 24, level: 4, typ: "numerisch", frage: "Scheitel von \\(f(x) = x^2 + 4x + 7\\)? y-Koordinate?", loesung: 3, toleranz: 0, tipp: "Aus Scheitelform ablesen.", loesungsweg: "Quadratische Ergänzung mit der Hälfte von \\(4\\), also \\(2\\), und deren Quadrat \\(4\\): $$x^2+4x+7 = (x^2+4x+4) + 3 = (x+2)^2 + 3$$ Der Scheitel liegt bei \\((-2|3)\\), die gesuchte \\(y\\)-Koordinate ist \\(3\\)." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Der Graph von \\(g(x) = a(x-2)^2 + e\\) berührt die \\(x\\)-Achse und verläuft durch den Punkt \\(P(4 \\mid 12)\\). Bestimme \\(a\\).", loesung: 3, toleranz: 0, tipp: "Aus der Berührung der \\(x\\)-Achse folgt eine Bedingung für \\(e\\), aus dem Punkt die zweite Bedingung.", loesungsweg: "Berührung der \\(x\\)-Achse heißt: Der Scheitel liegt auf ihr, also \\(e = 0\\). Punktprobe: $$a(4-2)^2 = 12 \\;\\Longrightarrow\\; 4a = 12 \\;\\Longrightarrow\\; a = 3$$ Die Funktion lautet \\(g(x) = 3(x-2)^2\\) mit der doppelten Nullstelle \\(x = 2\\)." },
      { id: 26, level: 5, typ: "mc", frage: "Zu \\(g(x) = f(x-3)\\) wird notiert: „Der Graph von \\(f\\) wird um 3 Einheiten nach links verschoben.“ Wie ist das zu bewerten?", optionen: ["Richtig, das Minus bedeutet links", "Falsch, er wird nach rechts verschoben", "Falsch, er wird nach unten verschoben", "Richtig, aber nur bei Parabeln"], korrekt: 1, tipp: "Prüfe an einer Stelle nach: Welchen \\(x\\)-Wert braucht \\(g\\), um den Wert von \\(f\\) an der Stelle \\(0\\) anzunehmen?", loesungsweg: "\\(g\\) nimmt den Wert von \\(f(0)\\) erst bei \\(x = 3\\) an, denn \\(g(3) = f(0)\\). Der Graph wandert also um 3 Einheiten nach <b>rechts</b>. Im Argument wirken Veränderungen stets entgegengesetzt zum Vorzeichen — anders als bei \\(f(x) + 3\\), wo die Verschiebung wie erwartet nach oben geht." },
      { id: 27, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = x^2\\) wird zuerst an der \\(x\\)-Achse gespiegelt und anschließend um 4 Einheiten nach oben verschoben. Berechne den Funktionswert der so entstandenen Funktion \\(g\\) an der Stelle \\(3\\).", loesung: -5, toleranz: 0, tipp: "Stelle erst den Term nach beiden Schritten auf und setze dann ein.", loesungsweg: "Spiegelung an der \\(x\\)-Achse: \\(-x^2\\); anschließende Verschiebung nach oben: $$g(x) = -x^2 + 4$$ Einsetzen: \\(g(3) = -9 + 4 = -5\\). Wären die Schritte vertauscht, ergäbe sich \\(-(x^2+4) = -x^2 - 4\\) und damit \\(-13\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = x^2\\) wird so verschoben, dass die entstehende Parabel die Nullstellen \\(1\\) und \\(5\\) hat. Gib die \\(y\\)-Koordinate ihres Scheitels an.", loesung: -4, toleranz: 0, tipp: "Der Scheitel liegt aus Symmetriegründen genau zwischen den beiden Nullstellen.", loesungsweg: "Die Scheitelstelle liegt in der Mitte: \\(x_S = \\frac{1+5}{2} = 3\\). Verschoben lautet die Funktion \\(g(x) = (x-3)^2 + e\\). Aus der Nullstelle \\(x = 1\\): $$(1-3)^2 + e = 0 \\;\\Longrightarrow\\; 4 + e = 0 \\;\\Longrightarrow\\; e = -4$$ Der Scheitel ist \\(S(3 \\mid -4)\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = x^2\\) wird an der \\(x\\)-Achse gespiegelt und dann um \\(d\\) Einheiten nach rechts verschoben. Die entstandene Funktion hat an der Stelle \\(5\\) den Wert \\(-4\\). Bestimme \\(d\\) unter der Bedingung \\(0 < d < 5\\).", loesung: 3, toleranz: 0, tipp: "Stelle den Term mit dem unbekannten Verschiebungswert auf und setze die angegebene Stelle ein; beachte am Ende die Bedingung.", loesungsweg: "Nach beiden Schritten: \\(g(x) = -\\left(x-d\\right)^2\\). Einsetzen der Stelle \\(5\\): $$-\\left(5-d\\right)^2 = -4 \\;\\Longrightarrow\\; \\left(5-d\\right)^2 = 4 \\;\\Longrightarrow\\; 5 - d = \\pm 2$$ Daraus \\(d = 3\\) oder \\(d = 7\\). Die Bedingung \\(0 < d < 5\\) lässt nur <b>\\(d = 3\\)</b> zu. Probe: \\(-(5-3)^2 = -4\\) ✓" },
      { id: 30, level: 5, typ: "numerisch", frage: "Der Graph von \\(g(x) = x^2 + bx + c\\) hat seinen Scheitel auf der \\(y\\)-Achse und verläuft durch den Punkt \\(P(3 \\mid 5)\\). Bestimme \\(c\\).", loesung: -4, toleranz: 0, tipp: "Überlege zuerst, was die Lage des Scheitels über den linearen Summanden verrät, und nutze den Punkt als zweite Bedingung.", loesungsweg: "Liegt der Scheitel auf der \\(y\\)-Achse, ist die Parabel in \\(x\\)-Richtung unverschoben, also \\(b = 0\\) und \\(g(x) = x^2 + c\\). Punktprobe: $$3^2 + c = 5 \\;\\Longrightarrow\\; 9 + c = 5 \\;\\Longrightarrow\\; c = -4$$ Die Funktion lautet \\(g(x) = x^2 - 4\\) mit dem Scheitel \\(S(0 \\mid -4)\\)." },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Für \\(f(x) = x^2\\) liefern die Stauchung in \\(x\\)-Richtung mit dem Faktor \\(\\tfrac12\\) und die Streckung in \\(y\\)-Richtung mit dem Faktor \\(4\\) denselben Graphen.“ Prüfe die Behauptung.", optionen: ["Falsch, die Graphen unterscheiden sich", "Richtig, beide Male entsteht \\(4x^2\\)", "Richtig, das gilt bei jeder Funktion", "Falsch, es entsteht einmal \\(2x^2\\)"], korrekt: 1, tipp: "Stelle beide Terme auf und vergleiche sie; nutze dabei ein Potenzgesetz.", loesungsweg: "Stauchung in \\(x\\)-Richtung: \\(f(2x) = (2x)^2 = 4x^2\\). Streckung in \\(y\\)-Richtung: \\(4 \\cdot f(x) = 4x^2\\). Beide Terme stimmen überein, die Behauptung ist für diese Funktion also <b>richtig</b>. Sie gilt aber nicht allgemein: Für \\(f(x) = x^3\\) wäre \\(f(2x) = 8x^3\\), also die Streckung mit dem Faktor \\(8\\) und nicht \\(4\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für welche Werte von \\(e\\) hat \\(g(x) = -(x-1)^2 + e\\) genau zwei Nullstellen? Gib die kleinste ganze Zahl \\(e\\) an, für die das zutrifft.", loesung: 1, toleranz: 0, tipp: "Überlege anhand der Öffnungsrichtung, wo der Scheitel liegen muss, damit der Graph die \\(x\\)-Achse zweimal trifft.", loesungsweg: "Die Parabel ist nach unten geöffnet, ihr Scheitel liegt bei \\(S(1 \\mid e)\\). Fallunterscheidung: Für \\(e < 0\\) verläuft der Graph ganz unterhalb der Achse (keine Nullstelle), für \\(e = 0\\) berührt er sie (eine Nullstelle), für \\(e > 0\\) schneidet er sie zweimal. Die kleinste ganze Zahl mit \\(e > 0\\) ist <b>1</b>." },
      { id: 33, level: 6, typ: "numerisch", frage: "Eine Parabel hat den Scheitel \\(S(2 \\mid -3)\\) und verläuft durch den Punkt \\(P(0 \\mid 5)\\). Bestimme den Streckfaktor \\(a\\).", loesung: 2, toleranz: 0, tipp: "Schreibe die Parabel zuerst in Scheitelform mit unbekanntem Faktor und nutze den Punkt als zweite Bedingung.", loesungsweg: "Ansatz in Scheitelform: \\(g(x) = a(x-2)^2 - 3\\). Punktprobe mit \\(P(0 \\mid 5)\\): $$a \\cdot (-2)^2 - 3 = 5 \\;\\Longrightarrow\\; 4a = 8 \\;\\Longrightarrow\\; a = 2$$ Die Parabel lautet \\(g(x) = 2(x-2)^2 - 3\\) und ist gegenüber der Normalparabel gestreckt." },
      { id: 34, level: 6, typ: "mc", frage: "Behauptung: „Ob man einen Graphen erst streckt und dann verschiebt oder umgekehrt, ändert am Ergebnis nichts.“ Prüfe die Behauptung.", optionen: ["Richtig, das Ergebnis ist stets dasselbe", "Falsch, es entstehen verschiedene Graphen", "Richtig, sofern der Faktor positiv ist", "Falsch, nur Spiegelungen sind vertauschbar"], korrekt: 1, tipp: "Führe beide Reihenfolgen an einem einfachen Beispiel durch und vergleiche die entstehenden Terme.", loesungsweg: "Beispiel \\(f(x) = x^2\\), Streckung mit \\(2\\) und Verschiebung um \\(3\\) nach oben. Erst strecken, dann verschieben: \\(2x^2 + 3\\). Erst verschieben, dann strecken: $$2(x^2+3) = 2x^2 + 6$$ Die Ergebnisse unterscheiden sich, die Behauptung ist <b>falsch</b>. Grund: Die zweite Reihenfolge streckt die Verschiebung mit." },
      { id: 35, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x) = x^2\\) wird an der \\(x\\)-Achse gespiegelt, dann um 3 Einheiten nach rechts und um 4 Einheiten nach oben verschoben. An welcher Stelle \\(x > 3\\) hat die entstandene Funktion eine Nullstelle?", loesung: 5, toleranz: 0, tipp: "Stelle den Term nach allen drei Schritten auf und löse dann die Nullstellengleichung.", loesungsweg: "Nach den drei Schritten: $$g(x) = -(x-3)^2 + 4$$ Nullstellen: \\((x-3)^2 = 4\\), also \\(x-3 = \\pm 2\\) und damit \\(x = 5\\) oder \\(x = 1\\). Gesucht war die Stelle rechts von \\(3\\): <b>\\(x = 5\\)</b>." },
      { id: 36, level: 6, typ: "numerisch", frage: "Gegeben sind \\(x^2 + 1\\), \\(-(x-2)^2\\), \\(2(x+1)^2 - 8\\) und \\(-x^2 - 3\\). Bei wie vielen dieser Funktionen hat der Graph genau zwei Nullstellen?", loesung: 1, toleranz: 0, tipp: "Vergleiche je Funktion die Öffnungsrichtung mit der Lage des Scheitels.", loesungsweg: "Fallweise: \\(x^2+1\\) ist nach oben geöffnet mit Scheitel über der Achse — keine Nullstelle. \\(-(x-2)^2\\) berührt die Achse im Scheitel — eine Nullstelle. \\(2(x+1)^2-8\\) ist nach oben geöffnet mit Scheitel unter der Achse — $$x = 1 \\text{ und } x = -3$$ also zwei Nullstellen. \\(-x^2-3\\) liegt ganz unter der Achse — keine. Genau <b>1</b> Funktion erfüllt die Bedingung." }];
