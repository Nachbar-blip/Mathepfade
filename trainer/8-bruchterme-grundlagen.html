<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-bruchterme-grundlagen';
    const THEMA_CONFIG = { name: 'Bruchterme - Grundlagen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "mc", frage: "Was ist ein Bruchterm?", optionen: ["Ein Term ohne Variable", "Ein Term, in dessen Nenner eine Variable vorkommt", "Eine Gleichung mit Bruch", "Ein Dezimalbruch"], korrekt: 1, tipp: "Entscheidend ist, wo die Variable steht.", loesungsweg: "Ein <b>Bruchterm</b> ist ein Term, bei dem im Nenner (mindestens) eine Variable vorkommt, z. B. \\(\\frac{3}{x}\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Welcher Ausdruck ist ein Bruchterm?", optionen: ["\\(\\frac{x}{3}\\)", "\\(\\frac{5}{x+1}\\)", "\\(\\frac{2}{7}\\)", "\\(x^2 + 1\\)"], korrekt: 1, tipp: "Variable muss im Nenner stehen.", loesungsweg: "\\(\\frac{5}{x+1}\\) hat die Variable \\(x\\) im Nenner - das ist ein Bruchterm." },
      { id: 3, level: 1, typ: "mc", frage: "Für welchen Wert von \\(x\\) ist \\(\\frac{1}{x}\\) nicht definiert?", optionen: ["\\(x = 1\\)", "\\(x = -1\\)", "\\(x = 0\\)", "Für alle \\(x\\)"], korrekt: 2, tipp: "Durch null darf man nicht teilen.", loesungsweg: "Der Nenner darf nicht 0 sein. Also ist \\(\\frac{1}{x}\\) für \\(x = 0\\) nicht definiert." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne den Wert von \\(\\frac{12}{x}\\) für \\(x = 3\\).", loesung: 4, toleranz: 0, tipp: "\\(\\frac{12}{3}\\) ausrechnen.", loesungsweg: "Für \\(x\\) den Wert einsetzen und ausrechnen: $$\\frac{12}{3} = 4$$ Der Nenner darf dabei nie null werden — \\(x = 0\\) wäre hier nicht erlaubt." },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne den Wert von \\(\\frac{x+2}{x}\\) für \\(x = 2\\).", loesung: 2, toleranz: 0, tipp: "\\(\\frac{2+2}{2}\\).", loesungsweg: "$$\\frac{2+2}{2} = \\frac{4}{2} = 2$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Berechne den Wert von \\(\\frac{10}{x-1}\\) für \\(x = 6\\).", loesung: 2, toleranz: 0, tipp: "Nenner: \\(6-1=5\\).", loesungsweg: "$$\\frac{10}{6-1} = \\frac{10}{5} = 2$$" },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "mc", frage: "Für welche \\(x\\) ist \\(\\frac{3}{x-5}\\) nicht definiert?", optionen: ["\\(x = 0\\)", "\\(x = 3\\)", "\\(x = 5\\)", "\\(x = -5\\)"], korrekt: 2, tipp: "Nenner gleich 0 setzen.", loesungsweg: "\\(x - 5 = 0 \\Rightarrow x = 5\\). Der Definitionsbereich ist \\(D = \\mathbb{Q} \\setminus \\{5\\}\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Welcher Definitionsbereich gilt für \\(\\frac{x}{x+2}\\)?", optionen: ["\\(D = \\mathbb{Q}\\)", "\\(D = \\mathbb{Q} \\setminus \\{0\\}\\)", "\\(D = \\mathbb{Q} \\setminus \\{2\\}\\)", "\\(D = \\mathbb{Q} \\setminus \\{-2\\}\\)"], korrekt: 3, tipp: "Nenner \\(x+2=0\\).", loesungsweg: "\\(x + 2 = 0 \\Rightarrow x = -2\\). Also \\(D = \\mathbb{Q} \\setminus \\{-2\\}\\)." },
      { id: 9, level: 2, typ: "mc", frage: "Welche Werte schließt \\(\\frac{1}{x(x-3)}\\) aus?", optionen: ["\\(x = 0\\) und \\(x = 3\\)", "Nur \\(x = 0\\)", "Nur \\(x = 3\\)", "\\(x = -3\\) und \\(x = 0\\)"], korrekt: 0, tipp: "Beide Faktoren im Nenner prüfen.", loesungsweg: "\\(x = 0\\) oder \\(x - 3 = 0\\). Also \\(x \\neq 0\\) und \\(x \\neq 3\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Für welchen Wert ist \\(\\frac{4}{x-7}\\) nicht definiert?", loesung: 7, toleranz: 0, tipp: "Nenner = 0.", loesungsweg: "$$x - 7 = 0 \\implies x = 7$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Für welchen Wert ist \\(\\frac{x}{2x-6}\\) nicht definiert?", loesung: 3, toleranz: 0, tipp: "\\(2x - 6 = 0\\).", loesungsweg: "$$2x - 6 = 0 \\implies x = 3$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(\\frac{x^2+1}{x}\\) für \\(x = 4\\).", loesung: 4.25, toleranz: 0.01, tipp: "\\(\\frac{16+1}{4}\\).", loesungsweg: "Zuerst den Zähler berechnen, dann teilen: $$\\frac{4^2+1}{4} = \\frac{17}{4} = 4{,}25$$ Der Bruchstrich wirkt wie eine Klammer: Erst wird der ganze Zähler ausgewertet, dann dividiert." },
      // ========== LEVEL 3 ==========
      { id: 13, level: 3, typ: "mc", frage: "Kürze: \\(\\frac{6x}{9}\\) ergibt …", optionen: ["\\(\\frac{2x}{3}\\)", "\\(\\frac{3x}{2}\\)", "\\(\\frac{x}{3}\\)", "\\(\\frac{6}{9}\\)"], korrekt: 0, tipp: "ggT von 6 und 9 ist 3.", loesungsweg: "Zähler und Nenner durch den größten gemeinsamen Teiler \\(3\\) teilen: $$\\frac{6x}{9} = \\frac{2x}{3}$$ Das \\(x\\) bleibt stehen — es kommt nur im Zähler vor und lässt sich deshalb nicht kürzen." },
      { id: 14, level: 3, typ: "mc", frage: "Kürze: \\(\\frac{4x^2}{2x}\\) ergibt …", optionen: ["\\(2x^2\\)", "\\(2x\\)", "\\(x\\)", "\\(\\frac{2}{x}\\)"], korrekt: 1, tipp: "Zahl und Variable getrennt kürzen.", loesungsweg: "$$\\frac{4x^2}{2x} = \\frac{4}{2} \\cdot \\frac{x^2}{x} = 2x$$" },
      { id: 15, level: 3, typ: "mc", frage: "Kürze: \\(\\frac{3(x+1)}{6(x+1)}\\) ergibt …", optionen: ["\\(\\frac{1}{2}\\)", "\\(\\frac{1}{2x}\\)", "\\(\\frac{x+1}{2}\\)", "\\(2\\)"], korrekt: 0, tipp: "\\((x+1)\\) kürzen.", loesungsweg: "$$\\frac{3(x+1)}{6(x+1)} = \\frac{3}{6} = \\frac{1}{2}$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "Kürze \\(\\frac{8x}{12}\\) vollständig. Welche Zahl steht danach im Nenner?", loesung: 3, toleranz: 0, tipp: "ggT(8, 12) = 4.", loesungsweg: "Zähler und Nenner durch \\(4\\) teilen: $$\\frac{8x}{12} = \\frac{2x}{3}$$ Im Nenner steht \\(3\\). Das \\(x\\) bleibt im Zähler, es kommt im Nenner nicht vor." },
      { id: 17, level: 3, typ: "numerisch", frage: "Kürze \\(\\frac{5x - 10}{5}\\) und berechne den Wert des gekürzten Terms für \\(x = 4\\).", loesung: 2, toleranz: 0, tipp: "Im Zähler zuerst \\(5\\) ausklammern.", loesungsweg: "Ausklammern und kürzen: $$\\frac{5x - 10}{5} = \\frac{5(x - 2)}{5} = x - 2$$ Für \\(x = 4\\): \\(4 - 2 = 2\\). Probe ohne Kürzen: \\(\\frac{20 - 10}{5} = 2\\) ✓" },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\(\\frac{x^2}{x}\\) für \\(x = 9\\).", loesung: 9, toleranz: 0, tipp: "Kürzen: \\(\\frac{x^2}{x} = x\\).", loesungsweg: "$$\\frac{x^2}{x} = x = 9$$" },
      // ========== LEVEL 4 ==========
      { id: 19, level: 4, typ: "mc", frage: "Welcher dieser Bruchterme lässt sich kürzen?", optionen: ["\\(\\frac{3x + 6}{3}\\)", "\\(\\frac{3x + 6}{x}\\)", "\\(\\frac{x + 6}{3}\\)", "\\(\\frac{3 + x}{6}\\)"], korrekt: 0, tipp: "Gekürzt werden darf nur ein gemeinsamer <b>Faktor</b> von Zähler und Nenner.", loesungsweg: "Im Zähler \\(3x + 6\\) lässt sich \\(3\\) ausklammern: $$\\frac{3x + 6}{3} = \\frac{3(x + 2)}{3} = x + 2$$ Bei \\(\\frac{3x + 6}{x}\\) ist \\(x\\) kein Faktor des ganzen Zählers (die \\(6\\) enthält kein \\(x\\)), bei den anderen beiden haben Zähler und Nenner keinen gemeinsamen Faktor. Aus Summen kürzen nur die Dummen." },
      { id: 20, level: 4, typ: "numerisch", frage: "Der Bruchterm \\(\\frac{2}{x}\\) soll den Nenner \\(6x^2\\) erhalten. Der neue Zähler hat die Form \\(a \\cdot x\\). Gib \\(a\\) an.", loesung: 12, toleranz: 0, tipp: "Womit muss \\(x\\) multipliziert werden, damit \\(6x^2\\) entsteht?", loesungsweg: "Vom Nenner \\(x\\) zum Nenner \\(6x^2\\) wird mit \\(6x\\) erweitert — Zähler und Nenner: $$\\frac{2}{x} = \\frac{2 \\cdot 6x}{x \\cdot 6x} = \\frac{12x}{6x^2}$$ Also \\(a = 12\\). Probe für \\(x = 1\\): \\(\\frac{2}{1} = 2\\) und \\(\\frac{12}{6} = 2\\) ✓" },
      { id: 21, level: 4, typ: "numerisch", frage: "Der Bruchterm \\(\\frac{5}{2x + a}\\) hat die Definitionslücke \\(x = 4\\). Bestimme \\(a\\).", loesung: -8, toleranz: 0, tipp: "An der Definitionslücke ist der Nenner null.", loesungsweg: "Umkehraufgabe: Der Nenner muss für \\(x = 4\\) null werden: $$2 \\cdot 4 + a = 0 \\;\\Rightarrow\\; a = -8$$ Probe: \\(\\frac{5}{2x - 8}\\) hat den Nenner \\(2 \\cdot 4 - 8 = 0\\) ✓" },
      { id: 22, level: 4, typ: "mc", frage: "Ein Rechteck hat den Flächeninhalt \\(24\\,\\text{cm}^2\\); eine Seite ist \\(x\\,\\text{cm}\\) lang. Welcher Term beschreibt die Länge der anderen Seite in cm?", optionen: ["\\(\\frac{24}{x}\\)", "\\(24 - x\\)", "\\(\\frac{x}{24}\\)", "\\(24x\\)"], korrekt: 0, tipp: "Flächeninhalt = Länge mal Breite.", loesungsweg: "Aus \\(A = x \\cdot b\\) folgt $$b = \\frac{24}{x}$$ Probe: Für \\(x = 6\\) ist die andere Seite \\(4\\,\\text{cm}\\), und \\(6 \\cdot 4 = 24\\) ✓ Der Term \\(24 - x\\) würde zum Umfang passen, nicht zur Fläche." },
      { id: 23, level: 4, typ: "numerisch", frage: "Für welchen positiven Wert von \\(x\\) ist \\(\\frac{x - 3}{x^2 - 16}\\) nicht definiert?", loesung: 4, toleranz: 0, tipp: "Für welche \\(x\\) wird \\(x^2 - 16\\) null?", loesungsweg: "Nenner null setzen: $$x^2 - 16 = 0 \\;\\Rightarrow\\; x^2 = 16 \\;\\Rightarrow\\; x = 4 \\text{ oder } x = -4$$ Der positive Wert ist \\(4\\). Die \\(3\\) im Zähler spielt für die Definitionsmenge keine Rolle — nur der Nenner entscheidet." },
      { id: 24, level: 4, typ: "numerisch", frage: "Vereinfache \\(\\frac{4x^2 - 8x}{2x}\\) so weit wie möglich und berechne den Wert für \\(x = 7\\).", loesung: 10, toleranz: 0, tipp: "Im Zähler den gemeinsamen Faktor ausklammern.", loesungsweg: "Ausklammern, dann kürzen: $$\\frac{4x^2 - 8x}{2x} = \\frac{4x(x - 2)}{2x} = 2(x - 2) = 2x - 4$$ Für \\(x = 7\\): \\(14 - 4 = 10\\). Probe ohne Kürzen: \\(\\frac{196 - 56}{14} = \\frac{140}{14} = 10\\) ✓" },
      // ========== LEVEL 5 ==========
      { id: 25, level: 5, typ: "mc", frage: "Nele kürzt: \\(\\frac{x + 4}{x + 8} = \\frac{1}{2}\\). Was ist dazu zu sagen?", optionen: ["Falsch — aus Summen darf nicht gekürzt werden; für \\(x = 4\\) ergibt sich \\(\\frac{8}{12} = \\frac{2}{3} \\neq \\frac{1}{2}\\)", "Richtig, weil \\(4 : 8 = \\frac{1}{2}\\) ist", "Falsch — richtig ist \\(\\frac{x + 4}{x + 8} = \\frac{x}{x} + \\frac{4}{8} = 1{,}5\\)", "Richtig, aber nur für \\(x \\neq -8\\)"], korrekt: 0, tipp: "Setze eine Zahl für \\(x\\) ein und vergleiche mit \\(\\frac{1}{2}\\).", loesungsweg: "Kürzen heißt Zähler und Nenner durch denselben <b>Faktor</b> teilen. \\(4\\) und \\(8\\) sind hier Summanden, kein Faktor. Probe: $$x = 4:\\; \\frac{8}{12} = \\frac{2}{3}, \\qquad x = 0:\\; \\frac{4}{8} = \\frac{1}{2}$$ Für \\(x = 0\\) stimmt der Wert zufällig, für andere \\(x\\) nicht — der Term lässt sich gar nicht kürzen." },
      { id: 26, level: 5, typ: "numerisch", frage: "Der Bruchterm \\(\\frac{x + a}{x - b}\\) hat die Definitionslücke \\(x = 5\\) und für \\(x = 1\\) den Wert \\(-2\\). Bestimme \\(a\\).", loesung: 7, toleranz: 0, tipp: "Die Definitionslücke verrät zuerst \\(b\\).", loesungsweg: "Nenner null bei \\(x = 5\\): \\(5 - b = 0\\), also \\(b = 5\\). Zweite Bedingung: $$\\frac{1 + a}{1 - 5} = -2 \\;\\Rightarrow\\; \\frac{1 + a}{-4} = -2 \\;\\Rightarrow\\; 1 + a = 8 \\;\\Rightarrow\\; a = 7$$ Probe: \\(\\frac{1 + 7}{1 - 5} = \\frac{8}{-4} = -2\\) ✓" },
      { id: 27, level: 5, typ: "numerisch", frage: "Der Bruchterm \\(\\frac{x^2 - 9}{x + 3}\\) wird vollständig gekürzt. Für welches \\(x\\) hat der gekürzte Term den Wert \\(12\\)?", loesung: 15, toleranz: 0, tipp: "Der Zähler ist eine binomische Formel.", loesungsweg: "Dritte binomische Formel: $$\\frac{x^2 - 9}{x + 3} = \\frac{(x - 3)(x + 3)}{x + 3} = x - 3$$ Dann \\(x - 3 = 12\\), also \\(x = 15\\). Probe im Ausgangsterm: \\(\\frac{225 - 9}{18} = \\frac{216}{18} = 12\\) ✓ und \\(15 \\neq -3\\), liegt also in der Definitionsmenge." },
      { id: 28, level: 5, typ: "mc", frage: "Ben bestimmt die Definitionsmenge von \\(\\frac{x - 2}{x(x + 5)}\\): „Der Nenner wird null für \\(x = -5\\), also \\(D = \\mathbb{Q} \\setminus \\{-5\\}\\).“ Was ist dazu zu sagen?", optionen: ["Falsch — auch der Faktor \\(x\\) wird null: \\(D = \\mathbb{Q} \\setminus \\{0; -5\\}\\)", "Richtig", "Falsch — zusätzlich muss \\(x = 2\\) ausgeschlossen werden", "Falsch — der Nenner wird für \\(x = 5\\) null, nicht für \\(-5\\)"], korrekt: 0, tipp: "Ein Produkt ist null, sobald ein Faktor null ist.", loesungsweg: "Der Nenner \\(x(x + 5)\\) ist ein Produkt: $$x = 0 \\quad\\text{oder}\\quad x + 5 = 0 \\;\\Rightarrow\\; x = -5$$ Beide Werte müssen ausgeschlossen werden. \\(x = 2\\) macht nur den Zähler null — dort hat der Term den Wert \\(0\\) und ist definiert." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Rechteck hat den Flächeninhalt \\(60\\,\\text{cm}^2\\); eine Seite ist \\(x\\,\\text{cm}\\) lang. Um wie viele Zentimeter ist die andere Seite für \\(x = 5\\) länger als für \\(x = 12\\)?", loesung: 7, toleranz: 0, tipp: "Erst einen Term für die andere Seite aufstellen.", loesungsweg: "Andere Seite: \\(\\frac{60}{x}\\). $$\\frac{60}{5} - \\frac{60}{12} = 12 - 5 = 7\\,\\text{cm}$$ Je länger die eine Seite, desto kürzer die andere — der Bruchterm beschreibt eine umgekehrt proportionale Zuordnung." },
      { id: 30, level: 5, typ: "numerisch", frage: "Für welchen Wert von \\(c\\) lässt sich \\(\\frac{x^2 + cx}{x + 6}\\) zu \\(x\\) kürzen?", loesung: 6, toleranz: 0, tipp: "Klammere im Zähler \\(x\\) aus.", loesungsweg: "Ausklammern: \\(x^2 + cx = x(x + c)\\). Damit gegen den Nenner gekürzt werden kann, muss \\(x + c = x + 6\\) sein: $$c = 6 \\quad\\Rightarrow\\quad \\frac{x(x + 6)}{x + 6} = x$$ Probe für \\(x = 2\\): \\(\\frac{4 + 12}{8} = 2\\) ✓" },
      // ========== LEVEL 6 ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Die Terme \\(\\frac{x^2 - 4}{x - 2}\\) und \\(x + 2\\) haben für jede Zahl \\(x\\) denselben Wert.“", optionen: ["Falsch — für \\(x = 2\\) ist der Bruchterm nicht definiert, \\(x + 2\\) dagegen schon; für alle anderen \\(x\\) stimmen die Werte überein", "Richtig — nach dem Kürzen ist es derselbe Term", "Falsch — die Werte stimmen nur für \\(x = 0\\) überein", "Falsch — beim Kürzen ergibt sich \\(x - 2\\)"], korrekt: 0, tipp: "Was passiert im Bruchterm bei \\(x = 2\\)?", loesungsweg: "Kürzen: \\(\\frac{(x - 2)(x + 2)}{x - 2} = x + 2\\) — aber nur, solange \\(x - 2 \\neq 0\\). Für \\(x = 2\\): $$\\frac{4 - 4}{2 - 2} = \\frac{0}{0}$$ nicht definiert, während \\(x + 2 = 4\\) ist. Beim Kürzen ändert sich die Definitionsmenge nicht: Die Lücke \\(x = 2\\) bleibt." },
      { id: 32, level: 6, typ: "numerisch", frage: "Ein Bruchterm hat die Form \\(\\frac{x + p}{x + q}\\), die Definitionslücke \\(x = -4\\) und den Wert \\(0\\) genau für \\(x = 1\\). Berechne den Wert des Terms für \\(x = 6\\).", loesung: 0.5, toleranz: 0.01, tipp: "Definitionslücke → Nenner, Nullstelle → Zähler.", loesungsweg: "Nenner null bei \\(x = -4\\): \\(q = 4\\). Zähler null bei \\(x = 1\\): \\(p = -1\\). Der Term lautet \\(\\frac{x - 1}{x + 4}\\): $$\\frac{6 - 1}{6 + 4} = \\frac{5}{10} = 0{,}5$$ Probe: \\(x = 1\\) gibt \\(\\frac{0}{5} = 0\\) ✓, \\(x = -4\\) gibt Nenner \\(0\\) ✓" },
      { id: 33, level: 6, typ: "mc", frage: "Behauptung: „Ein Bruchterm hat genau dann den Wert \\(0\\), wenn sein Zähler \\(0\\) ist.“", optionen: ["Falsch — der Nenner darf an dieser Stelle nicht ebenfalls \\(0\\) sein, z. B. \\(\\frac{x - 1}{x - 1}\\) für \\(x = 1\\)", "Richtig — ein Bruch ist null, wenn der Zähler null ist", "Falsch — ein Bruchterm hat den Wert \\(0\\), wenn der Nenner \\(0\\) ist", "Falsch — ein Bruchterm kann nie den Wert \\(0\\) haben"], korrekt: 0, tipp: "Was ist mit Stellen, an denen Zähler und Nenner gleichzeitig null sind?", loesungsweg: "Zähler null ist nötig, aber nicht ausreichend: Bei \\(\\frac{x - 1}{x - 1}\\) ist für \\(x = 1\\) auch der Nenner null — der Term ist dort nicht definiert, hat also nicht den Wert \\(0\\). Richtig lautet die Regel: $$\\text{Zähler} = 0 \\quad\\text{und}\\quad \\text{Nenner} \\neq 0$$ Beispiel: \\(\\frac{x - 4}{x + 2}\\) ist null für \\(x = 4\\), denn \\(4 + 2 \\neq 0\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für wie viele ganze Zahlen \\(x\\) ist der Wert von \\(\\frac{x - 1}{x - 5}\\) negativ?", loesung: 3, toleranz: 0, tipp: "Ein Bruch ist negativ, wenn Zähler und Nenner verschiedene Vorzeichen haben.", loesungsweg: "Fallunterscheidung: Zähler positiv und Nenner negativ heißt \\(x > 1\\) und \\(x < 5\\), also \\(1 < x < 5\\). Zähler negativ und Nenner positiv hieße \\(x < 1\\) und \\(x > 5\\) — unmöglich. Ganze Zahlen zwischen \\(1\\) und \\(5\\): $$x = 2;\\; 3;\\; 4$$ Probe: \\(x = 3\\): \\(\\frac{2}{-2} = -1 < 0\\) ✓, \\(x = 1\\) ergibt \\(0\\), \\(x = 5\\) ist Definitionslücke." },
      { id: 35, level: 6, typ: "numerisch", frage: "Kürzt man \\(\\frac{x^2 - 9}{x - 3}\\), erhält man \\(x + 3\\). Für genau eine Zahl \\(x\\) hat der gekürzte Term einen Wert, obwohl der ursprüngliche Bruchterm dort nicht definiert ist. Welche Zahl ist das?", loesung: 3, toleranz: 0, tipp: "Für welche Zahl wird der Nenner des ursprünglichen Terms null?", loesungsweg: "Kürzen ist nur erlaubt, wo der Nenner nicht null ist: \\(x - 3 = 0 \\Rightarrow x = 3\\). $$\\frac{x^2 - 9}{x - 3} = \\frac{(x + 3)(x - 3)}{x - 3} = x + 3 \\quad (x \\neq 3)$$ Für \\(x = 3\\) liefert \\(x + 3\\) den Wert \\(6\\), der Bruchterm aber \\(\\frac{0}{0}\\) — nicht definiert. Die Definitionsmenge bleibt beim Kürzen erhalten; die beiden Terme sind nur für \\(x \\neq 3\\) gleich." },
      { id: 36, level: 6, typ: "mc", frage: "Welche Aussage über \\(\\frac{4}{x^2 + 1}\\) ist richtig?", optionen: ["Der Term ist für jede Zahl \\(x\\) definiert, weil \\(x^2 + 1\\) nie null wird", "Der Term ist für \\(x = -1\\) nicht definiert", "Der Term ist für \\(x = 1\\) und \\(x = -1\\) nicht definiert", "Der Term ist für \\(x = 0\\) nicht definiert"], korrekt: 0, tipp: "Kann \\(x^2\\) negativ werden?", loesungsweg: "Nenner null setzen: \\(x^2 + 1 = 0 \\Rightarrow x^2 = -1\\). Ein Quadrat ist nie negativ, diese Gleichung hat keine Lösung: $$x^2 + 1 \\geq 1 > 0 \\text{ für alle } x$$ Sonderfall: ein Bruchterm ohne Definitionslücke, \\(D = \\mathbb{Q}\\). Für \\(x = \\pm 1\\) ist der Nenner \\(2\\), für \\(x = 0\\) ist er \\(1\\)." }];
    </script>
