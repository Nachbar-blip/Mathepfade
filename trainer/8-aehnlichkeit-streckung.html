<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aehnlichkeit &amp; zentrische Streckung - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-aehnlichkeit-streckung';
    const THEMA_CONFIG = { name: 'Aehnlichkeit & zentrische Streckung', bereich: 'geometrie' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht: Grundbegriffe ==========
      { id: 1, level: 1, typ: "mc", frage: "Was bedeutet das Symbol \\(\\sim\\) in der Geometrie?", optionen: ["kongruent", "ähnlich", "parallel", "senkrecht"], korrekt: 1, tipp: "Das Symbol \\(\\sim\\) wird für Figuren verwendet, die die gleiche Form haben.", loesungsweg: "\\(\\sim\\) heisst <b>ähnlich</b>: gleiche Form, evtl. unterschiedliche Größe." },
      { id: 2, level: 1, typ: "mc", frage: "Bei einer zentrischen Streckung mit \\(k = 2\\) wird eine Figur ...", optionen: ["halbiert", "gleich gross", "doppelt so gross", "gespiegelt"], korrekt: 2, tipp: "Der Streckungsfaktor gibt die Größenänderung an.", loesungsweg: "Faktor \\(k = 2\\) verdoppelt alle Strecken." },
      { id: 3, level: 1, typ: "mc", frage: "Was bleibt bei einer zentrischen Streckung gleich?", optionen: ["Streckenlängen", "Winkelgrößen", "Flächeninhalt", "Umfang"], korrekt: 1, tipp: "Form bleibt erhalten, Größe ändert sich.", loesungsweg: "<b>Winkel</b> bleiben bei zentrischer Streckung unverändert." },
      { id: 4, level: 1, typ: "mc", frage: "Zwei Figuren sind ähnlich, wenn ...", optionen: ["sie gleich gross sind", "sie die gleiche Form haben", "sie den gleichen Umfang haben", "sie sich berühren"], korrekt: 1, tipp: "Aehnlich bedeutet: gleiche Form.", loesungsweg: "Aehnliche Figuren haben gleiche Winkel und proportionale Seiten." },
      { id: 5, level: 1, typ: "numerisch", frage: "Ein Dreieck hat die Seite \\(a = 4\\,\\text{cm}\\). Es wird mit \\(k = 3\\) gestreckt. Wie lang ist die neue Seite in cm?", loesung: 12, toleranz: 0, tipp: "Multipliziere mit \\(k\\).", loesungsweg: "$$a' = k \\cdot a = 3 \\cdot 4 = 12\\,\\text{cm}$$" },
      { id: 6, level: 1, typ: "mc", frage: "Das Streckungszentrum ...", optionen: ["verändert seine Lage", "bleibt als einziger Punkt fest", "wird verdoppelt", "verschwindet"], korrekt: 1, tipp: "Der Mittelpunkt der Streckung ist der Fixpunkt.", loesungsweg: "Das <b>Streckungszentrum</b> bleibt als einziger Punkt an seiner Stelle." },
      // ========== LEVEL 2 -- leicht: Streckungsfaktor bestimmen ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Urbild: \\(a = 5\\,\\text{cm}\\). Bild: \\(a' = 15\\,\\text{cm}\\). Berechne \\(k\\).", loesung: 3, toleranz: 0, tipp: "\\(k = \\frac{a'}{a}\\).", loesungsweg: "$$k = \\frac{15}{5} = 3$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Urbild: \\(b = 8\\,\\text{cm}\\). Bild: \\(b' = 4\\,\\text{cm}\\). Berechne \\(k\\).", loesung: 0.5, toleranz: 0.01, tipp: "\\(k = \\frac{b'}{b}\\). Hier wird die Figur kleiner.", loesungsweg: "$$k = \\frac{4}{8} = 0{,}5$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Eine Strecke von \\(6\\,\\text{cm}\\) wird mit \\(k = 2{,}5\\) gestreckt. Länge des Bildes in cm?", loesung: 15, toleranz: 0, tipp: "\\(a' = k \\cdot a\\).", loesungsweg: "$$a' = 2{,}5 \\cdot 6 = 15\\,\\text{cm}$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Eine Strecke von \\(20\\,\\text{cm}\\) wird mit \\(k = 0{,}4\\) gestreckt. Länge in cm?", loesung: 8, toleranz: 0, tipp: "\\(k < 1\\) verkleinert.", loesungsweg: "$$a' = 0{,}4 \\cdot 20 = 8\\,\\text{cm}$$" },
      { id: 11, level: 2, typ: "mc", frage: "Bei \\(k = 1\\) ist das Bild ...", optionen: ["kleiner", "größer", "deckungsgleich mit dem Urbild", "gespiegelt"], korrekt: 2, tipp: "Faktor 1 bedeutet keine Größenänderung.", loesungsweg: "Bei \\(k = 1\\) ist das Bild <b>identisch</b> mit dem Urbild." },
      { id: 12, level: 2, typ: "numerisch", frage: "Ein Quadrat mit Seite \\(3\\,\\text{cm}\\) wird mit \\(k = 4\\) gestreckt. Neue Seite in cm?", loesung: 12, toleranz: 0, tipp: "Jede Seite mal \\(k\\).", loesungsweg: "Bei einer zentrischen Streckung wird jede Länge mit dem Faktor \\(k\\) multipliziert: $$3\\,\\text{cm} \\cdot 4 = 12\\,\\text{cm}$$ Die Fläche wächst dabei mit \\(k^2 = 16\\): von \\(9\\,\\text{cm}^2\\) auf \\(144\\,\\text{cm}^2\\)." },
      // ========== LEVEL 3 -- nervenschonend: Seitenverhältnisse ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Zwei ähnliche Dreiecke: \\(a = 3\\), \\(a' = 9\\). Seite \\(b = 4\\). Wie gross ist \\(b'\\)?", loesung: 12, toleranz: 0, tipp: "Gleicher Faktor für alle Seiten. \\(k = 3\\).", loesungsweg: "$$k = \\frac{9}{3} = 3 \\implies b' = 3 \\cdot 4 = 12$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Aehnliche Rechtecke: Urbild \\(2 \\times 5\\), Bild hat Länge \\(15\\). Wie breit ist das Bild?", loesung: 6, toleranz: 0, tipp: "\\(k = \\frac{15}{5} = 3\\). Breite auch mal 3.", loesungsweg: "$$k = 3 \\implies b' = 3 \\cdot 2 = 6$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Dreieck mit Seiten \\(3, 4, 5\\) wird mit \\(k = 4\\) gestreckt. Wie lang ist die größte Seite?", loesung: 20, toleranz: 0, tipp: "Längste Seite ist \\(5\\).", loesungsweg: "Alle Seiten werden mit \\(k\\) multipliziert, die Reihenfolge der Größen bleibt erhalten: $$5 \\cdot 4 = 20$$ Das Bilddreieck hat also die Seiten \\(12\\), \\(16\\), \\(20\\) — wieder ein rechtwinkliges Dreieck, denn Streckung erhält die Winkel." },
      { id: 16, level: 3, typ: "mc", frage: "Zwei Quadrate sind ...", optionen: ["nie ähnlich", "immer ähnlich", "nur bei gleicher Seitenlänge ähnlich", "nur bei bestimmten Winkeln"], korrekt: 1, tipp: "Alle Winkel und Seitenverhältnisse gleich?", loesungsweg: "Alle Quadrate haben rechte Winkel und gleiche Seiten -- sie sind <b>stets ähnlich</b>." },
      { id: 17, level: 3, typ: "numerisch", frage: "Aehnliche Dreiecke: \\(a = 6\\,\\text{cm}\\), \\(a' = 2\\,\\text{cm}\\). Bestimme \\(k\\).", loesung: 0.333, toleranz: 0.01, tipp: "\\(k = \\frac{a'}{a} = \\frac{2}{6} = \\frac{1}{3}\\).", loesungsweg: "$$k = \\frac{2}{6} = \\frac{1}{3} \\approx 0{,}333$$" },
      { id: 18, level: 3, typ: "mc", frage: "Bei einer Landkarte mit Massstab \\(1 : 50\\,000\\) entspricht \\(1\\,\\text{cm}\\) in der Karte in der Realität ...", optionen: ["\\(50\\,\\text{m}\\)", "\\(500\\,\\text{m}\\)", "\\(5\\,\\text{km}\\)", "\\(0{,}5\\,\\text{km}\\)"], korrekt: 1, tipp: "\\(50\\,000\\,\\text{cm} = 500\\,\\text{m}\\).", loesungsweg: "$$1\\,\\text{cm} \\cdot 50\\,000 = 50\\,000\\,\\text{cm} = 500\\,\\text{m}$$" },
      // ========== LEVEL 4 -- mittel: Flächen und Umfang ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Ein Quadrat hat Umfang \\(12\\,\\text{cm}\\). Es wird mit \\(k = 3\\) gestreckt. Neuer Umfang in cm?", loesung: 36, toleranz: 0, tipp: "Umfang mal \\(k\\).", loesungsweg: "$$U' = k \\cdot U = 3 \\cdot 12 = 36\\,\\text{cm}$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Ein Quadrat mit Fläche \\(9\\,\\text{cm}^2\\) wird mit \\(k = 2\\) gestreckt. Neue Fläche in cm\\(^2\\)?", loesung: 36, toleranz: 0, tipp: "Fläche mal \\(k^2\\).", loesungsweg: "$$A' = k^2 \\cdot A = 4 \\cdot 9 = 36\\,\\text{cm}^2$$" },
      { id: 21, level: 4, typ: "mc", frage: "Bei einer zentrischen Streckung mit \\(k = 3\\) wächst die Fläche um den Faktor ...", optionen: ["\\(3\\)", "\\(6\\)", "\\(9\\)", "\\(27\\)"], korrekt: 2, tipp: "Flächenfaktor = \\(k^2\\).", loesungsweg: "$$k^2 = 3^2 = 9$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Dreieck mit Fläche \\(20\\,\\text{cm}^2\\) wird mit \\(k = 0{,}5\\) gestreckt. Neue Fläche in cm\\(^2\\)?", loesung: 5, toleranz: 0, tipp: "\\(A' = k^2 \\cdot A\\).", loesungsweg: "$$A' = 0{,}25 \\cdot 20 = 5\\,\\text{cm}^2$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Ein Rechteck hat Fläche \\(12\\,\\text{cm}^2\\). Nach Streckung hat das Bild \\(108\\,\\text{cm}^2\\). Bestimme \\(k\\).", loesung: 3, toleranz: 0, tipp: "\\(k^2 = \\frac{108}{12} = 9\\).", loesungsweg: "$$k^2 = 9 \\implies k = 3$$" },
      { id: 24, level: 4, typ: "mc", frage: "Um eine Fläche zu verdoppeln, muss der Streckungsfaktor sein ...", optionen: ["\\(2\\)", "\\(\\sqrt{2}\\)", "\\(4\\)", "\\(0{,}5\\)"], korrekt: 1, tipp: "\\(k^2 = 2 \\Rightarrow k = \\sqrt{2}\\).", loesungsweg: "Flächen wachsen mit dem <b>Quadrat</b> des Streckungsfaktors: $$k^2 = 2 \\;\\Rightarrow\\; k = \\sqrt2 \\approx 1{,}414$$ Mit \\(k = 2\\) würde die Fläche vervierfacht, nicht verdoppelt. Dasselbe Prinzip steckt hinter den DIN-Papierformaten." },
      // ========== LEVEL 5 -- anspruchsvoll: Anwendungen ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Ein Baum wirft im gleichen Moment einen Schatten von \\(8\\,\\text{m}\\), ein \\(1{,}5\\,\\text{m}\\) hoher Stock wirft \\(2\\,\\text{m}\\) Schatten. Baumhöhe in m?", loesung: 6, toleranz: 0, tipp: "\\(\\frac{h}{8} = \\frac{1{,}5}{2}\\).", loesungsweg: "$$h = \\frac{1{,}5}{2} \\cdot 8 = 6\\,\\text{m}$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Massstab \\(1 : 200\\). Im Plan \\(4\\,\\text{cm}\\). Wie viele Meter in Wirklichkeit?", loesung: 8, toleranz: 0, tipp: "\\(4 \\cdot 200 = 800\\,\\text{cm} = 8\\,\\text{m}\\).", loesungsweg: "$$4\\,\\text{cm} \\cdot 200 = 800\\,\\text{cm} = 8\\,\\text{m}$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Foto (Breite \\(15\\,\\text{cm}\\), Höhe \\(10\\,\\text{cm}\\)) wird auf Breite \\(30\\,\\text{cm}\\) vergrößert. Neue Höhe in cm?", loesung: 20, toleranz: 0, tipp: "\\(k = \\frac{30}{15} = 2\\).", loesungsweg: "$$k = 2 \\implies h' = 2 \\cdot 10 = 20\\,\\text{cm}$$" },
      { id: 28, level: 5, typ: "mc", frage: "Zwei Dreiecke sind ähnlich. Die Seiten des ersten sind \\(3, 4, 5\\), die längste Seite des zweiten ist \\(15\\). Welche Seiten hat das zweite?", optionen: ["\\(9, 12, 15\\)", "\\(6, 8, 15\\)", "\\(3, 4, 15\\)", "\\(5, 10, 15\\)"], korrekt: 0, tipp: "\\(k = \\frac{15}{5} = 3\\).", loesungsweg: "Der Streckungsfaktor folgt aus dem Verhältnis entsprechender Seiten: $$k = \\frac{15}{5} = 3$$ Damit werden auch die übrigen Seiten gestreckt: \\(3 \\cdot 3 = 9\\) und \\(4 \\cdot 3 = 12\\), also \\(9\\), \\(12\\), \\(15\\). Bei ähnlichen Figuren muss <b>jede</b> Seite mit demselben Faktor multipliziert werden." },
      { id: 29, level: 5, typ: "numerisch", frage: "Modellauto Massstab \\(1 : 18\\). Reales Auto \\(4{,}5\\,\\text{m}\\) lang. Modelllänge in cm?", loesung: 25, toleranz: 0, tipp: "\\(450\\,\\text{cm} : 18 = 25\\,\\text{cm}\\).", loesungsweg: "Der Maßstab \\(1:18\\) bedeutet, dass die Wirklichkeit 18-mal so groß ist. Zuerst in dieselbe Einheit umrechnen: $$4{,}5\\,\\text{m} = 450\\,\\text{cm}$$ $$\\frac{450\\,\\text{cm}}{18} = 25\\,\\text{cm}$$ Das Umrechnen der Einheit vor dem Teilen erspart den häufigsten Fehler bei Maßstabsaufgaben." },
      { id: 30, level: 5, typ: "numerisch", frage: "Aehnliche Dreiecke. Fläche Urbild: \\(5\\,\\text{cm}^2\\), Fläche Bild: \\(45\\,\\text{cm}^2\\). Streckungsfaktor \\(k\\)?", loesung: 3, toleranz: 0, tipp: "\\(k^2 = 9\\).", loesungsweg: "$$k^2 = \\frac{45}{5} = 9 \\implies k = 3$$" },
      // ========== LEVEL 6 -- wagnerisch: Transfer ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Urbild Dreieck: Fläche \\(8\\,\\text{cm}^2\\), Umfang \\(12\\,\\text{cm}\\). Streckung mit \\(k = 2{,}5\\). Neue Fläche in cm\\(^2\\)?", loesung: 50, toleranz: 0, tipp: "\\(A' = k^2 \\cdot A = 6{,}25 \\cdot 8\\).", loesungsweg: "$$A' = 2{,}5^2 \\cdot 8 = 6{,}25 \\cdot 8 = 50\\,\\text{cm}^2$$" },
      { id: 32, level: 6, typ: "mc", frage: "Welche Aussage ist <b>falsch</b>?", optionen: ["Kongruente Figuren sind stets ähnlich.", "Aehnliche Figuren sind stets kongruent.", "Bei \\(k = 1\\) sind Urbild und Bild kongruent.", "Aehnliche Figuren haben gleiche Winkel."], korrekt: 1, tipp: "Kongruenz ist strenger als Aehnlichkeit.", loesungsweg: "<b>Aehnliche Figuren sind nicht immer kongruent</b> -- sie können unterschiedlich gross sein." },
      { id: 33, level: 6, typ: "numerisch", frage: "Ein Kreis mit Radius \\(5\\,\\text{cm}\\) wird mit \\(k = 2\\) gestreckt. Um welchen Faktor wächst die Kreisfläche?", loesung: 4, toleranz: 0, tipp: "Flächenfaktor = \\(k^2\\).", loesungsweg: "$$k^2 = 4$$ Die Fläche wächst um den Faktor 4." },
      { id: 34, level: 6, typ: "numerisch", frage: "Zwei ähnliche Quadrate. Verhältnis der Umfänge \\(1 : 4\\). Verhältnis der Flächen \\(1 : x\\). Bestimme \\(x\\).", loesung: 16, toleranz: 0, tipp: "\\(k = 4\\), Flächenverhältnis \\(k^2\\).", loesungsweg: "$$k = 4 \\implies k^2 = 16$$" },
      { id: 35, level: 6, typ: "mc", frage: "Ein Dreieck mit Fläche \\(A\\) wird mit \\(k = 0{,}5\\) gestreckt. Die neue Fläche beträgt ...", optionen: ["\\(0{,}5 A\\)", "\\(0{,}25 A\\)", "\\(2 A\\)", "\\(4 A\\)"], korrekt: 1, tipp: "\\(k^2 = 0{,}25\\).", loesungsweg: "$$A' = 0{,}5^2 \\cdot A = 0{,}25 A$$" },
      { id: 36, level: 6, typ: "numerisch", frage: "Aehnliche Dreiecke mit Flächen \\(4\\,\\text{cm}^2\\) und \\(100\\,\\text{cm}^2\\). Verhältnis der Seiten \\(1 : k\\). Bestimme \\(k\\).", loesung: 5, toleranz: 0, tipp: "\\(k^2 = \\frac{100}{4} = 25\\).", loesungsweg: "$$k = \\sqrt{25} = 5$$" }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
