<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ähnlichkeit &amp; zentrische Streckung - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-aehnlichkeit-streckung';
    const THEMA_CONFIG = { name: 'Ähnlichkeit & zentrische Streckung', bereich: 'geometrie' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht: Grundbegriffe ==========
      { id: 1, level: 1, typ: "mc", frage: "Was bedeutet das Symbol \\(\\sim\\) in der Geometrie?", optionen: ["kongruent", "ähnlich", "parallel", "senkrecht"], korrekt: 1, tipp: "Das Symbol \\(\\sim\\) wird für Figuren verwendet, die die gleiche Form haben.", loesungsweg: "\\(\\sim\\) heißt <b>ähnlich</b>: gleiche Form, evtl. unterschiedliche Größe." },
      { id: 2, level: 1, typ: "mc", frage: "Bei einer zentrischen Streckung mit \\(k = 2\\) wird eine Figur ...", optionen: ["halbiert", "gleich groß", "doppelt so groß", "gespiegelt"], korrekt: 2, tipp: "Der Streckungsfaktor gibt die Größenänderung an.", loesungsweg: "Faktor \\(k = 2\\) verdoppelt alle Strecken." },
      { id: 3, level: 1, typ: "mc", frage: "Was bleibt bei einer zentrischen Streckung gleich?", optionen: ["Streckenlängen", "Winkelgrößen", "Flächeninhalt", "Umfang"], korrekt: 1, tipp: "Form bleibt erhalten, Größe ändert sich.", loesungsweg: "<b>Winkel</b> bleiben bei zentrischer Streckung unverändert." },
      { id: 4, level: 1, typ: "mc", frage: "Zwei Figuren sind ähnlich, wenn ...", optionen: ["sie gleich groß sind", "sie die gleiche Form haben", "sie den gleichen Umfang haben", "sie sich berühren"], korrekt: 1, tipp: "Ähnlich bedeutet: gleiche Form.", loesungsweg: "Ähnliche Figuren haben gleiche Winkel und proportionale Seiten." },
      { id: 5, level: 1, typ: "numerisch", frage: "Ein Dreieck hat die Seite \\(a = 4\\,\\text{cm}\\). Es wird mit \\(k = 3\\) gestreckt. Wie lang ist die neue Seite in cm?", loesung: 12, toleranz: 0, tipp: "Multipliziere mit \\(k\\).", loesungsweg: "$$a' = k \\cdot a = 3 \\cdot 4 = 12\\,\\text{cm}$$" },
      { id: 6, level: 1, typ: "mc", frage: "Das Streckungszentrum ...", optionen: ["verändert seine Lage", "bleibt als einziger Punkt fest", "wird verdoppelt", "verschwindet"], korrekt: 1, tipp: "Der Mittelpunkt der Streckung ist der Fixpunkt.", loesungsweg: "Das <b>Streckungszentrum</b> bleibt als einziger Punkt an seiner Stelle." },
      // ========== LEVEL 2 -- leicht: Streckungsfaktor bestimmen ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Urbild: \\(a = 5\\,\\text{cm}\\). Bild: \\(a' = 15\\,\\text{cm}\\). Berechne \\(k\\).", loesung: 3, toleranz: 0, tipp: "\\(k = \\frac{a'}{a}\\).", loesungsweg: "$$k = \\frac{15}{5} = 3$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Urbild: \\(b = 8\\,\\text{cm}\\). Bild: \\(b' = 4\\,\\text{cm}\\). Berechne \\(k\\).", loesung: 0.5, toleranz: 0.01, tipp: "\\(k = \\frac{b'}{b}\\). Hier wird die Figur kleiner.", loesungsweg: "$$k = \\frac{4}{8} = 0{,}5$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Eine Strecke von \\(6\\,\\text{cm}\\) wird mit \\(k = 2{,}5\\) gestreckt. Länge des Bildes in cm?", loesung: 15, toleranz: 0, tipp: "\\(a' = k \\cdot a\\).", loesungsweg: "$$a' = 2{,}5 \\cdot 6 = 15\\,\\text{cm}$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Eine Strecke von \\(20\\,\\text{cm}\\) wird mit \\(k = 0{,}4\\) gestreckt. Länge in cm?", loesung: 8, toleranz: 0, tipp: "\\(k < 1\\) verkleinert.", loesungsweg: "$$a' = 0{,}4 \\cdot 20 = 8\\,\\text{cm}$$" },
      { id: 11, level: 2, typ: "mc", frage: "Bei \\(k = 1\\) ist das Bild ...", optionen: ["kleiner", "größer", "deckungsgleich mit dem Urbild", "gespiegelt"], korrekt: 2, tipp: "Faktor 1 bedeutet keine Größenänderung.", loesungsweg: "Bei \\(k = 1\\) ist das Bild <b>identisch</b> mit dem Urbild." },
      { id: 12, level: 2, typ: "numerisch", frage: "Ein Quadrat mit Seite \\(3\\,\\text{cm}\\) wird mit \\(k = 4\\) gestreckt. Neue Seite in cm?", loesung: 12, toleranz: 0, tipp: "Jede Seite mal \\(k\\).", loesungsweg: "Bei einer zentrischen Streckung wird jede Länge mit dem Faktor \\(k\\) multipliziert: $$3\\,\\text{cm} \\cdot 4 = 12\\,\\text{cm}$$ Die Fläche wächst dabei mit \\(k^2 = 16\\): von \\(9\\,\\text{cm}^2\\) auf \\(144\\,\\text{cm}^2\\)." },
      // ========== LEVEL 3 -- nervenschonend: Seitenverhältnisse ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Zwei ähnliche Dreiecke: \\(a = 3\\), \\(a' = 9\\). Seite \\(b = 4\\). Wie groß ist \\(b'\\)?", loesung: 12, toleranz: 0, tipp: "Gleicher Faktor für alle Seiten. \\(k = 3\\).", loesungsweg: "$$k = \\frac{9}{3} = 3 \\implies b' = 3 \\cdot 4 = 12$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Ähnliche Rechtecke: Urbild \\(2 \\times 5\\), Bild hat Länge \\(15\\). Wie breit ist das Bild?", loesung: 6, toleranz: 0, tipp: "\\(k = \\frac{15}{5} = 3\\). Breite auch mal 3.", loesungsweg: "$$k = 3 \\implies b' = 3 \\cdot 2 = 6$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Dreieck mit Seiten \\(3, 4, 5\\) wird mit \\(k = 4\\) gestreckt. Wie lang ist die größte Seite?", loesung: 20, toleranz: 0, tipp: "Längste Seite ist \\(5\\).", loesungsweg: "Alle Seiten werden mit \\(k\\) multipliziert, die Reihenfolge der Größen bleibt erhalten: $$5 \\cdot 4 = 20$$ Das Bilddreieck hat also die Seiten \\(12\\), \\(16\\), \\(20\\) — wieder ein rechtwinkliges Dreieck, denn Streckung erhält die Winkel." },
      { id: 16, level: 3, typ: "mc", frage: "Zwei Quadrate sind ...", optionen: ["nie ähnlich", "immer ähnlich", "nur bei gleicher Seitenlänge ähnlich", "nur bei bestimmten Winkeln"], korrekt: 1, tipp: "Alle Winkel und Seitenverhältnisse gleich?", loesungsweg: "Alle Quadrate haben rechte Winkel und gleiche Seiten -- sie sind <b>stets ähnlich</b>." },
      { id: 17, level: 3, typ: "numerisch", frage: "Ähnliche Dreiecke: \\(a = 6\\,\\text{cm}\\), \\(a' = 2\\,\\text{cm}\\). Bestimme \\(k\\).", loesung: 0.333, toleranz: 0.01, tipp: "\\(k = \\frac{a'}{a} = \\frac{2}{6} = \\frac{1}{3}\\).", loesungsweg: "$$k = \\frac{2}{6} = \\frac{1}{3} \\approx 0{,}333$$" },
      { id: 18, level: 3, typ: "mc", frage: "Bei einer Landkarte mit Maßstab \\(1 : 50\\,000\\) entspricht \\(1\\,\\text{cm}\\) in der Karte in der Realität ...", optionen: ["\\(50\\,\\text{m}\\)", "\\(500\\,\\text{m}\\)", "\\(5\\,\\text{km}\\)", "\\(0{,}5\\,\\text{km}\\)"], korrekt: 1, tipp: "\\(50\\,000\\,\\text{cm} = 500\\,\\text{m}\\).", loesungsweg: "$$1\\,\\text{cm} \\cdot 50\\,000 = 50\\,000\\,\\text{cm} = 500\\,\\text{m}$$" },
      // ========== LEVEL 4 -- mittel: Flächen und Umfang ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Ein Quadrat hat Umfang \\(12\\,\\text{cm}\\). Es wird mit \\(k = 3\\) gestreckt. Neuer Umfang in cm?", loesung: 36, toleranz: 0, tipp: "Umfang mal \\(k\\).", loesungsweg: "$$U' = k \\cdot U = 3 \\cdot 12 = 36\\,\\text{cm}$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Ein Quadrat mit Fläche \\(9\\,\\text{cm}^2\\) wird mit \\(k = 2\\) gestreckt. Neue Fläche in cm\\(^2\\)?", loesung: 36, toleranz: 0, tipp: "Fläche mal \\(k^2\\).", loesungsweg: "$$A' = k^2 \\cdot A = 4 \\cdot 9 = 36\\,\\text{cm}^2$$" },
      { id: 21, level: 4, typ: "mc", frage: "Bei einer zentrischen Streckung mit \\(k = 3\\) wächst die Fläche um den Faktor ...", optionen: ["\\(3\\)", "\\(6\\)", "\\(9\\)", "\\(27\\)"], korrekt: 2, tipp: "Flächenfaktor = \\(k^2\\).", loesungsweg: "$$k^2 = 3^2 = 9$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Dreieck mit Fläche \\(20\\,\\text{cm}^2\\) wird mit \\(k = 0{,}5\\) gestreckt. Neue Fläche in cm\\(^2\\)?", loesung: 5, toleranz: 0, tipp: "\\(A' = k^2 \\cdot A\\).", loesungsweg: "$$A' = 0{,}25 \\cdot 20 = 5\\,\\text{cm}^2$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Ein Rechteck hat Fläche \\(12\\,\\text{cm}^2\\). Nach Streckung hat das Bild \\(108\\,\\text{cm}^2\\). Bestimme \\(k\\).", loesung: 3, toleranz: 0, tipp: "\\(k^2 = \\frac{108}{12} = 9\\).", loesungsweg: "$$k^2 = 9 \\implies k = 3$$" },
      { id: 24, level: 4, typ: "mc", frage: "Um eine Fläche zu verdoppeln, muss der Streckungsfaktor sein ...", optionen: ["\\(2\\)", "\\(\\sqrt{2}\\)", "\\(4\\)", "\\(0{,}5\\)"], korrekt: 1, tipp: "\\(k^2 = 2 \\Rightarrow k = \\sqrt{2}\\).", loesungsweg: "Flächen wachsen mit dem <b>Quadrat</b> des Streckungsfaktors: $$k^2 = 2 \\;\\Rightarrow\\; k = \\sqrt2 \\approx 1{,}414$$ Mit \\(k = 2\\) würde die Fläche vervierfacht, nicht verdoppelt. Dasselbe Prinzip steckt hinter den DIN-Papierformaten." },
      // ========== LEVEL 5 -- anspruchsvoll: Anwendungen ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Dreieck mit dem Flächeninhalt \\(10\\,\\text{cm}^2\\) wird zentrisch mit \\(k = 3\\) gestreckt. Jemand rechnet für die Bildfläche \\(3 \\cdot 10 = 30\\,\\text{cm}^2\\). Was ist dazu zu sagen?", optionen: ["Falsch, Flächen wachsen mit \\(k^2\\), richtig sind \\(90\\,\\text{cm}^2\\)", "Richtig, bei einer Streckung werden alle Größen mit \\(k\\) multipliziert", "Falsch, Flächen wachsen mit \\(k^3\\), richtig sind \\(270\\,\\text{cm}^2\\)", "Falsch, der Flächeninhalt bleibt bei jeder Streckung erhalten"], korrekt: 0, tipp: "Prüfe am Quadrat mit Seite \\(1\\): Was passiert mit seiner Fläche bei \\(k = 3\\)?", loesungsweg: "Jede Länge wird verdreifacht, also Grundseite <b>und</b> Höhe: $$A' = (3g) \\cdot (3h) : 2 = 9 \\cdot A = 90\\,\\text{cm}^2$$ Nur Längen wachsen mit \\(k\\), Flächen mit \\(k^2\\), Volumen mit \\(k^3\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Zwei Rechtecke sind zueinander ähnlich. Das kleine hat den Umfang \\(20\\,\\text{cm}\\) und den Flächeninhalt \\(24\\,\\text{cm}^2\\), das große hat den Umfang \\(50\\,\\text{cm}\\). Wie groß ist der Flächeninhalt des großen Rechtecks in \\(\\text{cm}^2\\)?", loesung: 150, toleranz: 0.01, tipp: "Aus den Umfängen ergibt sich der Streckfaktor; für die Fläche gilt ein anderer Faktor.", loesungsweg: "Umfänge sind Längen: \\(k = \\frac{50}{20} = 2{,}5\\). Flächen wachsen mit \\(k^2 = 6{,}25\\): $$A' = 24 \\cdot 6{,}25 = 150\\,\\text{cm}^2$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Dreieck mit den Seiten \\(5\\,\\text{cm}\\), \\(12\\,\\text{cm}\\) und \\(13\\,\\text{cm}\\) wird zentrisch gestreckt; das Bild hat den Umfang \\(45\\,\\text{cm}\\). Wie groß ist der Flächeninhalt des Bilddreiecks in \\(\\text{cm}^2\\)?", loesung: 67.5, toleranz: 0.05, tipp: "Das Dreieck ist rechtwinklig; bestimme zuerst Umfang und Fläche des Urbilds.", loesungsweg: "Wegen \\(5^2 + 12^2 = 13^2\\) ist das Dreieck rechtwinklig: \\(A = \\frac{5 \\cdot 12}{2} = 30\\,\\text{cm}^2\\), Umfang \\(30\\,\\text{cm}\\). Streckfaktor \\(k = \\frac{45}{30} = 1{,}5\\), Flächenfaktor \\(k^2 = 2{,}25\\): $$A' = 30 \\cdot 2{,}25 = 67{,}5\\,\\text{cm}^2$$" },
      { id: 28, level: 5, typ: "mc", frage: "Ein Dreieck mit einem Winkel von \\(40°\\) wird zentrisch mit \\(k = 2\\) gestreckt. Jemand behauptet: „Im Bild beträgt dieser Winkel \\(80°\\), weil alle Maße verdoppelt werden.“ Was ist dazu zu sagen?", optionen: ["Falsch, Winkel bleiben bei zentrischer Streckung unverändert, also \\(40°\\)", "Richtig, bei einer Streckung mit \\(k = 2\\) werden alle Maße verdoppelt", "Falsch, Winkel werden bei Streckung halbiert, also \\(20°\\)", "Falsch, Winkel wachsen wie Flächen mit \\(k^2\\), also \\(160°\\)"], korrekt: 0, tipp: "Die Winkelsumme im Dreieck beträgt immer \\(180°\\); was würde aus ihr bei verdoppelten Winkeln?", loesungsweg: "Eine zentrische Streckung erhält alle Winkel; nur Längen ändern sich (mit \\(k\\)) und Flächen (mit \\(k^2\\)). Würden alle Winkel verdoppelt, hätte das Bilddreieck die Winkelsumme \\(360°\\), was unmöglich ist. Der Winkel bleibt \\(40°\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Foto ist \\(12\\,\\text{cm}\\) breit und \\(18\\,\\text{cm}\\) hoch. Es soll ähnlich (ohne Verzerrung) auf ein Poster mit dem Flächeninhalt \\(2400\\,\\text{cm}^2\\) vergrößert werden. Wie breit wird das Poster in cm?", loesung: 40, toleranz: 0.05, tipp: "Vergleiche zuerst die Flächen; daraus folgt der Streckfaktor der Längen.", loesungsweg: "Fläche des Fotos: \\(12 \\cdot 18 = 216\\,\\text{cm}^2\\). $$k^2 = \\frac{2400}{216} = \\frac{100}{9} \\quad\\Rightarrow\\quad k = \\frac{10}{3}$$ Breite: \\(12 \\cdot \\frac{10}{3} = 40\\,\\text{cm}\\) (Höhe \\(60\\,\\text{cm}\\); Probe \\(40 \\cdot 60 = 2400\\))." },
      { id: 30, level: 5, typ: "numerisch", frage: "Das Dreieck \\(ABC\\) hat die Seiten \\(a = 6\\), \\(b = 9\\), \\(c = 12\\); das Dreieck \\(DEF\\) hat die Seiten \\(d = 4\\) und \\(e = 6\\). Wie lang muss \\(f\\) sein, damit die beiden Dreiecke ähnlich sind (mit \\(a\\) zu \\(d\\), \\(b\\) zu \\(e\\), \\(c\\) zu \\(f\\))?", loesung: 8, toleranz: 0.01, tipp: "Ähnliche Dreiecke haben für alle drei Seitenpaare dasselbe Verhältnis.", loesungsweg: "\\(\\frac{d}{a} = \\frac{4}{6} = \\frac{2}{3}\\) und \\(\\frac{e}{b} = \\frac{6}{9} = \\frac{2}{3}\\) stimmen überein. Also muss auch $$f = \\frac{2}{3} \\cdot 12 = 8$$ gelten." },
      // ========== LEVEL 6 -- wagnerisch: Transfer ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Zwei ähnliche Figuren mit gleichem Umfang sind kongruent.“ Stimmt das?", optionen: ["Ja, gleicher Umfang erzwingt \\(k = 1\\), also sind alle Seiten gleich lang", "Nein, das gilt nur für Dreiecke, nicht für andere Figuren", "Nein, sie können trotzdem verschieden große Flächen haben", "Nein, Ähnlichkeit macht keine Aussage über den Umfang"], korrekt: 0, tipp: "Wie hängt der Umfang des Bildes mit dem Umfang des Urbilds zusammen?", loesungsweg: "Bei Ähnlichkeit mit Faktor \\(k\\) gilt \\(U' = k \\cdot U\\). Aus \\(U' = U\\) folgt \\(k = 1\\): Alle Seiten sind gleich lang, alle Winkel ohnehin gleich, also sind die Figuren kongruent. Auch die Flächen stimmen dann überein (\\(k^2 = 1\\))." },
      { id: 32, level: 6, typ: "numerisch", frage: "Ein Dreieck mit dem Umfang \\(24\\,\\text{cm}\\) wird zentrisch gestreckt, sodass sich sein Flächeninhalt vervierfacht. Welchen Umfang hat das Bilddreieck in cm?", loesung: 48, toleranz: 0.01, tipp: "Aus dem Flächenfaktor lässt sich der Streckfaktor zurückgewinnen.", loesungsweg: "$$k^2 = 4 \\quad\\Rightarrow\\quad k = 2$$ Der Umfang ist eine Länge: \\(U' = 2 \\cdot 24 = 48\\,\\text{cm}\\). Ein Umfang von \\(96\\) wäre der Fehler, den Flächenfaktor auch auf Längen anzuwenden." },
      { id: 33, level: 6, typ: "numerisch", frage: "Eine zentrische Streckung mit Zentrum \\(Z(0|0)\\) bildet \\(P(2|5)\\) auf \\(P'(6|15)\\) ab. Auf welchen Punkt \\(Q'\\) wird \\(Q(4|-1)\\) abgebildet? Gib die x-Koordinate von \\(Q'\\) an.", loesung: 12, toleranz: 0, tipp: "Bestimme zuerst den Streckfaktor aus \\(P\\) und \\(P'\\).", loesungsweg: "Vom Ursprung aus werden alle Koordinaten mit \\(k\\) multipliziert: \\(2k = 6\\), also \\(k = 3\\) (Probe: \\(5 \\cdot 3 = 15\\)). $$Q' = (4 \\cdot 3\\,|\\,(-1) \\cdot 3) = (12|-3)$$" },
      { id: 34, level: 6, typ: "mc", frage: "Behauptung: „Zwei beliebige Rechtecke sind immer zueinander ähnlich.“ Stimmt das?", optionen: ["Nein, nur wenn die Verhältnisse von Länge zu Breite übereinstimmen", "Ja, denn alle Winkel sind rechte Winkel und stimmen überein", "Ja, denn Rechtecke sind Vierecke mit paarweise parallelen Seiten", "Nein, Rechtecke sind nie ähnlich, nur Quadrate können es sein"], korrekt: 0, tipp: "Vergleiche ein Rechteck \\(1 \\times 2\\) mit einem Rechteck \\(1 \\times 5\\): Gibt es einen Streckfaktor?", loesungsweg: "Ähnlichkeit verlangt gleiche Winkel <b>und</b> gleiche Seitenverhältnisse. Die Winkel stimmen bei Rechtecken immer, die Verhältnisse nicht: \\(1 \\times 2\\) und \\(1 \\times 5\\) lassen sich durch keinen Faktor ineinander überführen. Quadrate sind dagegen stets ähnlich, weil ihr Seitenverhältnis immer \\(1 : 1\\) ist." },
      { id: 35, level: 6, typ: "numerisch", frage: "Zwei ähnliche Dreiecke haben die Flächeninhalte \\(18\\,\\text{cm}^2\\) und \\(50\\,\\text{cm}^2\\). Die kürzeste Seite des großen Dreiecks ist \\(10\\,\\text{cm}\\) lang. Wie lang ist die kürzeste Seite des kleinen Dreiecks in cm?", loesung: 6, toleranz: 0.01, tipp: "Das Flächenverhältnis ist das Quadrat des Längenverhältnisses.", loesungsweg: "$$k^2 = \\frac{50}{18} = \\frac{25}{9} \\quad\\Rightarrow\\quad k = \\frac{5}{3}$$ Die kürzeste Seite des kleinen Dreiecks: \\(10 : \\frac{5}{3} = 6\\,\\text{cm}\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Dreieck mit dem Flächeninhalt \\(48\\,\\text{cm}^2\\) und dem Umfang \\(32\\,\\text{cm}\\) wird zentrisch auf ein Dreieck mit dem Flächeninhalt \\(27\\,\\text{cm}^2\\) verkleinert. Welchen Umfang hat das Bilddreieck in cm?", loesung: 24, toleranz: 0.01, tipp: "Der Streckfaktor ist hier kleiner als \\(1\\); er folgt aus dem Flächenverhältnis.", loesungsweg: "$$k^2 = \\frac{27}{48} = \\frac{9}{16} \\quad\\Rightarrow\\quad k = \\frac{3}{4}$$ Umfang: \\(32 \\cdot \\frac{3}{4} = 24\\,\\text{cm}\\). Ein Faktor zwischen \\(0\\) und \\(1\\) verkleinert; die Regeln \\(k\\) für Längen und \\(k^2\\) für Flächen gelten unverändert." }];
    </script>

</body>
