<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Differenzialgleichungen (LK) - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-lk-dgl';
    const THEMA_CONFIG = { name: 'Differenzialgleichungen (LK)', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundbegriff ==========
      { id:1, level:1, typ:"mc", frage:"Was ist eine Differenzialgleichung (DGL)?", optionen:["Eine Gleichung mit Ableitung(en) der gesuchten Funktion","Eine Gleichung ohne Ableitung","Eine Ungleichung","Eine Summe"], korrekt:0, tipp:"Enthält Ableitung.", loesungsweg:"Eine DGL verknüpft \\(y\\), \\(y'\\), ggf. \\(y''\\) usw." },
      { id:2, level:1, typ:"mc", frage:"Welche DGL beschreibt exponentielles Wachstum?", optionen:["\\(y'=k\\)","\\(y'=k\\cdot y\\)","\\(y=ky\\)","\\(y'=y^2\\)"], korrekt:1, tipp:"Wachstumsrate proportional zum Bestand.", loesungsweg:"\\(y'=ky\\) ist die Grundgleichung exp. Wachstums/Zerfalls." },
      { id:3, level:1, typ:"mc", frage:"Welche Funktion löst \\(y'=y\\)?", optionen:["\\(y=x\\)","\\(y=e^x\\)","\\(y=x^2\\)","\\(y=\\sin x\\)"], korrekt:1, tipp:"Ableitung = Funktion.", loesungsweg:"Gesucht ist eine Funktion, die ihre eigene Ableitung ist. Das leistet genau die natürliche Exponentialfunktion: $$(e^x)' = e^x$$ Bei \\(y = x\\) wäre \\(y' = 1 \\ne x\\), bei \\(y = x^2\\) wäre \\(y' = 2x \\ne x^2\\). Diese Eigenschaft ist der Grund, weshalb \\(e\\) als Basis gewählt wird." },
      { id:4, level:1, typ:"mc", frage:"Allgemeine Lösung von \\(y'=ky\\)?", optionen:["\\(y=kx+c\\)","\\(y=Ce^{kx}\\)","\\(y=kx^2\\)","\\(y=\\tfrac{1}{kx}\\)"], korrekt:1, tipp:"Trennbare Variablen.", loesungsweg:"Trennung der Variablen: $$\\frac{dy}{y} = k\\,dx \\;\\Rightarrow\\; \\ln|y| = kx + c_0 \\;\\Rightarrow\\; y = Ce^{kx}$$ Die Konstante \\(C = e^{c_0}\\) bleibt frei — erst eine Anfangsbedingung legt sie fest. Für \\(k > 0\\) beschreibt das Wachstum, für \\(k < 0\\) Zerfall." },
      { id:5, level:1, typ:"mc", frage:"Was ist ein Anfangswertproblem?", optionen:["DGL + Anfangsbedingung \\(y(x_0)=y_0\\)","Eine spezielle DGL","Ein Grenzwert","Eine Reihe"], korrekt:0, tipp:"DGL + Zusatzbedingung.", loesungsweg:"Eine Differentialgleichung allein hat unendlich viele Lösungen, die sich um die Konstante unterscheiden. Ein Anfangswertproblem ergänzt sie um eine Bedingung $$y(x_0) = y_0$$ die genau eine dieser Lösungen auswählt. Anschaulich: Die DGL gibt das Richtungsfeld vor, der Anfangswert den Punkt, durch den die Lösungskurve laufen soll." },
      { id:6, level:1, typ:"numerisch", frage:"\\(y'=2y\\) mit \\(y(0)=3\\). Welcher Wert hat \\(C\\)?", loesung:3, toleranz:0, tipp:"\\(y=Ce^{2x}\\).", loesungsweg:"\\(y(0)=C=3\\)." },
      // ========== LEVEL 2 — y'=ky lösen ==========
      { id:7, level:2, typ:"numerisch", frage:"\\(y'=3y, y(0)=5\\). Bestimme \\(y(1)\\) auf 3 Dez.", loesung:100.428, toleranz:0.5, tipp:"\\(y=5e^{3x}\\).", loesungsweg:"Aus \\(y' = 3y\\) folgt \\(y = Ce^{3x}\\); der Anfangswert \\(y(0) = 5\\) liefert \\(C = 5\\). $$y(1) = 5e^3 \\approx 5 \\cdot 20{,}0855 \\approx 100{,}428$$" },
      { id:8, level:2, typ:"numerisch", frage:"\\(y'=-0{,}5y, y(0)=100\\). \\(y(2)\\) (2 Dez.)?", loesung:36.79, toleranz:0.1, tipp:"\\(100\\cdot e^{-1}\\).", loesungsweg:"Mit \\(y = 100e^{-0{,}5x}\\): $$y(2) = 100 \\cdot e^{-1} \\approx 100 \\cdot 0{,}36788 \\approx 36{,}79$$ Der negative Faktor \\(k\\) macht daraus Zerfall." },
      { id:9, level:2, typ:"mc", frage:"Welche Funktion löst \\(y'=-y\\)?", optionen:["\\(y=e^x\\)","\\(y=e^{-x}\\)","\\(y=x\\)","\\(y=-x\\)"], korrekt:1, tipp:"Negative Rate.", loesungsweg:"Nach der Kettenregel liefert die innere Ableitung das Minuszeichen: $$(e^{-x})' = -e^{-x}$$ Das ist genau \\(-y\\). Die Funktion \\(-x\\) erfüllt die Gleichung nicht, denn ihre Ableitung ist \\(-1\\), nicht \\(x\\)." },
      { id:10, level:2, typ:"numerisch", frage:"Bakterien verdoppeln sich stündlich. \\(k=?\\) in \\(y'=ky\\)? (3 Dez.)", loesung:0.693, toleranz:0.01, tipp:"\\(e^k = 2\\).", loesungsweg:"Verdopplung in einer Stunde heißt \\(y(1) = 2y(0)\\), also \\(e^{k \\cdot 1} = 2\\): $$k = \\ln 2 \\approx 0{,}693$$ Die Wachstumskonstante \\(k\\) ist damit <b>nicht</b> der Faktor \\(2\\), sondern dessen Logarithmus." },
      { id:11, level:2, typ:"numerisch", frage:"Radioaktiver Zerfall: Halbwertszeit 5h. \\(k\\) auf 3 Dez. (negativ)?", loesung:-0.139, toleranz:0.005, tipp:"\\(e^{5k} = 0{,}5\\).", loesungsweg:"Halbwertszeit \\(5\\) Stunden bedeutet \\(e^{5k} = 0{,}5\\). Logarithmieren: $$k = \\frac{\\ln 0{,}5}{5} = \\frac{-\\ln 2}{5} \\approx -0{,}139$$ Das Vorzeichen muss negativ sein — es handelt sich um Abnahme." },
      { id:12, level:2, typ:"numerisch", frage:"\\(y'=0{,}1y, y(0)=200\\). \\(y(10)\\) (ganzzahlig)?", loesung:544, toleranz:2, tipp:"\\(200\\cdot e^1\\).", loesungsweg:"Mit \\(y = 200e^{0{,}1x}\\): $$y(10) = 200 \\cdot e^{1} \\approx 200 \\cdot 2{,}71828 \\approx 543{,}66 \\approx 544$$" },
      // ========== LEVEL 3 — Trennbare Variablen ==========
      { id:13, level:3, typ:"mc", frage:"Was bedeutet „trennbare DGL\"?", optionen:["\\(y' = f(x)g(y)\\)","\\(y' = ax+b\\)","\\(y' = y^2\\)","\\(y' = 0\\)"], korrekt:0, tipp:"Produkt aus \\(x\\)- und \\(y\\)-Teil.", loesungsweg:"Form \\(y' = f(x)\\cdot g(y)\\) erlaubt Trennung \\(\\tfrac{dy}{g(y)} = f(x)\\,dx\\)." },
      { id:14, level:3, typ:"mc", frage:"Allgemeine Lösung von \\(y'=x\\)?", optionen:["\\(y=\\tfrac{x^2}{2}+C\\)","\\(y=x+C\\)","\\(y=Ce^x\\)","\\(y=x^2\\)"], korrekt:0, tipp:"Integrieren.", loesungsweg:"Hier steht rechts nur \\(x\\), die DGL lässt sich also direkt integrieren: $$y = \\int x\\,dx = \\frac{x^2}{2} + C$$ Wichtig ist die Integrationskonstante — ohne sie hätte man nur eine einzelne Lösung statt der allgemeinen." },
      { id:15, level:3, typ:"mc", frage:"Allgemeine Lösung von \\(y'=xy\\)?", optionen:["\\(y=Ce^{x^2/2}\\)","\\(y=Ce^x\\)","\\(y=\\tfrac{x^2}{2}\\)","\\(y=Cx\\)"], korrekt:0, tipp:"Trennen: \\(\\tfrac{dy}{y}=x\\,dx\\).", loesungsweg:"\\(\\ln|y| = \\tfrac{x^2}{2}+c \\Rightarrow y=Ce^{x^2/2}\\)." },
      { id:16, level:3, typ:"mc", frage:"Allgemeine Lösung von \\(y'=y^2\\)?", optionen:["\\(y=\\tfrac{-1}{x+C}\\)","\\(y=Ce^x\\)","\\(y=x^2\\)","\\(y=\\tfrac{1}{x}\\)"], korrekt:0, tipp:"\\(-\\tfrac{1}{y} = x+c\\).", loesungsweg:"\\(\\int y^{-2}\\,dy = \\int dx \\Rightarrow -\\tfrac{1}{y}=x+c \\Rightarrow y=-\\tfrac{1}{x+C}\\)." },
      { id:17, level:3, typ:"numerisch", frage:"\\(y'=x, y(0)=1\\). \\(y(2)\\)?", loesung:3, toleranz:0, tipp:"\\(y=\\tfrac{x^2}{2}+1\\).", loesungsweg:"\\(y(2)=2+1=3\\)." },
      { id:18, level:3, typ:"numerisch", frage:"\\(y'=\\tfrac{1}{y}, y(0)=1\\). \\(y(4)\\) (2 Dez.)", loesung:3, toleranz:0.02, tipp:"\\(y^2/2 = x+C\\).", loesungsweg:"\\(y^2 = 2x+1 \\Rightarrow y(4)=\\sqrt{9}=3\\)." },
      // ========== LEVEL 4 — Anwendungen ==========
      { id:19, level:4, typ:"numerisch", frage:"Abkühlung (Newton): \\(T'(t)=-k(T-T_u)\\). \\(T_u=20, T(0)=80, k=0{,}1\\). \\(T(10)\\)? (1 Dez.)", loesung:42.1, toleranz:0.5, tipp:"\\(T=T_u+(T_0-T_u)e^{-kt}\\).", loesungsweg:"Die Lösung des Newtonschen Abkühlungsgesetzes lautet \\(T(t) = T_u + (T_0-T_u)e^{-kt}\\). Mit \\(T_u = 20\\), \\(T_0 - T_u = 60\\) und \\(k = 0{,}1\\): $$T(10) = 20 + 60 \\cdot e^{-1} \\approx 20 + 22{,}07 = 42{,}1\\,°C$$ Der Körper nähert sich der Umgebungstemperatur \\(20\\,°C\\), erreicht sie aber nie." },
      { id:20, level:4, typ:"numerisch", frage:"Bakterienpopulation verdreifacht sich in 2h. Nach 4h: Faktor?", loesung:9, toleranz:0.1, tipp:"\\(3^2\\).", loesungsweg:"\\(e^{2k}=3 \\Rightarrow e^{4k}=9\\)." },
      { id:21, level:4, typ:"numerisch", frage:"\\(N(t)\\) radioaktiv, Halbwertszeit 10 Jahre. Nach 30 Jahren: Faktor des Restes?", loesung:0.125, toleranz:0.005, tipp:"\\(0{,}5^3\\).", loesungsweg:"Dreißig Jahre bei einer Halbwertszeit von \\(10\\) Jahren sind drei Halbierungen: $$0{,}5^3 = \\frac18 = 0{,}125$$ Es bleiben also \\(12{,}5\\,\\%\\) übrig." },
      { id:22, level:4, typ:"mc", frage:"Welche DGL beschreibt beschränktes Wachstum?", optionen:["\\(y'=k(S-y)\\)","\\(y'=ky\\)","\\(y'=k\\)","\\(y'=-ky\\)"], korrekt:0, tipp:"Schranke \\(S\\).", loesungsweg:"Beim beschränkten Wachstum ist die Änderungsrate proportional zum <b>noch freien Rest</b> bis zur Schranke: $$y' = k(S-y)$$ Je näher \\(y\\) an \\(S\\) kommt, desto kleiner wird die Klammer und damit das Wachstum. Bei \\(y' = ky\\) wäre die Rate dagegen proportional zum Bestand — unbeschränktes Wachstum." },
      { id:23, level:4, typ:"mc", frage:"Lösung von \\(y'=k(S-y), y(0)=y_0\\)?", optionen:["\\(y=S-(S-y_0)e^{-kt}\\)","\\(y=Ce^{kt}\\)","\\(y=kt+y_0\\)","\\(y=S+y_0 e^{kt}\\)"], korrekt:0, tipp:"Grenzwert \\(S\\).", loesungsweg:"Die Substitution \\(z = S - y\\) führt auf \\(z' = -kz\\), also \\(z = (S-y_0)e^{-kt}\\). Rücksubstitution: $$y(t) = S - (S-y_0)e^{-kt}$$ Probe: \\(y(0) = S - (S-y_0) = y_0\\) ✓, und für \\(t \\to \\infty\\) strebt \\(y \\to S\\) ✓" },
      { id:24, level:4, typ:"numerisch", frage:"\\(y'=0{,}2(100-y), y(0)=10\\). \\(y(5)\\) (1 Dez.)", loesung:66.9, toleranz:1, tipp:"\\(y=100-90\\cdot e^{-1}\\).", loesungsweg:"Mit \\(S = 100\\), \\(y_0 = 10\\), \\(k = 0{,}2\\) ist \\(S - y_0 = 90\\): $$y(5) = 100 - 90 \\cdot e^{-0{,}2 \\cdot 5} = 100 - 90 \\cdot e^{-1} \\approx 100 - 33{,}11 = 66{,}9$$" },
      // ========== LEVEL 5 — Logistisches Wachstum ==========
      { id:25, level:5, typ:"mc", frage:"Welche DGL beschreibt logistisches Wachstum?", optionen:["\\(y'=ky(S-y)\\)","\\(y'=ky\\)","\\(y'=kS\\)","\\(y'=y\\)"], korrekt:0, tipp:"Produkt aus Bestand und freier Kapazität.", loesungsweg:"Logistisches Wachstum kombiniert beide Ideen: Es wächst proportional zum Bestand <b>und</b> zur freien Kapazität. $$y' = k \\cdot y \\cdot (S-y)$$ Am Anfang ist \\(y\\) klein und das Wachstum gering, am Ende bremst die Klammer — dazwischen liegt die maximale Rate." },
      { id:26, level:5, typ:"mc", frage:"Grenzwert \\(\\lim_{t\\to\\infty} y(t)\\) bei logistischem Wachstum?", optionen:["\\(0\\)","\\(\\infty\\)","\\(S\\)","\\(y_0\\)"], korrekt:2, tipp:"Kapazität.", loesungsweg:"Für \\(y \\to S\\) wird der Faktor \\((S-y)\\) null, das Wachstum kommt also zum Erliegen. Die Kapazitätsgrenze ist damit der Grenzwert: $$\\lim_{t\\to\\infty} y(t) = S$$ Sie wird nur asymptotisch erreicht, nie exakt." },      { id:27, level:5, typ:"numerisch", frage:"Logistisches Wachstum mit der Kapazit\u00e4t \\(S = 800\\). Bei welchem Bestand \\(y\\) liegt der Wendepunkt \u2014 also die gr\u00f6\u00dfte Wachstumsrate?", loesung:400, toleranz:0.1, tipp:"Setze \\(y''=0\\); der Wendepunkt liegt stets bei der halben Kapazit\u00e4t.", loesungsweg:"Beim logistischen Wachstum ist die Zunahme proportional zu \\(y \\cdot (S-y)\\); dieses Produkt wird bei \\(y = \\tfrac{S}{2}\\) maximal: $$y = \\frac{800}{2} = 400$$ Danach flacht der Zuwachs wieder ab." },

      { id:28, level:5, typ:"numerisch", frage:"Logistisch: \\(S=1000, k=0{,}002, y_0=100\\). Max. Wachstumsrate bei \\(y=?\\)", loesung:500, toleranz:0, tipp:"\\(S/2\\).", loesungsweg:"Die Rate \\(y' = ky(S-y)\\) ist als Funktion von \\(y\\) eine nach unten geöffnete Parabel mit den Nullstellen \\(0\\) und \\(S\\). Ihr Scheitel liegt genau dazwischen: $$y = \\frac{S}{2} = \\frac{1000}{2} = 500$$ Dort liegt zugleich der Wendepunkt der Lösungskurve." },
      { id:29, level:5, typ:"numerisch", frage:"Logistisch: Maximale Rate \\(y'=kS^2/4\\). Für \\(k=0{,}01, S=200\\): max. Rate?", loesung:100, toleranz:0.1, tipp:"\\(0{,}01\\cdot 40000/4\\).", loesungsweg:"Einsetzen von \\(y = S/2\\) in die DGL: $$y'_{max} = k \\cdot \\frac{S}{2} \\cdot \\frac{S}{2} = \\frac{kS^2}{4} = \\frac{0{,}01 \\cdot 40\\,000}{4} = 100$$" },
      { id:30, level:5, typ:"mc", frage:"Allgemeine Lösung logistisch (mit \\(A = (S-y_0)/y_0\\))?", optionen:["\\(y=\\tfrac{S}{1+Ae^{-kSt}}\\)","\\(y=Se^{-kt}\\)","\\(y=Ae^{kt}\\)","\\(y=S-Ae^{kt}\\)"], korrekt:0, tipp:"Standardform.", loesungsweg:"Trennung der Variablen mit Partialbruchzerlegung von \\(\\frac{1}{y(S-y)}\\) liefert $$y(t) = \\frac{S}{1+Ae^{-kSt}}, \\quad A = \\frac{S-y_0}{y_0}$$ Probe für \\(t = 0\\): \\(\\frac{S}{1+A} = \\frac{S}{S/y_0} = y_0\\) ✓, und für \\(t \\to \\infty\\) geht der Exponentialterm gegen null, also \\(y \\to S\\) ✓" },
      // ========== LEVEL 6 — Transfer ==========
      { id:31, level:6, typ:"numerisch", frage:"\\(y'=y, y(0)=1\\). \\(y(\\ln 5)\\)?", loesung:5, toleranz:0.01, tipp:"\\(y=e^x\\).", loesungsweg:"Mit \\(y(0) = 1\\) ist \\(C = 1\\), also \\(y = e^x\\). Logarithmus und Exponentialfunktion heben einander auf: $$y(\\ln 5) = e^{\\ln 5} = 5$$" },
      { id:32, level:6, typ:"numerisch", frage:"\\(y'=-2y, y(0)=10\\). Nach welcher Zeit gilt \\(y=5\\)? (3 Dez.)", loesung:0.347, toleranz:0.01, tipp:"\\(e^{-2t}=0{,}5\\).", loesungsweg:"Aus \\(y = 10e^{-2t}\\) und der Forderung \\(y = 5\\): $$e^{-2t} = 0{,}5 \\;\\Rightarrow\\; -2t = -\\ln 2 \\;\\Rightarrow\\; t = \\frac{\\ln 2}{2} \\approx 0{,}347$$ Das ist die Halbwertszeit; sie hängt nur von \\(k\\) ab, nicht vom Startwert." },
      { id:33, level:6, typ:"mc", frage:"Was ist die Ordnung von \\(y''+3y'+2y=0\\)?", optionen:["1","2","3","0"], korrekt:1, tipp:"Höchste Ableitung.", loesungsweg:"Höchste Ableitung ist \\(y''\\), also Ordnung 2." },
      { id:34, level:6, typ:"numerisch", frage:"\\(y'=ky\\) mit \\(y(0)=8, y(3)=1\\). \\(k\\) (3 Dez.)?", loesung:-0.693, toleranz:0.005, tipp:"\\(e^{3k}=1/8\\).", loesungsweg:"\\(k=\\tfrac{\\ln(1/8)}{3} = -\\ln 2 \\approx -0{,}693\\)." },
      { id:35, level:6, typ:"numerisch", frage:"Beschränktes Wachstum: \\(y'=0{,}5(40-y), y(0)=0\\). \\(y(2)\\) (2 Dez.)", loesung:25.28, toleranz:0.5, tipp:"\\(40(1-e^{-1})\\).", loesungsweg:"Mit \\(S = 40\\), \\(y_0 = 0\\), \\(k = 0{,}5\\) vereinfacht sich die Lösung zu \\(y = 40(1-e^{-0{,}5t})\\): $$y(2) = 40 \\cdot (1 - e^{-1}) \\approx 40 \\cdot 0{,}63212 \\approx 25{,}28$$" },
      { id:36, level:6, typ:"numerisch", frage:"\\(y'=2xy, y(0)=1\\). \\(y(1)\\) (3 Dez.)", loesung:2.718, toleranz:0.02, tipp:"Trennen: \\(y=Ce^{x^2}\\).", loesungsweg:"\\(y=e^{x^2}, y(1)=e\\approx 2{,}718\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
