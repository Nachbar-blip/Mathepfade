<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzen mit ganzzahligen Exponenten - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-potenzen-ganzzahlig';
    const THEMA_CONFIG = { name: 'Potenzen mit ganzzahligen Exponenten', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Berechne \\(2^3\\).", loesung: 8, toleranz: 0, tipp: "\\(2 \\cdot 2 \\cdot 2\\).", loesungsweg: "Der Exponent gibt an, wie oft die Basis als Faktor auftritt: $$2^3 = 2 \\cdot 2 \\cdot 2 = 8$$ Nicht zu verwechseln mit \\(2 \\cdot 3 = 6\\) — potenzieren heißt multiplizieren, nicht malnehmen des Exponenten." },
      { id: 2, level: 1, typ: "numerisch", frage: "Berechne \\(5^2\\).", loesung: 25, toleranz: 0, tipp: "\\(5 \\cdot 5\\).", loesungsweg: "$$5^2 = 5 \\cdot 5 = 25$$" },
      { id: 3, level: 1, typ: "mc", frage: "Wie heißt die Zahl \\(3\\) in \\(3^4\\)?", optionen: ["Exponent", "Basis", "Koeffizient", "Radikand"], korrekt: 1, tipp: "Die untere Zahl wird wiederholt multipliziert.", loesungsweg: "\\(3\\) ist die <b>Basis</b>, \\(4\\) der Exponent." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne \\(10^4\\).", loesung: 10000, toleranz: 0, tipp: "Zehnerpotenz: eine 1 mit 4 Nullen.", loesungsweg: "Bei Zehnerpotenzen gibt der Exponent die Anzahl der Nullen an: $$10^4 = 10\\,000$$ Deshalb lässt sich mit ihnen so bequem rechnen — \\(10^4 \\cdot 10^3 = 10^7\\) bedeutet einfach, die Nullen zusammenzuzählen." },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne \\(7^0\\).", loesung: 1, toleranz: 0, tipp: "Jede Zahl (außer 0) hoch 0 ergibt 1.", loesungsweg: "$$7^0 = 1$$ Begründung über das Divisionsgesetz: \\(a^0 = a^{n-n} = \\tfrac{a^n}{a^n} = 1\\) für jedes \\(a \\ne 0\\). Die Basis spielt keine Rolle — auch \\(1000^0 = 1\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Was ist \\((-3)^2\\)?", optionen: ["\\(-9\\)", "\\(9\\)", "\\(-6\\)", "\\(6\\)"], korrekt: 1, tipp: "Minus mal Minus ergibt Plus.", loesungsweg: "Die Klammer bedeutet, dass das Minuszeichen mitpotenziert wird: $$(-3)^2 = (-3) \\cdot (-3) = 9$$ Minus mal minus ergibt plus. Ohne Klammer wäre \\(-3^2 = -(3^2) = -9\\) — die Klammer entscheidet hier über das Vorzeichen." },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne \\(2^{-2}\\) als Dezimalzahl.", loesung: 0.25, toleranz: 0.001, tipp: "\\(a^{-n} = \\frac{1}{a^n}\\).", loesungsweg: "$$2^{-2} = \\frac{1}{2^2} = \\frac{1}{4} = 0{,}25$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne \\(10^{-3}\\) als Dezimalzahl.", loesung: 0.001, toleranz: 0.0001, tipp: "\\(\\frac{1}{1000}\\).", loesungsweg: "$$10^{-3} = \\frac{1}{1000} = 0{,}001$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne \\(3^{-1}\\) (gerundet auf 4 Stellen).", loesung: 0.3333, toleranz: 0.001, tipp: "\\(\\frac{1}{3}\\).", loesungsweg: "Ein negativer Exponent bedeutet den Kehrwert: $$3^{-1} = \\frac13 \\approx 0{,}3333$$ Das Ergebnis ist positiv; das Minus macht die Zahl nur kleiner als eins, nicht negativ." },
      { id: 10, level: 2, typ: "mc", frage: "Welche Aussage stimmt?", optionen: ["\\((-2)^3 = 8\\)", "\\((-2)^3 = -8\\)", "\\((-2)^3 = 6\\)", "\\((-2)^3 = -6\\)"], korrekt: 1, tipp: "Ungerader Exponent behält das Vorzeichen.", loesungsweg: "\\((-2)(-2)(-2) = 4 \\cdot (-2) = -8\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Berechne \\(\\left(\\frac{1}{2}\\right)^3\\) als Dezimalzahl.", loesung: 0.125, toleranz: 0.001, tipp: "\\(\\frac{1}{8}\\).", loesungsweg: "$$\\left(\\frac{1}{2}\\right)^3 = \\frac{1}{8} = 0{,}125$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(4^{-2}\\) als Dezimalzahl.", loesung: 0.0625, toleranz: 0.001, tipp: "\\(\\frac{1}{16}\\).", loesungsweg: "$$4^{-2} = \\frac{1}{16} = 0{,}0625$$" },
      // ========== LEVEL 3 -- Potenzgesetze I ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Vereinfache \\(2^3 \\cdot 2^4\\) und gib das Ergebnis an.", loesung: 128, toleranz: 0, tipp: "\\(a^m \\cdot a^n = a^{m+n}\\).", loesungsweg: "$$2^3 \\cdot 2^4 = 2^7 = 128$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Vereinfache \\(\\frac{5^6}{5^4}\\).", loesung: 25, toleranz: 0, tipp: "\\(\\frac{a^m}{a^n} = a^{m-n}\\).", loesungsweg: "$$\\frac{5^6}{5^4} = 5^2 = 25$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Berechne \\((2^3)^2\\).", loesung: 64, toleranz: 0, tipp: "\\((a^m)^n = a^{mn}\\).", loesungsweg: "$$(2^3)^2 = 2^6 = 64$$" },
      { id: 16, level: 3, typ: "mc", frage: "Vereinfache \\(a^5 \\cdot a^3\\).", optionen: ["\\(a^8\\)", "\\(a^{15}\\)", "\\(2a^8\\)", "\\(a^2\\)"], korrekt: 0, tipp: "Exponenten addieren.", loesungsweg: "$$a^5 \\cdot a^3 = a^{5+3} = a^8$$" },
      { id: 17, level: 3, typ: "mc", frage: "Vereinfache \\(\\frac{x^7}{x^3}\\).", optionen: ["\\(x^{21}\\)", "\\(x^4\\)", "\\(x^{10}\\)", "\\(x^{4{,}33}\\)"], korrekt: 1, tipp: "Exponenten subtrahieren.", loesungsweg: "$$\\frac{x^7}{x^3} = x^{7-3} = x^4$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\(3^2 \\cdot 3^{-1}\\).", loesung: 3, toleranz: 0, tipp: "Exponenten addieren: \\(2 + (-1) = 1\\).", loesungsweg: "$$3^{2-1} = 3^1 = 3$$" },
      // ========== LEVEL 4 -- Potenzgesetze II ==========
      { id: 19, level: 4, typ: "mc", frage: "Vereinfache \\((2a)^3\\).", optionen: ["\\(2a^3\\)", "\\(6a^3\\)", "\\(8a^3\\)", "\\(8a\\)"], korrekt: 2, tipp: "\\((ab)^n = a^n b^n\\).", loesungsweg: "$$(2a)^3 = 2^3 \\cdot a^3 = 8a^3$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Berechne \\(\\left(\\frac{2}{3}\\right)^2\\) als Dezimalzahl (4 Stellen).", loesung: 0.4444, toleranz: 0.001, tipp: "\\(\\frac{4}{9}\\).", loesungsweg: "Beim Potenzieren eines Bruchs werden Zähler und Nenner einzeln potenziert: $$\\left(\\frac23\\right)^2 = \\frac{2^2}{3^2} = \\frac49 \\approx 0{,}4444$$ Der Wert ist kleiner als der Bruch selbst — das gilt für jede Zahl zwischen \\(0\\) und \\(1\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Berechne \\(2^{10}\\).", loesung: 1024, toleranz: 0, tipp: "Speicher-Grenze in der Informatik.", loesungsweg: "$$2^{10} = 1024$$ Schrittweise: \\(2^5 = 32\\), also \\(2^{10} = 32 \\cdot 32 = 1024\\). Diese Zahl begegnet einem in der Informatik ständig — \\(1\\) Kibibyte sind \\(1024\\) Byte." },
      { id: 22, level: 4, typ: "mc", frage: "Vereinfache \\(\\frac{a^3 b^4}{a b^2}\\).", optionen: ["\\(a^2 b^2\\)", "\\(a^4 b^6\\)", "\\(a^2 b^6\\)", "\\(ab^2\\)"], korrekt: 0, tipp: "Jeweils getrennt kürzen.", loesungsweg: "$$\\frac{a^3 b^4}{a b^2} = a^{3-1} b^{4-2} = a^2 b^2$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Berechne \\(\\frac{10^7}{10^4}\\).", loesung: 1000, toleranz: 0, tipp: "\\(10^{7-4}\\).", loesungsweg: "Beim Dividieren gleicher Basen werden die Exponenten subtrahiert: $$\\frac{10^7}{10^4} = 10^{7-4} = 10^3 = 1000$$ Ausgeschrieben wären das \\(\\frac{10\\,000\\,000}{10\\,000}\\) — das Potenzgesetz spart die großen Zahlen." },
      { id: 24, level: 4, typ: "mc", frage: "Vereinfache \\((x^{-2})^3\\).", optionen: ["\\(x^{-6}\\)", "\\(x^{5}\\)", "\\(x^{-5}\\)", "\\(-x^6\\)"], korrekt: 0, tipp: "Exponenten multiplizieren.", loesungsweg: "$$(x^{-2})^3 = x^{-6} = \\frac{1}{x^6}$$" },
      // ========== LEVEL 5 -- Zehnerpotenzen / wiss. Schreibweise ==========
      { id: 25, level: 5, typ: "mc", frage: "Schreibe \\(45\\,000\\) in wissenschaftlicher Notation.", optionen: ["\\(4{,}5 \\cdot 10^3\\)", "\\(4{,}5 \\cdot 10^4\\)", "\\(45 \\cdot 10^3\\)", "\\(0{,}45 \\cdot 10^5\\)"], korrekt: 1, tipp: "Verschiebe das Komma hinter die erste Ziffer.", loesungsweg: "In der wissenschaftlichen Notation steht vor der Zehnerpotenz eine Zahl zwischen \\(1\\) und \\(10\\). Das Komma wandert hier um vier Stellen nach links: $$45\\,000 = 4{,}5 \\cdot 10^4$$ Die Varianten \\(45 \\cdot 10^3\\) und \\(0{,}45 \\cdot 10^5\\) haben denselben Wert, verletzen aber die Bedingung an die Mantisse." },
      { id: 26, level: 5, typ: "numerisch", frage: "Schreibe \\(0{,}000\\,07\\) als \\(7 \\cdot 10^{-n}\\). Gib \\(n\\) an.", loesung: 5, toleranz: 0, tipp: "Komma 5 Stellen nach rechts.", loesungsweg: "Das Komma muss um fünf Stellen nach rechts wandern, damit aus \\(0{,}00007\\) die \\(7\\) wird: $$0{,}00007 = 7 \\cdot 10^{-5}$$ Also \\(n = 5\\). Merkregel: Der Betrag des Exponenten ist die Position der ersten von null verschiedenen Ziffer hinter dem Komma." },
      { id: 27, level: 5, typ: "numerisch", frage: "Berechne \\((3 \\cdot 10^4) \\cdot (2 \\cdot 10^3)\\) und gib das Ergebnis in Normaldarstellung an.", loesung: 60000000, toleranz: 0, tipp: "Zahlen und Zehnerpotenzen getrennt.", loesungsweg: "Vorfaktoren und Zehnerpotenzen getrennt behandeln: $$(3 \\cdot 2) \\cdot (10^4 \\cdot 10^3) = 6 \\cdot 10^{7} = 60\\,000\\,000$$ Die Exponenten werden addiert, die Vorfaktoren multipliziert." },
      { id: 28, level: 5, typ: "numerisch", frage: "Der Durchmesser eines Virus beträgt \\(1{,}2 \\cdot 10^{-7}\\,\\text{m}\\). Wie viele Nanometer sind das? (\\(1\\,\\text{nm} = 10^{-9}\\,\\text{m}\\))", loesung: 120, toleranz: 0, tipp: "\\(1{,}2 \\cdot 10^{-7} / 10^{-9} = 1{,}2 \\cdot 10^2\\).", loesungsweg: "$$\\frac{1{,}2 \\cdot 10^{-7}}{10^{-9}} = 1{,}2 \\cdot 10^2 = 120\\,\\text{nm}$$" },
      { id: 29, level: 5, typ: "mc", frage: "Welche Zahl ist am größten?", optionen: ["\\(2^{10}\\)", "\\(10^3\\)", "\\(3^7\\)", "\\(5^5\\)"], korrekt: 3, tipp: "Rechne aus: 1024, 1000, 2187, 3125.", loesungsweg: "Alle vier Werte ausrechnen und vergleichen: $$2^{10} = 1024, \\quad 10^3 = 1000, \\quad 3^7 = 2187, \\quad 5^5 = 3125$$ Am größten ist \\(5^5 = 3125\\). Bemerkenswert: Die größte Basis gewinnt hier trotz des kleinsten Exponenten — aus Basis und Exponent allein lässt sich die Reihenfolge nicht ablesen." },
      { id: 30, level: 5, typ: "numerisch", frage: "Berechne \\(\\frac{8 \\cdot 10^6}{2 \\cdot 10^2}\\). Gib das Ergebnis als normale Zahl an.", loesung: 40000, toleranz: 0, tipp: "Zahlen dividieren, Exponenten subtrahieren.", loesungsweg: "$$\\frac{8}{2} \\cdot 10^{6-2} = 4 \\cdot 10^4 = 40\\,000$$" },
      // ========== LEVEL 6 -- Transfer ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Berechne \\((-1)^{100}\\).", loesung: 1, toleranz: 0, tipp: "Gerader Exponent.", loesungsweg: "Bei einem <b>geraden</b> Exponenten heben sich die Minuszeichen paarweise auf: $$(-1)^{100} = 1$$ Denn \\(100\\) Faktoren \\(-1\\) bilden \\(50\\) Paare, jedes ergibt \\(+1\\). Bei ungeradem Exponenten bliebe ein Minus übrig: \\((-1)^{99} = -1\\)." },
      { id: 32, level: 6, typ: "mc", frage: "Vereinfache \\(\\frac{(a^2)^3 \\cdot a^{-4}}{a^2}\\).", optionen: ["\\(a^0 = 1\\)", "\\(a\\)", "\\(a^2\\)", "\\(a^{-2}\\)"], korrekt: 0, tipp: "Im Zähler: \\(a^6 \\cdot a^{-4} = a^2\\). Dann \\(\\frac{a^2}{a^2}\\).", loesungsweg: "$$\\frac{a^6 \\cdot a^{-4}}{a^2} = \\frac{a^2}{a^2} = 1$$" },
      { id: 33, level: 6, typ: "numerisch", frage: "Die Sonne ist \\(1{,}5 \\cdot 10^8\\,\\text{km}\\) entfernt. Licht legt \\(3 \\cdot 10^5\\,\\text{km/s}\\) zurück. Wie viele Sekunden braucht Licht?", loesung: 500, toleranz: 1, tipp: "\\(t = \\frac{s}{v}\\).", loesungsweg: "$$t = \\frac{1{,}5 \\cdot 10^8}{3 \\cdot 10^5} = 0{,}5 \\cdot 10^3 = 500\\,\\text{s}$$" },
      { id: 34, level: 6, typ: "numerisch", frage: "Für welches \\(n\\) gilt \\(2^n = 256\\)?", loesung: 8, toleranz: 0, tipp: "\\(2^8 = 256\\).", loesungsweg: "$$2^8 = 256 \\Rightarrow n = 8$$" },
      { id: 35, level: 6, typ: "mc", frage: "Welche Aussage ist falsch?", optionen: ["\\(a^{-n} = \\frac{1}{a^n}\\)", "\\(a^0 = 1\\) für \\(a \\neq 0\\)", "\\((a+b)^n = a^n + b^n\\)", "\\(a^m \\cdot a^n = a^{m+n}\\)"], korrekt: 2, tipp: "Summen darf man nicht getrennt potenzieren.", loesungsweg: "Falsch ist $$(a+b)^n = a^n + b^n$$ Gegenbeispiel: \\((1+1)^2 = 4\\), aber \\(1^2 + 1^2 = 2\\). Für \\(n = 2\\) gilt stattdessen die binomische Formel \\((a+b)^2 = a^2 + 2ab + b^2\\) — der gemischte Term fehlt in der falschen Regel. Die drei übrigen Aussagen sind gültige Potenzgesetze." },
      { id: 36, level: 6, typ: "numerisch", frage: "Berechne \\(2^{-3} + 2^{-2}\\) als Dezimalzahl.", loesung: 0.375, toleranz: 0.001, tipp: "\\(\\frac{1}{8} + \\frac{1}{4}\\).", loesungsweg: "$$\\frac{1}{8} + \\frac{2}{8} = \\frac{3}{8} = 0{,}375$$" }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
