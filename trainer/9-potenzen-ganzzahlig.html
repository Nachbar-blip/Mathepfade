<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzen mit ganzzahligen Exponenten - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-potenzen-ganzzahlig';
    const THEMA_CONFIG = { name: 'Potenzen mit ganzzahligen Exponenten', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Berechne \\(2^3\\).", loesung: 8, toleranz: 0, tipp: "\\(2 \\cdot 2 \\cdot 2\\).", loesungsweg: "Der Exponent gibt an, wie oft die Basis als Faktor auftritt: $$2^3 = 2 \\cdot 2 \\cdot 2 = 8$$ Nicht zu verwechseln mit \\(2 \\cdot 3 = 6\\) — potenzieren heißt multiplizieren, nicht malnehmen des Exponenten." },
      { id: 2, level: 1, typ: "numerisch", frage: "Berechne \\(5^2\\).", loesung: 25, toleranz: 0, tipp: "\\(5 \\cdot 5\\).", loesungsweg: "$$5^2 = 5 \\cdot 5 = 25$$" },
      { id: 3, level: 1, typ: "mc", frage: "Wie heißt die Zahl \\(3\\) in \\(3^4\\)?", optionen: ["Exponent", "Basis", "Koeffizient", "Radikand"], korrekt: 1, tipp: "Die untere Zahl wird wiederholt multipliziert.", loesungsweg: "\\(3\\) ist die <b>Basis</b>, \\(4\\) der Exponent." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne \\(10^4\\).", loesung: 10000, toleranz: 0, tipp: "Zehnerpotenz: eine 1 mit 4 Nullen.", loesungsweg: "Bei Zehnerpotenzen gibt der Exponent die Anzahl der Nullen an: $$10^4 = 10\\,000$$ Deshalb lässt sich mit ihnen so bequem rechnen — \\(10^4 \\cdot 10^3 = 10^7\\) bedeutet einfach, die Nullen zusammenzuzählen." },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne \\(7^0\\).", loesung: 1, toleranz: 0, tipp: "Jede Zahl (außer 0) hoch 0 ergibt 1.", loesungsweg: "$$7^0 = 1$$ Begründung über das Divisionsgesetz: \\(a^0 = a^{n-n} = \\tfrac{a^n}{a^n} = 1\\) für jedes \\(a \\ne 0\\). Die Basis spielt keine Rolle — auch \\(1000^0 = 1\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Was ist \\((-3)^2\\)?", optionen: ["\\(-9\\)", "\\(9\\)", "\\(-6\\)", "\\(6\\)"], korrekt: 1, tipp: "Minus mal Minus ergibt Plus.", loesungsweg: "Die Klammer bedeutet, dass das Minuszeichen mitpotenziert wird: $$(-3)^2 = (-3) \\cdot (-3) = 9$$ Minus mal minus ergibt plus. Ohne Klammer wäre \\(-3^2 = -(3^2) = -9\\) — die Klammer entscheidet hier über das Vorzeichen." },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne \\(2^{-2}\\) als Dezimalzahl.", loesung: 0.25, toleranz: 0.001, tipp: "\\(a^{-n} = \\frac{1}{a^n}\\).", loesungsweg: "$$2^{-2} = \\frac{1}{2^2} = \\frac{1}{4} = 0{,}25$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne \\(2^{-4}\\) als Dezimalzahl.", loesung: 0.0625, toleranz: 0.0001, tipp: "\\(\\frac{1}{2^4}\\).", loesungsweg: "Ein negativer Exponent bedeutet den Kehrwert: $$2^{-4} = \\frac{1}{2^4} = \\frac{1}{16} = 0{,}0625$$ Das Ergebnis ist positiv und kleiner als eins — das Minus im Exponenten macht die Zahl nicht negativ." },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne \\(3^{-1}\\) (gerundet auf 4 Stellen).", loesung: 0.3333, toleranz: 0.001, tipp: "\\(\\frac{1}{3}\\).", loesungsweg: "Ein negativer Exponent bedeutet den Kehrwert: $$3^{-1} = \\frac13 \\approx 0{,}3333$$ Das Ergebnis ist positiv; das Minus macht die Zahl nur kleiner als eins, nicht negativ." },
      { id: 10, level: 2, typ: "mc", frage: "Welche Aussage stimmt?", optionen: ["\\((-2)^3 = 8\\)", "\\((-2)^3 = -8\\)", "\\((-2)^3 = 6\\)", "\\((-2)^3 = -6\\)"], korrekt: 1, tipp: "Ungerader Exponent behält das Vorzeichen.", loesungsweg: "\\((-2)(-2)(-2) = 4 \\cdot (-2) = -8\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Berechne \\(\\left(\\frac{1}{2}\\right)^3\\) als Dezimalzahl.", loesung: 0.125, toleranz: 0.001, tipp: "\\(\\frac{1}{8}\\).", loesungsweg: "$$\\left(\\frac{1}{2}\\right)^3 = \\frac{1}{8} = 0{,}125$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(4^{-2}\\) als Dezimalzahl.", loesung: 0.0625, toleranz: 0.001, tipp: "\\(\\frac{1}{16}\\).", loesungsweg: "$$4^{-2} = \\frac{1}{16} = 0{,}0625$$" },
      // ========== LEVEL 3 -- Potenzgesetze I ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Vereinfache \\(2^3 \\cdot 2^4\\) und gib das Ergebnis an.", loesung: 128, toleranz: 0, tipp: "\\(a^m \\cdot a^n = a^{m+n}\\).", loesungsweg: "$$2^3 \\cdot 2^4 = 2^7 = 128$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Vereinfache \\(\\frac{5^6}{5^4}\\).", loesung: 25, toleranz: 0, tipp: "\\(\\frac{a^m}{a^n} = a^{m-n}\\).", loesungsweg: "$$\\frac{5^6}{5^4} = 5^2 = 25$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Berechne \\((2^3)^2\\).", loesung: 64, toleranz: 0, tipp: "\\((a^m)^n = a^{mn}\\).", loesungsweg: "$$(2^3)^2 = 2^6 = 64$$" },
      { id: 16, level: 3, typ: "mc", frage: "Vereinfache \\(a^5 \\cdot a^3\\).", optionen: ["\\(a^8\\)", "\\(a^{15}\\)", "\\(2a^8\\)", "\\(a^2\\)"], korrekt: 0, tipp: "Exponenten addieren.", loesungsweg: "$$a^5 \\cdot a^3 = a^{5+3} = a^8$$" },
      { id: 17, level: 3, typ: "mc", frage: "Vereinfache \\(\\frac{x^7}{x^3}\\).", optionen: ["\\(x^{21}\\)", "\\(x^4\\)", "\\(x^{10}\\)", "\\(x^{4{,}33}\\)"], korrekt: 1, tipp: "Exponenten subtrahieren.", loesungsweg: "$$\\frac{x^7}{x^3} = x^{7-3} = x^4$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\(3^2 \\cdot 3^{-1}\\).", loesung: 3, toleranz: 0, tipp: "Exponenten addieren: \\(2 + (-1) = 1\\).", loesungsweg: "$$3^{2-1} = 3^1 = 3$$" },
      // ========== LEVEL 4 -- Potenzgesetz selbst wählen, Terme mit Variablen, Größenvergleich ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Eine Lösung wird viermal hintereinander jeweils auf ein Zehntel verdünnt. Danach beträgt die Konzentration das \\(10^{k}\\)-Fache der Ausgangskonzentration. Gib \\(k\\) an.", loesung: -4, toleranz: 0, tipp: "Welcher Faktor gehört zu einer einzelnen Verdünnung? Vier Verdünnungen sind ein Produkt aus vier solchen Faktoren.", loesungsweg: "Ein Zehntel ist \\(\\tfrac{1}{10} = 10^{-1}\\). Vier Verdünnungen hintereinander multiplizieren sich: $$10^{-1} \\cdot 10^{-1} \\cdot 10^{-1} \\cdot 10^{-1} = \\left(10^{-1}\\right)^4 = 10^{-4}$$ Also \\(k = -4\\): Die Konzentration beträgt noch \\(\\tfrac{1}{10000}\\) des Ausgangswerts. Der negative Exponent zählt die Verdünnungsschritte." },
      { id: 20, level: 4, typ: "numerisch", frage: "Vereinfache \\((x^{-2})^3 \\cdot x^{10}\\) zu einer Potenz \\(x^k\\). Gib \\(k\\) an.", loesung: 4, toleranz: 0, tipp: "Erst die Klammer, dann das Produkt.", loesungsweg: "Beim Potenzieren einer Potenz werden die Exponenten multipliziert, das Vorzeichen wandert mit: $$(x^{-2})^3 = x^{-6}$$ Beim Produkt gleicher Basen werden sie addiert: $$x^{-6} \\cdot x^{10} = x^{-6+10} = x^4$$ Also \\(k = 4\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Für welche ganze Zahl \\(n\\) gilt \\(2^n \\cdot 2^{-5} = 2^{-1}\\)?", loesung: 4, toleranz: 0, tipp: "Vergleiche die Exponenten beider Seiten.", loesungsweg: "Links stehen gleiche Basen, die Exponenten addieren sich: $$2^n \\cdot 2^{-5} = 2^{n-5}$$ Gleiche Basis bedeutet gleiche Exponenten: $$n - 5 = -1 \\;\\Rightarrow\\; n = 4$$ Probe: \\(2^4 \\cdot 2^{-5} = 16 \\cdot \\tfrac{1}{32} = \\tfrac12 = 2^{-1}\\) ✓" },
      { id: 22, level: 4, typ: "mc", frage: "Welche der beiden Zahlen \\(9^{-3}\\) und \\(3^{-4}\\) ist größer? Entscheide ohne Taschenrechner.", optionen: ["\\(9^{-3}\\), weil die Basis \\(9\\) größer als \\(3\\) ist", "\\(3^{-4}\\), weil \\(9^{-3} = 3^{-6}\\) und \\(-4 > -6\\) ist", "Beide sind gleich groß, denn \\(9 \\cdot 3 = 3 \\cdot 9\\)", "\\(9^{-3}\\), weil der Exponent \\(-3\\) größer als \\(-4\\) ist"], korrekt: 1, tipp: "Schreibe beide Zahlen als Potenzen derselben Basis.", loesungsweg: "Gleiche Basis macht den Vergleich möglich: $$9^{-3} = \\left(3^2\\right)^{-3} = 3^{-6}, \\qquad 3^{-4}$$ Bei gleicher Basis \\(3 > 1\\) ist die Potenz mit dem größeren Exponenten größer: \\(-4 > -6\\), also \\(3^{-4} > 9^{-3}\\). Kontrolle: \\(3^{-4} = \\tfrac{1}{81}\\), \\(9^{-3} = \\tfrac{1}{729}\\). Weder die größere Basis noch der größere Exponent allein entscheidet." },
      { id: 23, level: 4, typ: "mc", frage: "Welche der vier Zahlen ist am größten?", optionen: ["\\(\\left(\\frac{1}{2}\\right)^{-2}\\)", "\\(2^{-1}\\)", "\\(3^{-2}\\)", "\\(10^{-1}\\)"], korrekt: 0, tipp: "Ein negativer Exponent bei einem Bruch kehrt den Bruch um.", loesungsweg: "Alle vier Werte bestimmen: $$2^{-1} = \\tfrac12, \\quad 3^{-2} = \\tfrac19, \\quad 10^{-1} = \\tfrac{1}{10}, \\quad \\left(\\tfrac12\\right)^{-2} = 2^2 = 4$$ Drei Zahlen sind kleiner als \\(1\\), weil eine Basis größer als \\(1\\) mit negativem Exponenten einen Kehrwert liefert. Bei der Basis \\(\\tfrac12\\) wirkt der negative Exponent umgekehrt — die Zahl wird groß." },
      { id: 24, level: 4, typ: "numerisch", frage: "Welchen Wert hat der Term \\(\\frac{6x^{-2} \\cdot x^{3}}{3x}\\) für jedes \\(x \\neq 0\\)?", loesung: 2, toleranz: 0, tipp: "Zähler zusammenfassen, dann kürzen.", loesungsweg: "Im Zähler zuerst die Potenzen zusammenfassen: $$6x^{-2} \\cdot x^{3} = 6x^{-2+3} = 6x$$ Dann kürzen: $$\\frac{6x}{3x} = 2$$ Das \\(x\\) fällt vollständig heraus — der Term hat für jedes zulässige \\(x\\) den Wert \\(2\\). Probe mit \\(x = 1\\): \\(\\frac{6 \\cdot 1 \\cdot 1}{3} = 2\\) ✓" },
      // ========== LEVEL 5 -- Fehler finden, Parameter, zweischrittige Aufgaben ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler vereinfacht:<br>Schritt 1: \\((2a)^{-2} = 2 \\cdot a^{-2}\\)<br>Schritt 2: \\(2 \\cdot a^{-2} = \\frac{2}{a^2}\\)<br>Welcher Schritt ist der erste fehlerhafte?", optionen: ["Schritt 2 — richtig wäre \\(2 \\cdot a^{-2} = -2a^2\\), das Minus wandert nach vorn", "Schritt 2 — richtig wäre \\(2 \\cdot a^{-2} = \\frac{1}{2a^2}\\), der Kehrwert des ganzen Terms", "Kein Schritt ist fehlerhaft, das Ergebnis \\(\\frac{2}{a^2}\\) stimmt", "Schritt 1 — die \\(2\\) muss mitpotenziert werden: \\(\\frac{1}{4a^2}\\)"], korrekt: 3, tipp: "Setze \\(a = 1\\) ein: Was ergibt \\((2 \\cdot 1)^{-2}\\)?", loesungsweg: "In Schritt 1 wurde die \\(2\\) nicht mitpotenziert. Ein Produkt wird potenziert, indem jeder Faktor potenziert wird: $$(2a)^{-2} = 2^{-2} \\cdot a^{-2} = \\frac{1}{4} \\cdot \\frac{1}{a^2} = \\frac{1}{4a^2}$$ Kontrolle mit \\(a = 1\\): \\((2)^{-2} = \\tfrac14\\), der Schüler erhält dagegen \\(2\\). Schritt 2 ist für sich richtig — \\(a^{-2}\\) ist \\(\\tfrac{1}{a^2}\\), und der Faktor \\(2\\) bleibt im Zähler —, baut aber auf dem falschen Term auf." },
      { id: 26, level: 5, typ: "numerisch", frage: "Für eine natürliche Zahl \\(a > 1\\) und eine ganze Zahl \\(n\\) gilt \\(a^n = \\frac{1}{81}\\) und \\(a^{n+6} = 9\\). Bestimme \\(n\\).", loesung: -4, toleranz: 0, tipp: "Schreibe \\(81\\) und \\(9\\) als Potenzen derselben Basis.", loesungsweg: "Beide Zahlen sind Dreierpotenzen: \\(81 = 3^4\\), \\(9 = 3^2\\). Mit \\(a = 3\\) folgt aus der ersten Bedingung $$3^n = \\frac{1}{81} = 3^{-4} \\;\\Rightarrow\\; n = -4$$ Die zweite Bedingung bestätigt das: \\(3^{-4+6} = 3^2 = 9\\) ✓ Die Basis \\(a = 9\\) scheitert: \\(9^n = \\tfrac{1}{81}\\) ergäbe \\(n = -2\\), aber dann wäre \\(9^{4} \\neq 9\\). Also \\(n = -4\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Quadrat hat den Flächeninhalt \\(2^{-4}\\,\\text{m}^2\\). Wie lang ist sein Umfang in Zentimetern?", loesung: 100, toleranz: 0, tipp: "Erst die Seitenlänge als Zweierpotenz bestimmen.", loesungsweg: "Die Seitenlänge ist die Zahl, deren Quadrat \\(2^{-4}\\) ergibt: $$a = 2^{-2}\\,\\text{m}, \\quad \\text{denn } (2^{-2})^2 = 2^{-4}$$ Also \\(a = \\tfrac14\\,\\text{m} = 25\\,\\text{cm}\\). Der Umfang ist das Vierfache: $$U = 4 \\cdot 25\\,\\text{cm} = 100\\,\\text{cm}$$ Halbieren des Exponenten entspricht dem Wurzelziehen — das gilt auch bei negativen Exponenten." },
      { id: 28, level: 5, typ: "numerisch", frage: "Für welche Zahl \\(x\\) gilt \\(4^x = 8^{-2}\\)?", loesung: -3, toleranz: 0, tipp: "Beide Basen sind Zweierpotenzen.", loesungsweg: "Erst beide Seiten auf die Basis \\(2\\) bringen: $$4^x = (2^2)^x = 2^{2x}, \\qquad 8^{-2} = (2^3)^{-2} = 2^{-6}$$ Gleiche Basis, also gleiche Exponenten: $$2x = -6 \\;\\Rightarrow\\; x = -3$$ Probe: \\(4^{-3} = \\tfrac{1}{64}\\) und \\(8^{-2} = \\tfrac{1}{64}\\) ✓" },
      { id: 29, level: 5, typ: "mc", frage: "Welche der Zahlen \\(2^{-10}\\) und \\(10^{-3}\\) ist kleiner? Entscheide ohne Taschenrechner.", optionen: ["\\(10^{-3}\\), weil die Basis \\(10\\) größer ist als \\(2\\)", "\\(2^{-10}\\), weil der Exponent \\(-10\\) kleiner ist als \\(-3\\)", "\\(2^{-10}\\), denn \\(2^{10} = 1024 > 1000 = 10^3\\)", "Beide sind gleich groß, denn \\(2^{10} = 1000\\)"], korrekt: 2, tipp: "Vergleiche zuerst \\(2^{10}\\) und \\(10^3\\).", loesungsweg: "Beide Zahlen sind Kehrwerte: \\(2^{-10} = \\tfrac{1}{1024}\\) und \\(10^{-3} = \\tfrac{1}{1000}\\). Von zwei Stammbrüchen ist der mit dem größeren Nenner kleiner: $$1024 > 1000 \\;\\Rightarrow\\; \\frac{1}{1024} < \\frac{1}{1000}$$ Also ist \\(2^{-10}\\) kleiner — allerdings nur knapp, um etwa \\(2{,}4\\,\\%\\). Weder die Basis noch der Exponent allein entscheiden den Vergleich; man muss die Werte gegeneinander abwägen." },
      { id: 30, level: 5, typ: "numerisch", frage: "Der Term \\((a^2)^{-3} \\cdot a^{k}\\) soll für jedes \\(a \\neq 0\\) den Wert \\(1\\) haben. Bestimme \\(k\\).", loesung: 6, toleranz: 0, tipp: "Welcher Exponent macht eine Potenz zu \\(1\\)?", loesungsweg: "Erst vereinfachen: $$(a^2)^{-3} \\cdot a^{k} = a^{-6} \\cdot a^{k} = a^{k-6}$$ Eine Potenz mit Basis \\(a \\neq 0\\) ist genau dann für alle \\(a\\) gleich \\(1\\), wenn der Exponent \\(0\\) ist: $$k - 6 = 0 \\;\\Rightarrow\\; k = 6$$ Probe: \\(a^{-6} \\cdot a^{6} = a^0 = 1\\) ✓" },
      // ========== LEVEL 6 -- Behauptungen prüfen, Fallunterscheidungen, Umkehraufgaben ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Für alle \\(a, b > 0\\) gilt \\((a + b)^{-1} = a^{-1} + b^{-1}\\).\" Stimmt das?", optionen: ["Ja — der Exponent \\(-1\\) wird auf jeden Summanden angewendet", "Ja, aber nur wenn \\(a = b\\) ist, dann sind beide Seiten gleich", "Nein — richtig wäre \\((a+b)^{-1} = a^{-1} \\cdot b^{-1}\\)", "Nein — für \\(a = b = 1\\) ist links \\(\\frac12\\), rechts \\(2\\)"], korrekt: 3, tipp: "Setze einfache Zahlen ein und vergleiche beide Seiten.", loesungsweg: "Ein Zahlenbeispiel genügt zum Widerlegen: $$(1 + 1)^{-1} = 2^{-1} = \\frac12, \\qquad 1^{-1} + 1^{-1} = 1 + 1 = 2$$ Die Behauptung ist falsch. Auch \\(a = b\\) rettet sie nicht, wie das Beispiel zeigt. Der Kehrwert einer Summe ist nicht die Summe der Kehrwerte — genauso wenig wie \\(\\frac{1}{2+3}\\) gleich \\(\\frac12 + \\frac13\\) ist. Und \\(a^{-1} \\cdot b^{-1} = (ab)^{-1}\\) ist der Kehrwert des Produkts, nicht der Summe. Potenzgesetze zerlegen Produkte und Quotienten, niemals Summen." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für positive Zahlen \\(a\\) und \\(q\\) gilt \\(a \\cdot q^2 = 18\\) und \\(a \\cdot q^4 = 162\\). Bestimme \\(a\\).", loesung: 2, toleranz: 0, tipp: "Dividiere die beiden Gleichungen durcheinander.", loesungsweg: "Der Quotient der beiden Gleichungen lässt \\(a\\) herausfallen: $$\\frac{a q^4}{a q^2} = q^{4-2} = q^2 = \\frac{162}{18} = 9$$ Wegen \\(q > 0\\) ist \\(q = 3\\). Einsetzen in die erste Gleichung: $$a \\cdot 9 = 18 \\;\\Rightarrow\\; a = 2$$ Probe: \\(2 \\cdot 3^4 = 2 \\cdot 81 = 162\\) ✓" },
      { id: 33, level: 6, typ: "mc", frage: "Für welche ganzen Zahlen \\(n\\) ist \\((-2)^n\\) positiv <b>und</b> kleiner als \\(1\\)?", optionen: ["Genau für die geraden negativen \\(n\\), etwa \\(n = -2\\): \\((-2)^{-2} = \\frac14\\)", "Für alle negativen \\(n\\), weil ein negativer Exponent einen Bruch erzeugt", "Für alle geraden \\(n\\), weil gerade Potenzen positiv sind", "Für kein \\(n\\), weil eine negative Basis nie eine positive Potenz liefert"], korrekt: 0, tipp: "Betrachte Vorzeichen und Betrag der Potenz getrennt — beide hängen vom Exponenten ab.", loesungsweg: "Zwei Bedingungen, zwei Eigenschaften des Exponenten: Das Ergebnis ist <b>positiv</b>, wenn \\(n\\) gerade ist (Minus mal Minus). Das Ergebnis ist <b>kleiner als \\(1\\)</b>, wenn \\(n\\) negativ ist, denn dann entsteht der Kehrwert einer Zahl mit Betrag größer als \\(1\\). Beides zusammen: \\(n\\) gerade und negativ. $$(-2)^{-2} = \\frac{1}{4}, \\quad (-2)^{-4} = \\frac{1}{16}, \\quad \\text{aber } (-2)^{-3} = -\\frac18$$ Für \\(n = 0\\) wäre das Ergebnis \\(1\\), also nicht kleiner als \\(1\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Wie viele ganze Zahlen \\(n\\) erfüllen die Ungleichung \\(1 < 2^{-n} < 100\\)?", loesung: 6, toleranz: 0, tipp: "Für welche Vorzeichen von \\(n\\) ist \\(2^{-n}\\) überhaupt größer als \\(1\\)?", loesungsweg: "Damit \\(2^{-n} > 1\\) ist, muss der Exponent \\(-n\\) positiv sein, also \\(n < 0\\). Mit \\(m = -n > 0\\) lautet die Bedingung \\(1 < 2^m < 100\\): $$2^1 = 2,\\ 2^2 = 4,\\ 2^3 = 8,\\ 2^4 = 16,\\ 2^5 = 32,\\ 2^6 = 64 \\quad (2^7 = 128 \\text{ ist zu groß})$$ Das sind sechs Werte \\(m = 1, \\ldots, 6\\), also \\(n = -1, \\ldots, -6\\). Antwort: \\(6\\) ganze Zahlen. Für \\(n \\geq 0\\) ist \\(2^{-n} \\leq 1\\) und fällt heraus." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Medikament halbiert die Anzahl der Bakterien in einer Kultur jede Stunde. Nach \\(5\\) Stunden sind noch \\(250\\) Bakterien vorhanden. Wie viele waren es zu Beginn?", loesung: 8000, toleranz: 0, tipp: "Rückwärts rechnen: Jede Stunde zurück verdoppelt die Anzahl.", loesungsweg: "Nach \\(t\\) Stunden ist die Anzahl \\(N_0 \\cdot 2^{-t}\\). Aus \\(N_0 \\cdot 2^{-5} = 250\\) folgt $$N_0 = 250 \\cdot 2^{5} = 250 \\cdot 32 = 8000$$ Der negative Exponent beschreibt das Halbieren; die Umkehrung — Division durch \\(2^{-5}\\) — ist die Multiplikation mit \\(2^5\\). Aus \\(8000\\) Bakterien werden in fünf Halbierungen \\(4000, 2000, 1000, 500, 250\\) ✓" },
      { id: 36, level: 6, typ: "numerisch", frage: "Wie viele der fünf Zahlen \\(2^{-3}\\), \\(3^{-2}\\), \\(4^{-1}\\), \\(\\left(\\frac{1}{5}\\right)^{-1}\\) und \\(0{,}1^{-2}\\) sind größer als \\(0{,}2\\)?", loesung: 3, toleranz: 0, tipp: "Bestimme jeden Wert einzeln als Bruch oder Dezimalzahl.", loesungsweg: "Alle fünf Werte ausrechnen: $$2^{-3} = 0{,}125, \\quad 3^{-2} = \\tfrac19 \\approx 0{,}111, \\quad 4^{-1} = 0{,}25, \\quad \\left(\\tfrac15\\right)^{-1} = 5, \\quad 0{,}1^{-2} = 100$$ Größer als \\(0{,}2\\) sind \\(4^{-1}\\), \\(\\left(\\tfrac15\\right)^{-1}\\) und \\(0{,}1^{-2}\\) — also \\(3\\) Zahlen. Auffällig: Negative Exponenten bei Basen kleiner als \\(1\\) liefern große Werte, bei Basen größer als \\(1\\) kleine Werte." }];
    </script>
