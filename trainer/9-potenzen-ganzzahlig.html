<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzen mit ganzzahligen Exponenten - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-potenzen-ganzzahlig';
    const THEMA_CONFIG = { name: 'Potenzen mit ganzzahligen Exponenten', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Berechne \\(2^3\\).", loesung: 8, toleranz: 0, tipp: "\\(2 \\cdot 2 \\cdot 2\\).", loesungsweg: "$$2^3 = 8$$" },
      { id: 2, level: 1, typ: "numerisch", frage: "Berechne \\(5^2\\).", loesung: 25, toleranz: 0, tipp: "\\(5 \\cdot 5\\).", loesungsweg: "$$5^2 = 25$$" },
      { id: 3, level: 1, typ: "mc", frage: "Wie heißt die Zahl \\(3\\) in \\(3^4\\)?", optionen: ["Exponent", "Basis", "Koeffizient", "Radikand"], korrekt: 1, tipp: "Die untere Zahl wird wiederholt multipliziert.", loesungsweg: "\\(3\\) ist die <b>Basis</b>, \\(4\\) der Exponent." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne \\(10^4\\).", loesung: 10000, toleranz: 0, tipp: "Zehnerpotenz: eine 1 mit 4 Nullen.", loesungsweg: "$$10^4 = 10\\,000$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne \\(7^0\\).", loesung: 1, toleranz: 0, tipp: "Jede Zahl (außer 0) hoch 0 ergibt 1.", loesungsweg: "$$a^0 = 1 \\text{ für } a \\neq 0$$" },
      { id: 6, level: 1, typ: "mc", frage: "Was ist \\((-3)^2\\)?", optionen: ["\\(-9\\)", "\\(9\\)", "\\(-6\\)", "\\(6\\)"], korrekt: 1, tipp: "Minus mal Minus ergibt Plus.", loesungsweg: "\\((-3)(-3) = 9\\)." },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne \\(2^{-2}\\) als Dezimalzahl.", loesung: 0.25, toleranz: 0.001, tipp: "\\(a^{-n} = \\frac{1}{a^n}\\).", loesungsweg: "$$2^{-2} = \\frac{1}{2^2} = \\frac{1}{4} = 0{,}25$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne \\(10^{-3}\\) als Dezimalzahl.", loesung: 0.001, toleranz: 0.0001, tipp: "\\(\\frac{1}{1000}\\).", loesungsweg: "$$10^{-3} = \\frac{1}{1000} = 0{,}001$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne \\(3^{-1}\\) (gerundet auf 4 Stellen).", loesung: 0.3333, toleranz: 0.001, tipp: "\\(\\frac{1}{3}\\).", loesungsweg: "$$3^{-1} = \\frac{1}{3} \\approx 0{,}3333$$" },
      { id: 10, level: 2, typ: "mc", frage: "Welche Aussage stimmt?", optionen: ["\\((-2)^3 = 8\\)", "\\((-2)^3 = -8\\)", "\\((-2)^3 = 6\\)", "\\((-2)^3 = -6\\)"], korrekt: 1, tipp: "Ungerader Exponent behält das Vorzeichen.", loesungsweg: "\\((-2)(-2)(-2) = 4 \\cdot (-2) = -8\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Berechne \\(\\left(\\frac{1}{2}\\right)^3\\) als Dezimalzahl.", loesung: 0.125, toleranz: 0.001, tipp: "\\(\\frac{1}{8}\\).", loesungsweg: "$$\\left(\\frac{1}{2}\\right)^3 = \\frac{1}{8} = 0{,}125$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(4^{-2}\\) als Dezimalzahl.", loesung: 0.0625, toleranz: 0.001, tipp: "\\(\\frac{1}{16}\\).", loesungsweg: "$$4^{-2} = \\frac{1}{16} = 0{,}0625$$" },
      // ========== LEVEL 3 -- Potenzgesetze I ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Vereinfache \\(2^3 \\cdot 2^4\\) und gib das Ergebnis an.", loesung: 128, toleranz: 0, tipp: "\\(a^m \\cdot a^n = a^{m+n}\\).", loesungsweg: "$$2^3 \\cdot 2^4 = 2^7 = 128$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Vereinfache \\(\\frac{5^6}{5^4}\\).", loesung: 25, toleranz: 0, tipp: "\\(\\frac{a^m}{a^n} = a^{m-n}\\).", loesungsweg: "$$\\frac{5^6}{5^4} = 5^2 = 25$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Berechne \\((2^3)^2\\).", loesung: 64, toleranz: 0, tipp: "\\((a^m)^n = a^{mn}\\).", loesungsweg: "$$(2^3)^2 = 2^6 = 64$$" },
      { id: 16, level: 3, typ: "mc", frage: "Vereinfache \\(a^5 \\cdot a^3\\).", optionen: ["\\(a^8\\)", "\\(a^{15}\\)", "\\(2a^8\\)", "\\(a^2\\)"], korrekt: 0, tipp: "Exponenten addieren.", loesungsweg: "$$a^5 \\cdot a^3 = a^{5+3} = a^8$$" },
      { id: 17, level: 3, typ: "mc", frage: "Vereinfache \\(\\frac{x^7}{x^3}\\).", optionen: ["\\(x^{21}\\)", "\\(x^4\\)", "\\(x^{10}\\)", "\\(x^{4{,}33}\\)"], korrekt: 1, tipp: "Exponenten subtrahieren.", loesungsweg: "$$\\frac{x^7}{x^3} = x^{7-3} = x^4$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\(3^2 \\cdot 3^{-1}\\).", loesung: 3, toleranz: 0, tipp: "Exponenten addieren: \\(2 + (-1) = 1\\).", loesungsweg: "$$3^{2-1} = 3^1 = 3$$" },
      // ========== LEVEL 4 -- Potenzgesetze II ==========
      { id: 19, level: 4, typ: "mc", frage: "Vereinfache \\((2a)^3\\).", optionen: ["\\(2a^3\\)", "\\(6a^3\\)", "\\(8a^3\\)", "\\(8a\\)"], korrekt: 2, tipp: "\\((ab)^n = a^n b^n\\).", loesungsweg: "$$(2a)^3 = 2^3 \\cdot a^3 = 8a^3$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Berechne \\(\\left(\\frac{2}{3}\\right)^2\\) als Dezimalzahl (4 Stellen).", loesung: 0.4444, toleranz: 0.001, tipp: "\\(\\frac{4}{9}\\).", loesungsweg: "$$\\left(\\frac{2}{3}\\right)^2 = \\frac{4}{9} \\approx 0{,}4444$$" },
      { id: 21, level: 4, typ: "numerisch", frage: "Berechne \\(2^{10}\\).", loesung: 1024, toleranz: 0, tipp: "Speicher-Grenze in der Informatik.", loesungsweg: "$$2^{10} = 1024$$" },
      { id: 22, level: 4, typ: "mc", frage: "Vereinfache \\(\\frac{a^3 b^4}{a b^2}\\).", optionen: ["\\(a^2 b^2\\)", "\\(a^4 b^6\\)", "\\(a^2 b^6\\)", "\\(ab^2\\)"], korrekt: 0, tipp: "Jeweils getrennt kürzen.", loesungsweg: "$$\\frac{a^3 b^4}{a b^2} = a^{3-1} b^{4-2} = a^2 b^2$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Berechne \\(\\frac{10^7}{10^4}\\).", loesung: 1000, toleranz: 0, tipp: "\\(10^{7-4}\\).", loesungsweg: "$$10^3 = 1000$$" },
      { id: 24, level: 4, typ: "mc", frage: "Vereinfache \\((x^{-2})^3\\).", optionen: ["\\(x^{-6}\\)", "\\(x^{5}\\)", "\\(x^{-5}\\)", "\\(-x^6\\)"], korrekt: 0, tipp: "Exponenten multiplizieren.", loesungsweg: "$$(x^{-2})^3 = x^{-6} = \\frac{1}{x^6}$$" },
      // ========== LEVEL 5 -- Zehnerpotenzen / wiss. Schreibweise ==========
      { id: 25, level: 5, typ: "mc", frage: "Schreibe \\(45\\,000\\) in wissenschaftlicher Notation.", optionen: ["\\(4{,}5 \\cdot 10^3\\)", "\\(4{,}5 \\cdot 10^4\\)", "\\(45 \\cdot 10^3\\)", "\\(0{,}45 \\cdot 10^5\\)"], korrekt: 1, tipp: "Verschiebe das Komma hinter die erste Ziffer.", loesungsweg: "$$45\\,000 = 4{,}5 \\cdot 10^4$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Schreibe \\(0{,}000\\,07\\) als \\(7 \\cdot 10^{-n}\\). Gib \\(n\\) an.", loesung: 5, toleranz: 0, tipp: "Komma 5 Stellen nach rechts.", loesungsweg: "$$0{,}000\\,07 = 7 \\cdot 10^{-5}$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Berechne \\((3 \\cdot 10^4) \\cdot (2 \\cdot 10^3)\\) und gib das Ergebnis in Normaldarstellung an.", loesung: 60000000, toleranz: 0, tipp: "Zahlen und Zehnerpotenzen getrennt.", loesungsweg: "$$6 \\cdot 10^7 = 60\\,000\\,000$$" },
      { id: 28, level: 5, typ: "numerisch", frage: "Der Durchmesser eines Virus beträgt \\(1{,}2 \\cdot 10^{-7}\\,\\text{m}\\). Wie viele Nanometer sind das? (\\(1\\,\\text{nm} = 10^{-9}\\,\\text{m}\\))", loesung: 120, toleranz: 0, tipp: "\\(1{,}2 \\cdot 10^{-7} / 10^{-9} = 1{,}2 \\cdot 10^2\\).", loesungsweg: "$$\\frac{1{,}2 \\cdot 10^{-7}}{10^{-9}} = 1{,}2 \\cdot 10^2 = 120\\,\\text{nm}$$" },
      { id: 29, level: 5, typ: "mc", frage: "Welche Zahl ist am größten?", optionen: ["\\(2^{10}\\)", "\\(10^3\\)", "\\(3^7\\)", "\\(5^5\\)"], korrekt: 2, tipp: "Rechne aus: 1024, 1000, 2187, 3125.", loesungsweg: "\\(5^5 = 3125\\) ist am größten." },
      { id: 30, level: 5, typ: "numerisch", frage: "Berechne \\(\\frac{8 \\cdot 10^6}{2 \\cdot 10^2}\\). Gib das Ergebnis als normale Zahl an.", loesung: 40000, toleranz: 0, tipp: "Zahlen dividieren, Exponenten subtrahieren.", loesungsweg: "$$\\frac{8}{2} \\cdot 10^{6-2} = 4 \\cdot 10^4 = 40\\,000$$" },
      // ========== LEVEL 6 -- Transfer ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Berechne \\((-1)^{100}\\).", loesung: 1, toleranz: 0, tipp: "Gerader Exponent.", loesungsweg: "\\((-1)^{\\text{gerade}} = 1\\)." },
      { id: 32, level: 6, typ: "mc", frage: "Vereinfache \\(\\frac{(a^2)^3 \\cdot a^{-4}}{a^2}\\).", optionen: ["\\(a^0 = 1\\)", "\\(a\\)", "\\(a^2\\)", "\\(a^{-2}\\)"], korrekt: 0, tipp: "Im Zähler: \\(a^6 \\cdot a^{-4} = a^2\\). Dann \\(\\frac{a^2}{a^2}\\).", loesungsweg: "$$\\frac{a^6 \\cdot a^{-4}}{a^2} = \\frac{a^2}{a^2} = 1$$" },
      { id: 33, level: 6, typ: "numerisch", frage: "Die Sonne ist \\(1{,}5 \\cdot 10^8\\,\\text{km}\\) entfernt. Licht legt \\(3 \\cdot 10^5\\,\\text{km/s}\\) zurück. Wie viele Sekunden braucht Licht?", loesung: 500, toleranz: 1, tipp: "\\(t = \\frac{s}{v}\\).", loesungsweg: "$$t = \\frac{1{,}5 \\cdot 10^8}{3 \\cdot 10^5} = 0{,}5 \\cdot 10^3 = 500\\,\\text{s}$$" },
      { id: 34, level: 6, typ: "numerisch", frage: "Für welches \\(n\\) gilt \\(2^n = 256\\)?", loesung: 8, toleranz: 0, tipp: "\\(2^8 = 256\\).", loesungsweg: "$$2^8 = 256 \\Rightarrow n = 8$$" },
      { id: 35, level: 6, typ: "mc", frage: "Welche Aussage ist falsch?", optionen: ["\\(a^{-n} = \\frac{1}{a^n}\\)", "\\(a^0 = 1\\) für \\(a \\neq 0\\)", "\\((a+b)^n = a^n + b^n\\)", "\\(a^m \\cdot a^n = a^{m+n}\\)"], korrekt: 2, tipp: "Summen darf man nicht getrennt potenzieren.", loesungsweg: "\\((a+b)^n \\neq a^n + b^n\\) (z. B. \\((1+1)^2 = 4 \\neq 2\\))." },
      { id: 36, level: 6, typ: "numerisch", frage: "Berechne \\(2^{-3} + 2^{-2}\\) als Dezimalzahl.", loesung: 0.375, toleranz: 0.001, tipp: "\\(\\frac{1}{8} + \\frac{1}{4}\\).", loesungsweg: "$$\\frac{1}{8} + \\frac{2}{8} = \\frac{3}{8} = 0{,}375$$" }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
