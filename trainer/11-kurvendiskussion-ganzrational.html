<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-kurvendiskussion-ganzrational';
    const THEMA_CONFIG = { name: 'Kurvendiskussion ganzrationaler Funktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — Grundbegriffe
      { id: 1, level: 1, typ: "mc", frage: "Symmetrie von \\(f(x)=x^3\\)?", optionen: ["Achsensymm. zur y-Achse", "Punktsymm. zum Ursprung", "weder noch", "beides"], korrekt: 1, tipp: "\\(-x\\) einsetzen und mit \\(f(x)\\) vergleichen.", loesungsweg: "Einsetzen von \\(-x\\): $$f(-x) = (-x)^3 = -x^3 = -f(x)$$ Das ist genau die Bedingung \\(f(-x) = -f(x)\\) für <b>Punktsymmetrie zum Ursprung</b>. Für Achsensymmetrie müsste dagegen \\(f(-x) = f(x)\\) herauskommen — das gelingt nur bei lauter geraden Exponenten." },
      { id: 2, level: 1, typ: "numerisch", frage: "\\(f(x)=x^2-4\\). Anzahl Nullstellen?", loesung: 2, toleranz: 0, tipp: "\\(x^2=4\\).", loesungsweg: "$$x^2 - 4 = 0 \\;\\Rightarrow\\; x^2 = 4 \\;\\Rightarrow\\; x = \\pm 2$$ Also <b>zwei</b> Nullstellen. Die negative Lösung wird leicht vergessen — bei geradem Exponenten gehört sie stets dazu." },
      { id: 3, level: 1, typ: "mc", frage: "Symmetrie von \\(f(x)=x^4-2x^2\\)?", optionen: ["Punktsymmetrisch", "Achsensymm. zur y-Achse", "keine", "zur x-Achse"], korrekt: 1, tipp: "Nur gerade Exponenten.", loesungsweg: "Einsetzen von \\(-x\\): $$f(-x) = (-x)^4 - 2(-x)^2 = x^4 - 2x^2 = f(x)$$ Alle Exponenten sind gerade, das Vorzeichen verschwindet also beim Potenzieren. Das ist die Bedingung für Achsensymmetrie zur \\(y\\)-Achse." },
      { id: 4, level: 1, typ: "numerisch", frage: "\\(f(x)=2x^3-x^2+5\\). y-Achsenabschnitt?", loesung: 5, toleranz: 0, tipp: "\\(f(0)\\).", loesungsweg: "Der \\(y\\)-Achsenabschnitt ist der Funktionswert an der Stelle null: $$f(0) = 0 - 0 + 5 = 5$$ Bei einem Polynom ist das stets das konstante Glied — Rechnen ist nicht nötig." },
      { id: 5, level: 1, typ: "mc", frage: "Definitionsbereich von \\(f(x)=x^3-3x+1\\)?", optionen: ["\\(\\mathbb{R}\\)", "\\(\\mathbb{R}\\setminus\\{0\\}\\)", "\\([0,\\infty)\\)", "\\((-\\infty,0]\\)"], korrekt: 0, tipp: "Polynom.", loesungsweg: "Ein Polynom besteht nur aus Potenzen von \\(x\\), Multiplikationen und Additionen. Es gibt weder einen Nenner, der null werden könnte, noch eine Wurzel mit negativem Argument: $$D = \\mathbb{R}$$" },
      { id: 6, level: 1, typ: "mc", frage: "Verhalten von \\(f(x)=-2x^4+x^2\\) für \\(x\\to\\pm\\infty\\)?", optionen: ["\\(+\\infty\\)", "\\(-\\infty\\)", "\\(+\\infty\\) rechts, \\(-\\infty\\) links", "\\(0\\)"], korrekt: 1, tipp: "Nur das Glied mit dem höchsten Exponenten zählt.", loesungsweg: "Für sehr große \\(|x|\\) bestimmt allein das Glied höchsten Grades das Verhalten, hier \\(-2x^4\\). Der Exponent \\(4\\) ist gerade, also ist \\(x^4 > 0\\) auf beiden Seiten; der negative Faktor \\(-2\\) dreht das Vorzeichen: $$\\lim_{x\\to\\pm\\infty}\\left(-2x^4+x^2\\right) = -\\infty$$ Der Graph fällt also auf beiden Seiten ins Negative. Das Glied \\(x^2\\) wächst zu langsam, um daran etwas zu ändern." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "\\(f(x)=x^2-5x+6\\). Größte Nullstelle?", loesung: 3, toleranz: 0, tipp: "Faktorisieren.", loesungsweg: "Faktorisieren über Vieta: Gesucht sind zwei Zahlen mit Summe \\(5\\) und Produkt \\(6\\) — das sind \\(2\\) und \\(3\\). $$x^2 - 5x + 6 = (x-2)(x-3) = 0$$ Die Nullstellen sind \\(2\\) und \\(3\\), die größte ist \\(3\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-4x\\). Anzahl Nullstellen?", loesung: 3, toleranz: 0, tipp: "\\(x(x^2-4)\\).", loesungsweg: "Ausklammern macht die Nullstellen sichtbar: $$x^3 - 4x = x(x^2-4) = x(x-2)(x+2) = 0$$ Also \\(x = 0\\), \\(x = 2\\), \\(x = -2\\) — <b>drei</b> Nullstellen." },
      { id: 9, level: 2, typ: "mc", frage: "Symmetrie von \\(f(x)=x^3-4x\\)?", optionen: ["Achsensymm.", "Punktsymm. zum Ursprung", "keine", "andere"], korrekt: 1, tipp: "\\(f(-x)\\).", loesungsweg: "$$f(-x) = (-x)^3 - 4(-x) = -x^3 + 4x = -f(x)$$ Nur ungerade Exponenten, also Punktsymmetrie zum Ursprung." },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+11x-6\\). \\(f(1)\\)?", loesung: 0, toleranz: 0, tipp: "Den Wert einsetzen und gliedweise ausrechnen.", loesungsweg: "Einsetzen von \\(x = 1\\): $$f(1) = 1^3 - 6 \\cdot 1^2 + 11 \\cdot 1 - 6 = 1 - 6 + 11 - 6 = 0$$ Der Wert null bedeutet: \\(x = 1\\) ist eine <b>Nullstelle</b>. Beim Suchen ganzzahliger Nullstellen probiert man die Teiler des konstanten Glieds \\(-6\\), also \\(\\pm 1, \\pm 2, \\pm 3, \\pm 6\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3+2x^2-8x\\). Größte Nullstelle?", loesung: 2, toleranz: 0, tipp: "Ein gemeinsamer Faktor steckt in jedem Glied — ausklammern und die Restklammer zerlegen.", loesungsweg: "Ausklammern von \\(x\\), dann die quadratische Klammer über Vieta zerlegen (Summe \\(2\\), Produkt \\(-8\\), also \\(4\\) und \\(-2\\)): $$x^3 + 2x^2 - 8x = x(x^2+2x-8) = x(x+4)(x-2)$$ Nach dem Satz vom Nullprodukt ist ein Produkt genau dann null, wenn ein Faktor null ist: \\(x = 0\\), \\(x = -4\\), \\(x = 2\\). Die größte Nullstelle ist \\(2\\)." },
      { id: 12, level: 2, typ: "mc", frage: "\\(f(x)=x^3-3x\\) für \\(x\\to+\\infty\\)?", optionen: ["\\(+\\infty\\)", "\\(-\\infty\\)", "\\(0\\)", "oszilliert"], korrekt: 0, tipp: "Grad und Vorzeichen des Leitkoeffizienten ansehen.", loesungsweg: "Maßgeblich ist das Glied höchsten Grades \\(x^3\\). Der Exponent ist ungerade und der Leitkoeffizient positiv: $$\\lim_{x\\to+\\infty}\\left(x^3-3x\\right) = +\\infty$$ Das Glied \\(-3x\\) wächst viel langsamer und fällt für große \\(x\\) nicht ins Gewicht. Auf der linken Seite geht der Graph entsprechend gegen \\(-\\infty\\)." },
      // LEVEL 3 — Standardablauf
      { id: 13, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x\\). x-Koordinate des Hochpunkts?", loesung: -1, toleranz: 0, tipp: "Erst die Kandidaten aus \\(f'=0\\), dann die Art über \\(f''\\).", loesungsweg: "$$f'(x) = 3x^2 - 3 = 0 \\;\\Rightarrow\\; x^2 = 1 \\;\\Rightarrow\\; x = \\pm 1$$ Über die Art entscheidet \\(f''(x) = 6x\\): $$f''(-1) = -6 < 0 \\;\\Rightarrow\\; \\text{Hochpunkt}, \\qquad f''(1) = 6 > 0 \\;\\Rightarrow\\; \\text{Tiefpunkt}$$ Der Hochpunkt liegt also bei \\(x = -1\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x\\). y-Wert des Hochpunkts?", loesung: 2, toleranz: 0, tipp: "Die Hochpunktstelle in die Funktion einsetzen.", loesungsweg: "Der Hochpunkt liegt bei \\(x = -1\\); sein \\(y\\)-Wert ist der Funktionswert dort: $$f(-1) = (-1)^3 - 3 \\cdot (-1) = -1 + 3 = 2$$ Der Hochpunkt ist also \\(H(-1 \\mid 2)\\). Wegen der Punktsymmetrie zum Ursprung liegt der Tiefpunkt spiegelbildlich bei \\(T(1 \\mid -2)\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x\\). x-Koordinate des Wendepunkts?", loesung: 0, toleranz: 0, tipp: "\\(f''=6x=0\\).", loesungsweg: "$$f''(x) = 6x = 0 \\;\\Rightarrow\\; x = 0$$ Bei jeder punktsymmetrischen Funktion dritten Grades liegt der Wendepunkt im Ursprung." },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-12x+2\\). y-Wert des Tiefpunkts?", loesung: -14, toleranz: 0, tipp: "Erst beide Extremstellen, dann die Art bestimmen.", loesungsweg: "$$f'(x) = 3x^2 - 12 = 0 \\;\\Rightarrow\\; x^2 = 4 \\;\\Rightarrow\\; x = \\pm 2$$ Mit \\(f''(x) = 6x\\) ist \\(f''(2) = 12 > 0\\) — bei \\(x = 2\\) liegt also der Tiefpunkt: $$f(2) = 8 - 24 + 2 = -14$$ Der Hochpunkt bei \\(x = -2\\) hat dagegen \\(f(-2) = -8 + 24 + 2 = 18\\)." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x^2\\). Wie viele verschiedene Nullstellen?", optionen: ["1", "2", "3", "keine"], korrekt: 1, tipp: "Ausklammern und die Vielfachheiten beachten.", loesungsweg: "Ausklammern von \\(x^2\\): $$x^3 - 3x^2 = x^2(x-3) = 0$$ Der Satz vom Nullprodukt liefert \\(x = 0\\) (aus \\(x^2 = 0\\), also <b>doppelt</b>) und \\(x = 3\\). Gefragt sind die <b>verschiedenen</b> Nullstellen — das sind zwei. Bei \\(x = 0\\) berührt der Graph die Achse, bei \\(x = 3\\) schneidet er sie." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2\\). x-Koordinate des Wendepunkts?", loesung: 1, toleranz: 0, tipp: "\\(f''=6x-6\\).", loesungsweg: "Zweimal ableiten: \\(f'(x) = 3x^2 - 6x\\), also \\(f''(x) = 6x - 6\\). $$6x - 6 = 0 \\;\\Rightarrow\\; x = 1$$ Zur Bestätigung: \\(f'''(x) = 6 \\ne 0\\), der Vorzeichenwechsel von \\(f''\\) ist also gesichert." },
      // LEVEL 4 — Polynome 3./4. Grades
      { id: 19, level: 4, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). Anzahl Extremstellen?", loesung: 3, toleranz: 0, tipp: "\\(f'=4x(x^2-4)\\).", loesungsweg: "$$f'(x) = 4x^3 - 16x = 4x(x^2-4) = 0$$ Also \\(x = 0\\), \\(x = 2\\), \\(x = -2\\) — <b>drei</b> Extremstellen. An allen dreien wechselt \\(f'\\) das Vorzeichen, es sind also echte Extrema: zwei Tiefpunkte außen, ein Hochpunkt in der Mitte." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). y-Wert des Hochpunkts?", loesung: 0, toleranz: 0, tipp: "HP bei \\(x=0\\).", loesungsweg: "Der Hochpunkt liegt bei \\(x = 0\\): $$f(0) = 0 - 0 = 0$$ Die beiden Tiefpunkte bei \\(\\pm 2\\) haben dagegen \\(f(\\pm2) = 16 - 32 = -16\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). y-Wert der Tiefpunkte?", loesung: -16, toleranz: 0, tipp: "Zuerst klären, welche der Extremstellen die Tiefpunkte sind.", loesungsweg: "Aus \\(f'(x) = 4x^3 - 16x = 4x(x^2-4) = 0\\) folgen die Stellen \\(x = 0\\) und \\(x = \\pm 2\\). Mit \\(f''(x) = 12x^2 - 16\\) ist \\(f''(\\pm 2) = 48 - 16 = 32 > 0\\) — bei \\(\\pm 2\\) liegen also die Tiefpunkte: $$f(2) = 2^4 - 8 \\cdot 2^2 = 16 - 32 = -16$$ Wegen der Achsensymmetrie gilt derselbe Wert bei \\(x = -2\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x\\). x-Koordinate des Hochpunkts?", loesung: 1, toleranz: 0, tipp: "Die Ableitung faktorisieren und die Art der beiden Stellen prüfen.", loesungsweg: "$$f'(x) = 3x^2 - 12x + 9 = 3(x^2-4x+3) = 3(x-1)(x-3) = 0$$ Die Kandidaten sind \\(x = 1\\) und \\(x = 3\\). Mit \\(f''(x) = 6x - 12\\) gilt \\(f''(1) = -6 < 0\\) (Hochpunkt) und \\(f''(3) = 6 > 0\\) (Tiefpunkt). Der Hochpunkt liegt also bei \\(x = 1\\); sein Wert ist \\(f(1) = 1 - 6 + 9 = 4\\)." },
      { id: 23, level: 4, typ: "mc", frage: "\\(f(x) = x^5 - 20x^3\\). Anzahl der Wendepunkte?", optionen: ["0", "1", "2", "3"], korrekt: 3, tipp: "\\(f'' = 20x^3 - 120x\\) ausklammern.", loesungsweg: "Zweimal ableiten: \\(f'(x) = 5x^4 - 60x^2\\), also $$f''(x) = 20x^3 - 120x = 20x(x^2-6)$$ Die Nullstellen sind \\(0\\) und \\(\\pm\\sqrt6\\). An allen dreien wechselt \\(f''\\) das Vorzeichen — bei einem Produkt aus drei einfachen Faktoren ist das stets so. Also <b>drei</b> Wendepunkte." },
      { id: 24, level: 4, typ: "numerisch", frage: "\\(f(x) = x^3 - 12x\\). y-Wert des Tiefpunkts?", loesung: -16, toleranz: 0, tipp: "\\(f' = 3x^2 - 12\\).", loesungsweg: "$$f'(x) = 3x^2 - 12 = 0 \\;\\Rightarrow\\; x = \\pm 2$$ Wegen \\(f''(x) = 6x\\) ist \\(f''(2) = 12 > 0\\), bei \\(x = 2\\) liegt also der Tiefpunkt: $$f(2) = 8 - 24 = -16$$ Bei \\(x = -2\\) liegt spiegelbildlich der Hochpunkt mit \\(f(-2) = 16\\)." },
      // LEVEL 5
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler untersucht die Symmetrie von \\(f(x) = x^4 - 2x^3\\):<br>Schritt 1: Der höchste Exponent ist gerade.<br>Schritt 2: Also ist der Graph achsensymmetrisch zur \\(y\\)-Achse.<br>Schritt 3: Damit genügt es, den Bereich \\(x \\ge 0\\) zu untersuchen.<br>Welcher Schritt ist der erste fehlerhafte?", optionen: ["Schritt 1", "Schritt 2", "Schritt 3", "Kein Schritt ist falsch"], korrekt: 1, tipp: "Die Symmetriebedingung mit \\(f(-x)\\) selbst nachrechnen.", loesungsweg: "Für Achsensymmetrie müssen <b>alle</b> Exponenten gerade sein, nicht nur der höchste. Die Probe zeigt es: $$f(-x) = (-x)^4 - 2(-x)^3 = x^4 + 2x^3 \\ne f(x)$$ Schon <b>Schritt 2</b> ist also falsch; Schritt 1 stellt lediglich richtig fest, dass \\(4\\) gerade ist. Der Graph von \\(f\\) ist weder achsen- noch punktsymmetrisch (dafür müssten alle Exponenten ungerade sein), und Schritt 3 beruht auf dem Fehler." },
      { id: 26, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x)=x^3+ax^2+bx\\) hat bei \\(x=2\\) einen Wendepunkt und an der Stelle \\(1\\) eine waagerechte Tangente. Bestimme \\(b\\).", loesung: 9, toleranz: 0, tipp: "Jede der beiden Eigenschaften in eine Gleichung übersetzen und die Reihenfolge klug wählen.", loesungsweg: "Die Wendestelle liefert mit \\(f''(x) = 6x + 2a\\): $$f''(2) = 12 + 2a = 0 \\;\\Rightarrow\\; a = -6$$ Damit ist \\(a\\) bekannt, und die waagerechte Tangente liefert mit \\(f'(x) = 3x^2 + 2ax + b\\): $$f'(1) = 3 + 2a + b = 3 - 12 + b = 0 \\;\\Rightarrow\\; b = 9$$ Probe mit \\(f(x) = x^3 - 6x^2 + 9x\\): \\(f''(x) = 6x-12\\) hat die Nullstelle \\(2\\) mit Vorzeichenwechsel ✓ und \\(f'(1) = 3-12+9 = 0\\) ✓" },
      { id: 27, level: 5, typ: "numerisch", frage: "Bestimme die Steigung der Wendetangente von \\(f(x)=x^3+3x^2-9x\\).", loesung: -12, toleranz: 0, tipp: "Erst die Wendestelle bestimmen, dann dort die erste Ableitung auswerten.", loesungsweg: "Wendestelle aus der zweiten Ableitung: $$f''(x) = 6x + 6 = 0 \\;\\Rightarrow\\; x = -1$$ Der Vorzeichenwechsel ist gesichert, da \\(f'''(x) = 6 \\ne 0\\). Die Steigung der Wendetangente ist der Wert der ersten Ableitung dort: $$f'(-1) = 3(-1)^2 + 6(-1) - 9 = 3 - 6 - 9 = -12$$ Bei einer Funktion dritten Grades mit positivem Leitkoeffizienten ist das zugleich die <b>kleinste</b> Steigung des gesamten Graphen." },
      { id: 28, level: 5, typ: "numerisch", frage: "Der Wasserstand eines Beckens wird für \\(0 \\le t \\le 7\\) (in Stunden) durch \\(h(t)=t^3-12t^2+36t\\) beschrieben (\\(h\\) in cm). Zu welcher Zeit \\(t\\) ist der Wasserstand am höchsten?", loesung: 2, toleranz: 0, tipp: "Innere Kandidaten und beide Intervallgrenzen gegeneinander stellen.", loesungsweg: "$$h'(t) = 3t^2 - 24t + 36 = 3(t-2)(t-6) = 0 \\;\\Rightarrow\\; t = 2 \\text{ oder } t = 6$$ Mit \\(h''(t) = 6t - 24\\) ist \\(h''(2) = -12 < 0\\) (Hochpunkt) und \\(h''(6) = 12 > 0\\) (Tiefpunkt). Weil der Zeitraum begrenzt ist, gehören die Ränder zum Vergleich: $$h(0) = 0, \\quad h(2) = 8 - 48 + 72 = 32, \\quad h(6) = 0, \\quad h(7) = 343 - 588 + 252 = 7$$ Der höchste Stand beträgt \\(32\\,\\text{cm}\\) nach \\(t = 2\\) Stunden. Ohne Randbetrachtung bliebe offen, ob der Stand am Ende des Zeitraums noch übertroffen wird." },
      { id: 29, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x)=x^4-4x^3+6x^2-4x\\). Bestimme die Anzahl der lokalen Extremstellen.", loesung: 1, toleranz: 0, tipp: "Die erste Ableitung vollständig faktorisieren — ihre Koeffizienten sind auffällig.", loesungsweg: "$$f'(x) = 4x^3 - 12x^2 + 12x - 4 = 4(x^3 - 3x^2 + 3x - 1) = 4(x-1)^3$$ Die Koeffizienten \\(1, -3, 3, -1\\) sind die dritte Zeile des Pascalschen Dreiecks mit wechselnden Vorzeichen. Die einzige Nullstelle ist \\(x = 1\\). Weil der Exponent \\(3\\) ungerade ist, wechselt \\(f'\\) dort das Vorzeichen (von negativ nach positiv) — es gibt also genau <b>eine</b> Extremstelle, einen Tiefpunkt. Das Kriterium über \\(f''\\) versagt hier, denn \\(f''(1) = 0\\); der Vorzeichenwechsel von \\(f'\\) entscheidet." },
      { id: 30, level: 5, typ: "mc", frage: "Der Graph von \\(f'\\) schneidet die \\(x\\)-Achse nur an den Stellen \\(-1\\) und \\(3\\) und verläuft dazwischen unterhalb der \\(x\\)-Achse. Was gilt für \\(f\\)?", optionen: ["Hochpunkt bei \\(-1\\), Tiefpunkt bei \\(3\\)", "Tiefpunkt bei \\(-1\\), Hochpunkt bei \\(3\\)", "Wendepunkte bei \\(-1\\) und bei \\(3\\)", "Extrempunkte, deren Art offen bleibt"], korrekt: 0, tipp: "Aus dem Vorzeichen von \\(f'\\) auf das Steigen und Fallen von \\(f\\) schließen.", loesungsweg: "Zwischen \\(-1\\) und \\(3\\) ist \\(f'\\) negativ, außerhalb positiv (weitere Nullstellen gibt es nicht). Also gilt: $$f \\text{ steigt für } x < -1, \\qquad f \\text{ fällt für } -1 < x < 3, \\qquad f \\text{ steigt für } x > 3$$ Aus steigend-fallend wird ein <b>Hochpunkt</b> bei \\(-1\\), aus fallend-steigend ein <b>Tiefpunkt</b> bei \\(3\\). Wendepunkte von \\(f\\) liegen dort, wo \\(f'\\) selbst Extremstellen hat — nicht an den Nullstellen von \\(f'\\)." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "Für welche Werte von \\(c\\) hat \\(f(x)=x^3-3x+c\\) genau drei verschiedene Nullstellen? Gib die größte ganze Zahl \\(c\\) an, für die das gilt.", loesung: 1, toleranz: 0, tipp: "Die Lage der beiden Extrempunkte zur \\(x\\)-Achse entscheidet über die Anzahl der Nullstellen.", loesungsweg: "$$f'(x) = 3x^2 - 3 = 0 \\;\\Rightarrow\\; x = \\pm 1$$ Hochpunkt bei \\(x = -1\\) mit \\(f(-1) = 2 + c\\), Tiefpunkt bei \\(x = 1\\) mit \\(f(1) = -2 + c\\). Drei verschiedene Nullstellen gibt es genau dann, wenn der Graph die Achse dreimal kreuzt, der Hochpunkt also oberhalb und der Tiefpunkt unterhalb liegt: $$2 + c > 0 \\;\\text{ und }\\; -2 + c < 0 \\;\\Rightarrow\\; -2 < c < 2$$ Die größte ganze Zahl darin ist \\(c = 1\\). Der <b>Grenzfall</b> \\(c = 2\\) fällt heraus: dort ist \\(f(1) = 0\\), der Tiefpunkt liegt auf der Achse, und es bleiben nur zwei verschiedene Nullstellen (eine davon doppelt)." },
      { id: 32, level: 6, typ: "mc", frage: "Welche Aussage trifft auf <b>jede</b> ganzrationale Funktion dritten Grades zu?", optionen: ["Sie hat genau zwei Extrempunkte", "Sie hat genau einen Wendepunkt", "Sie hat genau drei Nullstellen", "Sie hat mindestens zwei Wendepunkte"], korrekt: 1, tipp: "Für jede Aussage entweder allgemein ableiten oder ein Gegenbeispiel suchen.", loesungsweg: "Mit \\(f(x) = ax^3+bx^2+cx+d\\) und \\(a \\ne 0\\) ist $$f''(x) = 6ax + 2b$$ eine lineare Funktion mit genau einer Nullstelle \\(x = -\\tfrac{b}{3a}\\); dort wechselt \\(f''\\) das Vorzeichen, es liegt also genau <b>ein</b> Wendepunkt vor. Die übrigen Aussagen scheitern an Gegenbeispielen: \\(f(x) = x^3\\) hat gar keinen Extrempunkt, und \\(f(x) = x^3 + x\\) hat nur eine einzige Nullstelle." },
      { id: 33, level: 6, typ: "numerisch", frage: "Der Querschnitt eines Tals wird für \\(-3 \\le x \\le 3\\) (in km) durch \\(f(x)=\\frac{1}{4}x^4-2x^2+4\\) beschrieben (\\(f\\) in km über dem Meeresspiegel). Wie groß ist der Höhenunterschied in km zwischen dem tiefsten Punkt und dem höchsten Punkt am Rand?", loesung: 6.25, toleranz: 0.02, tipp: "Innere Extremstellen bestimmen und ihre Werte mit denen an den Intervallgrenzen vergleichen.", loesungsweg: "$$f'(x) = x^3 - 4x = x(x-2)(x+2) = 0 \\;\\Rightarrow\\; x = -2,\\; 0,\\; 2$$ Mit \\(f''(x) = 3x^2 - 4\\) ist \\(f''(\\pm 2) = 8 > 0\\) (zwei Tiefpunkte) und \\(f''(0) = -4 < 0\\) (Hochpunkt, ein Rücken in der Talmitte). Die Werte: $$f(\\pm 2) = 4 - 8 + 4 = 0, \\qquad f(0) = 4, \\qquad f(\\pm 3) = \\tfrac{81}{4} - 18 + 4 = 6{,}25$$ Der tiefste Punkt liegt bei \\(0\\), der höchste Randpunkt bei \\(6{,}25\\). Der Höhenunterschied beträgt $$6{,}25 - 0 = 6{,}25\\,\\text{km}$$ Der innere Hochpunkt mit \\(4\\) ist <b>nicht</b> der höchste Punkt — die Ränder dürfen nicht übergangen werden." },
      { id: 34, level: 6, typ: "mc", frage: "Behauptung: „Gilt \\(f''(x_0)=0\\), so hat der Graph von \\(f\\) bei \\(x_0\\) einen Wendepunkt.\" Trifft das zu?", optionen: ["Ja, das ist die Bedingung für einen Wendepunkt", "Nein, \\(f''\\) muss dort das Vorzeichen wechseln", "Nein, zusätzlich muss \\(f'(x_0)=0\\) gelten", "Ja, sofern \\(f\\) ganzrational ist"], korrekt: 1, tipp: "Ein Gegenbeispiel mit einer geraden Potenz suchen.", loesungsweg: "Die Bedingung \\(f''(x_0) = 0\\) ist nur <b>notwendig</b>. Gegenbeispiel: $$f(x) = (x-1)^4, \\qquad f''(x) = 12(x-1)^2$$ Hier ist \\(f''(1) = 0\\), aber \\(f''(x) \\ge 0\\) für alle \\(x\\) — kein Vorzeichenwechsel, also kein Wendepunkt; tatsächlich liegt dort ein Tiefpunkt. Hinreichend ist der <b>Vorzeichenwechsel</b> von \\(f''\\), in der Praxis geprüft über \\(f'''(x_0) \\ne 0\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Für welchen Wert \\(a>0\\) besitzt \\(f(x)=x^3+ax^2+3x\\) genau eine Stelle mit waagerechter Tangente?", loesung: 3, toleranz: 0, tipp: "Die Anzahl der Lösungen einer quadratischen Gleichung lässt sich über die Diskriminante steuern.", loesungsweg: "$$f'(x) = 3x^2 + 2ax + 3$$ Die Stellen mit waagerechter Tangente sind die Nullstellen dieser quadratischen Funktion. Genau eine Nullstelle bedeutet Diskriminante null: $$(2a)^2 - 4 \\cdot 3 \\cdot 3 = 4a^2 - 36 = 0 \\;\\Rightarrow\\; a^2 = 9 \\;\\Rightarrow\\; a = 3 \\quad (a>0)$$ Die Fallunterscheidung: für \\(0 < a < 3\\) gibt es keine solche Stelle, für \\(a > 3\\) zwei. Im Grenzfall \\(a = 3\\) ist \\(f'(x) = 3(x+1)^2 \\ge 0\\) — die Tangente ist bei \\(x = -1\\) waagerecht, ein <b>Extrempunkt</b> liegt dort aber nicht vor, sondern ein Sattelpunkt." },
      { id: 36, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x)=x^3-3x^2-9x+5\\). Wie groß ist der Unterschied der \\(y\\)-Werte von Hoch- und Tiefpunkt des Graphen?", loesung: 32, toleranz: 0, tipp: "Beide Extremstellen bestimmen, ihre Art klären und dann die Funktionswerte vergleichen.", loesungsweg: "$$f'(x) = 3x^2 - 6x - 9 = 3(x-3)(x+1) = 0 \\;\\Rightarrow\\; x = -1 \\text{ oder } x = 3$$ Mit \\(f''(x) = 6x - 6\\) ist \\(f''(-1) = -12 < 0\\) (Hochpunkt) und \\(f''(3) = 12 > 0\\) (Tiefpunkt). Die Werte: $$f(-1) = -1 - 3 + 9 + 5 = 10, \\qquad f(3) = 27 - 27 - 27 + 5 = -22$$ Der Unterschied beträgt $$10 - (-22) = 32$$ Weil Hoch- und Tiefpunkt auf verschiedenen Seiten der \\(x\\)-Achse liegen, hat der Graph außerdem genau drei verschiedene Nullstellen." }];
