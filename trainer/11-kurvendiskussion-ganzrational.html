<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurvendiskussion (ganzrational) - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-kurvendiskussion-ganzrational';
    const THEMA_CONFIG = { name: 'Kurvendiskussion ganzrationaler Funktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — Grundbegriffe
      { id: 1, level: 1, typ: "mc", frage: "Symmetrie von \\(f(x)=x^3\\)?", optionen: ["Achsensymm. zur y-Achse", "Punktsymm. zum Ursprung", "weder noch", "beides"], korrekt: 1, tipp: "\\(f(-x)\\) prüfen.", loesungsweg: "\\(f(-x)=-x^3=-f(x)\\) → punktsymmetrisch." },
      { id: 2, level: 1, typ: "numerisch", frage: "\\(f(x)=x^2-4\\). Anzahl Nullstellen?", loesung: 2, toleranz: 0, tipp: "\\(x^2=4\\).", loesungsweg: "$$x^2 - 4 = 0 \\;\\Rightarrow\\; x^2 = 4 \\;\\Rightarrow\\; x = \\pm 2$$ Also <b>zwei</b> Nullstellen. Die negative Lösung wird leicht vergessen — bei geradem Exponenten gehört sie stets dazu." },
      { id: 3, level: 1, typ: "mc", frage: "Symmetrie von \\(f(x)=x^4-2x^2\\)?", optionen: ["Punktsymmetrisch", "Achsensymm. zur y-Achse", "keine", "zur x-Achse"], korrekt: 1, tipp: "Nur gerade Exponenten.", loesungsweg: "Einsetzen von \\(-x\\): $$f(-x) = (-x)^4 - 2(-x)^2 = x^4 - 2x^2 = f(x)$$ Alle Exponenten sind gerade, das Vorzeichen verschwindet also beim Potenzieren. Das ist die Bedingung für Achsensymmetrie zur \\(y\\)-Achse." },
      { id: 4, level: 1, typ: "numerisch", frage: "\\(f(x)=2x^3-x^2+5\\). y-Achsenabschnitt?", loesung: 5, toleranz: 0, tipp: "\\(f(0)\\).", loesungsweg: "Der \\(y\\)-Achsenabschnitt ist der Funktionswert an der Stelle null: $$f(0) = 0 - 0 + 5 = 5$$ Bei einem Polynom ist das stets das konstante Glied — Rechnen ist nicht nötig." },
      { id: 5, level: 1, typ: "mc", frage: "Definitionsbereich von \\(f(x)=x^3-3x+1\\)?", optionen: ["\\(\\mathbb{R}\\)", "\\(\\mathbb{R}\\setminus\\{0\\}\\)", "\\([0,\\infty)\\)", "\\((-\\infty,0]\\)"], korrekt: 0, tipp: "Polynom.", loesungsweg: "Ein Polynom besteht nur aus Potenzen von \\(x\\), Multiplikationen und Additionen. Es gibt weder einen Nenner, der null werden könnte, noch eine Wurzel mit negativem Argument: $$D = \\mathbb{R}$$" },
      { id: 6, level: 1, typ: "mc", frage: "Verhalten von \\(f(x)=-2x^4+x^2\\) für \\(x\\to\\pm\\infty\\)?", optionen: ["\\(+\\infty\\)", "\\(-\\infty\\)", "\\(+\\infty\\) rechts, \\(-\\infty\\) links", "\\(0\\)"], korrekt: 1, tipp: "Leitterm: \\(-2x^4\\).", loesungsweg: "Gerader Grad, negativer Leitk.: \\(-\\infty\\)." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "\\(f(x)=x^2-5x+6\\). Größte Nullstelle?", loesung: 3, toleranz: 0, tipp: "Faktorisieren.", loesungsweg: "Faktorisieren über Vieta: Gesucht sind zwei Zahlen mit Summe \\(5\\) und Produkt \\(6\\) — das sind \\(2\\) und \\(3\\). $$x^2 - 5x + 6 = (x-2)(x-3) = 0$$ Die Nullstellen sind \\(2\\) und \\(3\\), die größte ist \\(3\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-4x\\). Anzahl Nullstellen?", loesung: 3, toleranz: 0, tipp: "\\(x(x^2-4)\\).", loesungsweg: "Ausklammern macht die Nullstellen sichtbar: $$x^3 - 4x = x(x^2-4) = x(x-2)(x+2) = 0$$ Also \\(x = 0\\), \\(x = 2\\), \\(x = -2\\) — <b>drei</b> Nullstellen." },
      { id: 9, level: 2, typ: "mc", frage: "Symmetrie von \\(f(x)=x^3-4x\\)?", optionen: ["Achsensymm.", "Punktsymm. zum Ursprung", "keine", "andere"], korrekt: 1, tipp: "\\(f(-x)\\).", loesungsweg: "$$f(-x) = (-x)^3 - 4(-x) = -x^3 + 4x = -f(x)$$ Nur ungerade Exponenten, also Punktsymmetrie zum Ursprung." },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+11x-6\\). \\(f(1)\\)?", loesung: 0, toleranz: 0, tipp: "Einsetzen.", loesungsweg: "\\(f(1)=1-6+11-6=0\\) → Nullstelle." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+11x-6\\). Größte Nullstelle (via Polynomdivision)?", loesung: 3, toleranz: 0, tipp: "Nach \\(:(x-1)\\): \\(x^2-5x+6\\).", loesungsweg: "Die erste Nullstelle findet man durch Raten: \\(f(1) = 1 - 6 + 11 - 6 = 0\\). Polynomdivision durch \\((x-1)\\) liefert \\(x^2 - 5x + 6\\), das sich weiter zerlegen lässt: $$f(x) = (x-1)(x-2)(x-3)$$ Die größte Nullstelle ist \\(3\\). Geraten wird sinnvollerweise unter den Teilern des konstanten Glieds \\(-6\\)." },
      { id: 12, level: 2, typ: "mc", frage: "\\(f(x)=x^3-3x\\) für \\(x\\to+\\infty\\)?", optionen: ["\\(+\\infty\\)", "\\(-\\infty\\)", "\\(0\\)", "oszilliert"], korrekt: 0, tipp: "Leitkoeff.", loesungsweg: "Ungerader Grad, positiver Leitk.: \\(+\\infty\\)." },
      // LEVEL 3 — Standardablauf
      { id: 13, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x\\). x-Koordinate des Hochpunkts?", loesung: -1, toleranz: 0, tipp: "\\(f'=0\\), \\(f''\\) prüfen.", loesungsweg: "\\(f'=3x^2-3=0 \\Rightarrow x=\\pm 1\\). \\(f''(-1)=-6<0\\) → HP." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x\\). y-Wert des Hochpunkts?", loesung: 2, toleranz: 0, tipp: "\\(f(-1)\\).", loesungsweg: "\\(f(-1)=-1+3=2\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x\\). x-Koordinate des Wendepunkts?", loesung: 0, toleranz: 0, tipp: "\\(f''=6x=0\\).", loesungsweg: "$$f''(x) = 6x = 0 \\;\\Rightarrow\\; x = 0$$ Bei jeder punktsymmetrischen Funktion dritten Grades liegt der Wendepunkt im Ursprung." },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-12x+2\\). y-Wert des Tiefpunkts?", loesung: -14, toleranz: 0, tipp: "TP bei \\(x=2\\).", loesungsweg: "\\(f(2)=8-24+2=-14\\)." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x^2\\). Wie viele verschiedene Nullstellen?", optionen: ["1", "2", "3", "keine"], korrekt: 1, tipp: "\\(x^2(x-3)\\).", loesungsweg: "\\(x=0\\) (doppelt) und \\(x=3\\). 2 verschiedene." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2\\). x-Koordinate des Wendepunkts?", loesung: 1, toleranz: 0, tipp: "\\(f''=6x-6\\).", loesungsweg: "Zweimal ableiten: \\(f'(x) = 3x^2 - 6x\\), also \\(f''(x) = 6x - 6\\). $$6x - 6 = 0 \\;\\Rightarrow\\; x = 1$$ Zur Bestätigung: \\(f'''(x) = 6 \\ne 0\\), der Vorzeichenwechsel von \\(f''\\) ist also gesichert." },
      // LEVEL 4 — Polynome 3./4. Grades
      { id: 19, level: 4, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). Anzahl Extremstellen?", loesung: 3, toleranz: 0, tipp: "\\(f'=4x(x^2-4)\\).", loesungsweg: "$$f'(x) = 4x^3 - 16x = 4x(x^2-4) = 0$$ Also \\(x = 0\\), \\(x = 2\\), \\(x = -2\\) — <b>drei</b> Extremstellen. An allen dreien wechselt \\(f'\\) das Vorzeichen, es sind also echte Extrema: zwei Tiefpunkte außen, ein Hochpunkt in der Mitte." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). y-Wert des Hochpunkts?", loesung: 0, toleranz: 0, tipp: "HP bei \\(x=0\\).", loesungsweg: "Der Hochpunkt liegt bei \\(x = 0\\): $$f(0) = 0 - 0 = 0$$ Die beiden Tiefpunkte bei \\(\\pm 2\\) haben dagegen \\(f(\\pm2) = 16 - 32 = -16\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). y-Wert der Tiefpunkte?", loesung: -16, toleranz: 0, tipp: "TP bei \\(x=\\pm 2\\).", loesungsweg: "\\(f(2)=16-32=-16\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x\\). x-Koordinate des Hochpunkts?", loesung: 1, toleranz: 0, tipp: "\\(f'=3(x-1)(x-3)\\).", loesungsweg: "HP bei \\(x=1\\) (\\(f''(1)=-6\\))." },
      { id: 23, level: 4, typ: "mc", frage: "\\(f(x)=x^4-8x^2\\). Anzahl Wendepunkte?", optionen: ["0","1","2","3"], korrekt: 2, tipp: "\\(f''=12x^2-16\\).", loesungsweg: "Zwei Lösungen \\(\\pm 2/\\sqrt 3\\) mit VZW → 2." },
      { id: 24, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x\\). y-Wert des Tiefpunkts?", loesung: 0, toleranz: 0, tipp: "TP bei \\(x=3\\).", loesungsweg: "Mit \\(f'(x) = 3x^2 - 12x + 9 = 3(x-1)(x-3)\\) liegen die Extremstellen bei \\(1\\) und \\(3\\); wegen \\(f''(3) = 6 > 0\\) ist \\(x = 3\\) der Tiefpunkt. $$f(3) = 27 - 54 + 27 = 0$$" },
      // LEVEL 5
      { id: 25, level: 5, typ: "mc", frage: "\\(f(x)=x^4-4x^3+4x^2=x^2(x-2)^2\\). Welche Aussage stimmt?", optionen: ["TP bei 0, TP bei 2", "HP bei 0, TP bei 2", "TP bei 0, doppelte Nullstelle bei 2 mit TP", "TP bei 0, HP bei 1, TP bei 2"], korrekt: 3, tipp: "\\(f'=4x(x-1)(x-2)\\).", loesungsweg: "\\(x=0,1,2\\). \\(f''(0)=8,f''(1)=-4,f''(2)=8\\) → TP-HP-TP." },
      { id: 26, level: 5, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{4}x^4-2x^2\\). Summe x-Koord. der Extremstellen?", loesung: 0, toleranz: 0, tipp: "Symmetrie.", loesungsweg: "$$f'(x) = x^3 - 4x = x(x^2-4) = 0 \\;\\Rightarrow\\; x = -2,\\,0,\\,2$$ $$-2 + 0 + 2 = 0$$ Das Ergebnis folgt auch ohne Rechnung aus der Achsensymmetrie: Zu jeder Extremstelle gehört eine gespiegelte, die sie in der Summe aufhebt." },
      { id: 27, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+2\\). y-Wert des Wendepunkts?", loesung: 0, toleranz: 0, tipp: "WP bei \\(x=1\\).", loesungsweg: "\\(f(1)=1-3+2=0\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-4x^2\\). Anzahl Nullstellen?", loesung: 3, toleranz: 0, tipp: "\\(x^2(x^2-4)\\).", loesungsweg: "$$x^4 - 4x^2 = x^2(x^2-4) = 0$$ Also \\(x = 0\\) (doppelt) und \\(x = \\pm 2\\). Gefragt ist die Anzahl <b>verschiedener</b> Nullstellen: <b>drei</b>. Bei \\(x=0\\) berührt der Graph die Achse nur." },
      { id: 29, level: 5, typ: "numerisch", frage: "\\(f(x)=-x^3+3x\\). y-Wert des Hochpunkts?", loesung: 2, toleranz: 0, tipp: "HP bei \\(x=1\\).", loesungsweg: "\\(f(1)=-1+3=2\\)." },
      { id: 30, level: 5, typ: "mc", frage: "\\(f(x)=x^4-2x^2+1\\). Art der Nullstellen?", optionen: ["2 einfache", "2 doppelte", "1 vierfache", "keine"], korrekt: 1, tipp: "\\(= (x^2-1)^2\\).", loesungsweg: "Der Term ist ein vollständiges Quadrat: $$x^4 - 2x^2 + 1 = (x^2-1)^2 = (x-1)^2(x+1)^2$$ Beide Nullstellen \\(1\\) und \\(-1\\) treten also <b>doppelt</b> auf — der Graph berührt die \\(x\\)-Achse dort, ohne sie zu schneiden." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{4}x^4-\\frac{1}{2}x^2\\). Anzahl Extremstellen?", loesung: 3, toleranz: 0, tipp: "\\(f'=x^3-x=x(x^2-1)\\).", loesungsweg: "$$f'(x) = x^3 - x = x(x^2-1) = x(x-1)(x+1) = 0$$ Also \\(x = -1,\\,0,\\,1\\) — drei Extremstellen." },
      { id: 32, level: 6, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2-9x\\). Anzahl lokaler Extremstellen?", loesung: 2, toleranz: 0, tipp: "\\(f'=3x^2-6x-9\\).", loesungsweg: "\\(x^2-2x-3=0 \\Rightarrow x=3,-1\\). 2 Stellen." },
      { id: 33, level: 6, typ: "mc", frage: "\\(f(x)=x^4+1\\). Wie viele Wendepunkte?", optionen: ["0", "1", "2", "3"], korrekt: 0, tipp: "\\(f''=12x^2\\geq 0\\).", loesungsweg: "$$f''(x) = 12x^2$$ Dieser Ausdruck ist für jedes \\(x\\) größer oder gleich null; bei \\(x = 0\\) wird er zwar null, wechselt dort aber <b>nicht</b> das Vorzeichen. Ein Wendepunkt verlangt genau diesen Wechsel — es gibt also <b>keinen</b>. Die Nullstelle von \\(f''\\) allein genügt nie als Nachweis." },
      { id: 34, level: 6, typ: "numerisch", frage: "\\(f(x)=-x^4+8x^2\\). y-Wert des Hochpunkts (positiver x-Bereich)?", loesung: 16, toleranz: 0, tipp: "\\(f'=-4x^3+16x\\).", loesungsweg: "\\(x=\\pm 2\\) HP, \\(f(2)=-16+32=16\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "\\(f(x)=x^3-3x+2\\). Anzahl verschiedener Nullstellen?", loesung: 2, toleranz: 0, tipp: "\\(f(1)=0\\), Polynomdiv.", loesungsweg: "\\((x-1)^2(x+2)=0\\). Nullstellen: \\(x=1\\) (doppelt), \\(x=-2\\). 2 verschiedene." },
      { id: 36, level: 6, typ: "numerisch", frage: "\\(f(x)=x^4-4x^3+6x^2-4x+1=(x-1)^4\\). Vielfachheit der Nullstelle?", loesung: 4, toleranz: 0, tipp: "Vielfachheit.", loesungsweg: "Der Term ist die vierte Potenz eines Binoms: $$x^4 - 4x^3 + 6x^2 - 4x + 1 = (x-1)^4$$ Die Koeffizienten \\(1, 4, 6, 4, 1\\) sind die vierte Zeile des Pascalschen Dreiecks. Die Nullstelle \\(x = 1\\) hat damit die Vielfachheit <b>4</b>; weil sie gerade ist, berührt der Graph die Achse nur." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
