<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzfunktionen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-potenzfunktionen';
    const THEMA_CONFIG = { name: 'Potenzfunktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht ==========
      { id: 1, level: 1, typ: "mc", frage: "Was ist eine Potenzfunktion?", optionen: ["\\(f(x) = a^x\\)", "\\(f(x) = x^n\\) mit festem Exponenten", "\\(f(x) = \\log x\\)", "\\(f(x) = \\sin x\\)"], korrekt: 1, tipp: "Basis ist die Variable, Exponent fest.", loesungsweg: "Eine <b>Potenzfunktion</b> hat die Form \\(f(x) = x^n\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "\\(f(x) = x^3\\). Berechne \\(f(2)\\).", loesung: 8, toleranz: 0, tipp: "\\(2 \\cdot 2 \\cdot 2\\).", loesungsweg: "$$f(2) = 2^3 = 8$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(f(x) = x^4\\). Berechne \\(f(-1)\\).", loesung: 1, toleranz: 0, tipp: "Gerader Exponent — Ergebnis positiv.", loesungsweg: "$$f(-1) = (-1)^4 = 1$$" },
      { id: 4, level: 1, typ: "mc", frage: "Welche Funktion ist achsensymmetrisch zur y-Achse?", optionen: ["\\(f(x) = x^3\\)", "\\(f(x) = x^5\\)", "\\(f(x) = x^4\\)", "\\(f(x) = x^7\\)"], korrekt: 2, tipp: "Gerader Exponent.", loesungsweg: "\\(x^n\\) mit geradem \\(n\\) ist achsensymmetrisch zur y-Achse." },
      { id: 5, level: 1, typ: "mc", frage: "Welche Funktion ist punktsymmetrisch zum Ursprung?", optionen: ["\\(f(x) = x^2\\)", "\\(f(x) = x^3\\)", "\\(f(x) = x^4\\)", "\\(f(x) = x^6\\)"], korrekt: 1, tipp: "Ungerader Exponent.", loesungsweg: "\\(x^n\\) mit ungeradem \\(n\\) ist punktsymmetrisch zum Ursprung." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(f(x) = x^5\\). Berechne \\(f(-1)\\).", loesung: -1, toleranz: 0, tipp: "Ungerader Exponent erhält das Vorzeichen.", loesungsweg: "$$f(-1) = (-1)^5 = -1$$" },
      // ========== LEVEL 2 -- leicht ==========
      { id: 7, level: 2, typ: "numerisch", frage: "\\(f(x) = x^{-1}\\). Berechne \\(f(4)\\) als Dezimalzahl.", loesung: 0.25, toleranz: 0.01, tipp: "\\(x^{-1} = \\frac{1}{x}\\).", loesungsweg: "$$f(4) = 4^{-1} = \\frac{1}{4} = 0{,}25$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(f(x) = x^{1/2}\\). Berechne \\(f(9)\\).", loesung: 3, toleranz: 0, tipp: "\\(x^{1/2} = \\sqrt{x}\\).", loesungsweg: "$$f(9) = \\sqrt{9} = 3$$" },
      { id: 9, level: 2, typ: "mc", frage: "Definitionsbereich von \\(f(x) = x^{-1}\\)?", optionen: ["\\(\\mathbb{R}\\)", "\\(\\mathbb{R} \\setminus \\{0\\}\\)", "\\(\\mathbb{R}_{\\geq 0}\\)", "\\(\\{0\\}\\)"], korrekt: 1, tipp: "Durch 0 darf man nicht teilen.", loesungsweg: "\\(\\frac{1}{x}\\) ist für \\(x = 0\\) nicht definiert: \\(D = \\mathbb{R} \\setminus \\{0\\}\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Definitionsbereich von \\(f(x) = x^{1/2} = \\sqrt{x}\\)?", optionen: ["\\(\\mathbb{R}\\)", "\\(\\mathbb{R} \\setminus \\{0\\}\\)", "\\(\\mathbb{R}_{\\geq 0}\\)", "\\(\\mathbb{R}_{> 0}\\)"], korrekt: 2, tipp: "Unter der Wurzel keine negativen Zahlen.", loesungsweg: "Unter einer Quadratwurzel darf nichts Negatives stehen, denn kein reelles Quadrat ist negativ: $$D = \\mathbb{R}_{\\ge 0} = [0;\\infty)$$ Die Null gehört dazu — \\(\\sqrt0 = 0\\) ist definiert. Erst bei \\(x^{-1/2} = \\tfrac{1}{\\sqrt x}\\) müsste sie ausgeschlossen werden." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x) = x^{-2}\\). Berechne \\(f(2)\\) als Dezimalzahl.", loesung: 0.25, toleranz: 0.01, tipp: "\\(x^{-2} = \\frac{1}{x^2}\\).", loesungsweg: "$$f(2) = \\frac{1}{2^2} = \\frac{1}{4} = 0{,}25$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(f(x) = x^{1/3}\\). Berechne \\(f(8)\\).", loesung: 2, toleranz: 0, tipp: "\\(x^{1/3} = \\sqrt[3]{x}\\).", loesungsweg: "$$f(8) = \\sqrt[3]{8} = 2$$" },
      // ========== LEVEL 3 -- nervenschonend ==========
      { id: 13, level: 3, typ: "mc", frage: "\\(f(x) = x^2\\) und \\(g(x) = x^4\\). Welche wächst schneller für \\(x > 1\\)?", optionen: ["\\(f\\) wächst schneller", "\\(g\\) wächst schneller", "Beide gleich", "Hängt vom Vorzeichen ab"], korrekt: 1, tipp: "Höherer Exponent → stärkeres Wachstum (für \\(x > 1\\)).", loesungsweg: "Für \\(x > 1\\) wächst \\(x^4\\) schneller als \\(x^2\\)." },
      { id: 14, level: 3, typ: "mc", frage: "\\(f(x) = x^2\\) und \\(g(x) = x^4\\). Welche ist bei \\(0 < x < 1\\) größer?", optionen: ["\\(f(x) > g(x)\\)", "\\(g(x) > f(x)\\)", "Gleich", "Beide null"], korrekt: 0, tipp: "\\(0{,}5^2 = 0{,}25\\); \\(0{,}5^4 = 0{,}0625\\).", loesungsweg: "Für \\(0 < x < 1\\): höhere Potenz → kleinerer Wert. \\(x^2 > x^4\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Schnittpunkt der Graphen \\(f(x) = x^2\\) und \\(g(x) = x^3\\) im ersten Quadranten: \\(x\\)-Wert?", loesung: 1, toleranz: 0, tipp: "\\(x^2 = x^3 \\implies x^2(1 - x) = 0\\).", loesungsweg: "\\(x^2 = x^3 \\implies x = 0\\) oder \\(x = 1\\). Im ersten Quadranten: \\(x = 1\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Wie verhält sich \\(f(x) = x^{-1}\\) für \\(x \\to \\infty\\)?", optionen: ["\\(\\to \\infty\\)", "\\(\\to -\\infty\\)", "\\(\\to 0\\)", "\\(\\to 1\\)"], korrekt: 2, tipp: "\\(\\frac{1}{\\text{groß}} \\to 0\\).", loesungsweg: "\\(\\frac{1}{x} \\to 0\\) für \\(x \\to \\infty\\)." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x) = x^{-1}\\): Was ist bei \\(x = 0\\)?", optionen: ["Nullstelle", "Senkrechte Asymptote", "Waagerechte Asymptote", "Normale Stelle"], korrekt: 1, tipp: "Nenner wird 0.", loesungsweg: "Bei \\(x = 0\\) hat \\(\\frac{1}{x}\\) eine senkrechte Asymptote." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(f(x) = 3 x^2\\). Berechne \\(f(5)\\).", loesung: 75, toleranz: 0, tipp: "\\(3 \\cdot 25\\).", loesungsweg: "$$f(5) = 3 \\cdot 5^2 = 3 \\cdot 25 = 75$$" },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "numerisch", frage: "\\(f(x) = x^{3/2}\\). Berechne \\(f(4)\\).", loesung: 8, toleranz: 0, tipp: "\\(x^{3/2} = (\\sqrt{x})^3\\). \\(\\sqrt{4} = 2\\).", loesungsweg: "$$f(4) = 4^{3/2} = (\\sqrt{4})^3 = 2^3 = 8$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(f(x) = x^{-1/2}\\). Berechne \\(f(4)\\) als Dezimalzahl.", loesung: 0.5, toleranz: 0.01, tipp: "Ein negativer Exponent bedeutet Kehrwert, ein gebrochener die Wurzel - wende beides nacheinander an.", loesungsweg: "$$f(4) = \\frac{1}{\\sqrt{4}} = \\frac{1}{2} = 0{,}5$$" },
      { id: 21, level: 4, typ: "mc", frage: "\\(f(x) = x^n\\) mit \\(n < 0\\). Welchen Punkt haben ALLE solche Funktionen gemeinsam (für \\(x > 0\\))?", optionen: ["\\((1, 1)\\)", "\\((0, 0)\\)", "\\((1, 0)\\)", "\\((-1, -1)\\)"], korrekt: 0, tipp: "\\(1^n = 1\\) für alle \\(n\\).", loesungsweg: "Für \\(x = 1\\): \\(1^n = 1\\). Alle Potenzfunktionen gehen durch \\((1, 1)\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(f(x) = 2 x^3\\). Berechne \\(f(-2)\\).", loesung: -16, toleranz: 0, tipp: "\\(2 \\cdot (-8)\\).", loesungsweg: "$$f(-2) = 2 \\cdot (-2)^3 = 2 \\cdot (-8) = -16$$" },
      { id: 23, level: 4, typ: "mc", frage: "Wie hängt \\(x^{-n}\\) mit \\(x^n\\) zusammen?", optionen: ["\\(x^{-n} = -x^n\\)", "\\(x^{-n} = \\frac{1}{x^n}\\)", "\\(x^{-n} = n - x\\)", "\\(x^{-n} = x^n\\)"], korrekt: 1, tipp: "Negativer Exponent = Kehrwert.", loesungsweg: "\\(x^{-n} = \\frac{1}{x^n}\\) für \\(x \\neq 0\\)." },
      { id: 24, level: 4, typ: "numerisch", frage: "\\(f(x) = x^2\\). Löse \\(f(x) = 25\\), \\(x > 0\\).", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{25}\\).", loesungsweg: "\\(x^2 = 25 \\implies x = \\pm 5\\). Für \\(x > 0\\): \\(x = 5\\)." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = a \\cdot x^n\\) verläuft durch \\(P(2 \\mid 24)\\) und \\(Q(3 \\mid 81)\\). Bestimme den Exponenten \\(n\\).", loesung: 3, toleranz: 0, tipp: "Bilde den Quotienten der beiden Bedingungen — der Vorfaktor kürzt sich dabei heraus.", loesungsweg: "Quotient der beiden Punktproben: $$\\frac{a \\cdot 3^n}{a \\cdot 2^n} = \\left(\\frac32\\right)^n = \\frac{81}{24} = \\frac{27}{8}$$ Wegen \\(\\left(\\frac32\\right)^3 = \\frac{27}{8}\\) ist \\(n = 3\\). Eingesetzt folgt \\(a \\cdot 8 = 24\\), also \\(a = 3\\) und \\(f(x) = 3x^3\\)." },
      { id: 26, level: 5, typ: "mc", frage: "Zur Gleichung \\(x^4 = 16\\) wird notiert: „Also ist \\(x = 2\\) die einzige Lösung.\u201c Wie ist das zu bewerten?", optionen: ["Richtig, die vierte Wurzel ist eindeutig", "Falsch, auch \\(x = -2\\) ist Lösung", "Falsch, es gibt gar keine Lösung", "Falsch, auch \\(x = 4\\) ist Lösung"], korrekt: 1, tipp: "Prüfe, ob eine negative Zahl mit geradem Exponenten ebenfalls einen positiven Wert liefert.", loesungsweg: "Bei geradem Exponenten fällt das Vorzeichen weg: $$(-2)^4 = 16 = 2^4$$ Die Lösungsmenge ist \\(\\{-2;\\,2\\}\\), die Aussage also <b>unvollständig</b>. Bei ungeradem Exponenten wie \\(x^3 = 8\\) gäbe es dagegen wirklich nur eine Lösung." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für \\(f(x) = 3x^{-2}\\) gilt \\(f(x) = 12\\) mit \\(x > 0\\). Bestimme \\(x\\) als Dezimalzahl.", loesung: 0.5, toleranz: 0.01, tipp: "Schreibe den negativen Exponenten zuerst als Bruch und stelle dann nach der Potenz um.", loesungsweg: "Negativer Exponent als Kehrwert: $$\\frac{3}{x^2} = 12 \\;\\Longrightarrow\\; x^2 = \\frac{3}{12} = 0{,}25$$ Mit \\(x > 0\\) folgt \\(x = 0{,}5\\). Probe: \\(3 \\cdot 0{,}5^{-2} = 3 \\cdot 4 = 12\\) ✓" },
      { id: 28, level: 5, typ: "numerisch", frage: "Für \\(f(x) = x^{2/3}\\) gilt \\(f(x) = 16\\) mit \\(x > 0\\). Bestimme \\(x\\).", loesung: 64, toleranz: 0, tipp: "Potenziere beide Seiten so, dass der Bruch im Exponenten zu \\(1\\) wird.", loesungsweg: "Beide Seiten mit \\(\\frac32\\) potenzieren: $$\\left(x^{2/3}\\right)^{3/2} = 16^{3/2} = \\left(\\sqrt{16}\\right)^3 = 4^3 = 64$$ Also \\(x = 64\\). Probe: \\(64^{2/3} = \\left(\\sqrt[3]{64}\\right)^2 = 4^2 = 16\\) ✓" },
      { id: 29, level: 5, typ: "mc", frage: "Welche Beschreibung passt zum Graphen von \\(f(x) = x^{-3}\\)?", optionen: ["Punktsymmetrisch, für \\(x > 0\\) fallend", "Achsensymmetrisch, für \\(x > 0\\) fallend", "Punktsymmetrisch, für \\(x > 0\\) steigend", "Achsensymmetrisch, für \\(x > 0\\) steigend"], korrekt: 0, tipp: "Prüfe getrennt die Parität des Exponenten und das Verhalten des Kehrwerts bei wachsendem \\(x\\).", loesungsweg: "Der Exponent \\(-3\\) ist ungerade, also gilt \\(f(-x) = -f(x)\\): der Graph ist <b>punktsymmetrisch</b> zum Ursprung. Für wachsendes \\(x > 0\\) wird der Nenner größer: $$f(1) = 1, \\quad f(2) = \\tfrac18$$ die Funktion <b>fällt</b> dort also. Achsensymmetrie träte nur bei geradem Exponenten auf." },
      { id: 30, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = a \\cdot x^3\\) verläuft durch \\(P(2 \\mid -12)\\). Berechne \\(f(-1)\\).", loesung: 1.5, toleranz: 0.01, tipp: "Bestimme zuerst den Vorfaktor aus der Punktprobe, dann den gesuchten Funktionswert.", loesungsweg: "Punktprobe: \\(a \\cdot 2^3 = 8a = -12\\), also \\(a = -1{,}5\\). Damit $$f(-1) = -1{,}5 \\cdot (-1)^3 = -1{,}5 \\cdot (-1) = 1{,}5$$ Das Vorzeichen dreht sich, weil der Exponent ungerade ist." },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Für alle \\(x > 0\\) gilt \\(x^3 > x^2\\).\u201c Prüfe die Behauptung.", optionen: ["Richtig, der größere Exponent gewinnt", "Falsch, für \\(0 < x < 1\\) ist es umgekehrt", "Falsch, es gilt nie \\(x^3 > x^2\\)", "Richtig, sofern \\(x\\) ganzzahlig ist"], korrekt: 1, tipp: "Teste einen Wert zwischen null und eins und einen Wert darüber.", loesungsweg: "Gegenbeispiel \\(x = 0{,}5\\): $$0{,}5^3 = 0{,}125 < 0{,}25 = 0{,}5^2$$ Für \\(x > 1\\) stimmt die Behauptung dagegen (etwa \\(2^3 = 8 > 4\\)), bei \\(x = 1\\) sind beide gleich. Grund: Das Multiplizieren mit einer Zahl unter \\(1\\) <b>verkleinert</b> den Wert. Die Behauptung gilt also nicht für alle \\(x > 0\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Betrachte \\(f(x) = x^n\\) für die Exponenten \\(n = -3\\), \\(n = -2\\), \\(n = -1\\), \\(n = 2\\) und \\(n = 3\\). Bei wie vielen davon ist der Graph punktsymmetrisch zum Ursprung?", loesung: 3, toleranz: 0, tipp: "Entscheidend ist allein, ob der Exponent gerade oder ungerade ist — das Vorzeichen des Exponenten spielt keine Rolle.", loesungsweg: "Punktsymmetrie liegt genau bei ungeradem Exponenten vor, denn dann ist \\((-x)^n = -x^n\\). Ungerade sind \\(-3\\), \\(-1\\) und \\(3\\) — das sind <b>3</b> Funktionen. Die geraden Exponenten \\(-2\\) und \\(2\\) liefern achsensymmetrische Graphen." },
      { id: 33, level: 6, typ: "numerisch", frage: "Für \\(f(x) = a \\cdot x^n\\) gilt \\(f(1) = 5\\) und \\(f(2) = 40\\). Bestimme den Exponenten \\(n\\).", loesung: 3, toleranz: 0, tipp: "Die Stelle \\(1\\) liefert den Vorfaktor unmittelbar; setze ihn dann in die zweite Bedingung ein.", loesungsweg: "Wegen \\(1^n = 1\\) folgt aus der ersten Bedingung \\(a = 5\\). Damit $$5 \\cdot 2^n = 40 \\;\\Longrightarrow\\; 2^n = 8 \\;\\Longrightarrow\\; n = 3$$ Die Funktion lautet \\(f(x) = 5x^3\\). Der Punkt \\((1 \\mid a)\\) ist bei Potenzfunktionen immer der bequemste Startpunkt." },
      { id: 34, level: 6, typ: "numerisch", frage: "Betrachte \\(f(x) = x^n\\) für die Exponenten \\(n = -2\\), \\(n = -1\\), \\(n = 3\\) und \\(n = 4\\). Bei wie vielen davon fällt der Graph für \\(x > 0\\) streng monoton?", loesung: 2, toleranz: 0, tipp: "Entscheidend ist das Vorzeichen des Exponenten — prüfe je Funktion zwei Stellen rechts der Null.", loesungsweg: "Fallunterscheidung nach dem Vorzeichen des Exponenten: Bei negativem Exponenten steht die Potenz im Nenner, ein größeres \\(x\\) ergibt einen kleineren Wert. Etwa $$f(1) = 1, \\qquad f(2) = \\tfrac14 \\quad \\text{für } n = -2$$ Die Graphen zu \\(n = -2\\) und \\(n = -1\\) fallen also, das sind <b>2</b> Funktionen. Bei positivem Exponenten (\\(n = 3\\), \\(n = 4\\)) wachsen die Werte rechts der Null." },
      { id: 35, level: 6, typ: "numerisch", frage: "Wie viele gemeinsame Punkte haben die Graphen von \\(f(x) = x^2\\) und \\(g(x) = x^4\\)?", loesung: 3, toleranz: 0, tipp: "Setze die Terme gleich und bringe alles auf eine Seite; achte darauf, nicht durch einen Term zu teilen, der null werden kann.", loesungsweg: "Gleichsetzen und faktorisieren: $$x^4 - x^2 = x^2(x^2-1) = x^2(x-1)(x+1) = 0$$ Lösungen sind \\(x = 0\\), \\(x = 1\\) und \\(x = -1\\), also <b>3</b> gemeinsame Punkte. Wer durch \\(x^2\\) teilt, verliert den Ursprung und käme fälschlich auf zwei." },
      { id: 36, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x) = x^n\\) mit ganzzahligem \\(n\\) verläuft durch den Punkt \\(P(2 \\mid 0{,}125)\\). Bestimme \\(n\\).", loesung: -3, toleranz: 0, tipp: "Schreibe die Dezimalzahl zuerst als Bruch und diesen als Zweierpotenz.", loesungsweg: "Als Bruch und Potenz: $$0{,}125 = \\frac18 = \\frac{1}{2^3} = 2^{-3}$$ Aus \\(2^n = 2^{-3}\\) folgt \\(n = -3\\). Der Funktionswert kleiner als \\(1\\) bei \\(x = 2\\) zeigt schon vorab, dass der Exponent negativ sein muss." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
