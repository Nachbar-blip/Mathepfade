<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzfunktionen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-potenzfunktionen';
    const THEMA_CONFIG = { name: 'Potenzfunktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht ==========
      { id: 1, level: 1, typ: "mc", frage: "Was ist eine Potenzfunktion?", optionen: ["\\(f(x) = a^x\\)", "\\(f(x) = x^n\\) mit festem Exponenten", "\\(f(x) = \\log x\\)", "\\(f(x) = \\sin x\\)"], korrekt: 1, tipp: "Basis ist die Variable, Exponent fest.", loesungsweg: "Eine <b>Potenzfunktion</b> hat die Form \\(f(x) = x^n\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "\\(f(x) = x^3\\). Berechne \\(f(2)\\).", loesung: 8, toleranz: 0, tipp: "\\(2 \\cdot 2 \\cdot 2\\).", loesungsweg: "$$f(2) = 2^3 = 8$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(f(x) = x^4\\). Berechne \\(f(-1)\\).", loesung: 1, toleranz: 0, tipp: "Gerader Exponent — Ergebnis positiv.", loesungsweg: "$$f(-1) = (-1)^4 = 1$$" },
      { id: 4, level: 1, typ: "mc", frage: "Welche Funktion ist achsensymmetrisch zur y-Achse?", optionen: ["\\(f(x) = x^3\\)", "\\(f(x) = x^5\\)", "\\(f(x) = x^4\\)", "\\(f(x) = x^7\\)"], korrekt: 2, tipp: "Gerader Exponent.", loesungsweg: "\\(x^n\\) mit geradem \\(n\\) ist achsensymmetrisch zur y-Achse." },
      { id: 5, level: 1, typ: "mc", frage: "Welche Funktion ist punktsymmetrisch zum Ursprung?", optionen: ["\\(f(x) = x^2\\)", "\\(f(x) = x^3\\)", "\\(f(x) = x^4\\)", "\\(f(x) = x^6\\)"], korrekt: 1, tipp: "Ungerader Exponent.", loesungsweg: "\\(x^n\\) mit ungeradem \\(n\\) ist punktsymmetrisch zum Ursprung." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(f(x) = x^5\\). Berechne \\(f(-1)\\).", loesung: -1, toleranz: 0, tipp: "Ungerader Exponent erhält das Vorzeichen.", loesungsweg: "$$f(-1) = (-1)^5 = -1$$" },
      // ========== LEVEL 2 -- leicht ==========
      { id: 7, level: 2, typ: "numerisch", frage: "\\(f(x) = x^{-1}\\). Berechne \\(f(4)\\) als Dezimalzahl.", loesung: 0.25, toleranz: 0.01, tipp: "\\(x^{-1} = \\frac{1}{x}\\).", loesungsweg: "$$f(4) = 4^{-1} = \\frac{1}{4} = 0{,}25$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(f(x) = x^{1/2}\\). Berechne \\(f(9)\\).", loesung: 3, toleranz: 0, tipp: "\\(x^{1/2} = \\sqrt{x}\\).", loesungsweg: "$$f(9) = \\sqrt{9} = 3$$" },
      { id: 9, level: 2, typ: "mc", frage: "Definitionsbereich von \\(f(x) = x^{-1}\\)?", optionen: ["\\(\\mathbb{R}\\)", "\\(\\mathbb{R} \\setminus \\{0\\}\\)", "\\(\\mathbb{R}_{\\geq 0}\\)", "\\(\\{0\\}\\)"], korrekt: 1, tipp: "Durch 0 darf man nicht teilen.", loesungsweg: "\\(\\frac{1}{x}\\) ist für \\(x = 0\\) nicht definiert: \\(D = \\mathbb{R} \\setminus \\{0\\}\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Definitionsbereich von \\(f(x) = x^{1/2} = \\sqrt{x}\\)?", optionen: ["\\(\\mathbb{R}\\)", "\\(\\mathbb{R} \\setminus \\{0\\}\\)", "\\(\\mathbb{R}_{\\geq 0}\\)", "\\(\\mathbb{R}_{> 0}\\)"], korrekt: 2, tipp: "Unter der Wurzel keine negativen Zahlen.", loesungsweg: "\\(\\sqrt{x}\\) ist für \\(x \\geq 0\\) definiert." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x) = x^{-2}\\). Berechne \\(f(2)\\) als Dezimalzahl.", loesung: 0.25, toleranz: 0.01, tipp: "\\(x^{-2} = \\frac{1}{x^2}\\).", loesungsweg: "$$f(2) = \\frac{1}{2^2} = \\frac{1}{4} = 0{,}25$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(f(x) = x^{1/3}\\). Berechne \\(f(8)\\).", loesung: 2, toleranz: 0, tipp: "\\(x^{1/3} = \\sqrt[3]{x}\\).", loesungsweg: "$$f(8) = \\sqrt[3]{8} = 2$$" },
      // ========== LEVEL 3 -- nervenschonend ==========
      { id: 13, level: 3, typ: "mc", frage: "\\(f(x) = x^2\\) und \\(g(x) = x^4\\). Welche wächst schneller für \\(x > 1\\)?", optionen: ["\\(f\\) wächst schneller", "\\(g\\) wächst schneller", "Beide gleich", "Hängt vom Vorzeichen ab"], korrekt: 1, tipp: "Höherer Exponent → stärkeres Wachstum (für \\(x > 1\\)).", loesungsweg: "Für \\(x > 1\\) wächst \\(x^4\\) schneller als \\(x^2\\)." },
      { id: 14, level: 3, typ: "mc", frage: "\\(f(x) = x^2\\) und \\(g(x) = x^4\\). Welche ist bei \\(0 < x < 1\\) größer?", optionen: ["\\(f(x) > g(x)\\)", "\\(g(x) > f(x)\\)", "Gleich", "Beide null"], korrekt: 0, tipp: "\\(0{,}5^2 = 0{,}25\\); \\(0{,}5^4 = 0{,}0625\\).", loesungsweg: "Für \\(0 < x < 1\\): höhere Potenz → kleinerer Wert. \\(x^2 > x^4\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Schnittpunkt der Graphen \\(f(x) = x^2\\) und \\(g(x) = x^3\\) im ersten Quadranten: \\(x\\)-Wert?", loesung: 1, toleranz: 0, tipp: "\\(x^2 = x^3 \\implies x^2(1 - x) = 0\\).", loesungsweg: "\\(x^2 = x^3 \\implies x = 0\\) oder \\(x = 1\\). Im ersten Quadranten: \\(x = 1\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Wie verhält sich \\(f(x) = x^{-1}\\) für \\(x \\to \\infty\\)?", optionen: ["\\(\\to \\infty\\)", "\\(\\to -\\infty\\)", "\\(\\to 0\\)", "\\(\\to 1\\)"], korrekt: 2, tipp: "\\(\\frac{1}{\\text{groß}} \\to 0\\).", loesungsweg: "\\(\\frac{1}{x} \\to 0\\) für \\(x \\to \\infty\\)." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x) = x^{-1}\\): Was ist bei \\(x = 0\\)?", optionen: ["Nullstelle", "Senkrechte Asymptote", "Waagerechte Asymptote", "Normale Stelle"], korrekt: 1, tipp: "Nenner wird 0.", loesungsweg: "Bei \\(x = 0\\) hat \\(\\frac{1}{x}\\) eine senkrechte Asymptote." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(f(x) = 3 x^2\\). Berechne \\(f(5)\\).", loesung: 75, toleranz: 0, tipp: "\\(3 \\cdot 25\\).", loesungsweg: "$$f(5) = 3 \\cdot 5^2 = 3 \\cdot 25 = 75$$" },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "numerisch", frage: "\\(f(x) = x^{3/2}\\). Berechne \\(f(4)\\).", loesung: 8, toleranz: 0, tipp: "\\(x^{3/2} = (\\sqrt{x})^3\\). \\(\\sqrt{4} = 2\\).", loesungsweg: "$$f(4) = 4^{3/2} = (\\sqrt{4})^3 = 2^3 = 8$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(f(x) = x^{-1/2}\\). Berechne \\(f(4)\\) als Dezimalzahl.", loesung: 0.5, toleranz: 0.01, tipp: "\\(x^{-1/2} = \\frac{1}{\\sqrt{x}}\\).", loesungsweg: "$$f(4) = \\frac{1}{\\sqrt{4}} = \\frac{1}{2} = 0{,}5$$" },
      { id: 21, level: 4, typ: "mc", frage: "\\(f(x) = x^n\\) mit \\(n < 0\\). Welchen Punkt haben ALLE solche Funktionen gemeinsam (für \\(x > 0\\))?", optionen: ["\\((1, 1)\\)", "\\((0, 0)\\)", "\\((1, 0)\\)", "\\((-1, -1)\\)"], korrekt: 0, tipp: "\\(1^n = 1\\) für alle \\(n\\).", loesungsweg: "Für \\(x = 1\\): \\(1^n = 1\\). Alle Potenzfunktionen gehen durch \\((1, 1)\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(f(x) = 2 x^3\\). Berechne \\(f(-2)\\).", loesung: -16, toleranz: 0, tipp: "\\(2 \\cdot (-8)\\).", loesungsweg: "$$f(-2) = 2 \\cdot (-2)^3 = 2 \\cdot (-8) = -16$$" },
      { id: 23, level: 4, typ: "mc", frage: "Wie hängt \\(x^{-n}\\) mit \\(x^n\\) zusammen?", optionen: ["\\(x^{-n} = -x^n\\)", "\\(x^{-n} = \\frac{1}{x^n}\\)", "\\(x^{-n} = n - x\\)", "\\(x^{-n} = x^n\\)"], korrekt: 1, tipp: "Negativer Exponent = Kehrwert.", loesungsweg: "\\(x^{-n} = \\frac{1}{x^n}\\) für \\(x \\neq 0\\)." },
      { id: 24, level: 4, typ: "numerisch", frage: "\\(f(x) = x^2\\). Löse \\(f(x) = 25\\), \\(x > 0\\).", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{25}\\).", loesungsweg: "\\(x^2 = 25 \\implies x = \\pm 5\\). Für \\(x > 0\\): \\(x = 5\\)." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "mc", frage: "Welche Potenzfunktion geht durch \\((2, 8)\\) und \\((3, 27)\\)?", optionen: ["\\(f(x) = x^2\\)", "\\(f(x) = x^3\\)", "\\(f(x) = 2x\\)", "\\(f(x) = x^{1/2}\\)"], korrekt: 1, tipp: "\\(2^3 = 8\\), \\(3^3 = 27\\).", loesungsweg: "\\(f(x) = x^3\\) passt: \\(2^3 = 8\\) und \\(3^3 = 27\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "\\(f(x) = x^4\\). Löse \\(f(x) = 16\\) für \\(x > 0\\).", loesung: 2, toleranz: 0, tipp: "4. Wurzel.", loesungsweg: "\\(x^4 = 16 \\implies x = \\pm 2\\). Für \\(x > 0\\): \\(x = 2\\)." },
      { id: 27, level: 5, typ: "mc", frage: "Asymptoten von \\(f(x) = x^{-2}\\)?", optionen: ["Senkrecht: \\(y = 0\\); waagerecht: \\(x = 0\\)", "Senkrecht: \\(x = 0\\); waagerecht: \\(y = 0\\)", "Keine", "Beide durch den Ursprung"], korrekt: 1, tipp: "Für \\(x \\to 0\\) unendlich; für \\(x \\to \\infty\\) nach 0.", loesungsweg: "Senkrechte Asymptote bei \\(x = 0\\), waagerechte Asymptote \\(y = 0\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(f(x) = x^{-2}\\). Berechne \\(f(0{,}5)\\).", loesung: 4, toleranz: 0.01, tipp: "\\(\\frac{1}{0{,}25}\\).", loesungsweg: "$$f(0{,}5) = \\frac{1}{0{,}5^2} = \\frac{1}{0{,}25} = 4$$" },
      { id: 29, level: 5, typ: "mc", frage: "Welche Potenzfunktion \\(f(x) = x^n\\) ist für \\(n\\) ungerade und negativ? Eigenschaften?", optionen: ["Achsensymmetrisch, zwei Asymptoten", "Punktsymmetrisch, zwei Asymptoten", "Keine Symmetrie", "Konstant"], korrekt: 1, tipp: "Ungerader Exponent = punktsymmetrisch. Negativ = Asymptoten.", loesungsweg: "\\(n\\) ungerade negativ, z. B. \\(x^{-1}\\): punktsymmetrisch zum Ursprung, Asymptoten \\(x = 0\\) und \\(y = 0\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "\\(f(x) = 2x^3\\). Löse \\(f(x) = 54\\).", loesung: 3, toleranz: 0, tipp: "\\(2x^3 = 54 \\implies x^3 = 27\\).", loesungsweg: "\\(2x^3 = 54 \\implies x^3 = 27 \\implies x = 3\\)." },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "numerisch", frage: "\\(f(x) = x^{2/3}\\). Berechne \\(f(27)\\).", loesung: 9, toleranz: 0, tipp: "\\(x^{2/3} = (\\sqrt[3]{x})^2\\). \\(\\sqrt[3]{27} = 3\\).", loesungsweg: "$$f(27) = 27^{2/3} = (\\sqrt[3]{27})^2 = 3^2 = 9$$" },
      { id: 32, level: 6, typ: "mc", frage: "Vergleich \\(x^2\\) und \\(2^x\\) für große \\(x\\): Welche wächst stärker?", optionen: ["\\(x^2\\) wächst stärker", "\\(2^x\\) (exponentiell) wächst stärker", "Beide gleich", "Keine wächst"], korrekt: 1, tipp: "Exponentielles Wachstum schlägt polynomiales.", loesungsweg: "Für große \\(x\\) wächst \\(2^x\\) (Exponentialfunktion) stärker als jede Potenzfunktion \\(x^n\\)." },
      { id: 33, level: 6, typ: "numerisch", frage: "Schnittpunkt von \\(f(x) = x^3\\) und \\(g(x) = x\\) im ersten Quadranten: \\(x\\)-Wert?", loesung: 1, toleranz: 0, tipp: "\\(x^3 = x \\implies x(x^2 - 1) = 0\\).", loesungsweg: "\\(x^3 = x \\implies x = 0, 1, -1\\). Im ersten Quadranten: \\(x = 1\\)." },
      { id: 34, level: 6, typ: "mc", frage: "Wenn man \\(f(x) = x^2\\) mit dem Faktor 3 streckt, erhält man …", optionen: ["\\(g(x) = x^6\\)", "\\(g(x) = 3x^2\\)", "\\(g(x) = x^{2+3}\\)", "\\(g(x) = (x+3)^2\\)"], korrekt: 1, tipp: "Faktor vor der Funktion.", loesungsweg: "Streckung um Faktor 3 in y-Richtung: \\(g(x) = 3 \\cdot x^2 = 3x^2\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "\\(f(x) = x^{1/2}\\). Berechne \\(f(100)\\).", loesung: 10, toleranz: 0, tipp: "\\(\\sqrt{100}\\).", loesungsweg: "$$f(100) = \\sqrt{100} = 10$$" },
      { id: 36, level: 6, typ: "numerisch", frage: "Wie viele Potenzfunktionen \\(f(x) = x^n\\) (\\(n \\in \\mathbb{Z}\\)) gehen durch \\((1, 1)\\)?", loesung: 0, toleranz: 0, tipp: "\\(1^n = 1\\) für alle \\(n\\) — also unendlich viele. Antwort 0 = keine Eindeutigkeit.", loesungsweg: "\\(1^n = 1\\) für JEDES \\(n\\) — es sind unendlich viele. Aus dem Punkt \\((1,1)\\) allein kann man \\(n\\) nicht bestimmen. Antwort hier: 0 (keine Eindeutigkeit)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
