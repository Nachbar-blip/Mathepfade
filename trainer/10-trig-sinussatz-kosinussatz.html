<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-trig-sinussatz-kosinussatz';
    const THEMA_CONFIG = { name: 'Sinussatz & Kosinussatz', bereich: 'geometrie' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Sätze erkennen ==========
      { id: 1, level: 1, typ: "mc", frage: "Wie lautet der Sinussatz?", optionen: ["\\(a^2 = b^2 + c^2\\)", "\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{b}{\\sin\\beta} = \\tfrac{c}{\\sin\\gamma}\\)", "\\(a^2 = b^2 + c^2 - 2bc\\cos\\alpha\\)", "\\(a \\sin\\alpha = b \\sin\\beta\\)"], korrekt: 1, tipp: "Der Sinussatz verknüpft Seiten und ihre gegenüberliegenden Winkel.", loesungsweg: "\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{b}{\\sin\\beta} = \\tfrac{c}{\\sin\\gamma}\\): Jede Seite steht im gleichen Verhältnis zum Sinus des gegenüberliegenden Winkels." },
      { id: 2, level: 1, typ: "mc", frage: "Wie lautet der Kosinussatz (für Seite \\(a\\))?", optionen: ["\\(a^2 = b^2 + c^2\\)", "\\(a^2 = b^2 + c^2 - 2bc\\cos\\alpha\\)", "\\(a^2 = b^2 + c^2 + 2bc\\cos\\alpha\\)", "\\(a = b + c - \\cos\\alpha\\)"], korrekt: 1, tipp: "Verallgemeinerung des Satzes von Pythagoras.", loesungsweg: "\\(a^2 = b^2 + c^2 - 2bc\\cos\\alpha\\). Für \\(\\alpha = 90°\\) fällt der Korrekturterm weg." },
      { id: 3, level: 1, typ: "mc", frage: "Wann wird der Sinussatz angewandt?", optionen: ["SSS (drei Seiten)", "SWS (zwei Seiten + eingeschl. Winkel)", "WSW oder SSW (Winkel und gegenüberliegende Seite bekannt)", "Nur bei rechtwinkligen Dreiecken"], korrekt: 2, tipp: "Der Sinussatz braucht ein Paar aus Seite und ihrem Gegenwinkel.", loesungsweg: "Sinussatz: WSW oder SSW — man benötigt eine Seite und den gegenüberliegenden Winkel." },
      { id: 4, level: 1, typ: "mc", frage: "Wann wird der Kosinussatz angewandt?", optionen: ["SSS und SWS", "WSW", "Nur bei gleichseitigen Dreiecken", "Nur bei Winkel \\(90°\\)"], korrekt: 0, tipp: "Der Kosinussatz hilft, wenn der Sinussatz nicht direkt greift.", loesungsweg: "SSS (3 Seiten → Winkel) und SWS (2 Seiten + eingeschlossener Winkel → 3. Seite)." },
      { id: 5, level: 1, typ: "mc", frage: "Im Dreieck gilt \\(\\alpha + \\beta + \\gamma\\) = ?", optionen: ["\\(90°\\)", "\\(180°\\)", "\\(270°\\)", "\\(360°\\)"], korrekt: 1, tipp: "Winkelsumme im Dreieck.", loesungsweg: "In jedem ebenen Dreieck beträgt die Winkelsumme $$\\alpha + \\beta + \\gamma = 180°$$ Daraus folgt der dritte Winkel, sobald zwei bekannt sind — ein Schritt, der beim Sinus- und Kosinussatz immer wieder gebraucht wird, etwa im Fall SSW." },
      { id: 6, level: 1, typ: "mc", frage: "Welche Seite liegt dem Winkel \\(\\alpha\\) gegenüber?", optionen: ["\\(a\\)", "\\(b\\)", "\\(c\\)", "kommt drauf an"], korrekt: 0, tipp: "Bezeichnungskonvention: Seite = kleiner Buchstabe des gegenüberliegenden Winkels.", loesungsweg: "Konvention: Seite \\(a\\) liegt \\(\\alpha\\) gegenüber, \\(b\\) gegenüber \\(\\beta\\), \\(c\\) gegenüber \\(\\gamma\\)." },
      // ========== LEVEL 2 — Sinussatz einfach ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Im Dreieck ist \\(a = 10\\), \\(\\alpha = 30°\\), \\(\\beta = 45°\\). Berechne \\(b\\) (auf 2 Dezimalen).", loesung: 14.14, toleranz: 0.05, tipp: "\\(\\tfrac{b}{\\sin\\beta} = \\tfrac{a}{\\sin\\alpha}\\).", loesungsweg: "\\(b = \\tfrac{a \\sin\\beta}{\\sin\\alpha} = \\tfrac{10 \\cdot \\sin 45°}{\\sin 30°} = \\tfrac{10 \\cdot 0{,}7071}{0{,}5} \\approx 14{,}14\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Im Dreieck ist \\(a = 8\\), \\(\\alpha = 40°\\), \\(b = 6\\). Berechne \\(\\beta\\) in Grad (auf 1 Dezimale).", loesung: 28.8, toleranz: 0.5, tipp: "\\(\\sin\\beta = \\tfrac{b \\sin\\alpha}{a}\\).", loesungsweg: "\\(\\sin\\beta = \\tfrac{6 \\cdot \\sin 40°}{8} = \\tfrac{6 \\cdot 0{,}6428}{8} \\approx 0{,}4821 \\Rightarrow \\beta \\approx 28{,}8°\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Dreieck: \\(\\alpha = 50°\\), \\(\\beta = 60°\\), \\(c = 10\\). Berechne \\(\\gamma\\) in Grad.", loesung: 70, toleranz: 0, tipp: "Winkelsumme \\(180°\\).", loesungsweg: "\\(\\gamma = 180° - 50° - 60° = 70°\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Dreieck: \\(\\alpha = 50°\\), \\(\\gamma = 70°\\), \\(c = 10\\). Berechne \\(a\\) (2 Dezimalen).", loesung: 8.15, toleranz: 0.05, tipp: "\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{c}{\\sin\\gamma}\\).", loesungsweg: "\\(a = \\tfrac{10 \\cdot \\sin 50°}{\\sin 70°} = \\tfrac{10 \\cdot 0{,}766}{0{,}9397} \\approx 8{,}15\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Im Dreieck: \\(a = 12\\), \\(\\alpha = 90°\\), \\(\\beta = 30°\\). Berechne \\(b\\).", loesung: 6, toleranz: 0.1, tipp: "\\(\\sin 90° = 1\\); \\(\\sin 30° = 0{,}5\\).", loesungsweg: "\\(b = \\tfrac{12 \\cdot \\sin 30°}{\\sin 90°} = \\tfrac{12 \\cdot 0{,}5}{1} = 6\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Welche Formel ist KEIN Fall des Sinussatzes?", optionen: ["\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{b}{\\sin\\beta}\\)", "\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{c}{\\sin\\gamma}\\)", "\\(a \\sin\\alpha = b \\sin\\beta\\)", "\\(\\tfrac{b}{\\sin\\beta} = \\tfrac{c}{\\sin\\gamma}\\)"], korrekt: 2, tipp: "Vorsicht mit Zähler und Nenner.", loesungsweg: "\\(a \\sin\\alpha = b \\sin\\beta\\) ist falsch. Richtig: \\(a \\sin\\beta = b \\sin\\alpha\\) (Umformung)." },
      // ========== LEVEL 3 — Kosinussatz und Sinussatz im Standardfall ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Im Dreieck \\(ABC\\) sind \\(b = 9\\), \\(c = 11\\) und der Winkel bei \\(A\\) mit \\(52°\\) gegeben. Berechne die Seite \\(a\\) auf zwei Dezimalen.", loesung: 8.95, toleranz: 0.03, tipp: "Der Winkel liegt zwischen den beiden bekannten Seiten; berechne zuerst das Quadrat der gesuchten Seite und ziehe erst danach die Wurzel.", loesungsweg: "Kosinussatz: $$a^2 = b^2 + c^2 - 2bc\\cos\\alpha = 81 + 121 - 2 \\cdot 9 \\cdot 11 \\cdot \\cos 52°$$ Mit \\(\\cos 52° \\approx 0{,}6157\\): $$a^2 \\approx 202 - 198 \\cdot 0{,}6157 = 202 - 121{,}90 = 80{,}10$$ Wurzel ziehen: \\(a \\approx 8{,}95\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Im Dreieck \\(ABC\\) sind \\(a = 6\\), \\(b = 9\\) und \\(c = 11\\). Berechne den Winkel bei \\(C\\) in Grad auf eine Dezimale.", loesung: 92.1, toleranz: 0.15, tipp: "Stelle den Kosinussatz nach dem Kosinus des gesuchten Winkels um; der Zähler kann dabei auch negativ werden.", loesungsweg: "Aus \\(c^2 = a^2 + b^2 - 2ab\\cos\\gamma\\) folgt $$\\cos\\gamma = \\frac{a^2 + b^2 - c^2}{2ab} = \\frac{36 + 81 - 121}{2 \\cdot 6 \\cdot 9} = \\frac{-4}{108} \\approx -0{,}0370$$ Der negative Wert zeigt einen stumpfen Winkel an: $$\\gamma \\approx 92{,}1°$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Im Dreieck \\(ABC\\) sind \\(a = 7\\), \\(b = 10\\) und der Winkel bei \\(C\\) mit \\(120°\\) gegeben. Berechne die Seite \\(c\\) auf zwei Dezimalen.", loesung: 14.8, toleranz: 0.05, tipp: "Achte auf das Vorzeichen des Kosinus bei einem stumpfen Winkel — der Korrekturterm wird dadurch addiert.", loesungsweg: "Mit \\(\\cos 120° = -0{,}5\\): $$c^2 = 49 + 100 - 2 \\cdot 7 \\cdot 10 \\cdot (-0{,}5) = 149 + 70 = 219$$ Also \\(c = \\sqrt{219} \\approx 14{,}80\\). Der stumpfe Winkel macht die gegenüberliegende Seite länger als bei \\(90°\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Im Dreieck \\(ABC\\) sind der Winkel bei \\(A\\) mit \\(42°\\), der Winkel bei \\(B\\) mit \\(73°\\) und die Seite \\(a = 12\\) gegeben. Berechne die Seite \\(c\\) auf zwei Dezimalen.", loesung: 16.25, toleranz: 0.05, tipp: "Zur gesuchten Seite gehört ein Gegenwinkel, der noch nicht bekannt ist — bestimme ihn zuerst über die Winkelsumme.", loesungsweg: "Dritter Winkel: \\(\\gamma = 180° - 42° - 73° = 65°\\). Sinussatz: $$c = \\frac{a \\cdot \\sin\\gamma}{\\sin\\alpha} = \\frac{12 \\cdot \\sin 65°}{\\sin 42°} \\approx \\frac{12 \\cdot 0{,}9063}{0{,}6691} \\approx 16{,}25$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Im Dreieck \\(ABC\\) sind \\(a = 8\\), \\(b = 6\\) und \\(c = 13\\). Berechne den Winkel bei \\(C\\) in Grad auf eine Dezimale.", loesung: 135.95, toleranz: 0.15, tipp: "Der gesuchte Winkel liegt der längsten Seite gegenüber; stelle den Kosinussatz nach seinem Kosinuswert um.", loesungsweg: "$$\\cos\\gamma = \\frac{a^2 + b^2 - c^2}{2ab} = \\frac{64 + 36 - 169}{2 \\cdot 8 \\cdot 6} = \\frac{-69}{96} \\approx -0{,}7188$$ Daraus $$\\gamma \\approx 136{,}0°$$ Der längsten Seite liegt der größte Winkel gegenüber — hier ein stumpfer." },
      { id: 18, level: 3, typ: "numerisch", frage: "Im Dreieck \\(ABC\\) sind \\(a = 15\\), der Winkel bei \\(A\\) mit \\(95°\\) und der Winkel bei \\(B\\) mit \\(38°\\) gegeben. Berechne die Seite \\(b\\) auf zwei Dezimalen.", loesung: 9.27, toleranz: 0.03, tipp: "Seite und Gegenwinkel bilden ein bekanntes Paar; setze es mit dem gesuchten Paar ins Verhältnis.", loesungsweg: "Sinussatz mit dem vollständigen Paar \\(a\\) und \\(\\alpha\\): $$b = \\frac{a \\cdot \\sin\\beta}{\\sin\\alpha} = \\frac{15 \\cdot \\sin 38°}{\\sin 95°} \\approx \\frac{15 \\cdot 0{,}6157}{0{,}9962} \\approx 9{,}27$$ Der stumpfe Winkel bei \\(A\\) macht \\(a\\) zur längsten Seite." },
      // ========== LEVEL 4 — Verfahren wählen, Modell aus Text, Umkehraufgaben ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Von einem Dreieck sind \\(a = 11\\), \\(b = 14\\) und der Winkel bei \\(C\\) mit \\(47°\\) bekannt. Berechne den Umfang auf eine Dezimale.", loesung: 35.3, toleranz: 0.15, tipp: "Zunächst fehlt eine Seite; überlege, welcher der beiden Sätze mit den gegebenen Stücken überhaupt arbeiten kann.", loesungsweg: "Gegeben sind zwei Seiten und der eingeschlossene Winkel, also arbeitet der Kosinussatz: $$c^2 = 121 + 196 - 2 \\cdot 11 \\cdot 14 \\cdot \\cos 47° \\approx 317 - 210{,}05 = 106{,}95$$ Damit \\(c \\approx 10{,}34\\) und $$u = 11 + 14 + 10{,}34 \\approx 35{,}3$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "In einem Dreieck sind der Winkel bei \\(B\\) mit \\(63°\\), der Winkel bei \\(C\\) mit \\(49°\\) und die Seite \\(a = 18\\) gegeben. Berechne die Seite \\(b\\) auf zwei Dezimalen.", loesung: 17.3, toleranz: 0.05, tipp: "Zur gegebenen Seite fehlt noch der zugehörige Gegenwinkel — der ergibt sich aus den beiden anderen.", loesungsweg: "Winkelsumme: \\(\\alpha = 180° - 63° - 49° = 68°\\). Jetzt liegt mit \\(a\\) und \\(\\alpha\\) ein vollständiges Paar vor: $$b = \\frac{18 \\cdot \\sin 63°}{\\sin 68°} \\approx \\frac{18 \\cdot 0{,}8910}{0{,}9272} \\approx 17{,}30$$" },
      { id: 21, level: 4, typ: "numerisch", frage: "In einem Dreieck sind \\(a = 9\\), \\(b = 13\\) und der Winkel bei \\(B\\) mit \\(64°\\) gegeben. Berechne den Winkel bei \\(A\\) in Grad auf eine Dezimale.", loesung: 38.5, toleranz: 0.15, tipp: "Hier ist ein vollständiges Paar aus Seite und Gegenwinkel gegeben; die kürzere Seite liegt dem kleineren Winkel gegenüber.", loesungsweg: "Sinussatz nach \\(\\sin\\alpha\\) umgestellt: $$\\sin\\alpha = \\frac{a \\cdot \\sin\\beta}{b} = \\frac{9 \\cdot \\sin 64°}{13} \\approx \\frac{9 \\cdot 0{,}8988}{13} \\approx 0{,}6222$$ Daraus \\(\\alpha \\approx 38{,}5°\\). Da \\(a < b\\) ist, muss \\(\\alpha < \\beta\\) gelten — die stumpfe Nebenlösung \\(141{,}5°\\) scheidet aus." },
      { id: 22, level: 4, typ: "numerisch", frage: "Zwei Wanderwege beginnen im selben Punkt und schließen dort einen Winkel von \\(52°\\) ein. Nach \\(3{,}4\\,\\text{km}\\) auf dem einen und \\(5{,}1\\,\\text{km}\\) auf dem anderen Weg wird jeweils haltgemacht. Wie weit sind die beiden Haltepunkte in Kilometern voneinander entfernt (zwei Dezimalen)?", loesung: 4.03, toleranz: 0.03, tipp: "Zeichne das Dreieck aus Startpunkt und den beiden Haltepunkten; der gegebene Winkel liegt zwischen den bekannten Strecken.", loesungsweg: "Die beiden Wege und die Verbindung der Haltepunkte bilden ein Dreieck mit den Seiten \\(3{,}4\\) und \\(5{,}1\\) und dem eingeschlossenen Winkel \\(52°\\): $$d^2 = 3{,}4^2 + 5{,}1^2 - 2 \\cdot 3{,}4 \\cdot 5{,}1 \\cdot \\cos 52° \\approx 37{,}57 - 21{,}35 = 16{,}22$$ Also \\(d \\approx 4{,}03\\,\\text{km}\\)." },
      { id: 23, level: 4, typ: "mc", frage: "Von einem Dreieck sind die Seite \\(c\\), der Winkel bei \\(C\\) und die Seite \\(a\\) bekannt. Womit lässt sich der Winkel bei \\(A\\) ohne Zwischenrechnung bestimmen?", optionen: ["mit dem Sinussatz", "mit dem Kosinussatz", "mit der Winkelsumme", "mit dem Satz des Pythagoras"], korrekt: 0, tipp: "Prüfe, ob unter den gegebenen Stücken ein vollständiges Paar aus Seite und gegenüberliegendem Winkel steckt.", loesungsweg: "\\(c\\) und der Winkel bei \\(C\\) bilden ein vollständiges Paar aus Seite und Gegenwinkel — genau das verlangt der Sinussatz: $$\\frac{a}{\\sin\\alpha} = \\frac{c}{\\sin\\gamma}$$ Der Kosinussatz bräuchte drei Seiten oder zwei Seiten mit eingeschlossenem Winkel, die Winkelsumme einen zweiten bekannten Winkel, und der Satz des Pythagoras einen rechten Winkel." },
      { id: 24, level: 4, typ: "numerisch", frage: "In einem Dreieck sind \\(a = 20\\), \\(b = 12\\) und \\(c = 15\\). Berechne den Winkel bei \\(A\\) in Grad auf eine Dezimale.", loesung: 94.9, toleranz: 0.15, tipp: "Bei drei gegebenen Seiten hilft nur einer der beiden Sätze; stelle ihn nach dem Kosinus des gesuchten Winkels um.", loesungsweg: "$$\\cos\\alpha = \\frac{b^2 + c^2 - a^2}{2bc} = \\frac{144 + 225 - 400}{2 \\cdot 12 \\cdot 15} = \\frac{-31}{360} \\approx -0{,}0861$$ Daraus \\(\\alpha \\approx 94{,}9°\\). Das Dreieck ist also knapp stumpfwinklig — mit \\(a^2 = 400\\) gegenüber \\(b^2 + c^2 = 369\\) war das zu erwarten." },
      // ========== LEVEL 5 — zwei Sätze kombinieren, Parameter, Fehlersuche ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler rechnet für \\(b = 8\\), \\(c = 5\\) und einen Winkel von \\(120°\\) bei \\(A\\): \\(a^2 = 64 + 25 - 2 \\cdot 40 \\cdot 0{,}5 = 49\\), also \\(a = 7\\). Wo steckt der Fehler?", optionen: ["Der Kosinuswert ist hier negativ", "Die Quadrate wurden falsch gebildet", "Der Winkel gehört nicht dazwischen", "Es fehlt die Wurzel am Schluss"], korrekt: 0, tipp: "Prüfe, welches Vorzeichen der Kosinus eines stumpfen Winkels hat, und was das für den Korrekturterm bedeutet.", loesungsweg: "Für \\(120°\\) gilt \\(\\cos 120° = -0{,}5\\), nicht \\(+0{,}5\\). Der Korrekturterm wird dadurch addiert: $$a^2 = 64 + 25 - 2 \\cdot 40 \\cdot (-0{,}5) = 89 + 40 = 129$$ Also \\(a \\approx 11{,}36\\) statt 7. Kontrolle: Der Winkel bei \\(A\\) ist stumpf, also muss \\(a\\) die längste Seite sein — das Ergebnis 7 war schon deshalb unmöglich." },
      { id: 26, level: 5, typ: "numerisch", frage: "In einem Dreieck sind \\(a = 13\\), \\(b = 8\\) und der Winkel bei \\(C\\) mit \\(72°\\) gegeben. Berechne den Winkel bei \\(A\\) in Grad auf eine Dezimale.", loesung: 72.1, toleranz: 0.3, tipp: "Zum gesuchten Winkel fehlt zunächst jedes vollständige Paar — verschaffe dir mit dem passenden Satz zuerst die dritte Seite.", loesungsweg: "Schritt 1 (Kosinussatz, zwei Seiten mit eingeschlossenem Winkel): $$c^2 = 169 + 64 - 2 \\cdot 13 \\cdot 8 \\cdot \\cos 72° \\approx 233 - 64{,}28 = 168{,}72 \\;\\Rightarrow\\; c \\approx 12{,}99$$ Schritt 2 (Kosinussatz nach \\(\\cos\\alpha\\)): $$\\cos\\alpha = \\frac{b^2 + c^2 - a^2}{2bc} \\approx \\frac{64 + 168{,}72 - 169}{2 \\cdot 8 \\cdot 12{,}99} \\approx 0{,}3066$$ Damit \\(\\alpha \\approx 72{,}1°\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "In einem Dreieck sind \\(b = 9\\), der Winkel bei \\(C\\) mit \\(60°\\) und die Seite \\(c = 8\\) gegeben. Für die Seite \\(a\\) gibt es zwei mögliche Längen. Gib die kleinere auf zwei Dezimalen an.", loesung: 2.7, toleranz: 0.03, tipp: "Setze die gegebenen Stücke so ein, dass nur noch die gesuchte Seite unbekannt bleibt; es entsteht eine quadratische Gleichung.", loesungsweg: "Kosinussatz mit \\(\\cos 60° = 0{,}5\\): $$64 = a^2 + 81 - 2 \\cdot 9 \\cdot a \\cdot 0{,}5 = a^2 - 9a + 81$$ also \\(a^2 - 9a + 17 = 0\\) und $$a_{1,2} = \\frac{9 \\pm \\sqrt{81 - 68}}{2} = \\frac{9 \\pm \\sqrt{13}}{2}$$ Das ergibt \\(a \\approx 2{,}70\\) und \\(a \\approx 6{,}30\\); gesucht ist die kleinere Länge \\(2{,}70\\). Beide Werte gehören zu wirklich existierenden Dreiecken." },
      { id: 28, level: 5, typ: "numerisch", frage: "Ein Boot fährt geradeaus von \\(A\\) nach \\(B\\); die Strecke ist \\(6{,}5\\,\\text{km}\\) lang. Eine Boje \\(C\\) erscheint von \\(A\\) aus unter einem Winkel von \\(47°\\) zur Fahrtstrecke, von \\(B\\) aus unter \\(68°\\) zur Rückrichtung. Wie weit ist die Boje von \\(B\\) entfernt (in km, zwei Dezimalen)?", loesung: 5.25, toleranz: 0.05, tipp: "Die beiden Winkel liegen im Dreieck \\(ABC\\) bei \\(A\\) und bei \\(B\\); der fehlende dritte Winkel öffnet den Weg zum Sinussatz.", loesungsweg: "Im Dreieck \\(ABC\\) ist \\(\\gamma = 180° - 47° - 68° = 65°\\). Die gesuchte Strecke \\(BC\\) liegt dem Winkel bei \\(A\\) gegenüber, die bekannte Strecke \\(AB\\) dem Winkel bei \\(C\\): $$BC = \\frac{6{,}5 \\cdot \\sin 47°}{\\sin 65°} \\approx \\frac{6{,}5 \\cdot 0{,}7314}{0{,}9063} \\approx 5{,}25\\,\\text{km}$$" },
      { id: 29, level: 5, typ: "numerisch", frage: "In einem Dreieck sind \\(a = 7\\), \\(b = 10\\) und der Winkel bei \\(A\\) mit \\(40°\\) gegeben. Zu diesen Angaben passen zwei Dreiecke. Gib den stumpfen der beiden möglichen Winkel bei \\(B\\) in Grad auf eine Dezimale an.", loesung: 113.3, toleranz: 0.2, tipp: "Der Sinuswert allein legt den Winkel nicht fest — zu jedem spitzen Winkel gehört ein zweiter mit demselben Sinuswert.", loesungsweg: "Sinussatz: $$\\sin\\beta = \\frac{b \\cdot \\sin\\alpha}{a} = \\frac{10 \\cdot \\sin 40°}{7} \\approx 0{,}9183$$ Dazu gehören \\(\\beta_1 \\approx 66{,}7°\\) und \\(\\beta_2 = 180° - 66{,}7° \\approx 113{,}3°\\). Beide sind möglich, weil \\(40° + 113{,}3° < 180°\\) bleibt. Gesucht ist der stumpfe Wert \\(113{,}3°\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "In einem Dreieck sind \\(a = 12\\), der Winkel bei \\(A\\) mit \\(38°\\) und der Winkel bei \\(B\\) mit \\(71°\\) gegeben. Berechne den Umfang auf eine Dezimale.", loesung: 48.9, toleranz: 0.2, tipp: "Bestimme zuerst den fehlenden Winkel; danach zeigt sich, dass zwei der drei Seiten gleich lang sein müssen.", loesungsweg: "Winkelsumme: \\(\\gamma = 180° - 38° - 71° = 71°\\). Weil \\(\\beta = \\gamma\\) gilt, ist das Dreieck gleichschenklig mit \\(b = c\\): $$b = \\frac{12 \\cdot \\sin 71°}{\\sin 38°} \\approx \\frac{12 \\cdot 0{,}9455}{0{,}6157} \\approx 18{,}43$$ Umfang: \\(12 + 2 \\cdot 18{,}43 \\approx 48{,}9\\)." },
      // ========== LEVEL 6 — Fallunterscheidung SSW, Grenzfälle, Behauptungen ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Von einem Dreieck sind \\(a = 6\\), \\(b = 9\\) und der Winkel bei \\(A\\) mit \\(35°\\) bekannt. Bestimme die Anzahl der Dreiecke, die zu diesen Angaben passen.", loesung: 2, toleranz: 0, tipp: "Bestimme den Sinuswert des Winkels bei \\(B\\) und prüfe für jeden dazu passenden Winkel, ob die Winkelsumme noch ein Dreieck zulässt.", loesungsweg: "Sinussatz: $$\\sin\\beta = \\frac{9 \\cdot \\sin 35°}{6} \\approx 0{,}8604$$ Dazu gehören \\(\\beta_1 \\approx 59{,}4°\\) und \\(\\beta_2 \\approx 120{,}6°\\). Beide sind zulässig, denn \\(35° + 59{,}4° < 180°\\) und auch \\(35° + 120{,}6° = 155{,}6° < 180°\\). Es gibt also <b>2</b> Dreiecke — der mehrdeutige Fall tritt ein, weil die dem gegebenen Winkel gegenüberliegende Seite die kürzere ist." },
      { id: 32, level: 6, typ: "numerisch", frage: "In einem Dreieck sind \\(b = 10\\) und der Winkel bei \\(A\\) mit \\(30°\\) gegeben. Für welche Länge der Seite \\(a\\) mit \\(a < 10\\) passt genau ein Dreieck zu diesen Angaben?", loesung: 5, toleranz: 0.02, tipp: "Denke an den Grenzfall, in dem die beiden möglichen Winkel bei \\(B\\) zusammenfallen, und überlege, wie groß dieser Winkel dann ist.", loesungsweg: "Aus \\(\\sin\\beta = \\frac{b \\sin\\alpha}{a}\\) folgt: Zwei Lösungen gibt es, solange \\(\\sin\\beta < 1\\) ist, keine, wenn \\(\\sin\\beta > 1\\). Der Grenzfall ist \\(\\sin\\beta = 1\\), also \\(\\beta = 90°\\): $$a = b \\cdot \\sin\\alpha = 10 \\cdot \\sin 30° = 5$$ Für \\(a = 5\\) gibt es genau ein (rechtwinkliges) Dreieck, für \\(a < 5\\) keines und für \\(5 < a < 10\\) zwei." },
      { id: 33, level: 6, typ: "mc", frage: "Behauptung: „Ergibt der Sinussatz in einem Dreieck \\(\\sin\\beta = 0{,}5\\), so ist der Winkel bei \\(B\\) stets \\(30°\\).“ Wie ist das zu bewerten?", optionen: ["richtig, der Sinussatz ist eindeutig", "falsch, auch \\(150°\\) ist möglich", "falsch, nur \\(60°\\) kommt infrage", "richtig, weil der Winkel spitz ist"], korrekt: 1, tipp: "Überlege, wie viele Winkel zwischen \\(0°\\) und \\(180°\\) denselben Sinuswert besitzen.", loesungsweg: "Zwischen \\(0°\\) und \\(180°\\) haben stets zwei Winkel denselben Sinuswert, hier \\(30°\\) und \\(180° - 30° = 150°\\). Ob der stumpfe Wert wirklich passt, entscheidet erst die Winkelsumme: Bleibt \\(\\alpha + 150° < 180°\\), so gehört auch dazu ein Dreieck. Die Behauptung ist deshalb <b>falsch</b> — genau darin besteht die Mehrdeutigkeit des SSW-Falls." },
      { id: 34, level: 6, typ: "numerisch", frage: "Ein Dreieck hat die Seiten \\(a = 21\\), \\(b = 17\\) und \\(c = 13\\). Berechne den Winkel, den die Seiten \\(a\\) und \\(b\\) einschließen, in Grad auf eine Dezimale.", loesung: 38.2, toleranz: 0.15, tipp: "Überlege zuerst, welcher der drei Eckwinkel von den beiden genannten Seiten gebildet wird, und welche Seite ihm gegenüberliegt.", loesungsweg: "Die Seiten \\(a\\) und \\(b\\) treffen sich im Eckpunkt \\(C\\); der gesuchte Winkel ist also \\(\\gamma\\), und ihm liegt \\(c\\) gegenüber. $$\\cos\\gamma = \\frac{a^2 + b^2 - c^2}{2ab} = \\frac{441 + 289 - 169}{2 \\cdot 21 \\cdot 17} = \\frac{561}{714} \\approx 0{,}7857$$ Damit \\(\\gamma \\approx 38{,}2°\\) — der kleinste Winkel, passend zur kürzesten Seite." },
      { id: 35, level: 6, typ: "numerisch", frage: "Von einem Dreieck sind \\(a = 4\\), \\(b = 6\\) und der Winkel bei \\(A\\) mit \\(50°\\) bekannt. Bestimme die Anzahl der Dreiecke, die zu diesen Angaben passen.", loesung: 0, toleranz: 0, tipp: "Berechne den Sinuswert des Winkels bei \\(B\\) und prüfe, ob ein solcher Wert für einen Sinus überhaupt auftreten kann.", loesungsweg: "Sinussatz: $$\\sin\\beta = \\frac{6 \\cdot \\sin 50°}{4} \\approx \\frac{6 \\cdot 0{,}7660}{4} \\approx 1{,}149$$ Ein Sinuswert größer als 1 ist unmöglich — es gibt <b>kein</b> passendes Dreieck. Anschaulich: Die Seite \\(a = 4\\) ist kürzer als der Abstand \\(b \\cdot \\sin\\alpha \\approx 4{,}60\\) und erreicht die gegenüberliegende Seite gar nicht." },
      { id: 36, level: 6, typ: "mc", frage: "Behauptung: „Liefert der Kosinussatz für einen Winkel eines Dreiecks einen negativen Kosinuswert, so ist dieses Dreieck stumpfwinklig.“ Wie ist das zu bewerten?", optionen: ["ja, der Winkel ist dann stumpf", "nein, das Dreieck ist spitzwinklig", "nein, so etwas kommt nie vor", "ja, aber nur bei gleichschenkligen"], korrekt: 0, tipp: "Überlege, für welche Winkel zwischen \\(0°\\) und \\(180°\\) der Kosinus negative Werte annimmt.", loesungsweg: "Der Kosinus ist im Bereich \\(90° < \\varphi < 180°\\) negativ und im Bereich \\(0° < \\varphi < 90°\\) positiv. Ein negativer Kosinuswert gehört also zu einem stumpfen Winkel, und ein Dreieck mit einem stumpfen Winkel heißt stumpfwinklig. Der Fall kommt durchaus vor, etwa bei \\(a = 8\\), \\(b = 6\\), \\(c = 13\\): $$\\cos\\gamma = \\frac{64 + 36 - 169}{96} < 0$$ Mehr als einen stumpfen Winkel kann ein Dreieck wegen der Winkelsumme nicht haben." }];
