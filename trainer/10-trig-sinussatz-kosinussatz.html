<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinussatz &amp; Kosinussatz - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-trig-sinussatz-kosinussatz';
    const THEMA_CONFIG = { name: 'Sinussatz & Kosinussatz', bereich: 'geometrie' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Sätze erkennen ==========
      { id: 1, level: 1, typ: "mc", frage: "Wie lautet der Sinussatz?", optionen: ["\\(a^2 = b^2 + c^2\\)", "\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{b}{\\sin\\beta} = \\tfrac{c}{\\sin\\gamma}\\)", "\\(a^2 = b^2 + c^2 - 2bc\\cos\\alpha\\)", "\\(a \\sin\\alpha = b \\sin\\beta\\)"], korrekt: 1, tipp: "Der Sinussatz verknüpft Seiten und ihre gegenüberliegenden Winkel.", loesungsweg: "\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{b}{\\sin\\beta} = \\tfrac{c}{\\sin\\gamma}\\): Jede Seite steht im gleichen Verhältnis zum Sinus des gegenüberliegenden Winkels." },
      { id: 2, level: 1, typ: "mc", frage: "Wie lautet der Kosinussatz (für Seite \\(a\\))?", optionen: ["\\(a^2 = b^2 + c^2\\)", "\\(a^2 = b^2 + c^2 - 2bc\\cos\\alpha\\)", "\\(a^2 = b^2 + c^2 + 2bc\\cos\\alpha\\)", "\\(a = b + c - \\cos\\alpha\\)"], korrekt: 1, tipp: "Verallgemeinerung des Satzes von Pythagoras.", loesungsweg: "\\(a^2 = b^2 + c^2 - 2bc\\cos\\alpha\\). Für \\(\\alpha = 90°\\) fällt der Korrekturterm weg." },
      { id: 3, level: 1, typ: "mc", frage: "Wann wird der Sinussatz angewandt?", optionen: ["SSS (drei Seiten)", "SWS (zwei Seiten + eingeschl. Winkel)", "WSW oder SSW (Winkel und gegenüberliegende Seite bekannt)", "Nur bei rechtwinkligen Dreiecken"], korrekt: 2, tipp: "Der Sinussatz braucht ein Paar aus Seite und ihrem Gegenwinkel.", loesungsweg: "Sinussatz: WSW oder SSW — man benötigt eine Seite und den gegenüberliegenden Winkel." },
      { id: 4, level: 1, typ: "mc", frage: "Wann wird der Kosinussatz angewandt?", optionen: ["SSS und SWS", "WSW", "Nur bei gleichseitigen Dreiecken", "Nur bei Winkel \\(90°\\)"], korrekt: 0, tipp: "Der Kosinussatz hilft, wenn der Sinussatz nicht direkt greift.", loesungsweg: "SSS (3 Seiten → Winkel) und SWS (2 Seiten + eingeschlossener Winkel → 3. Seite)." },
      { id: 5, level: 1, typ: "mc", frage: "Im Dreieck gilt \\(\\alpha + \\beta + \\gamma\\) = ?", optionen: ["\\(90°\\)", "\\(180°\\)", "\\(270°\\)", "\\(360°\\)"], korrekt: 1, tipp: "Winkelsumme im Dreieck.", loesungsweg: "\\(\\alpha + \\beta + \\gamma = 180°\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Welche Seite liegt dem Winkel \\(\\alpha\\) gegenüber?", optionen: ["\\(a\\)", "\\(b\\)", "\\(c\\)", "kommt drauf an"], korrekt: 0, tipp: "Bezeichnungskonvention: Seite = kleiner Buchstabe des gegenüberliegenden Winkels.", loesungsweg: "Konvention: Seite \\(a\\) liegt \\(\\alpha\\) gegenüber, \\(b\\) gegenüber \\(\\beta\\), \\(c\\) gegenüber \\(\\gamma\\)." },
      // ========== LEVEL 2 — Sinussatz einfach ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Im Dreieck ist \\(a = 10\\), \\(\\alpha = 30°\\), \\(\\beta = 45°\\). Berechne \\(b\\) (auf 2 Dezimalen).", loesung: 14.14, toleranz: 0.05, tipp: "\\(\\tfrac{b}{\\sin\\beta} = \\tfrac{a}{\\sin\\alpha}\\).", loesungsweg: "\\(b = \\tfrac{a \\sin\\beta}{\\sin\\alpha} = \\tfrac{10 \\cdot \\sin 45°}{\\sin 30°} = \\tfrac{10 \\cdot 0{,}7071}{0{,}5} \\approx 14{,}14\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Im Dreieck ist \\(a = 8\\), \\(\\alpha = 40°\\), \\(b = 6\\). Berechne \\(\\beta\\) in Grad (auf 1 Dezimale).", loesung: 28.8, toleranz: 0.5, tipp: "\\(\\sin\\beta = \\tfrac{b \\sin\\alpha}{a}\\).", loesungsweg: "\\(\\sin\\beta = \\tfrac{6 \\cdot \\sin 40°}{8} = \\tfrac{6 \\cdot 0{,}6428}{8} \\approx 0{,}4821 \\Rightarrow \\beta \\approx 28{,}8°\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Dreieck: \\(\\alpha = 50°\\), \\(\\beta = 60°\\), \\(c = 10\\). Berechne \\(\\gamma\\) in Grad.", loesung: 70, toleranz: 0, tipp: "Winkelsumme \\(180°\\).", loesungsweg: "\\(\\gamma = 180° - 50° - 60° = 70°\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Dreieck: \\(\\alpha = 50°\\), \\(\\gamma = 70°\\), \\(c = 10\\). Berechne \\(a\\) (2 Dezimalen).", loesung: 8.15, toleranz: 0.05, tipp: "\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{c}{\\sin\\gamma}\\).", loesungsweg: "\\(a = \\tfrac{10 \\cdot \\sin 50°}{\\sin 70°} = \\tfrac{10 \\cdot 0{,}766}{0{,}9397} \\approx 8{,}15\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Im Dreieck: \\(a = 12\\), \\(\\alpha = 90°\\), \\(\\beta = 30°\\). Berechne \\(b\\).", loesung: 6, toleranz: 0.1, tipp: "\\(\\sin 90° = 1\\); \\(\\sin 30° = 0{,}5\\).", loesungsweg: "\\(b = \\tfrac{12 \\cdot \\sin 30°}{\\sin 90°} = \\tfrac{12 \\cdot 0{,}5}{1} = 6\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Welche Formel ist KEIN Fall des Sinussatzes?", optionen: ["\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{b}{\\sin\\beta}\\)", "\\(\\tfrac{a}{\\sin\\alpha} = \\tfrac{c}{\\sin\\gamma}\\)", "\\(a \\sin\\alpha = b \\sin\\beta\\)", "\\(\\tfrac{b}{\\sin\\beta} = \\tfrac{c}{\\sin\\gamma}\\)"], korrekt: 2, tipp: "Vorsicht mit Zähler und Nenner.", loesungsweg: "\\(a \\sin\\alpha = b \\sin\\beta\\) ist falsch. Richtig: \\(a \\sin\\beta = b \\sin\\alpha\\) (Umformung)." },
      // ========== LEVEL 3 — Kosinussatz einfach ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Dreieck: \\(b = 5\\), \\(c = 7\\), \\(\\alpha = 60°\\). Berechne \\(a\\) (2 Dezimalen).", loesung: 6.24, toleranz: 0.05, tipp: "\\(a^2 = b^2 + c^2 - 2bc\\cos\\alpha\\). \\(\\cos 60° = 0{,}5\\).", loesungsweg: "\\(a^2 = 25 + 49 - 2 \\cdot 35 \\cdot 0{,}5 = 74 - 35 = 39 \\Rightarrow a \\approx 6{,}24\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Dreieck: \\(a = 4\\), \\(b = 5\\), \\(c = 6\\). Berechne \\(\\alpha\\) in Grad (1 Dezimale).", loesung: 41.4, toleranz: 0.5, tipp: "\\(\\cos\\alpha = \\tfrac{b^2 + c^2 - a^2}{2bc}\\).", loesungsweg: "\\(\\cos\\alpha = \\tfrac{25 + 36 - 16}{60} = \\tfrac{45}{60} = 0{,}75 \\Rightarrow \\alpha \\approx 41{,}4°\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Dreieck: \\(b = 8\\), \\(c = 10\\), \\(\\alpha = 90°\\). Berechne \\(a\\).", loesung: 12.81, toleranz: 0.1, tipp: "Kosinus von \\(90°\\) ist 0 — dann wird Kosinussatz zum Pythagoras.", loesungsweg: "\\(a^2 = 64 + 100 - 0 = 164 \\Rightarrow a \\approx 12{,}81\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Dreieck: \\(b = 6\\), \\(c = 8\\), \\(\\alpha = 120°\\). Berechne \\(a\\) (2 Dezimalen).", loesung: 12.17, toleranz: 0.05, tipp: "\\(\\cos 120° = -0{,}5\\).", loesungsweg: "\\(a^2 = 36 + 64 - 2\\cdot48\\cdot(-0{,}5) = 100 + 48 = 148 \\Rightarrow a \\approx 12{,}17\\)." },
      { id: 17, level: 3, typ: "mc", frage: "Im Dreieck mit \\(a = 7, b = 5, c = 3\\) ist der Winkel \\(\\alpha\\) (gegenüber \\(a\\))…", optionen: ["spitz", "rechtwinklig", "stumpf", "lässt sich nicht bestimmen"], korrekt: 2, tipp: "Berechne \\(\\cos\\alpha\\) — Vorzeichen entscheidet.", loesungsweg: "\\(\\cos\\alpha = \\tfrac{25+9-49}{30} = -0{,}5\\) → negativ → \\(\\alpha = 120°\\) → stumpf." },
      { id: 18, level: 3, typ: "numerisch", frage: "Dreieck: \\(a = 5\\), \\(b = 12\\), \\(c = 13\\). Berechne \\(\\gamma\\) in Grad.", loesung: 90, toleranz: 1, tipp: "\\(\\cos\\gamma = \\tfrac{a^2 + b^2 - c^2}{2ab}\\).", loesungsweg: "\\(\\cos\\gamma = \\tfrac{25 + 144 - 169}{120} = 0 \\Rightarrow \\gamma = 90°\\). (Pythagoräisches Tripel 5-12-13.)" },
      // ========== LEVEL 4 — Mischaufgaben ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Dreieck: \\(a = 6\\), \\(b = 8\\), \\(\\gamma = 40°\\). Berechne \\(c\\) (2 Dezimalen).", loesung: 5.16, toleranz: 0.1, tipp: "SWS → Kosinussatz: \\(c^2 = a^2 + b^2 - 2ab\\cos\\gamma\\).", loesungsweg: "\\(c^2 = 36 + 64 - 96 \\cdot 0{,}766 \\approx 100 - 73{,}5 = 26{,}5 \\Rightarrow c \\approx 5{,}15\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Dreieck: \\(\\alpha = 75°\\), \\(\\beta = 60°\\), \\(a = 10\\). Berechne \\(b\\) (2 Dezimalen).", loesung: 8.97, toleranz: 0.1, tipp: "Sinussatz.", loesungsweg: "\\(b = \\tfrac{10 \\cdot \\sin 60°}{\\sin 75°} = \\tfrac{10 \\cdot 0{,}866}{0{,}966} \\approx 8{,}97\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Dreieck: \\(a = 9\\), \\(\\alpha = 35°\\), \\(b = 7\\). Berechne \\(\\beta\\) in Grad (1 Dezimale).", loesung: 26.5, toleranz: 0.5, tipp: "Sinussatz \\(\\sin\\beta = \\tfrac{b\\sin\\alpha}{a}\\).", loesungsweg: "\\(\\sin\\beta = \\tfrac{7 \\cdot 0{,}5736}{9} \\approx 0{,}446 \\Rightarrow \\beta \\approx 26{,}5°\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Dreieck: \\(a = 10\\), \\(b = 12\\), \\(c = 8\\). Berechne \\(\\beta\\) in Grad (1 Dezimale).", loesung: 82.8, toleranz: 0.5, tipp: "\\(\\cos\\beta = \\tfrac{a^2 + c^2 - b^2}{2ac}\\).", loesungsweg: "\\(\\cos\\beta = \\tfrac{100 + 64 - 144}{160} = \\tfrac{20}{160} = 0{,}125 \\Rightarrow \\beta \\approx 82{,}8°\\)." },
      { id: 23, level: 4, typ: "mc", frage: "Welchen Satz wendest du bei \\(a = 7, b = 9, c = 5\\) an, um einen Winkel zu bestimmen?", optionen: ["Sinussatz", "Kosinussatz", "Satz des Pythagoras", "Strahlensatz"], korrekt: 1, tipp: "SSS: drei Seiten gegeben.", loesungsweg: "Bei drei Seiten (SSS) funktioniert Sinussatz nicht direkt → Kosinussatz." },
      { id: 24, level: 4, typ: "numerisch", frage: "Dreieck: \\(a = 5\\), \\(b = 7\\), \\(\\gamma = 110°\\). Berechne \\(c\\) (2 Dezimalen).", loesung: 9.92, toleranz: 0.1, tipp: "\\(\\cos 110° \\approx -0{,}342\\).", loesungsweg: "\\(c^2 = 25 + 49 - 70 \\cdot (-0{,}342) = 74 + 23{,}94 \\approx 97{,}94 \\Rightarrow c \\approx 9{,}9\\)." },
      // ========== LEVEL 5 — Anwendungen ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Ein Grundstück: Seite \\(a = 40\\,\\text{m}\\), \\(b = 55\\,\\text{m}\\), \\(\\gamma = 80°\\). Wie lang ist die dritte Seite \\(c\\) in Meter (1 Dezimale)?", loesung: 62.0, toleranz: 0.5, tipp: "Kosinussatz für SWS.", loesungsweg: "\\(c^2 = 1600 + 3025 - 4400 \\cdot \\cos 80° = 4625 - 764{,}2 \\approx 3860{,}8 \\Rightarrow c \\approx 62{,}1\\,\\text{m}\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Dreieck mit \\(a=6, b=8, \\gamma=30°\\). Fläche \\(A = \\tfrac{1}{2}ab\\sin\\gamma\\) = ? (in Flächeneinheiten)", loesung: 12, toleranz: 0.1, tipp: "\\(\\sin 30° = 0{,}5\\).", loesungsweg: "\\(A = 0{,}5 \\cdot 6 \\cdot 8 \\cdot 0{,}5 = 12\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Von einem Turm \\(T\\) wird ein Boot unter \\(35°\\) gesehen, nach \\(50\\,\\text{m}\\) Fahrt unter \\(55°\\). Der Winkel \\(\\gamma\\) zwischen den Peilungen im Boot-Standpunkt ist \\(125°\\). Wie weit ist das Boot vom Turm zum ersten Zeitpunkt entfernt (in m, 1 Dezimale)?", loesung: 119.8, toleranz: 2, tipp: "Sinussatz mit Winkel \\(20°\\) am Turm, \\(35°\\) und \\(125°\\).", loesungsweg: "Winkelsumme: \\(180° - 35° - 125° = 20°\\). \\(\\tfrac{x}{\\sin 125°} = \\tfrac{50}{\\sin 20°} \\Rightarrow x = \\tfrac{50 \\cdot 0{,}819}{0{,}342} \\approx 119{,}8\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Dreieck: \\(a = 12, b = 15, c = 9\\). Fläche per Heron: \\(s = \\tfrac{a+b+c}{2}\\), \\(A = \\sqrt{s(s-a)(s-b)(s-c)}\\). Berechne \\(A\\) (1 Dezimale).", loesung: 53.7, toleranz: 0.5, tipp: "\\(s = 18\\).", loesungsweg: "\\(s = 18, A = \\sqrt{18 \\cdot 6 \\cdot 3 \\cdot 9} = \\sqrt{2916} = 54\\). (Tol.)" },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Dreieck hat \\(a = 14, \\alpha = 45°, \\beta = 65°\\). Berechne Seite \\(c\\) (1 Dezimale).", loesung: 18.6, toleranz: 0.2, tipp: "\\(\\gamma = 70°\\). Sinussatz.", loesungsweg: "\\(\\gamma = 70°, c = \\tfrac{14 \\cdot \\sin 70°}{\\sin 45°} = \\tfrac{14 \\cdot 0{,}9397}{0{,}7071} \\approx 18{,}6\\)." },
      { id: 30, level: 5, typ: "mc", frage: "Beim \\(\\text{SSW}\\)-Fall (zwei Seiten + nicht eingeschlossener Winkel) kann es…", optionen: ["immer genau eine Lösung geben", "keine, eine oder zwei Lösungen geben", "immer zwei Lösungen geben", "niemals eine Lösung geben"], korrekt: 1, tipp: "Das ist der „uneindeutige Fall\" der Trigonometrie.", loesungsweg: "SSW-Fall ist mehrdeutig: Je nach Größenverhältnis keine, eine oder zwei Lösungen." },
      // ========== LEVEL 6 — Transfer ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Ein Flugzeug fliegt Strecke A→B = 250 km, Kurs dann um \\(40°\\) geändert, B→C = 180 km. Wie weit ist A von C entfernt (km, 1 Dezimale)?", loesung: 404.8, toleranz: 3, tipp: "Der Innenwinkel bei B ist \\(180° - 40° = 140°\\). Kosinussatz.", loesungsweg: "\\(AC^2 = 250^2 + 180^2 - 2\\cdot250\\cdot180 \\cdot \\cos 140° = 62500 + 32400 + 68943 \\approx 163843 \\Rightarrow AC \\approx 404{,}8\\,\\text{km}\\). (Anmerkung: Vorzeichen je nach Konvention)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Dreieck: \\(a = 10, b = 10, c = 10\\). Wie groß ist jeder Winkel (in Grad)?", loesung: 60, toleranz: 0, tipp: "Gleichseitiges Dreieck.", loesungsweg: "\\(\\cos\\alpha = \\tfrac{100+100-100}{200} = 0{,}5 \\Rightarrow \\alpha = 60°\\). Alle Winkel \\(60°\\)." },
      { id: 33, level: 6, typ: "numerisch", frage: "In einem Dreieck sind \\(a = 9, b = 7, \\gamma = 55°\\). Berechne die Fläche (1 Dezimale).", loesung: 25.8, toleranz: 0.3, tipp: "\\(A = \\tfrac{1}{2}ab\\sin\\gamma\\).", loesungsweg: "\\(A = 0{,}5 \\cdot 9 \\cdot 7 \\cdot \\sin 55° = 31{,}5 \\cdot 0{,}819 \\approx 25{,}8\\)." },
      { id: 34, level: 6, typ: "mc", frage: "Der Kosinussatz wird zum Satz des Pythagoras, wenn…", optionen: ["\\(\\alpha = 0°\\)", "\\(\\alpha = 90°\\)", "\\(\\alpha = 180°\\)", "das Dreieck gleichschenklig ist"], korrekt: 1, tipp: "\\(\\cos(?) = 0\\) lässt den Korrekturterm verschwinden.", loesungsweg: "\\(\\cos 90° = 0\\), daher \\(a^2 = b^2 + c^2\\) — Pythagoras." },
      { id: 35, level: 6, typ: "numerisch", frage: "Dreieck: \\(\\alpha = 30°, \\beta = 90°, c = 10\\). Berechne \\(a\\) (2 Dezimalen).", loesung: 5.77, toleranz: 0.05, tipp: "\\(\\gamma = 60°\\), \\(\\sin 90° = 1\\).", loesungsweg: "\\(a = \\tfrac{c \\sin\\alpha}{\\sin\\gamma} = \\tfrac{10 \\cdot 0{,}5}{\\sin 60°} = \\tfrac{5}{0{,}866} \\approx 5{,}77\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Zwei Straßen gehen aus einem Punkt. Nach 4 km auf Straße 1 und 6 km auf Straße 2 (Winkel zwischen den Straßen: \\(70°\\)) — wie weit liegen die Endpunkte auseinander (km, 2 Dezimalen)?", loesung: 5.92, toleranz: 0.1, tipp: "SWS → Kosinussatz.", loesungsweg: "\\(d^2 = 16 + 36 - 48 \\cos 70° = 52 - 16{,}42 \\approx 35{,}58 \\Rightarrow d \\approx 5{,}96\\,\\text{km}\\)." }
    ];
    </script>

</body>
