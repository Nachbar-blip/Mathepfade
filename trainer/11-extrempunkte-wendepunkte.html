    <title>Extrem- & Wendepunkte - Mathepfade</title>

<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-extrempunkte-wendepunkte';
    const THEMA_CONFIG = { name: 'Extrem- & Wendepunkte', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "numerisch", frage: "\\(f(x)=x^2-6x+5\\). An welcher Stelle gilt \\(f'(x)=0\\)?", loesung: 3, toleranz: 0, tipp: "Zuerst ableiten, dann den Ableitungsterm null setzen.", loesungsweg: "Gliedweise ableiten: $$f'(x) = 2x-6$$ Null setzen und nach \\(x\\) auflösen: $$2x-6 = 0 \\;\\Rightarrow\\; 2x = 6 \\;\\Rightarrow\\; x = 3$$ An dieser Stelle verläuft die Tangente waagerecht; bei der nach oben geöffneten Parabel ist das der Scheitel und damit ein Tiefpunkt." },
      { id: 2, level: 1, typ: "numerisch", frage: "\\(f(x)=x^2-4x+3\\). Wie viele Extremstellen hat die Funktion?", loesung: 1, toleranz: 0, tipp: "Zähle die Nullstellen der Ableitung — hier ist sie eine lineare Funktion.", loesungsweg: "Die Ableitung $$f'(x) = 2x-4$$ ist linear und hat genau eine Nullstelle: \\(x=2\\). Dort wechselt \\(f'\\) das Vorzeichen von minus nach plus (\\(f'(1)=-2\\), \\(f'(3)=2\\)), es liegt also ein Tiefpunkt vor. Mehr Extremstellen kann eine quadratische Funktion nicht haben: ihre Ableitung ist stets linear und damit höchstens einmal null." },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(f(x)=-x^2+8x-12\\). An welcher Stelle liegt das Extremum?", loesung: 4, toleranz: 0, tipp: "Ableiten und null setzen; das Vorzeichen vor \\(x^2\\) verrät die Art des Extremums.", loesungsweg: "Ableiten und null setzen: $$f'(x) = -2x+8 = 0 \\;\\Rightarrow\\; x = 4$$ Weil der Koeffizient vor \\(x^2\\) negativ ist, öffnet sich die Parabel nach unten — es handelt sich um einen Hochpunkt. Kontrolle über die zweite Ableitung: \\(f''(x) = -2 < 0\\), also Rechtskrümmung und damit ein Maximum." },
      { id: 4, level: 1, typ: "mc", frage: "\\(f(x)=x^2+2x+1\\). Welche Art von Extremum liegt vor?", optionen: ["ein Hochpunkt", "ein Tiefpunkt", "ein Sattelpunkt", "gar kein Extremum"], korrekt: 1, tipp: "Das Vorzeichen der zweiten Ableitung entscheidet über die Art.", loesungsweg: "Erste und zweite Ableitung: $$f'(x) = 2x+2, \\qquad f''(x) = 2$$ Aus \\(f'(x)=0\\) folgt \\(x=-1\\). Dort ist \\(f''(-1) = 2 > 0\\), der Graph also linksgekrümmt — es liegt ein Tiefpunkt vor, und zwar bei \\((-1;0)\\). Das passt zur Scheitelform \\(f(x)=(x+1)^2\\)." },
      { id: 5, level: 1, typ: "numerisch", frage: "\\(f(x)=3x^2-12x+7\\). Nullstelle von \\(f'\\)?", loesung: 2, toleranz: 0, tipp: "\\(6x-12=0\\).", loesungsweg: "$$f'(x) = 6x-12 = 0 \\;\\Rightarrow\\; x = 2$$ Bei einer Parabel ist das zugleich die Scheitelstelle — die einzige Stelle mit waagerechter Tangente." },
      { id: 6, level: 1, typ: "mc", frage: "Notwendige Bedingung für Extremstelle?", optionen: ["\\(f(x)=0\\)", "\\(f'(x)=0\\)", "\\(f''(x)=0\\)", "\\(f'(x)>0\\)"], korrekt: 1, tipp: "Waagerechte Tangente.", loesungsweg: "An einer Extremstelle verläuft die Tangente waagerecht, die Steigung ist dort also null: $$f'(x_0) = 0$$ Diese Bedingung ist <b>notwendig</b>, aber nicht hinreichend: Auch ein Sattelpunkt wie bei \\(f(x) = x^3\\) in \\(x_0 = 0\\) erfüllt sie, ohne ein Extremum zu sein." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-3x\\). Anzahl Extremstellen?", loesung: 2, toleranz: 0, tipp: "\\(f'=3x^2-3\\).", loesungsweg: "$$f'(x) = 3x^2-3 = 3(x^2-1) = 0 \\;\\Rightarrow\\; x = \\pm 1$$ Also <b>zwei</b> Extremstellen. An beiden wechselt \\(f'\\) das Vorzeichen, es handelt sich also wirklich um Extrema: ein Hochpunkt bei \\(-1\\), ein Tiefpunkt bei \\(1\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-12x+2\\). Welche der beiden Extremstellen ist positiv?", loesung: 2, toleranz: 0, tipp: "Ableiten, null setzen und die quadratische Gleichung lösen; danach die passende Lösung auswählen.", loesungsweg: "Ableiten und null setzen: $$f'(x) = 3x^2-12 = 0 \\;\\Rightarrow\\; x^2 = 4 \\;\\Rightarrow\\; x = 2 \\ \\text{oder}\\ x = -2$$ Beide Lösungen sind Extremstellen, denn \\(f''(x)=6x\\) ist bei \\(x=2\\) positiv (Tiefpunkt) und bei \\(x=-2\\) negativ (Hochpunkt). Gesucht ist die positive Stelle: \\(x=2\\). Wer beim Wurzelziehen die negative Lösung vergisst, übersieht den Hochpunkt." },
      { id: 9, level: 2, typ: "mc", frage: "\\(f(x)=x^3-3x\\). Welche Art von Extremum liegt an der Stelle \\(x=1\\) vor?", optionen: ["ein Hochpunkt", "ein Tiefpunkt", "ein Wendepunkt", "ein Sattelpunkt"], korrekt: 1, tipp: "Setze die Stelle in die zweite Ableitung ein und deute ihr Vorzeichen.", loesungsweg: "Die Ableitungen sind $$f'(x) = 3x^2-3, \\qquad f''(x) = 6x$$ Die notwendige Bedingung ist erfüllt: \\(f'(1) = 3-3 = 0\\). Die hinreichende Bedingung entscheidet über die Art: $$f''(1) = 6 > 0$$ Positive zweite Ableitung bedeutet Linkskrümmung, also ein Minimum — an der Stelle \\(x=1\\) liegt ein Tiefpunkt, nämlich \\((1;-2)\\)." },
      { id: 10, level: 2, typ: "mc", frage: "\\(f''(x_0)<0\\) und \\(f'(x_0)=0\\). Folgerung?", optionen: ["Tiefpunkt", "Hochpunkt", "Wendepunkt", "keine Aussage"], korrekt: 1, tipp: "Hinreichend.", loesungsweg: "Ist \\(f'(x_0) = 0\\) und zusätzlich \\(f''(x_0) < 0\\), so ist der Graph dort rechtsgekrümmt — er öffnet sich nach unten: $$\\Rightarrow \\text{Hochpunkt}$$ Umgekehrt ergäbe \\(f''(x_0) > 0\\) einen Tiefpunkt. Diese Bedingung ist hinreichend, eine weitere Prüfung erübrigt sich." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). \\(f''(1)\\)?", loesung: -6, toleranz: 0, tipp: "\\(f''=6x-12\\).", loesungsweg: "Zweimal ableiten: \\(f'(x) = 3x^2-12x+9\\), also \\(f''(x) = 6x-12\\). $$f''(1) = 6-12 = -6$$ Weil \\(f'(1) = 3-12+9 = 0\\) ist und \\(f''(1) < 0\\), liegt bei \\(x = 1\\) sogar ein Hochpunkt." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(f(x)=2x^3-6x\\). Negative Extremstelle?", loesung: -1, toleranz: 0, tipp: "\\(6x^2-6=0\\).", loesungsweg: "$$f'(x) = 6x^2-6 = 0 \\;\\Rightarrow\\; x^2 = 1 \\;\\Rightarrow\\; x = \\pm 1$$ Gefragt ist die negative Extremstelle, also \\(x = -1\\). Beim Wurzelziehen gehören stets beide Vorzeichen dazu." },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+4\\). Welchen \\(y\\)-Wert hat der Hochpunkt?", loesung: 4, toleranz: 0, tipp: "Erst die Extremstellen bestimmen, dann die richtige auswählen und in \\(f\\) einsetzen.", loesungsweg: "Ableiten und faktorisieren: $$f'(x) = 3x^2-6x = 3x(x-2)$$ Die Nullstellen sind \\(x=0\\) und \\(x=2\\). Mit \\(f''(x)=6x-6\\) gilt \\(f''(0) = -6 < 0\\) — bei \\(x=0\\) liegt also der Hochpunkt. Einsetzen in die Funktion: $$f(0) = 0-0+4 = 4$$ Der Hochpunkt ist \\((0;4)\\). Wichtig ist, für den \\(y\\)-Wert in \\(f\\) einzusetzen und nicht in \\(f'\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+4\\). Welchen \\(y\\)-Wert hat der Tiefpunkt?", loesung: 0, toleranz: 0, tipp: "Die zweite Nullstelle der Ableitung gehört zum Tiefpunkt.", loesungsweg: "Aus \\(f'(x) = 3x(x-2)\\) ergeben sich die Stellen \\(x=0\\) und \\(x=2\\). Wegen \\(f''(x)=6x-6\\) ist \\(f''(2) = 6 > 0\\), bei \\(x=2\\) liegt also der Tiefpunkt. Einsetzen: $$f(2) = 8 - 3\\cdot 4 + 4 = 8-12+4 = 0$$ Der Tiefpunkt ist \\((2;0)\\) — er liegt genau auf der \\(x\\)-Achse, \\(x=2\\) ist also zugleich eine doppelte Nullstelle von \\(f\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). Welche \\(x\\)-Koordinate hat der Wendepunkt?", loesung: 2, toleranz: 0, tipp: "Zweimal ableiten, null setzen und den Vorzeichenwechsel prüfen.", loesungsweg: "Zweimal ableiten: $$f'(x) = 3x^2-12x+9, \\qquad f''(x) = 6x-12$$ Null setzen: $$6x-12 = 0 \\;\\Rightarrow\\; x = 2$$ Der Vorzeichenwechsel ist gesichert, denn \\(f''(1) = -6 < 0\\) und \\(f''(3) = 6 > 0\\) — die Krümmung wechselt dort wirklich von rechts nach links. Damit liegt der Wendepunkt bei \\(x=2\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). Welchen \\(y\\)-Wert hat der Wendepunkt?", loesung: 3, toleranz: 0, tipp: "Die gefundene Wendestelle in die Funktion selbst einsetzen, nicht in eine Ableitung.", loesungsweg: "Die Wendestelle ergibt sich aus \\(f''(x) = 6x-12 = 0\\) zu \\(x=2\\). Für die \\(y\\)-Koordinate wird sie in \\(f\\) eingesetzt: $$f(2) = 8 - 6\\cdot 4 + 9\\cdot 2 + 1 = 8-24+18+1 = 3$$ Der Wendepunkt ist also \\((2;3)\\). Ein häufiger Fehler ist das Einsetzen in \\(f''\\) — das liefert nur die Null, die man gerade gefordert hat." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x+2\\). Welche Extrempunkte hat der Graph?", optionen: ["HP \\((-1;4)\\), TP \\((1;0)\\)", "HP \\((1;0)\\), TP \\((-1;4)\\)", "HP \\((0;2)\\), TP \\((2;4)\\)", "nur TP \\((1;0)\\)"], korrekt: 0, tipp: "Beide Nullstellen der Ableitung bestimmen und die Art jeweils über die zweite Ableitung klären.", loesungsweg: "Ableiten und null setzen: $$f'(x) = 3x^2-3 = 0 \\;\\Rightarrow\\; x = \\pm 1$$ Art über \\(f''(x) = 6x\\): bei \\(x=-1\\) ist \\(f''(-1) = -6 < 0\\), also Hochpunkt; bei \\(x=1\\) ist \\(f''(1) = 6 > 0\\), also Tiefpunkt. Funktionswerte: $$f(-1) = -1+3+2 = 4, \\qquad f(1) = 1-3+2 = 0$$ Die Extrempunkte sind damit HP \\((-1;4)\\) und TP \\((1;0)\\)." },
      { id: 18, level: 3, typ: "mc", frage: "Zusätzliche Bedingung für Wendepunkt neben \\(f''=0\\)?", optionen: ["\\(f'=0\\)", "\\(f''' \\neq 0\\) (oder VZW)", "\\(f=0\\)", "\\(f''>0\\)"], korrekt: 1, tipp: "Hinreichende Bedingung.", loesungsweg: "\\(f''(x_0) = 0\\) ist nur notwendig — bei \\(f(x) = x^4\\) etwa ist \\(f''(0) = 0\\), ohne dass ein Wendepunkt vorliegt. Hinzukommen muss, dass die Krümmung dort tatsächlich <b>wechselt</b>: $$f'''(x_0) \\ne 0 \\quad\\text{oder Vorzeichenwechsel von } f''$$ Erst dann ist der Wendepunkt gesichert." },
      // LEVEL 4
      { id: 19, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-3x+2\\) auf dem Intervall \\([-2;3]\\). Welchen Wert hat das globale Maximum?", loesung: 20, toleranz: 0, tipp: "Auf einem abgeschlossenen Intervall kommen zwei Arten von Stellen als Kandidaten in Frage — überlege, welche das sind.", loesungsweg: "Das globale Maximum auf einem abgeschlossenen Intervall wird entweder an einer lokalen Extremstelle oder an einem Rand angenommen. <b>Schritt 1 — innere Kandidaten.</b> $$f'(x) = 3x^2-3 = 0 \\;\\Rightarrow\\; x = 1 \\ \\text{oder}\\ x = -1$$ <b>Schritt 2 — alle Kandidaten auswerten.</b> $$f(-1) = 4, \\quad f(1) = 0, \\quad f(-2) = 0, \\quad f(3) = 20$$ <b>Schritt 3 — vergleichen.</b> Der größte dieser Werte ist \\(20\\); er wird am rechten Rand angenommen. Wer nur die lokalen Extremstellen betrachtet, kommt fälschlich auf \\(4\\) — die Randwerte gehören zwingend dazu." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-3x+2\\) auf dem Intervall \\([-2;3]\\). Welchen Wert hat das globale Minimum?", loesung: 0, toleranz: 0, tipp: "Dieselbe Kandidatenliste wie beim Maximum — diesmal wird der kleinste Wert gesucht.", loesungsweg: "Die Kandidaten sind dieselben wie beim globalen Maximum: die Nullstellen von \\(f'(x)=3x^2-3\\), also \\(x=\\pm 1\\), sowie die beiden Ränder. Werte: $$f(-2) = -8+6+2 = 0, \\quad f(-1) = 4, \\quad f(1) = 0, \\quad f(3) = 20$$ Der kleinste Wert ist \\(0\\). Bemerkenswert: er wird an <b>zwei</b> Stellen angenommen, am linken Rand \\(x=-2\\) und an der lokalen Minimumstelle \\(x=1\\). Ein globaler Extremwert kann also durchaus mehrfach auftreten." },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+12x-8\\). Welchen \\(y\\)-Wert hat der Wendepunkt an der Stelle \\(x=2\\)?", loesung: 0, toleranz: 0, tipp: "Für die \\(y\\)-Koordinate wird in die Funktion selbst eingesetzt, nicht in eine ihrer Ableitungen.", loesungsweg: "<b>Nachweis, dass es wirklich ein Wendepunkt ist.</b> $$f'(x) = 3x^2-12x+12, \\qquad f''(x) = 6x-12$$ Es gilt \\(f''(2) = 0\\), und wegen \\(f'''(x) = 6 \\neq 0\\) liegt ein Vorzeichenwechsel vor — Kontrolle: \\(f''(1) = -6\\) und \\(f''(3) = 6\\). <b>\\(y\\)-Koordinate.</b> Einsetzen in \\(f\\): $$f(2) = 8 - 24 + 24 - 8 = 0$$ Der Wendepunkt ist \\((2;0)\\). Er ist hier zugleich Sattelpunkt, denn auch \\(f'(2) = 12-24+12 = 0\\); der Funktionsterm ist nämlich \\((x-2)^3\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Für \\(f(x)=x^4-2x^2\\) wurde \\(f'(0)=0\\) und \\(f''(0)=-4\\) ermittelt. Was folgt daraus für die Stelle \\(x=0\\)?", optionen: ["ein lokales Maximum", "ein lokales Minimum", "ein Wendepunkt", "gar keine Aussage"], korrekt: 0, tipp: "Die erste Angabe ist die notwendige Bedingung; entscheide mit der zweiten über die Art des Extremums.", loesungsweg: "Die notwendige Bedingung \\(f'(0)=0\\) ist erfüllt, an der Stelle liegt also eine waagerechte Tangente. Über die Art entscheidet das Vorzeichen der zweiten Ableitung: $$f''(0) = -4 < 0 \\;\\Rightarrow\\; \\text{Rechtskrümmung} \\;\\Rightarrow\\; \\text{lokales Maximum}$$ Anschaulich: der Graph ist dort nach unten geöffnet, links steigt er, rechts fällt er. Kontrolle über \\(f'(x) = 4x^3-4x = 4x(x-1)(x+1)\\): für \\(x\\) knapp unter null ist \\(f'\\) positiv, knapp darüber negativ — Vorzeichenwechsel von plus nach minus, also wirklich ein Hochpunkt mit \\(f(0)=0\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(f(x)=2x^3-9x^2+12x-4\\). Welchen \\(y\\)-Wert hat der Wendepunkt an der Stelle \\(x=1{,}5\\)?", loesung: 0.5, toleranz: 0.02, tipp: "Die \\(y\\)-Koordinate eines Punktes ist immer der Funktionswert an dieser Stelle.", loesungsweg: "<b>Nachweis.</b> $$f'(x) = 6x^2-18x+12, \\qquad f''(x) = 12x-18$$ Aus \\(12x-18=0\\) folgt \\(x=1{,}5\\), und mit \\(f''(1) = -6\\) sowie \\(f''(2) = 6\\) ist der Vorzeichenwechsel gesichert. <b>\\(y\\)-Koordinate.</b> Einsetzen in \\(f\\): $$f(1{,}5) = 2\\cdot 3{,}375 - 9\\cdot 2{,}25 + 18 - 4 = 6{,}75 - 20{,}25 + 14 = 0{,}5$$ Der Wendepunkt ist \\((1{,}5;0{,}5)\\). Er liegt genau in der Mitte zwischen den beiden Extremstellen \\(x=1\\) und \\(x=2\\) — das gilt bei jeder Funktion dritten Grades." },
      { id: 24, level: 4, typ: "mc", frage: "Kann der Graph einer ganzrationalen Funktion dritten Grades auf ganz \\(\\mathbb{R}\\) ein globales Maximum besitzen?", optionen: ["Ja, immer", "Nein, nie", "Nur bei negativem Leitkoeffizienten", "Nur wenn zwei Extremstellen vorhanden sind"], korrekt: 1, tipp: "Überlege, welche Werte der Funktionsterm für sehr große und sehr kleine \\(x\\) annimmt.", loesungsweg: "Bei einer Funktion dritten Grades bestimmt das Glied \\(ax^3\\) das Verhalten für betragsgroße \\(x\\). Ist \\(a\\) positiv, so wachsen die Werte für \\(x \\to \\infty\\) über jede Schranke; ist \\(a\\) negativ, so tun sie das für \\(x \\to -\\infty\\). In beiden Fällen gibt es also beliebig große Funktionswerte, und ein globales Maximum kann es nicht geben — unabhängig davon, ob lokale Extrempunkte vorhanden sind. Beispiel \\(f(x)=-x^3+3x\\): der Hochpunkt \\((1;2)\\) ist nur lokal, denn \\(f(-10) = 970\\) ist weit größer. Auf einem <b>abgeschlossenen Intervall</b> sieht es anders aus; dort existiert ein globales Maximum stets." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x)=x^3+ax^2+bx\\) hat bei \\(x=1\\) einen Hochpunkt und bei \\(x=3\\) einen Tiefpunkt. Bestimme \\(a\\).", loesung: -6, toleranz: 0, tipp: "Beide Angaben sind Bedingungen an dieselbe Ableitung — stelle daraus zwei Gleichungen auf.", loesungsweg: "Die Ableitung ist \\(f'(x) = 3x^2+2ax+b\\). Beide Extremstellen sind Nullstellen von \\(f'\\): $$f'(1) = 3+2a+b = 0 \\qquad f'(3) = 27+6a+b = 0$$ Subtraktion der ersten von der zweiten Gleichung: $$24+4a = 0 \\;\\Rightarrow\\; a = -6$$ Einsetzen liefert \\(b = -3-2a = 9\\). Kontrolle: \\(f'(x) = 3x^2-12x+9 = 3(x-1)(x-3)\\) hat wirklich die Nullstellen \\(1\\) und \\(3\\); mit \\(f''(x) = 6x-12\\) ist \\(f''(1) = -6 < 0\\) (Hochpunkt) und \\(f''(3) = 6 > 0\\) (Tiefpunkt) — die Zuordnung stimmt." },
      { id: 26, level: 5, typ: "mc", frage: "Ein Schüler untersucht \\(f(x)=x^3-6x^2+9x\\), findet aus \\(f'(x)=3x^2-12x+9=0\\) die Stellen \\(x=1\\) und \\(x=3\\) und schreibt: „Bei \\(x=1\\) liegt ein Tiefpunkt, bei \\(x=3\\) ein Hochpunkt.“ Beurteile das.", optionen: ["Falsch: \\(f''(1)=-6<0\\) und \\(f''(3)=6>0\\), die beiden Arten sind vertauscht.", "Richtig: die kleinere Extremstelle gehört stets zum Tiefpunkt der Funktion.", "Falsch: an beiden Stellen liegt wegen \\(f''(2)=0\\) in Wahrheit je ein Sattelpunkt.", "Falsch: die Ableitung hat gar keine Nullstellen, es gibt also überhaupt kein Extremum."], korrekt: 0, tipp: "Die Stellen sind richtig bestimmt — geprüft werden muss die hinreichende Bedingung an jeder der beiden Stellen.", loesungsweg: "Die notwendige Bedingung ist korrekt ausgewertet: \\(3x^2-12x+9 = 3(x-1)(x-3)\\) hat die Nullstellen \\(1\\) und \\(3\\). Über die Art entscheidet die zweite Ableitung \\(f''(x) = 6x-12\\): $$f''(1) = -6 < 0 \\ \\Rightarrow\\ \\text{Hochpunkt}, \\qquad f''(3) = 6 > 0 \\ \\Rightarrow\\ \\text{Tiefpunkt}$$ Die Zuordnung ist also genau vertauscht: Hochpunkt \\((1;4)\\), Tiefpunkt \\((3;0)\\). Bei einer Funktion dritten Grades mit positivem Leitkoeffizienten kommt immer zuerst der Hochpunkt und danach der Tiefpunkt — die Regel „kleinere Stelle gleich Tiefpunkt“ gibt es nicht." },
      { id: 27, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+3x+2\\). Wie viele lokale Extrempunkte hat der Graph?", loesung: 0, toleranz: 0, tipp: "Die notwendige Bedingung allein genügt nicht — prüfe an jeder gefundenen Stelle den Vorzeichenwechsel.", loesungsweg: "Ableiten und als Quadrat schreiben: $$f'(x) = 3x^2-6x+3 = 3\\left(x^2-2x+1\\right) = 3(x-1)^2$$ Die notwendige Bedingung \\(f'(x)=0\\) ist nur bei \\(x=1\\) erfüllt. Dort wechselt \\(f'\\) aber <b>nicht</b> das Vorzeichen: \\(f'(0) = 3 > 0\\) und \\(f'(2) = 3 > 0\\). Auch die zweite Ableitung hilft nicht weiter, denn \\(f''(x) = 6x-6\\) ist bei \\(x=1\\) ebenfalls null. Ohne Vorzeichenwechsel liegt kein Extremum vor, sondern ein Sattelpunkt — die Anzahl der lokalen Extrempunkte ist $$0$$ Wer nach \\(f'=0\\) aufhört, zählt hier fälschlich einen Extrempunkt." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-4x^3\\). Welchen \\(y\\)-Wert hat der Wendepunkt mit der größeren \\(x\\)-Koordinate?", loesung: -16, toleranz: 0, tipp: "Erst beide Wendestellen bestimmen und den Vorzeichenwechsel prüfen, dann die größere in \\(f\\) einsetzen.", loesungsweg: "Zweimal ableiten und faktorisieren: $$f'(x) = 4x^3-12x^2, \\qquad f''(x) = 12x^2-24x = 12x(x-2)$$ Die Nullstellen sind \\(x=0\\) und \\(x=2\\). Beide sind einfache Nullstellen der nach oben geöffneten Parabel \\(f''\\), dort wechselt das Vorzeichen jeweils: \\(f''(-1)=36>0\\), \\(f''(1)=-12<0\\), \\(f''(3)=36>0\\). Es sind also wirklich zwei Wendestellen. Die größere ist \\(x=2\\): $$f(2) = 16 - 4\\cdot 8 = 16-32 = -16$$ Der gesuchte Wendepunkt ist \\((2;-16)\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x)=ax^3+bx^2\\) hat bei \\(x=2\\) einen Wendepunkt, und es gilt \\(f(2)=-8\\). Bestimme \\(a\\).", loesung: 0.5, toleranz: 0.01, tipp: "Die Wendepunktangabe verknüpft beide Parameter; setze diese Beziehung in die Wertbedingung ein.", loesungsweg: "<b>Schritt 1.</b> Aus \\(f''(x) = 6ax+2b\\) und \\(f''(2)=0\\) folgt $$12a+2b = 0 \\;\\Rightarrow\\; b = -6a$$ <b>Schritt 2.</b> Die Wertbedingung lautet \\(f(2) = 8a+4b = -8\\). Einsetzen von \\(b=-6a\\): $$8a - 24a = -8 \\;\\Rightarrow\\; -16a = -8 \\;\\Rightarrow\\; a = 0{,}5$$ und damit \\(b = -3\\). Kontrolle mit \\(f(x)=0{,}5x^3-3x^2\\): \\(f(2) = 4-12 = -8\\); \\(f''(x) = 3x-6\\) wird bei \\(x=2\\) null und wechselt dort das Vorzeichen (\\(f''(1)=-3\\), \\(f''(3)=3\\)) — es ist wirklich ein Wendepunkt." },
      { id: 30, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x)=x^3+ax^2+bx+c\\) hat bei \\(x=2\\) einen Sattelpunkt und es gilt \\(f(2)=1\\). Bestimme \\(b\\).", loesung: 12, toleranz: 0, tipp: "Ein Sattelpunkt erfüllt zwei Bedingungen gleichzeitig; welche das sind, entscheidet die Reihenfolge der Rechnung.", loesungsweg: "Ein Sattelpunkt ist eine Wendestelle mit waagerechter Tangente, also gilt dort \\(f'(2)=0\\) <b>und</b> \\(f''(2)=0\\). <b>Schritt 1.</b> Aus \\(f''(x) = 6x+2a\\) folgt $$12+2a = 0 \\;\\Rightarrow\\; a = -6$$ <b>Schritt 2.</b> Mit \\(f'(x) = 3x^2-12x+b\\) und \\(f'(2)=0\\): $$12-24+b = 0 \\;\\Rightarrow\\; b = 12$$ Kontrolle: \\(f'(x) = 3x^2-12x+12 = 3(x-2)^2\\) — die Ableitung berührt die Achse bei \\(x=2\\) ohne Vorzeichenwechsel, es liegt also kein Extremum, sondern wirklich ein Sattelpunkt vor. Die dritte Bedingung \\(f(2)=1\\) legt nur noch \\(c\\) fest und wird für \\(b\\) nicht gebraucht." },
      // LEVEL 6
      { id: 31, level: 6, typ: "mc", frage: "Der Gewinn eines Betriebs wird durch \\(G(x)=-x^3+9x^2+21x-100\\) beschrieben (\\(x\\) in \\(100\\) Stück, \\(x\\ge 0\\)). Beurteile die Behauptung: „Der Gewinn ist bei \\(x=7\\) am größten.“", optionen: ["Richtig: \\(G'(x)=-3(x-7)(x+1)\\) wechselt bei \\(x=7\\) von plus nach minus.", "Falsch: \\(G'(7)=0\\) allein genügt nicht, und \\(G''(7)=-24\\) zeigt ein Minimum an.", "Falsch: der größte Gewinn liegt am Rand bei \\(x=0\\), denn dort ist \\(G'\\) am größten.", "Richtig, weil \\(G(7)=145\\) der größte ganzzahlige Funktionswert im Modell ist."], korrekt: 0, tipp: "Prüfe erst die notwendige Bedingung und danach, ob die Ableitung dort wirklich von plus nach minus wechselt.", loesungsweg: "Ableiten und faktorisieren: $$G'(x) = -3x^2+18x+21 = -3\\left(x^2-6x-7\\right) = -3(x-7)(x+1)$$ Im zulässigen Bereich \\(x\\ge 0\\) ist nur \\(x=7\\) eine Nullstelle. Vorzeichenwechsel: \\(G'(6) = -108+108+21 = 21 > 0\\) und \\(G'(8) = -192+144+21 = -27 < 0\\) — also von plus nach minus, das bedeutet ein Maximum. Bestätigung über \\(G''(x) = -6x+18\\): \\(G''(7) = -24 < 0\\), Rechtskrümmung, also Hochpunkt. Der größte Gewinn beträgt \\(G(7) = -343+441+147-100 = 145\\); am Rand ist \\(G(0) = -100\\) deutlich kleiner. Die Behauptung stimmt." },
      { id: 32, level: 6, typ: "numerisch", frage: "Die Wirkstoffmenge im Blut wird für \\(t\\ge 0\\) durch \\(K(t)=-t^3+9t^2+48t\\) beschrieben (\\(t\\) in Stunden). Nach wie vielen Stunden ist sie am größten?", loesung: 8, toleranz: 0, tipp: "Übersetze „am größten“ in eine Bedingung an die Ableitung und begründe danach, dass es wirklich ein Maximum ist.", loesungsweg: "<b>Schritt 1 — notwendige Bedingung.</b> $$K'(t) = -3t^2+18t+48 = -3\\left(t^2-6t-16\\right) = -3(t-8)(t+2)$$ Nullstellen sind \\(t=8\\) und \\(t=-2\\); nur \\(t=8\\) liegt im betrachteten Bereich. <b>Schritt 2 — hinreichende Bedingung.</b> \\(K''(t) = -6t+18\\), also $$K''(8) = -48+18 = -30 < 0$$ Rechtskrümmung bedeutet Hochpunkt. Gleichwertig der Vorzeichenwechsel: \\(K'(6) = -108+108+48 = 48 > 0\\), \\(K'(10) = -300+180+48 = -72 < 0\\). <b>Schritt 3 — Rand.</b> Am Rand ist \\(K(0) = 0\\), der Wert \\(K(8) = -512+576+384 = 448\\) ist größer. Die Wirkstoffmenge ist also nach \\(8\\) Stunden am größten." },
      { id: 33, level: 6, typ: "numerisch", frage: "Für wie viele ganze Zahlen \\(c\\) mit \\(-3\\le c\\le 3\\) hat der Graph von \\(f(x)=x^3+cx\\) genau zwei Extrempunkte?", loesung: 3, toleranz: 0, tipp: "Untersuche die Nullstellen der Ableitung getrennt für negatives, für verschwindendes und für positives \\(c\\).", loesungsweg: "Die Ableitung ist \\(f'(x) = 3x^2+c\\). <b>Fall \\(c<0\\):</b> \\(3x^2 = -c\\) liefert zwei Lösungen \\(x = \\pm\\sqrt{-c/3}\\); die nach oben geöffnete Parabel \\(f'\\) wechselt an beiden Stellen das Vorzeichen — zwei Extrempunkte. <b>Fall \\(c=0\\):</b> \\(f'(x) = 3x^2\\) hat nur die Nullstelle \\(x=0\\), und zwar ohne Vorzeichenwechsel — kein Extrempunkt, sondern ein Sattelpunkt. Dieser Grenzfall wird leicht mitgezählt. <b>Fall \\(c>0\\):</b> \\(f'(x)\\ge c > 0\\), gar keine Nullstelle — kein Extrempunkt. Genau zwei Extrempunkte gibt es also nur für \\(c<0\\), im Bereich \\(-3\\le c\\le 3\\) sind das \\(c=-3\\), \\(c=-2\\) und \\(c=-1\\), also $$3 \\text{ Zahlen}$$" },
      { id: 34, level: 6, typ: "numerisch", frage: "Die Zahl der Bäume in einer Aufforstungsfläche wird für \\(0\\le t\\le 18\\) durch \\(N(t)=-t^3+21t^2+150t\\) beschrieben (\\(t\\) in Jahren). Nach wie vielen Jahren wächst der Bestand am schnellsten?", loesung: 7, toleranz: 0, tipp: "Gefragt ist nicht nach dem größten Bestand, sondern nach der größten Zuwachsrate — das ist eine Bedingung an die Ableitung der Ableitung.", loesungsweg: "Die Zuwachsrate ist \\(N'\\); gesucht ist die Stelle, an der <b>sie</b> ihren größten Wert annimmt. Das ist eine Extremstelle von \\(N'\\) und damit eine Wendestelle von \\(N\\). <b>Schritt 1.</b> $$N'(t) = -3t^2+42t+150, \\qquad N''(t) = -6t+42$$ <b>Schritt 2 — notwendige Bedingung.</b> $$-6t+42 = 0 \\;\\Rightarrow\\; t = 7$$ <b>Schritt 3 — hinreichende Bedingung.</b> \\(N''(6) = 6 > 0\\) und \\(N''(8) = -6 < 0\\): die Zuwachsrate steigt bis \\(t=7\\) und fällt danach, dort liegt also wirklich ihr größter Wert. Gleichwertig: \\(N'''(t) = -6 \\neq 0\\). <b>Ergebnis.</b> Nach \\(7\\) Jahren ist der Zuwachs am größten, nämlich $$N'(7) = -147+294+150 = 297 \\text{ Bäume pro Jahr}$$ Der Bestand selbst ist zu diesem Zeitpunkt mit \\(N(7) = 1736\\) noch lange nicht am größten — Bestand und Zuwachsrate dürfen nicht verwechselt werden." },
      { id: 35, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x)=ax^4+bx^2\\) hat an der Stelle \\(x=1\\) einen Extrempunkt mit dem Funktionswert \\(-2\\). Bestimme \\(a\\).", loesung: 2, toleranz: 0, tipp: "Die Lage des Extrempunkts ist eine Bedingung an die Ableitung, der Funktionswert eine an \\(f\\) selbst.", loesungsweg: "<b>Schritt 1.</b> Aus \\(f'(x) = 4ax^3+2bx\\) und \\(f'(1)=0\\) folgt $$4a+2b = 0 \\;\\Rightarrow\\; b = -2a$$ <b>Schritt 2.</b> Aus \\(f(1) = a+b = -2\\) wird damit $$a - 2a = -2 \\;\\Rightarrow\\; -a = -2 \\;\\Rightarrow\\; a = 2$$ und folglich \\(b = -4\\). <b>Kontrolle.</b> Mit \\(f(x) = 2x^4-4x^2\\) ist \\(f'(x) = 8x^3-8x = 8x(x-1)(x+1)\\), die Stelle \\(x=1\\) ist also wirklich Nullstelle der Ableitung. Wegen \\(f''(x) = 24x^2-8\\) und \\(f''(1) = 16 > 0\\) liegt dort ein Tiefpunkt, und \\(f(1) = 2-4 = -2\\) stimmt mit der Vorgabe überein." },
      { id: 36, level: 6, typ: "mc", frage: "Ein Gewinnmodell lautet \\(G(x)=x^4-4x^3+6x^2-4x+4\\). Ein Praktikant rechnet \\(G'(1)=0\\) und \\(G''(1)=0\\) aus und schließt: „Bei \\(x=1\\) liegt ein Sattelpunkt, dort gibt es also weder den größten noch den kleinsten Gewinn.“ Beurteile das.", optionen: ["Falsch: \\(G(x)=(x-1)^4+3\\), und \\(G'\\) wechselt bei \\(x=1\\) von minus nach plus — es ist ein Tiefpunkt.", "Richtig: sobald erste und zweite Ableitung zugleich null sind, liegt stets ein Sattelpunkt vor.", "Falsch: der Praktikant hat sich verrechnet, denn \\(G'(1)=4\\) ist gar nicht null und es gibt kein Extremum.", "Richtig, aber nur weil der Grad gerade ist; bei ungeradem Grad wäre es ein lokales Maximum gewesen."], korrekt: 0, tipp: "Wenn die zweite Ableitung null ist, sagt sie nichts aus — entscheide über den Vorzeichenwechsel der ersten Ableitung.", loesungsweg: "Die Rechnung des Praktikanten stimmt, sein Schluss nicht. Aus \\(G''(x_0)=0\\) folgt <b>weder</b> ein Sattelpunkt noch ein Extremum — das Kriterium versagt in diesem Fall einfach. Entscheidend ist der Vorzeichenwechsel von \\(G'\\): $$G'(x) = 4x^3-12x^2+12x-4 = 4(x-1)^3$$ Für \\(x\\) kleiner als \\(1\\) ist \\((x-1)^3\\) negativ, für \\(x\\) größer als \\(1\\) positiv — also Wechsel von minus nach plus und damit ein <b>Tiefpunkt</b>. Kontrolle: \\(G'(0) = -4\\) und \\(G'(2) = 4\\). Der Term lässt sich als \\(G(x) = (x-1)^4+3\\) schreiben, woraus der kleinste Gewinn \\(G(1)=3\\) unmittelbar abzulesen ist. Bei \\(x=1\\) liegt also gerade der kleinste Gewinn — das Gegenteil der Behauptung." }];
