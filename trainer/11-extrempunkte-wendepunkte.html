<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrem- & Wendepunkte - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-extrempunkte-wendepunkte';
    const THEMA_CONFIG = { name: 'Extrem- & Wendepunkte', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "numerisch", frage: "\\(f(x)=x^2-6x+5\\). Stelle mit \\(f'(x)=0\\)?", loesung: 3, toleranz: 0, tipp: "Ableiten, null setzen.", loesungsweg: "\\(f'(x)=2x-6=0 \\Rightarrow x=3\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "\\(f(x)=x^2-4x+3\\). Wie viele Extremstellen?", loesung: 1, toleranz: 0, tipp: "Quadratisch.", loesungsweg: "\\(f'(x)=2x-4=0 \\Rightarrow x=2\\); Minimum. 1 Stelle." },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(f(x)=-x^2+8x-12\\). Extremstelle?", loesung: 4, toleranz: 0, tipp: "\\(f'=0\\).", loesungsweg: "\\(-2x+8=0 \\Rightarrow x=4\\)." },
      { id: 4, level: 1, typ: "mc", frage: "\\(f(x)=x^2+2x+1\\). Art des Extremums?", optionen: ["Hochpunkt", "Tiefpunkt", "Sattelpunkt", "keines"], korrekt: 1, tipp: "Koeffizient vor \\(x^2\\).", loesungsweg: "Positiv → Parabel nach oben → Tiefpunkt." },
      { id: 5, level: 1, typ: "numerisch", frage: "\\(f(x)=3x^2-12x+7\\). Nullstelle von \\(f'\\)?", loesung: 2, toleranz: 0, tipp: "\\(6x-12=0\\).", loesungsweg: "$$f'(x) = 6x-12 = 0 \\;\\Rightarrow\\; x = 2$$ Bei einer Parabel ist das zugleich die Scheitelstelle — die einzige Stelle mit waagerechter Tangente." },
      { id: 6, level: 1, typ: "mc", frage: "Notwendige Bedingung für Extremstelle?", optionen: ["\\(f(x)=0\\)", "\\(f'(x)=0\\)", "\\(f''(x)=0\\)", "\\(f'(x)>0\\)"], korrekt: 1, tipp: "Waagerechte Tangente.", loesungsweg: "An einer Extremstelle verläuft die Tangente waagerecht, die Steigung ist dort also null: $$f'(x_0) = 0$$ Diese Bedingung ist <b>notwendig</b>, aber nicht hinreichend: Auch ein Sattelpunkt wie bei \\(f(x) = x^3\\) in \\(x_0 = 0\\) erfüllt sie, ohne ein Extremum zu sein." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-3x\\). Anzahl Extremstellen?", loesung: 2, toleranz: 0, tipp: "\\(f'=3x^2-3\\).", loesungsweg: "$$f'(x) = 3x^2-3 = 3(x^2-1) = 0 \\;\\Rightarrow\\; x = \\pm 1$$ Also <b>zwei</b> Extremstellen. An beiden wechselt \\(f'\\) das Vorzeichen, es handelt sich also wirklich um Extrema: ein Hochpunkt bei \\(-1\\), ein Tiefpunkt bei \\(1\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-12x+2\\). Positive Extremstelle?", loesung: 2, toleranz: 0, tipp: "\\(f'=3x^2-12\\).", loesungsweg: "\\(x^2=4 \\Rightarrow x=\\pm 2\\). Positiv: 2." },
      { id: 9, level: 2, typ: "mc", frage: "\\(f(x)=x^3-3x\\). Art des Extremums bei \\(x=1\\)?", optionen: ["Hochpunkt", "Tiefpunkt", "Wendepunkt", "Sattelpunkt"], korrekt: 1, tipp: "\\(f''(1)\\)?", loesungsweg: "\\(f''(x)=6x\\), \\(f''(1)=6>0\\) → Tiefpunkt." },
      { id: 10, level: 2, typ: "mc", frage: "\\(f''(x_0)<0\\) und \\(f'(x_0)=0\\). Folgerung?", optionen: ["Tiefpunkt", "Hochpunkt", "Wendepunkt", "keine Aussage"], korrekt: 1, tipp: "Hinreichend.", loesungsweg: "Ist \\(f'(x_0) = 0\\) und zusätzlich \\(f''(x_0) < 0\\), so ist der Graph dort rechtsgekrümmt — er öffnet sich nach unten: $$\\Rightarrow \\text{Hochpunkt}$$ Umgekehrt ergäbe \\(f''(x_0) > 0\\) einen Tiefpunkt. Diese Bedingung ist hinreichend, eine weitere Prüfung erübrigt sich." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). \\(f''(1)\\)?", loesung: -6, toleranz: 0, tipp: "\\(f''=6x-12\\).", loesungsweg: "Zweimal ableiten: \\(f'(x) = 3x^2-12x+9\\), also \\(f''(x) = 6x-12\\). $$f''(1) = 6-12 = -6$$ Weil \\(f'(1) = 3-12+9 = 0\\) ist und \\(f''(1) < 0\\), liegt bei \\(x = 1\\) sogar ein Hochpunkt." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(f(x)=2x^3-6x\\). Negative Extremstelle?", loesung: -1, toleranz: 0, tipp: "\\(6x^2-6=0\\).", loesungsweg: "$$f'(x) = 6x^2-6 = 0 \\;\\Rightarrow\\; x^2 = 1 \\;\\Rightarrow\\; x = \\pm 1$$ Gefragt ist die negative Extremstelle, also \\(x = -1\\). Beim Wurzelziehen gehören stets beide Vorzeichen dazu." },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+4\\). y-Wert des Hochpunkts?", loesung: 4, toleranz: 0, tipp: "\\(f'=3x(x-2)\\).", loesungsweg: "\\(f''(0)=-6<0\\) → HP bei \\(x=0\\). \\(f(0)=4\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+4\\). y-Wert des Tiefpunkts?", loesung: 0, toleranz: 0, tipp: "TP bei \\(x=2\\).", loesungsweg: "\\(f(2)=8-12+4=0\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). x-Koordinate des Wendepunkts?", loesung: 2, toleranz: 0, tipp: "\\(f''=0\\).", loesungsweg: "\\(6x-12=0 \\Rightarrow x=2\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). y-Wert des Wendepunkts?", loesung: 3, toleranz: 0, tipp: "\\(f(2)\\).", loesungsweg: "\\(f(2)=8-24+18+1=3\\)." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x+2\\). Welche Extrempunkte?", optionen: ["HP \\((-1|4)\\), TP \\((1|0)\\)", "HP \\((1|0)\\), TP \\((-1|4)\\)", "TP \\((0|2)\\)", "HP \\((-1|4)\\), TP \\((1|2)\\)"], korrekt: 0, tipp: "\\(f'=3x^2-3\\).", loesungsweg: "\\(x=\\pm 1\\). \\(f''(-1)=-6\\) HP, \\(f(-1)=4\\). \\(f''(1)=6\\) TP, \\(f(1)=0\\)." },
      { id: 18, level: 3, typ: "mc", frage: "Zusätzliche Bedingung für Wendepunkt neben \\(f''=0\\)?", optionen: ["\\(f'=0\\)", "\\(f''' \\neq 0\\) (oder VZW)", "\\(f=0\\)", "\\(f''>0\\)"], korrekt: 1, tipp: "Hinreichende Bedingung.", loesungsweg: "\\(f''(x_0) = 0\\) ist nur notwendig — bei \\(f(x) = x^4\\) etwa ist \\(f''(0) = 0\\), ohne dass ein Wendepunkt vorliegt. Hinzukommen muss, dass die Krümmung dort tatsächlich <b>wechselt</b>: $$f'''(x_0) \\ne 0 \\quad\\text{oder Vorzeichenwechsel von } f''$$ Erst dann ist der Wendepunkt gesichert." },
      // LEVEL 4
      { id: 19, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-3x+2\\) auf \\([-2;3]\\). Globales Maximum?", loesung: 20, toleranz: 0, tipp: "Randwerte prüfen.", loesungsweg: "Kandidaten: \\(f(-1)=4, f(1)=0, f(-2)=0, f(3)=20\\). Max: 20." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-3x+2\\) auf \\([-2;3]\\). Globales Minimum?", loesung: 0, toleranz: 0, tipp: "Kandidaten vergleichen.", loesungsweg: "Min: 0 (bei \\(x=1\\) und \\(x=-2\\))." },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+12x-8\\). y-Wert des Wendepunkts bei \\(x=2\\)?", loesung: 0, toleranz: 0, tipp: "\\(f''(2)=0\\) prüfen.", loesungsweg: "\\(f''=6x-12\\), \\(f''(2)=0\\), \\(f'''=6\\neq 0\\). \\(f(2)=0\\)." },
      { id: 22, level: 4, typ: "mc", frage: "\\(f(x)=x^4-2x^2\\): \\(f'(0)=0\\), \\(f''(0)=-4\\). Was folgt?", optionen: ["lokales Maximum bei 0", "lokales Minimum bei 0", "Wendepunkt bei 0", "keine Aussage"], korrekt: 0, tipp: "Hinreichend.", loesungsweg: "Die notwendige Bedingung \\(f'(0) = 0\\) ist erfüllt, und die zweite Ableitung ist negativ: $$f''(0) = -4 < 0 \\;\\Rightarrow\\; \\text{lokales Maximum bei } x = 0$$ Der Graph ist dort rechtsgekrümmt. Es handelt sich um ein <b>lokales</b> Maximum — global nimmt \\(f\\) an den beiden Tiefpunkten kleinere, für große \\(|x|\\) aber weit größere Werte an." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(f(x)=2x^3-9x^2+12x-4\\). y-Wert des Wendepunkts bei \\(x=1{,}5\\)?", loesung: 0.5, toleranz: 0.02, tipp: "\\(f(1{,}5)\\).", loesungsweg: "\\(f(1{,}5)=6{,}75-20{,}25+18-4=0{,}5\\)." },
      { id: 24, level: 4, typ: "mc", frage: "Kann ein Polynom 3. Grades auf \\(\\mathbb{R}\\) ein globales Maximum haben?", optionen: ["Ja, immer", "Nein", "Nur bei negativem Leitkoeff.", "Nur bei geradem Grad"], korrekt: 1, tipp: "Verhalten für \\(x\\to\\pm\\infty\\).", loesungsweg: "Wegen \\(\\pm\\infty\\)-Verhalten: kein globales Maximum/Minimum." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-4x^3+4x^2\\). Anzahl lokaler Extremstellen?", loesung: 3, toleranz: 0, tipp: "\\(f'=4x(x-1)(x-2)\\).", loesungsweg: "3 Nullstellen mit VZW-Analyse: TP bei 0 und 2, HP bei 1." },
      { id: 26, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2+16\\). y-Wert des lokalen Maximums?", loesung: 16, toleranz: 0, tipp: "HP bei \\(x=0\\).", loesungsweg: "\\(f''(0)=-16<0\\) HP. \\(f(0)=16\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). Anzahl Wendepunkte?", loesung: 2, toleranz: 0, tipp: "\\(f''=12x^2-16\\).", loesungsweg: "Zwei Lösungen mit VZW." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+4\\). x-Koordinate des Wendepunkts?", loesung: 1, toleranz: 0, tipp: "\\(f''=6x-6\\).", loesungsweg: "$$f'(x) = 3x^2-6x \\;\\Rightarrow\\; f''(x) = 6x-6 = 0 \\;\\Rightarrow\\; x = 1$$ Wegen \\(f'''(x) = 6 \\ne 0\\) liegt dort wirklich ein Wendepunkt." },
      { id: 29, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-4x^2\\). Anzahl lokaler Extrempunkte?", loesung: 3, toleranz: 0, tipp: "\\(f'=4x^3-8x=4x(x^2-2)\\).", loesungsweg: "$$f'(x) = 4x^3-8x = 4x(x^2-2) = 0 \\;\\Rightarrow\\; x = 0,\\; x = \\pm\\sqrt2$$ Das sind <b>drei</b> Stellen, und an allen wechselt \\(f'\\) das Vorzeichen: zwei Tiefpunkte bei \\(\\pm\\sqrt2\\), dazwischen ein Hochpunkt bei \\(0\\). Diese W-Form ist typisch für Funktionen vierten Grades mit positivem Leitkoeffizienten." },
      { id: 30, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x\\). y-Wert des Hochpunkts?", loesung: 4, toleranz: 0, tipp: "HP bei \\(x=1\\).", loesungsweg: "\\(f(1)=1-6+9=4\\)." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x\\). y-Wert des Tiefpunkts?", loesung: 0, toleranz: 0, tipp: "TP bei \\(x=3\\).", loesungsweg: "\\(f(3)=27-54+27=0\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{4}x^4-2x^2\\). Summe aller x-Koordinaten der Extremstellen?", loesung: 0, toleranz: 0, tipp: "Symmetrie!", loesungsweg: "$$f'(x) = x^3-4x = x(x-2)(x+2) = 0 \\;\\Rightarrow\\; x = -2,\\,0,\\,2$$ $$(-2) + 0 + 2 = 0$$ Das Ergebnis folgt auch ohne Rechnung: Die Funktion enthält nur gerade Exponenten, ist also achsensymmetrisch — zu jeder Extremstelle gehört eine gespiegelte, die sie in der Summe aufhebt." },
      { id: 33, level: 6, typ: "mc", frage: "\\(f(x)=x^3\\). Was gilt bei \\(x=0\\)?", optionen: ["Hochpunkt", "Tiefpunkt", "Sattelpunkt (WP mit waagerechter Tangente)", "kein besonderer Punkt"], korrekt: 2, tipp: "\\(f'(0)=0\\) aber kein VZW von \\(f'\\).", loesungsweg: "Sattelpunkt: waagerechte Tangente und Wendepunkt." },
      { id: 34, level: 6, typ: "numerisch", frage: "\\(f(x)=x^4-4x^3+6x^2\\). Anzahl Wendepunkte?", loesung: 0, toleranz: 0, tipp: "\\(f''=12x^2-24x+12=12(x-1)^2\\).", loesungsweg: "\\(f'(x)=4x^3-12x^2+12x\\), \\(f''(x)=12x^2-24x+12=12(x-1)^2\\). Doppelte Nullstelle bei \\(x=1\\), aber \\(f''(x)=12(x-1)^2\\geq 0\\) ohne Vorzeichenwechsel → kein Wendepunkt. Also 0." },
      { id: 35, level: 6, typ: "numerisch", frage: "\\(f(x)=x^4-4x^2\\). y-Wert der Tiefpunkte?", loesung: -4, toleranz: 0, tipp: "TP bei \\(x=\\pm\\sqrt 2\\).", loesungsweg: "\\(f(\\sqrt 2)=4-8=-4\\)." },
      { id: 36, level: 6, typ: "mc", frage: "\\(f'(x_0)=0\\) und \\(f''(x_0)=0\\). Was kann vorliegen?", optionen: ["Nur Hochpunkt", "Sattelpunkt oder Extremum", "immer Wendepunkt", "nie Extremum"], korrekt: 1, tipp: "Test reicht nicht, Höhere Ableitungen prüfen.", loesungsweg: "Weitere Untersuchung nötig (VZW von \\(f'\\)): Sattelpunkt oder Extremum möglich." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
