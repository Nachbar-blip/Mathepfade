      { id:31, level:6, typ:"numerisch",
        frage:"Ein Tunnel verläuft geradlinig von \\(A(0|0|0)\\) nach \\(B(60|0|-20)\\) (Angaben in Metern). Bei einer Sondierungsbohrung wird der Messpunkt \\(M(30|24|-10)\\) erreicht. Zeigen Sie, dass \\(M\\) nicht auf der Tunnelachse liegt, und bestimmen Sie seinen Abstand von ihr in Metern.",

      { id:35, level:6, typ:"numerisch",
