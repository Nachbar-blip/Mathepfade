        loesungsweg:"Zwei Ebenen haben genau dann keinen gemeinsamen Punkt, wenn sie <b>echt parallel</b> sind — und das verlangt kollineare Normalenvektoren. Stehen die Normalen senkrecht aufeinander, sind sie insbesondere nicht kollinear; die Ebenen schneiden sich also in einer Geraden, und zwar unter dem Winkel \\(90°\\). Das Standardbeispiel sind die Koordinatenebenen \\(x=0\\) und \\(z=0\\) mit den Normalen \\(\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\) und \\(\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}\\): Sie schneiden sich in der \\(y\\)-Achse."

      { id:34, level:6, typ:"numerisch",
