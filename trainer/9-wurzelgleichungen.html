<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wurzelgleichungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-wurzelgleichungen';
    const THEMA_CONFIG = { name: 'Wurzelgleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = 5\\).", loesung: 25, toleranz: 0, tipp: "Quadriere beide Seiten.", loesungsweg: "$$x = 5^2 = 25$$" },
      { id: 2, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = 3\\).", loesung: 9, toleranz: 0, tipp: "Quadriere.", loesungsweg: "$$x = 9$$" },
      { id: 3, level: 1, typ: "mc", frage: "Hat \\(\\sqrt{x} = -2\\) Lösungen?", optionen: ["Ja, \\(x = 4\\)", "Nein, Wurzeln sind nicht negativ", "Ja, \\(x = -4\\)", "Ja, \\(x = 2\\)"], korrekt: 1, tipp: "\\(\\sqrt{x} \\geq 0\\) per Definition.", loesungsweg: "Die Quadratwurzel liefert nie negative Werte → keine Lösung." },
      { id: 4, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = 10\\).", loesung: 100, toleranz: 0, tipp: "Quadriere.", loesungsweg: "$$x = 100$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 1} = 2\\).", loesung: 3, toleranz: 0, tipp: "Quadriere: \\(x + 1 = 4\\).", loesungsweg: "$$x + 1 = 4 \\Rightarrow x = 3$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x - 1} = 3\\).", loesung: 10, toleranz: 0, tipp: "Quadriere: \\(x - 1 = 9\\).", loesungsweg: "$$x = 10$$" },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Löse \\(\\sqrt{2x} = 4\\).", loesung: 8, toleranz: 0, tipp: "Quadriere: \\(2x = 16\\).", loesungsweg: "$$2x = 16 \\Rightarrow x = 8$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\(\\sqrt{3x - 2} = 4\\).", loesung: 6, toleranz: 0, tipp: "\\(3x - 2 = 16\\).", loesungsweg: "$$3x = 18 \\Rightarrow x = 6$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Löse \\(2\\sqrt{x} = 6\\).", loesung: 9, toleranz: 0, tipp: "Erst durch 2 teilen: \\(\\sqrt{x} = 3\\).", loesungsweg: "$$\\sqrt{x} = 3 \\Rightarrow x = 9$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(\\sqrt{x} + 1 = 4\\).", loesung: 9, toleranz: 0, tipp: "Zuerst \\(\\sqrt{x} = 3\\).", loesungsweg: "$$x = 9$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Löse \\(\\sqrt{x} - 2 = 3\\).", loesung: 25, toleranz: 0, tipp: "\\(\\sqrt{x} = 5\\).", loesungsweg: "$$x = 25$$" },
      { id: 12, level: 2, typ: "mc", frage: "Der erste Schritt bei \\(\\sqrt{x} - 3 = 4\\) ist …", optionen: ["Quadrieren", "Die 3 auf die andere Seite bringen", "Durch 3 teilen", "Mit x multiplizieren"], korrekt: 1, tipp: "Wurzel isolieren vor dem Quadrieren.", loesungsweg: "Erst Wurzel isolieren: \\(\\sqrt{x} = 7\\), dann quadrieren." },
      // ========== LEVEL 3 -- Probe nötig ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 3} = x - 3\\). Quadriert: \\(x + 3 = x^2 - 6x + 9\\). Positive Lösung mit Probe?", loesung: 6, toleranz: 0, tipp: "\\(x^2 - 7x + 6 = 0\\). Lösungen 1 und 6. Probe!", loesungsweg: "$$x = 1 \\text{ oder } x = 6$$ Probe: \\(\\sqrt{4} = -2\\)? Nein. \\(\\sqrt{9} = 3\\) ✓. Also \\(x = 6\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{2x + 1} = x - 1\\). (Quadrieren, Probe!)", loesung: 4, toleranz: 0, tipp: "\\(2x + 1 = x^2 - 2x + 1 \\Rightarrow x^2 - 4x = 0\\).", loesungsweg: "\\(x = 0\\) oder \\(x = 4\\). Probe bei \\(x = 0\\): \\(1 = -1\\) ✗. Bei \\(x = 4\\): \\(3 = 3\\) ✓." },
      { id: 15, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = x - 2\\). (Probe!)", loesung: 4, toleranz: 0, tipp: "\\(x = x^2 - 4x + 4 \\Rightarrow x^2 - 5x + 4 = 0\\).", loesungsweg: "\\(x = 1\\) oder \\(x = 4\\). Probe: \\(x = 1\\): \\(1 = -1\\) ✗. \\(x = 4\\): \\(2 = 2\\) ✓." },
      { id: 16, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 5} = 3\\).", loesung: 4, toleranz: 0, tipp: "\\(x + 5 = 9\\).", loesungsweg: "$$x = 4$$" },
      { id: 17, level: 3, typ: "mc", frage: "Warum ist bei Wurzelgleichungen eine Probe nötig?", optionen: ["Weil Quadrieren keine Äquivalenzumformung ist", "Weil Wurzeln irrational sind", "Weil es keine Definitionsmenge gibt", "Aus Gewohnheit"], korrekt: 0, tipp: "Quadrieren kann Scheinlösungen erzeugen.", loesungsweg: "Quadrieren ist keine Äquivalenzumformung → Scheinlösungen möglich." },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{4x - 3} = 5\\).", loesung: 7, toleranz: 0, tipp: "\\(4x - 3 = 25\\).", loesungsweg: "$$4x = 28 \\Rightarrow x = 7$$" },
      // ========== LEVEL 4 -- Definitionsbereich ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Definitionsbereich von \\(\\sqrt{x - 3}\\): Gib die kleinste zulässige Zahl an.", loesung: 3, toleranz: 0, tipp: "Radikand \\(\\geq 0\\).", loesungsweg: "\\(x - 3 \\geq 0 \\Rightarrow x \\geq 3\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Definitionsbereich von \\(\\sqrt{2x - 10}\\): Kleinstes \\(x\\)?", loesung: 5, toleranz: 0, tipp: "\\(2x - 10 \\geq 0\\).", loesungsweg: "\\(x \\geq 5\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Löse \\(\\sqrt{x^2 - 9} = 4\\). Positive Lösung?", loesung: 5, toleranz: 0, tipp: "\\(x^2 - 9 = 16 \\Rightarrow x^2 = 25\\).", loesungsweg: "$$x = \\pm 5$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Löse \\(\\sqrt{x} + \\sqrt{x} = 6\\).", loesung: 9, toleranz: 0, tipp: "\\(2\\sqrt{x} = 6\\).", loesungsweg: "$$\\sqrt{x} = 3 \\Rightarrow x = 9$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 4} = \\sqrt{2x - 1}\\). (Einmal quadrieren, linear lösen, Probe.)", loesung: 5, toleranz: 0, tipp: "\\(x + 4 = 2x - 1\\).", loesungsweg: "$$x = 5,\\text{ Probe: } \\sqrt{9} = \\sqrt{9}\\checkmark$$" },
      { id: 24, level: 4, typ: "mc", frage: "Wann ist \\(\\sqrt{f(x)} = g(x)\\) lösbar?", optionen: ["Immer", "Nur wenn \\(g(x) \\geq 0\\)", "Nur wenn \\(f(x) < 0\\)", "Nie"], korrekt: 1, tipp: "Wurzel ist immer \\(\\geq 0\\).", loesungsweg: "\\(\\sqrt{f(x)} \\geq 0\\), daher muss \\(g(x) \\geq 0\\) gelten." },
      // ========== LEVEL 5 ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 7} - 1 = x\\). (Probe!)", loesung: 2, toleranz: 0, tipp: "\\(\\sqrt{x+7} = x+1 \\Rightarrow x+7 = x^2+2x+1\\).", loesungsweg: "\\(x^2 + x - 6 = 0 \\Rightarrow x = 2\\) oder \\(x = -3\\). Probe: \\(x = 2\\): \\(3 - 1 = 2\\) ✓. \\(x = -3\\): \\(\\sqrt{4} - 1 = 1 \\neq -3\\) ✗." },
      { id: 26, level: 5, typ: "numerisch", frage: "Löse \\(\\sqrt{3x + 1} - \\sqrt{x + 1} = 0\\).", loesung: 0, toleranz: 0, tipp: "Umstellen: \\(\\sqrt{3x+1} = \\sqrt{x+1}\\), dann quadrieren.", loesungsweg: "\\(3x + 1 = x + 1 \\Rightarrow 2x = 0 \\Rightarrow x = 0\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Länge einer Seite: \\(\\sqrt{a^2 + 16} = 5\\). Positives \\(a\\)?", loesung: 3, toleranz: 0, tipp: "\\(a^2 + 16 = 25 \\Rightarrow a^2 = 9\\).", loesungsweg: "$$a = \\pm 3$$" },
      { id: 28, level: 5, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = \\frac{x}{2}\\). Positive Lösung \\(> 0\\)?", loesung: 4, toleranz: 0, tipp: "Quadriere: \\(x = \\frac{x^2}{4} \\Rightarrow x^2 - 4x = 0\\).", loesungsweg: "\\(x = 0\\) oder \\(x = 4\\). Positiv: \\(x = 4\\)." },
      { id: 29, level: 5, typ: "mc", frage: "\\(\\sqrt{x - 2} = -3\\) hat …", optionen: ["1 Lösung", "2 Lösungen", "Keine Lösung", "\\(x = 11\\)"], korrekt: 2, tipp: "Wurzel ist nie negativ.", loesungsweg: "\\(\\sqrt{\\cdot} \\geq 0\\), daher unlösbar." },
      { id: 30, level: 5, typ: "numerisch", frage: "Löse \\(\\sqrt{5x - 4} = x\\). Positive Lösung \\(\\geq 2\\)?", loesung: 4, toleranz: 0, tipp: "\\(5x - 4 = x^2 \\Rightarrow x^2 - 5x + 4 = 0\\).", loesungsweg: "\\(x = 1\\) oder \\(x = 4\\). Probe: beide sind Lösungen, aber gefragt \\(\\geq 2\\): \\(x = 4\\)." },
      // ========== LEVEL 6 ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Löse \\(\\sqrt{x+5} + \\sqrt{x} = 5\\). (Isolieren, quadrieren.)", loesung: 4, toleranz: 0, tipp: "\\(\\sqrt{x+5} = 5 - \\sqrt{x}\\), quadriere zweimal.", loesungsweg: "$$x + 5 = 25 - 10\\sqrt{x} + x \\Rightarrow 10\\sqrt{x} = 20 \\Rightarrow x = 4$$" },
      { id: 32, level: 6, typ: "numerisch", frage: "Löse \\(\\sqrt{2x+3} = \\sqrt{x+4} + 1\\). (Probe! Runde auf 2 Dezimalstellen.)", loesung: 9.29, toleranz: 0.01, tipp: "Quadriere beide Seiten, erneut quadrieren.", loesungsweg: "\\(2x+3 = x+4 + 2\\sqrt{x+4} + 1 \\Rightarrow x - 2 = 2\\sqrt{x+4}\\). Quadrieren: \\(x^2 - 4x + 4 = 4x + 16 \\Rightarrow x^2 - 8x - 12 = 0 \\Rightarrow x = 4 + 2\\sqrt{7}\\approx 9{,}29\\) (die Wurzel \\(4-2\\sqrt7<0\\) entfällt; Probe: beide Seiten \\(\\approx 4{,}65\\))." },
      { id: 33, level: 6, typ: "mc", frage: "Wie viele Lösungen hat \\(\\sqrt{x} = \\sqrt{-x}\\)?", optionen: ["2", "1 (nämlich \\(x = 0\\))", "Keine", "Unendlich viele"], korrekt: 1, tipp: "Beide Seiten nur definiert für \\(x = 0\\).", loesungsweg: "Linke Seite: \\(x \\geq 0\\). Rechte: \\(x \\leq 0\\). Schnittmenge: \\(x = 0\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Ein Quadrat mit Fläche \\(A\\) hat Diagonale \\(d = \\sqrt{2A}\\). Für \\(d = 10\\) ist \\(A = ?\\)", loesung: 50, toleranz: 0, tipp: "\\(100 = 2A\\).", loesungsweg: "$$A = 50$$" },
      { id: 35, level: 6, typ: "numerisch", frage: "Löse \\(\\sqrt{x^2 - 4x + 4} = 3\\). Positive Lösung?", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{(x-2)^2} = |x-2| = 3\\).", loesungsweg: "\\(x - 2 = \\pm 3 \\Rightarrow x = 5 \\lor x = -1\\)." },
      { id: 36, level: 6, typ: "mc", frage: "Bei \\(\\sqrt{f(x)} = g(x)\\) entsteht nach Quadrieren \\(f(x) = g(x)^2\\). Diese kann Lösungen haben, die …", optionen: ["immer Lösungen der Originalgleichung sind", "mit \\(g(x) < 0\\) Scheinlösungen sind", "nur auf der linken Seite erlaubt sind", "nie Scheinlösungen sind"], korrekt: 1, tipp: "Quadrieren verliert Vorzeicheninformation.", loesungsweg: "Wenn \\(g(x) < 0\\), war die Originalgleichung unlösbar → Scheinlösung." }
    ];
    </script>
