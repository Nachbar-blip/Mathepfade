<!DOCTYPE html>

<head>

    <title>Wurzelgleichungen - Mathepfade</title>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-wurzelgleichungen';
    const THEMA_CONFIG = { name: 'Wurzelgleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = 5\\).", loesung: 25, toleranz: 0, tipp: "Quadriere beide Seiten.", loesungsweg: "$$x = 5^2 = 25$$" },
      { id: 2, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = 3\\).", loesung: 9, toleranz: 0, tipp: "Quadriere.", loesungsweg: "Quadrieren beseitigt die Wurzel: $$\\left(\\sqrt x\\right)^2 = 3^2 \\;\\Rightarrow\\; x = 9$$ Probe: \\(\\sqrt9 = 3\\) ✓ Die Probe ist bei Wurzelgleichungen Pflicht, weil Quadrieren keine Äquivalenzumformung ist und Scheinlösungen erzeugen kann." },
      { id: 3, level: 1, typ: "mc", frage: "Hat \\(\\sqrt{x} = -2\\) Lösungen?", optionen: ["Ja, \\(x = 4\\)", "Nein, Wurzeln sind nicht negativ", "Ja, \\(x = -4\\)", "Ja, \\(x = 2\\)"], korrekt: 1, tipp: "\\(\\sqrt{x} \\geq 0\\) per Definition.", loesungsweg: "Die Quadratwurzel liefert nie negative Werte → keine Lösung." },
      { id: 4, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = 10\\).", loesung: 100, toleranz: 0, tipp: "Quadriere.", loesungsweg: "$$\\left(\\sqrt x\\right)^2 = 10^2 \\;\\Rightarrow\\; x = 100$$ Probe: \\(\\sqrt{100} = 10\\) ✓" },
      { id: 5, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 1} = 2\\).", loesung: 3, toleranz: 0, tipp: "Quadriere: \\(x + 1 = 4\\).", loesungsweg: "$$x + 1 = 4 \\Rightarrow x = 3$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(\\sqrt{x - 1} = 3\\).", loesung: 10, toleranz: 0, tipp: "Quadriere: \\(x - 1 = 9\\).", loesungsweg: "Quadrieren, dann die Klammer auflösen: $$x-1 = 9 \\;\\Rightarrow\\; x = 10$$ Probe: \\(\\sqrt{10-1} = \\sqrt9 = 3\\) ✓ Quadriert wird der gesamte Radikand, nicht nur das \\(x\\)." },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Löse \\(\\sqrt{2x} = 4\\).", loesung: 8, toleranz: 0, tipp: "Quadriere: \\(2x = 16\\).", loesungsweg: "$$2x = 16 \\Rightarrow x = 8$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\(\\sqrt{3x - 2} = 4\\).", loesung: 6, toleranz: 0, tipp: "\\(3x - 2 = 16\\).", loesungsweg: "$$3x = 18 \\Rightarrow x = 6$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Löse \\(2\\sqrt{x} = 6\\).", loesung: 9, toleranz: 0, tipp: "Erst durch 2 teilen: \\(\\sqrt{x} = 3\\).", loesungsweg: "$$\\sqrt{x} = 3 \\Rightarrow x = 9$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(\\sqrt{x} + 1 = 4\\).", loesung: 9, toleranz: 0, tipp: "Zuerst \\(\\sqrt{x} = 3\\).", loesungsweg: "Erst die Wurzel isolieren, dann quadrieren: $$\\sqrt x = 4-1 = 3 \\;\\Rightarrow\\; x = 9$$ Sofortiges Quadrieren wäre falsch — links stünde dann \\(\\left(\\sqrt x + 1\\right)^2 = x + 2\\sqrt x + 1\\), und die Wurzel bliebe erhalten." },
      { id: 11, level: 2, typ: "numerisch", frage: "Löse \\(\\sqrt{x} - 2 = 3\\).", loesung: 25, toleranz: 0, tipp: "\\(\\sqrt{x} = 5\\).", loesungsweg: "Wurzel isolieren, dann quadrieren: $$\\sqrt x = 3+2 = 5 \\;\\Rightarrow\\; x = 25$$ Probe: \\(\\sqrt{25} - 2 = 3\\) ✓" },
      { id: 12, level: 2, typ: "mc", frage: "Der erste Schritt bei \\(\\sqrt{x} - 3 = 4\\) ist …", optionen: ["Quadrieren", "Die 3 auf die andere Seite bringen", "Durch 3 teilen", "Mit x multiplizieren"], korrekt: 1, tipp: "Wurzel isolieren vor dem Quadrieren.", loesungsweg: "Erst Wurzel isolieren: \\(\\sqrt{x} = 7\\), dann quadrieren." },
      // ========== LEVEL 3 -- Probe nötig ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 3} = x - 3\\) und gib die Lösung an, die die Probe besteht.", loesung: 6, toleranz: 0, tipp: "\\(x^2 - 7x + 6 = 0\\). Lösungen 1 und 6. Probe!", loesungsweg: "$$x = 1 \\text{ oder } x = 6$$ Probe: \\(\\sqrt{4} = -2\\)? Nein. \\(\\sqrt{9} = 3\\) ✓. Also \\(x = 6\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{2x + 1} = x - 1\\) und gib die Lösung an, die die Probe besteht.", loesung: 4, toleranz: 0, tipp: "\\(2x + 1 = x^2 - 2x + 1 \\Rightarrow x^2 - 4x = 0\\).", loesungsweg: "\\(x = 0\\) oder \\(x = 4\\). Probe bei \\(x = 0\\): \\(1 = -1\\) ✗. Bei \\(x = 4\\): \\(3 = 3\\) ✓." },
      { id: 15, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{x} = x - 2\\) und gib die Lösung an, die die Probe besteht.", loesung: 4, toleranz: 0, tipp: "\\(x = x^2 - 4x + 4 \\Rightarrow x^2 - 5x + 4 = 0\\).", loesungsweg: "\\(x = 1\\) oder \\(x = 4\\). Probe: \\(x = 1\\): \\(1 = -1\\) ✗. \\(x = 4\\): \\(2 = 2\\) ✓." },
      { id: 16, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 5} = 3\\).", loesung: 4, toleranz: 0, tipp: "\\(x + 5 = 9\\).", loesungsweg: "$$x+5 = 9 \\;\\Rightarrow\\; x = 4$$ Probe: \\(\\sqrt{4+5} = \\sqrt9 = 3\\) ✓" },
      { id: 17, level: 3, typ: "mc", frage: "Warum ist bei Wurzelgleichungen eine Probe nötig?", optionen: ["Weil Quadrieren keine Äquivalenzumformung ist", "Weil Wurzeln irrational sind", "Weil es keine Definitionsmenge gibt", "Aus Gewohnheit"], korrekt: 0, tipp: "Quadrieren kann Scheinlösungen erzeugen.", loesungsweg: "Quadrieren ist keine Äquivalenzumformung → Scheinlösungen möglich." },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(\\sqrt{4x - 3} = 5\\).", loesung: 7, toleranz: 0, tipp: "\\(4x - 3 = 25\\).", loesungsweg: "$$4x = 28 \\Rightarrow x = 7$$" },
      // ========== LEVEL 4 -- Definitionsmenge, Verfahren selbst wählen, Umkehraufgaben ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Für welche Zahlen \\(x\\) ist der Term \\(\\sqrt{2x - 10}\\) definiert? Gib die kleinste zulässige Zahl an.", loesung: 5, toleranz: 0, tipp: "Der Radikand darf nicht negativ werden.", loesungsweg: "Unter einer Quadratwurzel darf nichts Negatives stehen: $$2x - 10 \\ge 0 \\;\\Rightarrow\\; 2x \\ge 10 \\;\\Rightarrow\\; x \\ge 5$$ Die kleinste zulässige Zahl ist \\(5\\); dort ist die Wurzel null, was erlaubt ist. Der Faktor \\(2\\) vor dem \\(x\\) muss beim Auflösen berücksichtigt werden — die Grenze liegt bei \\(5\\), nicht bei \\(10\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 4} = \\sqrt{2x - 1}\\).", loesung: 5, toleranz: 0, tipp: "Stehen auf beiden Seiten nur Wurzeln, genügt einmal Quadrieren.", loesungsweg: "Auf beiden Seiten steht jeweils nur eine Wurzel, also einmal quadrieren: $$x + 4 = 2x - 1 \\;\\Rightarrow\\; x = 5$$ Probe: \\(\\sqrt{9} = \\sqrt{9}\\) ✓ Beide Radikanden sind für \\(x = 5\\) positiv, die Lösung ist gültig." },
      { id: 21, level: 4, typ: "numerisch", frage: "Löse \\(\\sqrt{x^2 - 9} = 4\\) und gib die positive Lösung an.", loesung: 5, toleranz: 0, tipp: "Nach dem Quadrieren entsteht eine reine Potenzgleichung.", loesungsweg: "Quadrieren und nach \\(x^2\\) auflösen: $$x^2 - 9 = 16 \\;\\Rightarrow\\; x^2 = 25 \\;\\Rightarrow\\; x = \\pm 5$$ Gefragt ist die positive Lösung, also \\(x = 5\\). Probe: \\(\\sqrt{25 - 9} = \\sqrt{16} = 4\\) ✓ Beide Werte sind hier gültig, weil der Radikand für \\(x = -5\\) ebenfalls \\(16\\) ergibt." },
      { id: 22, level: 4, typ: "numerisch", frage: "Die Gleichung \\(\\sqrt{x + a} = 4\\) hat die Lösung \\(x = 11\\). Bestimme \\(a\\).", loesung: 5, toleranz: 0, tipp: "Setze die Lösung ein und löse nach \\(a\\) auf.", loesungsweg: "Die Lösung erfüllt die Gleichung: $$\\sqrt{11 + a} = 4 \\;\\Rightarrow\\; 11 + a = 16 \\;\\Rightarrow\\; a = 5$$ Probe: \\(\\sqrt{11 + 5} = \\sqrt{16} = 4\\) ✓" },
      { id: 23, level: 4, typ: "numerisch", frage: "Die Fallzeit \\(t\\) (in Sekunden) eines Gegenstands aus der Höhe \\(h\\) (in Metern) beträgt näherungsweise \\(t = \\sqrt{\\frac{h}{5}}\\). Aus welcher Höhe fällt ein Gegenstand \\(3\\) Sekunden lang?", loesung: 45, toleranz: 0, tipp: "Gesucht ist die Höhe, die Zeit ist bekannt.", loesungsweg: "Einsetzen von \\(t = 3\\) und nach \\(h\\) auflösen: $$3 = \\sqrt{\\frac{h}{5}} \\;\\Rightarrow\\; 9 = \\frac{h}{5} \\;\\Rightarrow\\; h = 45\\,\\text{m}$$ Probe: \\(\\sqrt{45 : 5} = \\sqrt9 = 3\\) ✓ Doppelte Fallzeit bedeutet übrigens vierfache Höhe, weil die Höhe unter der Wurzel steht." },
      { id: 24, level: 4, typ: "numerisch", frage: "Löse \\(3\\sqrt{x - 2} + 4 = 13\\).", loesung: 11, toleranz: 0, tipp: "Zuerst die Wurzel allein auf eine Seite bringen.", loesungsweg: "Wurzel isolieren, dann quadrieren: $$3\\sqrt{x-2} = 9 \\;\\Rightarrow\\; \\sqrt{x-2} = 3 \\;\\Rightarrow\\; x - 2 = 9 \\;\\Rightarrow\\; x = 11$$ Probe: \\(3 \\cdot \\sqrt{9} + 4 = 13\\) ✓ Sofortiges Quadrieren wäre falsch, weil die linke Seite dann eine Summe mit gemischtem Glied ergäbe." },
      // ========== LEVEL 5 -- Fehler finden, Scheinlösungen, Parameter, Zahlenrätsel ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler löst \\(\\sqrt{x + 7} - 1 = x\\):<br>Schritt 1: Quadrieren: \\(x + 7 - 1 = x^2\\)<br>Schritt 2: \\(x^2 - x - 6 = 0\\)<br>Schritt 3: \\(x = 3\\) oder \\(x = -2\\)<br>Welcher Schritt ist der erste fehlerhafte?", optionen: ["Schritt 1 — die Wurzel muss vor dem Quadrieren isoliert werden; \\((\\sqrt{x+7} - 1)^2\\) ist nicht \\(x + 7 - 1\\)", "Schritt 2 — die Gleichung wurde falsch umgestellt", "Schritt 3 — die quadratische Gleichung ist falsch gelöst", "Kein Schritt ist fehlerhaft, es fehlt nur die Probe"], korrekt: 0, tipp: "Was ergibt \\((a - 1)^2\\)?", loesungsweg: "In Schritt 1 wurde eine Differenz quadriert, indem jeder Summand einzeln quadriert wurde. Das ist falsch: \\((\\sqrt{x+7} - 1)^2 = x + 7 - 2\\sqrt{x+7} + 1\\) — die Wurzel bleibt erhalten. Richtig ist, zuerst zu isolieren: $$\\sqrt{x+7} = x + 1 \\;\\Rightarrow\\; x + 7 = x^2 + 2x + 1 \\;\\Rightarrow\\; x^2 + x - 6 = 0$$ Lösungen \\(x = 2\\) oder \\(x = -3\\). Probe: \\(x = 2\\): \\(\\sqrt9 - 1 = 2\\) ✓; \\(x = -3\\): \\(\\sqrt4 - 1 = 1 \\ne -3\\) ✗. Die einzige Lösung ist \\(x = 2\\) — beim Schüler kommt sie gar nicht vor." },
      { id: 26, level: 5, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 12} = x\\) und gib die Lösung an, die die Gleichung wirklich erfüllt.", loesung: 4, toleranz: 0, tipp: "Nach dem Quadrieren entsteht eine quadratische Gleichung — die Probe entscheidet.", loesungsweg: "Quadrieren: $$x + 12 = x^2 \\;\\Rightarrow\\; x^2 - x - 12 = 0 \\;\\Rightarrow\\; (x - 4)(x + 3) = 0$$ Kandidaten: \\(x = 4\\) und \\(x = -3\\). Probe: \\(x = 4\\): \\(\\sqrt{16} = 4\\) ✓. \\(x = -3\\): \\(\\sqrt9 = 3 \\ne -3\\) ✗. Der Wert \\(-3\\) ist eine Scheinlösung — die rechte Seite \\(x\\) müsste als Wurzelwert nichtnegativ sein. Lösung: \\(x = 4\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Die Gleichung \\(\\sqrt{ax + b} = 3\\) hat die Lösung \\(x = 1\\), die Gleichung \\(\\sqrt{ax + b} = 5\\) hat die Lösung \\(x = 5\\). Bestimme \\(a\\).", loesung: 4, toleranz: 0, tipp: "Jede Angabe liefert nach dem Quadrieren eine lineare Gleichung in \\(a\\) und \\(b\\).", loesungsweg: "Einsetzen und quadrieren: $$a + b = 9 \\qquad\\text{und}\\qquad 5a + b = 25$$ Subtraktion der ersten von der zweiten Gleichung: \\(4a = 16\\), also \\(a = 4\\) und \\(b = 5\\). Probe: \\(\\sqrt{4 \\cdot 1 + 5} = 3\\) ✓ und \\(\\sqrt{4 \\cdot 5 + 5} = 5\\) ✓" },
      { id: 28, level: 5, typ: "numerisch", frage: "Von einer Zahl ist bekannt: Die Wurzel aus der um \\(3\\) vergrößerten Zahl ist um \\(1\\) kleiner als die Wurzel aus der um \\(8\\) vergrößerten Zahl. Wie lautet die Zahl?", loesung: 1, toleranz: 0, tipp: "Übersetze in eine Gleichung mit zwei Wurzeln.", loesungsweg: "Mit der gesuchten Zahl \\(x\\): $$\\sqrt{x + 3} = \\sqrt{x + 8} - 1$$ Quadrieren (rechts binomische Formel): $$x + 3 = x + 8 - 2\\sqrt{x+8} + 1 \\;\\Rightarrow\\; 2\\sqrt{x+8} = 6 \\;\\Rightarrow\\; \\sqrt{x+8} = 3 \\;\\Rightarrow\\; x = 1$$ Probe: \\(\\sqrt4 = 2\\) und \\(\\sqrt9 - 1 = 2\\) ✓" },
      { id: 29, level: 5, typ: "numerisch", frage: "Wie viele Lösungen hat die Gleichung \\(\\sqrt{x - 1} = 3 - x\\)?", loesung: 1, toleranz: 0, tipp: "Nicht jeder Kandidat nach dem Quadrieren besteht die Probe.", loesungsweg: "Quadrieren: $$x - 1 = 9 - 6x + x^2 \\;\\Rightarrow\\; x^2 - 7x + 10 = 0 \\;\\Rightarrow\\; x = 2 \\text{ oder } x = 5$$ Probe: \\(x = 2\\): \\(\\sqrt1 = 1 = 3 - 2\\) ✓. \\(x = 5\\): \\(\\sqrt4 = 2\\), aber \\(3 - 5 = -2\\) ✗. Die rechte Seite muss nichtnegativ sein, also \\(x \\le 3\\) — das schließt \\(5\\) von vornherein aus. Die Gleichung hat genau <b>eine</b> Lösung." },
      { id: 30, level: 5, typ: "mc", frage: "Eine Schülerin löst \\(\\sqrt{x - 2} = -3\\) durch Quadrieren, erhält \\(x - 2 = 9\\) und gibt \\(x = 11\\) als Lösung an. Was ist dazu zu sagen?", optionen: ["Die Gleichung hat keine Lösung — eine Wurzel ist nie negativ; \\(x = 11\\) ist eine Scheinlösung, wie die Probe zeigt", "Die Lösung ist richtig, denn \\(11 - 2 = 9\\) und \\(\\sqrt9 = 3\\)", "Es fehlt die zweite Lösung \\(x = -7\\)", "Beim Quadrieren muss das Minus erhalten bleiben: \\(x - 2 = -9\\), also \\(x = -7\\)"], korrekt: 0, tipp: "Setze \\(x = 11\\) in die ursprüngliche Gleichung ein.", loesungsweg: "Schon vor jeder Rechnung ist klar: Die linke Seite ist als Quadratwurzel nie negativ, die rechte ist \\(-3\\). $$\\sqrt{x-2} \\ge 0 > -3$$ Die Gleichung hat keine Lösung. Quadrieren erzeugt trotzdem den Kandidaten \\(x = 11\\), weil \\((-3)^2 = 3^2\\) ist — die Vorzeicheninformation geht verloren. Die Probe entlarvt ihn: \\(\\sqrt{11 - 2} = 3 \\ne -3\\)." },
      // ========== LEVEL 6 -- Behauptungen prüfen, Sonderfälle, Parameter ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Eine Wurzelgleichung mit einer einzigen Quadratwurzel kann nie mehr als eine Lösung haben.\" Stimmt das?", optionen: ["Nein — \\(\\sqrt{x^2 - 9} = 4\\) hat die beiden Lösungen \\(5\\) und \\(-5\\)", "Ja — die Wurzel ist eindeutig, also auch die Lösung", "Ja — beim Quadrieren gehen Lösungen verloren, es bleibt höchstens eine", "Nein — jede Wurzelgleichung hat genau zwei Lösungen"], korrekt: 0, tipp: "Was steht nach dem Quadrieren unter Umständen auf der linken Seite?", loesungsweg: "Ein Gegenbeispiel genügt: $$\\sqrt{x^2 - 9} = 4 \\;\\Rightarrow\\; x^2 = 25 \\;\\Rightarrow\\; x = \\pm 5$$ Beide Werte bestehen die Probe, weil \\(x^2\\) das Vorzeichen löscht. Die Anzahl der Lösungen hängt vom Radikanden ab, nicht von der Anzahl der Wurzeln. Quadrieren kann Scheinlösungen <b>hinzufügen</b>, nie welche vernichten — auch die zweite Begründung ist deshalb falsch." },
      { id: 32, level: 6, typ: "numerisch", frage: "Die Gleichung \\(\\sqrt{x} = x - a\\) hat die Lösung \\(x = 9\\). Bestimme \\(a\\) und prüfe, ob nach dem Quadrieren außerdem eine Scheinlösung entsteht. Gib \\(a\\) an.", loesung: 6, toleranz: 0, tipp: "Erst \\(a\\) aus der bekannten Lösung, dann die Gleichung vollständig lösen.", loesungsweg: "Einsetzen von \\(x = 9\\): \\(3 = 9 - a\\), also \\(a = 6\\). Die Gleichung lautet \\(\\sqrt x = x - 6\\). Quadrieren: $$x = x^2 - 12x + 36 \\;\\Rightarrow\\; x^2 - 13x + 36 = 0 \\;\\Rightarrow\\; x = 4 \\text{ oder } x = 9$$ Probe für \\(x = 4\\): \\(\\sqrt4 = 2\\), aber \\(4 - 6 = -2\\) ✗ — eine Scheinlösung. Sie entsteht, weil die rechte Seite für \\(x < 6\\) negativ ist, was eine Wurzel nie sein kann." },
      { id: 33, level: 6, typ: "numerisch", frage: "Löse \\(\\sqrt{x + 5} - \\sqrt{x} = 1\\).", loesung: 4, toleranz: 0, tipp: "Bringe eine Wurzel auf die andere Seite, bevor du quadrierst.", loesungsweg: "Eine Wurzel isolieren: \\(\\sqrt{x+5} = \\sqrt x + 1\\). Quadrieren mit binomischer Formel: $$x + 5 = x + 2\\sqrt x + 1 \\;\\Rightarrow\\; 2\\sqrt x = 4 \\;\\Rightarrow\\; \\sqrt x = 2 \\;\\Rightarrow\\; x = 4$$ Probe: \\(\\sqrt9 - \\sqrt4 = 3 - 2 = 1\\) ✓ Wer die Differenz direkt quadriert, muss zweimal quadrieren — der Umweg über das Isolieren spart einen Schritt." },
      { id: 34, level: 6, typ: "numerisch", frage: "Wie viele reelle Lösungen hat die Gleichung \\(\\sqrt{x - 4} + \\sqrt{2 - x} = 0\\)?", loesung: 0, toleranz: 0, tipp: "Für welche \\(x\\) sind beide Wurzeln überhaupt definiert?", loesungsweg: "Bevor man rechnet, lohnt der Blick auf die Definitionsmenge: Die erste Wurzel verlangt \\(x \\ge 4\\), die zweite \\(x \\le 2\\). $$x \\ge 4 \\quad\\text{und}\\quad x \\le 2$$ lässt sich nicht gleichzeitig erfüllen — die Definitionsmenge ist leer, es gibt <b>keine</b> Lösung. Quadrieren wäre hier vergebliche Mühe; die Gleichung scheitert schon an der Definitionsmenge." },
      { id: 35, level: 6, typ: "numerisch", frage: "Für welche Zahl \\(b\\) ist \\(x = 1\\) eine Scheinlösung der Gleichung \\(\\sqrt{x + b} = x - 3\\), also eine Lösung der quadrierten, aber nicht der ursprünglichen Gleichung?", loesung: 3, toleranz: 0, tipp: "Setze \\(x = 1\\) in die quadrierte Gleichung ein.", loesungsweg: "Die quadrierte Gleichung lautet \\(x + b = (x - 3)^2\\). Einsetzen von \\(x = 1\\): $$1 + b = (1 - 3)^2 = 4 \\;\\Rightarrow\\; b = 3$$ Kontrolle in der ursprünglichen Gleichung: \\(\\sqrt{1 + 3} = 2\\), aber \\(1 - 3 = -2\\) — die Werte stimmen nur bis auf das Vorzeichen überein. Genau das kennzeichnet eine Scheinlösung: Sie erfüllt die quadrierte Gleichung, weil \\(2^2 = (-2)^2\\) ist. Die echte Lösung von \\(\\sqrt{x+3} = x - 3\\) ist übrigens \\(x = 6\\)." },
      { id: 36, level: 6, typ: "mc", frage: "Ein Schüler behauptet: „Wenn für einen Kandidaten nach dem Quadrieren der Radikand positiv ist, dann ist er automatisch eine Lösung der Wurzelgleichung.\" Was ist dazu zu sagen?", optionen: ["Falsch — bei \\(\\sqrt{x + 3} = x - 3\\) ist für \\(x = 1\\) der Radikand \\(4 > 0\\), trotzdem gilt \\(2 \\ne -2\\); auch die andere Seite muss nichtnegativ sein", "Richtig — Scheinlösungen entstehen nur durch negative Radikanden", "Richtig, sofern die quadrierte Gleichung richtig gelöst wurde", "Falsch — ein positiver Radikand beweist im Gegenteil, dass es eine Scheinlösung ist"], korrekt: 0, tipp: "Welche Bedingung muss die Seite ohne Wurzel erfüllen?", loesungsweg: "Ein positiver Radikand sorgt nur dafür, dass die Wurzel <b>definiert</b> ist. Scheinlösungen entstehen anders: Die Seite ohne Wurzel wird negativ, und beim Quadrieren geht dieses Vorzeichen verloren. $$\\sqrt{x+3} = x - 3, \\quad x = 1: \\quad \\sqrt4 = 2, \\ \\text{aber } 1 - 3 = -2$$ Der Radikand ist \\(4\\), die Gleichung trotzdem falsch. Die Probe muss also immer in der <b>ursprünglichen</b> Gleichung erfolgen — der Blick auf den Radikanden allein genügt nicht." }];
    </script>

</body>
