<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzgleichungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-potenzgleichungen';
    const THEMA_CONFIG = { name: 'Potenzgleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Löse \\(x^2 = 9\\). Gib die positive Lösung an.", loesung: 3, toleranz: 0, tipp: "Wurzel ziehen.", loesungsweg: "Bei geradem Exponenten liefert das Wurzelziehen <b>zwei</b> Lösungen, weil auch die negative Zahl quadriert positiv wird: $$x^2 = 9 \\;\\Rightarrow\\; x = \\pm\\sqrt9 = \\pm 3$$ Gefragt war die positive Lösung, also \\(3\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "Löse \\(x^3 = 8\\).", loesung: 2, toleranz: 0, tipp: "3. Wurzel: \\(\\sqrt[3]{8}\\).", loesungsweg: "Bei ungeradem Exponenten gibt es genau eine reelle Lösung, denn \\((-2)^3 = -8 \\neq 8\\): $$x = \\sqrt[3]{8} = 2$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "Löse \\(x^3 = -27\\).", loesung: -3, toleranz: 0, tipp: "Ungerade Potenz: Vorzeichen bleibt.", loesungsweg: "$$x = \\sqrt[3]{-27} = -3$$" },
      { id: 4, level: 1, typ: "numerisch", frage: "Löse \\(x^2 = 100\\). Gib die positive Lösung an.", loesung: 10, toleranz: 0, tipp: "\\(\\sqrt{100}\\).", loesungsweg: "$$x^2 = 100 \\;\\Rightarrow\\; x = \\pm 10$$ Die positive Lösung ist \\(10\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Wie viele reelle Lösungen hat \\(x^2 = 0\\)?", optionen: ["0", "1", "2", "unendlich"], korrekt: 1, tipp: "Nur \\(x = 0\\).", loesungsweg: "\\(x = 0\\) (doppelte Lösung, aber 1 Zahl)." },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(x^3 = 1\\).", loesung: 1, toleranz: 0, tipp: "\\(1^3 = 1\\).", loesungsweg: "$$x^3 = 1 \\;\\Rightarrow\\; x = \\sqrt[3]{1} = 1$$ Ungerader Exponent, also nur diese eine reelle Lösung." },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Löse \\(x^2 = 81\\). Gib die positive Lösung an.", loesung: 9, toleranz: 0, tipp: "\\(\\sqrt{81}\\).", loesungsweg: "$$x^2 = 81 \\;\\Rightarrow\\; x = \\pm 9$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\(x^4 = 16\\). Gib die positive Lösung an.", loesung: 2, toleranz: 0, tipp: "\\(\\sqrt[4]{16}\\).", loesungsweg: "$$x^4 = 16 \\;\\Rightarrow\\; x = \\pm\\sqrt[4]{16} = \\pm 2$$ Der Exponent ist gerade, also gibt es wieder zwei Lösungen." },
      { id: 9, level: 2, typ: "mc", frage: "Wie viele reelle Lösungen hat \\(x^4 = -16\\)?", optionen: ["2", "1", "0", "4"], korrekt: 2, tipp: "Gerader Exponent → immer \\(\\geq 0\\).", loesungsweg: "Eine gerade Potenz ist nie negativ: \\(x^4 \\geq 0\\) für jedes reelle \\(x\\). Die rechte Seite \\(-16\\) kann also gar nicht erreicht werden — es gibt <b>keine</b> reelle Lösung. Bei ungeradem Exponenten wäre das anders: \\(x^3 = -16\\) hat sehr wohl eine Lösung." },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(x^5 = 32\\).", loesung: 2, toleranz: 0, tipp: "\\(\\sqrt[5]{32}\\).", loesungsweg: "$$x^5 = 32 \\;\\Rightarrow\\; x = \\sqrt[5]{32} = 2$$ denn \\(2^5 = 32\\). Ungerader Exponent, also genau eine Lösung." },
      { id: 11, level: 2, typ: "numerisch", frage: "Löse \\(2x^2 = 72\\). Gib die positive Lösung an.", loesung: 6, toleranz: 0, tipp: "\\(x^2 = 36\\).", loesungsweg: "Erst durch \\(2\\) teilen, dann die Wurzel ziehen: $$2x^2 = 72 \\;\\Rightarrow\\; x^2 = 36 \\;\\Rightarrow\\; x = \\pm 6$$ Der Vorfaktor muss vor dem Wurzelziehen verschwinden." },
      { id: 12, level: 2, typ: "numerisch", frage: "Löse \\(x^3 = 125\\).", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt[3]{125}\\).", loesungsweg: "$$x^3 = 125 \\;\\Rightarrow\\; x = \\sqrt[3]{125} = 5$$" },
      // ========== LEVEL 3 ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(2x^2 - 50 = 0\\). Gib die positive Lösung an.", loesung: 5, toleranz: 0, tipp: "Erst durch \\(2\\) teilen.", loesungsweg: "Erst den Vorfaktor beseitigen, dann die Wurzel ziehen: $$2x^2 = 50 \\;\\Rightarrow\\; x^2 = 25 \\;\\Rightarrow\\; x = \\pm 5$$ Die positive Lösung ist \\(5\\). Wer zuerst die Wurzel zieht, muss \\(\\sqrt2\\,x = \\sqrt{50}\\) weiterrechnen — dasselbe Ergebnis, nur umständlicher." },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\(x^3 + 8 = 0\\).", loesung: -2, toleranz: 0, tipp: "\\(x^3 = -8\\).", loesungsweg: "$$x^3 + 8 = 0 \\;\\Rightarrow\\; x^3 = -8 \\;\\Rightarrow\\; x = -2$$ Bei ungeradem Exponenten ist eine negative Lösung möglich — \\((-2)^3 = -8\\) ✓" },
      { id: 15, level: 3, typ: "mc", frage: "\\(x^n = a\\) mit \\(n\\) gerade und \\(a > 0\\) hat …", optionen: ["1 Lösung", "2 Lösungen: \\(\\pm \\sqrt[n]{a}\\)", "0 Lösungen", "\\(n\\) Lösungen"], korrekt: 1, tipp: "Gerade Potenz ist symmetrisch.", loesungsweg: "Ist \\(n\\) gerade, so gilt \\((-x)^n = x^n\\): Zu jeder positiven Lösung gehört also die negative dazu. Für \\(a > 0\\) gibt es daher <b>zwei</b> Lösungen: $$x = \\pm\\sqrt[n]{a}$$ Bei ungeradem \\(n\\) wäre es nur eine, bei \\(a < 0\\) und geradem \\(n\\) gar keine." },
      { id: 16, level: 3, typ: "mc", frage: "\\(x^n = a\\) mit \\(n\\) ungerade hat …", optionen: ["2 Lösungen", "genau 1 reelle Lösung", "keine Lösung", "3 Lösungen"], korrekt: 1, tipp: "Ungerade Potenzen sind streng monoton.", loesungsweg: "Genau 1 reelle Lösung: \\(x = \\sqrt[n]{a}\\) (Vorzeichen beibehalten)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Löse \\(3x^3 = 24\\).", loesung: 2, toleranz: 0, tipp: "\\(x^3 = 8\\).", loesungsweg: "$$3x^3 = 24 \\;\\Rightarrow\\; x^3 = 8 \\;\\Rightarrow\\; x = 2$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(x^4 - 81 = 0\\). Gib die positive Lösung an.", loesung: 3, toleranz: 0, tipp: "\\(x^4 = 81\\).", loesungsweg: "$$x^4 = 81 \\;\\Rightarrow\\; x = \\pm\\sqrt[4]{81} = \\pm 3$$ denn \\(3^4 = 81\\)." },
      // ========== LEVEL 4 -- Verfahren selbst wählen, Umkehraufgaben, Wachstumsfaktor ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Für welchen Exponenten \\(n\\) hat die Gleichung \\(x^n = -32\\) die Lösung \\(x = -2\\)?", loesung: 5, toleranz: 0, tipp: "Setze die Lösung ein und suche die passende Potenz von \\(-2\\).", loesungsweg: "Einsetzen von \\(x = -2\\): Gesucht ist \\(n\\) mit \\((-2)^n = -32\\). Wegen \\(2^5 = 32\\) kommt nur \\(n = 5\\) in Frage, und tatsächlich $$(-2)^5 = -32$$ Der Exponent muss ungerade sein — bei geradem \\(n\\) wäre \\((-2)^n\\) positiv und könnte nie \\(-32\\) ergeben." },
      { id: 20, level: 4, typ: "numerisch", frage: "Ein Kapital wächst in drei Jahren von \\(1000\\,€\\) auf \\(1331\\,€\\), jedes Jahr um denselben Prozentsatz. Wie viel Prozent sind das pro Jahr?", loesung: 10, toleranz: 0.1, tipp: "Der Wachstumsfaktor \\(q\\) wirkt dreimal hintereinander.", loesungsweg: "Mit dem jährlichen Faktor \\(q\\) gilt $$1000 \\cdot q^3 = 1331 \\;\\Rightarrow\\; q^3 = 1{,}331 \\;\\Rightarrow\\; q = \\sqrt[3]{1{,}331} = 1{,}1$$ Der Faktor \\(1{,}1\\) bedeutet \\(10\\,\\%\\) Wachstum pro Jahr. Probe: \\(1000 \\cdot 1{,}1^3 = 1331\\) ✓ Wer \\(331\\,€\\) einfach durch \\(3\\) teilt, erhält fälschlich \\(11\\,\\%\\) — Zinsen wirken multiplikativ." },
      { id: 21, level: 4, typ: "numerisch", frage: "Löse \\((x + 1)^4 = 16\\) und gib die größere der beiden Lösungen an.", loesung: 1, toleranz: 0, tipp: "Behandle die Klammer wie eine einzelne Unbekannte.", loesungsweg: "Die Klammer als Ganzes betrachten: Gerader Exponent, positive rechte Seite, also zwei Werte: $$x + 1 = \\pm\\sqrt[4]{16} = \\pm 2$$ Daraus \\(x = 1\\) oder \\(x = -3\\). Die größere Lösung ist \\(1\\). Probe: \\((1+1)^4 = 16\\) ✓ und \\((-3+1)^4 = (-2)^4 = 16\\) ✓" },
      { id: 22, level: 4, typ: "numerisch", frage: "Wie viele reelle Lösungen hat die Gleichung \\(2x^6 + 128 = 0\\)?", loesung: 0, toleranz: 0, tipp: "Stelle nach \\(x^6\\) um und betrachte das Vorzeichen.", loesungsweg: "Umstellen: $$2x^6 = -128 \\;\\Rightarrow\\; x^6 = -64$$ Eine gerade Potenz ist für jede reelle Zahl größer oder gleich null, kann also nie \\(-64\\) sein. Die Gleichung hat <b>keine</b> reelle Lösung. Bei \\(2x^5 + 64 = 0\\) sähe es anders aus: \\(x^5 = -32\\) hätte die Lösung \\(-2\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Ein Würfel soll doppelt so viel Volumen haben wie ein Würfel mit der Kantenlänge \\(5\\,\\text{cm}\\). Wie lang ist seine Kante in cm? Runde auf zwei Dezimalstellen.", loesung: 6.3, toleranz: 0.02, tipp: "Bestimme zuerst das doppelte Volumen.", loesungsweg: "Volumen des kleinen Würfels: \\(5^3 = 125\\,\\text{cm}^3\\), das Doppelte sind \\(250\\,\\text{cm}^3\\). Die gesuchte Kante erfüllt $$a^3 = 250 \\;\\Rightarrow\\; a = \\sqrt[3]{250} \\approx 6{,}30\\,\\text{cm}$$ Doppeltes Volumen bedeutet nicht doppelte Kante (\\(10\\,\\text{cm}\\) ergäbe das Achtfache), sondern nur etwa \\(26\\,\\%\\) mehr." },
      { id: 24, level: 4, typ: "numerisch", frage: "Die Gleichung \\(x^3 = a\\) hat die Lösung \\(x = -4\\). Bestimme \\(a\\).", loesung: -64, toleranz: 0, tipp: "Die Lösung erfüllt die Gleichung — setze sie ein.", loesungsweg: "Eine Lösung macht die Gleichung wahr, also $$a = (-4)^3 = (-4) \\cdot (-4) \\cdot (-4) = -64$$ Umgekehrt: \\(x^3 = -64\\) hat als einzige reelle Lösung \\(x = \\sqrt[3]{-64} = -4\\) ✓" },
      // ========== LEVEL 5 -- Fehler finden, Sachaufgaben, Parameter ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler löst \\(x^4 = 81\\):<br>Schritt 1: \\(x = \\sqrt[4]{81} = 3\\)<br>Schritt 2: Lösungsmenge \\(\\{3\\}\\)<br>Was ist dazu zu sagen?", optionen: ["Schritt 1 ist unvollständig — bei geradem Exponenten ist auch \\(x = -3\\) Lösung, denn \\((-3)^4 = 81\\)", "Schritt 1 ist falsch, denn \\(\\sqrt[4]{81} = 9\\)", "Die Rechnung ist vollständig richtig", "Es gibt vier Lösungen: \\(3\\), \\(-3\\), \\(9\\) und \\(-9\\)"], korrekt: 0, tipp: "Setze \\(-3\\) in die Gleichung ein.", loesungsweg: "Die Wurzel ist richtig gezogen: \\(\\sqrt[4]{81} = 3\\), denn \\(3^4 = 81\\). Aber der Exponent \\(4\\) ist gerade, und gerade Potenzen löschen das Vorzeichen: $$(-3)^4 = 81 \\quad\\text{ebenso wie}\\quad 3^4 = 81$$ Die vollständige Lösungsmenge ist \\(\\{-3;\\, 3\\}\\). Die Werte \\(\\pm 9\\) scheiden aus, denn \\(9^4 = 6561\\). Merkregel: \\(x^n = a\\) mit \\(a > 0\\) und geradem \\(n\\) hat immer <b>zwei</b> Lösungen \\(\\pm\\sqrt[n]{a}\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Eine Bakterienkultur wächst in \\(4\\) Stunden von \\(500\\) auf \\(8000\\) Bakterien, jede Stunde um denselben Faktor. Wie viele Bakterien sind es nach \\(6\\) Stunden?", loesung: 32000, toleranz: 0, tipp: "Erst den Faktor pro Stunde bestimmen.", loesungsweg: "Der Stundenfaktor \\(q\\) wirkt viermal: $$500 \\cdot q^4 = 8000 \\;\\Rightarrow\\; q^4 = 16 \\;\\Rightarrow\\; q = 2$$ (der negative Wert \\(-2\\) scheidet als Wachstumsfaktor aus). Nach \\(6\\) Stunden: $$500 \\cdot 2^6 = 500 \\cdot 64 = 32\\,000$$ Oder von \\(8000\\) aus noch zweimal verdoppeln: \\(16\\,000\\), \\(32\\,000\\) ✓" },
      { id: 27, level: 5, typ: "numerisch", frage: "Für welche positive Zahl \\(k\\) hat die Gleichung \\(x^4 = k^2 - 9\\) genau <b>eine</b> reelle Lösung?", loesung: 3, toleranz: 0, tipp: "Wann hat \\(x^4 = a\\) genau eine Lösung?", loesungsweg: "Bei geradem Exponenten hängt die Lösungsanzahl von der rechten Seite ab: zwei Lösungen für \\(a > 0\\), keine für \\(a < 0\\), und genau eine (nämlich \\(x = 0\\)) für \\(a = 0\\). Also muss gelten $$k^2 - 9 = 0 \\;\\Rightarrow\\; k^2 = 9 \\;\\Rightarrow\\; k = 3 \\quad (k > 0)$$ Für \\(k = 5\\) etwa hätte \\(x^4 = 16\\) zwei Lösungen, für \\(k = 1\\) hätte \\(x^4 = -8\\) keine." },
      { id: 28, level: 5, typ: "numerisch", frage: "Löse \\((2x - 1)^3 = -125\\).", loesung: -2, toleranz: 0, tipp: "Zuerst die dritte Wurzel aus beiden Seiten ziehen.", loesungsweg: "Ungerader Exponent, also genau eine Lösung für die Klammer: $$2x - 1 = \\sqrt[3]{-125} = -5$$ Dann linear auflösen: $$2x = -4 \\;\\Rightarrow\\; x = -2$$ Probe: \\((2 \\cdot (-2) - 1)^3 = (-5)^3 = -125\\) ✓ Die Klammer zuerst auszumultiplizieren wäre ein Umweg." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Auto verliert jedes Jahr denselben Prozentsatz seines Werts. In zwei Jahren ist der Wert von \\(20\\,000\\,€\\) auf \\(12\\,800\\,€\\) gesunken. Wie viel Prozent sind das pro Jahr?", loesung: 20, toleranz: 0.1, tipp: "Der Faktor pro Jahr ist kleiner als \\(1\\).", loesungsweg: "Mit dem Jahresfaktor \\(q\\): $$20\\,000 \\cdot q^2 = 12\\,800 \\;\\Rightarrow\\; q^2 = 0{,}64 \\;\\Rightarrow\\; q = 0{,}8$$ Der Faktor \\(0{,}8\\) bedeutet \\(20\\,\\%\\) Wertverlust pro Jahr. Der Gesamtverlust beträgt zwar \\(36\\,\\%\\), aber \\(36 : 2 = 18\\) wäre falsch — der zweite Verlust bezieht sich auf den bereits verminderten Wert." },
      { id: 30, level: 5, typ: "mc", frage: "Welche der vier Gleichungen hat genau <b>eine</b> reelle Lösung?", optionen: ["\\(x^5 = -1\\)", "\\(x^2 = 4\\)", "\\(x^4 = -16\\)", "\\(x^6 = 64\\)"], korrekt: 0, tipp: "Entscheidend sind Parität des Exponenten und Vorzeichen der rechten Seite.", loesungsweg: "Systematisch: \\(x^2 = 4\\) und \\(x^6 = 64\\) haben gerade Exponenten mit positiver rechter Seite, also je zwei Lösungen (\\(\\pm 2\\)). \\(x^4 = -16\\) hat keine, weil gerade Potenzen nie negativ sind. Nur $$x^5 = -1 \\;\\Rightarrow\\; x = \\sqrt[5]{-1} = -1$$ hat genau eine reelle Lösung — ungerader Exponent, jede rechte Seite ist erlaubt." },
      // ========== LEVEL 6 -- Behauptungen prüfen, Umkehraufgaben, Fallunterscheidungen ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Eine Gleichung \\(x^n = a\\) mit geradem \\(n\\) hat immer genau zwei reelle Lösungen.\" Stimmt das?", optionen: ["Nein — für \\(a < 0\\) gibt es keine, für \\(a = 0\\) genau eine Lösung; nur für \\(a > 0\\) sind es zwei", "Ja — gerade Exponenten liefern wegen \\((-x)^n = x^n\\) immer ein Lösungspaar", "Nein — es sind immer \\(n\\) Lösungen, so viele wie der Exponent angibt", "Ja, sofern \\(n \\geq 2\\) ist"], korrekt: 0, tipp: "Probiere \\(x^2 = 0\\) und \\(x^2 = -1\\).", loesungsweg: "Die Behauptung übersieht die rechte Seite. Für gerades \\(n\\) gilt \\(x^n \\geq 0\\) für alle reellen \\(x\\), deshalb: $$a > 0:\\ x = \\pm\\sqrt[n]{a} \\ (2 \\text{ Lösungen}), \\qquad a = 0:\\ x = 0 \\ (1 \\text{ Lösung}), \\qquad a < 0:\\ \\text{keine Lösung}$$ Beispiel: \\(x^2 = 0\\) hat nur die Lösung \\(0\\), \\(x^4 = -1\\) gar keine. Die Anzahl \\(n\\) hat mit der Zahl der reellen Lösungen nichts zu tun." },
      { id: 32, level: 6, typ: "numerisch", frage: "Eine Population wächst jedes Jahr um denselben Faktor. Nach \\(2\\) Jahren umfasst sie \\(1200\\) Tiere, nach \\(5\\) Jahren \\(9600\\). Wie groß war sie zu Beginn?", loesung: 300, toleranz: 0, tipp: "Zwischen den beiden Angaben liegen drei Jahre.", loesungsweg: "Von Jahr \\(2\\) bis Jahr \\(5\\) wirkt der Faktor \\(q\\) dreimal: $$1200 \\cdot q^3 = 9600 \\;\\Rightarrow\\; q^3 = 8 \\;\\Rightarrow\\; q = 2$$ Vom Anfangswert \\(N_0\\) bis Jahr \\(2\\) wirkt er zweimal: $$N_0 \\cdot 2^2 = 1200 \\;\\Rightarrow\\; N_0 = 300$$ Probe: \\(300 \\cdot 2^5 = 9600\\) ✓ Der Trick besteht darin, den Faktor aus der <b>Differenz</b> der Zeitpunkte zu gewinnen, ohne den Anfangswert zu kennen." },
      { id: 33, level: 6, typ: "numerisch", frage: "Für wie viele ganze Zahlen \\(a\\) mit \\(-10 \\leq a \\leq 10\\) hat die Gleichung \\(x^4 = a\\) genau zwei reelle Lösungen?", loesung: 10, toleranz: 0, tipp: "Unterscheide \\(a < 0\\), \\(a = 0\\) und \\(a > 0\\).", loesungsweg: "Fallunterscheidung nach dem Vorzeichen von \\(a\\): Für \\(a < 0\\) gibt es keine Lösung, für \\(a = 0\\) nur \\(x = 0\\), für \\(a > 0\\) genau zwei Lösungen \\(\\pm\\sqrt[4]{a}\\). $$a \\in \\{1, 2, 3, \\ldots, 10\\}$$ Das sind \\(10\\) Werte. Dass die Lösungen für die meisten davon irrational sind (etwa \\(\\sqrt[4]{2}\\)), ändert an ihrer Anzahl nichts." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für welche Zahl \\(a\\) hat die Gleichung \\(x^3 - a = 0\\) dieselbe Lösung wie die positive Lösung von \\(2x^2 - 18 = 0\\)?", loesung: 27, toleranz: 0, tipp: "Löse zuerst die zweite Gleichung.", loesungsweg: "Die zweite Gleichung: $$2x^2 = 18 \\;\\Rightarrow\\; x^2 = 9 \\;\\Rightarrow\\; x = 3 \\ (x > 0)$$ Diese Zahl muss auch \\(x^3 - a = 0\\) erfüllen: $$3^3 - a = 0 \\;\\Rightarrow\\; a = 27$$ Probe: \\(x^3 = 27\\) hat als einzige reelle Lösung \\(x = 3\\) ✓" },
      { id: 35, level: 6, typ: "numerisch", frage: "Wie viele reelle Lösungen hat die Gleichung \\(x^{-4} = 16\\)?", loesung: 2, toleranz: 0, tipp: "Schreibe die linke Seite als Bruch.", loesungsweg: "Mit \\(x^{-4} = \\frac{1}{x^4}\\) und \\(x \\neq 0\\): $$\\frac{1}{x^4} = 16 \\;\\Rightarrow\\; x^4 = \\frac{1}{16} \\;\\Rightarrow\\; x = \\pm\\sqrt[4]{\\tfrac{1}{16}} = \\pm\\frac12$$ Gerader Exponent, positive rechte Seite — zwei Lösungen. Probe: \\(\\left(\\tfrac12\\right)^{-4} = 2^4 = 16\\) ✓ Der negative Exponent ändert nur den Wert, nicht die Anzahl der Lösungen." },
      { id: 36, level: 6, typ: "mc", frage: "Ein Schüler behauptet: „\\(x^6 = 64\\) hat sechs Lösungen, weil der Exponent \\(6\\) ist.\" Was ist dazu zu sagen?", optionen: ["Falsch — reell gibt es nur \\(x = 2\\) und \\(x = -2\\); die Anzahl hängt von Parität und Vorzeichen ab, nicht vom Wert des Exponenten", "Richtig — eine Gleichung \\(n\\)-ten Grades hat immer \\(n\\) reelle Lösungen", "Falsch — es gibt genau drei Lösungen, nämlich \\(2\\), \\(-2\\) und \\(0\\)", "Falsch — es gibt nur eine Lösung, nämlich \\(x = \\sqrt[6]{64} = 2\\)"], korrekt: 0, tipp: "Welche reellen Zahlen ergeben hoch sechs den Wert \\(64\\)?", loesungsweg: "Gesucht sind reelle Zahlen mit \\(x^6 = 64\\). Wegen \\(2^6 = 64\\) und \\((-2)^6 = 64\\) sind das genau $$x = 2 \\quad\\text{und}\\quad x = -2$$ Weitere reelle Lösungen gibt es nicht: Für \\(|x| > 2\\) ist \\(x^6 > 64\\), für \\(|x| < 2\\) ist \\(x^6 < 64\\). Die Zahl \\(0\\) scheidet aus (\\(0^6 = 0\\)). Bei reinen Potenzgleichungen \\(x^n = a\\) gibt es höchstens zwei reelle Lösungen — gleichgültig, wie groß \\(n\\) ist." }];
    </script>
