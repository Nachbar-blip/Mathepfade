<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzgleichungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-potenzgleichungen';
    const THEMA_CONFIG = { name: 'Potenzgleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Löse \\(x^2 = 9\\). Positive Lösung?", loesung: 3, toleranz: 0, tipp: "Wurzel ziehen.", loesungsweg: "$$x = \\pm 3$$" },
      { id: 2, level: 1, typ: "numerisch", frage: "Löse \\(x^3 = 8\\).", loesung: 2, toleranz: 0, tipp: "3. Wurzel: \\(\\sqrt[3]{8}\\).", loesungsweg: "$$x = 2$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "Löse \\(x^3 = -27\\).", loesung: -3, toleranz: 0, tipp: "Ungerade Potenz: Vorzeichen bleibt.", loesungsweg: "$$x = \\sqrt[3]{-27} = -3$$" },
      { id: 4, level: 1, typ: "numerisch", frage: "Löse \\(x^2 = 100\\). Positive Lösung?", loesung: 10, toleranz: 0, tipp: "\\(\\sqrt{100}\\).", loesungsweg: "$$x = \\pm 10$$" },
      { id: 5, level: 1, typ: "mc", frage: "Wie viele reelle Lösungen hat \\(x^2 = 0\\)?", optionen: ["0", "1", "2", "unendlich"], korrekt: 1, tipp: "Nur \\(x = 0\\).", loesungsweg: "\\(x = 0\\) (doppelte Lösung, aber 1 Zahl)." },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(x^3 = 1\\).", loesung: 1, toleranz: 0, tipp: "\\(1^3 = 1\\).", loesungsweg: "$$x = 1$$" },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Löse \\(x^2 = 81\\). Positive Lösung?", loesung: 9, toleranz: 0, tipp: "\\(\\sqrt{81}\\).", loesungsweg: "$$x = \\pm 9$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\(x^4 = 16\\). Positive Lösung?", loesung: 2, toleranz: 0, tipp: "\\(\\sqrt[4]{16}\\).", loesungsweg: "$$x = \\pm 2$$" },
      { id: 9, level: 2, typ: "mc", frage: "Wie viele reelle Lösungen hat \\(x^4 = -16\\)?", optionen: ["2", "1", "0", "4"], korrekt: 2, tipp: "Gerader Exponent → immer \\(\\geq 0\\).", loesungsweg: "\\(x^4 \\geq 0\\) → keine reelle Lösung." },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(x^5 = 32\\).", loesung: 2, toleranz: 0, tipp: "\\(\\sqrt[5]{32}\\).", loesungsweg: "$$x = 2$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Löse \\(2x^2 = 72\\). Positive Lösung?", loesung: 6, toleranz: 0, tipp: "\\(x^2 = 36\\).", loesungsweg: "$$x = \\pm 6$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Löse \\(x^3 = 125\\).", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt[3]{125}\\).", loesungsweg: "$$x = 5$$" },
      // ========== LEVEL 3 ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(x^2 - 16 = 0\\). Positive Lösung?", loesung: 4, toleranz: 0, tipp: "\\(x^2 = 16\\).", loesungsweg: "$$x = \\pm 4$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\(x^3 + 8 = 0\\).", loesung: -2, toleranz: 0, tipp: "\\(x^3 = -8\\).", loesungsweg: "$$x = -2$$" },
      { id: 15, level: 3, typ: "mc", frage: "\\(x^n = a\\) mit \\(n\\) gerade und \\(a > 0\\) hat …", optionen: ["1 Lösung", "2 Lösungen: \\(\\pm \\sqrt[n]{a}\\)", "0 Lösungen", "\\(n\\) Lösungen"], korrekt: 1, tipp: "Gerade Potenz ist symmetrisch.", loesungsweg: "Zwei Lösungen: \\(x = \\pm \\sqrt[n]{a}\\)." },
      { id: 16, level: 3, typ: "mc", frage: "\\(x^n = a\\) mit \\(n\\) ungerade hat …", optionen: ["2 Lösungen", "genau 1 reelle Lösung", "keine Lösung", "3 Lösungen"], korrekt: 1, tipp: "Ungerade Potenzen sind streng monoton.", loesungsweg: "Genau 1 reelle Lösung: \\(x = \\sqrt[n]{a}\\) (Vorzeichen beibehalten)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Löse \\(3x^3 = 24\\).", loesung: 2, toleranz: 0, tipp: "\\(x^3 = 8\\).", loesungsweg: "$$x = 2$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(x^4 - 81 = 0\\). Positive Lösung?", loesung: 3, toleranz: 0, tipp: "\\(x^4 = 81\\).", loesungsweg: "$$x = \\pm 3$$" },
      // ========== LEVEL 4 -- rationale Exponenten ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Löse \\(x^{1/2} = 6\\).", loesung: 36, toleranz: 0, tipp: "Quadrieren.", loesungsweg: "$$x = 36$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Löse \\(x^{1/3} = 4\\).", loesung: 64, toleranz: 0, tipp: "\\(x = 4^3\\).", loesungsweg: "$$x = 64$$" },
      { id: 21, level: 4, typ: "numerisch", frage: "Löse \\(x^{2/3} = 9\\).", loesung: 27, toleranz: 0, tipp: "Potenziere mit \\(\\frac{3}{2}\\): \\(x = 9^{3/2}\\).", loesungsweg: "$$x = 9^{3/2} = (\\sqrt{9})^3 = 27$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Löse \\(x^{3/2} = 8\\).", loesung: 4, toleranz: 0, tipp: "Potenziere mit \\(\\frac{2}{3}\\): \\(x = 8^{2/3}\\).", loesungsweg: "$$x = 8^{2/3} = 4$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Löse \\(x^{-1} = 0{,}25\\).", loesung: 4, toleranz: 0, tipp: "\\(\\frac{1}{x} = 0{,}25\\).", loesungsweg: "$$x = 4$$" },
      { id: 24, level: 4, typ: "numerisch", frage: "Löse \\(x^{-2} = \\frac{1}{16}\\). Positive Lösung?", loesung: 4, toleranz: 0, tipp: "\\(\\frac{1}{x^2} = \\frac{1}{16} \\Rightarrow x^2 = 16\\).", loesungsweg: "$$x = \\pm 4$$" },
      // ========== LEVEL 5 ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Löse \\(x^5 - 243 = 0\\).", loesung: 3, toleranz: 0, tipp: "\\(x^5 = 243 = 3^5\\).", loesungsweg: "$$x = 3$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Löse \\((x-1)^3 = 27\\).", loesung: 4, toleranz: 0, tipp: "\\(x - 1 = 3\\).", loesungsweg: "$$x = 4$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Löse \\((x + 2)^2 = 49\\). Größere Lösung?", loesung: 5, toleranz: 0, tipp: "\\(x + 2 = \\pm 7\\).", loesungsweg: "\\(x = 5\\) oder \\(x = -9\\). Größer: 5." },
      { id: 28, level: 5, typ: "numerisch", frage: "Das Volumen eines Würfels ist \\(V = a^3 = 216\\,\\text{cm}^3\\). Kantenlänge \\(a\\)?", loesung: 6, toleranz: 0, tipp: "\\(\\sqrt[3]{216}\\).", loesungsweg: "$$a = 6\\,\\text{cm}$$" },
      { id: 29, level: 5, typ: "numerisch", frage: "Flächeninhalt eines Quadrats: \\(a^2 = 144\\). Seitenlänge?", loesung: 12, toleranz: 0, tipp: "\\(\\sqrt{144}\\).", loesungsweg: "$$a = 12$$" },
      { id: 30, level: 5, typ: "mc", frage: "Welche Lösung ist falsch? \\(x^2 = 16\\).", optionen: ["\\(x = 4\\)", "\\(x = -4\\)", "\\(x = 4\\) oder \\(x = -4\\)", "\\(x = 2\\)"], korrekt: 3, tipp: "Prüfe durch Einsetzen.", loesungsweg: "\\(2^2 = 4 \\neq 16\\) → falsch." },
      // ========== LEVEL 6 ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Löse \\(x^3 = 64\\). Reelle Lösung?", loesung: 4, toleranz: 0, tipp: "\\(4^3 = 64\\).", loesungsweg: "$$x = 4$$" },
      { id: 32, level: 6, typ: "numerisch", frage: "Löse \\(2x^4 - 32 = 0\\). Positive Lösung?", loesung: 2, toleranz: 0, tipp: "\\(x^4 = 16\\).", loesungsweg: "$$x = \\pm 2$$" },
      { id: 33, level: 6, typ: "numerisch", frage: "Löse \\(x^6 = 64\\). Positive Lösung?", loesung: 2, toleranz: 0, tipp: "\\(\\sqrt[6]{64} = 2\\) (denn \\(2^6 = 64\\)).", loesungsweg: "$$x = \\pm 2$$" },
      { id: 34, level: 6, typ: "numerisch", frage: "Löse \\(x^{3/4} = 8\\).", loesung: 16, toleranz: 0, tipp: "\\(x = 8^{4/3} = (\\sqrt[3]{8})^4 = 2^4\\).", loesungsweg: "$$x = 2^4 = 16$$" },
      { id: 35, level: 6, typ: "mc", frage: "Welche Gleichung hat genau 2 reelle Lösungen?", optionen: ["\\(x^3 = 27\\)", "\\(x^2 = 25\\)", "\\(x^4 = -1\\)", "\\(x^5 = 0\\)"], korrekt: 1, tipp: "Gerade Potenz mit positivem Ergebnis.", loesungsweg: "\\(x^2 = 25 \\Rightarrow x = \\pm 5\\) → 2 Lösungen." },
      { id: 36, level: 6, typ: "numerisch", frage: "Kugelvolumen \\(V = \\frac{4}{3}\\pi r^3 = 36\\pi\\). Gesucht: Radius \\(r\\).", loesung: 3, toleranz: 0, tipp: "\\(r^3 = 27\\).", loesungsweg: "$$\\frac{4}{3}r^3 = 36 \\Rightarrow r^3 = 27 \\Rightarrow r = 3$$" }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
