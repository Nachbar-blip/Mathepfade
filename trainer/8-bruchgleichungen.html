<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruchgleichungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-bruchgleichungen';
    const THEMA_CONFIG = { name: 'Bruchgleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Was ist eine Bruchgleichung?", optionen: ["Eine Gleichung mit Dezimalbrüchen", "Eine Gleichung, bei der die Variable im Nenner steht", "Ein Bruchterm", "Eine Ungleichung"], korrekt: 1, tipp: "Variable im Nenner.", loesungsweg: "Eine <b>Bruchgleichung</b> ist eine Gleichung, bei der mindestens eine Variable im Nenner steht, z. B. \\(\\frac{2}{x} = 4\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Was muss man bei Bruchgleichungen immer zuerst prüfen?", optionen: ["Ob der Zähler 0 ist", "Den Definitionsbereich", "Ob sie quadratisch ist", "Die Probe"], korrekt: 1, tipp: "Nenner ≠ 0.", loesungsweg: "Zuerst den <b>Definitionsbereich</b> bestimmen - der Nenner darf nicht 0 sein." },
      { id: 3, level: 1, typ: "mc", frage: "Welcher Wert gehört NICHT zum Definitionsbereich von \\(\\frac{1}{x} = 3\\)?", optionen: ["\\(x = 3\\)", "\\(x = 1\\)", "\\(x = 0\\)", "\\(x = -1\\)"], korrekt: 2, tipp: "Nenner \\(x\\) darf nicht 0 sein.", loesungsweg: "\\(x = 0\\) ist ausgeschlossen, weil man nicht durch 0 teilen darf." },
      { id: 4, level: 1, typ: "numerisch", frage: "Löse \\(\\frac{12}{x} = 4\\).", loesung: 3, toleranz: 0, tipp: "\\(x = \\frac{12}{4}\\).", loesungsweg: "$$\\frac{12}{x} = 4 \\implies 12 = 4x \\implies x = 3$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Löse \\(\\frac{20}{x} = 5\\).", loesung: 4, toleranz: 0, tipp: "Mit \\(x\\) multiplizieren.", loesungsweg: "$$20 = 5x \\implies x = 4$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(\\frac{6}{x} = 2\\).", loesung: 3, toleranz: 0, tipp: "\\(6 = 2x\\).", loesungsweg: "$$6 = 2x \\implies x = 3$$" },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "Löse \\(\\frac{3}{x} = \\frac{1}{2}\\).", loesung: 6, toleranz: 0, tipp: "Über Kreuz multiplizieren.", loesungsweg: "Über Kreuz: $$3 \\cdot 2 = 1 \\cdot x \\implies x = 6$$ Probe: \\(\\frac{3}{6} = \\frac{1}{2}\\) ✓" },
      { id: 8, level: 2, typ: "mc", frage: "Welches ist die Lösung von \\(\\frac{4}{x} = \\frac{2}{3}\\)?", optionen: ["\\(x = 3\\)", "\\(x = 6\\)", "\\(x = 8\\)", "\\(x = 12\\)"], korrekt: 1, tipp: "Kreuzprodukt: \\(4 \\cdot 3 = 2x\\).", loesungsweg: "$$4 \\cdot 3 = 2x \\implies 12 = 2x \\implies x = 6$$" },
      { id: 9, level: 2, typ: "mc", frage: "Was ist die Definitionsmenge von \\(\\frac{5}{x-2} = 1\\)?", optionen: ["\\(\\mathbb{Q} \\setminus \\{0\\}\\)", "\\(\\mathbb{Q} \\setminus \\{2\\}\\)", "\\(\\mathbb{Q} \\setminus \\{-2\\}\\)", "\\(\\mathbb{Q}\\)"], korrekt: 1, tipp: "Nenner \\(x - 2 = 0\\).", loesungsweg: "\\(x - 2 = 0 \\Rightarrow x = 2\\). Also \\(D = \\mathbb{Q} \\setminus \\{2\\}\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(\\frac{8}{x-1} = 4\\).", loesung: 3, toleranz: 0, tipp: "\\(8 = 4(x-1)\\).", loesungsweg: "$$8 = 4(x-1) \\implies 2 = x-1 \\implies x = 3$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Löse \\(\\frac{15}{x+2} = 3\\).", loesung: 3, toleranz: 0, tipp: "\\(15 = 3(x+2)\\).", loesungsweg: "$$15 = 3(x+2) \\implies 5 = x+2 \\implies x = 3$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Löse \\(\\frac{x}{5} = \\frac{6}{10}\\).", loesung: 3, toleranz: 0, tipp: "Kreuz: \\(10x = 30\\).", loesungsweg: "$$10x = 30 \\implies x = 3$$" },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(\\frac{x}{4} + \\frac{x}{6} = 5\\).", loesung: 12, toleranz: 0, tipp: "Der Hauptnenner ist das kgV beider Nenner.", loesungsweg: "Hauptnenner \\(12\\): $$3x + 2x = 60 \\implies 5x = 60 \\implies x = 12$$ Probe: \\(3 + 2 = 5\\) ✓" },
      { id: 14, level: 3, typ: "mc", frage: "Lösung von \\(\\frac{x}{2} + \\frac{x}{3} = 5\\)?", optionen: ["\\(x = 3\\)", "\\(x = 5\\)", "\\(x = 6\\)", "\\(x = 10\\)"], korrekt: 2, tipp: "Mal 6.", loesungsweg: "$$3x + 2x = 30 \\implies 5x = 30 \\implies x = 6$$" },
      { id: 15, level: 3, typ: "mc", frage: "Welchen Hauptnenner hat \\(\\frac{1}{x} + \\frac{1}{2x} = 3\\)?", optionen: ["\\(x\\)", "\\(2x\\)", "\\(x^2\\)", "\\(2x^2\\)"], korrekt: 1, tipp: "Beide Nenner passen in \\(2x\\).", loesungsweg: "Hauptnenner: \\(2x\\). Gleichung: \\(2 + 1 = 6x \\Rightarrow x = \\frac{1}{2}\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Löse \\(\\frac{x}{3} - \\frac{x}{4} = 1\\).", loesung: 12, toleranz: 0, tipp: "Hauptnenner bilden.", loesungsweg: "$$4x - 3x = 12 \\implies x = 12$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Löse \\(\\frac{1}{x} = \\frac{1}{6} + \\frac{1}{12}\\).", loesung: 4, toleranz: 0, tipp: "Rechte Seite: \\(\\frac{3}{12} = \\frac{1}{4}\\).", loesungsweg: "$$\\frac{1}{x} = \\frac{2+1}{12} = \\frac{1}{4} \\implies x = 4$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(\\frac{2}{x} + \\frac{3}{x} = 1\\).", loesung: 5, toleranz: 0, tipp: "\\(\\frac{5}{x} = 1\\).", loesungsweg: "$$\\frac{5}{x} = 1 \\implies x = 5$$" },
      // LEVEL 4
      { id: 19, level: 4, typ: "mc", frage: "Lösung von \\(\\frac{x+1}{x-1} = 2\\)?", optionen: ["\\(x = 1\\)", "\\(x = 2\\)", "\\(x = 3\\)", "\\(x = -3\\)"], korrekt: 2, tipp: "Mal \\((x-1)\\).", loesungsweg: "$$x + 1 = 2(x-1) \\implies x + 1 = 2x - 2 \\implies x = 3$$" },
      { id: 20, level: 4, typ: "mc", frage: "Lösung von \\(\\frac{3}{x-2} = \\frac{5}{x}\\)?", optionen: ["\\(x = 2\\)", "\\(x = 5\\)", "\\(x = -5\\)", "\\(x = 10\\)"], korrekt: 1, tipp: "Kreuz: \\(3x = 5(x-2)\\).", loesungsweg: "$$3x = 5x - 10 \\implies -2x = -10 \\implies x = 5$$" },
      { id: 21, level: 4, typ: "mc", frage: "Bei \\(\\frac{x}{x-3} = \\frac{3}{x-3}\\) ist die Lösung …", optionen: ["genau die Lösung \\(x = 3\\)", "genau die Lösung \\(x = 0\\)", "keine Lösung, da \\(3 \\notin D\\)", "jede Zahl aus \\(D\\)"], korrekt: 2, tipp: "\\(x = 3\\) ist aus D ausgeschlossen.", loesungsweg: "Über Kreuz ergibt \\(x = 3\\), aber \\(x = 3\\) ist nicht in D. Also <b>keine Lösung</b>." },
      { id: 22, level: 4, typ: "numerisch", frage: "Löse \\(\\frac{x+4}{x} = 3\\).", loesung: 2, toleranz: 0, tipp: "\\(x + 4 = 3x\\).", loesungsweg: "$$x + 4 = 3x \\implies 4 = 2x \\implies x = 2$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Löse \\(\\frac{2x}{x+1} = 1\\).", loesung: 1, toleranz: 0, tipp: "\\(2x = x+1\\).", loesungsweg: "$$2x = x + 1 \\implies x = 1$$" },
      { id: 24, level: 4, typ: "numerisch", frage: "Löse \\(\\frac{5}{x-3} = \\frac{10}{x}\\).", loesung: 6, toleranz: 0, tipp: "Kreuz: \\(5x = 10(x-3)\\).", loesungsweg: "$$5x = 10x - 30 \\implies -5x = -30 \\implies x = 6$$ Probe: \\(\\frac{5}{3} = \\frac{10}{6}\\) ✓" },
      // LEVEL 5 (Fehler finden, Scheinlösung, Sachaufgaben, Parameter)
      { id: 25, level: 5, typ: "mc", frage: "Jonas löst \\(\\frac{3}{x-2} = \\frac{6}{x}\\):<br>Schritt 1: \\(3x = 6(x-2)\\)<br>Schritt 2: \\(3x = 6x - 2\\)<br>Schritt 3: \\(-3x = -2 \\Rightarrow x = \\frac{2}{3}\\)<br>Wo liegt der erste Fehler?", optionen: ["Schritt 1: über Kreuz multiplizieren ist bei verschiedenen Nennern nicht erlaubt", "Schritt 2: beim Ausmultiplizieren muss \\(3x = 6x - 12\\) herauskommen", "Schritt 3: aus \\(-3x = -2\\) folgt \\(x = -\\frac{2}{3}\\), das Vorzeichen fehlt", "Es gibt keinen Fehler, \\(x = \\frac{2}{3}\\) ist die Lösung der Gleichung"], korrekt: 1, tipp: "Multipliziere die Klammer in Schritt 2 sorgfältig aus.", loesungsweg: "Schritt 1 ist richtig. In Schritt 2 wurde die 6 nur mit \\(x\\) multipliziert, nicht mit \\(-2\\): $$3x = 6x - 12 \\implies -3x = -12 \\implies x = 4$$ Probe: \\(\\frac{3}{2} = \\frac{6}{4}\\) ✓" },
      { id: 26, level: 5, typ: "numerisch", frage: "Wie viele Lösungen hat die Gleichung \\(\\frac{x}{x-4} = \\frac{4}{x-4} + 2\\)?", loesung: 0, toleranz: 0, tipp: "Rechne die Gleichung durch und vergleiche das Ergebnis mit der Definitionsmenge.", loesungsweg: "\\(D = \\mathbb{Q} \\setminus \\{4\\}\\). Mal \\((x-4)\\): $$x = 4 + 2(x-4) \\implies x = 2x - 4 \\implies x = 4$$ Der Wert \\(4\\) ist aber ausgeschlossen — Scheinlösung. Die Gleichung hat <b>keine</b> Lösung." },
      { id: 27, level: 5, typ: "numerisch", frage: "Pumpe A füllt ein Becken allein in 6 Stunden, Pumpe B allein in 3 Stunden. Wie viele Stunden brauchen beide Pumpen zusammen?", loesung: 2, toleranz: 0, tipp: "Welchen Anteil des Beckens schafft jede Pumpe in einer Stunde?", loesungsweg: "Pro Stunde: A schafft \\(\\frac{1}{6}\\), B schafft \\(\\frac{1}{3}\\), zusammen \\(\\frac{1}{t}\\): $$\\frac{1}{6} + \\frac{1}{3} = \\frac{1}{t} \\implies \\frac{3}{6} = \\frac{1}{t} \\implies t = 2$$ Zusammen brauchen sie \\(2\\) Stunden." },
      { id: 28, level: 5, typ: "numerisch", frage: "Ein Radfahrer fährt eine 60 km lange Strecke. Wäre er 5 km/h schneller gefahren, hätte er eine Stunde weniger gebraucht. Wie schnell war er (in km/h)?", loesung: 15, toleranz: 0, tipp: "Zeit ist Weg durch Geschwindigkeit — für beide Fälle.", loesungsweg: "Geschwindigkeit \\(v\\): $$\\frac{60}{v} - \\frac{60}{v+5} = 1 \\implies 60(v+5) - 60v = v(v+5) \\implies 300 = v^2 + 5v$$ $$v^2 + 5v - 300 = 0 \\implies v = -2{,}5 \\pm 17{,}5$$ Sinnvoll: \\(v = 15\\,\\text{km/h}\\). Probe: \\(4\\,\\text{h} - 3\\,\\text{h} = 1\\,\\text{h}\\) ✓" },
      { id: 29, level: 5, typ: "numerisch", frage: "Für welchen Wert von \\(a\\) hat die Gleichung \\(\\frac{6}{x+a} = 2\\) die Lösung \\(x = 5\\)?", loesung: -2, toleranz: 0, tipp: "Die Lösung erfüllt die Gleichung — einsetzen und nach \\(a\\) auflösen.", loesungsweg: "\\(x = 5\\) einsetzen: $$\\frac{6}{5+a} = 2 \\implies 5 + a = 3 \\implies a = -2$$ Probe: \\(\\frac{6}{5-2} = 2\\) ✓" },
      { id: 30, level: 5, typ: "numerisch", frage: "Mia löst \\(\\frac{2}{x} + \\frac{3}{2x} = 7\\) und erhält \\(x = 2\\); Nils erhält \\(x = 0{,}5\\). Gib die richtige Lösung an.", loesung: 0.5, toleranz: 0.01, tipp: "Eine Probe entscheidet, wer recht hat.", loesungsweg: "Hauptnenner \\(2x\\): $$4 + 3 = 14x \\implies x = \\frac{7}{14} = 0{,}5$$ Probe: \\(\\frac{2}{0{,}5} + \\frac{3}{1} = 4 + 3 = 7\\) ✓ Mia hat Zähler und Nenner vertauscht." },
      // LEVEL 6 (Behauptungen, Sonderfälle, Umkehraufgaben)
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Jede Bruchgleichung hat höchstens eine Lösung.“ Was gilt?", optionen: ["Wahr, denn nach dem Beseitigen der Nenner bleibt stets eine lineare Gleichung", "Falsch, denn \\(\\frac{x}{2} = \\frac{2}{x}\\) hat die beiden Lösungen \\(2\\) und \\(-2\\)", "Wahr, denn eine zweite Lösung wäre immer eine Scheinlösung", "Falsch, denn jede Bruchgleichung hat genau zwei Lösungen"], korrekt: 1, tipp: "Suche eine Bruchgleichung, die auf eine quadratische Gleichung führt.", loesungsweg: "Gegenbeispiel: \\(\\frac{x}{2} = \\frac{2}{x}\\) ergibt über Kreuz \\(x^2 = 4\\), also \\(x = 2\\) oder \\(x = -2\\); beide liegen in \\(D = \\mathbb{Q} \\setminus \\{0\\}\\). Die Anzahl der Lösungen hängt von der entstehenden Gleichung ab — sie kann null, eins, zwei oder unendlich sein." },
      { id: 32, level: 6, typ: "mc", frage: "Welche Lösungsmenge hat \\(\\frac{x^2 - 9}{x - 3} = x + 3\\)?", optionen: ["\\(\\mathbb{L} = \\{3\\}\\), die einzige Zahl mit Zähler null", "\\(\\mathbb{L} = \\{\\}\\), die Gleichung hat keine Lösung", "\\(\\mathbb{L} = \\mathbb{Q} \\setminus \\{3\\}\\), alle Zahlen außer der Definitionslücke", "\\(\\mathbb{L} = \\mathbb{Q}\\), die Gleichung gilt für alle Zahlen"], korrekt: 2, tipp: "Der Zähler lässt sich mit einer binomischen Formel faktorisieren.", loesungsweg: "\\(D = \\mathbb{Q} \\setminus \\{3\\}\\). Kürzen: $$\\frac{(x-3)(x+3)}{x-3} = x + 3$$ Für jedes \\(x \\ne 3\\) ist die Gleichung wahr — unendlich viele Lösungen. Die Zahl \\(3\\) selbst gehört nicht dazu, obwohl \\(3 + 3 = 6\\) „passen“ würde: Der Nenner wäre null." },
      { id: 33, level: 6, typ: "numerisch", frage: "Für welchen Wert von \\(b\\) ist \\(x = 3\\) eine Scheinlösung der Gleichung \\(\\frac{x+1}{x-b} = \\frac{4}{x-b}\\)?", loesung: 3, toleranz: 0, tipp: "Scheinlösung: Die Rechnung liefert den Wert, aber er liegt nicht in der Definitionsmenge.", loesungsweg: "Über Kreuz: \\(x + 1 = 4 \\Rightarrow x = 3\\) — unabhängig von \\(b\\). Damit \\(3\\) Scheinlösung ist, muss \\(3\\) die Definitionslücke sein: $$x - b = 0 \\text{ für } x = 3 \\implies b = 3$$ Für jedes andere \\(b\\) ist \\(x = 3\\) eine echte Lösung." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für welchen Wert von \\(a\\) hat die Gleichung \\(\\frac{2x + a}{x - 2} = 2\\) unendlich viele Lösungen?", loesung: -4, toleranz: 0, tipp: "Bringe die rechte Seite auf den Nenner \\(x - 2\\) und vergleiche die Zähler.", loesungsweg: "Mal \\((x-2)\\): \\(2x + a = 2x - 4\\), also \\(a = -4\\). Fallunterscheidung: Für \\(a = -4\\) ist die Gleichung für jedes \\(x \\ne 2\\) wahr (unendlich viele Lösungen); für jedes andere \\(a\\) bleibt eine falsche Aussage \\(a = -4\\) — keine Lösung. Genau eine Lösung gibt es hier nie." },
      { id: 35, level: 6, typ: "numerisch", frage: "Zwei Drucker erledigen einen Auftrag gemeinsam in 12 Minuten. Drucker A allein bräuchte 20 Minuten. Wie viele Minuten bräuchte Drucker B allein?", loesung: 30, toleranz: 0, tipp: "Die Anteile pro Minute beider Drucker ergeben zusammen den Anteil bei gemeinsamer Arbeit.", loesungsweg: "Anteil pro Minute: $$\\frac{1}{20} + \\frac{1}{b} = \\frac{1}{12} \\implies \\frac{1}{b} = \\frac{5}{60} - \\frac{3}{60} = \\frac{2}{60} = \\frac{1}{30}$$ Drucker B allein bräuchte \\(30\\) Minuten." },
      { id: 36, level: 6, typ: "numerisch", frage: "Die Gleichung \\(\\frac{a}{x} + \\frac{b}{2x} = 1\\) hat die Lösung \\(x = 4\\); außerdem gilt \\(a + b = 6\\). Bestimme \\(a\\).", loesung: 2, toleranz: 0, tipp: "Die Lösung einsetzen liefert eine zweite Gleichung für \\(a\\) und \\(b\\).", loesungsweg: "\\(x = 4\\) einsetzen: \\(\\frac{a}{4} + \\frac{b}{8} = 1\\), mal 8: \\(2a + b = 8\\). Mit \\(a + b = 6\\): $$2a + b - (a + b) = 8 - 6 \\implies a = 2,\\; b = 4$$ Probe: \\(\\frac{2}{4} + \\frac{4}{8} = 1\\) ✓" }
    ];
    </script>

</body>
