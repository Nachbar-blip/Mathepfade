<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratische Gleichungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-quadratische-gleichungen';
    const THEMA_CONFIG = { name: 'Quadratische Gleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Löse \\(x^2 = 25\\). Positive Lösung?", loesung: 5, toleranz: 0, tipp: "Wurzel ziehen.", loesungsweg: "$$x = \\pm\\sqrt{25} = \\pm 5$$" },
      { id: 2, level: 1, typ: "numerisch", frage: "Löse \\(x^2 = 49\\). Positive Lösung?", loesung: 7, toleranz: 0, tipp: "\\(\\sqrt{49}\\).", loesungsweg: "$$x = \\pm 7$$" },
      { id: 3, level: 1, typ: "mc", frage: "Wie viele Lösungen hat \\(x^2 = 0\\)?", optionen: ["Keine", "1", "2", "unendlich viele"], korrekt: 1, tipp: "Nur eine Zahl quadriert ergibt 0.", loesungsweg: "\\(x = 0\\) (doppelte Lösung)." },
      { id: 4, level: 1, typ: "mc", frage: "Hat \\(x^2 = -4\\) reelle Lösungen?", optionen: ["Ja, \\(x = -2\\)", "Ja, \\(x = \\pm 2\\)", "Nein", "Ja, \\(x = 2\\)"], korrekt: 2, tipp: "Quadrat ist immer \\(\\geq 0\\).", loesungsweg: "Keine reelle Lösung: \\(x^2 \\geq 0\\)." },
      { id: 5, level: 1, typ: "numerisch", frage: "Löse \\(x^2 - 16 = 0\\). Positive Lösung?", loesung: 4, toleranz: 0, tipp: "\\(x^2 = 16\\).", loesungsweg: "$$x = \\pm 4$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(2x^2 = 50\\). Positive Lösung?", loesung: 5, toleranz: 0, tipp: "Durch 2 teilen, dann Wurzel.", loesungsweg: "$$x^2 = 25 \\Rightarrow x = \\pm 5$$" },
      // ========== LEVEL 2 -- Produktform ==========
      { id: 7, level: 2, typ: "mc", frage: "Löse \\(x(x-3) = 0\\).", optionen: ["\\(x = 3\\)", "\\(x = 0\\)", "\\(x = 0\\) oder \\(x = 3\\)", "\\(x = -3\\)"], korrekt: 2, tipp: "Satz vom Nullprodukt.", loesungsweg: "\\(x = 0 \\lor x - 3 = 0 \\Rightarrow x = 0, x = 3\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\((x - 4)(x + 2) = 0\\). Größte Lösung?", loesung: 4, toleranz: 0, tipp: "Nullprodukt.", loesungsweg: "\\(x = 4\\) oder \\(x = -2\\). Größte: 4." },
      { id: 9, level: 2, typ: "numerisch", frage: "Löse \\(x^2 - 5x = 0\\). Größte Lösung?", loesung: 5, toleranz: 0, tipp: "\\(x\\) ausklammern: \\(x(x-5) = 0\\).", loesungsweg: "\\(x = 0\\) oder \\(x = 5\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(x^2 - 9x = 0\\). Größte Lösung?", loesung: 9, toleranz: 0, tipp: "\\(x\\) ausklammern.", loesungsweg: "\\(x(x-9) = 0 \\Rightarrow x = 0 \\lor x = 9\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Löse \\((2x - 6)(x + 1) = 0\\). Positive Lösung?", loesung: 3, toleranz: 0, tipp: "\\(2x = 6\\) oder \\(x = -1\\).", loesungsweg: "\\(x = 3 \\lor x = -1\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Welche Gleichung hat \\(x = 2\\) und \\(x = -5\\) als Lösungen?", optionen: ["\\((x-2)(x-5) = 0\\)", "\\((x+2)(x+5) = 0\\)", "\\((x-2)(x+5) = 0\\)", "\\((x+2)(x-5) = 0\\)"], korrekt: 2, tipp: "Vorzeichen umdrehen beim Faktorisieren.", loesungsweg: "\\((x-2)(x+5) = 0 \\Leftrightarrow x = 2 \\lor x = -5\\)." },
      // ========== LEVEL 3 -- pq-Formel ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(x^2 + 4x + 3 = 0\\) mit pq-Formel. Größte Lösung?", loesung: -1, toleranz: 0, tipp: "\\(p=4, q=3\\): \\(x = -2 \\pm \\sqrt{4 - 3}\\).", loesungsweg: "$$x = -2 \\pm 1 \\Rightarrow x_1 = -1, x_2 = -3$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\(x^2 - 6x + 8 = 0\\). Größte Lösung?", loesung: 4, toleranz: 0, tipp: "\\(x = 3 \\pm \\sqrt{9-8}\\).", loesungsweg: "$$x = 3 \\pm 1 \\Rightarrow x_1 = 4, x_2 = 2$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Löse \\(x^2 - 2x - 15 = 0\\). Größte Lösung?", loesung: 5, toleranz: 0, tipp: "\\(x = 1 \\pm \\sqrt{1 + 15}\\).", loesungsweg: "$$x = 1 \\pm 4 \\Rightarrow x_1 = 5, x_2 = -3$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "Löse \\(x^2 + 2x - 8 = 0\\). Größte Lösung?", loesung: 2, toleranz: 0, tipp: "\\(x = -1 \\pm 3\\).", loesungsweg: "$$x = -1 \\pm 3 \\Rightarrow x_1 = 2, x_2 = -4$$" },
      { id: 17, level: 3, typ: "mc", frage: "Die pq-Formel lautet:", optionen: ["\\(x = -\\frac{p}{2} \\pm \\sqrt{\\left(\\frac{p}{2}\\right)^2 - q}\\)", "\\(x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}\\)", "\\(x = \\pm \\sqrt{p - q}\\)", "Beide 1 und 2 sind äquivalente Formen"], korrekt: 3, tipp: "Die pq-Formel ist ein Spezialfall der abc-Formel für \\(a = 1\\).", loesungsweg: "Für \\(x^2 + px + q = 0\\): \\(x = -\\frac{p}{2} \\pm \\sqrt{(p/2)^2 - q}\\). Die abc-Formel ist äquivalent für \\(a = 1\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(x^2 - 10x + 21 = 0\\). Größte Lösung?", loesung: 7, toleranz: 0, tipp: "\\(x = 5 \\pm 2\\).", loesungsweg: "$$x_1 = 7, x_2 = 3$$" },
      // ========== LEVEL 4 -- Diskriminante, a ≠ 1 ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Diskriminante von \\(x^2 - 4x + 4 = 0\\): \\(D = p^2/4 - q\\)?", loesung: 0, toleranz: 0, tipp: "\\(4 - 4 = 0\\).", loesungsweg: "$$D = 0 \\Rightarrow \\text{genau eine Lösung}$$" },
      { id: 20, level: 4, typ: "mc", frage: "Für welche Diskriminante \\(D\\) hat eine quadr. Gleichung keine reelle Lösung?", optionen: ["\\(D > 0\\)", "\\(D = 0\\)", "\\(D < 0\\)", "\\(D = 1\\)"], korrekt: 2, tipp: "Wurzel aus negativer Zahl ist im Reellen nicht definiert.", loesungsweg: "\\(D < 0\\) → keine reelle Lösung." },
      { id: 21, level: 4, typ: "numerisch", frage: "Löse \\(2x^2 - 8x + 6 = 0\\). Zuerst durch 2 teilen. Größte Lösung?", loesung: 3, toleranz: 0, tipp: "\\(x^2 - 4x + 3 = 0\\).", loesungsweg: "$$x = 2 \\pm 1 \\Rightarrow x_1 = 3, x_2 = 1$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Löse \\(3x^2 - 12x + 9 = 0\\). Größte Lösung?", loesung: 3, toleranz: 0, tipp: "Durch 3 teilen.", loesungsweg: "$$x^2 - 4x + 3 = 0 \\Rightarrow x = 3 \\lor x = 1$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Löse \\(x^2 + x - 12 = 0\\). Größte Lösung?", loesung: 3, toleranz: 0, tipp: "\\(x = -\\frac{1}{2} \\pm \\sqrt{\\frac{1}{4} + 12}\\).", loesungsweg: "$$x = -0{,}5 \\pm 3{,}5 \\Rightarrow x_1 = 3, x_2 = -4$$" },
      { id: 24, level: 4, typ: "mc", frage: "Wie viele Lösungen hat \\(x^2 - 2x + 5 = 0\\)?", optionen: ["2", "1", "0", "unendlich viele"], korrekt: 2, tipp: "\\(D = 1 - 5 = -4 < 0\\).", loesungsweg: "\\(D < 0\\) → keine reellen Lösungen." },
      // ========== LEVEL 5 -- Anwendungen ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Ein Quadrat hat die Diagonale \\(d\\). Es gilt \\(d^2 = 2a^2\\). Für \\(a^2 = 50\\) ist \\(d^2 = ?\\)", loesung: 100, toleranz: 0, tipp: "\\(2 \\cdot 50\\).", loesungsweg: "$$d^2 = 100 \\Rightarrow d = 10$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Rechteck mit Fläche 24 und Länge \\(x + 2\\) sowie Breite \\(x\\): Finde positives \\(x\\). \\(x(x+2) = 24\\).", loesung: 4, toleranz: 0, tipp: "\\(x^2 + 2x - 24 = 0\\).", loesungsweg: "$$x = -1 \\pm 5 \\Rightarrow x = 4$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Eine Zahl plus ihr Quadrat ergibt 30. \\(x + x^2 = 30\\). Positive Lösung?", loesung: 5, toleranz: 0, tipp: "\\(x^2 + x - 30 = 0\\).", loesungsweg: "$$x = -\\frac{1}{2} \\pm \\sqrt{\\frac{1}{4}+30} = -0{,}5 \\pm 5{,}5$$ Positiv: \\(x = 5\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(h(t) = -5t^2 + 20t\\) beschreibt Ballhöhe. Wann ist \\(h = 0\\) (Aufprall)? Positive Lösung.", loesung: 4, toleranz: 0, tipp: "\\(t(-5t + 20) = 0\\).", loesungsweg: "\\(t = 0\\) oder \\(t = 4\\)." },
      { id: 29, level: 5, typ: "mc", frage: "Die Gleichung \\((x-1)^2 = 16\\) hat Lösungen …", optionen: ["\\(x = 5\\)", "\\(x = -3\\)", "\\(x = 5\\) oder \\(x = -3\\)", "\\(x = \\pm 4\\)"], korrekt: 2, tipp: "\\(x - 1 = \\pm 4\\).", loesungsweg: "\\(x - 1 = 4 \\lor x - 1 = -4 \\Rightarrow x = 5 \\lor x = -3\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Für welches \\(x > 0\\) gilt \\(x^2 = 3x + 10\\)?", loesung: 5, toleranz: 0, tipp: "\\(x^2 - 3x - 10 = 0\\).", loesungsweg: "$$x = 1{,}5 \\pm 3{,}5 \\Rightarrow x = 5 \\lor x = -2$$" },
      // ========== LEVEL 6 -- Transfer ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Satz von Vieta: \\(x^2 + px + q = 0\\). Lösungen sind 3 und 4. Was ist \\(q\\)?", loesung: 12, toleranz: 0, tipp: "\\(q = x_1 \\cdot x_2\\).", loesungsweg: "$$q = 3 \\cdot 4 = 12,\\quad p = -(3+4) = -7$$" },
      { id: 32, level: 6, typ: "numerisch", frage: "Vieta: Lösungen 3 und 4. Was ist \\(p\\)?", loesung: -7, toleranz: 0, tipp: "\\(p = -(x_1 + x_2)\\).", loesungsweg: "$$p = -7$$" },
      { id: 33, level: 6, typ: "numerisch", frage: "Für welches \\(c\\) hat \\(x^2 - 6x + c = 0\\) genau eine Lösung?", loesung: 9, toleranz: 0, tipp: "\\(D = 9 - c = 0\\).", loesungsweg: "$$c = 9,\\text{ denn dann } D = 0$$" },
      { id: 34, level: 6, typ: "numerisch", frage: "\\(x^2 - kx + 9 = 0\\) hat \\(x = 3\\) als Lösung. Bestimme \\(k\\).", loesung: 6, toleranz: 0, tipp: "Einsetzen: \\(9 - 3k + 9 = 0\\).", loesungsweg: "$$18 - 3k = 0 \\Rightarrow k = 6$$" },
      { id: 35, level: 6, typ: "mc", frage: "\\(x^2 + 6x + 9 = 0\\) hat …", optionen: ["2 verschiedene Lösungen", "genau 1 Lösung (doppelt)", "0 Lösungen", "Lösung \\(x = 3\\)"], korrekt: 1, tipp: "1. bin. Formel.", loesungsweg: "\\((x+3)^2 = 0 \\Rightarrow x = -3\\) (doppelte Lösung)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Löse \\(3(n + (n+1)) = n(n+1)\\). Gib die positive Lösung (2 Dez).", loesung: 5.54, toleranz: 0.01, tipp: "\\(6n + 3 = n^2 + n \\Rightarrow n^2 - 5n - 3 = 0\\).", loesungsweg: "$$3(2n+1) = n^2 + n \\Rightarrow n^2 - 5n - 3 = 0 \\Rightarrow n = \\frac{5 + \\sqrt{37}}{2} \\approx 5{,}54$$ (die negative Wurzel \\(\\frac{5-\\sqrt{37}}{2}\\) entfällt für die positive Lösung)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
