<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratische Gleichungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-quadratische-gleichungen';
    const THEMA_CONFIG = { name: 'Quadratische Gleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "numerisch", frage: "Löse \\(x^2 = 25\\). Positive Lösung?", loesung: 5, toleranz: 0, tipp: "Wurzel ziehen.", loesungsweg: "$$x = \\pm\\sqrt{25} = \\pm 5$$" },
      { id: 2, level: 1, typ: "numerisch", frage: "Das Quadrat einer positiven Zahl ist 81. Wie heißt die Zahl?", loesung: 9, toleranz: 0, tipp: "Welche Zahl mal sich selbst ergibt 81?", loesungsweg: "Gesucht ist \\(x > 0\\) mit \\(x^2 = 81\\): $$x = \\sqrt{81} = 9$$ Auch \\(-9\\) erfüllt \\(x^2 = 81\\), ist aber nicht positiv." },
      { id: 3, level: 1, typ: "mc", frage: "Wie viele Lösungen hat \\(x^2 = 0\\)?", optionen: ["Keine", "1", "2", "unendlich viele"], korrekt: 1, tipp: "Nur eine Zahl quadriert ergibt 0.", loesungsweg: "$$x^2 = 0 \\;\\Rightarrow\\; x = 0$$ Nur die Null selbst ergibt quadriert null. Es gibt also genau <b>eine</b> Lösung; man nennt sie eine doppelte Nullstelle, weil \\(x^2 = x \\cdot x\\) den Faktor zweimal enthält." },
      { id: 4, level: 1, typ: "mc", frage: "Hat \\(x^2 = -4\\) reelle Lösungen?", optionen: ["Ja, \\(x = -2\\)", "Ja, \\(x = \\pm 2\\)", "Nein", "Ja, \\(x = 2\\)"], korrekt: 2, tipp: "Quadrat ist immer \\(\\geq 0\\).", loesungsweg: "Ein Quadrat ist nie negativ: $$x^2 \\ge 0 > -4$$ Die Gleichung hat also <b>keine</b> reelle Lösung. Erst in den komplexen Zahlen, die in der Schule nicht behandelt werden, gäbe es eine." },
      { id: 5, level: 1, typ: "numerisch", frage: "Löse \\(x^2 - 16 = 0\\). Positive Lösung?", loesung: 4, toleranz: 0, tipp: "\\(x^2 = 16\\).", loesungsweg: "$$x^2 - 16 = 0 \\;\\Rightarrow\\; x^2 = 16 \\;\\Rightarrow\\; x = \\pm 4$$ Die positive Lösung ist \\(4\\). Alternativ über die dritte binomische Formel: \\((x-4)(x+4) = 0\\) — dasselbe Ergebnis." },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(2x^2 = 50\\). Positive Lösung?", loesung: 5, toleranz: 0, tipp: "Durch 2 teilen, dann Wurzel.", loesungsweg: "$$x^2 = 25 \\Rightarrow x = \\pm 5$$" },
      // ========== LEVEL 2 -- Produktform ==========
      { id: 7, level: 2, typ: "mc", frage: "Löse \\(x(x-3) = 0\\).", optionen: ["\\(x = 3\\)", "\\(x = 0\\)", "\\(x = 0\\) oder \\(x = 3\\)", "\\(x = -3\\)"], korrekt: 2, tipp: "Satz vom Nullprodukt.", loesungsweg: "\\(x = 0 \\lor x - 3 = 0 \\Rightarrow x = 0, x = 3\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\((x - 4)(x + 2) = 0\\). Größte Lösung?", loesung: 4, toleranz: 0, tipp: "Nullprodukt.", loesungsweg: "\\(x = 4\\) oder \\(x = -2\\). Größte: 4." },
      { id: 9, level: 2, typ: "numerisch", frage: "Löse \\(x^2 - 5x = 0\\). Größte Lösung?", loesung: 5, toleranz: 0, tipp: "\\(x\\) ausklammern: \\(x(x-5) = 0\\).", loesungsweg: "\\(x = 0\\) oder \\(x = 5\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(x^2 - 9x = 0\\). Größte Lösung?", loesung: 9, toleranz: 0, tipp: "\\(x\\) ausklammern.", loesungsweg: "\\(x(x-9) = 0 \\Rightarrow x = 0 \\lor x = 9\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Löse \\((2x - 6)(x + 1) = 0\\). Positive Lösung?", loesung: 3, toleranz: 0, tipp: "\\(2x = 6\\) oder \\(x = -1\\).", loesungsweg: "\\(x = 3 \\lor x = -1\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Welche Gleichung hat \\(x = 2\\) und \\(x = -5\\) als Lösungen?", optionen: ["\\((x-2)(x-5) = 0\\)", "\\((x+2)(x+5) = 0\\)", "\\((x-2)(x+5) = 0\\)", "\\((x+2)(x-5) = 0\\)"], korrekt: 2, tipp: "Vorzeichen umdrehen beim Faktorisieren.", loesungsweg: "\\((x-2)(x+5) = 0 \\Leftrightarrow x = 2 \\lor x = -5\\)." },
      // ========== LEVEL 3 -- Lösungsformel ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(x^2 + 4x + 3 = 0\\). Größte Lösung?", loesung: -1, toleranz: 0, tipp: "\\(p=4, q=3\\): \\(x = -2 \\pm \\sqrt{4 - 3}\\).", loesungsweg: "$$x = -2 \\pm 1 \\Rightarrow x_1 = -1, x_2 = -3$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\(x^2 - 6x + 8 = 0\\). Größte Lösung?", loesung: 4, toleranz: 0, tipp: "\\(x = 3 \\pm \\sqrt{9-8}\\).", loesungsweg: "$$x = 3 \\pm 1 \\Rightarrow x_1 = 4, x_2 = 2$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Löse \\(x^2 - 2x - 15 = 0\\). Größte Lösung?", loesung: 5, toleranz: 0, tipp: "\\(x = 1 \\pm \\sqrt{1 + 15}\\).", loesungsweg: "$$x = 1 \\pm 4 \\Rightarrow x_1 = 5, x_2 = -3$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "Löse \\(x^2 + 2x - 8 = 0\\). Größte Lösung?", loesung: 2, toleranz: 0, tipp: "\\(x = -1 \\pm 3\\).", loesungsweg: "$$x = -1 \\pm 3 \\Rightarrow x_1 = 2, x_2 = -4$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Löse \\(x^2 + 3x - 10 = 0\\). Größte Lösung?", loesung: 2, toleranz: 0, tipp: "\\(p = 3\\), \\(q = -10\\); unter der Wurzel steht \\(\\frac{9}{4} + 10\\).", loesungsweg: "$$x = -\\frac{3}{2} \\pm \\sqrt{\\frac{9}{4} + 10} = -1{,}5 \\pm 3{,}5 \\;\\Rightarrow\\; x_1 = 2,\\; x_2 = -5$$ Probe: \\(4 + 6 - 10 = 0\\) ✓" },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(x^2 - 10x + 21 = 0\\). Größte Lösung?", loesung: 7, toleranz: 0, tipp: "\\(x = 5 \\pm 2\\).", loesungsweg: "$$x_1 = 7, x_2 = 3$$" },
      // ========== LEVEL 4 -- Verfahren wählen, Modell aus Text, Umkehraufgabe ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Löse \\(x^2 - x - 12 = 0\\). Gib die größere Lösung an.", loesung: 4, toleranz: 0, tipp: "Zwei Zahlen mit Produkt \\(-12\\) und Summe \\(-1\\) — oder die Lösungsformel.", loesungsweg: "Faktorisieren: $$x^2 - x - 12 = (x-4)(x+3) = 0 \\;\\Rightarrow\\; x = 4 \\text{ oder } x = -3$$ Mit der Lösungsformel: \\(x = \\frac{1}{2} \\pm \\sqrt{\\frac{1}{4} + 12} = 0{,}5 \\pm 3{,}5\\) — dasselbe Ergebnis." },
      { id: 20, level: 4, typ: "numerisch", frage: "Löse \\((x-3)^2 = 2x - 3\\). Gib die größere Lösung an.", loesung: 6, toleranz: 0, tipp: "Erst alles auf eine Seite bringen und ordnen.", loesungsweg: "Ausmultiplizieren und ordnen: $$x^2 - 6x + 9 = 2x - 3 \\;\\Rightarrow\\; x^2 - 8x + 12 = 0$$ $$x = 4 \\pm \\sqrt{16 - 12} = 4 \\pm 2 \\;\\Rightarrow\\; x_1 = 6,\\; x_2 = 2$$ Probe mit \\(6\\): \\(9 = 9\\) ✓" },
      { id: 21, level: 4, typ: "numerisch", frage: "Das Produkt zweier aufeinanderfolgender natürlicher Zahlen ist 132. Gib die kleinere der beiden Zahlen an.", loesung: 11, toleranz: 0, tipp: "Nenne die kleinere Zahl \\(n\\); die größere ist dann \\(n + 1\\).", loesungsweg: "Ansatz: $$n(n+1) = 132 \\;\\Rightarrow\\; n^2 + n - 132 = 0$$ $$n = -\\frac{1}{2} \\pm \\sqrt{\\frac{1}{4} + 132} = -0{,}5 \\pm 11{,}5$$ Nur \\(n = 11\\) ist natürlich (\\(n = -12\\) entfällt). Probe: \\(11 \\cdot 12 = 132\\) ✓" },
      { id: 22, level: 4, typ: "numerisch", frage: "Die Gleichung \\(x^2 + px - 12 = 0\\) hat die Lösung \\(x = 2\\). Bestimme \\(p\\).", loesung: 4, toleranz: 0, tipp: "Eine Lösung erfüllt die Gleichung — einsetzen.", loesungsweg: "\\(x = 2\\) einsetzen: $$4 + 2p - 12 = 0 \\;\\Rightarrow\\; 2p = 8 \\;\\Rightarrow\\; p = 4$$ Die Gleichung lautet \\(x^2 + 4x - 12 = 0\\); ihre zweite Lösung ist \\(x = -6\\)." },
      { id: 23, level: 4, typ: "mc", frage: "Welche Lösungen hat \\(3x^2 + 6x = 0\\)?", optionen: ["\\(x = 0\\) oder \\(x = -2\\)", "\\(x = 0\\) oder \\(x = 2\\)", "\\(x = -2\\) oder \\(x = 2\\)", "nur \\(x = -2\\)"], korrekt: 0, tipp: "Was haben beide Summanden gemeinsam?", loesungsweg: "Ausklammern: $$3x(x + 2) = 0 \\;\\Rightarrow\\; x = 0 \\text{ oder } x = -2$$ Wer durch \\(x\\) teilt, verliert die Lösung \\(x = 0\\)." },
      { id: 24, level: 4, typ: "numerisch", frage: "Ein Rechteck ist 5 cm länger als breit und hat den Flächeninhalt 84 cm². Wie breit ist es (in cm)?", loesung: 7, toleranz: 0, tipp: "Breite \\(x\\), Länge \\(x + 5\\), Fläche als Produkt.", loesungsweg: "$$x(x+5) = 84 \\;\\Rightarrow\\; x^2 + 5x - 84 = 0$$ $$x = -2{,}5 \\pm \\sqrt{6{,}25 + 84} = -2{,}5 \\pm 9{,}5$$ Sinnvoll ist nur \\(x = 7\\): Breite \\(7\\,\\text{cm}\\), Länge \\(12\\,\\text{cm}\\), Probe \\(7 \\cdot 12 = 84\\) ✓" },
      // ========== LEVEL 5 -- Fehler finden, Sachaufgaben, Parameter ==========
      { id: 25, level: 5, typ: "mc", frage: "Ben löst \\(x^2 - 6x - 7 = 0\\):<br>Schritt 1: \\(p = -6\\), \\(q = -7\\)<br>Schritt 2: \\(x = 3 \\pm \\sqrt{9 - 7}\\)<br>Schritt 3: \\(x = 3 \\pm \\sqrt{2}\\)<br>Wo liegt der erste Fehler?", optionen: ["Schritt 1: \\(p\\) muss \\(6\\) sein, weil das Vorzeichen in die Formel wechselt", "Schritt 2: unter der Wurzel muss \\(9 - (-7) = 16\\) stehen, nicht \\(9 - 7\\)", "Schritt 3: die Wurzel aus \\(2\\) muss noch quadriert werden, bevor man addiert", "Es gibt keinen Fehler, \\(x = 3 \\pm \\sqrt{2}\\) sind die beiden Lösungen"], korrekt: 1, tipp: "Was passiert mit dem Minus vor \\(q\\), wenn \\(q\\) selbst negativ ist?", loesungsweg: "Schritt 1 ist richtig. In Schritt 2 wurde \\(-q = -(-7) = +7\\) falsch als \\(-7\\) eingesetzt. Richtig: $$x = 3 \\pm \\sqrt{9 + 7} = 3 \\pm 4 \\;\\Rightarrow\\; x_1 = 7,\\; x_2 = -1$$ Probe: \\(49 - 42 - 7 = 0\\) ✓" },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Ball wird von einem Turm senkrecht nach oben geworfen; seine Höhe über dem Boden ist \\(h(t) = -5t^2 + 15t + 20\\) (\\(h\\) in m, \\(t\\) in s). Wie hoch ist der Ball eine Sekunde vor dem Aufprall (in m)?", loesung: 20, toleranz: 0, tipp: "Erst den Aufprallzeitpunkt aus der Bedingung „Höhe null“ bestimmen.", loesungsweg: "Aufprall: $$-5t^2 + 15t + 20 = 0 \\;\\Rightarrow\\; t^2 - 3t - 4 = 0 \\;\\Rightarrow\\; t = 1{,}5 \\pm 2{,}5$$ Nur \\(t = 4\\) ist sinnvoll. Eine Sekunde davor: $$h(3) = -45 + 45 + 20 = 20\\,\\text{m}$$ Der Ball ist dann genau auf Turmhöhe." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Rechteck hat den Umfang 34 cm und den Flächeninhalt 60 cm². Wie lang ist die längere Seite (in cm)?", loesung: 12, toleranz: 0, tipp: "Aus dem Umfang folgt die Summe beider Seiten; dann die Fläche als Produkt ansetzen.", loesungsweg: "Seiten \\(x\\) und \\(17 - x\\) (halber Umfang): $$x(17 - x) = 60 \\;\\Rightarrow\\; x^2 - 17x + 60 = 0 \\;\\Rightarrow\\; x = 8{,}5 \\pm \\sqrt{72{,}25 - 60} = 8{,}5 \\pm 3{,}5$$ Die Seiten sind \\(12\\,\\text{cm}\\) und \\(5\\,\\text{cm}\\). Probe: \\(2 \\cdot 17 = 34\\), \\(12 \\cdot 5 = 60\\) ✓" },
      { id: 28, level: 5, typ: "numerisch", frage: "Die Summe zweier Zahlen ist 14, ihr Produkt 45. Wie groß ist die größere der beiden Zahlen?", loesung: 9, toleranz: 0, tipp: "Die zweite Zahl lässt sich durch die erste ausdrücken.", loesungsweg: "Zahlen \\(x\\) und \\(14 - x\\): $$x(14 - x) = 45 \\;\\Rightarrow\\; x^2 - 14x + 45 = 0 \\;\\Rightarrow\\; x = 7 \\pm \\sqrt{49 - 45} = 7 \\pm 2$$ Die Zahlen sind \\(5\\) und \\(9\\); die größere ist \\(9\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Lisa löst \\(x^2 = 6x\\), indem sie beide Seiten durch \\(x\\) teilt, und erhält \\(x = 6\\). Ihr fehlt eine Lösung — welche?", loesung: 0, toleranz: 0, tipp: "Durch \\(x\\) teilen ist nur erlaubt, wenn \\(x\\) nicht null ist.", loesungsweg: "Richtig ist Ausklammern: $$x^2 - 6x = 0 \\;\\Rightarrow\\; x(x - 6) = 0 \\;\\Rightarrow\\; x = 0 \\text{ oder } x = 6$$ Beim Teilen durch \\(x\\) geht die Lösung \\(x = 0\\) verloren, denn dafür wäre die Division nicht erlaubt." },
      { id: 30, level: 5, typ: "numerisch", frage: "Ein Bild von 20 cm × 30 cm bekommt einen ringsum gleich breiten Rahmen. Bild und Rahmen zusammen haben den Flächeninhalt 1200 cm². Wie breit ist der Rahmen (in cm)?", loesung: 5, toleranz: 0, tipp: "Jede Seite wächst um die doppelte Rahmenbreite.", loesungsweg: "Rahmenbreite \\(x\\): $$(20 + 2x)(30 + 2x) = 1200 \\;\\Rightarrow\\; 4x^2 + 100x + 600 = 1200 \\;\\Rightarrow\\; x^2 + 25x - 150 = 0$$ $$x = -12{,}5 \\pm \\sqrt{156{,}25 + 150} = -12{,}5 \\pm 17{,}5$$ Sinnvoll ist \\(x = 5\\): Probe \\(30 \\cdot 40 = 1200\\) ✓" },
      // ========== LEVEL 6 -- Behauptungen, Fallunterscheidung, Umkehraufgaben ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Ist in \\(x^2 + px + q = 0\\) der Wert \\(q\\) negativ, dann hat die Gleichung immer zwei verschiedene Lösungen.“ Was gilt?", optionen: ["Wahr, denn dann ist \\(\\left(\\frac{p}{2}\\right)^2 - q\\) auf jeden Fall positiv", "Falsch, denn für \\(p = 0\\) ergibt sich nur eine einzige Lösung", "Wahr, aber nur wenn zusätzlich \\(p\\) positiv ist, sonst nicht", "Falsch, denn ein negatives \\(q\\) ergibt eine negative Wurzel"], korrekt: 0, tipp: "Sieh dir den Ausdruck unter der Wurzel an: Quadrat minus negative Zahl.", loesungsweg: "Unter der Wurzel steht \\(\\left(\\frac{p}{2}\\right)^2 - q\\). Ein Quadrat ist nie negativ, und \\(-q\\) ist positiv, also ist die Summe positiv — die Wurzel liefert zwei verschiedene Lösungen. Beispiel \\(p = 0\\), \\(q = -9\\): \\(x^2 = 9\\) hat die Lösungen \\(\\pm 3\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für wie viele ganzzahlige Werte \\(c\\) mit \\(-3 \\le c \\le 5\\) hat die Gleichung \\(x^2 - 4x + c = 0\\) zwei verschiedene Lösungen?", loesung: 7, toleranz: 0, tipp: "Untersuche, für welche \\(c\\) der Ausdruck unter der Wurzel positiv ist.", loesungsweg: "Unter der Wurzel: \\(4 - c\\). Fallunterscheidung: $$4 - c > 0 \\;\\Leftrightarrow\\; c < 4 \\text{ (zwei Lösungen)},\\quad c = 4 \\text{ (eine)},\\quad c > 4 \\text{ (keine)}$$ Ganzzahlig von \\(-3\\) bis \\(3\\): das sind \\(7\\) Werte." },
      { id: 33, level: 6, typ: "numerisch", frage: "Eine Gleichung der Form \\(2x^2 + bx + c = 0\\) hat genau die Lösungen \\(-3\\) und \\(0{,}5\\). Bestimme \\(c\\).", loesung: -3, toleranz: 0, tipp: "Linearfaktoren bilden und beachten, dass vor \\(x^2\\) der Faktor 2 steht.", loesungsweg: "$$2(x+3)(x-0{,}5) = 2(x^2 + 2{,}5x - 1{,}5) = 2x^2 + 5x - 3$$ Also \\(b = 5\\), \\(c = -3\\). Probe mit \\(x = -3\\): \\(18 - 15 - 3 = 0\\) ✓" },
      { id: 34, level: 6, typ: "numerisch", frage: "Löse \\((2x - 1)^2 = (x + 3)^2\\). Gib die größere Lösung an.", loesung: 4, toleranz: 0, tipp: "Zwei Quadrate sind gleich, wenn die Basen gleich oder entgegengesetzt sind.", loesungsweg: "Ohne Ausmultiplizieren: $$2x - 1 = x + 3 \\;\\Rightarrow\\; x = 4 \\qquad\\text{oder}\\qquad 2x - 1 = -(x + 3) \\;\\Rightarrow\\; 3x = -2 \\;\\Rightarrow\\; x = -\\tfrac{2}{3}$$ Probe mit \\(x = 4\\): \\(49 = 49\\) ✓ Die größere Lösung ist \\(4\\)." },
      { id: 35, level: 6, typ: "mc", frage: "Vergleiche die Gleichungen \\(x^2 + 6x + 9 = 0\\) und \\(x^2 + 6x + 9 = 1\\). Was gilt?", optionen: ["Beide haben genau eine Lösung, nämlich \\(x = -3\\)", "Die erste hat eine Lösung, die zweite hat zwei", "Die erste hat zwei Lösungen, die zweite nur eine", "Beide haben zwei Lösungen mit dem Abstand \\(2\\)"], korrekt: 1, tipp: "Die linke Seite ist ein Binom.", loesungsweg: "Linke Seite: \\((x+3)^2\\). Erste Gleichung: \\((x+3)^2 = 0 \\Rightarrow x = -3\\), eine (doppelte) Lösung. Zweite Gleichung: $$(x+3)^2 = 1 \\;\\Rightarrow\\; x + 3 = \\pm 1 \\;\\Rightarrow\\; x = -2 \\text{ oder } x = -4$$ zwei Lösungen. Anschaulich: Die Parabel berührt die Gerade \\(y = 0\\) und schneidet die Gerade \\(y = 1\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Für welches \\(m > 0\\) hat die Gleichung \\(x^2 - 2mx + m + 6 = 0\\) genau eine Lösung?", loesung: 3, toleranz: 0, tipp: "Genau eine Lösung heißt: Der Ausdruck unter der Wurzel ist null — das ergibt eine Gleichung für \\(m\\).", loesungsweg: "Mit \\(p = -2m\\), \\(q = m + 6\\) steht unter der Wurzel \\(m^2 - (m + 6)\\). Genau eine Lösung bei $$m^2 - m - 6 = 0 \\;\\Rightarrow\\; m = 0{,}5 \\pm 2{,}5 \\;\\Rightarrow\\; m = 3 \\text{ (oder } m = -2\\text{)}$$ Für \\(m = 3\\): \\(x^2 - 6x + 9 = (x-3)^2 = 0\\), Lösung \\(x = 3\\) ✓" }];
    </script>
