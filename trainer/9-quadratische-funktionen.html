<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratische Funktionen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-quadratische-funktionen';
    const THEMA_CONFIG = { name: 'Quadratische Funktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "mc", frage: "Welche Funktion ist quadratisch?", optionen: ["\\(f(x) = 3x + 2\\)", "\\(f(x) = x^2 - 4\\)", "\\(f(x) = \\frac{1}{x}\\)", "\\(f(x) = 2^x\\)"], korrekt: 1, tipp: "Quadratisch bedeutet: höchste Potenz ist \\(x^2\\).", loesungsweg: "\\(f(x) = x^2 - 4\\) ist quadratisch (höchste Potenz 2)." },
      { id: 2, level: 1, typ: "mc", frage: "Wie heißt der Graph einer quadratischen Funktion?", optionen: ["Gerade", "Parabel", "Hyperbel", "Kreis"], korrekt: 1, tipp: "Typische U-Form.", loesungsweg: "Der Graph heißt <b>Parabel</b>." },
      { id: 3, level: 1, typ: "numerisch", frage: "Berechne \\(f(3)\\) für \\(f(x) = x^2\\).", loesung: 9, toleranz: 0, tipp: "Setze \\(x = 3\\) ein.", loesungsweg: "$$f(3) = 3^2 = 9$$" },
      { id: 4, level: 1, typ: "mc", frage: "Wo liegt der Scheitelpunkt von \\(f(x) = x^2\\)?", optionen: ["\\((1|1)\\)", "\\((0|0)\\)", "\\((0|1)\\)", "\\((-1|0)\\)"], korrekt: 1, tipp: "Die Normalparabel hat ihren tiefsten Punkt im Ursprung.", loesungsweg: "Die Normalparabel \\(f(x) = x^2\\) hat ihren tiefsten Punkt im Ursprung: $$S(0|0)$$ Denn \\(x^2 \\ge 0\\) für jedes \\(x\\), und der Wert null wird nur bei \\(x = 0\\) erreicht." },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne \\(f(-2)\\) für \\(f(x) = x^2 + 1\\).", loesung: 5, toleranz: 0, tipp: "Erst quadrieren, dann addieren.", loesungsweg: "$$f(-2) = (-2)^2 + 1 = 4 + 1 = 5$$ Das Quadrat einer negativen Zahl ist positiv. Wegen der Achsensymmetrie gilt \\(f(-2) = f(2)\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Ist die Parabel \\(f(x) = -x^2\\) nach oben oder unten geöffnet?", optionen: ["nach oben", "nach unten", "nach links", "nach rechts"], korrekt: 1, tipp: "Negatives Vorzeichen vor \\(x^2\\) spiegelt.", loesungsweg: "Negative Leitkoeffizient → <b>nach unten geöffnet</b>." },
      // ========== LEVEL 2 -- Scheitelform ==========
      { id: 7, level: 2, typ: "mc", frage: "Der Scheitel von \\(f(x) = (x - 3)^2 + 2\\) ist …", optionen: ["\\(S(3|2)\\)", "\\(S(-3|2)\\)", "\\(S(3|-2)\\)", "\\(S(-3|-2)\\)"], korrekt: 0, tipp: "Scheitelform: \\(f(x) = a(x - d)^2 + e\\) mit \\(S(d|e)\\).", loesungsweg: "Direkt ablesbar: \\(d = 3\\), \\(e = 2\\), also \\(S(3|2)\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Der Scheitel von \\(f(x) = (x + 4)^2 - 1\\) ist …", optionen: ["\\(S(4|-1)\\)", "\\(S(-4|-1)\\)", "\\(S(-4|1)\\)", "\\(S(4|1)\\)"], korrekt: 1, tipp: "Vorsicht beim Vorzeichen: \\((x+4) = (x-(-4))\\).", loesungsweg: "In der Scheitelpunktform \\(f(x) = (x-d)^2 + e\\) liegt der Scheitel bei \\((d|e)\\). Hier ist \\((x+4) = (x-(-4))\\), also \\(d = -4\\): $$S(-4|-1)$$ Probe: \\(f(-4) = 0 - 1 = -1\\) ✓ Das Vorzeichen in der Klammer kehrt sich um — der häufigste Fehler bei dieser Form." },
      { id: 9, level: 2, typ: "numerisch", frage: "Gib den Scheitel von \\(f(x) = 2(x-1)^2 + 5\\) an — y-Koordinate?", loesung: 5, toleranz: 0, tipp: "\\(e = 5\\).", loesungsweg: "Die Konstante hinter dem Quadrat ist die \\(y\\)-Koordinate des Scheitels: $$f(x) = 2(x-1)^2 + 5 \\;\\Rightarrow\\; S(1|5)$$ Der Streckfaktor \\(2\\) ändert die Lage des Scheitels nicht, nur die Öffnung der Parabel. Da \\(2(x-1)^2 \\ge 0\\), ist \\(5\\) zugleich der kleinste Funktionswert." },
      { id: 10, level: 2, typ: "numerisch", frage: "Berechne \\(f(1)\\) für \\(f(x) = (x-2)^2 + 3\\).", loesung: 4, toleranz: 0, tipp: "\\((1-2)^2 + 3\\).", loesungsweg: "$$f(1) = 1 + 3 = 4$$" },
      { id: 11, level: 2, typ: "mc", frage: "\\(f(x) = 3(x-2)^2\\) ist gegenüber der Normalparabel …", optionen: ["breiter / gestreckt", "schmaler / gestaucht nach innen (gestreckt nach oben)", "gespiegelt", "verschoben, aber gleich breit"], korrekt: 1, tipp: "\\(|a| > 1\\) streckt.", loesungsweg: "\\(a = 3 > 1\\): Parabel ist schmaler als die Normalparabel." },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(f(0)\\) für \\(f(x) = (x+1)^2 - 4\\).", loesung: -3, toleranz: 0, tipp: "\\((0+1)^2 - 4\\).", loesungsweg: "$$f(0) = 1 - 4 = -3$$" },
      // ========== LEVEL 3 -- Normalform ==========
      { id: 13, level: 3, typ: "numerisch", frage: "\\(f(x) = x^2 - 4x + 3\\): Berechne \\(f(2)\\).", loesung: -1, toleranz: 0, tipp: "Einsetzen: \\(4 - 8 + 3\\).", loesungsweg: "$$f(2) = 4 - 8 + 3 = -1$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x) = x^2 + 2x - 3\\): Wo liegt der y-Achsenabschnitt?", loesung: -3, toleranz: 0, tipp: "\\(f(0)\\).", loesungsweg: "Der \\(y\\)-Achsenabschnitt ist der Funktionswert an der Stelle null: $$f(0) = 0 + 0 - 3 = -3$$ Bei jeder Parabel in der Form \\(ax^2+bx+c\\) ist das einfach das konstante Glied \\(c\\)." },
      { id: 15, level: 3, typ: "mc", frage: "Bringe \\(f(x) = (x - 2)^2 - 5\\) in die Normalform.", optionen: ["\\(x^2 - 4x - 1\\)", "\\(x^2 - 4x + 9\\)", "\\(x^2 + 4x - 1\\)", "\\(x^2 - 2x - 5\\)"], korrekt: 0, tipp: "1. bin. Formel: \\((x-2)^2 = x^2 - 4x + 4\\).", loesungsweg: "$$(x-2)^2 - 5 = x^2 - 4x + 4 - 5 = x^2 - 4x - 1$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "Gib die x-Koordinate des Scheitels von \\(f(x) = x^2 - 6x + 10\\) an.", loesung: 3, toleranz: 0, tipp: "Quadratisch ergänzen oder die Scheitelstelle aus den Koeffizienten bestimmen.", loesungsweg: "Quadratische Ergänzung: $$x^2 - 6x + 10 = (x-3)^2 - 9 + 10 = (x-3)^2 + 1$$ Also \\(S(3|1)\\), die \\(x\\)-Koordinate ist \\(3\\). Kürzer: \\(x_S = -\\frac{b}{2a} = -\\frac{-6}{2} = 3\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "\\(f(x) = x^2 + 2x + 5\\): Gib die y-Koordinate des Scheitels an.", loesung: 4, toleranz: 0, tipp: "Erst die Scheitelstelle, dann einsetzen.", loesungsweg: "Scheitelstelle: \\(x_S = -\\frac{2}{2} = -1\\). Einsetzen: $$f(-1) = 1 - 2 + 5 = 4$$ Also \\(S(-1|4)\\). Probe über die Scheitelform: \\(x^2 + 2x + 5 = (x+1)^2 + 4\\) ✓" },
      { id: 18, level: 3, typ: "mc", frage: "Wo schneidet \\(f(x) = x^2 - 9\\) die x-Achse?", optionen: ["\\(x = 3\\)", "\\(x = -3\\)", "\\(x = \\pm 3\\)", "Gar nicht"], korrekt: 2, tipp: "\\(x^2 - 9 = 0\\).", loesungsweg: "\\(x^2 = 9 \\Rightarrow x = \\pm 3\\)." },
      // ========== LEVEL 4 -- Verfahren wählen, Term aus Angaben, Modell ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Eine Parabel hat den Scheitel \\(S(3|{-2})\\) und verläuft durch \\(P(5|6)\\). Bestimme den Streckfaktor \\(a\\).", loesung: 2, toleranz: 0, tipp: "Scheitelform ansetzen und den Punkt einsetzen.", loesungsweg: "Ansatz in Scheitelform: \\(f(x) = a(x-3)^2 - 2\\). Punkt \\(P(5|6)\\) einsetzen: $$6 = a \\cdot (5-3)^2 - 2 = 4a - 2 \\;\\Rightarrow\\; 4a = 8 \\;\\Rightarrow\\; a = 2$$ Probe: \\(f(5) = 2 \\cdot 4 - 2 = 6\\) ✓" },
      { id: 20, level: 4, typ: "numerisch", frage: "Eine Parabel mit Streckfaktor \\(a = 1\\) hat die Nullstellen \\(x = 1\\) und \\(x = 5\\). Gib ihren y-Achsenabschnitt an.", loesung: 5, toleranz: 0, tipp: "Aus den Nullstellen lässt sich der Term als Produkt schreiben.", loesungsweg: "Nullstellenform: $$f(x) = (x-1)(x-5) = x^2 - 6x + 5$$ Der \\(y\\)-Achsenabschnitt ist \\(f(0) = (0-1)(0-5) = 5\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Bestimme den größten Funktionswert von \\(f(x) = -2x^2 + 12x - 13\\).", loesung: 5, toleranz: 0, tipp: "Der größte Wert einer nach unten geöffneten Parabel liegt im Scheitel.", loesungsweg: "Wegen \\(a = -2 < 0\\) ist der Scheitel der höchste Punkt. Scheitelstelle: $$x_S = -\\frac{12}{2 \\cdot (-2)} = 3$$ Einsetzen: $$f(3) = -18 + 36 - 13 = 5$$ Der größte Funktionswert ist \\(5\\), Scheitel \\(S(3|5)\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Eine Wertetabelle einer Parabel lautet: \\(x = 0, 1, 2, 3, 4\\) mit \\(y = 4, 1, 0, 1, 4\\). Welcher Term passt?", optionen: ["\\(f(x) = (x-2)^2\\)", "\\(f(x) = (x+2)^2\\)", "\\(f(x) = x^2 - 2\\)", "\\(f(x) = -(x-2)^2\\)"], korrekt: 0, tipp: "Wo liegt der kleinste Wert? Das ist der Scheitel.", loesungsweg: "Der kleinste Wert \\(0\\) liegt bei \\(x = 2\\), die Werte links und rechts sind symmetrisch: Scheitel \\(S(2|0)\\), nach oben geöffnet. Also \\(f(x) = (x-2)^2\\). Probe: \\(f(0) = 4\\), \\(f(4) = 4\\) ✓ Die Parabel \\((x+2)^2\\) hätte ihren Scheitel bei \\(x = -2\\), \\(x^2 - 2\\) bei \\(x = 0\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Die Normalparabel wird um 3 nach links und um 4 nach unten verschoben. Gib die größere Nullstelle der neuen Funktion an.", loesung: -1, toleranz: 0, tipp: "Erst den verschobenen Term aufstellen, dann null setzen.", loesungsweg: "Verschobener Term: \\(g(x) = (x+3)^2 - 4\\). Nullstellen: $$(x+3)^2 = 4 \\;\\Rightarrow\\; x + 3 = \\pm 2 \\;\\Rightarrow\\; x = -1 \\text{ oder } x = -5$$ Die größere Nullstelle ist \\(x = -1\\)." },
      { id: 24, level: 4, typ: "numerisch", frage: "Die Parabel \\(f(x) = x^2 + bx + 7\\) hat ihren Scheitel bei \\(x = -2\\). Bestimme \\(b\\).", loesung: 4, toleranz: 0, tipp: "Die Scheitelstelle hängt nur von \\(b\\) ab, nicht von \\(7\\).", loesungsweg: "Die Scheitelstelle ist \\(x_S = -\\frac{b}{2}\\). Aus \\(x_S = -2\\) folgt: $$-\\frac{b}{2} = -2 \\;\\Rightarrow\\; b = 4$$ Probe: \\(x^2 + 4x + 7 = (x+2)^2 + 3\\), Scheitel \\(S(-2|3)\\) ✓" },
      // ========== LEVEL 5 -- Sachaufgaben ohne Weg, Fehler, Parameter ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Ein Brückenbogen hat die Form einer Parabel. Er ist 40 m breit und in der Mitte 20 m hoch. Wie hoch ist der Bogen 10 m vom linken Fußpunkt entfernt (in m)?", loesung: 15, toleranz: 0, tipp: "Lege den Scheitel in die Mitte und bestimme den Streckfaktor aus einem Fußpunkt.", loesungsweg: "Koordinatensystem mit dem linken Fußpunkt im Ursprung: Scheitel \\(S(20|20)\\), Ansatz \\(h(x) = a(x-20)^2 + 20\\). Fußpunkt \\((0|0)\\) einsetzen: $$0 = a \\cdot 400 + 20 \\;\\Rightarrow\\; a = -0{,}05$$ Dann $$h(10) = -0{,}05 \\cdot (10-20)^2 + 20 = -5 + 20 = 15\\,\\text{m}$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Ball wird von einer Plattform senkrecht nach oben geworfen. Seine Höhe über dem Boden ist \\(h(t) = -5t^2 + 20t + 25\\) (\\(h\\) in m, \\(t\\) in s). Wie viele Sekunden nach dem höchsten Punkt trifft der Ball auf dem Boden auf?", loesung: 3, toleranz: 0, tipp: "Zwei Zeitpunkte bestimmen: höchster Punkt und Aufprall.", loesungsweg: "Höchster Punkt (Scheitel): \\(t_S = -\\frac{20}{2 \\cdot (-5)} = 2\\). Aufprall bei \\(h(t) = 0\\): $$-5t^2 + 20t + 25 = 0 \\;\\Rightarrow\\; t^2 - 4t - 5 = 0 \\;\\Rightarrow\\; t = 5 \\text{ (oder } t = -1\\text{)}$$ Differenz: \\(5 - 2 = 3\\) Sekunden." },
      { id: 27, level: 5, typ: "mc", frage: "Jana bestimmt den Scheitel von \\(f(x) = x^2 - 8x + 3\\):<br>Schritt 1: \\(x_S = 4\\)<br>Schritt 2: \\(f(4) = 16 - 32 + 3 = -13\\)<br>Schritt 3: \\(S(4|13)\\)<br>Welche Aussage trifft zu?", optionen: ["Schritt 1 ist falsch, die Scheitelstelle muss \\(x_S = -4\\) sein", "Schritt 2 ist falsch, denn \\(16 - 32 + 3\\) ergibt nicht \\(-13\\)", "Schritt 3 ist falsch, die y-Koordinate ist \\(-13\\) und nicht \\(13\\)", "Alle Schritte sind richtig, der Scheitel liegt bei \\(S(4|13)\\)"], korrekt: 2, tipp: "Rechne jeden Schritt einzeln nach.", loesungsweg: "Schritt 1: \\(x_S = -\\frac{-8}{2} = 4\\) ✓. Schritt 2: \\(16 - 32 + 3 = -13\\) ✓. Schritt 3: Beim Übertragen ging das Vorzeichen verloren — richtig ist $$S(4|{-13})$$ Probe über die Scheitelform: \\(x^2 - 8x + 3 = (x-4)^2 - 13\\) ✓" },
      { id: 28, level: 5, typ: "numerisch", frage: "Die Parabel \\(f(x) = ax^2 + c\\) verläuft durch \\(P(1|5)\\) und \\(Q(2|14)\\). Bestimme \\(a\\).", loesung: 3, toleranz: 0, tipp: "Jeder Punkt liefert eine Gleichung für \\(a\\) und \\(c\\).", loesungsweg: "Punkte einsetzen: $$a + c = 5 \\qquad 4a + c = 14$$ Subtrahieren: \\(3a = 9 \\Rightarrow a = 3\\), dann \\(c = 2\\). Probe: \\(f(2) = 3 \\cdot 4 + 2 = 14\\) ✓" },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein rechteckiger Garten wird an einer Hauswand mit 60 m Zaun auf den drei freien Seiten eingezäunt. Welchen größten Flächeninhalt (in m²) kann der Garten haben?", loesung: 450, toleranz: 0, tipp: "Fläche als Funktion einer Seitenlänge aufstellen; die Wand braucht keinen Zaun.", loesungsweg: "Seite senkrecht zur Wand \\(x\\), Seite parallel zur Wand \\(60 - 2x\\): $$A(x) = x(60 - 2x) = -2x^2 + 60x$$ Scheitelstelle \\(x_S = -\\frac{60}{2 \\cdot (-2)} = 15\\), also $$A(15) = 15 \\cdot 30 = 450\\,\\text{m}^2$$" },
      { id: 30, level: 5, typ: "numerisch", frage: "Ein Wasserstrahl verlässt eine Düse in 2,5 m Höhe und folgt der Bahn \\(f(x) = -0{,}5x^2 + 2x + 2{,}5\\) (beides in Metern, \\(x\\) waagerechte Entfernung). In welcher Entfernung von der Düse trifft der Strahl auf den Boden (in m)?", loesung: 5, toleranz: 0, tipp: "Boden heißt Höhe null; erst die Gleichung auf die Normalform bringen.", loesungsweg: "$$-0{,}5x^2 + 2x + 2{,}5 = 0 \\;\\Rightarrow\\; x^2 - 4x - 5 = 0 \\;\\Rightarrow\\; x = 2 \\pm \\sqrt{4 + 5} = 2 \\pm 3$$ Nur \\(x = 5\\) ist sinnvoll (\\(x = -1\\) läge hinter der Düse). Der Strahl trifft \\(5\\,\\text{m}\\) entfernt auf." },
      // ========== LEVEL 6 -- Behauptungen, Fallunterscheidung, Umkehraufgaben ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Liegt der Scheitel von \\(f(x) = x^2 + px + q\\) unterhalb der x-Achse, dann hat \\(f\\) genau zwei Nullstellen.“ Was gilt?", optionen: ["Wahr, denn die Parabel ist nach oben geöffnet und kreuzt die Achse auf beiden Seiten", "Falsch, denn die Parabel kann die Achse auch nur berühren und hat dann eine Nullstelle", "Falsch, denn der Scheitel bestimmt nur die Lage, nicht die Anzahl der Nullstellen", "Wahr, aber nur für \\(q < 0\\); für \\(q > 0\\) gibt es trotz tiefem Scheitel keine Nullstelle"], korrekt: 0, tipp: "Skizziere eine nach oben geöffnete Parabel mit Scheitel unter der Achse.", loesungsweg: "Bei \\(a = 1\\) ist die Parabel nach oben geöffnet. Liegt der Scheitel unterhalb der \\(x\\)-Achse, steigt der Graph links und rechts vom Scheitel über die Achse — genau zwei Nullstellen. Ein bloßes Berühren wäre der Fall Scheitel <b>auf</b> der Achse, nicht darunter. Das Vorzeichen von \\(q\\) (= \\(y\\)-Achsenabschnitt) spielt keine Rolle." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für welche ganzzahligen \\(c\\) hat \\(f(x) = 2x^2 - 8x + c\\) keine Nullstelle? Gib das kleinste solche \\(c\\) an.", loesung: 9, toleranz: 0, tipp: "Keine Nullstelle heißt: Der Scheitel liegt oberhalb der x-Achse.", loesungsweg: "Scheitelstelle \\(x_S = -\\frac{-8}{4} = 2\\), Scheitelwert $$f(2) = 8 - 16 + c = c - 8$$ Die Parabel ist nach oben geöffnet; keine Nullstelle genau dann, wenn \\(c - 8 > 0\\), also \\(c > 8\\). Fallunterscheidung: \\(c < 8\\) zwei Nullstellen, \\(c = 8\\) eine, \\(c > 8\\) keine. Kleinstes ganzzahliges \\(c\\): \\(9\\)." },
      { id: 33, level: 6, typ: "numerisch", frage: "Eine Parabel ist symmetrisch zur Geraden \\(x = 1\\), hat die Nullstelle \\(x = -1\\) und den y-Achsenabschnitt \\(-3\\). Berechne \\(f(4)\\).", loesung: 5, toleranz: 0, tipp: "Aus der Symmetrieachse folgt die zweite Nullstelle.", loesungsweg: "Die Nullstellen liegen symmetrisch zu \\(x = 1\\): \\(-1\\) und \\(3\\). Ansatz \\(f(x) = a(x+1)(x-3)\\). Mit \\(f(0) = -3\\): $$-3 = a \\cdot 1 \\cdot (-3) \\;\\Rightarrow\\; a = 1$$ Also \\(f(x) = (x+1)(x-3)\\) und $$f(4) = 5 \\cdot 1 = 5$$" },
      { id: 34, level: 6, typ: "mc", frage: "Auf welchem Bereich ist \\(f(x) = -(x-3)^2 + 4\\) streng monoton steigend?", optionen: ["für alle \\(x\\) kleiner als \\(3\\)", "für alle \\(x\\) größer als \\(3\\)", "für alle \\(x\\) kleiner als \\(4\\)", "für alle \\(x\\) größer als \\(-3\\)"], korrekt: 0, tipp: "Nach unten geöffnet: Wo geht es zum Scheitel hinauf?", loesungsweg: "Scheitel \\(S(3|4)\\), Parabel nach unten geöffnet (\\(a = -1\\)). Links vom Scheitel steigt der Graph, rechts fällt er: streng monoton steigend für \\(x < 3\\). Der Wert \\(4\\) ist die \\(y\\)-Koordinate des Scheitels und keine Stelle." },
      { id: 35, level: 6, typ: "numerisch", frage: "Die Parabel \\(f(x) = x^2 + bx + c\\) hat den Scheitel \\(S(2|{-1})\\). Bestimme \\(c\\).", loesung: 3, toleranz: 0, tipp: "Aus dem Scheitel folgt die Scheitelform; dann ausmultiplizieren.", loesungsweg: "Scheitelform mit \\(a = 1\\): $$f(x) = (x-2)^2 - 1 = x^2 - 4x + 4 - 1 = x^2 - 4x + 3$$ Also \\(b = -4\\), \\(c = 3\\). Probe: \\(f(2) = 4 - 8 + 3 = -1\\) ✓" },
      { id: 36, level: 6, typ: "numerisch", frage: "Für welches \\(k\\) haben die Parabel \\(f(x) = x^2 + 2x + k\\) und die Gerade \\(g(x) = 2x + 5\\) genau einen gemeinsamen Punkt?", loesung: 5, toleranz: 0, tipp: "Gleichsetzen; genau ein gemeinsamer Punkt heißt genau eine Lösung.", loesungsweg: "Gleichsetzen: $$x^2 + 2x + k = 2x + 5 \\;\\Rightarrow\\; x^2 = 5 - k$$ Fallunterscheidung: \\(5 - k > 0\\) zwei Lösungen, \\(5 - k < 0\\) keine, \\(5 - k = 0\\) genau eine (\\(x = 0\\)). Also \\(k = 5\\); die Gerade berührt die Parabel im Punkt \\((0|5)\\)." }];
    </script>
