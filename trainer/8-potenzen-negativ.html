<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potenzen mit negativen Exponenten - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-potenzen-negativ';
    const THEMA_CONFIG = { name: 'Potenzen mit negativen Exponenten', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Was bedeutet \\(a^{-1}\\)?", optionen: ["\\(-a\\)", "\\(\\frac{1}{a}\\)", "\\(0\\)", "\\(a\\)"], korrekt: 1, tipp: "Kehrwert.", loesungsweg: "Ein negativer Exponent steht für den Kehrwert: $$a^{-1} = \\frac1a \\qquad (a \\ne 0)$$ Begründung über das Potenzgesetz: \\(a^1 \\cdot a^{-1} = a^{1-1} = a^0 = 1\\) — die beiden Faktoren ergeben zusammen \\(1\\), sind also Kehrwerte. Das Minus macht die Zahl <b>nicht</b> negativ." },
      { id: 2, level: 1, typ: "mc", frage: "Was ist \\(a^{-n}\\)?", optionen: ["\\(-a^n\\)", "\\(\\frac{1}{a^n}\\)", "\\(a^n\\)", "\\(0\\)"], korrekt: 1, tipp: "Kehrwert der Potenz.", loesungsweg: "Dieselbe Regel für beliebige Exponenten: $$a^{-n} = \\frac{1}{a^n}$$ Denn \\(a^n \\cdot a^{-n} = a^{n-n} = a^0 = 1\\). Der Exponent wandert also mit umgekehrtem Vorzeichen in den Nenner." },
      { id: 3, level: 1, typ: "mc", frage: "Was ist \\(a^0\\) (für \\(a \\neq 0\\))?", optionen: ["\\(0\\)", "\\(1\\)", "\\(a\\)", "unbestimmt"], korrekt: 1, tipp: "Potenzgesetz.", loesungsweg: "Aus dem Divisionsgesetz folgt für jede Zahl \\(a \\ne 0\\): $$a^0 = a^{n-n} = \\frac{a^n}{a^n} = 1$$ Die Basis spielt dabei keine Rolle — auch \\(1000^0 = 1\\) und \\(0{,}5^0 = 1\\). Nur \\(0^0\\) bleibt undefiniert, weil dort durch null geteilt würde." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne \\(2^{-1}\\) als Dezimalzahl.", loesung: 0.5, toleranz: 0.01, tipp: "\\(\\frac{1}{2}\\).", loesungsweg: "$$2^{-1} = \\frac{1}{2} = 0{,}5$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne \\(5^0\\).", loesung: 1, toleranz: 0, tipp: "\\(a^0 = 1\\).", loesungsweg: "$$5^0 = 1$$ Wie bei jeder Basis außer null. Die naheliegende Antwort \\(0\\) ist falsch: Der Exponent \\(0\\) bedeutet „kein Faktor\", und das leere Produkt ist \\(1\\)." },
      { id: 6, level: 1, typ: "numerisch", frage: "Berechne \\(10^{-1}\\) als Dezimalzahl.", loesung: 0.1, toleranz: 0.001, tipp: "Kehrwert von 10.", loesungsweg: "$$10^{-1} = \\frac{1}{10} = 0{,}1$$" },
      // LEVEL 2
      { id: 7, level: 2, typ: "mc", frage: "Welcher Wert ist gleich \\(3^{-2}\\)?", optionen: ["\\(-9\\)", "\\(\\frac{1}{9}\\)", "\\(-6\\)", "\\(9\\)"], korrekt: 1, tipp: "\\(\\frac{1}{3^2}\\).", loesungsweg: "\\(3^{-2} = \\frac{1}{3^2} = \\frac{1}{9}\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Welcher Wert ist gleich \\(4^{-2}\\)?", optionen: ["\\(\\frac{1}{16}\\)", "\\(-16\\)", "\\(-8\\)", "\\(\\frac{1}{8}\\)"], korrekt: 0, tipp: "\\(\\frac{1}{16}\\).", loesungsweg: "Erst den Kehrwert bilden, dann potenzieren: $$4^{-2} = \\frac{1}{4^2} = \\frac{1}{16}$$ Das Ergebnis ist positiv und kleiner als eins — ein negativer Exponent erzeugt nie eine negative Zahl." },
      { id: 9, level: 2, typ: "mc", frage: "Welcher Wert ist gleich \\(\\left(\\frac{1}{2}\\right)^{-1}\\)?", optionen: ["\\(\\frac{1}{2}\\)", "\\(-\\frac{1}{2}\\)", "\\(2\\)", "\\(-2\\)"], korrekt: 2, tipp: "Kehrwert des Bruchs.", loesungsweg: "Der Kehrwert eines Bruchs entsteht durch Vertauschen von Zähler und Nenner: $$\\left(\\frac12\\right)^{-1} = \\frac{1}{\\frac12} = 2$$ Bei Stammbrüchen macht ein negativer Exponent die Zahl also <b>größer</b>." },
      { id: 10, level: 2, typ: "numerisch", frage: "Berechne \\(2^{-3}\\) als Dezimalzahl.", loesung: 0.125, toleranz: 0.001, tipp: "\\(\\frac{1}{8}\\).", loesungsweg: "$$2^{-3} = \\frac{1}{8} = 0{,}125$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Berechne \\(10^{-3}\\) als Dezimalzahl.", loesung: 0.001, toleranz: 0.0001, tipp: "\\(\\frac{1}{1000}\\).", loesungsweg: "$$10^{-3} = \\frac{1}{1000} = 0{,}001$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(5^{-2}\\) als Dezimalzahl.", loesung: 0.04, toleranz: 0.001, tipp: "\\(\\frac{1}{25}\\).", loesungsweg: "$$5^{-2} = \\frac{1}{25} = 0{,}04$$" },
      // LEVEL 3 (Potenzgesetze)
      { id: 13, level: 3, typ: "mc", frage: "Welcher Term ist gleich \\(a^3 \\cdot a^{-1}\\)?", optionen: ["\\(a^{-3}\\)", "\\(a^2\\)", "\\(a^4\\)", "\\(a^{-2}\\)"], korrekt: 1, tipp: "Exponenten addieren.", loesungsweg: "\\(a^3 \\cdot a^{-1} = a^{3+(-1)} = a^2\\)." },
      { id: 14, level: 3, typ: "mc", frage: "Welcher Term ist gleich \\(\\frac{a^5}{a^7}\\)?", optionen: ["\\(a^{12}\\)", "\\(a^{-2}\\)", "\\(a^2\\)", "\\(\\frac{1}{a^{12}}\\)"], korrekt: 1, tipp: "Exponenten subtrahieren.", loesungsweg: "\\(\\frac{a^5}{a^7} = a^{5-7} = a^{-2}\\)." },
      { id: 15, level: 3, typ: "mc", frage: "Welcher Term ist gleich \\((a^{-2})^3\\)?", optionen: ["\\(a^{-6}\\)", "\\(a^6\\)", "\\(a\\)", "\\(a^{-5}\\)"], korrekt: 0, tipp: "Exponenten multiplizieren.", loesungsweg: "Beim Potenzieren einer Potenz werden die Exponenten multipliziert — das Vorzeichen wandert mit: $$\\left(a^{-2}\\right)^3 = a^{(-2) \\cdot 3} = a^{-6}$$ Addiert man die Exponenten stattdessen, käme \\(a^1\\) heraus; multipliziert wird aber, nicht addiert." },
      { id: 16, level: 3, typ: "numerisch", frage: "Berechne \\(2^4 \\cdot 2^{-2}\\).", loesung: 4, toleranz: 0, tipp: "\\(2^{4-2} = 2^2\\).", loesungsweg: "\\(2^{4-2} = 2^2 = 4\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Berechne \\(\\frac{3^5}{3^3}\\).", loesung: 9, toleranz: 0, tipp: "\\(3^{5-3}\\).", loesungsweg: "Beim Dividieren gleicher Basen werden die Exponenten subtrahiert: $$\\frac{3^5}{3^3} = 3^{5-3} = 3^2 = 9$$ Probe: \\(\\frac{243}{27} = 9\\) ✓" },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\((2^{-2})^{-2}\\).", loesung: 16, toleranz: 0, tipp: "\\(2^4\\).", loesungsweg: "\\((2^{-2})^{-2} = 2^4 = 16\\)." },
      // ========== LEVEL 4 -- Zehnerpotenzen als Modell, Umkehraufgaben ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Ein Blatt Papier ist \\(8 \\cdot 10^{-5}\\,\\text{m}\\) dick. Wie viele Blätter ergeben einen Stapel von \\(2\\,\\text{cm}\\) Höhe?", loesung: 250, toleranz: 0, tipp: "Beide Längen in derselben Einheit ausdrücken.", loesungsweg: "Zuerst die Stapelhöhe in Meter: \\(2\\,\\text{cm} = 2 \\cdot 10^{-2}\\,\\text{m}\\). Die Anzahl ist der Quotient aus Stapelhöhe und Blattdicke: $$\\frac{2 \\cdot 10^{-2}}{8 \\cdot 10^{-5}} = \\frac{2}{8} \\cdot 10^{-2-(-5)} = 0{,}25 \\cdot 10^{3} = 250$$ Vorfaktoren und Zehnerpotenzen werden getrennt behandelt; beim Dividieren werden die Exponenten subtrahiert, wobei das doppelte Minus zu einem Plus wird." },
      { id: 20, level: 4, typ: "mc", frage: "Ein Schüler schreibt \\(0{,}00072 = 72 \\cdot 10^{-5}\\) und nennt das wissenschaftliche Schreibweise. Was ist dazu zu sagen?", optionen: ["Der Wert stimmt, aber der Vorfaktor muss zwischen \\(1\\) und \\(10\\) liegen: \\(7{,}2 \\cdot 10^{-4}\\)", "Der Wert ist falsch, richtig wäre \\(72 \\cdot 10^{-3}\\)", "Der Exponent muss in der wissenschaftlichen Schreibweise positiv sein", "Die Schreibweise ist vollständig korrekt"], korrekt: 0, tipp: "Welche Bedingung gilt für den Vorfaktor in der wissenschaftlichen Schreibweise?", loesungsweg: "Rechnerisch ist \\(72 \\cdot 10^{-5} = 0{,}00072\\) richtig. In der wissenschaftlichen Schreibweise steht vor der Zehnerpotenz aber eine Zahl zwischen \\(1\\) und \\(10\\). Das Komma wandert daher um vier Stellen: $$0{,}00072 = 7{,}2 \\cdot 10^{-4}$$ Negative Exponenten sind dabei völlig normal — sie zeigen an, dass die Zahl kleiner als \\(1\\) ist." },
      { id: 21, level: 4, typ: "numerisch", frage: "Für welche ganze Zahl \\(n\\) gilt \\(5^n = \\frac{1}{125}\\)?", loesung: -3, toleranz: 0, tipp: "Schreibe den Nenner als Potenz von \\(5\\).", loesungsweg: "Der Nenner ist eine Fünferpotenz: \\(125 = 5^3\\). Ein Bruch mit \\(1\\) im Zähler ist eine Potenz mit negativem Exponenten: $$\\frac{1}{125} = \\frac{1}{5^3} = 5^{-3}$$ Gleiche Basis, also gleiche Exponenten: \\(n = -3\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Wassertropfen hat das Volumen \\(5 \\cdot 10^{-8}\\,\\text{m}^3\\). Wie viele Tropfen ergeben einen Liter, wenn \\(1\\,\\text{L} = 10^{-3}\\,\\text{m}^3\\) gilt?", loesung: 20000, toleranz: 0, tipp: "Gesamtvolumen durch Tropfenvolumen.", loesungsweg: "Die Anzahl ist der Quotient der Volumina: $$\\frac{10^{-3}}{5 \\cdot 10^{-8}} = \\frac{1}{5} \\cdot 10^{-3-(-8)} = 0{,}2 \\cdot 10^{5} = 20\\,000$$ Ein Liter besteht also aus rund zwanzigtausend Tropfen." },
      { id: 23, level: 4, typ: "numerisch", frage: "Ein Haar ist etwa \\(8 \\cdot 10^{-5}\\,\\text{m}\\) dick, ein Bakterium etwa \\(2 \\cdot 10^{-6}\\,\\text{m}\\) lang. Wie oft ist das Haar dicker als das Bakterium lang ist?", loesung: 40, toleranz: 0, tipp: "Bilde den Quotienten der beiden Längen.", loesungsweg: "$$\\frac{8 \\cdot 10^{-5}}{2 \\cdot 10^{-6}} = 4 \\cdot 10^{-5-(-6)} = 4 \\cdot 10^{1} = 40$$ Der Unterschied der Exponenten (\\(-5\\) gegenüber \\(-6\\)) bedeutet eine Zehnerpotenz, der Quotient der Vorfaktoren liefert den Rest. Vierzig Bakterien nebeneinander wären so dick wie ein Haar." },
      { id: 24, level: 4, typ: "numerisch", frage: "Für welche ganze Zahl \\(n\\) gilt \\(\\left(\\frac{1}{4}\\right)^n = 64\\)?", loesung: -3, toleranz: 0, tipp: "Schreibe beide Seiten als Potenzen von \\(4\\).", loesungsweg: "Der Stammbruch ist eine Potenz mit negativem Exponenten: \\(\\tfrac14 = 4^{-1}\\), also \\(\\left(\\tfrac14\\right)^n = 4^{-n}\\). Rechts steht \\(64 = 4^3\\). $$4^{-n} = 4^{3} \\;\\Rightarrow\\; -n = 3 \\;\\Rightarrow\\; n = -3$$ Probe: \\(\\left(\\tfrac14\\right)^{-3} = 4^3 = 64\\) ✓ Ein negativer Exponent auf einen Bruch kehrt ihn um und macht ihn groß." },
      // ========== LEVEL 5 -- Fehler finden, zweischrittige Sachaufgaben, Parameter ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler rechnet:<br>Schritt 1: \\(2^{-3} = (-2)^3\\)<br>Schritt 2: \\((-2)^3 = -8\\)<br>Schritt 3: Also ist \\(2^{-3} = -8\\).<br>Welcher Schritt ist der erste fehlerhafte?", optionen: ["Schritt 1 — ein negativer Exponent bedeutet den Kehrwert, \\(2^{-3} = \\frac{1}{8}\\)", "Schritt 2 — richtig wäre \\((-2)^3 = 8\\)", "Schritt 3 — es müsste \\(2^{-3} = -6\\) heißen", "Kein Schritt ist fehlerhaft"], korrekt: 0, tipp: "Wohin gehört das Minuszeichen — zur Basis oder zum Exponenten?", loesungsweg: "Schon Schritt 1 ist falsch: Das Minus steht im <b>Exponenten</b>, nicht bei der Basis. Ein negativer Exponent verlangt den Kehrwert der Potenz: $$2^{-3} = \\frac{1}{2^3} = \\frac18 = 0{,}125$$ Das Ergebnis ist positiv und kleiner als eins. Schritt 2 ist für sich richtig gerechnet (\\((-2)^3 = -8\\)), betrifft aber eine ganz andere Zahl. Minus im Exponenten heißt „umkehren\", Minus in der Basis heißt „Vorzeichen\"." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Virus ist \\(1{,}2 \\cdot 10^{-7}\\,\\text{m}\\) groß, ein Bakterium \\(3 \\cdot 10^{-6}\\,\\text{m}\\). Ein Modell des Virus ist \\(4\\,\\text{cm}\\) groß. Wie groß ist im selben Maßstab das Modell des Bakteriums in cm?", loesung: 100, toleranz: 0, tipp: "Wie oft ist das Bakterium größer als das Virus?", loesungsweg: "Zuerst das Größenverhältnis: $$\\frac{3 \\cdot 10^{-6}}{1{,}2 \\cdot 10^{-7}} = 2{,}5 \\cdot 10^{-6-(-7)} = 2{,}5 \\cdot 10 = 25$$ Das Bakterium ist \\(25\\)-mal so groß wie das Virus, im Modell also \\(25 \\cdot 4\\,\\text{cm} = 100\\,\\text{cm}\\). Der Maßstab selbst musste dafür gar nicht berechnet werden — das Verhältnis der Originale gilt auch für die Modelle." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für natürliche Zahlen \\(a > 1\\) und \\(n\\) gilt \\(a^{-n} = \\frac{1}{32}\\) und \\(a^{n-2} = 8\\). Bestimme das Produkt \\(a \\cdot n\\).", loesung: 10, toleranz: 0, tipp: "Schreibe \\(32\\) und \\(8\\) als Potenzen derselben Basis.", loesungsweg: "Beide Zahlen sind Zweierpotenzen: \\(32 = 2^5\\) und \\(8 = 2^3\\). Aus \\(a^{-n} = \\tfrac{1}{32} = 2^{-5}\\) folgt mit \\(a = 2\\) sofort \\(n = 5\\). Die zweite Bedingung bestätigt das: $$a^{n-2} = 2^{5-2} = 2^3 = 8 \\;✓$$ Andere Basen scheitern: Für \\(a = 4\\) müsste \\(4^{-n} = 4^{-2{,}5}\\) sein, \\(n\\) wäre nicht ganzzahlig. Also \\(a \\cdot n = 2 \\cdot 5 = 10\\)." },
      { id: 28, level: 5, typ: "mc", frage: "Eine Schülerin rechnet \\(10^{-3} \\cdot 10^{-2} = 10^{6}\\). Wo liegt der Fehler?", optionen: ["Beim Multiplizieren gleicher Basen werden die Exponenten addiert, nicht multipliziert: \\(10^{-5}\\)", "Die Exponenten werden multipliziert, aber das Vorzeichen bleibt: \\(10^{-6}\\)", "Es gibt keinen Fehler, \\(10^{6}\\) ist richtig", "Die Exponenten müssen subtrahiert werden: \\(10^{-1}\\)"], korrekt: 0, tipp: "Rechne mit den Dezimalzahlen nach: \\(0{,}001 \\cdot 0{,}01\\).", loesungsweg: "Die Schülerin hat die Exponenten multipliziert (\\((-3) \\cdot (-2) = 6\\)). Beim Produkt gleicher Basen werden sie aber addiert: $$10^{-3} \\cdot 10^{-2} = 10^{-3+(-2)} = 10^{-5} = 0{,}00001$$ Kontrolle mit Dezimalzahlen: \\(0{,}001 \\cdot 0{,}01 = 0{,}00001\\) ✓ Das Produkt zweier Zahlen, die kleiner als \\(1\\) sind, kann unmöglich eine Million ergeben — die Größenordnung zeigt den Fehler sofort." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Wassermolekül hat die Masse \\(3 \\cdot 10^{-26}\\,\\text{kg}\\). Ein Schluck Wasser wiegt \\(6 \\cdot 10^{-3}\\,\\text{kg}\\). Die Anzahl der Moleküle darin ist \\(2 \\cdot 10^{k}\\). Gib \\(k\\) an.", loesung: 23, toleranz: 0, tipp: "Gesamtmasse durch Masse eines Moleküls.", loesungsweg: "$$\\frac{6 \\cdot 10^{-3}}{3 \\cdot 10^{-26}} = 2 \\cdot 10^{-3-(-26)} = 2 \\cdot 10^{23}$$ Also \\(k = 23\\). Beim Subtrahieren des negativen Exponenten wird aus \\(-3 - (-26)\\) die Summe \\(-3 + 26 = 23\\). Zweihunderttrilliarden Moleküle in einem Schluck — deshalb rechnet man solche Anzahlen nur mit Zehnerpotenzen." },
      { id: 30, level: 5, typ: "numerisch", frage: "Für welche Zahl \\(x\\) gilt \\(3 \\cdot 2^{-x} = 0{,}375\\)?", loesung: 3, toleranz: 0, tipp: "Isoliere zuerst die Potenz.", loesungsweg: "Erst die Potenz freistellen: $$2^{-x} = \\frac{0{,}375}{3} = 0{,}125$$ Dann \\(0{,}125\\) als Zweierpotenz erkennen: \\(0{,}125 = \\tfrac18 = 2^{-3}\\). $$2^{-x} = 2^{-3} \\;\\Rightarrow\\; x = 3$$ Probe: \\(3 \\cdot 2^{-3} = 3 \\cdot \\tfrac18 = 0{,}375\\) ✓" },
      // ========== LEVEL 6 -- Behauptungen prüfen, Fallunterscheidungen, Umkehraufgaben ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Für alle \\(x \\neq 0\\) gilt \\(x^{-2} = -x^2\\).\" Stimmt das?", optionen: ["Nein — der negative Exponent bedeutet den Kehrwert: \\(x^{-2} = \\frac{1}{x^2}\\); für \\(x = 2\\) ist \\(\\frac14 \\neq -4\\)", "Ja — das Minus im Exponenten wandert vor die Potenz", "Ja, aber nur für negative \\(x\\)", "Nein — richtig wäre \\(x^{-2} = -\\frac{1}{x^2}\\)"], korrekt: 0, tipp: "Setze \\(x = 2\\) auf beiden Seiten ein.", loesungsweg: "Ein Zahlenbeispiel entscheidet: Für \\(x = 2\\) ist $$2^{-2} = \\frac{1}{2^2} = \\frac14, \\qquad -2^2 = -4$$ Die Behauptung ist falsch. Allgemein gilt \\(x^{-2} = \\frac{1}{x^2}\\), und das ist für jedes \\(x \\neq 0\\) <b>positiv</b> — auch für negative \\(x\\), denn \\(x^2 > 0\\). Das Minuszeichen im Exponenten erzeugt nie ein negatives Vorzeichen, sondern einen Kehrwert." },
      { id: 32, level: 6, typ: "numerisch", frage: "Eine Größe \\(y\\) hängt von \\(x\\) über \\(y = a \\cdot x^{-n}\\) ab. Für \\(x = 1\\) ist \\(y = 6\\), für \\(x = 2\\) ist \\(y = 0{,}75\\). Bestimme \\(n\\).", loesung: 3, toleranz: 0, tipp: "Aus dem ersten Wertepaar folgt \\(a\\) unmittelbar.", loesungsweg: "Für \\(x = 1\\) ist \\(1^{-n} = 1\\), also \\(a = 6\\). Das zweite Wertepaar liefert den Exponenten: $$6 \\cdot 2^{-n} = 0{,}75 \\;\\Rightarrow\\; 2^{-n} = 0{,}125 = \\frac18 = 2^{-3}$$ Also \\(n = 3\\). Probe: \\(6 \\cdot 2^{-3} = 6 \\cdot \\tfrac18 = 0{,}75\\) ✓ Das Wertepaar mit \\(x = 1\\) ist der Schlüssel — es verrät \\(a\\), ohne dass \\(n\\) bekannt sein muss." },
      { id: 33, level: 6, typ: "mc", frage: "Für welche reellen Zahlen \\(x\\) ist \\(x^{-3}\\) negativ?", optionen: ["Genau für alle \\(x < 0\\), denn \\(x^{-3} = \\frac{1}{x^3}\\) hat dasselbe Vorzeichen wie \\(x^3\\)", "Für alle \\(x \\neq 0\\), weil der Exponent negativ ist", "Für alle \\(x > 0\\), weil der Kehrwert das Vorzeichen umkehrt", "Für kein \\(x\\), denn negative Exponenten liefern nie negative Werte"], korrekt: 0, tipp: "Vergleiche \\(x = 2\\) und \\(x = -2\\).", loesungsweg: "Wegen \\(x^{-3} = \\frac{1}{x^3}\\) hat die Potenz dasselbe Vorzeichen wie \\(x^3\\) — der Kehrwert ändert das Vorzeichen nicht. Der Exponent \\(3\\) ist ungerade, also gilt: $$x > 0 \\Rightarrow x^{-3} > 0, \\qquad x < 0 \\Rightarrow x^{-3} < 0$$ Beispiel: \\((-2)^{-3} = \\frac{1}{-8} = -\\frac18\\). Bei geradem Exponenten wie in \\(x^{-2}\\) wäre das Ergebnis dagegen immer positiv. Das Vorzeichen des Ergebnisses hängt von der Basis und der Parität des Exponenten ab, nicht vom Vorzeichen des Exponenten." },
      { id: 34, level: 6, typ: "numerisch", frage: "Wie viele reelle Zahlen \\(x\\) erfüllen die Gleichung \\(x^{-2} = x^{2}\\)?", loesung: 2, toleranz: 0, tipp: "Schreibe die linke Seite als Bruch und multipliziere.", loesungsweg: "Mit \\(x^{-2} = \\frac{1}{x^2}\\) und \\(x \\neq 0\\): $$\\frac{1}{x^2} = x^2 \\;\\Rightarrow\\; x^4 = 1 \\;\\Rightarrow\\; x = 1 \\text{ oder } x = -1$$ Beide Werte erfüllen die Gleichung: \\(1^{-2} = 1 = 1^2\\) und \\((-1)^{-2} = 1 = (-1)^2\\). Es gibt also genau <b>zwei</b> Lösungen. Die Zahl \\(0\\) scheidet aus, weil \\(0^{-2}\\) nicht definiert ist." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Atom hat etwa den Durchmesser \\(10^{-10}\\,\\text{m}\\), sein Kern etwa \\(10^{-15}\\,\\text{m}\\). In einem Modell hat das Atom \\(100\\,\\text{m}\\) Durchmesser. Wie groß ist der Kern in diesem Modell in Millimetern?", loesung: 1, toleranz: 0, tipp: "Der Kern ist um wie viele Zehnerpotenzen kleiner als das Atom?", loesungsweg: "Das Größenverhältnis von Kern zu Atom ist $$\\frac{10^{-15}}{10^{-10}} = 10^{-15-(-10)} = 10^{-5}$$ Im Modell gilt dasselbe Verhältnis: $$100\\,\\text{m} \\cdot 10^{-5} = 10^{2} \\cdot 10^{-5}\\,\\text{m} = 10^{-3}\\,\\text{m} = 1\\,\\text{mm}$$ Ein Atom in der Größe eines Fußballstadions hätte einen Kern von der Größe eines Reiskorns — der Rest ist leer." },
      { id: 36, level: 6, typ: "mc", frage: "Behauptung: „Je kleiner der Exponent, desto kleiner die Potenz. Deshalb ist \\(0{,}5^{-3}\\) kleiner als \\(0{,}5^{-2}\\).\" Stimmt das?", optionen: ["Nein — für Basen zwischen \\(0\\) und \\(1\\) gilt das Gegenteil: \\(0{,}5^{-3} = 8 > 4 = 0{,}5^{-2}\\)", "Ja — die Regel gilt für jede Basis, also auch hier", "Ja — beide Potenzen sind negativ, und \\(-3 < -2\\)", "Nein — beide Potenzen sind gleich groß, weil die Basis kleiner als \\(1\\) ist"], korrekt: 0, tipp: "Berechne beide Potenzen über den Kehrwert der Basis.", loesungsweg: "Mit \\(0{,}5 = \\tfrac12\\) wird der negative Exponent zum Umkehren des Bruchs: $$0{,}5^{-3} = 2^3 = 8, \\qquad 0{,}5^{-2} = 2^2 = 4$$ Die Potenz mit dem kleineren Exponenten ist hier die <b>größere</b>. Die Regel „kleinerer Exponent, kleinere Potenz\" gilt nur für Basen größer als \\(1\\); für Basen zwischen \\(0\\) und \\(1\\) kehrt sie sich um. Eine Behauptung, die die Basis nicht beachtet, ist unvollständig." }];
    </script>
