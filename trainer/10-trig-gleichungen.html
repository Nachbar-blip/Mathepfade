<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigonometrische Gleichungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-trig-gleichungen';
    const THEMA_CONFIG = { name: 'Trigonometrische Gleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundwerte erkennen ==========
      { id: 1, level: 1, typ: "mc", frage: "Welcher Winkel \\(x \\in [0°;360°]\\) erfüllt \\(\\sin(x) = 0\\)?", optionen: ["\\(x = 90°\\)", "\\(x = 0°\\) und \\(x = 180°\\)", "\\(x = 180°\\) nur", "\\(x = 270°\\)"], korrekt: 1, tipp: "Denke an die Nullstellen der Sinusfunktion.", loesungsweg: "\\(\\sin(0°) = 0\\) und \\(\\sin(180°) = 0\\). Innerhalb \\([0°;360°]\\) auch \\(360°\\), aber gleich \\(0°\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Welcher Winkel erfüllt \\(\\cos(x) = 1\\)?", optionen: ["\\(x = 0°\\)", "\\(x = 90°\\)", "\\(x = 180°\\)", "\\(x = 270°\\)"], korrekt: 0, tipp: "Kosinus ist die x-Koordinate am Einheitskreis.", loesungsweg: "\\(\\cos(0°) = 1\\)." },
      { id: 3, level: 1, typ: "numerisch", frage: "Löse \\(\\sin(x) = 1\\) im Bereich \\([0°;360°]\\). Gib \\(x\\) in Grad an.", loesung: 90, toleranz: 0, tipp: "Sinus ist maximal dort, wo die y-Koordinate auf dem Einheitskreis 1 ist.", loesungsweg: "\\(\\sin(90°) = 1\\), also \\(x = 90°\\)." },
      { id: 4, level: 1, typ: "mc", frage: "Wie viele Lösungen hat \\(\\sin(x) = 0{,}5\\) in \\([0°;360°]\\)?", optionen: ["0", "1", "2", "unendlich viele"], korrekt: 2, tipp: "Denke an die Symmetrie des Sinusgraphen.", loesungsweg: "Es gibt genau 2 Lösungen: \\(x_1 = 30°\\) und \\(x_2 = 150°\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Welcher Wert ist \\(\\cos(0°)\\)?", optionen: ["\\(0\\)", "\\(0{,}5\\)", "\\(1\\)", "\\(-1\\)"], korrekt: 2, tipp: "Auf dem Einheitskreis ist die x-Koordinate bei \\(0°\\) maximal.", loesungsweg: "\\(\\cos(0°) = 1\\)." },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(\\cos(x) = 0\\) im Bereich \\([0°;360°]\\). Gib die kleinere der beiden Lösungen in Grad an.", loesung: 90, toleranz: 0, tipp: "Kosinus ist null, wenn x-Koordinate null ist.", loesungsweg: "\\(\\cos(90°) = 0\\) und \\(\\cos(270°) = 0\\). Kleinere: \\(90°\\)." },
      // ========== LEVEL 2 — Einfache Gleichungen lösen ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Löse \\(\\sin(x) = 0{,}5\\) in \\([0°;360°]\\). Gib die kleinere Lösung in Grad an.", loesung: 30, toleranz: 0, tipp: "Arcsin oder Tabelle: \\(\\sin^{-1}(0{,}5) = 30°\\).", loesungsweg: "\\(x_1 = 30°\\), \\(x_2 = 180° - 30° = 150°\\). Kleinere: \\(30°\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\(\\sin(x) = 0{,}5\\) in \\([0°;360°]\\). Gib die größere Lösung in Grad an.", loesung: 150, toleranz: 0, tipp: "Sinus-Symmetrie: \\(x_2 = 180° - x_1\\).", loesungsweg: "\\(x_2 = 180° - 30° = 150°\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Löse \\(\\cos(x) = 0{,}5\\) in \\([0°;360°]\\). Gib die kleinere Lösung in Grad an.", loesung: 60, toleranz: 0, tipp: "\\(\\cos^{-1}(0{,}5) = 60°\\).", loesungsweg: "\\(x_1 = 60°\\), \\(x_2 = 360° - 60° = 300°\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(\\cos(x) = 0{,}5\\) in \\([0°;360°]\\). Gib die größere Lösung in Grad an.", loesung: 300, toleranz: 0, tipp: "Kosinus-Symmetrie: \\(x_2 = 360° - x_1\\).", loesungsweg: "\\(x_2 = 360° - 60° = 300°\\)." },
      { id: 11, level: 2, typ: "mc", frage: "Welche Aussage stimmt für \\(\\sin(x) = -0{,}5\\) in \\([0°;360°]\\)?", optionen: ["Keine Lösung", "Lösungen im 3. und 4. Quadranten", "Nur Lösung bei \\(x=180°\\)", "Lösungen im 1. und 2. Quadranten"], korrekt: 1, tipp: "Sinus ist negativ im 3. und 4. Quadranten.", loesungsweg: "\\(x_1 = 180° + 30° = 210°\\), \\(x_2 = 360° - 30° = 330°\\). Beide im 3./4. Quadranten." },
      { id: 12, level: 2, typ: "numerisch", frage: "Löse \\(\\tan(x) = 1\\) im Bereich \\([0°;180°)\\). Gib \\(x\\) in Grad an.", loesung: 45, toleranz: 0, tipp: "\\(\\tan(45°) = 1\\).", loesungsweg: "\\(\\tan(45°) = 1\\), also \\(x = 45°\\)." },
      // ========== LEVEL 3 — Lineare Substitution ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(2\\sin(x) = 1\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 30, toleranz: 0, tipp: "Erst durch 2 teilen: \\(\\sin(x) = 0{,}5\\).", loesungsweg: "\\(\\sin(x) = 0{,}5 \\Rightarrow x_1 = 30°, x_2 = 150°\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\(\\sin(x) + 1 = 0\\) in \\([0°;360°]\\). Gib \\(x\\) in Grad an.", loesung: 270, toleranz: 0, tipp: "\\(\\sin(x) = -1\\). Wo ist Sinus minimal?", loesungsweg: "\\(\\sin(270°) = -1\\), also \\(x = 270°\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Löse \\(3\\cos(x) - 1{,}5 = 0\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 60, toleranz: 0, tipp: "Auflösen nach \\(\\cos(x)\\): \\(\\cos(x) = 0{,}5\\).", loesungsweg: "\\(\\cos(x) = \\tfrac{1{,}5}{3} = 0{,}5 \\Rightarrow x_1 = 60°, x_2 = 300°\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Welche Lösungsmenge hat \\(\\cos(x) = -1\\) in \\([0°;360°]\\)?", optionen: ["\\(\\{0°\\}\\)", "\\(\\{90°\\}\\)", "\\(\\{180°\\}\\)", "\\(\\{270°\\}\\)"], korrekt: 2, tipp: "Kosinus ist minimal bei \\(180°\\).", loesungsweg: "\\(\\cos(180°) = -1\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Löse \\(2\\sin(x) - \\sqrt{3} = 0\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 60, toleranz: 0, tipp: "\\(\\sin(x) = \\tfrac{\\sqrt{3}}{2}\\).", loesungsweg: "\\(\\sin(60°) = \\tfrac{\\sqrt{3}}{2} \\Rightarrow x_1 = 60°, x_2 = 120°\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(\\sin(x) = -\\tfrac{1}{2}\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 210, toleranz: 0, tipp: "Sinus negativ im 3. und 4. Quadranten.", loesungsweg: "\\(x_1 = 180° + 30° = 210°\\), \\(x_2 = 360° - 30° = 330°\\)." },
      // ========== LEVEL 4 — Gleichungen mit innerer Funktion ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Löse \\(\\sin(2x) = 0\\) in \\([0°;360°]\\). Wie viele Lösungen gibt es?", loesung: 5, toleranz: 0, tipp: "Für \\(2x\\) läuft der Winkel bis \\(720°\\). Nullstellen alle \\(180°\\).", loesungsweg: "\\(2x = 0°, 180°, 360°, 540°, 720° \\Rightarrow x = 0°, 90°, 180°, 270°, 360°\\). Das sind 5 Lösungen." },
      { id: 20, level: 4, typ: "numerisch", frage: "Löse \\(\\sin(x + 30°) = 0\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 150, toleranz: 0, tipp: "Substituiere \\(u = x + 30°\\). Dann \\(\\sin(u) = 0\\).", loesungsweg: "\\(u = 180° \\Rightarrow x = 150°\\). (\\(u = 0°\\) gäbe \\(x = -30°\\), außerhalb.) Auch \\(u = 360° \\Rightarrow x = 330°\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Löse \\(\\cos(2x) = 1\\) in \\([0°;360°]\\). Kleinere positive Lösung in Grad (nicht 0).", loesung: 180, toleranz: 0, tipp: "\\(\\cos(u) = 1\\) bei \\(u = 0°, 360°, 720°\\ldots\\)", loesungsweg: "\\(2x = 0°, 360°, 720° \\Rightarrow x = 0°, 180°, 360°\\). Kleinere positive: \\(180°\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Wie viele Lösungen hat \\(\\sin(3x) = 0{,}5\\) in \\([0°;360°]\\)?", optionen: ["2", "3", "4", "6"], korrekt: 3, tipp: "Für jede Periode von \\(\\sin(u)\\) gibt es 2 Lösungen. Wie viele Perioden durchläuft \\(3x\\)?", loesungsweg: "\\(3x\\) läuft durch \\([0°;1080°]\\), also 3 Perioden. In jeder Periode 2 Lösungen → 6 Lösungen." },
      { id: 23, level: 4, typ: "numerisch", frage: "Löse \\(2\\cos(x) + \\sqrt{2} = 0\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 135, toleranz: 0, tipp: "\\(\\cos(x) = -\\tfrac{\\sqrt{2}}{2}\\).", loesungsweg: "\\(\\cos(135°) = -\\tfrac{\\sqrt{2}}{2}\\), auch \\(\\cos(225°)\\). Kleinere: \\(135°\\)." },
      { id: 24, level: 4, typ: "numerisch", frage: "Löse \\(\\sin(x) = \\cos(x)\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 45, toleranz: 0, tipp: "Teile durch \\(\\cos(x)\\): \\(\\tan(x) = 1\\).", loesungsweg: "\\(\\tan(x) = 1 \\Rightarrow x = 45°\\) oder \\(x = 225°\\). Kleinere: \\(45°\\)." },
      // ========== LEVEL 5 — Quadratische Form ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Löse \\(\\sin^2(x) = \\tfrac{1}{4}\\) in \\([0°;360°]\\). Wie viele Lösungen?", loesung: 4, toleranz: 0, tipp: "\\(\\sin(x) = \\pm \\tfrac{1}{2}\\) — beide Fälle geben je 2 Lösungen.", loesungsweg: "\\(\\sin(x) = 0{,}5: x = 30°, 150°\\). \\(\\sin(x) = -0{,}5: x = 210°, 330°\\). Zusammen 4." },
      { id: 26, level: 5, typ: "mc", frage: "Mit welcher Identität lässt sich \\(\\sin^2(x) + 3\\sin(x) = 0\\) am besten lösen?", optionen: ["\\(\\sin^2 + \\cos^2 = 1\\)", "Ausklammern: \\(\\sin(x)(\\sin(x) + 3) = 0\\)", "Mitternachtsformel auf Sinus", "\\(\\sin(2x)\\)-Formel"], korrekt: 1, tipp: "Gemeinsamer Faktor ist \\(\\sin(x)\\).", loesungsweg: "\\(\\sin(x)(\\sin(x) + 3) = 0\\). Entweder \\(\\sin(x) = 0\\) oder \\(\\sin(x) = -3\\) (keine Lösung)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Löse \\(\\sin^2(x) = \\sin(x)\\) in \\([0°;360°]\\). Wie viele Lösungen?", loesung: 3, toleranz: 0, tipp: "\\(\\sin(x)(\\sin(x) - 1) = 0\\).", loesungsweg: "\\(\\sin(x) = 0: x = 0°, 180°, 360°\\) (das sind 3, wobei \\(0°\\) und \\(360°\\) je nach Konvention 1 oder 2 Lösungen). \\(\\sin(x) = 1: x = 90°\\). Standard: \\(0°, 90°, 180°\\) → 3 Lösungen." },
      { id: 28, level: 5, typ: "numerisch", frage: "Löse \\(2\\cos^2(x) - 1 = 0\\) in \\([0°;360°]\\). Kleinste Lösung in Grad.", loesung: 45, toleranz: 0, tipp: "\\(\\cos^2(x) = \\tfrac{1}{2} \\Rightarrow \\cos(x) = \\pm \\tfrac{\\sqrt{2}}{2}\\).", loesungsweg: "\\(\\cos(x) = \\pm\\tfrac{\\sqrt{2}}{2}\\) ergibt \\(x \\in \\{45°, 135°, 225°, 315°\\}\\). Kleinste: \\(45°\\)." },
      { id: 29, level: 5, typ: "mc", frage: "Welche Gleichung ist ein \\(Pythagoräischer Trigonometrischer Lehrsatz\\)?", optionen: ["\\(\\sin(x) + \\cos(x) = 1\\)", "\\(\\sin^2(x) + \\cos^2(x) = 1\\)", "\\(\\tan^2(x) + 1 = \\sin^2(x)\\)", "\\(\\sin(2x) = 2\\sin(x)\\)"], korrekt: 1, tipp: "Herleitung aus dem Einheitskreis via Satz des Pythagoras.", loesungsweg: "\\(\\sin^2(x) + \\cos^2(x) = 1\\) — gilt für alle \\(x\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Vereinfache \\(1 - \\sin^2(x)\\). Für \\(x = 60°\\) ergibt sich welcher Wert (als Dezimal)?", loesung: 0.25, toleranz: 0.01, tipp: "\\(1 - \\sin^2(x) = \\cos^2(x)\\). \\(\\cos(60°) = 0{,}5\\).", loesungsweg: "\\(\\cos^2(60°) = 0{,}5^2 = 0{,}25\\)." },
      // ========== LEVEL 6 — Anwendung ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Eine Schwingung wird durch \\(h(t) = 2\\sin(t)\\) beschrieben (\\(t\\) in Grad). Wann wird \\(h = 1\\) zum ersten Mal erreicht? Gib \\(t\\) in Grad an.", loesung: 30, toleranz: 0, tipp: "\\(\\sin(t) = 0{,}5\\).", loesungsweg: "\\(2\\sin(t) = 1 \\Rightarrow \\sin(t) = 0{,}5 \\Rightarrow t = 30°\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Ein Riesenrad: Höhe \\(h(t) = 15 - 12\\cos(t°)\\). Für welches \\(t\\) (Grad) ist \\(h = 15\\)? Kleinste positive Lösung.", loesung: 90, toleranz: 0, tipp: "\\(15 - 12\\cos(t°) = 15 \\Rightarrow \\cos(t°) = 0\\).", loesungsweg: "\\(\\cos(t) = 0 \\Rightarrow t = 90°\\) (kleinste positive Lösung)." },
      { id: 33, level: 6, typ: "numerisch", frage: "Löse \\(\\sin(x) = \\cos(x)\\) in \\([0°;360°]\\). Wie viele Lösungen?", loesung: 2, toleranz: 0, tipp: "\\(\\tan(x) = 1\\). Zwei Lösungen pro Periode von \\(180°\\).", loesungsweg: "\\(x = 45°\\) und \\(x = 225°\\): 2 Lösungen." },
      { id: 34, level: 6, typ: "mc", frage: "Gegeben: \\(\\sin(x) = a\\) mit \\(0 < a < 1\\). Die allgemeine Lösung lautet…", optionen: ["\\(x = \\arcsin(a) + k\\cdot 360°\\)", "\\(x = \\arcsin(a) + k\\cdot 360°\\) oder \\(x = 180° - \\arcsin(a) + k\\cdot 360°\\)", "\\(x = \\arcsin(a) + k\\cdot 180°\\)", "\\(x = \\arccos(a) + k\\cdot 360°\\)"], korrekt: 1, tipp: "In jeder Periode von \\(360°\\) gibt es zwei Lösungen.", loesungsweg: "Pro Periode 2 Lösungen: \\(\\arcsin(a)\\) und \\(180° - \\arcsin(a)\\), jeweils plus Vielfaches von \\(360°\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Die Temperatur ist \\(T(t) = 20 + 5\\sin(15° \\cdot t)\\). Für welches \\(t\\in[0;24]\\) (Stunden) ist \\(T = 25\\) zum ersten Mal erreicht?", loesung: 6, toleranz: 0, tipp: "\\(\\sin(15° \\cdot t) = 1 \\Rightarrow 15°\\cdot t = 90°\\).", loesungsweg: "\\(5\\sin(15°t) = 5 \\Rightarrow \\sin(15°t) = 1 \\Rightarrow 15°t = 90° \\Rightarrow t = 6\\) (Stunden)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Löse \\(2\\sin^2(x) + \\sin(x) - 1 = 0\\) in \\([0°;360°]\\). Kleinste Lösung in Grad.", loesung: 30, toleranz: 0, tipp: "Substituiere \\(u = \\sin(x)\\): \\(2u^2 + u - 1 = 0\\). Mitternachtsformel.", loesungsweg: "\\(u = \\tfrac{-1\\pm\\sqrt{1+8}}{4} = \\tfrac{-1\\pm 3}{4} \\in \\{0{,}5; -1\\}\\). \\(\\sin(x) = 0{,}5: x = 30°, 150°\\). \\(\\sin(x) = -1: x = 270°\\). Kleinste: \\(30°\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
