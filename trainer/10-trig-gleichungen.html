<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigonometrische Gleichungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-trig-gleichungen';
    const THEMA_CONFIG = { name: 'Trigonometrische Gleichungen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundwerte erkennen ==========
      { id: 1, level: 1, typ: "mc", frage: "Welcher Winkel \\(x \\in [0°;360°]\\) erfüllt \\(\\sin(x) = 0\\)?", optionen: ["\\(x = 90°\\)", "\\(x = 0°\\) und \\(x = 180°\\)", "\\(x = 180°\\) nur", "\\(x = 270°\\)"], korrekt: 1, tipp: "Denke an die Nullstellen der Sinusfunktion.", loesungsweg: "\\(\\sin(0°) = 0\\) und \\(\\sin(180°) = 0\\). Innerhalb \\([0°;360°]\\) auch \\(360°\\), aber gleich \\(0°\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Welcher Winkel erfüllt \\(\\cos(x) = 1\\)?", optionen: ["\\(x = 0°\\)", "\\(x = 90°\\)", "\\(x = 180°\\)", "\\(x = 270°\\)"], korrekt: 0, tipp: "Kosinus ist die x-Koordinate am Einheitskreis.", loesungsweg: "Am Einheitskreis ist \\(\\cos x\\) die \\(x\\)-Koordinate des Punktes. Den größtmöglichen Wert \\(1\\) erreicht sie ganz rechts, also bei $$x = 0°$$ Bei \\(180°\\) wäre der Kosinus \\(-1\\), bei \\(90°\\) und \\(270°\\) null." },
      { id: 3, level: 1, typ: "numerisch", frage: "Löse \\(\\sin(x) = 1\\) im Bereich \\([0°;360°]\\). Gib \\(x\\) in Grad an.", loesung: 90, toleranz: 0, tipp: "Sinus ist maximal dort, wo die y-Koordinate auf dem Einheitskreis 1 ist.", loesungsweg: "\\(\\sin(90°) = 1\\), also \\(x = 90°\\)." },
      { id: 4, level: 1, typ: "mc", frage: "Wie viele Lösungen hat \\(\\sin(x) = 0{,}5\\) in \\([0°;360°]\\)?", optionen: ["0", "1", "2", "unendlich viele"], korrekt: 2, tipp: "Denke an die Symmetrie des Sinusgraphen.", loesungsweg: "Es gibt genau 2 Lösungen: \\(x_1 = 30°\\) und \\(x_2 = 150°\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Welcher Wert ist \\(\\cos(0°)\\)?", optionen: ["\\(0\\)", "\\(0{,}5\\)", "\\(1\\)", "\\(-1\\)"], korrekt: 2, tipp: "Auf dem Einheitskreis ist die x-Koordinate bei \\(0°\\) maximal.", loesungsweg: "$$\\cos(0°) = 1$$ Der Punkt liegt am Einheitskreis bei \\((1|0)\\): Die \\(x\\)-Koordinate — der Kosinus — ist \\(1\\), die \\(y\\)-Koordinate — der Sinus — ist \\(0\\)." },
      { id: 6, level: 1, typ: "numerisch", frage: "Löse \\(\\cos(x) = 0\\) im Bereich \\([0°;360°]\\). Gib die kleinere der beiden Lösungen in Grad an.", loesung: 90, toleranz: 0, tipp: "Kosinus ist null, wenn x-Koordinate null ist.", loesungsweg: "\\(\\cos(90°) = 0\\) und \\(\\cos(270°) = 0\\). Kleinere: \\(90°\\)." },
      // ========== LEVEL 2 — Einfache Gleichungen lösen ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Löse \\(\\sin(x) = 0{,}5\\) in \\([0°;360°]\\). Gib die kleinere Lösung in Grad an.", loesung: 30, toleranz: 0, tipp: "Die Umkehrfunktion des Sinus liefert den Winkel im ersten Quadranten.", loesungsweg: "\\(x_1 = 30°\\), \\(x_2 = 180° - 30° = 150°\\). Kleinere: \\(30°\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\(\\sin(x) = 0{,}5\\) in \\([0°;360°]\\). Gib die größere Lösung in Grad an.", loesung: 150, toleranz: 0, tipp: "Sinus-Symmetrie: \\(x_2 = 180° - x_1\\).", loesungsweg: "\\(x_2 = 180° - 30° = 150°\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Löse \\(\\cos(x) = 0{,}5\\) in \\([0°;360°]\\). Gib die kleinere Lösung in Grad an.", loesung: 60, toleranz: 0, tipp: "Die Umkehrfunktion des Kosinus liefert den Winkel im ersten Quadranten.", loesungsweg: "\\(x_1 = 60°\\), \\(x_2 = 360° - 60° = 300°\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(\\cos(x) = 0{,}5\\) in \\([0°;360°]\\). Gib die größere Lösung in Grad an.", loesung: 300, toleranz: 0, tipp: "Kosinus-Symmetrie: \\(x_2 = 360° - x_1\\).", loesungsweg: "\\(x_2 = 360° - 60° = 300°\\)." },
      { id: 11, level: 2, typ: "mc", frage: "Welche Aussage stimmt für \\(\\sin(x) = -0{,}5\\) in \\([0°;360°]\\)?", optionen: ["Keine Lösung", "Lösungen im 3. und 4. Quadranten", "Nur Lösung bei \\(x=180°\\)", "Lösungen im 1. und 2. Quadranten"], korrekt: 1, tipp: "Sinus ist negativ im 3. und 4. Quadranten.", loesungsweg: "\\(x_1 = 180° + 30° = 210°\\), \\(x_2 = 360° - 30° = 330°\\). Beide im 3./4. Quadranten." },
      { id: 12, level: 2, typ: "numerisch", frage: "Löse \\(\\tan(x) = 1\\) im Bereich \\([0°;180°)\\). Gib \\(x\\) in Grad an.", loesung: 45, toleranz: 0, tipp: "Der Tangens ist der Quotient aus Sinus und Kosinus; er wird 1, wenn beide Werte übereinstimmen.", loesungsweg: "\\(\\tan(45°) = 1\\), also \\(x = 45°\\)." },
      // ========== LEVEL 3 — Lineare Substitution ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Löse \\(2\\sin(x) = 1\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 30, toleranz: 0, tipp: "Erst durch 2 teilen: \\(\\sin(x) = 0{,}5\\).", loesungsweg: "\\(\\sin(x) = 0{,}5 \\Rightarrow x_1 = 30°, x_2 = 150°\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\(\\sin(x) + 1 = 0\\) in \\([0°;360°]\\). Gib \\(x\\) in Grad an.", loesung: 270, toleranz: 0, tipp: "\\(\\sin(x) = -1\\). Wo ist Sinus minimal?", loesungsweg: "\\(\\sin(270°) = -1\\), also \\(x = 270°\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Löse \\(3\\cos(x) - 1{,}5 = 0\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 60, toleranz: 0, tipp: "Auflösen nach \\(\\cos(x)\\): \\(\\cos(x) = 0{,}5\\).", loesungsweg: "\\(\\cos(x) = \\tfrac{1{,}5}{3} = 0{,}5 \\Rightarrow x_1 = 60°, x_2 = 300°\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Welche Lösungsmenge hat \\(\\cos(x) = -1\\) in \\([0°;360°]\\)?", optionen: ["\\(\\{0°\\}\\)", "\\(\\{90°\\}\\)", "\\(\\{180°\\}\\)", "\\(\\{270°\\}\\)"], korrekt: 2, tipp: "Kosinus ist minimal bei \\(180°\\).", loesungsweg: "Der Kosinus nimmt seinen kleinsten Wert am linken Rand des Einheitskreises an, also bei \\(180°\\): $$\\cos(180°) = -1 \\;\\Rightarrow\\; L = \\{180°\\}$$ Im Intervall \\([0°;360°]\\) gibt es dafür nur diese eine Stelle." },
      { id: 17, level: 3, typ: "numerisch", frage: "Löse \\(2\\sin(x) - \\sqrt{3} = 0\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 60, toleranz: 0, tipp: "\\(\\sin(x) = \\tfrac{\\sqrt{3}}{2}\\).", loesungsweg: "\\(\\sin(60°) = \\tfrac{\\sqrt{3}}{2} \\Rightarrow x_1 = 60°, x_2 = 120°\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Löse \\(\\sin(x) = -\\tfrac{1}{2}\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 210, toleranz: 0, tipp: "Sinus negativ im 3. und 4. Quadranten.", loesungsweg: "\\(x_1 = 180° + 30° = 210°\\), \\(x_2 = 360° - 30° = 330°\\)." },
      // ========== LEVEL 4 — Gleichungen mit innerer Funktion ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Löse \\(\\sin(2x) = 0\\) in \\([0°;360°]\\). Wie viele Lösungen gibt es?", loesung: 5, toleranz: 0, tipp: "Für \\(2x\\) läuft der Winkel bis \\(720°\\). Nullstellen alle \\(180°\\).", loesungsweg: "\\(2x = 0°, 180°, 360°, 540°, 720° \\Rightarrow x = 0°, 90°, 180°, 270°, 360°\\). Das sind 5 Lösungen." },
      { id: 20, level: 4, typ: "numerisch", frage: "Löse \\(\\sin(x + 30°) = 0\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 150, toleranz: 0, tipp: "Substituiere \\(u = x + 30°\\). Dann \\(\\sin(u) = 0\\).", loesungsweg: "\\(u = 180° \\Rightarrow x = 150°\\). (\\(u = 0°\\) gäbe \\(x = -30°\\), außerhalb.) Auch \\(u = 360° \\Rightarrow x = 330°\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Löse \\(\\cos(2x) = 1\\) in \\([0°;360°]\\). Kleinere positive Lösung in Grad (nicht 0).", loesung: 180, toleranz: 0, tipp: "\\(\\cos(u) = 1\\) bei \\(u = 0°, 360°, 720°\\ldots\\)", loesungsweg: "\\(2x = 0°, 360°, 720° \\Rightarrow x = 0°, 180°, 360°\\). Kleinere positive: \\(180°\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Wie viele Lösungen hat \\(\\sin(3x) = 0{,}5\\) in \\([0°;360°]\\)?", optionen: ["2", "3", "4", "6"], korrekt: 3, tipp: "Für jede Periode von \\(\\sin(u)\\) gibt es 2 Lösungen. Wie viele Perioden durchläuft \\(3x\\)?", loesungsweg: "\\(3x\\) läuft durch \\([0°;1080°]\\), also 3 Perioden. In jeder Periode 2 Lösungen → 6 Lösungen." },
      { id: 23, level: 4, typ: "numerisch", frage: "Löse \\(2\\cos(x) + \\sqrt{2} = 0\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 135, toleranz: 0, tipp: "\\(\\cos(x) = -\\tfrac{\\sqrt{2}}{2}\\).", loesungsweg: "Nach \\(\\cos x\\) auflösen: $$2\\cos x = -\\sqrt2 \\;\\Rightarrow\\; \\cos x = -\\frac{\\sqrt2}{2} \\approx -0{,}707$$ Der Kosinus ist negativ im zweiten und dritten Quadranten. Zum Referenzwinkel \\(45°\\) gehören also $$x = 180° - 45° = 135° \\quad\\text{und}\\quad x = 180° + 45° = 225°$$ Die kleinere Lösung ist \\(135°\\). Eine Gleichung dieser Art hat im Vollkreis immer <b>zwei</b> Lösungen." },
      { id: 24, level: 4, typ: "numerisch", frage: "Löse \\(\\sin(x) = \\cos(x)\\) in \\([0°;360°]\\). Kleinere Lösung in Grad.", loesung: 45, toleranz: 0, tipp: "Teile durch \\(\\cos(x)\\): \\(\\tan(x) = 1\\).", loesungsweg: "\\(\\tan(x) = 1 \\Rightarrow x = 45°\\) oder \\(x = 225°\\). Kleinere: \\(45°\\)." },
      // ========== LEVEL 5 — Gleichungen mit zwei Schritten ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler löst \\(\\sin^2(x) = \\sin(x)\\), teilt dazu beide Seiten durch \\(\\sin(x)\\) und gibt \\(L = \\{90°\\}\\) an. Wo steckt der Fehler?", optionen: ["Es wurde durch einen Term geteilt, der null werden kann", "Die Quadratwurzel wurde ohne Vorzeichen gezogen", "Das Intervall wurde falsch abgelesen", "Der Sinus wurde mit dem Kosinus verwechselt"], korrekt: 0, tipp: "Prüfe, ob der Term, durch den geteilt wurde, im Intervall den Wert null annehmen kann.", loesungsweg: "Beim Teilen durch \\(\\sin(x)\\) gehen alle Winkel mit \\(\\sin(x) = 0\\) verloren. Richtig ist das Ausklammern: $$\\sin(x)\\bigl(\\sin(x) - 1\\bigr) = 0$$ Daraus folgt \\(\\sin(x) = 0\\) mit \\(x \\in \\{0°;\\,180°;\\,360°\\}\\) oder \\(\\sin(x) = 1\\) mit \\(x = 90°\\). Die Lösungsmenge ist also \\(L = \\{0°;\\,90°;\\,180°;\\,360°\\}\\) und nicht nur \\(\\{90°\\}\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Bestimme die Anzahl der Lösungen von \\(2\\sin^2(x) - 5\\sin(x) + 2 = 0\\) im Intervall \\([0°;\\,360°]\\).", loesung: 2, toleranz: 0, tipp: "Betrachte den Sinuswert als eigene Unbekannte und prüfe anschließend für jeden gefundenen Wert, ob er als Sinuswert überhaupt vorkommen kann.", loesungsweg: "Mit \\(u = \\sin(x)\\) entsteht \\(2u^2 - 5u + 2 = 0\\), also $$u_{1,2} = \\frac{5 \\pm \\sqrt{25 - 16}}{4} = \\frac{5 \\pm 3}{4}$$ das heißt \\(u_1 = 2\\) und \\(u_2 = 0{,}5\\). Der Wert \\(u_1 = 2\\) scheidet aus, weil der Sinus höchstens 1 wird. Aus \\(\\sin(x) = 0{,}5\\) folgen \\(x = 30°\\) und \\(x = 150°\\): genau <b>2</b> Lösungen." },
      { id: 27, level: 5, typ: "numerisch", frage: "Löse \\(2\\cos^2(x) + \\sin(x) - 1 = 0\\) im Intervall \\([0°;\\,360°]\\) und gib die kleinste Lösung in Grad an.", loesung: 90, toleranz: 0.1, tipp: "Ersetze zuerst das Kosinusquadrat mithilfe der trigonometrischen Grundbeziehung, damit nur noch eine Winkelfunktion vorkommt.", loesungsweg: "Mit \\(\\cos^2(x) = 1 - \\sin^2(x)\\) wird die Gleichung zu $$2 - 2\\sin^2(x) + \\sin(x) - 1 = 0 \\;\\Rightarrow\\; 2\\sin^2(x) - \\sin(x) - 1 = 0$$ Mit \\(u = \\sin(x)\\): \\(u_{1,2} = \\frac{1 \\pm 3}{4}\\), also \\(u_1 = 1\\) und \\(u_2 = -0{,}5\\). Daraus \\(x = 90°\\) beziehungsweise \\(x = 210°\\) und \\(x = 330°\\). Die kleinste Lösung ist \\(90°\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Bestimme die Anzahl der Lösungen von \\(\\cos(3x) = -0{,}5\\) im Intervall \\([0°;\\,360°]\\).", loesung: 6, toleranz: 0, tipp: "Überlege zuerst, welches Intervall der innere Winkel durchläuft, und zähle dort die Lösungen.", loesungsweg: "Mit \\(u = 3x\\) durchläuft \\(u\\) das Intervall \\([0°;\\,1080°]\\), also drei volle Umläufe. In jedem Umlauf hat \\(\\cos(u) = -0{,}5\\) zwei Lösungen (\\(120°\\) und \\(240°\\)), zusammen sechs: \\(u \\in \\{120°;\\,240°;\\,480°;\\,600°;\\,840°;\\,960°\\}\\). Zurück: $$x \\in \\{40°;\\,80°;\\,160°;\\,200°;\\,280°;\\,320°\\}$$ Das sind <b>6</b> Lösungen." },
      { id: 29, level: 5, typ: "numerisch", frage: "In der Gleichung \\(2\\sin(x) = k\\) steht \\(k\\) für eine ganze Zahl. Bestimme die Anzahl der Werte von \\(k\\), für die die Gleichung im Intervall \\([0°;\\,360°)\\) mindestens eine Lösung besitzt.", loesung: 5, toleranz: 0, tipp: "Löse zuerst nach dem Sinuswert auf und überlege, welchen Wertebereich der Sinus überhaupt annimmt.", loesungsweg: "Aus \\(2\\sin(x) = k\\) folgt \\(\\sin(x) = \\frac{k}{2}\\). Eine Lösung gibt es genau dann, wenn \\(-1 \\le \\frac{k}{2} \\le 1\\), also \\(-2 \\le k \\le 2\\). Ganzzahlig sind das $$k \\in \\{-2;\\,-1;\\,0;\\,1;\\,2\\}$$ also <b>5</b> Werte." },
      { id: 30, level: 5, typ: "mc", frage: "Ein Schüler löst \\(\\sin(2x) = 0{,}5\\) im Intervall \\([0°;\\,360°]\\) und gibt \\(L = \\{15°;\\,75°\\}\\) an. Welche Aussage trifft zu?", optionen: ["Die Lösungsmenge stimmt genau so", "Zwei weitere Lösungen fehlen", "Beide Werte müssen verdoppelt werden", "Die Gleichung hat gar keine Lösung"], korrekt: 1, tipp: "Achte darauf, welches Intervall der innere Winkel durchläuft, bevor du zurückrechnest.", loesungsweg: "Der innere Winkel \\(2x\\) durchläuft \\([0°;\\,720°]\\), also zwei Umläufe. Dort gilt \\(\\sin(u) = 0{,}5\\) für \\(u \\in \\{30°;\\,150°;\\,390°;\\,510°\\}\\). Zurück mit \\(x = \\frac{u}{2}\\): $$x \\in \\{15°;\\,75°;\\,195°;\\,255°\\}$$ Der Schüler hat nur den ersten Umlauf berücksichtigt; \\(195°\\) und \\(255°\\) fehlen." },
      // ========== LEVEL 6 — Sonderfälle, Parameter und Behauptungen ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Die Gleichung \\(\\cos(2x) = 1\\) hat im Intervall \\([0°;\\,360°]\\) genauso viele Lösungen wie \\(\\cos(x) = 1\\).“ Wie ist das zu bewerten?", optionen: ["richtig, der Wert 1 wird gleich oft erreicht", "falsch, die erste Gleichung hat eine mehr", "falsch, die zweite Gleichung hat zwei mehr", "richtig, beide haben genau eine Lösung"], korrekt: 1, tipp: "Bestimme für jede Gleichung getrennt, welches Intervall der innere Winkel durchläuft, und zähle dann.", loesungsweg: "Für \\(\\cos(x) = 1\\) mit \\(x \\in [0°;\\,360°]\\) gilt \\(x \\in \\{0°;\\,360°\\}\\): zwei Lösungen. Für \\(\\cos(2x) = 1\\) durchläuft \\(2x\\) das Intervall \\([0°;\\,720°]\\), dort ist \\(\\cos(u) = 1\\) für \\(u \\in \\{0°;\\,360°;\\,720°\\}\\), also $$x \\in \\{0°;\\,180°;\\,360°\\}$$ drei Lösungen. Die Behauptung ist <b>falsch</b>: die gestreckte Gleichung hat eine Lösung mehr." },
      { id: 32, level: 6, typ: "numerisch", frage: "Bestimme die Anzahl der Lösungen von \\(\\sin(x)\\cdot\\bigl(2\\cos(x) - 1\\bigr) = 0\\) im Intervall \\([0°;\\,360°)\\).", loesung: 4, toleranz: 0, tipp: "Ein Produkt wird genau dann null, wenn einer der Faktoren null wird; behandle die beiden Fälle getrennt und achte auf Doppelnennungen.", loesungsweg: "Fall 1: \\(\\sin(x) = 0\\) liefert im halboffenen Intervall \\(x \\in \\{0°;\\,180°\\}\\) (der Wert \\(360°\\) gehört nicht dazu). Fall 2: \\(2\\cos(x) - 1 = 0\\), also \\(\\cos(x) = 0{,}5\\), liefert \\(x \\in \\{60°;\\,300°\\}\\). Keine Stelle kommt doppelt vor, zusammen also $$L = \\{0°;\\,60°;\\,180°;\\,300°\\}$$ das sind <b>4</b> Lösungen." },
      { id: 33, level: 6, typ: "numerisch", frage: "Die Gleichung \\(\\tan(x) = \\sqrt{3}\\) hat im Intervall \\([0°;\\,n \\cdot 180°)\\) genau fünf Lösungen. Bestimme \\(n\\).", loesung: 5, toleranz: 0, tipp: "Bestimme zuerst eine Lösung und überlege, in welchem Abstand sich die Lösungen des Tangens wiederholen.", loesungsweg: "Eine Lösung ist \\(x = 60°\\), denn \\(\\tan(60°) = \\sqrt{3}\\). Der Tangens wiederholt sich im Abstand \\(180°\\), die Lösungen lauten also $$x = 60° + k \\cdot 180°, \\quad k = 0;\\,1;\\,2;\\,\\ldots$$ In jedem Streifen der Länge \\(180°\\) liegt genau eine davon. Fünf Lösungen ergeben sich damit für \\(n = 5\\) (nämlich \\(60°;\\,240°;\\,420°;\\,600°;\\,780°\\))." },
      { id: 34, level: 6, typ: "numerisch", frage: "Die Gleichung \\(a\\sin(x) + b = 0\\) hat die Lösung \\(x = 30°\\). Außerdem gilt \\(a + b = 1\\). Bestimme \\(a\\).", loesung: 2, toleranz: 0.01, tipp: "Setze die bekannte Lösung ein; zusammen mit der zweiten Angabe entsteht ein Gleichungssystem für die beiden Unbekannten.", loesungsweg: "Einsetzen von \\(x = 30°\\) mit \\(\\sin(30°) = 0{,}5\\): $$0{,}5a + b = 0 \\;\\Rightarrow\\; b = -0{,}5a$$ Eingesetzt in \\(a + b = 1\\): $$a - 0{,}5a = 1 \\;\\Rightarrow\\; 0{,}5a = 1 \\;\\Rightarrow\\; a = 2$$ Damit ist \\(b = -1\\). Probe: \\(2 \\cdot 0{,}5 - 1 = 0\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Für die Höhe einer Gondel gilt \\(h(t) = 8 - 6\\cos(30° \\cdot t)\\) mit \\(t\\) in Minuten und \\(h\\) in Metern. Bestimme, wie viele Minuten lang während einer Umdrehung (\\(0 \\le t < 12\\)) die Höhe mindestens 11 Meter beträgt.", loesung: 4, toleranz: 0.05, tipp: "Bestimme zuerst die Zeitpunkte, zu denen die Höhe genau dem Grenzwert entspricht, und entscheide dann, welcher Bereich dazwischen liegt.", loesungsweg: "Gleichsetzen: $$8 - 6\\cos(30° t) = 11 \\;\\Rightarrow\\; \\cos(30° t) = -0{,}5$$ Im Bereich \\(30° t \\in [0°;\\,360°)\\) sind das \\(30° t = 120°\\) und \\(30° t = 240°\\), also \\(t = 4\\) und \\(t = 8\\). Dazwischen ist der Kosinus kleiner als \\(-0{,}5\\), die Höhe also größer als 11 Meter. Der gesuchte Zeitraum ist \\([4;\\,8]\\) und damit $$8 - 4 = 4 \\text{ Minuten lang}$$" },
      { id: 36, level: 6, typ: "mc", frage: "Für welche Werte von \\(c\\) hat \\(\\sin^2(x) = c\\) im Intervall \\([0°;\\,360°)\\) genau zwei Lösungen?", optionen: ["für alle \\(c\\) mit \\(0 < c < 1\\)", "nur für \\(c = 0\\) und \\(c = 1\\)", "für alle \\(c\\) mit \\(c \\ge 0\\)", "nur für \\(c = 0{,}5\\)"], korrekt: 1, tipp: "Ziehe die Wurzel mit beiden Vorzeichen und zähle die Lösungen getrennt für die Randfälle und den Bereich dazwischen.", loesungsweg: "Aus \\(\\sin^2(x) = c\\) folgt \\(\\sin(x) = \\pm\\sqrt{c}\\). Für \\(c < 0\\) und \\(c > 1\\) gibt es keine Lösung. Für \\(0 < c < 1\\) liefert jedes Vorzeichen zwei Winkel, zusammen vier. Bleiben die Randfälle: \\(c = 0\\) ergibt \\(\\sin(x) = 0\\) mit \\(x \\in \\{0°;\\,180°\\}\\), \\(c = 1\\) ergibt \\(\\sin(x) = \\pm 1\\) mit $$x \\in \\{90°;\\,270°\\}$$ In beiden Fällen sind es genau zwei Lösungen." }];
    </script>

</body>
</html>
