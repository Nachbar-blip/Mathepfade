<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <title>Änderungsrate & Ableitungsbegriff - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-aenderungsrate';
    const THEMA_CONFIG = { name: 'Änderungsrate & Ableitungsbegriff', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — mittlere Änderungsrate, Begriffe
      { id: 1, level: 1, typ: "mc", frage: "Was beschreibt die mittlere Änderungsrate von \\(f\\) auf \\([a; b]\\)?", optionen: ["Steigung der Tangente an der Stelle \\(a\\)", "Steigung der Sekante durch die beiden Randpunkte", "Differenz der Funktionswerte \\(f(b) - f(a)\\)", "Fläche zwischen dem Graphen und der \\(x\\)-Achse"], korrekt: 1, tipp: "Mittlere Änderung heißt: Differenzenquotient.", loesungsweg: "Die mittlere Änderungsrate ist der Differenzenquotient $$\\frac{f(b)-f(a)}{b-a}$$ also die Steigung der Sekante durch \\((a|f(a))\\) und \\((b|f(b))\\). Die Tangentensteigung gehört dagegen zur <b>lokalen</b> Änderungsrate, und die bloße Differenz \\(f(b)-f(a)\\) wäre nicht durch die Intervallbreite geteilt." },
      { id: 2, level: 1, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = x^2\\) auf \\([1; 3]\\).", loesung: 4, toleranz: 0, tipp: "\\(\\frac{f(3)-f(1)}{3-1}\\).", loesungsweg: "Die mittlere Änderungsrate ist der Differenzenquotient — die Steigung der Sekante durch die beiden Randpunkte: $$\\frac{f(3)-f(1)}{3-1} = \\frac{9-1}{2} = \\frac82 = 4$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = 2x + 3\\) auf \\([0; 5]\\).", loesung: 2, toleranz: 0, tipp: "Lineare Funktion.", loesungsweg: "\\(\\frac{13-3}{5} = 2\\). Gleich der Steigung der Geraden." },
      { id: 4, level: 1, typ: "mc", frage: "Die lokale (momentane) Änderungsrate bei \\(x_0\\) ist …", optionen: ["\\(f(x_0)\\)", "\\(f'(x_0)\\)", "die Sekantensteigung", "die mittlere Änderungsrate"], korrekt: 1, tipp: "Grenzübergang des Differenzenquotienten.", loesungsweg: "Die lokale Änderungsrate ist die Ableitung \\(f'(x_0)\\)." },
      { id: 5, level: 1, typ: "numerisch", frage: "Ein Auto legt in 2 s den Weg von 10 m auf 30 m zurück. Mittlere Geschwindigkeit in m/s?", loesung: 10, toleranz: 0, tipp: "\\(\\frac{\\Delta s}{\\Delta t}\\).", loesungsweg: "Die mittlere Geschwindigkeit ist der Weg geteilt durch die Zeit: $$\\bar v = \\frac{\\Delta s}{\\Delta t} = \\frac{30-10}{2} = 10\\,\\text{m/s}$$ Wichtig ist die <b>Differenz</b> der Wegmarken, nicht der Endwert \\(30\\) allein." },
      { id: 6, level: 1, typ: "mc", frage: "Geometrisch ist die Ableitung \\(f'(x_0)\\) …", optionen: ["die Fläche zwischen dem Graphen und der \\(x\\)-Achse", "die Steigung der Tangente im Punkt \\((x_0|f(x_0))\\)", "der Funktionswert des Graphen an dieser Stelle", "die \\(y\\)-Koordinate des Schnittpunkts mit der Achse"], korrekt: 1, tipp: "Denke an die Gerade, die sich an den Graphen anschmiegt.", loesungsweg: "Der Differenzenquotient ist die Sekantensteigung; lässt man die beiden Punkte zusammenrücken, geht die Sekante in die Tangente über: $$f'(x_0) = \\lim_{h \\to 0} \\frac{f(x_0+h)-f(x_0)}{h}$$ Die Ableitung ist damit die <b>Steigung der Tangente</b> im Punkt \\((x_0|f(x_0))\\). Die Fläche unter dem Graphen gehört dagegen zum Integral." },
      // LEVEL 2 — Differenzenquotient berechnen
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = x^2 + 1\\) auf \\([2; 5]\\).", loesung: 7, toleranz: 0, tipp: "\\(\\frac{f(5)-f(2)}{3}\\).", loesungsweg: "$$\\frac{f(5)-f(2)}{5-2} = \\frac{26-5}{3} = \\frac{21}{3} = 7$$ Die konstante \\(+1\\) kürzt sich in der Differenz heraus — sie verschiebt den Graphen nur nach oben und ändert die Steigung nicht." },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = x^3\\) auf \\([1; 2]\\).", loesung: 7, toleranz: 0, tipp: "\\(\\frac{8-1}{1}\\).", loesungsweg: "$$\\frac{f(2)-f(1)}{2-1} = \\frac{8-1}{1} = 7$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = -x^2 + 4x\\) auf \\([0; 4]\\).", loesung: 0, toleranz: 0, tipp: "\\(f(0)=0\\), \\(f(4)=0\\).", loesungsweg: "$$f(0) = 0 \\quad\\text{und}\\quad f(4) = -16+16 = 0$$ $$\\frac{0-0}{4-0} = 0$$ Die mittlere Änderungsrate ist null, obwohl die Funktion dazwischen keineswegs konstant ist — sie steigt bis \\(x = 2\\) und fällt danach wieder auf denselben Wert." },
      { id: 10, level: 2, typ: "mc", frage: "Der Differenzenquotient \\(\\frac{f(x_0+h) - f(x_0)}{h}\\) liefert …", optionen: ["die Steigung der Tangente an der Stelle \\(x_0\\)", "die mittlere Änderungsrate auf \\([x_0; x_0+h]\\)", "den Funktionswert der Funktion an der Stelle \\(x_0\\)", "stets den Wert null, unabhängig von der Wahl von \\(h\\)"], korrekt: 1, tipp: "Der Quotient vergleicht zwei Punkte miteinander, nicht einen einzelnen.", loesungsweg: "Der Differenzenquotient ist die Steigung der Sekante durch die Punkte \\((x_0|f(x_0))\\) und \\((x_0+h|f(x_0+h))\\), also die mittlere Änderungsrate auf dem Intervall \\([x_0; x_0+h]\\). Erst der Grenzübergang \\(h \\to 0\\) macht daraus die Tangentensteigung \\(f'(x_0)\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = \\sqrt{x}\\) auf \\([1; 4]\\).", loesung: 0.333, toleranz: 0.01, tipp: "\\(\\frac{2-1}{3}\\).", loesungsweg: "$$\\frac{\\sqrt4 - \\sqrt1}{4-1} = \\frac{2-1}{3} = \\frac13 \\approx 0{,}333$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Für \\(f(x)=x^2\\): Berechne den Differenzenquotienten zwischen \\(x_0=3\\) und \\(x_0+h=3{,}1\\).", loesung: 6.1, toleranz: 0.01, tipp: "\\(\\frac{f(3{,}1)-f(3)}{0{,}1}\\).", loesungsweg: "\\(\\frac{9{,}61-9}{0{,}1} = \\frac{0{,}61}{0{,}1} = 6{,}1\\). Nähert sich \\(f'(3)=6\\)." },
      // LEVEL 3 — h-Methode und lokale Änderung
      { id: 13, level: 3, typ: "numerisch", frage: "Bestimme mit der h-Methode \\(f'(2)\\) für \\(f(x)=x^2\\).", loesung: 4, toleranz: 0, tipp: "\\(\\lim_{h\\to 0}\\frac{(2+h)^2-4}{h}\\).", loesungsweg: "\\(\\frac{4+4h+h^2-4}{h} = 4+h \\to 4\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Bestimme \\(f'(1)\\) für \\(f(x)=x^3\\) mittels h-Methode.", loesung: 3, toleranz: 0, tipp: "\\((1+h)^3 = 1+3h+3h^2+h^3\\).", loesungsweg: "\\(\\frac{(1+h)^3 - 1}{h} = 3 + 3h + h^2 \\to 3\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Ein Ball fällt gemäß \\(s(t) = 5t^2\\) (m). Berechne die Momentangeschwindigkeit bei \\(t=2\\,\\text{s}\\) in m/s.", loesung: 20, toleranz: 0, tipp: "\\(s'(t) = 10t\\).", loesungsweg: "Die Momentangeschwindigkeit ist die Ableitung des Weges nach der Zeit: $$s'(t) = 10t \\;\\Rightarrow\\; s'(2) = 20\\,\\text{m/s}$$ Die <b>mittlere</b> Geschwindigkeit auf \\([0;2]\\) wäre dagegen nur \\(\\frac{20-0}{2} = 10\\,\\text{m/s}\\) — halb so groß, weil der Ball zu Beginn langsamer war." },
      { id: 16, level: 3, typ: "mc", frage: "Die Tangente an \\(f(x)=x^2\\) im Punkt \\((1|1)\\) hat die Steigung …", optionen: ["\\(1\\)", "\\(2\\)", "\\(3\\)", "\\(0\\)"], korrekt: 1, tipp: "\\(f'(x)=2x\\).", loesungsweg: "$$f'(x) = 2x \\;\\Rightarrow\\; f'(1) = 2$$ Die Tangente in \\((1|1)\\) hat also die Steigung \\(2\\) und die Gleichung \\(y = 2x - 1\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Für \\(f(x)=x^2+3x\\): Berechne \\(f'(2)\\) mit der h-Methode.", loesung: 7, toleranz: 0, tipp: "Term aufstellen, durch h kürzen.", loesungsweg: "\\(\\frac{(2+h)^2+3(2+h) - 10}{h} = \\frac{4h + h^2 + 3h}{h} = 7+h \\to 7\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Eine Bakterienpopulation wächst nach \\(N(t) = 100 + 2t^2\\). Wie groß ist die Wachstumsrate bei \\(t=5\\)?", loesung: 20, toleranz: 0, tipp: "\\(N'(t) = 4t\\).", loesungsweg: "Die Wachstumsrate ist die Ableitung des Bestands: $$N'(t) = 4t \\;\\Rightarrow\\; N'(5) = 20$$ Also \\(20\\) Bakterien pro Zeiteinheit. Der Bestand selbst beträgt zu diesem Zeitpunkt \\(N(5) = 150\\) — Bestand und Rate sind streng zu trennen." },
      // LEVEL 4 — Modell aus Text, Umkehraufgaben, Verfahren wählen
      { id: 19, level: 4, typ: "numerisch", frage: "Ein Fahrzeug legt den Weg \\(s(t) = 0{,}5t^2 + 2t\\) zurück (\\(s\\) in m, \\(t\\) in s). Nach welcher Zeit beträgt seine Momentangeschwindigkeit \\(8\\) m/s?", loesung: 6, toleranz: 0, tipp: "Die Momentangeschwindigkeit ist die Ableitung des Weges; hier ist ihr Wert vorgegeben.", loesungsweg: "Die Momentangeschwindigkeit ist die lokale Änderungsrate des Weges: $$s'(t) = t + 2$$ Gesucht ist die Zeit, nicht der Wert — die Aufgabe läuft rückwärts: $$t + 2 = 8 \\;\\Rightarrow\\; t = 6$$ Nach \\(6\\) Sekunden fährt das Fahrzeug also \\(8\\) m/s schnell." },
      { id: 20, level: 4, typ: "numerisch", frage: "Ein Pegel steht um 8 Uhr bei \\(2{,}0\\) m und um 13 Uhr bei \\(4{,}5\\) m. Wie groß ist die mittlere Änderungsrate in Metern pro Stunde? (1 Dezimale)", loesung: 0.5, toleranz: 0.01, tipp: "Setze die beiden Messwerte in den Differenzenquotienten ein — achte auf die Zeitspanne.", loesungsweg: "Die mittlere Änderungsrate ist der Quotient aus Höhen- und Zeitdifferenz: $$\\frac{4{,}5 - 2{,}0}{13 - 8} = \\frac{2{,}5}{5} = 0{,}5$$ Der Pegel steigt also im Mittel um \\(0{,}5\\) Meter je Stunde. Ob er zwischendurch schneller oder langsamer stieg, sagt dieser Wert nicht — er ist die Steigung der Sekante zwischen beiden Messpunkten." },
      { id: 21, level: 4, typ: "mc", frage: "Wann stimmt die mittlere Änderungsrate auf einem Intervall mit der lokalen Änderungsrate an jeder Stelle des Intervalls überein?", optionen: ["wenn \\(f\\) dort linear verläuft", "wenn \\(f\\) dort quadratisch verläuft", "wenn \\(f\\) dort nur positive Werte hat", "wenn das Intervall die Länge \\(1\\) besitzt"], korrekt: 0, tipp: "Überlege, bei welchem Graphen Sekante und Tangente stets dieselbe Steigung haben.", loesungsweg: "Bei einer Geraden haben Sekante und Tangente überall dieselbe Steigung \\(m\\): $$\\frac{f(b)-f(a)}{b-a} = m = f'(x)$$ Nur lineare Funktionen haben diese Eigenschaft. Bei \\(f(x) = x^2\\) etwa ist die mittlere Änderungsrate auf \\([1;3]\\) gleich \\(4\\), die lokale aber bei \\(x=1\\) nur \\(2\\) und bei \\(x=3\\) schon \\(6\\). Die Intervalllänge und das Vorzeichen der Funktionswerte spielen keine Rolle." },
      { id: 22, level: 4, typ: "numerisch", frage: "Für \\(f(x) = x^2\\) beträgt die mittlere Änderungsrate auf dem Intervall \\([2; b]\\) genau \\(7\\). Wie groß ist \\(b\\)?", loesung: 5, toleranz: 0, tipp: "Stelle den Differenzenquotienten mit dem Buchstaben auf und kürze ihn, bevor du auflöst.", loesungsweg: "Der Differenzenquotient lässt sich mit der dritten binomischen Formel kürzen: $$\\frac{b^2 - 4}{b - 2} = \\frac{(b-2)(b+2)}{b-2} = b + 2$$ Damit wird die Bedingung zu $$b + 2 = 7 \\;\\Rightarrow\\; b = 5$$ Probe: auf \\([2;5]\\) ist \\(\\frac{25-4}{3} = 7\\) ✓" },
      { id: 23, level: 4, typ: "numerisch", frage: "Ein Tank enthält \\(V(t) = 100 - 4t^2\\) Liter (\\(t\\) in Minuten). Nach welcher Zeit fließen momentan \\(24\\) Liter je Minute ab?", loesung: 3, toleranz: 0, tipp: "Die Abflussrate ist der Betrag der Ableitung; das Vorzeichen zeigt nur die Richtung an.", loesungsweg: "Die momentane Änderung des Volumens ist $$V'(t) = -8t$$ Ein Abfluss von \\(24\\) Litern je Minute bedeutet \\(V'(t) = -24\\): $$-8t = -24 \\;\\Rightarrow\\; t = 3$$ Das Minuszeichen gehört zur Abnahme; gefragt ist die Zeit, nicht die Menge." },
      { id: 24, level: 4, typ: "numerisch", frage: "Ein Ball fliegt gemäß \\(h(t) = 20t - 5t^2\\) (Höhe in m, \\(t\\) in s). Nach welcher Zeit erreicht er seinen höchsten Punkt?", loesung: 2, toleranz: 0, tipp: "Im höchsten Punkt schlägt die Steiggeschwindigkeit in Sinken um.", loesungsweg: "Die Steiggeschwindigkeit ist $$h'(t) = 20 - 10t$$ Sie ist am höchsten Punkt gerade null, weil der Ball dort weder steigt noch fällt: $$20 - 10t = 0 \\;\\Rightarrow\\; t = 2$$ Die zugehörige Höhe wäre \\(h(2) = 20\\) m — gefragt war aber der Zeitpunkt." },
      // LEVEL 5 — zwei Verfahren, zwei Bedingungen, Fehlersuche
      { id: 25, level: 5, typ: "numerisch", frage: "Ein Becken läuft aus: \\(V(t) = (10 - t)^2\\) Liter für \\(0 \\le t \\le 10\\) (\\(t\\) in Minuten). Wann ist die Ausflussrate nur noch halb so groß wie zu Beginn?", loesung: 5, toleranz: 0, tipp: "Berechne zuerst die Rate am Anfang, dann die Bedingung für die Hälfte davon.", loesungsweg: "Mit der Kettenregel (oder nach dem Ausmultiplizieren) gilt $$V'(t) = -2(10-t)$$ Zu Beginn ist \\(V'(0) = -20\\), es fließen also \\(20\\) Liter je Minute ab. Die Hälfte davon sind \\(10\\): $$-2(10-t) = -10 \\;\\Rightarrow\\; 10 - t = 5 \\;\\Rightarrow\\; t = 5$$ Zwei Schritte sind nötig: erst der Anfangswert der Rate, dann die Gleichung dafür." },
      { id: 26, level: 5, typ: "mc", frage: "Zur mittleren Änderungsrate von \\(f(x) = x^2\\) auf \\([2; 6]\\) rechnet jemand \\(\\frac{f(6)-f(2)}{6} = \\frac{32}{6} \\approx 5{,}33\\). Worin liegt der Fehler?", optionen: ["Im Nenner muss die Differenz \\(6-2\\) stehen, nicht \\(6\\)", "Im Zähler muss die Summe \\(f(6)+f(2)\\) stehen, nicht die Differenz", "Der Zähler ist falsch berechnet, \\(f(6)-f(2)\\) ergibt \\(36\\)", "Es muss durch die Anzahl der beteiligten Messwerte geteilt werden"], korrekt: 0, tipp: "Vergleiche die Rechnung Stück für Stück mit dem Differenzenquotienten.", loesungsweg: "Der Differenzenquotient teilt die Höhendifferenz durch die <b>Breite</b> des Intervalls: $$\\frac{f(6)-f(2)}{6-2} = \\frac{36-4}{4} = \\frac{32}{4} = 8$$ Der Zähler \\(32\\) ist richtig, der Nenner nicht: geteilt wurde durch die rechte Intervallgrenze statt durch die Intervalllänge. Das Ergebnis \\(8\\) ist deutlich größer als die fehlerhaften \\(5{,}33\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Bestand wird durch \\(N(t) = 200 + 30t - t^2\\) beschrieben (\\(t\\) in Tagen). An welchem Tag ist die momentane Wachstumsrate nur noch halb so groß wie am Tag \\(t = 0\\)? (1 Dezimale)", loesung: 7.5, toleranz: 0.01, tipp: "Bestimme zuerst die Rate am Anfang, dann die Stelle mit der halben Rate.", loesungsweg: "Die Wachstumsrate ist $$N'(t) = 30 - 2t$$ Am Anfang beträgt sie \\(N'(0) = 30\\), die Hälfte davon ist \\(15\\): $$30 - 2t = 15 \\;\\Rightarrow\\; 2t = 15 \\;\\Rightarrow\\; t = 7{,}5$$ Der Bestand wächst zu diesem Zeitpunkt noch, aber nur halb so schnell wie zu Beginn. Erst ab \\(t = 15\\) würde er schrumpfen." },
      { id: 28, level: 5, typ: "numerisch", frage: "Für \\(f(x) = ax^2 + bx\\) ist die mittlere Änderungsrate auf \\([0; 2]\\) gleich \\(6\\) und die lokale Änderungsrate bei \\(x = 2\\) gleich \\(10\\). Wie groß ist \\(a\\)?", loesung: 2, toleranz: 0, tipp: "Jede der beiden Angaben liefert eine Gleichung in \\(a\\) und \\(b\\).", loesungsweg: "Mittlere Änderungsrate: $$\\frac{f(2)-f(0)}{2} = \\frac{4a+2b}{2} = 2a + b = 6$$ Lokale Änderungsrate mit \\(f'(x) = 2ax + b\\): $$f'(2) = 4a + b = 10$$ Subtraktion der ersten Gleichung von der zweiten liefert \\(2a = 4\\), also $$a = 2, \\quad b = 2$$ Hier werden die beiden Begriffe <b>nebeneinander</b> gebraucht — genau darin liegt die Schwierigkeit." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Radfahrer legt \\(s(t) = 0{,}05t^3\\) Meter zurück (\\(t\\) in s, \\(0 \\le t \\le 10\\)). Zu welchem Zeitpunkt ist seine Momentangeschwindigkeit genauso groß wie seine Durchschnittsgeschwindigkeit auf der gesamten Fahrt? (2 Dezimalen)", loesung: 5.77, toleranz: 0.02, tipp: "Bestimme beide Größen getrennt und setze sie anschließend gleich.", loesungsweg: "Durchschnittsgeschwindigkeit über \\([0;10]\\): $$\\frac{s(10)-s(0)}{10} = \\frac{50}{10} = 5 \\;\\text{m/s}$$ Momentangeschwindigkeit: $$s'(t) = 0{,}15t^2$$ Gleichsetzen: $$0{,}15t^2 = 5 \\;\\Rightarrow\\; t^2 = \\frac{100}{3} \\;\\Rightarrow\\; t \\approx 5{,}77$$ Die negative Wurzel scheidet aus, weil die Zeit nicht negativ wird. Am Ende der Fahrt ist der Radfahrer mit \\(s'(10) = 15\\) m/s deutlich schneller als im Mittel." },
      { id: 30, level: 5, typ: "mc", frage: "Eine auf \\([0; 4]\\) differenzierbare Funktion hat dort die mittlere Änderungsrate \\(0\\). Was folgt daraus?", optionen: ["Es gibt mindestens eine Stelle mit waagerechter Tangente", "Die Funktion ist auf dem ganzen Intervall konstant", "Die Funktion besitzt im Intervall eine Nullstelle", "Die lokale Änderungsrate ist überall gleich null"], korrekt: 0, tipp: "Denke an eine Funktion, die erst steigt und dann wieder auf den Anfangswert fällt.", loesungsweg: "Aus \\(f(0) = f(4)\\) folgt nicht, dass sich nichts getan hat — die Funktion kann steigen und wieder fallen. Dann muss sie dazwischen aber umkehren, und dort ist die Tangente waagerecht. Beispiel: \\(f(x) = -x^2+4x\\) hat auf \\([0;4]\\) die mittlere Änderungsrate \\(\\frac{0-0}{4} = 0\\) und bei \\(x = 2\\) die Ableitung null. Konstant ist sie nicht, und eine Nullstelle folgt daraus ebenfalls nicht — man verschiebe den Graphen einfach nach oben." },
      // LEVEL 6 — Abi-Format: mehrschrittig mit Begründungsanteil
      { id: 31, level: 6, typ: "numerisch", frage: "Der Sauerstoffgehalt eines Flusses wird nach einer Einleitung für \\(0 \\le t \\le 20\\) (in Tagen) durch \\(g(t) = 8 - 0{,}6t + 0{,}03t^2\\) (in mg/l) beschrieben. Zeigen Sie, dass der Gehalt genau einmal einen Tiefstwert annimmt, und geben Sie den Tag an.", loesung: 10, toleranz: 0, tipp: "Untersuchen Sie das Vorzeichen der Änderungsrate vor und nach der fraglichen Stelle.", loesungsweg: "Die Änderungsrate ist $$g'(t) = -0{,}6 + 0{,}06t$$ Sie ist linear und hat genau eine Nullstelle: $$0{,}06t = 0{,}6 \\;\\Rightarrow\\; t = 10$$ Davor ist \\(g'(t) < 0\\) (der Gehalt sinkt), danach \\(g'(t) > 0\\) (er erholt sich). Mehr als eine solche Stelle kann es nicht geben, weil \\(g'\\) linear ist. Der Tiefstwert liegt also am Tag \\(10\\) und beträgt \\(g(10) = 5\\) mg/l." },
      { id: 32, level: 6, typ: "numerisch", frage: "Die Besucherzahl eines Museums wird für \\(0 \\le t \\le 10\\) (Stunden nach Öffnung) durch \\(B(t) = -t^3 + 12t^2\\) beschrieben. Zu welcher Stunde wächst die Besucherzahl am stärksten?", loesung: 4, toleranz: 0, tipp: "Gesucht ist der Höchstwert der Änderungsrate, nicht der Höchstwert der Zahl selbst.", loesungsweg: "Die Zuwachsrate ist $$B'(t) = -3t^2 + 24t$$ Sie ist selbst eine nach unten geöffnete Parabel; ihr Höchstwert liegt dort, wo ihre eigene Änderung null wird: $$B''(t) = -6t + 24 = 0 \\;\\Rightarrow\\; t = 4$$ Weil \\(B''\\) dort vom Positiven ins Negative wechselt, ist das tatsächlich das Maximum von \\(B'\\) und nicht etwa ein Minimum. Der stärkste Zuwachs beträgt \\(B'(4) = 48\\) Personen je Stunde. Die Besucherzahl selbst wächst noch bis \\(t = 8\\) weiter." },
      { id: 33, level: 6, typ: "mc", frage: "Beurteilen Sie: <b>Wenn die momentane Änderungsrate eines Bestands abnimmt, dann nimmt auch der Bestand ab.</b>", optionen: ["Falsch: eine sinkende, aber positive Rate lässt den Bestand weiter wachsen", "Richtig: eine abnehmende Rate bedeutet einen abnehmenden Bestand", "Falsch: der Bestand nimmt dann sogar schneller zu als zuvor", "Richtig, sofern die Rate an mindestens einer Stelle negativ ausfällt"], korrekt: 0, tipp: "Unterscheiden Sie den Wert der Rate von ihrer eigenen Änderung.", loesungsweg: "Abnehmende Rate heißt: die Zuwächse werden kleiner. Solange die Rate aber positiv bleibt, kommt weiterhin etwas hinzu. Beispiel: \\(N(t) = 200 + 30t - t^2\\) hat die Rate \\(N'(t) = 30-2t\\); sie fällt ständig, ist für \\(t < 15\\) jedoch positiv — der Bestand wächst dort weiter, nur eben immer langsamer. Erst wenn die Rate das Vorzeichen wechselt, beginnt die Abnahme." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für \\(f(x) = x^3 - 3x\\) wird die mittlere Änderungsrate auf dem Intervall \\([-a; a]\\) mit \\(a > 0\\) betrachtet. Für wie viele Werte von \\(a\\) ist sie gleich \\(0\\)?", loesung: 1, toleranz: 0, tipp: "Stellen Sie den Differenzenquotienten allgemein auf und kürzen Sie, bevor Sie null setzen.", loesungsweg: "Wegen der Punktsymmetrie gilt \\(f(-a) = -f(a)\\), also $$\\frac{f(a)-f(-a)}{a-(-a)} = \\frac{2(a^3-3a)}{2a} = a^2 - 3$$ Nullsetzen: $$a^2 = 3 \\;\\Rightarrow\\; a = \\pm\\sqrt3$$ Die negative Lösung scheidet wegen \\(a > 0\\) aus, es bleibt genau <b>ein</b> Wert, nämlich \\(a = \\sqrt3 \\approx 1{,}73\\). Gefragt ist die Anzahl, also \\(1\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Die Wirkstoffmenge im Blut wird für \\(0 \\le t \\le 6\\) durch \\(m(t) = 12t - 0{,}3t^3\\) (in mg, \\(t\\) in Stunden) beschrieben. Zeigen Sie, dass die Menge genau einmal von Zunahme in Abnahme übergeht, und geben Sie den Zeitpunkt an. (2 Dezimalen)", loesung: 3.65, toleranz: 0.02, tipp: "Der Übergang liegt beim Vorzeichenwechsel der Änderungsrate.", loesungsweg: "Die Änderungsrate ist $$m'(t) = 12 - 0{,}9t^2$$ Nullsetzen: $$0{,}9t^2 = 12 \\;\\Rightarrow\\; t^2 = \\frac{40}{3} \\;\\Rightarrow\\; t \\approx 3{,}65$$ Die zweite Lösung \\(-3{,}65\\) liegt außerhalb des Zeitraums, es bleibt genau ein Zeitpunkt. Davor ist \\(m'(t) > 0\\), danach \\(m'(t) < 0\\) — die Menge steigt also bis rund \\(3{,}65\\) Stunden und fällt danach." },
      { id: 36, level: 6, typ: "mc", frage: "Ein Auto fährt die erste Hälfte einer Strecke mit \\(40\\) km/h und die zweite Hälfte mit \\(60\\) km/h. Beurteilen Sie: <b>Die mittlere Geschwindigkeit beträgt \\(50\\) km/h.</b>", optionen: ["Falsch: sie beträgt \\(48\\) km/h, denn die langsame Hälfte dauert länger", "Richtig: maßgeblich ist der Mittelwert der beiden Geschwindigkeiten", "Falsch: sie beträgt \\(52\\) km/h, denn die schnelle Hälfte zählt stärker", "Richtig, weil beide Teilstrecken genau gleich lang zurückgelegt werden"], korrekt: 0, tipp: "Die mittlere Geschwindigkeit ist Gesamtweg durch Gesamtzeit — berechnen Sie beide Zeiten.", loesungsweg: "Für eine Gesamtstrecke von \\(2s\\) braucht das Auto $$t = \\frac{s}{40} + \\frac{s}{60} = \\frac{3s + 2s}{120} = \\frac{5s}{120} = \\frac{s}{24}$$ Die mittlere Geschwindigkeit ist Gesamtweg durch Gesamtzeit: $$\\bar v = \\frac{2s}{\\frac{s}{24}} = 48 \\;\\text{km/h}$$ Die Behauptung ist also falsch. Der Grund: Auf der langsamen Hälfte verbringt das Auto <b>mehr Zeit</b>, deshalb zieht sie den Mittelwert stärker nach unten. Der einfache Mittelwert \\(50\\) wäre nur richtig, wenn beide Geschwindigkeiten gleich lange gefahren würden." }];
