<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Änderungsrate & Ableitungsbegriff - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-aenderungsrate';
    const THEMA_CONFIG = { name: 'Änderungsrate & Ableitungsbegriff', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — mittlere Änderungsrate, Begriffe
      { id: 1, level: 1, typ: "mc", frage: "Was beschreibt die mittlere Änderungsrate von \\(f\\) auf \\([a; b]\\)?", optionen: ["Steigung der Tangente bei \\(a\\)", "Steigung der Sekante durch \\((a, f(a))\\) und \\((b, f(b))\\)", "Funktionswert \\(f(b) - f(a)\\)", "Integral von \\(f\\) über \\([a;b]\\)"], korrekt: 1, tipp: "Mittlere Änderung = Differenzenquotient.", loesungsweg: "Die mittlere Änderungsrate ist \\(\\frac{f(b)-f(a)}{b-a}\\), also die Sekantensteigung." },
      { id: 2, level: 1, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = x^2\\) auf \\([1; 3]\\).", loesung: 4, toleranz: 0, tipp: "\\(\\frac{f(3)-f(1)}{3-1}\\).", loesungsweg: "\\(\\frac{9-1}{2} = 4\\)." },
      { id: 3, level: 1, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = 2x + 3\\) auf \\([0; 5]\\).", loesung: 2, toleranz: 0, tipp: "Lineare Funktion.", loesungsweg: "\\(\\frac{13-3}{5} = 2\\). Gleich der Steigung der Geraden." },
      { id: 4, level: 1, typ: "mc", frage: "Die lokale (momentane) Änderungsrate bei \\(x_0\\) ist …", optionen: ["\\(f(x_0)\\)", "\\(f'(x_0)\\)", "die Sekantensteigung", "die mittlere Änderungsrate"], korrekt: 1, tipp: "Grenzübergang des Differenzenquotienten.", loesungsweg: "Die lokale Änderungsrate ist die Ableitung \\(f'(x_0)\\)." },
      { id: 5, level: 1, typ: "numerisch", frage: "Ein Auto legt in 2 s den Weg von 10 m auf 30 m zurück. Mittlere Geschwindigkeit in m/s?", loesung: 10, toleranz: 0, tipp: "\\(\\frac{\\Delta s}{\\Delta t}\\).", loesungsweg: "\\(\\frac{30-10}{2} = 10\\,\\text{m/s}\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Geometrisch ist die Ableitung \\(f'(x_0)\\) …", optionen: ["die Fläche unter dem Graphen", "die Steigung der Tangente im Punkt \\((x_0, f(x_0))\\)", "der Funktionswert", "die y-Koordinate des Schnittpunkts"], korrekt: 1, tipp: "Tangente!", loesungsweg: "\\(f'(x_0)\\) ist die Tangentensteigung." },
      // LEVEL 2 — Differenzenquotient berechnen
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = x^2 + 1\\) auf \\([2; 5]\\).", loesung: 7, toleranz: 0, tipp: "\\(\\frac{f(5)-f(2)}{3}\\).", loesungsweg: "\\(\\frac{26-5}{3} = 7\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = x^3\\) auf \\([1; 2]\\).", loesung: 7, toleranz: 0, tipp: "\\(\\frac{8-1}{1}\\).", loesungsweg: "\\(\\frac{8-1}{1} = 7\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = -x^2 + 4x\\) auf \\([0; 4]\\).", loesung: 0, toleranz: 0, tipp: "\\(f(0)=0\\), \\(f(4)=0\\).", loesungsweg: "\\(\\frac{0-0}{4} = 0\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Der Differenzenquotient \\(\\frac{f(x_0+h) - f(x_0)}{h}\\) liefert …", optionen: ["die Tangentensteigung bei \\(x_0\\)", "die mittlere Änderungsrate auf \\([x_0; x_0+h]\\)", "den Funktionswert bei \\(x_0\\)", "immer 0"], korrekt: 1, tipp: "Er ist die Sekantensteigung.", loesungsweg: "Er ist die mittlere Änderungsrate (Sekantensteigung) auf \\([x_0; x_0+h]\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Berechne die mittlere Änderungsrate von \\(f(x) = \\sqrt{x}\\) auf \\([1; 4]\\).", loesung: 0.333, toleranz: 0.01, tipp: "\\(\\frac{2-1}{3}\\).", loesungsweg: "\\(\\frac{\\sqrt{4}-\\sqrt{1}}{3} = \\frac{1}{3} \\approx 0{,}33\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Für \\(f(x)=x^2\\): Berechne den Differenzenquotienten zwischen \\(x_0=3\\) und \\(x_0+h=3{,}1\\).", loesung: 6.1, toleranz: 0.01, tipp: "\\(\\frac{f(3{,}1)-f(3)}{0{,}1}\\).", loesungsweg: "\\(\\frac{9{,}61-9}{0{,}1} = \\frac{0{,}61}{0{,}1} = 6{,}1\\). Nähert sich \\(f'(3)=6\\)." },
      // LEVEL 3 — h-Methode und lokale Änderung
      { id: 13, level: 3, typ: "numerisch", frage: "Bestimme mit der h-Methode \\(f'(2)\\) für \\(f(x)=x^2\\).", loesung: 4, toleranz: 0, tipp: "\\(\\lim_{h\\to 0}\\frac{(2+h)^2-4}{h}\\).", loesungsweg: "\\(\\frac{4+4h+h^2-4}{h} = 4+h \\to 4\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Bestimme \\(f'(1)\\) für \\(f(x)=x^3\\) mittels h-Methode.", loesung: 3, toleranz: 0, tipp: "\\((1+h)^3 = 1+3h+3h^2+h^3\\).", loesungsweg: "\\(\\frac{(1+h)^3 - 1}{h} = 3 + 3h + h^2 \\to 3\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Ein Ball fällt gemäß \\(s(t) = 5t^2\\) (m). Berechne die Momentangeschwindigkeit bei \\(t=2\\,\\text{s}\\) in m/s.", loesung: 20, toleranz: 0, tipp: "\\(s'(t) = 10t\\).", loesungsweg: "\\(s'(2) = 20\\,\\text{m/s}\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Die Tangente an \\(f(x)=x^2\\) im Punkt \\((1,1)\\) hat die Steigung …", optionen: ["\\(1\\)", "\\(2\\)", "\\(3\\)", "\\(0\\)"], korrekt: 1, tipp: "\\(f'(x)=2x\\).", loesungsweg: "\\(f'(1) = 2\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Für \\(f(x)=x^2+3x\\): Berechne \\(f'(2)\\) mit der h-Methode.", loesung: 7, toleranz: 0, tipp: "Term aufstellen, durch h kürzen.", loesungsweg: "\\(\\frac{(2+h)^2+3(2+h) - 10}{h} = \\frac{4h + h^2 + 3h}{h} = 7+h \\to 7\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Eine Bakterienpopulation wächst nach \\(N(t) = 100 + 2t^2\\). Wie groß ist die Wachstumsrate bei \\(t=5\\)?", loesung: 20, toleranz: 0, tipp: "\\(N'(t) = 4t\\).", loesungsweg: "\\(N'(5) = 20\\,\\text{Bakterien/ZE}\\)." },
      // LEVEL 4 — Tangentengleichung
      { id: 19, level: 4, typ: "numerisch", frage: "Bestimme die Steigung der Tangente an \\(f(x)=x^2-2x\\) bei \\(x_0=3\\).", loesung: 4, toleranz: 0, tipp: "\\(f'(x) = 2x - 2\\).", loesungsweg: "\\(f'(3) = 4\\)." },
      { id: 20, level: 4, typ: "mc", frage: "Die Tangente an \\(f(x)=x^2\\) bei \\(x_0=2\\) lautet …", optionen: ["\\(y = 4x - 4\\)", "\\(y = 2x\\)", "\\(y = 4x + 4\\)", "\\(y = 2x - 4\\)"], korrekt: 0, tipp: "\\(y = f'(x_0)(x-x_0) + f(x_0)\\).", loesungsweg: "\\(f'(2)=4\\), \\(f(2)=4\\). \\(y = 4(x-2)+4 = 4x-4\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Berechne den y-Achsenabschnitt der Tangente an \\(f(x)=x^3\\) bei \\(x_0=1\\).", loesung: -2, toleranz: 0, tipp: "\\(y = 3(x-1)+1\\).", loesungsweg: "\\(y = 3x - 2\\). y-Abschnitt: \\(-2\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "An welcher Stelle hat \\(f(x)=x^2-4x+1\\) eine waagerechte Tangente?", loesung: 2, toleranz: 0, tipp: "\\(f'(x)=0\\).", loesungsweg: "\\(f'(x)=2x-4 = 0 \\Rightarrow x=2\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Für \\(f(x)=x^2\\): Bei welchem \\(x\\) hat die Tangente die Steigung \\(6\\)?", loesung: 3, toleranz: 0, tipp: "\\(2x=6\\).", loesungsweg: "\\(x = 3\\)." },
      { id: 24, level: 4, typ: "mc", frage: "Die Normale im Punkt \\((x_0, f(x_0))\\) hat die Steigung …", optionen: ["\\(f'(x_0)\\)", "\\(-f'(x_0)\\)", "\\(-\\frac{1}{f'(x_0)}\\)", "\\(\\frac{1}{f'(x_0)}\\)"], korrekt: 2, tipp: "Senkrecht zur Tangente.", loesungsweg: "Die Normalensteigung ist \\(-\\frac{1}{f'(x_0)}\\)." },
      // LEVEL 5 — Anwendungsaufgaben
      { id: 25, level: 5, typ: "numerisch", frage: "Der Weg ist \\(s(t) = t^2 + 3t\\) (in m, t in s). Momentangeschwindigkeit bei \\(t=4\\) in m/s?", loesung: 11, toleranz: 0, tipp: "\\(s'(t) = 2t+3\\).", loesungsweg: "\\(s'(4) = 11\\,\\text{m/s}\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Werkstück kühlt gemäß \\(T(t) = 80 - 2t^2\\) (°C). Abkühlgeschwindigkeit bei \\(t=3\\) in °C pro ZE (Betrag)?", loesung: 12, toleranz: 0, tipp: "\\(T'(t) = -4t\\).", loesungsweg: "\\(T'(3) = -12\\). Betrag: \\(12\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "An welcher Stelle hat die Tangente an \\(f(x)=x^3-3x\\) die Steigung \\(9\\)? (positiver Wert)", loesung: 2, toleranz: 0, tipp: "\\(3x^2 - 3 = 9\\).", loesungsweg: "\\(x^2 = 4 \\Rightarrow x = 2\\) (positiv)." },
      { id: 28, level: 5, typ: "mc", frage: "Wenn \\(f'(x_0) = 0\\), dann …", optionen: ["hat \\(f\\) bei \\(x_0\\) immer ein Extremum", "hat die Tangente die Steigung 0 (waagerecht)", "ist \\(f\\) an \\(x_0\\) nicht differenzierbar", "ist \\(f(x_0)=0\\)"], korrekt: 1, tipp: "Sattelpunkt möglich.", loesungsweg: "Waagerechte Tangente. Ob Extremum, muss weiter geprüft werden." },
      { id: 29, level: 5, typ: "numerisch", frage: "Für welches \\(x\\) ist die mittlere Änderungsrate von \\(f(x)=x^2\\) auf \\([1; x]\\) gleich \\(5\\)?", loesung: 4, toleranz: 0, tipp: "\\(\\frac{x^2-1}{x-1} = x+1 = 5\\).", loesungsweg: "\\(x+1 = 5 \\Rightarrow x = 4\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Füllhöhe \\(h(t) = 0{,}5t^2\\) (m). Zuflussrate (= \\(h'\\)) bei \\(t=6\\) in m/ZE?", loesung: 6, toleranz: 0, tipp: "\\(h'(t) = t\\).", loesungsweg: "\\(h'(6) = 6\\)." },
      // LEVEL 6 — Transfer
      { id: 31, level: 6, typ: "numerisch", frage: "In welchen Punkt hat die Tangente an \\(f(x)=x^2\\) die Steigung \\(-4\\)? Gib den x-Wert an.", loesung: -2, toleranz: 0, tipp: "\\(2x = -4\\).", loesungsweg: "\\(x = -2\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Tangente an \\(f(x)=x^3\\) im Punkt \\((1,1)\\). Welchen y-Wert hat sie bei \\(x=2\\)?", loesung: 4, toleranz: 0, tipp: "\\(f'(1)=3\\), \\(y = 3(x-1)+1\\).", loesungsweg: "\\(y = 3x - 2\\). \\(y(2) = 4\\)." },
      { id: 33, level: 6, typ: "mc", frage: "Welche Aussage über Sekante und Tangente ist korrekt?", optionen: ["Sekante → Tangente, wenn \\(h \\to 0\\)", "Tangente schneidet Graph nie", "Sekantensteigung ist immer gleich Tangentensteigung", "Tangente existiert nur an Extrempunkten"], korrekt: 0, tipp: "Grenzprozess.", loesungsweg: "Für \\(h \\to 0\\) wird die Sekantensteigung zur Tangentensteigung = \\(f'(x_0)\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für welches \\(a\\) hat die Tangente an \\(f(x)=x^2+ax\\) im Punkt \\(x_0=1\\) die Steigung \\(5\\)?", loesung: 3, toleranz: 0, tipp: "\\(f'(x)=2x+a\\).", loesungsweg: "\\(2 + a = 5 \\Rightarrow a = 3\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Graph ist \\(f(x) = x^2 - 6x + 10\\). Der Tiefpunkt der Parabel liegt bei \\(x=\\,\\)?", loesung: 3, toleranz: 0, tipp: "\\(f'=0\\).", loesungsweg: "\\(2x-6 = 0 \\Rightarrow x=3\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Eine Bevölkerung wächst gemäß \\(P(t) = 1000 + 50t + t^2\\). Zu welchem Zeitpunkt \\(t\\) beträgt die momentane Wachstumsrate \\(70\\)?", loesung: 10, toleranz: 0, tipp: "\\(P'(t) = 50 + 2t\\).", loesungsweg: "\\(50 + 2t = 70 \\Rightarrow t = 10\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
