<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineare Gleichungssysteme - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-lgs';
    const THEMA_CONFIG = { name: 'Lineare Gleichungssysteme', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Ein LGS mit 2 Unbekannten besteht aus …", optionen: ["einer Gleichung", "zwei Gleichungen mit je 2 Unbekannten", "drei Gleichungen", "Ungleichungen"], korrekt: 1, tipp: "Schnittpunkt zweier Geraden.", loesungsweg: "Ein 2×2-LGS hat <b>zwei lineare Gleichungen mit den Unbekannten \\(x\\) und \\(y\\)</b>." },
      { id: 2, level: 1, typ: "mc", frage: "Welche Verfahren zum Lösen kennst du?", optionen: ["Nur Einsetzen", "Einsetzungs-, Gleichsetzungs-, Additionsverfahren", "Nur graphisch", "Nur Rechnen"], korrekt: 1, tipp: "Drei Hauptverfahren.", loesungsweg: "Einsetzungs-, Gleichsetzungs- und Additionsverfahren - dazu das grafische Verfahren." },
      { id: 3, level: 1, typ: "mc", frage: "Geometrisch ist die Lösung eines 2×2-LGS …", optionen: ["Mittelpunkt einer Strecke", "Schnittpunkt zweier Geraden", "Symmetrieachse", "Parallele"], korrekt: 1, tipp: "Jede Gleichung = Gerade.", loesungsweg: "Jede lineare Gleichung beschreibt eine Gerade. Die Lösung ist deren <b>Schnittpunkt</b>." },
      { id: 4, level: 1, typ: "numerisch", frage: "\\(x + y = 7\\), \\(y = 3\\). Berechne \\(x\\).", loesung: 4, toleranz: 0, tipp: "\\(y\\) einsetzen.", loesungsweg: "$$x + 3 = 7 \\implies x = 4$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "\\(x = 5\\), \\(x + y = 12\\). Berechne \\(y\\).", loesung: 7, toleranz: 0, tipp: "\\(x\\) einsetzen.", loesungsweg: "$$5 + y = 12 \\implies y = 7$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(2x = 10\\), \\(x + y = 8\\). Berechne \\(y\\).", loesung: 3, toleranz: 0, tipp: "Erst \\(x\\) aus Gl. 1.", loesungsweg: "\\(x = 5\\), also \\(5 + y = 8 \\Rightarrow y = 3\\)." },
      // LEVEL 2 (Einsetzungsverfahren)
      { id: 7, level: 2, typ: "mc", frage: "Löse mit Einsetzen: \\(y = x + 1\\), \\(2x + y = 7\\). Welches \\(x\\)?", optionen: ["\\(x = 1\\)", "\\(x = 2\\)", "\\(x = 3\\)", "\\(x = 4\\)"], korrekt: 1, tipp: "\\(y\\) ersetzen.", loesungsweg: "\\(2x + (x+1) = 7 \\Rightarrow 3x = 6 \\Rightarrow x = 2\\)." },
      { id: 8, level: 2, typ: "mc", frage: "\\(y = 2x\\), \\(x + y = 9\\). Lösung \\((x; y)\\)?", optionen: ["\\((2; 4)\\)", "\\((3; 6)\\)", "\\((4; 5)\\)", "\\((5; 4)\\)"], korrekt: 1, tipp: "\\(x + 2x = 9\\).", loesungsweg: "\\(3x = 9 \\Rightarrow x = 3, y = 6\\)." },
      { id: 9, level: 2, typ: "mc", frage: "\\(x = y + 2\\), \\(x + y = 10\\). Lösung?", optionen: ["\\((6; 4)\\)", "\\((4; 6)\\)", "\\((5; 5)\\)", "\\((3; 7)\\)"], korrekt: 0, tipp: "\\((y+2) + y = 10\\).", loesungsweg: "\\(2y + 2 = 10 \\Rightarrow y = 4, x = 6\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(y = x - 3\\), \\(x + y = 11\\). Berechne \\(x\\).", loesung: 7, toleranz: 0, tipp: "Einsetzen in Gl. 2.", loesungsweg: "\\(x + (x-3) = 11 \\Rightarrow 2x = 14 \\Rightarrow x = 7\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(y = 3x\\), \\(2x + y = 20\\). Berechne \\(x\\).", loesung: 4, toleranz: 0, tipp: "\\(2x + 3x = 20\\).", loesungsweg: "\\(5x = 20 \\Rightarrow x = 4\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(x = 2y\\), \\(x + 3y = 15\\). Berechne \\(y\\).", loesung: 3, toleranz: 0, tipp: "Einsetzen.", loesungsweg: "\\(2y + 3y = 15 \\Rightarrow y = 3\\)." },
      // LEVEL 3 (Gleichsetzungsverfahren)
      { id: 13, level: 3, typ: "mc", frage: "\\(y = 2x + 1\\), \\(y = x + 4\\). Gleichsetzen liefert \\(x = ?\\)", optionen: ["1", "2", "3", "4"], korrekt: 2, tipp: "\\(2x + 1 = x + 4\\).", loesungsweg: "\\(2x + 1 = x + 4 \\Rightarrow x = 3\\). \\(y = 7\\)." },
      { id: 14, level: 3, typ: "mc", frage: "\\(y = -x + 6\\), \\(y = 2x\\). Schnittpunkt?", optionen: ["\\((2; 4)\\)", "\\((3; 3)\\)", "\\((1; 5)\\)", "\\((4; 2)\\)"], korrekt: 0, tipp: "Gleichsetzen.", loesungsweg: "\\(-x + 6 = 2x \\Rightarrow 3x = 6 \\Rightarrow x = 2, y = 4\\)." },
      { id: 15, level: 3, typ: "mc", frage: "\\(y = 3x - 2\\), \\(y = -x + 6\\). Schnittpunkt bei \\(x = ?\\)", optionen: ["1", "2", "3", "4"], korrekt: 1, tipp: "\\(3x - 2 = -x + 6\\).", loesungsweg: "\\(4x = 8 \\Rightarrow x = 2, y = 4\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(y = 5x\\), \\(y = 2x + 9\\). Bestimme \\(x\\).", loesung: 3, toleranz: 0, tipp: "Gleichsetzen.", loesungsweg: "\\(5x = 2x + 9 \\Rightarrow 3x = 9 \\Rightarrow x = 3\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "\\(y = 4x + 1\\), \\(y = x + 7\\). Bestimme \\(y\\) im Schnittpunkt.", loesung: 9, toleranz: 0, tipp: "Erst \\(x = 2\\).", loesungsweg: "\\(4x + 1 = x + 7 \\Rightarrow x = 2, y = 9\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(y = -2x + 10\\), \\(y = x + 1\\). Bestimme \\(x\\).", loesung: 3, toleranz: 0, tipp: "Gleichsetzen.", loesungsweg: "\\(-2x + 10 = x + 1 \\Rightarrow 9 = 3x \\Rightarrow x = 3\\)." },
      // LEVEL 4 (Verfahren selbst wählen, Modell aus Text, Umkehraufgabe)
      { id: 19, level: 4, typ: "numerisch", frage: "Löse das LGS \\(3x + 2y = 16\\), \\(5x - 2y = 8\\). Gib \\(x\\) an.", loesung: 3, toleranz: 0, tipp: "Sieh dir die Koeffizienten von \\(y\\) an, bevor du ein Verfahren wählst.", loesungsweg: "Die \\(y\\)-Terme sind entgegengesetzt gleich — Addition beider Gleichungen: $$8x = 24 \\;\\Rightarrow\\; x = 3$$ Einsetzen: \\(9 + 2y = 16 \\Rightarrow y = 3{,}5\\). Probe in Gl. 2: \\(15 - 7 = 8\\) ✓" },
      { id: 20, level: 4, typ: "numerisch", frage: "Löse das LGS \\(2x + 5y = 1\\), \\(3x - 2y = 11\\). Gib \\(y\\) an.", loesung: -1, toleranz: 0, tipp: "Beide Gleichungen so vervielfachen, dass eine Unbekannte wegfällt.", loesungsweg: "Gl. 1 mal 2, Gl. 2 mal 5: $$4x + 10y = 2 \\qquad 15x - 10y = 55$$ Addition: \\(19x = 57 \\Rightarrow x = 3\\). Einsetzen in Gl. 1: \\(6 + 5y = 1 \\Rightarrow y = -1\\). Probe in Gl. 2: \\(9 + 2 = 11\\) ✓" },
      { id: 21, level: 4, typ: "numerisch", frage: "Für 3 Kugeln Eis und 2 Waffeln zahlt man 7,50 €, für 5 Kugeln und 1 Waffel 9,00 €. Was kostet eine Kugel Eis (in €)?", loesung: 1.5, toleranz: 0.01, tipp: "Zwei Unbekannte, zwei Gleichungen.", loesungsweg: "Kugel \\(k\\), Waffel \\(w\\): $$3k + 2w = 7{,}50 \\qquad 5k + w = 9{,}00$$ Aus Gl. 2: \\(w = 9 - 5k\\). In Gl. 1: \\(3k + 18 - 10k = 7{,}5 \\Rightarrow -7k = -10{,}5 \\Rightarrow k = 1{,}50\\). Dann \\(w = 1{,}50\\). Probe: \\(4{,}50 + 3{,}00 = 7{,}50\\) ✓" },
      { id: 22, level: 4, typ: "numerisch", frage: "Das LGS \\(x + y = a\\), \\(x - y = 4\\) hat die Lösung \\(x = 9\\). Bestimme \\(a\\).", loesung: 14, toleranz: 0, tipp: "Aus der zweiten Gleichung folgt zuerst \\(y\\).", loesungsweg: "Aus Gl. 2 mit \\(x = 9\\): \\(9 - y = 4 \\Rightarrow y = 5\\). Dann Gl. 1: $$a = x + y = 9 + 5 = 14$$" },
      { id: 23, level: 4, typ: "mc", frage: "Die Summe zweier Zahlen ist 30. Die eine Zahl ist um 6 größer als das Doppelte der anderen. Welches LGS passt?", optionen: ["\\(x + y = 30\\) und \\(x = 2y + 6\\)", "\\(x + y = 30\\) und \\(x = 2(y + 6)\\)", "\\(x - y = 30\\) und \\(x = 2y + 6\\)", "\\(x + y = 30\\) und \\(y = 2x - 6\\)"], korrekt: 0, tipp: "„um 6 größer als das Doppelte“: erst verdoppeln, dann 6 addieren.", loesungsweg: "Summe: \\(x + y = 30\\). „Um 6 größer als das Doppelte der anderen“: \\(x = 2y + 6\\). Lösung: \\(3y + 6 = 30 \\Rightarrow y = 8\\), \\(x = 22\\). Probe: \\(22 = 2 \\cdot 8 + 6\\) ✓ Bei \\(2(y+6)\\) würde die 6 mitverdoppelt." },
      { id: 24, level: 4, typ: "numerisch", frage: "Löse das LGS \\(y = 2x - 1\\), \\(3x + 2y = 12\\). Gib \\(y\\) an.", loesung: 3, toleranz: 0, tipp: "Eine Gleichung ist bereits nach \\(y\\) aufgelöst.", loesungsweg: "Einsetzen von \\(y = 2x - 1\\) in Gl. 2: $$3x + 2(2x - 1) = 12 \\;\\Rightarrow\\; 7x = 14 \\;\\Rightarrow\\; x = 2$$ Dann \\(y = 2 \\cdot 2 - 1 = 3\\). Probe: \\(6 + 6 = 12\\) ✓" },
      // LEVEL 5 (Fehler finden, Sachaufgaben, Parameter)
      { id: 25, level: 5, typ: "mc", frage: "Mara löst \\(3x + 2y = 8\\), \\(x - 2y = 0\\):<br>Schritt 1: Addition ergibt \\(4x = 8\\)<br>Schritt 2: \\(x = 2\\)<br>Schritt 3: \\(2 - 2y = 0 \\Rightarrow y = -1\\)<br>Schritt 4: Lösung \\((2; -1)\\)<br>Wo liegt der erste Fehler?", optionen: ["Schritt 1: die \\(y\\)-Terme heben sich nicht auf, es müsste \\(4x + 4y = 8\\) heißen", "Schritt 2: aus \\(4x = 8\\) folgt \\(x = 4\\), weil man die 4 auf die andere Seite bringt", "Schritt 3: aus \\(2 - 2y = 0\\) folgt \\(y = 1\\), das Vorzeichen wurde vertauscht", "Es gibt keinen Fehler, das Paar \\((2; -1)\\) erfüllt beide Gleichungen"], korrekt: 2, tipp: "Setze das Ergebnis in beide Gleichungen ein.", loesungsweg: "Schritt 1 und 2 sind richtig (\\(+2y - 2y = 0\\)). In Schritt 3 gilt $$2 - 2y = 0 \\;\\Rightarrow\\; 2y = 2 \\;\\Rightarrow\\; y = 1$$ Lösung \\((2; 1)\\). Probe: \\(6 + 2 = 8\\) ✓ und \\(2 - 2 = 0\\) ✓" },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Boot fährt 36 km flussabwärts in 2 Stunden und dieselbe Strecke flussaufwärts in 3 Stunden. Wie groß ist die Eigengeschwindigkeit des Bootes in km/h?", loesung: 15, toleranz: 0, tipp: "Flussabwärts addiert sich die Strömung, flussaufwärts wird sie abgezogen.", loesungsweg: "Eigengeschwindigkeit \\(v\\), Strömung \\(s\\): $$v + s = 36 : 2 = 18 \\qquad v - s = 36 : 3 = 12$$ Addition: \\(2v = 30 \\Rightarrow v = 15\\,\\text{km/h}\\), Strömung \\(s = 3\\,\\text{km/h}\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für welchen Wert von \\(a\\) hat das LGS \\(2x + 3y = 7\\), \\(ax + 6y = 1\\) keine Lösung?", loesung: 4, toleranz: 0, tipp: "Keine Lösung heißt: parallele, aber verschiedene Geraden.", loesungsweg: "Die linken Seiten müssen Vielfache voneinander sein: \\(6 = 2 \\cdot 3\\), also \\(a = 2 \\cdot 2 = 4\\). Dann lautet Gl. 2: \\(4x + 6y = 1\\), während das Doppelte von Gl. 1 \\(4x + 6y = 14\\) ergibt — Widerspruch, keine Lösung. Für jedes andere \\(a\\) schneiden sich die Geraden." },
      { id: 28, level: 5, typ: "numerisch", frage: "Aus Saft mit 20 % Fruchtanteil und Saft mit 60 % Fruchtanteil sollen 8 Liter mit 45 % Fruchtanteil gemischt werden. Wie viele Liter der 60-%-Sorte werden benötigt?", loesung: 5, toleranz: 0, tipp: "Eine Gleichung für die Menge, eine für den Fruchtanteil.", loesungsweg: "\\(x\\) Liter zu 20 %, \\(y\\) Liter zu 60 %: $$x + y = 8 \\qquad 0{,}2x + 0{,}6y = 0{,}45 \\cdot 8 = 3{,}6$$ Einsetzen \\(x = 8 - y\\): \\(1{,}6 - 0{,}2y + 0{,}6y = 3{,}6 \\Rightarrow 0{,}4y = 2 \\Rightarrow y = 5\\). Also \\(5\\) Liter der 60-%-Sorte und \\(3\\) Liter der 20-%-Sorte." },
      { id: 29, level: 5, typ: "numerisch", frage: "Eine zweistellige Zahl hat die Quersumme 11. Vertauscht man ihre Ziffern, entsteht eine um 27 größere Zahl. Wie lautet die ursprüngliche Zahl?", loesung: 47, toleranz: 0, tipp: "Zehnerziffer und Einerziffer als Unbekannte; die Zahl ist zehnmal Zehner plus Einer.", loesungsweg: "Zehner \\(z\\), Einer \\(e\\): $$z + e = 11 \\qquad (10e + z) - (10z + e) = 27 \\;\\Rightarrow\\; 9e - 9z = 27 \\;\\Rightarrow\\; e - z = 3$$ Addition: \\(2e = 14 \\Rightarrow e = 7\\), \\(z = 4\\). Die Zahl ist \\(47\\); Probe: \\(74 - 47 = 27\\) ✓" },
      { id: 30, level: 5, typ: "numerisch", frage: "Tarif A kostet 15 € Grundgebühr und 0,10 € je Gesprächsminute, Tarif B kostet 5 € Grundgebühr und 0,15 € je Minute. Bei wie vielen Minuten im Monat sind beide Tarife gleich teuer?", loesung: 200, toleranz: 0, tipp: "Kosten beider Tarife als Gleichung in Abhängigkeit von der Minutenzahl.", loesungsweg: "Kosten \\(K\\), Minuten \\(m\\): $$K = 15 + 0{,}1m \\qquad K = 5 + 0{,}15m$$ Gleichsetzen: \\(15 + 0{,}1m = 5 + 0{,}15m \\Rightarrow 10 = 0{,}05m \\Rightarrow m = 200\\). Beide kosten dann \\(35\\,€\\); darunter ist B günstiger, darüber A." },
      // LEVEL 6 (Behauptungen, Sonderfälle, Umkehraufgaben)
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Ein LGS aus zwei linearen Gleichungen mit zwei Unbekannten hat immer genau eine Lösung.“ Was gilt?", optionen: ["Wahr, denn zwei Geraden in der Ebene schneiden sich stets in genau einem Punkt", "Falsch, parallele Geraden ergeben keine, identische unendlich viele Lösungen", "Wahr, sofern die beiden Gleichungen nicht wörtlich miteinander übereinstimmen", "Falsch, denn ein LGS kann auch genau zwei verschiedene Lösungen besitzen"], korrekt: 1, tipp: "Denke an die Lagen zweier Geraden.", loesungsweg: "Zwei Geraden können sich schneiden (genau eine Lösung), parallel verschieden sein (keine Lösung) oder zusammenfallen (unendlich viele). Beispiel: \\(x + y = 1\\), \\(2x + 2y = 5\\) hat keine Lösung. Genau zwei Lösungen sind unmöglich — zwei verschiedene Geraden haben höchstens einen gemeinsamen Punkt." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für welche Werte von \\(a\\) hat das LGS \\(x + ay = 1\\), \\(ax + 4y = 2\\) keine Lösung? Gib die Summe aller solchen \\(a\\) an.", loesung: -2, toleranz: 0, tipp: "Parallel heißt: Die linken Seiten sind Vielfache voneinander — dann prüfen, ob die rechten Seiten auch passen.", loesungsweg: "Vielfache: \\(a \\cdot 1 = 1 \\cdot a\\) und \\(a \\cdot a = 4\\), also \\(a = 2\\) oder \\(a = -2\\). Fallunterscheidung: $$a = 2: \\; 2x + 4y = 2 \\text{ ist das Doppelte von } x + 2y = 1 \\;\\Rightarrow\\; \\text{unendlich viele Lösungen}$$ $$a = -2: \\; -2x + 4y = 2 \\text{ gegen } -2(x - 2y) = -2 \\;\\Rightarrow\\; \\text{Widerspruch, keine Lösung}$$ Nur \\(a = -2\\); die Summe ist \\(-2\\)." },
      { id: 33, level: 6, typ: "mc", frage: "Gegeben sind die Geraden zu \\(y = 0{,}5x + 1\\) und \\(2y - x = 2\\). Welche Aussage über das zugehörige LGS trifft zu?", optionen: ["Die Geraden schneiden sich genau im Punkt \\((0; 1)\\), das LGS hat eine Lösung", "Die Geraden sind parallel und verschieden, das LGS hat keine Lösung", "Die Geraden sind identisch, das LGS hat unendlich viele Lösungen", "Die Geraden schneiden sich genau im Punkt \\((2; 2)\\), das LGS hat eine Lösung"], korrekt: 2, tipp: "Bringe die zweite Gleichung in die Form \\(y = mx + n\\).", loesungsweg: "Zweite Gleichung: \\(2y = x + 2 \\Rightarrow y = 0{,}5x + 1\\) — genau die erste Gerade. Beide Gleichungen beschreiben dieselbe Gerade; jeder ihrer Punkte, etwa \\((0; 1)\\) und \\((2; 2)\\), ist Lösung. Also unendlich viele Lösungen." },
      { id: 34, level: 6, typ: "numerisch", frage: "Auf einem Kassenzettel steht: 2 Äpfel und 3 Birnen kosten 4,50 €. Auf einem zweiten: 4 Äpfel und 6 Birnen kosten 8,00 €. Das kann nicht stimmen. Welchen Betrag (in €) müsste der zweite Einkauf kosten, damit beide Angaben zusammenpassen?", loesung: 9, toleranz: 0.01, tipp: "Vergleiche die Mengen beider Einkäufe.", loesungsweg: "Der zweite Einkauf ist genau das Doppelte des ersten: $$2a + 3b = 4{,}50 \\qquad 4a + 6b = 8{,}00$$ Das Doppelte von Gl. 1 ergibt \\(4a + 6b = 9{,}00\\) — Widerspruch zu \\(8{,}00\\), das LGS hat keine Lösung. Passend wäre \\(9{,}00\\,€\\); dann sind beide Gleichungen identisch, und die Einzelpreise bleiben unbestimmt (unendlich viele Lösungen)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Vater ist heute viermal so alt wie sein Sohn. In 6 Jahren wird er nur noch dreimal so alt sein. Wie alt ist der Vater heute?", loesung: 48, toleranz: 0, tipp: "Beide Altersangaben als Gleichungen; in 6 Jahren sind beide um 6 älter.", loesungsweg: "Vater \\(v\\), Sohn \\(s\\): $$v = 4s \\qquad v + 6 = 3(s + 6)$$ Einsetzen: \\(4s + 6 = 3s + 18 \\Rightarrow s = 12\\), also \\(v = 48\\). Probe: in 6 Jahren \\(54 = 3 \\cdot 18\\) ✓" },
      { id: 36, level: 6, typ: "numerisch", frage: "Für wie viele ganzzahlige Werte \\(a\\) mit \\(-3 \\le a \\le 3\\) hat das LGS \\(ax + y = 1\\), \\(x + ay = 1\\) genau eine Lösung?", loesung: 5, toleranz: 0, tipp: "Wann sind die beiden Geraden parallel oder identisch? Untersuche diese Werte gesondert.", loesungsweg: "Parallel oder identisch, wenn die linken Seiten Vielfache sind: \\(a \\cdot a = 1 \\cdot 1\\), also \\(a = \\pm 1\\). Fallunterscheidung: $$a = 1: \\; x + y = 1 \\text{ zweimal} \\;\\Rightarrow\\; \\text{unendlich viele Lösungen}$$ $$a = -1: \\; -x + y = 1,\\; x - y = 1 \\;\\Rightarrow\\; 0 = 2 \\;\\Rightarrow\\; \\text{keine Lösung}$$ Für die übrigen \\(a \\in \\{-3, -2, 0, 2, 3\\}\\) schneiden sich die Geraden: \\(5\\) Werte." }
    ];
    </script>

</body>
