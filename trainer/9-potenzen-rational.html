<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-potenzen-rational';
    const THEMA_CONFIG = { name: 'Potenzen mit rationalen Exponenten', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "mc", frage: "Was bedeutet \\(a^{1/2}\\)?", optionen: ["\\(a \\cdot \\frac{1}{2}\\)", "\\(\\sqrt{a}\\)", "\\(\\frac{1}{a^2}\\)", "\\(a^2\\)"], korrekt: 1, tipp: "Hoch \\(\\frac{1}{2}\\) = Quadratwurzel.", loesungsweg: "Ein Bruch im Exponenten steht für eine Wurzel. Der Grund ist das Potenzgesetz: $$\\left(a^{1/2}\\right)^2 = a^{\\frac12 \\cdot 2} = a^1 = a$$ Gesucht ist also die Zahl, die quadriert \\(a\\) ergibt — die Quadratwurzel: \\(a^{1/2} = \\sqrt a\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "Berechne \\(9^{1/2}\\).", loesung: 3, toleranz: 0, tipp: "\\(\\sqrt{9}\\).", loesungsweg: "$$9^{1/2} = \\sqrt{9} = 3$$" },
      { id: 3, level: 1, typ: "mc", frage: "Was ist \\(a^{1/3}\\)?", optionen: ["\\(\\sqrt{a}\\)", "\\(\\sqrt[3]{a}\\)", "\\(\\frac{a}{3}\\)", "\\(3a\\)"], korrekt: 1, tipp: "Hoch \\(\\frac{1}{n}\\) = n-te Wurzel.", loesungsweg: "Analog gilt \\(\\left(a^{1/3}\\right)^3 = a\\), also ist \\(a^{1/3}\\) die Zahl, die hoch drei genommen \\(a\\) ergibt: $$a^{1/3} = \\sqrt[3]{a}$$ Allgemein steht der Nenner des Exponenten für den Wurzelexponenten." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne \\(8^{1/3}\\).", loesung: 2, toleranz: 0, tipp: "\\(\\sqrt[3]{8} = ?\\), denn \\(2^3 = 8\\).", loesungsweg: "$$8^{1/3} = \\sqrt[3]{8} = 2$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne \\(16^{1/2}\\).", loesung: 4, toleranz: 0, tipp: "\\(\\sqrt{16}\\).", loesungsweg: "$$16^{1/2} = \\sqrt{16} = 4$$ Probe: \\(4^2 = 16\\) ✓" },
      { id: 6, level: 1, typ: "numerisch", frage: "Berechne \\(27^{1/3}\\).", loesung: 3, toleranz: 0, tipp: "\\(3^3 = 27\\).", loesungsweg: "$$27^{1/3} = \\sqrt[3]{27} = 3$$ Probe: \\(3^3 = 27\\) ✓ Solche Aufgaben löst man am schnellsten, indem man die Basis als Potenz schreibt: \\(27 = 3^3\\), also \\(\\left(3^3\\right)^{1/3} = 3\\)." },
      // ========== LEVEL 2 ==========
      { id: 7, level: 2, typ: "mc", frage: "Was bedeutet \\(a^{m/n}\\)?", optionen: ["\\(\\sqrt[n]{a^m}\\)", "\\(\\sqrt[m]{a^n}\\)", "\\(\\frac{a^m}{n}\\)", "\\(a \\cdot \\frac{m}{n}\\)"], korrekt: 0, tipp: "Nenner = Wurzelexponent, Zähler = Potenz.", loesungsweg: "$$a^{m/n} = \\sqrt[n]{a^m} = (\\sqrt[n]{a})^m$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne \\(4^{3/2}\\).", loesung: 8, toleranz: 0, tipp: "\\(\\sqrt{4^3} = \\sqrt{64}\\) oder \\((\\sqrt{4})^3 = 2^3\\).", loesungsweg: "$$4^{3/2} = (\\sqrt{4})^3 = 2^3 = 8$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne \\(8^{2/3}\\).", loesung: 4, toleranz: 0, tipp: "\\((\\sqrt[3]{8})^2 = 2^2\\).", loesungsweg: "$$8^{2/3} = (\\sqrt[3]{8})^2 = 4$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Berechne \\(25^{1/2}\\).", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{25}\\).", loesungsweg: "$$25^{1/2} = \\sqrt{25} = 5$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Berechne \\(32^{1/5}\\).", loesung: 2, toleranz: 0, tipp: "\\(2^5 = 32\\).", loesungsweg: "Zerlegen der Basis: \\(32 = 2^5\\), also $$32^{1/5} = \\left(2^5\\right)^{1/5} = 2^{5 \\cdot \\frac15} = 2$$" },
      { id: 12, level: 2, typ: "mc", frage: "Schreibe \\(\\sqrt[4]{a^3}\\) als Potenz.", optionen: ["\\(a^{4/3}\\)", "\\(a^{3/4}\\)", "\\(a^{12}\\)", "\\(a^{-4/3}\\)"], korrekt: 1, tipp: "Wurzelexp. in den Nenner.", loesungsweg: "Beim Umschreiben wandert der Wurzelexponent in den <b>Nenner</b>, der Exponent unter der Wurzel in den Zähler: $$\\sqrt[n]{a^m} = a^{m/n} \\;\\Rightarrow\\; \\sqrt[4]{a^3} = a^{3/4}$$ Die Verwechslung von Zähler und Nenner ergäbe \\(a^{4/3}\\) — das wäre \\(\\sqrt[3]{a^4}\\)." },
      // ========== LEVEL 3 ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Berechne \\(16^{3/4}\\).", loesung: 8, toleranz: 0, tipp: "\\((\\sqrt[4]{16})^3 = 2^3\\).", loesungsweg: "$$16^{3/4} = 2^3 = 8$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Berechne \\(25^{3/2}\\).", loesung: 125, toleranz: 0, tipp: "\\((\\sqrt{25})^3 = 5^3\\).", loesungsweg: "Der Exponent \\(\\tfrac32\\) zerlegt sich in Wurzel und Potenz: $$25^{3/2} = \\left(\\sqrt{25}\\right)^3 = 5^3 = 125$$ Erst die Wurzel zu ziehen ist geschickter, weil man sonst \\(25^3 = 15\\,625\\) und daraus die Wurzel bestimmen müsste — dasselbe Ergebnis, aber mit größeren Zahlen." },
      { id: 15, level: 3, typ: "mc", frage: "Vereinfache \\(a^{1/2} \\cdot a^{1/3}\\).", optionen: ["\\(a^{1/6}\\)", "\\(a^{5/6}\\)", "\\(a^{2/3}\\)", "\\(a^{1/5}\\)"], korrekt: 1, tipp: "Exponenten addieren: \\(\\frac{1}{2} + \\frac{1}{3}\\).", loesungsweg: "$$a^{1/2} \\cdot a^{1/3} = a^{3/6 + 2/6} = a^{5/6}$$" },
      { id: 16, level: 3, typ: "mc", frage: "Vereinfache \\(\\frac{a^{3/4}}{a^{1/4}}\\).", optionen: ["\\(a^{1/2}\\)", "\\(a^{3/16}\\)", "\\(a\\)", "\\(a^{1/3}\\)"], korrekt: 0, tipp: "Exponenten subtrahieren.", loesungsweg: "$$a^{3/4 - 1/4} = a^{2/4} = a^{1/2}$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Berechne \\(64^{1/6}\\).", loesung: 2, toleranz: 0, tipp: "\\(2^6 = 64\\).", loesungsweg: "\\(64 = 2^6\\), also $$64^{1/6} = \\left(2^6\\right)^{1/6} = 2$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\(81^{1/4}\\).", loesung: 3, toleranz: 0, tipp: "\\(3^4 = 81\\).", loesungsweg: "\\(81 = 3^4\\), also $$81^{1/4} = \\left(3^4\\right)^{1/4} = 3$$" },
      // ========== LEVEL 4 -- Schreibweise selbst wählen, Umkehraufgaben, Modell ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Schreibe \\(\\sqrt{x^3} \\cdot \\sqrt[3]{x}\\) als eine Potenz \\(x^k\\). Gib \\(k\\) als Dezimalzahl an (zwei Dezimalstellen).", loesung: 1.83, toleranz: 0.01, tipp: "Beide Wurzeln zuerst als Potenzen mit Bruchexponent schreiben.", loesungsweg: "Wurzeln in Potenzen umwandeln: \\(\\sqrt{x^3} = x^{3/2}\\) und \\(\\sqrt[3]{x} = x^{1/3}\\). Gleiche Basis, Exponenten addieren: $$x^{3/2} \\cdot x^{1/3} = x^{\\frac96 + \\frac26} = x^{11/6}$$ Als Dezimalzahl: \\(k = \\tfrac{11}{6} \\approx 1{,}83\\). Die Brüche müssen dafür auf den Hauptnenner \\(6\\) gebracht werden." },
      { id: 20, level: 4, typ: "numerisch", frage: "Für welchen Exponenten \\(r\\) gilt \\(16^r = 8\\)?", loesung: 0.75, toleranz: 0.001, tipp: "Beide Zahlen sind Zweierpotenzen.", loesungsweg: "Mit \\(16 = 2^4\\) und \\(8 = 2^3\\): $$16^r = (2^4)^r = 2^{4r} = 2^3 \\;\\Rightarrow\\; 4r = 3 \\;\\Rightarrow\\; r = \\frac34 = 0{,}75$$ Probe: \\(16^{3/4} = \\left(\\sqrt[4]{16}\\right)^3 = 2^3 = 8\\) ✓" },
      { id: 21, level: 4, typ: "numerisch", frage: "Berechne \\(8^{-2/3} \\cdot 4^{3/2}\\).", loesung: 2, toleranz: 0, tipp: "Jede Potenz einzeln über die passende Wurzel auswerten.", loesungsweg: "Beide Faktoren getrennt: $$8^{-2/3} = \\frac{1}{\\left(\\sqrt[3]{8}\\right)^2} = \\frac{1}{4}, \\qquad 4^{3/2} = \\left(\\sqrt4\\right)^3 = 8$$ Produkt: \\(\\tfrac14 \\cdot 8 = 2\\). Alternativ über die Basis \\(2\\): \\(2^{-2} \\cdot 2^{3} = 2^1 = 2\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Würfel hat das Volumen \\(729\\,\\text{cm}^3\\). Berechne seine Oberfläche in \\(\\text{cm}^2\\).", loesung: 486, toleranz: 0, tipp: "Erst die Kantenlänge aus dem Volumen bestimmen.", loesungsweg: "Die Kantenlänge ist die dritte Wurzel des Volumens: $$a = 729^{1/3} = \\sqrt[3]{729} = 9\\,\\text{cm}, \\quad \\text{denn } 9^3 = 729$$ Die Oberfläche besteht aus sechs Quadraten: $$O = 6 \\cdot a^2 = 6 \\cdot 81 = 486\\,\\text{cm}^2$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Für welche positive Zahl \\(x\\) gilt \\(x^{1/3} \\cdot x^{1/6} = 8\\)?", loesung: 64, toleranz: 0, tipp: "Fasse die linke Seite zu einer Potenz zusammen.", loesungsweg: "Exponenten addieren: $$x^{1/3} \\cdot x^{1/6} = x^{\\frac26 + \\frac16} = x^{1/2} = \\sqrt x$$ Also \\(\\sqrt x = 8\\), und Quadrieren liefert \\(x = 64\\). Probe: \\(64^{1/3} \\cdot 64^{1/6} = 4 \\cdot 2 = 8\\) ✓" },
      { id: 24, level: 4, typ: "mc", frage: "Welche dieser Potenzen mit Bruchexponent hat den größten Wert?", optionen: ["\\(125^{2/3}\\)", "\\(27^{2/3}\\)", "\\(16^{3/4}\\)", "\\(8^{4/3}\\)"], korrekt: 0, tipp: "Erst die Wurzel ziehen, dann potenzieren.", loesungsweg: "Alle vier Werte über „Wurzel zuerst\" bestimmen: $$27^{2/3} = 3^2 = 9, \\quad 16^{3/4} = 2^3 = 8, \\quad 8^{4/3} = 2^4 = 16, \\quad 125^{2/3} = 5^2 = 25$$ Am größten ist \\(125^{2/3} = 25\\). Der Exponent \\(\\tfrac23\\) ist kleiner als \\(\\tfrac43\\), aber die Basis \\(125\\) macht das mehr als wett." },
      // ========== LEVEL 5 -- Fehler finden, Parameter aus zwei Bedingungen, Sachaufgaben ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Schüler rechnet \\(8^{2/3} = \\frac{8^2}{3} = \\frac{64}{3}\\). Was ist dazu zu sagen?", optionen: ["Falsch — Zähler und Nenner sind vertauscht, richtig ist \\(\\frac{8^3}{2} = 256\\)", "Richtig — ein Bruch im Exponenten wird als Division gerechnet", "Falsch — der Nenner \\(3\\) ist der Wurzelexponent, das Ergebnis ist \\(4\\)", "Falsch — der Bruch ist ein Faktor, richtig ist \\(8 \\cdot \\frac23 = \\frac{16}{3}\\)"], korrekt: 2, tipp: "Was bedeutet der Nenner eines Bruchexponenten?", loesungsweg: "Der Nenner eines Bruchexponenten wird nicht als Division gerechnet, sondern als Wurzel: $$a^{m/n} = \\sqrt[n]{a^m} = \\left(\\sqrt[n]{a}\\right)^m$$ Damit ist $$8^{2/3} = \\left(\\sqrt[3]{8}\\right)^2 = 2^2 = 4$$ Kontrolle über das Potenzgesetz: \\(\\left(8^{2/3}\\right)^3 = 8^2 = 64\\), und tatsächlich ist \\(4^3 = 64\\). Der Wert \\(\\tfrac{64}{3}\\) hoch drei ergäbe dagegen etwa \\(9709\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Für eine positive Zahl \\(a\\) und einen rationalen Exponenten \\(r\\) gilt \\(a^r = 4\\) und \\(a^{r+1} = 32\\). Bestimme \\(r\\). Gib das Ergebnis als Dezimalzahl an (zwei Dezimalstellen).", loesung: 0.67, toleranz: 0.01, tipp: "Der Quotient der beiden Gleichungen verrät \\(a\\).", loesungsweg: "Division der Gleichungen: $$\\frac{a^{r+1}}{a^r} = a^{1} = \\frac{32}{4} = 8$$ Also \\(a = 8\\). Aus \\(8^r = 4\\) folgt mit \\(8 = 2^3\\) und \\(4 = 2^2\\): $$2^{3r} = 2^2 \\;\\Rightarrow\\; 3r = 2 \\;\\Rightarrow\\; r = \\frac23 \\approx 0{,}67$$ Probe: \\(8^{2/3} = \\left(\\sqrt[3]{8}\\right)^2 = 4\\) ✓ und \\(8^{5/3} = 2^5 = 32\\) ✓" },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Würfel hat die Oberfläche \\(150\\,\\text{cm}^2\\). Berechne sein Volumen in \\(\\text{cm}^3\\).", loesung: 125, toleranz: 0, tipp: "Aus der Oberfläche folgt die Fläche einer Seite, daraus die Kante.", loesungsweg: "Eine der sechs Seitenflächen: \\(150 : 6 = 25\\,\\text{cm}^2\\). Die Kantenlänge ist die Wurzel daraus: $$a = 25^{1/2} = 5\\,\\text{cm}$$ Volumen: $$V = a^3 = 5^3 = 125\\,\\text{cm}^3$$ Vom Flächeninhalt zur Kante braucht man den Exponenten \\(\\tfrac12\\), von der Kante zum Volumen den Exponenten \\(3\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Für welche positive Zahl \\(x\\) gilt \\(x^{3/4} = 27\\)?", loesung: 81, toleranz: 0, tipp: "Mit welchem Exponenten muss man beide Seiten potenzieren, damit links \\(x^1\\) steht?", loesungsweg: "Der Kehrwert des Exponenten macht die Potenz rückgängig: $$\\left(x^{3/4}\\right)^{4/3} = x^{1} = 27^{4/3}$$ Rechts zuerst die Wurzel: \\(\\sqrt[3]{27} = 3\\), dann \\(3^4 = 81\\). Also \\(x = 81\\). Probe: \\(81^{3/4} = \\left(\\sqrt[4]{81}\\right)^3 = 3^3 = 27\\) ✓" },
      { id: 29, level: 5, typ: "mc", frage: "Eine Schülerin vereinfacht \\(\\sqrt{a} \\cdot \\sqrt[3]{a} = a^{1/2} \\cdot a^{1/3} = a^{1/6}\\). Wo liegt der Fehler?", optionen: ["Beim Multiplizieren gleicher Basen werden die Exponenten addiert: \\(a^{1/2 + 1/3} = a^{5/6}\\)", "Die Umwandlung der Wurzeln in Potenzen ist falsch, es müsste \\(a^2 \\cdot a^3\\) heißen", "Es gibt keinen Fehler, \\(a^{1/6}\\) ist richtig", "Die Exponenten müssen subtrahiert werden: \\(a^{1/2 - 1/3} = a^{1/6}\\)"], korrekt: 0, tipp: "Prüfe mit \\(a = 64\\): \\(\\sqrt{64} \\cdot \\sqrt[3]{64}\\) gegen \\(64^{1/6}\\).", loesungsweg: "Die Wurzeln wurden richtig in Potenzen umgewandelt. Danach wurden die Exponenten aber multipliziert (\\(\\tfrac12 \\cdot \\tfrac13 = \\tfrac16\\)) statt addiert: $$a^{1/2} \\cdot a^{1/3} = a^{\\frac36 + \\frac26} = a^{5/6}$$ Kontrolle mit \\(a = 64\\): \\(\\sqrt{64} \\cdot \\sqrt[3]{64} = 8 \\cdot 4 = 32\\), und \\(64^{5/6} = 2^5 = 32\\) ✓, aber \\(64^{1/6} = 2\\). Multipliziert werden Exponenten nur beim Potenzieren einer Potenz." },
      { id: 30, level: 5, typ: "numerisch", frage: "Vereinfache \\(\\left(x^{2/3}\\right)^{3/4} \\cdot x^{1/2}\\) zu einer Potenz \\(x^k\\). Gib \\(k\\) an.", loesung: 1, toleranz: 0, tipp: "Erst die Klammer, dann das Produkt.", loesungsweg: "Potenz einer Potenz — Exponenten multiplizieren: $$\\left(x^{2/3}\\right)^{3/4} = x^{\\frac23 \\cdot \\frac34} = x^{6/12} = x^{1/2}$$ Produkt gleicher Basen — Exponenten addieren: $$x^{1/2} \\cdot x^{1/2} = x^{1} = x$$ Also \\(k = 1\\). Der Term ist einfach \\(x\\)." },
      // ========== LEVEL 6 -- Behauptungen prüfen, Sonderfälle, Umkehraufgaben ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „\\((-8)^{1/3} = -2\\), denn \\((-2)^3 = -8\\).\" Ist diese Schreibweise zulässig?", optionen: ["Ja — der Bruchexponent \\(\\frac13\\) bedeutet dritte Wurzel, und die existiert für \\(-8\\)", "Nein — richtig wäre \\((-8)^{1/3} = 2\\), weil Potenzen nie negativ sind", "Nein — \\(-8\\) hat keine dritte Wurzel, weil Radikanden nicht negativ sein dürfen", "Nein — mit \\(\\frac13 = \\frac26\\) ergäbe sich \\((-8)^{2/6} = 2\\), ein Widerspruch"], korrekt: 3, tipp: "Was passiert, wenn man den Exponenten \\(\\frac13\\) zu \\(\\frac26\\) erweitert?", loesungsweg: "Die dritte Wurzel \\(\\sqrt[3]{-8} = -2\\) existiert als Wurzel. Als <b>Potenz</b> \\((-8)^{1/3}\\) darf man sie aber nicht schreiben, weil die Potenzgesetze dann versagen: $$(-8)^{1/3} = (-8)^{2/6} = \\sqrt[6]{(-8)^2} = \\sqrt[6]{64} = 2 \\;\\neq\\; -2$$ Derselbe Exponent, verschieden geschrieben, zwei verschiedene Werte — deshalb werden Potenzen mit rationalen Exponenten nur für positive Basen definiert. Für negative Radikanden bleibt man bei der Wurzelschreibweise." },
      { id: 32, level: 6, typ: "mc", frage: "Behauptung: „Für alle \\(a > 0\\) gilt \\(a^{1/2} < a\\).\" Stimmt das?", optionen: ["Ja — Wurzelziehen verkleinert jede positive Zahl", "Nein — für \\(0 < a < 1\\) ist \\(a^{1/2} > a\\), etwa \\(a = 0{,}25\\)", "Ja — der Exponent \\(\\frac12\\) ist kleiner als \\(1\\), also ist die Potenz kleiner", "Nein — für alle \\(a > 0\\) ist \\(a^{1/2} > a\\), etwa \\(a = 4\\)"], korrekt: 1, tipp: "Prüfe die Behauptung für eine Zahl größer als \\(1\\), für eine Zahl zwischen \\(0\\) und \\(1\\) und für \\(a = 1\\).", loesungsweg: "Fallunterscheidung nach der Größe von \\(a\\): Für \\(a > 1\\) stimmt die Behauptung, z. B. \\(4^{1/2} = 2 < 4\\). Für \\(a = 1\\) gilt Gleichheit: \\(1^{1/2} = 1\\). Für \\(0 < a < 1\\) kehrt sich die Ungleichung um: $$0{,}25^{1/2} = \\sqrt{0{,}25} = 0{,}5 > 0{,}25$$ Die Behauptung „für alle \\(a > 0\\)\" ist also falsch — ein einziges Gegenbeispiel genügt. Merke: Wurzelziehen bringt jede positive Zahl näher an \\(1\\) heran, Zahlen unter \\(1\\) werden dabei größer." },
      { id: 33, level: 6, typ: "numerisch", frage: "Wie viele der Zahlen \\(2^{1/3}\\), \\(2^{2/3}\\), \\(2^{0}\\) und \\(2^{3/4}\\) sind kleiner als \\(\\sqrt{2}\\)?", loesung: 2, toleranz: 0, tipp: "Schreibe \\(\\sqrt{2}\\) als Potenz von \\(2\\) und vergleiche die Exponenten.", loesungsweg: "\\(\\sqrt2 = 2^{1/2}\\). Bei gleicher Basis größer als \\(1\\) entscheidet der Exponent: Je größer der Exponent, desto größer die Potenz. $$\\frac13 < \\frac12, \\qquad 0 < \\frac12, \\qquad \\frac23 > \\frac12, \\qquad \\frac34 > \\frac12$$ Kleiner als \\(\\sqrt2\\) sind also \\(2^{1/3} \\approx 1{,}26\\) und \\(2^0 = 1\\) — zwei Zahlen. Der Vergleich der Exponenten funktioniert nur, weil alle Potenzen dieselbe Basis haben." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für welche natürliche Zahl \\(n\\) gilt \\(\\sqrt{\\sqrt[3]{x}} = \\sqrt[n]{x}\\) für alle \\(x > 0\\)?", loesung: 6, toleranz: 0, tipp: "Schreibe die verschachtelte Wurzel als Potenz einer Potenz.", loesungsweg: "Von innen nach außen in Potenzen übersetzen: $$\\sqrt{\\sqrt[3]{x}} = \\left(x^{1/3}\\right)^{1/2} = x^{\\frac13 \\cdot \\frac12} = x^{1/6} = \\sqrt[6]{x}$$ Also \\(n = 6\\). Verschachtelte Wurzeln multiplizieren ihre Wurzelexponenten. Probe mit \\(x = 64\\): \\(\\sqrt[3]{64} = 4\\), \\(\\sqrt4 = 2\\), und \\(\\sqrt[6]{64} = 2\\) ✓" },
      { id: 35, level: 6, typ: "mc", frage: "Für welche positiven Zahlen \\(x\\) gilt \\(x^{1/2} > x\\)?", optionen: ["Genau für \\(0 < x < 1\\), etwa \\(\\sqrt{0{,}25} = 0{,}5 > 0{,}25\\)", "Für alle \\(x > 0\\), weil die Wurzel immer größer als die Zahl ist", "Für alle \\(x > 1\\), weil dort die Wurzel schneller wächst", "Für kein \\(x\\), weil \\(\\frac12 < 1\\) ist"], korrekt: 0, tipp: "Vergleiche \\(x = 4\\) und \\(x = 0{,}25\\).", loesungsweg: "Fallunterscheidung nach der Basis: Für \\(x > 1\\) ist \\(\\sqrt x < x\\), zum Beispiel \\(\\sqrt4 = 2 < 4\\). Für \\(x = 1\\) sind beide gleich. Für \\(0 < x < 1\\) kehrt sich die Beziehung um: $$\\sqrt{0{,}25} = 0{,}5 > 0{,}25, \\qquad \\sqrt{0{,}01} = 0{,}1 > 0{,}01$$ Denn ein Bruch zwischen \\(0\\) und \\(1\\) wird beim Quadrieren kleiner — also ist seine Wurzel größer als er selbst. Die Regel „kleinerer Exponent, kleinere Potenz\" gilt nur für Basen über \\(1\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Würfel wird so vergrößert, dass sein Volumen auf das \\(27\\)-Fache wächst. Ein Schüler meint, die Oberfläche wachse dann ebenfalls auf das \\(27\\)-Fache. Auf das Wievielfache wächst die Oberfläche tatsächlich?", loesung: 9, toleranz: 0, tipp: "Vom Volumen zur Kante ist der Exponent \\(\\frac13\\), von der Kante zur Oberfläche der Exponent \\(2\\).", loesungsweg: "Kante und Volumen hängen über \\(V = a^3\\) zusammen, also \\(a = V^{1/3}\\). Wächst das Volumen auf das \\(27\\)-Fache, wächst die Kante auf das $$27^{1/3} = 3\\text{-Fache}$$ Die Oberfläche \\(O = 6a^2\\) wächst mit dem Quadrat der Kante, also auf das \\(3^2 = 9\\)-Fache. In einem Schritt: $$27^{2/3} = \\left(27^{1/3}\\right)^2 = 9$$ Die Behauptung ist falsch — Volumen, Oberfläche und Kante wachsen mit verschiedenen Exponenten (\\(3\\), \\(2\\), \\(1\\))." }];
