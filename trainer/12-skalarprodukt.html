<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-skalarprodukt';
    const THEMA_CONFIG = { name: 'Skalarprodukt', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Das Skalarprodukt \\(\\vec a \\cdot \\vec b\\) liefert …", optionen: ["einen Vektor", "eine Zahl (Skalar)", "eine Matrix", "einen Winkel"], korrekt: 1, tipp: "Skalar = Zahl.", loesungsweg: "\\(\\vec a \\cdot \\vec b\\) ist eine reelle Zahl." },
      { id: 2, level: 1, typ: "mc", frage: "Formel für \\(\\vec a \\cdot \\vec b\\) in Komponenten (3D):", optionen: ["\\(a_1+b_1+\\ldots\\)", "\\(a_1 b_1 + a_2 b_2 + a_3 b_3\\)", "\\(a_1 \\cdot b_2 \\cdot b_3\\)", "\\(|\\vec a| + |\\vec b|\\)"], korrekt: 1, tipp: "Komponentenweise multipl., aufsummieren.", loesungsweg: "Beim Skalarprodukt werden die Komponenten paarweise multipliziert und die Produkte addiert: $$\\vec a \\cdot \\vec b = a_1b_1 + a_2b_2 + a_3b_3$$ Das Ergebnis ist eine <b>Zahl</b>, kein Vektor — daher der Name. Beim Kreuzprodukt entstünde dagegen wieder ein Vektor." },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix} \\cdot \\begin{pmatrix}4\\\\5\\\\6\\end{pmatrix} = ?\\)", loesung: 32, toleranz: 0, tipp: "\\(4+10+18\\).", loesungsweg: "$$1\\cdot 4 + 2\\cdot 5 + 3\\cdot 6 = 4+10+18 = 32$$" },
      { id: 4, level: 1, typ: "numerisch", frage: "\\(\\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix} \\cdot \\begin{pmatrix}3\\\\4\\\\5\\end{pmatrix} = ?\\)", loesung: 2, toleranz: 0, tipp: "\\(6-4+0\\).", loesungsweg: "$$\\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix} \\cdot \\begin{pmatrix}3\\\\4\\\\5\\end{pmatrix} = 2 \\cdot 3 + (-1) \\cdot 4 + 0 \\cdot 5 = 6 - 4 + 0 = 2$$ Die Vorzeichen müssen mitgeführt werden; die dritte Komponente liefert trotz der \\(5\\) keinen Beitrag, weil der erste Faktor null ist." },
      { id: 5, level: 1, typ: "numerisch", frage: "\\(\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix} \\cdot \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix} = ?\\)", loesung: 3, toleranz: 0, tipp: "\\(1+1+1\\).", loesungsweg: "$$\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix} \\cdot \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix} = 1+1+1 = 3$$ Das Skalarprodukt eines Vektors mit sich selbst ist stets das Quadrat seiner Länge: \\(|\\vec a|^2 = 3\\), also \\(|\\vec a| = \\sqrt3\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Was ist \\(\\vec a \\cdot \\vec a\\)?", optionen: ["\\(|\\vec a|\\)", "\\(|\\vec a|^2\\)", "0", "1"], korrekt: 1, tipp: "Quadrat des Betrags.", loesungsweg: "$$\\vec a \\cdot \\vec a = a_1^2 + a_2^2 + a_3^2 = |\\vec a|^2$$" },
      // LEVEL 2 -- Orthogonalität
      { id: 7, level: 2, typ: "mc", frage: "\\(\\vec a \\perp \\vec b\\) (mit \\(\\vec a,\\vec b \\neq \\vec 0\\)) gilt genau dann, wenn:", optionen: ["\\(\\vec a \\cdot \\vec b = 0\\)", "\\(\\vec a = \\vec b\\)", "\\(|\\vec a|=|\\vec b|\\)", "\\(\\vec a + \\vec b = \\vec 0\\)"], korrekt: 0, tipp: "Skalarprodukt = 0.", loesungsweg: "Zwei Vektoren sind senkrecht \\(\\iff \\vec a \\cdot \\vec b = 0\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Sind \\(\\vec a = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\) orthogonal?", optionen: ["Ja", "Nein", "Nur wenn im 2D", "Nicht entscheidbar"], korrekt: 0, tipp: "\\(0+0+0=0\\).", loesungsweg: "$$\\vec a \\cdot \\vec b = 1 \\cdot 0 + 0 \\cdot 1 + 0 \\cdot 0 = 0$$ Ein verschwindendes Skalarprodukt bedeutet, dass die Vektoren <b>orthogonal</b> sind — hier die Achsenrichtungen \\(x\\) und \\(y\\), die offensichtlich einen rechten Winkel bilden." },
      { id: 9, level: 2, typ: "numerisch", frage: "Für welches \\(k\\) sind \\(\\begin{pmatrix}2\\\\k\\\\1\\end{pmatrix}\\) und \\(\\begin{pmatrix}1\\\\2\\\\-2\\end{pmatrix}\\) orthogonal?", loesung: 0, toleranz: 0, tipp: "\\(2+2k-2=0\\).", loesungsweg: "\\(2 + 2k - 2 = 0 \\Rightarrow k = 0\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Für welches \\(k\\) sind \\(\\begin{pmatrix}1\\\\k\\\\0\\end{pmatrix}\\) und \\(\\begin{pmatrix}2\\\\3\\\\5\\end{pmatrix}\\) orthogonal?", loesung: -0.667, toleranz: 0.01, tipp: "\\(2+3k=0\\).", loesungsweg: "\\(2+3k=0 \\Rightarrow k = -\\tfrac{2}{3} \\approx -0{,}67\\)." },
      { id: 11, level: 2, typ: "mc", frage: "\\(\\vec a \\cdot \\vec b = 5\\), \\(\\vec a \\cdot \\vec c = 0\\). Was stimmt?", optionen: ["\\(\\vec a \\perp \\vec b\\)", "\\(\\vec a \\perp \\vec c\\)", "\\(\\vec a \\parallel \\vec b\\)", "\\(\\vec a \\parallel \\vec c\\)"], korrekt: 1, tipp: "Nur die 0.", loesungsweg: "\\(\\vec a \\cdot \\vec c = 0 \\Rightarrow \\vec a \\perp \\vec c\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(\\begin{pmatrix}3\\\\-1\\\\2\\end{pmatrix} \\cdot \\begin{pmatrix}1\\\\5\\\\1\\end{pmatrix} = ?\\)", loesung: 0, toleranz: 0, tipp: "\\(3-5+2\\).", loesungsweg: "$$3 \\cdot 1 + (-1) \\cdot 5 + 2 \\cdot 1 = 3 - 5 + 2 = 0$$ Das Skalarprodukt ist null, die beiden Vektoren stehen also senkrecht aufeinander — obwohl man ihnen das an den Komponenten nicht ansieht. Genau dafür ist das Skalarprodukt das Werkzeug." },
      // LEVEL 3 -- Winkel
      { id: 13, level: 3, typ: "mc", frage: "Winkelformel: \\(\\cos \\varphi = \\)", optionen: ["\\(\\vec a \\cdot \\vec b\\)", "\\(\\frac{\\vec a \\cdot \\vec b}{|\\vec a| \\cdot |\\vec b|}\\)", "\\(\\frac{|\\vec a|}{|\\vec b|}\\)", "\\(|\\vec a||\\vec b|\\)"], korrekt: 1, tipp: "Durch Produkt der Beträge.", loesungsweg: "Aus der geometrischen Form \\(\\vec a \\cdot \\vec b = |\\vec a||\\vec b|\\cos\\varphi\\) folgt durch Umstellen: $$\\cos\\varphi = \\frac{\\vec a \\cdot \\vec b}{|\\vec a| \\cdot |\\vec b|}$$ Die Division durch die Beträge ist nötig, weil der Winkel nur von der Richtung abhängt, nicht von der Länge der Vektoren." },
      { id: 14, level: 3, typ: "numerisch", frage: "Winkel zwischen \\(\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\) und \\(\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}\\) in Grad:", loesung: 45, toleranz: 0.5, tipp: "\\(\\cos\\varphi = \\frac{1}{\\sqrt{2}}\\).", loesungsweg: "\\(\\cos\\varphi = \\frac{1}{1 \\cdot \\sqrt{2}} = \\frac{1}{\\sqrt{2}} \\Rightarrow \\varphi = 45°\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Winkel zwischen \\(\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\) und \\(\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\) in Grad:", loesung: 90, toleranz: 0, tipp: "Orthogonal.", loesungsweg: "Skalarprodukt = 0 → \\(\\varphi = 90°\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Winkel zwischen \\(\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}\\) und \\(\\begin{pmatrix}1\\\\-1\\\\0\\end{pmatrix}\\) in Grad:", loesung: 90, toleranz: 0, tipp: "Skalarpr.: \\(1-1+0=0\\).", loesungsweg: "\\(1-1=0 \\Rightarrow \\varphi = 90°\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "\\(|\\vec a|=3\\), \\(|\\vec b|=4\\), \\(\\vec a \\cdot \\vec b = 6\\). Winkel in Grad:", loesung: 60, toleranz: 0.5, tipp: "\\(\\cos\\varphi = \\frac{6}{12}\\).", loesungsweg: "\\(\\cos\\varphi = \\tfrac{1}{2} \\Rightarrow \\varphi = 60°\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(|\\vec a|=5\\), \\(|\\vec b|=2\\), \\(\\vec a \\cdot \\vec b = -5\\). \\(\\cos\\varphi = ?\\) (Dezimal)", loesung: -0.5, toleranz: 0.01, tipp: "\\(\\frac{-5}{10}\\).", loesungsweg: "\\(\\cos\\varphi = -\\tfrac{1}{2}\\), also \\(\\varphi = 120°\\)." },
      // LEVEL 4 -- Rechenregeln
      { id: 19, level: 4, typ: "mc", frage: "Welche Regel gilt NICHT?", optionen: ["\\(\\vec a \\cdot \\vec b = \\vec b \\cdot \\vec a\\)", "\\((r\\vec a)\\cdot \\vec b = r(\\vec a \\cdot \\vec b)\\)", "\\(\\vec a \\cdot (\\vec b + \\vec c) = \\vec a \\cdot \\vec b + \\vec a \\cdot \\vec c\\)", "\\((\\vec a \\cdot \\vec b)\\cdot \\vec c\\) ist definiert"], korrekt: 3, tipp: "Skalar mal Vektor ist erlaubt, aber die „Assoziativität“ gilt nicht.", loesungsweg: "\\(\\vec a \\cdot \\vec b\\) ist Zahl, Zahl \\(\\cdot \\vec c\\) ist Vektor — das ist kein Skalarprodukt mehr. Keine Assoziativität." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\((2\\vec a) \\cdot (3\\vec b)\\) bei \\(\\vec a \\cdot \\vec b = 5\\):", loesung: 30, toleranz: 0, tipp: "\\(2 \\cdot 3 \\cdot 5\\).", loesungsweg: "\\((2\\vec a)\\cdot(3\\vec b) = 6(\\vec a \\cdot \\vec b) = 30\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(\\vec a \\cdot (\\vec b + \\vec c)\\) bei \\(\\vec a \\cdot \\vec b = 4\\) und \\(\\vec a \\cdot \\vec c = 6\\):", loesung: 10, toleranz: 0, tipp: "Distributiv.", loesungsweg: "Das Skalarprodukt ist distributiv: $$\\vec a \\cdot (\\vec b + \\vec c) = \\vec a \\cdot \\vec b + \\vec a \\cdot \\vec c = 4 + 6 = 10$$ Die einzelnen Vektoren müssen dafür gar nicht bekannt sein." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(|\\vec a + \\vec b|^2 = |\\vec a|^2 + 2\\vec a \\cdot \\vec b + |\\vec b|^2\\). Für \\(|\\vec a|=3\\), \\(|\\vec b|=4\\), \\(\\vec a \\perp \\vec b\\):", loesung: 25, toleranz: 0, tipp: "\\(\\vec a \\cdot \\vec b = 0\\). \\(9+16\\).", loesungsweg: "\\(|\\vec a+\\vec b|^2 = 9+0+16 = 25\\). Also \\(|\\vec a+\\vec b| = 5\\) (Pythagoras!)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(\\vec a \\cdot \\vec b = 0\\), \\(|\\vec a|=1\\), \\(|\\vec b|=1\\). \\(|\\vec a - \\vec b|^2 = ?\\)", loesung: 2, toleranz: 0, tipp: "\\(1 - 2 \\cdot 0 + 1\\).", loesungsweg: "\\(|\\vec a-\\vec b|^2 = 1 + 1 = 2\\)." },
      { id: 24, level: 4, typ: "mc", frage: "Für die Einheitsvektoren \\(\\vec{e_1}, \\vec{e_2}, \\vec{e_3}\\) gilt:", optionen: ["\\(\\vec{e_i} \\cdot \\vec{e_j} = 1\\) für alle \\(i,j\\)", "\\(\\vec{e_i} \\cdot \\vec{e_j} = 1\\) wenn \\(i=j\\), sonst 0", "immer 0", "immer \\(i+j\\)"], korrekt: 1, tipp: "Orthonormalbasis.", loesungsweg: "Die Einheitsvektoren bilden eine Orthonormalbasis: Jeder hat die Länge \\(1\\), und je zwei verschiedene stehen senkrecht aufeinander. $$\\vec e_i \\cdot \\vec e_j = \\begin{cases}1 & i=j\\\\ 0 & i \\ne j\\end{cases}$$ Kurz geschrieben ist das das Kronecker-Delta \\(\\delta_{ij}\\). Genau diese Eigenschaft macht das Rechnen in Komponenten so bequem." },
      // LEVEL 5 -- zwei Bedingungen, Winkelvergleich, Projektion
      { id: 25, level: 5, typ: "numerisch", frage: "Gesucht ist ein Vektor \\(\\vec v = \\begin{pmatrix}x\\\\y\\\\0\\end{pmatrix}\\), der orthogonal zu \\(\\vec a = \\begin{pmatrix}3\\\\4\\\\0\\end{pmatrix}\\) ist und den Betrag 10 hat. Geben Sie das positive \\(x\\) an:", loesung: 8, toleranz: 0, tipp: "Zwei Bedingungen, zwei Gleichungen: Skalarprodukt gleich Null und Betragsbedingung.", loesungsweg: "Orthogonalität: \\(3x+4y = 0\\), also \\(y = -\\tfrac{3}{4}x\\). Betrag: \\(x^2+\\tfrac{9}{16}x^2 = 100\\), somit \\(\\tfrac{25}{16}x^2 = 100\\) und \\(x^2 = 64\\). Für \\(x = 8\\) ist \\(y = -6\\); Probe: \\(24-24 = 0\\) und \\(\\sqrt{64+36} = 10\\). Die zweite Lösung \\(x = -8\\), \\(y = 6\\) ist der Gegenvektor." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Schüler berechnet den Winkel zwischen \\(\\vec a = \\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}2\\\\-1\\\\2\\end{pmatrix}\\) mit \\(\\cos\\varphi = \\frac{\\vec a \\cdot \\vec b}{|\\vec a|+|\\vec b|}\\) und erhält \\(48{,}2^\\circ\\). Wie groß ist der Winkel wirklich (in Grad, auf 1 NK)?", loesung: 63.6, toleranz: 0.2, tipp: "Im Nenner der Winkelformel stehen die Beträge nicht als Summe.", loesungsweg: "\\(\\vec a \\cdot \\vec b = 2-2+4 = 4\\), \\(|\\vec a| = |\\vec b| = 3\\). Richtig ist \\(\\cos\\varphi = \\frac{4}{3 \\cdot 3} = \\frac{4}{9} \\approx 0{,}444\\), also \\(\\varphi \\approx 63{,}6^\\circ\\). Der Schüler rechnete \\(\\frac{4}{3+3} = \\frac{2}{3}\\) und kam auf \\(48{,}2^\\circ\\) — im Nenner steht aber das <b>Produkt</b> der Beträge." },
      { id: 27, level: 5, typ: "numerisch", frage: "Es gilt \\(|\\vec a| = 4\\), \\(|\\vec b| = 3\\) und \\(\\vec a \\cdot \\vec b = 6\\). Bestimmen Sie \\(|\\vec a - \\vec b|\\) (auf 2 NK):", loesung: 3.61, toleranz: 0.02, tipp: "Bilde das Skalarprodukt des Differenzvektors mit sich selbst und nutze die Rechengesetze.", loesungsweg: "\\((\\vec a-\\vec b) \\cdot (\\vec a-\\vec b) = |\\vec a|^2 - 2\\,\\vec a \\cdot \\vec b + |\\vec b|^2 = 16-12+9 = 13\\). Also \\(|\\vec a-\\vec b| = \\sqrt{13} \\approx 3{,}61\\). Die Vektoren selbst braucht man dafür nicht zu kennen." },
      { id: 28, level: 5, typ: "numerisch", frage: "Der Vektor \\(\\vec v = \\begin{pmatrix}x\\\\y\\\\1\\end{pmatrix}\\) ist orthogonal zu \\(\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\) und zu \\(\\begin{pmatrix}2\\\\1\\\\0\\end{pmatrix}\\). Bestimmen Sie \\(x\\):", loesung: 1, toleranz: 0, tipp: "Jede Orthogonalitätsbedingung gibt eine lineare Gleichung; löse das System aus beiden.", loesungsweg: "Erste Bedingung: \\(x+2y+3 = 0\\). Zweite Bedingung: \\(2x+y = 0\\), also \\(y = -2x\\). Einsetzen: \\(x-4x+3 = 0\\), somit \\(x = 1\\) und \\(y = -2\\). Probe: \\(1-4+3 = 0\\) und \\(2-2+0 = 0\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Im Dreieck \\(A(0|0|0)\\), \\(B(4|0|0)\\), \\(C(1|0|3)\\) ist der größte Innenwinkel gesucht (in Grad, auf 1 NK):", loesung: 71.6, toleranz: 0.2, tipp: "Berechne die Winkel an mehreren Ecken und vergleiche; die Winkelsumme dient als Kontrolle.", loesungsweg: "Bei \\(A\\): \\(\\vec{AB} = \\begin{pmatrix}4\\\\0\\\\0\\end{pmatrix}\\), \\(\\vec{AC} = \\begin{pmatrix}1\\\\0\\\\3\\end{pmatrix}\\), \\(\\cos\\alpha = \\frac{4}{4\\sqrt{10}} \\approx 0{,}316\\), also \\(\\alpha \\approx 71{,}6^\\circ\\). Bei \\(B\\): \\(\\vec{BA} = \\begin{pmatrix}-4\\\\0\\\\0\\end{pmatrix}\\), \\(\\vec{BC} = \\begin{pmatrix}-3\\\\0\\\\3\\end{pmatrix}\\), \\(\\cos\\beta = \\frac{12}{4\\sqrt{18}} \\approx 0{,}707\\), also \\(\\beta = 45^\\circ\\). Über die Winkelsumme bleibt \\(\\gamma \\approx 63{,}4^\\circ\\). Der größte Winkel liegt bei \\(A\\) mit etwa \\(71{,}6^\\circ\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Bestimmen Sie die Länge der Projektion von \\(\\vec b = \\begin{pmatrix}4\\\\3\\\\0\\end{pmatrix}\\) auf \\(\\vec a = \\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}\\) (auf 2 NK):", loesung: 3.33, toleranz: 0.02, tipp: "Die Projektionslänge entsteht aus dem Skalarprodukt, geteilt durch den Betrag des Vektors, auf den projiziert wird.", loesungsweg: "\\(\\vec a \\cdot \\vec b = 4+6+0 = 10\\) und \\(|\\vec a| = \\sqrt{1+4+4} = 3\\). Die Projektionslänge ist \\(\\frac{10}{3} \\approx 3{,}33\\). Gleichwertig: \\(|\\vec b|\\cos\\varphi\\) mit \\(|\\vec b| = 5\\) und \\(\\cos\\varphi = \\frac{10}{15}\\)." },
      // LEVEL 6 -- Abi-Format: Neigung, Rechteck, Arbeit
      { id: 31, level: 6, typ: "numerisch", frage: "Eine Rampe führt geradlinig von \\(R(0|0|0)\\) zum Punkt \\(Q(12|9|5)\\) (Angaben in Metern). Beurteilen Sie, ob ihr Neigungswinkel gegen die Waagerechte unter \\(20^\\circ\\) bleibt, und geben Sie ihn an (in Grad, auf 1 NK):", loesung: 18.4, toleranz: 0.2, tipp: "Vergleiche den Rampenvektor mit seinem Schatten in der Grundebene; der Winkel zwischen beiden ist die Neigung.", loesungsweg: "\\(\\vec{RQ} = \\begin{pmatrix}12\\\\9\\\\5\\end{pmatrix}\\) mit \\(|\\vec{RQ}| = \\sqrt{250} \\approx 15{,}81\\). Der waagerechte Anteil ist \\(\\begin{pmatrix}12\\\\9\\\\0\\end{pmatrix}\\) mit dem Betrag 15. Skalarprodukt: \\(144+81+0 = 225\\), also \\(\\cos\\varphi = \\frac{225}{15{,}81 \\cdot 15} \\approx 0{,}949\\) und \\(\\varphi \\approx 18{,}4^\\circ\\). Die Vorgabe ist damit erfüllt." },
      { id: 32, level: 6, typ: "numerisch", frage: "Eine Dachfläche hat die Ecken \\(A(0|0|0)\\), \\(B(6|0|0)\\), \\(C(6|3|2)\\) und \\(D(0|3|2)\\) (Angaben in Metern). Zeigen Sie, dass sie ein Rechteck ist, und geben Sie ihren Flächeninhalt an (in Quadratmetern, auf 2 NK):", loesung: 21.63, toleranz: 0.05, tipp: "Prüfe zuerst, ob gegenüberliegende Seiten gleiche Vektoren sind, dann die Rechtwinkligkeit über ein Skalarprodukt.", loesungsweg: "\\(\\vec{AB} = \\begin{pmatrix}6\\\\0\\\\0\\end{pmatrix}\\) und \\(\\vec{DC} = \\begin{pmatrix}6\\\\0\\\\0\\end{pmatrix}\\) sind gleich, also ist \\(ABCD\\) ein Parallelogramm. Mit \\(\\vec{AD} = \\begin{pmatrix}0\\\\3\\\\2\\end{pmatrix}\\) gilt \\(\\vec{AB} \\cdot \\vec{AD} = 0+0+0 = 0\\): die Ecke bei \\(A\\) ist rechtwinklig, im Parallelogramm sind dann alle vier Ecken rechtwinklig. Flächeninhalt \\(= |\\vec{AB}| \\cdot |\\vec{AD}| = 6\\sqrt{13} \\approx 21{,}63\\)." },
      { id: 33, level: 6, typ: "mc", frage: "Beurteilen Sie: Aus \\(\\vec a \\cdot \\vec b = \\vec a \\cdot \\vec c\\) folgt \\(\\vec b = \\vec c\\).", optionen: ["Falsch, nur die Anteile längs \\(\\vec a\\) stimmen überein", "Richtig, man darf durch \\(\\vec a\\) kürzen", "Falsch, es folgt sogar nie \\(\\vec b = \\vec c\\)", "Richtig, sofern \\(\\vec a\\) nicht der Nullvektor ist"], korrekt: 0, tipp: "Bringe alles auf eine Seite und überlege, was ein Skalarprodukt mit dem Wert Null aussagt.", loesungsweg: "Aus \\(\\vec a \\cdot \\vec b - \\vec a \\cdot \\vec c = 0\\) folgt \\(\\vec a \\cdot (\\vec b-\\vec c) = 0\\). Das heißt nur: \\(\\vec b-\\vec c\\) ist orthogonal zu \\(\\vec a\\) — nicht, dass er der Nullvektor ist. Gegenbeispiel: mit \\(\\vec a = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\), \\(\\vec b = \\begin{pmatrix}2\\\\5\\\\0\\end{pmatrix}\\), \\(\\vec c = \\begin{pmatrix}2\\\\0\\\\7\\end{pmatrix}\\) ergibt beides den Wert 2, obwohl \\(\\vec b \\neq \\vec c\\). Kürzen ist beim Skalarprodukt nicht erlaubt. Gleich sind lediglich die Projektionen auf \\(\\vec a\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für zwei Werte von \\(k\\) sind \\(\\vec a = \\begin{pmatrix}k\\\\1\\\\0\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}k\\\\-4\\\\0\\end{pmatrix}\\) orthogonal. Geben Sie den positiven Wert an:", loesung: 2, toleranz: 0, tipp: "Das Skalarprodukt Null führt hier auf eine quadratische Gleichung — beide Lösungen prüfen.", loesungsweg: "\\(\\vec a \\cdot \\vec b = k \\cdot k + 1 \\cdot (-4) + 0 = k^2-4\\). Aus \\(k^2-4 = 0\\) folgt \\(k = 2\\) oder \\(k = -2\\). Beide erfüllen die Bedingung: für \\(k = 2\\) ist \\(4-4 = 0\\), für \\(k = -2\\) ebenso. Gefragt ist der positive Wert \\(k = 2\\); dann sind \\(\\begin{pmatrix}2\\\\1\\\\0\\end{pmatrix}\\) und \\(\\begin{pmatrix}2\\\\-4\\\\0\\end{pmatrix}\\) orthogonal." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Schlitten wird mit der Kraft \\(\\vec F = \\begin{pmatrix}60\\\\0\\\\45\\end{pmatrix}\\) (in Newton) längs des Weges \\(\\vec s = \\begin{pmatrix}8\\\\0\\\\0\\end{pmatrix}\\) (in Metern) gezogen. Berechnen Sie die verrichtete Arbeit (in Joule) und beurteilen Sie, welcher Kraftanteil dabei nichts beiträgt:", loesung: 480, toleranz: 0, tipp: "Arbeit ist das Skalarprodukt aus Kraft und Weg; nur der Kraftanteil in Wegrichtung trägt bei.", loesungsweg: "\\(W = \\vec F \\cdot \\vec s = 60 \\cdot 8 + 0 \\cdot 0 + 45 \\cdot 0 = 480\\) Joule. Der senkrechte Anteil von 45 N zeigt nach oben, steht also orthogonal zum Weg und liefert den Beitrag \\(45 \\cdot 0 = 0\\). Er würde erst zählen, wenn der Weg eine Höhenkomponente hätte." },
      { id: 36, level: 6, typ: "numerisch", frage: "Drei Messpunkte eines Geländes liegen in \\(A(2|1|0)\\), \\(B(6|4|0)\\) und \\(C(2|4|4)\\) (Angaben in Metern). Beurteilen Sie, ob das Dreieck bei \\(A\\) rechtwinklig ist, und geben Sie den Winkel bei \\(A\\) an (in Grad, auf 1 NK):", loesung: 68.9, toleranz: 0.2, tipp: "Bilde die beiden von \\(A\\) ausgehenden Verbindungsvektoren; ihr Skalarprodukt entscheidet über die Rechtwinkligkeit.", loesungsweg: "\\(\\vec{AB} = \\begin{pmatrix}4\\\\3\\\\0\\end{pmatrix}\\) und \\(\\vec{AC} = \\begin{pmatrix}0\\\\3\\\\4\\end{pmatrix}\\), beide mit dem Betrag 5. Das Skalarprodukt ist \\(0+9+0 = 9 \\neq 0\\): bei \\(A\\) ist das Dreieck <b>nicht</b> rechtwinklig. \\(\\cos\\alpha = \\frac{9}{25} = 0{,}36\\) liefert \\(\\alpha \\approx 68{,}9^\\circ\\). Wegen gleicher Beträge ist das Dreieck gleichschenklig." }];
