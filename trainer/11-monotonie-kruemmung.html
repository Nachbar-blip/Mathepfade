<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monotonie & Krümmung - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-monotonie-kruemmung';
    const THEMA_CONFIG = { name: 'Monotonie & Krümmung', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "\\(f'(2) = 5\\). Was gilt bei \\(x=2\\)?", optionen: ["streng monoton steigend", "streng monoton fallend", "Extrempunkt", "Keine Aussage"], korrekt: 0, tipp: "\\(f' > 0\\) → steigend.", loesungsweg: "Die Ableitung ist die Tangentensteigung. Ein positiver Wert bedeutet also eine steigende Tangente: $$f'(2) = 5 > 0 \\;\\Rightarrow\\; f \\text{ steigt bei } x=2$$ Über einen Extrempunkt sagt das nichts aus — dort müsste \\(f'\\) null sein." },
      { id: 2, level: 1, typ: "mc", frage: "\\(f'(3) = -2\\). Steigend oder fallend?", optionen: ["steigend", "fallend", "weder noch", "unbestimmt"], korrekt: 1, tipp: "Vorzeichen.", loesungsweg: "$$f'(3) = -2 < 0$$ Eine negative Steigung bedeutet, dass der Graph an dieser Stelle fällt. Dass der Wert dem Betrag nach klein ist, heißt nur, dass das Gefälle flach ist." },
      { id: 3, level: 1, typ: "mc", frage: "\\(f'(x_0) = 0\\). Was folgt sicher?", optionen: ["Maximum", "Minimum", "waagerechte Tangente", "steigend"], korrekt: 2, tipp: "Sattelpunkt auch möglich.", loesungsweg: "Nur waagerechte Tangente. Extremum nicht sicher (z.B. \\(x^3\\))." },
      { id: 4, level: 1, typ: "mc", frage: "\\(f'(1)=3, f'(2)=-1, f'(3)=0\\). Wo fällt \\(f\\)?", optionen: ["\\(x=1\\)", "\\(x=2\\)", "\\(x=3\\)", "nirgends"], korrekt: 1, tipp: "\\(f' < 0\\) suchen.", loesungsweg: "Bei \\(x=2\\): \\(f'=-1<0\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Was heißt \\(f''(x) > 0\\)?", optionen: ["linksgekrümmt (konvex)", "rechtsgekrümmt", "steigend", "Maximum"], korrekt: 0, tipp: "2. Ableitung = Krümmung.", loesungsweg: "Die zweite Ableitung beschreibt, wie sich die <b>Steigung</b> ändert. Ist \\(f'' > 0\\), so nimmt \\(f'\\) zu: Der Graph wird immer steiler, er krümmt sich nach links. $$f'' > 0 \\;\\Rightarrow\\; \\text{linksgekrümmt (konvex)}$$ Anschaulich ist das die Schüsselform — wie bei der Normalparabel, für die \\(f'' = 2 > 0\\) überall gilt." },
      { id: 6, level: 1, typ: "mc", frage: "Bedingung für streng monoton fallend?", optionen: ["\\(f' > 0\\)", "\\(f' < 0\\)", "\\(f' = 0\\)", "\\(f' \\geq 0\\)"], korrekt: 1, tipp: "Monotoniesatz.", loesungsweg: "Nach dem Monotoniesatz ist \\(f\\) auf einem Intervall genau dann streng monoton fallend, wenn dort $$f'(x) < 0$$ gilt. Das Kleinerzeichen ist dabei streng — bei \\(f' \\le 0\\) wären auch waagerechte Stücke erlaubt, und die Funktion wäre nur monoton, nicht streng monoton fallend." },
      // LEVEL 2
      { id: 7, level: 2, typ: "mc", frage: "\\(f(x) = x^2 - 4x + 3\\). Wo steigend?", optionen: ["\\((-\\infty, 2)\\)", "\\((2, \\infty)\\)", "ganz \\(\\mathbb{R}\\)", "\\((-2,2)\\)"], korrekt: 1, tipp: "\\(f'>0\\).", loesungsweg: "\\(f'(x)=2x-4>0 \\Rightarrow x>2\\)." },
      { id: 8, level: 2, typ: "mc", frage: "\\(f(x) = -x^2 + 6x\\). Wo fallend?", optionen: ["\\((-\\infty,3)\\)", "\\((3,\\infty)\\)", "\\((-\\infty,-3)\\)", "\\((-3,3)\\)"], korrekt: 1, tipp: "\\(f' < 0\\).", loesungsweg: "\\(f'(x)=-2x+6<0 \\Rightarrow x>3\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(f(x) = x^2 - 6x + 5\\). An welcher Stelle wechselt \\(f\\) von fallend zu steigend?", loesung: 3, toleranz: 0, tipp: "\\(f'=0\\).", loesungsweg: "\\(2x-6=0 \\Rightarrow x=3\\)." },
      { id: 10, level: 2, typ: "mc", frage: "\\(f(x) = 2x^3\\). Aussage?", optionen: ["überall streng monoton steigend", "überall fallend", "steigt nur für \\(x>0\\)", "Extremum bei \\(0\\)"], korrekt: 0, tipp: "\\(f'(x)=6x^2 \\geq 0\\).", loesungsweg: "\\(f'\\geq 0\\), nur bei \\(x=0\\) gleich 0 → streng monoton steigend." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x) = x^2 + 2x - 8\\). \\(f'(1)\\)?", loesung: 4, toleranz: 0, tipp: "\\(f'(x)=2x+2\\).", loesungsweg: "$$f'(x) = 2x+2 \\;\\Rightarrow\\; f'(1) = 2+2 = 4$$ Das konstante Glied \\(-8\\) fällt beim Ableiten weg — es verschiebt den Graphen nur, ohne die Steigung zu ändern." },
      { id: 12, level: 2, typ: "mc", frage: "\\(f(x) = \\frac{1}{3}x^3 - 3x\\). Wo fallend?", optionen: ["\\((-\\sqrt 3, \\sqrt 3)\\)", "\\((-\\infty,-\\sqrt 3)\\cup(\\sqrt 3,\\infty)\\)", "\\((0,\\sqrt 3)\\)", "\\((-\\sqrt 3, 0)\\)"], korrekt: 0, tipp: "\\(f'(x)=x^2-3<0\\).", loesungsweg: "$$f'(x) = x^2 - 3 < 0 \\;\\Rightarrow\\; x^2 < 3 \\;\\Rightarrow\\; -\\sqrt3 < x < \\sqrt3$$ Die Funktion fällt also zwischen den beiden Extremstellen. Beim Auflösen einer quadratischen Ungleichung entsteht ein <b>Intervall</b> zwischen den Nullstellen, nicht außerhalb — das Ungleichheitszeichen entscheidet darüber." },
      // LEVEL 3
      { id: 13, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x^2+2\\). Wo steigend?", optionen: ["\\((-\\infty,0)\\cup(2,\\infty)\\)", "\\((0,2)\\)", "\\((-\\infty,-1)\\cup(3,\\infty)\\)", "\\((1,\\infty)\\)"], korrekt: 0, tipp: "\\(f'=3x(x-2)\\).", loesungsweg: "$$f'(x) = 3x^2-6x = 3x(x-2)$$ Das Produkt ist positiv, wenn beide Faktoren dasselbe Vorzeichen haben — also für \\(x < 0\\) (beide negativ) oder \\(x > 2\\) (beide positiv): $$f \\text{ steigt auf } (-\\infty;0) \\cup (2;\\infty)$$ Zwischen \\(0\\) und \\(2\\) fällt sie; dort liegen Hoch- und Tiefpunkt." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). \\(f''(0)\\)?", loesung: -12, toleranz: 0, tipp: "\\(f''(x)=6x-12\\).", loesungsweg: "Zweimal ableiten: \\(f'(x) = 3x^2-12x+9\\), also \\(f''(x) = 6x-12\\). $$f''(0) = -12$$ Das negative Vorzeichen bedeutet Rechtskrümmung an der Stelle \\(0\\)." },
      { id: 15, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x\\). Wo rechtsgekrümmt?", optionen: ["\\((-\\infty,0)\\)", "\\((0,\\infty)\\)", "\\((-\\infty,1)\\)", "\\((-1,1)\\)"], korrekt: 0, tipp: "\\(f''(x)=6x<0\\).", loesungsweg: "Rechtskrümmung (konkav) liegt vor, wo die zweite Ableitung negativ ist: $$f''(x) = 6x < 0 \\;\\Rightarrow\\; x < 0$$ Also auf \\((-\\infty;0)\\). Bei \\(x = 0\\) wechselt das Vorzeichen — dort liegt der Wendepunkt." },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(f(x)=2x^3-12x^2+18x\\). Größte Nullstelle von \\(f'\\)?", loesung: 3, toleranz: 0, tipp: "Faktorisieren.", loesungsweg: "$$f'(x) = 6x^2-24x+18 = 6(x^2-4x+3) = 6(x-1)(x-3)$$ Die Nullstellen sind \\(1\\) und \\(3\\), die größte also \\(3\\). Das Ausklammern der \\(6\\) vereinfacht das Faktorisieren erheblich." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x)=-x^3+6x^2-9x+2\\). Wo fallend?", optionen: ["\\((-\\infty,1)\\cup(3,\\infty)\\)", "\\((1,3)\\)", "\\((-\\infty,0)\\)", "\\((0,3)\\)"], korrekt: 0, tipp: "\\(f'(x)=-3(x-1)(x-3)\\).", loesungsweg: "$$f'(x) = -3x^2+12x-9 = -3(x-1)(x-3)$$ Wegen des Minuszeichens ist \\(f'\\) genau dort negativ, wo \\((x-1)(x-3)\\) positiv ist — also <b>außerhalb</b> von \\([1;3]\\): $$f \\text{ fällt auf } (-\\infty;1) \\cup (3;\\infty)$$ Bei einer nach unten geöffneten Parabel als Ableitung kehren sich die Intervalle gegenüber dem Normalfall um." },
      { id: 18, level: 3, typ: "mc", frage: "\\(f''(x)=-6x+12\\). Krümmung?", optionen: ["Links bis \\(x=2\\), dann rechts", "Rechts bis \\(x=2\\), dann links", "überall links", "überall rechts"], korrekt: 0, tipp: "Wendestelle bei 2.", loesungsweg: "Vorzeichen der zweiten Ableitung untersuchen: $$f''(x) = -6x+12 > 0 \\;\\Leftrightarrow\\; x < 2$$ Bis \\(x = 2\\) ist der Graph also linksgekrümmt, danach rechtsgekrümmt. An der Stelle \\(2\\) wechselt die Krümmung — dort liegt der Wendepunkt." },
      // LEVEL 4
      { id: 19, level: 4, typ: "mc", frage: "\\(f(x)=x^4-4x^3\\). Monotonie?", optionen: ["Fallend bis 3, dann steigend", "Steigend bis 0, fallend bis 3, steigend", "Fallend bis 0, steigend", "Steigend außer \\((0,3)\\)"], korrekt: 0, tipp: "\\(f'=4x^2(x-3)\\), \\(4x^2\\geq 0\\).", loesungsweg: "\\((x-3)\\) bestimmt Vorzeichen: fallend bis 3, dann steigend." },
      { id: 20, level: 4, typ: "mc", frage: "\\(f(x)=x^3-6x^2+12x-5\\). Krümmung?", optionen: ["Rechts bis 2, dann links", "Links bis 2, dann rechts", "überall links", "überall rechts"], korrekt: 0, tipp: "\\(f''(x)=6x-12\\).", loesungsweg: "$$f'(x) = 3x^2-12x+12 \\;\\Rightarrow\\; f''(x) = 6x-12$$ $$f''(x) < 0 \\;\\Leftrightarrow\\; x < 2$$ Bis \\(x = 2\\) ist der Graph rechtsgekrümmt, danach linksgekrümmt. Das ist das typische Bild einer Funktion dritten Grades mit positivem Leitkoeffizienten." },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). Positive Wendestelle? (2 Dezimalen)", loesung: 1.15, toleranz: 0.02, tipp: "\\(f''=12x^2-16\\).", loesungsweg: "\\(x^2=4/3 \\Rightarrow x \\approx 1{,}15\\)." },
      { id: 22, level: 4, typ: "mc", frage: "\\(f'(x)=(x+1)(x-2)^2\\). Wo steigend?", optionen: ["\\((-1,\\infty)\\) außer \\(x=2\\)", "\\((-\\infty,-1)\\)", "\\((-1,2)\\) und \\((2,\\infty)\\)", "\\((-\\infty,-1)\\cup(2,\\infty)\\)"], korrekt: 2, tipp: "\\((x-2)^2\\geq 0\\).", loesungsweg: "Vorzeichen von \\(f'\\) hängt von \\((x+1)\\) ab → steigend auf \\((-1,2)\\cup(2,\\infty)\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{4}x^4-2x^2+1\\). Positive Wendestelle? (2 Dez.)", loesung: 1.15, toleranz: 0.02, tipp: "\\(f''(x)=3x^2-4\\).", loesungsweg: "\\(x^2=4/3 \\Rightarrow x\\approx 1{,}15\\)." },
      { id: 24, level: 4, typ: "mc", frage: "\\(f''(x)=6x-12\\). Krümmungsverhalten?", optionen: ["Rechts bei \\(x<2\\), links bei \\(x>2\\)", "Links bei \\(x<2\\), rechts bei \\(x>2\\)", "überall links", "überall rechts"], korrekt: 0, tipp: "Vorzeichen prüfen.", loesungsweg: "$$6x-12 < 0 \\;\\Leftrightarrow\\; x < 2 \\qquad 6x-12 > 0 \\;\\Leftrightarrow\\; x > 2$$ Also Rechtskrümmung für \\(x < 2\\), Linkskrümmung für \\(x > 2\\). Weil \\(f''\\) hier linear ist und das Vorzeichen wechselt, ist \\(x = 2\\) sicher eine Wendestelle." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2+7\\). Anzahl Wendepunkte?", loesung: 2, toleranz: 0, tipp: "\\(f''=12x^2-16\\).", loesungsweg: "Zwei Lösungen \\(\\pm 2/\\sqrt 3\\), VZW → 2 Wendepunkte." },
      { id: 26, level: 5, typ: "mc", frage: "\\(f(x)=x^4-4x^3+4x^2\\). Wo steigend?", optionen: ["\\((0,1)\\cup(2,\\infty)\\)", "\\((-\\infty,0)\\cup(1,2)\\)", "\\((0,\\infty)\\)", "\\((1,\\infty)\\)"], korrekt: 0, tipp: "\\(f'=4x(x-1)(x-2)\\).", loesungsweg: "$$f'(x) = 4x^3-12x^2+8x = 4x(x^2-3x+2) = 4x(x-1)(x-2)$$ Mit einer Vorzeichentabelle über die Nullstellen \\(0\\), \\(1\\), \\(2\\): negativ für \\(x<0\\), positiv auf \\((0;1)\\), negativ auf \\((1;2)\\), positiv ab \\(2\\). $$f \\text{ steigt auf } (0;1) \\cup (2;\\infty)$$ Bei drei Nullstellen wechselt das Vorzeichen dreimal — Nachbarintervalle sind deshalb stets gegensätzlich." },
      { id: 27, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-12x+5\\). Länge des fallenden Intervalls?", loesung: 4, toleranz: 0, tipp: "\\(f'(x)=3(x-2)(x+2)\\).", loesungsweg: "$$f'(x) = 3x^2-12 = 3(x-2)(x+2) < 0 \\;\\Leftrightarrow\\; -2 < x < 2$$ Die Funktion fällt auf \\((-2;2)\\), das Intervall hat die Länge $$2-(-2) = 4$$" },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2\\). x-Wert des Wendepunkts?", loesung: 1, toleranz: 0, tipp: "\\(f''(x)=6x-6\\).", loesungsweg: "\\(6x-6=0 \\Rightarrow x=1\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-2x^2\\). \\(f''(0)\\)?", loesung: -4, toleranz: 0, tipp: "\\(f''=12x^2-4\\).", loesungsweg: "$$f'(x) = 4x^3-4x \\;\\Rightarrow\\; f''(x) = 12x^2-4$$ $$f''(0) = -4$$ Der Graph ist im Ursprung also rechtsgekrümmt — dort liegt der lokale Hochpunkt zwischen den beiden Tiefpunkten." },
      { id: 30, level: 5, typ: "mc", frage: "\\(f'(x_0)=0\\) und \\(f''(x_0)>0\\). Was gilt?", optionen: ["Hochpunkt", "Tiefpunkt", "Wendepunkt", "Sattelpunkt"], korrekt: 1, tipp: "Hinreichende Bedingung.", loesungsweg: "\\(f'(x_0) = 0\\) ist die notwendige Bedingung für eine Extremstelle; das Vorzeichen von \\(f''\\) entscheidet über die Art. Bei Linkskrümmung öffnet sich der Graph nach oben: $$f''(x_0) > 0 \\;\\Rightarrow\\; \\text{Tiefpunkt}$$ Umgekehrt ergäbe \\(f''(x_0) < 0\\) einen Hochpunkt; bei \\(f''(x_0) = 0\\) ist noch keine Entscheidung möglich." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+4\\). Anzahl der Wendepunkte?", loesung: 1, toleranz: 0, tipp: "\\(f''=6x-6\\).", loesungsweg: "Eine Nullstelle mit VZW → 1 Wendepunkt." },
      { id: 32, level: 6, typ: "mc", frage: "Eine Funktion \\(f\\) ist auf \\(\\mathbb{R}\\) überall linksgekrümmt. Welche Aussage stimmt?", optionen: ["\\(f''(x) \\geq 0\\) für alle \\(x\\)", "\\(f'(x) > 0\\) für alle \\(x\\)", "\\(f\\) hat keine Nullstellen", "\\(f\\) hat höchstens 1 Extremum"], korrekt: 0, tipp: "Krümmung ↔ \\(f''\\).", loesungsweg: "Linksgekrümmt ⟺ \\(f'' \\geq 0\\). Extremum ja möglich (Minimum), aber höchstens eins." },
      { id: 33, level: 6, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{3}x^3-x^2\\). An welcher Stelle ist die Krümmung 0?", loesung: 1, toleranz: 0, tipp: "\\(f''(x)=2x-2\\).", loesungsweg: "Die Krümmung wird durch \\(f''\\) gemessen, gesucht ist also deren Nullstelle. Mit \\(f'(x) = x^2-2x\\) folgt \\(f''(x) = 2x-2\\): $$2x-2 = 0 \\;\\Rightarrow\\; x = 1$$ Da \\(f''\\) dort das Vorzeichen wechselt, ist \\(x = 1\\) zugleich Wendestelle." },
      { id: 34, level: 6, typ: "mc", frage: "Gegeben \\(f(x)=x^2+bx+c\\). Wo ist \\(f\\) streng monoton steigend?", optionen: ["\\((-b/2,\\infty)\\)", "\\((-\\infty,-b/2)\\)", "\\((-c,\\infty)\\)", "ganz \\(\\mathbb{R}\\)"], korrekt: 0, tipp: "\\(f'(x)=2x+b\\).", loesungsweg: "$$f'(x) = 2x+b > 0 \\;\\Rightarrow\\; x > -\\frac{b}{2}$$ Die Funktion steigt also auf \\(\\left(-\\tfrac b2; \\infty\\right)\\). Das ist gerade der Bereich rechts des Scheitels — bei jeder nach oben geöffneten Parabel. Das Absolutglied \\(c\\) spielt dabei keine Rolle, weil es beim Ableiten wegfällt." },
      { id: 35, level: 6, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{4}x^4-x^3\\). Wie viele Wendepunkte?", loesung: 2, toleranz: 0, tipp: "\\(f''=3x^2-6x\\).", loesungsweg: "\\(f''=3x(x-2)\\). Zwei Nullstellen mit VZW." },
      { id: 36, level: 6, typ: "numerisch", frage: "\\(f(x)=x^4-6x^2\\). Anzahl Wendepunkte?", loesung: 2, toleranz: 0, tipp: "\\(f''=12x^2-12\\).", loesungsweg: "\\(x=\\pm 1\\), beide mit VZW → 2 Wendepunkte." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
