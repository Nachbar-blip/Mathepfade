<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monotonie & Krümmung - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-monotonie-kruemmung';
    const THEMA_CONFIG = { name: 'Monotonie & Krümmung', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "\\(f'(2) = 5\\). Was gilt bei \\(x=2\\)?", optionen: ["streng monoton steigend", "streng monoton fallend", "Extrempunkt", "Keine Aussage"], korrekt: 0, tipp: "\\(f' > 0\\) → steigend.", loesungsweg: "\\(f'(2) = 5 > 0\\): \\(f\\) steigt." },
      { id: 2, level: 1, typ: "mc", frage: "\\(f'(3) = -2\\). Steigend oder fallend?", optionen: ["steigend", "fallend", "weder noch", "unbestimmt"], korrekt: 1, tipp: "Vorzeichen.", loesungsweg: "\\(f' < 0\\) → fallend." },
      { id: 3, level: 1, typ: "mc", frage: "\\(f'(x_0) = 0\\). Was folgt sicher?", optionen: ["Maximum", "Minimum", "waagerechte Tangente", "steigend"], korrekt: 2, tipp: "Sattelpunkt auch möglich.", loesungsweg: "Nur waagerechte Tangente. Extremum nicht sicher (z.B. \\(x^3\\))." },
      { id: 4, level: 1, typ: "mc", frage: "\\(f'(1)=3, f'(2)=-1, f'(3)=0\\). Wo fällt \\(f\\)?", optionen: ["\\(x=1\\)", "\\(x=2\\)", "\\(x=3\\)", "nirgends"], korrekt: 1, tipp: "\\(f' < 0\\) suchen.", loesungsweg: "Bei \\(x=2\\): \\(f'=-1<0\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Was heißt \\(f''(x) > 0\\)?", optionen: ["linksgekrümmt (konvex)", "rechtsgekrümmt", "steigend", "Maximum"], korrekt: 0, tipp: "2. Ableitung = Krümmung.", loesungsweg: "\\(f'' > 0\\) → linksgekrümmt (Schüsselform)." },
      { id: 6, level: 1, typ: "mc", frage: "Bedingung für streng monoton fallend?", optionen: ["\\(f' > 0\\)", "\\(f' < 0\\)", "\\(f' = 0\\)", "\\(f' \\geq 0\\)"], korrekt: 1, tipp: "Monotoniesatz.", loesungsweg: "\\(f'(x) < 0\\) auf ganzem Intervall." },
      // LEVEL 2
      { id: 7, level: 2, typ: "mc", frage: "\\(f(x) = x^2 - 4x + 3\\). Wo steigend?", optionen: ["\\((-\\infty, 2)\\)", "\\((2, \\infty)\\)", "ganz \\(\\mathbb{R}\\)", "\\((-2,2)\\)"], korrekt: 1, tipp: "\\(f'>0\\).", loesungsweg: "\\(f'(x)=2x-4>0 \\Rightarrow x>2\\)." },
      { id: 8, level: 2, typ: "mc", frage: "\\(f(x) = -x^2 + 6x\\). Wo fallend?", optionen: ["\\((-\\infty,3)\\)", "\\((3,\\infty)\\)", "\\((-\\infty,-3)\\)", "\\((-3,3)\\)"], korrekt: 1, tipp: "\\(f' < 0\\).", loesungsweg: "\\(f'(x)=-2x+6<0 \\Rightarrow x>3\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(f(x) = x^2 - 6x + 5\\). An welcher Stelle wechselt \\(f\\) von fallend zu steigend?", loesung: 3, toleranz: 0, tipp: "\\(f'=0\\).", loesungsweg: "\\(2x-6=0 \\Rightarrow x=3\\)." },
      { id: 10, level: 2, typ: "mc", frage: "\\(f(x) = 2x^3\\). Aussage?", optionen: ["überall streng monoton steigend", "überall fallend", "steigt nur für \\(x>0\\)", "Extremum bei \\(0\\)"], korrekt: 0, tipp: "\\(f'(x)=6x^2 \\geq 0\\).", loesungsweg: "\\(f'\\geq 0\\), nur bei \\(x=0\\) gleich 0 → streng monoton steigend." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x) = x^2 + 2x - 8\\). \\(f'(1)\\)?", loesung: 4, toleranz: 0, tipp: "\\(f'(x)=2x+2\\).", loesungsweg: "\\(f'(1) = 4\\)." },
      { id: 12, level: 2, typ: "mc", frage: "\\(f(x) = \\frac{1}{3}x^3 - 3x\\). Wo fallend?", optionen: ["\\((-\\sqrt 3, \\sqrt 3)\\)", "\\((-\\infty,-\\sqrt 3)\\cup(\\sqrt 3,\\infty)\\)", "\\((0,\\sqrt 3)\\)", "\\((-\\sqrt 3, 0)\\)"], korrekt: 0, tipp: "\\(f'(x)=x^2-3<0\\).", loesungsweg: "\\(x^2<3 \\Rightarrow -\\sqrt 3 < x < \\sqrt 3\\)." },
      // LEVEL 3
      { id: 13, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x^2+2\\). Wo steigend?", optionen: ["\\((-\\infty,0)\\cup(2,\\infty)\\)", "\\((0,2)\\)", "\\((-\\infty,-1)\\cup(3,\\infty)\\)", "\\((1,\\infty)\\)"], korrekt: 0, tipp: "\\(f'=3x(x-2)\\).", loesungsweg: "\\(f'>0\\) für \\(x<0\\) oder \\(x>2\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). \\(f''(0)\\)?", loesung: -12, toleranz: 0, tipp: "\\(f''(x)=6x-12\\).", loesungsweg: "\\(f''(0)=-12\\)." },
      { id: 15, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x\\). Wo rechtsgekrümmt?", optionen: ["\\((-\\infty,0)\\)", "\\((0,\\infty)\\)", "\\((-\\infty,1)\\)", "\\((-1,1)\\)"], korrekt: 0, tipp: "\\(f''(x)=6x<0\\).", loesungsweg: "\\(6x<0 \\Rightarrow x<0\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(f(x)=2x^3-12x^2+18x\\). Größte Nullstelle von \\(f'\\)?", loesung: 3, toleranz: 0, tipp: "Faktorisieren.", loesungsweg: "\\(f'(x)=6(x-1)(x-3)\\). Größte: 3." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x)=-x^3+6x^2-9x+2\\). Wo fallend?", optionen: ["\\((-\\infty,1)\\cup(3,\\infty)\\)", "\\((1,3)\\)", "\\((-\\infty,0)\\)", "\\((0,3)\\)"], korrekt: 0, tipp: "\\(f'(x)=-3(x-1)(x-3)\\).", loesungsweg: "\\(f'<0\\) außerhalb \\([1,3]\\)." },
      { id: 18, level: 3, typ: "mc", frage: "\\(f''(x)=-6x+12\\). Krümmung?", optionen: ["Links bis \\(x=2\\), dann rechts", "Rechts bis \\(x=2\\), dann links", "überall links", "überall rechts"], korrekt: 0, tipp: "Wendestelle bei 2.", loesungsweg: "\\(f''>0\\) für \\(x<2\\) (links), \\(f''<0\\) für \\(x>2\\) (rechts)." },
      // LEVEL 4
      { id: 19, level: 4, typ: "mc", frage: "\\(f(x)=x^4-4x^3\\). Monotonie?", optionen: ["Fallend bis 3, dann steigend", "Steigend bis 0, fallend bis 3, steigend", "Fallend bis 0, steigend", "Steigend außer \\((0,3)\\)"], korrekt: 0, tipp: "\\(f'=4x^2(x-3)\\), \\(4x^2\\geq 0\\).", loesungsweg: "\\((x-3)\\) bestimmt Vorzeichen: fallend bis 3, dann steigend." },
      { id: 20, level: 4, typ: "mc", frage: "\\(f(x)=x^3-6x^2+12x-5\\). Krümmung?", optionen: ["Rechts bis 2, dann links", "Links bis 2, dann rechts", "überall links", "überall rechts"], korrekt: 0, tipp: "\\(f''(x)=6x-12\\).", loesungsweg: "\\(f''<0\\) für \\(x<2\\) (rechts), \\(f''>0\\) für \\(x>2\\) (links)." },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2\\). Positive Wendestelle? (2 Dezimalen)", loesung: 1.15, toleranz: 0.02, tipp: "\\(f''=12x^2-16\\).", loesungsweg: "\\(x^2=4/3 \\Rightarrow x \\approx 1{,}15\\)." },
      { id: 22, level: 4, typ: "mc", frage: "\\(f'(x)=(x+1)(x-2)^2\\). Wo steigend?", optionen: ["\\((-1,\\infty)\\) außer \\(x=2\\)", "\\((-\\infty,-1)\\)", "\\((-1,2)\\) und \\((2,\\infty)\\)", "\\((-\\infty,-1)\\cup(2,\\infty)\\)"], korrekt: 2, tipp: "\\((x-2)^2\\geq 0\\).", loesungsweg: "Vorzeichen von \\(f'\\) hängt von \\((x+1)\\) ab → steigend auf \\((-1,2)\\cup(2,\\infty)\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{4}x^4-2x^2+1\\). Positive Wendestelle? (2 Dez.)", loesung: 1.15, toleranz: 0.02, tipp: "\\(f''(x)=3x^2-4\\).", loesungsweg: "\\(x^2=4/3 \\Rightarrow x\\approx 1{,}15\\)." },
      { id: 24, level: 4, typ: "mc", frage: "\\(f''(x)=6x-12\\). Krümmungsverhalten?", optionen: ["Rechts bei \\(x<2\\), links bei \\(x>2\\)", "Links bei \\(x<2\\), rechts bei \\(x>2\\)", "überall links", "überall rechts"], korrekt: 0, tipp: "Vorzeichen prüfen.", loesungsweg: "\\(f''<0\\) bei \\(x<2\\) (rechts), \\(f''>0\\) bei \\(x>2\\) (links)." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-8x^2+7\\). Anzahl Wendepunkte?", loesung: 2, toleranz: 0, tipp: "\\(f''=12x^2-16\\).", loesungsweg: "Zwei Lösungen \\(\\pm 2/\\sqrt 3\\), VZW → 2 Wendepunkte." },
      { id: 26, level: 5, typ: "mc", frage: "\\(f(x)=x^4-4x^3+4x^2\\). Wo steigend?", optionen: ["\\((0,1)\\cup(2,\\infty)\\)", "\\((-\\infty,0)\\cup(1,2)\\)", "\\((0,\\infty)\\)", "\\((1,\\infty)\\)"], korrekt: 0, tipp: "\\(f'=4x(x-1)(x-2)\\).", loesungsweg: "Vorzeichentabelle: steigend auf \\((0,1)\\cup(2,\\infty)\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-12x+5\\). Länge des fallenden Intervalls?", loesung: 4, toleranz: 0, tipp: "\\(f'(x)=3(x-2)(x+2)\\).", loesungsweg: "\\(f'<0\\) auf \\((-2,2)\\), Länge \\(4\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2\\). x-Wert des Wendepunkts?", loesung: 1, toleranz: 0, tipp: "\\(f''(x)=6x-6\\).", loesungsweg: "\\(6x-6=0 \\Rightarrow x=1\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-2x^2\\). \\(f''(0)\\)?", loesung: -4, toleranz: 0, tipp: "\\(f''=12x^2-4\\).", loesungsweg: "\\(f''(0) = -4\\)." },
      { id: 30, level: 5, typ: "mc", frage: "\\(f'(x_0)=0\\) und \\(f''(x_0)>0\\). Was gilt?", optionen: ["Hochpunkt", "Tiefpunkt", "Wendepunkt", "Sattelpunkt"], korrekt: 1, tipp: "Hinreichende Bedingung.", loesungsweg: "\\(f''>0\\) → Tiefpunkt." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "\\(f(x)=x^3-3x^2+4\\). Anzahl der Wendepunkte?", loesung: 1, toleranz: 0, tipp: "\\(f''=6x-6\\).", loesungsweg: "Eine Nullstelle mit VZW → 1 Wendepunkt." },
      { id: 32, level: 6, typ: "mc", frage: "Eine Funktion \\(f\\) ist auf \\(\\mathbb{R}\\) überall linksgekrümmt. Welche Aussage stimmt?", optionen: ["\\(f''(x) \\geq 0\\) für alle \\(x\\)", "\\(f'(x) > 0\\) für alle \\(x\\)", "\\(f\\) hat keine Nullstellen", "\\(f\\) hat höchstens 1 Extremum"], korrekt: 0, tipp: "Krümmung ↔ \\(f''\\).", loesungsweg: "Linksgekrümmt ⟺ \\(f'' \\geq 0\\). Extremum ja möglich (Minimum), aber höchstens eins." },
      { id: 33, level: 6, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{3}x^3-x^2\\). An welcher Stelle ist die Krümmung 0?", loesung: 1, toleranz: 0, tipp: "\\(f''(x)=2x-2\\).", loesungsweg: "\\(f''(1)=0\\)." },
      { id: 34, level: 6, typ: "mc", frage: "Gegeben \\(f(x)=x^2+bx+c\\). Wo ist \\(f\\) streng monoton steigend?", optionen: ["\\((-b/2,\\infty)\\)", "\\((-\\infty,-b/2)\\)", "\\((-c,\\infty)\\)", "ganz \\(\\mathbb{R}\\)"], korrekt: 0, tipp: "\\(f'(x)=2x+b\\).", loesungsweg: "\\(2x+b>0 \\Rightarrow x>-b/2\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "\\(f(x)=\\frac{1}{4}x^4-x^3\\). Wie viele Wendepunkte?", loesung: 2, toleranz: 0, tipp: "\\(f''=3x^2-6x\\).", loesungsweg: "\\(f''=3x(x-2)\\). Zwei Nullstellen mit VZW." },
      { id: 36, level: 6, typ: "numerisch", frage: "\\(f(x)=x^4-6x^2\\). Anzahl Wendepunkte?", loesung: 2, toleranz: 0, tipp: "\\(f''=12x^2-12\\).", loesungsweg: "\\(x=\\pm 1\\), beide mit VZW → 2 Wendepunkte." }
    ];
    </script>
