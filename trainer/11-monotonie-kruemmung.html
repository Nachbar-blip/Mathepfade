<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-monotonie-kruemmung';
    const THEMA_CONFIG = { name: 'Monotonie & Krümmung', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "\\(f'(2) = 5\\). Was gilt bei \\(x=2\\)?", optionen: ["streng monoton steigend", "streng monoton fallend", "Extrempunkt", "Keine Aussage"], korrekt: 0, tipp: "\\(f' > 0\\) → steigend.", loesungsweg: "Die Ableitung ist die Tangentensteigung. Ein positiver Wert bedeutet also eine steigende Tangente: $$f'(2) = 5 > 0 \\;\\Rightarrow\\; f \\text{ steigt bei } x=2$$ Über einen Extrempunkt sagt das nichts aus — dort müsste \\(f'\\) null sein." },
      { id: 2, level: 1, typ: "mc", frage: "\\(f'(3) = -2\\). Steigend oder fallend?", optionen: ["steigend", "fallend", "weder noch", "unbestimmt"], korrekt: 1, tipp: "Vorzeichen.", loesungsweg: "$$f'(3) = -2 < 0$$ Eine negative Steigung bedeutet, dass der Graph an dieser Stelle fällt. Dass der Wert dem Betrag nach klein ist, heißt nur, dass das Gefälle flach ist." },
      { id: 3, level: 1, typ: "mc", frage: "An einer Stelle \\(x_0\\) gilt \\(f'(x_0) = 0\\). Was folgt daraus sicher?", optionen: ["ein Maximum", "ein Minimum", "eine waagerechte Tangente", "ein steigender Verlauf"], korrekt: 2, tipp: "Die Ableitung gibt die Tangentensteigung an — mehr sagt ein einzelner Wert nicht.", loesungsweg: "Der Ableitungswert ist die Steigung der Tangente. Steigung null heißt: die Tangente verläuft waagerecht. $$f'(x_0)=0 \\;\\Rightarrow\\; \\text{Tangente waagerecht}$$ Ob dort ein Hoch-, ein Tief- oder ein Sattelpunkt liegt, entscheidet erst das Verhalten von \\(f'\\) links und rechts der Stelle. Beispiel \\(f(x)=x^3\\): es gilt \\(f'(0)=0\\), trotzdem gibt es dort kein Extremum, denn \\(f'(x)=3x^2\\) bleibt beiderseits positiv." },
      { id: 4, level: 1, typ: "mc", frage: "Gemessen wurde \\(f'(1)=3\\), \\(f'(2)=-1\\) und \\(f'(3)=0\\). An welcher der drei Stellen fällt \\(f\\)?", optionen: ["bei \\(x=1\\)", "bei \\(x=2\\)", "bei \\(x=3\\)", "an keiner der Stellen"], korrekt: 1, tipp: "Vergleiche die Vorzeichen der drei Ableitungswerte.", loesungsweg: "Das Vorzeichen der Ableitung entscheidet über die Monotonie: $$f'>0 \\Rightarrow \\text{steigend}, \\qquad f'<0 \\Rightarrow \\text{fallend}, \\qquad f'=0 \\Rightarrow \\text{waagerecht}$$ Hier ist nur \\(f'(2)=-1\\) negativ, also fällt \\(f\\) allein bei \\(x=2\\). Bei \\(x=1\\) steigt der Graph, bei \\(x=3\\) verläuft die Tangente waagerecht." },
      { id: 5, level: 1, typ: "mc", frage: "Was heißt \\(f''(x) > 0\\)?", optionen: ["linksgekrümmt (konvex)", "rechtsgekrümmt", "steigend", "Maximum"], korrekt: 0, tipp: "2. Ableitung = Krümmung.", loesungsweg: "Die zweite Ableitung beschreibt, wie sich die <b>Steigung</b> ändert. Ist \\(f'' > 0\\), so nimmt \\(f'\\) zu: Der Graph wird immer steiler, er krümmt sich nach links. $$f'' > 0 \\;\\Rightarrow\\; \\text{linksgekrümmt (konvex)}$$ Anschaulich ist das die Schüsselform — wie bei der Normalparabel, für die \\(f'' = 2 > 0\\) überall gilt." },
      { id: 6, level: 1, typ: "mc", frage: "Bedingung für streng monoton fallend?", optionen: ["\\(f' > 0\\)", "\\(f' < 0\\)", "\\(f' = 0\\)", "\\(f' \\geq 0\\)"], korrekt: 1, tipp: "Monotoniesatz.", loesungsweg: "Nach dem Monotoniesatz ist \\(f\\) auf einem Intervall genau dann streng monoton fallend, wenn dort $$f'(x) < 0$$ gilt. Das Kleinerzeichen ist dabei streng — bei \\(f' \\le 0\\) wären auch waagerechte Stücke erlaubt, und die Funktion wäre nur monoton, nicht streng monoton fallend." },
      // LEVEL 2
      { id: 7, level: 2, typ: "mc", frage: "Auf welchem Intervall ist \\(f(x) = x^2 - 4x + 3\\) streng monoton steigend?", optionen: ["\\((-\\infty, 2)\\)", "\\((2, \\infty)\\)", "ganz \\(\\mathbb{R}\\)", "nirgends"], korrekt: 1, tipp: "Ableiten, Nullstelle der Ableitung suchen, Vorzeichen links und rechts davon prüfen.", loesungsweg: "Ableiten und die Nullstelle bestimmen: $$f'(x) = 2x-4 = 0 \\;\\Rightarrow\\; x = 2$$ Vorzeichen prüfen: für \\(x<2\\) ist \\(f'(x)<0\\) (etwa \\(f'(0)=-4\\)), für \\(x>2\\) ist \\(f'(x)>0\\) (etwa \\(f'(3)=2\\)). Also fällt \\(f\\) auf \\((-\\infty;2)\\) und steigt auf \\((2;\\infty)\\). Das passt zur nach oben geöffneten Parabel mit Scheitel bei \\(x=2\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Auf welchem Intervall ist \\(f(x) = -x^2 + 6x\\) streng monoton fallend?", optionen: ["\\((-\\infty,3)\\)", "\\((3,\\infty)\\)", "\\((-\\infty,-3)\\)", "\\((-3,3)\\)"], korrekt: 1, tipp: "Beachte das negative Vorzeichen vor \\(x^2\\), wenn du die Vorzeichen der Ableitung deutest.", loesungsweg: "Ableiten und nullsetzen: $$f'(x) = -2x+6 = 0 \\;\\Rightarrow\\; x = 3$$ Für \\(x<3\\) ist \\(f'(x)>0\\) (etwa \\(f'(0)=6\\)), für \\(x>3\\) ist \\(f'(x)<0\\) (etwa \\(f'(4)=-2\\)). Der Graph steigt also bis \\(x=3\\) und fällt danach: fallend auf \\((3;\\infty)\\). Die nach unten geöffnete Parabel hat ihren Scheitel bei \\(x=3\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "An welcher Stelle wechselt \\(f(x) = x^2 - 6x + 5\\) von fallendem zu steigendem Verlauf?", loesung: 3, toleranz: 0, tipp: "Der Wechsel liegt dort, wo die Ableitung ihr Vorzeichen wechselt.", loesungsweg: "Ein Wechsel von fallend zu steigend bedeutet, dass \\(f'\\) von negativ nach positiv wechselt; dazwischen muss \\(f'\\) null sein: $$f'(x) = 2x-6 = 0 \\;\\Rightarrow\\; x = 3$$ Kontrolle des Vorzeichenwechsels: \\(f'(2) = -2 < 0\\) und \\(f'(4) = 2 > 0\\) — der Wechsel ist also wirklich von fallend nach steigend und nicht umgekehrt." },
      { id: 10, level: 2, typ: "mc", frage: "Welche Aussage trifft auf \\(f(x) = 2x^3\\) zu?", optionen: ["auf ganz \\(\\mathbb{R}\\) streng monoton steigend", "auf ganz \\(\\mathbb{R}\\) fallend", "steigend nur für \\(x>0\\)", "fallend nur für \\(x>0\\)"], korrekt: 0, tipp: "Bilde die Ableitung und überlege, welches Vorzeichen ein Quadrat haben kann.", loesungsweg: "Die Ableitung ist $$f'(x) = 6x^2$$ Ein Quadrat ist nie negativ, also gilt \\(f'(x)\\ge 0\\) für alle \\(x\\). Null wird die Ableitung nur an der einzelnen Stelle \\(x=0\\), und dort wechselt sie das Vorzeichen nicht. Eine einzelne Nullstelle ohne Vorzeichenwechsel stört die strenge Monotonie nicht — \\(f\\) ist auf ganz \\(\\mathbb{R}\\) streng monoton steigend, mit einem Sattelpunkt bei \\(x=0\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(f(x) = x^2 + 2x - 8\\). \\(f'(1)\\)?", loesung: 4, toleranz: 0, tipp: "\\(f'(x)=2x+2\\).", loesungsweg: "$$f'(x) = 2x+2 \\;\\Rightarrow\\; f'(1) = 2+2 = 4$$ Das konstante Glied \\(-8\\) fällt beim Ableiten weg — es verschiebt den Graphen nur, ohne die Steigung zu ändern." },
      { id: 12, level: 2, typ: "mc", frage: "\\(f(x) = \\frac{1}{3}x^3 - 3x\\). Wo fallend?", optionen: ["\\((-\\sqrt 3, \\sqrt 3)\\)", "\\((-\\infty,-\\sqrt 3)\\cup(\\sqrt 3,\\infty)\\)", "\\((0,\\sqrt 3)\\)", "\\((-\\sqrt 3, 0)\\)"], korrekt: 0, tipp: "\\(f'(x)=x^2-3<0\\).", loesungsweg: "$$f'(x) = x^2 - 3 < 0 \\;\\Rightarrow\\; x^2 < 3 \\;\\Rightarrow\\; -\\sqrt3 < x < \\sqrt3$$ Die Funktion fällt also zwischen den beiden Extremstellen. Beim Auflösen einer quadratischen Ungleichung entsteht ein <b>Intervall</b> zwischen den Nullstellen, nicht außerhalb — das Ungleichheitszeichen entscheidet darüber." },
      // LEVEL 3
      { id: 13, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x^2+2\\). Wo steigend?", optionen: ["\\((-\\infty,0)\\cup(2,\\infty)\\)", "\\((0,2)\\)", "\\((-\\infty,-1)\\cup(3,\\infty)\\)", "\\((1,\\infty)\\)"], korrekt: 0, tipp: "\\(f'=3x(x-2)\\).", loesungsweg: "$$f'(x) = 3x^2-6x = 3x(x-2)$$ Das Produkt ist positiv, wenn beide Faktoren dasselbe Vorzeichen haben — also für \\(x < 0\\) (beide negativ) oder \\(x > 2\\) (beide positiv): $$f \\text{ steigt auf } (-\\infty;0) \\cup (2;\\infty)$$ Zwischen \\(0\\) und \\(2\\) fällt sie; dort liegen Hoch- und Tiefpunkt." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). Welchen Wert hat \\(f''(0)\\)?", loesung: -12, toleranz: 0, tipp: "Zweimal nacheinander ableiten, danach die Stelle einsetzen.", loesungsweg: "Zweimal ableiten: $$f'(x) = 3x^2-12x+9, \\qquad f''(x) = 6x-12$$ Einsetzen der Stelle: $$f''(0) = 6\\cdot 0 - 12 = -12$$ Der negative Wert bedeutet, dass der Graph dort rechtsgekrümmt ist." },
      { id: 15, level: 3, typ: "mc", frage: "\\(f(x)=x^3-3x\\). Wo rechtsgekrümmt?", optionen: ["\\((-\\infty,0)\\)", "\\((0,\\infty)\\)", "\\((-\\infty,1)\\)", "\\((-1,1)\\)"], korrekt: 0, tipp: "\\(f''(x)=6x<0\\).", loesungsweg: "Rechtskrümmung (konkav) liegt vor, wo die zweite Ableitung negativ ist: $$f''(x) = 6x < 0 \\;\\Rightarrow\\; x < 0$$ Also auf \\((-\\infty;0)\\). Bei \\(x = 0\\) wechselt das Vorzeichen — dort liegt der Wendepunkt." },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(f(x)=2x^3-12x^2+18x\\). Größte Nullstelle von \\(f'\\)?", loesung: 3, toleranz: 0, tipp: "Faktorisieren.", loesungsweg: "$$f'(x) = 6x^2-24x+18 = 6(x^2-4x+3) = 6(x-1)(x-3)$$ Die Nullstellen sind \\(1\\) und \\(3\\), die größte also \\(3\\). Das Ausklammern der \\(6\\) vereinfacht das Faktorisieren erheblich." },
      { id: 17, level: 3, typ: "mc", frage: "\\(f(x)=-x^3+6x^2-9x+2\\). Wo fallend?", optionen: ["\\((-\\infty,1)\\cup(3,\\infty)\\)", "\\((1,3)\\)", "\\((-\\infty,0)\\)", "\\((0,3)\\)"], korrekt: 0, tipp: "\\(f'(x)=-3(x-1)(x-3)\\).", loesungsweg: "$$f'(x) = -3x^2+12x-9 = -3(x-1)(x-3)$$ Wegen des Minuszeichens ist \\(f'\\) genau dort negativ, wo \\((x-1)(x-3)\\) positiv ist — also <b>außerhalb</b> von \\([1;3]\\): $$f \\text{ fällt auf } (-\\infty;1) \\cup (3;\\infty)$$ Bei einer nach unten geöffneten Parabel als Ableitung kehren sich die Intervalle gegenüber dem Normalfall um." },
      { id: 18, level: 3, typ: "mc", frage: "\\(f''(x)=-6x+12\\). Krümmung?", optionen: ["Links bis \\(x=2\\), dann rechts", "Rechts bis \\(x=2\\), dann links", "überall links", "überall rechts"], korrekt: 0, tipp: "Wendestelle bei 2.", loesungsweg: "Vorzeichen der zweiten Ableitung untersuchen: $$f''(x) = -6x+12 > 0 \\;\\Leftrightarrow\\; x < 2$$ Bis \\(x = 2\\) ist der Graph also linksgekrümmt, danach rechtsgekrümmt. An der Stelle \\(2\\) wechselt die Krümmung — dort liegt der Wendepunkt." },
      // LEVEL 4
      { id: 19, level: 4, typ: "mc", frage: "Von einer Funktion ist nur die Ableitung bekannt: \\(f'(x)=(x-1)^2(x-4)\\). Wie verläuft die Monotonie von \\(f\\)?", optionen: ["fallend auf \\((-\\infty;4)\\), steigend auf \\((4;\\infty)\\)", "steigend auf \\((-\\infty;1)\\), fallend auf \\((1;4)\\)", "fallend auf \\((1;4)\\), sonst überall steigend", "steigend auf \\((-\\infty;4)\\), fallend auf \\((4;\\infty)\\)"], korrekt: 0, tipp: "Untersuche jeden Faktor einzeln auf sein Vorzeichen und beachte, welcher Faktor im Quadrat steht.", loesungsweg: "Der Faktor \\((x-1)^2\\) ist nie negativ, das Vorzeichen von \\(f'\\) hängt also allein am Faktor \\((x-4)\\): $$x<4:\\ f'(x)\\le 0 \\qquad x>4:\\ f'(x)>0$$ An der Stelle \\(x=1\\) ist \\(f'(1)=0\\), aber ohne Vorzeichenwechsel — der fallende Verlauf wird dort nur kurz unterbrochen und nicht umgekehrt. Also fällt \\(f\\) auf \\((-\\infty;4)\\) und steigt auf \\((4;\\infty)\\). Wer jede Nullstelle der Ableitung automatisch als Wechselstelle liest, erhält die falschen Antworten." },
      { id: 20, level: 4, typ: "numerisch", frage: "Die Funktion \\(f(x)=x^3+ax\\) soll auf ganz \\(\\mathbb{R}\\) streng monoton steigend sein. Wie klein darf \\(a\\) höchstens gewählt werden?", loesung: 0, toleranz: 0, tipp: "Formuliere die Monotonie als Bedingung an das Vorzeichen der Ableitung für <b>alle</b> \\(x\\).", loesungsweg: "Monotones Steigen auf ganz \\(\\mathbb{R}\\) verlangt \\(f'(x)\\ge 0\\) für jedes \\(x\\): $$f'(x) = 3x^2 + a \\ge 0 \\quad \\text{für alle } x$$ Der kleinste Wert von \\(3x^2\\) ist \\(0\\) (bei \\(x=0\\)); genau dort ist die Bedingung am schärfsten und lautet \\(a\\ge 0\\). Der kleinstmögliche Wert ist also \\(a=0\\); dann ist \\(f(x)=x^3\\) mit \\(f'(x)=3x^2\\ge 0\\) — eine einzelne Nullstelle ohne Vorzeichenwechsel, die Monotonie bleibt streng. Für \\(a<0\\) hätte \\(f'\\) zwei Nullstellen mit Vorzeichenwechsel und der Graph würde zwischendurch fallen." },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(f(x)=x^3-9x^2+15x+2\\). Wie lang ist das Intervall, auf dem der Graph fällt?", loesung: 4, toleranz: 0, tipp: "Bestimme die Grenzen des fallenden Bereichs und bilde daraus die Differenz.", loesungsweg: "Ableiten und faktorisieren: $$f'(x) = 3x^2-18x+15 = 3\\left(x^2-6x+5\\right) = 3(x-1)(x-5)$$ Ein Produkt zweier Faktoren ist genau dann negativ, wenn die Faktoren verschiedene Vorzeichen haben — das ist zwischen den Nullstellen der Fall: $$f'(x)<0 \\ \\text{für}\\ 1 < x < 5$$ Kontrolle: \\(f'(3) = 27-54+15 = -12 < 0\\). Das fallende Intervall ist \\((1;5)\\), seine Länge also $$5-1 = 4$$" },
      { id: 22, level: 4, typ: "mc", frage: "\\(f(x)=x^4-6x^2\\). Auf welchem Bereich ist der Graph rechtsgekrümmt?", optionen: ["auf \\((-1;1)\\)", "auf \\((-\\infty;-1)\\cup(1;\\infty)\\)", "auf \\((0;\\infty)\\)", "auf ganz \\(\\mathbb{R}\\)"], korrekt: 0, tipp: "Rechtskrümmung heißt negative zweite Ableitung — löse die entsprechende Ungleichung.", loesungsweg: "Zweimal ableiten: $$f'(x) = 4x^3-12x, \\qquad f''(x) = 12x^2-12 = 12(x-1)(x+1)$$ Die Bedingung \\(f''(x)<0\\) bedeutet, dass die nach oben geöffnete Parabel \\(12x^2-12\\) unterhalb der Achse liegt — das ist zwischen ihren Nullstellen \\(-1\\) und \\(1\\) der Fall: $$f''(x)<0 \\ \\text{für}\\ -1 < x < 1$$ Kontrolle: \\(f''(0)=-12<0\\) und \\(f''(2)=36>0\\). Rechtsgekrümmt ist der Graph also auf \\((-1;1)\\), außerhalb linksgekrümmt." },
      { id: 23, level: 4, typ: "numerisch", frage: "Der Wasserstand eines Beckens wird durch \\(h(t)=-t^3+6t^2+36t\\) beschrieben (\\(t\\) in Stunden, \\(t\\ge 0\\)). Bis zu welchem Zeitpunkt steigt der Wasserstand?", loesung: 6, toleranz: 0, tipp: "Steigen heißt positive Änderungsrate — übersetze die Frage zuerst in eine Bedingung an die Ableitung.", loesungsweg: "Der Wasserstand steigt, solange die Änderungsrate positiv ist: $$h'(t) = -3t^2+12t+36 = -3\\left(t^2-4t-12\\right) = -3(t-6)(t+2)$$ Die Nullstellen sind \\(t=6\\) und \\(t=-2\\); die zweite liegt außerhalb des betrachteten Bereichs. Wegen des Minuszeichens öffnet die Parabel nach unten, \\(h'\\) ist also zwischen den Nullstellen positiv: $$h'(t)>0 \\ \\text{für}\\ 0\\le t<6$$ Kontrolle: \\(h'(2)=-12+24+36=48>0\\) und \\(h'(8)=-192+96+36=-60<0\\). Der Wasserstand steigt also bis zur sechsten Stunde und fällt danach." },
      { id: 24, level: 4, typ: "mc", frage: "Von einer Funktion \\(f\\) ist bekannt: \\(f'>0\\) auf \\((-\\infty;-2)\\) und auf \\((3;\\infty)\\), \\(f'<0\\) auf \\((-2;3)\\); außerdem \\(f''<0\\) für \\(x<1\\) und \\(f''>0\\) für \\(x>1\\). Welche Beschreibung des Verlaufs auf \\((-2;3)\\) trifft zu?", optionen: ["fallend, dabei bis \\(x=1\\) rechtsgekrümmt und danach linksgekrümmt", "fallend, dabei bis \\(x=1\\) linksgekrümmt und danach rechtsgekrümmt", "steigend, dabei bis \\(x=1\\) rechtsgekrümmt und danach linksgekrümmt", "fallend und auf dem ganzen Intervall gleichmäßig linksgekrümmt"], korrekt: 0, tipp: "Die beiden Angaben sind getrennt zu lesen: eine betrifft die Monotonie, die andere die Krümmung.", loesungsweg: "Auf \\((-2;3)\\) ist \\(f'<0\\), der Graph fällt dort also durchgehend. Unabhängig davon entscheidet \\(f''\\) über die Krümmung: für \\(x<1\\) ist \\(f''<0\\), also Rechtskrümmung, für \\(x>1\\) ist \\(f''>0\\), also Linkskrümmung. Auf dem Teilstück \\((-2;1)\\) fällt der Graph rechtsgekrümmt, auf \\((1;3)\\) fällt er linksgekrümmt weiter. Monotonie und Krümmung sind zwei getrennte Eigenschaften: ein fallender Graph kann sehr wohl linksgekrümmt sein — er fällt dann immer flacher." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x)=x^3+ax^2+bx\\) wechselt bei \\(x=2\\) seine Krümmung und \\(f\\) ist auf ganz \\(\\mathbb{R}\\) monoton steigend. Wie groß muss \\(b\\) mindestens sein?", loesung: 12, toleranz: 0, tipp: "Die Angabe über die Krümmung legt einen der beiden Parameter fest; die Monotonie wird danach zu einer Bedingung an den anderen.", loesungsweg: "<b>Schritt 1.</b> Der Krümmungswechsel verlangt \\(f''(2)=0\\): $$f''(x) = 6x+2a \\;\\Rightarrow\\; 12+2a = 0 \\;\\Rightarrow\\; a = -6$$ <b>Schritt 2.</b> Monotones Steigen verlangt \\(f'(x)\\ge 0\\) für alle \\(x\\): $$f'(x) = 3x^2-12x+b \\ge 0$$ Eine nach oben geöffnete Parabel liegt genau dann nirgends unterhalb der Achse, wenn sie höchstens eine Nullstelle hat, also die Diskriminante nicht positiv ist: $$(-12)^2 - 4\\cdot 3\\cdot b \\le 0 \\;\\Rightarrow\\; 144 \\le 12b \\;\\Rightarrow\\; b \\ge 12$$ Der kleinstmögliche Wert ist \\(b=12\\); dann ist \\(f'(x) = 3(x-2)^2\\), die Ableitung berührt die Achse bei \\(x=2\\) ohne Vorzeichenwechsel, und die Krümmungswechselstelle ist zugleich Sattelpunkt." },
      { id: 26, level: 5, typ: "mc", frage: "Ein Schüler schreibt: „Für \\(f(x)=(x-2)^4\\) ist \\(f''(2)=0\\), also wechselt der Graph dort die Krümmung.“ Beurteile diese Begründung.", optionen: ["Falsch: \\(f''(x)=12(x-2)^2\\) ist nie negativ, es fehlt der Vorzeichenwechsel.", "Richtig: eine Nullstelle der zweiten Ableitung bedeutet stets einen Krümmungswechsel.", "Falsch: die zweite Ableitung lautet \\(4(x-2)^3\\) und ist an der Stelle \\(x=2\\) nicht null.", "Richtig, aber nur, weil der Exponent \\(4\\) gerade ist; bei ungeradem Exponenten gilt es nicht."], korrekt: 0, tipp: "Prüfe nicht nur, ob die zweite Ableitung null wird, sondern auch, ob sie dort ihr Vorzeichen ändert.", loesungsweg: "Zweimal ableiten: $$f'(x) = 4(x-2)^3, \\qquad f''(x) = 12(x-2)^2$$ Tatsächlich ist \\(f''(2)=0\\). Aber \\(12(x-2)^2\\) ist als Vielfaches eines Quadrats für jedes \\(x\\ne 2\\) <b>positiv</b>: links von \\(2\\) ebenso wie rechts davon. Ohne Vorzeichenwechsel von \\(f''\\) ändert sich die Krümmung nicht — der Graph ist überall linksgekrümmt. Kontrolle: \\(f''(1)=12>0\\) und \\(f''(3)=12>0\\). Die Bedingung \\(f''=0\\) ist eben nur notwendig, nicht hinreichend." },
      { id: 27, level: 5, typ: "numerisch", frage: "\\(f(x)=x^4-4x^3+6x^2\\). Wie lang ist das Intervall, auf dem der Graph rechtsgekrümmt ist?", loesung: 0, toleranz: 0, tipp: "Stelle die zweite Ableitung auf und versuche, sie als ein Vielfaches eines Quadrats zu schreiben.", loesungsweg: "Zweimal ableiten: $$f'(x) = 4x^3-12x^2+12x, \\qquad f''(x) = 12x^2-24x+12$$ Ausklammern und als Quadrat schreiben: $$f''(x) = 12\\left(x^2-2x+1\\right) = 12(x-1)^2$$ Ein Quadrat ist nie negativ, also gilt \\(f''(x)\\ge 0\\) für alle \\(x\\) — Rechtskrümmung (\\(f''<0\\)) tritt an keiner einzigen Stelle auf. Die gesuchte Länge ist damit $$0$$ Die Nullstelle \\(x=1\\) von \\(f''\\) ist kein Krümmungswechsel, weil das Vorzeichen dort nicht wechselt: \\(f''(0)=12>0\\) und \\(f''(2)=12>0\\). Der Graph ist auf ganz \\(\\mathbb{R}\\) linksgekrümmt." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(f(x)=x^3-6x^2+9x+1\\). Auf welcher Länge fällt der Graph und ist zugleich linksgekrümmt?", loesung: 1, toleranz: 0, tipp: "Bestimme beide Bereiche einzeln und suche danach ihren gemeinsamen Teil.", loesungsweg: "<b>Monotonie.</b> $$f'(x) = 3x^2-12x+9 = 3(x-1)(x-3)$$ Das Produkt ist zwischen den Nullstellen negativ, also fällt \\(f\\) auf \\((1;3)\\). <b>Krümmung.</b> $$f''(x) = 6x-12 > 0 \\;\\Leftrightarrow\\; x > 2$$ also linksgekrümmt auf \\((2;\\infty)\\). <b>Gemeinsamer Teil.</b> $$(1;3)\\cap(2;\\infty) = (2;3)$$ Die gesuchte Länge ist \\(3-2 = 1\\). Kontrolle bei \\(x=2{,}5\\): \\(f'(2{,}5) = 18{,}75-30+9 = -2{,}25 < 0\\) und \\(f''(2{,}5) = 3 > 0\\) — der Graph fällt dort und ist linksgekrümmt, er wird also immer flacher." },
      { id: 29, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x)=ax^3+bx^2\\) wechselt bei \\(x=2\\) die Krümmung, und es gilt \\(f'(1)=3\\). Bestimme \\(a\\) auf drei Nachkommastellen.", loesung: -0.333, toleranz: 0.006, tipp: "Aus der Krümmungsbedingung ergibt sich ein Zusammenhang zwischen beiden Parametern; setze ihn in die zweite Bedingung ein.", loesungsweg: "<b>Schritt 1.</b> Aus \\(f''(x)=6ax+2b\\) und \\(f''(2)=0\\) folgt $$12a+2b = 0 \\;\\Rightarrow\\; b = -6a$$ <b>Schritt 2.</b> Mit \\(f'(x)=3ax^2+2bx\\) und \\(f'(1)=3\\): $$3a+2b = 3 \\;\\Rightarrow\\; 3a-12a = 3 \\;\\Rightarrow\\; -9a = 3$$ also $$a = -\\frac13 \\approx -0{,}333$$ und damit \\(b = 2\\). Kontrolle mit \\(f(x)=-\\tfrac13x^3+2x^2\\): \\(f'(x)=-x^2+4x\\), also \\(f'(1)=3\\); \\(f''(x)=-2x+4\\) wird bei \\(x=2\\) null und wechselt dort das Vorzeichen — der Krümmungswechsel liegt tatsächlich dort." },
      { id: 30, level: 5, typ: "numerisch", frage: "Für wie viele ganze Zahlen \\(c\\) mit \\(-5\\le c\\le 5\\) ist \\(f(x)=x^3+3x^2+cx+1\\) auf ganz \\(\\mathbb{R}\\) monoton steigend?", loesung: 3, toleranz: 0, tipp: "Übersetze die Monotonie in eine Bedingung an die Diskriminante der abgeleiteten Parabel und zähle danach ab.", loesungsweg: "Monotones Steigen verlangt \\(f'(x)\\ge 0\\) für alle \\(x\\): $$f'(x) = 3x^2+6x+c$$ Die nach oben geöffnete Parabel bleibt genau dann oberhalb oder auf der Achse, wenn ihre Diskriminante nicht positiv ist: $$6^2 - 4\\cdot 3\\cdot c \\le 0 \\;\\Rightarrow\\; 36 \\le 12c \\;\\Rightarrow\\; c \\ge 3$$ Im Bereich \\(-5\\le c\\le 5\\) erfüllen das die Werte \\(c=3\\), \\(c=4\\) und \\(c=5\\), also $$3 \\text{ Zahlen}$$ Der Grenzfall \\(c=3\\) gehört dazu: dort ist \\(f'(x)=3(x+1)^2\\), die Ableitung berührt die Achse ohne Vorzeichenwechsel, die strenge Monotonie bleibt erhalten." },
      // LEVEL 6
      { id: 31, level: 6, typ: "mc", frage: "Zeige, dass \\(f(x)=x^3+3x^2+3x+7\\) auf ganz \\(\\mathbb{R}\\) streng monoton steigend ist. Welche Begründung trägt?", optionen: ["\\(f'(x)=3(x+1)^2\\ge 0\\), und die einzige Nullstelle bei \\(x=-1\\) ist ohne Vorzeichenwechsel.", "\\(f'(x)=3x^2+6x+3\\) ist als Summe positiver Terme für jedes \\(x\\) echt größer als null.", "\\(f''(x)=6x+6\\) wechselt bei \\(x=-1\\) das Vorzeichen, also steigt \\(f\\) auf ganz \\(\\mathbb{R}\\).", "Der Leitkoeffizient ist positiv und der Grad ungerade, deshalb steigt jede solche Funktion."], korrekt: 0, tipp: "Bilde die Ableitung und versuche, sie als ein Vielfaches eines Quadrats zu schreiben; prüfe danach die Nullstelle gesondert.", loesungsweg: "Die Ableitung lässt sich vollständig als Quadrat schreiben: $$f'(x) = 3x^2+6x+3 = 3\\left(x^2+2x+1\\right) = 3(x+1)^2$$ Damit ist \\(f'(x)\\ge 0\\) für alle \\(x\\). Null wird die Ableitung nur an der einzelnen Stelle \\(x=-1\\); links und rechts davon ist sie positiv (\\(f'(-2)=3\\), \\(f'(0)=3\\)), es liegt also kein Vorzeichenwechsel vor. Eine einzelne Nullstelle ohne Vorzeichenwechsel zerstört die strenge Monotonie nicht — \\(f\\) steigt auf ganz \\(\\mathbb{R}\\) streng monoton, mit einem Sattelpunkt bei \\(x=-1\\). Die Begründung „Summe positiver Terme“ trägt nicht, denn \\(6x\\) ist für \\(x<0\\) negativ; und ein ungerader Grad mit positivem Leitkoeffizienten garantiert die Monotonie nicht (Gegenbeispiel \\(x^3-3x\\))." },
      { id: 32, level: 6, typ: "mc", frage: "Der Wasserstand eines Speichers wird für \\(0\\le t\\le 12\\) (in Stunden) durch \\(h(t)=0{,}1t^3-1{,}8t^2+8t\\) beschrieben. Beurteile die Behauptung: „Der Wasserstand nimmt im gesamten Zeitraum zu.“", optionen: ["Falsch: zwischen etwa \\(t=2{,}9\\) und \\(t=9{,}1\\) ist \\(h'\\) negativ, der Wasserstand sinkt dort.", "Richtig: \\(h'(t)=0{,}3t^2-3{,}6t+8\\) ist als quadratischer Term nie negativ.", "Falsch: der Wasserstand sinkt im gesamten Zeitraum, denn \\(h'(0)=8\\) ist der größte Wert.", "Richtig: \\(h(0)=0\\) und \\(h(12)=9{,}6\\), der Endwert liegt über dem Anfangswert."], korrekt: 0, tipp: "Über Zu- und Abnahme entscheidet das Vorzeichen der Ableitung im ganzen Intervall, nicht der Vergleich von Anfangs- und Endwert.", loesungsweg: "Die Änderungsrate ist $$h'(t) = 0{,}3t^2-3{,}6t+8$$ Nullsetzen: $$t_{1,2} = \\frac{3{,}6 \\pm \\sqrt{3{,}6^2-4\\cdot 0{,}3\\cdot 8}}{2\\cdot 0{,}3} = \\frac{3{,}6 \\pm \\sqrt{3{,}36}}{0{,}6}$$ also \\(t_1\\approx 2{,}94\\) und \\(t_2\\approx 9{,}06\\) — beide liegen im betrachteten Zeitraum. Die nach oben geöffnete Parabel ist zwischen ihren Nullstellen negativ, etwa \\(h'(6) = 10{,}8-21{,}6+8 = -2{,}8 < 0\\). Der Wasserstand sinkt dort also, die Behauptung ist falsch. Dass der Endwert \\(h(12)=9{,}6\\) über dem Anfangswert \\(h(0)=0\\) liegt, sagt über den Verlauf dazwischen nichts aus." },
      { id: 33, level: 6, typ: "mc", frage: "Beurteile die Behauptung: „Es gibt einen Wert \\(a\\), für den der Graph von \\(f(x)=x^4+ax^2\\) genau eine Stelle mit Krümmungswechsel besitzt.“", optionen: ["Falsch: für \\(a<0\\) gibt es zwei solche Stellen, für \\(a\\ge 0\\) keine — genau eine ist unmöglich.", "Richtig: für \\(a=0\\) ist \\(f''(x)=12x^2\\) nur bei \\(x=0\\) null, das ist die gesuchte Stelle.", "Richtig: für jedes \\(a>0\\) liefert \\(f''(x)=12x^2+2a\\) genau eine Wechselstelle.", "Falsch: der Graph einer Funktion vierten Grades hat grundsätzlich nie einen Krümmungswechsel."], korrekt: 0, tipp: "Untersuche die Nullstellen der zweiten Ableitung in den drei Fällen \\(a<0\\), \\(a=0\\) und \\(a>0\\) — und prüfe jedes Mal den Vorzeichenwechsel.", loesungsweg: "Die zweite Ableitung ist $$f''(x) = 12x^2+2a$$ <b>Fall \\(a>0\\):</b> \\(f''(x)\\ge 2a>0\\) für alle \\(x\\), keine Nullstelle, kein Krümmungswechsel. <b>Fall \\(a=0\\):</b> \\(f''(x)=12x^2\\) hat bei \\(x=0\\) eine Nullstelle, aber links und rechts davon ist \\(f''>0\\) — ohne Vorzeichenwechsel liegt kein Krümmungswechsel vor. Genau dieser Grenzfall wird leicht übersehen. <b>Fall \\(a<0\\):</b> \\(f''(x)=0\\) liefert \\(x=\\pm\\sqrt{-a/6}\\), zwei verschiedene Stellen, an denen \\(f''\\) jeweils das Vorzeichen wechselt — also zwei Krümmungswechsel. Damit sind nur die Anzahlen \\(0\\) und \\(2\\) möglich; die Behauptung ist falsch." },
      { id: 34, level: 6, typ: "numerisch", frage: "Eine Bergstraße wird für \\(0\\le x\\le 20\\) durch \\(f(x)=-0{,}01x^3+0{,}3x^2-1{,}5x\\) modelliert (\\(x\\) in \\(100\\) m). Auf welcher Länge (in \\(100\\) m) verläuft sie linksgekrümmt?", loesung: 10, toleranz: 0, tipp: "Linkskrümmung heißt positive zweite Ableitung; schneide den Lösungsbereich mit dem betrachteten Abschnitt.", loesungsweg: "Zweimal ableiten: $$f'(x) = -0{,}03x^2+0{,}6x-1{,}5, \\qquad f''(x) = -0{,}06x+0{,}6$$ Bedingung für Linkskrümmung: $$-0{,}06x+0{,}6 > 0 \\;\\Rightarrow\\; x < 10$$ Im betrachteten Abschnitt bleibt also \\(0\\le x<10\\), das ist eine Länge von $$10-0 = 10$$ also \\(1000\\) m. Kontrolle: \\(f''(4)=0{,}36>0\\) und \\(f''(16)=-0{,}36<0\\). Bei \\(x=10\\) wechselt die Krümmung; dahinter verläuft die Straße auf den restlichen \\(1000\\) m rechtsgekrümmt." },
      { id: 35, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x)=x^3+ax^2+bx+1\\) wechselt bei \\(x=1\\) die Krümmung, und \\(f\\) fällt genau auf einem Intervall der Länge \\(4\\). Bestimme \\(b\\).", loesung: -9, toleranz: 0, tipp: "Die Krümmungsangabe legt einen Parameter fest; die Länge des fallenden Intervalls ist der Abstand der beiden Nullstellen der Ableitung.", loesungsweg: "<b>Schritt 1.</b> Aus \\(f''(x)=6x+2a\\) und \\(f''(1)=0\\) folgt $$6+2a = 0 \\;\\Rightarrow\\; a = -3$$ <b>Schritt 2.</b> Die Ableitung ist damit \\(f'(x)=3x^2-6x+b\\). Der Graph fällt zwischen den beiden Nullstellen von \\(f'\\); ihr Abstand ist $$x_2-x_1 = \\frac{\\sqrt{36-12b}}{3}$$ Die Forderung, dass dieser Abstand \\(4\\) beträgt, ergibt $$\\sqrt{36-12b} = 12 \\;\\Rightarrow\\; 36-12b = 144 \\;\\Rightarrow\\; b = -9$$ Kontrolle: \\(f'(x) = 3x^2-6x-9 = 3(x-3)(x+1)\\) mit den Nullstellen \\(-1\\) und \\(3\\); dazwischen ist \\(f'\\) negativ, das fallende Intervall \\((-1;3)\\) hat wirklich die Länge \\(4\\). Und \\(f''(x)=6x-6\\) wechselt bei \\(x=1\\) das Vorzeichen — der Krümmungswechsel liegt tatsächlich dort, genau in der Mitte des fallenden Intervalls." },
      { id: 36, level: 6, typ: "numerisch", frage: "Für wie viele ganze Zahlen \\(k\\) mit \\(-4\\le k\\le 4\\) ist \\(f(x)=x^3+kx^2+3x\\) auf ganz \\(\\mathbb{R}\\) monoton steigend?", loesung: 7, toleranz: 0, tipp: "Formuliere die Bedingung an die Diskriminante der abgeleiteten Parabel und übersetze sie in eine Bedingung an den Betrag von \\(k\\).", loesungsweg: "Monotones Steigen verlangt \\(f'(x)\\ge 0\\) für alle \\(x\\): $$f'(x) = 3x^2+2kx+3$$ Die nach oben geöffnete Parabel bleibt genau dann nirgends unterhalb der Achse, wenn die Diskriminante nicht positiv ist: $$(2k)^2 - 4\\cdot 3\\cdot 3 \\le 0 \\;\\Rightarrow\\; 4k^2 \\le 36 \\;\\Rightarrow\\; k^2 \\le 9 \\;\\Rightarrow\\; -3\\le k\\le 3$$ Im Bereich \\(-4\\le k\\le 4\\) sind das die Werte \\(-3,-2,-1,0,1,2,3\\), also $$7 \\text{ Zahlen}$$ Beide Grenzfälle gehören dazu: für \\(k=3\\) ist \\(f'(x)=3(x+1)^2\\), für \\(k=-3\\) ist \\(f'(x)=3(x-1)^2\\) — jeweils eine Berührung der Achse ohne Vorzeichenwechsel. Für \\(k=\\pm 4\\) hätte \\(f'\\) zwei Nullstellen mit Vorzeichenwechsel, und der Graph würde zwischendurch fallen." }];
    </script>
