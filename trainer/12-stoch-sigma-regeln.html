<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-stoch-sigma-regeln';
    const THEMA_CONFIG = { name: 'Sigma-Regeln', bereich: 'stochastik' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundbegriffe ==========
      { id:1, level:1, typ:"mc", frage:"Was besagt die 1\\(\\sigma\\)-Regel (näherungsweise)?", optionen:["\\(P(\\mu-\\sigma \\le X \\le \\mu+\\sigma)\\approx 68{,}3\\%\\)","\\(\\approx 50\\%\\)","\\(\\approx 95\\%\\)","\\(\\approx 99{,}7\\%\\)"], korrekt:0, tipp:"Ein Drittel liegt außerhalb.", loesungsweg:"Bei einer hinreichend breiten Binomialverteilung liegen rund zwei Drittel aller Werte im Abstand einer Standardabweichung um den Erwartungswert: $$P(\\mu-\\sigma \\leq X \\leq \\mu+\\sigma) \\approx 68{,}3\\,\\%$$ Außerhalb liegen also gut \\(31\\,\\%\\) — je Seite knapp \\(16\\,\\%\\). Eine Abweichung um ein Sigma ist damit noch nichts Besonderes." },
      { id:2, level:1, typ:"mc", frage:"Was besagt die 2\\(\\sigma\\)-Regel?", optionen:["\\(\\approx 68\\%\\)","\\(\\approx 95{,}4\\%\\)","\\(\\approx 99{,}7\\%\\)","\\(\\approx 50\\%\\)"], korrekt:1, tipp:"Fast alles — aber noch nicht fast sicher.", loesungsweg:"$$P(\\mu-2\\sigma \\leq X \\leq \\mu+2\\sigma) \\approx 95{,}4\\,\\%$$ Nur noch rund \\(4{,}6\\,\\%\\) liegen außerhalb, je Seite gut \\(2\\,\\%\\). Diese Umgebung ist die Grundlage der üblichen \\(95\\,\\%\\)-Aussagen in der Statistik." },
      { id:3, level:1, typ:"mc", frage:"Was besagt die 3\\(\\sigma\\)-Regel?", optionen:["\\(\\approx 95\\%\\)","\\(\\approx 99{,}7\\%\\)","\\(\\approx 68\\%\\)","\\(100\\%\\)"], korrekt:1, tipp:"Praktisch fast sicher.", loesungsweg:"$$P(\\mu-3\\sigma \\leq X \\leq \\mu+3\\sigma) \\approx 99{,}7\\,\\%$$ Außerhalb liegen nur noch rund \\(0{,}3\\,\\%\\) — etwa drei von tausend Fällen. Ein Wert dort draußen ist zwar möglich, aber ein starkes Indiz dafür, dass die Annahmen nicht stimmen." },
      { id:4, level:1, typ:"mc", frage:"Wann sind die Sigma-Regeln bei einer Binomialverteilung gut anwendbar?", optionen:["\\(np \\ge 5\\)","\\(\\sigma = \\sqrt{np(1-p)}>3\\) (Laplace)","\\(p=1\\)","immer"], korrekt:1, tipp:"Laplace-Bedingung.", loesungsweg:"Die Sigma-Regeln sind gut, wenn \\(\\sigma > 3\\) (Laplace-Bedingung)." },
      { id:5, level:1, typ:"numerisch", frage:"\\(n=400, p=0{,}5\\). Berechne \\(\\mu\\).", loesung:200, toleranz:0, tipp:"\\(n\\cdot p\\).", loesungsweg:"$$\\mu = n \\cdot p = 400 \\cdot 0{,}5 = 200$$" },
      { id:6, level:1, typ:"numerisch", frage:"\\(n=400, p=0{,}5\\). Berechne \\(\\sigma\\).", loesung:10, toleranz:0.01, tipp:"\\(\\sqrt{np(1-p)}\\).", loesungsweg:"\\(\\sigma = \\sqrt{100} = 10\\)." },
      // ========== LEVEL 2 — Sigma-Umgebungen berechnen ==========
      { id:7, level:2, typ:"numerisch", frage:"\\(\\mu=200, \\sigma=10\\). Untere Grenze der 1\\(\\sigma\\)-Umgebung?", loesung:190, toleranz:0, tipp:"\\(\\mu - \\sigma\\).", loesungsweg:"$$\\mu - \\sigma = 200 - 10 = 190$$" },
      { id:8, level:2, typ:"numerisch", frage:"\\(\\mu=200, \\sigma=10\\). Obere Grenze der 2\\(\\sigma\\)-Umgebung?", loesung:220, toleranz:0, tipp:"\\(\\mu + 2\\sigma\\).", loesungsweg:"$$\\mu + 2\\sigma = 200 + 2 \\cdot 10 = 220$$" },
      { id:9, level:2, typ:"numerisch", frage:"\\(n=100, p=0{,}5\\): Berechne die obere Grenze der 3\\(\\sigma\\)-Umgebung.", loesung:65, toleranz:0, tipp:"\\(\\mu+3\\sigma\\) mit \\(\\sigma=5\\).", loesungsweg:"Zuerst die beiden Kennzahlen aus \\(n\\) und \\(p\\): $$\\mu = 100 \\cdot 0{,}5 = 50, \\quad \\sigma = \\sqrt{100 \\cdot 0{,}5 \\cdot 0{,}5} = \\sqrt{25} = 5$$ Die 3\\(\\sigma\\)-Umgebung reicht drei Standardabweichungen nach jeder Seite: $$\\mu + 3\\sigma = 50 + 3 \\cdot 5 = 65$$ Zu beachten ist, dass \\(3\\sigma\\) und nicht \\(3\\) addiert wird — der Faktor bezieht sich stets auf die Standardabweichung." },
      { id:10, level:2, typ:"mc", frage:"Was gilt für die 1\\(\\sigma\\)-Umgebung bei \\(\\mu=100, \\sigma=4\\)?", optionen:["\\([92; 108]\\)","\\([96; 104]\\)","\\([88; 112]\\)","\\([99; 101]\\)"], korrekt:1, tipp:"\\(\\mu\\pm\\sigma\\).", loesungsweg:"Die \\(1\\sigma\\)-Umgebung reicht eine Standardabweichung nach beiden Seiten: $$[\\mu-\\sigma;\\,\\mu+\\sigma] = [100-4;\\,100+4] = [96;\\,104]$$ In diesem Bereich liegen rund \\(68{,}3\\,\\%\\) aller Werte." },
      { id:11, level:2, typ:"numerisch", frage:"\\(\\mu=500, \\sigma=20\\). Berechne die untere Grenze der 3\\(\\sigma\\)-Umgebung.", loesung:440, toleranz:0, tipp:"\\(\\mu-3\\sigma\\).", loesungsweg:"$$\\mu - 3\\sigma = 500 - 3 \\cdot 20 = 500 - 60 = 440$$" },
      { id:12, level:2, typ:"numerisch", frage:"\\(n=900, p=\\tfrac{1}{3}\\). Berechne \\(\\sigma\\).", loesung:14.14, toleranz:0.1, tipp:"\\(\\sqrt{900\\cdot\\tfrac{1}{3}\\cdot\\tfrac{2}{3}} = \\sqrt{200}\\).", loesungsweg:"$$\\sigma = \\sqrt{np(1-p)} = \\sqrt{900 \\cdot \\tfrac13 \\cdot \\tfrac23} = \\sqrt{200} \\approx 14{,}14$$ Der Faktor \\(1-p\\) darf nicht vergessen werden — mit \\(\\sqrt{np}\\) käme ein zu großer Wert heraus." },
      // ========== LEVEL 3 — Umgebung aus n und p, ganzzahlige Grenzen ==========
      { id:13, level:3, typ:"numerisch", frage:"\\(n=900\\), \\(p=0{,}4\\). Gib die untere Grenze der 2\\(\\sigma\\)-Umgebung als ganze Zahl an.", loesung:330, toleranz:0, tipp:"Erst \\(\\mu\\), dann \\(\\sigma\\); beim Runden auf ganze Zahlen soll das Intervall die Wahrscheinlichkeit nicht verlieren.", loesungsweg:"$$\\mu = 900 \\cdot 0{,}4 = 360, \\quad \\sigma = \\sqrt{900 \\cdot 0{,}4 \\cdot 0{,}6} = \\sqrt{216} \\approx 14{,}70$$ $$\\mu - 2\\sigma \\approx 360 - 29{,}39 = 330{,}61$$ Die untere Grenze wird <b>abgerundet</b> auf \\(330\\): so wird das Intervall nach außen erweitert und erfasst weiter mindestens die \\(95{,}4\\,\\%\\). Bei einer Aufrundung auf \\(331\\) wäre das Intervall <b>enger</b> als die 2\\(\\sigma\\)-Umgebung und die zugehörige Wahrscheinlichkeit läge unter \\(95{,}4\\,\\%\\)." },
      { id:14, level:3, typ:"numerisch", frage:"\\(n=500\\), \\(p=0{,}2\\). Gib die obere Grenze der 3\\(\\sigma\\)-Umgebung als ganze Zahl an.", loesung:127, toleranz:0, tipp:"Zwischenschritt \\(\\sigma\\) berechnen, dann drei Standardabweichungen nach oben und nach außen runden.", loesungsweg:"$$\\mu = 100, \\quad \\sigma = \\sqrt{500 \\cdot 0{,}2 \\cdot 0{,}8} = \\sqrt{80} \\approx 8{,}944$$ $$\\mu + 3\\sigma \\approx 100 + 26{,}83 = 126{,}83$$ Die obere Grenze wird <b>aufgerundet</b> auf \\(127\\). Beide Grenzen werden also nach außen gerundet — nach unten abgerundet, nach oben aufgerundet." },
      { id:15, level:3, typ:"numerisch", frage:"\\(n=1200\\), \\(p=\\tfrac{1}{3}\\). Berechne \\(\\sigma\\) (2 Nachkommastellen).", loesung:16.33, toleranz:0.05, tipp:"In der Wurzel stehen drei Faktoren; \\(1-p\\) darf nicht fehlen.", loesungsweg:"$$\\sigma = \\sqrt{np(1-p)} = \\sqrt{1200 \\cdot \\tfrac13 \\cdot \\tfrac23} = \\sqrt{\\tfrac{2400}{9}} \\approx 16{,}33$$ Mit \\(\\mu = 400\\) ist die Laplace-Bedingung \\(\\sigma \\gt 3\\) klar erfüllt, die Sigma-Regeln sind hier also brauchbar. Wer \\(1-p\\) vergisst, erhält \\(\\sqrt{400} = 20\\) und damit eine um ein Fünftel zu breite Umgebung." },
      { id:16, level:3, typ:"mc", frage:"Warum wird bei einer \\(\\sigma\\)-Umgebung die untere Grenze abgerundet und die obere aufgerundet?", optionen:["Damit das Intervall die angegebene Wahrscheinlichkeit behält","Damit beide Grenzen dieselbe Anzahl Stellen haben","Weil der Erwartungswert stets eine ganze Zahl ergibt","Weil die Standardabweichung immer aufgerundet wird"], korrekt:0, tipp:"Überlege, was passiert, wenn man das Intervall an einer Seite verkleinert.", loesungsweg:"\\(X\\) nimmt nur ganze Werte an, die Grenzen \\(\\mu \\pm k\\sigma\\) sind dagegen meist gebrochen. Rundet man nach innen, fällt ein ganzer Wert samt seiner Wahrscheinlichkeit aus dem Intervall heraus und die Aussage \\(95{,}4\\,\\%\\) wäre zu groß. Rundet man nach außen — unten ab, oben auf —, wird das Intervall höchstens etwas zu groß, die angegebene Wahrscheinlichkeit also sicher erreicht." },
      { id:17, level:3, typ:"numerisch", frage:"\\(n=2000\\), \\(p=0{,}15\\). Prüfe zuerst, ob die Sigma-Regeln anwendbar sind, und gib dann an, wie viele Prozent der Werte <b>oberhalb</b> von \\(\\mu+2\\sigma\\) liegen (1 Nachkommastelle).", loesung:2.3, toleranz:0.2, tipp:"Erst \\(\\sigma\\) gegen die Laplace-Bedingung prüfen, dann den Anteil außerhalb auf die beiden Seiten verteilen.", loesungsweg:"$$\\sigma = \\sqrt{2000 \\cdot 0{,}15 \\cdot 0{,}85} = \\sqrt{255} \\approx 15{,}97 \\gt 3$$ Die Laplace-Bedingung ist erfüllt, die Regeln dürfen benutzt werden. Innerhalb der 2\\(\\sigma\\)-Umgebung liegen \\(95{,}4\\,\\%\\), außerhalb also \\(4{,}6\\,\\%\\). Wegen der annähernden Symmetrie verteilt sich das gleichmäßig: $$\\frac{4{,}6\\,\\%}{2} = 2{,}3\\,\\%$$" },
      { id:18, level:3, typ:"numerisch", frage:"\\(n=450\\), \\(p=0{,}6\\). Um wie viele Standardabweichungen weicht der Wert \\(X=290\\) vom Erwartungswert ab? (2 Nachkommastellen)", loesung:1.92, toleranz:0.05, tipp:"Abweichung vom Erwartungswert bilden und in Einheiten von \\(\\sigma\\) umrechnen.", loesungsweg:"$$\\mu = 450 \\cdot 0{,}6 = 270, \\quad \\sigma = \\sqrt{450 \\cdot 0{,}6 \\cdot 0{,}4} = \\sqrt{108} \\approx 10{,}392$$ $$\\frac{290 - 270}{\\sigma} \\approx \\frac{20}{10{,}392} \\approx 1{,}92$$ Der Wert liegt noch innerhalb der 2\\(\\sigma\\)-Umgebung, ist also unauffällig." },
      // ========== LEVEL 4 — Modell aus Text, Verfahren wählen, Umkehraufgaben ==========
      { id:19, level:4, typ:"numerisch", frage:"Eine Fluggesellschaft weiß, dass \\(8\\,\\%\\) der Fluggäste ihren gebuchten Flug nicht antreten. Für einen Flug liegen \\(250\\) Buchungen vor. Gib die untere Grenze des Bereichs an, in dem die Zahl der <b>erscheinenden</b> Gäste mit etwa \\(95\\,\\%\\) liegt (ganze Zahl).", loesung:221, toleranz:0, tipp:"Zuerst festlegen, welches Ereignis der Erfolg ist — gefragt sind die Erscheinenden, nicht die Fehlenden.", loesungsweg:"Gefragt sind die Erscheinenden, also \\(p = 0{,}92\\): $$\\mu = 250 \\cdot 0{,}92 = 230, \\quad \\sigma = \\sqrt{250 \\cdot 0{,}92 \\cdot 0{,}08} = \\sqrt{18{,}4} \\approx 4{,}29$$ $$\\mu - 2\\sigma \\approx 230 - 8{,}58 = 221{,}42 \\;\\longrightarrow\\; 221$$ Mit \\(p = 0{,}08\\) hätte man die Fehlenden berechnet und einen völlig anderen Bereich erhalten." },
      { id:20, level:4, typ:"numerisch", frage:"Bei einer Bernoulli-Kette mit \\(p=0{,}25\\) beträgt die Standardabweichung \\(\\sigma=6\\). Bestimme \\(n\\).", loesung:192, toleranz:0, tipp:"Die Formel für \\(\\sigma\\) nach \\(n\\) auflösen; quadrieren beseitigt die Wurzel.", loesungsweg:"Umkehraufgabe: gesucht ist \\(n\\) statt \\(\\sigma\\). $$\\sigma^2 = np(1-p) \\;\\Rightarrow\\; 36 = n \\cdot 0{,}25 \\cdot 0{,}75 = 0{,}1875\\,n$$ $$n = \\frac{36}{0{,}1875} = 192$$ Probe: \\(\\sqrt{192 \\cdot 0{,}1875} = \\sqrt{36} = 6\\)." },
      { id:21, level:4, typ:"numerisch", frage:"Eine Maschine erzeugt \\(5\\,\\%\\) Ausschuss; an einem Tag werden \\(800\\) Stück produziert. Ab welcher Ausschusszahl liegt das Tagesergebnis mehr als \\(2\\sigma\\) über dem Erwartungswert? (ganze Zahl)", loesung:53, toleranz:0, tipp:"Die Schranke \\(\\mu+2\\sigma\\) berechnen und überlegen, welche ganze Zahl sie erstmals überschreitet.", loesungsweg:"$$\\mu = 800 \\cdot 0{,}05 = 40, \\quad \\sigma = \\sqrt{800 \\cdot 0{,}05 \\cdot 0{,}95} = \\sqrt{38} \\approx 6{,}164$$ $$\\mu + 2\\sigma \\approx 40 + 12{,}33 = 52{,}33$$ Gefragt ist „mehr als\", also die erste ganze Zahl oberhalb von \\(52{,}33\\): ab \\(53\\) Ausschussstücken. Der Wert \\(52\\) liegt noch innerhalb der Umgebung." },
      { id:22, level:4, typ:"mc", frage:"Bei welcher Kombination sind die Sigma-Regeln <b>nicht</b> brauchbar?", optionen:["\\(n=50\\), \\(p=0{,}02\\)","\\(n=400\\), \\(p=0{,}15\\)","\\(n=900\\), \\(p=0{,}05\\)","\\(n=250\\), \\(p=0{,}40\\)"], korrekt:0, tipp:"Für jede Kombination die Laplace-Bedingung prüfen — dazu genügt ein Blick auf \\(\\sigma\\).", loesungsweg:"Die Laplace-Bedingung fordert \\(\\sigma \\gt 3\\). Der Reihe nach: \\(\\sqrt{50 \\cdot 0{,}02 \\cdot 0{,}98} \\approx 0{,}99\\); \\(\\sqrt{400 \\cdot 0{,}15 \\cdot 0{,}85} \\approx 6{,}96\\); \\(\\sqrt{900 \\cdot 0{,}05 \\cdot 0{,}95} \\approx 6{,}54\\); \\(\\sqrt{250 \\cdot 0{,}4 \\cdot 0{,}6} \\approx 7{,}75\\). Nur bei \\(n=50\\) und \\(p=0{,}02\\) ist \\(\\sigma\\) kleiner als \\(3\\); dort ist \\(\\mu = 1\\), die Verteilung stark linkssteil und von einer Glockenform weit entfernt." },
      { id:23, level:4, typ:"numerisch", frage:"Ein Würfel wird \\(720\\)-mal geworfen. Gib die obere Grenze der 1\\(\\sigma\\)-Umgebung für die Anzahl der Sechsen an (ganze Zahl).", loesung:130, toleranz:0, tipp:"Die Trefferwahrscheinlichkeit muss erst aus dem Sachverhalt erschlossen werden.", loesungsweg:"Erfolg ist „Sechs\", also \\(p = \\tfrac16\\): $$\\mu = 720 \\cdot \\tfrac16 = 120, \\quad \\sigma = \\sqrt{720 \\cdot \\tfrac16 \\cdot \\tfrac56} = \\sqrt{100} = 10$$ $$\\mu + \\sigma = 130$$ Die Grenze ist hier zufällig ganzzahlig, gerundet werden muss nicht. In etwa zwei von drei Versuchsreihen liegt die Zahl der Sechsen zwischen \\(110\\) und \\(130\\)." },
      { id:24, level:4, typ:"numerisch", frage:"Ein Schüler beantwortet \\(60\\) Ja-Nein-Fragen durch Raten. Gib die obere Grenze der 2\\(\\sigma\\)-Umgebung für die Zahl der richtigen Antworten an (ganze Zahl).", loesung:38, toleranz:0, tipp:"Raten legt \\(p\\) fest; nach der Rechnung nach außen runden.", loesungsweg:"Raten bei zwei Möglichkeiten bedeutet \\(p = 0{,}5\\): $$\\mu = 30, \\quad \\sigma = \\sqrt{60 \\cdot 0{,}5 \\cdot 0{,}5} = \\sqrt{15} \\approx 3{,}873$$ $$\\mu + 2\\sigma \\approx 30 + 7{,}75 = 37{,}75 \\;\\longrightarrow\\; 38$$ Wegen \\(\\sigma \\gt 3\\) ist die Näherung noch vertretbar, allerdings knapp." },
      // ========== LEVEL 5 — zwei Bedingungen, Fehlersuche, Verfahren verzahnen ==========
      { id:25, level:5, typ:"numerisch", frage:"Bei \\(n=2500\\) beträgt die Standardabweichung \\(\\sigma=20\\); außerdem ist bekannt, dass \\(p\\) größer als \\(0{,}5\\) ist. Bestimme \\(p\\).", loesung:0.8, toleranz:0.01, tipp:"Aus \\(\\sigma\\) eine quadratische Gleichung für \\(p\\) gewinnen; die Zusatzangabe entscheidet zwischen den Lösungen.", loesungsweg:"$$\\sigma^2 = np(1-p) \\;\\Rightarrow\\; 400 = 2500\\,p(1-p) \\;\\Rightarrow\\; p(1-p) = 0{,}16$$ $$p^2 - p + 0{,}16 = 0 \\;\\Rightarrow\\; p = 0{,}2 \\;\\text{oder}\\; p = 0{,}8$$ Beide Werte liefern dasselbe \\(\\sigma\\), weil \\(p(1-p)\\) symmetrisch zu \\(0{,}5\\) ist. Die zweite Bedingung wählt aus: \\(p = 0{,}8\\)." },
      { id:26, level:5, typ:"numerisch", frage:"Für \\(n=500\\) und \\(p=0{,}3\\) rechnet jemand \\(\\sigma=\\sqrt{500 \\cdot 0{,}3}\\approx 12{,}25\\). Berechne den richtigen Wert von \\(\\sigma\\) (2 Nachkommastellen).", loesung:10.25, toleranz:0.05, tipp:"Vergleiche die benutzte Wurzel mit der vollständigen Formel — ein Faktor fehlt.", loesungsweg:"In der Wurzel fehlt der Faktor \\(1-p\\): $$\\sigma = \\sqrt{np(1-p)} = \\sqrt{500 \\cdot 0{,}3 \\cdot 0{,}7} = \\sqrt{105} \\approx 10{,}25$$ Der falsche Weg liefert \\(\\sqrt{150} \\approx 12{,}25\\), also einen um rund ein Fünftel zu großen Wert; die 2\\(\\sigma\\)-Umgebung wäre um etwa \\(8\\) Einheiten zu breit. Der Fehler fällt nicht durch ein unsinniges Ergebnis auf — nur der Formelvergleich entdeckt ihn. Probe: \\(\\sigma\\) kann nie größer als \\(\\tfrac12\\sqrt{n} \\approx 11{,}18\\) werden, \\(12{,}25\\) ist also unmöglich." },
      { id:27, level:5, typ:"mc", frage:"Für \\(n=1000\\) und \\(p=0{,}5\\) gibt jemand die 2\\(\\sigma\\)-Umgebung als \\([0;1000]\\) an und rechnet dazu \\(\\mu \\pm 2 \\cdot 250\\). Woran liegt der Fehler?", optionen:["Es wurde die Varianz statt \\(\\sigma\\) eingesetzt","Es wurde der Erwartungswert doppelt gezählt","Es wurde mit \\(3\\sigma\\) statt mit \\(2\\sigma\\) gerechnet","Es wurde \\(n\\) statt \\(\\mu\\) als Mitte benutzt"], korrekt:0, tipp:"Rechne \\(np(1-p)\\) aus und vergleiche die Zahl mit dem benutzten Wert \\(250\\).", loesungsweg:"Es ist \\(np(1-p) = 1000 \\cdot 0{,}5 \\cdot 0{,}5 = 250\\) — das ist die <b>Varianz</b>. Die Standardabweichung ist deren Wurzel: $$\\sigma = \\sqrt{250} \\approx 15{,}81 \\;\\Rightarrow\\; \\mu \\pm 2\\sigma \\approx [468{,}4;\\,531{,}6]$$ Das richtige Intervall ist also rund \\(63\\) Einheiten breit statt \\(1000\\). Dass etwas nicht stimmt, zeigt schon die Sachlogik: ein Intervall, das alle überhaupt möglichen Werte enthält, hätte die Wahrscheinlichkeit \\(1\\) und nicht \\(95{,}4\\,\\%\\)." },
      { id:28, level:5, typ:"numerisch", frage:"\\(n=900\\), \\(p=\\tfrac13\\). Wie viele ganze Zahlen liegen in der 2\\(\\sigma\\)-Umgebung?", loesung:57, toleranz:0, tipp:"Erst die beiden gebrochenen Grenzen, dann die ganzen Zahlen dazwischen abzählen — die Randwerte mitdenken.", loesungsweg:"$$\\mu = 300, \\quad \\sigma = \\sqrt{900 \\cdot \\tfrac13 \\cdot \\tfrac23} = \\sqrt{200} \\approx 14{,}142$$ $$[\\mu - 2\\sigma;\\, \\mu + 2\\sigma] \\approx [271{,}72;\\, 328{,}28]$$ Die kleinste enthaltene ganze Zahl ist \\(272\\), die größte \\(328\\). Abgezählt werden also $$328 - 272 + 1 = 57$$ Zahlen. Das \\(+1\\) ist entscheidend: die Differenz allein zählt die Abstände, nicht die Werte." },
      { id:29, level:5, typ:"numerisch", frage:"Zwei Versuchsreihen: einmal \\(n=500\\) mit \\(p=0{,}5\\), einmal \\(n=2000\\) mit \\(p=0{,}1\\). Um wie viel ist die 2\\(\\sigma\\)-Umgebung der zweiten Reihe breiter als die der ersten? (2 Nachkommastellen)", loesung:8.94, toleranz:0.1, tipp:"Die Breite einer 2\\(\\sigma\\)-Umgebung hängt nur von \\(\\sigma\\) ab; beide Reihen getrennt rechnen und vergleichen.", loesungsweg:"Eine 2\\(\\sigma\\)-Umgebung ist \\(4\\sigma\\) breit. $$\\sigma_1 = \\sqrt{500 \\cdot 0{,}25} = \\sqrt{125} \\approx 11{,}180, \\quad \\sigma_2 = \\sqrt{2000 \\cdot 0{,}09} = \\sqrt{180} \\approx 13{,}416$$ $$4\\sigma_2 - 4\\sigma_1 \\approx 53{,}67 - 44{,}72 = 8{,}94$$ Die zweite Reihe hat den vierfachen Umfang, aber nur eine um ein Fünftel breitere Umgebung — der kleine Wert von \\(p\\) drückt \\(\\sigma\\) stärker, als \\(n\\) es anhebt." },
      { id:30, level:5, typ:"numerisch", frage:"Eine Bernoulli-Kette hat \\(\\mu=180\\) und \\(\\sigma=12\\). Bestimme \\(n\\).", loesung:900, toleranz:0, tipp:"Beide Angaben als Gleichungen notieren; der Quotient der beiden liefert \\(1-p\\).", loesungsweg:"Zwei Bedingungen für zwei Unbekannte: $$np = 180, \\qquad np(1-p) = 144$$ Division der zweiten Gleichung durch die erste: $$1 - p = \\frac{144}{180} = 0{,}8 \\;\\Rightarrow\\; p = 0{,}2$$ $$n = \\frac{180}{0{,}2} = 900$$ Probe: \\(\\sqrt{900 \\cdot 0{,}2 \\cdot 0{,}8} = \\sqrt{144} = 12\\)." },
      // ========== LEVEL 6 — Abi-Format (gA) ==========
      { id:31, level:6, typ:"numerisch", frage:"Eine Partei rechnet mit einem Wähleranteil von \\(20\\,\\%\\). In einer Umfrage werden \\(1000\\) Personen befragt. Bestimmen Sie die obere Grenze der 2\\(\\sigma\\)-Umgebung (ganze Zahl) und beurteilen Sie damit ein Umfrageergebnis von \\(235\\) Zustimmungen.", loesung:226, toleranz:0, tipp:"Erst \\(\\mu\\) und \\(\\sigma\\), dann die Grenze nach außen runden und den beobachteten Wert dagegen halten.", loesungsweg:"$$\\mu = 1000 \\cdot 0{,}2 = 200, \\quad \\sigma = \\sqrt{1000 \\cdot 0{,}2 \\cdot 0{,}8} = \\sqrt{160} \\approx 12{,}649$$ $$\\mu + 2\\sigma \\approx 200 + 25{,}30 = 225{,}30 \\;\\longrightarrow\\; 226$$ <b>Beurteilung:</b> Der beobachtete Wert \\(235\\) liegt oberhalb von \\(226\\), also außerhalb der 2\\(\\sigma\\)-Umgebung; er weicht um \\(35/12{,}649 \\approx 2{,}77\\) Standardabweichungen ab. Solche Ergebnisse treten bei einem Anteil von \\(20\\,\\%\\) in weniger als \\(3\\,\\%\\) der Umfragen auf. Das spricht dafür, dass der Anteil inzwischen höher liegt — ausgeschlossen ist der Wert \\(20\\,\\%\\) damit nicht, denn auch seltene Ergebnisse kommen vor." },
      { id:32, level:6, typ:"mc", frage:"„Verdoppelt man den Stichprobenumfang \\(n\\), so verdoppelt sich die Breite der 2\\(\\sigma\\)-Umgebung.“ Beurteilen Sie diese Behauptung.", optionen:["Richtig, weil \\(n\\) in der Varianz als Faktor auftritt","Falsch, die Breite wächst nur um den Faktor \\(\\sqrt{2}\\)","Falsch, die Breite bleibt von \\(n\\) völlig unberührt","Richtig, sofern \\(p\\) dabei nicht verändert wird"], korrekt:1, tipp:"Sieh nach, an welcher Stelle \\(n\\) in \\(\\sigma\\) steht — unter oder außerhalb der Wurzel.", loesungsweg:"Die Breite beträgt \\(4\\sigma = 4\\sqrt{np(1-p)}\\). Verdoppelt man \\(n\\), so verdoppelt sich der Term <b>unter</b> der Wurzel, die Wurzel selbst wächst dadurch nur um \\(\\sqrt{2} \\approx 1{,}41\\). Beispiel \\(p = 0{,}5\\): bei \\(n = 500\\) ist \\(4\\sigma \\approx 44{,}7\\), bei \\(n = 1000\\) ist \\(4\\sigma \\approx 63{,}2\\). Bezogen auf \\(n\\) wird die Umgebung dabei sogar <b>relativ schmaler</b> — darauf beruht der Nutzen großer Stichproben." },
      { id:33, level:6, typ:"numerisch", frage:"Bei \\(n=900\\) beträgt die Standardabweichung \\(\\sigma=9\\). Bestimmen Sie alle möglichen Werte von \\(p\\) und geben Sie den kleineren an.", loesung:0.1, toleranz:0.005, tipp:"Aus \\(\\sigma\\) eine quadratische Gleichung für \\(p\\) aufstellen und beide Lösungen auf Zulässigkeit prüfen.", loesungsweg:"$$81 = 900\\,p(1-p) \\;\\Rightarrow\\; p(1-p) = 0{,}09 \\;\\Rightarrow\\; p^2 - p + 0{,}09 = 0$$ $$p = \\frac{1 \\pm \\sqrt{1 - 0{,}36}}{2} = \\frac{1 \\pm 0{,}8}{2} \\;\\Rightarrow\\; p = 0{,}1 \\;\\text{oder}\\; p = 0{,}9$$ <b>Fallunterscheidung:</b> Beide Werte liegen zwischen \\(0\\) und \\(1\\) und sind daher zulässig; ohne eine weitere Angabe bleibt die Aufgabe zweideutig. Der kleinere Wert ist \\(p = 0{,}1\\). Der Grund für die Doppellösung ist die Symmetrie von \\(p(1-p)\\) zu \\(p = 0{,}5\\): eine Standardabweichung kann nicht zwischen „selten Erfolg\" und „selten Misserfolg\" unterscheiden." },
      { id:34, level:6, typ:"numerisch", frage:"Eine Abfüllanlage füllt \\(3\\,\\%\\) der Flaschen zu knapp; an einem Tag werden \\(2000\\) Flaschen abgefüllt. In der Tagesprüfung werden \\(84\\) zu knapp gefüllte Flaschen gefunden. Berechnen Sie, um wie viele Standardabweichungen dieser Wert vom Erwartungswert abweicht (2 Nachkommastellen), und beurteilen Sie den Befund.", loesung:3.15, toleranz:0.08, tipp:"Erst \\(\\mu\\) und \\(\\sigma\\) bestimmen, dann die Abweichung in Einheiten von \\(\\sigma\\) ausdrücken.", loesungsweg:"$$\\mu = 2000 \\cdot 0{,}03 = 60, \\quad \\sigma = \\sqrt{2000 \\cdot 0{,}03 \\cdot 0{,}97} = \\sqrt{58{,}2} \\approx 7{,}629$$ $$\\frac{84 - 60}{\\sigma} \\approx \\frac{24}{7{,}629} \\approx 3{,}15$$ <b>Beurteilung:</b> Der Wert liegt außerhalb der 3\\(\\sigma\\)-Umgebung, in die etwa \\(99{,}7\\,\\%\\) aller Tagesergebnisse fallen. Ein solcher Tag tritt bei ordnungsgemäßem Betrieb seltener als einmal in \\(600\\) Tagen auf. Das ist ein starkes Indiz für eine Verstellung der Anlage und rechtfertigt eine Prüfung — beweist sie aber nicht, denn die Rechnung gibt nur an, wie selten der Befund wäre, nicht wie wahrscheinlich die Störung ist." },
      { id:35, level:6, typ:"mc", frage:"„Liegt ein Beobachtungswert innerhalb der 2\\(\\sigma\\)-Umgebung, so ist die Annahme über \\(p\\) bestätigt.“ Beurteilen Sie diese Behauptung.", optionen:["Richtig, denn \\(95{,}4\\,\\%\\) der Werte sprechen dafür","Falsch, der Wert passt auch zu vielen anderen Annahmen","Falsch, innerhalb liegende Werte sagen überhaupt nichts aus","Richtig, sofern die Laplace-Bedingung eingehalten ist"], korrekt:1, tipp:"Überlege, ob derselbe Beobachtungswert auch zu einem benachbarten \\(p\\) passen könnte.", loesungsweg:"Ein Wert innerhalb der Umgebung <b>widerspricht</b> der Annahme nicht — bestätigt ist sie damit nicht. Beispiel \\(n = 400\\): der Wert \\(205\\) liegt in der 2\\(\\sigma\\)-Umgebung von \\(p = 0{,}5\\) (also \\([180;220]\\)), aber ebenso in der von \\(p = 0{,}52\\) (etwa \\([188;228]\\)) und in der von \\(p = 0{,}48\\). Verträglichkeit ist keine Bestätigung. Die Aussage, innerhalb liegende Werte sagten überhaupt nichts aus, geht dagegen zu weit: unverträgliche Annahmen kann man durchaus ausschließen." },
      { id:36, level:6, typ:"numerisch", frage:"Ein Losverkäufer hat \\(1200\\) Lose verkauft, von denen \\(25\\,\\%\\) Gewinnlose sind. Wie viele Gewinne muss er bereithalten, damit er mit einer Wahrscheinlichkeit von etwa \\(99{,}85\\,\\%\\) nicht zu wenige hat? Begründen Sie, warum hier nur eine Seite der Umgebung zählt.", loesung:345, toleranz:0, tipp:"Von den drei Sigma-Regeln die passende auswählen und überlegen, welcher Anteil auf eine einzelne Seite entfällt.", loesungsweg:"$$\\mu = 1200 \\cdot 0{,}25 = 300, \\quad \\sigma = \\sqrt{1200 \\cdot 0{,}25 \\cdot 0{,}75} = \\sqrt{225} = 15$$ <b>Einseitige Betrachtung:</b> Zu wenige Gewinne hat er nur, wenn die Gewinnzahl <b>zu groß</b> wird; der untere Rand ist für ihn unkritisch. Von den \\(0{,}3\\,\\%\\) außerhalb der 3\\(\\sigma\\)-Umgebung entfallen \\(0{,}15\\,\\%\\) auf die obere Seite, also bleiben nach oben \\(99{,}85\\,\\%\\) abgedeckt: $$\\mu + 3\\sigma = 300 + 45 = 345$$ Er sollte \\(345\\) Gewinne bereithalten. Für eine zweiseitige Aussage mit \\(99{,}85\\,\\%\\) bräuchte man eine größere Zahl von Standardabweichungen." }];
