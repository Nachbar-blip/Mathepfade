<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vektoren in 2D - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-vektoren-2d';
    const THEMA_CONFIG = { name: 'Vektoren in 2D', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Ein Vektor beschreibt ...", optionen: ["nur eine Laenge", "eine Verschiebung mit Richtung und Betrag", "einen Punkt", "einen Winkel"], korrekt: 1, tipp: "Pfeil in der Ebene.", loesungsweg: "Ein Vektor ist eine <b>gerichtete Groesse</b> (Verschiebung)." },
      { id: 2, level: 1, typ: "mc", frage: "Der Vektor \\(\\vec{v} = \\binom{3}{2}\\) bedeutet ...", optionen: ["3 nach oben, 2 nach rechts", "3 nach rechts, 2 nach oben", "Punkt (3,2)", "Laenge 3, Winkel 2"], korrekt: 1, tipp: "Erste Koordinate: x. Zweite: y.", loesungsweg: "\\(\\binom{3}{2}\\): 3 in x-Richtung, 2 in y-Richtung." },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(\\vec{a} = \\binom{4}{3}\\). Laenge \\(|\\vec{a}|\\)?", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{x^2 + y^2}\\).", loesungsweg: "$$|\\vec{a}| = \\sqrt{16 + 9} = 5$$" },
      { id: 4, level: 1, typ: "mc", frage: "Nullvektor ist ...", optionen: ["\\(\\binom{0}{0}\\)", "\\(\\binom{1}{0}\\)", "\\(\\binom{0}{1}\\)", "\\(\\binom{-1}{-1}\\)"], korrekt: 0, tipp: "Keine Verschiebung.", loesungsweg: "$$\\vec{0} = \\binom{0}{0}$$" },
      { id: 5, level: 1, typ: "mc", frage: "Gegenvektor zu \\(\\binom{3}{-2}\\)?", optionen: ["\\(\\binom{-3}{2}\\)", "\\(\\binom{3}{2}\\)", "\\(\\binom{-3}{-2}\\)", "\\(\\binom{2}{3}\\)"], korrekt: 0, tipp: "Alle Vorzeichen umkehren.", loesungsweg: "$$-\\vec{v} = \\binom{-3}{2}$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(\\vec{a} = \\binom{6}{8}\\). \\(|\\vec{a}| = ?\\)", loesung: 10, toleranz: 0, tipp: "Pythagoras.", loesungsweg: "$$\\sqrt{36 + 64} = 10$$" },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "\\(\\binom{2}{3} + \\binom{4}{1}\\). Gib die x-Koordinate an.", loesung: 6, toleranz: 0, tipp: "Addiere komponentenweise.", loesungsweg: "$$x = 2 + 4 = 6$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(\\binom{5}{7} - \\binom{2}{3}\\). y-Koordinate?", loesung: 4, toleranz: 0, tipp: "y: \\(7 - 3\\).", loesungsweg: "$$y = 4$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(3 \\cdot \\binom{2}{-1}\\). x-Komponente?", loesung: 6, toleranz: 0, tipp: "Skalarmultiplikation.", loesungsweg: "$$3 \\cdot 2 = 6$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Ortsvektor des Punkts \\(P(3; 4)\\). Laenge?", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{9 + 16}\\).", loesungsweg: "$$|\\vec{OP}| = 5$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(\\vec{AB}\\) mit \\(A(1;2)\\), \\(B(5;5)\\). Laenge?", loesung: 5, toleranz: 0, tipp: "\\(\\vec{AB} = \\binom{4}{3}\\).", loesungsweg: "$$|\\vec{AB}| = \\sqrt{16+9} = 5$$" },
      { id: 12, level: 2, typ: "mc", frage: "\\(\\vec{AB}\\) mit \\(A(2;1)\\) und \\(B(7;4)\\) ist ...", optionen: ["\\(\\binom{5}{3}\\)", "\\(\\binom{9}{5}\\)", "\\(\\binom{-5}{-3}\\)", "\\(\\binom{3}{5}\\)"], korrekt: 0, tipp: "\\(\\vec{AB} = B - A\\).", loesungsweg: "$$\\binom{7-2}{4-1} = \\binom{5}{3}$$" },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "\\(\\vec{a} = \\binom{2}{1}\\), \\(\\vec{b} = \\binom{3}{5}\\). x-Komponente von \\(\\vec{a} + \\vec{b}\\)?", loesung: 5, toleranz: 0, tipp: "Addieren.", loesungsweg: "$$x = 2 + 3 = 5$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(2 \\vec{a} + \\vec{b}\\) mit \\(\\vec{a} = \\binom{1}{2}\\), \\(\\vec{b} = \\binom{3}{0}\\). x-Komponente?", loesung: 5, toleranz: 0, tipp: "\\(2 \\cdot 1 + 3\\).", loesungsweg: "$$x = 2 + 3 = 5$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Abstand zwischen \\(A(1;1)\\) und \\(B(4;5)\\)?", loesung: 5, toleranz: 0, tipp: "Laenge von \\(\\vec{AB}\\).", loesungsweg: "$$\\sqrt{9+16} = 5$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(\\vec{v} = \\binom{-3}{4}\\). Laenge?", loesung: 5, toleranz: 0, tipp: "Betragsquadrat.", loesungsweg: "$$\\sqrt{9+16} = 5$$" },
      { id: 17, level: 3, typ: "mc", frage: "Zwei Vektoren sind parallel, wenn ...", optionen: ["sie gleiche Laenge haben", "einer Vielfaches des anderen ist", "sie senkrecht stehen", "ihre Summe Null ist"], korrekt: 1, tipp: "Skalar-Vielfaches.", loesungsweg: "\\(\\vec{a} \\parallel \\vec{b} \\iff \\vec{a} = k \\vec{b}\\)." },
      { id: 18, level: 3, typ: "mc", frage: "Welche sind parallel zu \\(\\binom{2}{3}\\)?", optionen: ["\\(\\binom{4}{6}\\)", "\\(\\binom{3}{2}\\)", "\\(\\binom{2}{-3}\\)", "\\(\\binom{1}{1}\\)"], korrekt: 0, tipp: "Doppelte.", loesungsweg: "$$\\binom{4}{6} = 2 \\binom{2}{3}$$" },
      // LEVEL 4
      { id: 19, level: 4, typ: "numerisch", frage: "Mittelpunkt von \\(A(2;3)\\) und \\(B(8;9)\\): x-Koordinate?", loesung: 5, toleranz: 0, tipp: "\\((A_x + B_x)/2\\).", loesungsweg: "$$M_x = 5$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Mittelpunkt von \\(A(2;3)\\) und \\(B(8;9)\\): y-Koordinate?", loesung: 6, toleranz: 0, tipp: "Mittelwert.", loesungsweg: "$$M_y = (3+9)/2 = 6$$" },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(|\\vec{v}|\\) mit \\(\\vec{v} = \\binom{5}{12}\\)?", loesung: 13, toleranz: 0, tipp: "5-12-13-Tripel.", loesungsweg: "$$\\sqrt{25+144} = 13$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(\\vec{a} = \\binom{3}{4}\\). Einheitsvektor laenge? (Betrag)", loesung: 1, toleranz: 0, tipp: "Einheitsvektor hat Laenge 1.", loesungsweg: "Per Definition." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(3 \\vec{a} - 2 \\vec{b}\\) mit \\(\\vec{a} = \\binom{2}{1}\\), \\(\\vec{b} = \\binom{1}{3}\\). y-Komponente?", loesung: -3, toleranz: 0, tipp: "\\(3 \\cdot 1 - 2 \\cdot 3\\).", loesungsweg: "$$y = 3 - 6 = -3$$" },
      { id: 24, level: 4, typ: "mc", frage: "Welche Aussage ist richtig?", optionen: ["\\(\\vec{a} + \\vec{b} = \\vec{b} + \\vec{a}\\)", "\\(\\vec{a} - \\vec{b} = \\vec{b} - \\vec{a}\\)", "\\(|\\vec{a} + \\vec{b}| = |\\vec{a}| + |\\vec{b}|\\) immer", "\\(\\vec{a} \\cdot 0 = \\vec{a}\\)"], korrekt: 0, tipp: "Kommutativitaet.", loesungsweg: "Addition ist <b>kommutativ</b>." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "\\(A(1;2)\\), \\(B(4;6)\\), \\(C(?;?)\\) so dass \\(\\vec{AC} = 2 \\vec{AB}\\). x-Koordinate von \\(C\\)?", loesung: 7, toleranz: 0, tipp: "\\(\\vec{AB} = \\binom{3}{4}\\), \\(\\vec{AC} = \\binom{6}{8}\\), \\(C = A + \\vec{AC}\\).", loesungsweg: "$$C_x = 1 + 6 = 7$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Selbe Aufgabe: y-Koordinate von \\(C\\)?", loesung: 10, toleranz: 0, tipp: "\\(2 + 8\\).", loesungsweg: "$$C_y = 10$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Diagonale eines Rechtecks \\(5 \\times 12\\). Laenge?", loesung: 13, toleranz: 0, tipp: "Pythagoras.", loesungsweg: "$$\\sqrt{25+144} = 13$$" },
      { id: 28, level: 5, typ: "mc", frage: "Welche Vektoren sind gleich?", optionen: ["gleiche Endpunkte", "gleiche Laenge und Richtung", "gleiche Richtung", "paralleler Verlauf"], korrekt: 1, tipp: "Position spielt keine Rolle.", loesungsweg: "Gleiche Vektoren: <b>gleiche Laenge und gleiche Richtung</b>." },
      { id: 29, level: 5, typ: "numerisch", frage: "Viereck \\(ABCD\\) ist Parallelogramm, \\(A(0;0)\\), \\(B(5;0)\\), \\(D(1;3)\\). \\(C\\) = \\(B + \\vec{AD}\\). x-Koord von \\(C\\)?", loesung: 6, toleranz: 0, tipp: "\\(\\vec{AD} = \\binom{1}{3}\\), \\(C = B + \\vec{AD}\\).", loesungsweg: "$$C_x = 5 + 1 = 6$$" },
      { id: 30, level: 5, typ: "numerisch", frage: "y-Koord von \\(C\\) in Aufgabe 29?", loesung: 3, toleranz: 0, tipp: "\\(0 + 3\\).", loesungsweg: "$$C_y = 3$$" },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "\\(\\vec{v} = \\binom{2}{k}\\) soll Laenge \\(\\sqrt{13}\\) haben, \\(k > 0\\). \\(k = ?\\)", loesung: 3, toleranz: 0, tipp: "\\(4 + k^2 = 13\\).", loesungsweg: "$$k^2 = 9 \\implies k = 3$$" },
      { id: 32, level: 6, typ: "numerisch", frage: "Umfang des Dreiecks \\(A(0;0)\\), \\(B(3;0)\\), \\(C(0;4)\\)?", loesung: 12, toleranz: 0, tipp: "Seiten 3, 4, 5.", loesungsweg: "$$3 + 4 + 5 = 12$$" },
      { id: 33, level: 6, typ: "mc", frage: "\\(\\vec{AB} + \\vec{BC} + \\vec{CA} = ?\\)", optionen: ["\\(\\vec{0}\\)", "\\(\\vec{AB}\\)", "\\(|\\vec{AB}|\\)", "\\(\\vec{AC}\\)"], korrekt: 0, tipp: "Geschlossener Umlauf.", loesungsweg: "Geschlossener Polygonzug ergibt <b>Nullvektor</b>." },
      { id: 34, level: 6, typ: "numerisch", frage: "\\(P(x; 2)\\), Abstand von \\(O(0;0)\\) ist \\(\\sqrt{29}\\), \\(x > 0\\). \\(x = ?\\)", loesung: 5, toleranz: 0, tipp: "\\(x^2 + 4 = 29\\).", loesungsweg: "$$x^2 = 25 \\implies x = 5$$" },
      { id: 35, level: 6, typ: "numerisch", frage: "Mittelpunkt von \\(A(-3;2)\\) und \\(B(7;-6)\\), x-Koord?", loesung: 2, toleranz: 0, tipp: "\\((-3+7)/2\\).", loesungsweg: "$$M_x = 2$$" },
      { id: 36, level: 6, typ: "numerisch", frage: "Vektor \\(\\binom{a}{4}\\) hat Laenge 5. \\(a > 0\\). \\(a = ?\\)", loesung: 3, toleranz: 0, tipp: "\\(a^2 + 16 = 25\\).", loesungsweg: "$$a = 3$$" }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
