<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vektoren in 2D - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-vektoren-2d';
    const THEMA_CONFIG = { name: 'Vektoren in 2D', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Ein Vektor beschreibt ...", optionen: ["nur eine Länge", "eine Verschiebung mit Richtung und Betrag", "einen Punkt", "einen Winkel"], korrekt: 1, tipp: "Pfeil in der Ebene.", loesungsweg: "Ein Vektor ist eine <b>gerichtete Größe</b> (Verschiebung)." },
      { id: 2, level: 1, typ: "mc", frage: "Der Vektor \\(\\vec{v} = \\binom{3}{2}\\) bedeutet ...", optionen: ["3 nach oben, 2 nach rechts", "3 nach rechts, 2 nach oben", "Punkt (3,2)", "Länge 3, Winkel 2"], korrekt: 1, tipp: "Erste Koordinate: x. Zweite: y.", loesungsweg: "Ein Vektor beschreibt eine Verschiebung, keinen Ort. Die obere Zahl gibt an, wie weit es in \\(x\\)-Richtung geht, die untere in \\(y\\)-Richtung: $$\\binom{3}{2}: \\text{3 nach rechts, 2 nach oben}$$ Derselbe Vektor kann überall im Koordinatensystem angetragen werden — im Gegensatz zum Punkt \\((3;2)\\), der einen festen Ort bezeichnet." },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(\\vec{a} = \\binom{4}{3}\\). Länge \\(|\\vec{a}|\\)?", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{x^2 + y^2}\\).", loesungsweg: "$$|\\vec{a}| = \\sqrt{16 + 9} = 5$$" },
      { id: 4, level: 1, typ: "mc", frage: "Nullvektor ist ...", optionen: ["\\(\\binom{0}{0}\\)", "\\(\\binom{1}{0}\\)", "\\(\\binom{0}{1}\\)", "\\(\\binom{-1}{-1}\\)"], korrekt: 0, tipp: "Keine Verschiebung.", loesungsweg: "Der Nullvektor verschiebt nicht: $$\\vec 0 = \\binom{0}{0}$$ Addiert man ihn zu einem beliebigen Vektor, bleibt dieser unverändert." },
      { id: 5, level: 1, typ: "mc", frage: "Gegenvektor zu \\(\\binom{3}{-2}\\)?", optionen: ["\\(\\binom{-3}{2}\\)", "\\(\\binom{3}{2}\\)", "\\(\\binom{-3}{-2}\\)", "\\(\\binom{2}{3}\\)"], korrekt: 0, tipp: "Alle Vorzeichen umkehren.", loesungsweg: "Der Gegenvektor zeigt in die entgegengesetzte Richtung; dafür kehren sich alle Vorzeichen um: $$-\\binom{3}{-2} = \\binom{-3}{2}$$ Seine Länge bleibt dieselbe." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(\\vec{a} = \\binom{6}{8}\\). \\(|\\vec{a}| = ?\\)", loesung: 10, toleranz: 0, tipp: "Pythagoras.", loesungsweg: "Der Betrag folgt aus dem Satz des Pythagoras — die Komponenten sind die Katheten: $$|\\vec a| = \\sqrt{6^2+8^2} = \\sqrt{36+64} = \\sqrt{100} = 10$$" },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "\\(\\binom{2}{3} + \\binom{4}{1}\\). Gib die x-Koordinate an.", loesung: 6, toleranz: 0, tipp: "Addiere komponentenweise.", loesungsweg: "$$x = 2 + 4 = 6$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(\\binom{5}{7} - \\binom{2}{3}\\). y-Koordinate?", loesung: 4, toleranz: 0, tipp: "y: \\(7 - 3\\).", loesungsweg: "Vektoren werden komponentenweise subtrahiert: $$\\binom{5}{7} - \\binom{2}{3} = \\binom{3}{4}$$ Die \\(y\\)-Koordinate ist \\(7 - 3 = 4\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(3 \\cdot \\binom{2}{-1}\\). x-Komponente?", loesung: 6, toleranz: 0, tipp: "Skalarmultiplikation.", loesungsweg: "Bei der Multiplikation mit einer Zahl wird jede Komponente einzeln multipliziert: $$3 \\cdot \\binom{2}{-1} = \\binom{6}{-3}$$ Die \\(x\\)-Komponente ist \\(3 \\cdot 2 = 6\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Ortsvektor des Punkts \\(P(3; 4)\\). Länge?", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{9 + 16}\\).", loesungsweg: "Der Ortsvektor führt vom Ursprung zum Punkt, seine Komponenten sind also die Koordinaten: $$|\\vec{OP}| = \\sqrt{3^2+4^2} = \\sqrt{25} = 5$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(\\vec{AB}\\) mit \\(A(1;2)\\), \\(B(5;5)\\). Länge?", loesung: 5, toleranz: 0, tipp: "\\(\\vec{AB} = \\binom{4}{3}\\).", loesungsweg: "$$|\\vec{AB}| = \\sqrt{16+9} = 5$$" },
      { id: 12, level: 2, typ: "mc", frage: "\\(\\vec{AB}\\) mit \\(A(2;1)\\) und \\(B(7;4)\\) ist ...", optionen: ["\\(\\binom{5}{3}\\)", "\\(\\binom{9}{5}\\)", "\\(\\binom{-5}{-3}\\)", "\\(\\binom{3}{5}\\)"], korrekt: 0, tipp: "\\(\\vec{AB} = B - A\\).", loesungsweg: "Der Verbindungsvektor ist „Spitze minus Fuß\": $$\\vec{AB} = \\binom{7-2}{4-1} = \\binom{5}{3}$$ Bei umgekehrter Reihenfolge käme der Gegenvektor \\(\\binom{-5}{-3}\\) heraus." },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "\\(\\vec{a} = \\binom{2}{1}\\), \\(\\vec{b} = \\binom{3}{5}\\). x-Komponente von \\(\\vec{a} + \\vec{b}\\)?", loesung: 5, toleranz: 0, tipp: "Addieren.", loesungsweg: "$$x = 2 + 3 = 5$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(2 \\vec{a} + \\vec{b}\\) mit \\(\\vec{a} = \\binom{1}{2}\\), \\(\\vec{b} = \\binom{3}{0}\\). x-Komponente?", loesung: 5, toleranz: 0, tipp: "\\(2 \\cdot 1 + 3\\).", loesungsweg: "$$x = 2 + 3 = 5$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Abstand zwischen \\(A(1;1)\\) und \\(B(4;5)\\)?", loesung: 5, toleranz: 0, tipp: "Länge von \\(\\vec{AB}\\).", loesungsweg: "Der Abstand ist der Betrag des Verbindungsvektors \\(\\vec{AB} = \\binom{3}{4}\\): $$|\\vec{AB}| = \\sqrt{9+16} = \\sqrt{25} = 5$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(\\vec{v} = \\binom{-3}{4}\\). Länge?", loesung: 5, toleranz: 0, tipp: "Betragsquadrat.", loesungsweg: "$$|\\vec v| = \\sqrt{(-3)^2+4^2} = \\sqrt{9+16} = 5$$ Das Minuszeichen verschwindet beim Quadrieren — die Länge ist nie negativ." },
      { id: 17, level: 3, typ: "mc", frage: "Zwei Vektoren sind parallel, wenn ...", optionen: ["sie gleiche Länge haben", "einer Vielfaches des anderen ist", "sie senkrecht stehen", "ihre Summe Null ist"], korrekt: 1, tipp: "Skalar-Vielfaches.", loesungsweg: "Parallel bedeutet gleiche oder genau entgegengesetzte Richtung. Das ist gleichbedeutend damit, dass ein Vektor ein Vielfaches des anderen ist: $$\\vec a \\parallel \\vec b \\iff \\vec a = k \\cdot \\vec b$$ Gleiche Länge genügt nicht — zwei gleich lange Vektoren können in ganz verschiedene Richtungen zeigen." },
      { id: 18, level: 3, typ: "mc", frage: "Welche sind parallel zu \\(\\binom{2}{3}\\)?", optionen: ["\\(\\binom{4}{6}\\)", "\\(\\binom{3}{2}\\)", "\\(\\binom{2}{-3}\\)", "\\(\\binom{1}{1}\\)"], korrekt: 0, tipp: "Doppelte.", loesungsweg: "Prüfen, ob ein gemeinsamer Faktor existiert: $$\\binom{4}{6} = 2 \\cdot \\binom{2}{3}$$ Beide Komponenten werden mit demselben Faktor \\(2\\) gestreckt. Bei \\(\\binom{3}{2}\\) wären die Verhältnisse \\(\\tfrac32\\) und \\(\\tfrac23\\) verschieden — also nicht parallel." },
      // LEVEL 4
      { id: 19, level: 4, typ: "numerisch", frage: "Mittelpunkt von \\(A(2;3)\\) und \\(B(8;9)\\): x-Koordinate?", loesung: 5, toleranz: 0, tipp: "\\((A_x + B_x)/2\\).", loesungsweg: "Der Mittelpunkt hat als Koordinaten die Mittelwerte: $$M_x = \\frac{2+8}{2} = 5$$ Entsprechend wäre \\(M_y = \\frac{3+9}{2} = 6\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Mittelpunkt von \\(A(2;3)\\) und \\(B(8;9)\\): y-Koordinate?", loesung: 6, toleranz: 0, tipp: "Mittelwert.", loesungsweg: "$$M_y = (3+9)/2 = 6$$" },
      { id: 21, level: 4, typ: "numerisch", frage: "\\(|\\vec{v}|\\) mit \\(\\vec{v} = \\binom{5}{12}\\)?", loesung: 13, toleranz: 0, tipp: "5-12-13-Tripel.", loesungsweg: "$$|\\vec v| = \\sqrt{5^2+12^2} = \\sqrt{25+144} = \\sqrt{169} = 13$$ Das Tripel \\((5;12;13)\\) ist wie \\((3;4;5)\\) ein pythagoreisches Tripel — die Wurzel geht glatt auf." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(\\vec{a} = \\binom{3}{4}\\). Einheitsvektor länge? (Betrag)", loesung: 1, toleranz: 0, tipp: "Einheitsvektor hat Länge 1.", loesungsweg: "Ein Einheitsvektor ist per Definition auf die Länge \\(1\\) normiert: $$\\vec e = \\frac{\\vec a}{|\\vec a|} \\;\\Rightarrow\\; |\\vec e| = \\frac{|\\vec a|}{|\\vec a|} = 1$$ Hier wäre \\(|\\vec a| = 5\\), also \\(\\vec e = \\binom{0{,}6}{0{,}8}\\) — und dessen Länge ist wieder \\(1\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(3 \\vec{a} - 2 \\vec{b}\\) mit \\(\\vec{a} = \\binom{2}{1}\\), \\(\\vec{b} = \\binom{1}{3}\\). y-Komponente?", loesung: -3, toleranz: 0, tipp: "\\(3 \\cdot 1 - 2 \\cdot 3\\).", loesungsweg: "$$y = 3 - 6 = -3$$" },
      { id: 24, level: 4, typ: "mc", frage: "Welche Rechenregel für Vektoren gilt uneingeschränkt?", optionen: ["\\(\\vec{a} + \\vec{b} = \\vec{b} + \\vec{a}\\)", "\\(\\vec{a} - \\vec{b} = \\vec{b} - \\vec{a}\\)", "\\(|\\vec{a} + \\vec{b}| = |\\vec{a}| + |\\vec{b}|\\) immer", "\\(\\vec{a} \\cdot 0 = \\vec{a}\\)"], korrekt: 0, tipp: "Kommutativität.", loesungsweg: "Die Vektoraddition ist kommutativ: $$\\vec a + \\vec b = \\vec b + \\vec a$$ Anschaulich ist das die Diagonale desselben Parallelogramms, gleichgültig in welcher Reihenfolge man die Vektoren aneinandersetzt. Die Subtraktion ist dagegen <b>nicht</b> kommutativ, und die Dreiecksungleichung \\(|\\vec a + \\vec b| \\leq |\\vec a| + |\\vec b|\\) gilt nur mit Gleichheit, wenn beide Vektoren dieselbe Richtung haben." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "\\(A(1;2)\\), \\(B(4;6)\\), \\(C(?;?)\\) so dass \\(\\vec{AC} = 2 \\vec{AB}\\). x-Koordinate von \\(C\\)?", loesung: 7, toleranz: 0, tipp: "\\(\\vec{AB} = \\binom{3}{4}\\), \\(\\vec{AC} = \\binom{6}{8}\\), \\(C = A + \\vec{AC}\\).", loesungsweg: "$$C_x = 1 + 6 = 7$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "\\(A(1;2)\\), \\(B(4;6)\\), \\(C(?;?)\\) so dass \\(\\vec{AC} = 2 \\vec{AB}\\). y-Koordinate von \\(C\\)?", loesung: 10, toleranz: 0, tipp: "\\(2 + 8\\).", loesungsweg: "$$\\vec{AB} = \\binom{3}{4} \\;\\Rightarrow\\; \\vec{AC} = 2\\vec{AB} = \\binom{6}{8}$$ $$C = A + \\vec{AC} = \\binom{1}{2} + \\binom{6}{8} = \\binom{7}{10}$$ Die \\(y\\)-Koordinate ist \\(10\\). Der Punkt \\(B\\) liegt dabei genau in der Mitte zwischen \\(A\\) und \\(C\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Diagonale eines Rechtecks \\(5 \\times 12\\). Länge?", loesung: 13, toleranz: 0, tipp: "Pythagoras.", loesungsweg: "Die Diagonale ist der Verbindungsvektor zweier gegenüberliegender Ecken, seine Komponenten sind die Seitenlängen: $$d = \\sqrt{5^2+12^2} = \\sqrt{169} = 13$$" },
      { id: 28, level: 5, typ: "mc", frage: "Welche Vektoren sind gleich?", optionen: ["gleiche Endpunkte", "gleiche Länge und Richtung", "gleiche Richtung", "paralleler Verlauf"], korrekt: 1, tipp: "Position spielt keine Rolle.", loesungsweg: "Gleiche Vektoren: <b>gleiche Länge und gleiche Richtung</b>." },
      { id: 29, level: 5, typ: "numerisch", frage: "Viereck \\(ABCD\\) ist Parallelogramm, \\(A(0;0)\\), \\(B(5;0)\\), \\(D(1;3)\\). \\(C\\) = \\(B + \\vec{AD}\\). x-Koord von \\(C\\)?", loesung: 6, toleranz: 0, tipp: "\\(\\vec{AD} = \\binom{1}{3}\\), \\(C = B + \\vec{AD}\\).", loesungsweg: "$$C_x = 5 + 1 = 6$$" },
      { id: 30, level: 5, typ: "numerisch", frage: "Viereck \\(ABCD\\) ist ein Parallelogramm mit \\(A(0;0)\\), \\(B(5;0)\\), \\(D(1;3)\\) und \\(C = B + \\vec{AD}\\). Wie lautet die y-Koordinate von \\(C\\)?", loesung: 3, toleranz: 0, tipp: "\\(0 + 3\\).", loesungsweg: "Im Parallelogramm \\(ABCD\\) mit \\(A(0;0)\\), \\(B(5;0)\\), \\(D(1;3)\\) gilt \\(\\vec{AD} = \\binom{1}{3}\\) und damit $$C = B + \\vec{AD} = \\binom{5}{0} + \\binom{1}{3} = \\binom{6}{3}$$ Die \\(y\\)-Koordinate ist \\(3\\). Dass \\(\\vec{BC} = \\vec{AD}\\) gilt, ist gerade die Parallelogramm-Eigenschaft." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "\\(\\vec{v} = \\binom{2}{k}\\) soll Länge \\(\\sqrt{13}\\) haben, \\(k > 0\\). \\(k = ?\\)", loesung: 3, toleranz: 0, tipp: "\\(4 + k^2 = 13\\).", loesungsweg: "$$k^2 = 9 \\implies k = 3$$" },
      { id: 32, level: 6, typ: "numerisch", frage: "Umfang des Dreiecks \\(A(0;0)\\), \\(B(3;0)\\), \\(C(0;4)\\)?", loesung: 12, toleranz: 0, tipp: "Seiten 3, 4, 5.", loesungsweg: "Die Seiten sind \\(\\overline{AB} = 3\\), \\(\\overline{AC} = 4\\) und die Hypotenuse $$\\overline{BC} = \\sqrt{3^2+4^2} = 5$$ $$U = 3 + 4 + 5 = 12$$" },
      { id: 33, level: 6, typ: "mc", frage: "\\(\\vec{AB} + \\vec{BC} + \\vec{CA} = ?\\)", optionen: ["\\(\\vec{0}\\)", "\\(\\vec{AB}\\)", "\\(|\\vec{AB}|\\)", "\\(\\vec{AC}\\)"], korrekt: 0, tipp: "Geschlossener Umlauf.", loesungsweg: "Geschlossener Polygonzug ergibt <b>Nullvektor</b>." },
      { id: 34, level: 6, typ: "numerisch", frage: "\\(P(x; 2)\\), Abstand von \\(O(0;0)\\) ist \\(\\sqrt{29}\\), \\(x > 0\\). \\(x = ?\\)", loesung: 5, toleranz: 0, tipp: "\\(x^2 + 4 = 29\\).", loesungsweg: "$$x^2 = 25 \\implies x = 5$$" },
      { id: 35, level: 6, typ: "numerisch", frage: "Mittelpunkt von \\(A(-3;2)\\) und \\(B(7;-6)\\), x-Koord?", loesung: 2, toleranz: 0, tipp: "\\((-3+7)/2\\).", loesungsweg: "$$M_x = \\frac{-3+7}{2} = \\frac{4}{2} = 2$$ Das Vorzeichen muss beim Addieren beachtet werden — \\(-3+7\\) ergibt \\(4\\), nicht \\(10\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Vektor \\(\\binom{a}{4}\\) hat Länge 5. \\(a > 0\\). \\(a = ?\\)", loesung: 3, toleranz: 0, tipp: "\\(a^2 + 16 = 25\\).", loesungsweg: "Aus der Bedingung für den Betrag: $$\\sqrt{a^2+4^2} = 5 \\;\\Rightarrow\\; a^2 + 16 = 25 \\;\\Rightarrow\\; a^2 = 9$$ Damit ist \\(a = \\pm 3\\); wegen \\(a > 0\\) bleibt \\(a = 3\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
