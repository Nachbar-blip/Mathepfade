      { id: 1, level: 1, typ: "numerisch", frage: "Berechne \\(25\\,\\%\\) von \\(160\\).", loesung: 40, toleranz: 0, tipp: "\\(25\\,\\%\\) ist ein Viertel.", loesungsweg: "$$25\\,\\% \\text{ von } 160 = \\frac{1}{4} \\cdot 160 = 40$$ Oder: \\(1\\,\\%\\) sind \\(1{,}6\\), also \\(25 \\cdot 1{,}6 = 40\\) ✓" },
      { id: 2, level: 1, typ: "mc", frage: "Welcher Bruch entspricht \\(40\\,\\%\\)?", optionen: ["\\(\\frac{2}{5}\\)", "\\(\\frac{1}{4}\\)", "\\(\\frac{4}{5}\\)", "\\(\\frac{1}{40}\\)"], korrekt: 0, tipp: "\\(40\\,\\%\\) bedeutet \\(40\\) von \\(100\\) — dann kürzen.", loesungsweg: "$$40\\,\\% = \\frac{40}{100} = \\frac{2}{5}$$ Kontrolle: \\(\\frac{2}{5} = 0{,}4\\) und \\(0{,}4 = 40\\,\\%\\) ✓" },
      { id: 3, level: 1, typ: "numerisch", frage: "Wie viel Prozent sind \\(\\frac{3}{20}\\)? Gib nur die Zahl an.", loesung: 15, toleranz: 0, tipp: "Auf den Nenner \\(100\\) erweitern.", loesungsweg: "$$\\frac{3}{20} = \\frac{3 \\cdot 5}{20 \\cdot 5} = \\frac{15}{100} = 15\\,\\%$$" },
      { id: 4, level: 1, typ: "numerisch", frage: "Wie viel Prozent sind \\(12\\) von \\(48\\)? Gib nur die Zahl an.", loesung: 25, toleranz: 0, tipp: "Welcher Bruch ist \\(\\frac{12}{48}\\) gekürzt?", loesungsweg: "$$\\frac{12}{48} = \\frac{1}{4} = 25\\,\\%$$ Der Prozentsatz ist der Anteil, als Hundertstel geschrieben." },
      { id: 5, level: 1, typ: "numerisch", frage: "\\(10\\,\\%\\) einer Zahl sind \\(7\\). Wie groß ist die Zahl?", loesung: 70, toleranz: 0, tipp: "\\(10\\,\\%\\) ist ein Zehntel.", loesungsweg: "Ein Zehntel ist \\(7\\), das Ganze ist zehnmal so viel: $$7 \\cdot 10 = 70$$ Probe: \\(10\\,\\%\\) von \\(70\\) sind \\(7\\) ✓" },
      { id: 6, level: 1, typ: "mc", frage: "Wie schreibt man \\(0{,}35\\) als Prozentsatz?", optionen: ["\\(35\\,\\%\\)", "\\(3{,}5\\,\\%\\)", "\\(0{,}35\\,\\%\\)", "\\(350\\,\\%\\)"], korrekt: 0, tipp: "Prozent heißt Hundertstel.", loesungsweg: "$$0{,}35 = \\frac{35}{100} = 35\\,\\%$$ Vom Dezimalbruch zum Prozentsatz: mit \\(100\\) multiplizieren, Komma zwei Stellen nach rechts." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne \\(15\\,\\%\\) von \\(240\\).", loesung: 36, toleranz: 0, tipp: "Erst \\(1\\,\\%\\), dann \\(15\\,\\%\\).", loesungsweg: "Dreisatz: \\(100\\,\\% \\mathrel{\\hat=} 240\\), also \\(1\\,\\% \\mathrel{\\hat=} 2{,}4\\): $$15 \\cdot 2{,}4 = 36$$ Oder: \\(10\\,\\%\\) sind \\(24\\), \\(5\\,\\%\\) sind \\(12\\), zusammen \\(36\\) ✓" },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(18\\,\\%\\) eines Grundwertes sind \\(63\\). Wie groß ist der Grundwert?", loesung: 350, toleranz: 0, tipp: "Erst \\(1\\,\\%\\) berechnen, dann \\(100\\,\\%\\).", loesungsweg: "Dreisatz: \\(18\\,\\% \\mathrel{\\hat=} 63\\), also \\(1\\,\\% \\mathrel{\\hat=} 3{,}5\\): $$100 \\cdot 3{,}5 = 350$$ Probe: \\(18\\,\\%\\) von \\(350\\) sind \\(63\\) ✓" },
      { id: 9, level: 2, typ: "numerisch", frage: "Wie viel Prozent sind \\(51\\) von \\(340\\)? Gib nur die Zahl an.", loesung: 15, toleranz: 0, tipp: "Was ist \\(1\\,\\%\\) von \\(340\\)?", loesungsweg: "\\(1\\,\\%\\) von \\(340\\) sind \\(3{,}4\\). Wie oft passt \\(3{,}4\\) in \\(51\\)? $$51 : 3{,}4 = 15$$ Also \\(15\\,\\%\\). Kontrolle: \\(\\frac{51}{340} = 0{,}15\\) ✓" },
      { id: 10, level: 2, typ: "numerisch", frage: "Berechne \\(130\\,\\%\\) von \\(80\\).", loesung: 104, toleranz: 0, tipp: "Mehr als \\(100\\,\\%\\) — das Ergebnis ist größer als der Grundwert.", loesungsweg: "\\(1\\,\\%\\) von \\(80\\) sind \\(0{,}8\\): $$130 \\cdot 0{,}8 = 104$$ Oder: \\(100\\,\\%\\) sind \\(80\\), \\(30\\,\\%\\) sind \\(24\\), zusammen \\(104\\) ✓" },
      { id: 11, level: 2, typ: "mc", frage: "\\(27\\) von \\(45\\): Welche Rechnung liefert den Prozentsatz?", optionen: ["\\(27 : 45 \\cdot 100\\)", "\\(45 : 27 \\cdot 100\\)", "\\(27 \\cdot 45 : 100\\)", "\\(45 - 27\\)"], korrekt: 0, tipp: "Der Prozentsatz ist der Anteil des Prozentwertes am Grundwert.", loesungsweg: "Prozentwert geteilt durch Grundwert ergibt den Anteil, mal \\(100\\) den Prozentsatz: $$\\frac{27}{45} \\cdot 100 = 0{,}6 \\cdot 100 = 60\\,\\%$$ \\(45 : 27\\) wäre größer als \\(1\\) — \\(27\\) ist aber weniger als das Ganze." },
      { id: 12, level: 2, typ: "numerisch", frage: "Grundwert \\(400\\), Prozentsatz \\(175\\,\\%\\). Berechne den Prozentwert.", loesung: 700, toleranz: 0, tipp: "\\(175\\,\\%\\) sind das \\(1{,}75\\)-Fache.", loesungsweg: "$$400 \\cdot 1{,}75 = 700$$ Oder in Schritten: \\(100\\,\\%\\) sind \\(400\\), \\(75\\,\\%\\) sind \\(300\\), zusammen \\(700\\) ✓" },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "Eine Jacke kostet \\(80\\,€\\). Im Schlussverkauf gibt es \\(30\\,\\%\\) Rabatt. Wie viel kostet die Jacke jetzt in €?", loesung: 56, toleranz: 0, tipp: "Erst den Rabatt in Euro, dann abziehen.", loesungsweg: "Rabatt: \\(30\\,\\%\\) von \\(80\\,€\\) sind \\(24\\,€\\): $$80 - 24 = 56\\,€$$ Schneller: Nach \\(30\\,\\%\\) Rabatt bleiben \\(70\\,\\%\\), also \\(80 \\cdot 0{,}7 = 56\\,€\\) ✓" },
      { id: 14, level: 3, typ: "numerisch", frage: "Ein Laptop kostet ohne Mehrwertsteuer \\(700\\,€\\). Wie viel kostet er mit \\(19\\,\\%\\) Mehrwertsteuer in €?", loesung: 833, toleranz: 0, tipp: "Die Steuer kommt zum Nettopreis dazu.", loesungsweg: "Mehrwertsteuer: \\(19\\,\\%\\) von \\(700\\,€\\) sind \\(133\\,€\\): $$700 + 133 = 833\\,€$$ Oder mit dem Faktor \\(1{,}19\\): \\(700 \\cdot 1{,}19 = 833\\,€\\) ✓" },
      { id: 15, level: 3, typ: "numerisch", frage: "Ein Guthaben von \\(2500\\,€\\) wird ein Jahr lang mit \\(3\\,\\%\\) verzinst. Wie viel Zinsen gibt es in €?", loesung: 75, toleranz: 0, tipp: "Zinsen sind ein Prozentwert vom Kapital.", loesungsweg: "\\(1\\,\\%\\) von \\(2500\\,€\\) sind \\(25\\,€\\): $$3 \\cdot 25 = 75\\,€$$ Nach einem Jahr stehen \\(2575\\,€\\) auf dem Konto." },
      { id: 16, level: 3, typ: "numerisch", frage: "Eine Rechnung über \\(1200\\,€\\) darf bei Zahlung innerhalb von zehn Tagen mit \\(2\\,\\%\\) Skonto bezahlt werden. Welcher Betrag in € wird dann überwiesen?", loesung: 1176, toleranz: 0, tipp: "Skonto ist ein Rabatt für schnelles Zahlen.", loesungsweg: "Skonto: \\(2\\,\\%\\) von \\(1200\\,€\\) sind \\(24\\,€\\): $$1200 - 24 = 1176\\,€$$ Oder: \\(98\\,\\%\\) von \\(1200\\,€\\), also \\(1200 \\cdot 0{,}98 = 1176\\,€\\) ✓" },
      { id: 17, level: 3, typ: "mc", frage: "Die Einwohnerzahl eines Dorfes steigt von \\(800\\) auf \\(920\\). Um wie viel Prozent ist sie gestiegen?", optionen: ["\\(15\\,\\%\\)", "\\(12\\,\\%\\)", "\\(120\\,\\%\\)", "\\(13\\,\\%\\)"], korrekt: 0, tipp: "Die Zunahme wird auf den alten Wert bezogen.", loesungsweg: "Zunahme: \\(920 - 800 = 120\\). Grundwert ist die <b>alte</b> Zahl: $$\\frac{120}{800} = 0{,}15 = 15\\,\\%$$ Wer durch \\(920\\) teilt, erhält \\(13\\,\\%\\) — falscher Grundwert." },
      { id: 18, level: 3, typ: "numerisch", frage: "Ein Fahrrad kostete \\(450\\,€\\). Jetzt kostet es \\(20\\,\\%\\) mehr. Wie viel kostet es jetzt in €?", loesung: 540, toleranz: 0, tipp: "„\\(20\\,\\%\\) mehr“ heißt: \\(120\\,\\%\\) des alten Preises.", loesungsweg: "Aufschlag: \\(20\\,\\%\\) von \\(450\\,€\\) sind \\(90\\,€\\): $$450 + 90 = 540\\,€$$ Oder: \\(450 \\cdot 1{,}2 = 540\\,€\\) ✓" },
      // LEVEL 4
      { id: 19, level: 4, typ: "numerisch", frage: "Nach einer Preissenkung um \\(15\\,\\%\\) kostet ein Handy \\(340\\,€\\). Wie viel kostete es vorher in €?", loesung: 400, toleranz: 0, tipp: "\\(340\\,€\\) sind nicht \\(100\\,\\%\\).", loesungsweg: "Der neue Preis entspricht \\(85\\,\\%\\) des alten: $$340 : 0{,}85 = 400\\,€$$ Probe: \\(15\\,\\%\\) von \\(400\\,€\\) sind \\(60\\,€\\), und \\(400 - 60 = 340\\) ✓ Typischer Fehler: \\(15\\,\\%\\) von \\(340\\,€\\) dazurechnen (\\(391\\,€\\))." },
      { id: 20, level: 4, typ: "numerisch", frage: "Ein Sparguthaben von \\(4800\\,€\\) wird mit \\(2{,}5\\,\\%\\) pro Jahr verzinst. Wie viel Zinsen in € gibt es für \\(8\\) Monate?", loesung: 80, toleranz: 0, tipp: "Der Zinssatz gilt für ein ganzes Jahr.", loesungsweg: "Jahreszinsen: \\(2{,}5\\,\\%\\) von \\(4800\\,€\\) sind \\(120\\,€\\). Für \\(8\\) von \\(12\\) Monaten: $$120 \\cdot \\frac{8}{12} = 80\\,€$$ Probe: Pro Monat \\(10\\,€\\), also \\(8 \\cdot 10 = 80\\,€\\) ✓" },
      { id: 21, level: 4, typ: "numerisch", frage: "Ein Fernseher kostet bei Barzahlung \\(900\\,€\\). Bei Ratenzahlung sind \\(120\\,€\\) Anzahlung und danach \\(12\\) Monatsraten zu je \\(70\\,€\\) fällig. Um wie viel Prozent ist die Ratenzahlung teurer als der Barpreis? (auf zwei Dezimalen)", loesung: 6.67, toleranz: 0.05, tipp: "Erst den Gesamtpreis der Ratenzahlung.", loesungsweg: "Ratenzahlung gesamt: \\(120 + 12 \\cdot 70 = 960\\,€\\). Mehrkosten \\(60\\,€\\), bezogen auf den Barpreis: $$\\frac{60}{900} \\approx 0{,}0667 = 6{,}67\\,\\%$$ Der Grundwert ist der Barpreis, nicht die \\(960\\,€\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Von \\(640\\) Schülerinnen und Schülern einer Schule fahren \\(144\\) mit dem Bus. Welche Größe lässt sich daraus berechnen, und wie groß ist sie?", optionen: ["Der Prozentsatz: \\(22{,}5\\,\\%\\)", "Der Prozentwert: \\(144\\)", "Der Grundwert: \\(640\\)", "Der Prozentsatz: \\(444\\,\\%\\)"], korrekt: 0, tipp: "Zwei der drei Größen sind gegeben — welche fehlt?", loesungsweg: "Gegeben sind Grundwert \\(640\\) und Prozentwert \\(144\\), gesucht ist der Prozentsatz: $$\\frac{144}{640} = 0{,}225 = 22{,}5\\,\\%$$ \\(444\\,\\%\\) entsteht, wenn man \\(640 : 144 = 4{,}44\\) rechnet — Grundwert und Prozentwert vertauscht; ein Anteil von \\(144\\) aus \\(640\\) kann nicht über \\(100\\,\\%\\) liegen." },
      { id: 23, level: 4, typ: "numerisch", frage: "Ein Kredit über \\(3000\\,€\\) wird für \\(90\\) Tage zu \\(6\\,\\%\\) Jahreszins vergeben. Wie viel Zinsen in € fallen an? (Zinsjahr: \\(360\\) Tage)", loesung: 45, toleranz: 0, tipp: "\\(90\\) Tage sind ein Viertel des Zinsjahres.", loesungsweg: "Jahreszinsen: \\(6\\,\\%\\) von \\(3000\\,€\\) sind \\(180\\,€\\). Für \\(90\\) von \\(360\\) Tagen: $$180 \\cdot \\frac{90}{360} = 45\\,€$$" },
      { id: 24, level: 4, typ: "numerisch", frage: "Ein Händler schlägt auf seinen Einkaufspreis \\(40\\,\\%\\) auf und verkauft die Ware für \\(84\\,€\\). Wie hoch war der Einkaufspreis in €?", loesung: 60, toleranz: 0, tipp: "Der Verkaufspreis entspricht mehr als \\(100\\,\\%\\).", loesungsweg: "Verkaufspreis = \\(140\\,\\%\\) des Einkaufspreises: $$84 : 1{,}4 = 60\\,€$$ Probe: \\(40\\,\\%\\) von \\(60\\,€\\) sind \\(24\\,€\\), und \\(60 + 24 = 84\\) ✓ Falsch wäre \\(84 \\cdot 0{,}6 = 50{,}40\\,€\\) — die \\(40\\,\\%\\) beziehen sich auf den Einkaufspreis." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "Ein Preis von \\(500\\,€\\) wird zuerst um \\(20\\,\\%\\) erhöht und danach um \\(20\\,\\%\\) gesenkt. Wie hoch ist der Preis in € am Ende?", loesung: 480, toleranz: 0, tipp: "Die Senkung bezieht sich auf den erhöhten Preis.", loesungsweg: "Erhöhung: \\(500 \\cdot 1{,}2 = 600\\,€\\). Senkung um \\(20\\,\\%\\) von \\(600\\,€\\): $$600 \\cdot 0{,}8 = 480\\,€$$ Der Preis landet nicht wieder bei \\(500\\,€\\), weil die zweite Änderung von einem größeren Grundwert ausgeht: \\(1{,}2 \\cdot 0{,}8 = 0{,}96\\)." },
      { id: 26, level: 5, typ: "mc", frage: "Die Wahlbeteiligung stieg von \\(60\\,\\%\\) auf \\(66\\,\\%\\). Mara: „Das ist eine Steigerung um \\(6\\,\\%\\).“ Was ist dazu zu sagen?", optionen: ["Falsch — um \\(6\\) Prozentpunkte; relativ sind es \\(\\frac{6}{60} = 10\\,\\%\\)", "Richtig", "Falsch — es sind \\(6\\) Prozentpunkte, also \\(6{,}6\\,\\%\\)", "Falsch — die Steigerung beträgt \\(66 - 60 = 6\\), also \\(1\\,\\%\\)"], korrekt: 0, tipp: "Worauf bezieht sich „um \\(6\\,\\%\\)“ — auf \\(100\\) oder auf \\(60\\)?", loesungsweg: "Die Differenz zweier Prozentsätze heißt Prozent<b>punkte</b>: \\(66 - 60 = 6\\) Prozentpunkte. Die relative Steigerung bezieht sich auf den alten Wert: $$\\frac{66 - 60}{60} = \\frac{6}{60} = 10\\,\\%$$ „Um \\(6\\,\\%\\) gestiegen“ hieße \\(60 \\cdot 1{,}06 = 63{,}6\\,\\%\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Sparguthaben bringt in \\(8\\) Monaten \\(84\\,€\\) Zinsen. Der Zinssatz beträgt \\(3{,}5\\,\\%\\) pro Jahr. Wie hoch ist das Guthaben in €?", loesung: 3600, toleranz: 0, tipp: "Wie viel Zinsen wären es in einem ganzen Jahr?", loesungsweg: "Jahreszinsen aus den Monatszinsen: $$84 : 8 \\cdot 12 = 126\\,€$$ Diese \\(126\\,€\\) sind \\(3{,}5\\,\\%\\) des Kapitals, also \\(1\\,\\% \\mathrel{\\hat=} 36\\,€\\): $$100 \\cdot 36 = 3600\\,€$$ Probe: \\(3{,}5\\,\\%\\) von \\(3600\\,€\\) sind \\(126\\,€\\) im Jahr, für \\(8\\) Monate \\(126 \\cdot \\frac{8}{12} = 84\\,€\\) ✓ Typischer Fehler: \\(84\\,€\\) direkt als Jahreszinsen nehmen — das ergäbe \\(2400\\,€\\)." },
      { id: 28, level: 5, typ: "mc", frage: "Ein Pullover kostet nach \\(25\\,\\%\\) Rabatt \\(45\\,€\\). Tim rechnet: „Alter Preis \\(= 45 \\cdot 1{,}25 = 56{,}25\\,€\\).“ Was ist dazu zu sagen?", optionen: ["Falsch — \\(45\\,€\\) sind \\(75\\,\\%\\) des alten Preises: \\(45 : 0{,}75 = 60\\,€\\)", "Richtig", "Falsch — alter Preis \\(45 + 25 = 70\\,€\\)", "Falsch — alter Preis \\(45 : 1{,}25 = 36\\,€\\)"], korrekt: 0, tipp: "Probe: Ziehe von Tims Ergebnis \\(25\\,\\%\\) ab.", loesungsweg: "Der Rabatt wurde vom <b>alten</b> Preis berechnet; dieser ist der Grundwert. Nach \\(25\\,\\%\\) Abzug bleiben \\(75\\,\\%\\): $$45 : 0{,}75 = 60\\,€$$ Probe: \\(60 \\cdot 0{,}75 = 45\\) ✓ Tims Probe scheitert: \\(56{,}25 \\cdot 0{,}75 = 42{,}19\\,€\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Kapital von \\(2000\\,€\\) wird zwei Jahre lang mit \\(4\\,\\%\\) verzinst. Die Zinsen des ersten Jahres bleiben auf dem Konto und werden im zweiten Jahr mitverzinst. Wie hoch ist das Guthaben in € nach zwei Jahren?", loesung: 2163.2, toleranz: 0.01, tipp: "Zweimal nacheinander um \\(4\\,\\%\\) erhöhen.", loesungsweg: "Jahr 1: \\(2000 \\cdot 1{,}04 = 2080\\,€\\). Jahr 2: $$2080 \\cdot 1{,}04 = 2163{,}20\\,€$$ Die Zinsen im zweiten Jahr (\\(83{,}20\\,€\\)) sind höher als im ersten (\\(80\\,€\\)), weil auch die \\(80\\,€\\) Zinsen verzinst werden." },
      { id: 30, level: 5, typ: "numerisch", frage: "Ein Auto verliert im ersten Jahr \\(25\\,\\%\\) seines Neupreises, im zweiten Jahr \\(20\\,\\%\\) des Restwertes. Danach ist es \\(12\\,000\\,€\\) wert. Wie hoch war der Neupreis in €?", loesung: 20000, toleranz: 0, tipp: "Rückwärts rechnen: Welcher Anteil des Neupreises ist nach zwei Jahren übrig?", loesungsweg: "Nach zwei Jahren bleiben \\(0{,}75 \\cdot 0{,}8 = 0{,}6\\), also \\(60\\,\\%\\) des Neupreises: $$12\\,000 : 0{,}6 = 20\\,000\\,€$$ Probe: \\(20\\,000 \\cdot 0{,}75 = 15\\,000\\), \\(15\\,000 \\cdot 0{,}8 = 12\\,000\\) ✓" },
      // LEVEL 6
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Zweimal nacheinander \\(10\\,\\%\\) Rabatt sind dasselbe wie einmal \\(20\\,\\%\\) Rabatt.“", optionen: ["Falsch — \\(0{,}9 \\cdot 0{,}9 = 0{,}81\\), also \\(19\\,\\%\\) Rabatt; der zweite Rabatt bezieht sich auf den schon gesenkten Preis", "Richtig — \\(10\\,\\% + 10\\,\\% = 20\\,\\%\\)", "Falsch — es sind \\(21\\,\\%\\) Rabatt", "Richtig, aber nur bei Preisen über \\(100\\,€\\)"], korrekt: 0, tipp: "Rechne mit \\(100\\,€\\) durch.", loesungsweg: "Beispiel \\(100\\,€\\): nach dem ersten Rabatt \\(90\\,€\\), nach dem zweiten \\(90 \\cdot 0{,}9 = 81\\,€\\). Gesamtrabatt \\(19\\,€\\), also \\(19\\,\\%\\): $$0{,}9 \\cdot 0{,}9 = 0{,}81 = 1 - 0{,}19$$ Prozentsätze mit verschiedenen Grundwerten darf man nicht addieren — das gilt für jeden Preis." },
      { id: 32, level: 6, typ: "numerisch", frage: "Ein Kapital von \\(5000\\,€\\) wird ein Jahr lang mit \\(p\\,\\%\\) verzinst, ein Kapital von \\(6000\\,€\\) im selben Jahr mit \\((p - 1)\\,\\%\\). Beide bringen gleich viele Zinsen. Bestimme \\(p\\).", loesung: 6, toleranz: 0, tipp: "Schreibe die Zinsen beider Kapitale als Term mit \\(p\\) und setze sie gleich.", loesungsweg: "Zinsen des ersten Kapitals: \\(5000 \\cdot \\frac{p}{100} = 50p\\). Zinsen des zweiten: \\(6000 \\cdot \\frac{p - 1}{100} = 60p - 60\\). Gleichsetzen: $$50p = 60p - 60 \\;\\Rightarrow\\; 10p = 60 \\;\\Rightarrow\\; p = 6$$ Probe: \\(6\\,\\%\\) von \\(5000\\,€\\) sind \\(300\\,€\\), \\(5\\,\\%\\) von \\(6000\\,€\\) sind ebenfalls \\(300\\,€\\) ✓" },
      { id: 33, level: 6, typ: "mc", frage: "Ein Sofa kostet \\(1200\\,€\\). Angebot A: \\(15\\,\\%\\) Rabatt. Angebot B: \\(150\\,€\\) Nachlass. Welche Aussage stimmt?", optionen: ["A ist um \\(30\\,€\\) günstiger; B wäre erst bei Preisen unter \\(1000\\,€\\) das bessere Angebot", "B ist günstiger, weil \\(150\\,€\\) mehr sind als \\(15\\,\\%\\)", "Beide Angebote sind gleich günstig", "A ist günstiger, und das gilt für jeden Preis"], korrekt: 0, tipp: "Für welchen Preis wären beide Nachlässe gleich groß?", loesungsweg: "A: \\(15\\,\\%\\) von \\(1200\\,€\\) sind \\(180\\,€\\) — mehr als die \\(150\\,€\\) von B. Fallunterscheidung: Beide Nachlässe sind gleich, wenn $$0{,}15 \\cdot P = 150 \\;\\Rightarrow\\; P = 1000\\,€$$ Über \\(1000\\,€\\) gewinnt der Prozentrabatt, darunter der feste Nachlass." },
      { id: 34, level: 6, typ: "numerisch", frage: "Ein Kapital wächst durch \\(4\\,\\%\\) Jahreszinsen in einem Jahr auf \\(3900\\,€\\) an. Wie viel Euro Zinsen wurden gutgeschrieben?", loesung: 150, toleranz: 0, tipp: "\\(3900\\,€\\) sind \\(104\\,\\%\\) des Anfangskapitals.", loesungsweg: "Anfangskapital: $$3900 : 1{,}04 = 3750\\,€$$ Zinsen: \\(3900 - 3750 = 150\\,€\\). Probe: \\(4\\,\\%\\) von \\(3750\\,€\\) sind \\(150\\,€\\) ✓ Falsch wäre \\(4\\,\\%\\) von \\(3900\\,€\\) (\\(156\\,€\\)) — falscher Grundwert." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Preis wird um \\(p\\,\\%\\) erhöht und anschließend um \\(25\\,\\%\\) gesenkt. Danach ist er genauso hoch wie vorher. Bestimme \\(p\\) (auf zwei Dezimalen).", loesung: 33.33, toleranz: 0.05, tipp: "Welcher Faktor macht die Multiplikation mit \\(0{,}75\\) rückgängig?", loesungsweg: "Die Senkung multipliziert mit \\(0{,}75\\). Damit am Ende der alte Preis steht, muss die Erhöhung mit \\(\\frac{1}{0{,}75} = \\frac{4}{3}\\) multiplizieren: $$\\frac{4}{3} \\approx 1{,}3333 \\;\\Rightarrow\\; p \\approx 33{,}33$$ Probe mit \\(300\\,€\\): \\(300 \\cdot \\frac{4}{3} = 400\\), \\(400 \\cdot 0{,}75 = 300\\) ✓ Eine Erhöhung um \\(25\\,\\%\\) würde nicht reichen." },
