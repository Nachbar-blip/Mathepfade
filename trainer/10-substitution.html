<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substitution - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-substitution';
    const THEMA_CONFIG = { name: 'Substitution', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht ==========
      { id: 1, level: 1, typ: "mc", frage: "Was bedeutet Substitution in der Mathematik?", optionen: ["Rechnen mit Brüchen", "Einen Ausdruck durch eine neue Variable ersetzen", "Gleichung verdoppeln", "Wurzel ziehen"], korrekt: 1, tipp: "„sub-stituere\" = ersetzen.", loesungsweg: "<b>Substitution</b>: Ein komplizierter Ausdruck wird durch eine neue Variable (z. B. \\(u\\)) ersetzt, um die Gleichung zu vereinfachen." },
      { id: 2, level: 1, typ: "mc", frage: "In \\(x^4 - 5x^2 + 4 = 0\\): Welche Substitution ist sinnvoll?", optionen: ["\\(u = x\\)", "\\(u = x^2\\)", "\\(u = x^4\\)", "\\(u = 5x\\)"], korrekt: 1, tipp: "So wird aus \\(x^4\\) ein \\(u^2\\).", loesungsweg: "Mit \\(u = x^2\\): \\(x^4 = u^2\\), also wird die Gleichung zu \\(u^2 - 5u + 4 = 0\\) (quadratisch!)." },
      { id: 3, level: 1, typ: "mc", frage: "Gleichungen der Form \\(ax^4 + bx^2 + c = 0\\) nennt man …", optionen: ["Linear", "Quadratisch", "Biquadratisch", "Exponentiell"], korrekt: 2, tipp: "„Bi-\" = zwei (Potenzen).", loesungsweg: "Solche Gleichungen heißen <b>biquadratisch</b> und werden durch Substitution \\(u = x^2\\) lösbar." },
      { id: 4, level: 1, typ: "numerisch", frage: "Mit \\(u = x^2\\) wird \\(x^4 - 5x^2 + 4 = 0\\) zu \\(u^2 - 5u + 4 = 0\\). Welche \\(u\\)-Werte (gib den größeren an)?", loesung: 4, toleranz: 0, tipp: "pq-Formel oder Faktorisierung \\((u-1)(u-4)\\).", loesungsweg: "\\(u^2 - 5u + 4 = (u-1)(u-4) = 0 \\implies u = 1\\) oder \\(u = 4\\). Größerer: \\(4\\)." },
      { id: 5, level: 1, typ: "numerisch", frage: "Mit \\(u = x^2\\) wird \\(x^4 - 5x^2 + 4 = 0\\) zu \\(u^2 - 5u + 4 = 0\\). Wie lautet der kleinere \\(u\\)-Wert?", loesung: 1, toleranz: 0, tipp: "Vieta: Summe \\(5\\), Produkt \\(4\\).", loesungsweg: "Mit \\(u = x^2\\) wird aus der biquadratischen Gleichung eine quadratische: $$u^2-5u+4 = 0$$ Vieta: Summe \\(5\\), Produkt \\(4\\) — also \\(u = 1\\) und \\(u = 4\\). Der kleinere Wert ist \\(u = 1\\). Rücksubstitution ergäbe daraus \\(x = \\pm 1\\); gefragt war hier aber nur der \\(u\\)-Wert." },
      { id: 6, level: 1, typ: "mc", frage: "Nach Rücksubstitution \\(u = x^2\\) aus \\(u = 4\\): \\(x\\)?", optionen: ["Nur \\(x = 2\\)", "Nur \\(x = -2\\)", "\\(x = 2\\) und \\(x = -2\\)", "Keine Lösung"], korrekt: 2, tipp: "\\(x^2 = 4\\): zwei Lösungen.", loesungsweg: "\\(x^2 = 4 \\implies x = \\pm 2\\)." },
      // ========== LEVEL 2 -- leicht ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Lösung von \\(x^4 - 5x^2 + 4 = 0\\): Gib die Anzahl der reellen Lösungen an.", loesung: 4, toleranz: 0, tipp: "\\(u = 1 \\to x = \\pm 1\\), \\(u = 4 \\to x = \\pm 2\\).", loesungsweg: "\\(u = 1\\): \\(x = \\pm 1\\). \\(u = 4\\): \\(x = \\pm 2\\). Insgesamt 4 Lösungen." },
      { id: 8, level: 2, typ: "numerisch", frage: "Löse \\(x^4 - 10x^2 + 9 = 0\\) (größte Lösung).", loesung: 3, toleranz: 0, tipp: "\\(u^2 - 10u + 9 = (u-1)(u-9)\\).", loesungsweg: "\\(u = 1\\) oder \\(u = 9\\). \\(x = \\pm 1\\) oder \\(x = \\pm 3\\). Größte: \\(3\\)." },
      { id: 9, level: 2, typ: "mc", frage: "Was, wenn bei der Rücksubstitution \\(u = x^2 = -1\\) ergibt?", optionen: ["\\(x = 1\\)", "\\(x = -1\\)", "Keine reelle Lösung", "\\(x = 0\\)"], korrekt: 2, tipp: "Ein Quadrat kann nicht negativ sein.", loesungsweg: "\\(x^2 = -1\\) hat keine reelle Lösung." },
      { id: 10, level: 2, typ: "numerisch", frage: "Löse \\(x^4 - 13x^2 + 36 = 0\\) (Anzahl reeller Lösungen).", loesung: 4, toleranz: 0, tipp: "\\(u^2 - 13u + 36 = (u-4)(u-9)\\). Beide positiv.", loesungsweg: "\\(u = 4\\) oder \\(u = 9\\). \\(x = \\pm 2\\) oder \\(x = \\pm 3\\). Vier Lösungen." },
      { id: 11, level: 2, typ: "numerisch", frage: "Löse \\(x^4 + 3x^2 - 4 = 0\\) (Anzahl reeller Lösungen).", loesung: 2, toleranz: 0, tipp: "\\(u^2 + 3u - 4 = (u-1)(u+4)\\): \\(u = 1\\) oder \\(u = -4\\). Nur \\(u = 1\\) liefert reelle \\(x\\).", loesungsweg: "\\(u = -4\\): keine reellen \\(x\\). \\(u = 1\\): \\(x = \\pm 1\\). Zwei Lösungen." },
      { id: 12, level: 2, typ: "numerisch", frage: "Wie viele reelle Lösungen hat \\(x^4 + 5x^2 + 6 = 0\\)?", loesung: 0, toleranz: 0, tipp: "\\(u^2 + 5u + 6 = (u+2)(u+3)\\): beide \\(u\\) negativ.", loesungsweg: "\\(u = -2\\) oder \\(u = -3\\): beide negativ, \\(x^2 = u\\) hat keine reelle Lösung." },
      // ========== LEVEL 3 -- nervenschonend ==========
      { id: 13, level: 3, typ: "mc", frage: "Welche Substitution bei \\((x-1)^2 - 3(x-1) + 2 = 0\\)?", optionen: ["\\(u = x\\)", "\\(u = x - 1\\)", "\\(u = (x-1)^2\\)", "\\(u = x + 1\\)"], korrekt: 1, tipp: "Der wiederkehrende Teil.", loesungsweg: "\\(u = x - 1\\): \\(u^2 - 3u + 2 = 0\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Löse \\((x-1)^2 - 3(x-1) + 2 = 0\\) (größere Lösung).", loesung: 3, toleranz: 0, tipp: "\\(u = 1\\) oder \\(u = 2\\). Dann \\(x = u + 1\\).", loesungsweg: "\\(u^2 - 3u + 2 = (u-1)(u-2) = 0\\). \\(u = 1 \\to x = 2\\), \\(u = 2 \\to x = 3\\). Größere: \\(3\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "L\u00f6se \\((x-1)^2 - 3(x-1) + 2 = 0\\). Gib die kleinere L\u00f6sung an.", loesung: 2, toleranz: 0, tipp: "\\(u = 1 \\to x = 2\\).", loesungsweg: "Substitution \\(u = x-1\\): $$u^2-3u+2 = 0 \\;\\Rightarrow\\; (u-1)(u-2) = 0 \\;\\Rightarrow\\; u = 1 \\text{ oder } u = 2$$ Rücksubstitution \\(x = u+1\\) liefert \\(x = 2\\) und \\(x = 3\\); die kleinere Lösung ist \\(2\\). Der Rückweg zur ursprünglichen Variablen wird am häufigsten vergessen." },
      { id: 16, level: 3, typ: "numerisch", frage: "Löse \\(x^4 - 8x^2 + 16 = 0\\) (positive Lösung).", loesung: 2, toleranz: 0, tipp: "\\((u - 4)^2 = 0 \\implies u = 4\\).", loesungsweg: "\\(u^2 - 8u + 16 = (u-4)^2 = 0 \\implies u = 4\\). \\(x = \\pm 2\\); positive: \\(2\\)." },
      { id: 17, level: 3, typ: "mc", frage: "Welche Substitution bei \\(2^{2x} - 5 \\cdot 2^x + 4 = 0\\)?", optionen: ["\\(u = x\\)", "\\(u = 2^x\\)", "\\(u = x^2\\)", "\\(u = 4\\)"], korrekt: 1, tipp: "\\(2^{2x} = (2^x)^2\\).", loesungsweg: "\\(u = 2^x\\): \\(u^2 - 5u + 4 = 0\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Mit \\(u = 2^x\\) wird \\(2^{2x} - 5 \\cdot 2^x + 4 = 0\\) zu \\(u^2 - 5u + 4 = 0\\). Die beiden u-Werte sind 1 und 4. Welcher \\(x\\)-Wert ergibt sich aus \\(u = 4\\)?", loesung: 2, toleranz: 0, tipp: "\\(2^x = 4 \\implies x = 2\\).", loesungsweg: "\\(2^x = 4 = 2^2 \\implies x = 2\\)." },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Löse \\(2^{2x} - 5 \\cdot 2^x + 4 = 0\\) und gib die kleinere Lösung an.", loesung: 0, toleranz: 0, tipp: "Überlege, wie sich \\(2^{2x}\\) durch \\(2^x\\) ausdrücken lässt, und führe damit eine Hilfsvariable ein.", loesungsweg: "Wegen \\(2^{2x} = \\left(2^x\\right)^2\\) setzt man \\(u = 2^x\\): $$u^2 - 5u + 4 = 0 \\;\\Longrightarrow\\; u = 1 \\text{ oder } u = 4$$ Rücksubstitution: \\(2^x = 1\\) ergibt \\(x = 0\\), \\(2^x = 4\\) ergibt \\(x = 2\\). Die kleinere Lösung ist <b>0</b>." },
      { id: 20, level: 4, typ: "numerisch", frage: "Löse \\(x^4 - 10x^2 + 9 = 0\\) und gib die größte Lösung an.", loesung: 3, toleranz: 0, tipp: "Die Gleichung enthält nur gerade Potenzen — führe sie auf eine quadratische zurück und rechne anschließend zurück.", loesungsweg: "Mit \\(u = x^2\\): $$u^2 - 10u + 9 = (u-1)(u-9) = 0 \\;\\Longrightarrow\\; u = 1 \\text{ oder } u = 9$$ Rücksubstitution: \\(x = \\pm 1\\) und \\(x = \\pm 3\\). Die größte Lösung ist <b>3</b>. Probe: \\(81 - 90 + 9 = 0\\) ✓" },
      { id: 21, level: 4, typ: "numerisch", frage: "Löse \\(\\left(x-1\\right)^2 - 5\\left(x-1\\right) + 6 = 0\\) und gib die größere Lösung an.", loesung: 4, toleranz: 0, tipp: "Der Klammerterm kommt zweimal vor — behandle ihn als eine einzige Größe.", loesungsweg: "Mit \\(u = x - 1\\): $$u^2 - 5u + 6 = (u-2)(u-3) = 0 \\;\\Longrightarrow\\; u = 2 \\text{ oder } u = 3$$ Rücksubstitution \\(x = u + 1\\): \\(x = 3\\) und \\(x = 4\\). Die größere Lösung ist <b>4</b>. Probe: \\(3^2 - 5 \\cdot 3 + 6 = 0\\) ✓" },
      { id: 22, level: 4, typ: "numerisch", frage: "Löse \\(x - 6\\sqrt{x} + 8 = 0\\) und gib die kleinere Lösung an.", loesung: 4, toleranz: 0, tipp: "Setze die Wurzel als Hilfsvariable und beachte beim Rückweg, dass die Wurzel nicht negativ wird.", loesungsweg: "Mit \\(u = \\sqrt x\\), also \\(x = u^2\\): $$u^2 - 6u + 8 = 0 \\;\\Longrightarrow\\; u = 2 \\text{ oder } u = 4$$ Rücksubstitution \\(x = u^2\\): \\(x = 4\\) und \\(x = 16\\). Die kleinere Lösung ist <b>4</b>. Probe: \\(4 - 6 \\cdot 2 + 8 = 0\\) ✓" },
      { id: 23, level: 4, typ: "mc", frage: "Welche dieser Gleichungen lässt sich durch Einführen einer Hilfsvariablen auf eine quadratische Gleichung zurückführen?", optionen: ["\\(x^6 - 7x^3 + 12 = 0\\)", "\\(x^3 - 7x + 12 = 0\\)", "\\(x^5 - 7x^2 + 12 = 0\\)", "\\(x^4 - 7x^3 + 12 = 0\\)"], korrekt: 0, tipp: "Vergleiche in jeder Gleichung die beiden Exponenten: Der größere muss das Doppelte des kleineren sein.", loesungsweg: "Nur wenn der höhere Exponent doppelt so groß ist wie der niedrigere, entsteht eine quadratische Gleichung. Bei \\(x^6 - 7x^3 + 12\\) gilt das wegen $$x^6 = \\left(x^3\\right)^2$$ mit \\(u = x^3\\) wird daraus \\(u^2 - 7u + 12 = 0\\). Bei den anderen Gleichungen passen die Exponenten \\(3\\) und \\(1\\), \\(5\\) und \\(2\\) bzw. \\(4\\) und \\(3\\) nicht zueinander." },
      { id: 24, level: 4, typ: "numerisch", frage: "Wie viele reelle Lösungen hat \\(x^4 - 4x^2 = 0\\)?", loesung: 3, toleranz: 0, tipp: "Hier gibt es kein Absolutglied — klammere zuerst so weit wie möglich aus und wende dann den Satz vom Nullprodukt an.", loesungsweg: "Ausklammern: $$x^4 - 4x^2 = x^2\\left(x^2 - 4\\right) = 0$$ Aus \\(x^2 = 0\\) folgt \\(x = 0\\), aus \\(x^2 = 4\\) folgen \\(x = 2\\) und \\(x = -2\\). Das sind <b>3</b> verschiedene reelle Lösungen; wer durch \\(x^2\\) teilt, verliert die Lösung \\(x = 0\\)." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Wie viele reelle Lösungen hat \\(\\left(x^2 - 3\\right)^2 - 4\\left(x^2 - 3\\right) + 3 = 0\\)?", loesung: 4, toleranz: 0, tipp: "Der Klammerterm wiederholt sich — behandle ihn als eine einzige Größe und prüfe am Ende jede Rückrechnung.", loesungsweg: "Mit \\(u = x^2 - 3\\): $$u^2 - 4u + 3 = (u-1)(u-3) = 0 \\;\\Longrightarrow\\; u = 1 \\text{ oder } u = 3$$ Rücksubstitution: \\(x^2 = 4\\) liefert \\(x = \\pm 2\\), \\(x^2 = 6\\) liefert \\(x = \\pm\\sqrt6\\). Beide \\(u\\)-Werte sind positiv, es gibt also <b>4</b> verschiedene reelle Lösungen." },
      { id: 26, level: 5, typ: "numerisch", frage: "Löse \\(3^{2x} - 4 \\cdot 3^x + 3 = 0\\) und gib die größere Lösung an.", loesung: 1, toleranz: 0, tipp: "Führe die Gleichung durch eine Hilfsvariable auf eine quadratische zurück und rechne beide Ergebnisse zurück.", loesungsweg: "Mit \\(u = 3^x\\): $$u^2 - 4u + 3 = 0 \\;\\Longrightarrow\\; u = 1 \\text{ oder } u = 3$$ Rücksubstitution: \\(3^x = 1\\) ergibt \\(x = 0\\), \\(3^x = 3\\) ergibt \\(x = 1\\). Die größere Lösung ist <b>1</b>." },
      { id: 27, level: 5, typ: "numerisch", frage: "Wie viele reelle Lösungen hat \\(x^4 - 5x^2 + 6 = 0\\)?", loesung: 4, toleranz: 0, tipp: "Prüfe nach der Rückrechnung, wie viele reelle Werte jede Zwischenlösung liefert.", loesungsweg: "Mit \\(u = x^2\\): $$u^2 - 5u + 6 = (u-2)(u-3) = 0 \\;\\Longrightarrow\\; u = 2 \\text{ oder } u = 3$$ Beide Werte sind positiv, jeder liefert zwei Lösungen: \\(x = \\pm\\sqrt2\\) und \\(x = \\pm\\sqrt3\\). Insgesamt <b>4</b> reelle Lösungen." },
      { id: 28, level: 5, typ: "mc", frage: "Zu \\(x^4 - 5x^2 + 4 = 0\\) wird gerechnet: „\\(u^2 - 5u + 4 = 0\\) ergibt \\(u = 1\\) und \\(u = 4\\), also ist \\(x = 1\\) oder \\(x = 4\\).“ Wo steckt der Fehler?", optionen: ["Die quadratische Gleichung ist falsch gelöst", "Die Rücksubstitution \\(x = \\pm\\sqrt u\\) fehlt", "Die Substitution war hier unzulässig", "Der Wert \\(u = 4\\) ist auszuschließen"], korrekt: 1, tipp: "Vergleiche, welche Größe die Hilfsvariable ersetzt hat, und welche gesucht war.", loesungsweg: "Gesetzt war \\(u = x^2\\), gefunden wurden die \\(u\\)-Werte. Der Rückweg fehlt: $$x^2 = 1 \\Rightarrow x = \\pm 1, \\qquad x^2 = 4 \\Rightarrow x = \\pm 2$$ Die Lösungsmenge ist \\(\\{-2;-1;1;2\\}\\), nicht \\(\\{1;4\\}\\). Probe mit \\(x = 4\\): \\(256 - 80 + 4 \\neq 0\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Für welchen Wert von \\(c\\) hat die Gleichung \\(x^4 - 13x^2 + c = 0\\) die Lösung \\(x = 3\\)?", loesung: 36, toleranz: 0, tipp: "Setze die bekannte Lösung ein und löse die entstehende Gleichung nach dem Parameter auf.", loesungsweg: "Einsetzen von \\(x = 3\\): $$3^4 - 13 \\cdot 3^2 + c = 81 - 117 + c = 0 \\;\\Longrightarrow\\; c = 36$$ Die Gleichung lautet dann \\(x^4 - 13x^2 + 36 = 0\\); mit \\(u = x^2\\) ergeben sich \\(u = 4\\) und \\(u = 9\\), also die Lösungen \\(\\pm 2\\) und \\(\\pm 3\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Wie viele Lösungen hat \\(\\sin^2 x - 3\\sin x + 2 = 0\\) im Intervall von \\(0^\\circ\\) bis unter \\(360^\\circ\\)?", loesung: 1, toleranz: 0, tipp: "Führe die Gleichung auf eine quadratische zurück und vergleiche die Zwischenergebnisse mit dem Wertebereich der Sinusfunktion.", loesungsweg: "Mit \\(u = \\sin x\\): $$u^2 - 3u + 2 = (u-1)(u-2) = 0 \\;\\Longrightarrow\\; u = 1 \\text{ oder } u = 2$$ Der Sinus nimmt nur Werte zwischen \\(-1\\) und \\(1\\) an, \\(u = 2\\) entfällt also. Aus \\(\\sin x = 1\\) folgt im angegebenen Bereich nur \\(x = 90^\\circ\\) — genau <b>1</b> Lösung." },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Jede Gleichung der Form \\(x^4 + p x^2 + q = 0\\) hat vier reelle Lösungen.“ Prüfe die Behauptung.", optionen: ["Richtig, der Grad bestimmt die Anzahl", "Falsch, es können auch null sein", "Richtig, sofern \\(p\\) negativ ist", "Falsch, es sind stets genau zwei"], korrekt: 1, tipp: "Suche ein Beispiel, bei dem schon die Gleichung in der Hilfsvariablen keine brauchbare Lösung liefert.", loesungsweg: "Gegenbeispiel \\(x^4 + x^2 + 1 = 0\\): Mit \\(u = x^2\\) wird daraus \\(u^2 + u + 1 = 0\\) — die Diskriminante $$1 - 4 = -3$$ ist negativ, es gibt gar keine reelle Lösung. Je nach Vorzeichen der \\(u\\)-Werte sind <b>null, zwei, drei oder vier</b> reelle Lösungen möglich; vier sind nur ein Sonderfall." },
      { id: 32, level: 6, typ: "numerisch", frage: "Bestimme die Summe aller reellen Lösungen von \\(x^6 - 9x^3 + 8 = 0\\).", loesung: 3, toleranz: 0, tipp: "Eine passende Hilfsvariable macht die Gleichung quadratisch; beim Rückweg zieht man eine ungerade Wurzel.", loesungsweg: "Mit \\(u = x^3\\): $$u^2 - 9u + 8 = (u-1)(u-8) = 0 \\;\\Longrightarrow\\; u = 1 \\text{ oder } u = 8$$ Die dritte Wurzel ist eindeutig, also \\(x = 1\\) und \\(x = 2\\). Ihre Summe ist <b>3</b>. Anders als beim Quadrat kommt hier je \\(u\\)-Wert nur eine Lösung heraus." },
      { id: 33, level: 6, typ: "numerisch", frage: "Für welche Werte von \\(c\\) hat \\(x^4 - 4x^2 + c = 0\\) genau zwei reelle Lösungen? Gib die größte ganze Zahl \\(c\\) an, für die das zutrifft.", loesung: 4, toleranz: 0, tipp: "Untersuche neben den Vorzeichen der Zwischenlösungen auch den Fall, dass beide zusammenfallen.", loesungsweg: "Mit \\(u = x^2\\) und der Lösungsformel: \\(u = 2 \\pm \\sqrt{4-c}\\). Fallunterscheidung: Für \\(c < 0\\) ist \\(\\sqrt{4-c} > 2\\), ein \\(u\\) ist positiv, eines negativ — genau zwei Lösungen. Für \\(c = 0\\) sind es drei, für \\(0 < c < 4\\) vier. Im Grenzfall \\(4 - c = 0\\), also \\(c = 4\\), fallen beide zusammen: $$x^4 - 4x^2 + 4 = \\left(x^2-2\\right)^2 = 0 \\;\\Longrightarrow\\; x = \\pm\\sqrt2$$ also wieder genau zwei Lösungen. Für \\(c > 4\\) gibt es keine. Die größte ganze Zahl ist damit <b>4</b>." },
      { id: 34, level: 6, typ: "mc", frage: "Behauptung: „Wurde \\(u = x^2\\) gesetzt, so liefert jede Lösung \\(u\\) der neuen Gleichung genau zwei Lösungen \\(x\\).“ Prüfe die Behauptung.", optionen: ["Richtig, wegen der beiden Vorzeichen", "Falsch, bei \\(u \\le 0\\) stimmt es nicht", "Falsch, es ist stets nur eine", "Richtig, sofern \\(u\\) ganzzahlig ist"], korrekt: 1, tipp: "Gehe die möglichen Vorzeichen der Zwischenlösung durch.", loesungsweg: "Fallunterscheidung: Für \\(u > 0\\) gibt es die zwei Lösungen \\(x = \\pm\\sqrt u\\). Für \\(u = 0\\) gibt es nur \\(x = 0\\), für \\(u < 0\\) gar keine reelle Lösung, denn $$x^2 \\ge 0 \\quad\\text{für alle reellen } x$$ Die Behauptung gilt also nur im Fall <b>\\(u > 0\\)</b> und ist damit falsch." },
      { id: 35, level: 6, typ: "numerisch", frage: "Löse \\(x^4 + 2x^2 - 15 = 0\\) und gib die positive Lösung als Dezimalzahl auf drei Stellen an.", loesung: 1.732, toleranz: 0.01, tipp: "Nach dem Zurückführen auf eine quadratische Gleichung ist zu prüfen, welche Zwischenlösung überhaupt reelle Werte zulässt.", loesungsweg: "Mit \\(u = x^2\\): $$u^2 + 2u - 15 = (u-3)(u+5) = 0 \\;\\Longrightarrow\\; u = 3 \\text{ oder } u = -5$$ Der Wert \\(u = -5\\) entfällt, da \\(x^2\\) nicht negativ wird. Aus \\(x^2 = 3\\) folgt \\(x = \\pm\\sqrt3\\); die positive Lösung ist \\(\\sqrt3 \\approx 1{,}732\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Die Gleichung \\(x^4 + p x^2 + q = 0\\) hat genau die Lösungen \\(x = \\pm 1\\) und \\(x = \\pm 3\\). Bestimme \\(p\\).", loesung: -10, toleranz: 0, tipp: "Übersetze die gegebenen Lösungen zuerst in die Werte der Hilfsvariablen und nutze dann den Satz von Vieta.", loesungsweg: "Mit \\(u = x^2\\) gehören zu den Lösungen die Werte \\(u = 1\\) und \\(u = 9\\). Die zugehörige quadratische Gleichung lautet $$(u-1)(u-9) = u^2 - 10u + 9 = 0$$ Koeffizientenvergleich mit \\(u^2 + pu + q\\) liefert \\(p = -10\\) (und \\(q = 9\\)). Nach Vieta ist \\(p\\) das negative Summenglied: \\(-(1+9) = -10\\)." }];
    </script>
