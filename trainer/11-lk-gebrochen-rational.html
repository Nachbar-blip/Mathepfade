<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK: Gebrochen-rationale Funktionen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-lk-gebrochen-rational';
    const THEMA_CONFIG = { name: 'LK: Gebrochen-rationale Funktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // L1
      { id:1, level:1, typ:"mc", frage:"Eine gebrochen-rationale Funktion ist:", optionen:["\\(\\sqrt x\\)","\\(\\frac{p(x)}{q(x)}\\) mit Polynomen","\\(\\sin x\\)","\\(e^x\\)"], korrekt:1, tipp:"Quotient Polynome.", loesungsweg:"Eine gebrochen-rationale Funktion ist der Quotient zweier Polynome: $$f(x) = \\frac{p(x)}{q(x)}$$ Wurzel-, Sinus- und Exponentialfunktionen gehören nicht dazu — sie lassen sich nicht als Bruch von Polynomen schreiben." },
      { id:2, level:1, typ:"mc", frage:"Definitionslücke bei:", optionen:["Nullstelle Zähler","Nullstelle Nenner","jedem \\(x\\)","\\(x=0\\)"], korrekt:1, tipp:"Wo Nenner =0.", loesungsweg:"Eine Division durch null ist nicht erklärt. Überall dort, wo der Nenner null wird, ist die Funktion daher nicht definiert. Die Nullstellen des <b>Zählers</b> sind dagegen völlig unproblematisch — dort hat die Funktion einfach den Wert null." },
      { id:3, level:1, typ:"mc", frage:"Polstelle:", optionen:["Zähler=0, Nenner≠0","Nenner=0, Zähler≠0","beide 0","nie"], korrekt:1, tipp:"Nenner null, Zähler nicht.", loesungsweg:"Eine Polstelle liegt vor, wenn der Nenner null wird, der Zähler dort aber <b>nicht</b>: Der Bruch wächst dann über alle Grenzen. Werden beide null, lässt sich der Bruch kürzen — dann liegt eine hebbare Lücke vor und keine Polstelle." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x-2}\\): Polstelle?", loesung:2, toleranz:0, tipp:"Nenner Null.", loesungsweg:"$$x - 2 = 0 \\;\\Rightarrow\\; x = 2$$ Der Zähler ist dort \\(1 \\neq 0\\), es handelt sich also um eine echte Polstelle." },
      { id:5, level:1, typ:"numerisch", frage:"\\(f(x)=\\frac{x+1}{x-3}\\): Polstelle?", loesung:3, toleranz:0, tipp:"Nenner Null.", loesungsweg:"$$x - 3 = 0 \\;\\Rightarrow\\; x = 3$$ Der Zähler hat dort den Wert \\(4 \\neq 0\\) — eine Polstelle." },
      { id:6, level:1, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x^2-4}\\): pos. Polstelle?", loesung:2, toleranz:0, tipp:"\\(x^2=4\\).", loesungsweg:"$$x^2 - 4 = 0 \\;\\Rightarrow\\; x^2 = 4 \\;\\Rightarrow\\; x = \\pm 2$$ Die positive Polstelle ist \\(x = 2\\); es gibt eine zweite bei \\(-2\\)." },
      // L2
      { id:7, level:2, typ:"mc", frage:"Hebbare Lücke:", optionen:["Zähler ≠ 0","Zähler = 0 ebenfalls","nur Nenner","nie"], korrekt:1, tipp:"Gemeinsame Nullstelle.", loesungsweg:"Zähler und Nenner haben gemeinsame Nullstelle." },
      { id:8, level:2, typ:"mc", frage:"\\(f(x)=\\frac{x^2-1}{x-1}\\) hat bei \\(x=1\\) eine:", optionen:["Polstelle","Hebbare Lücke","Nullstelle","Extremstelle"], korrekt:1, tipp:"Kürzen: \\(x+1\\).", loesungsweg:"Zähler und Nenner werden beide null — der Bruch lässt sich also kürzen: $$\\frac{x^2-1}{x-1} = \\frac{(x-1)(x+1)}{x-1} = x+1 \\quad (x \\neq 1)$$ Die Funktion verhält sich wie die Gerade \\(x+1\\) und strebt bei \\(x \\to 1\\) gegen \\(2\\). Die Lücke lässt sich also <b>heben</b>, sie ist keine Polstelle." },
      { id:9, level:2, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2-4}{x-2}\\): Grenzwert bei \\(x\\to 2\\)?", loesung:4, toleranz:0, tipp:"\\(x+2\\).", loesungsweg:"Kürzen macht den Grenzwert sichtbar: $$\\frac{x^2-4}{x-2} = \\frac{(x-2)(x+2)}{x-2} = x+2$$ $$\\lim_{x \\to 2} f(x) = 2 + 2 = 4$$" },
      { id:10, level:2, typ:"mc", frage:"Waagerechte Asymptote bei \\(\\deg p < \\deg q\\):", optionen:["\\(y=0\\)","\\(y=\\infty\\)","keine","\\(y=x\\)"], korrekt:0, tipp:"Zählergrad kleiner.", loesungsweg:"Ist der Zählergrad kleiner, so wächst der Nenner für große \\(|x|\\) viel schneller — der Bruch strebt gegen null: $$y = 0$$ Beispiel: \\(\\frac{1}{x^2}\\) wird für große \\(x\\) beliebig klein." },
      { id:11, level:2, typ:"numerisch", frage:"\\(f(x)=\\frac{2x+1}{x-3}\\): waagerechte Asympt. \\(y=?\\)", loesung:2, toleranz:0, tipp:"Leitkoeffizienten.", loesungsweg:"\\(y=2/1=2\\)." },
      { id:12, level:2, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x^2+1}\\): Asymptote?", loesung:1, toleranz:0, tipp:"Gleicher Grad.", loesungsweg:"Bei gleichem Grad entscheiden die höchsten Potenzen: $$\\frac{x^2}{x^2+1} \\to \\frac{x^2}{x^2} = 1$$ Die Asymptote ist \\(y = 1\\)." },
      // L3 -- Schiefe Asymptote
      { id:13, level:3, typ:"mc", frage:"Schiefe Asymptote existiert wenn:", optionen:["\\(\\deg p = \\deg q\\)","\\(\\deg p = \\deg q + 1\\)","\\(\\deg p = \\deg q - 1\\)","nie"], korrekt:1, tipp:"Zählergrad = Nennergrad + 1.", loesungsweg:"Eine schiefe Asymptote entsteht, wenn die Polynomdivision einen <b>linearen</b> Anteil liefert. Das ist genau dann der Fall, wenn der Zählergrad um eins größer ist: $$\\deg p = \\deg q + 1$$ Bei gleichem Grad ergäbe sich eine waagerechte, bei größerem Unterschied eine krummlinige Asymptote." },
      { id:14, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x-1}\\): Polynomdivision → \\(x+1+\\frac{1}{x-1}\\). Schiefe Asympt. Steigung?", loesung:1, toleranz:0, tipp:"Linearer Anteil \\(x+1\\).", loesungsweg:"Die Polynomdivision liefert $$f(x) = x + 1 + \\frac{1}{x-1}$$ Der Restterm \\(\\frac{1}{x-1}\\) strebt für große \\(|x|\\) gegen null, übrig bleibt die Gerade \\(y = x+1\\) mit der Steigung \\(1\\)." },
      { id:15, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x-1}\\): y-Achsenabschnitt der schiefen Asymptote?", loesung:1, toleranz:0, tipp:"\\(x+1\\).", loesungsweg:"Aus derselben Zerlegung \\(f(x) = x + 1 + \\frac{1}{x-1}\\) liest man die Asymptote \\(y = x+1\\) ab; ihr \\(y\\)-Achsenabschnitt ist \\(1\\)." },
      { id:16, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2+x}{x}\\), \\(x\\neq 0\\): vereinfacht zu? Funktionswert bei \\(x=3\\)?", loesung:4, toleranz:0, tipp:"\\(x+1\\).", loesungsweg:"Kürzen von \\(x\\) (erlaubt, da \\(x \\neq 0\\)): $$\\frac{x^2+x}{x} = \\frac{x(x+1)}{x} = x+1$$ $$f(3) = 3 + 1 = 4$$" },
      { id:17, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x-1}\\): \\(\\lim_{x\\to 1^+} f(x)=?\\) (Zeichen) — pos Unendlich (+∞ als +1), neg Unendlich (-1). Antwort:", loesung:1, toleranz:0, tipp:"Von rechts strebt es gegen +∞.", loesungsweg:"Nähert man sich von rechts, so ist \\(x - 1\\) eine kleine <b>positive</b> Zahl. Ein Bruch mit positivem Zähler und winzigem positivem Nenner wird beliebig groß: $$\\lim_{x \\to 1^+} \\frac{1}{x-1} = +\\infty$$" },
      { id:18, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x-1}\\): \\(\\lim_{x\\to 1^-}\\)? (\\(+\\infty\\) = 1, \\(-\\infty\\) = -1)", loesung:-1, toleranz:0, tipp:"Von links.", loesungsweg:"Von links ist \\(x - 1\\) eine kleine <b>negative</b> Zahl, der Bruch also negativ und dem Betrag nach beliebig groß: $$\\lim_{x \\to 1^-} \\frac{1}{x-1} = -\\infty$$ Die beiden einseitigen Grenzwerte unterscheiden sich — das ist der Vorzeichenwechsel an einer Polstelle ungerader Ordnung." },
      // L4
      { id:19, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x}\\): Ableitung bei \\(x=2\\)?", loesung:-0.25, toleranz:0.01, tipp:"\\(f'=-1/x^2\\).", loesungsweg:"Mit \\(f(x) = x^{-1}\\) liefert die Potenzregel \\(f'(x) = -x^{-2} = -\\frac{1}{x^2}\\): $$f'(2) = -\\frac{1}{4} = -0{,}25$$" },
      { id:20, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{x+1}{x}\\): Nullstelle?", loesung:-1, toleranz:0, tipp:"Zähler =0.", loesungsweg:"Ein Bruch ist null, wenn sein Zähler null ist (und der Nenner nicht): $$x + 1 = 0 \\;\\Rightarrow\\; x = -1$$ Dort ist der Nenner \\(-1 \\neq 0\\), die Nullstelle also gültig." },
      { id:21, level:4, typ:"mc", frage:"Quotientenregel:", optionen:["\\(\\frac{u'v-uv'}{v^2}\\)","\\(\\frac{uv'-u'v}{v^2}\\)","\\(\\frac{u'}{v'}\\)","\\(u'v+uv'\\)"], korrekt:0, tipp:"u-Strich-v minus …", loesungsweg:"$$\\left(\\frac{u}{v}\\right)' = \\frac{u'v - uv'}{v^2}$$ Die Reihenfolge im Zähler ist entscheidend: Erst \\(u'v\\), dann minus \\(uv'\\). Vertauscht man sie, erhält man das Ergebnis mit falschem Vorzeichen." },
      { id:22, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{x}{x+1}\\): \\(f'(0)=?\\)", loesung:1, toleranz:0, tipp:"Quotientenregel.", loesungsweg:"\\(f'=\\frac{1}{(x+1)^2}\\), \\(f'(0)=1\\)." },
      { id:23, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x-1}\\): Extremstelle \\(x>1\\)?", loesung:2, toleranz:0, tipp:"\\(f'=\\frac{x(x-2)}{(x-1)^2}\\).", loesungsweg:"\\(x=0\\) oder \\(x=2\\); \\(x>1\\): \\(x=2\\)." },
      { id:24, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x-1}\\): \\(f(2)=?\\)", loesung:4, toleranz:0, tipp:"\\(4/1\\).", loesungsweg:"$$f(2) = \\frac{2^2}{2-1} = \\frac{4}{1} = 4$$" },
      // L5
      { id:25, level:5, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2-1}{x^2+1}\\): Nullstelle \\(x>0\\)?", loesung:1, toleranz:0, tipp:"Zähler 0.", loesungsweg:"Der Zähler muss null werden: $$x^2 - 1 = 0 \\;\\Rightarrow\\; x = \\pm 1$$ Der Nenner \\(x^2+1\\) ist dort \\(2 \\neq 0\\), die Nullstellen sind also gültig. Die positive ist \\(x = 1\\)." },
      { id:26, level:5, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2-1}{x^2+1}\\): Waagerechte Asymptote \\(y=?\\)", loesung:1, toleranz:0, tipp:"Gleicher Grad.", loesungsweg:"Zähler und Nenner haben beide den Grad \\(2\\), die Leitkoeffizienten sind je \\(1\\): $$\\frac{x^2-1}{x^2+1} \\to \\frac{x^2}{x^2} = 1$$" },
      { id:27, level:5, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x^2-1}\\): pos. Polstelle?", loesung:1, toleranz:0, tipp:"\\(x^2=1\\).", loesungsweg:"$$x^2 - 1 = 0 \\;\\Rightarrow\\; x = \\pm 1$$ Der Zähler ist dort \\(1 \\neq 0\\) — es sind echte Polstellen. Die positive ist \\(x = 1\\)." },
      { id:28, level:5, typ:"numerisch", frage:"\\(f(x)=\\frac{x^3-x}{x^2-1}=\\frac{x(x-1)(x+1)}{(x-1)(x+1)}=x\\) (außer bei \\(\\pm 1\\)): Grenzwert bei \\(x\\to 1\\)?", loesung:1, toleranz:0, tipp:"Kürzen.", loesungsweg:"Nach dem Kürzen bleibt die Gerade \\(y = x\\) übrig: $$\\frac{x(x-1)(x+1)}{(x-1)(x+1)} = x \\quad (x \\neq \\pm 1)$$ $$\\lim_{x \\to 1} f(x) = 1$$ Bei \\(x = 1\\) liegt also eine hebbare Lücke, keine Polstelle." },
      { id:29, level:5, typ:"mc", frage:"\\(f(x)=\\frac{1}{(x-1)^2}\\) bei \\(x=1\\):", optionen:["Vorzeichenwechsel","Kein VZW, Pol 2. Ordnung","Hebbare Lücke","Nullstelle"], korrekt:1, tipp:"Gerade Potenz.", loesungsweg:"Der Nenner \\((x-1)^2\\) ist beiderseits von \\(1\\) positiv — der Bruch strebt daher von <b>beiden</b> Seiten gegen \\(+\\infty\\). Das ist eine Polstelle gerader Ordnung, also ohne Vorzeichenwechsel." },
      { id:30, level:5, typ:"mc", frage:"\\(f(x)=\\frac{1}{x-1}\\) bei \\(x=1\\):", optionen:["VZW","Kein VZW","Hebbar","Nullstelle"], korrekt:0, tipp:"Ungerade.", loesungsweg:"Der Nenner \\(x-1\\) ist links von \\(1\\) negativ und rechts davon positiv. Entsprechend strebt der Bruch von links gegen \\(-\\infty\\) und von rechts gegen \\(+\\infty\\) — eine Polstelle ungerader Ordnung <b>mit</b> Vorzeichenwechsel." },
      // L6
      { id:31, level:6, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2+1}{x}\\) für \\(x>0\\): Tiefpunkt \\(x=?\\)", loesung:1, toleranz:0, tipp:"\\(f'=1-1/x^2=0\\).", loesungsweg:"Umschreiben als \\(f(x) = x + \\frac{1}{x}\\) erleichtert das Ableiten: $$f'(x) = 1 - \\frac{1}{x^2} = 0 \\;\\Rightarrow\\; x^2 = 1 \\;\\Rightarrow\\; x = 1$$ (für \\(x > 0\\)). Wegen \\(f''(x) = \\frac{2}{x^3} > 0\\) ist es ein Tiefpunkt." },
      { id:32, level:6, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2+1}{x}\\), \\(x>0\\): y-Wert des Tiefpunkts?", loesung:2, toleranz:0, tipp:"\\(f(1)=2\\).", loesungsweg:"$$f(1) = 1 + \\frac{1}{1} = 2$$ Für alle \\(x>0\\) gilt also \\(x + \\frac1x \\geq 2\\) — eine oft benutzte Abschätzung." },
      { id:33, level:6, typ:"numerisch", frage:"\\(f(x)=x+\\frac{1}{x}\\), \\(x>0\\): Schiefe Asymptote \\(y=x\\)? Abstand bei \\(x=10\\)?", loesung:0.1, toleranz:0.01, tipp:"\\(1/x\\).", loesungsweg:"Der Abstand zur Asymptote ist genau der Restterm: $$f(10) - 10 = \\frac{1}{10} = 0{,}1$$ Mit wachsendem \\(x\\) schrumpft er gegen null — deshalb schmiegt sich der Graph an die Gerade an." },
      { id:34, level:6, typ:"numerisch", frage:"\\(f(x)=\\frac{x+2}{x-2}\\): y-Achsenabschnitt?", loesung:-1, toleranz:0, tipp:"\\(f(0)=-1\\).", loesungsweg:"$$f(0) = \\frac{0+2}{0-2} = \\frac{2}{-2} = -1$$" },
      { id:35, level:6, typ:"numerisch", frage:"\\(f(x)=\\frac{2x^2-3}{x^2-1}\\): waagerechte Asymptote?", loesung:2, toleranz:0, tipp:"Leitkoeff.", loesungsweg:"Zähler und Nenner haben beide den Grad \\(2\\); die Asymptote ergibt sich aus dem Verhältnis der Leitkoeffizienten: $$\\frac{2x^2}{x^2} = 2 \\;\\Rightarrow\\; y = 2$$ Die Konstanten \\(-3\\) und \\(-1\\) fallen für große \\(|x|\\) nicht ins Gewicht." },
      { id:36, level:6, typ:"mc", frage:"\\(f(x)=\\frac{x^3}{x^2+1}\\) hat:", optionen:["keine Asymptote","schiefe Asymptote \\(y=x\\)","senkrechte Asymptote","Polstelle bei 0"], korrekt:1, tipp:"Polynomdiv.", loesungsweg:"\\(f(x)=x-\\frac{x}{x^2+1}\\), also Asymptote \\(y=x\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
