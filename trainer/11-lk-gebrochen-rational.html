<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-lk-gebrochen-rational';
    const THEMA_CONFIG = { name: 'eA: Gebrochen-rationale Funktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // L1
      { id:1, level:1, typ:"mc", frage:"Eine gebrochen-rationale Funktion ist:", optionen:["\\(\\sqrt x\\)","\\(\\frac{p(x)}{q(x)}\\) mit Polynomen","\\(\\sin x\\)","\\(e^x\\)"], korrekt:1, tipp:"Quotient Polynome.", loesungsweg:"Eine gebrochen-rationale Funktion ist der Quotient zweier Polynome: $$f(x) = \\frac{p(x)}{q(x)}$$ Wurzel-, Sinus- und Exponentialfunktionen gehören nicht dazu — sie lassen sich nicht als Bruch von Polynomen schreiben." },
      { id:2, level:1, typ:"mc", frage:"Definitionslücke bei:", optionen:["Nullstelle Zähler","Nullstelle Nenner","jedem \\(x\\)","\\(x=0\\)"], korrekt:1, tipp:"Wo Nenner =0.", loesungsweg:"Eine Division durch null ist nicht erklärt. Überall dort, wo der Nenner null wird, ist die Funktion daher nicht definiert. Die Nullstellen des <b>Zählers</b> sind dagegen völlig unproblematisch — dort hat die Funktion einfach den Wert null." },
      { id:3, level:1, typ:"mc", frage:"Polstelle:", optionen:["Zähler=0, Nenner≠0","Nenner=0, Zähler≠0","beide 0","nie"], korrekt:1, tipp:"Nenner null, Zähler nicht.", loesungsweg:"Eine Polstelle liegt vor, wenn der Nenner null wird, der Zähler dort aber <b>nicht</b>: Der Bruch wächst dann über alle Grenzen. Werden beide null, lässt sich der Bruch kürzen — dann liegt eine hebbare Lücke vor und keine Polstelle." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x-2}\\): Polstelle?", loesung:2, toleranz:0, tipp:"Nenner Null.", loesungsweg:"$$x - 2 = 0 \\;\\Rightarrow\\; x = 2$$ Der Zähler ist dort \\(1 \\neq 0\\), es handelt sich also um eine echte Polstelle." },
      { id:5, level:1, typ:"numerisch", frage:"\\(f(x)=\\frac{x+1}{x-3}\\): Polstelle?", loesung:3, toleranz:0, tipp:"Nenner Null.", loesungsweg:"$$x - 3 = 0 \\;\\Rightarrow\\; x = 3$$ Der Zähler hat dort den Wert \\(4 \\neq 0\\) — eine Polstelle." },
      { id:6, level:1, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x^2-4}\\): pos. Polstelle?", loesung:2, toleranz:0, tipp:"\\(x^2=4\\).", loesungsweg:"$$x^2 - 4 = 0 \\;\\Rightarrow\\; x^2 = 4 \\;\\Rightarrow\\; x = \\pm 2$$ Die positive Polstelle ist \\(x = 2\\); es gibt eine zweite bei \\(-2\\)." },
      // L2
      { id:7, level:2, typ:"mc", frage:"Hebbare Lücke:", optionen:["Zähler ≠ 0","Zähler = 0 ebenfalls","nur Nenner","nie"], korrekt:1, tipp:"Überlege, was passieren muss, damit der Bruch an der Lücke trotzdem einem endlichen Wert zustrebt.", loesungsweg:"Eine Lücke heißt <b>hebbar</b>, wenn die Funktion dort zwar nicht definiert ist, sich aber durch einen einzigen Wert sinnvoll ergänzen lässt. Das gelingt genau dann, wenn auch der Zähler an dieser Stelle null wird — dann lässt sich der gemeinsame Linearfaktor kürzen: $$\\frac{x^2-4}{x-2} = \\frac{(x-2)(x+2)}{x-2} = x+2 \\quad (x \\neq 2)$$ Ist der Zähler dagegen von null verschieden, wächst der Bruch über alle Grenzen — dann liegt eine Polstelle vor." },
      { id:8, level:2, typ:"mc", frage:"\\(f(x)=\\frac{x^2-1}{x-1}\\) hat bei \\(x=1\\) eine:", optionen:["Polstelle","Hebbare Lücke","Nullstelle","Extremstelle"], korrekt:1, tipp:"Kürzen: \\(x+1\\).", loesungsweg:"Zähler und Nenner werden beide null — der Bruch lässt sich also kürzen: $$\\frac{x^2-1}{x-1} = \\frac{(x-1)(x+1)}{x-1} = x+1 \\quad (x \\neq 1)$$ Die Funktion verhält sich wie die Gerade \\(x+1\\) und strebt bei \\(x \\to 1\\) gegen \\(2\\). Die Lücke lässt sich also <b>heben</b>, sie ist keine Polstelle." },
      { id:9, level:2, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2-4}{x-2}\\): Grenzwert bei \\(x\\to 2\\)?", loesung:4, toleranz:0, tipp:"\\(x+2\\).", loesungsweg:"Kürzen macht den Grenzwert sichtbar: $$\\frac{x^2-4}{x-2} = \\frac{(x-2)(x+2)}{x-2} = x+2$$ $$\\lim_{x \\to 2} f(x) = 2 + 2 = 4$$" },
      { id:10, level:2, typ:"mc", frage:"Waagerechte Asymptote bei \\(\\deg p < \\deg q\\):", optionen:["\\(y=0\\)","\\(y=\\infty\\)","keine","\\(y=x\\)"], korrekt:0, tipp:"Zählergrad kleiner.", loesungsweg:"Ist der Zählergrad kleiner, so wächst der Nenner für große \\(|x|\\) viel schneller — der Bruch strebt gegen null: $$y = 0$$ Beispiel: \\(\\frac{1}{x^2}\\) wird für große \\(x\\) beliebig klein." },
      { id:11, level:2, typ:"numerisch", frage:"\\(f(x)=\\frac{2x+1}{x-3}\\): waagerechte Asympt. \\(y=?\\)", loesung:2, toleranz:0, tipp:"Vergleiche die Grade von Zähler und Nenner und überlege, welche Glieder für große \\(|x|\\) den Ausschlag geben.", loesungsweg:"Zähler und Nenner haben beide den Grad \\(1\\). Für große \\(|x|\\) fallen die Konstanten \\(+1\\) und \\(-3\\) nicht mehr ins Gewicht, es entscheiden allein die Leitkoeffizienten: $$\\lim_{x \\to \\pm\\infty} \\frac{2x+1}{x-3} = \\frac{2x}{x} = 2$$ Die waagerechte Asymptote ist also \\(y = 2\\). Sauber sieht man das nach Kürzen durch \\(x\\): \\(\\frac{2 + \\frac1x}{1 - \\frac3x}\\) — die Brüche \\(\\frac1x\\) und \\(\\frac3x\\) streben gegen null." },
      { id:12, level:2, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x^2+1}\\): Asymptote?", loesung:1, toleranz:0, tipp:"Gleicher Grad.", loesungsweg:"Bei gleichem Grad entscheiden die höchsten Potenzen: $$\\frac{x^2}{x^2+1} \\to \\frac{x^2}{x^2} = 1$$ Die Asymptote ist \\(y = 1\\)." },
      // L3 -- Schiefe Asymptote
      { id:13, level:3, typ:"mc", frage:"Eine schiefe Asymptote hat der Graph genau dann, wenn für die Grade von Zähler und Nenner gilt:", optionen:["\\(\\deg p = \\deg q\\)","\\(\\deg p = \\deg q + 1\\)","\\(\\deg p = \\deg q - 1\\)","\\(\\deg p = 2\\deg q\\)"], korrekt:1, tipp:"Überlege für jeden Fall, wie sich der Quotient für sehr große \\(|x|\\) verhält — wie eine Zahl, wie eine Gerade oder wie eine Parabel.", loesungsweg:"Entscheidend ist der Gradunterschied, weil er das Verhalten für große \\(|x|\\) festlegt: <br>ist der Zählergrad <b>kleiner</b>, strebt der Bruch gegen \\(0\\) (Asymptote \\(y=0\\)); <br>sind die Grade <b>gleich</b>, strebt er gegen das Verhältnis der Leitkoeffizienten (waagerechte Asymptote); <br>ist der Zählergrad um <b>eins größer</b>, wächst der Bruch wie eine lineare Funktion — das ist die schiefe Asymptote; <br>bei größerem Unterschied entsteht eine krummlinige Näherungskurve. Beispiel: \\(\\frac{x^2}{x-1}\\) verhält sich für große \\(|x|\\) wie \\(\\frac{x^2}{x} = x\\)." },
      { id:14, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x-1}\\): Für große \\(|x|\\) nähert sich der Graph einer Geraden. Welche Steigung hat sie?", loesung:1, toleranz:0, tipp:"Schreibe den Zähler so um, dass der Nenner als Faktor sichtbar wird und nur ein kleiner Rest übrig bleibt.", loesungsweg:"Den Zähler passend zerlegen: $$x^2 = (x-1)(x+1) + 1$$ Damit lässt sich der Bruch aufspalten: $$f(x) = \\frac{(x-1)(x+1)+1}{x-1} = x+1 + \\frac{1}{x-1}$$ Der Rest \\(\\frac{1}{x-1}\\) strebt für große \\(|x|\\) gegen null; übrig bleibt die Gerade \\(y = x+1\\) mit der Steigung \\(1\\). Probe: \\(f(101) = \\frac{10201}{100} = 102{,}01\\), die Gerade liefert \\(102\\)." },
      { id:15, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x-1}\\): Welchen \\(y\\)-Achsenabschnitt hat die Gerade, der sich der Graph für große \\(|x|\\) nähert?", loesung:1, toleranz:0, tipp:"Nutze dieselbe Zerlegung wie bei der Steigung und lies das absolute Glied ab.", loesungsweg:"Aus der Zerlegung $$f(x) = x + 1 + \\frac{1}{x-1}$$ liest man die Näherungsgerade \\(y = x+1\\) ab. Ihr \\(y\\)-Achsenabschnitt ist das absolute Glied, also \\(1\\). Vorsicht: Das ist <b>nicht</b> der Funktionswert \\(f(0) = \\frac{0}{-1} = 0\\) — die Gerade und der Graph verlaufen in der Nähe der Polstelle weit auseinander." },
      { id:16, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2+x}{x}\\), \\(x\\neq 0\\): vereinfacht zu? Funktionswert bei \\(x=3\\)?", loesung:4, toleranz:0, tipp:"\\(x+1\\).", loesungsweg:"Kürzen von \\(x\\) (erlaubt, da \\(x \\neq 0\\)): $$\\frac{x^2+x}{x} = \\frac{x(x+1)}{x} = x+1$$ $$f(3) = 3 + 1 = 4$$" },
      { id:17, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x-1}\\): \\(\\lim_{x\\to 1^+} f(x)=?\\) (Zeichen) — pos Unendlich (+∞ als +1), neg Unendlich (-1). Antwort:", loesung:1, toleranz:0, tipp:"Von rechts strebt es gegen +∞.", loesungsweg:"Nähert man sich von rechts, so ist \\(x - 1\\) eine kleine <b>positive</b> Zahl. Ein Bruch mit positivem Zähler und winzigem positivem Nenner wird beliebig groß: $$\\lim_{x \\to 1^+} \\frac{1}{x-1} = +\\infty$$" },
      { id:18, level:3, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x-1}\\): \\(\\lim_{x\\to 1^-}\\)? (\\(+\\infty\\) = 1, \\(-\\infty\\) = -1)", loesung:-1, toleranz:0, tipp:"Von links.", loesungsweg:"Von links ist \\(x - 1\\) eine kleine <b>negative</b> Zahl, der Bruch also negativ und dem Betrag nach beliebig groß: $$\\lim_{x \\to 1^-} \\frac{1}{x-1} = -\\infty$$ Die beiden einseitigen Grenzwerte unterscheiden sich — das ist der Vorzeichenwechsel an einer Polstelle ungerader Ordnung." },
      // L4
      { id:19, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{1}{x}\\): Ableitung bei \\(x=2\\)?", loesung:-0.25, toleranz:0.01, tipp:"\\(f'=-1/x^2\\).", loesungsweg:"Mit \\(f(x) = x^{-1}\\) liefert die Potenzregel \\(f'(x) = -x^{-2} = -\\frac{1}{x^2}\\): $$f'(2) = -\\frac{1}{4} = -0{,}25$$" },
      { id:20, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{x+1}{x}\\): Nullstelle?", loesung:-1, toleranz:0, tipp:"Zähler =0.", loesungsweg:"Ein Bruch ist null, wenn sein Zähler null ist (und der Nenner nicht): $$x + 1 = 0 \\;\\Rightarrow\\; x = -1$$ Dort ist der Nenner \\(-1 \\neq 0\\), die Nullstelle also gültig." },
      { id:21, level:4, typ:"mc", frage:"Quotientenregel:", optionen:["\\(\\frac{u'v-uv'}{v^2}\\)","\\(\\frac{uv'-u'v}{v^2}\\)","\\(\\frac{u'}{v'}\\)","\\(u'v+uv'\\)"], korrekt:0, tipp:"u-Strich-v minus …", loesungsweg:"$$\\left(\\frac{u}{v}\\right)' = \\frac{u'v - uv'}{v^2}$$ Die Reihenfolge im Zähler ist entscheidend: Erst \\(u'v\\), dann minus \\(uv'\\). Vertauscht man sie, erhält man das Ergebnis mit falschem Vorzeichen." },
      { id:22, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{x}{x+1}\\): Berechne \\(f'(1)\\).", loesung:0.25, toleranz:0.001, tipp:"Wähle die Regel, die zu einem Quotienten zweier Terme mit \\(x\\) passt, und fasse den Zähler danach zusammen.", loesungsweg:"Quotientenregel mit \\(u = x\\), \\(u' = 1\\), \\(v = x+1\\), \\(v' = 1\\): $$f'(x) = \\frac{1 \\cdot (x+1) - x \\cdot 1}{(x+1)^2} = \\frac{1}{(x+1)^2}$$ Der Zähler wird also konstant. An der Stelle \\(1\\): $$f'(1) = \\frac{1}{4} = 0{,}25$$ Weil der Zähler stets positiv ist, steigt der Graph auf jedem Teilstück seines Definitionsbereichs." },
      { id:23, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x-1}\\): An welcher Stelle mit \\(x>1\\) hat der Graph einen Extrempunkt?", loesung:2, toleranz:0, tipp:"Leite den Quotienten ab und überlege, wann ein Bruch null wird; prüfe danach, welche der Lösungen im geforderten Bereich liegt.", loesungsweg:"Quotientenregel mit \\(u = x^2\\), \\(v = x-1\\): $$f'(x) = \\frac{2x(x-1) - x^2}{(x-1)^2} = \\frac{x^2 - 2x}{(x-1)^2} = \\frac{x(x-2)}{(x-1)^2}$$ Ein Bruch ist null, wenn sein Zähler null ist: \\(x = 0\\) oder \\(x = 2\\). Gefordert ist \\(x > 1\\), also bleibt \\(x = 2\\). Links von \\(2\\) ist der Zähler negativ, rechts positiv — der Graph fällt erst und steigt dann, es liegt also ein Tiefpunkt vor." },
      { id:24, level:4, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2}{x-1}\\): \\(f(2)=?\\)", loesung:4, toleranz:0, tipp:"\\(4/1\\).", loesungsweg:"$$f(2) = \\frac{2^2}{2-1} = \\frac{4}{1} = 4$$" },
      // L5 -- AFB III: Parameter aus Bedingung, hebbare Luecke, Fehler finden
      { id:25, level:5, typ:"numerisch", frage:"Für welchen Wert von \\(a\\) hat der Graph von \\(f(x)=\\frac{x^2+ax-6}{x-2}\\) an der Stelle \\(x=2\\) keine Polstelle?", loesung:1, toleranz:0, tipp:"Überlege, was am Zähler gelten muss, damit der Bruch an dieser Stelle nicht über alle Grenzen wächst, und stelle daraus eine Gleichung für den Parameter auf.", loesungsweg:"Der Nenner wird bei \\(x = 2\\) null. Eine Polstelle bleibt nur dann aus, wenn auch der Zähler dort null wird — sonst wächst der Bruch über alle Grenzen: $$2^2 + 2a - 6 = 0 \\;\\Rightarrow\\; 2a - 2 = 0 \\;\\Rightarrow\\; a = 1$$ Probe: Mit \\(a = 1\\) ist der Zähler \\(x^2+x-6 = (x-2)(x+3)\\), und es lässt sich kürzen: $$f(x) = x+3 \\quad (x \\neq 2)$$ Statt der Polstelle liegt dann eine hebbare Lücke bei \\((2 \\mid 5)\\) vor." },
      { id:26, level:5, typ:"numerisch", frage:"Die Funktion \\(f(x)=\\frac{x^3-8}{x-2}\\) ist an der Stelle \\(x=2\\) nicht definiert. Welchen Wert müsste man dort ergänzen, damit der Graph ohne Sprung durchläuft?", loesung:12, toleranz:0, tipp:"Zerlege den Zähler so, dass der Nenner als Faktor auftritt, und untersuche den verbleibenden Term an der fraglichen Stelle.", loesungsweg:"Der Zähler hat bei \\(x = 2\\) ebenfalls eine Nullstelle, lässt sich also zerlegen: $$x^3 - 8 = (x-2)\\left(x^2+2x+4\\right)$$ Kürzen ergibt für \\(x \\neq 2\\): $$f(x) = x^2 + 2x + 4$$ Dieser Term ist an der Stelle \\(2\\) unproblematisch: $$\\lim_{x \\to 2} f(x) = 4 + 4 + 4 = 12$$ Ergänzt man diesen Wert, wird die Funktion stetig — die Lücke ist hebbar und keine Polstelle." },
      { id:27, level:5, typ:"mc", frage:"Vorgelegt wird die Aussage: „Jede Nullstelle des Nenners ist eine Polstelle des Graphen.“ Welche Beurteilung trifft zu?", optionen:["Sie trifft nicht zu: bei \\(\\frac{x^2-1}{x-1}\\) liegt an der Stelle \\(1\\) eine hebbare Lücke","Sie trifft zu: dort ist der Bruch nicht definiert, also wächst er über alle Grenzen","Sie trifft nicht zu: eine Polstelle braucht eine doppelte Nullstelle des Nenners","Sie trifft zu, sofern der Zähler an dieser Stelle einen positiven Wert annimmt"], korrekt:0, tipp:"Suche ein Gegenbeispiel, bei dem der Zähler an derselben Stelle ebenfalls null wird, und prüfe dort das Verhalten des Bruchs.", loesungsweg:"Die Aussage ist zu grob. Richtig ist: Eine Nullstelle des Nenners ist immer eine <b>Definitionslücke</b> — ob daraus eine Polstelle wird, entscheidet der Zähler. Gegenbeispiel: $$\\frac{x^2-1}{x-1} = \\frac{(x-1)(x+1)}{x-1} = x+1 \\quad (x \\neq 1)$$ Der Bruch strebt für \\(x \\to 1\\) gegen \\(2\\) statt über alle Grenzen — die Lücke ist hebbar. Die vierte Antwort greift zu kurz: Auch ein negativer Zählerwert erzeugt eine Polstelle, das Vorzeichen bestimmt nur die Richtung. Die dritte verwechselt die Ordnung der Polstelle mit ihrer Existenz." },
      { id:28, level:5, typ:"numerisch", frage:"Der Graph von \\(f(x)=\\frac{ax+b}{x-3}\\) hat die waagerechte Asymptote \\(y=2\\) und schneidet die \\(y\\)-Achse bei \\(1\\). Bestimme \\(b\\).", loesung:-3, toleranz:0, tipp:"Übersetze beide Angaben in je eine Gleichung; die Asymptote legt einen der Parameter unmittelbar fest.", loesungsweg:"Erste Bedingung — die Asymptote: Zähler und Nenner haben denselben Grad, also entscheidet das Verhältnis der Leitkoeffizienten: $$\\lim_{x \\to \\pm\\infty} \\frac{ax+b}{x-3} = \\frac{a}{1} = a = 2$$ Zweite Bedingung — der \\(y\\)-Achsenabschnitt: $$f(0) = \\frac{b}{-3} = 1 \\;\\Rightarrow\\; b = -3$$ Die Funktion lautet \\(f(x) = \\frac{2x-3}{x-3}\\). Probe: \\(f(0) = \\frac{-3}{-3} = 1\\)." },
      { id:29, level:5, typ:"numerisch", frage:"\\(f(x)=\\frac{x^2+4}{x}\\) für \\(x>0\\). Welchen kleinsten Funktionswert nimmt \\(f\\) an?", loesung:4, toleranz:0, tipp:"Zerlege den Bruch zuerst in zwei einfache Summanden; danach folgen Extremstelle, Art des Extremums und Wert.", loesungsweg:"Erster Schritt — Term vereinfachen: $$f(x) = \\frac{x^2}{x} + \\frac{4}{x} = x + \\frac{4}{x}$$ Zweiter Schritt — Extremstelle: $$f'(x) = 1 - \\frac{4}{x^2} = 0 \\;\\Rightarrow\\; x^2 = 4 \\;\\Rightarrow\\; x = 2 \\quad (x>0)$$ Dritter Schritt — Art und Wert: \\(f''(x) = \\frac{8}{x^3} > 0\\) für \\(x > 0\\), es liegt also ein Minimum vor. $$f(2) = 2 + \\frac{4}{2} = 4$$ Für alle \\(x > 0\\) gilt damit \\(x + \\frac4x \\geq 4\\)." },
      { id:30, level:5, typ:"numerisch", frage:"Der Graph von \\(f(x)=\\frac{x+2}{x-1}\\) und die Gerade \\(y=x\\) schneiden einander zweimal. Bestimme die größere Schnittstelle (gerundet).", loesung:2.732, toleranz:0.01, tipp:"Setze die beiden Terme gleich, befreie die Gleichung vom Bruch und prüfe am Ende, ob beide Lösungen im Definitionsbereich liegen.", loesungsweg:"Gleichsetzen und mit dem Nenner multiplizieren (erlaubt für \\(x \\neq 1\\)): $$\\frac{x+2}{x-1} = x \\;\\Rightarrow\\; x+2 = x(x-1) = x^2 - x$$ $$x^2 - 2x - 2 = 0$$ Lösungsformel: $$x = \\frac{2 \\pm \\sqrt{4+8}}{2} = 1 \\pm \\sqrt{3}$$ Beide Werte sind von \\(1\\) verschieden, liegen also im Definitionsbereich. Die größere Schnittstelle ist $$x = 1 + \\sqrt3 \\approx 2{,}7321$$ Wer den Definitionsbereich nicht prüft, übersieht bei anderen Aufgaben leicht eine Scheinlösung an der Polstelle." },
      // L6 -- AFB III: Behauptung pruefen, Fallunterscheidung, Abi-Format eA
      { id:31, level:6, typ:"mc", frage:"Beurteilen Sie: „Haben Zähler und Nenner eine gemeinsame Nullstelle, so liegt dort stets eine hebbare Lücke.“ Welche Beurteilung trägt?", optionen:["Sie trifft nicht zu: bei \\(\\frac{x-1}{(x-1)^2}\\) bleibt nach dem Kürzen eine Polstelle","Sie trifft zu: nach dem Kürzen ist der Nenner an dieser Stelle nicht mehr null","Sie trifft nicht zu: ein Bruch mit gleicher Nullstelle ist nirgends definiert","Sie trifft zu, sofern der Zähler dort eine einfache Nullstelle besitzt"], korrekt:0, tipp:"Prüfe die Behauptung an einem Beispiel, in dem die Nullstelle des Nenners mehrfach auftritt.", loesungsweg:"Entscheidend ist nicht, <b>ob</b> beide null werden, sondern <b>wie oft</b>. Gegenbeispiel: $$\\frac{x-1}{(x-1)^2} = \\frac{1}{x-1} \\quad (x \\neq 1)$$ Nach dem Kürzen steht der Faktor immer noch im Nenner — bei \\(x = 1\\) liegt weiterhin eine Polstelle, sogar mit Vorzeichenwechsel. Hebbar ist die Lücke nur, wenn der Zähler den Faktor <b>mindestens so oft</b> enthält wie der Nenner. Die vierte Antwort dreht diese Bedingung gerade um: Eine einfache Nullstelle im Zähler reicht bei doppelter Nennernullstelle nicht aus." },
      { id:32, level:6, typ:"numerisch", frage:"Betrachtet werden die Funktionen \\(f_n(x)=\\frac{x^n}{x^2+1}\\) für \\(n = 0, 1, 2, 3, 4\\). Bei wie vielen dieser fünf Funktionen besitzt der Graph eine waagerechte Asymptote?", loesung:3, toleranz:0, tipp:"Vergleiche für jeden Exponenten den Zähler- mit dem Nennergrad und ordne die drei möglichen Fälle zu.", loesungsweg:"Der Nennergrad ist stets \\(2\\). Fallunterscheidung nach dem Zählergrad \\(n\\): <br>\\(n = 0\\): Zählergrad kleiner, Asymptote \\(y = 0\\); <br>\\(n = 1\\): Zählergrad kleiner, Asymptote \\(y = 0\\); <br>\\(n = 2\\): gleiche Grade, Asymptote \\(y = 1\\); <br>\\(n = 3\\): Zählergrad um eins größer, der Graph wächst über alle Grenzen — schiefe, keine waagerechte Asymptote; <br>\\(n = 4\\): Zählergrad um zwei größer, ebenfalls keine waagerechte Asymptote. Es sind also \\(3\\) der fünf Funktionen. Der Nenner \\(x^2+1\\) hat übrigens keine reelle Nullstelle — Polstellen gibt es bei keiner von ihnen." },
      { id:33, level:6, typ:"numerisch", frage:"Gegeben ist die Schar \\(f_k(x)=\\frac{x}{x^2-k}\\) mit \\(k \\in \\mathbb{R}\\). Untersuchen Sie, für welche \\(k\\) der Graph zwei Polstellen besitzt, und geben Sie die kleinste ganze Zahl \\(k\\) mit dieser Eigenschaft an.", loesung:1, toleranz:0, tipp:"Untersuche zuerst die Nullstellen des Nenners in Abhängigkeit vom Parameter und prüfe danach, ob der Zähler dort ebenfalls null wird.", loesungsweg:"Nennernullstellen: $$x^2 - k = 0 \\;\\Rightarrow\\; x^2 = k$$ Fallunterscheidung: <br>\\(k < 0\\): keine reelle Lösung, der Graph hat keine Polstelle; <br>\\(k = 0\\): eine doppelte Lösung \\(x = 0\\), dort ist aber auch der Zähler null — \\(f_0(x) = \\frac{x}{x^2} = \\frac1x\\) hat eine Polstelle, jedoch nur eine; <br>\\(k > 0\\): zwei Lösungen \\(\\pm\\sqrt k\\); der Zähler \\(x\\) ist dort von null verschieden, es sind also zwei echte Polstellen. Zwei Polstellen gibt es demnach genau für \\(k > 0\\); die kleinste ganze Zahl darin ist \\(1\\). Der Fall \\(k = 0\\) wird leicht mitgezählt, obwohl dort gekürzt werden kann." },
      { id:34, level:6, typ:"numerisch", frage:"Gegeben ist \\(f(x)=\\frac{x^2-9}{x-3}\\). Zeigen Sie, dass der Graph eine Gerade mit einer einzigen Lücke ist, und geben Sie an, an welcher Stelle diese Gerade die \\(x\\)-Achse schneidet.", loesung:-3, toleranz:0, tipp:"Zerlege den Zähler in Faktoren, kürze und halte dabei fest, welche Stelle aus dem Definitionsbereich ausgeschlossen bleibt.", loesungsweg:"Der Zähler ist eine dritte binomische Formel: $$f(x) = \\frac{(x-3)(x+3)}{x-3} = x+3 \\quad (x \\neq 3)$$ Der Graph ist also die Gerade \\(y = x+3\\), aus der genau der Punkt \\((3 \\mid 6)\\) herausgenommen ist — eine hebbare Lücke, keine Polstelle. Ihre Nullstelle: $$x + 3 = 0 \\;\\Rightarrow\\; x = -3$$ Diese Stelle liegt im Definitionsbereich und ist damit auch Nullstelle von \\(f\\). Der Zusatz \\(x \\neq 3\\) darf beim Kürzen nie entfallen — sonst geht die Lücke verloren." },
      { id:35, level:6, typ:"numerisch", frage:"Wie viele Polstellen hat der Graph von \\(f(x)=\\frac{1}{x^2-4x+5}\\)?", loesung:0, toleranz:0, tipp:"Untersuche den Nenner auf reelle Nullstellen; eine quadratische Ergänzung macht sein Vorzeichen sichtbar.", loesungsweg:"Polstellen können nur dort liegen, wo der Nenner null wird: $$x^2 - 4x + 5 = 0$$ Die Diskriminante ist $$D = (-4)^2 - 4 \\cdot 1 \\cdot 5 = 16 - 20 = -4 < 0$$ Es gibt also keine reelle Nullstelle. Deutlicher noch zeigt es die quadratische Ergänzung: $$x^2 - 4x + 5 = (x-2)^2 + 1 \\geq 1$$ Der Nenner ist stets mindestens \\(1\\), die Funktion damit auf ganz \\(\\mathbb{R}\\) definiert und ohne Polstelle. Ihr größter Wert ist \\(1\\) bei \\(x = 2\\); für große \\(|x|\\) strebt sie gegen \\(0\\)." },
      { id:36, level:6, typ:"numerisch", frage:"Gegeben ist die Schar \\(f_a(x)=\\frac{ax+1}{x-a}\\) mit \\(a>0\\). Zeigen Sie, dass jeder Graph eine senkrechte und eine waagerechte Asymptote besitzt, und bestimmen Sie \\(a\\) so, dass sich beide Asymptoten im Punkt \\((2 \\mid 2)\\) schneiden.", loesung:2, toleranz:0, tipp:"Bestimme beide Asymptoten allgemein in Abhängigkeit vom Parameter und vergleiche ihre Lage mit den Koordinaten des vorgegebenen Punktes.", loesungsweg:"Senkrechte Asymptote: Der Nenner wird null bei \\(x = a\\); der Zähler hat dort den Wert \\(a^2+1 > 0\\), es ist also eine echte Polstelle. $$x = a$$ Waagerechte Asymptote: Zähler und Nenner haben denselben Grad, es entscheidet das Verhältnis der Leitkoeffizienten. $$\\lim_{x \\to \\pm\\infty} \\frac{ax+1}{x-a} = a \\;\\Rightarrow\\; y = a$$ Beide Asymptoten gibt es demnach für jedes \\(a > 0\\), und sie schneiden einander stets im Punkt \\((a \\mid a)\\). Gefordert ist \\((2 \\mid 2)\\), also $$a = 2$$ Die Schnittpunkte aller Asymptotenpaare liegen auf der Geraden \\(y = x\\)." }];
