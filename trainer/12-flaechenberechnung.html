<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-flaechenberechnung';
    const THEMA_CONFIG = { name: 'Flächenberechnung', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Die Fläche zwischen Graph von \\(f\\) (mit \\(f \\geq 0\\)) und x-Achse auf \\([a,b]\\) berechnet man mit:", optionen: ["\\(f(b)-f(a)\\)", "\\(\\int_a^b f(x)dx\\)", "\\(F'(x)\\)", "\\(\\frac{f(a)+f(b)}{2}\\)"], korrekt: 1, tipp: "Fläche = bestimmtes Integral.", loesungsweg: "$$A = \\int_a^b f(x)dx \\;\\; (\\text{für } f \\geq 0)$$" },
      { id: 2, level: 1, typ: "numerisch", frage: "Fläche zwischen \\(f(x) = 2\\) und x-Achse auf \\([0,3]\\).", loesung: 6, toleranz: 0, tipp: "Der Graph ist eine waagerechte Gerade; welche einfache Figur liegt zwischen ihr und der Achse?", loesungsweg: "$$A = \\int_0^3 2\\,dx = 6$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "Fläche zwischen \\(f(x) = x\\) und x-Achse auf \\([0,4]\\).", loesung: 8, toleranz: 0, tipp: "Der Graph ist die Winkelhalbierende; zwischen ihr und der Achse liegt ein Dreieck. Grundseite und Höhe liest du an den Rändern ab.", loesungsweg: "$$A = \\int_0^4 x\\,dx = \\left[\\tfrac{x^2}{2}\\right]_0^4 = 8$$" },
      { id: 4, level: 1, typ: "mc", frage: "Wenn \\(f(x) < 0\\) auf \\([a,b]\\), dann ist \\(\\int_a^b f dx\\)", optionen: ["positiv, = Fläche", "negativ, Fläche = \\(-\\int_a^b f dx\\)", "null", "undefiniert"], korrekt: 1, tipp: "Integral negativ → Betrag nehmen für Fläche.", loesungsweg: "Fläche \\(A = |\\int_a^b f dx| = -\\int_a^b f dx\\), wenn \\(f<0\\)." },
      { id: 5, level: 1, typ: "numerisch", frage: "Fläche zwischen \\(f(x) = -2\\) und x-Achse auf \\([0,3]\\).", loesung: 6, toleranz: 0, tipp: "Betrag nehmen.", loesungsweg: "$$A = |\\int_0^3 -2\\,dx| = |-6| = 6$$" },
      { id: 6, level: 1, typ: "mc", frage: "Welche Nullstellen hat \\(f(x) = x^2 - 4\\)?", optionen: ["\\(0\\)", "\\(\\pm 2\\)", "\\(\\pm 4\\)", "\\(1; 4\\)"], korrekt: 1, tipp: "\\(x^2 = 4\\).", loesungsweg: "\\(x^2 - 4 = 0 \\Rightarrow x = \\pm 2\\)." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "Fläche unter \\(f(x) = x^2\\) auf \\([0,3]\\).", loesung: 9, toleranz: 0, tipp: "\\(F=\\frac{x^3}{3}\\).", loesungsweg: "$$A = \\int_0^3 x^2 dx = \\tfrac{27}{3} = 9$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Fläche unter \\(f(x) = 3x^2\\) auf \\([0,2]\\).", loesung: 8, toleranz: 0, tipp: "\\(F=x^3\\).", loesungsweg: "$$A = [x^3]_0^2 = 8$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne den Inhalt der Fläche unter dem Graphen von \\(f(x) = 2x + 4\\) über dem Intervall \\([1;3]\\).", loesung: 16, toleranz: 0.05, tipp: "Der Graph liegt über dem ganzen Intervall oberhalb der Achse; bilde eine Stammfunktion des linearen Terms.", loesungsweg: "Wegen \\(f(1) = 6 > 0\\) und \\(f(3) = 10 > 0\\) liegt der Graph oberhalb der Achse, der Inhalt ist also gleich dem Integral: $$A = \\int_1^3 (2x+4)\\,dx = \\left[x^2+4x\\right]_1^3$$ $$= (9+12) - (1+4) = 21 - 5 = 16$$ Probe über die Trapezformel: die mittlere Höhe ist \\(\\tfrac{6+10}{2} = 8\\), die Breite \\(2\\), also \\(8 \\cdot 2 = 16\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Fläche unter \\(f(x) = 2x + 1\\) auf \\([0,3]\\).", loesung: 12, toleranz: 0, tipp: "\\(F = x^2 + x\\).", loesungsweg: "$$A = [x^2+x]_0^3 = 12$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Fläche unter \\(f(x) = x^3\\) auf \\([0,2]\\).", loesung: 4, toleranz: 0, tipp: "\\(F = \\frac{x^4}{4}\\).", loesungsweg: "$$A = \\tfrac{16}{4} = 4$$" },
      { id: 12, level: 2, typ: "mc", frage: "Fläche unter \\(f(x) = e^x\\) auf \\([0,1]\\):", optionen: ["\\(e\\)", "\\(e-1\\)", "\\(1-e\\)", "\\(e+1\\)"], korrekt: 1, tipp: "\\([e^x]_0^1\\).", loesungsweg: "$$A = e - 1 \\approx 1{,}718$$" },
      // LEVEL 3 -- Mit Nullstellen
      { id: 13, level: 3, typ: "numerisch", frage: "\\(f(x) = x^2 - 1\\). Fläche zwischen Graph und x-Achse auf \\([-1,1]\\). (Dezimal)", loesung: 1.333, toleranz: 0.01, tipp: "\\(f \\leq 0\\) dort. \\(A = |\\int_{-1}^1 f|\\).", loesungsweg: "$$\\int_{-1}^{1}(x^2-1)dx = \\tfrac{2}{3}-2 = -\\tfrac{4}{3}$$<br>\\(A = \\tfrac{4}{3} \\approx 1{,}33\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x) = x^2 - 4\\). Fläche zwischen Graph und x-Achse auf \\([-2,2]\\). (Dezimal)", loesung: 10.667, toleranz: 0.05, tipp: "\\(f \\leq 0\\) dort.", loesungsweg: "$$|\\int_{-2}^{2}(x^2-4)dx| = |\\tfrac{16}{3}-16| = \\tfrac{32}{3} \\approx 10{,}67$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Fläche zwischen \\(f(x) = x^3\\) und x-Achse auf \\([-2,2]\\).", loesung: 8, toleranz: 0.01, tipp: "Vorzeichenwechsel bei 0! Aufteilen.", loesungsweg: "$$A = |\\int_{-2}^{0} x^3 dx| + \\int_0^2 x^3 dx = 4 + 4 = 8$$" },
      { id: 16, level: 3, typ: "mc", frage: "Warum muss man bei Flächen mit Nullstellen aufteilen?", optionen: ["Wegen Symmetrie", "Weil sich pos. und neg. Flächen sonst aufheben", "Nur bei geraden Funktionen", "Man muss nie aufteilen"], korrekt: 1, tipp: "Integral kann 0 werden, Fläche nicht.", loesungsweg: "Das Integral kann wegen Vorzeichen Flächen zu null summieren. Flächen dagegen sind immer positiv — deshalb Nullstellen finden und abschnittsweise integrieren." },
      { id: 17, level: 3, typ: "numerisch", frage: "Der Graph von \\(f(x) = x^2 - 3x\\) liegt über dem Intervall \\([0;3]\\) unterhalb der \\(x\\)-Achse. Berechne den Inhalt der Fläche zwischen Graph und Achse.", loesung: 4.5, toleranz: 0.02, tipp: "Berechne zuerst das Integral; sein Vorzeichen bestätigt die Lage, der Flächeninhalt ist sein Betrag.", loesungsweg: "$$\\int_0^3 \\left(x^2-3x\\right)dx = \\left[\\frac{x^3}{3}-\\frac{3x^2}{2}\\right]_0^3 = 9 - 13{,}5 = -4{,}5$$ Das Integral ist negativ, weil der Graph auf dem ganzen Intervall unterhalb der Achse verläuft. Der Flächeninhalt ist der Betrag davon. Probe für die Lage: \\(f(1) = 1-3 = -2 < 0\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Nullstellen von \\(f(x) = x^3 - x\\)? Summe der Nullstellen:", loesung: 0, toleranz: 0, tipp: "\\(x(x-1)(x+1)=0\\).", loesungsweg: "Ausklammern und die dritte binomische Formel anwenden: $$x^3-x = x(x^2-1) = x(x-1)(x+1) = 0$$ Die Nullstellen sind \\(-1\\), \\(0\\) und \\(1\\), ihre Summe also \\(0\\). Für die Flächenberechnung sind sie die Grenzen der Teilstücke — zwischen \\(-1\\) und \\(0\\) liegt der Graph oberhalb, zwischen \\(0\\) und \\(1\\) unterhalb der Achse." },
      // LEVEL 4 -- Fläche zwischen zwei Kurven
      { id: 19, level: 4, typ: "numerisch", frage: "Die Graphen von \\(f(x) = 3x^2\\) und \\(g(x) = 3x + 6\\) schließen eine Fläche ein. Berechne ihren Inhalt.", loesung: 13.5, toleranz: 0.05, tipp: "Die Grenzen sind nicht angegeben; sie ergeben sich aus einer quadratischen Gleichung. Kläre danach durch eine Probe, welcher Graph oben verläuft.", loesungsweg: "<b>Schnittstellen:</b> $$3x^2 = 3x+6 \\;\\Longrightarrow\\; x^2-x-2 = 0$$ mit \\(x_1=-1\\) und \\(x_2=2\\). <b>Lage:</b> an der Zwischenstelle \\(x=0\\) ist \\(g(0)=6\\) und \\(f(0)=0\\), die Gerade verläuft also oben. <b>Inhalt:</b> $$A = \\int_{-1}^{2}\\left(3x+6-3x^2\\right)dx = \\left[\\frac{3x^2}{2}+6x-x^3\\right]_{-1}^{2}$$ $$= (6+12-8) - \\left(\\frac{3}{2}-6+1\\right) = 10 + 3{,}5 = 13{,}5$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Für welche Zahl \\(a > 0\\) schließen der Graph von \\(f(x) = x^2\\), die \\(x\\)-Achse und die Gerade \\(x = a\\) eine Fläche vom Inhalt \\(9\\) ein?", loesung: 3, toleranz: 0.02, tipp: "Integriere mit \\(a\\) als oberer Grenze; es entsteht ein Term in \\(a\\), der gleich dem geforderten Inhalt zu setzen ist.", loesungsweg: "Auf \\([0;a]\\) liegt der Graph oberhalb der Achse, also ist der Inhalt gleich dem Integral: $$A(a) = \\int_0^a x^2\\,dx = \\left[\\frac{x^3}{3}\\right]_0^a = \\frac{a^3}{3}$$ Gleichsetzen: $$\\frac{a^3}{3} = 9 \\;\\Longrightarrow\\; a^3 = 27 \\;\\Longrightarrow\\; a = 3$$ Die Umkehrung ist hier eindeutig, denn \\(A\\) wächst mit \\(a\\) streng monoton." },
      { id: 21, level: 4, typ: "numerisch", frage: "Ein Grundstück wird begrenzt von der \\(x\\)-Achse, den Geraden \\(x = 0\\) und \\(x = 20\\) sowie dem Graphen von \\(f(x) = 30 - 0{,}05x^2\\) (alle Angaben in Metern). Berechne den Flächeninhalt in Quadratmetern (auf eine Nachkommastelle).", loesung: 466.7, toleranz: 1, tipp: "Prüfe zuerst, ob der Graph über dem ganzen Bereich oberhalb der Achse liegt — sonst müsste geteilt werden.", loesungsweg: "<b>Lage:</b> \\(f(20) = 30 - 0{,}05 \\cdot 400 = 10 > 0\\), und \\(f\\) fällt auf \\([0;20]\\); der Graph liegt also durchweg oberhalb der Achse, eine Aufteilung entfällt. <b>Inhalt:</b> $$A = \\int_0^{20}\\left(30 - 0{,}05x^2\\right)dx = \\left[30x - \\frac{0{,}05}{3}x^3\\right]_0^{20}$$ $$= 600 - \\frac{0{,}05 \\cdot 8000}{3} = 600 - 133{,}3 \\approx 466{,}7$$ Das Grundstück misst rund 466,7 Quadratmeter." },
      { id: 22, level: 4, typ: "numerisch", frage: "Der Graph von \\(f(x) = 6x - x^2\\) schließt mit der \\(x\\)-Achse eine Fläche ein. Berechne deren Inhalt.", loesung: 36, toleranz: 0.1, tipp: "Die Integrationsgrenzen sind die Nullstellen; sie erhältst du durch Ausklammern.", loesungsweg: "<b>Nullstellen:</b> $$6x - x^2 = x(6-x) = 0$$ also \\(x=0\\) und \\(x=6\\). <b>Lage:</b> an der Zwischenstelle \\(x=3\\) ist \\(f(3)=9>0\\), der Graph liegt also oberhalb der Achse. <b>Inhalt:</b> $$A = \\int_0^6\\left(6x-x^2\\right)dx = \\left[3x^2-\\frac{x^3}{3}\\right]_0^6 = 108 - 72 = 36$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Die Graphen von \\(f(x) = x^3\\) und \\(g(x) = x\\) schließen für \\(x \\ge 0\\) eine Fläche ein. Berechne ihren Inhalt.", loesung: 0.25, toleranz: 0.01, tipp: "Setze die Terme gleich und klammere aus; von den Lösungen kommen nur die nichtnegativen in Frage.", loesungsweg: "<b>Schnittstellen:</b> $$x^3 = x \\;\\Longrightarrow\\; x\\left(x^2-1\\right) = 0$$ mit \\(x = 0\\), \\(x = 1\\) und \\(x = -1\\); wegen \\(x \\ge 0\\) bleiben \\(0\\) und \\(1\\). <b>Lage:</b> bei \\(x = 0{,}5\\) ist \\(g(0{,}5) = 0{,}5\\) und \\(f(0{,}5) = 0{,}125\\), die Gerade liegt oben. <b>Inhalt:</b> $$A = \\int_0^1\\left(x - x^3\\right)dx = \\left[\\frac{x^2}{2}-\\frac{x^4}{4}\\right]_0^1 = 0{,}5 - 0{,}25 = 0{,}25$$" },
      { id: 24, level: 4, typ: "numerisch", frage: "Der Graph von \\(f(x) = 8 - 2x^2\\) schließt mit der \\(x\\)-Achse eine Fläche ein. Berechne deren Inhalt (auf drei Nachkommastellen).", loesung: 21.333, toleranz: 0.05, tipp: "Bestimme zuerst die beiden Nullstellen; die Symmetrie des Graphen zur \\(y\\)-Achse erspart danach die Hälfte der Rechnung.", loesungsweg: "<b>Nullstellen:</b> \\(8 - 2x^2 = 0\\) ergibt \\(x^2 = 4\\), also \\(x = \\pm 2\\). <b>Lage:</b> \\(f(0) = 8 > 0\\), der Graph liegt zwischen den Nullstellen oberhalb der Achse. <b>Inhalt:</b> $$A = \\int_{-2}^{2}\\left(8-2x^2\\right)dx = \\left[8x - \\frac{2x^3}{3}\\right]_{-2}^{2}$$ $$= 2\\left(16 - \\frac{16}{3}\\right) = 2 \\cdot \\frac{32}{3} = \\frac{64}{3} \\approx 21{,}333$$ Der Faktor \\(2\\) nutzt die Symmetrie zur \\(y\\)-Achse aus." },
      // LEVEL 5 -- Verfahren kombinieren, Parameter aus einer Flächenbedingung, Fehler finden
      { id: 25, level: 5, typ: "mc", frage: "Für die Fläche zwischen den Graphen von \\(f(x) = x^2\\) und \\(g(x) = x + 2\\) wurde gerechnet: \\(A = \\int_{-1}^{2} (x+2)\\,dx = 7{,}5\\) Flächeneinheiten. Wie ist das zu beurteilen?", optionen: ["Richtig, die obere Funktion ist zu integrieren.", "Falsch: der Inhalt ist \\(4{,}5\\), die untere Funktion fehlt.", "Falsch: der Inhalt ist \\(2{,}5\\), es ist noch zu dritteln.", "Falsch: der Inhalt ist \\(15\\), beide Flächen sind zu addieren."], korrekt: 1, tipp: "Überlege, welche Fläche der angeschriebene Ansatz tatsächlich misst — und wodurch sie sich von der gesuchten unterscheidet.", loesungsweg: "Der Ansatz berechnet die Fläche zwischen der <b>Geraden und der \\(x\\)-Achse</b>, nicht die zwischen den beiden Graphen; es fehlt der Abzug der unteren Funktion: $$A = \\int_{-1}^{2}\\left((x+2) - x^2\\right)dx = \\left[\\frac{x^2}{2} + 2x - \\frac{x^3}{3}\\right]_{-1}^{2}$$ $$= \\left(2 + 4 - \\frac{8}{3}\\right) - \\left(\\frac{1}{2} - 2 + \\frac{1}{3}\\right) = \\frac{10}{3} + \\frac{7}{6} = 4{,}5$$ Die Differenz \\(7{,}5 - 4{,}5 = 3\\) ist gerade der Inhalt der Fläche unter der Parabel — der zu viel gezählte Anteil. Dass der Wert zu groß sein muss, sieht man auch ohne Rechnung: die gesuchte Fläche liegt ganz innerhalb der Fläche unter der Geraden." },
      { id: 26, level: 5, typ: "numerisch", frage: "Die Graphen von \\(f(x) = x^2\\) und \\(g(x) = 3x - 2\\) schließen eine Fläche ein. Berechne ihren Inhalt (auf drei Nachkommastellen).", loesung: 0.167, toleranz: 0.005, tipp: "Die Schnittstellen sind nicht angegeben — sie ergeben sich aus einer quadratischen Gleichung und bilden erst die Integrationsgrenzen.", loesungsweg: "<b>Schnittstellen:</b> $$x^2 = 3x - 2 \\;\\Longrightarrow\\; x^2 - 3x + 2 = 0$$ mit den Lösungen \\(x_1 = 1\\) und \\(x_2 = 2\\). <b>Lage:</b> an der Zwischenstelle \\(x = 1{,}5\\) ist \\(g(1{,}5) = 2{,}5\\) und \\(f(1{,}5) = 2{,}25\\); die Gerade verläuft also oben. <b>Inhalt:</b> $$A = \\int_1^2 \\left(3x - 2 - x^2\\right)dx = \\left[\\frac{3x^2}{2} - 2x - \\frac{x^3}{3}\\right]_1^2$$ $$= \\left(6 - 4 - \\frac{8}{3}\\right) - \\left(\\frac{3}{2} - 2 - \\frac{1}{3}\\right) = -\\frac{2}{3} + \\frac{5}{6} = \\frac{1}{6} \\approx 0{,}167$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Für welche Zahl \\(a > 0\\) schließt der Graph von \\(f(x) = a - x^2\\) mit der \\(x\\)-Achse eine Fläche vom Inhalt \\(36\\) ein?", loesung: 9, toleranz: 0.05, tipp: "Bestimme zuerst die Nullstellen in Abhängigkeit von \\(a\\); sie sind die Integrationsgrenzen, und der Flächeninhalt wird dadurch ein Term in \\(a\\).", loesungsweg: "<b>Nullstellen:</b> \\(a - x^2 = 0\\) ergibt \\(x = \\pm\\sqrt{a}\\). <b>Inhalt allgemein:</b> auf diesem Intervall liegt der Graph oberhalb der Achse, also $$A = \\int_{-\\sqrt{a}}^{\\sqrt{a}} \\left(a - x^2\\right)dx = \\left[ax - \\frac{x^3}{3}\\right]_{-\\sqrt{a}}^{\\sqrt{a}} = 2\\left(a\\sqrt{a} - \\frac{a\\sqrt{a}}{3}\\right) = \\frac{4}{3}a\\sqrt{a}$$ <b>Bedingung:</b> $$\\frac{4}{3}a\\sqrt{a} = 36 \\;\\Longrightarrow\\; a\\sqrt{a} = 27 \\;\\Longrightarrow\\; a^3 = 729$$ also \\(a = 9\\). Probe: die Nullstellen liegen dann bei \\(\\pm 3\\)." },
      { id: 28, level: 5, typ: "mc", frage: "Für die Fläche zwischen den Graphen von \\(f(x) = x^2\\) und \\(g(x) = x\\) über dem Intervall \\([0;2]\\) wurde gerechnet: \\(A = \\int_0^2 \\left(x^2 - x\\right)dx = \\tfrac{8}{3} - 2 = \\tfrac{2}{3}\\). Wie ist das zu beurteilen?", optionen: ["Richtig, der Integrand ist korrekt gewählt.", "Falsch: der Inhalt ist \\(1\\), bei \\(x = 1\\) ist zu teilen.", "Falsch: der Inhalt ist \\(\\tfrac{4}{3}\\), es fehlt ein Summand.", "Falsch: der Inhalt ist \\(\\tfrac{1}{3}\\), es ist zu halbieren."], korrekt: 1, tipp: "Prüfe, ob die beiden Graphen innerhalb des Intervalls eine gemeinsame Stelle haben — dort kann sich die Lage zueinander ändern.", loesungsweg: "Die Graphen schneiden einander bei \\(x = 0\\) und bei \\(x = 1\\), also <b>innerhalb</b> des Intervalls. Links von \\(1\\) liegt die Gerade oben, rechts davon die Parabel. Deshalb muss geteilt werden: $$A = \\int_0^1 \\left(x - x^2\\right)dx + \\int_1^2 \\left(x^2 - x\\right)dx$$ $$= \\left(\\frac{1}{2} - \\frac{1}{3}\\right) + \\left(\\frac{8}{3} - 2\\right) - \\left(\\frac{1}{3} - \\frac{1}{2}\\right) = \\frac{1}{6} + \\frac{5}{6} = 1$$ Der vorgelegte Weg liefert \\(\\tfrac{2}{3}\\): dort heben sich die beiden Teilstücke teilweise gegenseitig auf, weil ihre Vorzeichen verschieden sind." },
      { id: 29, level: 5, typ: "numerisch", frage: "Die Graphen von \\(f(x) = \\sin x\\) und \\(g(x) = \\cos x\\) schließen über dem Intervall \\(\\left[0; \\frac{\\pi}{2}\\right]\\) zwei Flächenstücke ein. Berechne den Gesamtinhalt (auf drei Nachkommastellen).", loesung: 0.828, toleranz: 0.01, tipp: "Suche zuerst die Stelle im Intervall, an der beide Graphen denselben Wert haben; dort wechselt die Lage zueinander.", loesungsweg: "<b>Schnittstelle:</b> \\(\\sin x = \\cos x\\) gilt im Intervall bei \\(x = \\frac{\\pi}{4}\\). <b>Erstes Stück</b> (Kosinus oben): $$\\int_0^{\\pi/4}\\left(\\cos x - \\sin x\\right)dx = \\left[\\sin x + \\cos x\\right]_0^{\\pi/4} = \\sqrt{2} - 1$$ <b>Zweites Stück</b> (Sinus oben): $$\\int_{\\pi/4}^{\\pi/2}\\left(\\sin x - \\cos x\\right)dx = \\sqrt{2} - 1$$ <b>Summe:</b> $$2\\left(\\sqrt{2} - 1\\right) \\approx 0{,}828$$ Beide Stücke sind gleich groß — das passt zur Symmetrie der beiden Graphen zur Stelle \\(\\frac{\\pi}{4}\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Berechne den Inhalt der Fläche, die der Graph von \\(f(x) = e^x\\) und die waagerechte Gerade \\(y = e^2\\) über dem Intervall \\([0;2]\\) einschließen (auf drei Nachkommastellen).", loesung: 8.389, toleranz: 0.02, tipp: "Überlege zuerst, welcher der beiden Graphen über dem Intervall oben verläuft; die Gerade ist dabei wie eine konstante Funktion zu behandeln.", loesungsweg: "Auf \\([0;2]\\) wächst \\(e^x\\) von \\(1\\) auf \\(e^2\\) und bleibt dabei stets unterhalb der Geraden; berührt wird sie erst am rechten Rand. Also gilt „Gerade minus Kurve“: $$A = \\int_0^2 \\left(e^2 - e^x\\right)dx = \\left[e^2 x - e^x\\right]_0^2$$ $$= \\left(2e^2 - e^2\\right) - \\left(0 - 1\\right) = e^2 + 1 \\approx 7{,}389 + 1 = 8{,}389$$ Der konstante Term \\(e^2\\) wird wie jede Konstante integriert und ergibt \\(e^2 x\\) — er darf nicht mit der e-Funktion verwechselt werden." },
      // LEVEL 6 -- Abi-Format: Sachkontext, Nachweis, Fallunterscheidung
      { id: 31, level: 6, typ: "numerisch", frage: "Der Querschnitt eines Tunnels wird durch den Graphen von \\(f(x) = 6 - 0{,}5x^2\\) über der \\(x\\)-Achse beschrieben (Angaben in Metern). Zeigen Sie, dass der Tunnel an der Sohle etwa 6,93 m breit ist, und berechnen Sie den Inhalt der Querschnittsfläche in Quadratmetern (auf zwei Nachkommastellen).", loesung: 27.71, toleranz: 0.1, tipp: "Die Sohle liegt auf der \\(x\\)-Achse; ihre Breite ist der Abstand der beiden Nullstellen, und diese sind zugleich die Integrationsgrenzen.", loesungsweg: "<b>Breite:</b> \\(6 - 0{,}5x^2 = 0\\) ergibt \\(x^2 = 12\\), also \\(x = \\pm\\sqrt{12} \\approx \\pm 3{,}46\\). Der Abstand beträgt \\(2\\sqrt{12} \\approx 6{,}93\\) Meter. <b>Fläche:</b> zwischen den Nullstellen liegt der Graph oberhalb der Achse: $$A = \\int_{-\\sqrt{12}}^{\\sqrt{12}}\\left(6 - 0{,}5x^2\\right)dx = \\left[6x - \\frac{x^3}{6}\\right]_{-\\sqrt{12}}^{\\sqrt{12}}$$ $$= 2\\left(6\\sqrt{12} - \\frac{12\\sqrt{12}}{6}\\right) = 2 \\cdot 4\\sqrt{12} = 8\\sqrt{12} \\approx 27{,}71$$ Der Querschnitt misst also rund 27,71 Quadratmeter." },
      { id: 32, level: 6, typ: "mc", frage: "Beurteilen Sie: „Liegen die Graphen von \\(f\\) und \\(g\\) über \\([a;b]\\) beide vollständig oberhalb der \\(x\\)-Achse, so ist der Inhalt der Fläche zwischen ihnen immer \\(\\int_a^b \\left(f(x) - g(x)\\right)dx\\).“", optionen: ["Zutreffend, oberhalb der Achse gibt es keine Vorzeichen.", "Nur mit dem Zusatz, dass \\(f\\) überall über \\(g\\) liegt.", "Nur bei ganzrationalen Funktionen zutreffend.", "Zutreffend, sofern beide Graphen steigen."], korrekt: 1, tipp: "Denken Sie an zwei Graphen, die einander innerhalb des Intervalls kreuzen, und fragen Sie, was das Integral dort liefert.", loesungsweg: "In dieser Form trifft die Aussage nicht zu; richtig wird sie erst mit dem Zusatz, dass \\(f\\) auf dem ganzen Intervall oberhalb von \\(g\\) verläuft. Für die Fläche <b>zwischen</b> zwei Graphen kommt es nämlich nicht auf die Lage zur \\(x\\)-Achse an, sondern darauf, welcher Graph oben verläuft. Gegenbeispiel: \\(f(x) = x + 1\\) und \\(g(x) = x^2 + 1\\) auf \\([0;2]\\) — beide Graphen liegen über der Achse, kreuzen einander aber bei \\(x = 1\\). Das Integral $$\\int_0^2 \\left((x+1) - (x^2+1)\\right)dx = 2 - \\frac{8}{3} = -\\frac{2}{3}$$ ist sogar negativ und kann kein Flächeninhalt sein. Richtig ist: an jeder Schnittstelle im Intervall teilen und die Beträge der Teilintegrale addieren." },
      { id: 33, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3 - 3x^2\\). Zeigen Sie, dass der Graph die \\(x\\)-Achse an den Stellen \\(0\\) und \\(3\\) schneidet, und berechnen Sie den Inhalt der Fläche, die er dort mit der \\(x\\)-Achse einschließt.", loesung: 6.75, toleranz: 0.05, tipp: "Ausklammern liefert die Nullstellen; prüfen Sie anschließend an einer Zwischenstelle, ob der Graph über oder unter der Achse verläuft.", loesungsweg: "<b>Nullstellen:</b> $$x^3 - 3x^2 = x^2(x - 3) = 0$$ also \\(x = 0\\) (doppelt) und \\(x = 3\\). <b>Lage:</b> an der Zwischenstelle \\(x = 1\\) ist \\(f(1) = -2 < 0\\), der Graph verläuft also zwischen den Nullstellen unterhalb der Achse. <b>Inhalt:</b> $$\\int_0^3 \\left(x^3 - 3x^2\\right)dx = \\left[\\frac{x^4}{4} - x^3\\right]_0^3 = \\frac{81}{4} - 27 = -6{,}75$$ Der Flächeninhalt ist der Betrag davon, also \\(6{,}75\\) Flächeneinheiten. Das Minuszeichen des Integrals ist kein Fehler, sondern die Folge der Lage unterhalb der Achse." },
      { id: 34, level: 6, typ: "numerisch", frage: "Die Graphen von \\(f(x) = x^2\\) und \\(g(x) = x + 6\\) schneiden einander in zwei Punkten. Bestimmen Sie die Schnittstellen und berechnen Sie den Inhalt der eingeschlossenen Fläche (auf zwei Nachkommastellen).", loesung: 20.83, toleranz: 0.1, tipp: "Gleichsetzen führt auf eine quadratische Gleichung; deren Lösungen sind die Integrationsgrenzen.", loesungsweg: "<b>Schnittstellen:</b> $$x^2 = x + 6 \\;\\Longrightarrow\\; x^2 - x - 6 = 0$$ mit \\(x_1 = -2\\) und \\(x_2 = 3\\). <b>Lage:</b> an der Zwischenstelle \\(x = 0\\) ist \\(g(0) = 6\\) und \\(f(0) = 0\\), die Gerade liegt also oben. <b>Inhalt:</b> $$A = \\int_{-2}^{3}\\left(x + 6 - x^2\\right)dx = \\left[\\frac{x^2}{2} + 6x - \\frac{x^3}{3}\\right]_{-2}^{3}$$ $$= \\left(4{,}5 + 18 - 9\\right) - \\left(2 - 12 + \\frac{8}{3}\\right) = 13{,}5 + 7{,}\\overline{3} \\approx 20{,}83$$ Ein negativer Wert an dieser Stelle wäre ein sicheres Zeichen für vertauschte Funktionen." },
      { id: 35, level: 6, typ: "numerisch", frage: "Die Graphen von \\(f(x) = x^2\\) und \\(g(x) = \\sqrt{x}\\) schließen im ersten Feld des Koordinatensystems eine Fläche ein. Zeigen Sie, dass sie einander nur an den Stellen \\(0\\) und \\(1\\) treffen, und berechnen Sie den Inhalt (auf drei Nachkommastellen).", loesung: 0.333, toleranz: 0.005, tipp: "Setzen Sie die Terme gleich und quadrieren Sie; die Wurzel ist nur für nichtnegative Werte erklärt. Für das Integral hilft die Potenzschreibweise der Wurzel.", loesungsweg: "<b>Schnittstellen:</b> aus \\(x^2 = \\sqrt{x}\\) folgt durch Quadrieren \\(x^4 = x\\), also \\(x(x^3 - 1) = 0\\) mit den Lösungen \\(x = 0\\) und \\(x = 1\\); negative Werte kommen wegen der Wurzel nicht in Frage. <b>Lage:</b> an der Zwischenstelle \\(x = 0{,}25\\) ist \\(\\sqrt{0{,}25} = 0{,}5\\) und \\(0{,}25^2 = 0{,}0625\\); die Wurzelfunktion liegt oben. <b>Inhalt:</b> mit \\(\\sqrt{x} = x^{1/2}\\) gilt $$A = \\int_0^1 \\left(x^{1/2} - x^2\\right)dx = \\left[\\frac{2}{3}x^{3/2} - \\frac{x^3}{3}\\right]_0^1 = \\frac{2}{3} - \\frac{1}{3} = \\frac{1}{3} \\approx 0{,}333$$" },
      { id: 36, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3 - 4x\\). Begründen Sie, dass \\(\\int_{-2}^{2} f(x)\\,dx = 0\\) gilt, obwohl der Graph mit der \\(x\\)-Achse Flächenstücke einschließt, und berechnen Sie den Gesamtinhalt dieser Flächenstücke.", loesung: 8, toleranz: 0.05, tipp: "Bestimmen Sie die Nullstellen und vergleichen Sie die Vorzeichen von \\(f\\) links und rechts der Stelle \\(0\\); rechnen Sie erst danach.", loesungsweg: "<b>Nullstellen:</b> \\(x(x^2-4) = 0\\) liefert \\(-2\\), \\(0\\) und \\(2\\). <b>Begründung:</b> \\(f\\) ist punktsymmetrisch zum Ursprung, denn \\(f(-x) = -f(x)\\). Zu jedem Stück links der Achse gehört ein gleich großes Stück rechts davon mit umgekehrtem Vorzeichen; im Integral heben sich beide auf. Das ist kein Grund, den Flächeninhalt null zu nennen — das Integral misst den <b>orientierten</b> Inhalt. <b>Gesamtinhalt:</b> $$\\int_0^2 \\left(x^3 - 4x\\right)dx = \\left[\\frac{x^4}{4} - 2x^2\\right]_0^2 = 4 - 8 = -4$$ Das rechte Stück hat also den Inhalt \\(4\\), das linke ebenso, zusammen \\(8\\) Flächeneinheiten." }];
