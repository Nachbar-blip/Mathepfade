    <script>
    const THEMA_KEY = '9-flaechenberechnung-determinante';
    const THEMA_CONFIG = { name: 'Flächen im Koordinatensystem', bereich: 'geometrie' };
    const AUFGABEN = [
      { id:1, level:1, typ:"numerisch", frage:"Ein Rechteck hat die Ecken \\(A(1|1)\\), \\(B(5|1)\\), \\(C(5|4)\\) und \\(D(1|4)\\). Wie groß ist sein Flächeninhalt?", loesung:12, toleranz:0, tipp:"Lies Länge und Breite aus den Koordinaten ab.", loesungsweg:"Länge \\(5 - 1 = 4\\), Breite \\(4 - 1 = 3\\): $$A = 4 \\cdot 3 = 12$$" },
      { id:2, level:1, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(0|0)\\), \\(B(6|0)\\) und \\(C(0|4)\\). Wie groß ist sein Flächeninhalt?", loesung:12, toleranz:0, tipp:"Bei \\(A\\) liegt ein rechter Winkel; die beiden Katheten liegen auf den Achsen.", loesungsweg:"Katheten \\(6\\) und \\(4\\): $$A = \\frac{6 \\cdot 4}{2} = 12$$" },
      { id:3, level:1, typ:"numerisch", frage:"Ein Quadrat hat die Ecken \\((2|2)\\), \\((5|2)\\), \\((5|5)\\) und \\((2|5)\\). Wie groß ist sein Flächeninhalt?", loesung:9, toleranz:0, tipp:"Die Seitenlänge ist die Differenz der x-Koordinaten.", loesungsweg:"Seitenlänge \\(5 - 2 = 3\\): $$A = 3^2 = 9$$" },
      { id:4, level:1, typ:"mc", frage:"Wie lang ist die Strecke zwischen \\(A(-2|1)\\) und \\(B(4|1)\\)?", optionen:["\\(6\\)", "\\(2\\)", "\\(4\\)", "\\(3\\)"], korrekt:0, tipp:"Beide Punkte haben dieselbe y-Koordinate; die Strecke ist waagerecht.", loesungsweg:"Von \\(x = -2\\) bis \\(x = 4\\) sind es $$4 - (-2) = 6$$ Längeneinheiten. Das Minuszeichen darf nicht verschluckt werden, sonst kommt \\(2\\) heraus." },
      { id:5, level:1, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(1|2)\\), \\(B(7|2)\\) und \\(C(3|6)\\). Wie groß ist sein Flächeninhalt?", loesung:12, toleranz:0, tipp:"Die Seite \\(AB\\) ist waagerecht; die Höhe ist der senkrechte Abstand von \\(C\\) zu dieser Seite.", loesungsweg:"Grundseite \\(AB = 7 - 1 = 6\\), Höhe \\(6 - 2 = 4\\): $$A = \\frac{6 \\cdot 4}{2} = 12$$" },
      { id:6, level:1, typ:"mc", frage:"Ein Rechteck hat die Ecken \\((0|0)\\), \\((3|0)\\), \\((3|7)\\) und \\((0|7)\\). Wie groß ist sein Flächeninhalt?", optionen:["\\(21\\)", "\\(10\\)", "\\(20\\)", "\\(24\\)"], korrekt:0, tipp:"Länge mal Breite; \\(10\\) wäre der halbe Umfang.", loesungsweg:"$$A = 3 \\cdot 7 = 21$$" },
      { id:7, level:2, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(-3|0)\\), \\(B(5|0)\\) und \\(C(2|5)\\). Wie groß ist sein Flächeninhalt?", loesung:20, toleranz:0, tipp:"Die Grundseite liegt auf der x-Achse; achte beim Abstand der Punkte \\(A\\) und \\(B\\) auf das Vorzeichen.", loesungsweg:"Grundseite \\(AB = 5 - (-3) = 8\\), Höhe \\(= 5\\) (y-Koordinate von \\(C\\)): $$A = \\frac{8 \\cdot 5}{2} = 20$$" },
      { id:8, level:2, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(2|1)\\), \\(B(2|7)\\) und \\(C(6|3)\\). Wie groß ist sein Flächeninhalt?", loesung:12, toleranz:0, tipp:"Hier ist eine Seite senkrecht; die Höhe wird dann waagerecht gemessen.", loesungsweg:"Grundseite \\(AB = 7 - 1 = 6\\) (senkrecht bei \\(x = 2\\)), Höhe = waagerechter Abstand von \\(C\\): \\(6 - 2 = 4\\). $$A = \\frac{6 \\cdot 4}{2} = 12$$" },
      { id:9, level:2, typ:"numerisch", frage:"Ein Parallelogramm hat die Ecken \\(A(0|0)\\), \\(B(5|0)\\), \\(C(7|3)\\) und \\(D(2|3)\\). Wie groß ist sein Flächeninhalt?", loesung:15, toleranz:0, tipp:"Grundseite mal Höhe; die Höhe ist der Abstand der beiden waagerechten Seiten.", loesungsweg:"Grundseite \\(AB = 5\\), Höhe \\(= 3\\): $$A = 5 \\cdot 3 = 15$$ Die schrägen Seiten spielen für die Fläche keine Rolle." },
      { id:10, level:2, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(-1|-2)\\), \\(B(5|-2)\\) und \\(C(1|3)\\). Wie groß ist sein Flächeninhalt?", loesung:15, toleranz:0, tipp:"Die Seite \\(AB\\) ist waagerecht bei \\(y = -2\\); die Höhe reicht bis \\(y = 3\\).", loesungsweg:"Grundseite \\(5 - (-1) = 6\\), Höhe \\(3 - (-2) = 5\\): $$A = \\frac{6 \\cdot 5}{2} = 15$$" },
      { id:11, level:2, typ:"mc", frage:"Ein Trapez hat die Ecken \\(A(0|0)\\), \\(B(8|0)\\), \\(C(6|4)\\) und \\(D(2|4)\\). Wie groß ist sein Flächeninhalt?", optionen:["\\(24\\)", "\\(32\\)", "\\(20\\)", "\\(28\\)"], korrekt:0, tipp:"Die parallelen Seiten sind \\(AB\\) und \\(DC\\); ihre Längen und der Abstand bestimmen die Fläche.", loesungsweg:"Parallele Seiten \\(8\\) und \\(4\\), Höhe \\(4\\): $$A = \\frac{(8 + 4) \\cdot 4}{2} = 24$$" },
      { id:12, level:2, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(0|0)\\), \\(B(0|5)\\) und \\(C(-4|2)\\). Wie groß ist sein Flächeninhalt?", loesung:10, toleranz:0, tipp:"Die Grundseite liegt auf der y-Achse; die Höhe ist der Abstand von \\(C\\) zur y-Achse.", loesungsweg:"Grundseite \\(AB = 5\\), Höhe \\(= 4\\) (Abstand von \\(x = -4\\) zur y-Achse): $$A = \\frac{5 \\cdot 4}{2} = 10$$" },
      { id:13, level:3, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(1|1)\\), \\(B(6|2)\\) und \\(C(3|5)\\). Keine Seite ist achsenparallel. Wie groß ist sein Flächeninhalt? Runde auf eine Dezimale.", loesung:9, toleranz:0.05, tipp:"Lege ein achsenparalleles Rechteck um das Dreieck und ziehe die drei Eckdreiecke ab.", loesungsweg:"Umgebendes Rechteck von \\(x = 1\\) bis \\(6\\) und \\(y = 1\\) bis \\(5\\): \\(5 \\cdot 4 = 20\\). Eckdreiecke: \\(\\frac{5 \\cdot 1}{2} = 2{,}5\\), \\(\\frac{3 \\cdot 3}{2} = 4{,}5\\), \\(\\frac{2 \\cdot 4}{2} = 4\\). $$A = 20 - 2{,}5 - 4{,}5 - 4 = 9$$" },
      { id:14, level:3, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(0|0)\\), \\(B(4|1)\\) und \\(C(1|5)\\). Wie groß ist sein Flächeninhalt? Runde auf eine Dezimale.", loesung:9.5, toleranz:0.05, tipp:"Umgebendes Rechteck \\(4 \\times 5\\), dann drei rechtwinklige Eckdreiecke abziehen.", loesungsweg:"Rechteck \\(4 \\cdot 5 = 20\\). Eckdreiecke: \\(\\frac{4 \\cdot 1}{2} = 2\\), \\(\\frac{3 \\cdot 4}{2} = 6\\), \\(\\frac{1 \\cdot 5}{2} = 2{,}5\\). $$A = 20 - 2 - 6 - 2{,}5 = 9{,}5$$" },
      { id:15, level:3, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(2|1)\\), \\(B(8|3)\\) und \\(C(4|6)\\). Wie groß ist sein Flächeninhalt?", loesung:13, toleranz:0.05, tipp:"Rechteck von \\(x = 2\\) bis \\(8\\) und \\(y = 1\\) bis \\(6\\) umlegen, Eckdreiecke abziehen.", loesungsweg:"Rechteck \\(6 \\cdot 5 = 30\\). Eckdreiecke: \\(\\frac{6 \\cdot 2}{2} = 6\\), \\(\\frac{4 \\cdot 3}{2} = 6\\), \\(\\frac{2 \\cdot 5}{2} = 5\\). $$A = 30 - 6 - 6 - 5 = 13$$" },
      { id:16, level:3, typ:"mc", frage:"Ein Viereck hat die Ecken \\(A(0|0)\\), \\(B(6|0)\\), \\(C(6|3)\\) und \\(D(0|5)\\). Wie groß ist sein Flächeninhalt?", optionen:["\\(24\\)", "\\(30\\)", "\\(18\\)", "\\(27\\)"], korrekt:0, tipp:"Zerlege in ein Rechteck und ein Dreieck oder erkenne die zwei parallelen Seiten.", loesungsweg:"\\(AD\\) und \\(BC\\) sind parallel (beide senkrecht) mit den Längen \\(5\\) und \\(3\\), Abstand \\(6\\): $$A = \\frac{(5 + 3) \\cdot 6}{2} = 24$$ Ebenso: Rechteck \\(6 \\cdot 3 = 18\\) plus Dreieck \\(\\frac{6 \\cdot 2}{2} = 6\\)." },
      { id:17, level:3, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(-2|1)\\), \\(B(4|3)\\) und \\(C(0|5)\\). Wie groß ist sein Flächeninhalt?", loesung:10, toleranz:0.05, tipp:"Umgebendes Rechteck von \\(x = -2\\) bis \\(4\\) und \\(y = 1\\) bis \\(5\\).", loesungsweg:"Rechteck \\(6 \\cdot 4 = 24\\). Eckdreiecke: \\(\\frac{6 \\cdot 2}{2} = 6\\), \\(\\frac{4 \\cdot 2}{2} = 4\\), \\(\\frac{2 \\cdot 4}{2} = 4\\). $$A = 24 - 6 - 4 - 4 = 10$$" },
      { id:18, level:3, typ:"numerisch", frage:"Ein Viereck hat die Ecken \\(A(0|0)\\), \\(B(3|-2)\\), \\(C(8|0)\\) und \\(D(3|2)\\). Wie groß ist sein Flächeninhalt?", loesung:16, toleranz:0, tipp:"Die Diagonale \\(AC\\) liegt auf der x-Achse und zerlegt das Viereck in zwei Dreiecke.", loesungsweg:"Diagonale \\(AC = 8\\). Dreieck \\(ACD\\): Höhe \\(2\\), Fläche \\(\\frac{8 \\cdot 2}{2} = 8\\). Dreieck \\(ABC\\): Höhe \\(2\\), ebenfalls \\(8\\). $$A = 8 + 8 = 16$$" },
      { id:19, level:4, typ:"numerisch", frage:"In einem Dreieck sind die Seiten \\(a = 7\\,\\text{cm}\\) und \\(b = 9\\,\\text{cm}\\) gegeben; sie schließen den Winkel \\(\\gamma = 50°\\) ein. Wie groß ist der Flächeninhalt in \\(\\text{cm}^2\\)? Runde auf zwei Dezimalen.", loesung:24.13, toleranz:0.05, tipp:"Die Höhe auf eine der beiden Seiten lässt sich mit dem Sinus des eingeschlossenen Winkels ausdrücken.", loesungsweg:"Die Höhe auf \\(a\\) ist \\(h_a = b \\cdot \\sin\\gamma\\). Damit $$A = \\frac{1}{2} \\cdot a \\cdot b \\cdot \\sin\\gamma = \\frac{1}{2} \\cdot 7 \\cdot 9 \\cdot \\sin 50° \\approx 24{,}13\\,\\text{cm}^2$$" },
      { id:20, level:4, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(0|0)\\), \\(B(b|0)\\) und \\(C(3|5)\\) und den Flächeninhalt \\(20\\). Wie groß ist \\(b\\), wenn \\(b > 0\\)?", loesung:8, toleranz:0, tipp:"Die Höhe des Dreiecks steht schon fest; nur die Grundseite ist unbekannt.", loesungsweg:"Grundseite \\(AB = b\\), Höhe \\(5\\): $$\\frac{b \\cdot 5}{2} = 20 \\quad\\Rightarrow\\quad b = 8$$ Die x-Koordinate von \\(C\\) beeinflusst die Fläche nicht." },
      { id:21, level:4, typ:"numerisch", frage:"Ein Viereck hat die Ecken \\(A(0|0)\\), \\(B(6|0)\\), \\(C(8|4)\\) und \\(D(1|4)\\). Wie groß ist sein Flächeninhalt?", loesung:26, toleranz:0, tipp:"Prüfe zuerst, ob zwei Seiten parallel sind; dann ist ein bekanntes Verfahren möglich.", loesungsweg:"\\(AB\\) (bei \\(y = 0\\)) und \\(DC\\) (bei \\(y = 4\\)) sind parallel: ein Trapez mit den Parallelseiten \\(6\\) und \\(7\\) und der Höhe \\(4\\). $$A = \\frac{(6 + 7) \\cdot 4}{2} = 26$$" },
      { id:22, level:4, typ:"numerisch", frage:"Ein Viereck hat die Ecken \\(A(0|0)\\), \\(B(6|1)\\), \\(C(5|5)\\) und \\(D(1|4)\\). Keine Seite ist achsenparallel. Wie groß ist sein Flächeninhalt?", loesung:20, toleranz:0.05, tipp:"Umgebendes Rechteck und die vier Randstücke abziehen; eines der Randstücke ist kein Dreieck.", loesungsweg:"Rechteck \\(6 \\cdot 5 = 30\\). Abzuziehen: unten \\(\\frac{6 \\cdot 1}{2} = 3\\), rechts \\(\\frac{1 \\cdot 4}{2} = 2\\), links oben das Viereck \\((0|0)\\), \\((1|4)\\), \\((5|5)\\), \\((0|5)\\) mit Fläche \\(5\\) (Dreieck \\(\\frac{1 \\cdot 5}{2} = 2{,}5\\) plus Dreieck \\(\\frac{5 \\cdot 1}{2} = 2{,}5\\)). $$A = 30 - 3 - 2 - 5 = 20$$" },
      { id:23, level:4, typ:"numerisch", frage:"In einem Dreieck sind \\(b = 10\\,\\text{cm}\\) und \\(c = 6\\,\\text{cm}\\); der von ihnen eingeschlossene Winkel \\(\\alpha\\) beträgt \\(120°\\). Wie groß ist der Flächeninhalt in \\(\\text{cm}^2\\)? Runde auf zwei Dezimalen.", loesung:25.98, toleranz:0.05, tipp:"Auch bei einem stumpfen Winkel gibt es eine Höhe; sie liegt außerhalb des Dreiecks.", loesungsweg:"Die Höhe auf \\(c\\) ist \\(h_c = b \\cdot \\sin\\alpha\\), und \\(\\sin 120° = \\sin 60°\\): $$A = \\frac{1}{2} \\cdot 10 \\cdot 6 \\cdot \\sin 120° = 30 \\cdot \\frac{\\sqrt3}{2} \\approx 25{,}98\\,\\text{cm}^2$$" },
      { id:24, level:4, typ:"mc", frage:"Ein Parallelogramm hat die Seiten \\(8\\,\\text{cm}\\) und \\(5\\,\\text{cm}\\), die den Winkel \\(30°\\) einschließen. Wie groß ist sein Flächeninhalt?", optionen:["\\(20\\,\\text{cm}^2\\)", "\\(40\\,\\text{cm}^2\\)", "\\(34{,}6\\,\\text{cm}^2\\)", "\\(10\\,\\text{cm}^2\\)"], korrekt:0, tipp:"Die Höhe auf die \\(8\\)-cm-Seite ergibt sich aus der \\(5\\)-cm-Seite und dem Winkel.", loesungsweg:"Höhe \\(h = 5 \\cdot \\sin 30° = 2{,}5\\,\\text{cm}\\): $$A = 8 \\cdot 2{,}5 = 20\\,\\text{cm}^2$$ \\(40\\) wäre das Produkt der Seiten ohne Winkel, \\(10\\) die Fläche des halben Parallelogramms (Dreieck)." },
      { id:25, level:5, typ:"numerisch", frage:"Ein Dreieck hat die Ecken \\(A(0|0)\\), \\(B(6|0)\\) und \\(C(2|y)\\) mit \\(y > 0\\). Sein Flächeninhalt beträgt \\(15\\). Bestimme \\(y\\).", loesung:5, toleranz:0, tipp:"Die Grundseite liegt fest; die gesuchte Koordinate ist die Höhe.", loesungsweg:"$$\\frac{6 \\cdot y}{2} = 15 \\quad\\Rightarrow\\quad y = 5$$" },
      { id:26, level:5, typ:"mc", frage:"Für das Dreieck \\(A(1|1)\\), \\(B(5|2)\\), \\(C(2|4)\\) rechnet jemand: Rechteck \\(4 \\cdot 3 = 12\\), abzüglich Eckdreiecke \\(\\frac{4 \\cdot 1}{2} = 2\\) und \\(\\frac{3 \\cdot 2}{2} = 3\\), also \\(A = 12 - 2 - 3 = 7\\). Was ist dazu zu sagen?", optionen:["Falsch, das dritte Eckdreieck mit \\(1{,}5\\) fehlt, richtig ist \\(5{,}5\\)", "Richtig, bei drei Ecken genügen zwei Eckdreiecke zum Abziehen", "Falsch, das Rechteck ist \\(5 \\cdot 4 = 20\\) groß, richtig ist \\(15\\)", "Falsch, die Eckdreiecke müssen addiert werden, richtig ist \\(17\\)"], korrekt:0, tipp:"Zeichne das umgebende Rechteck; wie viele Ecken des Rechtecks liegen außerhalb des Dreiecks?", loesungsweg:"Das Rechteck \\(12\\) stimmt, aber es gibt drei Eckdreiecke: zusätzlich zwischen \\(C\\) und \\(A\\) das Dreieck mit den Katheten \\(1\\) und \\(3\\), Fläche \\(1{,}5\\). $$A = 12 - 2 - 3 - 1{,}5 = 5{,}5$$" },
      { id:27, level:5, typ:"numerisch", frage:"Ein Dreieck hat den Flächeninhalt \\(18\\,\\text{cm}^2\\). Die Seite \\(a\\) ist \\(8\\,\\text{cm}\\) lang und schließt mit der Seite \\(b\\) den Winkel \\(\\gamma = 30°\\) ein. Wie lang ist \\(b\\) in cm?", loesung:9, toleranz:0.01, tipp:"Die Fläche hängt von zwei Seiten und dem eingeschlossenen Winkel ab; eine dieser Größen ist unbekannt.", loesungsweg:"$$18 = \\frac{1}{2} \\cdot 8 \\cdot b \\cdot \\sin 30° = 2b \\quad\\Rightarrow\\quad b = 9\\,\\text{cm}$$" },
      { id:28, level:5, typ:"numerisch", frage:"Ein Trapez hat die Ecken \\(A(0|0)\\), \\(B(10|0)\\), \\(C(c|4)\\) und \\(D(2|4)\\) mit \\(c > 2\\). Sein Flächeninhalt beträgt \\(32\\). Bestimme \\(c\\).", loesung:8, toleranz:0, tipp:"Die obere Parallelseite hat die Länge \\(c - 2\\).", loesungsweg:"Parallelseiten \\(10\\) und \\(c - 2\\), Höhe \\(4\\): $$\\frac{(10 + c - 2) \\cdot 4}{2} = 32 \\quad\\Rightarrow\\quad 8 + c = 16 \\quad\\Rightarrow\\quad c = 8$$" },
      { id:29, level:5, typ:"mc", frage:"In einem Dreieck sind \\(a = 6\\,\\text{cm}\\), \\(b = 8\\,\\text{cm}\\) und der Winkel \\(\\beta = 40°\\) gegeben (\\(\\beta\\) liegt der Seite \\(b\\) gegenüber). Jemand rechnet \\(A = \\frac{1}{2} \\cdot 6 \\cdot 8 \\cdot \\sin 40° \\approx 15{,}43\\,\\text{cm}^2\\). Was ist dazu zu sagen?", optionen:["Falsch, \\(\\beta\\) wird nicht von \\(a\\) und \\(b\\) eingeschlossen", "Richtig, in die Formel darf ein beliebiger Winkel des Dreiecks", "Falsch, die Formel gilt nur für rechtwinklige Dreiecke", "Falsch, es müsste \\(\\cos 40°\\) statt \\(\\sin 40°\\) stehen"], korrekt:0, tipp:"Skizziere: Zwischen welchen Seiten liegt \\(\\beta\\)?", loesungsweg:"Die Formel \\(A = \\frac12 ab\\sin\\gamma\\) verlangt den Winkel <b>zwischen</b> den beiden Seiten. \\(\\beta\\) liegt \\(b\\) gegenüber, also zwischen \\(a\\) und \\(c\\). Für die Fläche bräuchte man \\(\\gamma\\) oder die Seite \\(c\\); mit den gegebenen Stücken ist \\(15{,}43\\) nicht die Fläche." },
      { id:30, level:5, typ:"numerisch", frage:"Ein Viereck hat die Ecken \\(A(-2|0)\\), \\(B(4|-1)\\), \\(C(6|3)\\) und \\(D(0|5)\\). Wie groß ist sein Flächeninhalt?", loesung:30, toleranz:0.05, tipp:"Umgebendes Rechteck von \\(x = -2\\) bis \\(6\\) und \\(y = -1\\) bis \\(5\\); vier Eckdreiecke abziehen.", loesungsweg:"Rechteck \\(8 \\cdot 6 = 48\\). Eckdreiecke: \\(\\frac{6 \\cdot 1}{2} = 3\\), \\(\\frac{2 \\cdot 4}{2} = 4\\), \\(\\frac{6 \\cdot 2}{2} = 6\\), \\(\\frac{2 \\cdot 5}{2} = 5\\). $$A = 48 - 3 - 4 - 6 - 5 = 30$$" },
      { id:31, level:6, typ:"mc", frage:"Gegeben sind \\(A(1|1)\\), \\(B(4|3)\\) und \\(C(7|5)\\). Behauptung: „Die drei Punkte sind die Ecken eines Dreiecks.“ Stimmt das?", optionen:["Nein, die Fläche ist \\(0\\), die Punkte liegen auf einer Geraden", "Ja, das Dreieck hat den Flächeninhalt \\(3\\)", "Ja, drei verschiedene Punkte bilden immer ein Dreieck", "Nein, weil kein Punkt auf einer Koordinatenachse liegt"], korrekt:0, tipp:"Berechne die Fläche mit dem umgebenden Rechteck oder vergleiche die Steigungen von \\(AB\\) und \\(BC\\).", loesungsweg:"Rechteck \\(6 \\cdot 4 = 24\\); Eckdreiecke \\(\\frac{6 \\cdot 4}{2} = 12\\) (unter \\(AC\\)) sowie \\(\\frac{3 \\cdot 2}{2} = 3\\) und \\(\\frac{3 \\cdot 2}{2} = 3\\), dazu das Rechteck \\(3 \\cdot 2 = 6\\) über \\(B\\): \\(24 - 12 - 3 - 3 - 6 = 0\\). Ebenso: Von \\(A\\) nach \\(B\\) und von \\(B\\) nach \\(C\\) geht es jeweils \\(3\\) nach rechts und \\(2\\) nach oben, gleiche Steigung. Fläche \\(0\\) heißt: kein Dreieck." },
      { id:32, level:6, typ:"numerisch", frage:"Das Dreieck \\(A(0|0)\\), \\(B(t|0)\\), \\(C(2|6)\\) soll denselben Flächeninhalt haben wie das Rechteck mit den Ecken \\((0|0)\\), \\((4|0)\\), \\((4|3)\\), \\((0|3)\\). Bestimme \\(t > 0\\).", loesung:4, toleranz:0, tipp:"Drücke beide Flächen aus; die des Dreiecks enthält \\(t\\).", loesungsweg:"Rechteck: \\(4 \\cdot 3 = 12\\). Dreieck: Grundseite \\(t\\), Höhe \\(6\\), also \\(\\frac{6t}{2} = 3t\\). $$3t = 12 \\quad\\Rightarrow\\quad t = 4$$" },
      { id:33, level:6, typ:"numerisch", frage:"Gegeben sind \\(A(0|0)\\) und \\(B(3|2)\\). Für welchen Wert \\(x\\) hat das „Dreieck“ \\(A\\), \\(B\\), \\(C(x|4)\\) den Flächeninhalt \\(0\\)?", loesung:6, toleranz:0, tipp:"Fläche \\(0\\) bedeutet, dass \\(C\\) auf der Geraden durch \\(A\\) und \\(B\\) liegt.", loesungsweg:"Von \\(A\\) nach \\(B\\): \\(3\\) nach rechts, \\(2\\) nach oben. Um von \\(y = 0\\) auf \\(y = 4\\) zu kommen, braucht man diesen Schritt zweimal: $$x = 2 \\cdot 3 = 6$$ \\(C(6|4)\\) liegt auf der Geraden durch \\(A\\) und \\(B\\); das Dreieck ist entartet." },
      { id:34, level:6, typ:"mc", frage:"Behauptung: „Verdoppelt man alle Koordinaten der Ecken eines Dreiecks, so verdoppelt sich sein Flächeninhalt.“ Stimmt das?", optionen:["Nein, der Flächeninhalt vervierfacht sich", "Ja, denn alle Seitenlängen verdoppeln sich", "Nein, der Flächeninhalt verachtfacht sich", "Nein, er bleibt gleich, das Dreieck wird nur verschoben"], korrekt:0, tipp:"Probiere es am Dreieck \\((0|0)\\), \\((2|0)\\), \\((0|1)\\) aus.", loesungsweg:"Alle Koordinaten zu verdoppeln ist eine zentrische Streckung mit \\(k = 2\\) vom Ursprung aus. Längen wachsen mit \\(k\\), Flächen mit \\(k^2\\): $$A' = 2^2 \\cdot A = 4A$$ Beispiel: \\((0|0)\\), \\((2|0)\\), \\((0|1)\\) hat Fläche \\(1\\); \\((0|0)\\), \\((4|0)\\), \\((0|2)\\) hat Fläche \\(4\\)." },
      { id:35, level:6, typ:"numerisch", frage:"Ein gleichschenkliges Dreieck hat zwei Schenkel von je \\(6\\,\\text{cm}\\) und den Flächeninhalt \\(9\\,\\text{cm}^2\\). Wie groß ist der Winkel zwischen den Schenkeln, wenn er spitz ist? Gib ihn in Grad an.", loesung:30, toleranz:0.1, tipp:"Die Fläche hängt von den beiden Schenkeln und dem Sinus des eingeschlossenen Winkels ab; der Sinus lässt sich isolieren.", loesungsweg:"$$9 = \\frac{1}{2} \\cdot 6 \\cdot 6 \\cdot \\sin\\gamma \\quad\\Rightarrow\\quad \\sin\\gamma = \\frac{9}{18} = 0{,}5$$ Spitzer Winkel: \\(\\gamma = 30°\\). Auch \\(\\gamma = 150°\\) hätte den Sinus \\(0{,}5\\) und dieselbe Fläche; deshalb war „spitz“ vorgegeben." },
      { id:36, level:6, typ:"numerisch", frage:"Ein Viereck hat die Ecken \\(A(0|0)\\), \\(B(6|0)\\), \\(C(6|4)\\) und \\(D(2|k)\\) mit \\(k > 4\\). Sein Flächeninhalt beträgt \\(23\\). Bestimme \\(k\\).", loesung:5, toleranz:0, tipp:"Die Diagonale \\(AC\\) zerlegt das Viereck in ein festes und ein von \\(k\\) abhängiges Dreieck.", loesungsweg:"Dreieck \\(ABC\\): rechtwinklig, \\(\\frac{6 \\cdot 4}{2} = 12\\). Dreieck \\(ACD\\): mit dem umgebenden Rechteck \\(6 \\cdot k\\) minus \\(\\frac{6 \\cdot 4}{2}\\) minus \\(\\frac{4 \\cdot (k-4)}{2}\\) minus \\(\\frac{2 \\cdot k}{2}\\) ergibt \\(3k - 4\\). $$12 + 3k - 4 = 23 \\quad\\Rightarrow\\quad k = 5$$ Probe mit \\(D(2|5)\\): Rechteck \\(30\\), Abzüge \\(12\\), \\(2\\), \\(5\\), bleibt \\(11 = 3 \\cdot 5 - 4\\)." }];
