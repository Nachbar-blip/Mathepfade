<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flächenberechnung (Sinussatz &amp; Dreiecksfläche) - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-flaechenberechnung-determinante';
    const THEMA_CONFIG = { name: 'Flächenberechnung mit Trigonometrie', bereich: 'geometrie' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Flächeninhaltssatz für Dreiecke lautet …", optionen:["\\(A=\\frac{1}{2}ab\\)","\\(A=\\frac{1}{2}ab\\sin\\gamma\\)","\\(A=ab\\cos\\gamma\\)","\\(A=\\frac{1}{2}(a+b)\\)"], korrekt:1, tipp:"Zwei Seiten und eingeschlossener Winkel.", loesungsweg:"Ist der Winkel zwischen zwei Seiten bekannt, liefert \\(b\\sin\\gamma\\) genau die Höhe auf \\(a\\). Eingesetzt in \\(A = \\tfrac12 \\cdot \\text{Grundseite} \\cdot \\text{Höhe}\\) ergibt sich $$A = \\tfrac{1}{2}ab\\sin\\gamma$$ Entscheidend ist, dass \\(\\gamma\\) der von \\(a\\) und \\(b\\) <b>eingeschlossene</b> Winkel ist." },
      { id:2, level:1, typ:"mc", frage:"Sinussatz lautet …", optionen:["\\(\\frac{a}{\\sin\\alpha}=\\frac{b}{\\sin\\beta}\\)","\\(a^2=b^2+c^2\\)","\\(\\cos\\alpha=\\frac{a}{c}\\)","\\(\\sin\\alpha=\\tan\\alpha\\)"], korrekt:0, tipp:"Seite/sin(Gegenwinkel).", loesungsweg:"$$\\frac{a}{\\sin\\alpha}=\\frac{b}{\\sin\\beta}=\\frac{c}{\\sin\\gamma}$$" },
      { id:3, level:1, typ:"mc", frage:"Kosinussatz?", optionen:["\\(a^2=b^2+c^2\\)","\\(a^2=b^2+c^2-2bc\\cos\\alpha\\)","\\(a=b+c\\)","\\(a\\sin\\alpha=b\\sin\\beta\\)"], korrekt:1, tipp:"Pythagoras verallgemeinert.", loesungsweg:"$$a^2 = b^2 + c^2 - 2bc\\cos\\alpha$$ Für \\(\\alpha = 90°\\) ist \\(\\cos\\alpha = 0\\), und es bleibt der Satz des Pythagoras übrig. Der Kosinussatz ist also dessen Verallgemeinerung auf beliebige Dreiecke." },
      { id:4, level:1, typ:"numerisch", frage:"Dreieck: \\(a=6, b=8, \\gamma=90°\\). Fläche?", loesung:24, toleranz:0, tipp:"\\(\\sin 90°=1\\).", loesungsweg:"Wegen \\(\\sin 90° = 1\\): $$A = \\tfrac12 \\cdot 6 \\cdot 8 \\cdot 1 = 24$$ Bei rechtwinkligen Dreiecken sind die beiden Seiten gerade die Katheten." },
      { id:5, level:1, typ:"numerisch", frage:"Dreieck \\(a=5, b=4, \\gamma=30°\\). Fläche (2 Dez).", loesung:5, toleranz:0.05, tipp:"\\(\\sin 30°=0{,}5\\).", loesungsweg:"$$A = \\tfrac12 \\cdot 5 \\cdot 4 \\cdot \\sin 30° = 10 \\cdot 0{,}5 = 5$$" },
      { id:6, level:1, typ:"numerisch", frage:"Parallelogramm \\(a=6, b=4, \\alpha=30°\\). Fläche.", loesung:12, toleranz:0.1, tipp:"\\(A=ab\\sin\\alpha\\).", loesungsweg:"Beim Parallelogramm entfällt der Faktor \\(\\tfrac12\\), weil es aus zwei kongruenten Dreiecken besteht: $$A = ab\\sin\\alpha = 6 \\cdot 4 \\cdot 0{,}5 = 12$$" },
      { id:7, level:2, typ:"numerisch", frage:"Dreieck \\(a=10, b=7, \\gamma=60°\\). Fläche (2 Dez).", loesung:30.31, toleranz:0.1, tipp:"\\(\\sin 60°\\approx 0{,}866\\).", loesungsweg:"$$A = \\tfrac12 \\cdot 10 \\cdot 7 \\cdot \\sin 60° = 35 \\cdot 0{,}866 \\approx 30{,}31$$" },
      { id:8, level:2, typ:"numerisch", frage:"\\(a=12, b=9, \\gamma=120°\\). Fläche (2 Dez).", loesung:46.77, toleranz:0.2, tipp:"\\(\\sin 120°=\\sin 60°\\).", loesungsweg:"$$A = \\tfrac12 \\cdot 12 \\cdot 9 \\cdot \\sin 120° = 54 \\cdot 0{,}866 \\approx 46{,}77$$ Wegen \\(\\sin 120° = \\sin 60°\\) ist die Fläche dieselbe wie bei einem Winkel von \\(60°\\) — der Sinus ist symmetrisch zu \\(90°\\)." },
      { id:9, level:2, typ:"numerisch", frage:"Dreieck mit Eckpunkten \\((0,0),(4,0),(0,3)\\). Fläche.", loesung:6, toleranz:0, tipp:"Rechtwinklig.", loesungsweg:"Die Punkte bilden ein rechtwinkliges Dreieck mit den Katheten \\(4\\) und \\(3\\) auf den Achsen: $$A = \\tfrac12 \\cdot 4 \\cdot 3 = 6$$" },
      { id:10, level:2, typ:"numerisch", frage:"Sinussatz: \\(a=10, \\alpha=30°, \\beta=45°\\). Seite \\(b\\) (2 Dez).", loesung:14.14, toleranz:0.1, tipp:"\\(b=a\\sin\\beta/\\sin\\alpha\\).", loesungsweg:"\\(b=10\\cdot\\frac{\\sqrt 2/2}{0{,}5}=10\\sqrt 2\\approx 14{,}14\\)." },
      { id:11, level:2, typ:"numerisch", frage:"Kosinussatz: \\(b=5, c=7, \\alpha=60°\\). Seite \\(a\\) (2 Dez).", loesung:6.24, toleranz:0.05, tipp:"\\(a^2=25+49-70\\cdot 0{,}5\\).", loesungsweg:"$$a^2 = b^2 + c^2 - 2bc\\cos\\alpha = 25 + 49 - 2 \\cdot 35 \\cdot 0{,}5 = 74 - 35 = 39$$ $$a = \\sqrt{39} \\approx 6{,}24$$" },
      { id:12, level:2, typ:"mc", frage:"Im Dreieck mit \\(\\alpha+\\beta+\\gamma=\\)?", optionen:["90°","180°","360°","variabel"], korrekt:1, tipp:"Winkelsumme.", loesungsweg:"Die Winkelsumme im Dreieck beträgt stets \\(180°\\) — gleichgültig, wie das Dreieck aussieht. Das lässt sich zeigen, indem man durch eine Ecke eine Parallele zur Gegenseite legt: Die beiden Außenwinkel sind dann Wechselwinkel zu den anderen beiden Innenwinkeln und ergänzen sich mit dem dritten zum gestreckten Winkel." },
      { id:13, level:3, typ:"numerisch", frage:"Dreieck \\(\\alpha=50°, \\beta=60°, a=8\\). \\(b\\) (2 Dez).", loesung:9.04, toleranz:0.05, tipp:"Sinussatz.", loesungsweg:"Sinussatz: $$\\frac{a}{\\sin\\alpha} = \\frac{b}{\\sin\\beta} \\;\\Rightarrow\\; b = \\frac{a\\sin\\beta}{\\sin\\alpha} = \\frac{8 \\cdot \\sin 60°}{\\sin 50°} \\approx 9{,}04$$" },
      { id:14, level:3, typ:"numerisch", frage:"Gleiches Dreieck: \\(\\gamma=70°\\); Fläche (2 Dez).", loesung:34.00, toleranz:0.3, tipp:"\\(\\frac{1}{2}ab\\sin\\gamma\\).", loesungsweg:"Mit \\(a = 8\\), \\(b \\approx 9{,}04\\) und dem eingeschlossenen Winkel \\(\\gamma = 70°\\): $$A = \\tfrac12 \\cdot 8 \\cdot 9{,}04 \\cdot \\sin 70° \\approx 34{,}0$$" },
      { id:15, level:3, typ:"numerisch", frage:"Dreieck mit \\(a=7, b=8, c=9\\). Fläche (Heron, 2 Dez).", loesung:26.83, toleranz:0.1, tipp:"\\(s=12\\).", loesungsweg:"Heron-Formel mit dem halben Umfang \\(s = \\frac{7+8+9}{2} = 12\\): $$A = \\sqrt{s(s-a)(s-b)(s-c)} = \\sqrt{12 \\cdot 5 \\cdot 4 \\cdot 3} = \\sqrt{720} \\approx 26{,}83$$ Sie kommt ohne jeden Winkel aus — praktisch, wenn nur die drei Seiten bekannt sind." },
      { id:16, level:3, typ:"numerisch", frage:"Parallelogramm, Seiten 7 und 5, eingeschl. Winkel 40°. Fläche (2 Dez).", loesung:22.50, toleranz:0.1, tipp:"\\(ab\\sin\\alpha\\).", loesungsweg:"$$A = ab\\sin\\alpha = 7 \\cdot 5 \\cdot \\sin 40° \\approx 35 \\cdot 0{,}643 \\approx 22{,}50$$" },
      { id:17, level:3, typ:"numerisch", frage:"Dreieck mit \\(a=6, c=10, \\beta=75°\\). Fläche (2 Dez).", loesung:28.98, toleranz:0.2, tipp:"\\(\\frac{1}{2}ac\\sin\\beta\\).", loesungsweg:"\\(\\beta\\) ist der von \\(a\\) und \\(c\\) eingeschlossene Winkel: $$A = \\tfrac12 \\cdot 6 \\cdot 10 \\cdot \\sin 75° = 30 \\cdot 0{,}966 \\approx 28{,}98$$" },
      { id:18, level:3, typ:"mc", frage:"Der Flächeninhaltssatz benötigt …", optionen:["drei Seiten","zwei Winkel","zwei Seiten + eingeschlossenen Winkel","alle drei Winkel"], korrekt:2, tipp:"SWS.", loesungsweg:"Zwei Seiten + eingeschlossener Winkel." },
      { id:19, level:4, typ:"numerisch", frage:"Dreieck: \\(a=14, b=10, c=16\\). \\(\\cos\\alpha\\) (2 Dez)?", loesung:0.50, toleranz:0.02, tipp:"\\(\\cos\\alpha=\\frac{b^2+c^2-a^2}{2bc}\\).", loesungsweg:"\\(\\cos\\alpha=\\frac{b^2+c^2-a^2}{2bc}=\\frac{100+256-196}{320}=\\frac{160}{320}=0{,}50\\) (also \\(\\alpha=60°\\))." },
      { id:20, level:4, typ:"numerisch", frage:"Viereck mit Diagonalen \\(d_1=8, d_2=6\\), die sich unter 90° schneiden. Fläche?", loesung:24, toleranz:0.1, tipp:"\\(\\frac{1}{2}d_1 d_2\\).", loesungsweg:"Stehen die Diagonalen senkrecht aufeinander, zerfällt das Viereck in vier rechtwinklige Dreiecke; zusammengesetzt ergibt sich $$A = \\tfrac12 d_1 d_2 = \\tfrac12 \\cdot 8 \\cdot 6 = 24$$" },
      { id:21, level:4, typ:"numerisch", frage:"Dreieck \\(\\alpha=30°, \\beta=75°, c=10\\). Fläche (2 Dez).", loesung:25.00, toleranz:0.2, tipp:"\\(\\gamma=75°\\), Sinussatz: \\(a=c\\sin\\alpha/\\sin\\gamma\\).", loesungsweg:"\\(\\gamma=75°\\); \\(a=10\\sin 30°/\\sin 75°\\approx 5{,}18\\); \\(A=\\frac{1}{2}\\cdot a\\cdot c\\cdot\\sin\\beta=\\frac{1}{2}\\cdot 5{,}18\\cdot 10\\cdot\\sin 75°\\approx 25{,}00\\)." },
      { id:22, level:4, typ:"numerisch", frage:"Drachen: Diagonalen 10 und 14. Fläche.", loesung:70, toleranz:0.1, tipp:"\\(\\frac{1}{2}d_1d_2\\).", loesungsweg:"Beim Drachen stehen die Diagonalen stets senkrecht aufeinander: $$A = \\tfrac12 \\cdot 10 \\cdot 14 = 70$$" },
      { id:23, level:4, typ:"numerisch", frage:"Dreieck mit \\(A=12, a=6, b=8\\). \\(\\sin\\gamma\\) (2 Dez)?", loesung:0.5, toleranz:0.02, tipp:"\\(\\sin\\gamma=\\frac{2A}{ab}\\).", loesungsweg:"Die Flächenformel nach \\(\\sin\\gamma\\) umgestellt: $$\\sin\\gamma = \\frac{2A}{ab} = \\frac{24}{48} = 0{,}5$$ Daraus folgt \\(\\gamma = 30°\\) oder \\(\\gamma = 150°\\) — der Sinus allein legt den Winkel nicht eindeutig fest." },
      { id:24, level:4, typ:"mc", frage:"Es gilt stets \\(\\sin\\alpha=\\sin(180°-\\alpha)\\). Konsequenz für SSW?", optionen:["Immer eindeutig","kann 2 Lösungen haben","unlösbar","nur rechtwinklig"], korrekt:1, tipp:"Zweideutigkeit.", loesungsweg:"SSW-Fall kann zwei Dreiecke liefern." },
      { id:25, level:5, typ:"numerisch", frage:"Trapez: parallele Seiten 8 und 12, Höhe 5. Fläche.", loesung:50, toleranz:0, tipp:"\\(\\frac{(a+c)h}{2}\\).", loesungsweg:"$$A = \\frac{(a+c) \\cdot h}{2} = \\frac{(8+12) \\cdot 5}{2} = \\frac{100}{2} = 50$$" },
      { id:26, level:5, typ:"numerisch", frage:"Unregelmäßiges Viereck: zerteilt in zwei Dreiecke; \\(A_1=15, A_2=22\\). Gesamtfläche?", loesung:37, toleranz:0, tipp:"Addition.", loesungsweg:"Die Diagonale zerlegt das Viereck in zwei Dreiecke, deren Flächen sich addieren: $$15 + 22 = 37$$ Dieses Zerlegen ist das Standardverfahren für unregelmäßige Vielecke." },
      { id:27, level:5, typ:"numerisch", frage:"Dreieck \\(a=13, b=14, c=15\\). Fläche (Heron).", loesung:84, toleranz:0.5, tipp:"\\(s=21\\).", loesungsweg:"Halber Umfang: \\(s = \\frac{13+14+15}{2} = 21\\). $$A = \\sqrt{21 \\cdot 8 \\cdot 7 \\cdot 6} = \\sqrt{7056} = 84$$ Ein bemerkenswertes Dreieck: ganzzahlige Seiten und ganzzahlige Fläche." },
      { id:28, level:5, typ:"numerisch", frage:"Regelmäßiges Sechseck, Seite 4. Fläche (2 Dez).", loesung:41.57, toleranz:0.2, tipp:"\\(\\frac{3a^2\\sqrt 3}{2}\\).", loesungsweg:"Das regelmäßige Sechseck zerfällt in sechs gleichseitige Dreiecke mit der Seite \\(4\\): $$A = 6 \\cdot \\frac{4^2\\sqrt3}{4} = 24\\sqrt3 \\approx 41{,}57$$" },
      { id:29, level:5, typ:"numerisch", frage:"Fünfeck (reg.), Seite 6, Apothema 4,13. Fläche (2 Dez).", loesung:61.95, toleranz:0.3, tipp:"\\(\\frac{1}{2}\\cdot\\text{Umf}\\cdot\\text{Apothema}\\).", loesungsweg:"Jedes regelmäßige Vieleck lässt sich in Dreiecke mit der Apothema als Höhe zerlegen: $$A = \\tfrac12 \\cdot U \\cdot a_p = \\tfrac12 \\cdot (5 \\cdot 6) \\cdot 4{,}13 \\approx 61{,}95$$" },
      { id:30, level:5, typ:"mc", frage:"Kosinussatz reduziert sich auf Pythagoras bei …", optionen:["\\(\\alpha=0°\\)","\\(\\alpha=90°\\)","\\(\\alpha=180°\\)","nie"], korrekt:1, tipp:"\\(\\cos 90°=0\\).", loesungsweg:"Im Kosinussatz \\(a^2 = b^2+c^2-2bc\\cos\\alpha\\) verschwindet der letzte Term genau dann, wenn \\(\\cos\\alpha = 0\\) ist — also bei \\(\\alpha = 90°\\). Übrig bleibt \\(a^2 = b^2+c^2\\), der Satz des Pythagoras." },
      { id:31, level:6, typ:"numerisch", frage:"Grundstück-Dreieck: \\(a=40\\,\\text m, b=35\\,\\text m, \\gamma=48°\\). Fläche m² (0 Dez).", loesung:520, toleranz:3, tipp:"\\(\\frac{1}{2}ab\\sin 48°\\).", loesungsweg:"$$A = \\tfrac12 \\cdot 40 \\cdot 35 \\cdot \\sin 48° = 700 \\cdot 0{,}743 \\approx 520\\,\\text{m}^2$$" },
      { id:32, level:6, typ:"numerisch", frage:"Dreieck \\(\\alpha=35°, b=12, c=15\\). Seite \\(a\\) (2 Dez)?", loesung:8.62, toleranz:0.1, tipp:"Kosinussatz.", loesungsweg:"Hier ist \\(\\alpha\\) der von \\(b\\) und \\(c\\) eingeschlossene Winkel, der Kosinussatz also direkt anwendbar: $$a^2 = 144 + 225 - 2 \\cdot 12 \\cdot 15 \\cdot \\cos 35° \\approx 369 - 294{,}9 = 74{,}1$$ $$a \\approx \\sqrt{74{,}1} \\approx 8{,}61$$" },
      { id:33, level:6, typ:"numerisch", frage:"Umkreisradius \\(R\\) mit erweitertem Sinussatz: \\(a=10, \\alpha=30°\\). \\(R\\)?", loesung:10, toleranz:0.05, tipp:"\\(2R=a/\\sin\\alpha\\).", loesungsweg:"\\(2R=20\\Rightarrow R=10\\)." },
      { id:34, level:6, typ:"numerisch", frage:"Grundstück als Viereck ABCD; Diagonale AC=20, \\(A_{ABC}=60\\), \\(A_{ACD}=45\\). Gesamtfläche?", loesung:105, toleranz:0, tipp:"Summe.", loesungsweg:"Die Diagonale \\(AC\\) zerlegt das Viereck in die beiden Dreiecke \\(ABC\\) und \\(ACD\\): $$60 + 45 = 105$$ Die Länge der Diagonale wird dafür gar nicht gebraucht — sie steckt bereits in beiden Teilflächen." },
      { id:35, level:6, typ:"numerisch", frage:"Dreieck mit \\(a=b=c=6\\). Fläche (2 Dez).", loesung:15.59, toleranz:0.05, tipp:"\\(\\frac{a^2\\sqrt 3}{4}\\).", loesungsweg:"Für das gleichseitige Dreieck gilt $$A = \\frac{a^2\\sqrt3}{4} = \\frac{36\\sqrt3}{4} = 9\\sqrt3 \\approx 15{,}59$$" },
      { id:36, level:6, typ:"numerisch", frage:"Kreissektor, \\(r=5\\), Zentriwinkel 72°. Fläche (2 Dez).", loesung:15.71, toleranz:0.1, tipp:"\\(\\frac{\\varphi}{360°}\\pi r^2\\).", loesungsweg:"Der Sektor ist der entsprechende Bruchteil des Vollkreises: $$A = \\frac{\\varphi}{360°} \\cdot \\pi r^2 = \\frac{72}{360} \\cdot 25\\pi = 5\\pi \\approx 15{,}71$$ Ein Fünftel des Kreises, denn \\(72°\\) ist ein Fünftel von \\(360°\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
