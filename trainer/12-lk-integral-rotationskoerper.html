<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-lk-integral-rotationskoerper';
    const THEMA_CONFIG = { name: 'Rotationskörper (eA)', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Formel & Grundverständnis ==========
      { id:1, level:1, typ:"mc", frage:"Welche Formel beschreibt das Volumen eines Rotationskörpers um die x-Achse?", optionen:["\\(V=\\pi\\int_a^b f(x)\\,dx\\)","\\(V=\\pi\\int_a^b (f(x))^2\\,dx\\)","\\(V=\\int_a^b f(x)\\,dx\\)","\\(V=2\\pi\\int_a^b f(x)\\,dx\\)"], korrekt:1, tipp:"Kreisscheibenmethode.", loesungsweg:"Man zerlegt den Körper in dünne Kreisscheiben senkrecht zur Drehachse. Eine Scheibe an der Stelle \\(x\\) hat den Radius \\(f(x)\\), also die Fläche \\(\\pi f(x)^2\\) und das Volumen \\(\\pi f(x)^2\\,dx\\). Aufsummiert: $$V = \\pi\\int_a^b \\left[f(x)\\right]^2 dx$$ Das Quadrat ist entscheidend — es stammt aus der Kreisflächenformel und darf nicht fehlen." },
      { id:2, level:1, typ:"mc", frage:"Was ist die Rotationsachse in der Standardformel?", optionen:["y-Achse","x-Achse","Winkelhalbierende","Ursprungsgerade"], korrekt:1, tipp:"Standardfall.", loesungsweg:"Standard: Rotation um die x-Achse." },
      { id:3, level:1, typ:"mc", frage:"Warum \\((f(x))^2\\) im Integranden?", optionen:["Weil jeder Kreis-Querschnitt Fläche \\(\\pi r^2\\) hat","Zufall","Wegen Symmetrie","Wegen Ableitung"], korrekt:0, tipp:"Kreisfläche.", loesungsweg:"Kreisfläche mit Radius \\(f(x)\\) ist \\(\\pi f(x)^2\\)." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=2\\) auf \\([0;3]\\). Volumen bei Rotation um x-Achse (ohne \\(\\pi\\))?", loesung:12, toleranz:0, tipp:"\\(\\int_0^3 4\\,dx\\).", loesungsweg:"Der Körper ist ein Zylinder mit Radius \\(2\\) und Länge \\(3\\): $$\\frac{V}{\\pi} = \\int_0^3 2^2\\,dx = 4 \\cdot 3 = 12$$ Probe mit der Zylinderformel: \\(V = \\pi r^2 h = \\pi \\cdot 4 \\cdot 3\\) ✓" },
      { id:5, level:1, typ:"mc", frage:"Rotation um die y-Achse — welche Formel?", optionen:["\\(V=\\pi\\int_c^d [g(y)]^2\\,dy\\)","\\(V=\\pi\\int [f(x)]^2\\,dx\\)","\\(V=\\int g(y)\\,dy\\)","keine"], korrekt:0, tipp:"Umkehrfunktion.", loesungsweg:"\\(V = \\pi\\int_c^d [g(y)]^2\\,dy\\) mit \\(g\\) = Umkehrfkt." },
      { id:6, level:1, typ:"mc", frage:"Ein Zylinder entsteht durch Rotation von \\(f(x)=r\\) auf \\([0;h]\\). Volumen?", optionen:["\\(\\pi r h\\)","\\(\\pi r^2 h\\)","\\(r^2 h\\)","\\(2\\pi r h\\)"], korrekt:1, tipp:"Klassisch.", loesungsweg:"\\(V=\\pi r^2 h\\) — übereinstimmend mit der Formel." },
      // ========== LEVEL 2 — einfache Rotation ==========
      { id:7, level:2, typ:"numerisch", frage:"\\(f(x)=x\\) auf \\([0;2]\\). \\(V/\\pi\\)?", loesung:2.67, toleranz:0.05, tipp:"Setze den Term quadriert in das Integral ein und wende die Potenzregel an.", loesungsweg:"$$\\frac{V}{\\pi} = \\int_0^2 x^2\\,dx = \\left[\\frac{x^3}{3}\\right]_0^2 = \\frac83 \\approx 2{,}67$$ Der Körper ist ein Kegel mit Radius \\(2\\) und Höhe \\(2\\). Probe: \\(\\tfrac13 r^2 h = \\tfrac13 \\cdot 4 \\cdot 2 = \\tfrac83\\) ✓" },
      { id:8, level:2, typ:"numerisch", frage:"\\(f(x)=\\sqrt{x}\\) auf \\([0;4]\\). \\(V/\\pi\\)?", loesung:8, toleranz:0.01, tipp:"\\(\\int_0^4 x\\,dx\\).", loesungsweg:"\\(V/\\pi = \\tfrac{1}{2}\\cdot 16 = 8\\)." },
      { id:9, level:2, typ:"numerisch", frage:"\\(f(x)=x^2\\) auf \\([0;1]\\). \\(V/\\pi\\)?", loesung:0.2, toleranz:0.01, tipp:"Beim Quadrieren einer Potenz werden die Exponenten multipliziert, nicht addiert.", loesungsweg:"$$\\frac{V}{\\pi} = \\int_0^1 \\left(x^2\\right)^2 dx = \\int_0^1 x^4\\,dx = \\left[\\frac{x^5}{5}\\right]_0^1 = 0{,}2$$ Beim Quadrieren verdoppelt sich der Exponent — \\(x^2\\) wird zu \\(x^4\\), nicht zu \\(x^3\\)." },
      { id:10, level:2, typ:"numerisch", frage:"\\(f(x)=2x\\) auf \\([0;3]\\). \\(V/\\pi\\)?", loesung:36, toleranz:0.1, tipp:"\\(\\int_0^3 4x^2\\,dx\\).", loesungsweg:"$$\\frac{V}{\\pi} = \\int_0^3 (2x)^2 dx = \\int_0^3 4x^2\\,dx = 4 \\cdot \\frac{27}{3} = 36$$ Der Faktor \\(2\\) wird mitquadriert und ergibt \\(4\\) — ein häufig übersehener Schritt." },
      { id:11, level:2, typ:"numerisch", frage:"\\(f(x)=1+x\\) auf \\([0;1]\\). \\(V/\\pi\\)?", loesung:2.33, toleranz:0.05, tipp:"\\(\\int_0^1 (1+x)^2\\,dx\\).", loesungsweg:"\\(\\int_0^1 (1+2x+x^2)\\,dx = 1+1+\\tfrac{1}{3} = \\tfrac{7}{3}\\)." },
      { id:12, level:2, typ:"numerisch", frage:"\\(f(x)=x^3\\) auf \\([0;1]\\). \\(V/\\pi\\) (3 Dez.)?", loesung:0.143, toleranz:0.005, tipp:"Erst quadrieren, dann aufleiten — der Exponent im Integranden ist doppelt so groß wie der von \\(f\\).", loesungsweg:"$$\\frac{V}{\\pi} = \\int_0^1 x^6\\,dx = \\left[\\frac{x^7}{7}\\right]_0^1 = \\frac17 \\approx 0{,}143$$" },
      // ========== LEVEL 3 — Halbkugel, Kegel ==========
      { id:13, level:3, typ:"numerisch", frage:"Kugel mit Radius 1: Rotation von \\(\\sqrt{1-x^2}\\) auf \\([-1;1]\\). \\(V/\\pi\\) (2 Dez.)?", loesung:1.33, toleranz:0.02, tipp:"\\(\\int_{-1}^{1}(1-x^2)\\,dx = \\tfrac{4}{3}\\).", loesungsweg:"\\(V = \\pi\\cdot\\tfrac{4}{3}\\): Kugelvolumen mit \\(r=1\\)." },
      { id:14, level:3, typ:"numerisch", frage:"Der Graph von \\(f(x)=x+2\\) rotiert über \\([0;2]\\) um die \\(x\\)-Achse. Berechne \\(V/\\pi\\) (auf drei Nachkommastellen).", loesung:18.667, toleranz:0.05, tipp:"Setze den Term quadriert in das Integral ein; die Klammer lässt sich als Ganzes aufleiten, wenn die innere Ableitung berücksichtigt wird.", loesungsweg:"$$\\frac{V}{\\pi} = \\int_0^2 (x+2)^2\\,dx = \\left[\\frac{(x+2)^3}{3}\\right]_0^2$$ Die innere Ableitung ist \\(1\\), es muss also nichts ausgeglichen werden. $$= \\frac{4^3 - 2^3}{3} = \\frac{64-8}{3} = \\frac{56}{3} \\approx 18{,}667$$ Es entsteht ein Kegelstumpf mit den Radien \\(2\\) und \\(4\\)." },
      { id:15, level:3, typ:"numerisch", frage:"Kegel: \\(f(x)=x\\) auf \\([0;h]\\) mit \\(h=3\\). \\(V/\\pi\\)?", loesung:9, toleranz:0.01, tipp:"\\(\\tfrac{1}{3}h^3\\).", loesungsweg:"\\(V/\\pi = \\tfrac{27}{3}=9\\)." },
      { id:16, level:3, typ:"numerisch", frage:"Der Graph von \\(f(x)=\\tfrac{1}{x}\\) rotiert über \\([1;2]\\) um die \\(x\\)-Achse. Berechne \\(V/\\pi\\).", loesung:0.5, toleranz:0.01, tipp:"Schreibe den quadrierten Term als Potenz mit negativem Exponenten; dann greift die Potenzregel.", loesungsweg:"Quadrieren ergibt \\(\\tfrac{1}{x^2} = x^{-2}\\). Die Potenzregel erhöht den Exponenten auf \\(-1\\) und teilt durch diesen: $$\\frac{V}{\\pi} = \\int_1^2 x^{-2}\\,dx = \\left[-\\frac{1}{x}\\right]_1^2 = -\\frac12 + 1 = \\frac12$$ Für den Exponenten \\(-1\\) wäre die Potenzregel nicht anwendbar — hier steht aber \\(-2\\), alles ist in Ordnung." },
      { id:17, level:3, typ:"mc", frage:"Welche Funktion liefert bei Rotation eine Kugel mit Radius \\(R\\)?", optionen:["\\(f(x)=R\\)","\\(f(x)=\\sqrt{R^2-x^2}\\) auf \\([-R;R]\\)","\\(f(x)=R^2-x^2\\)","\\(f(x)=Rx\\)"], korrekt:1, tipp:"Kreisgleichung.", loesungsweg:"\\(y=\\sqrt{R^2-x^2}\\) ist der obere Halbkreis." },
      { id:18, level:3, typ:"numerisch", frage:"\\(f(x)=\\sqrt{x}\\) auf \\([1;4]\\). \\(V/\\pi\\)?", loesung:7.5, toleranz:0.02, tipp:"\\(\\int_1^4 x\\,dx\\).", loesungsweg:"Das Quadrat hebt die Wurzel auf, das Integral wird dadurch elementar: $$\\frac{V}{\\pi} = \\int_1^4 \\left(\\sqrt x\\right)^2 dx = \\int_1^4 x\\,dx = \\left[\\frac{x^2}{2}\\right]_1^4 = \\frac{16-1}{2} = 7{,}5$$" },
      // ========== LEVEL 4 — schwierigere Funktionen ==========
      { id:19, level:4, typ:"numerisch", frage:"Ein Sektkelch hat die Innenform des Rotationskörpers, der bei Drehung des Graphen von \\(f(x)=\\sqrt{x}\\) über \\([0;6]\\) um die \\(x\\)-Achse entsteht (Angaben in Zentimetern). Wie viele Kubikzentimeter fasst er? (auf eine Nachkommastelle)", loesung:56.5, toleranz:0.5, tipp:"Hier ist das Volumen mit dem Faktor \\(\\pi\\) gefragt, nicht \\(V/\\pi\\). Das Quadrat der Wurzel vereinfacht den Integranden.", loesungsweg:"Quadrieren ergibt \\(\\left(\\sqrt{x}\\right)^2 = x\\): $$V = \\pi\\int_0^6 x\\,dx = \\pi\\left[\\frac{x^2}{2}\\right]_0^6 = 18\\pi$$ $$18\\pi \\approx 56{,}5$$ Der Kelch fasst also rund 56,5 Kubikzentimeter, das sind gut 56 Milliliter. Wer den Faktor \\(\\pi\\) vergisst, erhält nur \\(18\\) — ein Drittel des richtigen Wertes." },
      { id:20, level:4, typ:"numerisch", frage:"Der Graph von \\(f(x)=e^{x}\\) rotiert über \\([0;1]\\) um die \\(x\\)-Achse. Berechne \\(V/\\pi\\) (auf drei Nachkommastellen).", loesung:3.195, toleranz:0.02, tipp:"Achte darauf, was beim Quadrieren einer Potenz mit dem Exponenten geschieht.", loesungsweg:"Quadrieren verdoppelt den Exponenten: \\(\\left(e^{x}\\right)^2 = e^{2x}\\). Beim Aufleiten wird durch die innere Ableitung \\(2\\) geteilt: $$\\frac{V}{\\pi} = \\int_0^1 e^{2x}dx = \\left[\\tfrac12 e^{2x}\\right]_0^1 = \\frac{e^2-1}{2} \\approx 3{,}195$$ Wer \\(e^{x}\\) stehen lässt, erhält \\(e-1 \\approx 1{,}72\\) und damit einen viel zu kleinen Wert." },
      { id:21, level:4, typ:"numerisch", frage:"Der Graph von \\(f(x)=\\sin x\\) rotiert über \\([0;\\pi]\\) um die \\(x\\)-Achse. Berechne \\(V/\\pi\\) (auf drei Nachkommastellen).", loesung:1.571, toleranz:0.02, tipp:"Das Quadrat des Sinus lässt sich ohne die Formel \\(\\sin^2 x + \\cos^2 x = 1\\) nicht aufleiten; es hilft eine Formel, die \\(\\sin^2\\) durch einen Kosinus mit doppeltem Argument ausdrückt.", loesungsweg:"Mit \\(\\sin^2 x = \\tfrac12\\left(1-\\cos(2x)\\right)\\) wird der Integrand aufleitbar: $$\\frac{V}{\\pi} = \\int_0^{\\pi}\\sin^2 x\\,dx = \\frac12\\int_0^{\\pi}\\left(1-\\cos(2x)\\right)dx$$ $$= \\frac12\\left[x - \\tfrac12\\sin(2x)\\right]_0^{\\pi} = \\frac12\\left(\\pi - 0\\right) = \\frac{\\pi}{2} \\approx 1{,}571$$ Der Sinusanteil fällt weg, weil \\(\\sin(2\\pi)=\\sin 0 = 0\\) ist." },
      { id:22, level:4, typ:"numerisch", frage:"Der Graph von \\(f(x)=\\sqrt{x}+1\\) rotiert über \\([0;4]\\) um die \\(x\\)-Achse. Berechne \\(V/\\pi\\) (auf drei Nachkommastellen).", loesung:22.667, toleranz:0.05, tipp:"Das Quadrat einer Summe ist nicht die Summe der Quadrate — multipliziere den Klammerausdruck zuerst aus.", loesungsweg:"Ausmultiplizieren mit der ersten binomischen Formel: $$\\left(\\sqrt{x}+1\\right)^2 = x + 2\\sqrt{x} + 1$$ Der mittlere Summand wird in Potenzschreibweise aufgeleitet: $$\\frac{V}{\\pi} = \\int_0^4\\left(x + 2x^{1/2} + 1\\right)dx = \\left[\\frac{x^2}{2} + \\frac{4}{3}x^{3/2} + x\\right]_0^4$$ $$= 8 + \\frac{4}{3}\\cdot 8 + 4 = 8 + \\frac{32}{3} + 4 \\approx 22{,}667$$ Wer den gemischten Summanden vergisst, erhält nur \\(12\\)." },
      { id:23, level:4, typ:"numerisch", frage:"Der Graph von \\(f(x)=x\\) rotiert über \\([0;b]\\) um die \\(x\\)-Achse. Für welches \\(b>0\\) gilt \\(V/\\pi = 72\\)?", loesung:6, toleranz:0.05, tipp:"Integriere mit der oberen Grenze als Variable; es entsteht eine Gleichung dritten Grades, die sich durch Ziehen einer Wurzel lösen lässt.", loesungsweg:"Mit \\(b\\) als oberer Grenze: $$\\frac{V}{\\pi} = \\int_0^b x^2\\,dx = \\left[\\frac{x^3}{3}\\right]_0^b = \\frac{b^3}{3}$$ Gleichsetzen: $$\\frac{b^3}{3} = 72 \\;\\Longrightarrow\\; b^3 = 216 \\;\\Longrightarrow\\; b = 6$$ Probe über die Kegelformel: Radius \\(f(6)=6\\), Höhe \\(6\\), also \\(\\tfrac13\\pi\\cdot 36\\cdot 6 = 72\\pi\\)." },
      { id:24, level:4, typ:"numerisch", frage:"Der Graph von \\(f(x)=x^2-2x\\) rotiert über \\([0;2]\\) um die \\(x\\)-Achse. Berechne \\(V/\\pi\\) (auf drei Nachkommastellen).", loesung:1.067, toleranz:0.02, tipp:"Der Graph liegt über dem Intervall unterhalb der Achse — das stört nicht, denn im Integranden steht ein Quadrat. Multipliziere dieses zuerst aus.", loesungsweg:"Ausmultiplizieren: $$\\left(x^2-2x\\right)^2 = x^4 - 4x^3 + 4x^2$$ Das Quadrat macht den Integranden überall nichtnegativ; die Lage des Graphen zur Achse spielt für das Volumen keine Rolle, nur der Abstand zählt als Radius. $$\\frac{V}{\\pi} = \\left[\\frac{x^5}{5} - x^4 + \\frac{4x^3}{3}\\right]_0^2 = 6{,}4 - 16 + \\frac{32}{3} \\approx 1{,}067$$" },
      // ========== LEVEL 5 — Umkehraufgaben, Differenzkörper, Fehler finden ==========
      { id:25, level:5, typ:"mc", frage:"Für den Rotationskörper von \\(f(x)=x+1\\) auf \\([0;2]\\) um die \\(x\\)-Achse wurde gerechnet: \\(V=\\pi\\int_0^2 (x+1)\\,dx = 4\\pi\\). Wie ist das zu beurteilen?", optionen:["Richtig, die Formel ist korrekt angewendet.","Falsch: richtig ist \\(\\tfrac{26}{3}\\pi\\), das Quadrat fehlt.","Falsch: richtig ist \\(2\\pi\\), es fehlt der Faktor \\(\\tfrac12\\).","Falsch: richtig ist \\(8\\pi\\), die Grenzen sind falsch."], korrekt:1, tipp:"Vergleiche den Integranden mit der Kreisscheibenformel: Welche Größe steht dort im Integral?", loesungsweg:"Der Integrand ist falsch: eine Kreisscheibe an der Stelle \\(x\\) hat den Radius \\(f(x)\\) und die Fläche \\(\\pi f(x)^2\\) — das Quadrat gehört also unbedingt dazu. Richtig: $$V = \\pi\\int_0^2 (x+1)^2\\,dx = \\pi\\left[\\frac{(x+1)^3}{3}\\right]_0^2 = \\pi\\cdot\\frac{27-1}{3} = \\frac{26}{3}\\pi$$ Das sind rund \\(8{,}67\\pi\\) statt \\(4\\pi\\); die vorgelegte Rechnung liefert also auch zahlenmäßig etwas anderes. Ohne Quadrat hätte man kein Volumen, sondern den Flächeninhalt unter dem Graphen berechnet." },
      { id:26, level:5, typ:"numerisch", frage:"Der Graph von \\(f(x)=\\sqrt{x+1}\\) rotiert über \\([0;b]\\) um die \\(x\\)-Achse. Für welches \\(b>0\\) hat der Körper das Volumen \\(12\\pi\\)?", loesung:4, toleranz:0.05, tipp:"Stelle \\(V/\\pi\\) zuerst als Term mit der oberen Grenze als Variable auf und löse die entstehende Gleichung.", loesungsweg:"Wegen \\(\\left(\\sqrt{x+1}\\right)^2 = x+1\\) verschwindet die Wurzel im Integranden: $$\\frac{V}{\\pi} = \\int_0^b (x+1)\\,dx = \\left[\\frac{x^2}{2}+x\\right]_0^b = \\frac{b^2}{2}+b$$ Gleichsetzen: $$\\frac{b^2}{2}+b = 12 \\;\\Longrightarrow\\; b^2+2b-24 = 0$$ mit den Lösungen \\(b=4\\) und \\(b=-6\\); wegen \\(b>0\\) bleibt \\(b=4\\). Das Quadrieren der Wurzel vor dem Integrieren spart hier den ganzen Rechenaufwand." },
      { id:27, level:5, typ:"numerisch", frage:"Der Graph von \\(f(x)=a\\cdot x\\) mit \\(a>0\\) rotiert über \\([0;2]\\) um die \\(x\\)-Achse; es entsteht ein Kegel mit dem Volumen \\(24\\pi\\). Bestimme \\(a\\).", loesung:3, toleranz:0.02, tipp:"Der Parameter steht im Integranden im Quadrat und darf als konstanter Faktor vor das Integral gezogen werden.", loesungsweg:"Der Parameter wird mitquadriert und vorgezogen: $$\\frac{V}{\\pi} = \\int_0^2 (ax)^2\\,dx = a^2\\int_0^2 x^2\\,dx = a^2\\cdot\\frac{8}{3}$$ Gleichsetzen mit \\(24\\): $$a^2\\cdot\\frac{8}{3} = 24 \\;\\Longrightarrow\\; a^2 = 9 \\;\\Longrightarrow\\; a = 3$$ (die negative Lösung entfällt wegen \\(a>0\\)). Probe über die Kegelformel: Radius \\(f(2)=6\\), Höhe \\(2\\), also \\(\\tfrac13\\pi\\cdot 36\\cdot 2 = 24\\pi\\)." },
      { id:28, level:5, typ:"mc", frage:"Zwischen dem äußeren Rand \\(f(x)=3\\) und dem inneren Rand \\(g(x)=x^2\\) entsteht auf \\([0;1]\\) ein Hohlkörper. Gerechnet wurde \\(V/\\pi = \\int_0^1 (3-x^2)^2\\,dx = 7{,}2\\). Wie ist das zu beurteilen?", optionen:["Richtig, die Differenz der Radien ist zu quadrieren.","Falsch: richtig ist \\(8{,}8\\), die Quadrate sind zu subtrahieren.","Falsch: richtig ist \\(6{,}0\\), der innere Rand entfällt.","Falsch: richtig ist \\(3{,}6\\), das Ergebnis ist zu halbieren."], korrekt:1, tipp:"Überlege am Querschnitt: Von welcher Kreisfläche wird welche abgezogen — und was steht in der Kreisflächenformel im Quadrat?", loesungsweg:"Der Querschnitt ist ein Kreisring. Sein Inhalt ist die Differenz <b>zweier Kreisflächen</b>, nicht die Fläche eines Kreises mit der Radiendifferenz: $$\\pi f(x)^2 - \\pi g(x)^2 \\ne \\pi\\left(f(x)-g(x)\\right)^2$$ Richtig ist daher $$\\frac{V}{\\pi} = \\int_0^1 \\left(9 - x^4\\right)dx = \\left[9x-\\frac{x^5}{5}\\right]_0^1 = 9 - 0{,}2 = 8{,}8$$ Die vorgelegte Rechnung ergibt \\(\\int_0^1 (9-6x^2+x^4)dx = 7{,}2\\) — ein zu kleiner Wert, weil dort ein Mischglied auftaucht, das gar nicht hingehört." },
      { id:29, level:5, typ:"numerisch", frage:"Der Graph von \\(f(x)=\\tfrac{1}{x}\\) rotiert über \\([1;a]\\) um die \\(x\\)-Achse. Für welches \\(a>1\\) hat der Körper das Volumen \\(0{,}75\\pi\\)?", loesung:4, toleranz:0.02, tipp:"Schreibe den quadrierten Term als Potenz mit negativem Exponenten; die obere Grenze bleibt dabei als Variable stehen.", loesungsweg:"Quadrieren ergibt \\(\\tfrac{1}{x^2} = x^{-2}\\); die Potenzregel liefert die Stammfunktion \\(-x^{-1}\\): $$\\frac{V}{\\pi} = \\int_1^a x^{-2}\\,dx = \\left[-\\frac{1}{x}\\right]_1^a = 1 - \\frac{1}{a}$$ Gleichsetzen: $$1 - \\frac{1}{a} = 0{,}75 \\;\\Longrightarrow\\; \\frac{1}{a} = 0{,}25 \\;\\Longrightarrow\\; a = 4$$ Der Term \\(1-\\tfrac1a\\) bleibt stets unter \\(1\\) — ein Volumen von \\(\\pi\\) oder mehr ist auf diesem Weg gar nicht erreichbar." },
      { id:30, level:5, typ:"numerisch", frage:"Die Graphen von \\(f(x)=\\sqrt{x}\\) und \\(g(x)=\\tfrac{x}{2}\\) schließen eine Fläche ein; diese rotiert um die \\(x\\)-Achse. Berechne \\(V/\\pi\\) (auf drei Nachkommastellen).", loesung:2.667, toleranz:0.02, tipp:"Die Integrationsgrenzen sind nicht angegeben — sie ergeben sich aus den Schnittstellen der beiden Graphen; danach ist zu klären, welcher Rand außen liegt.", loesungsweg:"<b>Schnittstellen:</b> \\(\\sqrt{x} = \\tfrac{x}{2}\\) liefert nach Quadrieren \\(x = \\tfrac{x^2}{4}\\), also \\(x=0\\) und \\(x=4\\). <b>Lage:</b> bei \\(x=1\\) ist \\(\\sqrt{1}=1\\) und \\(\\tfrac12\\); die Wurzelfunktion bildet den äußeren Rand. <b>Volumen:</b> $$\\frac{V}{\\pi} = \\int_0^4\\left(x - \\frac{x^2}{4}\\right)dx = \\left[\\frac{x^2}{2}-\\frac{x^3}{12}\\right]_0^4$$ $$= 8 - \\frac{64}{12} = 8 - \\frac{16}{3} = \\frac{8}{3} \\approx 2{,}667$$" },
      // ========== LEVEL 6 — Abi-Format eA: Nachweis, Sachkontext, Vergleich ==========
      { id:31, level:6, typ:"numerisch", frage:"Ein Maschinenteil entsteht durch Rotation des Graphen von \\(f(x)=0{,}5x+1\\) über \\([0;4]\\) um die \\(x\\)-Achse (Angaben in Zentimetern). Zeigen Sie, dass es sich um einen Kegelstumpf mit den Radien 1 cm und 3 cm handelt, und berechnen Sie sein Volumen in Kubikzentimetern (auf zwei Nachkommastellen).", loesung:54.45, toleranz:0.3, tipp:"Der Rand ist eine Gerade; die Radien an den beiden Rändern liest man aus den Funktionswerten ab. Für das Volumen genügt die Kreisscheibenformel.", loesungsweg:"<b>Form:</b> \\(f\\) ist eine lineare Funktion, der Mantel also gerade; ein solcher Körper ist ein Kegelstumpf. Die Radien sind \\(f(0)=1\\) und \\(f(4)=3\\). <b>Volumen:</b> $$V = \\pi\\int_0^4 (0{,}5x+1)^2\\,dx = \\pi\\left[\\frac{(0{,}5x+1)^3}{1{,}5}\\right]_0^4$$ Der Nenner \\(1{,}5\\) entsteht aus \\(3\\cdot 0{,}5\\) — Exponent und innere Ableitung zusammen. $$= \\pi\\cdot\\frac{27-1}{1{,}5} = \\pi\\cdot\\frac{52}{3} \\approx 54{,}45$$ Das Teil fasst also rund 54,45 Kubikzentimeter." },
      { id:32, level:6, typ:"mc", frage:"Beurteilen Sie: „Verdoppelt man alle Funktionswerte von \\(f\\), so verdoppelt sich auch das Volumen des zugehörigen Rotationskörpers.“", optionen:["Zutreffend, das Volumen hängt linear von \\(f\\) ab.","Widerlegt: das Volumen vervierfacht sich.","Widerlegt: das Volumen verachtfacht sich.","Nur bei linearen Funktionen zutreffend."], korrekt:1, tipp:"Setzen Sie \\(2f(x)\\) in die Volumenformel ein und achten Sie darauf, was mit dem konstanten Faktor beim Quadrieren geschieht.", loesungsweg:"Die Aussage trifft nicht zu. Einsetzen in die Formel: $$V_{\\text{neu}} = \\pi\\int_a^b \\left(2f(x)\\right)^2 dx = \\pi\\int_a^b 4f(x)^2\\,dx = 4V$$ Der Faktor \\(2\\) wird mitquadriert, das Volumen <b>vervierfacht</b> sich also. Anschaulich: verdoppelt man nur die Radien und lässt die Länge gleich, so wächst jede Querschnittsfläche auf das Vierfache. Erst wenn zusätzlich das Intervall doppelt so lang wäre, ergäbe sich das Achtfache." },
      { id:33, level:6, typ:"numerisch", frage:"Ein Behälter entsteht, wenn die Fläche zwischen dem Graphen von \\(f(x)=x^2\\) für \\(0 \\le x \\le 3\\), der \\(y\\)-Achse und der Geraden \\(y=9\\) um die \\(y\\)-Achse rotiert. Zeigen Sie, dass der Radius in der Höhe \\(y\\) gleich \\(\\sqrt{y}\\) ist, und berechnen Sie \\(V/\\pi\\).", loesung:40.5, toleranz:0.1, tipp:"Bei Rotation um die \\(y\\)-Achse wird nach \\(y\\) integriert; dazu ist die Funktionsgleichung nach \\(x\\) umzustellen, und die Grenzen sind die \\(y\\)-Werte.", loesungsweg:"<b>Radius:</b> Umstellen von \\(y = x^2\\) nach \\(x\\) ergibt für \\(x \\ge 0\\) gerade \\(x = \\sqrt{y}\\); das ist der Abstand von der Drehachse, also der Radius in der Höhe \\(y\\). <b>Grenzen:</b> \\(x=0\\) gehört zu \\(y=0\\), \\(x=3\\) zu \\(y=9\\). <b>Volumen:</b> $$\\frac{V}{\\pi} = \\int_0^9 \\left(\\sqrt{y}\\right)^2 dy = \\int_0^9 y\\,dy = \\left[\\frac{y^2}{2}\\right]_0^9 = 40{,}5$$ Wer versehentlich nach \\(x\\) integriert, berechnet den ganz anderen Körper, der bei Drehung um die \\(x\\)-Achse entsteht." },
      { id:34, level:6, typ:"numerisch", frage:"Die Graphen von \\(f(x)=2x\\) und \\(g(x)=x^2\\) schließen eine Fläche ein. Bestimmen Sie die Schnittstellen und berechnen Sie \\(V/\\pi\\) für den Körper, der bei Rotation dieser Fläche um die \\(x\\)-Achse entsteht (auf drei Nachkommastellen).", loesung:4.267, toleranz:0.02, tipp:"Zuerst die Schnittstellen bestimmen; der Körper ist ein Hohlkörper, bei dem die Quadrate der beiden Ränder voneinander abzuziehen sind.", loesungsweg:"<b>Schnittstellen:</b> \\(2x = x^2\\) ergibt \\(x(x-2)=0\\), also \\(0\\) und \\(2\\). <b>Lage:</b> bei \\(x=1\\) ist \\(2 > 1\\); die Gerade bildet den äußeren Rand. <b>Volumen:</b> $$\\frac{V}{\\pi} = \\int_0^2\\left((2x)^2 - \\left(x^2\\right)^2\\right)dx = \\int_0^2\\left(4x^2 - x^4\\right)dx$$ $$= \\left[\\frac{4x^3}{3} - \\frac{x^5}{5}\\right]_0^2 = \\frac{32}{3} - \\frac{32}{5} = \\frac{64}{15} \\approx 4{,}267$$ Beide Ränder werden getrennt quadriert — die Differenz der Funktionen darf nicht zuerst gebildet werden." },
      { id:35, level:6, typ:"numerisch", frage:"Gegeben ist die Schar \\(f_a(x)=a\\cdot e^{-x}\\) mit \\(a>0\\). Der Graph rotiert über \\([0;1]\\) um die \\(x\\)-Achse. Zeigen Sie, dass \\(\\frac{V}{\\pi}=\\frac{a^2}{2}\\left(1-e^{-2}\\right)\\) gilt, und bestimmen Sie \\(a\\) so, dass \\(V/\\pi = 8\\) wird (auf zwei Nachkommastellen).", loesung:4.3, toleranz:0.05, tipp:"Quadrieren Sie den Term zuerst — beim Quadrieren einer e-Funktion verdoppelt sich der Exponent, und der Parameter wird zum konstanten Faktor.", loesungsweg:"<b>Nachweis:</b> Quadrieren ergibt \\(\\left(ae^{-x}\\right)^2 = a^2 e^{-2x}\\), der Parameter darf vorgezogen werden: $$\\frac{V}{\\pi} = a^2\\int_0^1 e^{-2x}dx = a^2\\left[-\\tfrac12 e^{-2x}\\right]_0^1 = \\frac{a^2}{2}\\left(1-e^{-2}\\right)$$ <b>Parameter:</b> mit \\(1-e^{-2}\\approx 0{,}8647\\) folgt $$\\frac{a^2}{2}\\cdot 0{,}8647 = 8 \\;\\Longrightarrow\\; a^2 \\approx 18{,}50 \\;\\Longrightarrow\\; a \\approx 4{,}30$$ Der Exponent verdoppelt sich beim Quadrieren — wer \\(e^{-x}\\) stehen lässt, erhält einen deutlich zu großen Wert." },
      { id:36, level:6, typ:"numerisch", frage:"Ein Kegel entsteht durch Rotation von \\(f(x)=x\\) über \\([0;h]\\), eine Halbkugel vom Radius \\(h\\) durch Rotation von \\(g(x)=\\sqrt{h^2-x^2}\\) über \\([0;h]\\). Zeigen Sie, dass die Halbkugel für jedes \\(h>0\\) das doppelte Volumen des Kegels hat, und geben Sie für \\(h=3\\) das Volumen der Halbkugel als \\(V/\\pi\\) an.", loesung:18, toleranz:0.1, tipp:"Berechnen Sie beide Volumina allgemein mit \\(h\\) und vergleichen Sie erst danach; für den Zahlenwert wird nur eines der beiden Ergebnisse gebraucht.", loesungsweg:"<b>Kegel:</b> $$\\frac{V_1}{\\pi} = \\int_0^h x^2\\,dx = \\frac{h^3}{3}$$ <b>Halbkugel:</b> das Quadrat der Wurzel vereinfacht den Integranden sofort: $$\\frac{V_2}{\\pi} = \\int_0^h \\left(h^2-x^2\\right)dx = h^3 - \\frac{h^3}{3} = \\frac{2h^3}{3}$$ <b>Vergleich:</b> \\(V_2 = 2V_1\\) für jedes \\(h>0\\) — das Verhältnis hängt nicht von \\(h\\) ab. <b>Zahlenwert:</b> für \\(h=3\\) ist $$\\frac{V_2}{\\pi} = \\frac{2\\cdot 27}{3} = 18$$" }];
    </script>
