<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-vektoren-grundlagen';
    const THEMA_CONFIG = { name: 'Vektoren Grundlagen', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Ein Vektor im \\(\\mathbb{R}^3\\) hat …", optionen: ["1 Komponente", "2 Komponenten", "3 Komponenten", "beliebig viele"], korrekt: 2, tipp: "3-dim. Raum.", loesungsweg: "Ein Vektor im \\(\\mathbb{R}^3\\) hat genau 3 Komponenten: \\(\\vec v = \\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix}\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Was ist ein Ortsvektor?", optionen: ["Ein Vektor vom Ursprung zu einem Punkt", "Ein Einheitsvektor", "Ein Vektor der Länge 0", "Ein Richtungsvektor einer Gerade"], korrekt: 0, tipp: "Von O aus.", loesungsweg: "Der <b>Ortsvektor</b> von Punkt \\(P\\) zeigt vom Ursprung \\(O\\) zu \\(P\\): \\(\\vec{OP}\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Verbindungsvektor \\(\\vec{AB}\\) bei \\(A(1|2|3)\\), \\(B(4|5|6)\\) berechnet sich als:", optionen: ["\\(A + B\\)", "\\(B - A\\)", "\\(A - B\\)", "\\(A \\cdot B\\)"], korrekt: 1, tipp: "Spitze minus Fuß.", loesungsweg: "$$\\vec{AB} = B - A = \\begin{pmatrix}3\\\\3\\\\3\\end{pmatrix}$$" },
      { id: 4, level: 1, typ: "numerisch", frage: "Sei \\(\\vec a = \\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}\\). Die zweite Komponente ist:", loesung: 3, toleranz: 0, tipp: "Mittlerer Eintrag.", loesungsweg: "Die Komponenten werden von oben nach unten gezählt: die erste ist \\(2\\), die zweite \\(3\\), die dritte \\(-1\\). Gesucht war also $$3$$" },
      { id: 5, level: 1, typ: "mc", frage: "Der Nullvektor \\(\\vec 0\\) ist:", optionen: ["\\(\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\)", "\\(\\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}\\)", "undefiniert", "jeder Einheitsvektor"], korrekt: 1, tipp: "Alle Komponenten 0.", loesungsweg: "Der Nullvektor hat in jeder Komponente den Wert null: $$\\vec 0 = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}$$ Er ist der einzige Vektor ohne Richtung und mit dem Betrag \\(0\\); addiert man ihn, ändert sich nichts." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(\\vec{AB}\\) bei \\(A(1|1|1)\\) und \\(B(4|5|2)\\). Die erste Komponente von \\(\\vec{AB}\\) ist:", loesung: 3, toleranz: 0, tipp: "\\(4-1\\).", loesungsweg: "Der Verbindungsvektor entsteht als „Spitze minus Fuß\": $$\\vec{AB} = \\begin{pmatrix}4-1\\\\5-1\\\\2-1\\end{pmatrix} = \\begin{pmatrix}3\\\\4\\\\1\\end{pmatrix}$$ Die erste Komponente ist \\(3\\). Die Reihenfolge ist wichtig — \\(\\vec{BA}\\) wäre der Gegenvektor." },
      // LEVEL 2 -- Addition / Skalar
      { id: 7, level: 2, typ: "numerisch", frage: "\\(\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix} + \\begin{pmatrix}4\\\\5\\\\6\\end{pmatrix}\\). Erste Komponente der Summe:", loesung: 5, toleranz: 0, tipp: "Komponentenweise.", loesungsweg: "Vektoren werden komponentenweise addiert: $$\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix} + \\begin{pmatrix}4\\\\5\\\\6\\end{pmatrix} = \\begin{pmatrix}5\\\\7\\\\9\\end{pmatrix}$$ Die erste Komponente ist \\(1+4 = 5\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(2 \\cdot \\begin{pmatrix}3\\\\-1\\\\2\\end{pmatrix}\\). Zweite Komponente:", loesung: -2, toleranz: 0, tipp: "Jeden Eintrag mal 2.", loesungsweg: "Beim Multiplizieren mit einer Zahl wird jede Komponente einzeln multipliziert: $$2 \\cdot \\begin{pmatrix}3\\\\-1\\\\2\\end{pmatrix} = \\begin{pmatrix}6\\\\-2\\\\4\\end{pmatrix}$$ Die zweite Komponente ist \\(2 \\cdot (-1) = -2\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(\\begin{pmatrix}5\\\\3\\\\1\\end{pmatrix} - \\begin{pmatrix}2\\\\3\\\\4\\end{pmatrix}\\). Dritte Komponente:", loesung: -3, toleranz: 0, tipp: "\\(1-4\\).", loesungsweg: "Komponentenweise subtrahieren: $$\\begin{pmatrix}5\\\\3\\\\1\\end{pmatrix} - \\begin{pmatrix}2\\\\3\\\\4\\end{pmatrix} = \\begin{pmatrix}3\\\\0\\\\-3\\end{pmatrix}$$ Die dritte Komponente ist \\(1 - 4 = -3\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Welche Rechnung ist korrekt für \\(\\vec a - \\vec b\\) bei \\(\\vec a = \\begin{pmatrix}2\\\\1\\end{pmatrix}\\), \\(\\vec b = \\begin{pmatrix}1\\\\3\\end{pmatrix}\\)?", optionen: ["\\(\\begin{pmatrix}1\\\\-2\\end{pmatrix}\\)", "\\(\\begin{pmatrix}3\\\\4\\end{pmatrix}\\)", "\\(\\begin{pmatrix}-1\\\\2\\end{pmatrix}\\)", "\\(\\begin{pmatrix}1\\\\2\\end{pmatrix}\\)"], korrekt: 0, tipp: "Komponentenweise subtrahieren.", loesungsweg: "\\(2-1=1\\), \\(1-3=-2\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(-3 \\cdot \\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix}\\). Erste Komponente:", loesung: -6, toleranz: 0, tipp: "\\(-3 \\cdot 2\\).", loesungsweg: "$$-3 \\cdot \\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix} = \\begin{pmatrix}-6\\\\3\\\\0\\end{pmatrix}$$ Der negative Faktor kehrt die Richtung um und streckt zugleich um den Faktor \\(3\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(2\\vec a + 3\\vec b\\) mit \\(\\vec a = \\begin{pmatrix}1\\\\0\\end{pmatrix}\\), \\(\\vec b = \\begin{pmatrix}0\\\\1\\end{pmatrix}\\). Zweite Komponente:", loesung: 3, toleranz: 0, tipp: "\\(2 \\cdot 0 + 3 \\cdot 1\\).", loesungsweg: "$$2\\begin{pmatrix}1\\\\0\\end{pmatrix} + 3\\begin{pmatrix}0\\\\1\\end{pmatrix} = \\begin{pmatrix}2\\\\0\\end{pmatrix} + \\begin{pmatrix}0\\\\3\\end{pmatrix} = \\begin{pmatrix}2\\\\3\\end{pmatrix}$$ Die zweite Komponente ist \\(3\\). Die beiden Vektoren sind die Einheitsvektoren der Achsen — jede Linearkombination liefert direkt die Koordinaten." },
      // LEVEL 3 -- Betrag
      { id: 13, level: 3, typ: "mc", frage: "Der Betrag (Länge) eines Vektors \\(\\vec v = \\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix}\\) ist:", optionen: ["\\(x+y+z\\)", "\\(\\sqrt{x^2+y^2+z^2}\\)", "\\(x^2+y^2+z^2\\)", "\\(|x|+|y|+|z|\\)"], korrekt: 1, tipp: "Pythagoras im Raum.", loesungsweg: "Der Betrag ist der Satz des Pythagoras, zweimal angewandt: erst in der Grundebene, dann in der Höhe. $$|\\vec v| = \\sqrt{x^2+y^2+z^2}$$ Die Summe der Beträge \\(|x|+|y|+|z|\\) wäre der Weg entlang der Kanten, nicht die direkte Strecke." },
      { id: 14, level: 3, typ: "numerisch", frage: "Betrag von \\(\\vec v = \\begin{pmatrix}3\\\\4\\\\0\\end{pmatrix}\\):", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{9+16}\\).", loesungsweg: "$$|\\vec v| = \\sqrt{9+16+0} = \\sqrt{25} = 5$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Betrag von \\(\\vec v = \\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}\\):", loesung: 3, toleranz: 0, tipp: "\\(\\sqrt{1+4+4}\\).", loesungsweg: "$$|\\vec v| = \\sqrt{9} = 3$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "Abstand \\(d(A,B)\\) bei \\(A(1|0|0)\\), \\(B(1|3|4)\\):", loesung: 5, toleranz: 0.01, tipp: "\\(|\\vec{AB}|\\).", loesungsweg: "\\(\\vec{AB} = \\begin{pmatrix}0\\\\3\\\\4\\end{pmatrix}, |\\vec{AB}| = \\sqrt{25}=5\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Betrag von \\(\\begin{pmatrix}2\\\\-2\\\\1\\end{pmatrix}\\):", loesung: 3, toleranz: 0, tipp: "\\(\\sqrt{4+4+1}\\).", loesungsweg: "$$\\left|\\begin{pmatrix}2\\\\-2\\\\1\\end{pmatrix}\\right| = \\sqrt{4+4+1} = \\sqrt9 = 3$$ Die Vorzeichen fallen beim Quadrieren weg." },
      { id: 18, level: 3, typ: "numerisch", frage: "Betrag von \\(\\begin{pmatrix}6\\\\0\\\\8\\end{pmatrix}\\):", loesung: 10, toleranz: 0, tipp: "\\(\\sqrt{36+64}\\).", loesungsweg: "$$\\sqrt{36+0+64} = \\sqrt{100} = 10$$ Die Null trägt nichts bei — der Vektor liegt in der \\(xz\\)-Ebene." },
      // LEVEL 4 -- Mittelpunkt, Linearkombination
      { id: 19, level: 4, typ: "mc", frage: "Mittelpunkt \\(M\\) der Strecke \\(AB\\):", optionen: ["\\(A+B\\)", "\\(\\frac{1}{2}(A+B)\\)", "\\(B-A\\)", "\\(\\frac{1}{2}(B-A)\\)"], korrekt: 1, tipp: "Mittelwert der Ortsvektoren.", loesungsweg: "Der Mittelpunkt liegt auf halbem Weg; sein Ortsvektor ist der Mittelwert der beiden Ortsvektoren: $$\\vec{OM} = \\tfrac12\\left(\\vec{OA} + \\vec{OB}\\right)$$ Der Ausdruck \\(\\tfrac12(B-A)\\) wäre dagegen der halbe Verbindungsvektor, also eine Richtung und kein Punkt." },
      { id: 20, level: 4, typ: "numerisch", frage: "Mittelpunkt von \\(A(2|4|6)\\) und \\(B(4|2|2)\\). Erste Koordinate von \\(M\\):", loesung: 3, toleranz: 0, tipp: "\\(\\frac{2+4}{2}\\).", loesungsweg: "$$M = \\tfrac12\\left(\\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix} + \\begin{pmatrix}4\\\\2\\\\2\\end{pmatrix}\\right) = \\tfrac12\\begin{pmatrix}6\\\\6\\\\8\\end{pmatrix} = \\begin{pmatrix}3\\\\3\\\\4\\end{pmatrix}$$ Die erste Koordinate ist \\(3\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Sei \\(\\vec c = 2\\vec a - \\vec b\\) mit \\(\\vec a = \\begin{pmatrix}1\\\\2\\\\1\\end{pmatrix}\\), \\(\\vec b = \\begin{pmatrix}0\\\\1\\\\3\\end{pmatrix}\\). Dritte Komponente:", loesung: -1, toleranz: 0, tipp: "\\(2 \\cdot 1 - 3\\).", loesungsweg: "$$2\\begin{pmatrix}1\\\\2\\\\1\\end{pmatrix} - \\begin{pmatrix}0\\\\1\\\\3\\end{pmatrix} = \\begin{pmatrix}2\\\\4\\\\2\\end{pmatrix} - \\begin{pmatrix}0\\\\1\\\\3\\end{pmatrix} = \\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}$$ Die dritte Komponente ist \\(2 \\cdot 1 - 3 = -1\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Wann sind \\(\\vec a\\) und \\(\\vec b\\) kollinear (parallel)?", optionen: ["Wenn \\(\\vec a = \\vec b\\) gilt", "Wenn \\(\\vec a = r \\vec b\\) gilt", "Wenn \\(|\\vec a| = |\\vec b|\\) gilt", "Wenn beide im Raum liegen"], korrekt: 1, tipp: "Skalares Vielfaches.", loesungsweg: "Kollinear heißt: beide zeigen in dieselbe oder genau entgegengesetzte Richtung. Das ist gleichbedeutend damit, dass einer ein Vielfaches des anderen ist: $$\\vec a = r \\cdot \\vec b$$ Gleiche Länge genügt nicht — zwei Vektoren gleicher Länge können in ganz verschiedene Richtungen zeigen." },
      { id: 23, level: 4, typ: "mc", frage: "Sind \\(\\vec a = \\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\) kollinear?", optionen: ["Ja, \\(\\vec a = 2\\vec b\\)", "Ja, \\(\\vec a = \\vec b\\)", "Nein", "Nur im 2D"], korrekt: 0, tipp: "Faktor prüfen.", loesungsweg: "Prüfen, ob ein gemeinsamer Faktor existiert: $$\\frac{2}{1} = \\frac{4}{2} = \\frac{6}{3} = 2$$ Alle drei Verhältnisse stimmen überein, also ist \\(\\vec a = 2\\vec b\\) — die Vektoren sind kollinear. Würde auch nur ein Verhältnis abweichen, wären sie es nicht." },
      { id: 24, level: 4, typ: "numerisch", frage: "Schwerpunkt \\(S\\) des Dreiecks \\(A(0|0|0)\\), \\(B(3|0|0)\\), \\(C(0|3|0)\\). Erste Koordinate:", loesung: 1, toleranz: 0, tipp: "\\(S = \\frac{1}{3}(A+B+C)\\).", loesungsweg: "$$S = \\tfrac13\\left(\\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix} + \\begin{pmatrix}3\\\\0\\\\0\\end{pmatrix} + \\begin{pmatrix}0\\\\3\\\\0\\end{pmatrix}\\right) = \\tfrac13\\begin{pmatrix}3\\\\3\\\\0\\end{pmatrix} = \\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}$$ Die erste Koordinate ist \\(1\\)." },
      // LEVEL 5 -- Einheitsvektoren, Gegenvektor
      { id: 25, level: 5, typ: "numerisch", frage: "Schreiben Sie \\(\\vec c = \\begin{pmatrix}2\\\\7\\\\9\\end{pmatrix}\\) als \\(r\\vec a + s\\vec b\\) mit \\(\\vec a = \\begin{pmatrix}1\\\\2\\\\0\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}0\\\\1\\\\3\\end{pmatrix}\\). Wert von \\(s\\):", loesung: 3, toleranz: 0, tipp: "Jede Zeile liefert eine Gleichung. Beginne mit einer Zeile, in der nur eine Unbekannte steht, und prüfe am Schluss die übrige Zeile.", loesungsweg: "Zeile 1: \\(r = 2\\). Zeile 3: \\(3s = 9\\), also \\(s = 3\\). Kontrolle mit Zeile 2: \\(2 \\cdot 2 + 3 = 7\\) — stimmt, die Darstellung ist möglich. Ohne diese Kontrolle wäre die Lösung nicht gesichert." },
      { id: 26, level: 5, typ: "numerisch", frage: "Für welche \\(k\\) und \\(m\\) sind \\(\\vec a = \\begin{pmatrix}2\\\\k\\\\6\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}1\\\\3\\\\m\\end{pmatrix}\\) kollinear? Geben Sie \\(k+m\\) an:", loesung: 9, toleranz: 0, tipp: "Bestimme den Faktor zwischen den Vektoren zuerst aus der Zeile, in der keine Unbekannte steht.", loesungsweg: "Erste Zeile: \\(2 = \\lambda \\cdot 1\\), also \\(\\lambda = 2\\) und \\(\\vec a = 2\\vec b\\). Zweite Zeile: \\(k = 2 \\cdot 3 = 6\\). Dritte Zeile: \\(6 = 2m\\), also \\(m = 3\\). Zusammen \\(k+m = 9\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für welches \\(z > 0\\) ist das Dreieck \\(A(0|0|0)\\), \\(B(4|0|0)\\), \\(C(2|0|z)\\) gleichseitig? (auf 2 NK)", loesung: 3.46, toleranz: 0.02, tipp: "Gleichseitig heißt: alle drei Seiten gleich lang. Setze den Betrag einer Schenkelseite gleich der Grundseite.", loesungsweg: "\\(|\\vec{AB}| = 4\\). \\(\\vec{AC} = \\begin{pmatrix}2\\\\0\\\\z\\end{pmatrix}\\), also \\(|\\vec{AC}| = \\sqrt{4+z^2}\\). Aus \\(4+z^2 = 16\\) folgt \\(z = 2\\sqrt{3} \\approx 3{,}46\\). Wegen \\(\\vec{BC} = \\begin{pmatrix}-2\\\\0\\\\z\\end{pmatrix}\\) ist die dritte Seite dann automatisch ebenso lang." },
      { id: 28, level: 5, typ: "numerisch", frage: "Ein Schüler rechnet für \\(\\vec a = \\begin{pmatrix}3\\\\0\\\\0\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}0\\\\4\\\\0\\end{pmatrix}\\): \\(|\\vec a + \\vec b| = |\\vec a| + |\\vec b| = 7\\). Wie groß ist der Betrag wirklich?", loesung: 5, toleranz: 0, tipp: "Addiere erst komponentenweise und bilde dann den Betrag — die Reihenfolge entscheidet.", loesungsweg: "\\(\\vec a + \\vec b = \\begin{pmatrix}3\\\\4\\\\0\\end{pmatrix}\\), also \\(|\\vec a+\\vec b| = \\sqrt{9+16} = 5\\). Beträge darf man nicht einzeln addieren; \\(|\\vec a|+|\\vec b|\\) käme nur heraus, wenn beide Vektoren gleichgerichtet wären. Hier stehen sie senkrecht aufeinander, das Ergebnis ist die Hypotenuse." },
      { id: 29, level: 5, typ: "numerisch", frage: "Für welchen Wert von \\(c\\) lässt sich \\(\\begin{pmatrix}1\\\\1\\\\c\\end{pmatrix}\\) als Linearkombination von \\(\\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}\\) und \\(\\begin{pmatrix}0\\\\1\\\\1\\end{pmatrix}\\) schreiben?", loesung: 2, toleranz: 0, tipp: "Die ersten zwei Zeilen legen beide Faktoren fest; die dritte Zeile bestimmt dann den gesuchten Wert.", loesungsweg: "Ansatz \\(r\\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix} + s\\begin{pmatrix}0\\\\1\\\\1\\end{pmatrix}\\): Zeile 1 gibt \\(r = 1\\), Zeile 2 gibt \\(s = 1\\). Zeile 3: \\(c = r+s = 2\\). Für jedes andere \\(c\\) ist das Gleichungssystem unlösbar, der Vektor liegt dann nicht in der von beiden aufgespannten Ebene." },
      { id: 30, level: 5, typ: "numerisch", frage: "Der Punkt \\(P\\) liegt auf der Strecke \\(AB\\) mit \\(A(1|2|3)\\) und \\(B(9|10|11)\\), und zwar so, dass \\(|\\vec{AP}| = \\tfrac{1}{4}|\\vec{AB}|\\). Dritte Koordinate von \\(P\\):", loesung: 5, toleranz: 0, tipp: "Gehe vom Punkt \\(A\\) aus nur einen Bruchteil des Verbindungsvektors weiter.", loesungsweg: "\\(\\vec{AB} = \\begin{pmatrix}8\\\\8\\\\8\\end{pmatrix}\\), ein Viertel davon ist \\(\\begin{pmatrix}2\\\\2\\\\2\\end{pmatrix}\\). Also \\(\\vec{OP} = \\vec{OA} + \\begin{pmatrix}2\\\\2\\\\2\\end{pmatrix}\\) und \\(P(3|4|5)\\); die dritte Koordinate ist \\(5\\)." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "Ein Zeltdach hat die quadratische Grundfläche \\(A(0|0|0)\\), \\(B(6|0|0)\\), \\(C(6|6|0)\\), \\(D(0|6|0)\\) und die Spitze \\(S(3|3|4)\\) (Angaben in Metern). Zeigen Sie, dass alle vier Dachkanten gleich lang sind, und geben Sie ihre Länge an (in m, auf 2 NK):", loesung: 5.83, toleranz: 0.02, tipp: "Bilde für jede Grundecke den Verbindungsvektor zur Spitze und vergleiche die Beträge.", loesungsweg: "\\(\\vec{AS} = \\begin{pmatrix}3\\\\3\\\\4\\end{pmatrix}\\), \\(\\vec{BS} = \\begin{pmatrix}-3\\\\3\\\\4\\end{pmatrix}\\), \\(\\vec{CS} = \\begin{pmatrix}-3\\\\-3\\\\4\\end{pmatrix}\\), \\(\\vec{DS} = \\begin{pmatrix}3\\\\-3\\\\4\\end{pmatrix}\\). In allen vier Vektoren treten dieselben Quadrate auf, die Beträge sind also gleich: \\(\\sqrt{9+9+16} = \\sqrt{34} \\approx 5{,}83\\) m. Das musste so kommen, weil die Spitze senkrecht über dem Mittelpunkt des Quadrats liegt." },
      { id: 32, level: 6, typ: "numerisch", frage: "Eine Drohne startet in \\(P(0|0|0)\\) und fliegt 3 Sekunden lang mit dem konstanten Geschwindigkeitsvektor \\(\\vec v = \\begin{pmatrix}6\\\\8\\\\5\\end{pmatrix}\\) (Angaben in m/s). Welchen Weg legt sie dabei zurück (in m, auf 2 NK)?", loesung: 33.54, toleranz: 0.05, tipp: "Der Betrag des Geschwindigkeitsvektors ist die Bahngeschwindigkeit; danach wie bei gleichförmiger Bewegung weiter.", loesungsweg: "\\(|\\vec v| = \\sqrt{36+64+25} = \\sqrt{125} \\approx 11{,}18\\) m/s. In 3 s ergibt das \\(3\\sqrt{125} \\approx 33{,}54\\) m. Gleichwertig: der Ortsvektor nach 3 s ist \\(\\begin{pmatrix}18\\\\24\\\\15\\end{pmatrix}\\), und \\(\\sqrt{324+576+225} = \\sqrt{1125} \\approx 33{,}54\\) — dieselbe Länge." },
      { id: 33, level: 6, typ: "mc", frage: "Beurteilen Sie: Zu einem Vektor \\(\\vec a \\neq \\vec 0\\) gibt es Vektoren der Länge 1, die zu \\(\\vec a\\) gleichgerichtet sind. Wie viele?", optionen: ["genau einen", "genau zwei", "unendlich viele", "gar keinen"], korrekt: 0, tipp: "Teile den Vektor durch seinen Betrag und überlege, ob diese Rechnung noch Spielraum lässt.", loesungsweg: "Jeder gleichgerichtete Vektor hat die Form \\(r\\vec a\\) mit \\(r > 0\\). Aus \\(|r\\vec a| = r|\\vec a| = 1\\) folgt \\(r = \\tfrac{1}{|\\vec a|}\\) — genau ein Wert. Der Einheitsvektor \\(\\vec e = \\tfrac{1}{|\\vec a|}\\vec a\\) ist also eindeutig. Der Vektor \\(-\\vec e\\) hat ebenfalls die Länge 1, ist aber entgegengesetzt gerichtet und zählt hier nicht mit." },
      { id: 34, level: 6, typ: "numerisch", frage: "Ein Fensterrahmen hat die Ecken \\(A(1|0|2)\\), \\(B(5|0|2)\\) und \\(D(1|3|6)\\) (Angaben in Metern). Bestimmen Sie die vierte Ecke \\(C\\) so, dass \\(ABCD\\) ein Parallelogramm ist, und geben Sie den Umfang an (in m):", loesung: 18, toleranz: 0, tipp: "Im Parallelogramm ist die Strecke von \\(B\\) nach \\(C\\) genauso gerichtet und lang wie die von \\(A\\) nach \\(D\\).", loesungsweg: "\\(\\vec{AD} = \\begin{pmatrix}0\\\\3\\\\4\\end{pmatrix}\\), also \\(\\vec{OC} = \\vec{OB} + \\vec{AD}\\) und \\(C(5|3|6)\\). Seitenlängen: \\(|\\vec{AB}| = 4\\) und \\(|\\vec{AD}| = \\sqrt{9+16} = 5\\). Gegenüberliegende Seiten sind im Parallelogramm gleich lang, der Umfang ist also \\(2(4+5) = 18\\) m." },
      { id: 35, level: 6, typ: "numerisch", frage: "Für zwei Werte von \\(k\\) sind \\(\\vec a = \\begin{pmatrix}k\\\\2\\\\k\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}2\\\\k\\\\2\\end{pmatrix}\\) kollinear. Geben Sie den positiven Wert an:", loesung: 2, toleranz: 0, tipp: "Setze \\(\\vec a = \\lambda\\vec b\\) an; die Zeilen liefern zwei Gleichungen, die zusammen auf eine quadratische Bedingung führen.", loesungsweg: "Aus \\(\\vec a = \\lambda\\vec b\\) folgt \\(k = 2\\lambda\\) (Zeile 1 und 3) und \\(2 = \\lambda k\\) (Zeile 2). Einsetzen: \\(2 = 2\\lambda^2\\), also \\(\\lambda = 1\\) oder \\(\\lambda = -1\\). Für \\(\\lambda = 1\\) ist \\(k = 2\\), beide Vektoren sind dann gleich. Für \\(\\lambda = -1\\) ist \\(k = -2\\), die Vektoren zeigen entgegengesetzt. Gefragt ist der positive Wert \\(k = 2\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Drei Sensoren hängen in \\(A(0|0|3)\\), \\(B(6|0|3)\\) und \\(C(3|6|3)\\) (Angaben in Metern). Ein Relais soll im Schwerpunkt des Dreiecks \\(ABC\\) angebracht werden. Wie weit ist es von Sensor \\(A\\) entfernt (in m, auf 2 NK)?", loesung: 3.61, toleranz: 0.02, tipp: "Bestimme zuerst den Schwerpunkt als Mittel der drei Ortsvektoren, dann den Betrag des Verbindungsvektors.", loesungsweg: "\\(\\vec{OS} = \\tfrac{1}{3}\\left(\\vec{OA}+\\vec{OB}+\\vec{OC}\\right) = \\tfrac{1}{3}\\begin{pmatrix}9\\\\6\\\\9\\end{pmatrix} = \\begin{pmatrix}3\\\\2\\\\3\\end{pmatrix}\\), also \\(S(3|2|3)\\). Damit \\(\\vec{AS} = \\begin{pmatrix}3\\\\2\\\\0\\end{pmatrix}\\) und \\(|\\vec{AS}| = \\sqrt{9+4} = \\sqrt{13} \\approx 3{,}61\\) m. Alle drei Sensoren hängen in derselben Höhe, deshalb bleibt der Schwerpunkt auf \\(z = 3\\)." }];
