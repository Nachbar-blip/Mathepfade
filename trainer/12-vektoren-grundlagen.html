<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vektoren Grundlagen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-vektoren-grundlagen';
    const THEMA_CONFIG = { name: 'Vektoren Grundlagen', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Ein Vektor im \\(\\mathbb{R}^3\\) hat …", optionen: ["1 Komponente", "2 Komponenten", "3 Komponenten", "beliebig viele"], korrekt: 2, tipp: "3-dim. Raum.", loesungsweg: "Ein Vektor im \\(\\mathbb{R}^3\\) hat genau 3 Komponenten: \\(\\vec v = \\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix}\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Was ist ein Ortsvektor?", optionen: ["Ein Vektor vom Ursprung zu einem Punkt", "Ein Einheitsvektor", "Ein Vektor der Länge 0", "Ein Richtungsvektor einer Gerade"], korrekt: 0, tipp: "Von O aus.", loesungsweg: "Der <b>Ortsvektor</b> von Punkt \\(P\\) zeigt vom Ursprung \\(O\\) zu \\(P\\): \\(\\vec{OP}\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Verbindungsvektor \\(\\vec{AB}\\) bei \\(A(1|2|3)\\), \\(B(4|5|6)\\) berechnet sich als:", optionen: ["\\(A + B\\)", "\\(B - A\\)", "\\(A - B\\)", "\\(A \\cdot B\\)"], korrekt: 1, tipp: "Spitze minus Fuß.", loesungsweg: "$$\\vec{AB} = B - A = \\begin{pmatrix}3\\\\3\\\\3\\end{pmatrix}$$" },
      { id: 4, level: 1, typ: "numerisch", frage: "Sei \\(\\vec a = \\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}\\). Die zweite Komponente ist:", loesung: 3, toleranz: 0, tipp: "Mittlerer Eintrag.", loesungsweg: "Zweite Komponente ist \\(3\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Der Nullvektor \\(\\vec 0\\) ist:", optionen: ["\\(\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\)", "\\(\\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}\\)", "undefiniert", "jeder Einheitsvektor"], korrekt: 1, tipp: "Alle Komponenten 0.", loesungsweg: "\\(\\vec 0 = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}\\)." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(\\vec{AB}\\) bei \\(A(1|1|1)\\) und \\(B(4|5|2)\\). Die erste Komponente von \\(\\vec{AB}\\) ist:", loesung: 3, toleranz: 0, tipp: "\\(4-1\\).", loesungsweg: "$$\\vec{AB} = \\begin{pmatrix}3\\\\4\\\\1\\end{pmatrix}$$" },
      // LEVEL 2 -- Addition / Skalar
      { id: 7, level: 2, typ: "numerisch", frage: "\\(\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix} + \\begin{pmatrix}4\\\\5\\\\6\\end{pmatrix}\\). Erste Komponente der Summe:", loesung: 5, toleranz: 0, tipp: "Komponentenweise.", loesungsweg: "Summe: \\(\\begin{pmatrix}5\\\\7\\\\9\\end{pmatrix}\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(2 \\cdot \\begin{pmatrix}3\\\\-1\\\\2\\end{pmatrix}\\). Zweite Komponente:", loesung: -2, toleranz: 0, tipp: "Jeden Eintrag mal 2.", loesungsweg: "\\(\\begin{pmatrix}6\\\\-2\\\\4\\end{pmatrix}\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(\\begin{pmatrix}5\\\\3\\\\1\\end{pmatrix} - \\begin{pmatrix}2\\\\3\\\\4\\end{pmatrix}\\). Dritte Komponente:", loesung: -3, toleranz: 0, tipp: "\\(1-4\\).", loesungsweg: "\\(\\begin{pmatrix}3\\\\0\\\\-3\\end{pmatrix}\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Welche Rechnung ist korrekt für \\(\\vec a - \\vec b\\) bei \\(\\vec a = \\begin{pmatrix}2\\\\1\\end{pmatrix}\\), \\(\\vec b = \\begin{pmatrix}1\\\\3\\end{pmatrix}\\)?", optionen: ["\\(\\begin{pmatrix}1\\\\-2\\end{pmatrix}\\)", "\\(\\begin{pmatrix}3\\\\4\\end{pmatrix}\\)", "\\(\\begin{pmatrix}-1\\\\2\\end{pmatrix}\\)", "\\(\\begin{pmatrix}1\\\\2\\end{pmatrix}\\)"], korrekt: 0, tipp: "Komponentenweise subtrahieren.", loesungsweg: "\\(2-1=1\\), \\(1-3=-2\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(-3 \\cdot \\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix}\\). Erste Komponente:", loesung: -6, toleranz: 0, tipp: "\\(-3 \\cdot 2\\).", loesungsweg: "\\(\\begin{pmatrix}-6\\\\3\\\\0\\end{pmatrix}\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(2\\vec a + 3\\vec b\\) mit \\(\\vec a = \\begin{pmatrix}1\\\\0\\end{pmatrix}\\), \\(\\vec b = \\begin{pmatrix}0\\\\1\\end{pmatrix}\\). Zweite Komponente:", loesung: 3, toleranz: 0, tipp: "\\(2 \\cdot 0 + 3 \\cdot 1\\).", loesungsweg: "\\(\\begin{pmatrix}2\\\\3\\end{pmatrix}\\)." },
      // LEVEL 3 -- Betrag
      { id: 13, level: 3, typ: "mc", frage: "Der Betrag (Länge) eines Vektors \\(\\vec v = \\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix}\\) ist:", optionen: ["\\(x+y+z\\)", "\\(\\sqrt{x^2+y^2+z^2}\\)", "\\(x^2+y^2+z^2\\)", "\\(|x|+|y|+|z|\\)"], korrekt: 1, tipp: "Pythagoras im Raum.", loesungsweg: "$$|\\vec v| = \\sqrt{x^2+y^2+z^2}$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Betrag von \\(\\vec v = \\begin{pmatrix}3\\\\4\\\\0\\end{pmatrix}\\):", loesung: 5, toleranz: 0, tipp: "\\(\\sqrt{9+16}\\).", loesungsweg: "$$|\\vec v| = \\sqrt{9+16+0} = \\sqrt{25} = 5$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Betrag von \\(\\vec v = \\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}\\):", loesung: 3, toleranz: 0, tipp: "\\(\\sqrt{1+4+4}\\).", loesungsweg: "$$|\\vec v| = \\sqrt{9} = 3$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "Abstand \\(d(A,B)\\) bei \\(A(1|0|0)\\), \\(B(1|3|4)\\):", loesung: 5, toleranz: 0.01, tipp: "\\(|\\vec{AB}|\\).", loesungsweg: "\\(\\vec{AB} = \\begin{pmatrix}0\\\\3\\\\4\\end{pmatrix}, |\\vec{AB}| = \\sqrt{25}=5\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Betrag von \\(\\begin{pmatrix}2\\\\-2\\\\1\\end{pmatrix}\\):", loesung: 3, toleranz: 0, tipp: "\\(\\sqrt{4+4+1}\\).", loesungsweg: "$$\\sqrt{9} = 3$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Betrag von \\(\\begin{pmatrix}6\\\\0\\\\8\\end{pmatrix}\\):", loesung: 10, toleranz: 0, tipp: "\\(\\sqrt{36+64}\\).", loesungsweg: "$$\\sqrt{100} = 10$$" },
      // LEVEL 4 -- Mittelpunkt, Linearkombination
      { id: 19, level: 4, typ: "mc", frage: "Mittelpunkt \\(M\\) der Strecke \\(AB\\):", optionen: ["\\(A+B\\)", "\\(\\frac{1}{2}(A+B)\\)", "\\(B-A\\)", "\\(\\frac{1}{2}(B-A)\\)"], korrekt: 1, tipp: "Mittelwert der Ortsvektoren.", loesungsweg: "$$\\vec{OM} = \\tfrac{1}{2}(\\vec{OA}+\\vec{OB})$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Mittelpunkt von \\(A(2|4|6)\\) und \\(B(4|2|2)\\). Erste Koordinate von \\(M\\):", loesung: 3, toleranz: 0, tipp: "\\(\\frac{2+4}{2}\\).", loesungsweg: "\\(M = (3|3|4)\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Sei \\(\\vec c = 2\\vec a - \\vec b\\) mit \\(\\vec a = \\begin{pmatrix}1\\\\2\\\\1\\end{pmatrix}\\), \\(\\vec b = \\begin{pmatrix}0\\\\1\\\\3\\end{pmatrix}\\). Dritte Komponente:", loesung: -1, toleranz: 0, tipp: "\\(2 \\cdot 1 - 3\\).", loesungsweg: "\\(\\vec c = \\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Wann sind \\(\\vec a\\) und \\(\\vec b\\) kollinear (parallel)?", optionen: ["Wenn \\(\\vec a = \\vec b\\)", "Wenn \\(\\vec a = r \\cdot \\vec b\\) für ein \\(r \\in \\mathbb{R}\\)", "Wenn \\(|\\vec a| = |\\vec b|\\)", "Niemals"], korrekt: 1, tipp: "Skalares Vielfaches.", loesungsweg: "\\(\\vec a \\parallel \\vec b \\iff \\exists r: \\vec a = r\\vec b\\)." },
      { id: 23, level: 4, typ: "mc", frage: "Sind \\(\\vec a = \\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\) kollinear?", optionen: ["Ja, \\(\\vec a = 2\\vec b\\)", "Ja, \\(\\vec a = \\vec b\\)", "Nein", "Nur im 2D"], korrekt: 0, tipp: "Faktor prüfen.", loesungsweg: "\\(\\vec a = 2\\vec b\\), also kollinear." },
      { id: 24, level: 4, typ: "numerisch", frage: "Schwerpunkt \\(S\\) des Dreiecks \\(A(0|0|0)\\), \\(B(3|0|0)\\), \\(C(0|3|0)\\). Erste Koordinate:", loesung: 1, toleranz: 0, tipp: "\\(S = \\frac{1}{3}(A+B+C)\\).", loesungsweg: "\\(S = (1|1|0)\\)." },
      // LEVEL 5 -- Einheitsvektoren, Gegenvektor
      { id: 25, level: 5, typ: "mc", frage: "Einheitsvektor \\(\\vec e\\) von \\(\\vec v\\) (mit \\(\\vec v \\neq 0\\)):", optionen: ["\\(\\vec v \\cdot |\\vec v|\\)", "\\(\\frac{\\vec v}{|\\vec v|}\\)", "\\(|\\vec v| \\cdot \\vec v\\)", "\\(\\frac{|\\vec v|}{\\vec v}\\)"], korrekt: 1, tipp: "Durch Betrag teilen.", loesungsweg: "$$\\vec e = \\tfrac{1}{|\\vec v|}\\vec v$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Einheitsvektor von \\(\\vec v = \\begin{pmatrix}3\\\\0\\\\4\\end{pmatrix}\\). Erste Komponente (Dezimal):", loesung: 0.6, toleranz: 0.01, tipp: "\\(|\\vec v|=5\\). \\(\\frac{3}{5}\\).", loesungsweg: "\\(\\vec e = \\frac{1}{5}\\vec v = \\begin{pmatrix}0{,}6\\\\0\\\\0{,}8\\end{pmatrix}\\)." },
      { id: 27, level: 5, typ: "mc", frage: "Der Gegenvektor \\(-\\vec v\\) hat:", optionen: ["denselben Betrag, entgegengesetzte Richtung", "denselben Betrag und dieselbe Richtung", "halben Betrag", "doppelten Betrag"], korrekt: 0, tipp: "Vorzeichenwechsel.", loesungsweg: "\\(|-\\vec v| = |\\vec v|\\), aber entgegengesetzte Richtung." },
      { id: 28, level: 5, typ: "numerisch", frage: "Ein Vektor parallel zu \\(\\vec v = \\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}\\) mit Länge 6. Erste Komponente:", loesung: 2, toleranz: 0, tipp: "\\(|\\vec v|=3\\). Faktor 2.", loesungsweg: "\\(\\vec w = 2\\vec v = \\begin{pmatrix}2\\\\4\\\\4\\end{pmatrix}\\), \\(|\\vec w| = 6\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Für welches \\(k\\) sind \\(\\vec a = \\begin{pmatrix}2\\\\k\\\\4\\end{pmatrix}\\) und \\(\\vec b = \\begin{pmatrix}1\\\\3\\\\2\\end{pmatrix}\\) kollinear?", loesung: 6, toleranz: 0, tipp: "\\(\\vec a = 2\\vec b\\) nötig.", loesungsweg: "\\(\\vec a = 2\\vec b \\Rightarrow k = 2 \\cdot 3 = 6\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Betrag von \\(2\\vec a\\) mit \\(|\\vec a| = 5\\):", loesung: 10, toleranz: 0, tipp: "\\(|r\\vec a| = |r| \\cdot |\\vec a|\\).", loesungsweg: "\\(|2\\vec a| = 2 \\cdot 5 = 10\\)." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "Im Viereck \\(ABCD\\) mit \\(A(0|0|0)\\), \\(B(4|0|0)\\), \\(C(4|3|0)\\), \\(D(0|3|0)\\). Abstand \\(AC\\):", loesung: 5, toleranz: 0.01, tipp: "\\(|\\vec{AC}|\\).", loesungsweg: "\\(\\vec{AC} = \\begin{pmatrix}4\\\\3\\\\0\\end{pmatrix}, |\\vec{AC}|=5\\)." },
      { id: 32, level: 6, typ: "mc", frage: "\\(A(1|2|3)\\), \\(B(3|4|5)\\), \\(C(5|6|7)\\): liegen kollinear?", optionen: ["Ja", "Nein", "Nur wenn \\(z = 0\\)", "Nicht entscheidbar"], korrekt: 0, tipp: "\\(\\vec{AB} \\parallel \\vec{BC}\\)?", loesungsweg: "\\(\\vec{AB} = \\vec{BC} = \\begin{pmatrix}2\\\\2\\\\2\\end{pmatrix}\\), kollinear." },
      { id: 33, level: 6, typ: "numerisch", frage: "Punkt \\(D\\) so, dass \\(ABCD\\) ein Parallelogramm ist: \\(A(1|0|0)\\), \\(B(4|0|0)\\), \\(C(5|2|1)\\). Erste Koord. von \\(D\\):", loesung: 2, toleranz: 0, tipp: "\\(D = A + \\vec{BC}\\).", loesungsweg: "\\(\\vec{BC} = \\begin{pmatrix}1\\\\2\\\\1\\end{pmatrix}, D = A + \\vec{BC} = (2|2|1)\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "\\(|\\vec a + \\vec b|^2\\) bei \\(\\vec a = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}, \\vec b = \\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\):", loesung: 2, toleranz: 0, tipp: "\\(\\vec a+\\vec b = \\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}\\).", loesungsweg: "\\(|\\vec a+\\vec b|^2 = 1+1 = 2\\)." },
      { id: 35, level: 6, typ: "mc", frage: "Schwerpunkt des Dreiecks ist:", optionen: ["\\(\\frac{1}{2}(A+B+C)\\)", "\\(\\frac{1}{3}(A+B+C)\\)", "\\(A+B+C\\)", "\\(\\frac{1}{2}(A+B)\\)"], korrekt: 1, tipp: "Drittel der Summe.", loesungsweg: "$$\\vec{OS} = \\tfrac{1}{3}(\\vec{OA}+\\vec{OB}+\\vec{OC})$$" },
      { id: 36, level: 6, typ: "numerisch", frage: "Für welches \\(t\\) hat \\(\\vec v(t) = \\begin{pmatrix}t\\\\2\\\\2t\\end{pmatrix}\\) den Betrag 3?", loesung: 1, toleranz: 0.01, tipp: "\\(t^2 + 4 + 4t^2 = 9\\).", loesungsweg: "\\(5t^2 = 5 \\Rightarrow t^2 = 1 \\Rightarrow t = 1\\) (positiv)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
