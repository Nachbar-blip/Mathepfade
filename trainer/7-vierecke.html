        loesungsweg: "<b>Schluss:</b> Zwei Paare paralleler Seiten → Parallelogramm. Ein Parallelogramm, dessen Diagonalen senkrecht aufeinander stehen, ist eine <b>Raute</b> (die Diagonalen halbieren sich, und mit dem rechten Winkel sind alle vier Teildreiecke kongruent, also alle Seiten gleich lang). Ein Quadrat wäre es nur, wenn zusätzlich die Diagonalen gleich lang oder die Winkel rechte wären — das ist nicht gegeben. Ein Rechteck hat im Allgemeinen keine senkrechten Diagonalen. Jede Raute ist zwar ein Drachenviereck, aber „Raute“ ist die genauere Bezeichnung."
