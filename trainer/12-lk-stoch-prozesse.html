        loesungsweg:"Die Schülerin hat ein <b>Prognoseintervall</b> gerechnet: dort ist \\(p\\) bekannt und man fragt, welche Häufigkeiten zu erwarten sind. Deshalb steht bei ihr \\(p = 0{,}5\\) in der Mitte und in der Streuung. Gefragt war der umgekehrte Schluss: Aus der beobachteten Häufigkeit \\(h\\) soll auf das <b>unbekannte</b> \\(p\\) geschlossen werden. Dann ist \\(h\\) die Mitte, und weil \\(p\\) fehlt, wird die Streuung ebenfalls mit \\(h\\) geschätzt: $$\\sigma_h = \\sqrt{\\frac{0{,}62 \\cdot 0{,}38}{100}} = \\sqrt{0{,}002356} \\approx 0{,}048539$$ $$r = 2 \\cdot 0{,}048539 \\approx 0{,}097077$$ $$h - r \\approx 0{,}62 - 0{,}097077 = 0{,}522923$$ Das korrekte Konfidenzintervall ist \\([0{,}5229;\\,0{,}7171]\\), das von ihr berechnete Prognoseintervall \\([0{,}40;\\,0{,}60]\\). Beide Grenzen unterscheiden sich um mehr als 11 Prozentpunkte: unten \\(0{,}5229 - 0{,}40 \\approx 0{,}1229\\), oben \\(0{,}7171 - 0{,}60 \\approx 0{,}1171\\). Der falsche Weg führt hier also sicher auf ein falsches Ergebnis. Auch die Aussagen sind verschieden: das Prognoseintervall hätte nur gezeigt, dass \\(0{,}62\\) nicht mehr zu \\(p = 0{,}5\\) passt — über den tatsächlichen Wert von \\(p\\) sagt es nichts."

      { id:26, level:5, typ:"numerisch",

      { id:28, level:5, typ:"numerisch",

      { id:31, level:6, typ:"numerisch",

      { id:32, level:6, typ:"numerisch",
        frage:"In einer Stichprobe von 200 Bauteilen sind 3 defekt. Ein Prüfer bildet das 95-%-Konfidenzintervall in der \\(2\\sigma\\)-Näherung. Geben Sie die untere Grenze an, die seine Rechnung liefert, und beurteilen Sie, was dieses Ergebnis über die Näherung aussagt.",

        loesungsweg:"$$h = \\frac{3}{200} = 0{,}015$$ $$\\sigma_h = \\sqrt{\\frac{0{,}015 \\cdot 0{,}985}{200}} = \\sqrt{0{,}000073875} \\approx 0{,}0085951$$ $$r = 2 \\cdot 0{,}0085951 \\approx 0{,}0171902$$ $$h - r \\approx 0{,}015 - 0{,}0171902 = -0{,}0022$$ <b>Beurteilung:</b> Eine Wahrscheinlichkeit kann nicht negativ sein. Das Ergebnis zeigt also nicht, dass \\(p\\) negativ sein könnte, sondern dass das Verfahren hier versagt. Der Grund: Die Näherung setzt eine annähernd glockenförmige, symmetrische Verteilung voraus. Die Kontrolle liefert $$\\sigma(X) = \\sqrt{200 \\cdot 0{,}015 \\cdot 0{,}985} = \\sqrt{2{,}955} \\approx 1{,}72$$ also weit unter \\(3\\). Bei nur drei Treffern ist die Verteilung stark rechtsschief; die symmetrische Näherung ist unbrauchbar. Man müsste exakt mit der Binomialverteilung rechnen oder die Stichprobe vergrößern."

      { id:33, level:6, typ:"numerisch",
        frage:"Eine Umfrage unter 1000 Personen ergibt \\(h = 0{,}47\\). Bestimmen Sie die obere Grenze des Konfidenzintervalls einmal für eine Sicherheit von 95 % (Faktor \\(1{,}96\\)) und einmal für 99 % (Faktor \\(2{,}58\\)). Geben Sie die obere Grenze für 99 % an und beurteilen Sie, was die höhere Sicherheit kostet.",

      { id:34, level:6, typ:"numerisch",

        tipp:"Untersuche zuerst, für welches \\(h\\) der Term \\(h(1-h)\\) am größten wird; erst danach die Ungleichung auflösen.",

      { id:35, level:6, typ:"mc",

      { id:36, level:6, typ:"numerisch",
        frage:"Eine Zeitung stellt auf ihrer Startseite die Frage „Soll die Innenstadt autofrei werden?“. Von 5000 Teilnehmern stimmen 3100 zu. Bestimmen Sie den Radius des 95-%-Konfidenzintervalls (\\(2\\sigma\\)-Näherung) in Prozentpunkten und beurteilen Sie, was daraus über die Meinung der Stadtbevölkerung folgt.",

        loesungsweg:"$$h = \\frac{3100}{5000} = 0{,}62$$ $$\\sigma_h = \\sqrt{\\frac{0{,}62 \\cdot 0{,}38}{5000}} = \\sqrt{0{,}00004712} \\approx 0{,}0068644$$ $$r = 2 \\cdot 0{,}0068644 \\approx 0{,}0137288 \\;\\widehat{=}\\; 1{,}37 \\text{ Prozentpunkte}$$ <b>Beurteilung:</b> Rechnerisch ist das Intervall sehr schmal, und die Laplace-Bedingung ist mit \\(\\sigma(X) = \\sqrt{5000 \\cdot 0{,}62 \\cdot 0{,}38} \\approx 34{,}3\\) klar erfüllt. Über die Stadtbevölkerung folgt daraus aber nichts. Die Formel setzt voraus, dass die Teilnehmer zufällig und unabhängig aus der Grundgesamtheit gezogen wurden. Hier haben sie selbst entschieden, mitzumachen — beteiligt haben sich vor allem Menschen mit starker Meinung zum Thema, und nur Leser dieser Zeitung. Ein schmales Intervall macht eine verzerrte Stichprobe nicht repräsentativ: Es beschreibt allein die Zufallsschwankung, nicht den systematischen Fehler bei der Auswahl. Der geschätzte Anteil bezieht sich also nur auf die Teilnehmenden."
