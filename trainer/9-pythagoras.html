<!DOCTYPE html>

<head>

    <title>Satz des Pythagoras - Mathepfade</title>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-pythagoras';
    const THEMA_CONFIG = { name: 'Satz des Pythagoras', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id:1, level:1, typ:"mc", frage:"Wie heißt die längste Seite im rechtwinkligen Dreieck?", optionen:["Kathete","Hypotenuse","Ankathete","Gegenkathete"], korrekt:1, tipp:"Sie liegt dem rechten Winkel gegenüber.", loesungsweg:"Die <b>Hypotenuse</b> ist die längste Seite und liegt dem rechten Winkel gegenüber." },
      { id:2, level:1, typ:"mc", frage:"Wie lautet der Satz des Pythagoras?", optionen:["\\(a+b=c\\)","\\(a^2+b^2=c^2\\)","\\(a\\cdot b=c\\)","\\(a^2-b^2=c^2\\)"], korrekt:1, tipp:"Quadrat über Hypotenuse = Summe der Kathetenquadrate.", loesungsweg:"Im rechtwinkligen Dreieck gilt: $$a^2 + b^2 = c^2$$ Dabei sind \\(a\\) und \\(b\\) die Katheten und \\(c\\) die <b>Hypotenuse</b>, also die Seite gegenüber dem rechten Winkel. Anschaulich: Die Quadrate über den beiden Katheten haben zusammen denselben Flächeninhalt wie das Quadrat über der Hypotenuse. Ohne rechten Winkel gilt die Beziehung nicht." },
      { id:3, level:1, typ:"numerisch", frage:"Berechne \\(c\\) für \\(a=8\\), \\(b=15\\).", loesung:17, toleranz:0, tipp:"\\(64+225=289\\), dann Wurzel.", loesungsweg:"$$c=\\sqrt{8^2+15^2}=\\sqrt{64+225}=\\sqrt{289}=17$$" },
      { id:4, level:1, typ:"numerisch", frage:"Berechne \\(c\\) für \\(a=3\\), \\(b=4\\).", loesung:5, toleranz:0, tipp:"\\(9+16=25\\), dann Wurzel.", loesungsweg:"Beide Katheten quadrieren, addieren, Wurzel ziehen: $$c=\\sqrt{3^2+4^2}=\\sqrt{9+16}=\\sqrt{25}=5$$" },
      { id:5, level:1, typ:"numerisch", frage:"Berechne \\(c\\) für \\(a=6\\), \\(b=8\\).", loesung:10, toleranz:0, tipp:"\\(36+64=100\\).", loesungsweg:"$$c=\\sqrt{36+64}=\\sqrt{100}=10$$" },
      { id:6, level:1, typ:"mc", frage:"Gilt der Satz des Pythagoras in jedem Dreieck?", optionen:["Ja","Nein, nur im rechtwinkligen","Nur im gleichseitigen","Nur im stumpfwinkligen"], korrekt:1, tipp:"Es braucht einen rechten Winkel.", loesungsweg:"Nur im <b>rechtwinkligen</b> Dreieck gilt \\(a^2+b^2=c^2\\)." },
      // LEVEL 2
      { id:7, level:2, typ:"numerisch", frage:"Berechne \\(c\\) für \\(a=5\\), \\(b=12\\).", loesung:13, toleranz:0, tipp:"\\(25+144=169\\).", loesungsweg:"$$c=\\sqrt{25+144}=\\sqrt{169}=13$$" },
      { id:8, level:2, typ:"numerisch", frage:"Berechne \\(c\\) für \\(a=9\\), \\(b=12\\).", loesung:15, toleranz:0, tipp:"\\(81+144=225\\).", loesungsweg:"$$c=\\sqrt{9^2+12^2}=\\sqrt{81+144}=\\sqrt{225}=15$$ Das Dreieck ist das \\(3\\)-\\(4\\)-\\(5\\)-Dreieck, dreifach vergrößert." },
      { id:9, level:2, typ:"numerisch", frage:"Kathete \\(a\\) für \\(b=8\\), \\(c=17\\).", loesung:15, toleranz:0, tipp:"\\(a^2=c^2-b^2=289-64\\).", loesungsweg:"Gesucht ist eine Kathete, also wird vom Hypotenusenquadrat abgezogen: $$a=\\sqrt{17^2-8^2}=\\sqrt{289-64}=\\sqrt{225}=15$$" },
      { id:10, level:2, typ:"numerisch", frage:"Kathete \\(b\\) für \\(a=7\\), \\(c=25\\).", loesung:24, toleranz:0, tipp:"\\(b^2=625-49\\).", loesungsweg:"$$b=\\sqrt{25^2-7^2}=\\sqrt{625-49}=\\sqrt{576}=24$$" },
      { id:11, level:2, typ:"numerisch", frage:"Berechne \\(c\\) für \\(a=1\\), \\(b=1\\). Runde auf 2 Dezimalen.", loesung:1.41, toleranz:0.02, tipp:"\\(\\sqrt{2}\\).", loesungsweg:"$$c=\\sqrt{2}\\approx 1{,}41$$" },
      { id:12, level:2, typ:"mc", frage:"Ein Dreieck hat Seiten \\(3, 4, 5\\). Ist es rechtwinklig?", optionen:["Ja","Nein","Nur bei Gleichseitigkeit","Nicht bestimmbar"], korrekt:0, tipp:"Prüfe \\(3^2+4^2=5^2\\).", loesungsweg:"\\(9+16=25\\) ✓ also <b>rechtwinklig</b>." },
      // LEVEL 3
      { id:13, level:3, typ:"numerisch", frage:"Eine Leiter (\\(5\\,\\text{m}\\)) steht \\(3\\,\\text{m}\\) von der Wand. Wie hoch reicht sie? (in m)", loesung:4, toleranz:0.01, tipp:"\\(h^2+3^2=5^2\\).", loesungsweg:"Die Leiter ist die Hypotenuse, der Wandabstand eine Kathete: $$h=\\sqrt{5^2-3^2}=\\sqrt{25-9}=\\sqrt{16}=4\\,\\text{m}$$" },
      { id:14, level:3, typ:"numerisch", frage:"Diagonale eines Rechtecks \\(6\\times 8\\). In cm.", loesung:10, toleranz:0, tipp:"Pythagoras im Rechteck.", loesungsweg:"Die Diagonale ist Hypotenuse über den beiden Rechteckseiten: $$d=\\sqrt{6^2+8^2}=\\sqrt{36+64}=\\sqrt{100}=10\\,\\text{cm}$$" },
      { id:15, level:3, typ:"numerisch", frage:"Diagonale eines Quadrats mit Seite \\(a=4\\). Runde auf 2 Dezimalen.", loesung:5.66, toleranz:0.02, tipp:"Beide Katheten sind \\(4\\).", loesungsweg:"Die Diagonale ist Hypotenuse über zwei Quadratseiten: $$d=\\sqrt{4^2+4^2}=\\sqrt{32}\\approx 5{,}66$$" },
      { id:16, level:3, typ:"mc", frage:"Welches Tripel ist ein pythagoreisches?", optionen:["\\((2,3,4)\\)","\\((5,12,13)\\)","\\((4,5,7)\\)","\\((6,7,8)\\)"], korrekt:1, tipp:"Prüfe \\(a^2+b^2=c^2\\).", loesungsweg:"\\(25+144=169=13^2\\) ✓" },
      { id:17, level:3, typ:"numerisch", frage:"Höhe eines gleichseitigen Dreiecks mit Seite \\(a=6\\). Runde auf 2 Dezimalen.", loesung:5.20, toleranz:0.03, tipp:"Die Höhe halbiert die Grundseite: Katheten \\(3\\) und \\(h\\), Hypotenuse \\(6\\).", loesungsweg:"Die Höhe teilt das Dreieck in zwei rechtwinklige Dreiecke mit Hypotenuse \\(6\\) und Kathete \\(3\\): $$h=\\sqrt{6^2-3^2}=\\sqrt{36-9}=\\sqrt{27}\\approx 5{,}20$$" },
      { id:18, level:3, typ:"numerisch", frage:"Ein Mast ist mit Seil (\\(13\\,\\text{m}\\)) gesichert, Fußpunkt \\(5\\,\\text{m}\\) entfernt. Masthöhe in m?", loesung:12, toleranz:0, tipp:"\\(h^2=169-25\\).", loesungsweg:"Seil = Hypotenuse, Abstand am Boden = Kathete: $$h=\\sqrt{13^2-5^2}=\\sqrt{169-25}=\\sqrt{144}=12\\,\\text{m}$$" },
      // LEVEL 4
      { id:19, level:4, typ:"numerisch", frage:"Ein Drachen steigt an einer straff gespannten, \\(50\\,\\text{m}\\) langen Schnur, die am Boden festgehalten wird. Der Punkt am Boden senkrecht unter dem Drachen ist \\(30\\,\\text{m}\\) von der Haltestelle entfernt. Wie hoch fliegt der Drachen (in m)?", loesung:40, toleranz:0.01, tipp:"Schnur, Bodenstrecke und Höhe bilden ein rechtwinkliges Dreieck — welche Seite ist die Hypotenuse?", loesungsweg:"Die Schnur ist die Hypotenuse, die Bodenstrecke eine Kathete, die Höhe die andere: $$h^2 = 50^2 - 30^2 = 2500 - 900 = 1600$$ $$h = \\sqrt{1600} = 40\\,\\text{m}$$" },
      { id:20, level:4, typ:"numerisch", frage:"Ein Rechteck ist \\(10\\,\\text{cm}\\) breit und hat eine \\(26\\,\\text{cm}\\) lange Diagonale. Wie groß ist sein Flächeninhalt in cm\\(^2\\)?", loesung:240, toleranz:0, tipp:"Die Diagonale teilt das Rechteck in zwei rechtwinklige Dreiecke.", loesungsweg:"Die Länge \\(l\\) ergibt sich aus dem rechtwinkligen Dreieck mit der Diagonalen als Hypotenuse: $$l^2 = 26^2 - 10^2 = 676 - 100 = 576 \\implies l = 24\\,\\text{cm}$$ $$A = 24 \\cdot 10 = 240\\,\\text{cm}^2$$" },
      { id:21, level:4, typ:"mc", frage:"In einem rechtwinkligen Dreieck ist die Hypotenuse \\(13\\,\\text{cm}\\) und eine Kathete \\(5\\,\\text{cm}\\) lang. Welche Rechnung liefert die andere Kathete?", optionen:["\\(\\sqrt{13^2 + 5^2}\\)","\\(\\sqrt{13^2 - 5^2}\\)","\\(13 - 5\\)","\\(\\sqrt{(13 - 5)^2}\\)"], korrekt:1, tipp:"Die Hypotenuse ist die längste Seite — die gesuchte Kathete muss kürzer sein.", loesungsweg:"Aus \\(a^2 + b^2 = c^2\\) folgt für eine Kathete \\(b^2 = c^2 - a^2\\): $$b = \\sqrt{13^2 - 5^2} = \\sqrt{169 - 25} = \\sqrt{144} = 12\\,\\text{cm}$$ Die Summe \\(\\sqrt{13^2 + 5^2}\\) wäre nur richtig, wenn beide gegebenen Seiten Katheten wären. \\(13 - 5\\) und \\(\\sqrt{(13-5)^2}\\) sind beide \\(8\\) — Seitenlängen werden aber nicht einfach subtrahiert, sondern ihre Quadrate." },
      { id:22, level:4, typ:"numerisch", frage:"Ein Fußballplatz ist \\(100\\,\\text{m}\\) lang und \\(64\\,\\text{m}\\) breit. Wie lang ist der direkte Weg von einer Ecke zur gegenüberliegenden Ecke (in m, 1 Nachkommastelle)?", loesung:118.7, toleranz:0.1, tipp:"Der direkte Weg ist die Diagonale des Rechtecks.", loesungsweg:"Die Diagonale ist die Hypotenuse über den beiden Seiten: $$d = \\sqrt{100^2 + 64^2} = \\sqrt{10\\,000 + 4096} = \\sqrt{14\\,096} \\approx 118{,}7\\,\\text{m}$$ Der Umweg über die Seitenlinien wäre \\(164\\,\\text{m}\\)." },
      { id:23, level:4, typ:"numerisch", frage:"Ein Quadrat hat eine \\(10\\,\\text{cm}\\) lange Diagonale. Wie lang ist seine Seite in cm (2 Nachkommastellen)?", loesung:7.07, toleranz:0.02, tipp:"Beide Katheten sind gleich lang.", loesungsweg:"Die Diagonale ist Hypotenuse eines rechtwinkligen Dreiecks mit zwei gleich langen Katheten \\(a\\): $$a^2 + a^2 = 10^2 \\implies 2a^2 = 100 \\implies a^2 = 50$$ $$a = \\sqrt{50} \\approx 7{,}07\\,\\text{cm}$$" },
      { id:24, level:4, typ:"numerisch", frage:"Eine Rampe soll einen Höhenunterschied von \\(1{,}5\\,\\text{m}\\) auf einer waagerechten Strecke von \\(8\\,\\text{m}\\) überwinden. Wie lang ist die Rampe in m (2 Nachkommastellen)?", loesung:8.14, toleranz:0.02, tipp:"Höhe und waagerechte Strecke sind die Katheten.", loesungsweg:"Die Rampe ist die Hypotenuse: $$l = \\sqrt{8^2 + 1{,}5^2} = \\sqrt{64 + 2{,}25} = \\sqrt{66{,}25} \\approx 8{,}14\\,\\text{m}$$ Sie ist nur wenig länger als die waagerechte Strecke, weil die Steigung flach ist." },
      // LEVEL 5
      { id:25, level:5, typ:"mc", frage:"Für ein rechtwinkliges Dreieck mit der Hypotenuse \\(17\\,\\text{cm}\\) und einer Kathete \\(8\\,\\text{cm}\\) rechnet Jan: \\(x = \\sqrt{17^2 + 8^2} \\approx 18{,}79\\,\\text{cm}\\). Was ist dazu zu sagen?", optionen:["Die Rechnung ist richtig.","Falsch: Die Hypotenuse ist die längste Seite; die Kathete ist \\(\\sqrt{17^2 - 8^2} = 15\\,\\text{cm}\\).","Falsch: Man muss \\(17 - 8 = 9\\,\\text{cm}\\) rechnen.","Falsch: Das Ergebnis muss \\(\\sqrt{17 + 8} = 5\\,\\text{cm}\\) sein."], korrekt:1, tipp:"Kann eine Kathete länger sein als die Hypotenuse?", loesungsweg:"Jans Ergebnis ist länger als die Hypotenuse — das ist unmöglich, denn die Hypotenuse ist stets die längste Seite. Gegeben sind Hypotenuse und Kathete, gesucht ist die zweite Kathete: $$x = \\sqrt{17^2 - 8^2} = \\sqrt{289 - 64} = \\sqrt{225} = 15\\,\\text{cm}$$ Subtrahiert werden die <b>Quadrate</b>, nicht die Seitenlängen." },
      { id:26, level:5, typ:"numerisch", frage:"Ein Baum knickt im Sturm in \\(5\\,\\text{m}\\) Höhe ab. Die Spitze berührt den Boden \\(12\\,\\text{m}\\) vom Stamm entfernt, der abgeknickte Teil hängt noch am Stamm. Wie hoch war der Baum vor dem Sturm (in m)?", loesung:18, toleranz:0.01, tipp:"Der abgeknickte Teil ist die Hypotenuse — und er gehört zur ursprünglichen Höhe dazu.", loesungsweg:"Stamm (\\(5\\,\\text{m}\\)) und Bodenstrecke (\\(12\\,\\text{m}\\)) sind die Katheten, der abgeknickte Teil die Hypotenuse: $$s = \\sqrt{5^2 + 12^2} = \\sqrt{169} = 13\\,\\text{m}$$ Ursprüngliche Höhe: $$5 + 13 = 18\\,\\text{m}$$ Wer bei \\(13\\,\\text{m}\\) aufhört, hat nur den abgeknickten Teil." },
      { id:27, level:5, typ:"numerisch", frage:"Ein gleichschenkliges Dreieck hat den Umfang \\(36\\,\\text{cm}\\) und die Basis \\(16\\,\\text{cm}\\). Wie hoch ist es über der Basis (in cm)?", loesung:6, toleranz:0, tipp:"Erst die Schenkellänge aus dem Umfang.", loesungsweg:"Die beiden Schenkel teilen sich \\(36 - 16 = 20\\,\\text{cm}\\), jeder ist also \\(10\\,\\text{cm}\\) lang. Die Höhe halbiert die Basis: $$h = \\sqrt{10^2 - 8^2} = \\sqrt{36} = 6\\,\\text{cm}$$" },
      { id:28, level:5, typ:"mc", frage:"Lisa prüft, ob ein Dreieck mit den Seiten \\(5\\), \\(7\\) und \\(9\\) rechtwinklig ist: „\\(5^2 + 7^2 = 74\\) und \\(9^2 = 81\\) — das ist fast gleich, also ist es rechtwinklig.\" Was ist dazu zu sagen?", optionen:["Richtig, kleine Abweichungen sind erlaubt.","Falsch: Der Satz gilt exakt; wegen \\(74 \\neq 81\\) ist das Dreieck nicht rechtwinklig.","Falsch: Man muss \\(5^2 + 9^2\\) mit \\(7^2\\) vergleichen.","Richtig, denn \\(5 + 7 > 9\\)."], korrekt:1, tipp:"Der Kehrsatz verlangt Gleichheit, nicht Ähnlichkeit.", loesungsweg:"Ein Dreieck ist genau dann rechtwinklig, wenn \\(a^2 + b^2 = c^2\\) <b>exakt</b> gilt (\\(c\\) die längste Seite). Hier ist \\(74 < 81\\), das Dreieck ist also nicht rechtwinklig — der Winkel gegenüber der \\(9\\) ist sogar größer als \\(90°\\). Verglichen wird immer mit dem Quadrat der <b>längsten</b> Seite; \\(5 + 7 > 9\\) sagt nur, dass das Dreieck überhaupt existiert." },
      { id:29, level:5, typ:"numerisch", frage:"Über eine \\(6\\,\\text{m}\\) breite Straße wird ein Kabel gespannt: auf der einen Seite in \\(4\\,\\text{m}\\) Höhe befestigt, gegenüber in \\(6{,}5\\,\\text{m}\\) Höhe. Wie lang ist das straff gespannte Kabel in m?", loesung:6.5, toleranz:0.01, tipp:"Nur der Höhenunterschied bildet die senkrechte Kathete.", loesungsweg:"Der Höhenunterschied beträgt \\(6{,}5 - 4 = 2{,}5\\,\\text{m}\\), die Straßenbreite \\(6\\,\\text{m}\\): $$l = \\sqrt{6^2 + 2{,}5^2} = \\sqrt{36 + 6{,}25} = \\sqrt{42{,}25} = 6{,}5\\,\\text{m}$$" },
      { id:30, level:5, typ:"numerisch", frage:"Ein gleichschenkliges Dreieck hat die Basis \\(24\\,\\text{cm}\\) und die Höhe \\(5\\,\\text{cm}\\). Wie groß ist sein Umfang in cm?", loesung:50, toleranz:0, tipp:"Die Schenkel sind Hypotenusen über halber Basis und Höhe.", loesungsweg:"Die Höhe teilt das Dreieck in zwei rechtwinklige Dreiecke mit den Katheten \\(12\\,\\text{cm}\\) und \\(5\\,\\text{cm}\\): $$s = \\sqrt{12^2 + 5^2} = \\sqrt{169} = 13\\,\\text{cm}$$ $$U = 24 + 2 \\cdot 13 = 50\\,\\text{cm}$$" },
      // LEVEL 6
      { id:31, level:6, typ:"mc", frage:"Behauptung: „Verdoppelt man in einem rechtwinkligen Dreieck beide Katheten, so verdoppelt sich auch die Hypotenuse.\" Stimmt das?", optionen:["Ja: \\((2a)^2 + (2b)^2 = 4(a^2 + b^2) = (2c)^2\\).","Nein — die Hypotenuse vervierfacht sich, weil die Quadrate vervierfacht werden.","Nein — die Hypotenuse wächst nur um den Faktor \\(\\sqrt2\\).","Das gilt nur, wenn beide Katheten gleich lang sind."], korrekt:0, tipp:"Setze \\(2a\\) und \\(2b\\) in den Satz ein und klammere aus.", loesungsweg:"Mit den neuen Katheten \\(2a\\) und \\(2b\\): $$(2a)^2 + (2b)^2 = 4a^2 + 4b^2 = 4(a^2 + b^2) = 4c^2 = (2c)^2$$ Die neue Hypotenuse ist also \\(2c\\). Die <b>Quadrate</b> vervierfachen sich, die Längen selbst verdoppeln sich — für jedes rechtwinklige Dreieck, nicht nur für gleichschenklige. Beispiel: \\(3, 4, 5 \\to 6, 8, 10\\)." },
      { id:32, level:6, typ:"numerisch", frage:"Ein Rechteck hat den Umfang \\(34\\,\\text{cm}\\) und eine \\(13\\,\\text{cm}\\) lange Diagonale. Wie groß ist sein Flächeninhalt in cm\\(^2\\)?", loesung:60, toleranz:0, tipp:"Aus \\(a + b\\) und \\(a^2 + b^2\\) lässt sich \\(a \\cdot b\\) mit der ersten binomischen Formel gewinnen — ohne \\(a\\) und \\(b\\) einzeln zu kennen.", loesungsweg:"Aus dem Umfang: \\(a + b = 17\\). Aus der Diagonalen: \\(a^2 + b^2 = 169\\). Binomische Formel: $$(a + b)^2 = a^2 + 2ab + b^2 \\implies 289 = 169 + 2ab$$ $$2ab = 120 \\implies A = ab = 60\\,\\text{cm}^2$$ Zur Kontrolle: Die Seiten sind \\(5\\) und \\(12\\), und \\(5^2 + 12^2 = 13^2\\) ✓" },
      { id:33, level:6, typ:"numerisch", frage:"Ein Dreieck hat die Seiten \\(8\\,\\text{cm}\\), \\(15\\,\\text{cm}\\) und \\(x\\,\\text{cm}\\) und ist rechtwinklig. Es gibt zwei mögliche Werte für \\(x\\). Gib den <b>kleineren</b> an (2 Nachkommastellen).", loesung:12.69, toleranz:0.02, tipp:"Entweder ist \\(x\\) die Hypotenuse — oder die \\(15\\).", loesungsweg:"Fall 1: \\(x\\) ist die Hypotenuse: \\(x = \\sqrt{8^2 + 15^2} = \\sqrt{289} = 17\\). Fall 2: Die \\(15\\) ist die Hypotenuse und \\(x\\) eine Kathete: $$x = \\sqrt{15^2 - 8^2} = \\sqrt{225 - 64} = \\sqrt{161} \\approx 12{,}69\\,\\text{cm}$$ Der kleinere Wert ist \\(12{,}69\\). Ohne Angabe, welche Seite dem rechten Winkel gegenüberliegt, muss man beide Fälle betrachten." },
      { id:34, level:6, typ:"mc", frage:"Behauptung: „Ein Dreieck mit den Seiten \\(6\\), \\(8\\) und \\(11\\) hat einen stumpfen Winkel, weil \\(6^2 + 8^2 < 11^2\\) ist.\" Stimmt das?", optionen:["Ja — \\(100 < 121\\): Die längste Seite ist länger, als sie bei einem rechten Winkel wäre, also ist der Winkel gegenüber größer als \\(90°\\).","Nein — das Dreieck ist spitzwinklig, weil alle Seiten verschieden lang sind.","Nein — das Dreieck ist rechtwinklig, weil \\(6, 8, 10\\) ein pythagoreisches Tripel ist.","Nein — die Ungleichung sagt nichts über die Winkel aus."], korrekt:0, tipp:"Vergleiche mit dem Dreieck \\(6, 8, 10\\): Was passiert mit dem Winkel, wenn die dritte Seite länger wird?", loesungsweg:"Bei \\(6, 8, 10\\) ist der Winkel zwischen den Seiten \\(6\\) und \\(8\\) genau \\(90°\\). Wird die dritte Seite auf \\(11\\) verlängert, müssen sich die Seiten \\(6\\) und \\(8\\) weiter öffnen — der Winkel wird <b>stumpf</b>. Allgemein: \\(a^2 + b^2 < c^2\\) bedeutet stumpfwinklig, \\(a^2 + b^2 > c^2\\) spitzwinklig, Gleichheit rechtwinklig (jeweils \\(c\\) die längste Seite). Die Ungleichung sagt also sehr wohl etwas über den Winkel aus." },
      { id:35, level:6, typ:"numerisch", frage:"Ein Quader ist \\(12\\,\\text{cm}\\) lang und \\(4\\,\\text{cm}\\) breit. Seine Raumdiagonale — die längste Strecke von Ecke zu Ecke durch das Innere — ist \\(13\\,\\text{cm}\\) lang. Wie hoch ist der Quader in cm?", loesung:3, toleranz:0.01, tipp:"Zweimal Pythagoras: erst die Bodendiagonale, dann die Raumdiagonale.", loesungsweg:"Bodendiagonale: $$d^2 = 12^2 + 4^2 = 144 + 16 = 160$$ Die Raumdiagonale ist Hypotenuse über Bodendiagonale und Höhe: $$h^2 = 13^2 - d^2 = 169 - 160 = 9 \\implies h = 3\\,\\text{cm}$$ Die Bodendiagonale selbst (\\(\\sqrt{160}\\)) muss dabei gar nicht ausgerechnet werden — ihr Quadrat genügt." },
      { id:36, level:6, typ:"numerisch", frage:"Ein gleichseitiges Dreieck hat die Höhe \\(6\\,\\text{cm}\\). Wie lang ist seine Seite in cm (2 Nachkommastellen)?", loesung:6.93, toleranz:0.02, tipp:"Die Höhe halbiert die Seite — beide Katheten hängen von derselben Unbekannten ab.", loesungsweg:"Die Höhe teilt das Dreieck in zwei rechtwinklige Dreiecke mit Hypotenuse \\(a\\) und Katheten \\(\\tfrac a2\\) und \\(6\\): $$a^2 = \\left(\\tfrac{a}{2}\\right)^2 + 6^2 \\implies a^2 - \\tfrac{a^2}{4} = 36 \\implies \\tfrac34 a^2 = 36$$ $$a^2 = 48 \\implies a = \\sqrt{48} \\approx 6{,}93\\,\\text{cm}$$ Probe: \\(\\sqrt{6{,}93^2 - 3{,}46^2} \\approx 6\\) ✓" }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
