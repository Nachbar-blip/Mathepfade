      // LEVEL 1

      { id:3, level:1, typ:"mc", frage:"In \\(a^2+b^2=c^2\\): Was ist \\(c\\)?", optionen:["Kathete","Hypotenuse","Winkel","Höhe"], korrekt:1, tipp:"Die Seite gegenüber dem rechten Winkel.", loesungsweg:"\\(c\\) ist die <b>Hypotenuse</b>." },
      { id:4, level:1, typ:"numerisch", frage:"Berechne \\(c\\) für \\(a=3\\), \\(b=4\\).", loesung:5, toleranz:0, tipp:"\\(9+16=25\\), dann Wurzel.", loesungsweg:"$$c=\\sqrt{3^2+4^2}=\\sqrt{25}=5$$" },

      { id:10, level:2, typ:"numerisch", frage:"Kathete \\(b\\) für \\(a=7\\), \\(c=25\\).", loesung:24, toleranz:0, tipp:"\\(b^2=625-49\\).", loesungsweg:"$$b=\\sqrt{576}=24$$" },

      { id:28, level:5, typ:"numerisch", frage:"Ein Kabel spannt sich von einem \\(20\\,\\text{m}\\) hohen Mast zu einem \\(5\\,\\text{m}\\) hohen Mast, Abstand \\(8\\,\\text{m}\\). Kabellänge in m?", loesung:17, toleranz:0.01, tipp:"Höhendifferenz \\(15\\), Abstand \\(8\\).", loesungsweg:"$$L=\\sqrt{15^2+8^2}=\\sqrt{289}=17$$" },

      { id:34, level:6, typ:"numerisch", frage:"Dreieck \\(A(0|0), B(6|0), C(3|4)\\). Ist es rechtwinklig? Wenn ja, gib die Hypotenusenlänge, sonst \\(0\\).", loesung:0, toleranz:0, tipp:"Seiten: 6, 5, 5. \\(25+25\\ne 36\\).", loesungsweg:"\\(|AB|=6, |AC|=5, |BC|=5\\). \\(5^2+5^2=50\\ne 36\\). Nicht rechtwinklig: Antwort 0." },
