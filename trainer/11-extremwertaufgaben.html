<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extremwertaufgaben - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-extremwertaufgaben';
    const THEMA_CONFIG = { name: 'Extremwertaufgaben', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 -- Grundlagen
      { id:1, level:1, typ:"mc", frage:"Notwendige Bedingung für eine Extremstelle?", optionen:["\\(f(x_0)=0\\)","\\(f'(x_0)=0\\)","\\(f''(x_0)=0\\)","\\(f'''(x_0)=0\\)"], korrekt:1, tipp:"Erste Ableitung.", loesungsweg:"An einer Extremstelle verläuft die Tangente waagerecht: $$f'(x_0) = 0$$ Die Bedingung ist notwendig, aber nicht hinreichend — auch der Sattelpunkt von \\(f(x) = x^3\\) bei \\(x_0 = 0\\) erfüllt sie, ohne ein Extremum zu sein." },
      { id:2, level:1, typ:"mc", frage:"Hinreichend für Hochpunkt:", optionen:["\\(f'(x_0)=0\\) und \\(f''(x_0)>0\\)","\\(f'(x_0)=0\\) und \\(f''(x_0)<0\\)","\\(f''(x_0)=0\\)","\\(f(x_0)=0\\)"], korrekt:1, tipp:"Zweite Ableitung negativ = Linkskrümmung… Rechts.", loesungsweg:"Zur waagerechten Tangente muss Rechtskrümmung hinzukommen, damit der Graph sich nach unten öffnet: $$f'(x_0) = 0 \\quad\\text{und}\\quad f''(x_0) < 0 \\;\\Rightarrow\\; \\text{Hochpunkt}$$ Beide Bedingungen zusammen sind hinreichend; eine Vorzeichentabelle erübrigt sich dann." },
      { id:3, level:1, typ:"mc", frage:"Hinreichend für Tiefpunkt:", optionen:["\\(f''(x_0)<0\\)","\\(f''(x_0)>0\\)","\\(f''(x_0)=0\\)","\\(f'(x_0)>0\\)"], korrekt:1, tipp:"Linkskrümmung.", loesungsweg:"$$f'(x_0) = 0 \\quad\\text{und}\\quad f''(x_0) > 0 \\;\\Rightarrow\\; \\text{Tiefpunkt}$$ Positive zweite Ableitung heißt Linkskrümmung — der Graph öffnet sich nach oben wie eine Schüssel." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=x^2-4x\\). Extremstelle?", loesung:2, toleranz:0, tipp:"\\(2x-4=0\\).", loesungsweg:"$$f'(x) = 2x-4 = 0 \\;\\Rightarrow\\; x = 2$$ Wegen \\(f''(x) = 2 > 0\\) handelt es sich um einen Tiefpunkt — den Scheitel der nach oben geöffneten Parabel." },
      { id:5, level:1, typ:"numerisch", frage:"\\(f(x)=x^2-4x\\). Extremwert (y-Wert)?", loesung:-4, toleranz:0, tipp:"\\(f(2)\\).", loesungsweg:"\\(f(2)=4-8=-4\\)." },
      { id:6, level:1, typ:"mc", frage:"Was ist die „Zielfunktion\"?", optionen:["Die Nebenbedingung","Die zu optimierende Größe","Die Definitionsmenge","Die Ableitung"], korrekt:1, tipp:"Name: Ziel.", loesungsweg:"Die Zielfunktion beschreibt die zu maximierende/minimierende Größe." },
      // LEVEL 2 -- Rechteckoptimierung
      { id:7, level:2, typ:"numerisch", frage:"Rechteck mit Umfang 20. Maximale Fläche bei Seite \\(a=?\\)", loesung:5, toleranz:0, tipp:"Quadrat maximiert.", loesungsweg:"\\(a=b=5\\)." },
      { id:8, level:2, typ:"numerisch", frage:"Rechteck mit Umfang 20: maximaler Flächeninhalt?", loesung:25, toleranz:0, tipp:"\\(5\\cdot5\\).", loesungsweg:"Mit dem Umfang \\(2a+2b = 20\\) folgt \\(b = 10-a\\), die Zielfunktion lautet also $$A(a) = a(10-a) = 10a - a^2$$ $$A'(a) = 10-2a = 0 \\;\\Rightarrow\\; a = 5$$ Wegen \\(A'' = -2 < 0\\) ist das ein Maximum: \\(A = 5 \\cdot 5 = 25\\). Unter allen Rechtecken mit gleichem Umfang hat stets das <b>Quadrat</b> die größte Fläche." },
      { id:9, level:2, typ:"numerisch", frage:"Rechteck mit Fläche 36, minimaler Umfang?", loesung:24, toleranz:0, tipp:"Quadrat mit \\(a=6\\).", loesungsweg:"\\(a=b=6\\), \\(U=24\\)." },
      { id:10, level:2, typ:"numerisch", frage:"Von 24m Zaun: Rechteck an einer Wand (3 Seiten). Maximalfläche bei Breite \\(b=?\\)", loesung:6, toleranz:0, tipp:"\\(A=b(24-2b)\\), Maximum.", loesungsweg:"\\(A'(b)=24-4b=0 \\Rightarrow b=6\\)." },
      { id:11, level:2, typ:"numerisch", frage:"24m Zaun, 3 Seiten: maximaler Flächeninhalt?", loesung:72, toleranz:0, tipp:"\\(b=6\\), \\(l=12\\).", loesungsweg:"\\(A=6\\cdot12=72\\)." },
      { id:12, level:2, typ:"mc", frage:"Vorgehen Extremwertaufgabe:", optionen:["Zielfunktion, Nebenbedingung, Eine Variable, Ableiten","Ableiten, Integrieren","Gleichung, Einsetzen","Skizze, Ergebnis"], korrekt:0, tipp:"Standardschema.", loesungsweg:"Zielfunktion → Nebenbedingung einsetzen → 1 Variable → Ableiten → Extremum." },
      // LEVEL 3 -- Volumenoptimierung
      { id:13, level:3, typ:"numerisch", frage:"Quadratische Schachtel ohne Deckel, Oberfläche 300. Kantenlänge Grundseite für max. V? (\\(V=a^2h\\), \\(O=a^2+4ah\\))", loesung:10, toleranz:0, tipp:"\\(V(a)=\\frac{a(300-a^2)}{4}\\), ableiten.", loesungsweg:"\\(V'(a)=\\frac{300-3a^2}{4}=0 \\Rightarrow a=10\\)." },
      { id:14, level:3, typ:"numerisch", frage:"Zylinder: Oberfläche \\(O=6\\pi\\), Volumen maximal. Radius?", loesung:1, toleranz:0.01, tipp:"\\(r=h\\) bei Extremum mit \\(O=2\\pi r^2+2\\pi rh\\).", loesungsweg:"Rechnung ergibt \\(r=1\\), \\(h=2\\)… Prüfen: mit \\(O=6\\pi\\), \\(V_{\\max}\\) bei \\(r=1\\)." },
      { id:15, level:3, typ:"numerisch", frage:"Rechteck unter Parabel \\(y=4-x^2\\), Achsen-symmetrisch. Fläche max. bei \\(x=?\\)", loesung:1.1547, toleranz:0.1, tipp:"\\(A(x)=2x(4-x^2)\\), ableiten.", loesungsweg:"\\(A'(x)=8-6x^2=0 \\Rightarrow x=\\sqrt{4/3}\\approx 1{,}15\\)." },
      { id:16, level:3, typ:"numerisch", frage:"Aus Quadrat Seite 12 cm an Ecken kleine Quadrate (Seite \\(x\\)) ausschneiden, Box falten. V maximal bei \\(x=?\\)", loesung:2, toleranz:0, tipp:"\\(V=(12-2x)^2 x\\), ableiten.", loesungsweg:"\\(V'(x)=12(x-2)(x-6)=0\\), \\(x=2\\)." },
      { id:17, level:3, typ:"numerisch", frage:"Aus einem Quadrat (Seite 12 cm) werden an den Ecken Quadrate (Seite \\(x=2\\)) ausgeschnitten und zur offenen Box gefaltet. \\(V_{\\max}\\) (cm³)?", loesung:128, toleranz:0, tipp:"\\(V=8^2\\cdot 2\\).", loesungsweg:"\\(V=64\\cdot2=128\\)." },
      { id:18, level:3, typ:"mc", frage:"Welche Ableitung prüft, ob Maximum?", optionen:["\\(f'\\)","\\(f''<0\\)","\\(f''>0\\)","\\(f'''\\)"], korrekt:1, tipp:"Rechtskrümmung.", loesungsweg:"Ob eine Stelle mit waagerechter Tangente ein Maximum ist, entscheidet die Krümmung: $$f''(x_0) < 0 \\;\\Rightarrow\\; \\text{Maximum}$$ Die erste Ableitung liefert nur die Kandidaten, nicht ihre Art." },
      // LEVEL 4 -- komplexere NB
      { id:19, level:4, typ:"numerisch", frage:"Punkt \\(P(x|x^2)\\) auf Parabel mit minimalem Abstand zu \\(A(4|0)\\). \\(x\\)?", loesung:1.1, toleranz:0.1, tipp:"\\(d^2=(x-4)^2+x^4\\), ableiten.", loesungsweg:"\\(2(x-4)+4x^3=0\\), einzige reelle Lösung \\(x\\approx 1{,}128\\) (gerundet \\(1{,}1\\))." },
      { id:20, level:4, typ:"numerisch", frage:"Dreieck unter \\(y=6-x\\) im 1. Quadranten mit rechtem Winkel im Ursprung. \\(x\\) für max Fläche?", loesung:3, toleranz:0, tipp:"\\(A=\\frac{1}{2}x(6-x)\\).", loesungsweg:"\\(A'=3-x=0 \\Rightarrow x=3\\)." },
      { id:21, level:4, typ:"numerisch", frage:"Bauernhof: Zaun 100m, max. Rechteckfläche?", loesung:625, toleranz:0, tipp:"Quadrat 25×25.", loesungsweg:"Bei \\(100\\,\\text{m}\\) Zaun ist \\(2a+2b = 100\\), also \\(b = 50-a\\): $$A(a) = a(50-a), \\quad A'(a) = 50-2a = 0 \\;\\Rightarrow\\; a = 25$$ $$A_{\\max} = 25 \\cdot 25 = 625\\,\\text{m}^2$$ Wieder gewinnt das Quadrat — dieselbe Struktur wie beim Umfang \\(20\\), nur mit anderen Zahlen." },
      { id:22, level:4, typ:"numerisch", frage:"Dose (Zylinder) mit V=1L=1000cm³. Oberfläche minimal bei \\(r\\) (cm, gerundet)?", loesung:5.42, toleranz:0.2, tipp:"\\(h=2r\\) im Optimum: \\(r=\\sqrt[3]{V/(2\\pi)}\\).", loesungsweg:"Nebenbedingung \\(V = \\pi r^2 h = 1000\\), also \\(h = \\tfrac{1000}{\\pi r^2}\\). Eingesetzt in die Oberfläche: $$O(r) = 2\\pi r^2 + 2\\pi r h = 2\\pi r^2 + \\frac{2000}{r}$$ $$O'(r) = 4\\pi r - \\frac{2000}{r^2} = 0 \\;\\Rightarrow\\; r^3 = \\frac{500}{\\pi}$$ $$r = \\sqrt[3]{\\frac{500}{\\pi}} \\approx 5{,}42\\,\\text{cm}$$ Im Optimum gilt \\(h = 2r\\) — die Dose ist also genau so hoch wie breit. Reale Konservendosen sind schlanker, weil Deckel und Boden mehr Material kosten als der Mantel." },
      { id:23, level:4, typ:"numerisch", frage:"Rechteck mit Fläche 100, minimaler Umfang?", loesung:40, toleranz:0, tipp:"Quadrat \\(a=10\\).", loesungsweg:"Mit \\(ab = 100\\) ist \\(b = \\tfrac{100}{a}\\): $$U(a) = 2a + \\frac{200}{a}, \\quad U'(a) = 2 - \\frac{200}{a^2} = 0 \\;\\Rightarrow\\; a^2 = 100 \\;\\Rightarrow\\; a = 10$$ $$U_{\\min} = 2 \\cdot 10 + 2 \\cdot 10 = 40$$ Auch hier ist das Quadrat optimal — die Umkehrung von Aufgabe 8." },
      { id:24, level:4, typ:"numerisch", frage:"Offene Schachtel, quadratische Grundseite, V=32. Min. Oberfläche bei \\(a=?\\)", loesung:4, toleranz:0, tipp:"\\(O=a^2+\\frac{128}{a}\\), ableiten.", loesungsweg:"\\(2a-128/a^2=0 \\Rightarrow a^3=64 \\Rightarrow a=4\\)." },
      // LEVEL 5 -- Transfer
      { id:25, level:5, typ:"numerisch", frage:"Aus Rechteckblech 8×5 an allen Ecken Quadrat Seite \\(x\\), Box falten. \\(V'=0\\) für \\(x=?\\) (kleine Lösung, gerundet)", loesung:1, toleranz:0.1, tipp:"\\(V=(8-2x)(5-2x)x\\).", loesungsweg:"\\(V'=12x^2-52x+40=0 \\Rightarrow x\\approx 1{,}0\\)." },
      { id:26, level:5, typ:"numerisch", frage:"Punkt auf \\(y=\\sqrt{x}\\) mit min. Abstand zu \\((2|0)\\). \\(x\\)?", loesung:1.5, toleranz:0.1, tipp:"\\(d^2=(x-2)^2+x\\).", loesungsweg:"\\(2(x-2)+1=0 \\Rightarrow x=1{,}5\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Drahtstück 40cm in 2 Teile: Quadrat + Kreis. Min. Gesamtfläche bei Quadratseite (gerundet)?", loesung:5.6, toleranz:0.3, tipp:"\\(x=\\) Quadratseite, Ableiten.", loesungsweg:"Ist \\(x\\) die Quadratseite, so verbraucht das Quadrat \\(4x\\) und der Kreis \\(40-4x = 2\\pi r\\), also \\(r = \\tfrac{40-4x}{2\\pi}\\). Die Gesamtfläche $$A(x) = x^2 + \\pi r^2 = x^2 + \\frac{(40-4x)^2}{4\\pi}$$ hat die Ableitung \\(A'(x) = 2x - \\tfrac{2(40-4x)}{\\pi}\\). Nullsetzen liefert $$x = \\frac{40}{4+\\pi} \\approx 5{,}6\\,\\text{cm}$$ Wegen \\(A'' > 0\\) ist das ein Minimum. Das <b>Maximum</b> läge am Rand — wenn der ganze Draht zum Kreis wird." },
      { id:28, level:5, typ:"numerisch", frage:"Rechteck unter Parabel \\(y=9-x^2\\), symmetrisch zur y-Achse. Max. Fläche bei \\(x=?\\)", loesung:1.732, toleranz:0.1, tipp:"\\(A=2x(9-x^2)\\).", loesungsweg:"\\(18-6x^2=0 \\Rightarrow x=\\sqrt{3}\\approx 1{,}73\\)." },
      { id:29, level:5, typ:"numerisch", frage:"Maximales Rechteck unter \\(y=9-x^2\\): Flächeninhalt? (gerundet)", loesung:20.78, toleranz:0.5, tipp:"\\(A=2\\sqrt{3}\\cdot 6\\).", loesungsweg:"Aus Symmetriegründen reicht das Rechteck von \\(-x\\) bis \\(x\\), seine Höhe ist \\(9-x^2\\): $$A(x) = 2x(9-x^2) = 18x - 2x^3$$ $$A'(x) = 18-6x^2 = 0 \\;\\Rightarrow\\; x^2 = 3 \\;\\Rightarrow\\; x = \\sqrt3$$ $$A = 2\\sqrt3 \\cdot 6 = 12\\sqrt3 \\approx 20{,}78$$ Die Höhe \\(9-3 = 6\\) ist dabei gerade zwei Drittel der Parabelhöhe — das gilt bei jeder solchen Parabel." },
      { id:30, level:5, typ:"mc", frage:"Bei der Randwertbetrachtung prüft man:", optionen:["Nur innere Extrema","Funktionswerte an den Rändern des Definitionsbereichs","Nur die 2. Ableitung","Die Umkehrfunktion"], korrekt:1, tipp:"Auch Ränder können Extrema sein.", loesungsweg:"Randextrema müssen verglichen werden." },
      // LEVEL 6 -- Anwendungen
      { id:31, level:6, typ:"numerisch", frage:"Gewinn \\(G(x)=-x^2+100x-500\\). Max. Gewinn bei \\(x=?\\)", loesung:50, toleranz:0, tipp:"\\(G'(x)=-2x+100\\).", loesungsweg:"$$G'(x) = -2x+100 = 0 \\;\\Rightarrow\\; x = 50$$ Wegen \\(G'' = -2 < 0\\) liegt dort tatsächlich das Gewinnmaximum." },
      { id:32, level:6, typ:"numerisch", frage:"Gewinn \\(G(x)=-x^2+100x-500\\): maximaler Gewinn (y-Wert bei \\(x=50\\))?", loesung:2000, toleranz:0, tipp:"\\(G(50)=-2500+5000-500\\).", loesungsweg:"Einsetzen der gewinnmaximalen Menge \\(x = 50\\) in \\(G(x) = -x^2+100x-500\\): $$G(50) = -2500 + 5000 - 500 = 2000$$ Die Stelle des Maximums und der Maximalwert sind streng zu unterscheiden: \\(x = 50\\) ist die Menge, \\(2000\\) der Gewinn." },
      { id:33, level:6, typ:"numerisch", frage:"Kosten \\(K(x)=x^2-20x+150\\). Min. Kosten bei \\(x=?\\)", loesung:10, toleranz:0, tipp:"\\(K'(x)=0\\).", loesungsweg:"$$K'(x) = 2x-20 = 0 \\;\\Rightarrow\\; x = 10$$ Wegen \\(K'' = 2 > 0\\) handelt es sich um ein Minimum." },
      { id:34, level:6, typ:"numerisch", frage:"Kosten \\(K(x)=x^2-20x+150\\): minimaler Kostenwert?", loesung:50, toleranz:0, tipp:"\\(K(10)\\).", loesungsweg:"Einsetzen von \\(x = 10\\) in \\(K(x) = x^2-20x+150\\): $$K(10) = 100 - 200 + 150 = 50$$ Die Kosten sinken also nicht auf null — die Fixkosten von \\(150\\) lassen sich durch die Menge nicht vollständig ausgleichen." },
      { id:35, level:6, typ:"numerisch", frage:"Zwei positive Zahlen mit Summe 10, Produkt maximal. Eine der Zahlen?", loesung:5, toleranz:0, tipp:"\\(P=x(10-x)\\).", loesungsweg:"\\(x=5\\), \\(P=25\\)." },
      { id:36, level:6, typ:"numerisch", frage:"Kürzester Abstand von \\((0|3)\\) zur Geraden \\(y=x\\)?", loesung:2.121, toleranz:0.1, tipp:"Lotfußpunkt.", loesungsweg:"Der kürzeste Abstand wird auf dem Lot gemessen. Der Punkt der Geraden \\(y = x\\) hat die Form \\((t|t)\\), der quadrierte Abstand ist $$d^2(t) = t^2 + (t-3)^2 = 2t^2 - 6t + 9$$ $$\\left(d^2\\right)'(t) = 4t-6 = 0 \\;\\Rightarrow\\; t = 1{,}5$$ $$d = \\sqrt{2{,}25 + 2{,}25} = \\frac{3}{\\sqrt2} \\approx 2{,}121$$ Es genügt, das <b>Quadrat</b> des Abstands zu minimieren — die Wurzel ist streng monoton und verschiebt die Minimalstelle nicht." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
