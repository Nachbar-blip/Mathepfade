<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Extremwertaufgaben - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-extremwertaufgaben';
    const THEMA_CONFIG = { name: 'Extremwertaufgaben', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 -- Grundlagen
      { id:1, level:1, typ:"mc", frage:"Notwendige Bedingung für eine Extremstelle?", optionen:["\\(f(x_0)=0\\)","\\(f'(x_0)=0\\)","\\(f''(x_0)=0\\)","\\(f'''(x_0)=0\\)"], korrekt:1, tipp:"Erste Ableitung.", loesungsweg:"An einer Extremstelle verläuft die Tangente waagerecht: $$f'(x_0) = 0$$ Die Bedingung ist notwendig, aber nicht hinreichend — auch der Sattelpunkt von \\(f(x) = x^3\\) bei \\(x_0 = 0\\) erfüllt sie, ohne ein Extremum zu sein." },
      { id:2, level:1, typ:"mc", frage:"Hinreichend für Hochpunkt:", optionen:["\\(f'(x_0)=0\\) und \\(f''(x_0)>0\\)","\\(f'(x_0)=0\\) und \\(f''(x_0)<0\\)","\\(f''(x_0)=0\\)","\\(f(x_0)=0\\)"], korrekt:1, tipp:"Zweite Ableitung negativ = Linkskrümmung… Rechts.", loesungsweg:"Zur waagerechten Tangente muss Rechtskrümmung hinzukommen, damit der Graph sich nach unten öffnet: $$f'(x_0) = 0 \\quad\\text{und}\\quad f''(x_0) < 0 \\;\\Rightarrow\\; \\text{Hochpunkt}$$ Beide Bedingungen zusammen sind hinreichend; eine Vorzeichentabelle erübrigt sich dann." },
      { id:3, level:1, typ:"mc", frage:"Hinreichend für Tiefpunkt:", optionen:["\\(f''(x_0)<0\\)","\\(f''(x_0)>0\\)","\\(f''(x_0)=0\\)","\\(f'(x_0)>0\\)"], korrekt:1, tipp:"Linkskrümmung.", loesungsweg:"$$f'(x_0) = 0 \\quad\\text{und}\\quad f''(x_0) > 0 \\;\\Rightarrow\\; \\text{Tiefpunkt}$$ Positive zweite Ableitung heißt Linkskrümmung — der Graph öffnet sich nach oben wie eine Schüssel." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=x^2-4x\\). Extremstelle?", loesung:2, toleranz:0, tipp:"\\(2x-4=0\\).", loesungsweg:"$$f'(x) = 2x-4 = 0 \\;\\Rightarrow\\; x = 2$$ Wegen \\(f''(x) = 2 > 0\\) handelt es sich um einen Tiefpunkt — den Scheitel der nach oben geöffneten Parabel." },
      { id:5, level:1, typ:"numerisch", frage:"\\(f(x)=x^2-4x\\). Extremwert (y-Wert)?", loesung:-4, toleranz:0, tipp:"Erst die Extremstelle, dann den Funktionswert dort.", loesungsweg:"Die Extremstelle folgt aus \\(f'(x) = 2x-4 = 0\\), also \\(x = 2\\). Der Extrem<b>wert</b> ist der zugehörige Funktionswert: $$f(2) = 2^2 - 4 \\cdot 2 = 4 - 8 = -4$$ Extremstelle und Extremwert sind zu unterscheiden: \\(x = 2\\) ist die Stelle, \\(-4\\) der Wert." },
      { id:6, level:1, typ:"mc", frage:"Was ist die „Zielfunktion\"?", optionen:["Die Nebenbedingung","Die zu optimierende Größe","Die Definitionsmenge","Die Ableitung"], korrekt:1, tipp:"Der Name sagt es: sie beschreibt das Ziel der Aufgabe.", loesungsweg:"Die Zielfunktion beschreibt genau die Größe, die groß oder klein werden soll — bei einer Flächenaufgabe also \\(A\\), bei einer Materialaufgabe die Oberfläche \\(O\\). Zunächst hängt sie von zwei Variablen ab; erst die <b>Nebenbedingung</b> (etwa ein vorgegebener Umfang) macht daraus eine Funktion einer Variablen, die man ableiten kann." },
      // LEVEL 2 -- Rechteckoptimierung
      { id:7, level:2, typ:"numerisch", frage:"Rechteck mit Umfang 20. Maximale Fläche bei Seite \\(a=?\\)", loesung:5, toleranz:0, tipp:"Den Umfang nach der zweiten Seite auflösen und einsetzen.", loesungsweg:"Nebenbedingung \\(2a+2b = 20\\), also \\(b = 10-a\\). Damit lautet die Zielfunktion $$A(a) = a(10-a) = 10a - a^2$$ $$A'(a) = 10 - 2a = 0 \\;\\Rightarrow\\; a = 5$$ Wegen \\(A''(a) = -2 < 0\\) liegt ein Maximum vor. Gefragt ist hier nur die <b>Seitenlänge</b>, nicht die Fläche." },
      { id:8, level:2, typ:"numerisch", frage:"Rechteck mit Umfang 20: maximaler Flächeninhalt?", loesung:25, toleranz:0, tipp:"\\(5\\cdot5\\).", loesungsweg:"Mit dem Umfang \\(2a+2b = 20\\) folgt \\(b = 10-a\\), die Zielfunktion lautet also $$A(a) = a(10-a) = 10a - a^2$$ $$A'(a) = 10-2a = 0 \\;\\Rightarrow\\; a = 5$$ Wegen \\(A'' = -2 < 0\\) ist das ein Maximum: \\(A = 5 \\cdot 5 = 25\\). Unter allen Rechtecken mit gleichem Umfang hat stets das <b>Quadrat</b> die größte Fläche." },
      { id:9, level:2, typ:"numerisch", frage:"Rechteck mit Fläche 36, minimaler Umfang?", loesung:24, toleranz:0, tipp:"Die Flächenbedingung nach einer Seite auflösen und in den Umfang einsetzen.", loesungsweg:"Nebenbedingung \\(a \\cdot b = 36\\), also \\(b = \\tfrac{36}{a}\\). Zielfunktion: $$U(a) = 2a + 2b = 2a + \\frac{72}{a}$$ $$U'(a) = 2 - \\frac{72}{a^2} = 0 \\;\\Rightarrow\\; a^2 = 36 \\;\\Rightarrow\\; a = 6$$ Wegen \\(U''(a) = \\tfrac{144}{a^3} > 0\\) ist das ein Minimum. Mit \\(b = 6\\) folgt \\(U = 2 \\cdot 6 + 2 \\cdot 6 = 24\\)." },
      { id:10, level:2, typ:"numerisch", frage:"Von 24m Zaun: Rechteck an einer Wand (3 Seiten). Maximalfläche bei Breite \\(b=?\\)", loesung:6, toleranz:0, tipp:"Nur drei Seiten werden gezäunt — die Wand ersetzt die vierte.", loesungsweg:"Gezäunt werden zwei Breiten und eine Länge: \\(2b + l = 24\\), also \\(l = 24-2b\\). $$A(b) = b(24-2b) = 24b - 2b^2$$ $$A'(b) = 24 - 4b = 0 \\;\\Rightarrow\\; b = 6$$ Wegen \\(A''(b) = -4 < 0\\) ist das das Maximum; die Länge an der Wand beträgt dann \\(l = 24 - 12 = 12\\)." },
      { id:11, level:2, typ:"numerisch", frage:"24m Zaun, 3 Seiten: maximaler Flächeninhalt?", loesung:72, toleranz:0, tipp:"Mit der optimalen Breite die Länge und daraus die Fläche bestimmen.", loesungsweg:"Die Optimierung liefert \\(b = 6\\), damit ist \\(l = 24 - 2 \\cdot 6 = 12\\): $$A = 6 \\cdot 12 = 72\\,\\text{m}^2$$ An der Wand liegt die <b>längere</b> Seite — anders als beim freistehenden Rechteck entsteht hier kein Quadrat, sondern ein Rechteck im Verhältnis \\(1:2\\)." },
      { id:12, level:2, typ:"mc", frage:"Vorgehen Extremwertaufgabe:", optionen:["Zielfunktion, Nebenbedingung, Eine Variable, Ableiten","Ableiten, Integrieren","Gleichung, Einsetzen","Skizze, Ergebnis"], korrekt:0, tipp:"Erst modellieren, dann rechnen.", loesungsweg:"Das Schema lautet: (1) <b>Zielfunktion</b> aufstellen — welche Größe soll optimal werden? (2) <b>Nebenbedingung</b> notieren und nach einer Variablen auflösen. (3) Einsetzen, sodass nur noch <b>eine</b> Variable übrig bleibt. (4) Ableiten, null setzen und die Art des Extremums prüfen. (5) Die Ränder des Definitionsbereichs vergleichen. Wer Schritt 2 überspringt, hat eine Funktion zweier Variablen und kann nicht ableiten." },
      // LEVEL 3 -- Volumenoptimierung
      { id:13, level:3, typ:"numerisch", frage:"Quadratische Schachtel ohne Deckel, Oberfläche 300. Kantenlänge Grundseite für max. V? (\\(V=a^2h\\), \\(O=a^2+4ah\\))", loesung:10, toleranz:0, tipp:"Die Oberflächenbedingung nach der Höhe auflösen.", loesungsweg:"Aus \\(a^2 + 4ah = 300\\) folgt \\(h = \\tfrac{300-a^2}{4a}\\). Eingesetzt in \\(V = a^2h\\): $$V(a) = a^2 \\cdot \\frac{300-a^2}{4a} = \\frac{300a - a^3}{4}$$ $$V'(a) = \\frac{300 - 3a^2}{4} = 0 \\;\\Rightarrow\\; a^2 = 100 \\;\\Rightarrow\\; a = 10$$ Wegen \\(V''(a) = -\\tfrac{3a}{2} < 0\\) ist das ein Maximum; die Höhe beträgt \\(h = \\tfrac{300-100}{40} = 5\\)." },
      { id:14, level:3, typ:"numerisch", frage:"Zylinder: Oberfläche \\(O=6\\pi\\), Volumen maximal. Radius?", loesung:1, toleranz:0.01, tipp:"Die Oberflächenbedingung nach der Höhe auflösen und in das Volumen einsetzen.", loesungsweg:"Aus \\(O = 2\\pi r^2 + 2\\pi rh = 6\\pi\\) folgt \\(h = \\tfrac{3-r^2}{r}\\). Eingesetzt in \\(V = \\pi r^2 h\\): $$V(r) = \\pi r^2 \\cdot \\frac{3-r^2}{r} = 3\\pi r - \\pi r^3$$ $$V'(r) = 3\\pi - 3\\pi r^2 = 0 \\;\\Rightarrow\\; r = 1$$ Wegen \\(V''(1) = -6\\pi < 0\\) ist das ein Maximum. Es folgt \\(h = 2\\), also \\(h = 2r\\) — die Standardform des volumengrößten Zylinders bei gegebener Oberfläche." },
      { id:15, level:3, typ:"numerisch", frage:"Rechteck unter Parabel \\(y=4-x^2\\), Achsen-symmetrisch. Fläche max. bei \\(x=?\\)", loesung:1.1547, toleranz:0.1, tipp:"Breite und Höhe des Rechtecks durch \\(x\\) ausdrücken.", loesungsweg:"Das Rechteck reicht von \\(-x\\) bis \\(x\\), ist also \\(2x\\) breit, und hat die Höhe \\(4-x^2\\): $$A(x) = 2x(4-x^2) = 8x - 2x^3$$ $$A'(x) = 8 - 6x^2 = 0 \\;\\Rightarrow\\; x^2 = \\tfrac43 \\;\\Rightarrow\\; x = \\sqrt{\\tfrac43} \\approx 1{,}15$$ Wegen \\(A''(x) = -12x < 0\\) für \\(x > 0\\) ist das ein Maximum." },
      { id:16, level:3, typ:"numerisch", frage:"Aus Quadrat Seite 12 cm an Ecken kleine Quadrate (Seite \\(x\\)) ausschneiden, Box falten. V maximal bei \\(x=?\\)", loesung:2, toleranz:0, tipp:"Boden und Höhe der Box durch \\(x\\) ausdrücken.", loesungsweg:"Der Boden misst \\((12-2x)\\) in beiden Richtungen, die Höhe ist \\(x\\): $$V(x) = (12-2x)^2 x$$ Ableiten mit der Produktregel und ausklammern: $$V'(x) = (12-2x)^2 - 4x(12-2x) = (12-2x)(12-6x)$$ Die Nullstellen sind \\(x = 6\\) (dort ist \\(V = 0\\), der Rand) und \\(x = 2\\). Nur \\(x = 2\\) liegt im sinnvollen Bereich \\(0 < x < 6\\) und liefert das Maximum." },
      { id:17, level:3, typ:"numerisch", frage:"Aus einem Quadrat (Seite 12 cm) werden an den Ecken gleich große Quadrate ausgeschnitten und die Ränder zu einer offenen Box gefaltet. Wie groß ist das größtmögliche Volumen in \\(\\text{cm}^3\\)?", loesung:128, toleranz:0, tipp:"Boden und Höhe der Box durch die Schnittlänge ausdrücken und optimieren.", loesungsweg:"Ist \\(x\\) die Seitenlänge der ausgeschnittenen Quadrate, so misst der Boden \\((12-2x)\\) in beiden Richtungen und die Höhe ist \\(x\\): $$V(x) = (12-2x)^2 x$$ $$V'(x) = (12-2x)^2 - 4x(12-2x) = (12-2x)(12-6x) = 0$$ Im sinnvollen Bereich \\(0 < x < 6\\) bleibt \\(x = 2\\) (die zweite Nullstelle \\(x = 6\\) ist der Rand mit \\(V = 0\\)). Damit $$V_{\\max} = 8^2 \\cdot 2 = 128\\,\\text{cm}^3$$ Zum Vergleich: \\(x = 1\\) gäbe \\(100\\,\\text{cm}^3\\), \\(x = 3\\) nur \\(108\\,\\text{cm}^3\\)." },
      { id:18, level:3, typ:"mc", frage:"Welche Ableitung prüft, ob Maximum?", optionen:["\\(f'\\)","\\(f''<0\\)","\\(f''>0\\)","\\(f'''\\)"], korrekt:1, tipp:"Rechtskrümmung.", loesungsweg:"Ob eine Stelle mit waagerechter Tangente ein Maximum ist, entscheidet die Krümmung: $$f''(x_0) < 0 \\;\\Rightarrow\\; \\text{Maximum}$$ Die erste Ableitung liefert nur die Kandidaten, nicht ihre Art." },
      // LEVEL 4 -- komplexere NB
      { id:19, level:4, typ:"numerisch", frage:"Punkt \\(P(x|x^2)\\) auf Parabel mit minimalem Abstand zu \\(A(4|0)\\). \\(x\\)?", loesung:1.1, toleranz:0.1, tipp:"Statt des Abstands sein Quadrat betrachten — das erspart die Wurzel.", loesungsweg:"Für \\(P(x \\mid x^2)\\) ist der quadrierte Abstand $$d^2(x) = (x-4)^2 + (x^2)^2 = x^4 + x^2 - 8x + 16$$ Es genügt, \\(d^2\\) zu minimieren, weil die Wurzel streng monoton wächst und die Minimalstelle nicht verschiebt. $$\\left(d^2\\right)'(x) = 4x^3 + 2x - 8 = 0$$ Diese Gleichung hat genau eine reelle Lösung \\(x \\approx 1{,}128\\); links davon ist die Ableitung negativ, rechts positiv — dort liegt also das Minimum." },
      { id:20, level:4, typ:"numerisch", frage:"Dreieck unter \\(y=6-x\\) im 1. Quadranten mit rechtem Winkel im Ursprung. \\(x\\) für max Fläche?", loesung:3, toleranz:0, tipp:"Die beiden Katheten liegen auf den Achsen — ihre Längen durch \\(x\\) ausdrücken.", loesungsweg:"Die eine Kathete ist \\(x\\), die andere der Funktionswert \\(6-x\\): $$A(x) = \\tfrac12 x(6-x) = 3x - \\tfrac12 x^2$$ $$A'(x) = 3 - x = 0 \\;\\Rightarrow\\; x = 3$$ Wegen \\(A''(x) = -1 < 0\\) ist das das Maximum; die Fläche beträgt dann \\(\\tfrac12 \\cdot 3 \\cdot 3 = 4{,}5\\)." },
      { id:21, level:4, typ:"numerisch", frage:"Bauernhof: Zaun 100m, max. Rechteckfläche?", loesung:625, toleranz:0, tipp:"Die Umfangsbedingung nach einer Seite auflösen und in die Fläche einsetzen.", loesungsweg:"Bei \\(100\\,\\text{m}\\) Zaun ist \\(2a+2b = 100\\), also \\(b = 50-a\\): $$A(a) = a(50-a), \\quad A'(a) = 50-2a = 0 \\;\\Rightarrow\\; a = 25$$ $$A_{\\max} = 25 \\cdot 25 = 625\\,\\text{m}^2$$ Wegen \\(A''(a) = -2 < 0\\) ist das ein Maximum. Wieder gewinnt das Quadrat — dieselbe Struktur wie beim Umfang \\(20\\), nur mit anderen Zahlen." },
      { id:22, level:4, typ:"numerisch", frage:"Dose (Zylinder) mit dem Volumen \\(1\\,\\text{Liter} = 1000\\,\\text{cm}^3\\). Oberfläche minimal bei \\(r\\) (cm, gerundet)?", loesung:5.42, toleranz:0.2, tipp:"Die Volumenbedingung nach der Höhe auflösen und in die Oberfläche einsetzen.", loesungsweg:"Nebenbedingung \\(V = \\pi r^2 h = 1000\\), also \\(h = \\tfrac{1000}{\\pi r^2}\\). Eingesetzt in die Oberfläche: $$O(r) = 2\\pi r^2 + 2\\pi r h = 2\\pi r^2 + \\frac{2000}{r}$$ $$O'(r) = 4\\pi r - \\frac{2000}{r^2} = 0 \\;\\Rightarrow\\; r^3 = \\frac{500}{\\pi}$$ $$r = \\sqrt[3]{\\frac{500}{\\pi}} \\approx 5{,}42\\,\\text{cm}$$ Im Optimum gilt \\(h = 2r\\) — die Dose ist also genau so hoch wie breit. Reale Konservendosen sind schlanker, weil Deckel und Boden mehr Material kosten als der Mantel." },
      { id:23, level:4, typ:"numerisch", frage:"Rechteck mit Fläche 100, minimaler Umfang?", loesung:40, toleranz:0, tipp:"Quadrat \\(a=10\\).", loesungsweg:"Mit \\(ab = 100\\) ist \\(b = \\tfrac{100}{a}\\): $$U(a) = 2a + \\frac{200}{a}, \\quad U'(a) = 2 - \\frac{200}{a^2} = 0 \\;\\Rightarrow\\; a^2 = 100 \\;\\Rightarrow\\; a = 10$$ $$U_{\\min} = 2 \\cdot 10 + 2 \\cdot 10 = 40$$ Auch hier ist das Quadrat optimal — die Umkehrung von Aufgabe 8." },
      { id:24, level:4, typ:"numerisch", frage:"Offene Schachtel, quadratische Grundseite, V=32. Min. Oberfläche bei \\(a=?\\)", loesung:4, toleranz:0, tipp:"Die Volumenbedingung nach der Höhe auflösen und in die Oberfläche einsetzen.", loesungsweg:"Aus \\(V = a^2 h = 32\\) folgt \\(h = \\tfrac{32}{a^2}\\). Die Oberfläche ohne Deckel ist $$O(a) = a^2 + 4ah = a^2 + \\frac{128}{a}$$ $$O'(a) = 2a - \\frac{128}{a^2} = 0 \\;\\Rightarrow\\; a^3 = 64 \\;\\Rightarrow\\; a = 4$$ Wegen \\(O''(a) = 2 + \\tfrac{256}{a^3} > 0\\) ist das ein Minimum; die Höhe beträgt \\(h = 2\\)." },
      // LEVEL 5 -- Transfer
      { id:25, level:5, typ:"numerisch", frage:"Aus einem quadratischen Blech mit der Seitenlänge \\(a\\) werden an den vier Ecken Quadrate der Seitenlänge \\(x\\) ausgeschnitten; die Ränder werden zu einer oben offenen Schachtel hochgeklappt. Das größtmögliche Volumen beträgt \\(1024\\,\\text{cm}^3\\). Wie lang ist \\(a\\) in cm?", loesung:24, toleranz:0, tipp:"Das Optimum zunächst allgemein in Abhängigkeit von \\(a\\) bestimmen und erst dann die Volumenangabe auswerten.", loesungsweg:"Zielfunktion mit dem Parameter \\(a\\): $$V(x) = (a-2x)^2 x$$ Ableiten mit der Produktregel und ausklammern: $$V'(x) = (a-2x)^2 - 4x(a-2x) = (a-2x)(a-6x)$$ Im Innern des sinnvollen Bereichs \\(0 < x < \\tfrac a2\\) bleibt nur \\(x = \\tfrac a6\\); die zweite Nullstelle \\(x = \\tfrac a2\\) ist der Rand mit \\(V = 0\\). Also $$V_{\\max} = \\left(a - \\tfrac a3\\right)^2 \\cdot \\frac a6 = \\frac{4a^2}{9} \\cdot \\frac a6 = \\frac{2a^3}{27}$$ Aus \\(\\tfrac{2a^3}{27} = 1024\\) folgt \\(a^3 = 13824\\) und damit \\(a = 24\\). Probe: \\(x = 4\\), Boden \\(16\\,\\text{cm}\\), \\(V = 16^2 \\cdot 4 = 1024\\) ✓" },
      { id:26, level:5, typ:"mc", frage:"Ein Schüler sucht das flächengrößte Rechteck mit Umfang \\(30\\,\\text{cm}\\):<br>Schritt 1: Es gilt \\(a + b = 30\\), also \\(b = 30 - a\\).<br>Schritt 2: \\(A(a) = a(30-a)\\)<br>Schritt 3: \\(A'(a) = 30 - 2a = 0\\), also \\(a = 15\\).<br>Welcher Schritt ist der erste fehlerhafte?", optionen:["Schritt 1","Schritt 2","Schritt 3","Kein Schritt ist falsch"], korrekt:0, tipp:"Den Umfang eines Rechtecks aus seinen beiden Seitenlängen selbst nachrechnen.", loesungsweg:"Der Umfang ist \\(U = 2a + 2b\\). Aus \\(2a + 2b = 30\\) folgt $$a + b = 15 \\ne 30$$ Schon <b>Schritt 1</b> ist also falsch; die Schritte 2 und 3 rechnen die falsche Nebenbedingung nur korrekt weiter. Richtig wäre \\(A(a) = a(15-a)\\) mit \\(A'(a) = 15-2a = 0\\), also \\(a = 7{,}5\\) und \\(A_{\\max} = 56{,}25\\,\\text{cm}^2\\). Das Ergebnis \\(a = 15\\) hätte auffallen müssen: eine Seite kann nicht so lang sein wie der halbe Umfang." },
      { id:27, level:5, typ:"numerisch", frage:"Ein Rechteck liegt mit einer Seite auf der \\(x\\)-Achse; seine beiden oberen Ecken liegen auf dem Graphen von \\(y = a - x^2\\) mit \\(a > 0\\). Für welches \\(a\\) beträgt der größtmögliche Flächeninhalt genau \\(32\\)?", loesung:12, toleranz:0.05, tipp:"Den Flächeninhalt erst mit dem Parameter \\(a\\) optimieren und das Ergebnis danach gleichsetzen.", loesungsweg:"Aus Symmetriegründen reicht das Rechteck von \\(-x\\) bis \\(x\\) und hat die Höhe \\(a-x^2\\): $$A(x) = 2x(a-x^2) = 2ax - 2x^3$$ $$A'(x) = 2a - 6x^2 = 0 \\;\\Rightarrow\\; x = \\sqrt{\\tfrac a3}$$ Wegen \\(A''(x) = -12x < 0\\) für \\(x > 0\\) ist das ein Maximum. Einsetzen: $$A_{\\max} = 2\\sqrt{\\tfrac a3}\\left(a - \\tfrac a3\\right) = \\frac{4a}{3}\\sqrt{\\frac a3}$$ Die Gleichung \\(\\tfrac{4a}{3}\\sqrt{\\tfrac a3} = 32\\) liefert \\(a = 12\\). Probe: \\(x = 2\\), Höhe \\(12-4 = 8\\), \\(A = 2 \\cdot 2 \\cdot 8 = 32\\) ✓" },
      { id:28, level:5, typ:"numerisch", frage:"Ein Betrieb verkauft jede Mengeneinheit für \\(15\\,\\text{€}\\); die Herstellung von \\(x\\) Einheiten kostet \\(K(x) = x^3 - 6x^2 + 15x\\) (in €). Bei welcher Menge \\(x\\) ist der Gewinn am größten?", loesung:4, toleranz:0, tipp:"Erlös und Kosten gegenüberstellen — daraus entsteht die Zielfunktion.", loesungsweg:"Der Erlös ist \\(E(x) = 15x\\), der Gewinn also die Differenz: $$G(x) = E(x) - K(x) = 15x - x^3 + 6x^2 - 15x = -x^3 + 6x^2$$ $$G'(x) = -3x^2 + 12x = -3x(x-4) = 0 \\;\\Rightarrow\\; x = 0 \\text{ oder } x = 4$$ Beide Kandidaten sind zu beurteilen. Mit \\(G''(x) = -6x + 12\\) ist \\(G''(4) = -12 < 0\\) (Maximum), dagegen \\(G''(0) = 12 > 0\\) (Minimum). Der größte Gewinn liegt bei \\(x = 4\\) und beträgt \\(G(4) = -64 + 96 = 32\\,\\text{€}\\)." },
      { id:29, level:5, typ:"numerisch", frage:"Welcher Punkt des Graphen von \\(y = x^2\\) hat den kleinsten Abstand zum Punkt \\(P(0 \\mid 3)\\)? Gib die positive \\(x\\)-Koordinate auf zwei Dezimalstellen an.", loesung:1.58, toleranz:0.03, tipp:"Den quadrierten Abstand als Funktion von \\(x\\) aufstellen und alle Kandidaten vergleichen.", loesungsweg:"Für \\(Q(x \\mid x^2)\\) ist der quadrierte Abstand $$d^2(x) = x^2 + (x^2-3)^2 = x^4 - 5x^2 + 9$$ Es genügt, \\(d^2\\) zu minimieren, weil die Wurzel streng monoton wächst. $$\\left(d^2\\right)'(x) = 4x^3 - 10x = 2x(2x^2-5) = 0$$ Kandidaten sind \\(x = 0\\) und \\(x = \\pm\\sqrt{2{,}5}\\). Der Vergleich der Werte entscheidet: \\(d^2(0) = 9\\), aber \\(d^2(\\sqrt{2{,}5}) = 2{,}75\\). Am mittleren Kandidaten liegt also ein lokales <b>Maximum</b> des Abstands, das Minimum bei $$x = \\sqrt{2{,}5} \\approx 1{,}58$$ mit \\(d = \\sqrt{2{,}75} \\approx 1{,}66\\). Wer nur \\(d'=0\\) löst und nicht vergleicht, kann hier den falschen Kandidaten nehmen." },
      { id:30, level:5, typ:"numerisch", frage:"An einer Hauswand soll ein rechteckiges Beet mit \\(40\\,\\text{m}\\) Zaun auf drei Seiten eingefasst werden. Die Wand ist nur \\(12\\,\\text{m}\\) lang, die an ihr liegende Seite darf also höchstens \\(12\\,\\text{m}\\) messen. Wie groß ist die größtmögliche Fläche in \\(\\text{m}^2\\)?", loesung:168, toleranz:0, tipp:"Zunächst ohne die Längenbeschränkung optimieren und dann prüfen, ob das Ergebnis überhaupt erlaubt ist.", loesungsweg:"Mit der Tiefe \\(b\\) und der Wandseite \\(l\\) gilt \\(2b + l = 40\\), also \\(l = 40-2b\\): $$A(b) = b(40-2b) = 40b - 2b^2$$ $$A'(b) = 40 - 4b = 0 \\;\\Rightarrow\\; b = 10, \\quad l = 20$$ Dieses Optimum ist <b>unzulässig</b>, denn \\(l\\) darf höchstens \\(12\\) betragen. Aus \\(40-2b \\le 12\\) folgt \\(b \\ge 14\\). Auf dem erlaubten Bereich \\(14 \\le b \\le 20\\) ist \\(A'(b) < 0\\), \\(A\\) fällt dort also streng — das Maximum liegt am <b>Rand</b> bei \\(b = 14\\): $$A = 14 \\cdot 12 = 168\\,\\text{m}^2$$ Ohne Randbetrachtung käme man auf \\(200\\,\\text{m}^2\\) — eine Fläche, die es hier nicht gibt." },
      // LEVEL 6 -- Anwendungen
      { id:31, level:6, typ:"numerisch", frage:"Ein Wasserwerk \\(W\\) liegt \\(3\\,\\text{km}\\) von einer geraden Straße entfernt; sein Fußpunkt auf der Straße heißt \\(F\\). Der Anschlusspunkt \\(P\\) liegt auf der Straße, \\(8\\,\\text{km}\\) von \\(F\\) entfernt. Eine Leitung führt von \\(W\\) geradlinig quer durchs Gelände zu einem Punkt \\(Q\\) auf der Straße und von dort an der Straße entlang bis \\(P\\). Gelände kostet \\(5\\), Straße \\(3\\) Geldeinheiten je km. Wie weit soll \\(Q\\) von \\(F\\) entfernt sein (in km)?", loesung:2.25, toleranz:0.05, tipp:"Beide Leitungsstücke getrennt durch den gesuchten Abstand ausdrücken und die Preise gewichtet addieren.", loesungsweg:"Ist \\(x\\) der Abstand von \\(F\\) zu \\(Q\\), so ist das Geländestück nach Pythagoras \\(\\sqrt{9+x^2}\\) lang und das Straßenstück \\(8-x\\). Die Kostenfunktion auf \\(0 \\le x \\le 8\\) lautet $$K(x) = 5\\sqrt{9+x^2} + 3(8-x)$$ $$K'(x) = \\frac{5x}{\\sqrt{9+x^2}} - 3 = 0 \\;\\Rightarrow\\; 5x = 3\\sqrt{9+x^2}$$ Quadrieren: \\(25x^2 = 81 + 9x^2\\), also \\(16x^2 = 81\\) und \\(x = \\tfrac94 = 2{,}25\\). Nun der Vergleich mit den Rändern: $$K(0) = 15 + 24 = 39, \\qquad K(2{,}25) = 18{,}75 + 17{,}25 = 36, \\qquad K(8) = 5\\sqrt{73} \\approx 42{,}7$$ Das Minimum liegt also im Innern bei \\(x = 2{,}25\\). Der direkte Weg von \\(W\\) nach \\(P\\) wäre trotz kürzerer Strecke teurer, weil Gelände fast doppelt so viel kostet wie Straße." },
      { id:32, level:6, typ:"mc", frage:"Ein Trinkbecher hat die Form eines Zylinders ohne Deckel. Bei gegebenem Volumen soll der Materialverbrauch aus Boden und Mantel möglichst klein sein. Welche Aussage über das Optimum gilt für jedes Volumen?", optionen:["Die Höhe ist gleich dem Radius","Die Höhe ist doppelt so groß wie der Radius","Der Radius ist doppelt so groß wie die Höhe","Das Verhältnis hängt vom Volumen ab"], korrekt:0, tipp:"Die Oberfläche mit der Volumenbedingung auf eine Variable bringen und allgemein mit \\(V\\) rechnen.", loesungsweg:"Aus \\(V = \\pi r^2 h\\) folgt \\(h = \\tfrac{V}{\\pi r^2}\\). Boden und Mantel ergeben $$O(r) = \\pi r^2 + 2\\pi r h = \\pi r^2 + \\frac{2V}{r}$$ $$O'(r) = 2\\pi r - \\frac{2V}{r^2} = 0 \\;\\Rightarrow\\; r^3 = \\frac{V}{\\pi}$$ Wegen \\(O''(r) = 2\\pi + \\tfrac{4V}{r^3} > 0\\) liegt ein Minimum vor. Für die Höhe folgt $$h = \\frac{V}{\\pi r^2} = \\frac{r^3}{r^2} = r$$ Das gilt <b>unabhängig</b> von \\(V\\): der materialsparendste offene Becher ist so hoch wie sein Radius. Beim geschlossenen Zylinder liefert dieselbe Rechnung dagegen \\(h = 2r\\)." },
      { id:33, level:6, typ:"numerisch", frage:"Ein Tunnelquerschnitt besteht aus einem Rechteck mit aufgesetztem Halbkreis; die Rechteckbreite \\(b\\) ist der Durchmesser des Halbkreises. Der Umfang des Querschnitts (Boden, zwei Seiten, Halbkreisbogen) beträgt \\(10\\,\\text{m}\\). Für welche Breite \\(b\\) in m wird die Querschnittsfläche maximal? Runde auf zwei Dezimalstellen.", loesung:2.8, toleranz:0.05, tipp:"Umfang und Fläche jeweils aus Rechteck- und Halbkreisanteil zusammensetzen und die Höhe eliminieren.", loesungsweg:"Der Halbkreis hat den Radius \\(\\tfrac b2\\), sein Bogen die Länge \\(\\tfrac{\\pi b}{2}\\). Mit der Rechteckhöhe \\(h\\) lautet die Nebenbedingung $$b + 2h + \\frac{\\pi b}{2} = 10 \\;\\Rightarrow\\; h = \\frac{1}{2}\\left(10 - b - \\frac{\\pi b}{2}\\right)$$ Die Fläche setzt sich aus Rechteck und Halbkreis zusammen: $$A(b) = bh + \\frac{\\pi}{2}\\left(\\frac b2\\right)^2 = 5b - \\frac{b^2}{2} - \\frac{\\pi b^2}{8}$$ $$A'(b) = 5 - b - \\frac{\\pi b}{4} = 0 \\;\\Rightarrow\\; b = \\frac{20}{4+\\pi} \\approx 2{,}80$$ Wegen \\(A''(b) = -1 - \\tfrac{\\pi}{4} < 0\\) ist das ein Maximum. Die Höhe beträgt dann \\(h \\approx 1{,}40\\,\\text{m}\\) — genau die Hälfte der Breite — und die Fläche \\(A = \\tfrac{50}{4+\\pi} \\approx 7{,}00\\,\\text{m}^2\\)." },
      { id:34, level:6, typ:"numerisch", frage:"Ein oben offener Wassertank mit quadratischer Grundfläche soll \\(4000\\,\\text{cm}^3\\) fassen. Die Grundkante darf aus Platzgründen höchstens \\(10\\,\\text{cm}\\) lang sein. Wie groß ist die kleinstmögliche Oberfläche in \\(\\text{cm}^2\\)?", loesung:1700, toleranz:0, tipp:"Das freie Optimum bestimmen und prüfen, ob es die Platzbedingung erfüllt.", loesungsweg:"Mit \\(a^2 h = 4000\\) ist \\(h = \\tfrac{4000}{a^2}\\); die Oberfläche ohne Deckel ist $$O(a) = a^2 + 4ah = a^2 + \\frac{16000}{a}$$ $$O'(a) = 2a - \\frac{16000}{a^2} = 0 \\;\\Rightarrow\\; a^3 = 8000 \\;\\Rightarrow\\; a = 20$$ Diese Kante ist zu lang. Für \\(0 < a \\le 10\\) gilt \\(O'(a) < 0\\), \\(O\\) fällt dort also streng — das Minimum liegt am <b>Rand</b> bei \\(a = 10\\): $$O = 100 + 1600 = 1700\\,\\text{cm}^2$$ Die Höhe beträgt dann \\(h = 40\\,\\text{cm}\\), der Tank wird also schmal und hoch. Das unzulässige freie Optimum hätte \\(400 + 800 = 1200\\,\\text{cm}^2\\) ergeben." },
      { id:35, level:6, typ:"mc", frage:"Bei gegebenem Umfang \\(U\\) wird der Flächeninhalt eines Rechtecks maximal. Behauptung: „Verdoppelt man \\(U\\), so verdoppelt sich auch der größtmögliche Flächeninhalt.\" Trifft das zu?", optionen:["Ja, die Fläche wächst proportional zum Umfang","Nein, die Fläche vervierfacht sich","Nein, die Fläche verdreifacht sich","Ja, aber nur beim Quadrat"], korrekt:1, tipp:"Den größtmöglichen Flächeninhalt allgemein durch \\(U\\) ausdrücken.", loesungsweg:"Bei gegebenem Umfang ist das Quadrat optimal; seine Seite beträgt \\(\\tfrac U4\\), also $$A_{\\max}(U) = \\left(\\frac U4\\right)^2 = \\frac{U^2}{16}$$ Der Zusammenhang ist <b>quadratisch</b>, nicht proportional: $$A_{\\max}(2U) = \\frac{(2U)^2}{16} = \\frac{4U^2}{16} = 4 \\cdot A_{\\max}(U)$$ Die Fläche vervierfacht sich also. Beispiel: \\(U = 20\\) liefert \\(25\\), \\(U = 40\\) liefert \\(100\\)." },
      { id:36, level:6, typ:"numerisch", frage:"Eine geschlossene Konservendose soll \\(500\\,\\text{cm}^3\\) fassen. Deckel und Boden kosten \\(2\\,\\text{Cent}\\) je \\(\\text{cm}^2\\), der Mantel nur \\(1\\,\\text{Cent}\\) je \\(\\text{cm}^2\\). Bei welchem Radius in cm sind die Materialkosten minimal? Runde auf zwei Dezimalstellen.", loesung:3.41, toleranz:0.05, tipp:"Die Kosten als Summe zweier Flächenanteile mit verschiedenen Preisen ansetzen.", loesungsweg:"Deckel und Boden haben zusammen die Fläche \\(2\\pi r^2\\), der Mantel \\(2\\pi r h\\) mit \\(h = \\tfrac{500}{\\pi r^2}\\). Die Kostenfunktion in Cent lautet $$K(r) = 2 \\cdot 2\\pi r^2 + 1 \\cdot 2\\pi r h = 4\\pi r^2 + \\frac{1000}{r}$$ $$K'(r) = 8\\pi r - \\frac{1000}{r^2} = 0 \\;\\Rightarrow\\; r^3 = \\frac{125}{\\pi} \\;\\Rightarrow\\; r = \\frac{5}{\\sqrt[3]{\\pi}} \\approx 3{,}41$$ Wegen \\(K''(r) > 0\\) ist das ein Minimum. Die Höhe beträgt \\(h \\approx 13{,}7\\,\\text{cm}\\), also etwa \\(4r\\): weil Deckel und Boden doppelt so teuer sind, wird die Dose <b>schlanker</b> als bei reiner Materialminimierung, wo \\(h = 2r\\) gilt." }];
