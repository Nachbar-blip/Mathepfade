<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-stammfunktionen';
    const THEMA_CONFIG = { name: 'Stammfunktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 -- Grundbegriffe
      { id: 1, level: 1, typ: "mc", frage: "Was ist eine Stammfunktion \\(F(x)\\) von \\(f(x)\\)?", optionen: ["\\(F'(x) = f(x)\\)", "\\(F(x) = f'(x)\\)", "\\(F(x) \\cdot f(x) = 1\\)", "\\(F(x) = \\frac{1}{f(x)}\\)"], korrekt: 0, tipp: "Stammfunktion ist die Umkehrung der Ableitung.", loesungsweg: "\\(F\\) ist Stammfunktion von \\(f\\), wenn \\(F'(x) = f(x)\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Eine Stammfunktion von \\(f(x) = 1\\) ist:", optionen: ["\\(F(x) = 0\\)", "\\(F(x) = x\\)", "\\(F(x) = x^2\\)", "\\(F(x) = \\frac{1}{x}\\)"], korrekt: 1, tipp: "Welche Funktion hat die Ableitung 1?", loesungsweg: "\\((x)' = 1\\), also \\(F(x) = x\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Eine Stammfunktion von \\(f(x) = 2x\\) ist:", optionen: ["\\(x^2\\)", "\\(2\\)", "\\(x\\)", "\\(2x^2\\)"], korrekt: 0, tipp: "\\((x^2)' = 2x\\).", loesungsweg: "\\(F(x) = x^2\\), denn \\(F'(x) = 2x\\)." },
      { id: 4, level: 1, typ: "mc", frage: "Was bedeutet das Symbol \\(\\int f(x)\\,dx\\)?", optionen: ["Die Ableitung von \\(f\\)", "Eine Stammfunktion von \\(f\\)", "Den Funktionswert", "Den Grenzwert"], korrekt: 1, tipp: "Das unbestimmte Integral.", loesungsweg: "\\(\\int f(x)\\,dx\\) ist das <b>unbestimmte Integral</b> — die Menge aller Stammfunktionen." },
      { id: 5, level: 1, typ: "mc", frage: "Wenn \\(F\\) Stammfunktion von \\(f\\) ist, dann ist auch \\(F(x) + C\\) für beliebiges \\(C \\in \\mathbb{R}\\) eine Stammfunktion.", optionen: ["Ja", "Nein", "Nur wenn \\(C = 0\\)", "Nur wenn \\(C > 0\\)"], korrekt: 0, tipp: "Die Ableitung einer Konstanten ist 0.", loesungsweg: "\\((F(x)+C)' = F'(x) + 0 = f(x)\\). Deshalb gibt es unendlich viele Stammfunktionen." },
      { id: 6, level: 1, typ: "mc", frage: "Eine Stammfunktion von \\(f(x) = x^2\\) ist:", optionen: ["\\(2x\\)", "\\(\\frac{1}{3}x^3\\)", "\\(x^3\\)", "\\(\\frac{1}{2}x^2\\)"], korrekt: 1, tipp: "Potenzregel: Exponent +1, durch neuen Exponenten teilen.", loesungsweg: "Potenzregel rückwärts: Exponent um eins erhöhen, dann durch den neuen Exponenten teilen. $$\\int x^2\\,dx = \\frac{x^3}{3} + C$$ Probe durch Ableiten: \\(\\left(\\tfrac13 x^3\\right)' = x^2\\) ✓ Die Antwort \\(x^3\\) allein wäre um den Faktor \\(3\\) zu groß." },
      // LEVEL 2 -- Potenzregel
      { id: 7, level: 2, typ: "mc", frage: "Stammfunktion von \\(x^5\\):", optionen: ["\\(5x^4\\)", "\\(\\frac{x^6}{6}\\)", "\\(\\frac{x^6}{5}\\)", "\\(6x^6\\)"], korrekt: 1, tipp: "\\(\\int x^n dx = \\frac{x^{n+1}}{n+1}\\).", loesungsweg: "$$\\int x^5\\,dx = \\frac{x^6}{6} + C$$ Probe: \\(\\left(\\tfrac{x^6}{6}\\right)' = \\tfrac{6x^5}{6} = x^5\\) ✓ Geteilt wird stets durch den <b>neuen</b> Exponenten \\(6\\), nicht durch den alten." },
      { id: 8, level: 2, typ: "numerisch", frage: "Bestimme eine Stammfunktion von \\(f(x) = 3x^2\\) mit \\(C = 0\\) und berechne ihren Wert an der Stelle \\(x = 2\\).", loesung: 8, toleranz: 0, tipp: "Wende zuerst die Potenzregel an und setze erst in die gefundene Stammfunktion ein.", loesungsweg: "Die Potenzregel erhöht den Exponenten um eins und teilt durch den neuen Exponenten: $$\\int 3x^2\\,dx = 3 \\cdot \\frac{x^3}{3} + C = x^3 + C$$ Mit \\(C = 0\\) ist also \\(F(x) = x^3\\). Einsetzen: $$F(2) = 2^3 = 8$$ Probe: \\(\\left(x^3\\right)' = 3x^2\\) — das ist wieder \\(f\\)." },
      { id: 9, level: 2, typ: "mc", frage: "Stammfunktion von \\(4x^3\\):", optionen: ["\\(12x^2\\)", "\\(x^4\\)", "\\(4x^4\\)", "\\(\\frac{x^4}{4}\\)"], korrekt: 1, tipp: "Der konstante Faktor bleibt stehen; die Potenzregel wirkt nur auf die Potenz.", loesungsweg: "Der konstante Faktor bleibt stehen, die Potenzregel wirkt auf \\(x^3\\): $$\\int 4x^3\\,dx = 4 \\cdot \\frac{x^4}{4} + C = x^4 + C$$ Der Faktor \\(4\\) und der neue Nenner \\(4\\) kürzen sich gerade weg. Probe: \\(\\left(x^4\\right)' = 4x^3\\) — richtig. Die Ableitung \\(12x^2\\) gehört dagegen zu \\(f\\), nicht zu \\(F\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Bestimme eine Stammfunktion von \\(f(x) = x^3\\) mit \\(C = 0\\) und berechne die Differenz ihrer Werte an den Stellen \\(2\\) und \\(0\\).", loesung: 4, toleranz: 0, tipp: "Bilde zuerst die Stammfunktion und setze danach beide Stellen ein; die untere liefert hier keinen Beitrag.", loesungsweg: "Potenzregel: $$\\int x^3\\,dx = \\frac{x^4}{4} + C$$ Mit \\(C = 0\\) ist \\(F(x) = \\frac{x^4}{4}\\). Differenz der Werte: $$F(2) - F(0) = \\frac{2^4}{4} - \\frac{0^4}{4} = \\frac{16}{4} - 0 = 4$$ Die Konstante \\(C\\) fällt bei einer solchen Differenz ohnehin heraus — sie steht in beiden Werten und hebt sich auf." },
      { id: 11, level: 2, typ: "mc", frage: "Stammfunktion von \\(f(x) = 6x\\):", optionen: ["\\(3x^2\\)", "\\(6\\)", "\\(6x^2\\)", "\\(\\frac{x^2}{6}\\)"], korrekt: 0, tipp: "Prüfe die Vorschläge durch Ableiten — der richtige muss genau \\(f\\) zurückgeben.", loesungsweg: "Der konstante Faktor bleibt beim Integrieren stehen: $$\\int 6x\\,dx = 6 \\cdot \\frac{x^2}{2} + C = 3x^2 + C$$ Probe: \\((3x^2)' = 6x\\) ✓" },
      { id: 12, level: 2, typ: "mc", frage: "Stammfunktion der konstanten Funktion \\(f(x) = 5\\):", optionen: ["\\(0\\)", "\\(5\\)", "\\(5x\\)", "\\(\\frac{x^2}{5}\\)"], korrekt: 2, tipp: "Welche Funktion hat eine konstante Ableitung? Ihre Variable darf nicht verschwinden.", loesungsweg: "Gesucht ist eine Funktion mit der Ableitung \\(5\\) — das leistet die Gerade mit der Steigung \\(5\\): $$\\int 5\\,dx = 5x + C$$ Eine Konstante wird also <b>nicht</b> wieder zur Konstanten; die Variable \\(x\\) muss auftauchen." },
      // LEVEL 3 -- Summenregel
      { id: 13, level: 3, typ: "mc", frage: "Stammfunktion von \\(f(x) = 3x^2 + 2x\\):", optionen: ["\\(x^3 + x^2\\)", "\\(6x + 2\\)", "\\(x^3 + 2x\\)", "\\(3x^3 + x^2\\)"], korrekt: 0, tipp: "Summandenweise integrieren.", loesungsweg: "Summen dürfen summandenweise integriert werden: $$\\int (3x^2+2x)\\,dx = 3 \\cdot \\frac{x^3}{3} + 2 \\cdot \\frac{x^2}{2} + C = x^3 + x^2 + C$$ Probe: \\((x^3+x^2)' = 3x^2+2x\\) ✓" },
      { id: 14, level: 3, typ: "mc", frage: "Stammfunktion von \\(f(x) = 4x^3 - 6x^2 + 2\\):", optionen: ["\\(x^4 - 2x^3 + 2x\\)", "\\(12x^2 - 12x\\)", "\\(4x^4 - 6x^3 + 2x\\)", "\\(x^4 - 3x^2 + 2\\)"], korrekt: 0, tipp: "Jeden Summand einzeln.", loesungsweg: "Jeder Summand einzeln: $$\\int (4x^3-6x^2+2)\\,dx = \\frac{4x^4}{4} - \\frac{6x^3}{3} + 2x + C = x^4 - 2x^3 + 2x + C$$ Probe: \\((x^4-2x^3+2x)' = 4x^3-6x^2+2\\) ✓ Die \\(2\\) wird zu \\(2x\\), nicht zu \\(2\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Bestimme eine Stammfunktion von \\(f(x) = x^3 - 4x + 5\\) mit \\(C = 0\\) und berechne ihren Wert an der Stelle \\(x = 2\\).", loesung: 6, toleranz: 0.01, tipp: "Leite jeden der drei Summanden einzeln auf; der konstante Summand wird dabei zu einem Term mit \\(x\\).", loesungsweg: "Summandenweises Aufleiten: $$F(x) = \\frac{x^4}{4} - 2x^2 + 5x$$ Probe: \\(F'(x) = x^3 - 4x + 5\\) — richtig. Einsetzen: $$F(2) = \\frac{16}{4} - 2 \\cdot 4 + 10 = 4 - 8 + 10 = 6$$ Der konstante Summand \\(5\\) wird zu \\(5x\\), nicht wieder zu \\(5\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Stammfunktion von \\(f(x) = x^2 - 4x + 3\\):", optionen: ["\\(\\frac{x^3}{3} - 2x^2 + 3x\\)", "\\(2x - 4\\)", "\\(x^3 - 4x^2 + 3x\\)", "\\(\\frac{x^3}{3} - 4x^2 + 3\\)"], korrekt: 0, tipp: "Potenzregel auf jeden Summanden.", loesungsweg: "$$\\int (x^2-4x+3)\\,dx = \\frac{x^3}{3} - \\frac{4x^2}{2} + 3x + C = \\frac{x^3}{3} - 2x^2 + 3x + C$$ Probe: \\(\\left(\\tfrac{x^3}{3}-2x^2+3x\\right)' = x^2-4x+3\\) ✓ Der Faktor \\(4\\) halbiert sich, weil durch den neuen Exponenten \\(2\\) geteilt wird." },
      { id: 17, level: 3, typ: "numerisch", frage: "Bestimme eine Stammfunktion von \\(f(x) = \\frac{x^2}{3} + 2x\\) mit \\(C = 0\\) und berechne ihren Wert an der Stelle \\(x = 3\\).", loesung: 12, toleranz: 0.01, tipp: "Der Bruch vor der Potenz ist ein konstanter Faktor und bleibt beim Aufleiten stehen; er wird anschließend mit dem neuen Nenner zusammengefasst.", loesungsweg: "Der Faktor \\(\\frac13\\) bleibt stehen, die Potenzregel wirkt auf \\(x^2\\) und auf \\(x\\): $$F(x) = \\frac13 \\cdot \\frac{x^3}{3} + x^2 = \\frac{x^3}{9} + x^2$$ Probe: \\(F'(x) = \\frac{3x^2}{9} + 2x = \\frac{x^2}{3} + 2x\\) — richtig. Einsetzen: $$F(3) = \\frac{27}{9} + 9 = 3 + 9 = 12$$" },
      { id: 18, level: 3, typ: "mc", frage: "Stammfunktion von \\(f(x) = \\frac{1}{2}x^2 + 3\\):", optionen: ["\\(x + 3\\)", "\\(\\frac{x^3}{6} + 3x\\)", "\\(\\frac{x^3}{2} + 3x\\)", "\\(\\frac{x^3}{6}\\)"], korrekt: 1, tipp: "Der Bruch vor der Potenz bleibt als Faktor stehen und wird mit dem neuen Nenner zusammengefasst; der konstante Summand liefert einen Term mit \\(x\\).", loesungsweg: "Der Bruch \\(\\tfrac12\\) bleibt als Faktor erhalten: $$\\int \\left(\\tfrac12 x^2 + 3\\right)dx = \\frac12 \\cdot \\frac{x^3}{3} + 3x + C = \\frac{x^3}{6} + 3x + C$$ Probe: \\(\\left(\\tfrac{x^3}{6}\\right)' = \\tfrac{3x^2}{6} = \\tfrac12 x^2\\) ✓" },
      // LEVEL 4 -- Spezialfälle: 1/x, e^x, sin, cos
      { id: 19, level: 4, typ: "numerisch", frage: "Gesucht ist die Stammfunktion \\(F\\) von \\(f(x) = 4x - 3\\), für die \\(F(2) = 1\\) gilt. Berechne \\(F(0)\\).", loesung: -1, toleranz: 0.01, tipp: "Leite zuerst allgemein mit unbekannter Konstante auf; die gegebene Bedingung legt diese Konstante fest, und erst danach wird die gesuchte Stelle eingesetzt.", loesungsweg: "Allgemeines Aufleiten: $$F(x) = 2x^2 - 3x + C$$ Bedingung einsetzen: $$F(2) = 8 - 6 + C = 2 + C = 1 \\;\\Longrightarrow\\; C = -1$$ Damit ist \\(F(x) = 2x^2 - 3x - 1\\) und $$F(0) = 0 - 0 - 1 = -1$$ An der Stelle \\(0\\) fallen alle Potenzterme weg, übrig bleibt gerade die Konstante — sie muss also vorher bestimmt sein." },
      { id: 20, level: 4, typ: "numerisch", frage: "Bestimme eine Stammfunktion von \\(f(x) = \\frac{3}{x} + 2e^{x}\\) mit \\(C = 0\\) und berechne ihren Wert an der Stelle \\(x = 1\\) (auf drei Nachkommastellen).", loesung: 5.437, toleranz: 0.02, tipp: "Für beide Summanden versagt die Potenzregel; für jeden gibt es eine eigene Grundstammfunktion. Denke beim Einsetzen an die Werte an der Stelle \\(1\\).", loesungsweg: "Der Kehrwert wird zum Logarithmus, die e-Funktion bleibt sie selbst; konstante Faktoren bleiben stehen: $$F(x) = 3\\ln|x| + 2e^{x}$$ Einsetzen: $$F(1) = 3\\ln 1 + 2e^{1} = 0 + 2e \\approx 5{,}437$$ Der Logarithmus verschwindet an der Stelle \\(1\\), weil \\(\\ln 1 = 0\\) ist — der ganze Wert stammt aus dem e-Anteil." },
      { id: 21, level: 4, typ: "numerisch", frage: "Gesucht ist die Stammfunktion \\(F\\) von \\(f(x) = \\cos x\\), für die \\(F(0) = 2\\) gilt. Berechne \\(F\\!\\left(\\frac{\\pi}{2}\\right)\\).", loesung: 3, toleranz: 0.01, tipp: "Bestimme zuerst die Grundstammfunktion des Kosinus, dann die Konstante aus der Bedingung; die Kosinus- und Sinuswerte an den beiden Stellen sind aus dem Einheitskreis bekannt.", loesungsweg: "Die Stammfunktion des Kosinus ist der Sinus: $$F(x) = \\sin x + C$$ Bedingung: \\(F(0) = \\sin 0 + C = C = 2\\), also \\(C = 2\\). Einsetzen: $$F\\!\\left(\\frac{\\pi}{2}\\right) = \\sin\\!\\left(\\frac{\\pi}{2}\\right) + 2 = 1 + 2 = 3$$ Beim Kosinus bleibt das Vorzeichen erhalten — beim Sinus wäre ein Minus vor der Stammfunktion nötig." },
      { id: 22, level: 4, typ: "numerisch", frage: "Von einer Funktion \\(F\\) ist bekannt: \\(F'(x) = x^2 - 6x\\) und \\(F(3) = 0\\). Berechne \\(F(0)\\).", loesung: 18, toleranz: 0.01, tipp: "Die Angabe zur Ableitung liefert \\(F\\) bis auf eine Konstante; die Wertangabe legt diese fest.", loesungsweg: "Aufleiten der Ableitung: $$F(x) = \\frac{x^3}{3} - 3x^2 + C$$ Bedingung einsetzen: $$F(3) = 9 - 27 + C = -18 + C = 0 \\;\\Longrightarrow\\; C = 18$$ Damit ist $$F(0) = 0 - 0 + 18 = 18$$ Auch hier bleibt an der Stelle \\(0\\) nur die Konstante stehen." },
      { id: 23, level: 4, typ: "mc", frage: "Welche Funktion ist eine Stammfunktion von \\(f(x) = \\frac{1}{x} + \\sin x\\) (für \\(x > 0\\))?", optionen: ["\\(\\ln(x) - \\cos(x)\\)", "\\(\\ln(x) + \\cos(x)\\)", "\\(-\\frac{1}{x^2} - \\cos(x)\\)", "\\(x\\ln(x) + \\cos(x)\\)"], korrekt: 0, tipp: "Prüfe die Vorschläge durch Ableiten; besonders beim trigonometrischen Summanden entscheidet das Vorzeichen.", loesungsweg: "Beide Summanden werden getrennt aufgeleitet. Für den Kehrwert gilt \\(\\int \\frac1x\\,dx = \\ln x\\) (für \\(x>0\\)); für den Sinus ist die Stammfunktion \\(-\\cos x\\), denn \\((-\\cos x)' = \\sin x\\). Zusammen: $$F(x) = \\ln(x) - \\cos(x)$$ Probe: \\(F'(x) = \\frac1x + \\sin x\\) — richtig. Der Vorschlag \\(-\\frac{1}{x^2}\\) ist die <b>Ableitung</b> von \\(\\frac1x\\), nicht deren Stammfunktion." },
      { id: 24, level: 4, typ: "numerisch", frage: "Ein Körper bewegt sich mit der Geschwindigkeit \\(v(t) = 3t^2 + 2\\) (in Metern pro Sekunde). Zum Zeitpunkt \\(t = 0\\) hat er bereits \\(5\\) Meter zurückgelegt. Welchen Weg hat er nach \\(2\\) Sekunden insgesamt zurückgelegt?", loesung: 17, toleranz: 0.05, tipp: "Der zurückgelegte Weg ist eine Stammfunktion der Geschwindigkeit; die Angabe zum Zeitpunkt null legt die Integrationskonstante fest.", loesungsweg: "Aufleiten der Geschwindigkeit ergibt die Wegfunktion: $$s(t) = t^3 + 2t + C$$ Aus \\(s(0) = C = 5\\) folgt \\(C = 5\\). Nach zwei Sekunden: $$s(2) = 8 + 4 + 5 = 17$$ Der Körper hat also insgesamt 17 Meter zurückgelegt. Ohne die Anfangsangabe wären es nur die \\(12\\) Meter der zwei Sekunden — die Konstante trägt den schon vorher zurückgelegten Weg." },
      // LEVEL 5 -- zwei Bedingungen, Regeln kombinieren, Fehler finden
      { id: 25, level: 5, typ: "mc", frage: "Vorgelegt wird: „Eine Stammfunktion von \\(f(x) = (2x+1)^3\\) ist \\(F(x) = \\frac{(2x+1)^4}{4}\\).“ Wie ist das zu beurteilen?", optionen: ["Richtig, die Potenzregel liefert genau das.", "Falsch, der Nenner muss \\(8\\) lauten.", "Falsch, der Nenner muss \\(2\\) lauten.", "Falsch, der Exponent muss \\(2\\) lauten."], korrekt: 1, tipp: "Leite den vorgeschlagenen Term ab und vergleiche ihn mit \\(f\\); bei einer Klammer wirkt die Kettenregel mit.", loesungsweg: "Die Probe entscheidet. Ableiten des Vorschlags mit der Kettenregel: $$\\left(\\frac{(2x+1)^4}{4}\\right)' = \\frac{4(2x+1)^3 \\cdot 2}{4} = 2(2x+1)^3$$ Das ist das <b>Doppelte</b> von \\(f\\), der Vorschlag ist also falsch. Die innere Ableitung \\(2\\) muss beim Aufleiten ausgeglichen werden, man teilt zusätzlich durch \\(2\\): $$F(x) = \\frac{(2x+1)^4}{8}$$ Probe: \\(\\frac{4(2x+1)^3 \\cdot 2}{8} = (2x+1)^3\\). Beim Aufleiten einer Klammer mit linearem Inneren wird also durch die innere Ableitung geteilt, nicht mit ihr multipliziert." },
      { id: 26, level: 5, typ: "numerisch", frage: "Von \\(f(x) = ax + b\\) ist bekannt: \\(f(0) = 2\\), und die Stammfunktion \\(F\\) mit \\(F(0) = 1\\) erfüllt \\(F(2) = 9\\). Bestimme \\(a\\).", loesung: 2, toleranz: 0.01, tipp: "Aus der ersten Angabe folgt sofort einer der beiden Koeffizienten; die Bedingung an \\(F\\) liefert danach eine Gleichung für den anderen.", loesungsweg: "Aus \\(f(0) = b = 2\\) folgt \\(b = 2\\). Aufleiten: $$F(x) = \\frac{a}{2}x^2 + 2x + C$$ Aus \\(F(0) = C = 1\\) folgt \\(C = 1\\). Einsetzen der zweiten Bedingung: $$F(2) = \\frac{a}{2} \\cdot 4 + 4 + 1 = 2a + 5 = 9$$ also \\(2a = 4\\) und damit \\(a = 2\\). Gesucht war ausdrücklich \\(a\\); die Funktion lautet \\(f(x) = 2x + 2\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 4e^{2x} - 3\\sin(3x)\\). Bestimme die Stammfunktion \\(F\\) ohne zusätzliche Konstante (also mit \\(C = 0\\)) und berechne \\(F(0)\\).", loesung: 3, toleranz: 0.01, tipp: "Beide Summanden getrennt aufleiten; bei beiden ist die innere Ableitung auszugleichen, beim Sinus kommt das Vorzeichen hinzu.", loesungsweg: "Erster Summand: \\(\\int 4e^{2x}\\,dx = 2e^{2x}\\), denn beim Aufleiten wird durch die innere Ableitung \\(2\\) geteilt. Zweiter Summand: die Stammfunktion des Sinus ist \\(-\\cos\\), zusammen mit dem Teilen durch \\(3\\) ergibt sich $$\\int -3\\sin(3x)\\,dx = -3 \\cdot \\left(-\\frac{\\cos(3x)}{3}\\right) = \\cos(3x)$$ Also \\(F(x) = 2e^{2x} + \\cos(3x)\\). Probe durch Ableiten: \\(4e^{2x} - 3\\sin(3x)\\) — richtig. Einsetzen: $$F(0) = 2 \\cdot 1 + 1 = 3$$" },
      { id: 28, level: 5, typ: "mc", frage: "Vorgelegt wird: „Eine Stammfunktion von \\(f(x) = \\frac{1}{x^2}\\) ist \\(F(x) = \\ln(x^2)\\).“ Wie ist das zu beurteilen?", optionen: ["Richtig, im Nenner steht \\(x\\).", "Falsch, richtig ist \\(F(x) = -\\frac{1}{x}\\).", "Falsch, richtig ist \\(F(x) = 2\\ln(x)\\).", "Falsch, richtig ist \\(F(x) = \\frac{1}{2x}\\)."], korrekt: 1, tipp: "Schreibe den Term als Potenz mit negativem Exponenten und wende die Potenzregel an; prüfe den Vorschlag zusätzlich durch Ableiten.", loesungsweg: "Der Vorschlag ist falsch, wie die Probe zeigt: $$\\left(\\ln(x^2)\\right)' = \\frac{2x}{x^2} = \\frac{2}{x} \\ne \\frac{1}{x^2}$$ Richtig geht man über die Potenzschreibweise: \\(f(x) = x^{-2}\\). Die Potenzregel erhöht den Exponenten um eins und teilt durch den neuen Exponenten: $$F(x) = \\frac{x^{-1}}{-1} = -\\frac{1}{x}$$ Probe: \\(\\left(-x^{-1}\\right)' = x^{-2}\\) — richtig. Der Logarithmus gehört nur zu \\(\\frac{1}{x}\\), also zum Exponenten \\(-1\\), für den die Potenzregel gerade nicht anwendbar ist." },
      { id: 29, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 6x^2 + a\\). Die Stammfunktion \\(F\\) erfüllt \\(F(0) = 1\\) und \\(F(1) = 4\\). Bestimme \\(a\\).", loesung: 1, toleranz: 0.01, tipp: "Leite zuerst allgemein mit dem Parameter auf; die erste Bedingung legt die Integrationskonstante fest, die zweite den Parameter.", loesungsweg: "Aufleiten mit Parameter: $$F(x) = 2x^3 + ax + C$$ Aus \\(F(0) = C = 1\\) folgt \\(C = 1\\). Die zweite Bedingung liefert $$F(1) = 2 + a + 1 = 4$$ also \\(a = 1\\). Beide Angaben werden gebraucht: die eine für die Konstante, die andere für den Parameter — wer nur eine benutzt, kann nicht beide Unbekannten bestimmen." },
      { id: 30, level: 5, typ: "numerisch", frage: "Gesucht ist die Stammfunktion \\(F\\) von \\(f(x) = \\cos(2x)\\) mit \\(F\\!\\left(\\frac{\\pi}{4}\\right) = 0\\). Berechne \\(F(0)\\).", loesung: -0.5, toleranz: 0.01, tipp: "Zuerst allgemein aufleiten (innere Ableitung beachten), dann die Bedingung einsetzen und erst danach die gesuchte Stelle.", loesungsweg: "Allgemeines Aufleiten: $$F(x) = \\frac{1}{2}\\sin(2x) + C$$ Bedingung einsetzen: \\(\\sin\\!\\left(\\frac{\\pi}{2}\\right) = 1\\), also $$\\frac{1}{2} + C = 0 \\;\\Longrightarrow\\; C = -\\frac{1}{2}$$ Damit ist \\(F(x) = \\frac{1}{2}\\sin(2x) - \\frac{1}{2}\\) und $$F(0) = 0 - \\frac{1}{2} = -0{,}5$$ Die Reihenfolge ist wesentlich: erst die Konstante bestimmen, dann einsetzen." },
      // LEVEL 6 -- Abi-Format: Nachweis, Bestandsfunktion, Beurteilung
      { id: 31, level: 6, typ: "mc", frage: "Beurteilen Sie: „Sind \\(F\\) und \\(G\\) Stammfunktionen derselben Funktion \\(f\\) auf einem Intervall, so unterscheiden sie sich dort nur um eine Konstante.“", optionen: ["Zutreffend: die Differenz hat die Ableitung null.", "Widerlegt: es gibt beliebig viele Bauformen.", "Nur mit dem Zusatz, dass \\(f\\) stetig ist.", "Nur für ganzrationale Funktionen zutreffend."], korrekt: 0, tipp: "Betrachten Sie die Differenz der beiden Stammfunktionen und fragen Sie, welche Ableitung dieser Term hat.", loesungsweg: "Die Aussage trifft zu. Begründung: Setzt man \\(H = F - G\\), so gilt auf dem ganzen Intervall $$H'(x) = F'(x) - G'(x) = f(x) - f(x) = 0$$ Eine Funktion mit überall verschwindender Ableitung ist auf einem Intervall konstant, also \\(H(x) = C\\) und damit \\(F(x) = G(x) + C\\). Genau deshalb schreibt man beim unbestimmten Integral stets „\\(+\\,C\\)“. Der Zusatz „auf einem Intervall“ ist nötig: über getrennte Definitionsbereiche hinweg dürfen die Konstanten verschieden sein." },
      { id: 32, level: 6, typ: "numerisch", frage: "Eine Bakterienkultur wächst mit der momentanen Zuwachsrate \\(w(t) = 200 \\cdot e^{0{,}4t}\\) (in Bakterien pro Stunde, \\(t\\) in Stunden). Zu Beginn sind 500 Bakterien vorhanden. Bestimmen Sie die Bestandsfunktion und berechnen Sie den Bestand nach 5 Stunden (auf eine Nachkommastelle).", loesung: 3694.5, toleranz: 5, tipp: "Der Bestand ist eine Stammfunktion der Zuwachsrate; die Angabe zum Anfangszeitpunkt legt die Integrationskonstante fest.", loesungsweg: "Aufleiten der Rate: $$N(t) = \\int 200e^{0{,}4t}\\,dt = \\frac{200}{0{,}4}e^{0{,}4t} + C = 500e^{0{,}4t} + C$$ Anfangsbedingung: \\(N(0) = 500 + C = 500\\), also \\(C = 0\\) — der Vorfaktor stimmt hier zufällig mit dem Anfangsbestand überein, das ist kein Automatismus. Nach 5 Stunden: $$N(5) = 500 \\cdot e^{2} \\approx 500 \\cdot 7{,}389 \\approx 3694{,}5$$ Es sind also rund 3695 Bakterien vorhanden." },
      { id: 33, level: 6, typ: "numerisch", frage: "Zeigen Sie, dass \\(F(x) = (2x-3) \\cdot e^{x}\\) eine Stammfunktion von \\(f(x) = (2x-1) \\cdot e^{x}\\) ist, und berechnen Sie \\(F(2) - F(0)\\) (auf zwei Nachkommastellen).", loesung: 10.39, toleranz: 0.05, tipp: "Der Nachweis gelingt durch Ableiten des angegebenen Terms mit der Produktregel; erst danach die beiden Werte einsetzen.", loesungsweg: "<b>Nachweis:</b> Produktregel mit \\(u = 2x-3\\), \\(v = e^x\\): $$F'(x) = 2 \\cdot e^x + (2x-3) \\cdot e^x = e^x\\left(2 + 2x - 3\\right) = (2x-1)e^x$$ Das ist genau \\(f(x)\\); \\(F\\) ist also eine Stammfunktion. <b>Werte:</b> $$F(2) = 1 \\cdot e^2 \\approx 7{,}389, \\qquad F(0) = (-3) \\cdot 1 = -3$$ $$F(2) - F(0) \\approx 7{,}389 + 3 = 10{,}39$$ Ein Nachweis dieser Art verlangt kein Aufleiten — es genügt, den angebotenen Term abzuleiten." },
      { id: 34, level: 6, typ: "numerisch", frage: "Gegeben ist die Schar \\(f_a(x) = a \\cdot x^2 - 6x\\) mit \\(a \\ne 0\\). Zu jedem \\(a\\) sei \\(F_a\\) die Stammfunktion mit \\(F_a(0) = 0\\). Bestimmen Sie \\(a\\) so, dass zusätzlich \\(F_a(3) = 0\\) gilt.", loesung: 3, toleranz: 0.01, tipp: "Leiten Sie zunächst allgemein mit dem Parameter auf; die erste Bedingung entscheidet über die Konstante, die zweite über den Parameter.", loesungsweg: "Aufleiten mit Parameter: $$F_a(x) = \\frac{a}{3}x^3 - 3x^2 + C$$ Aus \\(F_a(0) = C = 0\\) folgt \\(C = 0\\). Zweite Bedingung: $$F_a(3) = \\frac{a}{3} \\cdot 27 - 3 \\cdot 9 = 9a - 27 = 0$$ also \\(a = 3\\). Für dieses \\(a\\) hat \\(F_a\\) an beiden Stellen den Wert null; anschaulich heben sich die Beiträge über dem Intervall gerade auf." },
      { id: 35, level: 6, typ: "mc", frage: "Beurteilen Sie: „Ist \\(F\\) eine Stammfunktion von \\(f\\), so ist \\(F^2\\) eine Stammfunktion von \\(f^2\\).“", optionen: ["Zutreffend, das Quadrieren bleibt erhalten.", "Widerlegt schon durch \\(f(x) = 1\\).", "Nur bei linearen Funktionen zutreffend.", "Zutreffend, sofern \\(F(0) = 0\\) gilt."], korrekt: 1, tipp: "Prüfen Sie die Behauptung an einer möglichst einfachen Funktion und leiten Sie das Quadrat mit der Produktregel ab.", loesungsweg: "Die Aussage ist falsch; ein Gegenbeispiel genügt. Für \\(f(x) = 1\\) ist \\(F(x) = x\\) eine Stammfunktion. Dann wäre zu prüfen, ob \\(F^2(x) = x^2\\) eine Stammfunktion von \\(f^2(x) = 1\\) ist: $$\\left(x^2\\right)' = 2x \\ne 1$$ Das ist nicht der Fall. Allgemein liefert die Produktregel $$\\left(F^2\\right)' = 2F \\cdot F' = 2F \\cdot f$$ und das ist nur in Sonderfällen gleich \\(f^2\\). Für Produkte und Potenzen von Funktionen gibt es keine einfache Regel zum Aufleiten." },
      { id: 36, level: 6, typ: "numerisch", frage: "Von einer Funktion \\(f\\) ist bekannt: \\(f'(x) = 6x - 4\\) und \\(f(1) = 3\\). Zeigen Sie, dass \\(f\\) eine quadratische Funktion ist, und berechnen Sie \\(f(4)\\).", loesung: 36, toleranz: 0.01, tipp: "Aus der Ableitung gewinnt man die Funktion durch Aufleiten; die Wertangabe legt die Integrationskonstante fest.", loesungsweg: "<b>Form:</b> Aufleiten von \\(f'\\) ergibt $$f(x) = 3x^2 - 4x + C$$ Der höchste Exponent ist \\(2\\) und der Vorfaktor \\(3 \\ne 0\\), also ist \\(f\\) für jede Konstante eine quadratische Funktion. <b>Konstante:</b> $$f(1) = 3 - 4 + C = 3 \\;\\Longrightarrow\\; C = 4$$ <b>Wert:</b> $$f(4) = 3 \\cdot 16 - 16 + 4 = 48 - 16 + 4 = 36$$ Die Konstante muss vor dem Einsetzen bestimmt werden — ohne sie ist der Wert an der Stelle \\(4\\) nicht festgelegt." }];
    </script>
