    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-strahlensatz';
    const THEMA_CONFIG = { name: 'Strahlensatz', bereich: 'geometrie' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht ==========
      { id: 1, level: 1, typ: "mc", frage: "Voraussetzung für den Strahlensatz ist ...", optionen: ["zwei senkrechte Geraden", "zwei Strahlen mit gemeinsamem Anfang und zwei parallele Schnittgeraden", "ein Kreis mit zwei Sehnen", "ein Rechteck"], korrekt: 1, tipp: "Zwei Strahlen aus einem Zentrum, geschnitten von Parallelen.", loesungsweg: "Zwei Strahlen mit gemeinsamem Anfangspunkt und zwei <b>parallele Schnittgeraden</b>." },
      { id: 2, level: 1, typ: "mc", frage: "Das Zentrum der beiden Strahlen wird mit welchem Buchstaben bezeichnet?", optionen: ["\\(M\\)", "\\(P\\)", "\\(Z\\) (Scheitel) / \\(S\\)", "\\(O\\)"], korrekt: 2, tipp: "Scheitelpunkt.", loesungsweg: "Häufig \\(S\\) oder \\(Z\\) -- der Scheitelpunkt der Strahlen." },
      { id: 3, level: 1, typ: "mc", frage: "Welche Geraden müssen parallel sein?", optionen: ["die Strahlen", "die Schnittgeraden", "keine", "alle vier"], korrekt: 1, tipp: "Strahlen schneiden sich ja im Scheitel.", loesungsweg: "Die beiden <b>Schnittgeraden</b> müssen parallel sein." },
      { id: 4, level: 1, typ: "mc", frage: "Der Strahlensatz liefert eine Aussage über ...", optionen: ["Winkel", "Flächen", "Streckenverhältnisse", "Volumen"], korrekt: 2, tipp: "Verhältnisse von Strecken.", loesungsweg: "Er liefert Proportionen von <b>Strecken</b> auf den Strahlen." },
      { id: 5, level: 1, typ: "numerisch", frage: "Auf Strahl 1: \\(SA = 3\\), \\(SA' = 9\\). Streckungsfaktor?", loesung: 3, toleranz: 0, tipp: "\\(k = \\frac{SA'}{SA}\\).", loesungsweg: "$$k = \\frac{9}{3} = 3$$" },
      { id: 6, level: 1, typ: "mc", frage: "Welcher Bruch steht beim 1. Strahlensatz links?", optionen: ["\\(\\frac{SA}{SA'}\\)", "\\(\\frac{AA'}{BB'}\\)", "\\(\\frac{SA}{AB}\\)", "\\(\\frac{AB}{SA}\\)"], korrekt: 0, tipp: "Streckenverhältnis auf einem Strahl.", loesungsweg: "Der 1. Strahlensatz vergleicht die Abschnitte <b>auf den Strahlen</b>, jeweils vom Scheitel \\(S\\) aus gemessen: $$\\frac{SA}{SA'} = \\frac{SB}{SB'}$$ Die Verhältnisse der Parallelenabschnitte gehören dagegen zum 2. Strahlensatz. Entscheidend ist, dass beide Brüche gleich gebaut sind: oben die kurze, unten die lange Strecke." },
      // ========== LEVEL 2 -- leicht: Einfache Berechnungen ==========
      { id: 7, level: 2, typ: "numerisch", frage: "\\(SA = 4\\), \\(SA' = 12\\), \\(SB = 5\\). Berechne \\(SB'\\).", loesung: 15, toleranz: 0, tipp: "\\(\\frac{SA}{SA'} = \\frac{SB}{SB'}\\).", loesungsweg: "$$\\frac{4}{12} = \\frac{5}{SB'} \\implies SB' = 15$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(SA = 2\\), \\(SA' = 8\\), \\(AB = 3\\). Berechne \\(A'B'\\).", loesung: 12, toleranz: 0, tipp: "2. Strahlensatz: \\(\\frac{SA}{SA'} = \\frac{AB}{A'B'}\\).", loesungsweg: "$$\\frac{2}{8} = \\frac{3}{A'B'} \\implies A'B' = 12$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(SA = 6\\), \\(SB = 4\\), \\(SA' = 9\\). \\(SB' = ?\\)", loesung: 6, toleranz: 0, tipp: "\\(\\frac{6}{9} = \\frac{4}{SB'}\\).", loesungsweg: "$$SB' = \\frac{9 \\cdot 4}{6} = 6$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(SA = 3\\), \\(SA' = 12\\), \\(SB' = 20\\). \\(SB = ?\\)", loesung: 5, toleranz: 0, tipp: "\\(\\frac{3}{12} = \\frac{SB}{20}\\).", loesungsweg: "$$SB = \\frac{3 \\cdot 20}{12} = 5$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "\\(AB = 4\\), \\(A'B' = 10\\), \\(SA = 6\\). \\(SA' = ?\\)", loesung: 15, toleranz: 0, tipp: "\\(\\frac{SA}{SA'} = \\frac{AB}{A'B'}\\).", loesungsweg: "$$\\frac{6}{SA'} = \\frac{4}{10} \\implies SA' = 15$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Zwei Parallelen, \\(SA = 5\\), \\(AA' = 10\\), \\(SB = 4\\). \\(SB'\\) (Gesamtstrecke)?", loesung: 12, toleranz: 0, tipp: "\\(SA' = SA + AA' = 15\\). Proportion.", loesungsweg: "$$SA' = 15, \\frac{5}{15} = \\frac{4}{SB'} \\implies SB' = 12$$" },
      // ========== LEVEL 3 -- nervenschonend ==========
      { id: 13, level: 3, typ: "numerisch", frage: "\\(SA = 5\\,\\text{cm}\\), \\(AA' = 10\\,\\text{cm}\\), \\(SB = 3\\,\\text{cm}\\). Berechne \\(BB'\\) in cm.", loesung: 6, toleranz: 0, tipp: "\\(SA' = 15\\), \\(SB' = 9\\), \\(BB' = 6\\).", loesungsweg: "$$\\frac{5}{15} = \\frac{3}{SB'} \\implies SB' = 9, BB' = 6$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(SA = 4\\), \\(SA' = 10\\), \\(AB = 6\\). \\(A'B' = ?\\)", loesung: 15, toleranz: 0, tipp: "\\(\\frac{4}{10} = \\frac{6}{A'B'}\\).", loesungsweg: "$$A'B' = \\frac{10 \\cdot 6}{4} = 15$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Ein Baum wirft \\(12\\,\\text{m}\\) Schatten. Eine \\(1{,}80\\,\\text{m}\\) Person \\(3\\,\\text{m}\\) Schatten. Baumhöhe in m?", loesung: 7.2, toleranz: 0.05, tipp: "\\(\\frac{h}{12} = \\frac{1{,}8}{3}\\).", loesungsweg: "$$h = \\frac{1{,}8 \\cdot 12}{3} = 7{,}2\\,\\text{m}$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "\\(SA = 2\\), \\(SA' = 7\\), \\(SB = 3\\). \\(SB' = ?\\) (auf 2 Nachkommastellen)", loesung: 10.5, toleranz: 0.05, tipp: "\\(\\frac{2}{7} = \\frac{3}{SB'}\\).", loesungsweg: "$$SB' = \\frac{3 \\cdot 7}{2} = 10{,}5$$" },
      { id: 17, level: 3, typ: "mc", frage: "Wann gilt der Strahlensatz nicht?", optionen: ["wenn die Schnittgeraden parallel sind", "wenn die Schnittgeraden nicht parallel sind", "wenn der Scheitel rechts liegt", "wenn ein Strahl kurz ist"], korrekt: 1, tipp: "Parallelität ist Voraussetzung.", loesungsweg: "Ohne parallele Schnittgeraden gilt der Strahlensatz <b>nicht</b>." },
      { id: 18, level: 3, typ: "numerisch", frage: "Person \\(1{,}6\\,\\text{m}\\) hoch, Schattenlänge \\(2\\,\\text{m}\\). Mast \\(24\\,\\text{m}\\) Schatten. Masthöhe in m?", loesung: 19.2, toleranz: 0.1, tipp: "Strahlensatz mit Sonne als Scheitel.", loesungsweg: "$$h = \\frac{1{,}6}{2} \\cdot 24 = 19{,}2\\,\\text{m}$$" },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Eine Straßenlaterne ist \\(5\\,\\text{m}\\) hoch. Eine \\(1{,}7\\,\\text{m}\\) große Person steht \\(6\\,\\text{m}\\) vom Fuß der Laterne entfernt auf ebenem Boden. Wie lang ist ihr Schatten in m? Runde auf zwei Dezimalen.", loesung: 3.09, toleranz: 0.02, tipp: "Der Scheitel liegt an der Schattenspitze; von dort aus sind Person und Laterne parallele Strecken.", loesungsweg: "Mit Schattenlänge \\(s\\): Vom Scheitel (Schattenspitze) bis zur Person sind es \\(s\\), bis zur Laterne \\(s + 6\\). $$\\frac{1{,}7}{5} = \\frac{s}{s+6} \\quad\\Rightarrow\\quad 5s = 1{,}7s + 10{,}2 \\quad\\Rightarrow\\quad s = \\frac{10{,}2}{3{,}3} \\approx 3{,}09\\,\\text{m}$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Von \\(S\\) gehen zwei Strahlen aus. Auf dem ersten liegen \\(A\\) und \\(A'\\) mit \\(SA = 4\\) und \\(AA' = 6\\), auf dem zweiten \\(B\\) und \\(B'\\), wobei \\(AB \\parallel A'B'\\) und \\(AB = 3\\). Berechne \\(A'B'\\).", loesung: 7.5, toleranz: 0.01, tipp: "Welche Strecke vom Scheitel aus gehört zu \\(A'B'\\)? Sie ist nicht \\(AA'\\).", loesungsweg: "\\(SA' = SA + AA' = 10\\). Parallelenabschnitte verhalten sich wie die Scheitelabschnitte: $$\\frac{A'B'}{AB} = \\frac{SA'}{SA} = \\frac{10}{4} \\quad\\Rightarrow\\quad A'B' = 3 \\cdot 2{,}5 = 7{,}5$$" },
      { id: 21, level: 4, typ: "numerisch", frage: "Zwei Parallelen schneiden zwei Strahlen mit Scheitel \\(S\\) in \\(A\\), \\(B\\) bzw. \\(A'\\), \\(B'\\). Es gilt \\(SB = 6\\), \\(SB' = 15\\) und \\(A'B' = 12{,}5\\). Wie lang ist \\(AB\\)?", loesung: 5, toleranz: 0.01, tipp: "Bestimme zuerst, um welchen Faktor die äußere Figur größer ist als die innere.", loesungsweg: "Streckfaktor \\(k = \\frac{SB'}{SB} = \\frac{15}{6} = 2{,}5\\). Die innere Parallelenstrecke ist entsprechend kürzer: $$AB = \\frac{A'B'}{k} = \\frac{12{,}5}{2{,}5} = 5$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Um die Breite eines Flusses zu bestimmen, wird am Ufer ein Punkt \\(P\\) genau gegenüber einem Baum \\(B\\) am anderen Ufer markiert. Von \\(P\\) geht man \\(30\\,\\text{m}\\) am geraden Ufer entlang bis \\(Q\\) und weitere \\(10\\,\\text{m}\\) bis \\(R\\). Von \\(R\\) aus geht man senkrecht zum Ufer vom Fluss weg bis zu einem Punkt \\(T\\), von dem aus \\(Q\\) und \\(B\\) genau hintereinander liegen; \\(RT = 8\\,\\text{m}\\). Wie breit ist der Fluss (Strecke \\(PB\\)) in m?", loesung: 24, toleranz: 0, tipp: "Fertige eine Skizze an: \\(Q\\) ist der Scheitel zweier Dreiecke, deren Seiten \\(PB\\) und \\(RT\\) parallel sind.", loesungsweg: "\\(PB\\) und \\(RT\\) stehen beide senkrecht auf dem Ufer, sind also parallel; \\(Q\\) ist der Scheitel. $$\\frac{PB}{RT} = \\frac{PQ}{QR} \\quad\\Rightarrow\\quad PB = 8 \\cdot \\frac{30}{10} = 24\\,\\text{m}$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Im Dreieck \\(ABC\\) ist \\(AB = 12\\,\\text{cm}\\). Auf \\(AC\\) liegt \\(D\\) mit \\(AD = 4\\,\\text{cm}\\) und \\(DC = 2\\,\\text{cm}\\); die Parallele zu \\(AB\\) durch \\(D\\) schneidet \\(BC\\) in \\(E\\). Wie lang ist \\(DE\\) in cm?", loesung: 4, toleranz: 0.01, tipp: "Der Scheitel der Strahlensatzfigur ist hier nicht \\(A\\); überlege, von welchem Punkt aus die Parallelen geschnitten werden.", loesungsweg: "Scheitel ist \\(C\\): \\(CD = 2\\), \\(CA = 6\\). $$\\frac{DE}{AB} = \\frac{CD}{CA} = \\frac{2}{6} \\quad\\Rightarrow\\quad DE = 12 \\cdot \\frac{1}{3} = 4\\,\\text{cm}$$" },
      { id: 24, level: 4, typ: "mc", frage: "In einer Strahlensatzfigur mit Scheitel \\(S\\) gilt \\(SA = 3\\), \\(SA' = 9\\) und \\(AB = 5\\); gesucht ist \\(x = A'B'\\). Welcher Ansatz ist richtig?", optionen: ["\\(\\frac{3}{9} = \\frac{5}{x}\\)", "\\(\\frac{3}{9} = \\frac{x}{5}\\)", "\\(\\frac{3}{5} = \\frac{x}{9}\\)", "\\(\\frac{9}{3} = \\frac{5}{x}\\)"], korrekt: 0, tipp: "Auf beiden Seiten muss die Strecke zur inneren Parallelen an derselben Stelle stehen.", loesungsweg: "Scheitelabschnitte und Parallelenabschnitte stehen im gleichen Verhältnis, innen zu außen: $$\\frac{SA}{SA'} = \\frac{AB}{A'B'} \\quad\\Rightarrow\\quad \\frac{3}{9} = \\frac{5}{x} \\quad\\Rightarrow\\quad x = 15$$ Bei \\(\\frac{3}{5} = \\frac{x}{9}\\) sind Scheitel- und Parallelenabschnitte vermischt (\\(x = 5{,}4\\)), bei \\(\\frac{9}{3} = \\frac{5}{x}\\) sind die Seiten vertauscht." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "mc", frage: "In einer Strahlensatzfigur mit Scheitel \\(S\\) gilt \\(SA = 4\\), \\(AA' = 6\\), \\(SB = 5\\); gesucht ist \\(SB'\\). Jemand rechnet: \\(\\frac{4}{6} = \\frac{5}{SB'}\\), also \\(SB' = 7{,}5\\). Was ist dazu zu sagen?", optionen: ["Falsch, die Abschnitte müssen vom Scheitel aus gemessen werden, richtig ist \\(12{,}5\\)", "Richtig, man darf beliebige entsprechende Abschnitte ins Verhältnis setzen", "Falsch, es müsste \\(\\frac{4}{6} = \\frac{SB'}{5}\\) heißen, richtig ist etwa \\(3{,}33\\)", "Falsch, man muss \\(AA'\\) mit \\(BB'\\) vergleichen, richtig ist \\(2 \\cdot 7{,}5 = 15\\)"], korrekt: 0, tipp: "\\(AA'\\) ist die Differenz zweier Scheitelabschnitte; welche Strecke gehört im Strahlensatz zu \\(SA\\)?", loesungsweg: "Im Strahlensatz stehen die Strecken vom Scheitel aus: \\(SA' = 4 + 6 = 10\\). $$\\frac{SA}{SA'} = \\frac{SB}{SB'} \\quad\\Rightarrow\\quad \\frac{4}{10} = \\frac{5}{SB'} \\quad\\Rightarrow\\quad SB' = 12{,}5$$ Der Ansatz mit \\(AA'\\) mischt Differenz und Scheitelabschnitt." },
      { id: 26, level: 5, typ: "numerisch", frage: "Eine Leiter lehnt an einer senkrechten Hauswand. Ihr Fuß steht \\(2\\,\\text{m}\\) von der Wand entfernt, ihr oberes Ende liegt in \\(6\\,\\text{m}\\) Höhe an. Wie weit ist eine Sprosse in \\(1{,}5\\,\\text{m}\\) Höhe von der Wand entfernt (in m)?", loesung: 1.5, toleranz: 0.01, tipp: "Alle waagerechten Abstände zur Wand sind parallel; der Scheitel ist das obere Leiterende.", loesungsweg: "Vom oberen Ende aus gemessen: bis zum Boden \\(6\\,\\text{m}\\), bis zur Sprosse \\(6 - 1{,}5 = 4{,}5\\,\\text{m}\\). $$\\frac{d}{2} = \\frac{4{,}5}{6} \\quad\\Rightarrow\\quad d = 2 \\cdot 0{,}75 = 1{,}5\\,\\text{m}$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Im Trapez \\(ABCD\\) sind \\(AB = 9\\,\\text{cm}\\) und \\(CD = 6\\,\\text{cm}\\) die parallelen Seiten. Die Diagonalen schneiden sich in \\(M\\); die Diagonale \\(AC\\) ist \\(10\\,\\text{cm}\\) lang. Wie lang ist \\(AM\\) in cm?", loesung: 6, toleranz: 0.01, tipp: "\\(M\\) ist Scheitel einer Strahlensatzfigur mit den Parallelen \\(AB\\) und \\(CD\\); \\(AM\\) und \\(MC\\) ergeben zusammen \\(10\\).", loesungsweg: "Mit Scheitel \\(M\\): \\(\\frac{AM}{MC} = \\frac{AB}{CD} = \\frac{9}{6} = \\frac{3}{2}\\). Also wird \\(AC\\) im Verhältnis \\(3 : 2\\) geteilt: $$AM = \\frac{3}{5} \\cdot 10 = 6\\,\\text{cm}$$" },
      { id: 28, level: 5, typ: "mc", frage: "In einer Strahlensatzfigur mit Scheitel \\(S\\) gilt \\(SA = 3\\), \\(SA' = 12\\), \\(AB = 5\\); gesucht ist \\(A'B'\\). Jemand rechnet: \\(\\frac{3}{12} = \\frac{A'B'}{5}\\), also \\(A'B' = 1{,}25\\). Was ist dazu zu sagen?", optionen: ["Falsch, das Verhältnis steht verkehrt, richtig ist \\(A'B' = 20\\)", "Richtig, innen zu außen ergibt genau \\(A'B' = 1{,}25\\)", "Falsch, es gilt \\(\\frac{3}{5} = \\frac{A'B'}{12}\\), richtig ist \\(7{,}2\\)", "Falsch, der Strahlensatz gilt nur für \\(SA' = 2 \\cdot SA\\)"], korrekt: 0, tipp: "Vergleiche die Größen: \\(A'B'\\) liegt weiter vom Scheitel entfernt als \\(AB\\).", loesungsweg: "\\(A'B'\\) gehört zum längeren Scheitelabschnitt \\(SA'\\), muss also größer als \\(AB = 5\\) sein — \\(1{,}25\\) kann schon deshalb nicht stimmen. Richtig steht die gesuchte Strecke im Nenner derselben Seite wie \\(SA'\\): $$\\frac{SA}{SA'} = \\frac{AB}{A'B'} \\quad\\Rightarrow\\quad \\frac{3}{12} = \\frac{5}{A'B'} \\quad\\Rightarrow\\quad A'B' = 20$$ Im vorgelegten Ansatz ist das zweite Verhältnis umgekehrt angesetzt." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein kegelförmiges Sektglas ist innen \\(12\\,\\text{cm}\\) tief und hat oben einen Durchmesser von \\(8\\,\\text{cm}\\). Es wird bis zu einer Höhe von \\(9\\,\\text{cm}\\) gefüllt. Welchen Durchmesser hat die Flüssigkeitsoberfläche in cm?", loesung: 6, toleranz: 0.01, tipp: "Im Querschnitt entsteht ein Dreieck mit der Spitze unten; die Flüssigkeitsoberfläche ist parallel zum Glasrand.", loesungsweg: "Scheitel ist die Glasspitze. Vom Scheitel aus: Flüssigkeit \\(9\\), Rand \\(12\\). $$\\frac{d}{8} = \\frac{9}{12} \\quad\\Rightarrow\\quad d = 8 \\cdot 0{,}75 = 6\\,\\text{cm}$$" },
      { id: 30, level: 5, typ: "numerisch", frage: "In einer Strahlensatzfigur mit Scheitel \\(S\\) gilt \\(SA = x\\), \\(AA' = 8\\), \\(SB = 6\\) und \\(SB' = 18\\). Bestimme \\(x\\).", loesung: 4, toleranz: 0.01, tipp: "\\(SA'\\) hängt von \\(x\\) ab; die entstehende Gleichung enthält \\(x\\) auf beiden Seiten.", loesungsweg: "$$\\frac{x}{x+8} = \\frac{6}{18} = \\frac{1}{3} \\quad\\Rightarrow\\quad 3x = x + 8 \\quad\\Rightarrow\\quad x = 4$$ Probe: \\(\\frac{4}{12} = \\frac{6}{18}\\)." },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "mc", frage: "In einer Strahlensatzfigur gilt \\(\\frac{SA}{SA'} = \\frac{SB}{SB'}\\). Behauptung: „Dann gilt auch \\(\\frac{AA'}{BB'} = \\frac{SA}{SB}\\).“ Stimmt das?", optionen: ["Ja, denn \\(AA'\\) und \\(BB'\\) sind beide \\((k-1)\\)-mal so lang wie \\(SA\\) bzw. \\(SB\\)", "Nein, Differenzen von Strecken erfüllen grundsätzlich keine Proportion", "Nur, wenn zusätzlich \\(AA' = BB'\\) gilt, also bei gleichen Abständen", "Nur, wenn die beiden Parallelen gleich lang sind, also im Sonderfall \\(k = 1\\)"], korrekt: 0, tipp: "Schreibe \\(SA' = k \\cdot SA\\) und \\(SB' = k \\cdot SB\\) und drücke \\(AA'\\) und \\(BB'\\) damit aus.", loesungsweg: "Mit \\(SA' = k \\cdot SA\\) ist \\(AA' = SA' - SA = (k-1) \\cdot SA\\); ebenso \\(BB' = (k-1) \\cdot SB\\). $$\\frac{AA'}{BB'} = \\frac{(k-1) \\cdot SA}{(k-1) \\cdot SB} = \\frac{SA}{SB}$$ Die Behauptung gilt also (für \\(k \\neq 1\\)); das ist die dritte Form des ersten Strahlensatzes." },
      { id: 32, level: 6, typ: "numerisch", frage: "Zwei Geraden schneiden sich in \\(S\\). Auf der ersten liegt \\(A\\) mit \\(SA = 4\\) und auf der anderen Seite von \\(S\\) der Punkt \\(A'\\) mit \\(SA' = 6\\). Die Parallelen durch \\(A\\) und \\(A'\\) schneiden die zweite Gerade in \\(B\\) bzw. \\(B'\\). Es ist \\(AB = 3\\). Wie lang ist \\(A'B'\\)?", loesung: 4.5, toleranz: 0.01, tipp: "Auch wenn der Scheitel zwischen den Parallelen liegt, gelten die Strahlensätze; die Figur sieht aus wie ein X.", loesungsweg: "Die Strahlensätze gelten ebenso für die X-Figur, bei der \\(S\\) zwischen den Parallelen liegt: $$\\frac{A'B'}{AB} = \\frac{SA'}{SA} = \\frac{6}{4} \\quad\\Rightarrow\\quad A'B' = 3 \\cdot 1{,}5 = 4{,}5$$" },
      { id: 33, level: 6, typ: "numerisch", frage: "Im Dreieck \\(SA'B'\\) liegt \\(AB\\) parallel zu \\(A'B'\\) mit \\(A\\) auf \\(SA'\\) und \\(B\\) auf \\(SB'\\); es gilt \\(SA : AA' = 2 : 1\\). Das Dreieck \\(SAB\\) hat den Flächeninhalt \\(12\\,\\text{cm}^2\\). Wie groß ist der Flächeninhalt des Trapezes \\(ABB'A'\\) in \\(\\text{cm}^2\\)?", loesung: 15, toleranz: 0.01, tipp: "Die beiden Dreiecke sind ähnlich; wie hängen Flächen mit dem Streckfaktor zusammen?", loesungsweg: "\\(SA' = SA + AA'\\), also \\(k = \\frac{SA'}{SA} = \\frac{3}{2}\\). Flächen wachsen mit \\(k^2\\): $$A_{SA'B'} = 12 \\cdot \\left(\\tfrac32\\right)^2 = 27\\,\\text{cm}^2$$ Trapez: \\(27 - 12 = 15\\,\\text{cm}^2\\). Mit dem Faktor \\(k\\) statt \\(k^2\\) käme fälschlich \\(6\\) heraus." },
      { id: 34, level: 6, typ: "mc", frage: "Im Dreieck \\(ABC\\) ist \\(D\\) der Mittelpunkt von \\(AC\\). Die Parallele zu \\(AB\\) durch \\(D\\) schneidet \\(BC\\) in \\(E\\). Behauptung: „\\(E\\) ist der Mittelpunkt von \\(BC\\).“ Stimmt das?", optionen: ["Ja, mit Scheitel \\(C\\) gilt \\(CE : CB = CD : CA = 1 : 2\\)", "Nein, das gilt nur, wenn das Dreieck gleichschenklig ist", "Nein, \\(E\\) teilt \\(BC\\) im Verhältnis \\(1 : 3\\), nicht \\(1 : 1\\)", "Nur, wenn zusätzlich \\(DE\\) halb so lang wie \\(AB\\) ist"], korrekt: 0, tipp: "Suche den Scheitel: Von welchem Eckpunkt aus gehen zwei Strahlen, die von den Parallelen \\(DE\\) und \\(AB\\) geschnitten werden?", loesungsweg: "\\(C\\) ist Scheitel, \\(DE \\parallel AB\\). Erster Strahlensatz: $$\\frac{CE}{CB} = \\frac{CD}{CA} = \\frac{1}{2}$$ Also halbiert \\(E\\) die Seite \\(BC\\), für jedes Dreieck. Dass \\(DE = \\frac12 AB\\) gilt, folgt aus dem zweiten Strahlensatz, ist aber keine Zusatzbedingung." },
      { id: 35, level: 6, typ: "numerisch", frage: "Eine \\(5\\,\\text{m}\\) hohe Laterne wirft den Schatten einer \\(1{,}6\\,\\text{m}\\) großen Person; der Schatten ist \\(2\\,\\text{m}\\) lang. Wie weit steht die Person vom Fuß der Laterne entfernt (in m)?", loesung: 4.25, toleranz: 0.01, tipp: "Der Scheitel liegt an der Schattenspitze; die gesuchte Entfernung ist ein Teil des großen Scheitelabschnitts.", loesungsweg: "Mit Abstand \\(d\\) zur Laterne: Vom Scheitel bis zur Person \\(2\\), bis zur Laterne \\(2 + d\\). $$\\frac{1{,}6}{5} = \\frac{2}{2+d} \\quad\\Rightarrow\\quad 1{,}6(2+d) = 10 \\quad\\Rightarrow\\quad d = \\frac{10 - 3{,}2}{1{,}6} = 4{,}25\\,\\text{m}$$" },
      { id: 36, level: 6, typ: "numerisch", frage: "Von \\(S\\) gehen zwei Strahlen aus. Auf dem ersten liegen \\(A\\) und \\(A'\\) mit \\(SA = 3\\) und \\(SA' = x\\), auf dem zweiten \\(B\\) und \\(B'\\) mit \\(SB = 4\\) und \\(SB' = 10\\). Für welchen Wert von \\(x\\) sind \\(AB\\) und \\(A'B'\\) parallel?", loesung: 7.5, toleranz: 0.01, tipp: "Die Umkehrung des Strahlensatzes: Stimmen die Verhältnisse der Scheitelabschnitte überein, sind die Verbindungsstrecken parallel.", loesungsweg: "Parallelität liegt genau dann vor, wenn $$\\frac{SA}{SA'} = \\frac{SB}{SB'} \\quad\\Rightarrow\\quad \\frac{3}{x} = \\frac{4}{10} \\quad\\Rightarrow\\quad x = 7{,}5$$ Für jeden anderen Wert von \\(x\\) sind \\(AB\\) und \\(A'B'\\) nicht parallel." }];
