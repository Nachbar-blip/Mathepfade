<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-stoch-erwartungswert';
    const THEMA_CONFIG = { name: 'Zufallsgrößen & Erwartungswert', bereich: 'stochastik' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Zufallsgröße, Verteilung, Summe 1, Σ-Schreibweise ==========
      { id:1, level:1, typ:"mc", frage:"Zwei Münzen werden geworfen. Die Zufallsgröße \\(X\\) zählt die Anzahl der Wappen. Welche Werte kann \\(X\\) annehmen?", optionen:["\\(0\\), \\(1\\) und \\(2\\)","nur \\(1\\) und \\(2\\)","\\(0\\), \\(1\\), \\(2\\) und \\(3\\)","nur \\(1\\), \\(2\\) und \\(3\\)"], korrekt:0, tipp:"Zähle die Wappen in den möglichen Ausgängen ab: kein Wappen, ein Wappen, zwei Wappen — und prüfe, welche dieser Fälle überhaupt auftreten können.", loesungsweg:"Bei zwei Münzen sind vier Ausgänge möglich: WW, WZ, ZW und ZZ. Die Zufallsgröße \\(X\\) ordnet jedem Ausgang die Anzahl der Wappen zu: <br>ZZ \\(\\to 0\\), WZ \\(\\to 1\\), ZW \\(\\to 1\\), WW \\(\\to 2\\). <br>Mehr als zwei Wappen können bei zwei Münzen nicht fallen, und null Wappen sind möglich (ZZ). Der Wertebereich ist also \\(\\{0;\\,1;\\,2\\}\\). Wichtig: Nicht die Anzahl der Ausgänge (vier) ist gefragt, sondern die Zahlen, die \\(X\\) annimmt (drei)." },
      { id:2, level:1, typ:"mc", frage:"Eine Zufallsgröße nimmt genau drei Werte an. Welche Zusammenstellung von Wahrscheinlichkeiten kann eine Wahrscheinlichkeitsverteilung sein?", optionen:["\\(0{,}2\\); \\(0{,}3\\); \\(0{,}5\\)","\\(0{,}2\\); \\(0{,}3\\); \\(0{,}4\\)","\\(0{,}4\\); \\(0{,}4\\); \\(0{,}4\\)","\\(0{,}1\\); \\(0{,}2\\); \\(0{,}8\\)"], korrekt:0, tipp:"Prüfe bei jeder Zusammenstellung die Bedingung, die für die Summe aller Wahrscheinlichkeiten einer Verteilung gilt.", loesungsweg:"Einer der Werte muss eintreten, deshalb ergeben die Wahrscheinlichkeiten einer Verteilung zusammen genau \\(1\\). Die vier Summen lauten: $$0{,}2+0{,}3+0{,}5 = 1 \\qquad 0{,}2+0{,}3+0{,}4 = 0{,}9$$ $$0{,}4+0{,}4+0{,}4 = 1{,}2 \\qquad 0{,}1+0{,}2+0{,}8 = 1{,}1$$ Nur die erste Zusammenstellung erfüllt die Bedingung. Bei \\(0{,}9\\) fehlt Wahrscheinlichkeit — es gäbe Ausgänge, die zu keinem Wert gehören; bei \\(1{,}2\\) und \\(1{,}1\\) ist mehr als die ganze Wahrscheinlichkeit verteilt, was unmöglich ist." },
      { id:3, level:1, typ:"numerisch", frage:"Für eine Zufallsgröße \\(X\\) gilt \\(P(X=2)=0{,}15\\), \\(P(X=4)=0{,}35\\) und \\(P(X=6)=0{,}50\\). Berechne \\(P(X \\ge 4)\\).", loesung:0.85, toleranz:0.005, tipp:"Lies aus der Verteilung ab, welche Werte die Bedingung erfüllen, und fasse die zugehörigen Wahrscheinlichkeiten zusammen.", loesungsweg:"Die Bedingung \\(X \\ge 4\\) erfüllen die Werte \\(4\\) und \\(6\\). Da \\(X\\) nicht zwei Werte gleichzeitig annehmen kann, dürfen die Wahrscheinlichkeiten addiert werden: $$P(X \\ge 4) = P(X=4) + P(X=6) = 0{,}35 + 0{,}50 = 0{,}85$$ Probe über das Gegenereignis: \\(1 - P(X=2) = 1 - 0{,}15 = 0{,}85\\). Beide Wege stimmen überein." },
      { id:4, level:1, typ:"numerisch", frage:"Eine Zufallsgröße \\(X\\) nimmt genau die Werte \\(x_1\\), \\(x_2\\) und \\(x_3\\) an. Welchen Wert hat \\(\\sum_{i=1}^{3} P(X=x_i)\\)?", loesung:1, toleranz:0, tipp:"Übersetze das Summenzeichen zuerst in eine ausgeschriebene Summe und überlege dann, was diese Summe bei einer Verteilung bedeutet.", loesungsweg:"Das Summenzeichen bedeutet, dass der Laufindex \\(i\\) nacheinander die Werte \\(1\\), \\(2\\) und \\(3\\) durchläuft und die Ergebnisse addiert werden: $$\\sum_{i=1}^{3} P(X=x_i) = P(X=x_1) + P(X=x_2) + P(X=x_3)$$ Das sind alle Wahrscheinlichkeiten der Verteilung. Weil \\(X\\) genau einen dieser drei Werte annimmt, ist das Eintreten sicher, und die Summe ergibt \\(1\\)." },
      { id:5, level:1, typ:"numerisch", frage:"Für eine Zufallsgröße sind die Werte \\(x_1 = 2\\), \\(x_2 = 3\\), \\(x_3 = 5\\) und \\(x_4 = 10\\) gegeben. Berechne \\(\\sum_{i=1}^{4} x_i\\).", loesung:20, toleranz:0, tipp:"Das Zeichen \\(\\sum\\) verlangt, alle aufgeführten Größen nacheinander zu addieren; die untere und die obere Angabe sagen, wo der Index beginnt und endet.", loesungsweg:"Der Index \\(i\\) läuft von \\(1\\) bis \\(4\\), jeder Wert wird einmal genommen und alles addiert: $$\\sum_{i=1}^{4} x_i = x_1 + x_2 + x_3 + x_4 = 2 + 3 + 5 + 10 = 20$$ Achtung auf die Rolle des Index: Unter dem Summenzeichen steht nicht ein Wert von \\(X\\), sondern eine Nummer. Hier werden nur die Werte selbst summiert; Wahrscheinlichkeiten kommen darin nicht vor." },
      { id:6, level:1, typ:"mc", frage:"Bei welchem der vier Versuche wird tatsächlich eine <b>Zufallsgröße</b> beschrieben?", optionen:["die Summe der Augenzahlen bei zwei Würfeln","die Farbe der zuerst gezogenen Kugel","der Name der Gewinnerin des Spiels","das Bild auf dem angezeigten Feld"], korrekt:0, tipp:"Achte darauf, was bei jeder der vier Beschreibungen am Ende herauskommt — eine Zufallsgröße liefert immer dieselbe Art von Angabe.", loesungsweg:"Eine Zufallsgröße ordnet jedem Ergebnis eines Zufallsversuchs eine <b>Zahl</b> zu. Nur die Summe der Augenzahlen ist eine Zahl; Farbe, Name und Bild sind es nicht. <br>Solche nichtzahligen Merkmale lassen sich allerdings in eine Zufallsgröße übersetzen, indem man zählt oder bewertet: etwa „Anzahl der roten Kugeln“ statt „Farbe“. Erst dann kann man mit Erwartungswert und Standardabweichung rechnen, denn beide beruhen auf Addition und Multiplikation von Zahlen." },

      // ========== LEVEL 2 — Erwartungswert aus gegebener Verteilung, fehlende Wahrscheinlichkeit ==========
      { id:7, level:2, typ:"numerisch", frage:"Bei einer Übungsaufgabe sind \\(0\\), \\(1\\), \\(2\\) oder \\(3\\) Punkte erreichbar. Die Zufallsgröße \\(X\\) ist die erreichte Punktzahl, und es gilt \\(P(X=0)=0{,}1\\), \\(P(X=1)=0{,}2\\), \\(P(X=2)=0{,}4\\), \\(P(X=3)=0{,}3\\). Berechne \\(E(X)\\).", loesung:1.9, toleranz:0.01, tipp:"Jeder Wert geht mit seiner eigenen Wahrscheinlichkeit als Gewicht in die Summe ein; die Anzahl der Werte spielt dabei keine Rolle.", loesungsweg:"Der Erwartungswert ist die mit den Wahrscheinlichkeiten gewichtete Summe der Werte: $$E(X) = 0 \\cdot 0{,}1 + 1 \\cdot 0{,}2 + 2 \\cdot 0{,}4 + 3 \\cdot 0{,}3$$ $$E(X) = 0 + 0{,}2 + 0{,}8 + 0{,}9 = 1{,}9$$ Der Wert liegt zwischen \\(1\\) und \\(2\\) und damit dort, wo die größten Gewichte sitzen. Sachprobe: Der Erwartungswert muss stets zwischen dem kleinsten und dem größten Wert liegen, hier also zwischen \\(0\\) und \\(3\\)." },
      { id:8, level:2, typ:"numerisch", frage:"Eine Zufallsgröße \\(X\\) nimmt genau die Werte \\(1\\), \\(3\\), \\(5\\) und \\(7\\) an. Bekannt sind \\(P(X=1)=0{,}20\\), \\(P(X=3)=0{,}25\\) und \\(P(X=7)=0{,}15\\). Berechne \\(P(X=5)\\).", loesung:0.4, toleranz:0.005, tipp:"Für die Summe aller Wahrscheinlichkeiten einer Verteilung gibt es eine feste Bedingung — stelle sie auf und löse nach der fehlenden Größe auf.", loesungsweg:"Die vier Wahrscheinlichkeiten ergeben zusammen \\(1\\), denn \\(X\\) nimmt genau einen der vier Werte an: $$0{,}20 + 0{,}25 + P(X=5) + 0{,}15 = 1$$ Die drei bekannten Anteile summieren sich zu \\(0{,}60\\), also bleibt $$P(X=5) = 1 - 0{,}60 = 0{,}40$$ Probe: \\(0{,}20+0{,}25+0{,}40+0{,}15 = 1\\). Die Werte \\(1\\), \\(3\\), \\(5\\), \\(7\\) selbst werden hier gar nicht gebraucht — für die Summenbedingung zählen nur die Wahrscheinlichkeiten." },
      { id:9, level:2, typ:"numerisch", frage:"Eine Maschine liefert je Schicht \\(0\\), \\(1\\), \\(2\\) oder \\(3\\) fehlerhafte Teile, und zwar in \\(40\\,\\%\\), \\(35\\,\\%\\), \\(20\\,\\%\\) und \\(5\\,\\%\\) der Schichten. Berechne den Erwartungswert der Fehlerzahl.", loesung:0.9, toleranz:0.01, tipp:"Übersetze die Prozentangaben zuerst in Wahrscheinlichkeiten und gewichte dann jede Fehlerzahl mit der ihren.", loesungsweg:"Aus den Prozentangaben werden Wahrscheinlichkeiten: \\(0{,}40\\); \\(0{,}35\\); \\(0{,}20\\); \\(0{,}05\\). Ihre Summe ist \\(1\\), die Verteilung ist also vollständig. Damit $$E(X) = 0 \\cdot 0{,}40 + 1 \\cdot 0{,}35 + 2 \\cdot 0{,}20 + 3 \\cdot 0{,}05$$ $$E(X) = 0 + 0{,}35 + 0{,}40 + 0{,}15 = 0{,}90$$ Im Mittel fallen also knapp ein fehlerhaftes Teil je Schicht an. Dass \\(0{,}9\\) kein möglicher Einzelwert ist, ist kein Widerspruch: Der Erwartungswert beschreibt den Durchschnitt über viele Schichten." },
      { id:10, level:2, typ:"numerisch", frage:"Für eine Zufallsgröße \\(X\\) gilt \\(P(X=2)=\\tfrac14\\), \\(P(X=4)=\\tfrac12\\) und \\(P(X=6)=\\tfrac14\\). Berechne \\(E(X)\\) ohne Hilfsmittel.", loesung:4, toleranz:0, tipp:"Die Brüche lassen sich mit den Werten direkt im Kopf multiplizieren; ein Blick auf die Lage der Werte zueinander macht die Rechnung noch kürzer.", loesungsweg:"Gewichtete Summe: $$E(X) = 2 \\cdot \\tfrac14 + 4 \\cdot \\tfrac12 + 6 \\cdot \\tfrac14 = \\tfrac12 + 2 + \\tfrac32 = 4$$ Kürzer geht es über die Symmetrie: Die Werte \\(2\\) und \\(6\\) liegen gleich weit von \\(4\\) entfernt und tragen dasselbe Gewicht \\(\\tfrac14\\); ihre Abweichungen heben sich auf. Der mittlere Wert \\(4\\) bleibt als Erwartungswert stehen. Diese Überlegung ersetzt bei symmetrischen Verteilungen die ganze Rechnung." },
      { id:11, level:2, typ:"mc", frage:"Für die Zufallsgröße \\(X\\) = Anzahl der an einem Tag verkauften Fahrräder gilt \\(E(X) = 2{,}4\\). Was besagt dieser Wert?", optionen:["auf lange Sicht werden im Mittel \\(2{,}4\\) Fahrräder je Tag verkauft","an jedem einzelnen Tag werden genau \\(2{,}4\\) Fahrräder verkauft","es werden an keinem Tag mehr als \\(2{,}4\\) Fahrräder verkauft","die Verkaufszahl \\(2{,}4\\) tritt häufiger auf als jede andere"], korrekt:0, tipp:"Prüfe für jede Aussage, ob sie sich auf einen einzelnen Tag oder auf den Durchschnitt vieler Tage bezieht.", loesungsweg:"Der Erwartungswert ist ein <b>Durchschnittswert auf lange Sicht</b>: Bei vielen Tagen liegt die durchschnittliche Verkaufszahl nahe bei \\(2{,}4\\). <br>Er ist keine Vorhersage für einen einzelnen Tag — dort werden immer ganze Fahrräder verkauft, \\(2{,}4\\) tritt nie ein. Er ist auch keine Obergrenze: Ein Tag mit fünf verkauften Fahrrädern widerspricht dem Erwartungswert nicht. Und er ist nicht der häufigste Wert; der häufigste Wert ist ein anderer Begriff und lässt sich aus \\(E(X)\\) allein nicht ablesen." },
      { id:12, level:2, typ:"numerisch", frage:"Eine Zufallsgröße \\(X\\) nimmt die Werte \\(-2\\), \\(0\\) und \\(4\\) an, und zwar mit den Wahrscheinlichkeiten \\(0{,}3\\), \\(0{,}5\\) und \\(0{,}2\\). Berechne \\(E(X)\\).", loesung:0.2, toleranz:0.01, tipp:"Negative Werte werden genauso gewichtet wie positive; achte beim Zusammenfassen auf die Vorzeichen.", loesungsweg:"Auch negative Werte gehen mit ihrem Gewicht in die Summe ein: $$E(X) = (-2) \\cdot 0{,}3 + 0 \\cdot 0{,}5 + 4 \\cdot 0{,}2$$ $$E(X) = -0{,}6 + 0 + 0{,}8 = 0{,}2$$ Der Erwartungswert ist positiv, obwohl der negative Wert \\(-2\\) häufiger vorkommt als der positive Wert \\(4\\). Das liegt daran, dass \\(4\\) betragsmäßig doppelt so weit von null entfernt ist — beim Erwartungswert zählt immer das Produkt aus Wert und Wahrscheinlichkeit, nicht die Wahrscheinlichkeit allein." },

      // ========== LEVEL 3 — Verteilung selbst aufstellen, Varianz und Standardabweichung ==========
      { id:13, level:3, typ:"numerisch", frage:"Zwei faire Münzen werden gleichzeitig geworfen. Die Zufallsgröße \\(X\\) ist die Anzahl der Wappen. Stelle die Wahrscheinlichkeitsverteilung auf und berechne \\(E(X)\\).", loesung:1, toleranz:0, tipp:"Zähle zuerst ab, wie viele der vier gleich wahrscheinlichen Ausgänge zu jedem Wert gehören; danach folgt der Erwartungswert wie bei jeder gegebenen Verteilung.", loesungsweg:"Alle vier Ausgänge ZZ, ZW, WZ, WW sind gleich wahrscheinlich, jeder hat die Wahrscheinlichkeit \\(\\tfrac14\\). Zwei davon (ZW und WZ) liefern genau ein Wappen. Damit lautet die Verteilung: $$P(X=0)=\\tfrac14 \\qquad P(X=1)=\\tfrac12 \\qquad P(X=2)=\\tfrac14$$ Die Summe ist \\(\\tfrac14+\\tfrac12+\\tfrac14=1\\), die Verteilung ist also vollständig. Erwartungswert: $$E(X) = 0 \\cdot \\tfrac14 + 1 \\cdot \\tfrac12 + 2 \\cdot \\tfrac14 = \\tfrac12 + \\tfrac12 = 1$$ Die Verteilung ist symmetrisch zu \\(1\\), was das Ergebnis bestätigt." },
      { id:14, level:3, typ:"numerisch", frage:"In einer Urne liegen \\(3\\) rote und \\(2\\) blaue Kugeln. Es werden zwei Kugeln ohne Zurücklegen gezogen; \\(X\\) ist die Anzahl der roten Kugeln. Berechne \\(E(X)\\).", loesung:1.2, toleranz:0.01, tipp:"Bestimme zuerst für jeden möglichen Wert von \\(X\\) die Wahrscheinlichkeit über die Züge; erst wenn die Verteilung steht, wird gewichtet summiert.", loesungsweg:"Die Zufallsgröße kann \\(0\\), \\(1\\) oder \\(2\\) sein. Über die Pfade der beiden Züge: $$P(X=0) = \\tfrac25 \\cdot \\tfrac14 = \\tfrac{2}{20} = 0{,}1$$ $$P(X=2) = \\tfrac35 \\cdot \\tfrac24 = \\tfrac{6}{20} = 0{,}3$$ $$P(X=1) = 1 - 0{,}1 - 0{,}3 = 0{,}6$$ Für \\(X=1\\) ist das Gegenereignis der kürzeste Weg, weil zwei Pfade (rot-blau und blau-rot) dazugehören. Die Summenprobe \\(0{,}1+0{,}6+0{,}3=1\\) stimmt. Erwartungswert: $$E(X) = 0 \\cdot 0{,}1 + 1 \\cdot 0{,}6 + 2 \\cdot 0{,}3 = 1{,}2$$ Das passt zur Anschauung: \\(60\\,\\%\\) der Kugeln sind rot, bei zwei Zügen sind also \\(1{,}2\\) rote Kugeln zu erwarten." },
      { id:15, level:3, typ:"numerisch", frage:"Für eine Zufallsgröße \\(X\\) gilt \\(P(X=0)=0{,}2\\), \\(P(X=1)=0{,}5\\) und \\(P(X=2)=0{,}3\\). Berechne die Standardabweichung \\(\\sigma\\).", loesung:0.7, toleranz:0.02, tipp:"Der Erwartungswert muss zuerst vorliegen; danach wird jede Abweichung davon quadriert, mit ihrer Wahrscheinlichkeit gewichtet und am Ende die Wurzel gezogen.", loesungsweg:"Erwartungswert: $$\\mu = 0 \\cdot 0{,}2 + 1 \\cdot 0{,}5 + 2 \\cdot 0{,}3 = 1{,}1$$ Varianz als gewichtetes Mittel der quadrierten Abweichungen: $$V(X) = \\sum (x_i - \\mu)^2 \\cdot P(X=x_i)$$ $$V(X) = (0-1{,}1)^2 \\cdot 0{,}2 + (1-1{,}1)^2 \\cdot 0{,}5 + (2-1{,}1)^2 \\cdot 0{,}3$$ $$V(X) = 1{,}21 \\cdot 0{,}2 + 0{,}01 \\cdot 0{,}5 + 0{,}81 \\cdot 0{,}3 = 0{,}242 + 0{,}005 + 0{,}243 = 0{,}49$$ Die Standardabweichung ist die Wurzel daraus: \\(\\sigma = \\sqrt{0{,}49} = 0{,}7\\). Das Quadrieren ist nötig, damit sich positive und negative Abweichungen nicht gegenseitig aufheben; die Wurzel holt am Ende die Einheit von \\(X\\) zurück." },
      { id:16, level:3, typ:"numerisch", frage:"Für eine Zufallsgröße \\(X\\) gilt \\(P(X=2)=0{,}1\\), \\(P(X=5)=0{,}6\\) und \\(P(X=10)=0{,}3\\). Berechne \\(V(X)\\) auf zwei Nachkommastellen.", loesung:6.96, toleranz:0.05, tipp:"Erst den Erwartungswert bestimmen, dann für jeden Wert den Abstand zu ihm bilden, quadrieren und mit seiner Wahrscheinlichkeit gewichten.", loesungsweg:"Erwartungswert: $$\\mu = 2 \\cdot 0{,}1 + 5 \\cdot 0{,}6 + 10 \\cdot 0{,}3 = 0{,}2 + 3 + 3 = 6{,}2$$ Abweichungen und ihre Quadrate: \\((2-6{,}2)^2 = 17{,}64\\), \\((5-6{,}2)^2 = 1{,}44\\), \\((10-6{,}2)^2 = 14{,}44\\). Gewichtet summiert: $$V(X) = 17{,}64 \\cdot 0{,}1 + 1{,}44 \\cdot 0{,}6 + 14{,}44 \\cdot 0{,}3$$ $$V(X) = 1{,}764 + 0{,}864 + 4{,}332 = 6{,}96$$ Der große Beitrag kommt vom Wert \\(10\\): Er liegt am weitesten vom Erwartungswert entfernt, und das Quadrieren verstärkt große Abstände zusätzlich. Die Standardabweichung wäre \\(\\sqrt{6{,}96} \\approx 2{,}64\\) und liegt damit wieder in der Größenordnung der Werte selbst." },
      { id:17, level:3, typ:"numerisch", frage:"Ein Glücksrad hat acht gleich große Felder: viermal die Zahl \\(1\\), dreimal die Zahl \\(2\\) und einmal die Zahl \\(5\\). Die Zufallsgröße \\(X\\) ist die angezeigte Zahl. Berechne \\(E(X)\\).", loesung:1.875, toleranz:0.01, tipp:"Bestimme aus der Anzahl der Felder je Zahl zuerst die Wahrscheinlichkeiten; danach wird wie bei jeder gegebenen Verteilung gewichtet summiert.", loesungsweg:"Alle acht Felder sind gleich groß, also gilt für jede Zahl: Wahrscheinlichkeit = Anzahl ihrer Felder geteilt durch \\(8\\). $$P(X=1)=\\tfrac48 \\qquad P(X=2)=\\tfrac38 \\qquad P(X=5)=\\tfrac18$$ Summenprobe: \\(\\tfrac48+\\tfrac38+\\tfrac18 = 1\\). Erwartungswert: $$E(X) = 1 \\cdot \\tfrac48 + 2 \\cdot \\tfrac38 + 5 \\cdot \\tfrac18 = \\tfrac{4 + 6 + 5}{8} = \\tfrac{15}{8} = 1{,}875$$ Der Wert liegt nahe bei \\(2\\), obwohl die \\(5\\) mitspielt: Sie kommt nur auf einem von acht Feldern vor und zieht den Durchschnitt nur wenig nach oben." },
      { id:18, level:3, typ:"numerisch", frage:"Ein fairer Würfel wird einmal geworfen. Die Zufallsgröße \\(X\\) ist \\(1\\), wenn eine Sechs fällt, und sonst \\(0\\). Berechne \\(\\sigma\\) auf zwei Nachkommastellen.", loesung:0.37, toleranz:0.02, tipp:"Stelle die Verteilung dieser Zufallsgröße mit ihren beiden Werten auf, bestimme daraus den Erwartungswert und gehe dann über die quadrierten Abweichungen zur Wurzel.", loesungsweg:"Verteilung: \\(P(X=1)=\\tfrac16\\) und \\(P(X=0)=\\tfrac56\\). Erwartungswert: $$\\mu = 1 \\cdot \\tfrac16 + 0 \\cdot \\tfrac56 = \\tfrac16 \\approx 0{,}1667$$ Varianz über die quadrierten Abweichungen: $$V(X) = \\left(1-\\tfrac16\\right)^2 \\cdot \\tfrac16 + \\left(0-\\tfrac16\\right)^2 \\cdot \\tfrac56$$ $$V(X) = \\tfrac{25}{36} \\cdot \\tfrac16 + \\tfrac{1}{36} \\cdot \\tfrac56 = \\tfrac{25}{216} + \\tfrac{5}{216} = \\tfrac{30}{216} = \\tfrac{5}{36}$$ $$\\sigma = \\sqrt{\\tfrac{5}{36}} = \\tfrac{\\sqrt5}{6} \\approx 0{,}37$$ Beachte: \\(\\sigma\\) ist größer als der Erwartungswert. Bei einer Zufallsgröße mit nur zwei weit auseinanderliegenden Werten und stark ungleichen Gewichten ist das normal — der Erwartungswert \\(\\tfrac16\\) tritt selbst nie ein." },

      // ========== LEVEL 4 — Modell aus dem Sachtext, Umkehraufgabe, Verfahren wählen ==========
      { id:19, level:4, typ:"numerisch", frage:"Eine Fahrradwerkstatt berechnet für eine Reparatur \\(15\\,€\\), \\(30\\,€\\) oder \\(60\\,€\\). Erfahrungsgemäß sind \\(50\\,\\%\\) der Reparaturen einfach, \\(30\\,\\%\\) mittelschwer und \\(20\\,\\%\\) aufwendig. Mit welchem Betrag je Reparatur kann die Werkstatt auf lange Sicht rechnen? (in Euro)", loesung:28.5, toleranz:0.01, tipp:"Lege zuerst fest, welche Größe hier vom Zufall abhängt und welche Zahlen sie annimmt; danach ergibt sich die gesuchte Angabe aus der Verteilung.", loesungsweg:"Die vom Zufall abhängige Größe ist der Rechnungsbetrag \\(X\\) mit den Werten \\(15\\), \\(30\\) und \\(60\\); die Schwierigkeitsanteile sind ihre Wahrscheinlichkeiten \\(0{,}5\\); \\(0{,}3\\); \\(0{,}2\\) (Summe \\(1\\)). Gefragt ist der Betrag auf lange Sicht, also der Erwartungswert: $$E(X) = 15 \\cdot 0{,}5 + 30 \\cdot 0{,}3 + 60 \\cdot 0{,}2$$ $$E(X) = 7{,}50 + 9{,}00 + 12{,}00 = 28{,}50$$ Auf lange Sicht sind also \\(28{,}50\\,€\\) je Reparatur zu erwarten. Der ungewichtete Mittelwert der drei Preise wäre \\(35\\,€\\) und damit deutlich zu hoch — die billige Reparatur kommt am häufigsten vor und muss entsprechend stärker zählen." },
      { id:20, level:4, typ:"numerisch", frage:"An einer Haltestelle wartet man auf den nächsten Bus \\(0\\), \\(5\\), \\(10\\) oder \\(15\\) Minuten, und zwar mit den Wahrscheinlichkeiten \\(0{,}4\\); \\(0{,}3\\); \\(0{,}2\\) und \\(0{,}1\\). Mit welcher Wartezeit in Minuten muss man im Mittel rechnen?", loesung:5, toleranz:0.01, tipp:"Die Wartezeit ist hier die Zufallsgröße; ihre Werte und die zugehörigen Wahrscheinlichkeiten stehen im Text und müssen nur richtig einander zugeordnet werden.", loesungsweg:"Die Zufallsgröße \\(X\\) ist die Wartezeit in Minuten mit den Werten \\(0\\), \\(5\\), \\(10\\), \\(15\\) und den Wahrscheinlichkeiten \\(0{,}4\\); \\(0{,}3\\); \\(0{,}2\\); \\(0{,}1\\); ihre Summe ist \\(1\\). Mittlere Wartezeit: $$E(X) = 0 \\cdot 0{,}4 + 5 \\cdot 0{,}3 + 10 \\cdot 0{,}2 + 15 \\cdot 0{,}1$$ $$E(X) = 0 + 1{,}5 + 2{,}0 + 1{,}5 = 5{,}0$$ Im Mittel wartet man also fünf Minuten. Bemerkenswert: Der Wert \\(5\\) ist zugleich einer der möglichen Wartezeiten, das ist hier aber Zufall und keine Regel — bei den Punktzahlen und Fehlerzahlen anderer Aufgaben liegt der Erwartungswert zwischen den möglichen Werten." },
      { id:21, level:4, typ:"numerisch", frage:"Ein Verein verkauft \\(200\\) Lose zum Preis von \\(2\\,€\\). Darunter sind \\(10\\) Gewinnlose, die je \\(g\\) Euro auszahlen; alle anderen Lose zahlen nichts. Der Verein möchte je verkauftem Los im Mittel \\(1{,}50\\,€\\) einnehmen. Wie groß darf \\(g\\) sein?", loesung:10, toleranz:0.01, tipp:"Bestimme zuerst, wie viel dem Verein je Los von den \\(2\\,€\\) bleiben darf; das ist die erwartete Auszahlung, aus der sich die gesuchte Größe rückwärts ergibt.", loesungsweg:"Von den \\(2\\,€\\) Losbeitrag sollen dem Verein \\(1{,}50\\,€\\) bleiben, also darf die erwartete Auszahlung je Los \\(2{,}00 - 1{,}50 = 0{,}50\\,€\\) betragen. <br>Die Auszahlung \\(X\\) hat den Wert \\(g\\) mit der Wahrscheinlichkeit \\(\\tfrac{10}{200} = 0{,}05\\) und den Wert \\(0\\) mit der Wahrscheinlichkeit \\(0{,}95\\): $$E(X) = g \\cdot 0{,}05 + 0 \\cdot 0{,}95 = 0{,}05\\,g$$ Die Umkehrrichtung: Nicht \\(E(X)\\) ist gesucht, sondern der Wert, der \\(E(X)\\) auf die Vorgabe bringt. $$0{,}05\\,g = 0{,}50 \\;\\Rightarrow\\; g = \\frac{0{,}50}{0{,}05}$$ Also \\(g = 10\\). Probe: \\(10\\) Gewinnlose mal \\(10\\,€\\) sind \\(100\\,€\\) Auszahlung; bei \\(400\\,€\\) Einnahmen bleiben \\(300\\,€\\), das sind \\(1{,}50\\,€\\) je Los." },
      { id:22, level:4, typ:"mc", frage:"Ein Händler kann eine Warenpartie zum Festpreis von \\(400\\,€\\) abgeben. Auf einer Auktion erzielt er stattdessen \\(200\\,€\\), \\(400\\,€\\) oder \\(700\\,€\\), und zwar mit den Wahrscheinlichkeiten \\(0{,}3\\); \\(0{,}5\\) und \\(0{,}2\\). Wie soll er sich entscheiden, wenn er über viele Partien den größten Erlös anstrebt?", optionen:["gleichwertig, die auf lange Sicht erzielten Erlöse stimmen überein","Auktion, denn der auf lange Sicht erzielte Erlös liegt höher","Festpreis, denn der auf lange Sicht erzielte Erlös liegt niedriger","Festpreis, denn auf der Auktion droht ein Erlös von \\(200\\,€\\)"], korrekt:0, tipp:"Der Festpreis ist eine feste Zahl, der Auktionserlös eine Zufallsgröße — vergleichbar werden die beiden erst, wenn man aus der Verteilung die passende Kenngröße bildet.", loesungsweg:"Der Auktionserlös \\(X\\) ist eine Zufallsgröße; für den Vergleich „über viele Partien“ ist ihr Erwartungswert die passende Kenngröße: $$E(X) = 200 \\cdot 0{,}3 + 400 \\cdot 0{,}5 + 700 \\cdot 0{,}2$$ $$E(X) = 60 + 200 + 140 = 400$$ Der erwartete Auktionserlös beträgt genau \\(400\\,€\\) und stimmt damit mit dem Festpreis überein. Bezogen auf den Erlös auf lange Sicht sind beide Wege also gleichwertig. <br>Der Hinweis auf die \\(200\\,€\\) nennt eine richtige Tatsache, aber kein Argument für den Festpreis unter dieser Fragestellung: Ein einzelner ungünstiger Ausgang senkt den Erwartungswert nicht unter den Festpreis. Er betrifft die <b>Streuung</b> — wer schwankende Erlöse vermeiden will, wählt trotz gleichen Erwartungswerts den Festpreis." },
      { id:23, level:4, typ:"numerisch", frage:"Eine Zufallsgröße \\(X\\) nimmt nur die beiden Werte \\(1\\) und \\(6\\) an. Wie groß muss \\(P(X=6)\\) sein, damit \\(E(X) = 3\\) gilt?", loesung:0.4, toleranz:0.005, tipp:"Nenne die gesuchte Wahrscheinlichkeit mit einem Buchstaben und drücke die zweite über die Summenbedingung damit aus; so entsteht eine Gleichung in einer Unbekannten.", loesungsweg:"Gesucht ist hier nicht der Erwartungswert, sondern eine Wahrscheinlichkeit — die Formel wird also rückwärts benutzt. Mit \\(p = P(X=6)\\) folgt aus der Summenbedingung \\(P(X=1) = 1-p\\): $$E(X) = 1 \\cdot (1-p) + 6 \\cdot p = 1 + 5p$$ Gleichsetzen mit der Vorgabe: $$1 + 5p = 3 \\;\\Rightarrow\\; 5p = 2 \\;\\Rightarrow\\; p = 0{,}4$$ Probe: \\(1 \\cdot 0{,}6 + 6 \\cdot 0{,}4 = 0{,}6 + 2{,}4 = 3\\). Sachprobe auf Plausibilität: \\(3\\) liegt zwischen \\(1\\) und \\(6\\), aber näher an \\(1\\) — also muss der kleinere Wert das größere Gewicht tragen, und genau das ist mit \\(0{,}6\\) gegen \\(0{,}4\\) der Fall." },
      { id:24, level:4, typ:"numerisch", frage:"Ein Automat füllt in jede Tüte \\(1\\), \\(2\\) oder \\(3\\) Überraschungen. In \\(30\\,\\%\\) der Tüten liegt genau eine Überraschung, in \\(10\\,\\%\\) liegen drei. Wie viele Überraschungen enthält eine Tüte im Mittel?", loesung:1.8, toleranz:0.01, tipp:"Eine der drei Wahrscheinlichkeiten steht nicht im Text und muss zuerst beschafft werden; erst danach ist die Verteilung vollständig.", loesungsweg:"Der Text nennt nur zwei der drei Wahrscheinlichkeiten. Die fehlende ergibt sich aus der Summenbedingung: $$P(X=2) = 1 - 0{,}30 - 0{,}10 = 0{,}60$$ Damit ist die Verteilung vollständig: \\(0{,}30\\); \\(0{,}60\\); \\(0{,}10\\). Mittlere Anzahl: $$E(X) = 1 \\cdot 0{,}30 + 2 \\cdot 0{,}60 + 3 \\cdot 0{,}10$$ $$E(X) = 0{,}30 + 1{,}20 + 0{,}30 = 1{,}80$$ Wer die fehlende Wahrscheinlichkeit übersieht und nur mit den beiden genannten Anteilen rechnet, erhält \\(0{,}30 + 0{,}30 = 0{,}60\\) — ein Wert unterhalb des kleinsten möglichen Wertes \\(1\\) und damit sicher falsch. Diese Sachprobe lohnt sich immer." },

      // ========== LEVEL 5 — zwei Verfahren verzahnt, Parameter aus zwei Bedingungen, Fehlersuche ==========
      { id:25, level:5, typ:"numerisch", frage:"Ein fairer Würfel wird zweimal geworfen. Die Zufallsgröße \\(X\\) ist die Anzahl der Würfe, in denen eine Sechs fällt. Berechne \\(\\sigma\\) auf zwei Nachkommastellen.", loesung:0.53, toleranz:0.02, tipp:"Hier sind zwei Schritte nötig: erst die Verteilung von \\(X\\) über die möglichen Ausgänge beider Würfe, dann daraus die Streuungskenngröße.", loesungsweg:"Zuerst die Verteilung. Je Wurf fällt eine Sechs mit \\(\\tfrac16\\), keine Sechs mit \\(\\tfrac56\\); die beiden Würfe beeinflussen sich nicht: $$P(X=0) = \\tfrac56 \\cdot \\tfrac56 = \\tfrac{25}{36} \\qquad P(X=2) = \\tfrac16 \\cdot \\tfrac16 = \\tfrac{1}{36}$$ $$P(X=1) = 1 - \\tfrac{25}{36} - \\tfrac{1}{36} = \\tfrac{10}{36}$$ Zu \\(X=1\\) gehören zwei Ausgänge (Sechs im ersten oder im zweiten Wurf), daher der Faktor \\(2\\); die Summenprobe \\(\\tfrac{25+10+1}{36}=1\\) stimmt. <br>Erwartungswert: $$\\mu = 0 \\cdot \\tfrac{25}{36} + 1 \\cdot \\tfrac{10}{36} + 2 \\cdot \\tfrac{1}{36} = \\tfrac{12}{36} = \\tfrac13$$ Varianz über die quadrierten Abweichungen: $$V(X) = \\left(\\tfrac13\\right)^2 \\cdot \\tfrac{25}{36} + \\left(\\tfrac23\\right)^2 \\cdot \\tfrac{10}{36} + \\left(\\tfrac53\\right)^2 \\cdot \\tfrac{1}{36} = \\tfrac{25 + 40 + 25}{324} = \\tfrac{90}{324} = \\tfrac{5}{18}$$ $$\\sigma = \\sqrt{\\tfrac{5}{18}} \\approx 0{,}53$$ Deutung: Die typische Abweichung von \\(\\tfrac13\\) beträgt etwa eine halbe Sechs — mit \\(0\\) oder \\(1\\) Sechsen ist zu rechnen, zwei Sechsen liegen weit außen." },
      { id:26, level:5, typ:"mc", frage:"Für eine Zufallsgröße mit \\(P(X=1)=0{,}8\\), \\(P(X=5)=0{,}1\\) und \\(P(X=9)=0{,}1\\) rechnet jemand \\(E(X) = \\frac{1+5+9}{3} = 5\\). Wo steckt der Fehler?", optionen:["die Werte werden ungewichtet gemittelt, die Wahrscheinlichkeiten fehlen","es wird durch die Anzahl der Werte geteilt statt durch deren Summe","die drei Wahrscheinlichkeiten müssen zuvor auf \\(1\\) ergänzt werden","die Werte sind vor dem Mitteln zu quadrieren und nicht danach"], korrekt:0, tipp:"Vergleiche den vorgeführten Ausdruck Zeichen für Zeichen mit der Erwartungswertformel — welche Größen aus der Verteilung tauchen darin überhaupt nicht auf?", loesungsweg:"Der vorgeführte Weg bildet das <b>arithmetische Mittel der Werte</b>. Darin kommen die Wahrscheinlichkeiten nicht vor — jeder Wert erhält still das Gewicht \\(\\tfrac13\\). Richtig ist die gewichtete Summe: $$E(X) = 1 \\cdot 0{,}8 + 5 \\cdot 0{,}1 + 9 \\cdot 0{,}1 = 0{,}8 + 0{,}5 + 0{,}9 = 2{,}2$$ Der falsche Weg liefert \\(5\\), der richtige \\(2{,}2\\) — mehr als das Doppelte Unterschied. Sachprobe: In \\(80\\,\\%\\) der Fälle tritt der Wert \\(1\\) ein, der Durchschnitt muss also dicht bei \\(1\\) liegen; \\(5\\) ist damit schon vor jeder Rechnung als falsch erkennbar. <br>Die drei Wahrscheinlichkeiten ergeben bereits \\(0{,}8+0{,}1+0{,}1=1\\), es fehlt also nichts; und das Quadrieren gehört zur Varianz, nicht zum Erwartungswert. Nur das arithmetische Mittel stimmt mit dem Erwartungswert überein, wenn alle Werte gleich wahrscheinlich sind — hier sind sie es gerade nicht." },
      { id:27, level:5, typ:"numerisch", frage:"Eine Zufallsgröße \\(X\\) nimmt genau die Werte \\(1\\), \\(2\\) und \\(3\\) an. Dabei ist \\(P(X=3)\\) doppelt so groß wie \\(P(X=1)\\), und es gilt \\(E(X) = 2{,}2\\). Bestimme \\(P(X=2)\\).", loesung:0.4, toleranz:0.005, tipp:"Führe für die kleinste der drei Wahrscheinlichkeiten einen Buchstaben ein und schreibe die beiden anderen damit auf; zwei der Angaben liefern dann zwei Gleichungen.", loesungsweg:"Zwei Bedingungen stehen zur Verfügung: die Summenbedingung und der Erwartungswert. Mit \\(p = P(X=1)\\) ist \\(P(X=3) = 2p\\), und aus der Summenbedingung folgt $$P(X=2) = 1 - p - 2p = 1 - 3p$$ Damit in die Erwartungswertformel: $$E(X) = 1 \\cdot p + 2 \\cdot (1-3p) + 3 \\cdot 2p = p + 2 - 6p + 6p = p + 2$$ Die Gleichung \\(p + 2 = 2{,}2\\) liefert \\(p = 0{,}2\\), und daraus $$P(X=2) = 1 - 3 \\cdot 0{,}2 = 0{,}4$$ Probe mit der vollständigen Verteilung \\(0{,}2\\); \\(0{,}4\\); \\(0{,}4\\): Summe \\(1\\) und \\(1 \\cdot 0{,}2 + 2 \\cdot 0{,}4 + 3 \\cdot 0{,}4 = 0{,}2+0{,}8+1{,}2 = 2{,}2\\). Bemerkenswert ist, wie stark sich der Term vereinfacht: Die \\(p\\)-Anteile aus dem zweiten und dritten Summanden heben sich auf." },
      { id:28, level:5, typ:"numerisch", frage:"Zwei faire Würfel werden geworfen. Die Zufallsgröße \\(X\\) ist die Differenz aus der größeren und der kleineren Augenzahl (bei gleichen Augenzahlen also \\(0\\)). Berechne \\(E(X)\\) auf zwei Nachkommastellen.", loesung:1.94, toleranz:0.03, tipp:"Zähle für jeden möglichen Wert von \\(X\\) ab, wie viele der \\(36\\) Augenpaare ihn liefern; erst mit dieser Verteilung ist der Erwartungswert zu bilden.", loesungsweg:"Alle \\(36\\) Augenpaare sind gleich wahrscheinlich. Abzählen der Paare je Differenz: <br>Differenz \\(0\\): die sechs Paare mit gleicher Augenzahl. <br>Differenz \\(1\\): \\((1;2)\\) bis \\((5;6)\\) und umgekehrt, also \\(5 \\cdot 2 = 10\\). <br>Ebenso Differenz \\(2\\): \\(4 \\cdot 2 = 8\\); Differenz \\(3\\): \\(3 \\cdot 2 = 6\\); Differenz \\(4\\): \\(2 \\cdot 2 = 4\\); Differenz \\(5\\): \\(1 \\cdot 2 = 2\\). <br>Summenprobe: \\(6+10+8+6+4+2 = 36\\). Die Verteilung lautet also \\(\\tfrac{6}{36}\\); \\(\\tfrac{10}{36}\\); \\(\\tfrac{8}{36}\\); \\(\\tfrac{6}{36}\\); \\(\\tfrac{4}{36}\\); \\(\\tfrac{2}{36}\\). Erwartungswert: $$E(X) = \\frac{0 \\cdot 6 + 1 \\cdot 10 + 2 \\cdot 8 + 3 \\cdot 6 + 4 \\cdot 4 + 5 \\cdot 2}{36}$$ $$E(X) = \\frac{0 + 10 + 16 + 18 + 16 + 10}{36} = \\frac{70}{36} \\approx 1{,}94$$ Häufig wird hier \\(2{,}5\\) geraten — das arithmetische Mittel der sechs möglichen Differenzen \\(0\\) bis \\(5\\). Das wäre nur richtig, wenn alle Differenzen gleich häufig aufträten; die \\(5\\) entsteht aber nur aus zwei Paaren, die kleinen Differenzen aus vielen." },
      { id:29, level:5, typ:"numerisch", frage:"Für eine Zufallsgröße mit \\(P(X=0)=0{,}75\\) und \\(P(X=4)=0{,}25\\) rechnet jemand \\(\\sigma = 0 \\cdot 0{,}75 + 4 \\cdot 0{,}25 = 1\\). Berechne die richtige Standardabweichung auf zwei Nachkommastellen.", loesung:1.73, toleranz:0.03, tipp:"Prüfe, welche Kenngröße der vorgeführte Ausdruck tatsächlich bildet, und schlage dann den Weg ein, der die Abweichungen von dieser Kenngröße auswertet.", loesungsweg:"Der vorgeführte Ausdruck ist die gewichtete Summe der Werte — das ist der <b>Erwartungswert</b>, nicht die Standardabweichung. Der Fehler besteht darin, die Definition der Streuung durch die des Mittelwerts zu ersetzen; beide sind hier verschieden. <br>Richtig zuerst \\(\\mu\\): $$\\mu = 0 \\cdot 0{,}75 + 4 \\cdot 0{,}25 = 1$$ Dass der falsche Weg zufällig auch \\(1\\) ergibt, liegt daran, dass genau diese Rechnung ausgeführt wurde — das Ergebnis trägt nur den falschen Namen. Nun die Varianz über die quadrierten Abweichungen von \\(\\mu\\): $$V(X) = (0-1)^2 \\cdot 0{,}75 + (4-1)^2 \\cdot 0{,}25 = 1 \\cdot 0{,}75 + 9 \\cdot 0{,}25$$ $$V(X) = 0{,}75 + 2{,}25 = 3$$ $$\\sigma = \\sqrt3 \\approx 1{,}73$$ Die richtige Standardabweichung ist also deutlich größer als der behauptete Wert. Sachprobe: Die Werte \\(0\\) und \\(4\\) liegen \\(1\\) bzw. \\(3\\) von \\(\\mu\\) entfernt; eine typische Abweichung von nur \\(1\\) wäre mit einem Abstand von \\(3\\) im Spiel nicht vereinbar." },
      { id:30, level:5, typ:"numerisch", frage:"Eine Zufallsgröße \\(X\\) nimmt genau die Werte \\(-3\\), \\(0\\) und \\(a\\) an, und zwar mit den Wahrscheinlichkeiten \\(0{,}5\\); \\(0{,}2\\) und \\(0{,}3\\). Bestimme \\(a\\) so, dass \\(E(X) = 1{,}5\\) gilt.", loesung:10, toleranz:0.01, tipp:"Der unbekannte Wert bleibt als Variable in der gewichteten Summe stehen; prüfe vorher, ob die drei Wahrscheinlichkeiten überhaupt eine Verteilung bilden.", loesungsweg:"Erst die Summenprobe: \\(0{,}5 + 0{,}2 + 0{,}3 = 1\\), die Verteilung ist also vollständig und \\(a\\) die einzige Unbekannte. Nun bleibt \\(a\\) in der gewichteten Summe stehen: $$E(X) = (-3) \\cdot 0{,}5 + 0 \\cdot 0{,}2 + a \\cdot 0{,}3 = -1{,}5 + 0{,}3\\,a$$ Gleichsetzen mit der Vorgabe: $$-1{,}5 + 0{,}3\\,a = 1{,}5 \\;\\Rightarrow\\; 0{,}3\\,a = 3 \\;\\Rightarrow\\; a = \\frac{3}{0{,}3}$$ Also \\(a = 10\\). Probe: \\((-3) \\cdot 0{,}5 + 0 + 10 \\cdot 0{,}3 = -1{,}5 + 3 = 1{,}5\\). <br>Beachte die Größenordnung: Damit ein Erwartungswert von \\(1{,}5\\) gegen den mit \\(0{,}5\\) gewichteten Wert \\(-3\\) zustande kommt, muss \\(a\\) deutlich größer als \\(1{,}5\\) sein — sein Gewicht ist ja nur \\(0{,}3\\). Ein Ergebnis in der Nähe von \\(1{,}5\\) wäre hier sicher ein Rechenfehler." },

      // ========== LEVEL 6 — Behauptung prüfen, faires Spiel, Grenzfall, Fallunterscheidung ==========
      { id:31, level:6, typ:"mc", frage:"„Der Erwartungswert einer Zufallsgröße ist stets einer ihrer möglichen Werte.“ Beurteilen Sie diese Behauptung.", optionen:["falsch, beim Würfelwurf ist \\(E(X)=3{,}5\\) und tritt nie ein","richtig, der Erwartungswert wird ja aus den Werten gebildet","richtig, sofern alle Wahrscheinlichkeiten gleich groß sind","falsch, der Erwartungswert ist stets kleiner als jeder Wert"], korrekt:0, tipp:"Suchen Sie nach einem einfachen Zufallsversuch, bei dem sich der Erwartungswert leicht angeben lässt, und vergleichen Sie ihn mit dem Wertebereich.", loesungsweg:"Ein Gegenbeispiel genügt, um die Behauptung zu widerlegen. Beim Wurf eines fairen Würfels ist $$E(X) = \\tfrac16(1+2+3+4+5+6) = \\tfrac{21}{6} = 3{,}5$$ Der Wert \\(3{,}5\\) ist keine Augenzahl und tritt bei keinem einzelnen Wurf ein — die Behauptung ist damit falsch. <br>Dass der Erwartungswert aus den Werten gebildet wird, macht ihn nicht selbst zu einem Wert: Ein gewichteter Mittelwert liegt zwischen den Werten, nicht notwendig auf einem von ihnen. Auch gleiche Wahrscheinlichkeiten helfen nicht — der Würfel ist ja genau dieser Fall. Richtig ist lediglich, dass \\(E(X)\\) nie unter dem kleinsten und nie über dem größten Wert liegt; kleiner als jeder Wert kann er also gerade nicht sein. Der Erwartungswert ist eine Aussage über den Durchschnitt vieler Versuche, nicht über einen einzelnen." },
      { id:32, level:6, typ:"numerisch", frage:"Bei einem Spiel zahlt man \\(2\\,€\\) Einsatz und wirft zwei faire Münzen. Bei zwei Wappen werden \\(7\\,€\\) ausgezahlt, bei genau einem Wappen \\(1\\,€\\), bei keinem Wappen nichts. Berechnen Sie den erwarteten Nettogewinn je Spiel in Euro und beurteilen Sie damit, ob das Spiel fair ist.", loesung:0.25, toleranz:0.01, tipp:"Stellen Sie die Verteilung derjenigen Größe auf, die die Spielenden am Ende tatsächlich in der Hand haben, und bedenken Sie, wann der Einsatz fällig wird.", loesungsweg:"Zu beurteilen ist nicht die Auszahlung, sondern der <b>Nettogewinn</b> \\(X\\) = Auszahlung minus Einsatz. Der Einsatz von \\(2\\,€\\) wird in jedem Fall fällig, auch bei zwei Wappen. Die Verteilung der Wappenzahl ist \\(\\tfrac14\\); \\(\\tfrac12\\); \\(\\tfrac14\\) (vgl. die vier Ausgänge ZZ, ZW, WZ, WW), also $$P(X=5) = \\tfrac14 \\qquad P(X=-1) = \\tfrac12 \\qquad P(X=-2) = \\tfrac14$$ Erwartungswert: $$E(X) = 5 \\cdot \\tfrac14 + (-1) \\cdot \\tfrac12 + (-2) \\cdot \\tfrac14 = 1{,}25 - 0{,}50 - 0{,}50 = 0{,}25$$ Beurteilung: Ein Spiel ist genau dann fair, wenn der erwartete Nettogewinn null ist. Hier ist er \\(+0{,}25\\,€\\), das Spiel ist also <b>nicht fair</b>, sondern für die Spielenden vorteilhaft — auf lange Sicht verliert der Anbieter je Spiel \\(25\\) Cent. <br>Kontrollrechnung über die Auszahlung: \\(7 \\cdot \\tfrac14 + 1 \\cdot \\tfrac12 = 1{,}75 + 0{,}50 = 2{,}25\\,€\\) erwartete Auszahlung gegen \\(2\\,€\\) Einsatz — dieselbe Differenz. Fair wäre das Spiel bei einem Einsatz von \\(2{,}25\\,€\\)." },
      { id:33, level:6, typ:"numerisch", frage:"Von einer Zufallsgröße \\(X\\) ist nur bekannt, dass sie ausschließlich die Werte \\(0\\), \\(1\\) und \\(4\\) annimmt und dass \\(E(X) = 1\\) gilt. Bestimmen Sie den größtmöglichen Wert von \\(P(X=4)\\).", loesung:0.25, toleranz:0.005, tipp:"Beschreiben Sie die Verteilung mit der gesuchten Wahrscheinlichkeit als Variable und überlegen Sie, welche Bedingung für die übrigen Wahrscheinlichkeiten die Vergrößerung begrenzt.", loesungsweg:"Die Verteilung ist nicht eindeutig festgelegt; gesucht ist ein Grenzfall. Mit \\(a = P(X=0)\\), \\(b = P(X=1)\\) und \\(c = P(X=4)\\) gilt $$a+b+c = 1 \\qquad \\text{und} \\qquad 0 \\cdot a + 1 \\cdot b + 4 \\cdot c = 1$$ Aus der zweiten Gleichung folgt \\(b = 1 - 4c\\), und die erste liefert \\(a = 1 - b - c = 3c\\). Beide müssen Wahrscheinlichkeiten sein, also nicht negativ: $$a = 3c \\ge 0 \\quad\\text{ist für jedes } c \\ge 0 \\text{ erfüllt}$$ $$b = 1 - 4c \\ge 0 \\;\\Rightarrow\\; c \\le 0{,}25$$ Die Schranke kommt also allein von \\(b\\). Der größtmögliche Wert ist \\(P(X=4) = 0{,}25\\); er wird im Grenzfall \\(b = 0\\) angenommen, mit der Verteilung \\(a = 0{,}75\\), \\(b = 0\\), \\(c = 0{,}25\\). Probe: \\(0 \\cdot 0{,}75 + 1 \\cdot 0 + 4 \\cdot 0{,}25 = 1\\). <br>Anschaulich: Jedes Stück Wahrscheinlichkeit beim großen Wert \\(4\\) muss durch Gewicht beim Wert \\(0\\) ausgeglichen werden. Der Wert \\(1\\) liegt schon auf dem Erwartungswert und hilft beim Ausgleich nicht — deshalb wird der Grenzfall gerade dann erreicht, wenn er gar nicht vorkommt." },
      { id:34, level:6, typ:"mc", frage:"„Sind alle Werte einer Zufallsgröße gleich wahrscheinlich, so ist der Erwartungswert das arithmetische Mittel der Werte.“ Beurteilen Sie diese Behauptung.", optionen:["richtig, bei gleichen Gewichten fällt die Gewichtung heraus","falsch, das arithmetische Mittel ist stets kleiner als \\(E(X)\\)","falsch, die Wahrscheinlichkeiten gehen immer einzeln ein","richtig, aber nur bei genau zwei möglichen Werten"], korrekt:0, tipp:"Setzen Sie in die Erwartungswertformel für jede Wahrscheinlichkeit denselben Wert ein und vergleichen Sie das Ergebnis mit der Formel für das arithmetische Mittel.", loesungsweg:"Nimmt \\(X\\) genau \\(n\\) Werte mit jeweils derselben Wahrscheinlichkeit an, so ist diese \\(\\tfrac1n\\). Einsetzen: $$E(X) = \\sum_{i=1}^{n} x_i \\cdot \\tfrac1n = \\tfrac1n \\sum_{i=1}^{n} x_i$$ Rechts steht genau das arithmetische Mittel der Werte — die Behauptung ist <b>richtig</b>. Der gemeinsame Faktor \\(\\tfrac1n\\) lässt sich vor die Summe ziehen, damit verschwindet die einzelne Gewichtung. <br>Die Aussage gilt für jede Anzahl von Werten, nicht nur für zwei; beim Würfel mit \\(n=6\\) etwa ergibt sich \\(3{,}5\\). Und die Wahrscheinlichkeiten gehen sehr wohl ein — sie sind hier nur alle gleich und heben sich deshalb zu einem einzigen Faktor zusammen. <br>Wichtig ist die Umkehrung: Sobald die Wahrscheinlichkeiten verschieden sind, ist das arithmetische Mittel der Werte <b>nicht</b> mehr der Erwartungswert. Es kann dann sowohl größer als auch kleiner sein, je nachdem, ob die kleinen oder die großen Werte das größere Gewicht tragen." },
      { id:35, level:6, typ:"numerisch", frage:"Lotterie A zahlt mit der Wahrscheinlichkeit \\(0{,}01\\) einen Gewinn von \\(100\\,€\\) und sonst nichts. Lotterie B zahlt mit der Wahrscheinlichkeit \\(0{,}5\\) einen Gewinn von \\(2\\,€\\) und sonst nichts. Berechnen Sie die Standardabweichung der Auszahlung von Lotterie A und begründen Sie damit, welche Lotterie das größere Risiko trägt (2 Nachkommastellen).", loesung:9.95, toleranz:0.05, tipp:"Bestimmen Sie für beide Lotterien zuerst den Erwartungswert und vergleichen Sie ihn; danach entscheidet die Streuung, und die ist für die gesuchte Angabe auszurechnen.", loesungsweg:"Zuerst die Erwartungswerte: $$E(A) = 100 \\cdot 0{,}01 + 0 \\cdot 0{,}99 = 1 \\qquad E(B) = 2 \\cdot 0{,}5 + 0 \\cdot 0{,}5 = 1$$ Beide Lotterien zahlen im Mittel dasselbe aus — nach dem Erwartungswert allein wären sie gleichwertig. Nun die Streuung von A: $$V(A) = (100-1)^2 \\cdot 0{,}01 + (0-1)^2 \\cdot 0{,}99 = 9801 \\cdot 0{,}01 + 0{,}99$$ $$V(A) = 98{,}01 + 0{,}99 = 99 \\;\\Rightarrow\\; \\sigma(A) = \\sqrt{99} \\approx 9{,}95$$ Zum Vergleich B: \\(V(B) = (2-1)^2 \\cdot 0{,}5 + (0-1)^2 \\cdot 0{,}5 = 1\\), also \\(\\sigma(B) = 1\\). <br>Begründung: Bei gleichem Erwartungswert trägt Lotterie A mit \\(\\sigma \\approx 9{,}95\\) gegen \\(\\sigma = 1\\) das rund zehnfache Risiko. In A ist der Ausgang fast immer \\(0\\,€\\), sehr selten aber \\(100\\,€\\); in B liegt jeder Ausgang höchstens \\(1\\,€\\) vom Erwartungswert entfernt. Daran zeigt sich: Der Erwartungswert beschreibt nur die Mitte einer Verteilung. Wer zwei Angebote vergleichen will, braucht die Streuung dazu — sonst erscheinen völlig unterschiedliche Verteilungen als gleichwertig." },
      { id:36, level:6, typ:"mc", frage:"„Ist bei einem Spiel der erwartete Nettogewinn null, so gewinnt man in der Hälfte aller Spiele.“ Beurteilen Sie diese Behauptung.", optionen:["falsch, der Erwartungswert sagt nichts über die Häufigkeit","richtig, denn Gewinn und Verlust heben sich gerade auf","richtig, sofern das Spiel nur zwei Ausgänge haben kann","falsch, man gewinnt dann in mehr als der Hälfte aller Spiele"], korrekt:0, tipp:"Suchen Sie ein faires Spiel mit einem seltenen hohen Gewinn und rechnen Sie nach, wie oft darin gewonnen wird.", loesungsweg:"Die Behauptung ist <b>falsch</b>. Der Erwartungswert wiegt Gewinnhöhe und Wahrscheinlichkeit gegeneinander auf; über die Anzahl der Gewinnspiele sagt er nichts. <br>Gegenbeispiel: Ein Spiel kostet \\(1\\,€\\) Einsatz und zahlt mit der Wahrscheinlichkeit \\(\\tfrac{1}{100}\\) genau \\(100\\,€\\) aus. Der erwartete Nettogewinn ist $$E(X) = 99 \\cdot \\tfrac{1}{100} + (-1) \\cdot \\tfrac{99}{100} = 0{,}99 - 0{,}99 = 0$$ Das Spiel ist fair, gewonnen wird aber nur in einem von hundert Spielen. Genauso lässt sich ein faires Spiel bauen, in dem man in \\(99\\) von \\(100\\) Spielen einen kleinen Betrag gewinnt und sehr selten viel verliert. <br>Die Zusatzbedingung „nur zwei Ausgänge“ hilft nicht: Das Gegenbeispiel hat genau zwei Ausgänge. Und die Richtung lässt sich auch nicht festlegen — je nach Verteilung liegt die Gewinnhäufigkeit bei einem fairen Spiel über oder unter der Hälfte. Wer wissen will, wie oft gewonnen wird, muss die Verteilung selbst ansehen; dafür reicht keine einzelne Kenngröße." }
    ];
