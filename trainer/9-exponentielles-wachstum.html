<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exponentielles Wachstum - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-exponentielles-wachstum';
    const THEMA_CONFIG = { name: 'Exponentielles Wachstum', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 ==========
      { id: 1, level: 1, typ: "mc", frage: "Welche Funktion beschreibt exponentielles Wachstum?", optionen: ["\\(f(x) = 2x\\)", "\\(f(x) = 2^x\\)", "\\(f(x) = x^2\\)", "\\(f(x) = x + 2\\)"], korrekt: 1, tipp: "Die Variable steht im Exponenten.", loesungsweg: "Entscheidend ist, wo die Variable steht. Bei \\(2^x\\) steht sie im <b>Exponenten</b> — der Wert verdoppelt sich mit jedem Schritt, das Wachstum ist exponentiell. Bei \\(x^2\\) steht sie in der Basis (Potenzfunktion), bei \\(2x\\) und \\(x+2\\) wächst sie linear." },
      { id: 2, level: 1, typ: "numerisch", frage: "\\(f(x) = 2^x\\): Berechne \\(f(3)\\).", loesung: 8, toleranz: 0, tipp: "\\(2^3\\).", loesungsweg: "$$f(3) = 2^3 = 2 \\cdot 2 \\cdot 2 = 8$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(f(x) = 3^x\\): Berechne \\(f(2)\\).", loesung: 9, toleranz: 0, tipp: "\\(3^2\\).", loesungsweg: "$$f(2) = 3^2 = 9$$" },
      { id: 4, level: 1, typ: "mc", frage: "Was ist typisch für exponentielles Wachstum?", optionen: ["konstante Zunahme pro Zeiteinheit", "konstanter Faktor pro Zeiteinheit", "konstante Abnahme pro Zeiteinheit", "lineare Zunahme"], korrekt: 1, tipp: "Multiplikativ statt additiv.", loesungsweg: "Exponentielles Wachstum: Multiplikation mit festem <b>Wachstumsfaktor</b>." },
      { id: 5, level: 1, typ: "numerisch", frage: "\\(f(x) = 2^x\\): Berechne \\(f(0)\\).", loesung: 1, toleranz: 0, tipp: "Jede Zahl hoch 0 = 1.", loesungsweg: "Jede Zahl außer null ergibt hoch null den Wert eins: $$f(0) = 2^0 = 1$$ Deshalb hat jede Exponentialfunktion der Form \\(a^x\\) den \\(y\\)-Achsenabschnitt \\(1\\)." },
      { id: 6, level: 1, typ: "numerisch", frage: "Ein Bestand verdreifacht sich in jedem Schritt. Welchen Wachstumsfaktor hat er?", loesung: 3, toleranz: 0, tipp: "Womit wird bei jedem Schritt multipliziert?", loesungsweg: "Verdreifachen heißt: mit \\(3\\) multiplizieren. Der Wachstumsfaktor ist $$q = 3$$" },
      // ========== LEVEL 2 -- Wachstumsfaktor ==========
      { id: 7, level: 2, typ: "mc", frage: "Bei 5 % jährlicher Zunahme lautet der Wachstumsfaktor pro Jahr …", optionen: ["\\(0{,}05\\)", "\\(1{,}05\\)", "\\(5\\)", "\\(0{,}95\\)"], korrekt: 1, tipp: "Faktor = 1 + Prozentsatz als Dezimalzahl.", loesungsweg: "\\(q = 1 + 0{,}05 = 1{,}05\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Ein Bestand von 100 wächst in jedem Schritt mit dem Faktor \\(1{,}1\\). Wert nach 2 Schritten?", loesung: 121, toleranz: 0.1, tipp: "Zweimal mit dem Faktor multiplizieren.", loesungsweg: "Jeder Schritt multipliziert mit \\(1{,}1\\), zwei Schritte also mit \\(1{,}1^2\\): $$100 \\cdot 1{,}1^2 = 100 \\cdot 1{,}21 = 121$$ Zwei Schritte à \\(10\\,\\%\\) ergeben nicht \\(20\\,\\%\\), sondern \\(21\\,\\%\\) — der zweite Zuwachs wird vom bereits gewachsenen Bestand genommen." },
      { id: 9, level: 2, typ: "numerisch", frage: "Bei 10 % Abnahme: Wachstumsfaktor = ?", loesung: 0.9, toleranz: 0.01, tipp: "\\(1 - 0{,}1\\).", loesungsweg: "$$q = 1 - 0{,}1 = 0{,}9$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Bakterien verdoppeln sich stündlich. Start: 50. Wie viele sind es nach 3 h?", loesung: 400, toleranz: 0, tipp: "Dreimal verdoppeln.", loesungsweg: "Verdoppelung bedeutet den Faktor \\(2\\) je Stunde: $$50 \\cdot 2^3 = 50 \\cdot 8 = 400$$" },
      { id: 11, level: 2, typ: "mc", frage: "Allgemeine Form exponentiellen Wachstums?", optionen: ["\\(N(t) = a + bt\\)", "\\(N(t) = a \\cdot q^t\\)", "\\(N(t) = at^2\\)", "\\(N(t) = a/t\\)"], korrekt: 1, tipp: "Startwert mal Faktor hoch Zeit.", loesungsweg: "\\(N(t) = N_0 \\cdot q^t\\) mit Startwert \\(N_0\\) und Faktor \\(q\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Startwert 200, \\(q = 1{,}5\\), Zeit \\(t = 3\\). Wert?", loesung: 675, toleranz: 0.1, tipp: "\\(1{,}5^3 = 3{,}375\\).", loesungsweg: "$$200 \\cdot 1{,}5^3 = 200 \\cdot 3{,}375 = 675$$" },
      // ========== LEVEL 3 -- Zinseszins, %-Anwendungen ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Kapital 1000 €, 3 % Zinsen pro Jahr mit Zinseszins. Kontostand nach 2 Jahren (in €)?", loesung: 1060.9, toleranz: 0.5, tipp: "Faktor \\(1{,}03\\) je Jahr.", loesungsweg: "Drei Prozent Zinsen entsprechen dem Faktor \\(1{,}03\\) je Jahr: $$1000 \\cdot 1{,}03^2 = 1000 \\cdot 1{,}0609 = 1060{,}90\\,€$$ Die \\(9\\) Cent über den \\(60\\,€\\) sind der Zinseszins — die Zinsen des ersten Jahres werden im zweiten mitverzinst." },
      { id: 14, level: 3, typ: "numerisch", frage: "Ein Auto verliert jährlich 15 % Wert. Neuwert 20 000 €. Nach 1 Jahr?", loesung: 17000, toleranz: 10, tipp: "Faktor \\(0{,}85\\).", loesungsweg: "Fünfzehn Prozent Verlust bedeuten, dass \\(85\\,\\%\\) übrig bleiben, also der Faktor \\(0{,}85\\): $$20\\,000 \\cdot 0{,}85 = 17\\,000\\,€$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Ein Motorrad verliert jährlich 20 % an Wert. Neuwert 8000 €. Wert nach 2 Jahren (in €)?", loesung: 5120, toleranz: 1, tipp: "Faktor \\(0{,}8\\), zweimal anwenden.", loesungsweg: "Zwei Jahre, also der Faktor zweimal: $$8000 \\cdot 0{,}8^2 = 8000 \\cdot 0{,}64 = 5120\\,€$$ Nach zwei Jahren sind \\(36\\,\\%\\) verloren, nicht \\(40\\,\\%\\) — der zweite Verlust bezieht sich auf den bereits gesunkenen Wert." },
      { id: 16, level: 3, typ: "mc", frage: "Eine Größe wächst exponentiell mit Faktor 2 pro Stunde. Nach wie vielen Stunden ist sie 16-mal so groß?", optionen: ["2", "3", "4", "8"], korrekt: 2, tipp: "\\(2^n = 16\\).", loesungsweg: "\\(2^4 = 16 \\Rightarrow n = 4\\) Stunden." },
      { id: 17, level: 3, typ: "numerisch", frage: "\\(N(t) = 500 \\cdot 1{,}2^t\\). Wert bei \\(t = 2\\)?", loesung: 720, toleranz: 0.5, tipp: "\\(1{,}2^2 = 1{,}44\\).", loesungsweg: "$$N(2) = 500 \\cdot 1{,}2^2 = 500 \\cdot 1{,}44 = 720$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Wachstumsfaktor bei 25 % Zunahme?", loesung: 1.25, toleranz: 0.01, tipp: "\\(1 + 0{,}25\\).", loesungsweg: "Zunahme um \\(25\\,\\%\\) heißt: Zum ganzen Bestand (\\(100\\,\\% = 1\\)) kommt ein Viertel hinzu. $$q = 1 + 0{,}25 = 1{,}25$$ Bei Abnahme wäre es \\(q = 1 - 0{,}25 = 0{,}75\\)." },
      // ========== LEVEL 4 -- Faktor aus Werten, Modell aus Tabelle, Umkehraufgaben ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Ein Bestand wächst exponentiell von 200 auf 288 in 2 Jahren. Wie groß ist der Wachstumsfaktor pro Jahr?", loesung: 1.2, toleranz: 0.01, tipp: "Zwei Jahre bedeuten den Faktor zweimal.", loesungsweg: "$$200 \\cdot q^2 = 288 \\;\\Rightarrow\\; q^2 = 1{,}44 \\;\\Rightarrow\\; q = 1{,}2$$ Der Bestand wächst also um \\(20\\,\\%\\) pro Jahr. Probe: \\(200 \\cdot 1{,}2 \\cdot 1{,}2 = 288\\) ✓" },
      { id: 20, level: 4, typ: "mc", frage: "Eine Wertetabelle: \\(t = 0, 1, 2, 3\\) mit \\(N = 5, 15, 45, 135\\). Welcher Term beschreibt den Bestand?", optionen: ["\\(N(t) = 5 \\cdot 3^t\\)", "\\(N(t) = 5 + 10t\\)", "\\(N(t) = 3 \\cdot 5^t\\)", "\\(N(t) = 5 \\cdot t^3\\)"], korrekt: 0, tipp: "Prüfe, ob die Werte durch einen festen Faktor auseinander hervorgehen.", loesungsweg: "Von Wert zu Wert: \\(15 : 5 = 3\\), \\(45 : 15 = 3\\), \\(135 : 45 = 3\\) — fester Faktor \\(3\\), also exponentiell mit Startwert \\(5\\): $$N(t) = 5 \\cdot 3^t$$ Bei \\(5 + 10t\\) wäre die Differenz fest (\\(10\\)), bei \\(3 \\cdot 5^t\\) der Startwert falsch." },
      { id: 21, level: 4, typ: "numerisch", frage: "Ein Kapital wird mit 4 % pro Jahr verzinst. Nach 2 Jahren beträgt der Kontostand 5408 €. Wie hoch war das Anfangskapital (in €)?", loesung: 5000, toleranz: 0.5, tipp: "Zwei Jahre rückwärts: zweimal durch den Faktor teilen.", loesungsweg: "$$K_0 \\cdot 1{,}04^2 = 5408 \\;\\Rightarrow\\; K_0 = \\frac{5408}{1{,}0816} = 5000\\,€$$ Probe: \\(5000 \\cdot 1{,}04 = 5200\\), \\(5200 \\cdot 1{,}04 = 5408\\) ✓" },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Bestand sinkt exponentiell in 3 Jahren von 1000 auf 512. Um wie viel Prozent nimmt er pro Jahr ab?", loesung: 20, toleranz: 0.1, tipp: "Erst den Jahresfaktor aus der dritten Wurzel bestimmen.", loesungsweg: "$$1000 \\cdot q^3 = 512 \\;\\Rightarrow\\; q^3 = 0{,}512 \\;\\Rightarrow\\; q = \\sqrt[3]{0{,}512} = 0{,}8$$ Abnahme pro Jahr: \\(1 - 0{,}8 = 0{,}2\\), also \\(20\\,\\%\\). Probe: \\(1000 \\to 800 \\to 640 \\to 512\\) ✓" },
      { id: 23, level: 4, typ: "numerisch", frage: "Angebot A: 100 € Startguthaben, jedes Jahr kommen 30 € dazu. Angebot B: 100 € Startguthaben, jedes Jahr 20 % mehr. Nach wie vielen ganzen Jahren ist B erstmals höher als A?", loesung: 6, toleranz: 0, tipp: "Lege eine Wertetabelle für beide Angebote an.", loesungsweg: "A wächst linear: \\(100 + 30n\\). B wächst exponentiell: \\(100 \\cdot 1{,}2^n\\). $$\\begin{array}{c|c|c} n & A & B \\\\ \\hline 4 & 220 & 207{,}36 \\\\ 5 & 250 & 248{,}83 \\\\ 6 & 280 & 298{,}60 \\end{array}$$ Nach \\(6\\) Jahren liegt B erstmals vorn — exponentielles Wachstum überholt lineares immer, nur nicht sofort." },
      { id: 24, level: 4, typ: "numerisch", frage: "Von einem Medikament wird alle 6 Stunden die Hälfte abgebaut. Zu Beginn sind 96 mg im Körper. Nach wie vielen Stunden sind es noch 12 mg?", loesung: 18, toleranz: 0, tipp: "Wie oft muss halbiert werden?", loesungsweg: "Halbieren: \\(96 \\to 48 \\to 24 \\to 12\\), also drei Halbwertszeiten: $$3 \\cdot 6\\,\\text{h} = 18\\,\\text{h}$$" },
      // ========== LEVEL 5 -- Fehler finden, zweischrittige Sachaufgaben, Parameter ==========
      { id: 25, level: 5, typ: "mc", frage: "Ein Bestand sinkt in 2 Jahren von 500 auf 320. Tim rechnet:<br>Schritt 1: \\(500 \\cdot q^2 = 320\\)<br>Schritt 2: \\(q^2 = 0{,}64\\)<br>Schritt 3: \\(q = 0{,}32\\)<br>Schritt 4: Abnahme \\(68\\,\\%\\) pro Jahr<br>Wo liegt der erste Fehler?", optionen: ["Schritt 1: es muss \\(500 \\cdot 2q = 320\\) heißen, weil es zwei Jahre sind", "Schritt 2: die Division \\(320 : 500\\) ergibt nicht \\(0{,}64\\), sondern \\(1{,}5625\\)", "Schritt 3: die Wurzel aus \\(0{,}64\\) ist \\(0{,}8\\) und nicht die Hälfte \\(0{,}32\\)", "Schritt 4: eine Abnahme berechnet man als \\(q - 1\\), also \\(-0{,}68\\)"], korrekt: 2, tipp: "Prüfe jeden Schritt durch die Umkehrrechnung.", loesungsweg: "Schritt 1 und 2 sind richtig. In Schritt 3 wurde halbiert statt die Wurzel gezogen: $$q = \\sqrt{0{,}64} = 0{,}8$$ Damit beträgt die Abnahme \\(1 - 0{,}8 = 20\\,\\%\\) pro Jahr. Probe: \\(500 \\cdot 0{,}8 \\cdot 0{,}8 = 320\\) ✓" },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Patient bekommt 400 mg eines Medikaments; der Körper baut pro Stunde 20 % der vorhandenen Menge ab. Nach wie vielen vollen Stunden sind erstmals weniger als 200 mg vorhanden?", loesung: 4, toleranz: 0, tipp: "Stundenweise Wertetabelle mit dem Abbaufaktor.", loesungsweg: "Faktor \\(0{,}8\\) pro Stunde: $$400 \\to 320 \\to 256 \\to 204{,}8 \\to 163{,}84$$ Nach \\(3\\) Stunden sind es noch \\(204{,}8\\,\\text{mg}\\), nach \\(4\\) Stunden \\(163{,}84\\,\\text{mg}\\) — erstmals unter \\(200\\,\\text{mg}\\) also nach \\(4\\) Stunden." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Bestand wächst exponentiell. Zum Zeitpunkt \\(t = 1\\) beträgt er 600, zum Zeitpunkt \\(t = 3\\) beträgt er 2400. Wie groß war der Anfangsbestand bei \\(t = 0\\)?", loesung: 300, toleranz: 0, tipp: "Erst den Faktor aus dem Verhältnis der beiden Werte.", loesungsweg: "Von \\(t = 1\\) bis \\(t = 3\\) sind es zwei Schritte: $$q^2 = \\frac{2400}{600} = 4 \\;\\Rightarrow\\; q = 2$$ Einen Schritt zurück: $$N(0) = \\frac{600}{2} = 300$$ Probe: \\(300 \\cdot 2^3 = 2400\\) ✓" },
      { id: 28, level: 5, typ: "numerisch", frage: "Eine Stadt hat 40 000 Einwohner und wächst jährlich um 5 %. Um wie viele Einwohner wächst sie im dritten Jahr?", loesung: 2205, toleranz: 1, tipp: "Bestand am Ende des zweiten und des dritten Jahres vergleichen.", loesungsweg: "Nach 2 Jahren: \\(40\\,000 \\cdot 1{,}05^2 = 44\\,100\\). Nach 3 Jahren: \\(40\\,000 \\cdot 1{,}05^3 = 46\\,305\\). Zuwachs im dritten Jahr: $$46\\,305 - 44\\,100 = 2205$$ Das sind \\(5\\,\\%\\) von \\(44\\,100\\) — mehr als die \\(2000\\) des ersten Jahres." },
      { id: 29, level: 5, typ: "numerisch", frage: "Zwei Anlagen mit je 2000 € Startkapital: Anlage A verzinst mit 3 % Zinseszins, Anlage B zahlt jedes Jahr 3 % des Startkapitals als feste Zinsen. Um wie viel Euro ist A nach 3 Jahren höher als B? (auf Cent)", loesung: 5.45, toleranz: 0.02, tipp: "A wächst exponentiell, B linear.", loesungsweg: "A: \\(2000 \\cdot 1{,}03^3 = 2000 \\cdot 1{,}092727 = 2185{,}45\\,€\\). B: \\(2000 + 3 \\cdot 60 = 2180\\,€\\). $$2185{,}45 - 2180 = 5{,}45\\,€$$ Die Differenz ist der Zinseszins der ersten zwei Jahre." },
      { id: 30, level: 5, typ: "numerisch", frage: "Von einer radioaktiven Substanz sind nach 24 Tagen noch 12,5 % der Anfangsmenge vorhanden. Wie viele Tage beträgt die Halbwertszeit?", loesung: 8, toleranz: 0, tipp: "Wie oft wurde halbiert, um auf diesen Anteil zu kommen?", loesungsweg: "$$100\\,\\% \\to 50\\,\\% \\to 25\\,\\% \\to 12{,}5\\,\\%$$ Das sind drei Halbierungen in \\(24\\) Tagen, also $$T = \\frac{24}{3} = 8 \\text{ Tage}$$" },
      // ========== LEVEL 6 -- Behauptungen, Umkehraufgaben, Vergleich ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Wenn sich ein Bestand in 10 Jahren verdoppelt (Zuwachs 100 %), dann wächst er exponentiell um 10 % pro Jahr.“ Was gilt?", optionen: ["Wahr, denn 100 % verteilt auf 10 Jahre ergeben genau 10 % pro Jahr", "Falsch, denn \\(1{,}1^{10} \\approx 2{,}59\\) und nicht \\(2\\); der Jahressatz ist kleiner", "Wahr, sofern das Wachstum in jedem Jahr denselben Faktor hat", "Falsch, denn für eine Verdopplung sind genau 5 % pro Jahr nötig"], korrekt: 1, tipp: "Rechne nach, was 10 Jahre à 10 % aus dem Bestand machen.", loesungsweg: "Bei \\(10\\,\\%\\) pro Jahr ist der Bestand nach 10 Jahren $$1{,}1^{10} \\approx 2{,}59\\text{-fach}$$ also deutlich mehr als verdoppelt. Prozentsätze addieren sich beim exponentiellen Wachstum nicht; der tatsächliche Jahressatz liegt bei etwa \\(7{,}2\\,\\%\\) (\\(1{,}072^{10} \\approx 2\\))." },
      { id: 32, level: 6, typ: "numerisch", frage: "Ein Bestand verdreifacht sich exponentiell alle 4 Jahre. Um wie viel Prozent wächst er pro Jahr? (eine Dezimale)", loesung: 31.6, toleranz: 0.1, tipp: "Der Jahresfaktor muss viermal angewendet 3 ergeben.", loesungsweg: "$$q^4 = 3 \\;\\Rightarrow\\; q = \\sqrt[4]{3} = 3^{\\frac{1}{4}} \\approx 1{,}316$$ Also etwa \\(31{,}6\\,\\%\\) pro Jahr — nicht \\(50\\,\\%\\) (das wäre \\(200\\,\\% : 4\\))." },
      { id: 33, level: 6, typ: "numerisch", frage: "Stadt A hat 20 000 Einwohner und wächst um 2 % pro Jahr; Stadt B hat 25 000 Einwohner und schrumpft um 3 % pro Jahr. Nach wie vielen ganzen Jahren hat A erstmals mehr Einwohner als B?", loesung: 5, toleranz: 0, tipp: "Beide Bestände Jahr für Jahr in einer Tabelle vergleichen.", loesungsweg: "$$\\begin{array}{c|c|c} n & A = 20\\,000 \\cdot 1{,}02^n & B = 25\\,000 \\cdot 0{,}97^n \\\\ \\hline 4 & 21\\,649 & 22\\,132 \\\\ 5 & 22\\,082 & 21\\,468 \\end{array}$$ Nach \\(5\\) Jahren liegt A erstmals vor B." },
      { id: 34, level: 6, typ: "mc", frage: "Behauptung: „Ein Bestand nimmt jedes Jahr um 25 % ab. Nach 4 Jahren ist er vollständig verschwunden.“ Was gilt?", optionen: ["Wahr, denn viermal 25 % Abnahme ergeben zusammen 100 %", "Falsch, denn nach 4 Jahren sind noch etwa 32 % des Bestands übrig", "Wahr, denn jeder exponentielle Zerfall endet nach endlicher Zeit bei null", "Falsch, denn nach 4 Jahren sind noch genau 25 % des Bestands übrig"], korrekt: 1, tipp: "Die 25 % beziehen sich jedes Jahr auf den aktuellen Bestand.", loesungsweg: "Faktor \\(0{,}75\\) pro Jahr: $$0{,}75^4 \\approx 0{,}316$$ Es sind noch rund \\(32\\,\\%\\) übrig. Exponentieller Zerfall erreicht die Null nie, er nähert sich ihr nur an." },
      { id: 35, level: 6, typ: "numerisch", frage: "Aus 1000 € werden bei festem Zinssatz mit Zinseszins in 3 Jahren genau 1728 €. Wie hoch ist der Zinssatz in Prozent?", loesung: 20, toleranz: 0.1, tipp: "Der Faktor muss dreimal angewendet den Endwert liefern.", loesungsweg: "$$1000 \\cdot q^3 = 1728 \\;\\Rightarrow\\; q^3 = 1{,}728 \\;\\Rightarrow\\; q = \\sqrt[3]{1{,}728} = 1{,}2$$ Der Zinssatz beträgt \\(20\\,\\%\\). Probe: \\(1000 \\to 1200 \\to 1440 \\to 1728\\) ✓" },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Bestand \\(N(t) = 64 \\cdot q^t\\) mit \\(0 < q < 1\\) hat zum Zeitpunkt \\(t = 3\\) den Wert 27. Zu welchem ganzzahligen Zeitpunkt \\(t\\) liegt der Wert erstmals unter 20?", loesung: 5, toleranz: 0, tipp: "Erst \\(q\\) bestimmen, dann eine Tabelle fortsetzen.", loesungsweg: "$$64 \\cdot q^3 = 27 \\;\\Rightarrow\\; q^3 = \\frac{27}{64} \\;\\Rightarrow\\; q = \\frac{3}{4}$$ Weiter: \\(N(4) = 27 \\cdot 0{,}75 = 20{,}25\\), \\(N(5) = 20{,}25 \\cdot 0{,}75 = 15{,}19\\). Erstmals unter \\(20\\) bei \\(t = 5\\)." }];
    </script>
