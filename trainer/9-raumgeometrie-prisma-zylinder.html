<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma &amp; Zylinder - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-raumgeometrie-prisma-zylinder';
    const THEMA_CONFIG = { name: 'Raumgeometrie: Prisma & Zylinder', bereich: 'geometrie' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Wie lautet die Volumenformel eines Prismas?", optionen:["\\(V=G\\cdot h\\)","\\(V=\\frac{G\\cdot h}{3}\\)","\\(V=a^3\\)","\\(V=\\pi r^2\\)"], korrekt:0, tipp:"Grundfläche mal Höhe.", loesungsweg:"Ein Prisma entsteht, indem eine Grundfläche senkrecht verschoben wird. Jede waagerechte Schicht hat dieselbe Fläche \\(G\\), und davon liegen \\(h\\) übereinander: $$V = G \\cdot h$$ Die Formel gilt für jede Grundfläche — Dreieck, Sechseck oder Kreis (dann heißt der Körper Zylinder)." },
      { id:2, level:1, typ:"mc", frage:"Volumenformel Zylinder?", optionen:["\\(\\pi r^2 h\\)","\\(\\frac{\\pi r^2 h}{3}\\)","\\(2\\pi r h\\)","\\(\\pi r h\\)"], korrekt:0, tipp:"Kreis als Grundfläche.", loesungsweg:"Der Zylinder ist ein Prisma mit kreisförmiger Grundfläche. Mit \\(G = \\pi r^2\\) wird aus \\(V = G \\cdot h\\): $$V = \\pi r^2 h$$" },
      { id:3, level:1, typ:"mc", frage:"Mantelfläche Zylinder?", optionen:["\\(\\pi r^2\\)","\\(2\\pi r h\\)","\\(\\pi r h\\)","\\(2\\pi r^2 h\\)"], korrekt:1, tipp:"Umfang mal Höhe.", loesungsweg:"Rollt man die Mantelfläche ab, entsteht ein Rechteck: Seine Breite ist der Kreisumfang \\(2\\pi r\\), seine Höhe die Zylinderhöhe \\(h\\). $$M = 2\\pi r \\cdot h$$ Deshalb steht hier der Umfang, nicht die Kreisfläche." },
      { id:4, level:1, typ:"numerisch", frage:"Würfel Kante 4. Volumen?", loesung:64, toleranz:0, tipp:"\\(a^3\\).", loesungsweg:"Alle drei Kanten sind gleich lang: $$V = a^3 = 4 \\cdot 4 \\cdot 4 = 64$$" },
      { id:5, level:1, typ:"numerisch", frage:"Quader \\(2\\times 3\\times 5\\). Volumen?", loesung:30, toleranz:0, tipp:"Produkt.", loesungsweg:"Die drei Kantenlängen werden multipliziert: $$V = 2 \\cdot 3 \\cdot 5 = 30$$" },
      { id:6, level:1, typ:"numerisch", frage:"Zylinder \\(r=2, h=5\\). Volumen (2 Dez).", loesung:62.83, toleranz:0.2, tipp:"\\(\\pi\\cdot 4\\cdot 5\\).", loesungsweg:"$$V = \\pi r^2 h = \\pi \\cdot 2^2 \\cdot 5 = 20\\pi \\approx 62{,}83$$" },
      { id:7, level:2, typ:"numerisch", frage:"Zylinder \\(r=3, h=10\\). Volumen (2 Dez).", loesung:282.74, toleranz:0.5, tipp:"\\(90\\pi\\).", loesungsweg:"$$V = \\pi \\cdot 3^2 \\cdot 10 = 90\\pi \\approx 282{,}74$$" },
      { id:8, level:2, typ:"numerisch", frage:"Zylinder \\(r=5, h=8\\). Mantel (2 Dez).", loesung:251.33, toleranz:0.5, tipp:"\\(2\\pi\\cdot 5\\cdot 8\\).", loesungsweg:"$$M = 2\\pi r h = 2\\pi \\cdot 5 \\cdot 8 = 80\\pi \\approx 251{,}33$$" },
      { id:9, level:2, typ:"numerisch", frage:"Prisma mit Dreiecksgrundfläche (Basis 6, Höhe Dreieck 4), Prismenhöhe 10. Volumen?", loesung:120, toleranz:0, tipp:"\\(G=12\\).", loesungsweg:"Grundfläche ist das Dreieck \\(G = \\tfrac12 \\cdot 6 \\cdot 4 = 12\\): $$V = G \\cdot h = 12 \\cdot 10 = 120$$ Die Dreieckshöhe \\(4\\) und die Prismenhöhe \\(10\\) sind zwei verschiedene Höhen." },
      { id:10, level:2, typ:"numerisch", frage:"Quader \\(4\\times 5\\times 6\\). Oberfläche?", loesung:148, toleranz:0, tipp:"\\(2(ab+bc+ac)\\).", loesungsweg:"Ein Quader hat drei Paare gegenüberliegender Rechtecke: $$O = 2(ab + bc + ac) = 2(20 + 30 + 24) = 2 \\cdot 74 = 148$$" },
      { id:11, level:2, typ:"numerisch", frage:"Zylinder \\(r=4, h=10\\). Gesamtoberfläche (2 Dez).", loesung:351.86, toleranz:1.0, tipp:"\\(2\\pi r^2+2\\pi rh\\).", loesungsweg:"Die Oberfläche besteht aus zwei Kreisen und dem Mantel: $$O = 2\\pi r^2 + 2\\pi r h = 32\\pi + 80\\pi = 112\\pi \\approx 351{,}86$$" },
      { id:12, level:2, typ:"mc", frage:"Ein Prisma hat stets …", optionen:["dreieckige Grundfläche","zwei kongruente, parallele Grundflächen","einen Scheitelpunkt","kreisförmige Grundfläche"], korrekt:1, tipp:"Definition.", loesungsweg:"Ein Prisma hat stets zwei <b>kongruente, parallele</b> Grundflächen; die Form der Grundfläche ist frei — Dreieck, Viereck, Sechseck oder Kreis (Zylinder). Eine Spitze hat dagegen die Pyramide." },
      { id:13, level:3, typ:"numerisch", frage:"Ein Aquarium (Quader) \\(40\\times 30\\times 25\\,\\text{cm}\\). Inhalt in Litern?", loesung:30, toleranz:0.1, tipp:"Erst das Volumen in \\(\\text{cm}^3\\), dann umrechnen: \\(1\\,\\text{l} = 1000\\,\\text{cm}^3\\).", loesungsweg:"$$V = 40 \\cdot 30 \\cdot 25 = 30\\,000\\,\\text{cm}^3$$ Wegen \\(1\\,\\text{l} = 1000\\,\\text{cm}^3\\) sind das \\(30\\) Liter." },
      { id:14, level:3, typ:"numerisch", frage:"Zylindertank \\(r=0{,}5\\,\\text{m}, h=2\\,\\text{m}\\). Volumen in m³ (2 Dez).", loesung:1.57, toleranz:0.02, tipp:"\\(\\pi\\cdot 0{,}25\\cdot 2\\).", loesungsweg:"$$V = \\pi \\cdot 0{,}5^2 \\cdot 2 = \\pi \\cdot 0{,}25 \\cdot 2 = 0{,}5\\pi \\approx 1{,}57\\,\\text{m}^3$$ Das sind rund \\(1570\\) Liter." },
      { id:15, level:3, typ:"numerisch", frage:"Ein Prisma hat als Grundfläche ein Trapez mit den parallelen Seiten 5 und 9 und der Höhe 4; die Prismenhöhe ist 6. Volumen?", loesung:168, toleranz:0, tipp:"Erst die Trapezfläche.", loesungsweg:"Trapezfläche: $$G = \\frac{(5 + 9) \\cdot 4}{2} = 28$$ Dann Prismenformel: $$V = G \\cdot h = 28 \\cdot 6 = 168$$" },
      { id:16, level:3, typ:"numerisch", frage:"Zylinder, Volumen 500 cm³, Höhe 10 cm. Radius (2 Dez).", loesung:3.99, toleranz:0.05, tipp:"\\(r=\\sqrt{V/(\\pi h)}\\).", loesungsweg:"Aus \\(V = \\pi r^2 h\\) nach \\(r\\) umstellen: $$r = \\sqrt{\\frac{V}{\\pi h}} = \\sqrt{\\frac{500}{\\pi \\cdot 10}} = \\sqrt{\\frac{50}{\\pi}} \\approx 3{,}99$$ Erst durch \\(\\pi h\\) teilen, dann die Wurzel ziehen — die Reihenfolge ist wichtig." },
      { id:17, level:3, typ:"numerisch", frage:"Wie viele Liter passen in eine Dose \\(r=4\\,\\text{cm}, h=12\\,\\text{cm}\\) (2 Dez)?", loesung:0.60, toleranz:0.02, tipp:"\\(192\\pi\\) cm³.", loesungsweg:"Zuerst das Volumen in Kubikzentimetern: $$V = \\pi \\cdot 4^2 \\cdot 12 = 192\\pi \\approx 603\\,\\text{cm}^3$$ Wegen \\(1\\,\\text{l} = 1000\\,\\text{cm}^3\\) sind das rund \\(0{,}60\\) Liter." },
      { id:18, level:3, typ:"mc", frage:"Verdopple Radius eines Zylinders. Volumen …", optionen:["verdoppelt","vervierfacht","verdreifacht","gleich"], korrekt:1, tipp:"\\(r^2\\).", loesungsweg:"Im Volumen \\(V = \\pi r^2 h\\) steht der Radius im <b>Quadrat</b>. Verdoppelt man ihn, wird daraus \\((2r)^2 = 4r^2\\): $$V_{neu} = 4 \\cdot V$$ Die Höhe geht dagegen nur linear ein — eine doppelte Höhe verdoppelt das Volumen lediglich." },
      { id:19, level:4, typ:"mc", frage:"Ein Zeltdach hat die Form eines Dreiecksprismas: Der Dreiecksquerschnitt ist \\(3\\,\\text{m}\\) breit und \\(2\\,\\text{m}\\) hoch, das Zelt ist \\(5\\,\\text{m}\\) lang. Welche Rechnung liefert das Volumen in m³?", optionen:["\\(\\tfrac12 \\cdot 3 \\cdot 2 \\cdot 5\\)","\\(3 \\cdot 2 \\cdot 5\\)","\\(\\tfrac13 \\cdot 3 \\cdot 2 \\cdot 5\\)","\\(\\tfrac12 \\cdot (3 + 2) \\cdot 5\\)"], korrekt:0, tipp:"Grundfläche ist ein Dreieck — wie berechnet man seine Fläche?", loesungsweg:"Beim Prisma ist \\(V = G \\cdot h\\); die Grundfläche ist das Dreieck \\(G = \\tfrac12 \\cdot 3 \\cdot 2 = 3\\,\\text{m}^2\\): $$V = \\tfrac12 \\cdot 3 \\cdot 2 \\cdot 5 = 15\\,\\text{m}^3$$ \\(3 \\cdot 2 \\cdot 5\\) wäre der umschließende Quader (doppelt so groß), \\(\\tfrac13\\) gehört zur Pyramide, und \\(\\tfrac12(3+2)\\) mischt Seiten und Höhe." },
      { id:20, level:4, typ:"numerisch", frage:"Ein Zylinder hat das Volumen \\(1130{,}4\\,\\text{cm}^3\\) und die Höhe \\(10\\,\\text{cm}\\). Wie groß ist sein Durchmesser in cm (\\(\\pi = 3{,}14\\))?", loesung:12, toleranz:0.1, tipp:"Erst die Grundfläche, dann den Radius — und gefragt ist der Durchmesser.", loesungsweg:"Grundfläche: $$G = \\frac{V}{h} = \\frac{1130{,}4}{10} = 113{,}04\\,\\text{cm}^2$$ Radius: $$r^2 = \\frac{113{,}04}{3{,}14} = 36 \\implies r = 6\\,\\text{cm}$$ Durchmesser \\(d = 12\\,\\text{cm}\\)." },
      { id:21, level:4, typ:"numerisch", frage:"Ein Wasserrohr hat innen \\(20\\,\\text{cm}\\) Durchmesser und ist \\(5\\,\\text{m}\\) lang. Wie viele Liter Wasser enthält es, wenn es ganz gefüllt ist (\\(\\pi = 3{,}14\\))?", loesung:157, toleranz:0.5, tipp:"Einheiten angleichen, dann Zylindervolumen, dann in Liter.", loesungsweg:"\\(r = 10\\,\\text{cm}\\), \\(h = 500\\,\\text{cm}\\): $$V = 3{,}14 \\cdot 10^2 \\cdot 500 = 157\\,000\\,\\text{cm}^3 = 157\\,\\text{L}$$" },
      { id:22, level:4, typ:"numerisch", frage:"Ein Würfel hat die Oberfläche \\(150\\,\\text{cm}^2\\). Wie groß ist sein Volumen in cm³?", loesung:125, toleranz:0, tipp:"Von der Oberfläche zur Kante, von der Kante zum Volumen.", loesungsweg:"Sechs gleiche Quadrate: $$6a^2 = 150 \\implies a^2 = 25 \\implies a = 5\\,\\text{cm}$$ $$V = 5^3 = 125\\,\\text{cm}^3$$" },
      { id:23, level:4, typ:"numerisch", frage:"Ein Dachraum ist ein Dreiecksprisma: Der Querschnitt ist ein rechtwinkliges Dreieck mit den Katheten \\(3\\,\\text{m}\\) und \\(4\\,\\text{m}\\), der Raum ist \\(8\\,\\text{m}\\) lang. Wie viel m² Blech braucht man, um alle fünf Flächen zu verkleiden?", loesung:108, toleranz:0, tipp:"Die dritte Dreiecksseite fehlt noch — Pythagoras.", loesungsweg:"Hypotenuse des Querschnitts: \\(\\sqrt{3^2 + 4^2} = 5\\,\\text{m}\\). Die Oberfläche besteht aus zwei Dreiecken und drei Rechtecken (Umfang mal Länge): $$O = 2 \\cdot \\tfrac12 \\cdot 3 \\cdot 4 + (3 + 4 + 5) \\cdot 8 = 12 + 96 = 108\\,\\text{m}^2$$" },
      { id:24, level:4, typ:"numerisch", frage:"Ein Quader hat die Grundfläche \\(6\\,\\text{cm} \\times 8\\,\\text{cm}\\) und die Oberfläche \\(236\\,\\text{cm}^2\\). Wie hoch ist er in cm?", loesung:5, toleranz:0, tipp:"Boden und Deckel sind bekannt — der Rest ist der Mantel.", loesungsweg:"Boden und Deckel: \\(2 \\cdot 6 \\cdot 8 = 96\\,\\text{cm}^2\\). Der Mantel besteht aus vier Rechtecken mit dem Grundflächenumfang \\(2(6+8) = 28\\,\\text{cm}\\) als Breite: $$96 + 28h = 236 \\implies 28h = 140 \\implies h = 5\\,\\text{cm}$$" },
      { id:25, level:5, typ:"mc", frage:"Paul berechnet die Oberfläche eines Zylinders mit \\(r = 3\\,\\text{cm}\\) und \\(h = 10\\,\\text{cm}\\): \\(O = 2 \\cdot \\pi \\cdot 3 \\cdot 10 \\approx 188{,}5\\,\\text{cm}^2\\). Was ist dazu zu sagen?", optionen: ["Die Rechnung ist richtig — \\(2\\pi r h\\) ist die Oberflächenformel des Zylinders.", "Falsch: Das ist nur der Mantel — Boden und Deckel fehlen, richtig sind etwa \\(245{,}0\\,\\text{cm}^2\\).", "Falsch: Die Oberfläche ist \\(\\pi \\cdot 3^2 \\cdot 10 \\approx 282{,}7\\,\\text{cm}^2\\), der Radius geht quadratisch ein.", "Falsch: Es fehlt nur ein Kreis, richtig sind etwa \\(188{,}5 + 28{,}3 = 216{,}8\\,\\text{cm}^2\\)."], korrekt:1, tipp:"Aus welchen Teilen besteht die Oberfläche eines Zylinders?", loesungsweg:"\\(2\\pi r h\\) ist nur die <b>Mantelfläche</b>. Dazu kommen zwei Kreise: $$O = 2\\pi r h + 2\\pi r^2 = 60\\pi + 18\\pi = 78\\pi \\approx 245{,}0\\,\\text{cm}^2$$ \\(\\pi r^2 h\\) wäre das Volumen; mit nur einem Kreis (\\(69\\pi\\)) fehlt der Deckel." },
      { id:26, level:5, typ:"numerisch", frage:"Ein zylindrisches Glas mit \\(6\\,\\text{cm}\\) Innendurchmesser ist \\(8\\,\\text{cm}\\) hoch mit Wasser gefüllt. Ein Stein wird hineingelegt und versinkt ganz; das Wasser steigt auf \\(10{,}5\\,\\text{cm}\\). Welches Volumen hat der Stein in cm³ (\\(\\pi = 3{,}14\\))?", loesung:70.65, toleranz:0.2, tipp:"Der Stein verdrängt genau so viel Wasser, wie er Volumen hat.", loesungsweg:"Der Wasserstand steigt um \\(10{,}5 - 8 = 2{,}5\\,\\text{cm}\\). Das verdrängte Wasser ist ein Zylinder mit \\(r = 3\\,\\text{cm}\\) und dieser Höhe: $$V = 3{,}14 \\cdot 3^2 \\cdot 2{,}5 = 70{,}65\\,\\text{cm}^3$$ Die Füllhöhe \\(8\\,\\text{cm}\\) selbst spielt keine Rolle — nur der Anstieg." },
      { id:27, level:5, typ:"numerisch", frage:"Ein Zylinder ist genau so hoch wie sein Durchmesser und hat die Mantelfläche \\(200{,}96\\,\\text{cm}^2\\). Wie groß ist sein Volumen in cm³ (\\(\\pi = 3{,}14\\))?", loesung:401.92, toleranz:1, tipp:"Höhe durch den Radius ausdrücken — dann steckt im Mantel nur noch eine Unbekannte.", loesungsweg:"Mit \\(h = 2r\\) wird der Mantel $$M = 2\\pi r \\cdot 2r = 4\\pi r^2 = 200{,}96 \\implies r^2 = \\frac{200{,}96}{12{,}56} = 16 \\implies r = 4\\,\\text{cm}$$ Also \\(h = 8\\,\\text{cm}\\) und $$V = 3{,}14 \\cdot 16 \\cdot 8 = 401{,}92\\,\\text{cm}^3$$" },
      { id:28, level:5, typ:"mc", frage:"Nele berechnet die Oberfläche eines Quaders mit den Kanten \\(2\\,\\text{cm}\\), \\(3\\,\\text{cm}\\) und \\(4\\,\\text{cm}\\): \\(O = 2 \\cdot 3 \\cdot 4 \\cdot 2 = 48\\,\\text{cm}^2\\). Was ist dazu zu sagen?", optionen: ["Die Rechnung ist richtig — das Volumen mal zwei ergibt die Oberfläche.", "Falsch: Es gibt drei verschiedene Rechteckpaare, richtig sind \\(2(6 + 8 + 12) = 52\\,\\text{cm}^2\\).", "Falsch: Die Oberfläche ist \\(2 \\cdot 3 \\cdot 4 = 24\\,\\text{cm}^2\\), das Produkt der drei Kanten.", "Falsch: Die Oberfläche ist \\(6 \\cdot 2 \\cdot 3 = 36\\,\\text{cm}^2\\), sechs Flächen mal Grundfläche."], korrekt:1, tipp:"Welche drei Rechtecke kommen an einem Quader jeweils zweimal vor?", loesungsweg:"Ein Quader hat drei Paare verschieden großer Rechtecke: \\(2 \\cdot 3\\), \\(2 \\cdot 4\\) und \\(3 \\cdot 4\\): $$O = 2(6 + 8 + 12) = 2 \\cdot 26 = 52\\,\\text{cm}^2$$ Nele hat das Volumen (\\(24\\)) verdoppelt — das ergibt keine Fläche. \\(6 \\cdot 2 \\cdot 3\\) würde nur für einen Würfel-ähnlichen Fall mit lauter gleichen Flächen passen." },
      { id:29, level:5, typ:"numerisch", frage:"Aus einem quaderförmigen Wachsblock \\(30\\,\\text{cm} \\times 20\\,\\text{cm} \\times 15\\,\\text{cm}\\) werden zylindrische Kerzen mit \\(5\\,\\text{cm}\\) Durchmesser und \\(20\\,\\text{cm}\\) Höhe gegossen. Wie viele <b>vollständige</b> Kerzen ergibt das (\\(\\pi = 3{,}14\\))?", loesung:22, toleranz:0, tipp:"Beide Volumina berechnen und teilen — die angefangene Kerze zählt nicht.", loesungsweg:"Wachs: \\(30 \\cdot 20 \\cdot 15 = 9000\\,\\text{cm}^3\\). Eine Kerze (\\(r = 2{,}5\\)): $$V = 3{,}14 \\cdot 2{,}5^2 \\cdot 20 = 392{,}5\\,\\text{cm}^3$$ $$\\frac{9000}{392{,}5} \\approx 22{,}9$$ Also \\(22\\) vollständige Kerzen." },
      { id:30, level:5, typ:"numerisch", frage:"Ein Quader mit der Grundfläche \\(5\\,\\text{cm} \\times 8\\,\\text{cm}\\) hat das gleiche Volumen wie ein Würfel mit der Kante \\(10\\,\\text{cm}\\). Wie hoch ist der Quader in cm?", loesung:25, toleranz:0, tipp:"Erst das Würfelvolumen, dann durch die Grundfläche des Quaders teilen.", loesungsweg:"Würfel: \\(10^3 = 1000\\,\\text{cm}^3\\). Der Quader mit der Grundfläche \\(40\\,\\text{cm}^2\\) braucht dafür die Höhe $$h = \\frac{1000}{40} = 25\\,\\text{cm}$$" },
      { id:31, level:6, typ:"mc", frage:"Behauptung: „Halbiert man den Radius eines Zylinders und verdoppelt dafür die Höhe, bleibt das Volumen gleich.\" Stimmt das?", optionen: ["Ja — \\(r \\cdot h\\) bleibt gleich, halber Radius und doppelte Höhe heben sich auf.", "Nein — das Volumen halbiert sich, weil der Radius quadratisch eingeht.", "Nein — das Volumen verdoppelt sich, weil die Höhe stärker zählt als der Radius.", "Das stimmt nur, wenn \\(r = h\\) ist, dann sind beide Änderungen gleich groß."], korrekt:1, tipp:"Setze \\(\\tfrac r2\\) und \\(2h\\) in \\(\\pi r^2 h\\) ein.", loesungsweg:"$$V_{\\text{neu}} = \\pi \\left(\\tfrac r2\\right)^2 \\cdot 2h = \\pi \\cdot \\tfrac{r^2}{4} \\cdot 2h = \\tfrac12 \\pi r^2 h$$ Das Volumen <b>halbiert</b> sich: Der halbe Radius bringt den Faktor \\(\\tfrac14\\), die doppelte Höhe nur den Faktor \\(2\\). Gleich bliebe das Volumen bei halbem Radius und <b>vierfacher</b> Höhe." },
      { id:32, level:6, typ:"numerisch", frage:"Ein Zylinder hat den Radius \\(5\\,\\text{cm}\\). Wie hoch muss er sein, damit seine Mantelfläche genau so groß ist wie Boden und Deckel zusammen?", loesung:5, toleranz:0.01, tipp:"Mantel und die beiden Kreise gleichsetzen — \\(\\pi\\) und \\(r\\) kürzen sich.", loesungsweg:"$$2\\pi r h = 2\\pi r^2 \\implies h = r$$ Also \\(h = 5\\,\\text{cm}\\). Das gilt für jeden Radius: Genau dann, wenn der Zylinder so hoch ist wie sein Radius, sind Mantel und Kreisflächen gleich groß." },
      { id:33, level:6, typ:"numerisch", frage:"Ein Blatt Papier \\(20\\,\\text{cm} \\times 30\\,\\text{cm}\\) wird zu einem Zylindermantel gerollt — entweder um die kurze oder um die lange Seite. Um wie viel cm³ fasst der größere der beiden Zylinder mehr als der kleinere (\\(\\pi = 3{,}14\\), auf ganze cm³)?", loesung:478, toleranz:5, tipp:"Die gerollte Seite wird zum Kreisumfang, die andere zur Höhe.", loesungsweg:"Fall 1 — Umfang \\(30\\), Höhe \\(20\\): \\(r = \\frac{30}{6{,}28} \\approx 4{,}78\\), $$V_1 = 3{,}14 \\cdot 4{,}78^2 \\cdot 20 \\approx 1433\\,\\text{cm}^3$$ Fall 2 — Umfang \\(20\\), Höhe \\(30\\): \\(r = \\frac{20}{6{,}28} \\approx 3{,}18\\), $$V_2 = 3{,}14 \\cdot 3{,}18^2 \\cdot 30 \\approx 955\\,\\text{cm}^3$$ Differenz \\(\\approx 478\\,\\text{cm}^3\\). Der breite, niedrige Zylinder fasst mehr, weil der Radius quadratisch eingeht." },
      { id:34, level:6, typ:"mc", frage:"Ein Würfel mit der Kante \\(6\\,\\text{cm}\\) hat zahlenmäßig gleich große Oberfläche (\\(216\\,\\text{cm}^2\\)) und gleich großes Volumen (\\(216\\,\\text{cm}^3\\)). Behauptung: „Das gilt für jeden Würfel.\" Stimmt das?", optionen:["Ja — Oberfläche und Volumen hängen beide nur von \\(a\\) ab.","Nein — nur für \\(a = 6\\), denn \\(6a^2 = a^3\\) ist gleichbedeutend mit \\(a = 6\\).","Nein — es gilt für keinen Würfel, \\(a = 6\\) ist ein Rechenzufall.","Ja, für alle \\(a > 6\\)."], korrekt:1, tipp:"Setze \\(6a^2 = a^3\\) und teile durch \\(a^2\\).", loesungsweg:"Gleichsetzen: $$6a^2 = a^3 \\implies 6 = a \\quad (a \\neq 0)$$ Nur bei \\(a = 6\\) stimmen die Zahlenwerte überein. Für \\(a < 6\\) ist die Oberfläche zahlenmäßig größer (z. B. \\(a = 2\\): \\(24 > 8\\)), für \\(a > 6\\) das Volumen (\\(a = 10\\): \\(600 < 1000\\)), weil \\(a^3\\) schneller wächst als \\(6a^2\\)." },
      { id:35, level:6, typ:"numerisch", frage:"Ein Dreiecksprisma ist \\(10\\,\\text{cm}\\) lang und hat das Volumen \\(240\\,\\text{cm}^3\\). Sein Querschnitt ist ein rechtwinkliges Dreieck, dessen eine Kathete \\(6\\,\\text{cm}\\) lang ist. Wie lang ist die Hypotenuse des Querschnitts in cm?", loesung:10, toleranz:0.01, tipp:"Volumen → Grundfläche → zweite Kathete → Hypotenuse.", loesungsweg:"Grundfläche: \\(G = \\frac{240}{10} = 24\\,\\text{cm}^2\\). Für das rechtwinklige Dreieck gilt \\(\\tfrac12 \\cdot 6 \\cdot b = 24\\), also \\(b = 8\\,\\text{cm}\\). Hypotenuse: $$c = \\sqrt{6^2 + 8^2} = \\sqrt{100} = 10\\,\\text{cm}$$" },
      { id:36, level:6, typ:"numerisch", frage:"Ein Würfel mit der Kante \\(12\\,\\text{cm}\\) wird in Würfel mit der Kante \\(3\\,\\text{cm}\\) zersägt. Um wie viel Prozent ist die Gesamtoberfläche aller kleinen Würfel größer als die Oberfläche des großen Würfels?", loesung:300, toleranz:0, tipp:"Wie viele kleine Würfel entstehen, und welche Oberfläche hat jeder?", loesungsweg:"Großer Würfel: \\(O = 6 \\cdot 12^2 = 864\\,\\text{cm}^2\\). Es entstehen \\(4 \\cdot 4 \\cdot 4 = 64\\) kleine Würfel mit je \\(6 \\cdot 3^2 = 54\\,\\text{cm}^2\\): $$64 \\cdot 54 = 3456\\,\\text{cm}^2 = 4 \\cdot 864$$ Die Oberfläche vervierfacht sich, ist also um \\(300\\,\\%\\) größer. Das Volumen bleibt beim Zersägen gleich — deshalb kühlt zerkleinertes Material schneller ab." }];
    </script>

</body>
