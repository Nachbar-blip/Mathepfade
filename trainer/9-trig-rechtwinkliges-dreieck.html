<!DOCTYPE html>

<head>

    <title>Trigonometrie am rechtwinkligen Dreieck - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-trig-rechtwinkliges-dreieck';
    const THEMA_CONFIG = { name: 'Trigonometrie am rechtwinkligen Dreieck', bereich: 'geometrie' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Wie lautet die Definition von \\(\\sin\\alpha\\) im rechtwinkligen Dreieck?", optionen:["Ankathete/Hypotenuse","Gegenkathete/Hypotenuse","Gegenkathete/Ankathete","Hypotenuse/Gegenkathete"], korrekt:1, tipp:"Merkspruch: GAGA-HH.", loesungsweg:"$$\\sin\\alpha = \\frac{\\text{Gegenkathete}}{\\text{Hypotenuse}}$$ Die Gegenkathete liegt dem Winkel \\(\\alpha\\) gegenüber, die Hypotenuse dem rechten Winkel. Weil die Hypotenuse stets die längste Seite ist, liegt \\(\\sin\\alpha\\) immer zwischen \\(0\\) und \\(1\\)." },
      { id:2, level:1, typ:"mc", frage:"Wie ist \\(\\cos\\alpha\\) definiert?", optionen:["Gegenkathete/Hypotenuse","Ankathete/Hypotenuse","Gegenkathete/Ankathete","1"], korrekt:1, tipp:"Ankathete oben.", loesungsweg:"$$\\cos\\alpha = \\frac{\\text{Ankathete}}{\\text{Hypotenuse}}$$ Die Ankathete <b>anliegt</b> dem Winkel. Welche Kathete An- und welche Gegenkathete ist, hängt davon ab, von welchem der beiden spitzen Winkel aus man schaut." },
      { id:3, level:1, typ:"mc", frage:"Wie ist \\(\\tan\\alpha\\) definiert?", optionen:["Gegenkathete/Ankathete","Ankathete/Gegenkathete","Sin/Hypotenuse","Cos·Sin"], korrekt:0, tipp:"GAGA: Gegen/An.", loesungsweg:"$$\\tan\\alpha=\\frac{\\text{Gegenkathete}}{\\text{Ankathete}}=\\frac{\\sin\\alpha}{\\cos\\alpha}$$" },
      { id:4, level:1, typ:"numerisch", frage:"\\(\\sin 30°=?\\) (als Dezimalzahl)", loesung:0.5, toleranz:0.01, tipp:"Standardwert.", loesungsweg:"Im halbierten gleichseitigen Dreieck liegt der \\(30°\\)-Winkel der halben Seite gegenüber: $$\\sin 30° = \\frac{a/2}{a} = \\frac{1}{2} = 0{,}5$$ Das ist der einzige Standardwinkel mit einem so glatten Sinuswert." },
      { id:5, level:1, typ:"numerisch", frage:"\\(\\cos 60°=?\\) (als Dezimalzahl)", loesung:0.5, toleranz:0.01, tipp:"Standardwert.", loesungsweg:"Im selben halbierten gleichseitigen Dreieck ist die Ankathete zum \\(60°\\)-Winkel gerade die halbe Seite: $$\\cos 60° = 0{,}5$$ Allgemein gilt \\(\\cos\\alpha = \\sin(90°-\\alpha)\\) — deshalb stimmen \\(\\sin 30°\\) und \\(\\cos 60°\\) überein." },
      { id:6, level:1, typ:"numerisch", frage:"\\(\\tan 45°=?\\)", loesung:1, toleranz:0.01, tipp:"Gleichschenklig rechtwinklig.", loesungsweg:"Bei \\(45°\\) ist das Dreieck gleichschenklig, Gegen- und Ankathete sind also gleich lang: $$\\tan 45° = \\frac{a}{a} = 1$$" },
      { id:7, level:2, typ:"numerisch", frage:"\\(\\sin\\alpha=0{,}6\\) und Hypotenuse \\(=10\\). Gegenkathete?", loesung:6, toleranz:0.01, tipp:"\\(\\text{Geg}=\\sin\\alpha\\cdot\\text{Hyp}\\).", loesungsweg:"$$g=0{,}6\\cdot 10=6$$" },
      { id:8, level:2, typ:"numerisch", frage:"\\(\\cos\\alpha=0{,}8\\), Hyp \\(=15\\). Ankathete?", loesung:12, toleranz:0.01, tipp:"\\(a=\\cos\\alpha\\cdot\\text{Hyp}\\).", loesungsweg:"$$a=0{,}8\\cdot 15=12$$" },
      { id:9, level:2, typ:"numerisch", frage:"Rechtwinkliges Dreieck, \\(\\alpha=40°\\), Hyp \\(=10\\). Gegenkathete (Runde 2 Dez).", loesung:6.43, toleranz:0.05, tipp:"\\(10\\sin 40°\\).", loesungsweg:"$$\\sin\\alpha = \\frac{g}{c} \\;\\Rightarrow\\; g = c \\cdot \\sin\\alpha = 10 \\cdot \\sin 40° \\approx 6{,}43$$" },
      { id:10, level:2, typ:"numerisch", frage:"\\(\\alpha=35°\\), Hyp \\(=20\\). Ankathete (2 Dez).", loesung:16.38, toleranz:0.05, tipp:"\\(20\\cos 35°\\).", loesungsweg:"$$\\cos\\alpha = \\frac{a}{c} \\;\\Rightarrow\\; a = 20 \\cdot \\cos 35° \\approx 16{,}38$$" },
      { id:11, level:2, typ:"numerisch", frage:"\\(\\alpha=50°\\), Ankathete \\(=8\\). Gegenkathete (2 Dez).", loesung:9.53, toleranz:0.05, tipp:"\\(g=a\\tan\\alpha\\).", loesungsweg:"Hier sind beide Katheten im Spiel, also der Tangens: $$\\tan\\alpha = \\frac{g}{a} \\;\\Rightarrow\\; g = 8 \\cdot \\tan 50° \\approx 9{,}53$$" },
      { id:12, level:2, typ:"mc", frage:"Welche Beziehung gilt stets?", optionen:["\\(\\sin^2\\alpha-\\cos^2\\alpha=1\\)","\\(\\sin^2\\alpha+\\cos^2\\alpha=1\\)","\\(\\sin\\alpha+\\cos\\alpha=1\\)","\\(\\tan\\alpha=\\cos/\\sin\\)"], korrekt:1, tipp:"Trigonometrischer Pythagoras.", loesungsweg:"Nach dem Satz des Pythagoras gilt \\(g^2 + a^2 = c^2\\). Division durch \\(c^2\\) liefert $$\\left(\\frac{g}{c}\\right)^2 + \\left(\\frac{a}{c}\\right)^2 = 1 \\;\\Rightarrow\\; \\sin^2\\alpha + \\cos^2\\alpha = 1$$ Diese Beziehung gilt für <b>jeden</b> Winkel, nicht nur für spitze." },
      { id:13, level:3, typ:"numerisch", frage:"Eine Rampe ist \\(12\\,\\text{m}\\) lang, Neigungswinkel \\(15°\\). Höhe (m, 2 Dez)?", loesung:3.11, toleranz:0.05, tipp:"\\(h=12\\sin 15°\\).", loesungsweg:"Die Rampe ist die Hypotenuse, die Höhe die Gegenkathete zum Neigungswinkel: $$h = 12 \\cdot \\sin 15° \\approx 3{,}11\\,\\text{m}$$" },
      { id:14, level:3, typ:"numerisch", frage:"Leiter (\\(6\\,\\text{m}\\)) lehnt mit \\(70°\\) an Wand. Höhe (2 Dez).", loesung:5.64, toleranz:0.05, tipp:"\\(6\\sin 70°\\).", loesungsweg:"Die Leiter ist die Hypotenuse, die erreichte Wandhöhe die Gegenkathete: $$h = 6 \\cdot \\sin 70° \\approx 5{,}64\\,\\text{m}$$" },
      { id:15, level:3, typ:"numerisch", frage:"\\(\\tan\\alpha=0{,}75\\). \\(\\alpha\\) in Grad (1 Dez)?", loesung:36.9, toleranz:0.2, tipp:"\\(\\arctan 0{,}75\\).", loesungsweg:"Der Tangens ist bekannt, gesucht ist der Winkel — dafür die Umkehrfunktion: $$\\alpha = \\arctan 0{,}75 \\approx 36{,}9°$$" },
      { id:16, level:3, typ:"numerisch", frage:"\\(\\sin\\alpha=0{,}5\\). \\(\\alpha\\) (Grad)?", loesung:30, toleranz:0.5, tipp:"Standardwinkel.", loesungsweg:"$$\\alpha = \\arcsin 0{,}5 = 30°$$ Im rechtwinkligen Dreieck ist das die einzige Lösung, weil dort nur spitze Winkel vorkommen." },
      { id:17, level:3, typ:"numerisch", frage:"Geg \\(=9\\), An \\(=12\\). Berechne \\(\\alpha\\) (1 Dez).", loesung:36.9, toleranz:0.2, tipp:"\\(\\tan\\alpha=9/12\\).", loesungsweg:"Gegeben sind beide Katheten, also führt der Tangens zum Ziel: $$\\tan\\alpha = \\frac{9}{12} = 0{,}75 \\;\\Rightarrow\\; \\alpha \\approx 36{,}9°$$" },
      { id:18, level:3, typ:"numerisch", frage:"Hypotenuse \\(=25\\), Gegenkathete \\(=7\\). \\(\\alpha\\) (1 Dez).", loesung:16.3, toleranz:0.2, tipp:"\\(\\sin\\alpha=7/25\\).", loesungsweg:"Gegenkathete und Hypotenuse — das ist der Sinus: $$\\sin\\alpha = \\frac{7}{25} = 0{,}28 \\;\\Rightarrow\\; \\alpha \\approx 16{,}3°$$" },
      { id:19, level:4, typ:"numerisch", frage:"Ein Turm wirft Schatten \\(18\\,\\text{m}\\), Sonnenhöhe \\(35°\\). Turmhöhe (2 Dez).", loesung:12.60, toleranz:0.1, tipp:"\\(h=18\\tan 35°\\).", loesungsweg:"Schatten und Turmhöhe sind die beiden Katheten, der Sonnenstand der Winkel dazwischen: $$h = 18 \\cdot \\tan 35° \\approx 12{,}60\\,\\text{m}$$" },
      { id:20, level:4, typ:"numerisch", frage:"Ein Flugzeug steigt mit \\(8°\\) auf. Nach \\(2000\\,\\text{m}\\) Flugstrecke: Höhengewinn (m, 2 Dez).", loesung:278.35, toleranz:1.0, tipp:"\\(h=2000\\sin 8°\\).", loesungsweg:"Die Flugstrecke ist die Hypotenuse, der Höhengewinn die Gegenkathete: $$h = 2000 \\cdot \\sin 8° \\approx 278{,}35\\,\\text{m}$$" },
      { id:21, level:4, typ:"numerisch", frage:"Dachfläche: Dachbreite \\(6\\,\\text{m}\\), Neigung \\(40°\\). Sparrenlänge (m, 2 Dez)?", loesung:3.92, toleranz:0.1, tipp:"Halbe Dachbreite \\(=3\\); \\(s=3/\\cos 40°\\).", loesungsweg:"Der Sparren reicht von der Traufe zum First, die halbe Dachbreite ist seine Ankathete: $$s = \\frac{3}{\\cos 40°} \\approx 3{,}92\\,\\text{m}$$ Mit der <b>ganzen</b> Dachbreite zu rechnen wäre hier der typische Fehler." },
      { id:22, level:4, typ:"numerisch", frage:"Rechteck-Diagonale bildet \\(30°\\) mit langer Seite \\(a=10\\). Kurze Seite (2 Dez)?", loesung:5.77, toleranz:0.05, tipp:"\\(b=a\\tan 30°\\).", loesungsweg:"Die lange Seite ist die Ankathete zum \\(30°\\)-Winkel, die kurze die Gegenkathete: $$b = 10 \\cdot \\tan 30° \\approx 5{,}77$$" },
      { id:23, level:4, typ:"numerisch", frage:"\\(\\sin^2 30°+\\cos^2 30°=?\\)", loesung:1, toleranz:0.01, tipp:"Identität.", loesungsweg:"Nach dem trigonometrischen Pythagoras ist die Summe für jeden Winkel gleich \\(1\\). Nachrechnen bestätigt es: $$0{,}5^2 + \\left(\\tfrac{\\sqrt3}{2}\\right)^2 = 0{,}25 + 0{,}75 = 1$$" },
      { id:24, level:4, typ:"mc", frage:"\\(\\sin(180°-\\alpha)=?\\)", optionen:["\\(-\\sin\\alpha\\)","\\(\\sin\\alpha\\)","\\(\\cos\\alpha\\)","0"], korrekt:1, tipp:"Symmetrie.", loesungsweg:"Am Einheitskreis liegen die Winkel \\(\\alpha\\) und \\(180°-\\alpha\\) spiegelbildlich zur \\(y\\)-Achse. Die \\(y\\)-Koordinate — also der Sinus — bleibt dabei gleich: $$\\sin(180°-\\alpha) = \\sin\\alpha$$ Der Kosinus als \\(x\\)-Koordinate wechselt dagegen das Vorzeichen." },
      { id:25, level:5, typ:"mc", frage:"In einem rechtwinkligen Dreieck ist die Hypotenuse \\(12\\,\\text{cm}\\) lang, der Winkel \\(\\alpha = 35°\\). Gesucht ist die Ankathete von \\(\\alpha\\). Jemand rechnet: \\(b = 12 \\cdot \\sin 35° \\approx 6{,}88\\,\\text{cm}\\). Was ist dazu zu sagen?", optionen:["Falsch, zur Ankathete gehört der Kosinus, richtig sind etwa \\(9{,}83\\,\\text{cm}\\)", "Falsch, die Hypotenuse steht im Nenner, richtig sind etwa \\(20{,}92\\,\\text{cm}\\)", "Richtig, Sinus und Kosinus liefern bei \\(35°\\) dieselbe Ankathete", "Falsch, hier gehört der Tangens hin, richtig sind etwa \\(8{,}40\\,\\text{cm}\\)"], korrekt:0, tipp:"Welche Seite liegt dem Winkel \\(\\alpha\\) an, welche gegenüber? Dann die passende Definition wählen.", loesungsweg:"Die Ankathete liegt am Winkel an; ihr Verhältnis zur Hypotenuse ist der Kosinus: $$\\cos 35° = \\frac{b}{12} \\quad\\Rightarrow\\quad b = 12 \\cdot \\cos 35° \\approx 9{,}83\\,\\text{cm}$$ \\(12 \\cdot \\sin 35°\\) wäre die Gegenkathete." },
      { id:26, level:5, typ:"numerisch", frage:"Von einem Punkt \\(A\\) aus sieht man die Spitze eines Turms unter dem Höhenwinkel \\(28°\\). Geht man \\(40\\,\\text{m}\\) geradeaus auf den Turm zu bis zum Punkt \\(B\\), beträgt der Höhenwinkel \\(42°\\). Beide Punkte liegen auf ebenem Boden in einer Linie mit dem Turmfuß. Wie hoch ist der Turm in m? Runde auf eine Dezimale.", loesung:51.9, toleranz:0.2, tipp:"Bezeichne den Abstand von \\(B\\) zum Turmfuß mit \\(x\\); dann liefern beide Winkel je eine Gleichung für die Höhe.", loesungsweg:"Mit \\(x\\) als Abstand von \\(B\\) zum Turmfuß gilt \\(h = x \\cdot \\tan 42°\\) und \\(h = (x + 40) \\cdot \\tan 28°\\). Gleichsetzen: $$x \\cdot \\tan 42° = (x+40) \\cdot \\tan 28° \\quad\\Rightarrow\\quad x = \\frac{40 \\cdot \\tan 28°}{\\tan 42° - \\tan 28°} \\approx 57{,}7\\,\\text{m}$$ Damit \\(h = 57{,}7 \\cdot \\tan 42° \\approx 51{,}9\\,\\text{m}\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Eine Rampe hat eine Steigung von \\(8\\,\\%\\). Sie ist entlang der Fahrbahn \\(25\\,\\text{m}\\) lang. Welchen Höhenunterschied überwindet sie in m? Runde auf zwei Dezimalen.", loesung:1.99, toleranz:0.02, tipp:"Die Prozentangabe beschreibt ein Seitenverhältnis, aus dem sich zuerst der Steigungswinkel ergibt.", loesungsweg:"\\(8\\,\\%\\) Steigung heißt \\(\\tan\\alpha = 0{,}08\\), also \\(\\alpha \\approx 4{,}57°\\). Die Rampenlänge ist die Hypotenuse: $$h = 25 \\cdot \\sin 4{,}57° \\approx 1{,}99\\,\\text{m}$$ Der Unterschied zu \\(25 \\cdot 0{,}08 = 2\\) ist klein, weil der Winkel klein ist, aber die Rechnung über den Tangens allein wäre nicht exakt." },
      { id:28, level:5, typ:"mc", frage:"In einem rechtwinkligen Dreieck ist die Gegenkathete von \\(\\alpha\\) \\(6\\,\\text{cm}\\) und die Ankathete \\(8\\,\\text{cm}\\) lang. Jemand rechnet: \\(\\tan\\alpha = \\frac{8}{6}\\), also \\(\\alpha \\approx 53{,}1°\\). Was ist dazu zu sagen?", optionen:["Falsch, Gegen- und Ankathete sind vertauscht, richtig sind etwa \\(36{,}9°\\)", "Richtig, beim Tangens spielt die Reihenfolge der Katheten keine Rolle", "Falsch, hier braucht man den Sinus, richtig sind etwa \\(48{,}6°\\)", "Falsch, ein Tangenswert über \\(1\\) ist für keinen Winkel möglich"], korrekt:0, tipp:"Prüfe, welche Kathete beim Tangens im Zähler steht.", loesungsweg:"Der Tangens ist Gegenkathete durch Ankathete: $$\\tan\\alpha = \\frac{6}{8} = 0{,}75 \\quad\\Rightarrow\\quad \\alpha \\approx 36{,}9°$$ Mit \\(\\frac{8}{6}\\) erhält man den anderen spitzen Winkel \\(\\beta \\approx 53{,}1°\\); beide ergänzen sich zu \\(90°\\)." },
      { id:29, level:5, typ:"numerisch", frage:"Ein symmetrisches Satteldach sitzt auf einem \\(10\\,\\text{m}\\) breiten Haus und hat eine Dachneigung von \\(38°\\). Wie lang ist ein Sparren vom First bis zur Außenwand in m? Runde auf zwei Dezimalen.", loesung:6.35, toleranz:0.02, tipp:"Die Symmetrie halbiert die Hausbreite; der Sparren ist Hypotenuse eines rechtwinkligen Dreiecks.", loesungsweg:"Die halbe Hausbreite \\(5\\,\\text{m}\\) ist die Ankathete zum Neigungswinkel, der Sparren die Hypotenuse: $$\\cos 38° = \\frac{5}{s} \\quad\\Rightarrow\\quad s = \\frac{5}{\\cos 38°} \\approx 6{,}35\\,\\text{m}$$" },
      { id:30, level:5, typ:"numerisch", frage:"Ein rechtwinkliges Dreieck hat die Hypotenuse \\(c = 14\\,\\text{cm}\\) und den Winkel \\(\\alpha = 32°\\). Berechne seinen Flächeninhalt in \\(\\text{cm}^2\\). Runde auf zwei Dezimalen.", loesung:44.04, toleranz:0.05, tipp:"Die Fläche eines rechtwinkligen Dreiecks braucht beide Katheten; beide lassen sich aus \\(c\\) und \\(\\alpha\\) gewinnen.", loesungsweg:"Katheten: \\(a = 14 \\cdot \\sin 32° \\approx 7{,}42\\), \\(b = 14 \\cdot \\cos 32° \\approx 11{,}87\\). $$A = \\frac{a \\cdot b}{2} \\approx \\frac{7{,}42 \\cdot 11{,}87}{2} \\approx 44{,}04\\,\\text{cm}^2$$" },
      { id:31, level:6, typ:"mc", frage:"Behauptung: „In jedem rechtwinkligen Dreieck gilt für die beiden spitzen Winkel \\(\\sin\\alpha = \\cos\\beta\\).“ Stimmt das?", optionen:["Ja, denn die Gegenkathete von \\(\\alpha\\) ist die Ankathete von \\(\\beta\\)", "Nein, das gilt nur im Sonderfall \\(\\alpha = \\beta = 45°\\)", "Nein, richtig wäre \\(\\sin\\alpha = \\sin\\beta\\) wegen der gleichen Hypotenuse", "Ja, denn Sinus und Kosinus stimmen für alle Winkel überein"], korrekt:0, tipp:"Zeichne ein rechtwinkliges Dreieck und beschrifte für beide spitzen Winkel Gegen- und Ankathete.", loesungsweg:"Die Seite \\(a\\) liegt \\(\\alpha\\) gegenüber und \\(\\beta\\) an. Also $$\\sin\\alpha = \\frac{a}{c} = \\cos\\beta$$ Da \\(\\alpha + \\beta = 90°\\), ist das dieselbe Aussage wie \\(\\sin\\alpha = \\cos(90° - \\alpha)\\); sie gilt für jedes rechtwinklige Dreieck." },
      { id:32, level:6, typ:"numerisch", frage:"Für welchen spitzen Winkel \\(\\alpha\\) gilt \\(\\tan\\alpha = 3 \\cdot \\sin\\alpha\\)? Gib \\(\\alpha\\) in Grad an, gerundet auf eine Dezimale.", loesung:70.5, toleranz:0.2, tipp:"Schreibe den Tangens als Quotient von Sinus und Kosinus; dann lässt sich die Gleichung nach einer Winkelfunktion auflösen.", loesungsweg:"$$\\frac{\\sin\\alpha}{\\cos\\alpha} = 3\\sin\\alpha \\quad\\Rightarrow\\quad \\frac{1}{\\cos\\alpha} = 3 \\quad\\Rightarrow\\quad \\cos\\alpha = \\frac13$$ (Division durch \\(\\sin\\alpha \\neq 0\\) ist für spitze Winkel erlaubt.) Also \\(\\alpha = \\arccos\\frac13 \\approx 70{,}5°\\)." },
      { id:33, level:6, typ:"numerisch", frage:"Zwei Beobachter stehen \\(120\\,\\text{m}\\) voneinander entfernt auf ebenem Boden. Genau zwischen ihnen, aber nicht in der Mitte, schwebt ein Heißluftballon. Der linke Beobachter sieht ihn unter dem Höhenwinkel \\(35°\\), der rechte unter \\(52°\\). Wie hoch schwebt der Ballon in m? Runde auf eine Dezimale.", loesung:54.3, toleranz:0.2, tipp:"Der Fußpunkt unter dem Ballon teilt die \\(120\\,\\text{m}\\) in zwei Abschnitte, die sich beide durch die Höhe ausdrücken lassen.", loesungsweg:"Mit Höhe \\(h\\) gilt für den linken Abschnitt \\(x_1 = \\frac{h}{\\tan 35°}\\), für den rechten \\(x_2 = \\frac{h}{\\tan 52°}\\). $$\\frac{h}{\\tan 35°} + \\frac{h}{\\tan 52°} = 120 \\quad\\Rightarrow\\quad h = \\frac{120}{\\frac{1}{\\tan 35°} + \\frac{1}{\\tan 52°}} \\approx 54{,}3\\,\\text{m}$$" },
      { id:34, level:6, typ:"numerisch", frage:"Ein gleichschenkliges Dreieck hat zwei Schenkel von je \\(9\\,\\text{cm}\\) Länge; der Winkel zwischen den Schenkeln beträgt \\(40°\\). Wie lang ist die Basis in cm? Runde auf zwei Dezimalen.", loesung:6.16, toleranz:0.02, tipp:"Die Höhe auf die Basis zerlegt das Dreieck in zwei kongruente rechtwinklige Dreiecke.", loesungsweg:"Die Höhe halbiert den Winkel \\(40°\\) und die Basis. In einem der rechtwinkligen Teildreiecke ist die halbe Basis die Gegenkathete zu \\(20°\\): $$\\frac{c}{2} = 9 \\cdot \\sin 20° \\approx 3{,}08 \\quad\\Rightarrow\\quad c \\approx 6{,}16\\,\\text{cm}$$" },
      { id:35, level:6, typ:"mc", frage:"Jemand behauptet, in einem bestimmten rechtwinkligen Dreieck gelte \\(\\sin\\alpha = 1{,}2\\). Was ist dazu zu sagen?", optionen:["Unmöglich, die Gegenkathete ist immer kürzer als die Hypotenuse", "Möglich, sobald \\(\\alpha\\) größer als \\(45°\\) ist", "Möglich, wenn die Gegenkathete länger als die Ankathete ist", "Unmöglich für den Sinus, aber \\(\\cos\\alpha = 1{,}2\\) kann vorkommen"], korrekt:0, tipp:"Der Sinus ist ein Verhältnis zweier Seiten; welche davon ist die längste im Dreieck?", loesungsweg:"\\(\\sin\\alpha = \\frac{\\text{Gegenkathete}}{\\text{Hypotenuse}}\\). Die Hypotenuse ist die längste Seite, daher ist der Bruch stets kleiner als \\(1\\): $$0 < \\sin\\alpha < 1 \\quad\\text{für } 0° < \\alpha < 90°$$ Dasselbe gilt für den Kosinus. Nur der Tangens (Kathete durch Kathete) kann größer als \\(1\\) werden." },
      { id:36, level:6, typ:"numerisch", frage:"Ein Drachen hängt an einer straff gespannten, geraden \\(50\\,\\text{m}\\) langen Schnur, die mit der Horizontalen einen Winkel von \\(55°\\) bildet. Die Hand, die die Schnur hält, ist \\(1{,}2\\,\\text{m}\\) über dem Boden. Wie hoch über dem Boden fliegt der Drachen in m? Runde auf eine Dezimale.", loesung:42.2, toleranz:0.1, tipp:"Die Schnur ist die Hypotenuse; die gesuchte Höhe setzt sich aus zwei Teilen zusammen.", loesungsweg:"Höhe des Drachens über der Hand: $$50 \\cdot \\sin 55° \\approx 40{,}96\\,\\text{m}$$ Dazu die Handhöhe: \\(40{,}96 + 1{,}2 \\approx 42{,}2\\,\\text{m}\\)." }];
    </script>
