<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binomialverteilung - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-stoch-binomialverteilung';
    const THEMA_CONFIG = { name: 'Binomialverteilung', bereich: 'stochastik' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Bernoulli-Kette erkennen ==========
      { id:1, level:1, typ:"mc", frage:"Welches Experiment ist eine Bernoulli-Kette?", optionen:["Ziehen ohne Zurücklegen aus einer Urne","10-maliges Würfeln mit Erfolg = 6","Lottoziehung 6 aus 49","Temperatur an 7 Tagen"], korrekt:1, tipp:"Gleiche Erfolgswahrscheinlichkeit in jedem Versuch, Unabhängigkeit.", loesungsweg:"Bei 10-maligem Würfeln ist \\(p = \\tfrac{1}{6}\\) konstant und die Würfe sind unabhängig." },
      { id:2, level:1, typ:"mc", frage:"Ein Würfel wird 20-mal geworfen. Erfolg: Augenzahl \\(\\ge 5\\). Wie groß ist \\(p\\)?", optionen:["\\(\\tfrac{1}{6}\\)","\\(\\tfrac{1}{3}\\)","\\(\\tfrac{1}{2}\\)","\\(\\tfrac{2}{3}\\)"], korrekt:1, tipp:"Günstig: 5 oder 6.", loesungsweg:"\\(p = \\tfrac{2}{6} = \\tfrac{1}{3}\\)." },
      { id:3, level:1, typ:"numerisch", frage:"Wie viele Parameter hat eine Binomialverteilung? (Anzahl angeben)", loesung:2, toleranz:0, tipp:"\\(n\\) und \\(p\\).", loesungsweg:"Zwei Parameter: \\(n\\) (Länge der Kette) und \\(p\\) (Erfolgswahrscheinlichkeit)." },
      { id:4, level:1, typ:"mc", frage:"Was bedeutet \\(B(n;p;k)\\)?", optionen:["Wahrscheinlichkeit genau \\(k\\) Erfolge","Wahrscheinlichkeit höchstens \\(k\\) Erfolge","Erwartungswert","Standardabweichung"], korrekt:0, tipp:"Einzelwahrscheinlichkeit.", loesungsweg:"\\(B(n;p;k) = \\binom{n}{k} p^k (1-p)^{n-k}\\) ist die Wahrscheinlichkeit für genau \\(k\\) Erfolge." },
      { id:5, level:1, typ:"numerisch", frage:"Berechne \\(\\binom{5}{2}\\).", loesung:10, toleranz:0, tipp:"\\(\\binom{n}{k} = \\tfrac{n!}{k!(n-k)!}\\)", loesungsweg:"$$\\binom{5}{2} = \\tfrac{5!}{2!\\cdot 3!} = \\tfrac{120}{2\\cdot 6} = 10$$" },
      { id:6, level:1, typ:"mc", frage:"Welche Formel ist die Binomialverteilung?", optionen:["\\(p^k\\)","\\(\\binom{n}{k}p^k(1-p)^{n-k}\\)","\\(n\\cdot p\\)","\\(\\sqrt{np(1-p)}\\)"], korrekt:1, tipp:"Binomialkoeffizient mal Potenzen.", loesungsweg:"\\(P(X=k) = \\binom{n}{k} p^k (1-p)^{n-k}\\)." },
      // ========== LEVEL 2 — Einzelwahrscheinlichkeiten ==========
      { id:7, level:2, typ:"numerisch", frage:"\\(n=10, p=0{,}3\\). Berechne \\(P(X=3)\\) (auf 4 Nachkommastellen).", loesung:0.2668, toleranz:0.005, tipp:"\\(\\binom{10}{3}\\cdot 0{,}3^3\\cdot 0{,}7^7\\).", loesungsweg:"Bernoulli-Formel mit \\(n = 10\\), \\(k = 3\\), \\(p = 0{,}3\\): $$P(X=3) = \\binom{10}{3} \\cdot 0{,}3^3 \\cdot 0{,}7^7 = 120 \\cdot 0{,}027 \\cdot 0{,}08235 \\approx 0{,}2668$$ Der Binomialkoeffizient zählt die Pfade, die Potenzen liefern die Wahrscheinlichkeit eines einzelnen Pfades. Die Exponenten müssen zusammen \\(n = 10\\) ergeben." },
      { id:8, level:2, typ:"numerisch", frage:"\\(n=6, p=0{,}5\\). Berechne \\(P(X=3)\\).", loesung:0.3125, toleranz:0.005, tipp:"\\(\\binom{6}{3} = 20\\).", loesungsweg:"$$20 \\cdot 0{,}5^6 = 20 \\cdot \\tfrac{1}{64} = 0{,}3125$$" },
      { id:9, level:2, typ:"numerisch", frage:"\\(n=4, p=\\tfrac{1}{6}\\). Berechne \\(P(X=0)\\) auf 4 Nachkommastellen.", loesung:0.4823, toleranz:0.005, tipp:"\\(\\left(\\tfrac{5}{6}\\right)^4\\).", loesungsweg:"Kein Treffer bedeutet viermal Misserfolg, also nur ein Pfad (\\(\\binom40 = 1\\)): $$P(X=0) = \\left(\\frac56\\right)^4 = \\frac{625}{1296} \\approx 0{,}4823$$ In fast der Hälfte der Fälle fällt bei vier Würfen also keine Sechs." },
      { id:10, level:2, typ:"mc", frage:"\\(n=8, p=0{,}25\\). Welcher Wert ist der Erwartungswert \\(\\mu\\)?", optionen:["\\(2\\)","\\(1{,}5\\)","\\(4\\)","\\(0{,}25\\)"], korrekt:0, tipp:"\\(\\mu = n\\cdot p\\).", loesungsweg:"\\(\\mu = 8 \\cdot 0{,}25 = 2\\)." },
      { id:11, level:2, typ:"numerisch", frage:"\\(n=12, p=0{,}5\\). Berechne \\(P(X=6)\\) auf 4 Nachkommastellen.", loesung:0.2256, toleranz:0.005, tipp:"\\(\\binom{12}{6}=924\\).", loesungsweg:"Mit \\(p = 0{,}5\\) hat jeder Pfad dieselbe Wahrscheinlichkeit \\(0{,}5^{12}\\): $$P(X=6) = \\binom{12}{6} \\cdot 0{,}5^{12} = \\frac{924}{4096} \\approx 0{,}2256$$ Obwohl \\(6\\) der wahrscheinlichste Wert ist, tritt er nur in gut einem Fünftel der Fälle ein — die Verteilung streut breit." },
      { id:12, level:2, typ:"numerisch", frage:"\\(n=5, p=0{,}4\\). Berechne \\(P(X=2)\\) auf 4 Nachkommastellen.", loesung:0.3456, toleranz:0.005, tipp:"\\(\\binom{5}{2}=10\\).", loesungsweg:"$$10\\cdot 0{,}4^2\\cdot 0{,}6^3 = 10\\cdot 0{,}16\\cdot 0{,}216 = 0{,}3456$$" },
      // ========== LEVEL 3 — Kumulierte Wahrscheinlichkeiten ==========
      { id:13, level:3, typ:"mc", frage:"Wie berechnet man \\(P(X \\le k)\\)?", optionen:["\\(P(X=k)\\)","Summe \\(P(X=0)+\\dots+P(X=k)\\)","\\(1-P(X=k)\\)","\\(P(X \\ge k)\\)"], korrekt:1, tipp:"Kumulativ = aufsummieren.", loesungsweg:"\\(P(X\\le k) = \\sum_{i=0}^{k} P(X=i)\\)." },
      { id:14, level:3, typ:"mc", frage:"Welche Umformung ist korrekt?", optionen:["\\(P(X\\ge k) = 1 - P(X\\le k-1)\\)","\\(P(X\\ge k) = 1 - P(X\\le k)\\)","\\(P(X\\ge k) = P(X\\le k)\\)","\\(P(X\\ge k) = P(X=k)\\)"], korrekt:0, tipp:"Gegenereignis: höchstens \\(k-1\\).", loesungsweg:"Das Gegenereignis zu „mindestens \\(k\\)\" ist „höchstens \\(k-1\\)\": $$P(X \\ge k) = 1 - P(X \\le k-1)$$ Die \\(-1\\) ist entscheidend, weil \\(X\\) nur ganze Zahlen annimmt und der Wert \\(k\\) selbst zum Ereignis gehört. Mit \\(1-P(X \\le k)\\) rechnete man \\(P(X=k)\\) fälschlich heraus." },
      { id:15, level:3, typ:"numerisch", frage:"\\(n=10, p=0{,}5\\). Berechne \\(P(X\\le 3)\\) auf 4 Nachkommastellen.", loesung:0.1719, toleranz:0.008, tipp:"Summe \\(P(X=0)+P(X=1)+P(X=2)+P(X=3)\\).", loesungsweg:"$$P(X\\le 3) = \\tfrac{1+10+45+120}{1024} = \\tfrac{176}{1024} \\approx 0{,}1719$$" },
      { id:16, level:3, typ:"numerisch", frage:"\\(n=20, p=0{,}3\\). Berechne \\(P(X\\ge 1)\\) auf 4 Nachkommastellen.", loesung:0.9992, toleranz:0.005, tipp:"Gegenereignis: \\(X=0\\).", loesungsweg:"Gegenereignis ist „kein Treffer\": $$P(X \\ge 1) = 1 - P(X=0) = 1 - 0{,}7^{20} \\approx 1 - 0{,}0008 = 0{,}9992$$ Bei \\(20\\) Versuchen ist mindestens ein Treffer also nahezu sicher, obwohl die Einzelwahrscheinlichkeit nur \\(30\\,\\%\\) beträgt." },
      { id:17, level:3, typ:"mc", frage:"Wie berechnet man \\(P(a \\le X \\le b)\\)?", optionen:["\\(P(X\\le b) - P(X\\le a)\\)","\\(P(X\\le b) - P(X\\le a-1)\\)","\\(P(X\\le a) - P(X\\le b)\\)","\\(P(X=b) - P(X=a)\\)"], korrekt:1, tipp:"Obergrenze minus (Untergrenze \\(-1\\)).", loesungsweg:"Von allen Werten bis \\(b\\) sind die unterhalb von \\(a\\) abzuziehen — und das sind die bis \\(a-1\\): $$P(a \\le X \\le b) = P(X \\le b) - P(X \\le a-1)$$ Mit \\(P(X \\le a)\\) im Abzug fiele der Wert \\(a\\) selbst mit heraus, obwohl er zum Intervall gehört." },
      { id:18, level:3, typ:"numerisch", frage:"\\(n=8, p=0{,}5\\). Berechne \\(P(X\\ge 6)\\) auf 4 Nachkommastellen.", loesung:0.1445, toleranz:0.005, tipp:"\\(P(X=6)+P(X=7)+P(X=8)\\).", loesungsweg:"Drei Fälle addieren, jeder mit \\(0{,}5^8 = \\tfrac{1}{256}\\): $$P(X\\ge6) = \\frac{\\binom86 + \\binom87 + \\binom88}{256} = \\frac{28+8+1}{256} = \\frac{37}{256} \\approx 0{,}1445$$" },
      // ========== LEVEL 4 — Erwartungswert, Standardabweichung ==========
      { id:19, level:4, typ:"numerisch", frage:"\\(n=50, p=0{,}2\\). Berechne \\(\\mu\\).", loesung:10, toleranz:0, tipp:"\\(\\mu = n\\cdot p\\).", loesungsweg:"\\(\\mu = 50\\cdot 0{,}2 = 10\\)." },
      { id:20, level:4, typ:"numerisch", frage:"\\(n=100, p=0{,}5\\). Berechne \\(\\sigma\\).", loesung:5, toleranz:0.01, tipp:"\\(\\sigma = \\sqrt{np(1-p)}\\).", loesungsweg:"\\(\\sigma = \\sqrt{100\\cdot 0{,}5\\cdot 0{,}5} = \\sqrt{25} = 5\\)." },
      { id:21, level:4, typ:"numerisch", frage:"\\(n=200, p=0{,}1\\). Berechne \\(\\sigma\\) auf 2 Nachkommastellen.", loesung:4.24, toleranz:0.05, tipp:"\\(\\sqrt{200\\cdot 0{,}1\\cdot 0{,}9}\\).", loesungsweg:"$$\\sigma = \\sqrt{np(1-p)} = \\sqrt{200 \\cdot 0{,}1 \\cdot 0{,}9} = \\sqrt{18} \\approx 4{,}24$$ Der Erwartungswert liegt bei \\(\\mu = 20\\); die Laplace-Bedingung \\(\\sigma > 3\\) ist erfüllt, die Normalverteilungsnäherung also zulässig." },
      { id:22, level:4, typ:"mc", frage:"Wann ist \\(\\sigma\\) einer Binomialverteilung maximal (bei festem \\(n\\))?", optionen:["\\(p=0\\)","\\(p=0{,}5\\)","\\(p=1\\)","\\(p=0{,}25\\)"], korrekt:1, tipp:"\\(p(1-p)\\) wird maximal bei \\(p=0{,}5\\).", loesungsweg:"Die Varianz \\(np(1-p)\\) ist maximal bei \\(p=0{,}5\\)." },
      { id:23, level:4, typ:"numerisch", frage:"Eine Münze wird 400-mal geworfen. Wie groß ist \\(\\sigma\\)?", loesung:10, toleranz:0.01, tipp:"\\(n=400, p=0{,}5\\).", loesungsweg:"\\(\\sigma = \\sqrt{400\\cdot 0{,}5 \\cdot 0{,}5} = \\sqrt{100} = 10\\)." },
      { id:24, level:4, typ:"numerisch", frage:"\\(n=30, p=\\tfrac{1}{3}\\). Berechne \\(\\mu\\).", loesung:10, toleranz:0, tipp:"\\(n\\cdot p\\).", loesungsweg:"\\(\\mu = 30 \\cdot \\tfrac{1}{3} = 10\\)." },
      // ========== LEVEL 5 — Verfahren verzahnen, Umkehraufgaben, Fehlersuche ==========
      { id:25, level:5, typ:"numerisch", frage:"Ein Versanddienst liefert \\(12\\,\\%\\) der Pakete verspätet. Von \\(25\\) Paketen: Wie groß ist die Wahrscheinlichkeit, dass mindestens \\(2\\) und höchstens \\(5\\) verspätet sind? (4 Nachkommastellen)", loesung:0.7486, toleranz:0.004, tipp:"Zwei kumulierte Werte verrechnen; achte darauf, dass die untere Grenze selbst zum Ereignis gehört.", loesungsweg:"Bernoulli-Kette mit \\(n = 25\\) und \\(p = 0{,}12\\), also \\(\\mu = 3\\). Aus der kumulierten Verteilung: $$P(2 \\le X \\le 5) = P(X \\le 5) - P(X \\le 1)$$ $$\\approx 0{,}9291 - 0{,}1805 \\approx 0{,}7486$$ Abgezogen wird \\(P(X \\le 1)\\) und nicht \\(P(X \\le 2)\\), denn der Wert \\(2\\) gehört zum gesuchten Ereignis. Dass rund drei Viertel der Wahrscheinlichkeit in diesem schmalen Streifen liegen, passt zum Erwartungswert \\(\\mu = 3\\) mitten im Intervall." },
      { id:26, level:5, typ:"numerisch", frage:"Für \\(n = 15\\) und \\(p = 0{,}2\\) rechnet jemand \\(P(X \\ge 4) = 1 - P(X \\le 4)\\) und erhält \\(0{,}1642\\). Berechne den richtigen Wert (4 Nachkommastellen).", loesung:0.3518, toleranz:0.004, tipp:"Überlege, bis zu welcher Trefferzahl das Gegenereignis von „mindestens vier“ reicht.", loesungsweg:"Das Gegenereignis zu „mindestens \\(4\\)“ ist „höchstens \\(3\\)“, nicht „höchstens \\(4\\)“: $$P(X \\ge 4) = 1 - P(X \\le 3) \\approx 1 - 0{,}6482 = 0{,}3518$$ Der vorgelegte Weg zieht zusätzlich \\(P(X = 4) \\approx 0{,}1876\\) ab und liefert deshalb einen Wert, der weniger als die Hälfte des richtigen beträgt. Merkregel: Bei \\(P(X \\ge k)\\) steht im Gegenereignis stets \\(k-1\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Von \\(20\\) Bauteilen fällt jedes unabhängig mit der Wahrscheinlichkeit \\(0{,}1\\) aus. Es ist bekannt, dass mindestens \\(2\\) Bauteile ausgefallen sind. Wie groß ist unter dieser Bedingung die Wahrscheinlichkeit, dass es genau \\(2\\) sind? (4 Nachkommastellen)", loesung:0.4689, toleranz:0.006, tipp:"Erst beide Wahrscheinlichkeiten getrennt mit der Bernoulli-Formel, dann die Bedingung als Einschränkung der Grundmenge ansetzen.", loesungsweg:"Zwei Verfahren greifen ineinander: Bernoulli-Formel und bedingte Wahrscheinlichkeit. $$P(X = 2) = \\binom{20}{2} \\cdot 0{,}1^2 \\cdot 0{,}9^{18} \\approx 0{,}2852$$ $$P(X \\ge 2) = 1 - P(X \\le 1) \\approx 1 - 0{,}3917 = 0{,}6083$$ Weil \\(\\{X = 2\\}\\) ganz in \\(\\{X \\ge 2\\}\\) enthalten ist, steht im Zähler der Einzelwert: $$P(X = 2 \\mid X \\ge 2) = \\frac{0{,}2852}{0{,}6083} \\approx 0{,}4689$$ Die Bedingung hebt den Wert deutlich an — ohne sie wären es nur \\(0{,}2852\\)." },
      { id:28, level:5, typ:"numerisch", frage:"Ein Prüfgerät meldet in jedem Durchlauf unabhängig mit \\(4\\,\\%\\) Wahrscheinlichkeit eine Störung. Wie viele Durchläufe sind mindestens nötig, damit mit einer Wahrscheinlichkeit von mindestens \\(95\\,\\%\\) wenigstens eine Störung gemeldet wird?", loesung:74, toleranz:0, tipp:"Setze das Gegenereignis „keine einzige Störung“ an und löse die entstehende Ungleichung durch Logarithmieren.", loesungsweg:"$$1 - 0{,}96^n \\ge 0{,}95 \\;\\Longleftrightarrow\\; 0{,}96^n \\le 0{,}05$$ $$n \\ge \\frac{\\ln 0{,}05}{\\ln 0{,}96} \\approx 73{,}4$$ Beim Teilen durch \\(\\ln 0{,}96\\), das negativ ist, kippt das Ungleichheitszeichen. Da \\(n\\) ganzzahlig ist, wird aufgerundet: \\(74\\) Durchläufe. Mit \\(73\\) Durchläufen kommt man erst auf \\(94{,}8\\,\\%\\) und verfehlt die Forderung." },
      { id:29, level:5, typ:"numerisch", frage:"Eine Münze wird \\(10\\)-mal geworfen. Wie groß ist die Wahrscheinlichkeit, dass höchstens \\(2\\)-mal oder mindestens \\(8\\)-mal Kopf fällt? (4 Nachkommastellen)", loesung:0.1094, toleranz:0.004, tipp:"Die beiden Ereignisse können nicht gleichzeitig eintreten; die Symmetrie bei \\(p = 0{,}5\\) halbiert die Rechenarbeit.", loesungsweg:"Beide Ereignisse haben keinen gemeinsamen Ausgang, ihre Wahrscheinlichkeiten werden also addiert. Wegen \\(p = 0{,}5\\) gilt \\(P(X = k) = P(X = 10-k)\\), beide Teile sind damit gleich groß: $$P(X \\le 2) = \\frac{\\binom{10}{0} + \\binom{10}{1} + \\binom{10}{2}}{2^{10}} = \\frac{56}{1024} \\approx 0{,}0547$$ $$P \\approx 2 \\cdot 0{,}0547 = 0{,}1094$$ Nur etwa jeder neunte Versuch endet so weit außen — die Verteilung ballt sich um \\(\\mu = 5\\)." },
      { id:30, level:5, typ:"mc", frage:"In einer Trommel liegen \\(20\\) Lose, davon \\(5\\) Gewinne. Es werden \\(4\\) Lose ohne Zurücklegen gezogen. Jemand rechnet mit einer Bernoulli-Kette der Länge \\(n = 4\\) und \\(p = 0{,}25\\). Welcher Einwand trifft zu?", optionen:["Der Wert von \\(p\\) ändert sich von Zug zu Zug","Der Binomialkoeffizient ist hier immer gleich eins","Die Anzahl der Züge ist für diese Formel zu klein","Der Wert von \\(p\\) müsste noch durch \\(4\\) geteilt werden"], korrekt:0, tipp:"Prüfe die beiden Voraussetzungen einer Bernoulli-Kette: feste Trefferwahrscheinlichkeit und Unabhängigkeit der Züge.", loesungsweg:"Ohne Zurücklegen verändert jedes gezogene Los die Zusammensetzung der Trommel. Nach einem Gewinn sind nur noch \\(4\\) von \\(19\\) Losen Gewinne (\\(p \\approx 0{,}211\\)), nach einer Niete \\(5\\) von \\(19\\) (\\(p \\approx 0{,}263\\)). Damit ist die Trefferwahrscheinlichkeit nicht konstant und die Züge sind nicht unabhängig — genau die beiden Voraussetzungen der Bernoulli-Kette fehlen. Bei nur \\(20\\) Losen ist der Fehler der Näherung erheblich; erst bei einem sehr großen Vorrat darf man so rechnen." },
      // ========== LEVEL 6 — Abi-Format (gA) ==========
      { id:31, level:6, typ:"numerisch", frage:"Ein Zulieferer sagt zu, dass höchstens \\(5\\,\\%\\) der Bauteile fehlerhaft sind. Eine Stichprobe von \\(50\\) Teilen enthält \\(6\\) fehlerhafte. Berechnen Sie, wie wahrscheinlich bei \\(p = 0{,}05\\) mindestens \\(6\\) fehlerhafte Teile auftreten (4 Nachkommastellen), und beurteilen Sie damit die Zusage.", loesung:0.0378, toleranz:0.003, tipp:"Rechne über das Gegenereignis „höchstens fünf fehlerhafte“ und beurteile erst danach.", loesungsweg:"\\(n = 50\\), \\(p = 0{,}05\\), also \\(\\mu = 2{,}5\\) erwartete Fehlteile. $$P(X \\ge 6) = 1 - P(X \\le 5) \\approx 1 - 0{,}9622 = 0{,}0378$$ <b>Beurteilung:</b> Bei eingehaltener Zusage tritt ein solcher Befund in weniger als \\(4\\,\\%\\) der Stichproben auf, obwohl mehr als das Doppelte des Erwartungswerts gefunden wurde. Das ist ein deutlicher Hinweis gegen die Zusage, aber kein Beweis — auch bei einwandfreier Lieferung kommt dieser Fall gelegentlich vor. Sachgerecht wäre eine zweite, größere Stichprobe, weil bei \\(n = 50\\) schon ein einzelnes Teil den Befund kippt." },
      { id:32, level:6, typ:"numerisch", frage:"Bei einer Bernoulli-Kette mit \\(n = 17\\) und \\(p = 0{,}35\\) ist \\(P(X = k)\\) für genau einen Wert von \\(k\\) am größten. Bestimmen Sie dieses \\(k\\) und begründen Sie, warum der Erwartungswert allein die Antwort nicht liefert.", loesung:6, toleranz:0, tipp:"Der Erwartungswert weist die Gegend; die beiden ganzen Zahlen daneben muss man vergleichen.", loesungsweg:"\\(\\mu = 17 \\cdot 0{,}35 = 5{,}95\\) ist keine ganze Zahl, das Maximum kann also nur bei \\(k = 5\\) oder \\(k = 6\\) liegen. Der Vergleich entscheidet: $$P(X=5) \\approx 0{,}1849, \\quad P(X=6) \\approx 0{,}1991, \\quad P(X=7) \\approx 0{,}1685$$ Also \\(k = 6\\). <b>Begründung:</b> \\(\\mu\\) ist ein gewichtetes Mittel und muss kein möglicher Wert der Zufallsgröße sein; bloßes Runden von \\(\\mu\\) ist daher kein Argument. Hier führt es zufällig zum Ziel, bei einer Lage knapp neben der halben Einheit kann es den falschen Nachbarn treffen." },
      { id:33, level:6, typ:"numerisch", frage:"Bei einem Jahrmarktspiel wird ein Würfel sechsmal geworfen; gewonnen hat, wer mindestens zwei Sechsen wirft. Berechnen Sie die Gewinnwahrscheinlichkeit (4 Nachkommastellen) und beurteilen Sie sie im Vergleich zum Erwartungswert der Sechsen.", loesung:0.2632, toleranz:0.004, tipp:"Das Gegenereignis besteht aus zwei Fällen, die getrennt zu berechnen sind.", loesungsweg:"\\(n = 6\\), \\(p = \\tfrac16\\). Das Gegenereignis „keine oder genau eine Sechs“ hat zwei Summanden: $$P(X \\ge 2) = 1 - \\left(\\tfrac56\\right)^6 - 6 \\cdot \\tfrac16 \\cdot \\left(\\tfrac56\\right)^5$$ $$\\approx 1 - 0{,}3349 - 0{,}4019 = 0{,}2632$$ <b>Beurteilung:</b> Der Erwartungswert beträgt \\(\\mu = 6 \\cdot \\tfrac16 = 1\\), trotzdem gewinnt nur gut ein Viertel der Spieler. Der Erwartungswert sagt eben nichts darüber, wie oft er überschritten wird: hier liegen \\(73{,}7\\,\\%\\) der Ergebnisse bei null oder einer Sechs, also nicht oberhalb von \\(\\mu\\)." },
      { id:34, level:6, typ:"mc", frage:"„Verdoppelt man die Länge \\(n\\) einer Bernoulli-Kette, so verdoppelt sich die Wahrscheinlichkeit \\(P(X \\ge 1)\\) für mindestens einen Treffer.“ Beurteilen Sie diese Behauptung.", optionen:["Richtig, denn die erwartete Trefferzahl verdoppelt sich ebenfalls","Falsch, der Wert wächst, aber nicht auf das Doppelte","Falsch, der Wert bleibt bei jeder Kettenlänge gleich","Richtig, sofern man \\(p\\) kleiner als \\(0{,}5\\) wählt"], korrekt:1, tipp:"Stelle \\(P(X \\ge 1)\\) über das Gegenereignis dar und prüfe die Behauptung an einem Zahlenbeispiel.", loesungsweg:"Es gilt \\(P(X \\ge 1) = 1 - (1-p)^n\\). Beim Übergang von \\(n\\) auf \\(2n\\) wird \\((1-p)^n\\) quadriert und nicht halbiert. Beispiel \\(p = 0{,}1\\): für \\(n = 10\\) ergibt sich \\(0{,}6513\\), für \\(n = 20\\) aber \\(0{,}8784\\) — das \\(1{,}35\\)-Fache. Dass die Behauptung gar nicht allgemein stimmen kann, zeigt schon eine Grenzbetrachtung: Wahrscheinlichkeiten liegen höchstens bei \\(1\\), fortgesetztes Verdoppeln ist also unmöglich." },
      { id:35, level:6, typ:"numerisch", frage:"Eine Prüfung besteht aus \\(12\\) Aufgaben mit je vier Antworten, von denen genau eine richtig ist. Bestanden hat, wer mindestens \\(6\\) Aufgaben richtig beantwortet. Berechnen Sie die Wahrscheinlichkeit, allein durch Raten zu bestehen (4 Nachkommastellen), und beurteilen Sie die Bestehensgrenze.", loesung:0.0544, toleranz:0.004, tipp:"Aus der Zahl der Antworten folgt die Trefferwahrscheinlichkeit; dann das Gegenereignis zur Bestehensgrenze bilden.", loesungsweg:"Raten bedeutet \\(p = \\tfrac14\\), also \\(n = 12\\) und \\(\\mu = 3\\). $$P(X \\ge 6) = 1 - P(X \\le 5) \\approx 1 - 0{,}9456 = 0{,}0544$$ <b>Beurteilung:</b> Etwa jeder zwanzigste Ratende besteht — für eine Prüfung, die Wissen belegen soll, ist das zu viel. Eine Grenze von \\(7\\) richtigen Antworten senkt den Wert auf rund \\(1{,}4\\,\\%\\), eine Verlängerung auf mehr Aufgaben wirkt in dieselbe Richtung, weil die relative Schwankung mit wachsendem \\(n\\) abnimmt." },
      { id:36, level:6, typ:"numerisch", frage:"In einer Bernoulli-Kette der Länge \\(10\\) tritt der Fall „kein Treffer“ mit der Wahrscheinlichkeit \\(0{,}5\\) ein. Bestimmen Sie \\(p\\) (3 Nachkommastellen) und begründen Sie ohne Taschenrechner, ob \\(p\\) über oder unter \\(0{,}1\\) liegen muss.", loesung:0.067, toleranz:0.003, tipp:"Zu „kein Treffer“ führt nur ein einziger Pfad; die entstehende Gleichung wird durch Wurzelziehen gelöst.", loesungsweg:"Ein einziger Pfad, also \\(\\binom{10}{0} = 1\\): $$(1-p)^{10} = 0{,}5 \\;\\Rightarrow\\; 1 - p = \\sqrt[10]{0{,}5} \\approx 0{,}9330 \\;\\Rightarrow\\; p \\approx 0{,}067$$ <b>Begründung ohne Rechner:</b> Bei \\(p = 0{,}1\\) wäre \\(P(X = 0) = 0{,}9^{10} \\approx 0{,}349\\), also deutlich kleiner als \\(0{,}5\\). Da \\(P(X = 0) = (1-p)^{10}\\) mit wachsendem \\(p\\) fällt, gehört zum größeren Wert \\(0{,}5\\) ein kleineres \\(p\\) — es muss unter \\(0{,}1\\) liegen." }];
