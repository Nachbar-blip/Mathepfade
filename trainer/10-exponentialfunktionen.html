<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exponentialfunktionen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-exponentialfunktionen';
    const THEMA_CONFIG = { name: 'Exponentialfunktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht ==========
      { id: 1, level: 1, typ: "mc", frage: "Wie sieht eine Exponentialfunktion aus?", optionen: ["\\(f(x) = x^a\\)", "\\(f(x) = a^x\\) mit \\(a > 0\\)", "\\(f(x) = a + x\\)", "\\(f(x) = \\log x\\)"], korrekt: 1, tipp: "Variable im Exponenten.", loesungsweg: "Eine <b>Exponentialfunktion</b> hat die Form \\(f(x) = a^x\\) mit \\(a > 0\\), \\(a \\neq 1\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "\\(f(x) = 2^x\\). Berechne \\(f(3)\\).", loesung: 8, toleranz: 0, tipp: "\\(2 \\cdot 2 \\cdot 2\\).", loesungsweg: "$$f(3) = 2^3 = 8$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "\\(f(x) = 3^x\\). Berechne \\(f(0)\\).", loesung: 1, toleranz: 0, tipp: "Jede Zahl hoch 0 = 1.", loesungsweg: "$$f(0) = 3^0 = 1$$" },
      { id: 4, level: 1, typ: "numerisch", frage: "\\(f(x) = 2^x\\). Berechne \\(f(-2)\\) als Dezimalzahl.", loesung: 0.25, toleranz: 0.01, tipp: "\\(2^{-2} = \\frac{1}{4}\\).", loesungsweg: "$$f(-2) = 2^{-2} = \\frac{1}{4} = 0{,}25$$" },
      { id: 5, level: 1, typ: "mc", frage: "Durch welchen Punkt geht JEDE Exponentialfunktion \\(f(x) = a^x\\)?", optionen: ["\\((1, 1)\\)", "\\((0, 1)\\)", "\\((0, 0)\\)", "\\((1, 0)\\)"], korrekt: 1, tipp: "\\(a^0 = 1\\).", loesungsweg: "\\(a^0 = 1\\) für jedes \\(a\\) — alle Graphen gehen durch \\((0, 1)\\)." },
      { id: 6, level: 1, typ: "mc", frage: "\\(f(x) = 2^x\\). Wie verhält sich \\(f\\) für \\(x \\to -\\infty\\)?", optionen: ["\\(\\to \\infty\\)", "\\(\\to -\\infty\\)", "\\(\\to 0\\)", "\\(\\to 1\\)"], korrekt: 2, tipp: "\\(2^{-100}\\) ist sehr klein.", loesungsweg: "Für \\(x \\to -\\infty\\) geht \\(2^x \\to 0\\). Die x-Achse ist Asymptote." },
      // ========== LEVEL 2 -- leicht ==========
      { id: 7, level: 2, typ: "numerisch", frage: "\\(f(x) = 5 \\cdot 2^x\\). Berechne \\(f(3)\\).", loesung: 40, toleranz: 0, tipp: "\\(5 \\cdot 8\\).", loesungsweg: "$$f(3) = 5 \\cdot 2^3 = 5 \\cdot 8 = 40$$" },
      { id: 8, level: 2, typ: "mc", frage: "\\(f(x) = \\left(\\frac{1}{2}\\right)^x\\). Wie verhält sich \\(f\\) für \\(x \\to \\infty\\)?", optionen: ["\\(\\to \\infty\\)", "\\(\\to 0\\)", "\\(\\to 1\\)", "\\(\\to -\\infty\\)"], korrekt: 1, tipp: "Basis \\(< 1\\): Funktion fällt.", loesungsweg: "\\(\\left(\\frac{1}{2}\\right)^x\\) fällt monoton: \\(\\to 0\\) für \\(x \\to \\infty\\)." },
      { id: 9, level: 2, typ: "mc", frage: "\\(f(x) = 3^x\\). Monotonie?", optionen: ["Streng monoton steigend", "Streng monoton fallend", "Konstant", "Weder noch"], korrekt: 0, tipp: "Basis \\(> 1\\): steigend.", loesungsweg: "\\(a^x\\) mit \\(a > 1\\): streng monoton steigend." },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(f(x) = 100 \\cdot 1{,}05^x\\). Berechne \\(f(0)\\).", loesung: 100, toleranz: 0, tipp: "\\(1{,}05^0 = 1\\).", loesungsweg: "$$f(0) = 100 \\cdot 1 = 100$$" },
      { id: 11, level: 2, typ: "mc", frage: "Eine Population wächst mit \\(P(t) = 1000 \\cdot 1{,}1^t\\). Was ist der Wachstumsfaktor?", optionen: ["\\(1000\\)", "\\(1{,}1\\)", "\\(t\\)", "\\(0{,}1\\)"], korrekt: 1, tipp: "Basis der Potenz.", loesungsweg: "Der <b>Wachstumsfaktor</b> ist \\(1{,}1\\) (entspricht 10 % Wachstum pro Zeiteinheit)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Wachstumsrate bei Faktor \\(1{,}08\\) in Prozent?", loesung: 8, toleranz: 0, tipp: "\\(1{,}08 = 100 \\% + 8 \\%\\).", loesungsweg: "Der Wachstumsfaktor setzt sich aus dem ganzen Bestand und dem Zuwachs zusammen: $$1{,}08 = 1 + 0{,}08 = 100\\,\\% + 8\\,\\%$$ Die Wachstumsrate beträgt also \\(8\\,\\%\\). Der Faktor \\(1{,}08\\) selbst ist keine Prozentangabe — der Anteil über der \\(1\\) ist entscheidend." },
      // ========== LEVEL 3 -- nervenschonend ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Ein Kapital von 1000 € wird mit 5 % jährlich verzinst. Nach wie vielen Jahren ergibt \\(1000 \\cdot 1{,}05^2\\) das Kapital? Gib die Jahre an.", loesung: 2, toleranz: 0, tipp: "Exponent.", loesungsweg: "Der Exponent zählt die Zinsperioden: $$1000 \\cdot 1{,}05^t \\quad\\text{mit } t = 2$$ Es sind also <b>2</b> Jahre. Der Faktor \\(1{,}05\\) kommt zweimal zur Anwendung, weil die Zinsen des ersten Jahres im zweiten mitverzinst werden." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x) = 3 \\cdot 2^x\\). Berechne \\(f(4)\\).", loesung: 48, toleranz: 0, tipp: "\\(3 \\cdot 16\\).", loesungsweg: "$$f(4) = 3 \\cdot 2^4 = 3 \\cdot 16 = 48$$" },
      { id: 15, level: 3, typ: "mc", frage: "Bei Halbwertszeit einer radioaktiven Substanz ist …", optionen: ["Die Menge verdoppelt sich", "Die Menge halbiert sich", "Die Menge bleibt gleich", "Die Menge wird 0"], korrekt: 1, tipp: "Halb-.", loesungsweg: "Nach einer Halbwertszeit ist die Hälfte der Substanz übrig." },
      { id: 16, level: 3, typ: "mc", frage: "Zerfallsfaktor bei 20 % Abnahme pro Zeiteinheit?", optionen: ["\\(0{,}2\\)", "\\(0{,}8\\)", "\\(1{,}2\\)", "\\(1{,}8\\)"], korrekt: 1, tipp: "Rest = 100 % − 20 %.", loesungsweg: "Zerfallsfaktor \\(= 1 - 0{,}2 = 0{,}8\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Bei 3 %-igem Wachstum: Wachstumsfaktor?", loesung: 1.03, toleranz: 0.001, tipp: "\\(1 + 0{,}03\\).", loesungsweg: "Zum vollen Bestand kommen \\(3\\,\\%\\) hinzu: $$q = 1 + 0{,}03 = 1{,}03$$ Bei Abnahme um \\(3\\,\\%\\) wäre es entsprechend \\(q = 1 - 0{,}03 = 0{,}97\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(f(x) = 2^x\\). Für welchen \\(x\\) gilt \\(f(x) = 32\\)?", loesung: 5, toleranz: 0, tipp: "\\(2^5 = 32\\).", loesungsweg: "\\(2^x = 32 = 2^5 \\implies x = 5\\)." },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Eine Bakterienkultur verdoppelt sich jede Stunde. Zu Beginn sind 100 Bakterien vorhanden. Nach wie vielen Stunden sind es 6400?", loesung: 6, toleranz: 0, tipp: "Überlege, mit welcher Zweierpotenz der Anfangsbestand multipliziert werden muss.", loesungsweg: "Der Bestand wächst mit dem Faktor \\(2\\) pro Stunde: $$100 \\cdot 2^t = 6400 \\;\\Longrightarrow\\; 2^t = 64$$ Wegen \\(2^6 = 64\\) ist \\(t = 6\\). Nach <b>6 Stunden</b> sind 6400 Bakterien da." },
      { id: 20, level: 4, typ: "numerisch", frage: "Ein Startkapital von 2500 € wird jährlich mit 4 % verzinst. Welchen Wert hat es nach 3 Jahren? Gib den Betrag in Euro auf Cent genau an.", loesung: 2812.16, toleranz: 0.02, tipp: "Bestimme zuerst den Wachstumsfaktor eines Jahres und wende ihn dreimal an.", loesungsweg: "Wachstumsfaktor: \\(q = 1 + 0{,}04 = 1{,}04\\). Über drei Jahre: $$2500 \\cdot 1{,}04^3 = 2500 \\cdot 1{,}124864 = 2812{,}16$$ Das Kapital beträgt <b>2812,16 €</b>. Ein einfacher Dreisatz mit \\(3 \\cdot 4\\,\\% = 12\\,\\%\\) ergäbe nur 2800 € — die Zinseszinsen fehlen dort." },
      { id: 21, level: 4, typ: "mc", frage: "Ein Bestand von 400 Stück nimmt jedes Jahr um 15 % ab. Welcher Term beschreibt den Bestand nach \\(t\\) Jahren?", optionen: ["\\(400 \\cdot 0{,}15^t\\)", "\\(400 \\cdot 0{,}85^t\\)", "\\(400 \\cdot 1{,}15^t\\)", "\\(400 - 0{,}15^t\\)"], korrekt: 1, tipp: "Frage dich, welcher Anteil des Bestandes nach einem Jahr noch vorhanden ist.", loesungsweg: "Nach einem Jahr sind \\(100\\,\\% - 15\\,\\% = 85\\,\\%\\) übrig, der Zerfallsfaktor ist also \\(q = 0{,}85\\): $$B(t) = 400 \\cdot 0{,}85^t$$ Der Faktor \\(0{,}15\\) beschreibt nur den <b>Verlust</b>, \\(1{,}15\\) eine Zunahme, und die Subtraktion einer Potenz passt zu gar keinem prozentualen Vorgang." },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein radioaktiver Stoff hat eine Halbwertszeit von 8 Tagen. Zu Beginn sind 240 g vorhanden. Wie viel Gramm sind nach 24 Tagen noch übrig?", loesung: 30, toleranz: 0.01, tipp: "Bestimme zuerst, wie viele Halbwertszeiten in den 24 Tagen stecken.", loesungsweg: "\\(24 : 8 = 3\\) Halbwertszeiten, also dreimal halbieren: $$240 \\cdot \\left(\\tfrac12\\right)^3 = 240 \\cdot \\tfrac18 = 30$$ Es bleiben <b>30 g</b>. Der Bestand erreicht dabei nie genau null, er nähert sich der Null nur an." },
      { id: 23, level: 4, typ: "numerisch", frage: "Eine Tierpopulation wächst jedes Jahr mit demselben Faktor. Im Jahr 2020 wurden 800 Tiere gezählt, im Jahr 2023 waren es 6400. Wie groß ist der Wachstumsfaktor pro Jahr?", loesung: 2, toleranz: 0.01, tipp: "Zwischen den beiden Zählungen liegen drei gleiche Wachstumsschritte.", loesungsweg: "In drei Jahren wächst der Bestand auf das Achtfache: $$800 \\cdot q^3 = 6400 \\;\\Longrightarrow\\; q^3 = 8$$ Also \\(q = \\sqrt[3]{8} = 2\\): Die Population <b>verdoppelt</b> sich jährlich." },
      { id: 24, level: 4, typ: "numerisch", frage: "Von einem Medikament sind zwei Stunden nach der Einnahme noch 49 % der Wirkstoffmenge im Blut. Der Abbau verläuft exponentiell. Welcher Abbaufaktor gehört zu einer Stunde? Gib ihn als Dezimalzahl an.", loesung: 0.7, toleranz: 0.01, tipp: "Der gesuchte Faktor wirkt in den zwei Stunden zweimal.", loesungsweg: "Aus zwei gleichen Schritten: $$q^2 = 0{,}49 \\;\\Longrightarrow\\; q = \\sqrt{0{,}49} = 0{,}7$$ Pro Stunde bleiben <b>70 %</b> übrig, der Wirkstoff nimmt also um 30 % je Stunde ab. Die Hälfte von \\(0{,}49\\) wäre falsch: Prozentwerte werden bei exponentiellem Abbau multipliziert, nicht geteilt." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Für \\(f(x) = c \\cdot a^x\\) gilt \\(f(1) = 12\\) und \\(f(3) = 108\\). Bestimme \\(c\\).", loesung: 4, toleranz: 0.01, tipp: "Teile die beiden Funktionswerte durcheinander — \\(c\\) fällt dabei heraus.", loesungsweg: "Quotient der beiden Bedingungen: $$\\frac{c \\cdot a^3}{c \\cdot a^1} = \\frac{108}{12} = 9 \\;\\Longrightarrow\\; a^2 = 9 \\;\\Longrightarrow\\; a = 3$$ Eingesetzt in die erste Bedingung: \\(c \\cdot 3 = 12\\), also \\(c = 4\\). Die Funktion ist \\(f(x) = 4 \\cdot 3^x\\); Probe: \\(f(3) = 4 \\cdot 27 = 108\\)." },
      { id: 26, level: 5, typ: "mc", frage: "Ein Preis steigt zwei Jahre hintereinander um jeweils 10 %. Jemand notiert als Ergebnis: „Der Preis ist insgesamt um 20 % gestiegen.“ Wie ist das zu bewerten?", optionen: ["Richtig, Prozentsätze werden addiert", "Falsch, es sind insgesamt 21 %", "Falsch, es sind insgesamt 19 %", "Falsch, es sind insgesamt 100 %"], korrekt: 1, tipp: "Wende den Wachstumsfaktor eines Jahres zweimal an und vergleiche mit dem Faktor 1,20.", loesungsweg: "Die Jahresfaktoren werden multipliziert, nicht addiert: $$1{,}10 \\cdot 1{,}10 = 1{,}21$$ Das entspricht einer Zunahme um <b>21 %</b>. Der zusätzliche Prozentpunkt entsteht, weil im zweiten Jahr auch die Steigerung des ersten Jahres mit 10 % wächst." },
      { id: 27, level: 5, typ: "numerisch", frage: "Kultur A enthält zu Beginn 6400 Zellen und verdoppelt sich alle 2 Stunden. Kultur B enthält zu Beginn 400 Zellen und verdoppelt sich jede Stunde. Nach wie vielen ganzen Stunden ist B erstmals größer als A?", loesung: 9, toleranz: 0, tipp: "Schreibe beide Bestände als Zweierpotenzen mit gleicher Basis und vergleiche die Exponenten.", loesungsweg: "\\(A(t) = 6400 \\cdot 2^{t/2}\\) und \\(B(t) = 400 \\cdot 2^{t}\\). Gleichsetzen: $$400 \\cdot 2^{t} = 6400 \\cdot 2^{t/2} \\;\\Longrightarrow\\; 2^{t/2} = 16 \\;\\Longrightarrow\\; t = 8$$ Nach 8 Stunden sind beide gleich groß (je 102 400 Zellen); nach <b>9 Stunden</b> ist B mit 204 800 gegen 144 815 Zellen erstmals größer." },
      { id: 28, level: 5, typ: "numerisch", frage: "Ein Kapital von 4000 € wird fünf Jahre lang mit 3 % pro Jahr verzinst und danach fünf weitere Jahre mit 5 % pro Jahr. Welchen Wert hat es nach den zehn Jahren? Gib den Betrag in Euro auf Cent genau an.", loesung: 5918.24, toleranz: 0.05, tipp: "Rechne mit zwei aufeinanderfolgenden Zinsphasen; der Endwert der ersten ist der Startwert der zweiten.", loesungsweg: "Beide Phasen hintereinander: $$4000 \\cdot 1{,}03^5 \\cdot 1{,}05^5 = 4000 \\cdot 1{,}159274 \\cdot 1{,}276282 = 5918{,}24$$ Das Kapital beträgt <b>5918,24 €</b>. Mit einem gemittelten Zinssatz von 4 % käme man auf 5920,98 € — der gemittelte Satz ist also keine korrekte Abkürzung." },
      { id: 29, level: 5, typ: "numerisch", frage: "Von 600 mg eines Stoffes sind nach 3 Stunden noch 75 mg vorhanden. Der Abbau ist exponentiell. Wie viel Milligramm sind nach 5 Stunden vorhanden?", loesung: 18.75, toleranz: 0.05, tipp: "Bestimme erst den Faktor für eine Stunde, dann den Bestand nach fünf Stunden.", loesungsweg: "Aus drei gleichen Schritten: $$q^3 = \\frac{75}{600} = \\frac18 \\;\\Longrightarrow\\; q = \\frac12$$ Nach fünf Stunden also $$600 \\cdot \\left(\\tfrac12\\right)^5 = 600 \\cdot \\tfrac1{32} = 18{,}75$$ Es sind noch <b>18,75 mg</b> vorhanden." },
      { id: 30, level: 5, typ: "numerisch", frage: "Ein Wald mit 5000 Bäumen verliert jedes Jahr 4 % seines Bestandes. Nach wie vielen ganzen Jahren sind erstmals weniger als 4000 Bäume vorhanden?", loesung: 6, toleranz: 0, tipp: "Bestimme den Zerfallsfaktor und probiere die Jahre der Reihe nach durch.", loesungsweg: "Zerfallsfaktor \\(q = 0{,}96\\). Probieren: $$5000 \\cdot 0{,}96^5 = 4076{,}9 \\qquad 5000 \\cdot 0{,}96^6 = 3913{,}8$$ Erst nach <b>6 Jahren</b> liegt der Bestand unter 4000. Eine lineare Abnahme von 200 Bäumen pro Jahr hätte 5 Jahre ergeben — der jährliche Verlust wird bei exponentieller Abnahme aber immer kleiner." },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Wer 10 Jahre lang 5 % Zinsen pro Jahr erhält, bekommt weniger als jemand, dessen Kapital nach 10 Jahren einmalig um 50 % erhöht wird.“ Prüfe die Behauptung.", optionen: ["Richtig, beide Wege ergeben genau dasselbe", "Falsch, die Verzinsung ergibt rund 63 % mehr", "Richtig, die Verzinsung ergibt nur 40 % mehr", "Falsch, die Verzinsung ergibt rund 80 % mehr"], korrekt: 1, tipp: "Vergleiche den Gesamtfaktor der zehn Zinsjahre mit dem Faktor 1,50.", loesungsweg: "Zehn Zinsjahre ergeben den Gesamtfaktor $$1{,}05^{10} = 1{,}6289$$ also eine Zunahme um rund <b>63 %</b>. Das ist mehr als die einmaligen 50 %, die Behauptung ist somit falsch. Ursache sind die Zinseszinsen: der Zuwachs wird selbst wieder verzinst." },
      { id: 32, level: 6, typ: "numerisch", frage: "Betrachte die fünf Funktionen \\(f(x) = a^x\\) mit den Basen \\(a = 0{,}5\\), \\(a = 1{,}2\\), \\(a = 0{,}9\\), \\(a = 3\\) und \\(a = 0{,}25\\). Für wie viele von ihnen gilt \\(a^x \\to 0\\) für \\(x \\to \\infty\\)?", loesung: 3, toleranz: 0, tipp: "Unterscheide die Basen danach, ob sie über oder unter \\(1\\) liegen, und prüfe je einen großen Exponenten.", loesungsweg: "Fallunterscheidung nach der Basis: Für \\(a > 1\\) wächst \\(a^x\\) über jede Grenze, etwa \\(3^{10} = 59\\,049\\). Für \\(0 < a < 1\\) wird die Potenz beliebig klein, etwa $$0{,}9^{100} \\approx 0{,}0000266$$ Unter \\(1\\) liegen die Basen \\(0{,}5\\), \\(0{,}9\\) und \\(0{,}25\\) — das sind <b>3</b> Funktionen. Bei \\(1{,}2\\) und \\(3\\) tritt der Grenzwert \\(0\\) erst für \\(x \\to -\\infty\\) ein." },
      { id: 33, level: 6, typ: "numerisch", frage: "Für \\(f(x) = c \\cdot a^x\\) gilt \\(f(2) = 50\\) und \\(f(5) = 6250\\). Bestimme \\(c\\).", loesung: 2, toleranz: 0.01, tipp: "Der Quotient der beiden Funktionswerte liefert eine Potenz von \\(a\\) allein.", loesungsweg: "Quotient: $$\\frac{c \\cdot a^5}{c \\cdot a^2} = \\frac{6250}{50} = 125 \\;\\Longrightarrow\\; a^3 = 125 \\;\\Longrightarrow\\; a = 5$$ Eingesetzt: \\(c \\cdot 25 = 50\\), also \\(c = 2\\). Die Funktion ist \\(f(x) = 2 \\cdot 5^x\\); Probe: \\(f(5) = 2 \\cdot 3125 = 6250\\)." },
      { id: 34, level: 6, typ: "mc", frage: "Behauptung: „Ein Bestand, der jedes Jahr um denselben Prozentsatz abnimmt, ist nach genügend vielen Jahren gleich null.“ Prüfe die Behauptung.", optionen: ["Richtig, irgendwann ist nichts mehr übrig", "Falsch, der Bestand bleibt stets positiv", "Richtig, spätestens nach 100 Jahren", "Falsch, der Bestand wird sogar negativ"], korrekt: 1, tipp: "Überlege, was das Multiplizieren mit einem positiven Faktor am Vorzeichen ändert.", loesungsweg: "Der Bestand entsteht durch Multiplikation mit einem Faktor \\(0 < q < 1\\): $$B(t) = B_0 \\cdot q^t > 0 \\quad \\text{für alle } t$$ Ein Produkt positiver Zahlen ist positiv, also wird der Bestand <b>nie</b> null, sondern nur beliebig klein. Die Gerade \\(y = 0\\) ist Asymptote. In der Praxis rundet man irgendwann auf null — mathematisch bleibt der Wert positiv." },
      { id: 35, level: 6, typ: "numerisch", frage: "Angebot A: 1000 € Startkapital mit 8 % Zinsen pro Jahr. Angebot B: 1200 € Startkapital mit 3 % Zinsen pro Jahr. Nach wie vielen ganzen Jahren ist A erstmals mehr wert als B?", loesung: 4, toleranz: 0, tipp: "Vergleiche die beiden Kapitalverläufe Jahr für Jahr, bis sich die Reihenfolge umkehrt.", loesungsweg: "Jahresweiser Vergleich von \\(1000 \\cdot 1{,}08^t\\) und \\(1200 \\cdot 1{,}03^t\\): $$t = 3:\\; 1259{,}71 < 1311{,}27 \\qquad t = 4:\\; 1360{,}49 > 1350{,}61$$ Nach <b>4 Jahren</b> liegt A erstmals vorn. Der kleinere Startwert wird durch den höheren Zinssatz aufgeholt, weil das Verhältnis \\(1{,}08 : 1{,}03\\) jedes Jahr zugunsten von A wirkt." },
      { id: 36, level: 6, typ: "mc", frage: "Ein Bestand verdoppelt sich in 10 Jahren. Behauptung: „Dann hat er sich in 30 Jahren versechsfacht.“ Prüfe die Behauptung.", optionen: ["Richtig, dreimal zwei ergibt sechs", "Falsch, er hat sich verachtfacht", "Falsch, er hat sich vervierfacht", "Richtig, aber nur bei linearem Wachstum"], korrekt: 1, tipp: "Zerlege die 30 Jahre in gleiche Abschnitte und überlege, wie die Faktoren dieser Abschnitte verknüpft werden.", loesungsweg: "30 Jahre bestehen aus drei Verdopplungszeiten. Die Faktoren werden multipliziert: $$2 \\cdot 2 \\cdot 2 = 2^3 = 8$$ Der Bestand hat sich also <b>verachtfacht</b>, nicht versechsfacht. Die Behauptung überträgt fälschlich das Addieren von linearem Wachstum auf einen multiplikativen Vorgang." }];
    </script>

</body>
