    <script>
    const THEMA_KEY = '12-lk-integral-uneigentlich';
    const THEMA_CONFIG = { name: 'Stetigkeit und Asymptoten (eA)', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Begriffe: Stetigkeit, Periode, Verhalten im Unendlichen ==========
      { id:1, level:1, typ:"mc", frage:"Was bedeutet es, dass eine Funktion \\(f\\) an einer Stelle \\(x_0\\) stetig ist?", optionen:["Grenzwert und Funktionswert stimmen dort überein.","Die Funktion nimmt dort den Wert null an.","Die Funktion ist dort streng monoton wachsend.","Die Ableitung nimmt dort den Wert null an."], korrekt:0, tipp:"Denke daran, wie sich ein stetiger Graph zeichnen lässt — und welche zwei Größen an der Stelle dafür zusammenpassen müssen.", loesungsweg:"Stetigkeit an einer Stelle bedeutet: der Wert, dem sich die Funktionswerte beim Annähern nähern, ist zugleich der Wert, den die Funktion dort tatsächlich annimmt. In Zeichen: $$\\lim_{x \\to x_0} f(x) = f(x_0)$$ Anschaulich lässt sich der Graph an dieser Stelle ohne Absetzen des Stiftes durchzeichnen. Nullstellen, Monotonie und Ableitung sind davon unabhängige Eigenschaften — eine stetige Funktion muss weder eine Nullstelle haben noch monoton sein." },
      { id:2, level:1, typ:"mc", frage:"Welche der folgenden abschnittsweise erklärten Funktionen hat an der Stelle \\(0\\) eine Sprungstelle?", optionen:["\\(f(x)=x+1\\) für \\(x < 0\\), sonst \\(f(x)=2\\)","\\(f(x)=x+1\\) für \\(x < 0\\), sonst \\(f(x)=1\\)","\\(f(x)=x^2\\) für \\(x < 0\\), sonst \\(f(x)=x\\)","\\(f(x)=2x\\) für \\(x < 0\\), sonst \\(f(x)=|x|\\)"], korrekt:0, tipp:"Werte bei jeder Funktion beide Teilterme an der Stelle \\(0\\) aus und vergleiche die beiden Ergebnisse.", loesungsweg:"Bei einer Sprungstelle nähern sich die Funktionswerte von links und von rechts verschiedenen Zahlen. Die Proben an der Stelle \\(0\\): beim ersten Vorschlag liefert der linke Teilterm \\(0+1=1\\), der rechte aber \\(2\\) — die Lücke der Höhe \\(1\\) lässt sich nicht überbrücken, hier liegt ein Sprung vor. Bei den übrigen drei stimmen beide Teilterme an der Stelle \\(0\\) überein (\\(1\\) und \\(1\\) beziehungsweise \\(0\\) und \\(0\\)); sie sind dort stetig. Der letzte Vorschlag hat zwar einen Knick, aber keinen Sprung." },
      { id:3, level:1, typ:"numerisch", frage:"Welche Periode hat die Funktion \\(f(x)=\\sin x\\)? Gib den Wert auf drei Nachkommastellen an.", loesung:6.283, toleranz:0.01, tipp:"Die Sinuskurve wiederholt sich nach einem vollen Umlauf am Einheitskreis.", loesungsweg:"Der Sinus durchläuft alle seine Werte während eines vollen Umlaufs am Einheitskreis und wiederholt sich danach: $$\\sin(x + 2\\pi) = \\sin x$$ Die Periode ist also $$p = 2\\pi \\approx 6{,}283$$ Das ist die kleinste Zahl mit dieser Eigenschaft; Vielfache davon sind ebenfalls Perioden, aber nicht die kleinste." },
      { id:4, level:1, typ:"numerisch", frage:"Der Graph von \\(f(x)=e^{x}-2\\) nähert sich für \\(x \\to -\\infty\\) einer waagerechten Geraden \\(y=b\\). Bestimme \\(b\\).", loesung:-2, toleranz:0.01, tipp:"Überlege zuerst, welchem Wert sich \\(e^{x}\\) für immer kleinere \\(x\\) nähert; der zweite Summand bleibt unverändert.", loesungsweg:"Für \\(x \\to -\\infty\\) strebt \\(e^{x}\\) gegen \\(0\\) — die e-Funktion nimmt zwar nie den Wert null an, kommt ihm aber beliebig nahe. Damit bleibt vom Funktionsterm nur der Summand \\(-2\\) übrig: $$\\lim_{x \\to -\\infty}\\left(e^{x}-2\\right) = 0 - 2 = -2$$ Die waagerechte Gerade ist also \\(y = -2\\). Der Graph verläuft stets oberhalb von ihr, denn \\(e^{x}\\) ist immer positiv. Für \\(x \\to +\\infty\\) gibt es dagegen keine solche Gerade, dort wächst der Term über alle Grenzen." },
      { id:5, level:1, typ:"mc", frage:"Wie verhält sich \\(f(x)=e^{-x}\\) für \\(x \\to \\infty\\)?", optionen:["Die Werte streben gegen \\(0\\).","Die Werte wachsen über alle Grenzen.","Die Werte streben gegen \\(1\\).","Die Werte wechseln ständig das Vorzeichen."], korrekt:0, tipp:"Schreibe den Term als Bruch mit der gewöhnlichen e-Funktion im Nenner.", loesungsweg:"Wegen $$e^{-x} = \\frac{1}{e^{x}}$$ steht im Nenner eine Größe, die für \\(x \\to \\infty\\) über alle Grenzen wächst. Ein Bruch mit festem Zähler und immer größerem Nenner strebt gegen \\(0\\): $$\\lim_{x \\to \\infty} e^{-x} = 0$$ Negative Werte kommen dabei nie vor — die e-Funktion ist überall positiv." },
      { id:6, level:1, typ:"numerisch", frage:"Welche Periode hat \\(f(x)=\\sin(2x)\\)? Gib den Wert auf drei Nachkommastellen an.", loesung:3.142, toleranz:0.01, tipp:"Der Faktor vor dem \\(x\\) staucht die Kurve in Richtung der \\(x\\)-Achse; die Periode ändert sich entsprechend.", loesungsweg:"Der Faktor \\(2\\) im Argument bewirkt, dass das Argument doppelt so schnell wächst; die Kurve wiederholt sich daher schon nach der halben Strecke: $$p = \\frac{2\\pi}{2} = \\pi \\approx 3{,}142$$ Allgemein gilt für \\(\\sin(bx)\\) mit \\(b>0\\) die Periode \\(\\frac{2\\pi}{b}\\). Der Faktor <b>staucht</b> also, er streckt nicht." },
      // ========== LEVEL 2 — Perioden ablesen, Nahtstellen prüfen, e-Asymptoten ==========
      { id:7, level:2, typ:"numerisch", frage:"Wie viele volle Perioden durchläuft der Graph von \\(f(x)=\\sin(6x)\\) über dem Intervall \\([0;2\\pi]\\)?", loesung:6, toleranz:0.01, tipp:"Bestimme zuerst die Länge einer Periode und vergleiche sie danach mit der Länge des Intervalls.", loesungsweg:"<b>Periode:</b> für \\(\\sin(bx)\\) mit \\(b>0\\) gilt \\(p=\\frac{2\\pi}{b}\\), hier also $$p = \\frac{2\\pi}{6} = \\frac{\\pi}{3}$$ <b>Anzahl:</b> das Intervall ist \\(2\\pi\\) lang, also $$\\frac{2\\pi}{\\frac{\\pi}{3}} = 6$$ Der Graph durchläuft sechs volle Perioden. Allgemein gibt der Faktor im Argument genau an, wie oft die Kurve innerhalb von \\(2\\pi\\) durchlaufen wird." },
      { id:8, level:2, typ:"numerisch", frage:"Welche Periode hat \\(f(x)=3 \\cdot \\sin(0{,}5x)\\)? Gib den Wert auf zwei Nachkommastellen an.", loesung:12.57, toleranz:0.05, tipp:"Der Vorfaktor vor dem Sinus und der Faktor im Argument wirken auf verschiedene Richtungen; nur einer von beiden ändert die Periode.", loesungsweg:"Der Vorfaktor \\(3\\) streckt die Kurve nur in Richtung der \\(y\\)-Achse und lässt die Periode unverändert. Entscheidend ist allein der Faktor im Argument: $$p = \\frac{2\\pi}{0{,}5} = 4\\pi \\approx 12{,}57$$ Ein Faktor kleiner als \\(1\\) streckt die Kurve also in Richtung der \\(x\\)-Achse." },
      { id:9, level:2, typ:"numerisch", frage:"Gegeben ist \\(f(x)=2x+1\\) für \\(x < 3\\) und \\(f(x)=x^2-2\\) für \\(x \\ge 3\\). Berechne die Differenz aus dem rechtsseitigen und dem linksseitigen Grenzwert an der Nahtstelle \\(x=3\\).", loesung:0, toleranz:0.01, tipp:"Setze die Nahtstelle in beide Teilterme getrennt ein und bilde danach die Differenz der beiden Ergebnisse.", loesungsweg:"Linker Teilterm an der Nahtstelle: \\(2 \\cdot 3 + 1 = 7\\). Rechter Teilterm: \\(3^2 - 2 = 7\\). Die Differenz ist $$7 - 7 = 0$$ Beide Grenzwerte stimmen überein, und weil der rechte Teilterm die Stelle \\(3\\) auch wirklich erfasst, ist \\(f\\) dort stetig. Eine Differenz ungleich null hätte einen Sprung der entsprechenden Höhe angezeigt." },
      { id:10, level:2, typ:"numerisch", frage:"Der Graph von \\(f(x)=4-2e^{-x}\\) nähert sich für \\(x \\to \\infty\\) einer waagerechten Geraden \\(y=b\\). Bestimme \\(b\\).", loesung:4, toleranz:0.01, tipp:"Untersuche zuerst, wohin der e-Term für große \\(x\\) strebt; der Vorfaktor ändert daran nichts.", loesungsweg:"Für \\(x \\to \\infty\\) strebt \\(e^{-x}\\) gegen \\(0\\), also auch \\(2e^{-x}\\): $$\\lim_{x \\to \\infty}\\left(4 - 2e^{-x}\\right) = 4 - 0 = 4$$ Die Gerade ist \\(y = 4\\). Der Graph nähert sich ihr von unten, denn \\(2e^{-x}\\) ist stets positiv und wird von \\(4\\) abgezogen." },
      { id:11, level:2, typ:"numerisch", frage:"Gegeben ist \\(f(x)=x^2-4\\) für \\(x \\le 0\\) und \\(f(x)=x-4\\) für \\(x > 0\\). Zeige, dass \\(f\\) an der Stelle \\(0\\) stetig ist, und gib den gemeinsamen Grenzwert an.", loesung:-4, toleranz:0.01, tipp:"Beide Teilterme an der Nahtstelle auswerten und vergleichen; stimmen sie überein, liegt kein Sprung vor.", loesungsweg:"Linksseitig: \\(0^2 - 4 = -4\\). Rechtsseitig: \\(0 - 4 = -4\\). Beide Grenzwerte sind gleich \\(-4\\), und der erste Teilterm liefert auch den Funktionswert \\(f(0) = -4\\). Damit stimmen Grenzwert und Funktionswert überein, \\(f\\) ist an der Stelle \\(0\\) stetig. Der Graph hat dort allerdings einen Knick — stetig heißt nicht glatt." },
      { id:12, level:2, typ:"mc", frage:"Welche Funktion hat für \\(x \\to \\infty\\) die waagerechte Gerade \\(y=-2\\) als Näherungsgerade?", optionen:["\\(f(x)=e^{-x}-2\\)","\\(f(x)=e^{x}-2\\)","\\(f(x)=-2e^{-x}\\)","\\(f(x)=e^{-x}+2\\)"], korrekt:0, tipp:"Prüfe für jeden Term getrennt, wohin der e-Anteil für große \\(x\\) strebt und was danach übrig bleibt.", loesungsweg:"Nur bei der ersten Funktion strebt der e-Anteil für \\(x \\to \\infty\\) gegen \\(0\\) und es bleibt der Summand \\(-2\\) übrig. Bei \\(e^{x}-2\\) wächst der e-Anteil über alle Grenzen, es gibt gar keine Näherungsgerade. Bei \\(-2e^{-x}\\) strebt der ganze Term gegen \\(0\\), die Gerade wäre \\(y=0\\). Bei \\(e^{-x}+2\\) bleibt \\(+2\\) übrig. Entscheidend ist stets der konstante Summand, nicht der Vorfaktor des e-Terms." },
      // ========== LEVEL 3 — stetige Fortsetzung, Periode im Funktionsterm, Definitionslücke ==========
      { id:13, level:3, typ:"numerisch", frage:"Die Funktion \\(f(x)=\\frac{x^2-x-6}{x+2}\\) ist an der Stelle \\(-2\\) nicht erklärt. Welchen Wert muss man dort ergänzen, damit die Funktion stetig wird?", loesung:-5, toleranz:0.01, tipp:"Zerlege den Zähler in Linearfaktoren; einer davon lässt sich gegen den Nenner kürzen, und der verbleibende Term ist an der Stelle problemlos auswertbar.", loesungsweg:"Der Zähler hat die Nullstellen \\(3\\) und \\(-2\\), also $$x^2-x-6 = (x-3)(x+2)$$ Für \\(x \\ne -2\\) darf gekürzt werden: $$f(x) = \\frac{(x-3)(x+2)}{x+2} = x-3$$ Der verbleibende Term ist überall stetig; an der Stelle \\(-2\\) liefert er $$-2-3 = -5$$ Ergänzt man diesen Wert, so ist die Funktion stetig. Weil sich der Nennerfaktor herauskürzen ließ, liegt hier keine Polstelle vor, sondern nur eine einzelne fehlende Stelle im Graphen." },
      { id:14, level:3, typ:"numerisch", frage:"Welche Periode hat \\(f(x)=2 \\cdot \\sin(3x)+1\\)? Gib den Wert auf drei Nachkommastellen an.", loesung:2.094, toleranz:0.01, tipp:"Weder der Vorfaktor noch der Summand verschieben die Wiederholung der Kurve; nur ein Bestandteil des Terms ist maßgeblich.", loesungsweg:"Der Vorfaktor \\(2\\) streckt in Richtung der \\(y\\)-Achse, der Summand \\(1\\) verschiebt nach oben — beides ändert die Periode nicht. Maßgeblich ist allein der Faktor \\(3\\) im Argument: $$p = \\frac{2\\pi}{3} \\approx 2{,}094$$ Die Kurve schwingt also zwischen \\(-1\\) und \\(3\\) und wiederholt sich nach rund \\(2{,}09\\) Einheiten." },
      { id:15, level:3, typ:"numerisch", frage:"An welcher Stelle hat der Graph von \\(f(x)=\\frac{e^{x}}{2x-6}\\) eine senkrechte Näherungsgerade?", loesung:3, toleranz:0.01, tipp:"Der Zähler ist überall positiv; entscheidend ist die Stelle, an der der Nenner verschwindet.", loesungsweg:"Die e-Funktion nimmt nie den Wert null an, der Zähler kann sich also nicht gegen den Nenner kürzen. Der Nenner verschwindet für $$2x - 6 = 0 \\;\\Longrightarrow\\; x = 3$$ In der Nähe dieser Stelle wächst der Betrag der Funktionswerte über alle Grenzen; die senkrechte Gerade \\(x = 3\\) ist die Näherungsgerade. Dort ist \\(f\\) nicht erklärt, eine Frage nach Stetigkeit an dieser Stelle stellt sich daher gar nicht." },
      { id:16, level:3, typ:"mc", frage:"Welche Aussage über \\(f(x)=|x|\\) an der Stelle \\(0\\) trifft zu?", optionen:["\\(f\\) ist dort stetig und differenzierbar.","\\(f\\) ist dort stetig, aber nicht differenzierbar.","\\(f\\) ist dort differenzierbar, aber nicht stetig.","\\(f\\) ist dort weder stetig noch differenzierbar."], korrekt:1, tipp:"Vergleiche erst die Funktionswerte links und rechts der Stelle, danach die Steigungen der beiden Äste.", loesungsweg:"<b>Stetigkeit:</b> von beiden Seiten nähern sich die Werte der Zahl \\(0\\), und \\(f(0)=0\\); die Funktion ist dort stetig. <b>Differenzierbarkeit:</b> links der Stelle hat der Graph die Steigung \\(-1\\), rechts davon die Steigung \\(+1\\). Die beiden Steigungen stimmen nicht überein, es gibt dort also keine eindeutige Tangente — der Graph hat einen Knick. Das Beispiel zeigt: aus Stetigkeit folgt keine Differenzierbarkeit." },
      { id:17, level:3, typ:"numerisch", frage:"Gegeben ist \\(f(x)=3\\) für \\(x < 1\\), \\(f(x)=x+1\\) für \\(1 \\le x < 4\\) und \\(f(x)=6\\) für \\(x \\ge 4\\). An wie vielen Stellen ist \\(f\\) unstetig?", loesung:2, toleranz:0.01, tipp:"Nur an den beiden Nahtstellen kann etwas schiefgehen; werte dort jeweils beide angrenzenden Teilterme aus.", loesungsweg:"Innerhalb der drei Abschnitte ist \\(f\\) stetig, geprüft werden müssen nur die Nahtstellen. <b>Stelle 1:</b> von links liefert der erste Teilterm \\(3\\), von rechts der zweite \\(1+1=2\\) — die Werte stimmen nicht überein, es liegt ein Sprung der Höhe \\(1\\) vor. <b>Stelle 4:</b> von links liefert der zweite Teilterm \\(4+1=5\\), von rechts der dritte \\(6\\) — ebenfalls ein Sprung. Damit ist \\(f\\) an genau <b>zwei</b> Stellen unstetig. Hätte einer der Teilterme an seiner Nahtstelle denselben Wert geliefert, wäre dort kein Sprung entstanden." },
      { id:18, level:3, typ:"numerisch", frage:"Welche Periode hat \\(f(x)=\\cos(\\pi x)\\)?", loesung:2, toleranz:0.01, tipp:"Die Formel für die Periode gilt für den Kosinus genauso wie für den Sinus; hier steht im Argument ein Faktor, der sich gegen den Zähler kürzt.", loesungsweg:"Auch für \\(\\cos(bx)\\) gilt \\(p=\\frac{2\\pi}{b}\\). Mit \\(b=\\pi\\) kürzt sich die Kreiszahl heraus: $$p = \\frac{2\\pi}{\\pi} = 2$$ Die Kurve wiederholt sich also nach genau zwei Einheiten — ein üblicher Ansatz, wenn ein Vorgang eine ganzzahlige Periode haben soll." },
      // ========== LEVEL 4 — Parameter für stetigen Anschluss, Umkehraufgaben ==========
      { id:19, level:4, typ:"numerisch", frage:"Gegeben ist \\(f(x)=x^2+5\\) für \\(x \\le 2\\) und \\(f(x)=2x+c\\) für \\(x > 2\\). Für welches \\(c\\) ist \\(f\\) an der Stelle \\(2\\) stetig?", loesung:5, toleranz:0.01, tipp:"Werte zuerst den Teilterm aus, der keinen Parameter enthält; sein Wert ist die Zielgröße für den anderen Ast.", loesungsweg:"Der linke Ast liefert an der Nahtstelle $$2^2 + 5 = 9$$ Der rechte Ast muss denselben Wert anstreben: $$2 \\cdot 2 + c = 9 \\;\\Longrightarrow\\; 4 + c = 9 \\;\\Longrightarrow\\; c = 5$$ Probe: der rechte Ast lautet dann \\(2x+5\\) und strebt an der Stelle \\(2\\) ebenfalls gegen \\(9\\). Der Graph läuft dort ohne Sprung durch; ob er auch knickfrei anschließt, ist damit noch nicht gesagt — dafür müssten zusätzlich die Steigungen übereinstimmen." },
      { id:20, level:4, typ:"numerisch", frage:"Gegeben ist \\(f(x)=\\tfrac{1}{2}x+1\\) für \\(x < 4\\) und \\(f(x)=\\sqrt{x}+c\\) für \\(x \\ge 4\\). Für welches \\(c\\) ist \\(f\\) an der Stelle \\(4\\) stetig?", loesung:1, toleranz:0.01, tipp:"Auch hier ist zuerst die Seite ohne Parameter auszuwerten; auf der anderen Seite ist vor dem Gleichsetzen die Wurzel zu ziehen.", loesungsweg:"Der linke Ast strebt an der Nahtstelle gegen $$\\tfrac12 \\cdot 4 + 1 = 3$$ Der rechte Ast liefert dort \\(\\sqrt{4}+c = 2+c\\). Gleichsetzen: $$2 + c = 3 \\;\\Longrightarrow\\; c = 1$$ Probe: mit \\(c=1\\) ist \\(f(4) = 2+1 = 3\\), beide Äste treffen sich also im Punkt \\((4 \\mid 3)\\). Wer die Wurzel übersieht und \\(4+c=3\\) ansetzt, erhält fälschlich \\(c=-1\\)." },
      { id:21, level:4, typ:"numerisch", frage:"Eine Funktion der Form \\(f(x)=\\sin(bx)\\) mit \\(b>0\\) hat die Periode \\(4\\). Bestimme \\(b\\) auf drei Nachkommastellen.", loesung:1.571, toleranz:0.01, tipp:"Stelle die Formel für die Periode nach dem gesuchten Faktor um, statt Werte zu raten.", loesungsweg:"Aus \\(p=\\frac{2\\pi}{b}\\) folgt durch Umstellen $$b = \\frac{2\\pi}{p} = \\frac{2\\pi}{4} = \\frac{\\pi}{2} \\approx 1{,}571$$ Probe: \\(\\sin\\!\\left(\\frac{\\pi}{2}x\\right)\\) hat bei \\(x=4\\) das Argument \\(2\\pi\\) und beginnt dort von neuem. Solche Ansätze braucht man, wenn eine Schwingung eine vorgegebene Dauer haben soll." },
      { id:22, level:4, typ:"mc", frage:"Welche Aussage über \\(f(x)=e^{-x^2}\\) für \\(x \\to \\infty\\) und für \\(x \\to -\\infty\\) trifft zu?", optionen:["Beide Grenzwerte sind \\(0\\); \\(y=0\\) ist Näherungsgerade.","Beide Grenzwerte sind \\(1\\); \\(y=1\\) ist Näherungsgerade.","Nur für \\(x \\to \\infty\\) ist der Grenzwert gleich \\(0\\).","Es gibt in keiner der Richtungen eine Näherungsgerade."], korrekt:0, tipp:"Untersuche zuerst, wie sich der Exponent für betragsgroße \\(x\\) verhält — das Quadrat ist dabei entscheidend.", loesungsweg:"Wegen des Quadrats gilt \\(-x^2 \\to -\\infty\\) sowohl für \\(x \\to \\infty\\) als auch für \\(x \\to -\\infty\\). In beiden Fällen strebt daher $$e^{-x^2} = \\frac{1}{e^{x^2}} \\longrightarrow 0$$ Die Gerade \\(y=0\\) ist also nach beiden Seiten Näherungsgerade. Der Graph ist achsensymmetrisch zur \\(y\\)-Achse, weil der Exponent nur von \\(x^2\\) abhängt; sein höchster Wert ist \\(e^{0}=1\\) an der Stelle \\(0\\)." },
      { id:23, level:4, typ:"numerisch", frage:"Bekannt ist \\(\\lim\\limits_{x \\to 0}\\frac{\\sin x}{x} = 1\\). Mit welchem Wert lässt sich \\(g(x)=\\frac{\\sin(3x)}{x}\\) an der Stelle \\(0\\) stetig fortsetzen?", loesung:3, toleranz:0.01, tipp:"Erweitere den Bruch so, dass im Nenner dasselbe steht wie im Argument des Sinus; der bekannte Grenzwert ist dann anwendbar.", loesungsweg:"Der bekannte Grenzwert passt nur, wenn im Nenner genau das Argument des Sinus steht. Deshalb wird mit \\(3\\) erweitert: $$\\frac{\\sin(3x)}{x} = 3 \\cdot \\frac{\\sin(3x)}{3x}$$ Für \\(x \\to 0\\) strebt auch \\(3x\\) gegen \\(0\\), der zweite Faktor also gegen \\(1\\): $$\\lim_{x \\to 0} g(x) = 3 \\cdot 1 = 3$$ Mit dem Wert \\(3\\) ist \\(g\\) an der Stelle \\(0\\) stetig. Einsetzen der Stelle selbst führt auf \\(\\frac{0}{0}\\) und ist kein Ergebnis." },
      { id:24, level:4, typ:"numerisch", frage:"Eine Funktion hat die Form \\(f(x)=c \\cdot e^{-x}+4\\). Ihr Graph nähert sich für \\(x \\to \\infty\\) der Geraden \\(y=4\\) und schneidet die \\(y\\)-Achse bei \\(10\\). Bestimme \\(c\\).", loesung:6, toleranz:0.01, tipp:"Die Angabe zur Näherungsgeraden ist bei dieser Form bereits erfüllt; die zweite Angabe legt den Parameter fest.", loesungsweg:"Für \\(x \\to \\infty\\) strebt \\(c \\cdot e^{-x}\\) gegen \\(0\\), unabhängig von \\(c\\); die Gerade \\(y=4\\) ergibt sich also für jedes \\(c\\) — diese Angabe bestätigt nur die Form. Den Parameter liefert der Schnittpunkt mit der \\(y\\)-Achse: $$f(0) = c \\cdot e^{0} + 4 = c + 4 = 10 \\;\\Longrightarrow\\; c = 6$$ Zu beachten ist \\(e^{0}=1\\), nicht \\(0\\)." },
      // ========== LEVEL 5 — stetig und differenzierbar, Fehler in einer Begründung ==========
      { id:25, level:5, typ:"numerisch", frage:"Gegeben ist \\(f(x)=x^2\\) für \\(x \\le 1\\) und \\(f(x)=ax+b\\) für \\(x > 1\\). Bestimme \\(a\\) und \\(b\\) so, dass \\(f\\) an der Stelle \\(1\\) stetig <b>und</b> differenzierbar ist, und gib \\(b\\) an.", loesung:-1, toleranz:0.01, tipp:"Zwei Forderungen ergeben zwei Gleichungen: die eine vergleicht die Funktionswerte an der Nahtstelle, die andere die Steigungen.", loesungsweg:"<b>Stetigkeit:</b> die Werte müssen übereinstimmen: $$1^2 = a \\cdot 1 + b \\;\\Longrightarrow\\; a+b = 1$$ <b>Differenzierbarkeit:</b> auch die Steigungen müssen übereinstimmen. Links ist \\(f'(x)=2x\\), also \\(2\\) an der Nahtstelle; rechts ist die Steigung \\(a\\): $$a = 2$$ Einsetzen in die erste Gleichung: $$2 + b = 1 \\;\\Longrightarrow\\; b = -1$$ Der rechte Ast ist also die Tangente \\(y=2x-1\\) an die Parabel im Punkt \\((1 \\mid 1)\\) — genau so sieht ein knickfreier Anschluss aus." },
      { id:26, level:5, typ:"numerisch", frage:"Eine Funktion der Form \\(f(x)=a \\cdot \\sin(bx)+c\\) mit \\(a>0\\) und \\(b>0\\) hat die Periode \\(4\\), den größten Funktionswert \\(9\\) und den kleinsten Funktionswert \\(1\\). Berechne \\(a+c\\).", loesung:9, toleranz:0.01, tipp:"Größter und kleinster Wert liegen symmetrisch zur Mittellinie; aus ihrem Abstand und ihrer Mitte lassen sich zwei der drei Parameter sofort ablesen.", loesungsweg:"Der Sinus schwankt zwischen \\(-1\\) und \\(1\\), also schwankt \\(f\\) zwischen \\(c-a\\) und \\(c+a\\). <b>Amplitude:</b> $$a = \\frac{9-1}{2} = 4$$ <b>Mittellinie:</b> $$c = \\frac{9+1}{2} = 5$$ Damit ist \\(a+c = 9\\). Die Angabe zur Periode legt nur \\(b=\\frac{2\\pi}{4}=\\frac{\\pi}{2}\\) fest und wird für die gesuchte Summe nicht gebraucht — nicht jede Angabe einer Aufgabe muss in die Antwort eingehen." },
      { id:27, level:5, typ:"mc", frage:"Zu \\(f(x)=\\frac{3e^{x}}{e^{x}+2}\\) wird notiert: „Für \\(x \\to \\infty\\) wachsen Zähler und Nenner beide über alle Grenzen, der Graph hat also keine waagerechte Näherungsgerade.“ Wie ist das zu beurteilen?", optionen:["Richtig, beide Teile wachsen unbeschränkt.","Falsch: die Gerade \\(y=3\\) ist Näherungsgerade.","Falsch: die Gerade \\(y=0\\) ist Näherungsgerade.","Falsch: die Gerade \\(y=1{,}5\\) ist Näherungsgerade."], korrekt:1, tipp:"Kürze Zähler und Nenner durch den am stärksten wachsenden Bestandteil; danach lässt sich das Verhalten für große \\(x\\) ablesen.", loesungsweg:"Dass beide Teile wachsen, sagt über den Quotienten noch nichts. Kürzen durch \\(e^{x}\\): $$f(x) = \\frac{3e^{x}}{e^{x}+2} = \\frac{3}{1 + 2e^{-x}}$$ Für \\(x \\to \\infty\\) strebt \\(e^{-x}\\) gegen \\(0\\), der Nenner also gegen \\(1\\): $$f(x) \\longrightarrow 3$$ Die waagerechte Näherungsgerade ist \\(y = 3\\); der Graph nähert sich ihr von unten, denn der Nenner ist stets größer als \\(1\\). Für \\(x \\to -\\infty\\) ergibt sich dagegen \\(y = 0\\) — beide Richtungen sind getrennt zu untersuchen." },
      { id:28, level:5, typ:"mc", frage:"Zu \\(f(x)=\\frac{1}{x}\\) wird notiert: „An der Stelle \\(0\\) ist \\(f\\) unstetig, weil der Graph dort springt.“ Wie ist das zu beurteilen?", optionen:["Richtig, der Graph springt von \\(-\\infty\\) nach \\(+\\infty\\).","Falsch: \\(f\\) ist an der Stelle \\(0\\) gar nicht erklärt.","Falsch: \\(f\\) ist an der Stelle \\(0\\) stetig.","Falsch: es liegt dort eine stetig behebbare Lücke vor."], korrekt:1, tipp:"Prüfe zuerst, ob die Stelle überhaupt zum Definitionsbereich gehört — erst dann ist nach Stetigkeit zu fragen.", loesungsweg:"Stetigkeit ist nur an Stellen des Definitionsbereichs erklärt. Die Stelle \\(0\\) gehört nicht dazu, denn dort ist der Nenner null; die Aussage „unstetig an der Stelle \\(0\\)“ ist deshalb gegenstandslos. Richtig wäre: \\(f\\) ist auf ihrem gesamten Definitionsbereich \\(\\mathbb{R} \\setminus \\{0\\}\\) stetig. Eine stetige Ergänzung ist ebenfalls nicht möglich: von links werden die Werte beliebig klein, von rechts beliebig groß, es gibt also keinen gemeinsamen Grenzwert, den man ergänzen könnte." },
      { id:29, level:5, typ:"numerisch", frage:"Gegeben ist \\(f(x)=ax^2+b\\) für \\(x \\le 2\\) und \\(f(x)=8x\\) für \\(x > 2\\). Für welches \\(a\\) ist \\(f\\) an der Stelle \\(2\\) stetig <b>und</b> differenzierbar?", loesung:2, toleranz:0.01, tipp:"Beginne mit der Bedingung an die Steigungen — sie enthält nur einen der beiden Parameter.", loesungsweg:"<b>Steigungen:</b> links \\(f'(x)=2ax\\), an der Nahtstelle also \\(4a\\); rechts ist die Steigung \\(8\\): $$4a = 8 \\;\\Longrightarrow\\; a = 2$$ <b>Werte:</b> mit \\(a=2\\) liefert der linke Ast \\(8+b\\), der rechte \\(16\\), also \\(b = 8\\). Beide Bedingungen sind damit erfüllt. Die Reihenfolge ist nützlich: die Ableitungsbedingung enthält nur \\(a\\), die Wertebedingung erst danach \\(b\\)." },
      { id:30, level:5, typ:"numerisch", frage:"Gegeben ist \\(f(x)=\\frac{e^{2x}-a}{x}\\) für \\(x \\ne 0\\). Für welches \\(a\\) lässt sich \\(f\\) an der Stelle \\(0\\) stetig fortsetzen?", loesung:1, toleranz:0.01, tipp:"Der Nenner wird an der Stelle \\(0\\) beliebig klein. Eine stetige Fortsetzung ist nur möglich, wenn auch der Zähler dort verschwindet — überlege, was das für \\(a\\) bedeutet.", loesungsweg:"Bleibt der Zähler an der Stelle \\(0\\) von null verschieden, so wächst der Betrag des Bruchs über alle Grenzen und eine stetige Fortsetzung ist ausgeschlossen. Notwendig ist also $$e^{2 \\cdot 0} - a = 0 \\;\\Longrightarrow\\; 1 - a = 0 \\;\\Longrightarrow\\; a = 1$$ Dass es dann auch wirklich klappt, zeigt eine Wertetabelle: für \\(x = 0{,}01\\) liefert \\(\\frac{e^{0{,}02}-1}{0{,}01}\\) rund \\(2{,}02\\), für \\(x = -0{,}01\\) rund \\(1{,}98\\) — die Werte streben von beiden Seiten gegen \\(2\\). Mit dem ergänzten Wert \\(2\\) ist \\(f\\) dann auf ganz \\(\\mathbb{R}\\) stetig. Gefragt war jedoch der Parameter \\(a\\)." },
      // ========== LEVEL 6 — Abi-Format eA: Behauptung prüfen, mehrschrittige Untersuchung ==========
      { id:31, level:6, typ:"mc", frage:"Beurteilen Sie: „Ist \\(f\\) an einer Stelle differenzierbar, so ist \\(f\\) dort auch stetig.“", optionen:["Zutreffend; die Umkehrung gilt jedoch nicht.","Zutreffend; auch die Umkehrung gilt.","Widerlegt durch die Betragsfunktion an der Stelle \\(0\\).","Widerlegt durch jede Funktion mit einer Sprungstelle."], korrekt:0, tipp:"Überlegen Sie, ob an einer Sprungstelle überhaupt eine Tangente existieren kann — und prüfen Sie die Umkehrung an einem Knick.", loesungsweg:"Die Aussage trifft zu. An einer Sprungstelle nähern sich die Werte von links und rechts verschiedenen Zahlen; der Differenzenquotient wächst dann über alle Grenzen, eine Ableitung gibt es dort nicht. Wer also ableiten kann, hat es mit einer stetigen Stelle zu tun. Die <b>Umkehrung</b> gilt nicht: \\(f(x)=|x|\\) ist an der Stelle \\(0\\) stetig, aber wegen des Knicks nicht differenzierbar — die Betragsfunktion widerlegt daher nicht die Aussage selbst, sondern nur ihre Umkehrung. Merksatz: Differenzierbarkeit ist die stärkere Eigenschaft." },
      { id:32, level:6, typ:"numerisch", frage:"Nach einer einmaligen Gabe wird die Masse eines Medikaments im Blut durch \\(m(t)=120 \\cdot e^{-0{,}2t}\\) beschrieben (in Milligramm, \\(t\\) in Stunden). Zeigen Sie, dass die Masse langfristig gegen null geht, und bestimmen Sie den Zeitpunkt, zu dem noch \\(30\\) Milligramm vorhanden sind (in Stunden, auf zwei Nachkommastellen).", loesung:6.93, toleranz:0.05, tipp:"Für den ersten Teil genügt das Verhalten des e-Terms für große \\(t\\); für den zweiten ist eine Exponentialgleichung mit dem natürlichen Logarithmus aufzulösen.", loesungsweg:"<b>Langfristig:</b> für \\(t \\to \\infty\\) strebt \\(e^{-0{,}2t}\\) gegen \\(0\\), also auch \\(m(t)\\). Die Zeitachse \\(m=0\\) ist waagerechte Näherungsgerade; der Wert null wird nie erreicht, das Medikament ist rechnerisch nie vollständig abgebaut. <b>Zeitpunkt:</b> $$120e^{-0{,}2t} = 30 \\;\\Longrightarrow\\; e^{-0{,}2t} = 0{,}25$$ $$-0{,}2t = \\ln 0{,}25 \\;\\Longrightarrow\\; t = \\frac{\\ln 4}{0{,}2} \\approx \\frac{1{,}386}{0{,}2} \\approx 6{,}93$$ Nach rund 6,93 Stunden sind noch 30 Milligramm vorhanden — ein Viertel der Anfangsmasse." },
      { id:33, level:6, typ:"mc", frage:"Beurteilen Sie: „Eine nicht konstante periodische Funktion kann keine waagerechte Näherungsgerade besitzen.“", optionen:["Zutreffend, die Werte wiederholen sich beliebig weit außen.","Nicht haltbar: der Sinus nähert sich der Geraden \\(y=0\\).","Nicht haltbar: jede beschränkte Funktion besitzt eine.","Nur mit dem Zusatz, dass die Funktion stetig ist."], korrekt:0, tipp:"Eine Näherungsgerade verlangt, dass sich die Werte auf Dauer einer festen Zahl annähern. Was bedeutet dagegen Periodizität für weit entfernte Stellen?", loesungsweg:"Die Aussage trifft zu. Eine Näherungsgerade \\(y=b\\) für \\(x \\to \\infty\\) bedeutet, dass der Abstand \\(|f(x)-b|\\) auf Dauer beliebig klein wird. Eine periodische Funktion nimmt jedoch jeden ihrer Werte in jeder Periode erneut an: ist sie nicht konstant, so gibt es zwei Werte \\(u \\ne v\\), die beliebig weit außen immer wieder auftreten. Von <b>beiden</b> kann \\(b\\) nicht beliebig kleinen Abstand haben. Der Sinus schwankt daher für große \\(x\\) unvermindert zwischen \\(-1\\) und \\(1\\). Auf Stetigkeit kommt es dabei nicht an, und beschränkt zu sein genügt umgekehrt nicht." },
      { id:34, level:6, typ:"numerisch", frage:"Die Wassertiefe in einem Hafenbecken wird durch \\(h(t)=4+1{,}5 \\cdot \\sin\\!\\left(\\frac{\\pi}{6}t\\right)\\) beschrieben (in Metern, \\(t\\) in Stunden). Zeigen Sie, dass die Tiefe stets zwischen 2,5 m und 5,5 m liegt, und bestimmen Sie die Dauer eines vollen Tidenzyklus in Stunden.", loesung:12, toleranz:0.05, tipp:"Für die Schranken genügt der größte und der kleinste Wert des Sinus; die Dauer ist die Periode der Funktion.", loesungsweg:"<b>Schranken:</b> der Sinus nimmt nur Werte zwischen \\(-1\\) und \\(1\\) an. Damit gilt $$4 - 1{,}5 \\le h(t) \\le 4 + 1{,}5$$ also \\(2{,}5 \\le h(t) \\le 5{,}5\\); beide Schranken werden auch wirklich erreicht. <b>Dauer:</b> die Periode ist $$p = \\frac{2\\pi}{\\frac{\\pi}{6}} = 2\\pi \\cdot \\frac{6}{\\pi} = 12$$ Ein voller Zyklus dauert also 12 Stunden — das passt zu den beiden Hochwassern eines Tages." },
      { id:35, level:6, typ:"numerisch", frage:"Gegeben ist \\(f(x)=\\frac{e^{2x}-1}{e^{x}-1}\\) für \\(x \\ne 0\\). Zeigen Sie, dass sich der Term vereinfachen lässt, und bestimmen Sie den Wert, mit dem \\(f\\) an der Stelle \\(0\\) stetig fortgesetzt werden kann.", loesung:2, toleranz:0.01, tipp:"Schreiben Sie den Zähler mit Hilfe der dritten binomischen Formel; beachten Sie dabei \\(e^{2x}=\\left(e^{x}\\right)^2\\).", loesungsweg:"<b>Vereinfachen:</b> mit \\(e^{2x}=\\left(e^{x}\\right)^2\\) und der dritten binomischen Formel gilt $$e^{2x}-1 = \\left(e^{x}\\right)^2 - 1^2 = \\left(e^{x}-1\\right)\\left(e^{x}+1\\right)$$ Für \\(x \\ne 0\\) ist \\(e^{x}-1 \\ne 0\\), es darf also gekürzt werden: $$f(x) = e^{x}+1$$ <b>Fortsetzung:</b> dieser Term ist überall stetig und liefert an der Stelle \\(0\\) $$e^{0}+1 = 1+1 = 2$$ Mit dem Wert \\(2\\) ist \\(f\\) auf ganz \\(\\mathbb{R}\\) stetig. Direktes Einsetzen in den Ausgangsterm ergibt dagegen \\(\\frac{0}{0}\\) und ist kein Ergebnis." },
      { id:36, level:6, typ:"mc", frage:"Beurteilen Sie: „Ist \\(f\\) auf ganz \\(\\mathbb{R}\\) erklärt und dort überall stetig, so besitzt ihr Graph keine senkrechte Näherungsgerade.“", optionen:["Zutreffend, an jeder Stelle steht ein fester Funktionswert.","Nicht haltbar: \\(\\frac{1}{x}\\) ist ein Gegenbeispiel.","Nicht haltbar: auch stetige Funktionen haben Polstellen.","Nur mit dem Zusatz, dass \\(f\\) beschränkt ist."], korrekt:0, tipp:"Fragen Sie, was in der Nähe einer senkrechten Näherungsgeraden mit den Funktionswerten geschieht — und ob das mit einem festen Funktionswert an dieser Stelle vereinbar ist.", loesungsweg:"Die Aussage trifft zu. Eine senkrechte Näherungsgerade \\(x=x_0\\) bedeutet, dass der Betrag der Funktionswerte bei Annäherung an \\(x_0\\) über alle Grenzen wächst. Dann kann der Grenzwert dort nicht mit einem Funktionswert übereinstimmen — die Funktion ist an der Stelle also entweder gar nicht erklärt oder dort unstetig. Beides ist nach Voraussetzung ausgeschlossen. Das genannte Gegenbeispiel taugt nicht: \\(\\frac{1}{x}\\) ist an der Stelle \\(0\\) nicht erklärt und damit nicht auf ganz \\(\\mathbb{R}\\) definiert. Auch Beschränktheit ist nicht nötig: \\(f(x)=x\\) ist unbeschränkt und hat dennoch keine senkrechte Näherungsgerade." }];
