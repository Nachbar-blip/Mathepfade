<head>

    <title>Uneigentliche Integrale (LK) - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-lk-integral-uneigentlich';
    const THEMA_CONFIG = { name: 'Uneigentliche Integrale (LK)', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Begriff ==========
      { id:1, level:1, typ:"mc", frage:"Was ist ein uneigentliches Integral?", optionen:["Ein Integral mit unendlicher Grenze oder singulärer Stelle","Ein Integral ohne Lösung","Ein bestimmtes Integral","Ein Flächeninhalt"], korrekt:0, tipp:"Grenzwert einer Stammfunktion.", loesungsweg:"Uneigentlich: \\(\\int_a^\\infty f\\,dx\\) oder \\(\\int_a^b f\\,dx\\) mit Unstetigkeit." },
      { id:2, level:1, typ:"mc", frage:"Wie ist \\(\\int_a^\\infty f(x)\\,dx\\) definiert?", optionen:["\\(\\lim_{b\\to\\infty}\\int_a^b f\\,dx\\)","\\(\\int_a^b f\\,dx\\) mit beliebigem \\(b\\)","\\(f(\\infty)\\)","\\(0\\)"], korrekt:0, tipp:"Grenzwert.", loesungsweg:"\\(\\int_a^\\infty f\\,dx = \\lim_{b\\to\\infty}\\int_a^b f\\,dx\\)." },
      { id:3, level:1, typ:"mc", frage:"Wann heißt ein uneigentliches Integral „konvergent\"?", optionen:["Wenn der Grenzwert existiert und endlich ist","Immer","Wenn Integrand positiv","Wenn Stammfunktion existiert"], korrekt:0, tipp:"Endlicher Limes.", loesungsweg:"Ein uneigentliches Integral wird als Grenzwert erklärt, etwa $$\\int_1^{\\infty} f(x)\\,dx = \\lim_{b \\to \\infty} \\int_1^{b} f(x)\\,dx$$ Konvergent heißt es genau dann, wenn dieser Grenzwert existiert <b>und endlich</b> ist. Dass eine Stammfunktion existiert, genügt nicht — bei \\(\\tfrac1x\\) gibt es eine, der Grenzwert ist aber unendlich." },
      { id:4, level:1, typ:"mc", frage:"\\(\\int_1^\\infty \\tfrac{1}{x}\\,dx\\) ist …", optionen:["konvergent","divergent","\\(=0\\)","\\(=1\\)"], korrekt:1, tipp:"\\(\\ln b\\to\\infty\\).", loesungsweg:"\\(\\int_1^b \\tfrac{1}{x}\\,dx = \\ln b \\to \\infty\\)." },
      { id:5, level:1, typ:"mc", frage:"\\(\\int_1^\\infty \\tfrac{1}{x^2}\\,dx\\) ist …", optionen:["konvergent","divergent","\\(=0\\)","unbestimmt"], korrekt:0, tipp:"\\(-\\tfrac{1}{x}\\to 0\\).", loesungsweg:"\\(\\lim_{b\\to\\infty}(1-\\tfrac{1}{b}) = 1\\)." },
      { id:6, level:1, typ:"numerisch", frage:"Wert von \\(\\int_1^\\infty \\tfrac{1}{x^2}\\,dx\\)?", loesung:1, toleranz:0, tipp:"Stammfkt \\(-\\tfrac{1}{x}\\).", loesungsweg:"\\([-\\tfrac{1}{x}]_1^\\infty = 0 - (-1) = 1\\)." },
      // ========== LEVEL 2 — Potenzfunktionen ==========
      { id:7, level:2, typ:"numerisch", frage:"\\(\\int_1^\\infty x^{-3}\\,dx = ?\\)", loesung:0.5, toleranz:0.01, tipp:"Stammfkt \\(-\\tfrac{1}{2}x^{-2}\\).", loesungsweg:"Stammfunktion von \\(x^{-3}\\) ist \\(-\\tfrac12 x^{-2}\\): $$\\int_1^{b} x^{-3}dx = \\left[-\\tfrac{1}{2x^2}\\right]_1^{b} = \\tfrac12 - \\tfrac{1}{2b^2}$$ Für \\(b \\to \\infty\\) verschwindet der zweite Term: $$\\int_1^{\\infty} x^{-3}dx = \\tfrac12 = 0{,}5$$" },
      { id:8, level:2, typ:"numerisch", frage:"\\(\\int_1^\\infty x^{-4}\\,dx = ?\\) (3 Dez.)", loesung:0.333, toleranz:0.01, tipp:"\\(-\\tfrac{1}{3}x^{-3}\\).", loesungsweg:"Stammfunktion \\(-\\tfrac13 x^{-3}\\): $$\\left[-\\tfrac{1}{3x^3}\\right]_1^{b} = \\tfrac13 - \\tfrac{1}{3b^3} \\;\\longrightarrow\\; \\tfrac13 \\approx 0{,}333$$" },
      { id:9, level:2, typ:"mc", frage:"Für welche \\(p\\) konvergiert \\(\\int_1^\\infty x^{-p}\\,dx\\)?", optionen:["\\(p>1\\)","\\(p<1\\)","\\(p=1\\)","\\(p=0\\)"], korrekt:0, tipp:"Kriterium.", loesungsweg:"Die Stammfunktion von \\(x^{-p}\\) lautet \\(\\frac{x^{1-p}}{1-p}\\). Für \\(b \\to \\infty\\) strebt \\(b^{1-p}\\) nur dann gegen null, wenn der Exponent negativ ist — also \\(1-p < 0\\) beziehungsweise $$p > 1$$ Bei \\(p = 1\\) ergibt sich \\(\\ln b \\to \\infty\\), also Divergenz. Merksatz: Am Unendlichen muss die Funktion <b>schnell genug</b> fallen." },
      { id:10, level:2, typ:"numerisch", frage:"\\(\\int_1^\\infty x^{-p}\\,dx = \\tfrac{1}{p-1}\\) für \\(p=3\\): Wert?", loesung:0.5, toleranz:0.01, tipp:"\\(\\tfrac{1}{2}\\).", loesungsweg:"$$\\int_1^{\\infty} x^{-3}dx = \\frac{1}{p-1} = \\frac{1}{3-1} = \\frac12 = 0{,}5$$ Die Formel fasst die Rechnung aus Aufgabe 7 allgemein zusammen." },
      { id:11, level:2, typ:"mc", frage:"\\(\\int_0^1 x^{-1/2}\\,dx\\) ist …", optionen:["konvergent, Wert 2","divergent","\\(=0\\)","\\(=1\\)"], korrekt:0, tipp:"Stammfkt \\(2\\sqrt{x}\\).", loesungsweg:"Die kritische Stelle ist hier die untere Grenze \\(0\\), wo der Integrand über alle Grenzen wächst. Mit der Stammfunktion \\(2\\sqrt x\\): $$\\lim_{a \\to 0^+}\\left[2\\sqrt x\\right]_a^1 = 2 - 0 = 2$$ Der Grenzwert ist endlich, das Integral also <b>konvergent</b> mit dem Wert \\(2\\)." },
      { id:12, level:2, typ:"numerisch", frage:"\\(\\int_0^1 x^{-1/2}\\,dx = ?\\)", loesung:2, toleranz:0.01, tipp:"\\(2\\sqrt{x}\\).", loesungsweg:"$$\\int_0^1 x^{-1/2}dx = \\left[2\\sqrt x\\right]_0^1 = 2 - 0 = 2$$ Obwohl der Integrand bei \\(0\\) unbeschränkt ist, bleibt die Fläche endlich — sie wird nach oben hin so schmal, dass sie nicht mehr ins Gewicht fällt." },
      // ========== LEVEL 3 — Exponentialfunktionen ==========
      { id:13, level:3, typ:"numerisch", frage:"\\(\\int_0^\\infty e^{-x}\\,dx = ?\\)", loesung:1, toleranz:0.01, tipp:"\\(-e^{-x}\\to 0\\).", loesungsweg:"\\([-e^{-x}]_0^\\infty = 0-(-1) = 1\\)." },
      { id:14, level:3, typ:"numerisch", frage:"\\(\\int_0^\\infty e^{-2x}\\,dx = ?\\)", loesung:0.5, toleranz:0.01, tipp:"\\(-\\tfrac{1}{2}e^{-2x}\\).", loesungsweg:"Stammfunktion \\(-\\tfrac12 e^{-2x}\\): $$\\left[-\\tfrac12 e^{-2x}\\right]_0^{b} = \\tfrac12 - \\tfrac12 e^{-2b} \\;\\longrightarrow\\; \\tfrac12 = 0{,}5$$ Der Faktor \\(\\tfrac12\\) entsteht durch die innere Ableitung." },
      { id:15, level:3, typ:"numerisch", frage:"\\(\\int_0^\\infty 3e^{-3x}\\,dx = ?\\)", loesung:1, toleranz:0.01, tipp:"Dichte Exp-Verteilung.", loesungsweg:"$$\\left[-e^{-3x}\\right]_0^{b} = 1 - e^{-3b} \\;\\longrightarrow\\; 1$$ Das Ergebnis \\(1\\) ist kein Zufall: \\(3e^{-3x}\\) ist die Dichtefunktion der Exponentialverteilung, und die Gesamtwahrscheinlichkeit muss \\(1\\) betragen." },
      { id:16, level:3, typ:"numerisch", frage:"\\(\\int_0^\\infty e^{-x/2}\\,dx = ?\\)", loesung:2, toleranz:0.01, tipp:"\\(-2e^{-x/2}\\).", loesungsweg:"Stammfunktion ist \\(-2e^{-x/2}\\); der Faktor \\(-2\\) ist der Kehrwert der inneren Ableitung \\(-\\tfrac12\\). $$\\left[-2e^{-x/2}\\right]_0^{b} = 2 - 2e^{-b/2}$$ Für \\(b \\to \\infty\\) geht \\(e^{-b/2}\\) gegen null, der Grenzwert ist also $$\\int_0^{\\infty} e^{-x/2}dx = 2$$ Die Fläche ist endlich, obwohl sie sich unendlich weit nach rechts erstreckt — die Funktion fällt schnell genug." },
      { id:17, level:3, typ:"numerisch", frage:"\\(\\int_{-\\infty}^0 e^x\\,dx = ?\\)", loesung:1, toleranz:0.01, tipp:"\\(e^x\\to 0\\) für \\(x\\to-\\infty\\).", loesungsweg:"\\([e^x]_{-\\infty}^0 = 1-0 = 1\\)." },
      { id:18, level:3, typ:"numerisch", frage:"\\(\\int_1^\\infty e^{-x}\\,dx\\) (3 Dez.)?", loesung:0.368, toleranz:0.005, tipp:"\\(e^{-1}\\).", loesungsweg:"$$\\left[-e^{-x}\\right]_1^{b} = e^{-1} - e^{-b} \\;\\longrightarrow\\; e^{-1} \\approx 0{,}368$$" },
      // ========== LEVEL 4 — Singularitäten ==========
      { id:19, level:4, typ:"mc", frage:"\\(\\int_0^1 \\ln x\\,dx\\) — singulär bei \\(x=0\\). Konvergent?", optionen:["Ja, Wert \\(-1\\)","Divergent","Wert \\(0\\)","Wert \\(1\\)"], korrekt:0, tipp:"\\(x\\ln x\\to 0\\).", loesungsweg:"\\([x\\ln x - x]_0^1 = -1-0 = -1\\)." },
      { id:20, level:4, typ:"numerisch", frage:"\\(\\int_0^1 \\ln x\\,dx = ?\\)", loesung:-1, toleranz:0.01, tipp:"Partielle Integration.", loesungsweg:"Partielle Integration mit \\(u = \\ln x\\), \\(v' = 1\\): $$\\int \\ln x\\,dx = x\\ln x - x$$ $$\\lim_{a \\to 0^+}\\left[x\\ln x - x\\right]_a^1 = (0 - 1) - 0 = -1$$ Dass \\(a\\ln a \\to 0\\) strebt, ist der entscheidende Schritt: Das \\(a\\) geht schneller gegen null, als \\(\\ln a\\) gegen \\(-\\infty\\) geht. Das negative Vorzeichen passt — der Graph liegt auf \\((0;1)\\) unterhalb der Achse." },
      { id:21, level:4, typ:"mc", frage:"\\(\\int_0^1 \\tfrac{1}{x}\\,dx\\) konvergent?", optionen:["Ja","Nein, divergent","\\(=1\\)","\\(=0\\)"], korrekt:1, tipp:"\\(\\ln\\) divergiert bei 0.", loesungsweg:"\\(\\ln x\\to -\\infty\\) für \\(x\\to 0^+\\)." },
      { id:22, level:4, typ:"numerisch", frage:"\\(\\int_0^1 x^{-3/4}\\,dx = ?\\)", loesung:4, toleranz:0.02, tipp:"\\(4x^{1/4}\\).", loesungsweg:"Stammfunktion: \\(\\frac{x^{1/4}}{1/4} = 4x^{1/4}\\). $$\\left[4x^{1/4}\\right]_0^1 = 4 - 0 = 4$$" },
      { id:23, level:4, typ:"mc", frage:"Für welche \\(p\\) konvergiert \\(\\int_0^1 x^{-p}\\,dx\\)?", optionen:["\\(p>1\\)","\\(p<1\\)","\\(p=1\\)","\\(p=0\\)"], korrekt:1, tipp:"Umgekehrt zum Unendlichen.", loesungsweg:"Hier liegt die kritische Stelle bei \\(0\\). Die Stammfunktion \\(\\frac{x^{1-p}}{1-p}\\) bleibt für \\(x \\to 0\\) nur dann endlich, wenn der Exponent positiv ist — also \\(1-p > 0\\) beziehungsweise $$p < 1$$ Das ist genau die umgekehrte Bedingung wie am Unendlichen: Bei null darf die Funktion nicht <b>zu schnell</b> wachsen, im Unendlichen muss sie schnell genug fallen. Für \\(p = 1\\) divergiert das Integral in beiden Fällen." },
      { id:24, level:4, typ:"numerisch", frage:"\\(\\int_0^4 \\tfrac{1}{\\sqrt{x}}\\,dx = ?\\)", loesung:4, toleranz:0.02, tipp:"\\(2\\sqrt{x}\\).", loesungsweg:"$$\\int_0^4 x^{-1/2}dx = \\left[2\\sqrt x\\right]_0^4 = 2 \\cdot 2 - 0 = 4$$" },
      // ========== LEVEL 5 — partielle Integration ==========
      { id:25, level:5, typ:"numerisch", frage:"\\(\\int_0^\\infty x e^{-x}\\,dx = ?\\) (partielle Integration)", loesung:1, toleranz:0.01, tipp:"\\(\\Gamma(2)=1\\).", loesungsweg:"Partiell: \\([-xe^{-x}]_0^\\infty + \\int_0^\\infty e^{-x}\\,dx = 0 + 1 = 1\\)." },
      { id:26, level:5, typ:"numerisch", frage:"\\(\\int_0^\\infty x^2 e^{-x}\\,dx = ?\\)", loesung:2, toleranz:0.02, tipp:"\\(\\Gamma(3) = 2!\\).", loesungsweg:"Zweimal partiell integrieren, jedes Mal sinkt der Exponent von \\(x\\) um eins: $$\\int_0^{\\infty} x^2 e^{-x}dx = 2! = 2$$ Allgemein gilt \\(\\int_0^{\\infty} x^n e^{-x}dx = n!\\) — die Exponentialfunktion fällt schneller als jede Potenz wächst, deshalb konvergiert das Integral für jedes \\(n\\)." },
      { id:27, level:5, typ:"numerisch", frage:"\\(\\int_0^\\infty x e^{-2x}\\,dx = ?\\)", loesung:0.25, toleranz:0.01, tipp:"\\(\\tfrac{1}{2^2}\\).", loesungsweg:"Partielle Integration mit \\(u = x\\), \\(v' = e^{-2x}\\): $$\\int_0^{\\infty} x e^{-2x}dx = \\frac{1}{2^2} = \\frac14 = 0{,}25$$ Allgemein ist \\(\\int_0^{\\infty} x e^{-ax}dx = \\frac{1}{a^2}\\)." },
      { id:28, level:5, typ:"numerisch", frage:"\\(\\int_1^\\infty \\tfrac{\\ln x}{x^2}\\,dx = ?\\) (partielle Integration)", loesung:1, toleranz:0.02, tipp:"\\(u=\\ln x, dv=x^{-2}dx\\).", loesungsweg:"\\([-\\tfrac{\\ln x}{x}]_1^\\infty + \\int_1^\\infty \\tfrac{1}{x^2}\\,dx = 0+1 = 1\\)." },
      { id:29, level:5, typ:"numerisch", frage:"\\(\\int_0^\\infty e^{-x}\\sin x\\,dx = ?\\) (2 Dez.)", loesung:0.5, toleranz:0.02, tipp:"Zweifach partiell, Standardresultat \\(\\tfrac{1}{2}\\).", loesungsweg:"Zweimalige partielle Integration führt auf das Ausgangsintegral zurück; Auflösen nach ihm liefert $$\\int_0^{\\infty} e^{-ax}\\sin(bx)\\,dx = \\frac{b}{a^2+b^2}$$ Mit \\(a = b = 1\\): \\(\\frac{1}{1+1} = 0{,}5\\). Der Trick, die gesuchte Größe als Unbekannte zu behandeln, ist hier der Kern." },
      { id:30, level:5, typ:"numerisch", frage:"\\(\\int_0^\\infty e^{-x}\\cos x\\,dx = ?\\) (2 Dez.)", loesung:0.5, toleranz:0.02, tipp:"Analog, \\(\\tfrac{a}{a^2+b^2}\\) mit \\(a=b=1\\).", loesungsweg:"Dieselbe Rechnung mit Kosinus liefert $$\\int_0^{\\infty} e^{-ax}\\cos(bx)\\,dx = \\frac{a}{a^2+b^2}$$ Mit \\(a = b = 1\\): \\(\\frac{1}{2} = 0{,}5\\). Zähler ist hier \\(a\\) statt \\(b\\) — das ist der einzige Unterschied zur Sinusformel." },
      // ========== LEVEL 6 — Transfer ==========
      { id:31, level:6, typ:"numerisch", frage:"\\(\\int_2^\\infty \\tfrac{1}{x(\\ln x)^2}\\,dx = ?\\) (3 Dez.)", loesung:1.443, toleranz:0.05, tipp:"Substitution \\(u=\\ln x\\).", loesungsweg:"Substitution \\(u = \\ln x\\) mit \\(du = \\tfrac1x dx\\) verwandelt das Integral in ein einfaches: $$\\int_{\\ln 2}^{\\infty} u^{-2}\\,du = \\left[-\\tfrac1u\\right]_{\\ln 2}^{\\infty} = \\frac{1}{\\ln 2} \\approx 1{,}443$$ Die neuen Grenzen ergeben sich aus \\(u(2) = \\ln 2\\) und \\(u \\to \\infty\\) für \\(x \\to \\infty\\)." },
      { id:32, level:6, typ:"mc", frage:"\\(\\int_{-\\infty}^\\infty e^{-x^2}\\,dx\\) ist …", optionen:["\\(\\sqrt{\\pi}\\)","\\(\\pi\\)","\\(e\\)","\\(\\infty\\)"], korrekt:0, tipp:"Gaußsches Integral.", loesungsweg:"Das Gaußsche Integral lässt sich mit den Mitteln der Schule nicht elementar berechnen — eine Stammfunktion von \\(e^{-x^2}\\) existiert nicht in geschlossener Form. Der Wert ist $$\\int_{-\\infty}^{\\infty} e^{-x^2}dx = \\sqrt{\\pi}$$ Er ist der Grund für den Normierungsfaktor \\(\\frac{1}{\\sigma\\sqrt{2\\pi}}\\) in der Dichte der Normalverteilung." },
      { id:33, level:6, typ:"numerisch", frage:"\\(\\int_0^\\infty \\tfrac{1}{1+x^2}\\,dx = ?\\) (2 Dez.)", loesung:1.57, toleranz:0.02, tipp:"\\(\\arctan x\\).", loesungsweg:"Stammfunktion ist der Arkustangens: $$\\left[\\arctan x\\right]_0^{b} = \\arctan b - 0 \\;\\longrightarrow\\; \\frac{\\pi}{2} \\approx 1{,}57$$ denn \\(\\arctan b\\) strebt für \\(b \\to \\infty\\) gegen \\(\\tfrac{\\pi}{2}\\)." },
      { id:34, level:6, typ:"numerisch", frage:"\\(\\int_{-\\infty}^\\infty \\tfrac{1}{1+x^2}\\,dx = ?\\) (2 Dez.)", loesung:3.14, toleranz:0.02, tipp:"\\(\\pi\\).", loesungsweg:"Der Integrand ist achsensymmetrisch, das Integral also doppelt so groß wie von \\(0\\) bis \\(\\infty\\): $$2 \\cdot \\frac{\\pi}{2} = \\pi \\approx 3{,}14$$" },
      { id:35, level:6, typ:"numerisch", frage:"\\(\\int_0^\\infty 2x e^{-x^2}\\,dx = ?\\)", loesung:1, toleranz:0.01, tipp:"Substitution \\(u=x^2\\).", loesungsweg:"Substitution \\(u = x^2\\) mit \\(du = 2x\\,dx\\) — der Faktor \\(2x\\) steht bereits da: $$\\int_0^{\\infty} e^{-u}\\,du = \\left[-e^{-u}\\right]_0^{\\infty} = 1$$ Solche Integrale erkennt man daran, dass die innere Ableitung als Faktor vorhanden ist." },
      { id:36, level:6, typ:"mc", frage:"\\(\\int_1^\\infty \\tfrac{1}{x\\ln x}\\,dx\\) ist …", optionen:["konvergent","divergent","\\(=0\\)","\\(=1\\)"], korrekt:1, tipp:"Substitution \\(u=\\ln x\\) → \\(\\int \\tfrac{1}{u}\\,du\\).", loesungsweg:"Divergent: \\(\\int \\tfrac{1}{u}\\,du = \\ln u \\to\\infty\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
