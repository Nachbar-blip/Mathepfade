<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-ebenen';
    const THEMA_CONFIG = { name: 'Ebenen im Raum', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Parameterform einer Ebene \\(E\\):", optionen: ["\\(\\vec x = \\vec a + t\\vec u\\)", "\\(\\vec x = \\vec a + t\\vec u + s\\vec v\\)", "\\(\\vec x = t\\vec u \\cdot s\\vec v\\)", "\\(\\vec x = \\vec u + \\vec v\\)"], korrekt: 1, tipp: "Aufpunkt + zwei Richtungsvektoren.", loesungsweg: "Eine Ebene ist zweidimensional, man braucht also einen Aufpunkt und <b>zwei</b> linear unabhängige Richtungsvektoren: $$E: \\vec x = \\vec a + t\\vec u + s\\vec v$$ Mit nur einem Richtungsvektor entstünde eine Gerade; die beiden Parameter \\(t\\) und \\(s\\) durchlaufen unabhängig voneinander ganz \\(\\mathbb{R}\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Wie viele Punkte legen eine Ebene eindeutig fest?", optionen: ["Zwei", "Drei (nicht auf einer Geraden)", "Vier", "Eins"], korrekt: 1, tipp: "Drei nicht-kollineare Punkte.", loesungsweg: "Drei nicht-kollineare Punkte bestimmen genau eine Ebene." },
      { id: 3, level: 1, typ: "mc", frage: "Der Normalenvektor \\(\\vec n\\) einer Ebene ist:", optionen: ["parallel zur Ebene", "senkrecht zur Ebene", "ein Richtungsvektor", "beliebig"], korrekt: 1, tipp: "Orthogonal zu beiden Spannvektoren.", loesungsweg: "Der Normalenvektor steht <b>senkrecht</b> auf der Ebene und damit senkrecht auf jedem Vektor, der in ihr liegt: $$\\vec n \\perp \\vec u \\quad\\text{und}\\quad \\vec n \\perp \\vec v$$ Gleichbedeutend: \\(\\vec n \\cdot \\vec u = 0\\) und \\(\\vec n \\cdot \\vec v = 0\\). Berechnen lässt er sich als Kreuzprodukt \\(\\vec u \\times \\vec v\\)." },
      { id: 4, level: 1, typ: "mc", frage: "Koordinatenform einer Ebene:", optionen: ["\\(ax + by + cz = d\\)", "\\(ax^2 + by^2 = d\\)", "\\(\\vec x \\cdot \\vec u = 0\\)", "\\(x + y + z = \\vec a\\)"], korrekt: 0, tipp: "Lineare Gleichung.", loesungsweg: "$$E: ax + by + cz = d$$<br>wobei \\(\\vec n = \\begin{pmatrix}a\\\\b\\\\c\\end{pmatrix}\\) Normalenvektor ist." },
      { id: 5, level: 1, typ: "mc", frage: "Normalenform einer Ebene:", optionen: ["\\(\\vec n \\cdot (\\vec x - \\vec a) = 0\\)", "\\(\\vec x = \\vec n\\)", "\\(\\vec n + \\vec x = 0\\)", "\\(|\\vec n| = 1\\)"], korrekt: 0, tipp: "Skalarprodukt = 0.", loesungsweg: "Ein Punkt \\(\\vec x\\) liegt genau dann in der Ebene, wenn der Verbindungsvektor \\(\\vec x - \\vec a\\) vom Aufpunkt aus in der Ebene verläuft — also senkrecht auf \\(\\vec n\\) steht: $$E: \\vec n \\cdot (\\vec x - \\vec a) = 0$$ Das Skalarprodukt zweier zueinander senkrechter Vektoren ist null; genau darauf beruht die Normalenform." },
      { id: 6, level: 1, typ: "mc", frage: "Aus Koordinatenform \\(2x+3y-z=5\\): Normalenvektor?", optionen: ["\\(\\begin{pmatrix}5\\\\5\\\\5\\end{pmatrix}\\)", "\\(\\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}\\)", "\\(\\begin{pmatrix}2\\\\3\\\\1\\end{pmatrix}\\)", "\\(\\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix}\\)"], korrekt: 1, tipp: "Koeffizienten von \\(x,y,z\\).", loesungsweg: "Die Koordinatenform \\(2x+3y-z=5\\) ist die ausmultiplizierte Normalenform. Die Koeffizienten vor \\(x\\), \\(y\\) und \\(z\\) sind gerade die Komponenten des Normalenvektors: $$\\vec n = \\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}$$ Das Vorzeichen der dritten Komponente gehört dazu; die rechte Seite \\(5\\) spielt dabei keine Rolle — sie verschiebt die Ebene nur parallel." },
      // LEVEL 2 -- Punktprobe
      { id: 7, level: 2, typ: "mc", frage: "Liegt \\(P(1|2|3)\\) in \\(E: x+y+z=6\\)?", optionen: ["Ja", "Nein", "Nur bei \\(x<0\\)", "Unentscheidbar"], korrekt: 0, tipp: "Einsetzen.", loesungsweg: "Punktprobe durch Einsetzen der Koordinaten: $$1 + 2 + 3 = 6$$ Das stimmt mit der rechten Seite überein, also liegt \\(P\\) in \\(E\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Liegt \\(P(1|1|1)\\) in \\(E: 2x-y+z=1\\)?", optionen: ["Ja", "Nein", "Nur bei \\(x=2\\)", "Unentscheidbar"], korrekt: 1, tipp: "\\(2-1+1=2 \\neq 1\\).", loesungsweg: "Einsetzen von \\(P(1|1|1)\\): $$2 \\cdot 1 - 1 + 1 = 2 \\ne 1$$ Die Gleichung ist nicht erfüllt, \\(P\\) liegt also <b>nicht</b> in \\(E\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(P(a|1|2)\\) liegt in \\(E: x+y-z=0\\). Bestimme \\(a\\).", loesung: 1, toleranz: 0, tipp: "\\(a+1-2=0\\).", loesungsweg: "Punktprobe mit der Unbekannten: $$a + 1 - 2 = 0 \\;\\Rightarrow\\; a - 1 = 0 \\;\\Rightarrow\\; a = 1$$ Probe: \\(1+1-2 = 0\\) ✓" },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(P(2|k|1)\\) liegt in \\(E: x-y+2z=0\\). Bestimme \\(k\\).", loesung: 4, toleranz: 0, tipp: "\\(2-k+2=0\\).", loesungsweg: "Einsetzen von \\(P(2|k|1)\\) in \\(x-y+2z=0\\): $$2 - k + 2 \\cdot 1 = 0 \\;\\Rightarrow\\; 4 - k = 0 \\;\\Rightarrow\\; k = 4$$ Der Faktor \\(2\\) vor \\(z\\) darf nicht vergessen werden." },
      { id: 11, level: 2, typ: "mc", frage: "\\(xy\\)-Ebene in Koordinatenform:", optionen: ["\\(x=0\\)", "\\(y=0\\)", "\\(z=0\\)", "\\(x+y+z=0\\)"], korrekt: 2, tipp: "Höhe 0.", loesungsweg: "Die \\(xy\\)-Ebene besteht aus allen Punkten der Höhe null; \\(x\\) und \\(y\\) sind dabei beliebig: $$z = 0$$ Der Normalenvektor ist entsprechend \\(\\vec n = (0;0;1)\\) — er zeigt in die fehlende Richtung." },
      { id: 12, level: 2, typ: "mc", frage: "\\(xz\\)-Ebene in Koordinatenform:", optionen: ["\\(x=0\\)", "\\(y=0\\)", "\\(z=0\\)", "\\(x=z\\)"], korrekt: 1, tipp: "ohne \\(y\\).", loesungsweg: "In der \\(xz\\)-Ebene ist die verbleibende Koordinate null: $$y = 0$$ Merkregel: In der Gleichung steht immer die Koordinate, die <b>nicht</b> im Namen vorkommt." },
      // LEVEL 3 -- Spurpunkte / Achsenabschnitte
      { id: 13, level: 3, typ: "numerisch", frage: "Spurpunkt von \\(E: 2x+3y+6z=12\\) mit \\(x\\)-Achse. \\(x\\)-Wert:", loesung: 6, toleranz: 0, tipp: "\\(y=z=0 \\Rightarrow 2x=12\\).", loesungsweg: "Auf der \\(x\\)-Achse sind \\(y\\) und \\(z\\) null. Einsetzen in \\(2x+3y+6z=12\\): $$2x = 12 \\;\\Rightarrow\\; x = 6$$ Der Spurpunkt ist \\(S_x(6|0|0)\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Spurpunkt von \\(E: x+2y+4z=8\\) mit \\(y\\)-Achse. \\(y\\)-Wert:", loesung: 4, toleranz: 0, tipp: "\\(x=z=0\\).", loesungsweg: "Mit \\(x = z = 0\\) in \\(x+2y+4z=8\\): $$2y = 8 \\;\\Rightarrow\\; y = 4$$ Der Spurpunkt ist \\(S_y(0|4|0)\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Spurpunkt von \\(E: x+y+z=9\\) mit \\(z\\)-Achse. \\(z\\)-Wert:", loesung: 9, toleranz: 0, tipp: "\\(x=y=0\\).", loesungsweg: "Mit \\(x = y = 0\\) in \\(x+y+z=9\\): $$z = 9$$ Der Spurpunkt ist \\(S_z(0|0|9)\\). Die drei Spurpunkte einer Ebene bestimmen das Spurdreieck, das sich gut zum Zeichnen eignet." },
      { id: 16, level: 3, typ: "mc", frage: "Ebene \\(E\\) mit Achsenabschnitten 2, 3, 6. Welche Gleichung?", optionen: ["\\(2x+3y+6z=1\\)", "\\(\\frac{x}{2}+\\frac{y}{3}+\\frac{z}{6}=1\\)", "\\(6x+3y+2z=1\\)", "\\(x+y+z=11\\)"], korrekt: 1, tipp: "Achsenabschnittsform.", loesungsweg: "$$\\frac{x}{a}+\\frac{y}{b}+\\frac{z}{c}=1 \\Rightarrow \\frac{x}{2}+\\frac{y}{3}+\\frac{z}{6}=1$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "\\(E: 3x + y + 2z = 6\\). \\(x\\)-Achsenabschnitt:", loesung: 2, toleranz: 0, tipp: "\\(y=z=0 \\Rightarrow 3x=6\\).", loesungsweg: "Der \\(x\\)-Achsenabschnitt ist die \\(x\\)-Koordinate des Spurpunkts mit der \\(x\\)-Achse, also \\(y = z = 0\\): $$3x = 6 \\;\\Rightarrow\\; x = 2$$" },
      { id: 18, level: 3, typ: "mc", frage: "Liegt Ursprung \\((0|0|0)\\) auf \\(E: 2x-3y+z=0\\)?", optionen: ["Ja", "Nein", "Nur bei positivem \\(d\\)", "Unentscheidbar"], korrekt: 0, tipp: "\\(d=0\\).", loesungsweg: "Einsetzen von \\((0|0|0)\\): $$2 \\cdot 0 - 3 \\cdot 0 + 0 = 0$$ Die Gleichung ist erfüllt. Allgemein gilt: Eine Ebene geht genau dann durch den Ursprung, wenn die rechte Seite \\(d = 0\\) ist — hier muss man gar nicht rechnen." },
      // LEVEL 4 -- Lage Gerade-Ebene
      { id: 19, level: 4, typ: "mc", frage: "Schnitt Gerade-Ebene: Wie vorgehen?", optionen: ["Geradengleichung in \\(E\\) einsetzen", "Die Richtungsvektoren beider addieren", "Die beiden Aufpunkte gleichsetzen", "Das ist grundsätzlich nicht möglich"], korrekt: 0, tipp: "\\(t\\) bestimmen.", loesungsweg: "Setze die Parametergleichung der Geraden koordinatenweise in die Koordinatenform der Ebene ein und löse nach \\(t\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\), \\(E: x+y+z=6\\). Bestimme \\(t\\).", loesung: 1.667, toleranz: 0.01, tipp: "\\((1+t)+t+t=6\\).", loesungsweg: "Einsetzen von \\(g\\) in \\(E\\): \\((1+t)+t+t = 1+3t = 6 \\Rightarrow 3t=5 \\Rightarrow t=\\tfrac{5}{3} \\approx 1{,}67\\)." },
      { id: 21, level: 4, typ: "mc", frage: "Wann liegt Gerade \\(g\\) parallel zur Ebene \\(E\\) (ohne drin zu liegen)?", optionen: ["\\(\\vec u_g \\cdot \\vec n = 0\\) und \\(A \\notin E\\)", "\\(\\vec u_g = \\vec n\\) und \\(A \\in E\\)", "\\(\\vec u_g \\cdot \\vec n \\neq 0\\) für alle \\(A\\)", "für beliebige Lage von \\(g\\)"], korrekt: 0, tipp: "Richtung senkrecht zu \\(\\vec n\\).", loesungsweg: "Eine Gerade verläuft parallel zur Ebene, wenn ihre Richtung keine Komponente senkrecht zur Ebene hat, ihr Richtungsvektor also senkrecht auf \\(\\vec n\\) steht: $$\\vec u_g \\cdot \\vec n = 0$$ Diese Bedingung allein genügt aber nicht — sie gilt auch, wenn die Gerade <b>in</b> der Ebene liegt. Deshalb muss zusätzlich der Aufpunkt geprüft werden: \\(A \\notin E\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Wenn \\(\\vec u_g \\cdot \\vec n = 0\\) und Aufpunkt der Geraden in \\(E\\):", optionen: ["Gerade schneidet \\(E\\)", "Gerade liegt in \\(E\\)", "Gerade parallel zu \\(E\\)", "windschief"], korrekt: 1, tipp: "Richtung + Punkt in Ebene.", loesungsweg: "Alle Punkte liegen in \\(E\\), also \\(g \\subset E\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\), \\(E: x+y+z=3\\). Schnittpunkt: \\(t = ?\\)", loesung: 1, toleranz: 0, tipp: "\\(t+t+t=3\\).", loesungsweg: "\\(3t=3 \\Rightarrow t=1\\). \\(S=(1|1|1)\\)." },
      { id: 24, level: 4, typ: "mc", frage: "\\(g: \\vec u_g = \\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}\\), \\(E\\) mit \\(\\vec n = \\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}\\). Beziehung?", optionen: ["parallel oder in \\(E\\)", "sie schneiden sich stets", "orthogonal zueinander", "das ist unbestimmt"], korrekt: 0, tipp: "\\(\\vec u_g \\cdot \\vec n = 0\\).", loesungsweg: "Skalarprodukt \\(= 0\\), also verläuft die Gerade parallel zu \\(E\\) oder liegt in \\(E\\)." },
      // LEVEL 5 -- Umwandlung der Formen, Parameter, Fehlersuche
      { id: 25, level: 5, typ: "numerisch", frage: "\\(E: \\vec x = \\begin{pmatrix}2\\\\1\\\\0\\end{pmatrix}+r\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}+s\\begin{pmatrix}0\\\\1\\\\1\\end{pmatrix}\\). Die Koordinatenform lautet \\(x-y+z = d\\). Bestimmen Sie \\(d\\):", loesung: 1, toleranz: 0, tipp: "Der Normalenvektor steht auf beiden Spannvektoren senkrecht; der Aufpunkt legt danach die rechte Seite fest.", loesungsweg: "Der Normalenvektor \\(\\begin{pmatrix}1\\\\-1\\\\1\\end{pmatrix}\\) erfüllt \\(1-1+0 = 0\\) und \\(0-1+1 = 0\\), steht also auf beiden Spannvektoren senkrecht. Aufpunkt einsetzen: \\(d = 2-1+0 = 1\\), somit \\(E: x-y+z = 1\\). Probe mit einem weiteren Ebenenpunkt, etwa \\((3|2|0)\\) für \\(r = 1\\): \\(3-2+0 = 1\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Die Ebene \\(E\\) geht durch \\(A(2|0|0)\\), \\(B(0|4|0)\\) und \\(C(0|0|-4)\\). Für welches \\(k\\) liegt \\(P(1|k|-1)\\) in \\(E\\)?", loesung: 1, toleranz: 0, tipp: "Aus den drei Achsenschnittpunkten lässt sich die Koordinatenform unmittelbar aufbauen; danach eine Punktprobe.", loesungsweg: "Achsenabschnittsform: \\(\\tfrac{x}{2}+\\tfrac{y}{4}+\\tfrac{z}{-4} = 1\\); mit 4 multipliziert \\(2x+y-z = 4\\). Punktprobe: \\(2 \\cdot 1 + k - (-1) = 4\\), also \\(k+3 = 4\\) und \\(k = 1\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für welches \\(a\\) verläuft \\(g: \\vec x = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}2\\\\a\\\\1\\end{pmatrix}\\) echt parallel zu \\(E: x+2y-4z = 5\\)?", loesung: 1, toleranz: 0, tipp: "Zwei Bedingungen: die Richtung darf keine Komponente senkrecht zur Ebene haben, und der Aufpunkt darf nicht in der Ebene liegen.", loesungsweg: "Parallel heißt \\(\\vec u \\cdot \\vec n = 0\\): \\(2+2a-4 = 0\\), also \\(a = 1\\). Zweite Bedingung: der Aufpunkt \\((1|0|0)\\) liefert \\(1+0-0 = 1 \\neq 5\\), liegt also nicht in \\(E\\). Damit ist \\(g\\) für \\(a = 1\\) echt parallel; ohne diese zweite Prüfung könnte \\(g\\) auch in \\(E\\) liegen." },
      { id: 28, level: 5, typ: "numerisch", frage: "Ein Schüler bestimmt den Schnittpunkt von \\(g: \\vec x = \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}+t\\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix}\\) mit \\(E: 2x-y+z = 6\\) und rechnet \\(2(1+t)+1+(1+2t) = 6\\), also \\(t = 0{,}5\\). Bestimmen Sie den richtigen Wert von \\(t\\):", loesung: 1, toleranz: 0, tipp: "Achte beim Einsetzen auf die Vorzeichen der Koordinatenform — jede Koordinate behält ihren eigenen Faktor.", loesungsweg: "Richtig ist \\(2(1+t)-1+(1+2t) = 6\\), denn in \\(E\\) steht \\(-y\\). Das ergibt \\(4t+2 = 6\\), also \\(t = 1\\) und \\(S(2|1|3)\\); Probe: \\(4-1+3 = 6\\). Der Schüler hat \\(-y\\) als \\(+y\\) eingesetzt; sein \\(t = 0{,}5\\) führt auf \\((1{,}5|1|2)\\) mit \\(3-1+2 = 4 \\neq 6\\), liegt also nicht in \\(E\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Die Ebene \\(E\\) enthält die Gerade \\(g: \\vec x = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\) und den Punkt \\(P(0|0|2)\\). Ihre Koordinatenform ist \\(2x+by+cz = d\\). Bestimmen Sie \\(c\\):", loesung: 1, toleranz: 0, tipp: "Eine Gerade liegt ganz in der Ebene, wenn ihre Richtung senkrecht zum Normalenvektor steht und ihr Aufpunkt die Gleichung erfüllt.", loesungsweg: "Die Richtung \\(\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\) muss senkrecht zum Normalenvektor sein, also \\(b = 0\\). Aufpunkt von \\(g\\): \\(2 \\cdot 1 = d\\), somit \\(d = 2\\). Punkt \\(P\\): \\(c \\cdot 2 = 2\\), somit \\(c = 1\\). Die Ebene ist \\(E: 2x+z = 2\\); alle Geradenpunkte \\((1|t|0)\\) erfüllen sie." },
      { id: 30, level: 5, typ: "numerisch", frage: "Für welches \\(k\\) sind \\(E_1: x+y+kz = 3\\) und \\(E_2: 2x+2y+6z = 12\\) echt parallel, also nicht identisch?", loesung: 3, toleranz: 0, tipp: "Erst die Normalenvektoren auf Kollinearität prüfen, dann die rechten Seiten vergleichen.", loesungsweg: "Kollineare Normalen: \\(\\begin{pmatrix}1\\\\1\\\\k\\end{pmatrix} = \\tfrac{1}{2}\\begin{pmatrix}2\\\\2\\\\6\\end{pmatrix}\\) fordert \\(k = 3\\). Dann lautet \\(E_1: x+y+3z = 3\\), und \\(E_2\\) durch 2 geteilt \\(x+y+3z = 6\\): gleiche linke Seite, verschiedene rechte Seite, also echt parallel. Identisch wären sie nur, wenn auch die rechten Seiten übereinstimmten." },
      // LEVEL 6 -- Abi-Format: Dach, Hang, Schatten, Graben
      { id: 31, level: 6, typ: "numerisch", frage: "Ein Pultdach hat die Ecken \\(A(0|0|3)\\), \\(B(8|0|3)\\), \\(C(8|6|6)\\) und \\(D(0|6|6)\\) (Angaben in Metern). Zeigen Sie, dass alle vier Punkte in einer Ebene liegen, und geben Sie \\(d\\) in der Koordinatenform \\(2z-y = d\\) an:", loesung: 6, toleranz: 0, tipp: "Bestimme die Ebene aus drei der Punkte und prüfe den vierten durch eine Punktprobe.", loesungsweg: "Aus \\(A\\), \\(B\\), \\(D\\): \\(\\vec{AB} = \\begin{pmatrix}8\\\\0\\\\0\\end{pmatrix}\\) und \\(\\vec{AD} = \\begin{pmatrix}0\\\\6\\\\3\\end{pmatrix}\\). Der Vektor \\(\\begin{pmatrix}0\\\\-1\\\\2\\end{pmatrix}\\) steht auf beiden senkrecht (\\(0\\) bzw. \\(-6+6 = 0\\)). Mit \\(A\\): \\(d = -0+2 \\cdot 3 = 6\\), also \\(E: 2z-y = 6\\). Punktprobe für \\(C\\): \\(2 \\cdot 6 - 6 = 6\\) — stimmt, alle vier Punkte liegen in \\(E\\), die Dachfläche ist eben." },
      { id: 32, level: 6, typ: "mc", frage: "Beurteilen Sie: Enthält die Koordinatenform einer Ebene kein \\(z\\), so ist die Ebene parallel zur \\(z\\)-Achse oder enthält sie.", optionen: ["Richtig, der Normalenvektor hat keine \\(z\\)-Komponente", "Falsch, eine solche Ebene ist stets die \\(xy\\)-Ebene", "Falsch, sie steht dann senkrecht zur \\(z\\)-Achse", "Richtig, aber nur wenn zusätzlich \\(d = 0\\) gilt"], korrekt: 0, tipp: "Überlege, welche Gestalt der Normalenvektor dann hat und wie er zur Richtung der \\(z\\)-Achse liegt.", loesungsweg: "Fehlt \\(z\\), so ist \\(\\vec n = \\begin{pmatrix}a\\\\b\\\\0\\end{pmatrix}\\). Für die Richtung der \\(z\\)-Achse gilt \\(\\vec n \\cdot \\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix} = 0\\); die Achsenrichtung verläuft also parallel zur Ebene. Ob die Ebene die Achse enthält, entscheidet der Ursprung: bei \\(d = 0\\) enthält sie ihn und damit die ganze Achse, sonst ist sie echt parallel. Senkrecht zur \\(z\\)-Achse stünde die Ebene nur, wenn \\(\\vec n\\) selbst in Achsenrichtung zeigt." },
      { id: 33, level: 6, typ: "numerisch", frage: "Eine Drohne fliegt auf \\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\60\\end{pmatrix}+t\\begin{pmatrix}3\\\\4\\\\-2\\end{pmatrix}\\). Ein Hang wird durch \\(E: 2x+y+4z = 260\\) beschrieben (Angaben in Metern). In welcher Höhe \\(z\\) trifft sie den Hang?", loesung: 40, toleranz: 0, tipp: "Geradengleichung koordinatenweise in die Ebenengleichung einsetzen und erst danach die Höhe ablesen.", loesungsweg: "Einsetzen: \\(2 \\cdot 3t + 4t + 4(60-2t) = 6t+4t+240-8t = 240+2t\\). Aus \\(240+2t = 260\\) folgt \\(t = 10\\), also der Treffpunkt \\((30|40|40)\\) und die Höhe \\(z = 40\\) m. Probe: \\(60+40+160 = 260\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Ein Förderband verläuft längs \\(g: \\vec x = \\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}+t\\begin{pmatrix}1\\\\a\\\\-2\\end{pmatrix}\\) und soll ganz in der Hallenwand \\(E: x+y+z = 6\\) liegen. Zeigen Sie, dass der Aufpunkt bereits in \\(E\\) liegt, und bestimmen Sie \\(a\\):", loesung: 1, toleranz: 0, tipp: "Erst den Aufpunkt in die Ebenengleichung einsetzen, dann die Richtung gegen den Normalenvektor prüfen.", loesungsweg: "Aufpunkt: \\(1+2+3 = 6\\) — er liegt in \\(E\\). Damit die ganze Gerade in \\(E\\) liegt, darf die Richtung nicht aus der Ebene herausführen: \\(\\vec u \\cdot \\vec n = 1+a-2 = 0\\), also \\(a = 1\\). Probe mit \\(t = 1\\): der Punkt \\((2|3|1)\\) erfüllt \\(2+3+1 = 6\\). Für \\(a \\neq 1\\) schneidet \\(g\\) die Ebene nur im Aufpunkt." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Solarpanel liegt in \\(E: 2x+3y+6z = 42\\). Ein Mast hat die Spitze \\(M(3|4|10)\\); die Sonnenstrahlen fallen senkrecht nach unten, also in Richtung \\(\\begin{pmatrix}0\\\\0\\\\-1\\end{pmatrix}\\) (Angaben in Metern). In welcher Höhe \\(z\\) trifft der Schatten der Mastspitze das Panel?", loesung: 4, toleranz: 0, tipp: "Der Strahl durch die Mastspitze ist eine Gerade; ihr Schnitt mit der Panelebene liefert den Schattenpunkt.", loesungsweg: "Strahl: \\(\\vec x = \\begin{pmatrix}3\\\\4\\\\10\\end{pmatrix}+t\\begin{pmatrix}0\\\\0\\\\-1\\end{pmatrix}\\). Einsetzen: \\(6+12+6(10-t) = 78-6t\\). Aus \\(78-6t = 42\\) folgt \\(t = 6\\), also der Schattenpunkt \\((3|4|4)\\) und die Höhe \\(z = 4\\) m. Probe: \\(6+12+24 = 42\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Die beiden Böschungen eines Entwässerungsgrabens liegen in \\(E_1: 2x+z = 14\\) und \\(E_2: -2x+z = 2\\) (Angaben in Metern). Die Sohle des Grabens ist die Schnittgerade. In welcher Höhe \\(z\\) verläuft sie?", loesung: 8, toleranz: 0, tipp: "Die Punkte der Schnittgeraden erfüllen beide Gleichungen — addiere oder subtrahiere sie geschickt.", loesungsweg: "Addition beider Gleichungen: \\(2z = 16\\), also \\(z = 8\\). Subtraktion: \\(4x = 12\\), also \\(x = 3\\). Die \\(y\\)-Koordinate bleibt frei, die Sohle ist demnach \\(\\vec x = \\begin{pmatrix}3\\\\0\\\\8\\end{pmatrix}+t\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\) und verläuft in der Höhe \\(z = 8\\) m. Dass die Lösung eine Gerade und kein einzelner Punkt ist, liegt an den nicht kollinearen Normalenvektoren." }];
