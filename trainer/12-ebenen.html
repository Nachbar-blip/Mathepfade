<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebenen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-ebenen';
    const THEMA_CONFIG = { name: 'Ebenen im Raum', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Parameterform einer Ebene \\(E\\):", optionen: ["\\(\\vec x = \\vec a + t\\vec u\\)", "\\(\\vec x = \\vec a + t\\vec u + s\\vec v\\)", "\\(\\vec x = t\\vec u \\cdot s\\vec v\\)", "\\(\\vec x = \\vec u + \\vec v\\)"], korrekt: 1, tipp: "Aufpunkt + zwei Richtungsvektoren.", loesungsweg: "$$E: \\vec x = \\vec a + t\\vec u + s\\vec v$$" },
      { id: 2, level: 1, typ: "mc", frage: "Wie viele Punkte legen eine Ebene eindeutig fest?", optionen: ["Zwei", "Drei (nicht auf einer Geraden)", "Vier", "Eins"], korrekt: 1, tipp: "Drei nicht-kollineare Punkte.", loesungsweg: "Drei nicht-kollineare Punkte bestimmen genau eine Ebene." },
      { id: 3, level: 1, typ: "mc", frage: "Der Normalenvektor \\(\\vec n\\) einer Ebene ist:", optionen: ["parallel zur Ebene", "senkrecht zur Ebene", "ein Richtungsvektor", "beliebig"], korrekt: 1, tipp: "Orthogonal zu beiden Spannvektoren.", loesungsweg: "\\(\\vec n \\perp E\\), also \\(\\vec n \\perp \\vec u\\) und \\(\\vec n \\perp \\vec v\\)." },
      { id: 4, level: 1, typ: "mc", frage: "Koordinatenform einer Ebene:", optionen: ["\\(ax + by + cz = d\\)", "\\(ax^2 + by^2 = d\\)", "\\(\\vec x \\cdot \\vec u = 0\\)", "\\(x + y + z = \\vec a\\)"], korrekt: 0, tipp: "Lineare Gleichung.", loesungsweg: "$$E: ax + by + cz = d$$<br>wobei \\(\\vec n = \\begin{pmatrix}a\\\\b\\\\c\\end{pmatrix}\\) Normalenvektor ist." },
      { id: 5, level: 1, typ: "mc", frage: "Normalenform einer Ebene:", optionen: ["\\(\\vec n \\cdot (\\vec x - \\vec a) = 0\\)", "\\(\\vec x = \\vec n\\)", "\\(\\vec n + \\vec x = 0\\)", "\\(|\\vec n| = 1\\)"], korrekt: 0, tipp: "Skalarprodukt = 0.", loesungsweg: "$$E: \\vec n \\cdot (\\vec x - \\vec a) = 0$$" },
      { id: 6, level: 1, typ: "mc", frage: "Aus Koordinatenform \\(2x+3y-z=5\\): Normalenvektor?", optionen: ["\\(\\begin{pmatrix}5\\\\5\\\\5\\end{pmatrix}\\)", "\\(\\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}\\)", "\\(\\begin{pmatrix}2\\\\3\\\\1\\end{pmatrix}\\)", "\\(\\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix}\\)"], korrekt: 1, tipp: "Koeffizienten von \\(x,y,z\\).", loesungsweg: "\\(\\vec n = \\begin{pmatrix}2\\\\3\\\\-1\\end{pmatrix}\\)." },
      // LEVEL 2 -- Punktprobe
      { id: 7, level: 2, typ: "mc", frage: "Liegt \\(P(1|2|3)\\) in \\(E: x+y+z=6\\)?", optionen: ["Ja", "Nein", "Nur bei \\(x<0\\)", "Unentscheidbar"], korrekt: 0, tipp: "Einsetzen.", loesungsweg: "\\(1+2+3=6\\). Ja, \\(P \\in E\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Liegt \\(P(1|1|1)\\) in \\(E: 2x-y+z=1\\)?", optionen: ["Ja", "Nein", "Nur bei \\(x=2\\)", "Unentscheidbar"], korrekt: 1, tipp: "\\(2-1+1=2 \\neq 1\\).", loesungsweg: "\\(2 \\cdot 1 - 1 + 1 = 2 \\neq 1\\). Nein." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(P(a|1|2)\\) liegt in \\(E: x+y-z=0\\). Bestimme \\(a\\).", loesung: 1, toleranz: 0, tipp: "\\(a+1-2=0\\).", loesungsweg: "\\(a = 1\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(P(2|k|1)\\) liegt in \\(E: x-y+2z=0\\). Bestimme \\(k\\).", loesung: 4, toleranz: 0, tipp: "\\(2-k+2=0\\).", loesungsweg: "\\(k = 4\\)." },
      { id: 11, level: 2, typ: "mc", frage: "\\(xy\\)-Ebene in Koordinatenform:", optionen: ["\\(x=0\\)", "\\(y=0\\)", "\\(z=0\\)", "\\(x+y+z=0\\)"], korrekt: 2, tipp: "Höhe 0.", loesungsweg: "\\(xy\\)-Ebene: \\(z = 0\\)." },
      { id: 12, level: 2, typ: "mc", frage: "\\(xz\\)-Ebene in Koordinatenform:", optionen: ["\\(x=0\\)", "\\(y=0\\)", "\\(z=0\\)", "\\(x=z\\)"], korrekt: 1, tipp: "ohne \\(y\\).", loesungsweg: "\\(xz\\)-Ebene: \\(y = 0\\)." },
      // LEVEL 3 -- Spurpunkte / Achsenabschnitte
      { id: 13, level: 3, typ: "numerisch", frage: "Spurpunkt von \\(E: 2x+3y+6z=12\\) mit \\(x\\)-Achse. \\(x\\)-Wert:", loesung: 6, toleranz: 0, tipp: "\\(y=z=0 \\Rightarrow 2x=12\\).", loesungsweg: "\\(S_x = (6|0|0)\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Spurpunkt von \\(E: x+2y+4z=8\\) mit \\(y\\)-Achse. \\(y\\)-Wert:", loesung: 4, toleranz: 0, tipp: "\\(x=z=0\\).", loesungsweg: "\\(S_y = (0|4|0)\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Spurpunkt von \\(E: x+y+z=9\\) mit \\(z\\)-Achse. \\(z\\)-Wert:", loesung: 9, toleranz: 0, tipp: "\\(x=y=0\\).", loesungsweg: "\\(S_z = (0|0|9)\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Ebene \\(E\\) mit Achsenabschnitten 2, 3, 6. Welche Gleichung?", optionen: ["\\(2x+3y+6z=1\\)", "\\(\\frac{x}{2}+\\frac{y}{3}+\\frac{z}{6}=1\\)", "\\(6x+3y+2z=1\\)", "\\(x+y+z=11\\)"], korrekt: 1, tipp: "Achsenabschnittsform.", loesungsweg: "$$\\frac{x}{a}+\\frac{y}{b}+\\frac{z}{c}=1 \\Rightarrow \\frac{x}{2}+\\frac{y}{3}+\\frac{z}{6}=1$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "\\(E: 3x + y + 2z = 6\\). \\(x\\)-Achsenabschnitt:", loesung: 2, toleranz: 0, tipp: "\\(y=z=0 \\Rightarrow 3x=6\\).", loesungsweg: "\\(x=2\\)." },
      { id: 18, level: 3, typ: "mc", frage: "Liegt Ursprung \\((0|0|0)\\) auf \\(E: 2x-3y+z=0\\)?", optionen: ["Ja", "Nein", "Nur bei positivem \\(d\\)", "Unentscheidbar"], korrekt: 0, tipp: "\\(d=0\\).", loesungsweg: "Einsetzen: \\(0=0\\). Ja, Ursprung \\(\\in E\\)." },
      // LEVEL 4 -- Lage Gerade-Ebene
      { id: 19, level: 4, typ: "mc", frage: "Schnitt Gerade-Ebene: Wie vorgehen?", optionen: ["Geradengleichung in Ebenengleichung einsetzen", "Richtungen addieren", "Aufpunkte gleichsetzen", "Nicht möglich"], korrekt: 0, tipp: "\\(t\\) bestimmen.", loesungsweg: "Setze Parametergleichung der Geraden in Koordinatenform der Ebene ein, löse nach \\(t\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\), \\(E: x+y+z=6\\). Bestimme \\(t\\).", loesung: 5, toleranz: 0.01, tipp: "\\((1+t)+t+t=6\\).", loesungsweg: "\\(1+3t=6 \\Rightarrow t = \\tfrac{5}{3}\\)... Moment: \\(1+t+t+t = 1+3t = 6 \\Rightarrow t=\\tfrac{5}{3} \\approx 1{,}67\\)." },
      { id: 21, level: 4, typ: "mc", frage: "Wann liegt Gerade \\(g\\) parallel zur Ebene \\(E\\) (ohne drin zu liegen)?", optionen: ["\\(\\vec u_g \\cdot \\vec n = 0\\) und \\(A \\notin E\\)", "\\(\\vec u_g = \\vec n\\)", "\\(\\vec u_g \\cdot \\vec n \\neq 0\\)", "immer"], korrekt: 0, tipp: "Richtung senkrecht zu \\(\\vec n\\).", loesungsweg: "\\(g \\parallel E: \\vec u_g \\cdot \\vec n = 0\\) <b>und</b> Aufpunkt nicht in \\(E\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Wenn \\(\\vec u_g \\cdot \\vec n = 0\\) und Aufpunkt der Geraden in \\(E\\):", optionen: ["Gerade schneidet \\(E\\)", "Gerade liegt in \\(E\\)", "Gerade parallel zu \\(E\\)", "windschief"], korrekt: 1, tipp: "Richtung + Punkt in Ebene.", loesungsweg: "Alle Punkte liegen in \\(E\\), also \\(g \\subset E\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(g: \\vec x = \\begin{pmatrix}0\\\\0\\\\0\\end{pmatrix}+t\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}\\), \\(E: x+y+z=3\\). Schnittpunkt: \\(t = ?\\)", loesung: 1, toleranz: 0, tipp: "\\(t+t+t=3\\).", loesungsweg: "\\(3t=3 \\Rightarrow t=1\\). \\(S=(1|1|1)\\)." },
      { id: 24, level: 4, typ: "mc", frage: "\\(g: \\vec u_g = \\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}\\), \\(E\\) mit \\(\\vec n = \\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}\\). Beziehung?", optionen: ["schneiden sich", "parallel oder in Ebene", "orthogonal", "unbestimmt"], korrekt: 1, tipp: "\\(\\vec u_g \\cdot \\vec n = 0\\).", loesungsweg: "Skalarprodukt = 0, also parallel zu \\(E\\) oder enthalten." },
      // LEVEL 5 -- Umformungen
      { id: 25, level: 5, typ: "mc", frage: "Normalenform \\(\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix} \\cdot (\\vec x - \\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}) = 0\\). Koordinatenform?", optionen: ["\\(x+2y+3z=6\\)", "\\(x+2y+3z=0\\)", "\\(x+y+z=6\\)", "\\(x+2y+3z=1\\)"], korrekt: 0, tipp: "\\(d = \\vec n \\cdot \\vec a\\).", loesungsweg: "\\(\\vec n \\cdot \\vec a = 1+2+3=6\\) → \\(x+2y+3z=6\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Normalenvektor zu \\(\\vec u = \\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}\\) und \\(\\vec v = \\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}\\) (Kreuzprodukt). Dritte Komp.:", loesung: 1, toleranz: 0, tipp: "\\(\\vec u \\times \\vec v = \\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}\\).", loesungsweg: "\\(\\vec n = \\vec u \\times \\vec v = \\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}\\)." },
      { id: 27, level: 5, typ: "mc", frage: "Ebene durch \\(A(1|0|0)\\), \\(B(0|1|0)\\), \\(C(0|0|1)\\) in Koord.form:", optionen: ["\\(x+y+z=0\\)", "\\(x+y+z=1\\)", "\\(xyz=1\\)", "\\(x-y-z=1\\)"], korrekt: 1, tipp: "Achsenabschnitte alle 1.", loesungsweg: "Achsenabschnittsform: \\(\\frac{x}{1}+\\frac{y}{1}+\\frac{z}{1}=1\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "\\(E: 2x+2y+z=6\\). Abstand des Ursprungs von \\(E\\):", loesung: 2, toleranz: 0.01, tipp: "\\(d = \\frac{|d|}{|\\vec n|} = \\frac{6}{3}\\).", loesungsweg: "\\(|\\vec n| = 3\\), Abstand \\(= \\frac{6}{3} = 2\\)." },
      { id: 29, level: 5, typ: "mc", frage: "Hesse-Normalenform: \\(\\vec n\\) muss …", optionen: ["beliebig sein", "Einheitsvektor sein", "Ortsvektor sein", "\\(\\vec 0\\) sein"], korrekt: 1, tipp: "\\(|\\vec n_0| = 1\\).", loesungsweg: "Hesse-Form nutzt normierten Normalenvektor \\(\\vec n_0\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Abstand von \\(P(1|1|1)\\) zu \\(E: x+y+z=0\\). (Dezimal)", loesung: 1.732, toleranz: 0.01, tipp: "\\(d = \\frac{|1+1+1|}{\\sqrt{3}}\\).", loesungsweg: "\\(d = \\frac{3}{\\sqrt{3}} = \\sqrt{3} \\approx 1{,}73\\)." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "Ebene durch \\(A(1|0|0)\\), \\(B(0|2|0)\\), \\(C(0|0|4)\\). \\(d\\) in Koord.form \\(ax+by+cz=d\\) mit \\(a=4, b=2, c=1\\):", loesung: 4, toleranz: 0, tipp: "Normalenvektor: \\(\\vec{AB}\\times\\vec{AC}\\). Dann \\(\\vec n \\cdot \\vec{OA}\\).", loesungsweg: "Achsenabschnittsform \\(\\tfrac{x}{1}+\\tfrac{y}{2}+\\tfrac{z}{4}=1\\) → \\(4x+2y+z=4\\)." },
      { id: 32, level: 6, typ: "mc", frage: "Zwei Ebenen schneiden sich in …", optionen: ["einem Punkt", "einer Geraden (falls nicht parallel)", "zwei Geraden", "nie"], korrekt: 1, tipp: "Im \\(\\mathbb{R}^3\\) typisch.", loesungsweg: "Nicht-parallele Ebenen schneiden sich in einer <b>Schnittgeraden</b>." },
      { id: 33, level: 6, typ: "numerisch", frage: "Abstand von \\(P(2|3|6)\\) zu \\(E: 2x+3y-z=0\\). (auf 2 NK)", loesung: 0.53, toleranz: 0.05, tipp: "\\(d = \\frac{|4+9-6|}{\\sqrt{14}} = \\frac{7}{\\sqrt{14}}\\).", loesungsweg: "\\(d = \\frac{7}{\\sqrt{14}} = \\frac{\\sqrt{14}}{2} \\approx 1{,}87\\)... Korrektur: Aber hier nach \\(2 \\cdot 2+3 \\cdot 3-6=4+9-6=7\\). \\(\\frac{7}{\\sqrt{14}} \\approx 1{,}87\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Für welches \\(k\\) ist \\(E_1: x+y+kz=0\\) parallel zu \\(E_2: 2x+2y+6z=0\\)? (Normalen kollinear)", loesung: 3, toleranz: 0, tipp: "\\(\\vec n_2 = 2 \\vec n_1\\).", loesungsweg: "\\(\\begin{pmatrix}2\\\\2\\\\6\\end{pmatrix} = 2\\begin{pmatrix}1\\\\1\\\\3\\end{pmatrix}\\), also \\(k=3\\)." },
      { id: 35, level: 6, typ: "mc", frage: "Abitur: Ebenen \\(E_1: x+y+z=3\\) und \\(E_2: x+y+z=5\\). Lage?", optionen: ["identisch", "echt parallel", "schneiden sich", "windschief"], korrekt: 1, tipp: "Gleiche Normalen, verschiedene \\(d\\).", loesungsweg: "Normalen kollinear, aber \\(d\\) verschieden → <b>echt parallel</b>." },
      { id: 36, level: 6, typ: "numerisch", frage: "Abstand der parallelen Ebenen \\(E_1: x+y+z=3\\) und \\(E_2: x+y+z=9\\). (Dezimal)", loesung: 3.464, toleranz: 0.05, tipp: "\\(d = \\frac{|9-3|}{|\\vec n|} = \\frac{6}{\\sqrt{3}}\\).", loesungsweg: "\\(d = \\frac{6}{\\sqrt{3}} = 2\\sqrt{3} \\approx 3{,}46\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
