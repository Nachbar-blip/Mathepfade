<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proportionalität - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-proportionalitaet';
    const THEMA_CONFIG = { name: 'Direkte und indirekte Proportionalität', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Zwei Größen sind direkt proportional, wenn …", optionen: ["ihre Summe konstant ist", "ihr Quotient konstant ist", "ihr Produkt konstant ist", "nichts davon"], korrekt: 1, tipp: "\\(\\frac{y}{x} = k\\).", loesungsweg: "Direkt proportional: \\(\\frac{y}{x} = k\\) ist konstant (Proportionalitätsfaktor)." },
      { id: 2, level: 1, typ: "mc", frage: "Zwei Größen sind indirekt proportional, wenn …", optionen: ["ihr Quotient konstant ist", "ihr Produkt konstant ist", "ihre Summe konstant ist", "sie gleich sind"], korrekt: 1, tipp: "\\(x \\cdot y = k\\).", loesungsweg: "Indirekt proportional: \\(x \\cdot y = k\\) ist konstant." },
      { id: 3, level: 1, typ: "mc", frage: "Welche Beziehung ist direkt proportional?", optionen: ["Anzahl Brötchen zu Gesamtpreis", "Arbeiterzahl zu Arbeitsdauer", "Alter zu Körpergröße", "Niederschlag zu Temperatur"], korrekt: 0, tipp: "Mehr Brötchen → mehr Preis.", loesungsweg: "Brötchen & Preis sind direkt proportional: Doppelt so viele Brötchen → doppelter Preis." },
      { id: 4, level: 1, typ: "numerisch", frage: "3 Äpfel kosten 1,50 €. Wie viel kosten 6 Äpfel in €?", loesung: 3, toleranz: 0, tipp: "Doppelt so viele.", loesungsweg: "Bei proportionalen Größen führt die doppelte Menge zum doppelten Preis: $$6 = 2 \\cdot 3 \\;\\Rightarrow\\; 2 \\cdot 1{,}50\\,€ = 3\\,€$$ Über den Grundwert gerechnet: ein Apfel kostet \\(0{,}50\\,€\\), also \\(6 \\cdot 0{,}50 = 3\\,€\\) ✓" },
      { id: 5, level: 1, typ: "numerisch", frage: "1 Heft kostet 0,80 €. Wie viel kosten 5 Hefte in €?", loesung: 4, toleranz: 0, tipp: "Mal 5.", loesungsweg: "$$5 \\cdot 0{,}80\\,€ = 4\\,€$$ Der Preis pro Heft ist der Proportionalitätsfaktor; mit ihm lässt sich zu jeder Stückzahl der Preis bestimmen." },
      { id: 6, level: 1, typ: "numerisch", frage: "4 Arbeiter brauchen 6 h. Wie lange brauchen 2 Arbeiter in h (indirekt prop.)?", loesung: 12, toleranz: 0, tipp: "Halb so viele → doppelt so lang.", loesungsweg: "\\(4 \\cdot 6 = 2 \\cdot t \\Rightarrow t = 12\\,h\\)." },
      // LEVEL 2
      { id: 7, level: 2, typ: "mc", frage: "Was ist der Proportionalitätsfaktor bei \\(y = 3x\\)?", optionen: ["\\(x\\)", "\\(y\\)", "\\(3\\)", "\\(\\frac{1}{3}\\)"], korrekt: 2, tipp: "Zahl vor \\(x\\).", loesungsweg: "Bei \\(y = kx\\) ist \\(k\\) der Proportionalitätsfaktor — die Zahl, mit der jedes \\(x\\) multipliziert wird: $$k = 3$$ Im Graphen ist das die Steigung der Ursprungsgeraden. Der Quotient \\(\\tfrac yx\\) ist für alle Wertepaare gleich \\(3\\) — genau das kennzeichnet Proportionalität." },
      { id: 8, level: 2, typ: "mc", frage: "Der Graph einer direkten Proportionalität ist …", optionen: ["eine Hyperbel", "eine Parabel", "eine Gerade durch den Ursprung", "ein Kreis"], korrekt: 2, tipp: "\\(y = kx\\).", loesungsweg: "Direkte Prop.: Gerade durch den Ursprung mit Anstieg \\(k\\)." },
      { id: 9, level: 2, typ: "mc", frage: "Der Graph einer indirekten Proportionalität ist …", optionen: ["Gerade", "Hyperbel", "Parabel", "Kreis"], korrekt: 1, tipp: "\\(y = \\frac{k}{x}\\).", loesungsweg: "Indirekte Prop.: Hyperbel (Funktion \\(y = \\frac{k}{x}\\))." },
      { id: 10, level: 2, typ: "numerisch", frage: "7 L Saft kosten 14 €. Was kosten 10 L in €?", loesung: 20, toleranz: 0, tipp: "\\(k = 2\\)€/L.", loesungsweg: "\\(k = 2\\). \\(10 \\cdot 2 = 20\\,€\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "5 Maschinen brauchen 8 h. Wie lange 10 Maschinen (indirekt, h)?", loesung: 4, toleranz: 0, tipp: "Doppelt → halb so lang.", loesungsweg: "\\(5 \\cdot 8 = 10 \\cdot t \\Rightarrow t = 4\\,h\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(y = 5x\\). Berechne \\(y\\) für \\(x = 8\\).", loesung: 40, toleranz: 0, tipp: "Einsetzen.", loesungsweg: "\\(y = 5 \\cdot 8 = 40\\)." },
      // LEVEL 3
      { id: 13, level: 3, typ: "mc", frage: "Welche Zuordnung ist DIREKT proportional?", optionen: ["Anzahl Arbeiter - Bauzeit", "Geschwindigkeit - Bremsweg", "Menge Benzin - Preis", "Anzahl Kühe - Futterdauer"], korrekt: 2, tipp: "Preis = Menge·Einzelpreis.", loesungsweg: "Menge Benzin → Preis ist direkt proportional." },
      { id: 14, level: 3, typ: "mc", frage: "Welche ist INDIREKT proportional?", optionen: ["Zeit - Wegstrecke (konstante Geschwindigkeit)", "Arbeiter - Arbeitsdauer", "Menge - Preis", "Seitenlänge - Umfang"], korrekt: 1, tipp: "Mehr Arbeiter → weniger Zeit.", loesungsweg: "Arbeiter × Zeit = konstante Arbeit → indirekt proportional." },
      { id: 15, level: 3, typ: "mc", frage: "6 L für 9 €. Wie viel L für 15 €?", optionen: ["8 L", "10 L", "12 L", "9 L"], korrekt: 1, tipp: "\\(k = \\frac{9}{6} = 1{,}5\\)€/L.", loesungsweg: "Zuerst den Grundwert bestimmen: $$k = \\frac{9\\,€}{6\\,\\text{L}} = 1{,}50\\,€/\\text{L}$$ Dann die gesuchte Menge: $$\\frac{15\\,€}{1{,}50\\,€/\\text{L}} = 10\\,\\text{L}$$ Der Umweg über den Wert für eine Einheit heißt Dreisatz und funktioniert in beide Richtungen." },
      { id: 16, level: 3, typ: "numerisch", frage: "3 Pizzen kosten 24 €. Wie viele Pizzen bekommst du für 40 €?", loesung: 5, toleranz: 0, tipp: "Preis pro Pizza = 8 €.", loesungsweg: "Preis pro Pizza: $$\\frac{24\\,€}{3} = 8\\,€$$ $$\\frac{40\\,€}{8\\,€} = 5 \\text{ Pizzen}$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "4 Kühe fressen Heu in 12 Tagen. Wie lange reicht es für 6 Kühe (Tage)?", loesung: 8, toleranz: 0, tipp: "Indirekt: \\(4 \\cdot 12 = 6 \\cdot t\\).", loesungsweg: "\\(t = \\frac{48}{6} = 8\\,\\text{Tage}\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Ein Auto fährt in 3 h 180 km. Wie weit in 5 h (gleiche Geschwindigkeit, km)?", loesung: 300, toleranz: 0, tipp: "Direkt prop.", loesungsweg: "\\(k = 60\\,km/h\\). \\(5 \\cdot 60 = 300\\,km\\)." },
      // LEVEL 4
      { id: 19, level: 4, typ: "mc", frage: "\\(x \\cdot y = 24\\). Was ist \\(y\\) für \\(x = 6\\)?", optionen: ["2", "3", "4", "6"], korrekt: 2, tipp: "\\(y = \\frac{24}{x}\\).", loesungsweg: "\\(y = \\frac{24}{6} = 4\\)." },
      { id: 20, level: 4, typ: "mc", frage: "Ein Quadrat: Seitenlänge \\(a\\) und Umfang \\(U = 4a\\). Welche Art Zuordnung?", optionen: ["indirekt prop. mit \\(k=4\\)", "direkt prop. mit \\(k=4\\)", "keine prop. Zuordnung", "weder noch, \\(k\\) fehlt"], korrekt: 1, tipp: "\\(U = 4a\\).", loesungsweg: "\\(\\frac{U}{a} = 4\\) konstant → direkt prop., \\(k = 4\\)." },
      { id: 21, level: 4, typ: "mc", frage: "Rechtecke mit dem Flächeninhalt \\(36\\,\\text{cm}^2\\): Zu jeder Seitenlänge \\(a\\) gehört eine Seitenlänge \\(b\\). Welches \\(b\\) gehört zu \\(a = 4\\,\\text{cm}\\), und um welche Zuordnung handelt es sich?", optionen: ["\\(b = 9\\,\\text{cm}\\), umgekehrt proportional", "\\(b = 9\\,\\text{cm}\\), direkt proportional", "\\(b = 32\\,\\text{cm}\\), umgekehrt proportional", "\\(b = 12\\,\\text{cm}\\), direkt proportional"], korrekt: 0, tipp: "Was bleibt bei allen diesen Rechtecken gleich?", loesungsweg: "Das Produkt \\(a \\cdot b = 36\\) ist konstant — das Kennzeichen einer umgekehrt proportionalen Zuordnung: $$b = \\frac{36}{4} = 9\\,\\text{cm}$$ Doppelte Seite \\(a\\) bedeutet halbe Seite \\(b\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Zug braucht bei \\(v = 80\\) km/h für die Strecke 4 h. Wie lange bei \\(v = 100\\) km/h (h)?", loesung: 3.2, toleranz: 0.01, tipp: "Indirekt prop.", loesungsweg: "\\(80 \\cdot 4 = 100 \\cdot t \\Rightarrow t = 3{,}2\\,h\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Eine Umdrehung Zahnrad A entspricht 3 Umdrehungen Rad B. Bei 20 A, wie viele B?", loesung: 60, toleranz: 0, tipp: "Direkt prop.", loesungsweg: "Jede Umdrehung von A erzeugt drei von B, die Größen sind also proportional mit dem Faktor \\(3\\): $$20 \\cdot 3 = 60$$ Rad B ist entsprechend kleiner — Zähnezahl und Umdrehungszahl verhalten sich umgekehrt zueinander." },
      { id: 24, level: 4, typ: "numerisch", frage: "10 Rohre füllen Becken in 6 h. Wie lange mit 15 Rohren (h)?", loesung: 4, toleranz: 0, tipp: "Indirekt.", loesungsweg: "\\(10 \\cdot 6 = 15 \\cdot t \\Rightarrow t = 4\\,h\\)." },
      // LEVEL 5
      { id: 25, level: 5, typ: "mc", frage: "Für \\(250\\,\\text{g}\\) Käse zahlt man \\(3{,}50\\,€\\). Jan rechnet für \\(400\\,\\text{g}\\): „\\(400 : 250 = 1{,}6\\) und \\(3{,}50 : 1{,}6 \\approx 2{,}19\\,€\\).“ Was ist dazu zu sagen?", optionen: ["Falsch — mehr Käse kostet mehr: \\(3{,}50 \\cdot 1{,}6 = 5{,}60\\,€\\)", "Richtig", "Falsch — \\(100\\,\\text{g}\\) kosten \\(1{,}40\\,€\\), also kosten \\(400\\,\\text{g}\\) genau \\(4{,}20\\,€\\)", "Falsch — \\(400\\,\\text{g}\\) kosten \\(3{,}50 + 1{,}50 = 5{,}00\\,€\\)"], korrekt: 0, tipp: "Kann eine größere Menge billiger sein als die kleinere?", loesungsweg: "Menge und Preis sind direkt proportional: \\(1{,}6\\)-fache Menge, \\(1{,}6\\)-facher Preis: $$3{,}50 \\cdot 1{,}6 = 5{,}60\\,€$$ Jan hat dividiert statt multipliziert — das wäre die Rechnung für eine umgekehrt proportionale Zuordnung. Kontrolle über \\(100\\,\\text{g}\\): \\(1{,}40\\,€\\), also \\(4 \\cdot 1{,}40 = 5{,}60\\,€\\) ✓" },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Futtervorrat reicht für \\(8\\) Pferde \\(15\\) Tage. Nach \\(5\\) Tagen kommen \\(2\\) Pferde dazu. Wie viele Tage reicht der Vorrat ab dann noch?", loesung: 8, toleranz: 0, tipp: "Wie viel „Pferde-Tage“ stecken im Vorrat, wie viele sind nach \\(5\\) Tagen verbraucht?", loesungsweg: "Vorrat: \\(8 \\cdot 15 = 120\\) Pferde-Tage. In \\(5\\) Tagen verbrauchen \\(8\\) Pferde \\(40\\) davon, Rest \\(80\\). Für \\(10\\) Pferde: $$\\frac{80}{10} = 8 \\text{ Tage}$$ Ohne die neuen Pferde hätte der Rest noch \\(10\\) Tage gereicht — mehr Pferde, weniger Tage (umgekehrt proportional) ✓" },
      { id: 27, level: 5, typ: "numerisch", frage: "Zwischen zwei Größen besteht eine umgekehrt proportionale Zuordnung. Zu \\(x = 3\\) gehört \\(y = 12\\). Für welchen positiven Wert von \\(x\\) gilt \\(y = x\\)?", loesung: 6, toleranz: 0, tipp: "Welches Produkt \\(x \\cdot y\\) haben alle Wertepaare?", loesungsweg: "Umgekehrt proportional: \\(x \\cdot y = 3 \\cdot 12 = 36\\) für alle Paare. Mit \\(y = x\\): $$x \\cdot x = 36 \\;\\Rightarrow\\; x = 6$$ Probe: \\(6 \\cdot 6 = 36\\) ✓ (Die negative Lösung \\(-6\\) ist ausgeschlossen.)" },
      { id: 28, level: 5, typ: "mc", frage: "\\(6\\) Pumpen leeren ein Becken in \\(10\\) Stunden. Lisa: „Mit \\(9\\) Pumpen dauert es \\(15\\) Stunden — anderthalbmal so viele Pumpen, anderthalbmal so lange.“ Was ist dazu zu sagen?", optionen: ["Falsch — mehr Pumpen brauchen weniger Zeit: \\(6 \\cdot 10 = 9 \\cdot t\\), also \\(t \\approx 6{,}67\\,\\text{h}\\)", "Richtig — anderthalbmal so viele Pumpen, anderthalbmal so lange: \\(10 \\cdot 1{,}5 = 15\\,\\text{h}\\)", "Falsch — es dauert \\(10 - 3 = 7\\,\\text{h}\\), drei Pumpen mehr sparen drei Stunden ein", "Falsch — \\(9\\) Pumpen brauchen genau \\(6\\,\\text{h}\\), weil \\(6\\) und \\(9\\) die Rollen tauschen"], korrekt: 0, tipp: "Sollte das Becken mit mehr Pumpen schneller oder langsamer leer sein?", loesungsweg: "Pumpenzahl und Zeit sind umgekehrt proportional, das Produkt bleibt gleich: $$6 \\cdot 10 = 60 = 9 \\cdot t \\;\\Rightarrow\\; t = \\frac{60}{9} = 6\\tfrac{2}{3}\\,\\text{h} \\approx 6{,}67\\,\\text{h}$$ Lisa hat mit dem Faktor \\(1{,}5\\) multipliziert statt durch ihn zu teilen: \\(10 : 1{,}5 = 6{,}67\\) ✓" },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Drucker druckt \\(45\\) Seiten in \\(3\\) Minuten. Ein Auftrag über \\(600\\) Seiten startet um 10:00 Uhr; zwischendurch muss einmal \\(4\\) Minuten lang Papier nachgelegt werden. Wie viele Minuten nach 10:00 Uhr ist der Auftrag fertig?", loesung: 44, toleranz: 0, tipp: "Erst die reine Druckzeit, dann die Pause dazu.", loesungsweg: "Druckleistung: \\(45 : 3 = 15\\) Seiten pro Minute. Reine Druckzeit: $$\\frac{600}{15} = 40 \\text{ Minuten}$$ Dazu \\(4\\) Minuten Pause: \\(40 + 4 = 44\\) Minuten. Die Pause ist nicht proportional zur Seitenzahl — sie kommt einfach dazu." },
      { id: 30, level: 5, typ: "numerisch", frage: "Auf einer Karte im Maßstab \\(1 : 25\\,000\\) ist ein Wanderweg \\(6{,}4\\,\\text{cm}\\) lang. Anna geht ihn mit \\(4\\,\\text{km/h}\\). Wie viele Minuten braucht sie?", loesung: 24, toleranz: 0, tipp: "Erst die wirkliche Länge in km, dann die Zeit.", loesungsweg: "Wirkliche Länge: \\(6{,}4 \\cdot 25\\,000 = 160\\,000\\,\\text{cm} = 1{,}6\\,\\text{km}\\). Bei \\(4\\,\\text{km/h}\\) gilt Weg proportional Zeit: $$\\frac{1{,}6}{4}\\,\\text{h} = 0{,}4\\,\\text{h} = 24 \\text{ Minuten}$$ Kontrolle: In \\(60\\) Minuten \\(4\\,\\text{km}\\), in \\(15\\) Minuten \\(1\\,\\text{km}\\), für \\(1{,}6\\,\\text{km}\\) also \\(1{,}6 \\cdot 15 = 24\\) ✓" },
      // LEVEL 6
      { id: 31, level: 6, typ: "mc", frage: "Wertetabelle: \\(x = 2 \\mapsto y = 3\\), \\(x = 4 \\mapsto y = 5\\), \\(x = 8 \\mapsto y = 9\\). Lukas: „Das ist proportional, denn wenn \\(x\\) wächst, wächst auch \\(y\\).“ Was ist dazu zu sagen?", optionen: ["Falsch — die Quotienten \\(\\frac{y}{x}\\) sind \\(1{,}5\\); \\(1{,}25\\); \\(1{,}125\\), nicht gleich; es gilt \\(y = x + 1\\)", "Richtig — \\(y\\) wächst mit \\(x\\), und genau das bedeutet proportional: mehr \\(x\\), mehr \\(y\\)", "Falsch — die Zuordnung ist umgekehrt proportional, weil die Quotienten \\(\\frac{y}{x}\\) immer kleiner werden", "Richtig — die Punkte liegen auf einer Geraden, und Geraden gehören zu proportionalen Zuordnungen"], korrekt: 0, tipp: "Was passiert mit \\(y\\), wenn \\(x\\) verdoppelt wird?", loesungsweg: "Proportional heißt: doppeltes \\(x\\), doppeltes \\(y\\). Hier: \\(x = 2 \\to 4\\) verdoppelt, aber \\(y = 3 \\to 5\\) nicht. Die Quotienten $$\\frac{3}{2} = 1{,}5, \\quad \\frac{5}{4} = 1{,}25, \\quad \\frac{9}{8} = 1{,}125$$ sind verschieden. Die Punkte liegen zwar auf der Geraden \\(y = x + 1\\), diese geht aber nicht durch den Ursprung — „wächst mit“ reicht für Proportionalität nicht aus." },
      { id: 32, level: 6, typ: "numerisch", frage: "In der Wertetabelle einer proportionalen Zuordnung steht: \\(x = 5 \\mapsto y = a\\) und \\(x = 8 \\mapsto y = a + 7{,}5\\). Berechne \\(a\\).", loesung: 12.5, toleranz: 0.01, tipp: "Um wie viel wächst \\(x\\), um wie viel wächst \\(y\\)? Was sagt das über den Proportionalitätsfaktor?", loesungsweg: "Von \\(x = 5\\) zu \\(x = 8\\) wächst \\(x\\) um \\(3\\), dabei wächst \\(y\\) um \\(7{,}5\\). Bei einer proportionalen Zuordnung gehört zu jedem Schritt von \\(1\\) in \\(x\\) derselbe Zuwachs in \\(y\\): $$k = 7{,}5 : 3 = 2{,}5$$ Also \\(a = 5 \\cdot 2{,}5 = 12{,}5\\). Probe: \\(12{,}5 : 5 = 2{,}5\\) und \\(20 : 8 = 2{,}5\\) ✓" },
      { id: 33, level: 6, typ: "mc", frage: "Ein Auto fährt eine Strecke hin mit \\(60\\,\\text{km/h}\\) und dieselbe Strecke zurück mit \\(120\\,\\text{km/h}\\). Behauptung: „Die Durchschnittsgeschwindigkeit beträgt \\(90\\,\\text{km/h}\\).“", optionen: ["Falsch — die Rückfahrt dauert nur halb so lange; \\(120\\,\\text{km}\\) je Richtung: \\(240\\,\\text{km}\\) in \\(3\\,\\text{h}\\), also \\(80\\,\\text{km/h}\\)", "Richtig — der Mittelwert aus \\(60\\) und \\(120\\) ist \\(90\\), denn beide Strecken sind gleich lang", "Falsch — es sind \\(100\\,\\text{km/h}\\), weil die schnellere Fahrt stärker ins Gewicht fällt", "Falsch — es sind \\(60\\,\\text{km/h}\\), die langsamere Fahrt bestimmt die Durchschnittsgeschwindigkeit"], korrekt: 0, tipp: "Zeit und Geschwindigkeit sind bei fester Strecke umgekehrt proportional — die langsame Fahrt dauert länger.", loesungsweg: "Bei gleicher Strecke ist die Fahrzeit umgekehrt proportional zur Geschwindigkeit. Beispiel \\(120\\,\\text{km}\\) je Richtung: Hin \\(2\\,\\text{h}\\), zurück \\(1\\,\\text{h}\\): $$\\bar v = \\frac{240\\,\\text{km}}{3\\,\\text{h}} = 80\\,\\text{km/h}$$ Der Mittelwert \\(90\\) wäre nur richtig, wenn beide Fahrten gleich <b>lange</b> dauerten." },
      { id: 34, level: 6, typ: "numerisch", frage: "\\(5\\) Bagger heben in \\(6\\) Stunden einen \\(900\\,\\text{m}\\) langen Graben aus. Wie viele Stunden brauchen \\(3\\) Bagger für einen \\(1080\\,\\text{m}\\) langen Graben?", loesung: 12, toleranz: 0, tipp: "Wie viele Meter schafft ein Bagger in einer Stunde?", loesungsweg: "Leistung eines Baggers: $$\\frac{900}{5 \\cdot 6} = 30\\,\\text{m pro Stunde}$$ \\(3\\) Bagger schaffen \\(90\\,\\text{m}\\) pro Stunde: \\(1080 : 90 = 12\\) Stunden. Zwei Zuordnungen greifen ineinander: weniger Bagger → mehr Zeit (umgekehrt proportional), längerer Graben → mehr Zeit (direkt proportional)." },
      { id: 35, level: 6, typ: "numerisch", frage: "\\(8\\) Arbeiter würden eine Baustelle in \\(12\\) Tagen fertigstellen. Nach \\(3\\) Tagen fallen einige Arbeiter aus; die übrigen brauchen für den Rest noch \\(18\\) Tage. Wie viele Arbeiter sind ausgefallen?", loesung: 4, toleranz: 0, tipp: "Wie viele Arbeiter-Tage sind nach \\(3\\) Tagen noch übrig?", loesungsweg: "Gesamtarbeit: \\(8 \\cdot 12 = 96\\) Arbeiter-Tage. Nach \\(3\\) Tagen sind \\(24\\) erledigt, \\(72\\) bleiben. Für \\(18\\) Tage: $$\\frac{72}{18} = 4 \\text{ Arbeiter bleiben}$$ Also sind \\(8 - 4 = 4\\) ausgefallen. Probe: \\(4 \\cdot 18 = 72\\) ✓" },
      { id: 36, level: 6, typ: "mc", frage: "Behauptung: „Bei einer proportionalen Zuordnung gehört zu \\(x = 0\\) immer \\(y = 0\\).“", optionen: ["Richtig — \\(y = k \\cdot x\\) ergibt für \\(x = 0\\) stets \\(0\\); der Graph geht durch den Ursprung", "Falsch — bei \\(y = 2x + 1\\) gehört zu \\(x = 0\\) der Wert \\(1\\)", "Falsch — bei umgekehrt proportionalen Zuordnungen gehört zu \\(x = 0\\) ein unendlich großer Wert, also gilt es nie", "Richtig, aber nur für positive Proportionalitätsfaktoren"], korrekt: 0, tipp: "Welche Gleichung haben alle proportionalen Zuordnungen?", loesungsweg: "Jede proportionale Zuordnung hat die Form \\(y = k \\cdot x\\): $$y(0) = k \\cdot 0 = 0$$ unabhängig vom Vorzeichen von \\(k\\). \\(y = 2x + 1\\) ist zwar linear, aber nicht proportional — kein Gegenbeispiel. Umgekehrt proportionale Zuordnungen sind für \\(x = 0\\) gar nicht definiert; sie sind aber auch nicht proportional." }];
    </script>
