<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Raumgeometrie Grundlagen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-raumgeometrie-grund';
    const THEMA_CONFIG = { name: 'Raumgeometrie - Prismen & Zylinder', bereich: 'geometrie' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Ein Prisma hat ...", optionen: ["eine runde Grundfläche", "zwei kongruente, parallele Grundflächen", "nur eine Spitze", "keine Ecken"], korrekt: 1, tipp: "Boden und Deckel sind gleich.", loesungsweg: "Ein Prisma hat zwei <b>kongruente, parallele</b> Grundflächen." },
      { id: 2, level: 1, typ: "mc", frage: "Formel für das Volumen eines Prismas?", optionen: ["\\(V = G \\cdot h\\)", "\\(V = \\frac{1}{3} G h\\)", "\\(V = G + h\\)", "\\(V = 2Gh\\)"], korrekt: 0, tipp: "Grundfläche mal Höhe.", loesungsweg: "Ein Prisma hat über die ganze Höhe denselben Querschnitt. Man stapelt also lauter gleiche Schichten der Grundfläche \\(G\\): $$V = G \\cdot h$$ Die Formel \\(\\tfrac13 Gh\\) gehört dagegen zur Pyramide, deren Querschnitt nach oben hin kleiner wird." },
      { id: 3, level: 1, typ: "mc", frage: "Formel Zylindervolumen?", optionen: ["\\(V = \\pi r h\\)", "\\(V = \\pi r^2 h\\)", "\\(V = 2\\pi r h\\)", "\\(V = \\pi d h\\)"], korrekt: 1, tipp: "Grundfläche ist Kreis.", loesungsweg: "Der Zylinder ist ein Prisma mit kreisförmiger Grundfläche. Mit \\(G = \\pi r^2\\) folgt: $$V = \\pi r^2 h$$ Der Radius geht <b>quadratisch</b> ein — doppelter Radius bedeutet also vierfaches Volumen. \\(2\\pi r h\\) wäre dagegen die Mantelfläche." },
      { id: 4, level: 1, typ: "numerisch", frage: "Würfel mit Kante \\(2\\,\\text{cm}\\). Oberfläche in cm\\(^2\\)?", loesung: 24, toleranz: 0, tipp: "Sechs gleiche Quadrate.", loesungsweg: "Ein Würfel wird von sechs gleich großen Quadraten begrenzt: $$O = 6 \\cdot 2^2 = 6 \\cdot 4 = 24\\,\\text{cm}^2$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Würfel mit Kante \\(5\\,\\text{cm}\\). Volumen in cm\\(^3\\)?", loesung: 125, toleranz: 0, tipp: "\\(V = a^3\\).", loesungsweg: "Beim Würfel sind alle drei Kanten gleich lang, also \\(V = a \\cdot a \\cdot a = a^3\\): $$V = 5^3 = 5 \\cdot 5 \\cdot 5 = 125\\,\\text{cm}^3$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Quader \\(2 \\times 3 \\times 4\\). Volumen in cm\\(^3\\)?", loesung: 24, toleranz: 0, tipp: "\\(V = a \\cdot b \\cdot c\\).", loesungsweg: "Beim Quader werden die drei Kantenlängen multipliziert: $$V = 2 \\cdot 3 \\cdot 4 = 24\\,\\text{cm}^3$$ Die Reihenfolge spielt keine Rolle — Grundfläche \\(2 \\cdot 3 = 6\\) mal Höhe \\(4\\) ergibt dasselbe." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "Dreieckiges Prisma: \\(G = 10\\,\\text{cm}^2\\), Höhe \\(h = 6\\,\\text{cm}\\). Volumen in cm\\(^3\\)?", loesung: 60, toleranz: 0, tipp: "\\(V = Gh\\).", loesungsweg: "Die Grundfläche ist bereits gegeben, also gilt direkt \\(V = G \\cdot h\\): $$V = 10 \\cdot 6 = 60\\,\\text{cm}^3$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Zylinder \\(r = 2\\,\\text{cm}\\), \\(h = 5\\,\\text{cm}\\). Volumen in cm\\(^3\\) (\\(\\pi = 3{,}14\\))?", loesung: 62.8, toleranz: 0.2, tipp: "\\(\\pi r^2 h\\).", loesungsweg: "Grundfläche des Zylinders ist der Kreis \\(\\pi r^2 = 3{,}14 \\cdot 2^2 = 12{,}56\\,\\text{cm}^2\\), dann mal Höhe: $$V = 12{,}56 \\cdot 5 = 62{,}8\\,\\text{cm}^3$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Würfel mit Oberfläche \\(96\\,\\text{cm}^2\\). Kantenlänge in cm?", loesung: 4, toleranz: 0, tipp: "\\(6a^2 = 96\\).", loesungsweg: "Sechs gleiche Quadrate ergeben die Oberfläche: $$6a^2 = 96 \\implies a^2 = 16 \\implies a = 4\\,\\text{cm}$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Zylinder \\(r = 3\\), \\(h = 10\\). Volumen in cm\\(^3\\) (\\(\\pi = 3{,}14\\))?", loesung: 282.6, toleranz: 1, tipp: "\\(\\pi \\cdot 9 \\cdot 10\\).", loesungsweg: "Erst \\(r^2 = 9\\), dann mit Höhe und \\(\\pi\\) multiplizieren: $$V = 3{,}14 \\cdot 9 \\cdot 10 = 282{,}6\\,\\text{cm}^3$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Quader \\(5 \\times 4 \\times 10\\). Oberfläche in cm\\(^2\\)?", loesung: 220, toleranz: 0, tipp: "\\(2(ab + ac + bc)\\).", loesungsweg: "Ein Quader hat drei Paare gleicher Seitenflächen: $$O = 2(ab+ac+bc) = 2(5 \\cdot 4 + 5 \\cdot 10 + 4 \\cdot 10)$$ $$= 2(20+50+40) = 220\\,\\text{cm}^2$$ Jede Fläche zählt zweimal — der Faktor \\(2\\) darf nicht fehlen." },
      { id: 12, level: 2, typ: "numerisch", frage: "Dreiecksprisma, Grundfläche 15, Höhe 8. Volumen?", loesung: 120, toleranz: 0, tipp: "\\(Gh\\).", loesungsweg: "$$V = G \\cdot h = 15 \\cdot 8 = 120$$ Die Grundfläche ist bereits gegeben, das Dreieck muss also nicht erst berechnet werden. Zu beachten ist, dass \\(h\\) hier die Höhe des Prismas meint, nicht die Höhe des Grunddreiecks." },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "Zylinder Mantelfläche bei \\(r = 4\\), \\(h = 10\\) (\\(\\pi = 3{,}14\\))?", loesung: 251.2, toleranz: 1, tipp: "\\(M = 2\\pi r h\\).", loesungsweg: "$$M = 2 \\cdot 3{,}14 \\cdot 4 \\cdot 10 = 251{,}2$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Zylinder Oberfläche gesamt bei \\(r = 4\\), \\(h = 10\\) (\\(\\pi = 3{,}14\\))?", loesung: 351.68, toleranz: 1, tipp: "\\(O = 2\\pi r^2 + 2\\pi r h\\).", loesungsweg: "$$O = 2 \\cdot 3{,}14 \\cdot 16 + 251{,}2 = 100{,}48 + 251{,}2 = 351{,}68$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Quader mit Volumen \\(240\\,\\text{cm}^3\\), Grundfläche \\(a = 5\\), \\(b = 6\\). Höhe in cm?", loesung: 8, toleranz: 0, tipp: "\\(h = V/(ab)\\).", loesungsweg: "$$h = 240/30 = 8$$" },
      { id: 16, level: 3, typ: "numerisch", frage: "Zylinder \\(V = 628\\,\\text{cm}^3\\), \\(r = 5\\) (\\(\\pi = 3{,}14\\)). Höhe in cm?", loesung: 8, toleranz: 0.1, tipp: "\\(h = V/(\\pi r^2)\\).", loesungsweg: "$$h = 628/(3{,}14 \\cdot 25) = 628/78{,}5 = 8$$" },
      { id: 17, level: 3, typ: "mc", frage: "Ein Würfel hat Volumen \\(64\\,\\text{cm}^3\\). Kantenlänge?", optionen: ["\\(2\\)", "\\(4\\)", "\\(6\\)", "\\(8\\)"], korrekt: 1, tipp: "\\(\\sqrt[3]{64}\\).", loesungsweg: "$$a = \\sqrt[3]{64} = 4\\,\\text{cm}$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Quadratisches Prisma, Grundseite \\(a = 6\\), Höhe 10. Volumen?", loesung: 360, toleranz: 0, tipp: "\\(G = 36\\).", loesungsweg: "$$V = 36 \\cdot 10 = 360$$" },
      // LEVEL 4
      { id: 19, level: 4, typ: "numerisch", frage: "Wassertank zylindrisch, \\(r = 50\\,\\text{cm}\\), \\(h = 100\\,\\text{cm}\\). Wie viele Liter (\\(\\pi = 3{,}14\\), 1 L = 1000 cm\\(^3\\))?", loesung: 785, toleranz: 2, tipp: "\\(V\\) in cm\\(^3\\), dann /1000.", loesungsweg: "$$V = 3{,}14 \\cdot 2500 \\cdot 100 = 785\\,000\\,\\text{cm}^3 = 785\\,\\text{L}$$" },
      { id: 20, level: 4, typ: "numerisch", frage: "Dreiecksprisma: gleichschenkliges Dreieck Basis 6, Höhe 4, Prismenhöhe 10. Volumen?", loesung: 120, toleranz: 0, tipp: "\\(G = 0{,}5 \\cdot 6 \\cdot 4 = 12\\).", loesungsweg: "$$V = 12 \\cdot 10 = 120$$" },
      { id: 21, level: 4, typ: "numerisch", frage: "Zylinder, \\(d = 10\\), \\(h = 20\\). Volumen (\\(\\pi = 3{,}14\\))?", loesung: 1570, toleranz: 5, tipp: "\\(r = 5\\).", loesungsweg: "$$V = 3{,}14 \\cdot 25 \\cdot 20 = 1570$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Quader-Aquarium \\(60 \\times 30 \\times 40\\,\\text{cm}\\). Volumen in Liter?", loesung: 72, toleranz: 0, tipp: "72\\,000 cm\\(^3\\).", loesungsweg: "$$V = 72\\,000\\,\\text{cm}^3 = 72\\,\\text{L}$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Rohr: Aussenradius \\(5\\), Innenradius \\(3\\), Länge \\(20\\). Materialvolumen (\\(\\pi = 3{,}14\\))?", loesung: 1004.8, toleranz: 2, tipp: "\\(\\pi (R^2 - r^2) h\\).", loesungsweg: "$$V = 3{,}14 \\cdot 16 \\cdot 20 = 1004{,}8$$" },
      { id: 24, level: 4, typ: "mc", frage: "Bei Verdopplung des Zylinderradius, gleichbleibender Höhe, vervielfacht sich \\(V\\) um ...", optionen: ["\\(2\\)", "\\(3\\)", "\\(4\\)", "\\(8\\)"], korrekt: 2, tipp: "\\(V \\propto r^2\\).", loesungsweg: "$$r \\to 2r \\implies r^2 \\to 4r^2$$" },
      // LEVEL 5
      { id: 25, level: 5, typ: "mc", frage: "Mia berechnet das Volumen eines Zylinders mit dem Durchmesser \\(8\\,\\text{cm}\\) und der Höhe \\(10\\,\\text{cm}\\): \\(V = 3{,}14 \\cdot 8^2 \\cdot 10 = 2009{,}6\\,\\text{cm}^3\\). Was ist dazu zu sagen?", optionen: ["Die Rechnung ist richtig.", "Falsch: In die Formel gehört der Radius \\(4\\,\\text{cm}\\), richtig sind \\(502{,}4\\,\\text{cm}^3\\).", "Falsch: Der Radius wird nicht quadriert, richtig sind \\(251{,}2\\,\\text{cm}^3\\).", "Falsch: Das Ergebnis muss noch halbiert werden, richtig sind \\(1004{,}8\\,\\text{cm}^3\\)."], korrekt: 1, tipp: "Welche Größe steht in der Grundfläche \\(\\pi r^2\\)?", loesungsweg: "Die Grundfläche ist \\(\\pi r^2\\) mit dem <b>Radius</b> \\(r = 4\\,\\text{cm}\\): $$V = 3{,}14 \\cdot 4^2 \\cdot 10 = 502{,}4\\,\\text{cm}^3$$ Mias Wert ist viermal zu groß, weil \\(8^2 = 4 \\cdot 4^2\\). Halbieren würde nur den Faktor \\(2\\) korrigieren, nicht den Faktor \\(4\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein quaderförmiges Aquarium ist innen \\(50\\,\\text{cm}\\) lang, \\(30\\,\\text{cm}\\) breit und \\(40\\,\\text{cm}\\) hoch. Es werden \\(45\\) Liter Wasser eingefüllt. Wie hoch steht das Wasser in cm?", loesung: 30, toleranz: 0, tipp: "Liter in cm³ umrechnen, dann durch die Grundfläche teilen.", loesungsweg: "\\(45\\,\\text{L} = 45\\,000\\,\\text{cm}^3\\). Das Wasser bildet einen Quader mit der Grundfläche \\(50 \\cdot 30 = 1500\\,\\text{cm}^2\\): $$h = \\frac{45\\,000}{1500} = 30\\,\\text{cm}$$ Die Höhe des Aquariums (\\(40\\,\\text{cm}\\)) zeigt nur, dass es nicht überläuft." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Quader hat eine quadratische Grundfläche und ist dreimal so hoch wie breit. Sein Volumen beträgt \\(375\\,\\text{cm}^3\\). Wie breit ist er in cm?", loesung: 5, toleranz: 0, tipp: "Alle drei Kanten mit derselben Unbekannten ausdrücken.", loesungsweg: "Breite \\(a\\), Tiefe \\(a\\), Höhe \\(3a\\): $$V = a \\cdot a \\cdot 3a = 3a^3 = 375 \\implies a^3 = 125$$ Wegen \\(5^3 = 125\\) ist \\(a = 5\\,\\text{cm}\\). Der Quader misst also \\(5 \\times 5 \\times 15\\,\\text{cm}\\)." },
      { id: 28, level: 5, typ: "mc", frage: "Ben berechnet die Oberfläche eines Würfels mit der Kantenlänge \\(3\\,\\text{cm}\\): \\(O = 3^2 \\cdot 4 = 36\\,\\text{cm}^2\\). Was ist dazu zu sagen?", optionen: ["Die Rechnung ist richtig.", "Falsch: Ein Würfel hat sechs Flächen, richtig sind \\(54\\,\\text{cm}^2\\).", "Falsch: Die Oberfläche ist \\(3^3 = 27\\,\\text{cm}^2\\).", "Falsch: Die Oberfläche ist \\(6 \\cdot 3 = 18\\,\\text{cm}^2\\)."], korrekt: 1, tipp: "Zähle die Flächen eines Würfels.", loesungsweg: "Ein Würfel hat <b>sechs</b> gleich große Quadrate als Begrenzungsflächen: $$O = 6 \\cdot 3^2 = 6 \\cdot 9 = 54\\,\\text{cm}^2$$ Ben hat wohl nur die vier Seitenflächen gezählt und Boden und Deckel vergessen. \\(3^3 = 27\\) wäre das Volumen." },
      { id: 29, level: 5, typ: "numerisch", frage: "Eine zylindrische Regentonne hat innen \\(60\\,\\text{cm}\\) Durchmesser und ist \\(80\\,\\text{cm}\\) hoch. Sie enthält bereits \\(141{,}3\\) Liter Wasser. Wie viele Liter passen noch hinein (\\(\\pi = 3{,}14\\), 2 Nachkommastellen)?", loesung: 84.78, toleranz: 0.3, tipp: "Erst das ganze Fassungsvermögen, dann die Differenz.", loesungsweg: "Radius \\(30\\,\\text{cm}\\). Gesamtvolumen: $$V = 3{,}14 \\cdot 30^2 \\cdot 80 = 226\\,080\\,\\text{cm}^3 = 226{,}08\\,\\text{L}$$ Es passen noch $$226{,}08 - 141{,}3 = 84{,}78\\,\\text{L}$$ hinein." },
      { id: 30, level: 5, typ: "numerisch", frage: "Ein Zylinder hat die Mantelfläche \\(188{,}4\\,\\text{cm}^2\\) und die Höhe \\(10\\,\\text{cm}\\). Berechne sein Volumen in cm\\(^3\\) (\\(\\pi = 3{,}14\\)).", loesung: 282.6, toleranz: 0.5, tipp: "Aus dem Mantel lässt sich der Radius gewinnen.", loesungsweg: "Der Mantel ist ein Rechteck aus Umfang und Höhe: $$2 \\cdot 3{,}14 \\cdot r \\cdot 10 = 188{,}4 \\implies r = \\frac{188{,}4}{62{,}8} = 3\\,\\text{cm}$$ Damit: $$V = 3{,}14 \\cdot 3^2 \\cdot 10 = 282{,}6\\,\\text{cm}^3$$" },
      // LEVEL 6
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Verdoppelt man alle drei Kanten eines Quaders, so verdoppelt sich auch seine Oberfläche.\" Stimmt das?", optionen: ["Ja, denn jede Kante wird doppelt so lang.", "Nein — die Oberfläche vervierfacht sich, das Volumen verachtfacht sich sogar.", "Nein — die Oberfläche verachtfacht sich.", "Das gilt nur beim Würfel, nicht beim allgemeinen Quader."], korrekt: 1, tipp: "Jede Seitenfläche ist ein Rechteck — was passiert mit einem Rechteck, wenn beide Seiten verdoppelt werden?", loesungsweg: "Jede Seitenfläche ist ein Rechteck \\(a \\cdot b\\). Werden beide Seiten verdoppelt, wird daraus \\(2a \\cdot 2b = 4ab\\) — jede Fläche <b>vervierfacht</b> sich, also auch die Summe: $$O_{\\text{neu}} = 2(4ab + 4ac + 4bc) = 4 \\cdot O$$ Das Volumen wächst mit dem Faktor \\(2^3 = 8\\). Längen \\(\\times 2\\), Flächen \\(\\times 4\\), Volumen \\(\\times 8\\) — beim Würfel wie bei jedem Quader." },
      { id: 32, level: 6, typ: "numerisch", frage: "Ein Würfel hat das gleiche Volumen wie ein Quader mit den Kanten \\(2\\,\\text{cm}\\), \\(4\\,\\text{cm}\\) und \\(8\\,\\text{cm}\\). Wie groß ist die Oberfläche des Würfels in cm\\(^2\\)?", loesung: 96, toleranz: 0, tipp: "Erst das Volumen, daraus die Kante, dann die Oberfläche.", loesungsweg: "Volumen des Quaders: \\(2 \\cdot 4 \\cdot 8 = 64\\,\\text{cm}^3\\). Der Würfel mit \\(a^3 = 64\\) hat die Kante \\(a = 4\\,\\text{cm}\\): $$O = 6 \\cdot 4^2 = 96\\,\\text{cm}^2$$ Zum Vergleich: Der Quader hat \\(2(8 + 16 + 32) = 112\\,\\text{cm}^2\\) — bei gleichem Volumen hat der Würfel die kleinere Oberfläche." },
      { id: 33, level: 6, typ: "numerisch", frage: "Zwei zylindrische Dosen fassen jeweils genau \\(1\\) Liter. Dose A ist \\(10\\,\\text{cm}\\) hoch, Dose B ist \\(40\\,\\text{cm}\\) hoch. Wie oft passt der Radius von B in den Radius von A, d. h. wie groß ist \\(r_A : r_B\\)?", loesung: 2, toleranz: 0.01, tipp: "Gleiches Volumen bei vierfacher Höhe — was muss mit \\(r^2\\) passieren?", loesungsweg: "Aus \\(\\pi r_A^2 \\cdot 10 = \\pi r_B^2 \\cdot 40\\) folgt $$r_A^2 = 4 \\, r_B^2 \\implies r_A = 2\\, r_B$$ Die vierfache Höhe wird durch den <b>halben</b> Radius ausgeglichen, weil der Radius quadratisch eingeht. Das Verhältnis ist \\(2\\); konkret: \\(r_A \\approx 5{,}64\\,\\text{cm}\\), \\(r_B \\approx 2{,}82\\,\\text{cm}\\)." },
      { id: 34, level: 6, typ: "mc", frage: "Zylinder A hat \\(r = 2\\,\\text{cm}\\) und \\(h = 8\\,\\text{cm}\\), Zylinder B hat \\(r = 4\\,\\text{cm}\\) und \\(h = 2\\,\\text{cm}\\). Behauptung: „Beide haben das gleiche Volumen, weil \\(2 \\cdot 8 = 4 \\cdot 2\\) ist.\" Was ist dazu zu sagen?", optionen: ["Die Volumina sind gleich, und die Begründung ist richtig.", "Die Volumina sind gleich, aber die Begründung ist falsch — entscheidend ist \\(r^2 \\cdot h\\), und hier gilt zufällig \\(4 \\cdot 8 = 16 \\cdot 2\\).", "Die Volumina sind verschieden — B ist doppelt so groß wie A.", "Die Volumina sind verschieden — A ist doppelt so groß wie B."], korrekt: 1, tipp: "Rechne beide Volumina als Vielfache von \\(\\pi\\) aus.", loesungsweg: "$$V_A = \\pi \\cdot 2^2 \\cdot 8 = 32\\pi, \\qquad V_B = \\pi \\cdot 4^2 \\cdot 2 = 32\\pi$$ Die Volumina sind tatsächlich gleich — aber nicht, weil \\(r \\cdot h\\) übereinstimmt, sondern weil \\(r^2 \\cdot h\\) übereinstimmt (\\(4 \\cdot 8 = 16 \\cdot 2 = 32\\)). Mit \\(r = 4\\), \\(h = 4\\) und \\(r = 8\\), \\(h = 2\\) wäre \\(r \\cdot h\\) ebenfalls gleich, die Volumina aber \\(64\\pi\\) und \\(128\\pi\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Aus einem Würfel mit der Kantenlänge \\(6\\,\\text{cm}\\) wird der größtmögliche Zylinder herausgedreht. Wie viel Prozent des Würfels sind Abfall (\\(\\pi = 3{,}14\\), 1 Nachkommastelle)?", loesung: 21.5, toleranz: 0.2, tipp: "Der Zylinder berührt alle vier Seitenflächen sowie Boden und Deckel.", loesungsweg: "Der größte Zylinder hat den Durchmesser \\(6\\,\\text{cm}\\) (also \\(r = 3\\)) und die Höhe \\(6\\,\\text{cm}\\): $$V_Z = 3{,}14 \\cdot 3^2 \\cdot 6 = 169{,}56\\,\\text{cm}^3, \\qquad V_W = 6^3 = 216\\,\\text{cm}^3$$ $$\\frac{216 - 169{,}56}{216} \\approx 0{,}215 = 21{,}5\\,\\%$$ Der Anteil ist für jede Kantenlänge gleich: \\(1 - \\frac{\\pi}{4}\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Dachboden hat die Form eines Dreiecksprismas: Das Haus ist \\(10\\,\\text{m}\\) lang und \\(8\\,\\text{m}\\) breit, der Dachraum fasst \\(120\\,\\text{m}^3\\). Wie hoch liegt der Dachfirst über dem Dachboden (in m)?", loesung: 3, toleranz: 0, tipp: "Vom Volumen zur Dreiecksfläche, von der Dreiecksfläche zur Höhe.", loesungsweg: "Die Grundfläche des Prismas ist der Dreiecksquerschnitt: $$G = \\frac{V}{l} = \\frac{120}{10} = 12\\,\\text{m}^2$$ Für das Dreieck mit der Basis \\(8\\,\\text{m}\\) gilt \\(\\tfrac12 \\cdot 8 \\cdot h = 12\\), also $$h = 3\\,\\text{m}$$" }];
    </script>
