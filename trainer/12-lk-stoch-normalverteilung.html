      { id:32, level:6, typ:"numerisch",
        frage:"Für \\(X \\sim B(30;\\,0{,}04)\\) soll \\(P(X \\le 2)\\) bestimmt werden. Ein Schüler sagt, die Normalnäherung sei erlaubt, weil \\(n\\) groß genug sei. Berechnen Sie \\(\\sigma\\) und beurteilen Sie seine Begründung.",
        loesung:1.07, toleranz:0.03,
        tipp:"Die Faustregel für die Näherung stellt eine Bedingung an die Streuung, nicht allein an den Umfang.",
        loesungsweg:"$$\\sigma = \\sqrt{n\\,p\\,(1-p)} = \\sqrt{30 \\cdot 0{,}04 \\cdot 0{,}96} = \\sqrt{1{,}152} \\approx 1{,}07$$ <b>Beurteilung:</b> Die Laplace-Bedingung verlangt \\(\\sigma \\gt 3\\); mit \\(\\sigma \\approx 1{,}07\\) ist sie deutlich verletzt. Die Begründung des Schülers greift also zu kurz: Nicht \\(n\\) allein entscheidet, sondern das Produkt \\(n\\,p\\,(1-p)\\). Bei \\(\\mu = n\\,p = 1{,}2\\) erwarteten Treffern kann die Verteilung nur wenige Werte annehmen und ist stark rechtsschief — links von \\(\\mu\\) liegen kaum drei Stufen, rechts viele. Eine symmetrische Glockenkurve kann das nicht abbilden; sie würde sogar nennenswerte Wahrscheinlichkeit auf negative Trefferzahlen legen. \\(P(X \\le 2)\\) ist hier exakt mit der Binomialverteilung zu berechnen."
      },
      { id:33, level:6, typ:"numerisch",
        frage:"Eine Maschine produziert mit einem Ausschussanteil von \\(3\\,\\%\\); geprüft werden 10 000 Teile. Der Hersteller behauptet, mehr als 330 defekte Teile seien „praktisch ausgeschlossen“. Bestimmen Sie \\(P(X \\gt 330)\\) mit der Normalnäherung und beurteilen Sie die Behauptung.",
        loesung:0.0393, toleranz:0.004,
        tipp:"Erst \\(\\mu\\) und \\(\\sigma\\) bestimmen und die Zulässigkeit der Näherung prüfen, dann standardisieren; die Beurteilung folgt am Ende aus der Größe des Ergebnisses.",
        loesungsweg:"$$\\mu = 10\\,000 \\cdot 0{,}03 = 300$$ $$\\sigma = \\sqrt{10\\,000 \\cdot 0{,}03 \\cdot 0{,}97} = \\sqrt{291} \\approx 17{,}06$$ Wegen \\(\\sigma \\gt 3\\) ist die Näherung zulässig. $$z = \\frac{330-300}{17{,}06} \\approx 1{,}759$$ $$P(X \\gt 330) \\approx 1 - \\Phi(1{,}759) \\approx 1 - 0{,}9607 = 0{,}0393$$ <b>Beurteilung:</b> In etwa \\(3{,}9\\,\\%\\) der Prüfungen treten mehr als 330 defekte Teile auf, also ungefähr in jeder 25. Lieferung. Das ist nicht „praktisch ausgeschlossen“, sondern ein Ereignis, das bei laufender Produktion regelmäßig eintritt. Die Behauptung ist damit zurückzuweisen. Erst jenseits von \\(\\mu + 3\\sigma\\), also ab etwa 352 Teilen, wäre die Sprechweise vertretbar."

      { id:34, level:6, typ:"numerisch",
        frage:"Zeigen Sie, dass die Dichtefunktion jeder Normalverteilung an den Stellen \\(\\mu \\pm \\sigma\\) denselben Bruchteil ihres Maximalwertes annimmt, und geben Sie diesen Bruchteil als Dezimalzahl auf vier Nachkommastellen an.",
        loesung:0.6065, toleranz:0.004,
        tipp:"Setze beide Stellen in den Funktionsterm der Dichte ein und bilde den Quotienten; die Vorfaktoren sollten sich wegkürzen.",
        loesungsweg:"Die Dichte ist $$\\varphi(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}}\\,e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}$$ Der Exponent ist null genau für \\(x = \\mu\\), sonst negativ; dort liegt also das Maximum: $$\\varphi(\\mu) = \\frac{1}{\\sigma\\sqrt{2\\pi}}$$ An den Stellen \\(x = \\mu \\pm \\sigma\\) ist \\((x-\\mu)^2 = \\sigma^2\\), der Exponent also \\(-\\frac{\\sigma^2}{2\\sigma^2} = -\\frac12\\): $$\\varphi(\\mu \\pm \\sigma) = \\frac{1}{\\sigma\\sqrt{2\\pi}}\\,e^{-\\frac12}$$ Der Quotient ist damit $$\\frac{\\varphi(\\mu \\pm \\sigma)}{\\varphi(\\mu)} = e^{-\\frac12} \\approx 0{,}6065$$ Weder \\(\\mu\\) noch \\(\\sigma\\) kommen darin vor — der Bruchteil ist also für <b>jede</b> Normalverteilung derselbe, rund \\(60{,}7\\,\\%\\). Genau darauf beruht die Vorstellung einer einzigen Kurvenform, die nur verschoben und gestreckt wird."

      { id:35, level:6, typ:"numerisch",
        frage:"Bei \\(X \\sim N(500;\\sigma^2)\\) soll \\(P(490 \\le X \\le 510) = 0{,}90\\) gelten. Bestimmen Sie \\(\\sigma\\); es gilt \\(\\Phi(1{,}645) = 0{,}95\\).",
        loesung:6.08, toleranz:0.07,
        tipp:"Das Intervall liegt symmetrisch um den Mittelwert — überlege zuerst, wie viel Fläche dadurch auf jeden der beiden Ränder fällt.",
        loesungsweg:"Das Intervall ist symmetrisch um \\(\\mu = 500\\). Mit \\(d = 10\\) gilt $$P(\\mu - d \\le X \\le \\mu + d) = 2\\Phi\\!\\left(\\frac{d}{\\sigma}\\right) - 1 = 0{,}90$$ $$\\Phi\\!\\left(\\frac{d}{\\sigma}\\right) = 0{,}95$$ Hier liegt die häufigste Falle: Nicht \\(0{,}90\\), sondern \\(0{,}95\\) ist der Tabellenwert, weil außerhalb je \\(5\\,\\%\\) auf die beiden Ränder fallen. Damit: $$\\frac{10}{\\sigma} = 1{,}645 \\;\\Longleftrightarrow\\; \\sigma = \\frac{10}{1{,}645} \\approx 6{,}08$$ Probe: \\(\\frac{10}{6{,}08} \\approx 1{,}645\\), und \\(2 \\cdot 0{,}95 - 1 = 0{,}90\\) — passt. Mit dem falschen Tabellenwert \\(z = 1{,}282\\) käme \\(\\sigma \\approx 7{,}80\\) heraus, also eine deutlich zu breite Verteilung."

      { id:36, level:6, typ:"numerisch",
        frage:"Die Körpergröße von Männern (in cm) wird mit \\(N(178;49)\\) modelliert. Bestimmen Sie den Anteil der Männer über 200 cm und beurteilen Sie, wie weit das Modell an den Rändern tragfähig ist.",

        loesungsweg:"Aus \\(N(178;49)\\) folgt \\(\\sigma = \\sqrt{49} = 7\\). Damit: $$z = \\frac{200-178}{7} \\approx 3{,}143$$ $$P(X \\gt 200) \\approx 1 - \\Phi(3{,}143) \\approx 1 - 0{,}99916 = 0{,}00084$$ Das sind etwa \\(0{,}084\\,\\%\\), also rund einer von 1200 Männern. <b>Beurteilung:</b> Im Mittelbereich beschreibt das Modell reale Daten gut. An den Rändern nicht: Die Normalverteilung ist auf ganz \\(\\mathbb{R}\\) definiert und weist deshalb auch Größen unter 0 cm eine — verschwindend kleine, aber positive — Wahrscheinlichkeit zu, hier \\(\\Phi(-25{,}4)\\). Das ist sachlich unmöglich und zeigt, dass die Glockenkurve nur eine Annäherung ist. Für Aussagen über extreme Ränder taugt sie nicht, denn dort entscheidet gerade die Form der Kurve über das Ergebnis, und die ist durch Messdaten kaum abgesichert."
