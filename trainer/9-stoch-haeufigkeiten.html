<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Häufigkeitsverteilungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-stoch-haeufigkeiten';
    const THEMA_CONFIG = { name: 'Häufigkeitsverteilungen', bereich: 'stochastik' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Was ist die absolute Häufigkeit?", optionen:["Anteil","Anzahl des Auftretens","Prozentsatz","Mittelwert"], korrekt:1, tipp:"Reine Anzahl.", loesungsweg:"Die absolute Häufigkeit zählt schlicht, wie oft ein Merkmalswert vorkommt — ohne Bezug zur Gesamtzahl. Kommt eine Note in einer Klasse siebenmal vor, ist ihre absolute Häufigkeit \\(7\\), gleichgültig ob die Klasse aus \\(20\\) oder \\(30\\) Schülern besteht. Erst die <b>relative</b> Häufigkeit setzt diese Zahl ins Verhältnis." },
      { id:2, level:1, typ:"mc", frage:"Relative Häufigkeit?", optionen:["abs. Häufigkeit / Stichprobenumfang","Summe aller","Maximum","Mittelwert"], korrekt:0, tipp:"Anteil.", loesungsweg:"Die relative Häufigkeit gibt den Anteil an der Gesamtzahl an: $$h = \\frac{H}{n}$$ mit der absoluten Häufigkeit \\(H\\) und dem Stichprobenumfang \\(n\\). Sie liegt stets zwischen \\(0\\) und \\(1\\) und erlaubt den Vergleich unterschiedlich großer Stichproben." },
      { id:3, level:1, typ:"mc", frage:"Was ist eine Stichprobe?", optionen:["Gesamtheit","Teilmenge einer Grundgesamtheit","Liste","Mittelwert"], korrekt:1, tipp:"Auswahl.", loesungsweg:"Eine Stichprobe ist eine <b>Teilmenge</b> der Grundgesamtheit — also der Ausschnitt, den man tatsächlich untersucht. Von ihr aus schließt man auf das Ganze; deshalb kommt es darauf an, dass sie die Grundgesamtheit gut abbildet." },
      { id:4, level:1, typ:"numerisch", frage:"Wird ein Merkmal 7-mal bei 20 Beobachtungen festgestellt: relative Häufigkeit?", loesung:0.35, toleranz:0.01, tipp:"\\(7/20\\).", loesungsweg:"$$h = \\frac{H}{n} = \\frac{7}{20} = 0{,}35$$ Das Merkmal tritt also bei \\(35\\,\\%\\) der Beobachtungen auf." },
      { id:5, level:1, typ:"numerisch", frage:"Summe aller relativen Häufigkeiten?", loesung:1, toleranz:0, tipp:"Ergibt immer 1.", loesungsweg:"Jede Beobachtung fällt in genau eine Kategorie. Zählt man alle Anteile zusammen, hat man damit alle Beobachtungen erfasst: $$\\sum h_i = \\frac{\\sum H_i}{n} = \\frac{n}{n} = 1$$ Die Summe ergibt also immer \\(1\\) beziehungsweise \\(100\\,\\%\\) — eine nützliche Kontrolle für jede Häufigkeitstabelle." },
      { id:6, level:1, typ:"numerisch", frage:"Bei \\(n=50\\), rel. Häufigkeit 0,2: absolute Häufigkeit?", loesung:10, toleranz:0, tipp:"\\(h\\cdot n\\).", loesungsweg:"Die Formel \\(h = \\frac{H}{n}\\) nach \\(H\\) umgestellt: $$H = h \\cdot n = 0{,}2 \\cdot 50 = 10$$" },
      { id:7, level:2, typ:"numerisch", frage:"Werte 2,3,3,4,5,5,5,6. Modalwert?", loesung:5, toleranz:0, tipp:"Häufigster.", loesungsweg:"Der Modalwert ist der am häufigsten vorkommende Wert. Auszählen: \\(2\\) einmal, \\(3\\) zweimal, \\(4\\) einmal, \\(5\\) <b>dreimal</b>, \\(6\\) einmal. Der Modalwert ist also \\(5\\)." },
      { id:8, level:2, typ:"numerisch", frage:"Werte 2,3,3,4,5,5,5,6. Median?", loesung:4.5, toleranz:0.01, tipp:"Mitte von 4 und 5.", loesungsweg:"Bei \\(8\\) geordneten Werten liegt der Median zwischen dem vierten und fünften: $$2,3,3,\\underline{4},\\underline{5},5,5,6 \\;\\Rightarrow\\; \\frac{4+5}{2} = 4{,}5$$" },
      { id:9, level:2, typ:"numerisch", frage:"Werte 2,3,3,4,5,5,5,6. Mittelwert (2 Dez).", loesung:4.13, toleranz:0.02, tipp:"Summe/8.", loesungsweg:"Summe aller Werte: \\(2+3+3+4+5+5+5+6 = 33\\). Geteilt durch die Anzahl: $$\\bar{x} = \\frac{33}{8} = 4{,}125 \\approx 4{,}13$$" },
      { id:10, level:2, typ:"numerisch", frage:"Werte 1,4,6,8,11. Spannweite?", loesung:10, toleranz:0, tipp:"Max-Min.", loesungsweg:"$$\\text{Spannweite} = \\text{Max} - \\text{Min} = 11 - 1 = 10$$" },
      { id:11, level:2, typ:"numerisch", frage:"Werte 2,2,3,4,4,4,5. Median?", loesung:4, toleranz:0, tipp:"Mitte bei ungerader Anzahl.", loesungsweg:"Bei \\(7\\) Werten ist der vierte der mittlere: $$2,2,3,\\underline{4},4,4,5 \\;\\Rightarrow\\; \\text{Median} = 4$$" },
      { id:12, level:2, typ:"mc", frage:"Der Modalwert ist …", optionen:["die Summe","der häufigste Wert","das arithmetische Mittel","der mittlere Wert"], korrekt:1, tipp:"Mode.", loesungsweg:"Der Modalwert (auch Modus) ist der Wert mit der größten Häufigkeit. Er ist das einzige Lagemaß, das sich auch für nicht-numerische Merkmale bilden lässt — etwa die häufigste Lieblingsfarbe. Eine Verteilung kann auch mehrere Modalwerte haben." },
      { id:13, level:3, typ:"numerisch", frage:"Umfrage \\(n=200\\): 60 sagen Ja. Rel. Häufigkeit Ja (2 Dez)?", loesung:0.30, toleranz:0.01, tipp:"\\(60/200\\).", loesungsweg:"$$h = \\frac{60}{200} = 0{,}30$$ Also haben \\(30\\,\\%\\) der Befragten mit Ja geantwortet." },
      { id:14, level:3, typ:"numerisch", frage:"Notenverteilung: 1x Note1, 3x Note2, 5x Note3, 7x Note4, 3x Note5, 1x Note6. Wie viele Schüler?", loesung:20, toleranz:0, tipp:"Summe.", loesungsweg:"Die Gesamtzahl ist die Summe aller absoluten Häufigkeiten: $$1 + 3 + 5 + 7 + 3 + 1 = 20$$ Diese Summe ist zugleich der Stichprobenumfang \\(n\\), den man für alle relativen Häufigkeiten braucht." },
      { id:15, level:3, typ:"numerisch", frage:"Notenverteilung: 1x Note1, 3x Note2, 5x Note3, 7x Note4, 3x Note5, 1x Note6. Durchschnittsnote (2 Dez).", loesung:3.55, toleranz:0.02, tipp:"\\(\\sum (x_i\\cdot h_i)/n\\).", loesungsweg:"\\(\\frac{1\\cdot1+2\\cdot3+3\\cdot5+4\\cdot7+5\\cdot3+6\\cdot1}{20}=\\frac{71}{20}=3{,}55\\)." },
      { id:16, level:3, typ:"numerisch", frage:"Notenverteilung wie oben: Modalwert?", loesung:4, toleranz:0, tipp:"Häufigste.", loesungsweg:"Gesucht ist die Note mit der größten Häufigkeit. Die Häufigkeiten lauten \\(1, 3, 5, 7, 3, 1\\) — der größte Wert ist \\(7\\) und gehört zur <b>Note 4</b>. Der Modalwert ist also die Note selbst, nicht ihre Anzahl." },
      { id:17, level:3, typ:"numerisch", frage:"Notenverteilung: Median?", loesung:4, toleranz:0, tipp:"Mitte der 20 Werte.", loesungsweg:"\\(1+3+5=9\\) Werte sind \\(\\le\\) Note 3. Note 4 belegt die Positionen 10–16, also sind der 10. und 11. Wert beide Note 4; Median \\(=\\frac{4+4}{2}=4\\)." },
      { id:18, level:3, typ:"mc", frage:"Warum Klasseneinteilung bei stetigen Daten?", optionen:["Pflicht","unübersichtlich, daher zusammenfassen","genauer","weniger genau"], korrekt:1, tipp:"Übersicht.", loesungsweg:"Stetige Merkmale wie Körpergröße oder Wartezeit nehmen praktisch lauter verschiedene Werte an; jede Einzelhäufigkeit wäre dann \\(1\\) und die Tabelle völlig unübersichtlich. Durch die Zusammenfassung zu Klassen wird die Verteilung überhaupt erst erkennbar — um den Preis, dass die Einzelwerte verloren gehen." },
      { id:19, level:4, typ:"numerisch", frage:"Klassen 10-20 (Häufigkeit 5), 20-30 (8), 30-40 (7). Klassenmittelwerte benutzen. \\(\\bar x\\) (2 Dez)?", loesung:26.00, toleranz:0.3, tipp:"\\((15\\cdot 5+25\\cdot 8+35\\cdot 7)/20\\).", loesungsweg:"Bei klassierten Daten rechnet man mit den Klassenmitten \\(15\\), \\(25\\) und \\(35\\), gewichtet mit ihren Häufigkeiten: $$\\bar{x} = \\frac{15 \\cdot 5 + 25 \\cdot 8 + 35 \\cdot 7}{20} = \\frac{75 + 200 + 245}{20} = \\frac{520}{20} = 26$$ Das Ergebnis ist eine Schätzung, weil die genaue Lage innerhalb der Klassen unbekannt ist." },
      { id:20, level:4, typ:"numerisch", frage:"Standardabweichung von 2,4,4,4,5,5,7,9 (n=8, 2 Dez).", loesung:2.00, toleranz:0.05, tipp:"\\(\\bar x=5\\); Quadratabw. Summe 32.", loesungsweg:"\\(\\sigma=\\sqrt{32/8}=2\\)." },
      { id:21, level:4, typ:"numerisch", frage:"Werte 1,2,2,3,3,3,4,5. Mittelwert?", loesung:2.88, toleranz:0.02, tipp:"\\(23/8\\).", loesungsweg:"Summe: \\(1+2+2+3+3+3+4+5 = 23\\), Anzahl \\(8\\): $$\\bar{x} = \\frac{23}{8} = 2{,}875 \\approx 2{,}88$$" },
      { id:22, level:4, typ:"numerisch", frage:"Münzwurf 1000-mal, 520 Kopf. Rel. Häufigkeit Kopf.", loesung:0.52, toleranz:0.005, tipp:"\\(520/1000\\).", loesungsweg:"$$h = \\frac{520}{1000} = 0{,}52$$ Der Wert liegt nahe bei der theoretischen Wahrscheinlichkeit \\(0{,}5\\) — bei \\(1000\\) Würfen ist eine solche Abweichung normal." },
      { id:23, level:4, typ:"numerisch", frage:"Histogramm-Klassen: Häufigkeiten 4,6,10,8,2. Modale Klasse – ihre Häufigkeit?", loesung:10, toleranz:0, tipp:"Maximum.", loesungsweg:"Die modale Klasse ist die mit der größten Häufigkeit. Von \\(4, 6, 10, 8, 2\\) ist \\(10\\) der größte Wert — gesucht war diese Häufigkeit selbst, also \\(10\\)." },
      { id:24, level:4, typ:"mc", frage:"Standardabweichung misst …", optionen:["Mitte","Streuung","Spannweite","Modalwert"], korrekt:1, tipp:"Streumaß.", loesungsweg:"Die Standardabweichung gibt an, wie weit die Werte im Mittel vom Mittelwert entfernt liegen. Zwei Datensätze können denselben Mittelwert haben und trotzdem völlig verschieden aussehen — erst ein Streumaß macht diesen Unterschied sichtbar." },
      { id:25, level:5, typ:"numerisch", frage:"Werte 3,7,7,12,18,20. Median?", loesung:9.5, toleranz:0.01, tipp:"Mittel von 7 und 12.", loesungsweg:"Bei \\(6\\) Werten liegt der Median zwischen dem dritten und vierten: $$3,7,\\underline{7},\\underline{12},18,20 \\;\\Rightarrow\\; \\frac{7+12}{2} = 9{,}5$$" },
      { id:26, level:5, typ:"numerisch", frage:"Werte 3,7,7,12,18,20. Spannweite?", loesung:17, toleranz:0, tipp:"20-3.", loesungsweg:"$$\\text{Spannweite} = 20 - 3 = 17$$" },
      { id:27, level:5, typ:"numerisch", frage:"Werte 5,5,5,5. Standardabweichung?", loesung:0, toleranz:0, tipp:"Alle gleich.", loesungsweg:"Die Standardabweichung misst die Abweichung vom Mittelwert. Hier ist \\(\\bar{x} = 5\\), und jeder Wert weicht um \\(0\\) davon ab: $$s = \\sqrt{\\frac{0+0+0+0}{4}} = 0$$ Eine Standardabweichung von \\(0\\) bedeutet immer, dass alle Werte gleich sind — und sie kann nie negativ werden." },
      { id:28, level:5, typ:"numerisch", frage:"\\(n=100\\), rel. Häufigkeit 35%. Absolut?", loesung:35, toleranz:0, tipp:"\\(0{,}35\\cdot 100\\).", loesungsweg:"$$H = h \\cdot n = 0{,}35 \\cdot 100 = 35$$" },
      { id:29, level:5, typ:"numerisch", frage:"Verteilung: \\(P(X=1)=0{,}2, P(X=2)=0{,}5, P(X=3)=0{,}3\\). Erwartungswert.", loesung:2.1, toleranz:0.02, tipp:"\\(\\sum x_iP_i\\).", loesungsweg:"Der Erwartungswert ist die mit den Wahrscheinlichkeiten gewichtete Summe der Werte: $$E(X) = 1 \\cdot 0{,}2 + 2 \\cdot 0{,}5 + 3 \\cdot 0{,}3 = 0{,}2 + 1{,}0 + 0{,}9 = 2{,}1$$ Er muss nicht einer der möglichen Werte sein — \\(2{,}1\\) tritt hier nie ein." },
      { id:30, level:5, typ:"mc", frage:"Bei Simulation mit großem \\(n\\) nähert sich die relative Häufigkeit an …", optionen:["den Modalwert","die Wahrscheinlichkeit","die Spannweite","den Median"], korrekt:1, tipp:"Gesetz der großen Zahlen.", loesungsweg:"Das ist das <b>Gesetz der großen Zahlen</b>: Je mehr Versuche durchgeführt werden, desto näher liegt die beobachtete relative Häufigkeit an der theoretischen Wahrscheinlichkeit. Für kleine Versuchszahlen sind dagegen große Abweichungen normal — bei zehn Münzwürfen ist \\(7\\)-mal Kopf nichts Ungewöhnliches." },
      { id:31, level:6, typ:"numerisch", frage:"Altersklassen: 0-10 (20), 10-20 (30), 20-30 (50). Mittelwert mit Klassenmitten (1 Dez).", loesung:18.0, toleranz:0.2, tipp:"\\((5\\cdot 20+15\\cdot 30+25\\cdot 50)/100\\).", loesungsweg:"Klassenmitten sind \\(5\\), \\(15\\) und \\(25\\), die Gesamtzahl ist \\(20+30+50 = 100\\): $$\\bar{x} = \\frac{5 \\cdot 20 + 15 \\cdot 30 + 25 \\cdot 50}{100} = \\frac{100 + 450 + 1250}{100} = 18{,}0$$" },
      { id:32, level:6, typ:"numerisch", frage:"Klassen 0–10 (20×), 10–20 (25×), 20–30 (55×), \\(n=100\\): Median-Klassenmitte?", loesung:25, toleranz:0.5, tipp:"Der 50. Wert liegt in 20–30.", loesungsweg:"Kumuliert: bis 20 sind es 45 Werte; der 50. Wert liegt in der Klasse 20–30. Klassenmitte \\(25\\)." },
      { id:33, level:6, typ:"numerisch", frage:"Datenreihe 2,4,4,4,5,5,7,9. Varianz?", loesung:4, toleranz:0.1, tipp:"\\(\\sigma^2\\).", loesungsweg:"Mittelwert: \\(\\frac{2+4+4+4+5+5+7+9}{8} = \\frac{40}{8} = 5\\). Quadratische Abweichungen: \\(9, 1, 1, 1, 0, 0, 4, 16\\), zusammen \\(32\\): $$\\sigma^2 = \\frac{32}{8} = 4$$ Die Standardabweichung ist die Wurzel daraus, also \\(2\\)." },
      { id:34, level:6, typ:"numerisch", frage:"Monatslohn-Verteilung: Median niedriger als Mittelwert bedeutet Verteilung ist …  Wähle Zahl: rechtsschief=1, linksschief=2, symmetrisch=3.", loesung:1, toleranz:0, tipp:"Einzelne hohe Werte ziehen Mittelwert hoch.", loesungsweg:"Einzelne sehr hohe Löhne ziehen den <b>Mittelwert</b> nach oben, während der Median als Positionswert davon unberührt bleibt. Liegt der Median also unter dem Mittelwert, gibt es am oberen Rand Ausreißer — die Verteilung ist <b>rechtsschief</b>. Genau das ist bei Einkommen der Regelfall." },
      { id:35, level:6, typ:"numerisch", frage:"\\(n=400\\) Würfe: Augenzahl 6 tritt 70-mal auf. Rel. Häufigkeit (3 Dez).", loesung:0.175, toleranz:0.005, tipp:"\\(70/400\\).", loesungsweg:"$$h = \\frac{70}{400} = 0{,}175$$ Zum Vergleich: Bei einem fairen Würfel wären \\(\\frac{1}{6} \\approx 0{,}167\\) zu erwarten." },
      { id:36, level:6, typ:"numerisch", frage:"Erwartete Anzahl 6er bei 600 Würfen eines fairen Würfels?", loesung:100, toleranz:0, tipp:"\\(600/6\\).", loesungsweg:"Jede Augenzahl tritt mit der Wahrscheinlichkeit \\(\\frac16\\) auf. Die erwartete Anzahl bei \\(600\\) Würfen ist $$600 \\cdot \\frac{1}{6} = 100$$ Das ist ein Erwartungswert, kein garantiertes Ergebnis — \\(95\\) oder \\(108\\) Sechser wären ebenso unauffällig." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
