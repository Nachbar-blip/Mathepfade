<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Häufigkeitsverteilungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-stoch-haeufigkeiten';
    const THEMA_CONFIG = { name: 'Häufigkeitsverteilungen', bereich: 'stochastik' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Was ist die absolute Häufigkeit?", optionen:["Anteil","Anzahl des Auftretens","Prozentsatz","Mittelwert"], korrekt:1, tipp:"Reine Anzahl.", loesungsweg:"Die absolute Häufigkeit zählt schlicht, wie oft ein Merkmalswert vorkommt — ohne Bezug zur Gesamtzahl. Kommt eine Note in einer Klasse siebenmal vor, ist ihre absolute Häufigkeit \\(7\\), gleichgültig ob die Klasse aus \\(20\\) oder \\(30\\) Schülern besteht. Erst die <b>relative</b> Häufigkeit setzt diese Zahl ins Verhältnis." },
      { id:2, level:1, typ:"mc", frage:"Relative Häufigkeit?", optionen:["abs. Häufigkeit / Stichprobenumfang","Summe aller","Maximum","Mittelwert"], korrekt:0, tipp:"Anteil.", loesungsweg:"Die relative Häufigkeit gibt den Anteil an der Gesamtzahl an: $$h = \\frac{H}{n}$$ mit der absoluten Häufigkeit \\(H\\) und dem Stichprobenumfang \\(n\\). Sie liegt stets zwischen \\(0\\) und \\(1\\) und erlaubt den Vergleich unterschiedlich großer Stichproben." },
      { id:3, level:1, typ:"mc", frage:"Was ist eine Stichprobe?", optionen:["Gesamtheit","Teilmenge einer Grundgesamtheit","Liste","Mittelwert"], korrekt:1, tipp:"Auswahl.", loesungsweg:"Eine Stichprobe ist eine <b>Teilmenge</b> der Grundgesamtheit — also der Ausschnitt, den man tatsächlich untersucht. Von ihr aus schließt man auf das Ganze; deshalb kommt es darauf an, dass sie die Grundgesamtheit gut abbildet." },
      { id:4, level:1, typ:"numerisch", frage:"Wird ein Merkmal 7-mal bei 20 Beobachtungen festgestellt: relative Häufigkeit?", loesung:0.35, toleranz:0.01, tipp:"\\(7/20\\).", loesungsweg:"$$h = \\frac{H}{n} = \\frac{7}{20} = 0{,}35$$ Das Merkmal tritt also bei \\(35\\,\\%\\) der Beobachtungen auf." },
      { id:5, level:1, typ:"numerisch", frage:"Summe aller relativen Häufigkeiten?", loesung:1, toleranz:0, tipp:"Ergibt immer 1.", loesungsweg:"Jede Beobachtung fällt in genau eine Kategorie. Zählt man alle Anteile zusammen, hat man damit alle Beobachtungen erfasst: $$\\sum h_i = \\frac{\\sum H_i}{n} = \\frac{n}{n} = 1$$ Die Summe ergibt also immer \\(1\\) beziehungsweise \\(100\\,\\%\\) — eine nützliche Kontrolle für jede Häufigkeitstabelle." },
      { id:6, level:1, typ:"numerisch", frage:"Bei \\(n=50\\), rel. Häufigkeit 0,2: absolute Häufigkeit?", loesung:10, toleranz:0, tipp:"\\(h\\cdot n\\).", loesungsweg:"Die Formel \\(h = \\frac{H}{n}\\) nach \\(H\\) umgestellt: $$H = h \\cdot n = 0{,}2 \\cdot 50 = 10$$" },
      { id:7, level:2, typ:"numerisch", frage:"Werte 2,3,3,4,5,5,5,6. Modalwert?", loesung:5, toleranz:0, tipp:"Häufigster.", loesungsweg:"Der Modalwert ist der am häufigsten vorkommende Wert. Auszählen: \\(2\\) einmal, \\(3\\) zweimal, \\(4\\) einmal, \\(5\\) <b>dreimal</b>, \\(6\\) einmal. Der Modalwert ist also \\(5\\)." },
      { id:8, level:2, typ:"numerisch", frage:"Werte 2,3,3,4,5,5,5,6. Median?", loesung:4.5, toleranz:0.01, tipp:"Mitte von 4 und 5.", loesungsweg:"Bei \\(8\\) geordneten Werten liegt der Median zwischen dem vierten und fünften: $$2,3,3,\\underline{4},\\underline{5},5,5,6 \\;\\Rightarrow\\; \\frac{4+5}{2} = 4{,}5$$" },
      { id:9, level:2, typ:"numerisch", frage:"Werte 2,3,3,4,5,5,5,6. Mittelwert (2 Dez).", loesung:4.13, toleranz:0.02, tipp:"Summe/8.", loesungsweg:"Summe aller Werte: \\(2+3+3+4+5+5+5+6 = 33\\). Geteilt durch die Anzahl: $$\\bar{x} = \\frac{33}{8} = 4{,}125 \\approx 4{,}13$$" },
      { id:10, level:2, typ:"numerisch", frage:"Werte 1,4,6,8,11. Spannweite?", loesung:10, toleranz:0, tipp:"Max-Min.", loesungsweg:"$$\\text{Spannweite} = \\text{Max} - \\text{Min} = 11 - 1 = 10$$" },
      { id:11, level:2, typ:"numerisch", frage:"Werte 2,2,3,4,4,4,5. Median?", loesung:4, toleranz:0, tipp:"Mitte bei ungerader Anzahl.", loesungsweg:"Bei \\(7\\) Werten ist der vierte der mittlere: $$2,2,3,\\underline{4},4,4,5 \\;\\Rightarrow\\; \\text{Median} = 4$$" },
      { id:12, level:2, typ:"mc", frage:"Der Modalwert ist …", optionen:["die Summe","der häufigste Wert","das arithmetische Mittel","der mittlere Wert"], korrekt:1, tipp:"Mode.", loesungsweg:"Der Modalwert (auch Modus) ist der Wert mit der größten Häufigkeit. Er ist das einzige Lagemaß, das sich auch für nicht-numerische Merkmale bilden lässt — etwa die häufigste Lieblingsfarbe. Eine Verteilung kann auch mehrere Modalwerte haben." },
      { id:13, level:3, typ:"numerisch", frage:"Umfrage \\(n=200\\): 60 sagen Ja. Rel. Häufigkeit Ja (2 Dez)?", loesung:0.30, toleranz:0.01, tipp:"\\(60/200\\).", loesungsweg:"$$h = \\frac{60}{200} = 0{,}30$$ Also haben \\(30\\,\\%\\) der Befragten mit Ja geantwortet." },
      { id:14, level:3, typ:"numerisch", frage:"Notenverteilung: 1x Note1, 3x Note2, 5x Note3, 7x Note4, 3x Note5, 1x Note6. Wie viele Schüler?", loesung:20, toleranz:0, tipp:"Summe.", loesungsweg:"Die Gesamtzahl ist die Summe aller absoluten Häufigkeiten: $$1 + 3 + 5 + 7 + 3 + 1 = 20$$ Diese Summe ist zugleich der Stichprobenumfang \\(n\\), den man für alle relativen Häufigkeiten braucht." },
      { id:15, level:3, typ:"numerisch", frage:"Notenverteilung: 1x Note1, 3x Note2, 5x Note3, 7x Note4, 3x Note5, 1x Note6. Durchschnittsnote (2 Dez).", loesung:3.55, toleranz:0.02, tipp:"\\(\\sum (x_i\\cdot h_i)/n\\).", loesungsweg:"\\(\\frac{1\\cdot1+2\\cdot3+3\\cdot5+4\\cdot7+5\\cdot3+6\\cdot1}{20}=\\frac{71}{20}=3{,}55\\)." },
      { id:16, level:3, typ:"numerisch", frage:"Notenverteilung: 1x Note 1, 3x Note 2, 5x Note 3, 7x Note 4, 3x Note 5, 1x Note 6. Modalwert?", loesung:4, toleranz:0, tipp:"Gesucht ist die Note, nicht ihre Anzahl.", loesungsweg:"Die Häufigkeiten lauten \\(1, 3, 5, 7, 3, 1\\); der größte Wert \\(7\\) gehört zur <b>Note 4</b>. Der Modalwert ist also \\(4\\)." },
      { id:17, level:3, typ:"numerisch", frage:"Notenverteilung: 1x Note 1, 3x Note 2, 5x Note 3, 7x Note 4, 3x Note 5, 1x Note 6. Median?", loesung:4, toleranz:0, tipp:"Zähle, an welcher Position der 10. und 11. Wert der geordneten Liste liegen.", loesungsweg:"Insgesamt \\(20\\) Werte. \\(1 + 3 + 5 = 9\\) Werte sind höchstens Note 3; Note 4 belegt die Positionen \\(10\\) bis \\(16\\). Der \\(10.\\) und \\(11.\\) Wert sind also beide Note 4: $$\\text{Median} = \\frac{4+4}{2} = 4$$" },
      { id:18, level:3, typ:"mc", frage:"Warum Klasseneinteilung bei stetigen Daten?", optionen:["Pflicht","unübersichtlich, daher zusammenfassen","genauer","weniger genau"], korrekt:1, tipp:"Übersicht.", loesungsweg:"Stetige Merkmale wie Körpergröße oder Wartezeit nehmen praktisch lauter verschiedene Werte an; jede Einzelhäufigkeit wäre dann \\(1\\) und die Tabelle völlig unübersichtlich. Durch die Zusammenfassung zu Klassen wird die Verteilung überhaupt erst erkennbar — um den Preis, dass die Einzelwerte verloren gehen." },
      { id:19, level:4, typ:"numerisch", frage:"In einer Umfrage antworteten \\(63\\) Personen mit Ja; das entspricht einer relativen Häufigkeit von \\(0{,}35\\). Wie viele Personen wurden befragt?", loesung:180, toleranz:0, tipp:"Die relative Häufigkeit setzt die \\(63\\) ins Verhältnis zur gesuchten Gesamtzahl.", loesungsweg:"$$h = \\frac{H}{n} \\quad\\Rightarrow\\quad n = \\frac{H}{h} = \\frac{63}{0{,}35} = 180$$" },
      { id:20, level:4, typ:"numerisch", frage:"Ein Würfel wird \\(240\\)-mal geworfen; die Sechs fällt \\(45\\)-mal. Nun wird derselbe Würfel weitere \\(1600\\)-mal geworfen. Wie viele Sechsen sind dabei ungefähr zu erwarten, wenn die bisherige relative Häufigkeit als Schätzwert für die Wahrscheinlichkeit dient?", loesung:300, toleranz:1, tipp:"Bestimme zuerst die relative Häufigkeit aus der ersten Serie.", loesungsweg:"Relative Häufigkeit: \\(\\frac{45}{240} = 0{,}1875\\). Erwartete Anzahl: $$0{,}1875 \\cdot 1600 = 300$$ Bei einem fairen Würfel wären es \\(\\frac{1600}{6} \\approx 267\\); der Würfel scheint die Sechs zu bevorzugen." },
      { id:21, level:4, typ:"numerisch", frage:"Bei einer Klassenarbeit gab es 2x Note 1, 6x Note 2, 9x Note 3, 6x Note 4 und einige Fünfen, keine Sechs. Der Notendurchschnitt beträgt genau \\(3{,}0\\). Wie viele Schüler bekamen die Note 5?", loesung:2, toleranz:0, tipp:"Bezeichne die Anzahl der Fünfen mit \\(x\\); Notensumme und Schülerzahl hängen beide von \\(x\\) ab.", loesungsweg:"Notensumme ohne Fünfen: \\(2 + 12 + 27 + 24 = 65\\); Schülerzahl ohne Fünfen: \\(23\\). $$\\frac{65 + 5x}{23 + x} = 3 \\quad\\Rightarrow\\quad 65 + 5x = 69 + 3x \\quad\\Rightarrow\\quad x = 2$$ Probe: \\(\\frac{75}{25} = 3{,}0\\)." },
      { id:22, level:4, typ:"mc", frage:"Ein Sportverein möchte das typische Alter seiner Mitglieder mit einer einzigen Zahl angeben. Die meisten Mitglieder sind zwischen \\(10\\) und \\(30\\), einige Ehrenmitglieder über \\(80\\). Welche Kenngröße eignet sich am besten?", optionen:["Der Median, weil einzelne hohe Werte ihn kaum beeinflussen", "Der Mittelwert, weil er alle Mitglieder gleich berücksichtigt", "Die Spannweite, weil sie den gesamten Altersbereich abdeckt", "Der Modalwert, weil er das am häufigsten vorkommende Alter nennt"], korrekt:0, tipp:"Überlege, wie stark jede Kenngröße auf wenige sehr große Werte reagiert.", loesungsweg:"Die wenigen sehr alten Mitglieder ziehen den Mittelwert deutlich nach oben; der Median als Positionswert bleibt davon nahezu unberührt und beschreibt das typische Mitglied besser. Die Spannweite ist gar kein Lagemaß, der Modalwert hängt bei vielen verschiedenen Altersangaben vom Zufall ab." },
      { id:23, level:4, typ:"numerisch", frage:"Wartezeiten an einer Kasse wurden in Klassen erfasst: \\(0\\) bis unter \\(5\\) Minuten: \\(12\\) Personen; \\(5\\) bis unter \\(10\\) Minuten: \\(18\\) Personen; \\(10\\) bis unter \\(20\\) Minuten: \\(10\\) Personen. Welcher Anteil der Personen wartete mindestens \\(5\\) Minuten? Gib die relative Häufigkeit als Dezimalzahl an.", loesung:0.7, toleranz:0.005, tipp:"Zwei Klassen zusammenfassen und auf die Gesamtzahl beziehen.", loesungsweg:"Gesamt: \\(12 + 18 + 10 = 40\\). Mindestens \\(5\\) Minuten: \\(18 + 10 = 28\\). $$h = \\frac{28}{40} = 0{,}7$$" },
      { id:24, level:4, typ:"numerisch", frage:"In Kurs A bestanden \\(40\\) von \\(50\\) Teilnehmern die Prüfung, in Kurs B \\(45\\) von \\(75\\). Wie groß ist die relative Häufigkeit des Bestehens, wenn beide Kurse zusammen betrachtet werden?", loesung:0.68, toleranz:0.005, tipp:"Die relativen Häufigkeiten der Kurse dürfen nicht einfach gemittelt werden.", loesungsweg:"Zusammen: \\(85\\) von \\(125\\). $$h = \\frac{85}{125} = 0{,}68$$ Der Mittelwert der Einzelwerte \\(\\frac{0{,}8 + 0{,}6}{2} = 0{,}7\\) wäre falsch, weil Kurs B mehr Teilnehmer hat." },
      { id:25, level:5, typ:"mc", frage:"Von \\(40\\) Schülern haben \\(16\\) ein Haustier. Jemand schreibt: „Relative Häufigkeit \\(= \\frac{16}{40} = 0{,}4 = 4\\,\\%\\).“ Was ist dazu zu sagen?", optionen:["Falsch, die Dezimalzahl \\(0{,}4\\) entspricht \\(40\\,\\%\\)", "Richtig, \\(0{,}4\\) und \\(4\\,\\%\\) bezeichnen denselben Anteil", "Falsch, die relative Häufigkeit ist \\(\\frac{40}{16} = 2{,}5\\)", "Falsch, es sind \\(24\\,\\%\\), weil \\(24\\) Schüler kein Haustier haben"], korrekt:0, tipp:"\\(1 = 100\\,\\%\\); was ist dann \\(0{,}4\\)?", loesungsweg:"Der Bruch und die Dezimalzahl stimmen. Fehler ist die Umrechnung: $$0{,}4 = \\frac{40}{100} = 40\\,\\%$$ Bei \\(4\\,\\%\\) hätten nur \\(1{,}6\\) Schüler ein Haustier." },
      { id:26, level:5, typ:"numerisch", frage:"Ein Glücksrad hat \\(10\\) gleich große Felder, von denen einige rot sind. Bei \\(2000\\) Drehungen blieb es \\(620\\)-mal auf Rot stehen. Wie viele Felder sind vermutlich rot?", loesung:3, toleranz:0, tipp:"Die relative Häufigkeit schätzt die Wahrscheinlichkeit; diese ist ein Anteil an den zehn Feldern.", loesungsweg:"Relative Häufigkeit: \\(\\frac{620}{2000} = 0{,}31\\). Bei \\(k\\) roten Feldern wäre die Wahrscheinlichkeit \\(\\frac{k}{10}\\). $$\\frac{k}{10} \\approx 0{,}31 \\quad\\Rightarrow\\quad k = 3$$ (\\(k = 3\\) ergäbe \\(0{,}3\\), \\(k = 4\\) schon \\(0{,}4\\); \\(0{,}31\\) liegt nahe bei \\(0{,}3\\).)" },
      { id:27, level:5, typ:"numerisch", frage:"Fünf Messwerte haben den Mittelwert \\(12\\). Vier davon lauten \\(9,\\ 11,\\ 13,\\ 15\\). Wie groß ist der fünfte Messwert?", loesung:12, toleranz:0, tipp:"Aus Mittelwert und Anzahl lässt sich die Summe aller Werte ermitteln.", loesungsweg:"Summe aller fünf Werte: \\(5 \\cdot 12 = 60\\). Die vier bekannten ergeben \\(48\\). $$x = 60 - 48 = 12$$" },
      { id:28, level:5, typ:"mc", frage:"Jemand bestimmt den Median der Werte \\(4,\\ 9,\\ 2,\\ 8\\) als \\(9\\), „weil \\(9\\) in der Mitte der Liste steht“. Was ist dazu zu sagen?", optionen:["Falsch, erst ordnen: \\(2, 4, 8, 9\\), der Median ist \\(\\frac{4+8}{2} = 6\\)", "Richtig, der Median ist der Wert in der Mitte der aufgeschriebenen Liste", "Falsch, der Median ist der Mittelwert der Werte, also \\(5{,}75\\)", "Falsch, bei einer geraden Anzahl von Werten gibt es keinen Median"], korrekt:0, tipp:"Der Median bezieht sich auf die der Größe nach geordnete Reihe.", loesungsweg:"Geordnet: \\(2, 4, 8, 9\\). Bei vier Werten ist der Median das Mittel der beiden mittleren: $$\\frac{4 + 8}{2} = 6$$ Die Reihenfolge in der Liste ist ohne Bedeutung." },
      { id:29, level:5, typ:"numerisch", frage:"In einer Klasse beträgt die relative Häufigkeit der Brillenträger \\(0{,}25\\). Kommen vier Brillenträger neu in die Klasse, beträgt sie \\(0{,}4\\). Wie viele Schüler waren ursprünglich in der Klasse?", loesung:16, toleranz:0, tipp:"Bezeichne die ursprüngliche Schülerzahl mit \\(n\\) und drücke die Anzahl der Brillenträger vor und nach dem Zugang durch \\(n\\) aus.", loesungsweg:"Vorher \\(0{,}25n\\) Brillenträger. Nachher: \\(0{,}25n + 4\\) Brillenträger bei \\(n + 4\\) Schülern. $$\\frac{0{,}25n + 4}{n + 4} = 0{,}4 \\quad\\Rightarrow\\quad 0{,}25n + 4 = 0{,}4n + 1{,}6 \\quad\\Rightarrow\\quad n = 16$$ Probe: \\(\\frac{4+4}{20} = 0{,}4\\)." },
      { id:30, level:5, typ:"numerisch", frage:"Klasse 9a (\\(24\\) Schüler) hat bei einer Arbeit den Durchschnitt \\(2{,}5\\), Klasse 9b (\\(16\\) Schüler) den Durchschnitt \\(3{,}0\\). Welchen Durchschnitt haben beide Klassen zusammen?", loesung:2.7, toleranz:0.01, tipp:"Rechne über die Notensummen beider Klassen; die beiden Durchschnitte einfach zu mitteln wäre falsch.", loesungsweg:"Notensummen: \\(24 \\cdot 2{,}5 = 60\\) und \\(16 \\cdot 3{,}0 = 48\\). $$\\bar{x} = \\frac{60 + 48}{40} = 2{,}7$$ Der ungewichtete Mittelwert \\(2{,}75\\) wäre falsch, weil die 9a mehr Schüler hat." },
      { id:31, level:6, typ:"mc", frage:"Bei zehn Würfen einer fairen Münze fiel achtmal Kopf. Behauptung: „Beim nächsten Wurf ist Zahl wahrscheinlicher, damit sich die Häufigkeiten wieder ausgleichen.“ Stimmt das?", optionen:["Nein, jeder Wurf hat unabhängig von der Vorgeschichte die Wahrscheinlichkeit \\(\\frac12\\) für Zahl", "Ja, das Gesetz der großen Zahlen erzwingt den Ausgleich in den nächsten Würfen", "Ja, denn die relative Häufigkeit von Kopf liegt mit \\(0{,}8\\) schon viel zu hoch", "Nein, Kopf ist jetzt wahrscheinlicher, weil die Münze offenbar Kopf bevorzugt"], korrekt:0, tipp:"Hat die Münze ein Gedächtnis?", loesungsweg:"Die Münze weiß nichts von früheren Würfen; die Wahrscheinlichkeit bleibt \\(\\frac12\\). Das Gesetz der großen Zahlen sagt nur, dass sich die <b>relative</b> Häufigkeit bei sehr vielen Würfen der \\(\\frac12\\) nähert, weil die ersten zehn Würfe dann kaum noch ins Gewicht fallen, nicht weil ein Ausgleich stattfindet. Acht von zehn ist bei einer fairen Münze auch nicht ungewöhnlich." },
      { id:32, level:6, typ:"numerisch", frage:"Nach \\(40\\) Würfen eines Würfels liegt die relative Häufigkeit der Sechs bei \\(0{,}25\\). Wie viele Sechsen müssen in den nächsten \\(20\\) Würfen fallen, damit die relative Häufigkeit nach \\(60\\) Würfen genau \\(\\frac16\\) beträgt?", loesung:0, toleranz:0, tipp:"Rechne aus, wie viele Sechsen bisher gefallen sind und wie viele es nach \\(60\\) Würfen insgesamt sein müssten.", loesungsweg:"Bisher: \\(0{,}25 \\cdot 40 = 10\\) Sechsen. Ziel: \\(\\frac16 \\cdot 60 = 10\\) Sechsen. $$10 - 10 = 0$$ In den nächsten \\(20\\) Würfen darf also keine einzige Sechs fallen; das ist möglich, aber unwahrscheinlich." },
      { id:33, level:6, typ:"mc", frage:"Von \\(30\\) geprüften Bauteilen war kein einziges defekt; die relative Häufigkeit eines Defekts ist also \\(0\\). Behauptung: „Dann ist die Wahrscheinlichkeit eines Defekts \\(0\\).“ Stimmt das?", optionen:["Nein, \\(30\\) Prüfungen sind für ein solches Urteil zu wenige", "Ja, eine relative Häufigkeit von \\(0\\) bedeutet Wahrscheinlichkeit \\(0\\)", "Ja, sonst wäre unter \\(30\\) Teilen ein defektes gewesen", "Nein, die Wahrscheinlichkeit beträgt dann genau \\(\\frac{1}{30}\\)"], korrekt:0, tipp:"Die relative Häufigkeit ist ein Schätzwert für die Wahrscheinlichkeit; wie verlässlich ist eine Schätzung aus wenigen Versuchen?", loesungsweg:"Die relative Häufigkeit schätzt die Wahrscheinlichkeit, und diese Schätzung wird erst bei vielen Versuchen verlässlich. Ist im Mittel etwa jedes hundertste Teil defekt, so ist es gut möglich, dass unter \\(30\\) Teilen keines darunter ist — aus \\(h = 0\\) folgt also nicht \\(P = 0\\). Ebenso wenig lässt sich aus einer Serie ohne jeden Defekt ein bestimmter Wert wie \\(\\frac{1}{30}\\) ablesen. Erst viele Prüfungen erlauben eine brauchbare Schätzung; ganz ausschließen lässt sich ein Defekt dadurch nie." },
      { id:34, level:6, typ:"mc", frage:"Behauptung: „Der Mittelwert einer Datenreihe ist immer einer der Werte dieser Reihe.“ Stimmt das?", optionen:["Nein, zum Beispiel haben \\(1\\) und \\(2\\) den Mittelwert \\(1{,}5\\)", "Ja, der Mittelwert liegt stets zwischen Minimum und Maximum, also in der Reihe", "Nein, aber der Median ist immer ein Wert der Reihe", "Ja, sofern die Reihe ungerade viele Werte hat"], korrekt:0, tipp:"Ein einziges Gegenbeispiel genügt, um eine Immer-Aussage zu widerlegen.", loesungsweg:"\\(\\frac{1 + 2}{2} = 1{,}5\\) kommt in der Reihe \\(1, 2\\) nicht vor; die Behauptung ist falsch. „Zwischen Minimum und Maximum“ heißt nicht „einer der Werte“. Auch der Median muss kein Wert der Reihe sein (bei gerader Anzahl ist er ein Mittel zweier Werte); bei ungerader Anzahl gilt das für den Median, nicht für den Mittelwert." },
      { id:35, level:6, typ:"numerisch", frage:"Die Datenreihe \\(3,\\ 8,\\ 10,\\ x\\) hat den Median \\(9\\). Für wie viele ganze Zahlen \\(x\\) mit \\(0 \\le x \\le 20\\) ist das der Fall?", loesung:11, toleranz:0, tipp:"Bei vier Werten liegt der Median zwischen den beiden mittleren; unterscheide danach, an welcher Stelle \\(x\\) in der geordneten Reihe steht.", loesungsweg:"Bei vier Werten ist der Median das Mittel der beiden mittleren Werte. Steht \\(x\\) hinten (\\(x \\ge 10\\)), lautet die geordnete Reihe \\(3,\\ 8,\\ 10,\\ x\\): $$\\frac{8 + 10}{2} = 9$$ und zwar für jedes solche \\(x\\). Steht \\(x\\) weiter vorn, ergibt sich \\(\\frac{3 + 8}{2} = 5{,}5\\) (für \\(x \\le 3\\)) oder \\(\\frac{x + 8}{2}\\) (für \\(3 \\le x \\le 10\\)); im zweiten Fall wäre \\(x = 10\\) nötig, was schon zum ersten Fall gehört. Es bleiben \\(10,\\ 11,\\ \\ldots,\\ 20\\), also \\(11\\) Zahlen." },
      { id:36, level:6, typ:"numerisch", frage:"In einer Klasse mit \\(25\\) Schülern hat die Note 3 die relative Häufigkeit \\(0{,}32\\). Die Note 2 kommt doppelt so oft vor wie die Note 1; die Noten 4, 5 und 6 haben zusammen \\(8\\) Schüler. Wie viele Schüler haben die Note 1?", loesung:3, toleranz:0, tipp:"Bestimme zuerst die Anzahl der Dreien; die restlichen Schüler verteilen sich auf Einsen und Zweien in einem festen Verhältnis.", loesungsweg:"Dreien: \\(0{,}32 \\cdot 25 = 8\\). Einsen und Zweien zusammen: \\(25 - 8 - 8 = 9\\). Mit \\(x\\) Einsen und \\(2x\\) Zweien: $$3x = 9 \\quad\\Rightarrow\\quad x = 3$$ Also \\(3\\) Einsen und \\(6\\) Zweien." }];
    </script>
