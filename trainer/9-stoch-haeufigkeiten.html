<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Häufigkeitsverteilungen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-stoch-haeufigkeiten';
    const THEMA_CONFIG = { name: 'Häufigkeitsverteilungen', bereich: 'stochastik' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Was ist die absolute Häufigkeit?", optionen:["Anteil","Anzahl des Auftretens","Prozentsatz","Mittelwert"], korrekt:1, tipp:"Reine Anzahl.", loesungsweg:"Absolute Häufigkeit = Anzahl." },
      { id:2, level:1, typ:"mc", frage:"Relative Häufigkeit?", optionen:["abs. Häufigkeit / Stichprobenumfang","Summe aller","Maximum","Mittelwert"], korrekt:0, tipp:"Anteil.", loesungsweg:"\\(h=\\frac{H}{n}\\)." },
      { id:3, level:1, typ:"mc", frage:"Was ist eine Stichprobe?", optionen:["Gesamtheit","Teilmenge einer Grundgesamtheit","Liste","Mittelwert"], korrekt:1, tipp:"Auswahl.", loesungsweg:"Teilmenge der Grundgesamtheit." },
      { id:4, level:1, typ:"numerisch", frage:"Wird ein Merkmal 7-mal bei 20 Beobachtungen festgestellt: relative Häufigkeit?", loesung:0.35, toleranz:0.01, tipp:"\\(7/20\\).", loesungsweg:"\\(0{,}35\\)." },
      { id:5, level:1, typ:"numerisch", frage:"Summe aller relativen Häufigkeiten?", loesung:1, toleranz:0, tipp:"Ergibt immer 1.", loesungsweg:"\\(1\\) (100%)." },
      { id:6, level:1, typ:"numerisch", frage:"Bei \\(n=50\\), rel. Häufigkeit 0,2: absolute Häufigkeit?", loesung:10, toleranz:0, tipp:"\\(h\\cdot n\\).", loesungsweg:"\\(10\\)." },
      { id:7, level:2, typ:"numerisch", frage:"Werte 2,3,3,4,5,5,5,6. Modalwert?", loesung:5, toleranz:0, tipp:"Häufigster.", loesungsweg:"\\(5\\) kommt 3x." },
      { id:8, level:2, typ:"numerisch", frage:"Gleiche Werte: Median?", loesung:4.5, toleranz:0.01, tipp:"Mitte von 4 und 5.", loesungsweg:"\\((4+5)/2=4{,}5\\)." },
      { id:9, level:2, typ:"numerisch", frage:"Gleiche Werte: Mittelwert (2 Dez).", loesung:4.13, toleranz:0.02, tipp:"Summe/8.", loesungsweg:"\\(33/8=4{,}125\\)." },
      { id:10, level:2, typ:"numerisch", frage:"Werte 1,4,6,8,11. Spannweite?", loesung:10, toleranz:0, tipp:"Max-Min.", loesungsweg:"\\(11-1=10\\)." },
      { id:11, level:2, typ:"numerisch", frage:"Werte 2,2,3,4,4,4,5. Median?", loesung:4, toleranz:0, tipp:"Mitte bei ungerader Anzahl.", loesungsweg:"4. Wert: \\(4\\)." },
      { id:12, level:2, typ:"mc", frage:"Der Modalwert ist …", optionen:["die Summe","der häufigste Wert","das arithmetische Mittel","der mittlere Wert"], korrekt:1, tipp:"Mode.", loesungsweg:"Häufigster Wert." },
      { id:13, level:3, typ:"numerisch", frage:"Umfrage \\(n=200\\): 60 sagen Ja. Rel. Häufigkeit Ja (2 Dez)?", loesung:0.30, toleranz:0.01, tipp:"\\(60/200\\).", loesungsweg:"\\(0{,}30\\)." },
      { id:14, level:3, typ:"numerisch", frage:"Notenverteilung: 1x Note1, 3x Note2, 5x Note3, 7x Note4, 3x Note5, 1x Note6. Wie viele Schüler?", loesung:20, toleranz:0, tipp:"Summe.", loesungsweg:"\\(20\\)." },
      { id:15, level:3, typ:"numerisch", frage:"Gleicher Datensatz: Durchschnittsnote (2 Dez).", loesung:3.40, toleranz:0.02, tipp:"\\(\\sum (x_i\\cdot h_i)/n\\).", loesungsweg:"\\(68/20=3{,}40\\)." },
      { id:16, level:3, typ:"numerisch", frage:"Notenverteilung wie oben: Modalwert?", loesung:4, toleranz:0, tipp:"Häufigste.", loesungsweg:"Note 4 (7x)." },
      { id:17, level:3, typ:"numerisch", frage:"Notenverteilung: Median?", loesung:3, toleranz:0, tipp:"Mitte der 20 Werte.", loesungsweg:"Position 10&11: beide Note 3 bzw. 4? 1+3+5=9 Noten ≤3; 10. Wert = Note 3, 11. Wert = Note 4; Median \\(=3{,}5\\). Antwort 3,5." },
      { id:18, level:3, typ:"mc", frage:"Warum Klasseneinteilung bei stetigen Daten?", optionen:["Pflicht","unübersichtlich, daher zusammenfassen","genauer","weniger genau"], korrekt:1, tipp:"Übersicht.", loesungsweg:"Zur übersichtlichen Darstellung." },
      { id:19, level:4, typ:"numerisch", frage:"Klassen 10-20 (Häufigkeit 5), 20-30 (8), 30-40 (7). Klassenmittelwerte benutzen. \\(\\bar x\\) (2 Dez)?", loesung:26.00, toleranz:0.3, tipp:"\\((15\\cdot 5+25\\cdot 8+35\\cdot 7)/20\\).", loesungsweg:"\\((75+200+245)/20=26\\)." },
      { id:20, level:4, typ:"numerisch", frage:"Standardabweichung von 2,4,4,4,5,5,7,9 (n=8, 2 Dez).", loesung:2.00, toleranz:0.05, tipp:"\\(\\bar x=5\\); Quadratabw. Summe 32.", loesungsweg:"\\(\\sigma=\\sqrt{32/8}=2\\)." },
      { id:21, level:4, typ:"numerisch", frage:"Werte 1,2,2,3,3,3,4,5. Mittelwert?", loesung:2.88, toleranz:0.02, tipp:"\\(23/8\\).", loesungsweg:"\\(\\approx 2{,}88\\)." },
      { id:22, level:4, typ:"numerisch", frage:"Münzwurf 1000-mal, 520 Kopf. Rel. Häufigkeit Kopf.", loesung:0.52, toleranz:0.005, tipp:"\\(520/1000\\).", loesungsweg:"\\(0{,}52\\)." },
      { id:23, level:4, typ:"numerisch", frage:"Histogramm-Klassen: Häufigkeiten 4,6,10,8,2. Modale Klasse – ihre Häufigkeit?", loesung:10, toleranz:0, tipp:"Maximum.", loesungsweg:"\\(10\\)." },
      { id:24, level:4, typ:"mc", frage:"Standardabweichung misst …", optionen:["Mitte","Streuung","Spannweite","Modalwert"], korrekt:1, tipp:"Streumaß.", loesungsweg:"Streuung um den Mittelwert." },
      { id:25, level:5, typ:"numerisch", frage:"Werte 3,7,7,12,18,20. Median?", loesung:9.5, toleranz:0.01, tipp:"Mittel von 7 und 12.", loesungsweg:"\\(9{,}5\\)." },
      { id:26, level:5, typ:"numerisch", frage:"Werte 3,7,7,12,18,20. Spannweite?", loesung:17, toleranz:0, tipp:"20-3.", loesungsweg:"\\(17\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Werte 5,5,5,5. Standardabweichung?", loesung:0, toleranz:0, tipp:"Alle gleich.", loesungsweg:"\\(0\\)." },
      { id:28, level:5, typ:"numerisch", frage:"\\(n=100\\), rel. Häufigkeit 35%. Absolut?", loesung:35, toleranz:0, tipp:"\\(0{,}35\\cdot 100\\).", loesungsweg:"\\(35\\)." },
      { id:29, level:5, typ:"numerisch", frage:"Verteilung: \\(P(X=1)=0{,}2, P(X=2)=0{,}5, P(X=3)=0{,}3\\). Erwartungswert.", loesung:2.1, toleranz:0.02, tipp:"\\(\\sum x_iP_i\\).", loesungsweg:"\\(0{,}2+1{,}0+0{,}9=2{,}1\\)." },
      { id:30, level:5, typ:"mc", frage:"Bei Simulation mit großem \\(n\\) nähert sich die relative Häufigkeit an …", optionen:["den Modalwert","die Wahrscheinlichkeit","die Spannweite","den Median"], korrekt:1, tipp:"Gesetz der großen Zahlen.", loesungsweg:"An die theoretische Wahrscheinlichkeit." },
      { id:31, level:6, typ:"numerisch", frage:"Altersklassen: 0-10 (20), 10-20 (30), 20-30 (50). Mittelwert mit Klassenmitten (1 Dez).", loesung:18.0, toleranz:0.2, tipp:"\\((5\\cdot 20+15\\cdot 30+25\\cdot 50)/100\\).", loesungsweg:"\\((100+450+1250)/100=18\\)." },
      { id:32, level:6, typ:"numerisch", frage:"Bei gleichem Datensatz: Median der Klasse (Klassenmitte)?", loesung:25, toleranz:0.5, tipp:"50. Wert liegt in 20-30.", loesungsweg:"Medianklasse 20-30, Klassenmitte \\(25\\)." },
      { id:33, level:6, typ:"numerisch", frage:"Datenreihe 2,4,4,4,5,5,7,9. Varianz?", loesung:4, toleranz:0.1, tipp:"\\(\\sigma^2\\).", loesungsweg:"\\(\\sigma^2=4\\)." },
      { id:34, level:6, typ:"numerisch", frage:"Monatslohn-Verteilung: Median niedriger als Mittelwert bedeutet Verteilung ist …  Wähle Zahl: rechtsschief=1, linksschief=2, symmetrisch=3.", loesung:1, toleranz:0, tipp:"Einzelne hohe Werte ziehen Mittelwert hoch.", loesungsweg:"Rechtsschief (1)." },
      { id:35, level:6, typ:"numerisch", frage:"\\(n=400\\) Würfe: Augenzahl 6 tritt 70-mal auf. Rel. Häufigkeit (3 Dez).", loesung:0.175, toleranz:0.005, tipp:"\\(70/400\\).", loesungsweg:"\\(0{,}175\\)." },
      { id:36, level:6, typ:"numerisch", frage:"Erwartete Anzahl 6er bei 600 Würfen eines fairen Würfels?", loesung:100, toleranz:0, tipp:"\\(600/6\\).", loesungsweg:"\\(100\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
