<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-stoch-hypothesentests';
    const THEMA_CONFIG = { name: 'Prognoseintervalle', bereich: 'stochastik' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Kennzahlen und Begriff ==========
      { id:1, level:1, typ:"numerisch", frage:"\\(n=400\\), \\(p=0{,}5\\). Berechne \\(\\mu\\).", loesung:200, toleranz:0, tipp:"Erwartungswert einer Bernoulli-Kette.", loesungsweg:"$$\\mu = n \\cdot p = 400 \\cdot 0{,}5 = 200$$" },
      { id:2, level:1, typ:"numerisch", frage:"\\(n=400\\), \\(p=0{,}5\\). Berechne \\(\\sigma\\).", loesung:10, toleranz:0.01, tipp:"In der Wurzel stehen drei Faktoren.", loesungsweg:"$$\\sigma = \\sqrt{np(1-p)} = \\sqrt{400 \\cdot 0{,}5 \\cdot 0{,}5} = \\sqrt{100} = 10$$" },
      { id:3, level:1, typ:"mc", frage:"Was gibt ein Prognoseintervall an?", optionen:["Den Bereich, in dem die Häufigkeit bei bekanntem \\(p\\) liegt","Den Bereich, in dem \\(p\\) bei bekannter Häufigkeit liegt","Den Bereich aller überhaupt möglichen Trefferzahlen","Den Bereich, in dem der Erwartungswert schwankt"], korrekt:0, tipp:"Achte auf die Richtung des Schlusses: Was ist gegeben, was gesucht?", loesungsweg:"Ein Prognoseintervall schließt von einem <b>bekannten</b> \\(p\\) auf die zu erwartende Häufigkeit: man sagt vorher, in welchem Bereich das Ergebnis der Stichprobe voraussichtlich liegt. Der umgekehrte Schluss — von einer beobachteten Häufigkeit auf das unbekannte \\(p\\) — führt auf ein anderes Intervall und ist hier nicht gemeint. Der Erwartungswert selbst schwankt nicht; er ist eine feste Zahl." },
      { id:4, level:1, typ:"numerisch", frage:"\\(n=900\\), \\(p=\\tfrac13\\). Berechne \\(\\mu\\).", loesung:300, toleranz:0, tipp:"Anzahl mal Wahrscheinlichkeit.", loesungsweg:"$$\\mu = 900 \\cdot \\tfrac13 = 300$$" },
      { id:5, level:1, typ:"mc", frage:"Mit welchem Faktor vor \\(\\sigma\\) arbeitet man beim \\(95\\,\\%\\)-Prognoseintervall in der Sigma-Näherung?", optionen:["mit dem Faktor \\(1\\)","mit dem Faktor \\(2\\)","mit dem Faktor \\(3\\)","mit dem Faktor \\(4\\)"], korrekt:1, tipp:"Erinnere dich an die drei Sigma-Regeln und ihre Prozentwerte.", loesungsweg:"Die 2\\(\\sigma\\)-Umgebung deckt etwa \\(95{,}4\\,\\%\\) ab und dient deshalb als \\(95\\,\\%\\)-Prognoseintervall: $$[\\mu - 2\\sigma;\\, \\mu + 2\\sigma]$$ Zum Faktor \\(1\\) gehören rund \\(68{,}3\\,\\%\\), zum Faktor \\(3\\) rund \\(99{,}7\\,\\%\\)." },
      { id:6, level:1, typ:"numerisch", frage:"\\(n=100\\), \\(p=0{,}36\\). Berechne \\(\\sigma\\) (1 Nachkommastelle).", loesung:4.8, toleranz:0.05, tipp:"Der Faktor \\(1-p\\) darf nicht fehlen.", loesungsweg:"$$\\sigma = \\sqrt{100 \\cdot 0{,}36 \\cdot 0{,}64} = \\sqrt{23{,}04} = 4{,}8$$" },
      // ========== LEVEL 2 — Grenzen des 95-%-Intervalls ==========
      { id:7, level:2, typ:"numerisch", frage:"\\(n=400\\), \\(p=0{,}5\\). Gib die untere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die Anzahl an.", loesung:180, toleranz:0, tipp:"Zwei Schritte: Kennzahlen bestimmen, dann zwei Standardabweichungen abziehen.", loesungsweg:"$$\\mu = 200, \\quad \\sigma = 10$$ $$\\mu - 2\\sigma = 200 - 20 = 180$$ Die Grenze ist hier ganzzahlig, gerundet werden muss nicht." },
      { id:8, level:2, typ:"numerisch", frage:"\\(n=400\\), \\(p=0{,}5\\). Gib die obere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die Anzahl an.", loesung:220, toleranz:0, tipp:"Dieselben Kennzahlen, nur die andere Seite.", loesungsweg:"$$\\mu + 2\\sigma = 200 + 2 \\cdot 10 = 220$$ Das Intervall lautet also \\([180;\\,220]\\) und ist \\(4\\sigma = 40\\) breit." },
      { id:9, level:2, typ:"numerisch", frage:"\\(n=100\\), \\(p=0{,}36\\). Gib die untere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die Anzahl als ganze Zahl an.", loesung:26, toleranz:0, tipp:"Nach der Rechnung auf eine ganze Zahl runden — und zwar so, dass das Intervall nicht schmaler wird.", loesungsweg:"$$\\mu = 36, \\quad \\sigma = 4{,}8$$ $$\\mu - 2\\sigma = 36 - 9{,}6 = 26{,}4$$ Die untere Grenze wird <b>abgerundet</b> auf \\(26\\), damit das Intervall nach außen erweitert wird und die \\(95\\,\\%\\) sicher erfasst bleiben." },
      { id:10, level:2, typ:"numerisch", frage:"\\(n=2500\\), \\(p=0{,}2\\). Berechne \\(\\sigma\\).", loesung:20, toleranz:0.05, tipp:"Erst das Produkt unter der Wurzel ausrechnen, dann die Wurzel ziehen.", loesungsweg:"$$\\sigma = \\sqrt{2500 \\cdot 0{,}2 \\cdot 0{,}8} = \\sqrt{400} = 20$$ Der Erwartungswert beträgt \\(\\mu = 500\\); wegen \\(\\sigma \\gt 3\\) darf mit der Sigma-Näherung gearbeitet werden." },
      { id:11, level:2, typ:"numerisch", frage:"\\(n=2500\\), \\(p=0{,}2\\). Gib die obere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die Anzahl an.", loesung:540, toleranz:0, tipp:"Erwartungswert bestimmen und zwei Standardabweichungen addieren.", loesungsweg:"$$\\mu = 2500 \\cdot 0{,}2 = 500, \\quad \\sigma = 20$$ $$\\mu + 2\\sigma = 500 + 40 = 540$$ Das Intervall \\([460;\\,540]\\) ist \\(80\\) Einheiten breit, bezogen auf \\(n=2500\\) also nur gut \\(3\\,\\%\\) des Umfangs." },
      { id:12, level:2, typ:"mc", frage:"Warum wird beim Prognoseintervall die untere Grenze abgerundet und die obere aufgerundet?", optionen:["Damit das Intervall die angegebene Wahrscheinlichkeit behält","Damit beide Grenzen gleich viele Stellen bekommen","Weil der Erwartungswert immer eine ganze Zahl ist","Weil die Standardabweichung stets aufgerundet wird"], korrekt:0, tipp:"Überlege, was mit der Wahrscheinlichkeit geschieht, wenn man das Intervall an einer Seite verkleinert.", loesungsweg:"Die Anzahl der Treffer ist ganzzahlig, die Grenzen \\(\\mu \\pm 2\\sigma\\) sind es meist nicht. Rundet man nach innen, fällt ein möglicher Wert samt seiner Wahrscheinlichkeit heraus und das Intervall erfasst weniger als \\(95\\,\\%\\). Beim Runden nach außen — unten ab, oben auf — wird es höchstens etwas zu groß, die Aussage bleibt also gültig." },
      // ========== LEVEL 3 — absolute und relative Häufigkeit ==========
      { id:13, level:3, typ:"numerisch", frage:"\\(n=1000\\), \\(p=0{,}4\\). Gib die untere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die <b>relative</b> Häufigkeit in Prozent an (2 Nachkommastellen).", loesung:36.9, toleranz:0.06, tipp:"Erst das Intervall für die Anzahl, dann beide Grenzen durch \\(n\\) teilen.", loesungsweg:"$$\\mu = 400, \\quad \\sigma = \\sqrt{1000 \\cdot 0{,}4 \\cdot 0{,}6} = \\sqrt{240} \\approx 15{,}49$$ $$\\mu - 2\\sigma \\approx 400 - 30{,}98 = 369{,}02$$ Division durch \\(n = 1000\\) liefert die relative Häufigkeit: $$\\frac{369{,}02}{1000} = 0{,}36902 \\approx 36{,}90\\,\\%$$ Bei relativen Häufigkeiten wird nicht auf ganze Zahlen gerundet — die Ganzzahligkeit betrifft nur die Anzahl." },
      { id:14, level:3, typ:"numerisch", frage:"\\(n=1000\\), \\(p=0{,}4\\). Gib die obere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die <b>relative</b> Häufigkeit in Prozent an (2 Nachkommastellen).", loesung:43.1, toleranz:0.06, tipp:"Dieselbe Standardabweichung, nur die andere Richtung; danach durch \\(n\\) teilen.", loesungsweg:"$$\\mu + 2\\sigma \\approx 400 + 30{,}98 = 430{,}98 \\;\\Rightarrow\\; \\frac{430{,}98}{1000} \\approx 43{,}10\\,\\%$$ Das Intervall für die relative Häufigkeit lautet also etwa \\([36{,}90\\,\\%;\\, 43{,}10\\,\\%]\\) — rund \\(3{,}1\\) Prozentpunkte um die \\(40\\,\\%\\) herum." },
      { id:15, level:3, typ:"numerisch", frage:"\\(n=600\\), \\(p=0{,}5\\). Wie breit ist das \\(95\\,\\%\\)-Prognoseintervall für die Anzahl? (1 Nachkommastelle)", loesung:49, toleranz:0.3, tipp:"Die Breite ergibt sich unmittelbar aus \\(\\sigma\\), der Erwartungswert wird dafür nicht gebraucht.", loesungsweg:"$$\\sigma = \\sqrt{600 \\cdot 0{,}5 \\cdot 0{,}5} = \\sqrt{150} \\approx 12{,}25$$ Das Intervall reicht \\(2\\sigma\\) nach jeder Seite, ist also $$4\\sigma \\approx 48{,}99$$ Einheiten breit. Der Erwartungswert \\(\\mu = 300\\) legt nur die Lage fest, nicht die Breite." },
      { id:16, level:3, typ:"numerisch", frage:"Eine Münze wird \\(10\\,000\\)-mal geworfen. Gib die untere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die <b>relative</b> Häufigkeit von Kopf in Prozent an (2 Nachkommastellen).", loesung:49, toleranz:0.06, tipp:"Die Trefferwahrscheinlichkeit folgt aus dem Sachverhalt; danach wie gewohnt in zwei Schritten.", loesungsweg:"Faire Münze, also \\(p = 0{,}5\\): $$\\mu = 5000, \\quad \\sigma = \\sqrt{10000 \\cdot 0{,}25} = \\sqrt{2500} = 50$$ $$\\mu - 2\\sigma = 5000 - 100 = 4900 \\;\\Rightarrow\\; \\frac{4900}{10000} = 49{,}00\\,\\%$$ Bei \\(10\\,000\\) Würfen liegt die relative Häufigkeit also mit etwa \\(95\\,\\%\\) zwischen \\(49\\,\\%\\) und \\(51\\,\\%\\) — ein Prozentpunkt Spielraum nach jeder Seite." },
      { id:17, level:3, typ:"numerisch", frage:"\\(n=900\\), \\(p=0{,}2\\). Gib die obere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die Anzahl an.", loesung:204, toleranz:0, tipp:"Kennzahlen bestimmen; die Standardabweichung ist hier eine ganze Zahl.", loesungsweg:"$$\\mu = 180, \\quad \\sigma = \\sqrt{900 \\cdot 0{,}2 \\cdot 0{,}8} = \\sqrt{144} = 12$$ $$\\mu + 2\\sigma = 180 + 24 = 204$$ Das Intervall \\([156;\\,204]\\) ist \\(48\\) Einheiten breit." },
      { id:18, level:3, typ:"numerisch", frage:"\\(n=1600\\), \\(p=0{,}25\\). Gib die obere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die <b>relative</b> Häufigkeit in Prozent an (2 Nachkommastellen).", loesung:27.17, toleranz:0.06, tipp:"Zuerst die Grenze für die Anzahl, dann auf den Umfang beziehen.", loesungsweg:"$$\\mu = 400, \\quad \\sigma = \\sqrt{1600 \\cdot 0{,}25 \\cdot 0{,}75} = \\sqrt{300} \\approx 17{,}32$$ $$\\mu + 2\\sigma \\approx 400 + 34{,}64 = 434{,}64 \\;\\Rightarrow\\; \\frac{434{,}64}{1600} \\approx 27{,}17\\,\\%$$ Der Abstand zu den \\(25\\,\\%\\) beträgt nur gut zwei Prozentpunkte, obwohl es absolut fast \\(35\\) Stück sind." },
      // ========== LEVEL 4 — Beobachtung beurteilen, Modell aus Text ==========
      { id:19, level:4, typ:"numerisch", frage:"Ein Würfel wird \\(600\\)-mal geworfen; dabei fallen \\(128\\) Sechsen. Um wie viele Standardabweichungen weicht dieses Ergebnis von der Erwartung bei einem fairen Würfel ab? (2 Nachkommastellen)", loesung:3.07, toleranz:0.06, tipp:"Trefferwahrscheinlichkeit aus dem Sachverhalt erschließen, dann die Abweichung in Einheiten von \\(\\sigma\\) ausdrücken.", loesungsweg:"Fairer Würfel, also \\(p = \\tfrac16\\): $$\\mu = 100, \\quad \\sigma = \\sqrt{600 \\cdot \\tfrac16 \\cdot \\tfrac56} = \\sqrt{\\tfrac{250}{3}} \\approx 9{,}13$$ $$\\frac{128 - 100}{9{,}13} \\approx 3{,}07$$ Der Wert liegt jenseits von \\(3\\sigma\\), also weit außerhalb des \\(95\\,\\%\\)-Prognoseintervalls \\([82;\\,119]\\). Für einen fairen Würfel ist das ein sehr ungewöhnliches Ergebnis." },
      { id:20, level:4, typ:"numerisch", frage:"Bei \\(n=500\\) Versuchen werden \\(230\\) Erfolge beobachtet. Gib die untere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für \\(p=0{,}5\\) als ganze Zahl an und entscheide damit, ob die Beobachtung zu \\(p=0{,}5\\) passt.", loesung:227, toleranz:0, tipp:"Erst das Intervall zur Annahme \\(p=0{,}5\\) aufstellen, dann die Beobachtung dagegen halten.", loesungsweg:"$$\\mu = 250, \\quad \\sigma = \\sqrt{500 \\cdot 0{,}25} = \\sqrt{125} \\approx 11{,}18$$ $$\\mu - 2\\sigma \\approx 250 - 22{,}36 = 227{,}64 \\;\\longrightarrow\\; 227$$ Das Intervall lautet \\([227;\\,273]\\). Die Beobachtung \\(230\\) liegt darin, ist mit \\(p = 0{,}5\\) also gut verträglich — obwohl sie \\(20\\) Erfolge unter dem Erwartungswert liegt." },
      { id:21, level:4, typ:"mc", frage:"Bei \\(n=400\\) werden \\(240\\) Erfolge beobachtet. Welcher der vier Werte für \\(p\\) lässt sich auf dem \\(95\\,\\%\\)-Niveau ausschließen?", optionen:["\\(p=0{,}50\\)","\\(p=0{,}56\\)","\\(p=0{,}60\\)","\\(p=0{,}64\\)"], korrekt:0, tipp:"Für jeden Wert das eigene Prognoseintervall aufstellen und prüfen, ob die Beobachtung darin liegt.", loesungsweg:"Jeder Kandidat für \\(p\\) hat sein eigenes Intervall \\(\\mu \\pm 2\\sigma\\): $$p=0{,}50:\\; [180;\\,220] \\qquad p=0{,}56:\\; [204;\\,244]$$ $$p=0{,}60:\\; [220;\\,260] \\qquad p=0{,}64:\\; [236;\\,276]$$ Nur bei \\(p = 0{,}50\\) liegt die Beobachtung \\(240\\) außerhalb; dieser Wert ist auszuschließen. Die anderen drei bleiben verträglich — ein einzelnes Ergebnis legt \\(p\\) also nicht fest, es grenzt nur ein." },
      { id:22, level:4, typ:"numerisch", frage:"Eine Partei rechnet mit \\(30\\,\\%\\) Zustimmung. In einer Umfrage werden \\(1200\\) Personen befragt. Gib die obere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die Zahl der Zustimmenden als ganze Zahl an.", loesung:392, toleranz:0, tipp:"Aus dem Text die Kennzahlen gewinnen und am Ende nach außen runden.", loesungsweg:"$$\\mu = 1200 \\cdot 0{,}3 = 360, \\quad \\sigma = \\sqrt{1200 \\cdot 0{,}3 \\cdot 0{,}7} = \\sqrt{252} \\approx 15{,}87$$ $$\\mu + 2\\sigma \\approx 360 + 31{,}75 = 391{,}75 \\;\\longrightarrow\\; 392$$ Bei tatsächlich \\(30\\,\\%\\) Zustimmung sind Umfrageergebnisse zwischen \\(328\\) und \\(392\\) Nennungen nichts Besonderes." },
      { id:23, level:4, typ:"numerisch", frage:"Eine Lehrkraft erwartet bei einer Aufgabe eine Fehlerquote von \\(20\\,\\%\\). Von \\(250\\) Bearbeitungen sind \\(71\\) falsch. Gib die obere Grenze des \\(95\\,\\%\\)-Prognoseintervalls für die relative Fehlerquote in Prozent an (2 Nachkommastellen) und beurteile die Beobachtung.", loesung:25.06, toleranz:0.06, tipp:"Zuerst die Grenze für die Anzahl, dann auf den Umfang beziehen und die beobachtete Quote gegenüberstellen.", loesungsweg:"$$\\mu = 50, \\quad \\sigma = \\sqrt{250 \\cdot 0{,}2 \\cdot 0{,}8} = \\sqrt{40} \\approx 6{,}32$$ $$\\mu + 2\\sigma \\approx 50 + 12{,}65 = 62{,}65 \\;\\Rightarrow\\; \\frac{62{,}65}{250} \\approx 25{,}06\\,\\%$$ Beobachtet wurden \\(71/250 = 28{,}4\\,\\%\\) — deutlich über der Grenze. Die Annahme von \\(20\\,\\%\\) passt also nicht gut zu dieser Bearbeitung." },
      { id:24, level:4, typ:"mc", frage:"Welche Aussage beschreibt zutreffend, was ein Prognoseintervall leistet?", optionen:["Es sagt bei bekanntem \\(p\\) das Stichprobenergebnis voraus","Es bestimmt aus dem Stichprobenergebnis den Wert von \\(p\\)","Es gibt die Wahrscheinlichkeit einer einzelnen Trefferzahl an","Es legt fest, wie groß der Stichprobenumfang sein muss"], korrekt:0, tipp:"Frage bei jeder Antwort, welche Größe als bekannt vorausgesetzt wird und welche gesucht ist.", loesungsweg:"Beim Prognoseintervall ist \\(p\\) <b>gegeben</b>, das Stichprobenergebnis ist <b>gesucht</b>: man prognostiziert, in welchem Bereich die Häufigkeit liegen wird. Der umgekehrte Schluss vom Ergebnis auf \\(p\\) ist eine andere Aufgabe und führt auf ein anderes Intervall. Auch die Wahrscheinlichkeit einer einzelnen Trefferzahl leistet das Intervall nicht — es benennt einen ganzen Bereich." },
      // ========== LEVEL 5 — Umfang aus Forderung, Fehlersuche, zwei Bedingungen ==========
      { id:25, level:5, typ:"numerisch", frage:"Bei \\(p=0{,}5\\) soll das \\(95\\,\\%\\)-Prognoseintervall für die relative Häufigkeit höchstens \\(2\\) Prozentpunkte nach jeder Seite reichen. Wie groß muss \\(n\\) mindestens sein?", loesung:2500, toleranz:0, tipp:"Die halbe Breite des relativen Intervalls als Term in \\(n\\) aufschreiben und die Forderung als Ungleichung lösen.", loesungsweg:"Die halbe Breite beträgt absolut \\(2\\sigma\\), relativ also $$\\frac{2\\sigma}{n} = \\frac{2\\sqrt{n \\cdot 0{,}25}}{n} = \\frac{\\sqrt{n}}{n} = \\frac{1}{\\sqrt{n}}$$ Die Forderung lautet damit $$\\frac{1}{\\sqrt{n}} \\le 0{,}02 \\;\\Longleftrightarrow\\; \\sqrt{n} \\ge 50 \\;\\Longleftrightarrow\\; n \\ge 2500$$ Bemerkenswert ist, dass sich \\(n\\) fast vollständig herauskürzt: die Genauigkeit wächst nur mit \\(\\sqrt{n}\\). Halb so große Fehlerspanne kostet den vierfachen Umfang." },
      { id:26, level:5, typ:"numerisch", frage:"Für \\(n=500\\) und \\(p=0{,}3\\) rechnet jemand \\(\\sigma = \\sqrt{500 \\cdot 0{,}3} \\approx 12{,}25\\). Berechne den richtigen Wert von \\(\\sigma\\) (2 Nachkommastellen).", loesung:10.25, toleranz:0.05, tipp:"Vergleiche die benutzte Wurzel mit der vollständigen Formel — ein Faktor fehlt.", loesungsweg:"In der Wurzel fehlt \\(1-p\\): $$\\sigma = \\sqrt{500 \\cdot 0{,}3 \\cdot 0{,}7} = \\sqrt{105} \\approx 10{,}25$$ Der falsche Weg liefert \\(12{,}25\\) und damit ein Prognoseintervall, das rund \\(8\\) Einheiten zu breit ist — man würde Ergebnisse für verträglich erklären, die es nicht sind. Eine Kontrolle hilft: \\(\\sigma\\) kann nie größer werden als \\(\\tfrac12\\sqrt{n} \\approx 11{,}18\\); der Wert \\(12{,}25\\) ist also von vornherein unmöglich." },
      { id:27, level:5, typ:"mc", frage:"Für \\(n=900\\) und \\(p=0{,}2\\) gibt jemand das \\(95\\,\\%\\)-Prognoseintervall für die <b>relative</b> Häufigkeit als \\([-23{,}8\\,\\%;\\, 24{,}2\\,\\%]\\) an und rechnet dazu \\(p \\pm 2\\sigma\\) mit \\(\\sigma=12\\). Woran liegt der Fehler?", optionen:["Absolute und relative Größen wurden vermischt","Es wurde mit \\(3\\sigma\\) statt mit \\(2\\sigma\\) gerechnet","Der Faktor \\(1-p\\) fehlt in der Wurzel für \\(\\sigma\\)","Die untere Grenze wurde falsch gerundet"], korrekt:0, tipp:"Prüfe, welche Einheiten die beiden verrechneten Zahlen tragen.", loesungsweg:"\\(\\sigma = 12\\) zählt <b>Stücke</b>, \\(p = 0{,}2\\) ist ein <b>Anteil</b> — beides darf nicht addiert werden. Richtig ist einer der beiden Wege: $$\\text{absolut: } \\mu \\pm 2\\sigma = 180 \\pm 24 = [156;\\,204]$$ $$\\text{relativ: } p \\pm \\frac{2\\sigma}{n} = 0{,}2 \\pm \\frac{24}{900} \\approx [17{,}3\\,\\%;\\, 22{,}7\\,\\%]$$ Dass etwas grundlegend schiefgegangen ist, zeigt schon die negative untere Grenze: eine relative Häufigkeit kann nicht kleiner als null sein." },
      { id:28, level:5, typ:"numerisch", frage:"Bei \\(p=0{,}25\\) soll das \\(95\\,\\%\\)-Prognoseintervall für die Anzahl höchstens \\(60\\) Einheiten breit sein. Wie groß darf \\(n\\) höchstens sein?", loesung:1200, toleranz:0, tipp:"Die Breite über \\(\\sigma\\) ausdrücken, die Forderung als Ungleichung ansetzen und nach \\(n\\) auflösen.", loesungsweg:"Die Breite beträgt \\(4\\sigma\\), also $$4\\sigma \\le 60 \\;\\Longleftrightarrow\\; \\sigma \\le 15 \\;\\Longleftrightarrow\\; n \\cdot 0{,}25 \\cdot 0{,}75 \\le 225$$ $$0{,}1875\\,n \\le 225 \\;\\Longleftrightarrow\\; n \\le 1200$$ Hier begrenzt die Forderung \\(n\\) nach <b>oben</b>, weil das absolute Intervall mit wachsendem Umfang breiter wird. Für die relative Häufigkeit wäre es genau umgekehrt." },
      { id:29, level:5, typ:"numerisch", frage:"Bei \\(n=1000\\) und \\(p=0{,}45\\) werden \\(500\\) Erfolge beobachtet. Um wie viele Einheiten liegt die Beobachtung über der oberen Grenze des \\(95\\,\\%\\)-Prognoseintervalls? (ganze Zahl)", loesung:18, toleranz:0, tipp:"Erst die Grenze bestimmen und nach außen runden, dann die Differenz zur Beobachtung bilden.", loesungsweg:"$$\\mu = 450, \\quad \\sigma = \\sqrt{1000 \\cdot 0{,}45 \\cdot 0{,}55} = \\sqrt{247{,}5} \\approx 15{,}73$$ $$\\mu + 2\\sigma \\approx 450 + 31{,}46 = 481{,}46 \\;\\longrightarrow\\; 482$$ $$500 - 482 = 18$$ Die Beobachtung liegt also \\(18\\) Einheiten außerhalb. Hätte man die Grenze nach innen auf \\(481\\) gerundet, käme \\(19\\) heraus — die Rundungsregel muss man festlegen, bevor man rechnet." },
      { id:30, level:5, typ:"numerisch", frage:"Das \\(95\\,\\%\\)-Prognoseintervall für die Anzahl ist bei \\(n=600\\) genau \\(48\\) Einheiten breit. Bestimme \\(p\\) unter der Zusatzbedingung, dass \\(p\\) kleiner als \\(0{,}5\\) ist.", loesung:0.4, toleranz:0.01, tipp:"Aus der Breite die Standardabweichung gewinnen; daraus entsteht eine quadratische Gleichung für \\(p\\).", loesungsweg:"$$4\\sigma = 48 \\;\\Rightarrow\\; \\sigma = 12 \\;\\Rightarrow\\; 600\\,p(1-p) = 144$$ $$p(1-p) = 0{,}24 \\;\\Rightarrow\\; p^2 - p + 0{,}24 = 0 \\;\\Rightarrow\\; p = 0{,}4 \\;\\text{oder}\\; p = 0{,}6$$ Beide Werte liefern dieselbe Breite, weil \\(p(1-p)\\) symmetrisch zu \\(0{,}5\\) liegt. Die Zusatzbedingung entscheidet: \\(p = 0{,}4\\)." },
      // ========== LEVEL 6 — Abi-Format (gA) ==========
      { id:31, level:6, typ:"mc", frage:"„Liegt die beobachtete Häufigkeit außerhalb des \\(95\\,\\%\\)-Prognoseintervalls, so ist der angenommene Wert von \\(p\\) sicher falsch.“ Beurteilen Sie diese Behauptung.", optionen:["Richtig, solche Ergebnisse sind bei diesem \\(p\\) unmöglich","Falsch, auch bei richtigem \\(p\\) tritt dieser Fall auf","Falsch, außerhalb liegende Werte sagen gar nichts aus","Richtig, sofern die Laplace-Bedingung eingehalten ist"], korrekt:1, tipp:"Überlege, welcher Anteil der Ergebnisse bei zutreffendem \\(p\\) außerhalb des Intervalls liegt.", loesungsweg:"Das Intervall erfasst etwa \\(95\\,\\%\\) der Ergebnisse — die übrigen rund \\(5\\,\\%\\) liegen auch dann außerhalb, wenn \\(p\\) genau stimmt. Etwa jede zwanzigste Stichprobe fällt also heraus, ohne dass die Annahme falsch wäre. Ein solcher Befund ist ein starker <b>Hinweis</b> gegen \\(p\\), aber kein Beweis; sicher ausschließen lässt sich \\(p\\) nicht. Die Gegenposition, außerhalb liegende Werte sagten gar nichts aus, geht ebenso zu weit: eine Aussage über die Plausibilität ist durchaus möglich, nur keine sichere." },
      { id:32, level:6, typ:"numerisch", frage:"Ein Automat soll höchstens \\(4\\,\\%\\) Ausschuss erzeugen. Aus einer Tagescharge von \\(2500\\) Stück werden \\(130\\) fehlerhafte gemeldet. Bestimmen Sie die obere Grenze des \\(95\\,\\%\\)-Prognoseintervalls (ganze Zahl) und beurteilen Sie damit die Angabe des Herstellers.", loesung:120, toleranz:0, tipp:"Zuerst die Kennzahlen und die Laplace-Bedingung prüfen, dann die Grenze mit der Meldung vergleichen.", loesungsweg:"$$\\mu = 2500 \\cdot 0{,}04 = 100, \\quad \\sigma = \\sqrt{2500 \\cdot 0{,}04 \\cdot 0{,}96} = \\sqrt{96} \\approx 9{,}80$$ Wegen \\(\\sigma \\gt 3\\) ist die Näherung zulässig. $$\\mu + 2\\sigma \\approx 100 + 19{,}60 = 119{,}60 \\;\\longrightarrow\\; 120$$ Das Prognoseintervall lautet \\([80;\\,120]\\). <b>Beurteilung:</b> Die gemeldeten \\(130\\) Stück liegen darüber, die Abweichung beträgt \\(30/9{,}80 \\approx 3{,}06\\) Standardabweichungen. Bei eingehaltener Zusage tritt das in weit weniger als \\(1\\,\\%\\) der Tage auf — die Angabe des Herstellers ist damit zweifelhaft. Da die Zusage „höchstens\" lautet, zählt allein die Überschreitung nach oben." },
      { id:33, level:6, typ:"numerisch", frage:"Bei \\(p=0{,}5\\) wird der Stichprobenumfang von \\(400\\) auf \\(3600\\) erhöht. Um welchen Faktor wird das \\(95\\,\\%\\)-Prognoseintervall für die <b>relative</b> Häufigkeit dadurch schmaler?", loesung:3, toleranz:0.05, tipp:"Die halbe Breite des relativen Intervalls allgemein in \\(n\\) ausdrücken und die beiden Werte ins Verhältnis setzen.", loesungsweg:"Die halbe relative Breite beträgt $$\\frac{2\\sigma}{n} = \\frac{2\\sqrt{np(1-p)}}{n} = 2\\sqrt{\\frac{p(1-p)}{n}}$$ Sie ist also proportional zu \\(\\tfrac{1}{\\sqrt{n}}\\). Damit ist der Faktor $$\\sqrt{\\frac{3600}{400}} = \\sqrt{9} = 3$$ Zahlenprobe: \\(n=400\\) gibt \\(\\pm 5{,}0\\) Prozentpunkte, \\(n=3600\\) gibt \\(\\pm 1{,}67\\) Prozentpunkte. Der neunfache Umfang bringt also nur die dreifache Genauigkeit — die Kosten steigen deutlich schneller als der Nutzen." },
      { id:34, level:6, typ:"mc", frage:"„Verdoppelt man den Stichprobenumfang, so ist das Prognoseintervall für die <b>Anzahl</b> doppelt so breit.“ Beurteilen Sie diese Behauptung.", optionen:["Richtig, weil \\(n\\) als Faktor in der Varianz steht","Falsch, die Breite wächst nur um den Faktor \\(\\sqrt{2}\\)","Falsch, die Breite bleibt von \\(n\\) völlig unberührt","Richtig, sofern \\(p\\) dabei unverändert bleibt"], korrekt:1, tipp:"Sieh nach, an welcher Stelle \\(n\\) in der Formel für \\(\\sigma\\) steht — unter oder außerhalb der Wurzel.", loesungsweg:"Die Breite ist \\(4\\sigma = 4\\sqrt{np(1-p)}\\). Verdoppelt man \\(n\\), so verdoppelt sich der Radikand, die Wurzel wächst dadurch nur um \\(\\sqrt2 \\approx 1{,}41\\). Beispiel \\(p=0{,}5\\): bei \\(n=500\\) ist die Breite \\(44{,}7\\), bei \\(n=1000\\) ist sie \\(63{,}2\\). Bezogen auf \\(n\\) wird das Intervall dabei sogar <b>relativ schmaler</b> — genau darauf beruht der Nutzen großer Stichproben." },
      { id:35, level:6, typ:"numerisch", frage:"In einer Stichprobe von \\(50\\) Personen wird ein Merkmal erwartet, das \\(2\\,\\%\\) der Bevölkerung tragen. Berechnen Sie \\(\\sigma\\) (2 Nachkommastellen) und beurteilen Sie, ob hier mit der \\(2\\sigma\\)-Näherung gearbeitet werden darf.", loesung:0.99, toleranz:0.02, tipp:"Standardabweichung berechnen und mit der Bedingung für die Anwendbarkeit der Näherung vergleichen.", loesungsweg:"$$\\sigma = \\sqrt{50 \\cdot 0{,}02 \\cdot 0{,}98} = \\sqrt{0{,}98} \\approx 0{,}99$$ <b>Beurteilung:</b> Die Laplace-Bedingung \\(\\sigma \\gt 3\\) ist klar verletzt, die Näherung darf <b>nicht</b> benutzt werden. Man sieht den Grund auch unmittelbar: \\(\\mu = 1\\), und \\(\\mu - 2\\sigma \\approx -0{,}98\\) wäre eine negative Anzahl. Die Verteilung ist hier stark linkssteil und von einer symmetrischen Glockenform weit entfernt; gefragt ist stattdessen die exakte Rechnung mit der Binomialverteilung." },
      { id:36, level:6, typ:"numerisch", frage:"Ein Losverkäufer gibt an, dass \\(25\\,\\%\\) der Lose gewinnen; \\(1200\\) Lose sind verkauft. Bei welcher Zahl gemeldeter Gewinne liegt das Ergebnis erstmals außerhalb des \\(95\\,\\%\\)-Prognoseintervalls? Begründen Sie, warum der Grenzfall hier eindeutig entschieden werden kann.", loesung:331, toleranz:0, tipp:"Das Intervall bestimmen und überlegen, welche ganze Zahl die obere Grenze zuerst überschreitet.", loesungsweg:"$$\\mu = 1200 \\cdot 0{,}25 = 300, \\quad \\sigma = \\sqrt{1200 \\cdot 0{,}25 \\cdot 0{,}75} = \\sqrt{225} = 15$$ $$\\mu + 2\\sigma = 300 + 30 = 330$$ <b>Grenzfall:</b> Die Grenze ist hier ausnahmsweise ganzzahlig, eine Rundung entfällt. Der Wert \\(330\\) gehört noch zum Intervall \\([270;\\,330]\\), die erste Zahl außerhalb ist also \\(331\\). Wären die Grenzen gebrochen, müsste man die Rundungsregel angeben, um denselben Fall eindeutig zu entscheiden. Die Meldung von genau \\(330\\) Gewinnen wäre demnach noch mit der Angabe verträglich, \\(331\\) nicht mehr." }];
