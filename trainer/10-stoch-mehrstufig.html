<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <title>Mehrstufige Zufallsversuche - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-stoch-mehrstufig';
    const THEMA_CONFIG = { name: 'Mehrstufige Zufallsversuche', bereich: 'stochastik' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Baumdiagramm-Grundlagen ==========
      { id: 1, level: 1, typ: "mc", frage: "Was ist ein mehrstufiger Zufallsversuch?", optionen: ["Ein einmaliger Wurf", "Ein Zufallsexperiment aus mehreren hintereinander ausgeführten Teilexperimenten", "Ein gewichteter Würfel", "Ein Test auf Unabhängigkeit"], korrekt: 1, tipp: "„Mehrstufig\" heißt mehrere Stufen hintereinander.", loesungsweg: "Ein mehrstufiger Zufallsversuch besteht aus zwei oder mehr Teilexperimenten, die nacheinander ausgeführt werden." },
      { id: 2, level: 1, typ: "mc", frage: "Wie werden die Wahrscheinlichkeiten entlang eines Pfades im Baumdiagramm verknüpft?", optionen: ["addiert", "multipliziert", "subtrahiert", "dividiert"], korrekt: 1, tipp: "Pfadmultiplikationsregel.", loesungsweg: "Entlang eines Pfades werden die Wahrscheinlichkeiten multipliziert." },
      { id: 3, level: 1, typ: "mc", frage: "Wie werden die Wahrscheinlichkeiten mehrerer günstiger Pfade verknüpft?", optionen: ["addiert", "multipliziert", "maximiert", "minimiert"], korrekt: 0, tipp: "Summenregel.", loesungsweg: "Günstige Pfade werden addiert." },
      { id: 4, level: 1, typ: "mc", frage: "In einem Baumdiagramm muss die Summe der Wahrscheinlichkeiten an jeder Verzweigung sein:", optionen: ["0", "0,5", "1", "je nach Experiment"], korrekt: 2, tipp: "Die Ereignisse einer Verzweigung decken alle Möglichkeiten ab.", loesungsweg: "An jeder Verzweigung sind alle möglichen Ausgänge dieses Teilversuchs aufgeführt; genau einer von ihnen tritt ein. Deshalb gilt stets $$\\sum p_i = 1$$ Das ist zugleich die beste Kontrolle für ein selbst gezeichnetes Baumdiagramm: Stimmt eine Verzweigungssumme nicht, steckt dort ein Fehler." },
      { id: 5, level: 1, typ: "numerisch", frage: "Ein Würfel wird 2x geworfen. \\(P(\\text{beide Male 6})\\) (4 Dezimalen).", loesung: 0.0278, toleranz: 0.001, tipp: "\\(\\tfrac{1}{6} \\cdot \\tfrac{1}{6}\\).", loesungsweg: "Die beiden Würfe sind unabhängig, entlang eines Pfades wird deshalb multipliziert (Pfadregel): $$P = \\frac16 \\cdot \\frac16 = \\frac{1}{36} \\approx 0{,}0278$$ Addieren wäre falsch — \\(\\tfrac26\\) wäre die Wahrscheinlichkeit für „mindestens eine 6\" und erst noch zu korrigieren." },
      { id: 6, level: 1, typ: "numerisch", frage: "Münze 3x werfen. \\(P(\\text{alle Kopf})\\).", loesung: 0.125, toleranz: 0.005, tipp: "\\(0{,}5^3\\).", loesungsweg: "\\(P = 0{,}5^3 = 0{,}125\\)." },
      // ========== LEVEL 2 — Mit/ohne Zurücklegen ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Urne: 5 rote, 3 blaue. 2x mit Zurücklegen. \\(P(\\text{rot, rot})\\) (4 Dezimalen).", loesung: 0.3906, toleranz: 0.005, tipp: "\\(\\tfrac{5}{8} \\cdot \\tfrac{5}{8}\\).", loesungsweg: "Mit Zurücklegen bleibt die Zusammensetzung der Urne gleich, die Wahrscheinlichkeit ändert sich also nicht: $$P = \\left(\\frac58\\right)^2 = \\frac{25}{64} \\approx 0{,}3906$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Urne: 5 rote, 3 blaue. 2x OHNE Zur\u00fccklegen. \\(P(\\text{rot, rot})\\) (4 Dezimalen).", loesung: 0.3571, toleranz: 0.005, tipp: "\\(\\tfrac{5}{8} \\cdot \\tfrac{4}{7}\\).", loesungsweg: "Ohne Zurücklegen fehlt beim zweiten Zug eine rote Kugel, und die Gesamtzahl sinkt ebenfalls um eins: $$P = \\frac58 \\cdot \\frac47 = \\frac{20}{56} \\approx 0{,}3571$$ Der Wert ist kleiner als mit Zurücklegen (\\(0{,}3906\\)) — nach einer gezogenen roten Kugel ist der Anteil der roten gesunken." },
      { id: 9, level: 2, typ: "numerisch", frage: "Urne: 2 weiß, 3 schwarz. 2x mit Zurücklegen. \\(P(\\text{weiß, schwarz})\\)?", loesung: 0.24, toleranz: 0.005, tipp: "\\(\\tfrac{2}{5} \\cdot \\tfrac{3}{5}\\).", loesungsweg: "Pfadregel für den Pfad „weiß, dann schwarz\": $$P = \\frac25 \\cdot \\frac35 = 0{,}4 \\cdot 0{,}6 = 0{,}24$$ Gefragt ist die feste Reihenfolge; wäre auch „schwarz, weiß\" erlaubt, käme der zweite Pfad mit \\(0{,}24\\) hinzu, zusammen \\(0{,}48\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Urne: 2 wei\u00df, 3 schwarz. 2x OHNE Zur\u00fccklegen. \\(P(\\text{wei\u00df, schwarz})\\) (2 Dezimalen).", loesung: 0.3, toleranz: 0.005, tipp: "\\(\\tfrac{2}{5} \\cdot \\tfrac{3}{4}\\).", loesungsweg: "\\(\\tfrac{2}{5} \\cdot \\tfrac{3}{4} = \\tfrac{6}{20} = 0{,}3\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Urne: 4 rote, 6 blaue. 3x mit Zurücklegen. \\(P(\\text{alle rot})\\) (4 Dezimalen).", loesung: 0.064, toleranz: 0.001, tipp: "\\(0{,}4^3\\).", loesungsweg: "Mit Zurücklegen bleibt \\(p = \\tfrac{4}{10} = 0{,}4\\) in jedem Zug gleich: $$P = 0{,}4^3 = 0{,}064$$ Nur ein einziger Pfad führt zu „alle rot\", ein Vorfaktor entfällt also." },
      { id: 12, level: 2, typ: "mc", frage: "Beim Ziehen ohne Zurücklegen sind die Stufen…", optionen: ["immer unabhängig", "abhängig", "immer gleichwahrscheinlich", "irrelevant"], korrekt: 1, tipp: "Ohne Zurücklegen verändert jeder Zug die Zusammensetzung.", loesungsweg: "Die Teilexperimente hängen vom vorherigen Ergebnis ab — abhängig." },
      // ========== LEVEL 3 — Pfadsummenregel ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Münze 2x: \\(P(\\text{genau 1x Kopf})\\)?", loesung: 0.5, toleranz: 0.01, tipp: "KZ und ZK — 2 Pfade, je \\(0{,}25\\).", loesungsweg: "\\(P = 0{,}25 + 0{,}25 = 0{,}5\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Urne: 3 rote, 2 blaue, 2x ohne Zurücklegen. \\(P(\\text{genau 1x rot})\\) (2 Dezimalen).", loesung: 0.6, toleranz: 0.01, tipp: "RB + BR = \\(\\tfrac{3}{5}\\tfrac{2}{4} + \\tfrac{2}{5}\\tfrac{3}{4}\\).", loesungsweg: "\\(\\tfrac{6}{20} + \\tfrac{6}{20} = \\tfrac{12}{20} = 0{,}6\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Würfel 2x: \\(P(\\text{mindestens eine 6})\\) (4 Dezimalen).", loesung: 0.3056, toleranz: 0.005, tipp: "\\(1 - P(\\text{keine 6}) = 1 - \\left(\\tfrac{5}{6}\\right)^2\\).", loesungsweg: "„Mindestens eine\" geht am schnellsten über das Gegenereignis „keine 6\": $$P = 1 - \\left(\\frac56\\right)^2 = 1 - \\frac{25}{36} = \\frac{11}{36} \\approx 0{,}3056$$ Direkt gerechnet müsste man drei Pfade addieren — das Gegenereignis spart diese Fallunterscheidung." },
      { id: 16, level: 3, typ: "numerisch", frage: "Münze 3x: \\(P(\\text{genau 2x Kopf})\\) (3 Dezimalen).", loesung: 0.375, toleranz: 0.005, tipp: "3 Pfade: KKZ, KZK, ZKK, je \\(0{,}125\\).", loesungsweg: "Drei Pfade führen zu genau zweimal Kopf: KKZ, KZK, ZKK. Jeder hat die Wahrscheinlichkeit \\(0{,}5^3 = 0{,}125\\): $$P = 3 \\cdot 0{,}125 = 0{,}375$$ Der Faktor \\(3\\) ist \\(\\binom32\\) — die Anzahl der Möglichkeiten, die beiden Köpfe auf drei Würfe zu verteilen." },
      { id: 17, level: 3, typ: "numerisch", frage: "Urne: 6 rote, 4 blaue. 2x mit Zurücklegen. \\(P(\\text{mind. 1 blau})\\) (2 Dezimalen).", loesung: 0.64, toleranz: 0.01, tipp: "\\(1 - P(\\text{0 blau}) = 1 - 0{,}6^2\\).", loesungsweg: "Gegenereignis ist „kein Blau\", also beide Male rot mit \\(p = 0{,}6\\): $$P = 1 - 0{,}6^2 = 1 - 0{,}36 = 0{,}64$$" },
      { id: 18, level: 3, typ: "mc", frage: "Wann lohnt sich die Gegenereignis-Strategie?", optionen: ["Nie", "Bei „mindestens ein…\"-Aufgaben", "Bei Gleichverteilung", "Bei Unabhängigkeit"], korrekt: 1, tipp: "„Kein\" ist oft nur 1 Pfad, „mindestens 1\" viele.", loesungsweg: "Bei „mindestens eins\" rechnet man meist über \\(1 - P(\\text{keins})\\)." },
      // ========== LEVEL 4 — Drei Stufen und komplexer ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Urne: 3 rote, 7 blaue. 3x mit Zurücklegen. \\(P(\\text{genau 2x rot})\\) (3 Dezimalen).", loesung: 0.189, toleranz: 0.005, tipp: "Überlege, welche der drei Ziehungen die roten sein können, und wie wahrscheinlich ein einzelner solcher Pfad ist.", loesungsweg: "Bernoulli-Formel mit \\(n = 3\\), \\(k = 2\\), \\(p = 0{,}3\\): $$P = \\binom32 \\cdot 0{,}3^2 \\cdot 0{,}7^1 = 3 \\cdot 0{,}09 \\cdot 0{,}7 = 0{,}189$$ Der Binomialkoeffizient zählt die Pfade, die Potenzen liefern die Wahrscheinlichkeit eines einzelnen Pfades." },
      { id: 20, level: 4, typ: "numerisch", frage: "Würfel 3x: \\(P(\\text{Summe} = 18)\\)?", loesung: 0.0046, toleranz: 0.001, tipp: "Nur 6, 6, 6 — ein Pfad.", loesungsweg: "\\(P = \\left(\\tfrac{1}{6}\\right)^3 = \\tfrac{1}{216} \\approx 0{,}0046\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Aus 10 Karten (4 Asse) werden 3 ohne Zurücklegen gezogen. \\(P(\\text{alle Asse})\\) (4 Dezimalen).", loesung: 0.0333, toleranz: 0.002, tipp: "\\(\\tfrac{4}{10} \\cdot \\tfrac{3}{9} \\cdot \\tfrac{2}{8}\\).", loesungsweg: "Ohne Zurücklegen sinken Zähler und Nenner in jedem Zug um eins: $$P = \\frac{4}{10} \\cdot \\frac39 \\cdot \\frac28 = \\frac{24}{720} = \\frac{1}{30} \\approx 0{,}0333$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Münze 4x: \\(P(\\text{genau 2x Kopf})\\) (4 Dezimalen).", loesung: 0.375, toleranz: 0.005, tipp: "Alle Pfade sind hier gleich wahrscheinlich; entscheidend ist, auf wie viele Arten sich zwei Köpfe auf vier Würfe verteilen können.", loesungsweg: "Bernoulli-Formel mit \\(n = 4\\), \\(k = 2\\), \\(p = 0{,}5\\): $$P = \\binom42 \\cdot 0{,}5^4 = 6 \\cdot 0{,}0625 = 0{,}375$$ Bemerkenswert: Derselbe Wert wie bei drei Würfen und zweimal Kopf — der größere Binomialkoeffizient und die kleinere Pfadwahrscheinlichkeit gleichen sich hier gerade aus." },
      { id: 23, level: 4, typ: "numerisch", frage: "Torhüter hält einen Strafstoß mit Wsk. \\(0{,}3\\). Bei 3 Strafstößen: \\(P(\\text{keinen hält})\\) (3 Dezimalen).", loesung: 0.343, toleranz: 0.005, tipp: "\\(0{,}7^3\\).", loesungsweg: "„Keinen halten\" heißt dreimal nicht halten, also jedes Mal mit \\(1-0{,}3 = 0{,}7\\): $$P = 0{,}7^3 = 0{,}343$$" },
      { id: 24, level: 4, typ: "numerisch", frage: "Ein Torhüter hält einen Strafstoß mit der Wahrscheinlichkeit \\(0{,}3\\). Bei 3 Strafstößen: \\(P(\\text{genau 1 hält})\\) (3 Dezimalen).", loesung: 0.441, toleranz: 0.01, tipp: "Der gehaltene Strafstoß kann der erste, zweite oder dritte sein — jeder dieser Fälle ist ein eigener Pfad im Baum.", loesungsweg: "Bei einem Torhüter mit der Haltewahrscheinlichkeit \\(0{,}3\\) und drei Strafstößen gilt nach der Bernoulli-Formel mit \\(k = 1\\): $$P = \\binom31 \\cdot 0{,}3 \\cdot 0{,}7^2 = 3 \\cdot 0{,}3 \\cdot 0{,}49 = 0{,}441$$ Der Faktor \\(3\\) berücksichtigt, dass der gehaltene Strafstoß der erste, zweite oder dritte sein kann." },
      // ========== LEVEL 5 — Erwartungswert einfach ==========
      { id: 25, level: 5, typ: "numerisch", frage: "In einer Schachtel liegen 10 Batterien, von denen einige leer sind. Zieht man zwei ohne Zurücklegen, so beträgt die Wahrscheinlichkeit für zwei leere Batterien \\(\\tfrac{1}{15}\\). Wie viele leere Batterien liegen in der Schachtel?", loesung: 3, toleranz: 0.5, tipp: "Stelle die Pfadwahrscheinlichkeit mit der Unbekannten auf; nach dem Ausmultiplizieren bleibt ein Produkt zweier benachbarter Zahlen.", loesungsweg: "Mit \\(k\\) leeren Batterien gilt $$\\frac{k}{10} \\cdot \\frac{k-1}{9} = \\frac{1}{15}$$ also \\(k \\cdot (k-1) = \\tfrac{90}{15} = 6\\). Zwei benachbarte Zahlen mit dem Produkt 6 sind 3 und 2, also \\(k = 3\\). Probe: \\(\\tfrac{3}{10} \\cdot \\tfrac29 = \\tfrac{6}{90} = \\tfrac{1}{15}\\). Die negative Lösung \\(k = -2\\) der quadratischen Gleichung entfällt, weil eine Anzahl nicht negativ sein kann." },
      { id: 26, level: 5, typ: "mc", frage: "Aus einer Lostrommel mit 20 Losen, darunter 5 Gewinne, werden 3 Lose gezogen und behalten. Jemand rechnet \\(P(\\text{3 Gewinne}) = 0{,}25^3 \\approx 0{,}016\\). Welcher Einwand trifft zu?", optionen: ["Er rechnet in jedem Zug mit demselben Anteil, obwohl die Trommel kleiner wird", "Er müsste die drei Wahrscheinlichkeiten addieren statt sie zu multiplizieren", "Er hat den Anteil der Gewinnlose falsch bestimmt, richtig wären 0,2", "Der Ansatz stimmt, es fehlt nur noch der Faktor für die drei Pfade"], korrekt: 0, tipp: "Achte darauf, was mit der Trommel geschieht, nachdem ein Los gezogen wurde, und welche Folgen das für den nächsten Faktor hat.", loesungsweg: "Die Lose werden behalten, also wird ohne Zurücklegen gezogen: Nach jedem Gewinnlos sinken Zähler und Nenner um eins. $$P = \\frac{5}{20} \\cdot \\frac{4}{19} \\cdot \\frac{3}{18} = \\frac{60}{6840} \\approx 0{,}0088$$ Der Wert ist rund halb so groß wie die gerechneten \\(0{,}016\\). Der Anteil \\(\\tfrac{5}{20} = 0{,}25\\) ist richtig — er gilt aber nur für den ersten Zug. Multipliziert wird korrekt: Entlang eines Pfades gilt die Produktregel, nur eben mit den jeweils aktuellen Anteilen." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Gerät enthält drei Bauteile, die unabhängig voneinander jeweils mit der Wahrscheinlichkeit 0,05 ausfallen. Das Gerät arbeitet weiter, solange höchstens ein Bauteil ausgefallen ist. Wie wahrscheinlich ist es, dass das Gerät arbeitet? (4 Dezimalen)", loesung: 0.9928, toleranz: 0.001, tipp: "„Höchstens eines“ fasst zwei verschiedene Fälle zusammen, die getrennt zu behandeln sind.", loesungsweg: "Zwei Fälle, deren Wahrscheinlichkeiten addiert werden. Kein Ausfall: \\(0{,}95^3 = 0{,}857375\\). Genau ein Ausfall: das defekte Bauteil kann das erste, zweite oder dritte sein, also $$3 \\cdot 0{,}05 \\cdot 0{,}95^2 = 3 \\cdot 0{,}05 \\cdot 0{,}9025 = 0{,}135375$$ Zusammen $$0{,}857375 + 0{,}135375 = 0{,}99275 \\approx 0{,}9928$$ Der Faktor 3 ist wesentlich: ohne ihn fehlen zwei der drei Pfade. Die Reserve lohnt sich — ohne sie wären es nur \\(85{,}7\\,\\%\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Aus einer Urne mit 4 weißen und 6 schwarzen Kugeln wird zweimal gezogen. Um wie viel ist die Wahrscheinlichkeit für zwei weiße Kugeln ohne Zurücklegen kleiner als mit Zurücklegen? (3 Dezimalen)", loesung: 0.027, toleranz: 0.002, tipp: "Rechne beide Versuchsarten getrennt durch; nur im zweiten Faktor unterscheiden sie sich.", loesungsweg: "Mit Zurücklegen bleibt die Urne unverändert: $$\\frac{4}{10} \\cdot \\frac{4}{10} = 0{,}16$$ Ohne Zurücklegen fehlt im zweiten Zug eine weiße Kugel: $$\\frac{4}{10} \\cdot \\frac39 = \\frac{12}{90} \\approx 0{,}1333$$ Die Differenz beträgt $$0{,}16 - 0{,}1333 \\approx 0{,}027$$ Ohne Zurücklegen ist der Wert kleiner, weil die erste weiße Kugel den Vorrat für den zweiten Zug verringert. Je kleiner die Urne, desto größer wird dieser Unterschied." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Glücksrad zeigt bei jedem Dreh mit der Wahrscheinlichkeit 0,2 einen Gewinn. Wie oft muss man mindestens drehen, damit die Wahrscheinlichkeit für mindestens einen Gewinn über 90 % liegt?", loesung: 11, toleranz: 0.5, tipp: "Formuliere die Bedingung über das Gegenereignis; daraus wird eine Ungleichung für die Anzahl der Drehungen.", loesungsweg: "Das Gegenereignis „kein Gewinn bei \\(n\\) Drehungen“ hat die Wahrscheinlichkeit \\(0{,}8^n\\). Gefordert ist $$1 - 0{,}8^n > 0{,}9 \\;\\Leftrightarrow\\; 0{,}8^n < 0{,}1$$ Logarithmieren: \\(n > \\tfrac{\\lg 0{,}1}{\\lg 0{,}8} \\approx 10{,}32\\), also \\(n = 11\\). Die Probe zeigt, dass gerundet werden muss und zwar aufwärts: \\(n = 10\\) liefert \\(1 - 0{,}8^{10} \\approx 0{,}893\\) (noch zu klein), \\(n = 11\\) liefert \\(1 - 0{,}8^{11} \\approx 0{,}914\\). Sicher wird es nie: \\(0{,}8^n\\) wird beliebig klein, aber niemals Null." },
      { id: 30, level: 5, typ: "numerisch", frage: "Drei Schützen geben unabhängig voneinander je einen Schuss ab und treffen mit den Wahrscheinlichkeiten 0,6; 0,5 und 0,4. Wie wahrscheinlich ist es, dass genau zwei von ihnen treffen? (2 Dezimalen)", loesung: 0.38, toleranz: 0.005, tipp: "Zeichne den dreistufigen Baum und suche alle Pfade, die zum gefragten Ergebnis führen; die Trefferwahrscheinlichkeiten sind hier verschieden.", loesungsweg: "Drei Pfade führen zu genau zwei Treffern, jeder mit eigenen Faktoren: $$0{,}6 \\cdot 0{,}5 \\cdot 0{,}6 = 0{,}18 \\quad 0{,}6 \\cdot 0{,}5 \\cdot 0{,}4 = 0{,}12 \\quad 0{,}4 \\cdot 0{,}5 \\cdot 0{,}4 = 0{,}08$$ Der erste Pfad ist „Treffer, Treffer, Fehlschuss“, der zweite „Treffer, Fehlschuss, Treffer“, der dritte „Fehlschuss, Treffer, Treffer“. Addiert: $$0{,}18 + 0{,}12 + 0{,}08 = 0{,}38$$ Weil die drei Trefferwahrscheinlichkeiten verschieden sind, haben die Pfade verschiedene Werte; eine gemeinsame Potenz wie bei gleichen Wahrscheinlichkeiten gibt es hier nicht." },
      // ========== LEVEL 6 — Transfer ==========
      { id: 31, level: 6, typ: "mc", frage: "„Zieht man aus einer Urne mit roten und blauen Kugeln zweimal ohne Zurücklegen, so ist die Wahrscheinlichkeit für eine rote Kugel im zweiten Zug kleiner als im ersten.“ Trifft das zu?", optionen: ["Ja, denn im zweiten Zug liegt eine Kugel weniger in der Urne", "Ja, sie sinkt genau um den Anteil einer einzelnen Kugel", "Nein, ohne Kenntnis des ersten Zuges ist sie genauso groß", "Nein, im zweiten Zug ist sie immer etwas größer als vorher"], korrekt: 2, tipp: "Rechne beide Pfade zum Ereignis „zweite Kugel rot“ an einem kleinen Beispiel durch und addiere sie.", loesungsweg: "Beispiel 3 rot, 2 blau. Über beide Pfade: $$P(\\text{2. rot}) = \\frac35 \\cdot \\frac24 + \\frac25 \\cdot \\frac34 = \\frac{6}{20} + \\frac{6}{20} = \\frac{12}{20} = \\frac35$$ Das ist genau \\(P(\\text{1. rot})\\). Die Behauptung ist falsch. Der Trugschluss verwechselt die <b>bedingte</b> mit der <b>unbedingten</b> Wahrscheinlichkeit: \\(P(\\text{2. rot} \\mid \\text{1. rot}) = \\tfrac24\\) ist tatsächlich kleiner, aber der andere Pfad mit \\(\\tfrac34\\) gleicht das genau aus. Anschaulich: Ohne Information über den ersten Zug ist keine Position im Stapel bevorzugt." },
      { id: 32, level: 6, typ: "numerisch", frage: "Aus einer Urne mit 2 roten und 3 blauen Kugeln wird ohne Zurücklegen gezogen, bis eine rote Kugel erscheint. Wie wahrscheinlich ist es, dass dafür mehr als zwei Züge nötig sind? (2 Dezimalen)", loesung: 0.3, toleranz: 0.005, tipp: "Formuliere zuerst, was „mehr als zwei Züge nötig“ über die ersten beiden gezogenen Kugeln aussagt.", loesungsweg: "Mehr als zwei Züge sind genau dann nötig, wenn die ersten beiden Kugeln blau sind — sonst wäre man schon fertig. Ein einziger Pfad: $$P = \\frac35 \\cdot \\frac24 = \\frac{6}{20} = 0{,}30$$ Der Umweg über die Fälle „drei Züge“, „vier Züge“, „fünf Züge“ wäre deutlich länger und führt zum selben Wert: \\(\\tfrac35 \\cdot \\tfrac24 \\cdot \\tfrac23 + \\tfrac35 \\cdot \\tfrac24 \\cdot \\tfrac13 \\cdot \\tfrac22 = 0{,}2 + 0{,}1 = 0{,}3\\). Spätestens im vierten Zug ist eine rote Kugel dabei, denn es gibt nur drei blaue." },
      { id: 33, level: 6, typ: "numerisch", frage: "Urne 1 enthält 3 rote und 1 blaue Kugel, Urne 2 enthält 1 rote und 3 blaue Kugeln. Aus Urne 1 wird eine Kugel gezogen und ungesehen in Urne 2 gelegt. Danach wird aus Urne 2 eine Kugel gezogen. Wie wahrscheinlich ist es, dass diese rot ist? (2 Dezimalen)", loesung: 0.35, toleranz: 0.005, tipp: "Die zweite Stufe hat je nach Ausgang der ersten verschiedene Wahrscheinlichkeiten — Urne 2 sieht dann unterschiedlich aus.", loesungsweg: "Der erste Zug verändert Urne 2, deshalb sind die beiden Äste verschieden. Kommt eine rote Kugel herüber (Wahrscheinlichkeit \\(\\tfrac34\\)), so enthält Urne 2 danach 2 rote unter 5 Kugeln; kommt die blaue (\\(\\tfrac14\\)), so ist es 1 rote unter 5. Beide Pfade addieren: $$P = \\frac34 \\cdot \\frac25 + \\frac14 \\cdot \\frac15 = 0{,}30 + 0{,}05 = 0{,}35$$ Der Wert liegt zwischen den Anteilen der beiden Urnen und ist näher an dem von Urne 2, weil dort gezogen wird. Ohne das Umlegen wäre es \\(\\tfrac14 = 0{,}25\\) — die herübergelegte Kugel erhöht die Chance also spürbar." },
      { id: 34, level: 6, typ: "mc", frage: "„Wirft man einen Würfel oft genug, so erreicht die Wahrscheinlichkeit für mindestens eine Sechs den Wert 1.“ Trifft das zu?", optionen: ["Ja, ab sechs Würfen ist der Wert genau gleich 1", "Ja, denn die Potenz im Gegenereignis wird irgendwann 0", "Nein, sie kommt der 1 beliebig nahe, ohne sie zu erreichen", "Nein, sie bleibt für jede Anzahl von Würfen unter 0,5"], korrekt: 2, tipp: "Schreibe die Wahrscheinlichkeit über das Gegenereignis auf und überlege, welche Werte die entstehende Potenz annehmen kann.", loesungsweg: "Über das Gegenereignis gilt \\(P_n = 1 - \\left(\\tfrac56\\right)^n\\). Die Potenz \\(\\left(\\tfrac56\\right)^n\\) ist für jedes \\(n\\) echt positiv, denn ein Produkt positiver Zahlen wird nie Null. Also ist \\(P_n < 1\\) für jedes \\(n\\), auch wenn der Abstand beliebig klein wird: $$P_6 \\approx 0{,}665 \\quad P_{25} \\approx 0{,}9895 \\quad P_{100} \\approx 0{,}999999988$$ Die Behauptung trifft also nicht zu. Der erste Vorschlag ist ein verbreiteter Fehler: Sechs Würfe sichern keine Sechs, in \\(\\left(\\tfrac56\\right)^6 \\approx 33{,}5\\,\\%\\) der Fälle bleibt sie aus." },
      { id: 35, level: 6, typ: "numerisch", frage: "Aus einer Urne mit 3 roten und 5 blauen Kugeln wird zweimal ohne Zurücklegen gezogen. Für „die erste oder die zweite Kugel ist rot“ rechnet jemand \\(\\tfrac38 + \\tfrac38 = 0{,}75\\). Wie groß ist der richtige Wert? (3 Dezimalen)", loesung: 0.643, toleranz: 0.005, tipp: "Der Ansatz zählt einen Fall doppelt; suche das Gegenereignis, das aus einem einzigen Pfad besteht.", loesungsweg: "Gefragt ist „mindestens eine rote“. Der vorgelegte Ansatz addiert zwei Fälle, die sich überschneiden: Bei zwei roten Kugeln wird doppelt gezählt. Das Gegenereignis „beide blau“ ist ein einziger Pfad: $$P(\\text{beide blau}) = \\frac58 \\cdot \\frac47 = \\frac{20}{56} \\approx 0{,}357$$ und damit $$P(\\text{mindestens eine rot}) = 1 - \\frac{20}{56} = \\frac{36}{56} \\approx 0{,}643$$ Die Doppelzählung erklärt die Differenz zu \\(0{,}75\\) genau: \\(P(\\text{beide rot}) = \\tfrac38 \\cdot \\tfrac27 = \\tfrac{6}{56} \\approx 0{,}107\\), und \\(0{,}75 - 0{,}107 = 0{,}643\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Test besteht aus drei Fragen mit je vier Antworten, von denen genau eine richtig ist. Wer mindestens zwei Fragen richtig hat, besteht. Wie wahrscheinlich ist es, den Test durch reines Raten zu bestehen? (4 Dezimalen)", loesung: 0.1563, toleranz: 0.002, tipp: "„Mindestens zwei von drei“ zerfällt in zwei Fälle; zähle bei jedem die Pfade des Baumdiagramms.", loesungsweg: "Jede Frage wird mit \\(p = \\tfrac14\\) richtig geraten. Genau zwei richtig — drei Pfade, je nachdem welche Frage falsch ist: $$3 \\cdot \\left(\\frac14\\right)^2 \\cdot \\frac34 = \\frac{9}{64} = 0{,}140625$$ Alle drei richtig — ein Pfad: \\(\\left(\\tfrac14\\right)^3 = \\tfrac{1}{64} = 0{,}015625\\). Zusammen $$\\frac{9}{64} + \\frac{1}{64} = \\frac{10}{64} = 0{,}15625 \\approx 0{,}1563$$ Rund \\(16\\,\\%\\) also: Raten lohnt sich bei dieser Hürde nicht. Bei vier Fragen und „mindestens drei richtig“ wäre es noch weniger." }];
