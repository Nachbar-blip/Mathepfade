<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyramide &amp; Kegel - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-raumgeometrie-pyramide-kegel';
    const THEMA_CONFIG = { name: 'Pyramide & Kegel', bereich: 'geometrie' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Volumenformel Pyramide?", optionen:["\\(G\\cdot h\\)","\\(\\frac{1}{3}G\\cdot h\\)","\\(\\frac{1}{2}G\\cdot h\\)","\\(\\pi r^2 h\\)"], korrekt:1, tipp:"Ein Drittel.", loesungsweg:"Drei Pyramiden mit gleicher Grundfläche und Höhe füllen genau ein Prisma — deshalb der Faktor \\(\\tfrac13\\): $$V = \\tfrac{1}{3} \\cdot G \\cdot h$$ Der Faktor gilt für jede Pyramide, gleichgültig welche Form die Grundfläche hat." },
      { id:2, level:1, typ:"mc", frage:"Volumenformel Kegel?", optionen:["\\(\\pi r^2 h\\)","\\(\\frac{1}{3}\\pi r^2 h\\)","\\(2\\pi r h\\)","\\(\\pi r s\\)"], korrekt:1, tipp:"Ein Drittel Zylindervolumen.", loesungsweg:"Der Kegel ist eine Pyramide mit kreisförmiger Grundfläche. Mit \\(G = \\pi r^2\\) folgt: $$V = \\tfrac{1}{3}\\pi r^2 h$$ Er fasst also genau ein Drittel des Zylinders mit gleichem Radius und gleicher Höhe." },
      { id:3, level:1, typ:"mc", frage:"Mantelfläche Kegel?", optionen:["\\(\\pi r s\\)","\\(\\pi r^2\\)","\\(2\\pi rh\\)","\\(\\pi r(r+s)\\)"], korrekt:0, tipp:"\\(s\\) = Mantellinie.", loesungsweg:"Der abgerollte Kegelmantel ist ein Kreissektor mit dem Radius \\(s\\) (der Mantellinie). Seine Fläche beträgt $$M = \\pi r s$$ Wichtig: Hier steht die <b>Mantellinie</b> \\(s\\), nicht die Höhe \\(h\\) — sie ist die schräge Strecke von der Spitze zum Grundkreisrand." },
      { id:4, level:1, typ:"numerisch", frage:"Pyramide, \\(G=30, h=6\\). Volumen?", loesung:60, toleranz:0, tipp:"\\(\\frac{1}{3}\\cdot 30\\cdot 6\\).", loesungsweg:"Grundfläche mal Höhe, davon ein Drittel: $$V = \\tfrac{1}{3} \\cdot 30 \\cdot 6 = \\tfrac{180}{3} = 60$$ Das Prisma mit gleicher Grundfläche und Höhe hätte \\(180\\)." },
      { id:5, level:1, typ:"numerisch", frage:"Kegel \\(r=3, h=4\\). Volumen (2 Dez).", loesung:37.70, toleranz:0.1, tipp:"\\(\\frac{1}{3}\\pi\\cdot 9\\cdot 4\\).", loesungsweg:"$$V = \\tfrac{1}{3}\\pi r^2 h = \\tfrac{1}{3}\\pi \\cdot 9 \\cdot 4 = 12\\pi \\approx 37{,}70$$" },
      { id:6, level:1, typ:"numerisch", frage:"Quadratische Pyramide, Grundkante 6, Höhe 10. Volumen?", loesung:120, toleranz:0, tipp:"\\(\\frac{1}{3}\\cdot 36\\cdot 10\\).", loesungsweg:"Die quadratische Grundfläche misst \\(6^2 = 36\\): $$V = \\tfrac{1}{3} \\cdot 36 \\cdot 10 = 120$$" },
      { id:7, level:2, typ:"numerisch", frage:"Kegel \\(r=5, h=12\\). Mantellinie \\(s\\)?", loesung:13, toleranz:0, tipp:"\\(s=\\sqrt{r^2+h^2}\\).", loesungsweg:"Radius, Höhe und Mantellinie bilden ein rechtwinkliges Dreieck, in dem \\(s\\) die Hypotenuse ist: $$s = \\sqrt{r^2 + h^2} = \\sqrt{25 + 144} = \\sqrt{169} = 13$$" },
      { id:8, level:2, typ:"numerisch", frage:"Kegel \\(r=5, s=13\\). Mantelfläche (2 Dez).", loesung:204.20, toleranz:0.5, tipp:"\\(\\pi\\cdot 5\\cdot 13\\).", loesungsweg:"$$M = \\pi r s = \\pi \\cdot 5 \\cdot 13 = 65\\pi \\approx 204{,}20$$" },
      { id:9, level:2, typ:"numerisch", frage:"Kugel mit \\(r=4\\). Volumen (2 Dez).", loesung:268.08, toleranz:0.5, tipp:"\\(\\frac{4}{3}\\pi r^3\\).", loesungsweg:"Kugelvolumen: $$V = \\tfrac43 \\pi r^3 = \\tfrac43 \\pi \\cdot 64 = \\tfrac{256}{3}\\pi \\approx 268{,}08$$ Der Radius geht in der dritten Potenz ein." },
      { id:10, level:2, typ:"numerisch", frage:"Kegel \\(r=6, h=8\\). Volumen (2 Dez).", loesung:301.59, toleranz:1.0, tipp:"\\(\\frac{1}{3}\\pi\\cdot 36\\cdot 8\\).", loesungsweg:"$$V = \\tfrac{1}{3}\\pi \\cdot 36 \\cdot 8 = 96\\pi \\approx 301{,}59$$" },
      { id:11, level:2, typ:"numerisch", frage:"Pyramide, \\(G=49\\), Volumen \\(98\\). Höhe?", loesung:6, toleranz:0.05, tipp:"\\(h=3V/G\\).", loesungsweg:"Aus \\(V = \\tfrac13 G h\\) folgt \\(h = \\frac{3V}{G}\\): $$h = \\frac{3 \\cdot 98}{49} = \\frac{294}{49} = 6$$" },
      { id:12, level:2, typ:"mc", frage:"Wodurch unterscheiden sich Pyramide und Prisma?", optionen:["Pyramide hat Spitze, Prisma zwei kongruente Basen","gleich","Pyramide hat Kreisbasis","Prisma hat Spitze"], korrekt:0, tipp:"Definition.", loesungsweg:"Die Pyramide läuft in <b>einer Spitze</b> zusammen, das Prisma hat <b>zwei kongruente, parallele</b> Grundflächen. Deshalb fasst die Pyramide bei gleicher Grundfläche und Höhe nur ein Drittel des Prismas." },
      { id:13, level:3, typ:"numerisch", frage:"Eisdüte (Kegel), \\(r=3\\,\\text{cm}, h=12\\,\\text{cm}\\). Volumen (ml, 2 Dez).", loesung:113.10, toleranz:0.5, tipp:"Ein Kegel hat ein Drittel des Volumens eines Zylinders mit gleicher Grundfläche und Höhe.", loesungsweg:"$$V = \\tfrac{1}{3}\\pi \\cdot 3^2 \\cdot 12 = 36\\pi \\approx 113{,}10\\,\\text{cm}^3$$ Wegen \\(1\\,\\text{cm}^3 = 1\\,\\text{ml}\\) sind das rund \\(113\\) Milliliter." },
      { id:14, level:3, typ:"numerisch", frage:"Pyramide mit Cheops-Maßen: Grundkante \\(230\\,\\text{m}\\), Höhe \\(147\\,\\text{m}\\). Volumen in <b>Tausend</b> m³ (auf ganze Tausend)?", loesung:2592, toleranz:20, tipp:"\\(\\frac{1}{3}\\cdot 230^2\\cdot 147\\).", loesungsweg:"$$V = \\tfrac{1}{3} \\cdot 230^2 \\cdot 147 = \\tfrac{1}{3} \\cdot 52\\,900 \\cdot 147 \\approx 2\\,592\\,100\\,\\text{m}^3$$ In Tausend Kubikmetern also rund \\(2592\\)." },
      { id:15, level:3, typ:"numerisch", frage:"Kegel: Mantelfläche bei \\(r=4, h=3\\) (2 Dez).", loesung:62.83, toleranz:0.2, tipp:"Für den Mantel brauchst du die Mantellinie \\(s\\) — sie ist die Hypotenuse im Dreieck aus \\(r\\) und \\(h\\).", loesungsweg:"Zuerst die Mantellinie: \\(s = \\sqrt{16+9} = 5\\). Dann $$M = \\pi r s = \\pi \\cdot 4 \\cdot 5 = 20\\pi \\approx 62{,}83$$" },
      { id:16, level:3, typ:"numerisch", frage:"Quadr. Pyramide: Grundkante 6, Höhe 4. Seitenhöhe \\(h_s\\)?", loesung:5, toleranz:0.05, tipp:"\\(h_s=\\sqrt{3^2+4^2}\\).", loesungsweg:"Die Seitenhöhe reicht von der Spitze bis zur Mitte einer Grundkante. Das zugehörige rechtwinklige Dreieck hat die Katheten \\(h = 4\\) und \\(\\tfrac{a}{2} = 3\\): $$h_s = \\sqrt{3^2 + 4^2} = \\sqrt{25} = 5$$ Achtung: Es zählt die <b>halbe</b> Grundkante, nicht die ganze." },
      { id:17, level:3, typ:"numerisch", frage:"Kegel, Volumen \\(100\\pi\\), \\(h=12\\). Radius (2 Dez)?", loesung:5, toleranz:0.05, tipp:"\\(r^2=3V/(\\pi h)\\).", loesungsweg:"Aus \\(V = \\tfrac13 \\pi r^2 h\\) folgt $$r^2 = \\frac{3V}{\\pi h} = \\frac{300\\pi}{12\\pi} = 25 \\implies r = 5$$" },
      { id:18, level:3, typ:"mc", frage:"Verdopple Höhe eines Kegels. Volumen …", optionen:["verdoppelt","vervierfacht","gleich","halbiert"], korrekt:0, tipp:"Linear.", loesungsweg:"In \\(V = \\tfrac13 \\pi r^2 h\\) kommt \\(h\\) nur in der ersten Potenz vor — die Verdopplung der Höhe verdoppelt also das Volumen. Beim Radius wäre es der Faktor \\(4\\), weil er im Quadrat steht." },
      { id:19, level:4, typ:"numerisch", frage:"Eine quadratische Pyramide hat das Volumen \\(400\\,\\text{cm}^3\\) und die Höhe \\(12\\,\\text{cm}\\). Wie lang ist ihre Grundkante in cm?", loesung:10, toleranz:0, tipp:"Erst die Grundfläche aus dem Volumen.", loesungsweg:"Aus \\(V = \\tfrac13 G h\\) folgt $$G = \\frac{3V}{h} = \\frac{1200}{12} = 100\\,\\text{cm}^2$$ Die quadratische Grundfläche hat die Kante \\(a = \\sqrt{100} = 10\\,\\text{cm}\\)." },
      { id:20, level:4, typ:"mc", frage:"Ein Sektglas hat die Form eines Kegels mit \\(8\\,\\text{cm}\\) Durchmesser und \\(9\\,\\text{cm}\\) Höhe. Welche Rechnung liefert sein Fassungsvermögen in cm³?", optionen:["\\(\\tfrac13 \\cdot \\pi \\cdot 4^2 \\cdot 9\\)","\\(\\tfrac13 \\cdot \\pi \\cdot 8^2 \\cdot 9\\)","\\(\\pi \\cdot 4^2 \\cdot 9\\)","\\(\\tfrac13 \\cdot \\pi \\cdot 4 \\cdot 9\\)"], korrekt:0, tipp:"Gegeben ist der Durchmesser, in der Formel steht der Radius.", loesungsweg:"Der Kegel hat den Radius \\(r = 4\\,\\text{cm}\\): $$V = \\tfrac13 \\pi r^2 h = \\tfrac13 \\cdot \\pi \\cdot 4^2 \\cdot 9 = 48\\pi \\approx 150{,}8\\,\\text{cm}^3$$ Mit \\(8^2\\) wäre der Durchmesser eingesetzt (viermal zu viel), ohne \\(\\tfrac13\\) wäre es der Zylinder, und \\(\\pi \\cdot 4 \\cdot 9\\) quadriert den Radius nicht." },
      { id:21, level:4, typ:"numerisch", frage:"Ein Zeltdach ist eine quadratische Pyramide mit der Grundkante \\(6\\,\\text{m}\\); jede der vier dreieckigen Seitenflächen ist \\(5\\,\\text{m}\\) hoch. Wie viel m² Zeltstoff werden für die vier Seitenflächen gebraucht?", loesung:60, toleranz:0, tipp:"Vier gleiche Dreiecke mit Grundseite \\(6\\) und Höhe \\(5\\).", loesungsweg:"Jede Seitenfläche ist ein Dreieck mit \\(A = \\tfrac12 \\cdot 6 \\cdot 5 = 15\\,\\text{m}^2\\): $$M = 4 \\cdot 15 = 60\\,\\text{m}^2$$ Die Grundfläche (Boden) gehört nicht dazu." },
      { id:22, level:4, typ:"numerisch", frage:"Ein Kegel hat das Volumen \\(314\\,\\text{cm}^3\\) und den Radius \\(5\\,\\text{cm}\\). Wie hoch ist er in cm (\\(\\pi = 3{,}14\\))?", loesung:12, toleranz:0.05, tipp:"Der Faktor \\(\\tfrac13\\) wandert beim Umstellen als \\(3\\) auf die andere Seite.", loesungsweg:"$$\\tfrac13 \\cdot 3{,}14 \\cdot 5^2 \\cdot h = 314 \\implies 26{,}17 \\cdot h = 314$$ $$h = \\frac{3 \\cdot 314}{3{,}14 \\cdot 25} = \\frac{942}{78{,}5} = 12\\,\\text{cm}$$" },
      { id:23, level:4, typ:"numerisch", frage:"Ein Kegel hat die Mantellinie \\(10\\,\\text{cm}\\) und die Höhe \\(8\\,\\text{cm}\\). Wie groß ist sein Volumen in cm³ (\\(\\pi = 3{,}14\\))?", loesung:301.44, toleranz:1, tipp:"Der Radius fehlt — Mantellinie, Höhe und Radius bilden ein rechtwinkliges Dreieck.", loesungsweg:"Radius aus dem rechtwinkligen Dreieck (Mantellinie = Hypotenuse): $$r = \\sqrt{10^2 - 8^2} = \\sqrt{36} = 6\\,\\text{cm}$$ $$V = \\tfrac13 \\cdot 3{,}14 \\cdot 6^2 \\cdot 8 = 301{,}44\\,\\text{cm}^3$$" },
      { id:24, level:4, typ:"numerisch", frage:"Ein Partyhut ist ein Kegelmantel ohne Boden mit dem Radius \\(10\\,\\text{cm}\\) und der Mantellinie \\(25\\,\\text{cm}\\). Wie viel cm² Pappe werden gebraucht (\\(\\pi = 3{,}14\\))?", loesung:785, toleranz:1, tipp:"Nur der Mantel — kein Grundkreis.", loesungsweg:"Der Hut ist nur der Mantel: $$M = \\pi r s = 3{,}14 \\cdot 10 \\cdot 25 = 785\\,\\text{cm}^2$$ Der Grundkreis (\\(314\\,\\text{cm}^2\\)) wird nicht gebraucht — der Hut ist unten offen." },
      { id:25, level:5, typ:"mc", frage:"Emma berechnet das Volumen einer quadratischen Pyramide mit der Grundkante \\(6\\,\\text{cm}\\) und der Höhe \\(10\\,\\text{cm}\\): \\(V = 6^2 \\cdot 10 = 360\\,\\text{cm}^3\\). Was ist dazu zu sagen?", optionen:["Die Rechnung ist richtig.","Falsch: Der Faktor \\(\\tfrac13\\) fehlt, richtig sind \\(120\\,\\text{cm}^3\\).","Falsch: Das Volumen ist \\(6 \\cdot 10 = 60\\,\\text{cm}^3\\).","Falsch: Der Faktor \\(\\tfrac12\\) fehlt, richtig sind \\(180\\,\\text{cm}^3\\)."], korrekt:1, tipp:"\\(6^2 \\cdot 10\\) ist das Volumen welches Körpers?", loesungsweg:"\\(6^2 \\cdot 10 = 360\\) ist das Volumen des <b>Prismas</b> (Quaders) mit derselben Grundfläche und Höhe. Die Pyramide fasst nur ein Drittel davon: $$V = \\tfrac13 \\cdot 36 \\cdot 10 = 120\\,\\text{cm}^3$$ Der Faktor \\(\\tfrac12\\) gehört zu Dreiecksflächen, nicht zu Pyramiden." },
      { id:26, level:5, typ:"numerisch", frage:"Ein Kegel hat den Radius \\(9\\,\\text{cm}\\) und die Höhe \\(12\\,\\text{cm}\\). Wie groß ist seine gesamte Oberfläche in cm² (\\(\\pi = 3{,}14\\))?", loesung:678.24, toleranz:1, tipp:"Für den Mantel braucht man die Mantellinie, nicht die Höhe.", loesungsweg:"Mantellinie: $$s = \\sqrt{9^2 + 12^2} = \\sqrt{225} = 15\\,\\text{cm}$$ Oberfläche = Grundkreis + Mantel: $$O = 3{,}14 \\cdot 9^2 + 3{,}14 \\cdot 9 \\cdot 15 = 254{,}34 + 423{,}9 = 678{,}24\\,\\text{cm}^2$$" },
      { id:27, level:5, typ:"numerisch", frage:"Eine Kugel hat den Umfang \\(62{,}8\\,\\text{cm}\\) (gemessen um die dickste Stelle). Wie groß ist ihr Volumen in cm³ (\\(\\pi = 3{,}14\\), auf ganze cm³)?", loesung:4187, toleranz:2, tipp:"Der Umfang der Kugel ist der Umfang ihres größten Kreises.", loesungsweg:"Radius aus dem Umfang: $$r = \\frac{62{,}8}{2 \\cdot 3{,}14} = 10\\,\\text{cm}$$ Kugelvolumen: $$V = \\tfrac43 \\pi r^3 = \\tfrac43 \\cdot 3{,}14 \\cdot 1000 \\approx 4187\\,\\text{cm}^3$$ Das sind gut \\(4\\) Liter." },
      { id:28, level:5, typ:"mc", frage:"Jonas berechnet die Mantelfläche eines Kegels mit \\(r = 3\\,\\text{cm}\\) und \\(h = 4\\,\\text{cm}\\): \\(M = \\pi \\cdot 3 \\cdot 4 \\approx 37{,}7\\,\\text{cm}^2\\). Was ist dazu zu sagen?", optionen:["Die Rechnung ist richtig.","Falsch: In der Mantelformel steht die Mantellinie \\(s = 5\\,\\text{cm}\\), richtig sind etwa \\(47{,}1\\,\\text{cm}^2\\).","Falsch: Die Mantelfläche ist \\(\\pi \\cdot 3^2 \\cdot 4 \\approx 113{,}1\\,\\text{cm}^2\\).","Falsch: Der Faktor \\(\\tfrac13\\) fehlt, richtig sind etwa \\(12{,}6\\,\\text{cm}^2\\)."], korrekt:1, tipp:"Welche Strecke ist beim abgerollten Mantel der Radius des Kreissektors?", loesungsweg:"Der abgerollte Mantel ist ein Kreissektor mit dem Radius \\(s\\) (Mantellinie), nicht \\(h\\). Mit \\(s = \\sqrt{3^2 + 4^2} = 5\\,\\text{cm}\\): $$M = \\pi r s = \\pi \\cdot 3 \\cdot 5 = 15\\pi \\approx 47{,}1\\,\\text{cm}^2$$ \\(\\pi r^2 h\\) wäre ein Zylindervolumen, und der Faktor \\(\\tfrac13\\) gehört zum Volumen, nicht zur Fläche." },
      { id:29, level:5, typ:"numerisch", frage:"Ein Sandhaufen hat die Form eines Kegels: \\(6\\,\\text{m}\\) Durchmesser, \\(2\\,\\text{m}\\) hoch. Ein Anhänger fasst \\(2{,}5\\,\\text{m}^3\\). Wie viele Fahrten sind nötig, um den ganzen Haufen abzutransportieren (\\(\\pi = 3{,}14\\))?", loesung:8, toleranz:0, tipp:"Volumen des Kegels, dann aufrunden — der Rest braucht auch eine Fahrt.", loesungsweg:"Radius \\(3\\,\\text{m}\\): $$V = \\tfrac13 \\cdot 3{,}14 \\cdot 3^2 \\cdot 2 = 18{,}84\\,\\text{m}^3$$ $$\\frac{18{,}84}{2{,}5} = 7{,}5$$ Also \\(8\\) Fahrten — die achte ist nur halb voll, aber nötig." },
      { id:30, level:5, typ:"numerisch", frage:"Eine quadratische Pyramide hat die Seitenkante \\(13\\,\\text{cm}\\) und die Höhe \\(12\\,\\text{cm}\\). Wie groß ist ihr Volumen in cm³?", loesung:200, toleranz:0.5, tipp:"Seitenkante, Höhe und halbe Diagonale bilden ein rechtwinkliges Dreieck; aus der Diagonalen folgt die Grundfläche.", loesungsweg:"Halbe Grunddiagonale aus dem rechtwinkligen Dreieck: $$\\left(\\tfrac d2\\right)^2 = 13^2 - 12^2 = 25 \\implies \\tfrac d2 = 5, \\quad d = 10\\,\\text{cm}$$ Im Quadrat gilt \\(d^2 = a^2 + a^2 = 2a^2\\), also \\(a^2 = \\tfrac{100}{2} = 50\\,\\text{cm}^2\\) — das ist bereits die Grundfläche: $$V = \\tfrac13 \\cdot 50 \\cdot 12 = 200\\,\\text{cm}^3$$" },
      { id:31, level:6, typ:"mc", frage:"Behauptung: „Verdoppelt man den Radius einer Kugel, so verdoppelt sich ihre Oberfläche.\" Stimmt das?", optionen:["Ja — Oberfläche und Radius sind proportional.","Nein — die Oberfläche vervierfacht sich, das Volumen verachtfacht sich.","Nein — Oberfläche und Volumen verdoppeln sich beide.","Nein — die Oberfläche verachtfacht sich."], korrekt:1, tipp:"In \\(O = 4\\pi r^2\\) steht der Radius im Quadrat.", loesungsweg:"$$O(2r) = 4\\pi (2r)^2 = 4\\pi \\cdot 4r^2 = 4 \\cdot O(r)$$ Die Oberfläche <b>vervierfacht</b> sich (Faktor \\(2^2\\)), das Volumen \\(\\tfrac43 \\pi r^3\\) verachtfacht sich (Faktor \\(2^3\\)). Beispiel: \\(r = 1 \\to 2\\): \\(O\\) von \\(12{,}56\\) auf \\(50{,}24\\)." },
      { id:32, level:6, typ:"numerisch", frage:"Ein Kegel und eine Halbkugel haben beide den Radius \\(6\\,\\text{cm}\\) und dasselbe Volumen. Wie hoch ist der Kegel in cm?", loesung:12, toleranz:0.05, tipp:"Halbkugel = halbes Kugelvolumen; beide Volumina gleichsetzen.", loesungsweg:"Halbkugel: $$V = \\tfrac12 \\cdot \\tfrac43 \\pi r^3 = \\tfrac23 \\pi \\cdot 6^3 = 144\\pi$$ Kegel: \\(\\tfrac13 \\pi \\cdot 6^2 \\cdot h = 12\\pi h\\). Gleichsetzen: $$12\\pi h = 144\\pi \\implies h = 12\\,\\text{cm}$$ Allgemein: \\(h = 2r\\) — der Kegel muss doppelt so hoch sein wie sein Radius." },
      { id:33, level:6, typ:"numerisch", frage:"Aus einem Würfel mit der Kante \\(6\\,\\text{cm}\\) wird die größtmögliche Pyramide geschnitten: Ihre Grundfläche ist die Bodenfläche des Würfels, ihre Spitze der Mittelpunkt der Deckfläche. Wie viel Prozent des Würfels sind Abfall (2 Nachkommastellen)?", loesung:66.67, toleranz:0.1, tipp:"Pyramide und Würfel haben dieselbe Grundfläche und dieselbe Höhe.", loesungsweg:"Würfel: \\(V_W = 6^3 = 216\\). Pyramide mit \\(G = 36\\), \\(h = 6\\): $$V_P = \\tfrac13 \\cdot 36 \\cdot 6 = 72 = \\tfrac13 V_W$$ Abfall: \\(1 - \\tfrac13 = \\tfrac23 \\approx 66{,}67\\,\\%\\). Der Anteil hängt nicht von der Kantenlänge ab — jede solche Pyramide ist ein Drittel ihres Würfels." },
      { id:34, level:6, typ:"mc", frage:"Zwei Kegel haben dieselbe Mantellinie \\(s = 10\\,\\text{cm}\\). Kegel A hat \\(r = 6\\,\\text{cm}\\), Kegel B hat \\(r = 8\\,\\text{cm}\\). Behauptung: „B hat das größere Volumen, weil sein Radius größer ist.\" Was ist dazu zu sagen?", optionen:["Stimmt: \\(V_B = 128\\pi > 96\\pi = V_A\\) — der größere Radius wiegt die kleinere Höhe auf.","Stimmt nicht: Beide Volumina sind gleich, weil die Mantellinie gleich ist.","Stimmt nicht: A ist größer, weil A höher ist.","Stimmt nicht: Ohne die Höhen lässt sich das nicht entscheiden."], korrekt:0, tipp:"Die Höhen folgen aus \\(s\\) und \\(r\\) mit Pythagoras.", loesungsweg:"Höhen: \\(h_A = \\sqrt{100 - 36} = 8\\), \\(h_B = \\sqrt{100 - 64} = 6\\). $$V_A = \\tfrac13 \\pi \\cdot 36 \\cdot 8 = 96\\pi, \\qquad V_B = \\tfrac13 \\pi \\cdot 64 \\cdot 6 = 128\\pi$$ B ist tatsächlich größer — aber nicht „weil der Radius größer ist\", sondern weil \\(r^2 h\\) größer ist: Der Radius geht quadratisch ein, die verlorene Höhe nur linear. Bei noch größerem Radius (etwa \\(r = 9{,}5\\)) würde die Höhe so klein, dass das Volumen wieder sinkt." },
      { id:35, level:6, typ:"numerisch", frage:"Eine Kugel hat die Oberfläche \\(452{,}16\\,\\text{cm}^2\\). Wie groß ist ihr Volumen in cm³ (\\(\\pi = 3{,}14\\), 2 Nachkommastellen)?", loesung:904.32, toleranz:1, tipp:"Aus der Oberfläche den Radius gewinnen.", loesungsweg:"$$4 \\cdot 3{,}14 \\cdot r^2 = 452{,}16 \\implies r^2 = 36 \\implies r = 6\\,\\text{cm}$$ $$V = \\tfrac43 \\cdot 3{,}14 \\cdot 6^3 = \\tfrac43 \\cdot 3{,}14 \\cdot 216 = 904{,}32\\,\\text{cm}^3$$" },
      { id:36, level:6, typ:"numerisch", frage:"Eine quadratische Pyramide hat die Grundkante \\(10\\,\\text{cm}\\), und alle vier Seitenflächen sind <b>gleichseitige</b> Dreiecke. Wie hoch ist die Pyramide in cm (2 Nachkommastellen)?", loesung:7.07, toleranz:0.02, tipp:"Gleichseitig heißt: Die Seitenkanten sind so lang wie die Grundkante.", loesungsweg:"Jede Seitenkante ist \\(10\\,\\text{cm}\\) lang. Die halbe Grunddiagonale: \\(d^2 = 10^2 + 10^2 = 200\\), also \\(\\left(\\tfrac d2\\right)^2 = 50\\). Im rechtwinkligen Dreieck aus Höhe, halber Diagonale und Seitenkante: $$h^2 = 10^2 - 50 = 50 \\implies h = \\sqrt{50} \\approx 7{,}07\\,\\text{cm}$$ Die Höhe ist genau so lang wie die halbe Diagonale — die Pyramide ist ein halbes Oktaeder." }];
    </script>

</body>
</html>
