<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyramide &amp; Kegel - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-raumgeometrie-pyramide-kegel';
    const THEMA_CONFIG = { name: 'Pyramide & Kegel', bereich: 'geometrie' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Volumenformel Pyramide?", optionen:["\\(G\\cdot h\\)","\\(\\frac{1}{3}G\\cdot h\\)","\\(\\frac{1}{2}G\\cdot h\\)","\\(\\pi r^2 h\\)"], korrekt:1, tipp:"Ein Drittel.", loesungsweg:"Drei Pyramiden mit gleicher Grundfläche und Höhe füllen genau ein Prisma — deshalb der Faktor \\(\\tfrac13\\): $$V = \\tfrac{1}{3} \\cdot G \\cdot h$$ Der Faktor gilt für jede Pyramide, gleichgültig welche Form die Grundfläche hat." },
      { id:2, level:1, typ:"mc", frage:"Volumenformel Kegel?", optionen:["\\(\\pi r^2 h\\)","\\(\\frac{1}{3}\\pi r^2 h\\)","\\(2\\pi r h\\)","\\(\\pi r s\\)"], korrekt:1, tipp:"Ein Drittel Zylindervolumen.", loesungsweg:"Der Kegel ist eine Pyramide mit kreisförmiger Grundfläche. Mit \\(G = \\pi r^2\\) folgt: $$V = \\tfrac{1}{3}\\pi r^2 h$$ Er fasst also genau ein Drittel des Zylinders mit gleichem Radius und gleicher Höhe." },
      { id:3, level:1, typ:"mc", frage:"Mantelfläche Kegel?", optionen:["\\(\\pi r s\\)","\\(\\pi r^2\\)","\\(2\\pi rh\\)","\\(\\pi r(r+s)\\)"], korrekt:0, tipp:"\\(s\\) = Mantellinie.", loesungsweg:"Der abgerollte Kegelmantel ist ein Kreissektor mit dem Radius \\(s\\) (der Mantellinie). Seine Fläche beträgt $$M = \\pi r s$$ Wichtig: Hier steht die <b>Mantellinie</b> \\(s\\), nicht die Höhe \\(h\\) — sie ist die schräge Strecke von der Spitze zum Grundkreisrand." },
      { id:4, level:1, typ:"numerisch", frage:"Pyramide, \\(G=30, h=6\\). Volumen?", loesung:60, toleranz:0, tipp:"\\(\\frac{1}{3}\\cdot 30\\cdot 6\\).", loesungsweg:"$$V = \\tfrac{1}{3} \\cdot 30 \\cdot 6 = \\tfrac{180}{3} = 60$$" },
      { id:5, level:1, typ:"numerisch", frage:"Kegel \\(r=3, h=4\\). Volumen (2 Dez).", loesung:37.70, toleranz:0.1, tipp:"\\(\\frac{1}{3}\\pi\\cdot 9\\cdot 4\\).", loesungsweg:"$$V = \\tfrac{1}{3}\\pi r^2 h = \\tfrac{1}{3}\\pi \\cdot 9 \\cdot 4 = 12\\pi \\approx 37{,}70$$" },
      { id:6, level:1, typ:"numerisch", frage:"Quadratische Pyramide, Grundkante 6, Höhe 10. Volumen?", loesung:120, toleranz:0, tipp:"\\(\\frac{1}{3}\\cdot 36\\cdot 10\\).", loesungsweg:"Die quadratische Grundfläche misst \\(6^2 = 36\\): $$V = \\tfrac{1}{3} \\cdot 36 \\cdot 10 = 120$$" },
      { id:7, level:2, typ:"numerisch", frage:"Kegel \\(r=5, h=12\\). Mantellinie \\(s\\)?", loesung:13, toleranz:0, tipp:"\\(s=\\sqrt{r^2+h^2}\\).", loesungsweg:"Radius, Höhe und Mantellinie bilden ein rechtwinkliges Dreieck, in dem \\(s\\) die Hypotenuse ist: $$s = \\sqrt{r^2 + h^2} = \\sqrt{25 + 144} = \\sqrt{169} = 13$$" },
      { id:8, level:2, typ:"numerisch", frage:"Kegel \\(r=5, s=13\\). Mantelfläche (2 Dez).", loesung:204.20, toleranz:0.5, tipp:"\\(\\pi\\cdot 5\\cdot 13\\).", loesungsweg:"$$M = \\pi r s = \\pi \\cdot 5 \\cdot 13 = 65\\pi \\approx 204{,}20$$" },
      { id:9, level:2, typ:"numerisch", frage:"Quadr. Pyramide, Grundkante 8, Seitenkante 10. Höhe?", loesung:8.25, toleranz:0.05, tipp:"Halbe Diagonale \\(4\\sqrt 2\\), \\(h=\\sqrt{100-32}\\).", loesungsweg:"Halbe Diagonale \\(=4\\sqrt 2\\), \\((4\\sqrt 2)^2=32\\); \\(h^2=10^2-32=68\\Rightarrow h=\\sqrt{68}\\approx 8{,}25\\)." },
      { id:10, level:2, typ:"numerisch", frage:"Kegel \\(r=6, h=8\\). Volumen (2 Dez).", loesung:301.59, toleranz:1.0, tipp:"\\(\\frac{1}{3}\\pi\\cdot 36\\cdot 8\\).", loesungsweg:"$$V = \\tfrac{1}{3}\\pi \\cdot 36 \\cdot 8 = 96\\pi \\approx 301{,}59$$" },
      { id:11, level:2, typ:"numerisch", frage:"Pyramide, \\(G=49\\), Volumen \\(98\\). Höhe?", loesung:6, toleranz:0.05, tipp:"\\(h=3V/G\\).", loesungsweg:"\\(h=294/49=6\\)." },
      { id:12, level:2, typ:"mc", frage:"Wodurch unterscheiden sich Pyramide und Prisma?", optionen:["Pyramide hat Spitze, Prisma zwei kongruente Basen","gleich","Pyramide hat Kreisbasis","Prisma hat Spitze"], korrekt:0, tipp:"Definition.", loesungsweg:"Pyramide: eine Spitze; Prisma: zwei parallele kongruente Grundflächen." },
      { id:13, level:3, typ:"numerisch", frage:"Eisdüte (Kegel), \\(r=3\\,\\text{cm}, h=12\\,\\text{cm}\\). Volumen (ml, 2 Dez).", loesung:113.10, toleranz:0.5, tipp:"\\(36\\pi\\).", loesungsweg:"$$V = \\tfrac{1}{3}\\pi \\cdot 3^2 \\cdot 12 = 36\\pi \\approx 113{,}10\\,\\text{cm}^3$$ Wegen \\(1\\,\\text{cm}^3 = 1\\,\\text{ml}\\) sind das rund \\(113\\) Milliliter." },
      { id:14, level:3, typ:"numerisch", frage:"Pyramide mit Cheops-Maßen: Grundkante 230, Höhe 147. Volumen (in Tausend, 0 Dez).", loesung:2592, toleranz:20, tipp:"\\(\\frac{1}{3}\\cdot 230^2\\cdot 147\\).", loesungsweg:"$$V = \\tfrac{1}{3} \\cdot 230^2 \\cdot 147 = \\tfrac{1}{3} \\cdot 52\\,900 \\cdot 147 \\approx 2\\,592\\,100\\,\\text{m}^3$$ In Tausend Kubikmetern also rund \\(2592\\)." },
      { id:15, level:3, typ:"numerisch", frage:"Kegel: Mantelfläche bei \\(r=4, h=3\\) (2 Dez).", loesung:62.83, toleranz:0.2, tipp:"\\(s=5\\), \\(M=20\\pi\\).", loesungsweg:"Zuerst die Mantellinie: \\(s = \\sqrt{16+9} = 5\\). Dann $$M = \\pi r s = \\pi \\cdot 4 \\cdot 5 = 20\\pi \\approx 62{,}83$$" },
      { id:16, level:3, typ:"numerisch", frage:"Quadr. Pyramide: Grundkante 6, Höhe 4. Seitenhöhe \\(h_s\\)?", loesung:5, toleranz:0.05, tipp:"\\(h_s=\\sqrt{3^2+4^2}\\).", loesungsweg:"Die Seitenhöhe reicht von der Spitze bis zur Mitte einer Grundkante. Das zugehörige rechtwinklige Dreieck hat die Katheten \\(h = 4\\) und \\(\\tfrac{a}{2} = 3\\): $$h_s = \\sqrt{3^2 + 4^2} = \\sqrt{25} = 5$$ Achtung: Es zählt die <b>halbe</b> Grundkante, nicht die ganze." },
      { id:17, level:3, typ:"numerisch", frage:"Kegel, Volumen \\(100\\pi\\), \\(h=12\\). Radius (2 Dez)?", loesung:5, toleranz:0.05, tipp:"\\(r^2=3V/(\\pi h)\\).", loesungsweg:"\\(r^2=25\\Rightarrow r=5\\)." },
      { id:18, level:3, typ:"mc", frage:"Verdopple Höhe eines Kegels. Volumen …", optionen:["verdoppelt","vervierfacht","gleich","halbiert"], korrekt:0, tipp:"Linear.", loesungsweg:"In \\(V = \\tfrac13 \\pi r^2 h\\) kommt \\(h\\) nur in der ersten Potenz vor — die Verdopplung der Höhe verdoppelt also das Volumen. Beim Radius wäre es der Faktor \\(4\\), weil er im Quadrat steht." },
      { id:19, level:4, typ:"numerisch", frage:"Quadr. Pyramide: Grundkante 10, Höhe 12. Oberfläche (mit Mantelvierecken).", loesung:360, toleranz:1, tipp:"\\(h_s=\\sqrt{25+144}=13\\); \\(M=4\\cdot\\frac{10\\cdot 13}{2}=260\\); +\\(100\\).", loesungsweg:"\\(O=100+260=360\\)." },
      { id:20, level:4, typ:"numerisch", frage:"Kegel: \\(r=6, h=8\\). Gesamtoberfläche (2 Dez).", loesung:301.59, toleranz:1.0, tipp:"\\(s=10\\); \\(O=\\pi r(r+s)=\\pi\\cdot 6\\cdot 16=96\\pi\\).", loesungsweg:"Erst die Mantellinie: \\(s = \\sqrt{36+64} = 10\\). Die Oberfläche besteht aus Grundkreis und Mantel: $$O = \\pi r^2 + \\pi r s = \\pi r(r+s) = \\pi \\cdot 6 \\cdot 16 = 96\\pi \\approx 301{,}59$$" },
      { id:21, level:4, typ:"numerisch", frage:"Kegel mit Volumen gleich Halbkugel \\((\\frac{2}{3}\\pi R^3)\\) und gleichem Radius. \\(h\\) in Einheiten von \\(R\\)?", loesung:2, toleranz:0.01, tipp:"\\(\\frac{1}{3}\\pi R^2 h=\\frac{2}{3}\\pi R^3\\).", loesungsweg:"Gleichsetzen der beiden Volumina: $$\\tfrac{1}{3}\\pi R^2 h = \\tfrac{2}{3}\\pi R^3$$ Kürzen von \\(\\tfrac13 \\pi R^2\\): \\(h = 2R\\). Ein Kegel muss also doppelt so hoch sein wie der Radius, um so viel zu fassen wie die Halbkugel." },
      { id:22, level:4, typ:"numerisch", frage:"Quadr. Pyramide, Seitenkante 13, Grundkante 10. Höhe (2 Dez).", loesung:10.91, toleranz:0.1, tipp:"\\(h=\\sqrt{169-50}=\\sqrt{119}\\).", loesungsweg:"Halbe Diagonale \\(=5\\sqrt 2\\approx 7{,}07\\), Quadrat \\(=50\\); \\(h^2=13^2-50=119\\Rightarrow h=\\sqrt{119}\\approx 10{,}91\\)." },
      { id:23, level:4, typ:"numerisch", frage:"Eine Kegel mit Volumen 150 und \\(r=5\\). Höhe (2 Dez).", loesung:5.73, toleranz:0.1, tipp:"\\(h=3V/(\\pi r^2)\\).", loesungsweg:"Aus \\(V = \\tfrac13 \\pi r^2 h\\) nach \\(h\\) umgestellt: $$h = \\frac{3V}{\\pi r^2} = \\frac{450}{25\\pi} \\approx 5{,}73$$ Der Faktor \\(3\\) im Zähler entsteht durch das Auflösen des Drittels." },
      { id:24, level:4, typ:"mc", frage:"Eine Pyramide und ein Prisma mit gleicher Grundfläche und Höhe verhalten sich im Volumen …", optionen:["1:1","1:2","1:3","2:3"], korrekt:2, tipp:"Faktor 1/3.", loesungsweg:"Die Pyramide hat den Faktor \\(\\tfrac13\\), das Prisma nicht: $$\\frac{V_{\\text{Pyr}}}{V_{\\text{Pr}}} = \\frac{\\tfrac13 Gh}{Gh} = \\frac{1}{3}$$ Das Verhältnis ist also \\(1:3\\) — drei solche Pyramiden füllen das Prisma genau aus." },
      { id:25, level:5, typ:"numerisch", frage:"Kegel mit \\(s=10, r=6\\). Volumen (2 Dez).", loesung:301.59, toleranz:1.0, tipp:"\\(h=\\sqrt{100-36}=8\\).", loesungsweg:"Hier ist die Mantellinie gegeben, gesucht wird die Höhe: $$h = \\sqrt{s^2 - r^2} = \\sqrt{100-36} = 8$$ $$V = \\tfrac{1}{3}\\pi \\cdot 36 \\cdot 8 = 96\\pi \\approx 301{,}59$$" },
      { id:26, level:5, typ:"numerisch", frage:"Regelmäßige sechseckige Pyramide: Grundseite 4, Höhe 9. Grundfläche \\(=24\\sqrt 3\\). Volumen (2 Dez).", loesung:124.71, toleranz:1.0, tipp:"\\(\\frac{1}{3}\\cdot 24\\sqrt 3\\cdot 9\\).", loesungsweg:"Die Grundfläche ist gegeben, die Pyramidenformel gilt unverändert: $$V = \\tfrac{1}{3} \\cdot 24\\sqrt{3} \\cdot 9 = 72\\sqrt{3} \\approx 124{,}71$$" },
      { id:27, level:5, typ:"numerisch", frage:"Kegelstumpf: \\(R=5, r=3, h=4\\). Volumen (2 Dez).", loesung:205.25, toleranz:1.5, tipp:"\\(V=\\frac{\\pi h}{3}(R^2+Rr+r^2)\\).", loesungsweg:"Für den Kegelstumpf gilt $$V = \\frac{\\pi h}{3}\\left(R^2 + Rr + r^2\\right) = \\frac{4\\pi}{3}(25 + 15 + 9) = \\frac{196\\pi}{3} \\approx 205{,}25$$ Der Mischterm \\(Rr\\) wird oft vergessen — ohne ihn käme ein zu kleiner Wert heraus." },
      { id:28, level:5, typ:"numerisch", frage:"Kegel (\\(r=3, h=4\\)) in Zylinder (\\(r=3, h=4\\)) eingeschrieben. Leerer Anteil in Prozent.", loesung:66.67, toleranz:0.5, tipp:"\\(1-1/3\\).", loesungsweg:"Der Kegel füllt genau ein Drittel des Zylinders (gleiche Grundfläche, gleiche Höhe). Leer bleibt der Rest: $$1 - \\tfrac13 = \\tfrac23 \\approx 66{,}67\\,\\%$$ Die konkreten Maße werden dafür gar nicht gebraucht." },
      { id:29, level:5, typ:"numerisch", frage:"Quadratische Pyramide, \\(V=96\\), Grundkante 6. Höhe?", loesung:8, toleranz:0.05, tipp:"\\(h=3V/G\\).", loesungsweg:"\\(h=288/36=8\\)." },
      { id:30, level:5, typ:"mc", frage:"Welcher Zusammenhang zwischen Radius, Höhe und Mantellinie beim Kegel?", optionen:["\\(s=r+h\\)","\\(s^2=r^2+h^2\\)","\\(s=rh\\)","\\(s=r-h\\)"], korrekt:1, tipp:"Pythagoras.", loesungsweg:"Schneidet man den Kegel senkrecht durch die Spitze, entsteht ein Dreieck mit den Katheten \\(r\\) und \\(h\\) und der Hypotenuse \\(s\\). Nach dem Satz des Pythagoras gilt daher $$s^2 = r^2 + h^2$$ Aus je zwei der drei Größen lässt sich die dritte berechnen." },
      { id:31, level:6, typ:"numerisch", frage:"Ein Kegel hat Mantelfläche \\(=\\) 2×Grundfläche. Zusammenhang \\(s/r\\)?", loesung:2, toleranz:0.01, tipp:"\\(\\pi rs=2\\pi r^2\\).", loesungsweg:"Gleichsetzen: $$\\pi r s = 2\\pi r^2$$ Kürzen von \\(\\pi r\\): \\(s = 2r\\), also ist das Verhältnis \\(\\tfrac{s}{r} = 2\\)." },
      { id:32, level:6, typ:"numerisch", frage:"Wasserbehälter: umgekehrter Kegel, \\(r=20, h=40\\). Wasser bis \\(h=10\\). Volumen (2 Dez)?", loesung:261.80, toleranz:2, tipp:"Ähnlichkeit: \\(r_w=5\\); \\(V=\\frac{1}{3}\\pi\\cdot 25\\cdot 10\\).", loesungsweg:"Der Wasserkörper ist ein kleinerer, ähnlicher Kegel. Wegen der Ähnlichkeit gilt \\(\\frac{r_w}{h_w} = \\frac{20}{40} = \\tfrac12\\), bei \\(h_w = 10\\) also \\(r_w = 5\\): $$V = \\tfrac{1}{3}\\pi \\cdot 25 \\cdot 10 = \\frac{250\\pi}{3} \\approx 261{,}80$$ Mit dem vollen Radius \\(20\\) zu rechnen wäre der typische Fehler." },
      { id:33, level:6, typ:"numerisch", frage:"Pyramide (Grundkante 12, Höhe 8). Neigungswinkel Seitenfläche zu Grund (1 Dez Grad).", loesung:53.1, toleranz:0.3, tipp:"\\(\\tan\\alpha=h/(a/2)=8/6\\).", loesungsweg:"Der Neigungswinkel liegt im Dreieck aus Höhe und halber Grundkante: $$\\tan\\alpha = \\frac{h}{a/2} = \\frac{8}{6} = \\frac43$$ $$\\alpha = \\arctan\\tfrac43 \\approx 53{,}1°$$" },
      { id:34, level:6, typ:"numerisch", frage:"Mantel eines Kegels als Kreissektor: \\(r=6, s=10\\). Sektor-Winkel (0 Dez Grad).", loesung:216, toleranz:1, tipp:"\\(\\varphi=360°\\cdot r/s\\).", loesungsweg:"Abgerollt ist der Mantel ein Kreissektor mit Radius \\(s\\). Seine Bogenlänge muss dem Grundkreisumfang entsprechen: $$\\frac{\\varphi}{360°} \\cdot 2\\pi s = 2\\pi r \\;\\Rightarrow\\; \\varphi = 360° \\cdot \\frac{r}{s}$$ $$\\varphi = 360° \\cdot \\frac{6}{10} = 216°$$" },
      { id:35, level:6, typ:"numerisch", frage:"Kegel: Oberfläche \\(=96\\pi\\), \\(r=6\\). Mantellinie?", loesung:10, toleranz:0.05, tipp:"\\(\\pi r^2+\\pi rs=96\\pi\\); \\(36+6s=96\\).", loesungsweg:"Die Oberfläche besteht aus Grundkreis und Mantel: $$\\pi r^2 + \\pi r s = 96\\pi$$ Kürzen von \\(\\pi\\) und Einsetzen von \\(r = 6\\): \\(36 + 6s = 96\\), also \\(6s = 60\\) und $$s = 10$$" },
      { id:36, level:6, typ:"numerisch", frage:"Quadr. Pyramide: Grundkante \\(a\\), Höhe \\(h=a\\). Volumenquotient Pyramide/umschriebener Würfel?", loesung:0.333, toleranz:0.01, tipp:"\\(\\frac{a^3/3}{a^3}\\).", loesungsweg:"Die Pyramide hat \\(V_{\\text{Pyr}} = \\tfrac13 a^2 \\cdot a = \\tfrac{a^3}{3}\\), der umschriebene Würfel \\(V_{\\text{W}} = a^3\\): $$\\frac{a^3/3}{a^3} = \\frac13 \\approx 0{,}333$$ Das Ergebnis hängt nicht von \\(a\\) ab — das Verhältnis ist für jede solche Pyramide dasselbe." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
