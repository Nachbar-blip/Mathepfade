<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Funktion - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-e-funktion';
    const THEMA_CONFIG = { name: 'e-Funktion', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 -- Grundlagen
      { id:1, level:1, typ:"mc", frage:"Die Eulersche Zahl \\(e\\) ist ungefähr:", optionen:["\\(2{,}71\\)","\\(3{,}14\\)","\\(1{,}41\\)","\\(1{,}73\\)"], korrekt:0, tipp:"Basis des natürlichen Log.", loesungsweg:"Die Eulersche Zahl ist \\(e \\approx 2{,}71828\\). Sie ist genau die Basis, für die \\(e^x\\) ihre eigene Ableitung ist — daraus folgt ihre Sonderstellung in der Analysis. Nicht zu verwechseln mit \\(\\pi \\approx 3{,}14\\) oder \\(\\sqrt2 \\approx 1{,}41\\)." },
      { id:2, level:1, typ:"numerisch", frage:"\\(e^0=?\\)", loesung:1, toleranz:0, tipp:"Jede Zahl hoch 0.", loesungsweg:"Jede Zahl außer \\(0\\) ergibt hoch null den Wert \\(1\\): $$e^0 = 1$$ Deshalb schneidet der Graph von \\(e^x\\) die \\(y\\)-Achse bei \\(1\\)." },
      { id:3, level:1, typ:"mc", frage:"Definitionsbereich von \\(f(x)=e^x\\):", optionen:["\\(x>0\\)","\\(x\\neq 0\\)","\\(\\mathbb{R}\\)","\\(x\\geq 0\\)"], korrekt:2, tipp:"Alle reellen Zahlen.", loesungsweg:"In den Exponenten darf jede reelle Zahl eingesetzt werden — negative wie positive, ganze wie gebrochene. Es gibt keine verbotene Stelle: $$D = \\mathbb{R}$$ Anders beim Logarithmus, der nur für positive Argumente erklärt ist." },
      { id:4, level:1, typ:"mc", frage:"Wertebereich von \\(e^x\\):", optionen:["\\(\\mathbb{R}\\)","\\(y>0\\)","\\(y\\geq 0\\)","\\(y<0\\)"], korrekt:1, tipp:"Immer positiv.", loesungsweg:"Eine Potenz mit positiver Basis ist immer positiv: \\(e^x > 0\\) für jedes \\(x\\). Für große negative \\(x\\) kommt der Wert der Null beliebig nahe, erreicht sie aber nie: $$W = \\,]0;\\infty[$$ Genau deshalb ist die \\(x\\)-Achse eine Asymptote." },
      { id:5, level:1, typ:"numerisch", frage:"\\(e^1\\) (gerundet auf 2 Nachkommastellen)?", loesung:2.72, toleranz:0.01, tipp:"\\(e\\).", loesungsweg:"$$e^1 = e \\approx 2{,}72$$" },
      { id:6, level:1, typ:"mc", frage:"Der Graph von \\(e^x\\) …", optionen:["fällt monoton","ist streng monoton steigend","ist periodisch","hat Nullstelle bei 0"], korrekt:1, tipp:"Exponentielles Wachstum.", loesungsweg:"\\(e^x\\) ist streng monoton wachsend." },
      // LEVEL 2 -- Rechengesetze
      { id:7, level:2, typ:"mc", frage:"\\(e^a \\cdot e^b=\\)?", optionen:["\\(e^{a+b}\\)","\\(e^{ab}\\)","\\(e^{a-b}\\)","\\(2e^{a+b}\\)"], korrekt:0, tipp:"Potenzgesetze.", loesungsweg:"Beim Multiplizieren von Potenzen mit gleicher Basis werden die Exponenten addiert: $$e^a \\cdot e^b = e^{a+b}$$ Anschaulich: \\(e^2 \\cdot e^3 = (e\\cdot e)(e\\cdot e\\cdot e) = e^5\\)." },
      { id:8, level:2, typ:"mc", frage:"\\(\\frac{e^a}{e^b}=\\)?", optionen:["\\(e^{ab}\\)","\\(e^{a+b}\\)","\\(e^{a-b}\\)","\\(e^{a/b}\\)"], korrekt:2, tipp:"Division = Subtraktion im Exponenten.", loesungsweg:"Beim Dividieren werden die Exponenten subtrahiert: $$\\frac{e^a}{e^b} = e^{a-b}$$ Das ist die Umkehrung der Multiplikationsregel." },
      { id:9, level:2, typ:"mc", frage:"\\((e^a)^b=\\)?", optionen:["\\(e^{a+b}\\)","\\(e^{ab}\\)","\\(e^{a^b}\\)","\\(e^{a/b}\\)"], korrekt:1, tipp:"Potenz einer Potenz.", loesungsweg:"Beim Potenzieren einer Potenz werden die Exponenten multipliziert: $$(e^a)^b = e^{ab}$$ Denn \\(e^a\\) wird \\(b\\)-mal mit sich selbst multipliziert, also \\(a\\) insgesamt \\(b\\)-mal addiert." },
      { id:10, level:2, typ:"numerisch", frage:"\\(e^2\\cdot e^{-2}=?\\)", loesung:1, toleranz:0, tipp:"Summe der Exponenten.", loesungsweg:"Exponenten addieren: $$e^2 \\cdot e^{-2} = e^{2-2} = e^0 = 1$$ Allgemein ist \\(e^{-x}\\) stets der Kehrwert von \\(e^x\\)." },
      { id:11, level:2, typ:"numerisch", frage:"\\(\\frac{e^5}{e^3}\\) als \\(e^k\\): \\(k=?\\)", loesung:2, toleranz:0, tipp:"Subtraktion.", loesungsweg:"$$\\frac{e^5}{e^3} = e^{5-3} = e^2 \\;\\Rightarrow\\; k = 2$$" },
      { id:12, level:2, typ:"numerisch", frage:"\\(e^{-1}\\) gerundet?", loesung:0.37, toleranz:0.01, tipp:"\\(1/e\\).", loesungsweg:"$$e^{-1} = \\frac{1}{e} \\approx \\frac{1}{2{,}718} \\approx 0{,}37$$" },
      // LEVEL 3 -- ln und e
      { id:13, level:3, typ:"mc", frage:"\\(\\ln(e)=?\\)", optionen:["\\(0\\)","\\(1\\)","\\(e\\)","\\(2{,}72\\)"], korrekt:1, tipp:"ln ist Umkehrung.", loesungsweg:"Der natürliche Logarithmus fragt: „Mit welchem Exponenten wird \\(e\\) zu diesem Wert?\" Wegen \\(e^1 = e\\) gilt $$\\ln e = 1$$" },
      { id:14, level:3, typ:"numerisch", frage:"\\(\\ln(1)=?\\)", loesung:0, toleranz:0, tipp:"\\(e^0=1\\).", loesungsweg:"Wegen \\(e^0 = 1\\) ist der gesuchte Exponent null: $$\\ln 1 = 0$$ Das gilt für jeden Logarithmus, unabhängig von der Basis." },
      { id:15, level:3, typ:"numerisch", frage:"\\(\\ln(e^5)=?\\)", loesung:5, toleranz:0, tipp:"Umkehrfunktion.", loesungsweg:"Logarithmieren und Potenzieren heben einander auf: $$\\ln(e^5) = 5$$ Der Logarithmus liefert genau den Exponenten zurück." },
      { id:16, level:3, typ:"numerisch", frage:"\\(e^{\\ln 7}=?\\)", loesung:7, toleranz:0, tipp:"Inverse.", loesungsweg:"Auch in dieser Reihenfolge heben sich die beiden Rechenarten auf: $$e^{\\ln 7} = 7$$ Denn \\(\\ln 7\\) ist definitionsgemäß der Exponent, der \\(e\\) zu \\(7\\) macht." },
      { id:17, level:3, typ:"numerisch", frage:"Löse \\(e^x=10\\). \\(x\\) (gerundet)?", loesung:2.30, toleranz:0.05, tipp:"\\(x=\\ln 10\\).", loesungsweg:"Logarithmieren auf beiden Seiten: $$e^x = 10 \\;\\Rightarrow\\; x = \\ln 10 \\approx 2{,}30$$" },
      { id:18, level:3, typ:"numerisch", frage:"Löse \\(e^{2x}=e^6\\). \\(x=?\\)", loesung:3, toleranz:0, tipp:"Exponentenvergleich.", loesungsweg:"\\(2x=6\\Rightarrow x=3\\)." },
      // LEVEL 4 -- Exponentialgleichungen
      { id:19, level:4, typ:"numerisch", frage:"\\(e^x=5\\), \\(x\\) (gerundet)?", loesung:1.61, toleranz:0.05, tipp:"\\(\\ln 5\\).", loesungsweg:"$$e^x = 5 \\;\\Rightarrow\\; x = \\ln 5 \\approx 1{,}61$$" },
      { id:20, level:4, typ:"numerisch", frage:"\\(3e^x=15\\), \\(x\\) (gerundet)?", loesung:1.61, toleranz:0.05, tipp:"Erst durch 3, dann ln.", loesungsweg:"\\(e^x=5 \\Rightarrow x=\\ln 5\\)." },
      { id:21, level:4, typ:"numerisch", frage:"\\(e^x \\cdot e^2 = e^7\\), \\(x=?\\)", loesung:5, toleranz:0, tipp:"Exponenten.", loesungsweg:"Linke Seite zusammenfassen: \\(e^x \\cdot e^2 = e^{x+2}\\). Bei gleicher Basis müssen die Exponenten übereinstimmen: $$x + 2 = 7 \\;\\Rightarrow\\; x = 5$$" },
      { id:22, level:4, typ:"numerisch", frage:"\\(e^{x+1}=e^{2x-3}\\), \\(x=?\\)", loesung:4, toleranz:0, tipp:"Exponentengleichheit.", loesungsweg:"\\(x+1=2x-3 \\Rightarrow x=4\\)." },
      { id:23, level:4, typ:"numerisch", frage:"Wachstum \\(N(t)=100\\cdot e^{0{,}1t}\\). \\(N(0)=?\\)", loesung:100, toleranz:0, tipp:"\\(e^0=1\\).", loesungsweg:"$$N(0) = 100 \\cdot e^{0} = 100 \\cdot 1 = 100$$ Der Vorfaktor ist stets der Anfangsbestand." },
      { id:24, level:4, typ:"numerisch", frage:"\\(N(t)=100 e^{0{,}1t}\\), \\(N(10)\\) (gerundet)?", loesung:272, toleranz:5, tipp:"\\(100\\cdot e\\).", loesungsweg:"$$N(10) = 100 \\cdot e^{0{,}1 \\cdot 10} = 100 \\cdot e^1 \\approx 271{,}8 \\approx 272$$ Nach zehn Zeiteinheiten hat sich der Bestand also fast verdreifacht." },
      // LEVEL 5 -- Zerfall
      { id:25, level:5, typ:"numerisch", frage:"Zerfall: \\(N(t)=1000 e^{-0{,}2t}\\). \\(N(5)\\) (gerundet)?", loesung:368, toleranz:5, tipp:"\\(1000/e\\).", loesungsweg:"$$N(5) = 1000 \\cdot e^{-0{,}2 \\cdot 5} = 1000 \\cdot e^{-1} \\approx 367{,}9 \\approx 368$$ Das negative Vorzeichen im Exponenten kennzeichnet den Zerfall." },
      { id:26, level:5, typ:"numerisch", frage:"Halbwertszeit bei \\(N(t)=N_0 e^{-0{,}2t}\\): \\(T\\) (gerundet)?", loesung:3.47, toleranz:0.1, tipp:"\\(T=\\ln 2/0{,}2\\).", loesungsweg:"Gesucht ist die Zeit, nach der nur noch die Hälfte übrig ist: $$N_0 e^{-0{,}2T} = \\tfrac12 N_0 \\;\\Rightarrow\\; e^{-0{,}2T} = \\tfrac12$$ Logarithmieren: \\(-0{,}2T = \\ln\\tfrac12 = -\\ln 2\\), also $$T = \\frac{\\ln 2}{0{,}2} \\approx 3{,}47$$ Der Anfangsbestand \\(N_0\\) kürzt sich heraus — die Halbwertszeit hängt nur von der Zerfallskonstante ab." },
      { id:27, level:5, typ:"numerisch", frage:"Verdoppelungszeit \\(N(t)=N_0 e^{0{,}05t}\\), \\(T\\) (gerundet)?", loesung:13.86, toleranz:0.2, tipp:"\\(T=\\ln 2/0{,}05\\).", loesungsweg:"$$N_0 e^{0{,}05T} = 2N_0 \\;\\Rightarrow\\; e^{0{,}05T} = 2$$ $$T = \\frac{\\ln 2}{0{,}05} \\approx 13{,}86$$" },
      { id:28, level:5, typ:"mc", frage:"\\(f(x)=e^{-x^2}\\) nimmt Maximum an bei:", optionen:["\\(x=-1\\)","\\(x=0\\)","\\(x=1\\)","gar nicht"], korrekt:1, tipp:"Exponent minimal bei \\(x=0\\).", loesungsweg:"Weil \\(e^u\\) streng monoton wächst, ist \\(e^{-x^2}\\) genau dort am größten, wo der Exponent \\(-x^2\\) am größten ist. Das Quadrat \\(x^2\\) ist nie negativ und wird bei \\(x = 0\\) am kleinsten — dort erreicht die Funktion also ihr Maximum \\(e^0 = 1\\). Das ist der Gipfel der Glockenkurve." },
      { id:29, level:5, typ:"numerisch", frage:"\\(f(x)=e^x+e^{-x}\\), \\(f(0)=?\\)", loesung:2, toleranz:0, tipp:"\\(1+1\\).", loesungsweg:"$$f(0) = e^0 + e^{-0} = 1 + 1 = 2$$ Weil \\(f(-x) = f(x)\\) gilt, ist der Graph achsensymmetrisch zur \\(y\\)-Achse — und \\(2\\) ist sein kleinster Wert." },
      { id:30, level:5, typ:"numerisch", frage:"Gleichung \\(e^{2x}-3e^x+2=0\\) (Subst. \\(u=e^x\\)): größere Lösung \\(x\\) (gerundet)?", loesung:0.69, toleranz:0.05, tipp:"\\(u=1,2\\), \\(\\ln 2\\).", loesungsweg:"Mit \\(u = e^x\\) wird die Gleichung quadratisch: $$u^2 - 3u + 2 = 0 \\;\\Rightarrow\\; u_1 = 1,\\; u_2 = 2$$ Rücksubstitution: \\(e^x = 1\\) liefert \\(x = 0\\), \\(e^x = 2\\) liefert \\(x = \\ln 2 \\approx 0{,}69\\). Die größere Lösung ist also \\(\\ln 2\\). Beide \\(u\\)-Werte sind positiv und damit brauchbar — ein negatives \\(u\\) müsste man verwerfen." },
      // LEVEL 6 -- Modellierung
      { id:31, level:6, typ:"numerisch", frage:"Bakterien: \\(N(t)=50 e^{0{,}3t}\\). Wann \\(N=500\\) (h, gerundet)?", loesung:7.68, toleranz:0.2, tipp:"\\(t=\\ln 10/0{,}3\\).", loesungsweg:"$$50 e^{0{,}3t} = 500 \\;\\Rightarrow\\; e^{0{,}3t} = 10$$ $$t = \\frac{\\ln 10}{0{,}3} \\approx 7{,}68 \\text{ Stunden}$$" },
      { id:32, level:6, typ:"numerisch", frage:"Zinseszins stetig: Kapital 1000€, Zinsrate 5% stetig, nach 10 Jahren (gerundet)?", loesung:1649, toleranz:5, tipp:"\\(1000 e^{0{,}5}\\).", loesungsweg:"Bei stetiger Verzinsung gilt \\(K(t) = K_0 e^{rt}\\): $$K(10) = 1000 \\cdot e^{0{,}05 \\cdot 10} = 1000 \\cdot e^{0{,}5} \\approx 1648{,}7$$ Also rund \\(1649\\,€\\) — etwas mehr als bei jährlicher Verzinsung, weil die Zinsen ununterbrochen mitverzinst werden." },
      { id:33, level:6, typ:"numerisch", frage:"\\(f(x)=e^x - 1\\). Nullstelle?", loesung:0, toleranz:0, tipp:"\\(e^x=1\\).", loesungsweg:"$$e^x - 1 = 0 \\;\\Rightarrow\\; e^x = 1 \\;\\Rightarrow\\; x = 0$$ Die \\(e\\)-Funktion nimmt den Wert \\(1\\) genau an der Stelle \\(0\\) an." },
      { id:34, level:6, typ:"mc", frage:"Wie verhält sich \\(e^x\\) für \\(x\\to -\\infty\\)?", optionen:["\\(\\to \\infty\\)","\\(\\to 0\\)","\\(\\to -\\infty\\)","\\(\\to 1\\)"], korrekt:1, tipp:"Gegen Null von oben.", loesungsweg:"Für stark negative \\(x\\) ist \\(e^x = \\frac{1}{e^{|x|}}\\) ein Bruch mit sehr großem Nenner. Der Wert wird beliebig klein, bleibt aber immer positiv: $$e^x \\to 0^+ \\quad \\text{für } x \\to -\\infty$$ Die \\(x\\)-Achse ist damit waagerechte Asymptote, wird aber nie erreicht." },
      { id:35, level:6, typ:"numerisch", frage:"Temperatur: \\(T(t)=20+80 e^{-0{,}1t}\\). \\(T(0)?\\)", loesung:100, toleranz:0, tipp:"\\(e^0=1\\).", loesungsweg:"$$T(0) = 20 + 80 \\cdot e^{0} = 20 + 80 = 100$$ Die \\(20\\) ist die Umgebungstemperatur, die \\(80\\) der anfängliche Abstand dazu." },
      { id:36, level:6, typ:"numerisch", frage:"Abkühlung: \\(T(t)=20+80e^{-0{,}1t}\\). Wann ist \\(T=40\\) (min, gerundet)?", loesung:13.86, toleranz:0.3, tipp:"\\(80e^{-0{,}1t}=20\\).", loesungsweg:"$$20 + 80e^{-0{,}1t} = 40 \\;\\Rightarrow\\; 80e^{-0{,}1t} = 20 \\;\\Rightarrow\\; e^{-0{,}1t} = \\tfrac14$$ Logarithmieren: \\(-0{,}1t = -\\ln 4\\), also $$t = \\frac{\\ln 4}{0{,}1} \\approx 13{,}86 \\text{ Minuten}$$ Der Körper nähert sich den \\(20°\\) nur asymptotisch — genau \\(20°\\) wird nie erreicht." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
