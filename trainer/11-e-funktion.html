<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-e-funktion';
    const THEMA_CONFIG = { name: 'e-Funktion', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 -- Grundlagen
      { id:1, level:1, typ:"mc", frage:"Die Eulersche Zahl \\(e\\) ist ungefähr:", optionen:["\\(2{,}71\\)","\\(3{,}14\\)","\\(1{,}41\\)","\\(1{,}73\\)"], korrekt:0, tipp:"Basis des natürlichen Log.", loesungsweg:"Die Eulersche Zahl ist \\(e \\approx 2{,}71828\\). Sie ist genau die Basis, für die \\(e^x\\) ihre eigene Ableitung ist — daraus folgt ihre Sonderstellung in der Analysis. Nicht zu verwechseln mit \\(\\pi \\approx 3{,}14\\) oder \\(\\sqrt2 \\approx 1{,}41\\)." },
      { id:2, level:1, typ:"numerisch", frage:"\\(e^0=?\\)", loesung:1, toleranz:0, tipp:"Jede Zahl hoch 0.", loesungsweg:"Jede Zahl außer \\(0\\) ergibt hoch null den Wert \\(1\\): $$e^0 = 1$$ Deshalb schneidet der Graph von \\(e^x\\) die \\(y\\)-Achse bei \\(1\\)." },
      { id:3, level:1, typ:"mc", frage:"Definitionsbereich von \\(f(x)=e^x\\):", optionen:["\\(x>0\\)","\\(x\\neq 0\\)","\\(\\mathbb{R}\\)","\\(x\\geq 0\\)"], korrekt:2, tipp:"Alle reellen Zahlen.", loesungsweg:"In den Exponenten darf jede reelle Zahl eingesetzt werden — negative wie positive, ganze wie gebrochene. Es gibt keine verbotene Stelle: $$D = \\mathbb{R}$$ Anders beim Logarithmus, der nur für positive Argumente erklärt ist." },
      { id:4, level:1, typ:"mc", frage:"Wertebereich von \\(e^x\\):", optionen:["\\(\\mathbb{R}\\)","\\(y>0\\)","\\(y\\geq 0\\)","\\(y<0\\)"], korrekt:1, tipp:"Immer positiv.", loesungsweg:"Eine Potenz mit positiver Basis ist immer positiv: \\(e^x > 0\\) für jedes \\(x\\). Für große negative \\(x\\) kommt der Wert der Null beliebig nahe, erreicht sie aber nie: $$W = \\,]0;\\infty[$$ Genau deshalb ist die \\(x\\)-Achse eine Asymptote." },
      { id:5, level:1, typ:"numerisch", frage:"Wie groß ist \\(e^1\\), gerundet auf zwei Nachkommastellen?", loesung:2.72, toleranz:0.01, tipp:"Der Wert der Eulerschen Zahl selbst.", loesungsweg:"Es gilt \\(e^1 = e\\), denn jede Zahl hoch \\(1\\) ist sie selbst. Der Wert der Eulerschen Zahl ist $$e = 2{,}718281828\\ldots \\approx 2{,}72$$ Sie liegt damit zwischen \\(2\\) und \\(3\\) — eine schnelle Kontrolle für jedes Ergebnis mit \\(e\\)-Potenzen." },
      { id:6, level:1, typ:"mc", frage:"Wie verläuft der Graph von \\(f(x)=e^x\\) insgesamt?", optionen:["fällt auf ganz \\(\\mathbb{R}\\) monoton","ist auf ganz \\(\\mathbb{R}\\) streng monoton steigend","steigt erst, dann fällt er wieder","ist bei \\(x=0\\) waagerecht"], korrekt:1, tipp:"Vergleiche zwei Funktionswerte an benachbarten Stellen.", loesungsweg:"Für jeden Zuwachs von \\(x\\) um \\(1\\) wird der Funktionswert mit \\(e \\approx 2{,}72\\) multipliziert, also stets größer: $$f(x+1) = e^{x+1} = e \\cdot e^x > e^x = f(x)$$ Damit ist \\(f\\) auf ganz \\(\\mathbb{R}\\) streng monoton steigend. Waagerecht wird der Graph nie, denn die Steigung ist überall \\(e^x > 0\\); für \\(x \\to -\\infty\\) nähert er sich der \\(x\\)-Achse nur an." },
      // LEVEL 2 -- Rechengesetze
      { id:7, level:2, typ:"mc", frage:"\\(e^a \\cdot e^b=\\)?", optionen:["\\(e^{a+b}\\)","\\(e^{ab}\\)","\\(e^{a-b}\\)","\\(2e^{a+b}\\)"], korrekt:0, tipp:"Potenzgesetze.", loesungsweg:"Beim Multiplizieren von Potenzen mit gleicher Basis werden die Exponenten addiert: $$e^a \\cdot e^b = e^{a+b}$$ Anschaulich: \\(e^2 \\cdot e^3 = (e\\cdot e)(e\\cdot e\\cdot e) = e^5\\)." },
      { id:8, level:2, typ:"mc", frage:"\\(\\frac{e^a}{e^b}=\\)?", optionen:["\\(e^{ab}\\)","\\(e^{a+b}\\)","\\(e^{a-b}\\)","\\(e^{a/b}\\)"], korrekt:2, tipp:"Division = Subtraktion im Exponenten.", loesungsweg:"Beim Dividieren werden die Exponenten subtrahiert: $$\\frac{e^a}{e^b} = e^{a-b}$$ Das ist die Umkehrung der Multiplikationsregel." },
      { id:9, level:2, typ:"mc", frage:"\\((e^a)^b=\\)?", optionen:["\\(e^{a+b}\\)","\\(e^{ab}\\)","\\(e^{a^b}\\)","\\(e^{a/b}\\)"], korrekt:1, tipp:"Potenz einer Potenz.", loesungsweg:"Beim Potenzieren einer Potenz werden die Exponenten multipliziert: $$(e^a)^b = e^{ab}$$ Denn \\(e^a\\) wird \\(b\\)-mal mit sich selbst multipliziert, also \\(a\\) insgesamt \\(b\\)-mal addiert." },
      { id:10, level:2, typ:"numerisch", frage:"\\(e^2\\cdot e^{-2}=?\\)", loesung:1, toleranz:0, tipp:"Summe der Exponenten.", loesungsweg:"Exponenten addieren: $$e^2 \\cdot e^{-2} = e^{2-2} = e^0 = 1$$ Allgemein ist \\(e^{-x}\\) stets der Kehrwert von \\(e^x\\)." },
      { id:11, level:2, typ:"numerisch", frage:"Schreibe \\(\\frac{e^5}{e^3}\\) als eine einzige Potenz \\(e^k\\). Welchen Wert hat \\(k\\)?", loesung:2, toleranz:0, tipp:"Beim Dividieren von Potenzen mit gleicher Basis werden die Exponenten verrechnet.", loesungsweg:"Das Potenzgesetz für die Division lautet \\(\\frac{e^a}{e^b} = e^{a-b}\\). Also $$\\frac{e^5}{e^3} = e^{5-3} = e^2$$ Damit ist \\(k = 2\\). Zur Kontrolle: \\(e^2 \\approx 7{,}39\\), und \\(\\frac{148{,}4}{20{,}1} \\approx 7{,}39\\) — passt." },
      { id:12, level:2, typ:"numerisch", frage:"Wie groß ist \\(e^{-1}\\), gerundet auf zwei Nachkommastellen?", loesung:0.37, toleranz:0.01, tipp:"Ein negativer Exponent bedeutet den Kehrwert.", loesungsweg:"Ein negativer Exponent steht für den Kehrwert der Potenz: $$e^{-1} = \\frac{1}{e^1} = \\frac{1}{2{,}71828\\ldots} \\approx 0{,}37$$ Der Wert liegt zwischen \\(0\\) und \\(1\\) — wie bei jeder \\(e\\)-Potenz mit negativem Exponenten. Negativ wird \\(e^x\\) nie." },
      // LEVEL 3 -- ln und e
      { id:13, level:3, typ:"mc", frage:"\\(\\ln(e)=?\\)", optionen:["\\(0\\)","\\(1\\)","\\(e\\)","\\(2{,}72\\)"], korrekt:1, tipp:"ln ist Umkehrung.", loesungsweg:"Der natürliche Logarithmus fragt: „Mit welchem Exponenten wird \\(e\\) zu diesem Wert?\" Wegen \\(e^1 = e\\) gilt $$\\ln e = 1$$" },
      { id:14, level:3, typ:"numerisch", frage:"\\(\\ln(1)=?\\)", loesung:0, toleranz:0, tipp:"\\(e^0=1\\).", loesungsweg:"Wegen \\(e^0 = 1\\) ist der gesuchte Exponent null: $$\\ln 1 = 0$$ Das gilt für jeden Logarithmus, unabhängig von der Basis." },
      { id:15, level:3, typ:"numerisch", frage:"\\(\\ln(e^5)=?\\)", loesung:5, toleranz:0, tipp:"Umkehrfunktion.", loesungsweg:"Logarithmieren und Potenzieren heben einander auf: $$\\ln(e^5) = 5$$ Der Logarithmus liefert genau den Exponenten zurück." },
      { id:16, level:3, typ:"numerisch", frage:"\\(e^{\\ln 7}=?\\)", loesung:7, toleranz:0, tipp:"Inverse.", loesungsweg:"Auch in dieser Reihenfolge heben sich die beiden Rechenarten auf: $$e^{\\ln 7} = 7$$ Denn \\(\\ln 7\\) ist definitionsgemäß der Exponent, der \\(e\\) zu \\(7\\) macht." },
      { id:17, level:3, typ:"numerisch", frage:"Löse die Gleichung \\(e^x=10\\). Wie groß ist \\(x\\), gerundet auf zwei Nachkommastellen?", loesung:2.30, toleranz:0.02, tipp:"Wende auf beide Seiten die Umkehrfunktion der \\(e\\)-Funktion an.", loesungsweg:"Die Umkehrfunktion von \\(e^x\\) ist der natürliche Logarithmus. Anwenden auf beide Seiten: $$e^x = 10 \\;\\Rightarrow\\; \\ln(e^x) = \\ln 10 \\;\\Rightarrow\\; x = \\ln 10$$ Mit dem Rechner: \\(x \\approx 2{,}30\\). Kontrolle: \\(e^{2{,}30} \\approx 9{,}97\\) — das gerundete \\(x\\) liefert wieder ungefähr \\(10\\)." },
      { id:18, level:3, typ:"numerisch", frage:"Löse die Gleichung \\(e^{2x}=e^6\\). Welchen Wert hat \\(x\\)?", loesung:3, toleranz:0, tipp:"Bei gleicher Basis genügt der Vergleich der Exponenten.", loesungsweg:"Die \\(e\\)-Funktion ist streng monoton, also nimmt sie jeden Wert nur einmal an. Gleiche Potenzwerte bei gleicher Basis erzwingen daher gleiche Exponenten: $$e^{2x} = e^6 \\;\\Rightarrow\\; 2x = 6 \\;\\Rightarrow\\; x = 3$$ Man kann auch beidseitig logarithmieren — das führt auf dieselbe Gleichung \\(2x = 6\\)." },
      // LEVEL 4 -- Exponentialgleichungen
      { id:19, level:4, typ:"numerisch", frage:"Zu welchem \\(x\\) gehört der Funktionswert \\(5\\) bei \\(f(x)=e^x\\)? Runde auf zwei Nachkommastellen.", loesung:1.61, toleranz:0.02, tipp:"Stelle die Gleichung auf und löse sie mit der Umkehrfunktion.", loesungsweg:"Gesucht ist \\(x\\) mit \\(e^x = 5\\). Logarithmieren beider Seiten: $$x = \\ln 5 \\approx 1{,}6094 \\approx 1{,}61$$ Die Größenordnung passt: \\(e^1 \\approx 2{,}72\\) ist noch zu klein, \\(e^2 \\approx 7{,}39\\) schon zu groß, also liegt \\(x\\) zwischen \\(1\\) und \\(2\\)." },
      { id:20, level:4, typ:"numerisch", frage:"Löse \\(3e^x=15\\). Wie groß ist \\(x\\), gerundet auf zwei Nachkommastellen?", loesung:1.61, toleranz:0.02, tipp:"Erst den Vorfaktor beseitigen, dann logarithmieren — nicht umgekehrt.", loesungsweg:"Zuerst wird durch den Vorfaktor geteilt, damit die \\(e\\)-Potenz allein steht: $$3e^x = 15 \\;\\Rightarrow\\; e^x = 5$$ Erst jetzt darf logarithmiert werden: \\(x = \\ln 5 \\approx 1{,}61\\). Wer sofort logarithmiert, erhält \\(\\ln 3 + x = \\ln 15\\) — auch richtig, denn \\(\\ln 15 - \\ln 3 = \\ln 5\\), aber umständlicher. Falsch wäre \\(x = \\ln 15 \\approx 2{,}71\\)." },
      { id:21, level:4, typ:"numerisch", frage:"\\(e^x \\cdot e^2 = e^7\\), \\(x=?\\)", loesung:5, toleranz:0, tipp:"Exponenten.", loesungsweg:"Linke Seite zusammenfassen: \\(e^x \\cdot e^2 = e^{x+2}\\). Bei gleicher Basis müssen die Exponenten übereinstimmen: $$x + 2 = 7 \\;\\Rightarrow\\; x = 5$$" },
      { id:22, level:4, typ:"numerisch", frage:"Löse die Gleichung \\(e^{x+1}=e^{2x-3}\\). Welchen Wert hat \\(x\\)?", loesung:4, toleranz:0, tipp:"Gleiche Basis — vergleiche die Exponenten und löse die lineare Gleichung.", loesungsweg:"Weil \\(e^x\\) streng monoton ist, folgt aus gleichen Potenzwerten die Gleichheit der Exponenten: $$x + 1 = 2x - 3 \\;\\Rightarrow\\; 1 + 3 = 2x - x \\;\\Rightarrow\\; x = 4$$ Kontrolle: links \\(e^{4+1} = e^5\\), rechts \\(e^{2\\cdot4-3} = e^5\\) — beide Seiten stimmen überein." },
      { id:23, level:4, typ:"numerisch", frage:"Eine Bakterienzahl wächst nach \\(N(t)=100\\cdot e^{0{,}1t}\\) (\\(t\\) in Stunden). Wie groß ist der Anfangsbestand?", loesung:100, toleranz:0, tipp:"Der Anfangsbestand gehört zum Zeitpunkt, an dem die Messung beginnt.", loesungsweg:"Der Anfangsbestand ist der Wert zum Startzeitpunkt \\(t = 0\\): $$N(0) = 100 \\cdot e^{0{,}1 \\cdot 0} = 100 \\cdot e^0 = 100 \\cdot 1 = 100$$ Allgemein ist bei \\(N(t) = N_0 \\cdot e^{kt}\\) der Faktor vor der \\(e\\)-Potenz immer der Anfangsbestand, weil \\(e^0 = 1\\) gilt." },
      { id:24, level:4, typ:"numerisch", frage:"\\(N(t)=100 e^{0{,}1t}\\), \\(N(10)\\) (gerundet)?", loesung:272, toleranz:5, tipp:"\\(100\\cdot e\\).", loesungsweg:"$$N(10) = 100 \\cdot e^{0{,}1 \\cdot 10} = 100 \\cdot e^1 \\approx 271{,}8 \\approx 272$$ Nach zehn Zeiteinheiten hat sich der Bestand also fast verdreifacht." },
      // LEVEL 5 -- Zerfall
      { id:25, level:5, typ:"numerisch", frage:"Eine Hefekultur wächst nach \\(N(t)=N_0\\cdot e^{kt}\\) (\\(t\\) in Tagen). Am Anfang werden \\(400\\) Zellen gezählt, nach \\(5\\) Tagen \\(1000\\). Bestimme \\(k\\) auf drei Nachkommastellen.", loesung:0.183, toleranz:0.004, tipp:"Setze beide Messwerte ein; der Anfangsbestand kürzt sich beim Dividieren heraus.", loesungsweg:"Aus der ersten Messung folgt \\(N_0 = 400\\). Die zweite Messung liefert $$400 \\cdot e^{5k} = 1000 \\;\\Rightarrow\\; e^{5k} = \\frac{1000}{400} = 2{,}5$$ Logarithmieren und durch \\(5\\) teilen: $$k = \\frac{\\ln 2{,}5}{5} \\approx \\frac{0{,}9163}{5} \\approx 0{,}183$$ Kontrolle: \\(400 \\cdot e^{0{,}183 \\cdot 5} \\approx 400 \\cdot 2{,}499 \\approx 1000\\). Wer den Anfangsbestand vergisst und \\(e^{5k} = 1000\\) rechnet, erhält fälschlich \\(k \\approx 1{,}38\\)." },
      { id:26, level:5, typ:"mc", frage:"Eine Schülerin löst \\(e^{2x}=e^x+6\\) so: „Logarithmieren ergibt \\(2x=x+6\\), also \\(x=6\\).“ Wo steckt der Fehler und wie lautet die richtige Lösung?", optionen:["Aus einer Summe darf nicht gliedweise logarithmiert werden; richtig ist \\(x=\\ln 3\\approx 1{,}10\\).","Der Ansatz ist richtig, nur der Schluss: richtig ist \\(x=-6\\) statt \\(x=6\\).","Es fehlt nur eine zweite Lösung; \\(x=6\\) und \\(x=\\ln 2\\) sind beide richtig.","Der Exponent wurde halbiert statt verdoppelt; richtig ist \\(x=12\\) als einzige Lösung."], korrekt:0, tipp:"Prüfe, ob der Logarithmus einer Summe gliedweise zerlegt werden darf, und suche eine Substitution.", loesungsweg:"Der Logarithmus einer Summe lässt sich <b>nicht</b> zerlegen: \\(\\ln(e^x+6) \\neq \\ln(e^x)+\\ln 6\\). Richtig ist die Substitution \\(u=e^x\\): $$u^2 - u - 6 = 0 \\;\\Rightarrow\\; u_{1,2} = \\frac{1 \\pm \\sqrt{1+24}}{2} = \\frac{1 \\pm 5}{2}$$ also \\(u=3\\) oder \\(u=-2\\). Wegen \\(e^x>0\\) fällt \\(u=-2\\) weg. Rücksubstitution: \\(e^x=3\\), also \\(x=\\ln 3\\approx 1{,}0986\\). Die Probe zeigt, dass \\(x=6\\) falsch ist: \\(e^{12}\\approx 162754\\), aber \\(e^6+6\\approx 409\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Für \\(f(x)=a\\cdot e^{kx}\\) ist \\(f(1)=5\\) und \\(f(5)=80\\). Bestimme \\(k\\) auf drei Nachkommastellen.", loesung:0.693, toleranz:0.004, tipp:"Dividiere die beiden Gleichungen durcheinander — der unbekannte Vorfaktor fällt dabei heraus.", loesungsweg:"Die beiden Bedingungen lauten \\(a e^{k}=5\\) und \\(a e^{5k}=80\\). Division der zweiten durch die erste Gleichung beseitigt \\(a\\): $$\\frac{a e^{5k}}{a e^{k}} = \\frac{80}{5} \\;\\Rightarrow\\; e^{4k} = 16$$ Logarithmieren: $$4k = \\ln 16 = 4\\ln 2 \\;\\Rightarrow\\; k = \\ln 2 \\approx 0{,}693$$ Damit ist \\(a = 5e^{-k} = 2{,}5\\). Kontrolle: \\(2{,}5 \\cdot e^{0{,}693\\cdot 5} = 2{,}5 \\cdot 32 = 80\\). Wegen \\(e^{\\ln 2}=2\\) verdoppelt sich der Bestand hier pro Zeiteinheit." },
      { id:28, level:5, typ:"numerisch", frage:"Ein radioaktives Präparat hat die Halbwertszeit \\(12\\) Tage. Wie viel Prozent der Anfangsmenge sind nach \\(30\\) Tagen noch vorhanden? Runde auf eine Nachkommastelle.", loesung:17.7, toleranz:0.3, tipp:"Zähle, wie viele Halbwertszeiten in der Zeitspanne stecken — das darf auch ein Bruchteil sein.", loesungsweg:"In \\(30\\) Tagen stecken \\(\\frac{30}{12}=2{,}5\\) Halbwertszeiten. Der Restanteil ist daher $$\\left(\\frac{1}{2}\\right)^{2{,}5} = 2^{-2{,}5} \\approx 0{,}1768$$ also etwa \\(17{,}7\\,\\%\\). Über das \\(e\\)-Modell: \\(k=\\frac{\\ln 2}{12}\\approx 0{,}0578\\) und \\(e^{-0{,}0578\\cdot 30}\\approx 0{,}1768\\) — dasselbe Ergebnis. Wer linear weiterdenkt und nach zwei Halbwertszeiten \\(25\\,\\%\\) einfach halbiert fortschreibt, landet bei rund \\(12{,}5\\,\\%\\) und rechnet damit zu klein." },
      { id:29, level:5, typ:"numerisch", frage:"Zwei Populationen wachsen nach \\(A(t)=200\\cdot e^{0{,}08t}\\) und \\(B(t)=500\\cdot e^{0{,}02t}\\) (\\(t\\) in Jahren). Nach wie vielen Jahren sind sie gleich groß? Runde auf eine Nachkommastelle.", loesung:15.3, toleranz:0.2, tipp:"Setze die Terme gleich und fasse die \\(e\\)-Potenzen zu einer einzigen zusammen.", loesungsweg:"Gleichsetzen und ordnen: $$200 e^{0{,}08t} = 500 e^{0{,}02t} \\;\\Rightarrow\\; \\frac{e^{0{,}08t}}{e^{0{,}02t}} = \\frac{500}{200}$$ Mit dem Potenzgesetz \\(\\frac{e^a}{e^b}=e^{a-b}\\) wird daraus \\(e^{0{,}06t}=2{,}5\\). Logarithmieren: $$t = \\frac{\\ln 2{,}5}{0{,}06} \\approx \\frac{0{,}9163}{0{,}06} \\approx 15{,}3 \\text{ Jahre}$$ Kontrolle: \\(A(15{,}3)\\approx 681\\) und \\(B(15{,}3)\\approx 680\\). Die zunächst kleinere Population \\(A\\) überholt \\(B\\), weil ihre Wachstumsrate größer ist." },
      { id:30, level:5, typ:"numerisch", frage:"Kaffee mit \\(90\\)°C kühlt in einem \\(18\\)°C warmen Raum nach \\(T(t)=18+72\\cdot e^{-kt}\\) ab. Nach \\(10\\) Minuten sind es \\(60\\)°C. Nach wie vielen Minuten sind \\(40\\)°C erreicht? Runde auf eine Nachkommastelle.", loesung:22.0, toleranz:0.4, tipp:"Erst die Abkühlkonstante aus der Zehn-Minuten-Messung gewinnen, dann die Zielgleichung lösen.", loesungsweg:"<b>Schritt 1 — Konstante.</b> Aus \\(18+72e^{-10k}=60\\) folgt \\(e^{-10k}=\\frac{42}{72}\\), also $$k = \\frac{1}{10}\\ln\\frac{72}{42} \\approx 0{,}0539$$ <b>Schritt 2 — Zielzeit.</b> Aus \\(18+72e^{-kt}=40\\) folgt \\(e^{-kt}=\\frac{22}{72}\\), also $$t = \\frac{1}{k}\\ln\\frac{72}{22} \\approx \\frac{1{,}1856}{0{,}0539} \\approx 22{,}0 \\text{ Minuten}$$ Kontrolle: \\(18+72\\,e^{-0{,}0539\\cdot 22}\\approx 40{,}0\\). Wichtig ist, dass in beiden Schritten die Raumtemperatur \\(18\\)°C zuerst abgezogen wird; wer mit \\(60\\) statt \\(42\\) rechnet, erhält ein deutlich zu kleines \\(k\\)." },
      // LEVEL 6 -- Modellierung
      { id:31, level:6, typ:"mc", frage:"Die Konzentration eines Medikaments im Blut wird durch \\(K(t)=12\\cdot e^{-0{,}25t}\\) (in mg/l, \\(t\\) in Stunden) beschrieben. Beurteile die Behauptung: „Sechs Stunden nach der Einnahme ist weniger als ein Viertel der Anfangskonzentration vorhanden.“", optionen:["Die Behauptung stimmt: der Restanteil ist \\(e^{-1{,}5}\\approx 22{,}3\\,\\%\\) und damit unter \\(25\\,\\%\\).","Die Behauptung stimmt nicht: der Restanteil ist \\(e^{-1{,}5}\\approx 27{,}8\\,\\%\\) und damit über \\(25\\,\\%\\).","Die Behauptung stimmt nicht: nach sechs Stunden sind noch genau \\(25\\,\\%\\) der Anfangsmenge im Blut.","Die Behauptung ist nicht prüfbar, weil dazu die Anfangskonzentration eigens gemessen werden müsste."], korrekt:0, tipp:"Bilde das Verhältnis aus Wert nach sechs Stunden und Anfangswert — der Vorfaktor kürzt sich dabei.", loesungsweg:"Der Anfangswert ist \\(K(0)=12\\) mg/l. Das Verhältnis nach sechs Stunden ist $$\\frac{K(6)}{K(0)} = \\frac{12e^{-0{,}25\\cdot 6}}{12} = e^{-1{,}5} \\approx 0{,}2231$$ also etwa \\(22{,}3\\,\\%\\) und damit weniger als \\(25\\,\\%\\) — die Behauptung stimmt. Konkret: \\(K(6)\\approx 2{,}68\\) mg/l gegenüber \\(3{,}0\\) mg/l, die ein Viertel wären. Der Vorfaktor \\(12\\) ist für die Prüfung unnötig, weil er sich im Verhältnis herauskürzt." },
      { id:32, level:6, typ:"numerisch", frage:"In einem Kühlhaus nimmt die Keimzahl nach \\(N(t)=N_0\\cdot e^{-kt}\\) ab. Nach \\(3\\) Stunden sind noch \\(60\\,\\%\\) der Ausgangszahl vorhanden. Wie viel Prozent sind es nach \\(9\\) Stunden? Runde auf eine Nachkommastelle.", loesung:21.6, toleranz:0.3, tipp:"Neun Stunden sind ein ganzzahliges Vielfaches der Zeitspanne, für die der Anteil bekannt ist.", loesungsweg:"Aus der Messung folgt \\(e^{-3k}=0{,}6\\). Wegen \\(9=3\\cdot 3\\) gilt mit dem Potenzgesetz \\((e^a)^b=e^{ab}\\): $$\\frac{N(9)}{N_0} = e^{-9k} = \\left(e^{-3k}\\right)^3 = 0{,}6^3 = 0{,}216$$ also \\(21{,}6\\,\\%\\). Man kommt auch über \\(k=-\\frac{\\ln 0{,}6}{3}\\approx 0{,}1703\\) und \\(e^{-0{,}1703\\cdot 9}\\approx 0{,}216\\) zum Ziel. Der naheliegende Fehlweg ist eine lineare Fortschreibung: \\(40\\,\\%\\) Verlust in drei Stunden wären in neun Stunden \\(120\\,\\%\\) — das ergäbe unmöglicherweise einen negativen Bestand." },
      { id:33, level:6, typ:"numerisch", frage:"Gegeben ist die Funktionenschar \\(f_a(x)=e^x-a\\cdot x\\) mit \\(a>0\\). Für genau einen Wert von \\(a\\) berührt der Graph die \\(x\\)-Achse. Bestimme diesen Wert auf zwei Nachkommastellen.", loesung:2.72, toleranz:0.03, tipp:"Berühren heißt: gemeinsamer Punkt <b>und</b> gleiche Steigung wie die Achse — das sind zwei Bedingungen für zwei Unbekannte.", loesungsweg:"Berührung der \\(x\\)-Achse an der Stelle \\(x_0\\) verlangt zwei Bedingungen: $$\\text{(I) } e^{x_0}-a x_0 = 0 \\qquad \\text{(II) } e^{x_0}-a = 0$$ Aus (II) folgt \\(a=e^{x_0}\\). Eingesetzt in (I): \\(e^{x_0}-e^{x_0}x_0=0\\), also \\(e^{x_0}(1-x_0)=0\\). Da \\(e^{x_0}\\neq 0\\) ist, bleibt \\(x_0=1\\) und damit $$a = e^1 = e \\approx 2{,}72$$ Kontrolle: \\(f_e(1)=e-e=0\\) und die Steigung ist dort \\(e-e=0\\) — der Graph liegt für dieses \\(a\\) ganz oberhalb der Achse und berührt sie im Punkt \\((1;0)\\). Für \\(a<e\\) gibt es keinen, für \\(a>e\\) zwei Schnittpunkte." },
      { id:34, level:6, typ:"mc", frage:"Beurteile die Behauptung: „Für hinreichend große \\(x\\) wird \\(e^{-x}\\) irgendwann negativ, weil der Exponent immer kleiner wird.“", optionen:["Die Behauptung ist falsch: \\(e^{-x}=\\frac{1}{e^x}\\) ist ein Quotient positiver Zahlen und bleibt stets positiv.","Die Behauptung ist richtig: ab \\(x>1\\) ist der Exponent negativ, also ist auch der Funktionswert negativ.","Die Behauptung ist richtig: der Graph schneidet die \\(x\\)-Achse bei \\(x=1\\) und verläuft danach darunter.","Die Behauptung ist falsch, weil \\(e^{-x}\\) für große \\(x\\) unbeschränkt wächst und deshalb nie kleiner wird."], korrekt:0, tipp:"Schreibe die Potenz mit negativem Exponenten als Bruch und überlege, welches Vorzeichen ein solcher Bruch haben kann.", loesungsweg:"Mit dem Potenzgesetz für negative Exponenten gilt $$e^{-x} = \\frac{1}{e^x}$$ Der Nenner \\(e^x\\) ist für jedes reelle \\(x\\) positiv, also ist der ganze Bruch positiv — die Werte werden zwar beliebig klein, aber niemals null oder negativ. Der Wertebereich ist \\(y>0\\), die \\(x\\)-Achse ist waagerechte Asymptote. Ein negativer Exponent macht die Potenz klein, nicht negativ: \\(e^{-10}\\approx 0{,}0000454>0\\)." },
      { id:35, level:6, typ:"numerisch", frage:"Eine Photovoltaikanlage liefert eine nach \\(P(t)=50\\cdot e^{-0{,}05t}\\) abnehmende Leistung (in kW, \\(t\\) in Jahren). Eine Ersatzanlage liefert konstant \\(20\\) kW. Nach wie vielen Jahren fällt die alte Anlage erstmals unter die Ersatzanlage? Runde auf eine Nachkommastelle.", loesung:18.3, toleranz:0.3, tipp:"Bestimme zuerst den Zeitpunkt der Gleichheit; wegen der Monotonie entscheidet er darüber, ab wann die Leistung darunter liegt.", loesungsweg:"Der Grenzzeitpunkt ist die Lösung von \\(P(t)=20\\): $$50 e^{-0{,}05t} = 20 \\;\\Rightarrow\\; e^{-0{,}05t} = 0{,}4 \\;\\Rightarrow\\; -0{,}05t = \\ln 0{,}4$$ also $$t = \\frac{-\\ln 0{,}4}{0{,}05} = \\frac{\\ln 2{,}5}{0{,}05} \\approx \\frac{0{,}9163}{0{,}05} \\approx 18{,}3 \\text{ Jahre}$$ Weil \\(P\\) streng monoton fällt, liegt die Leistung für alle \\(t>18{,}3\\) unter \\(20\\) kW und davor darüber — der berechnete Zeitpunkt ist also tatsächlich der erste. Kontrolle: \\(P(18{,}3)\\approx 20{,}0\\) und \\(P(19)\\approx 19{,}3\\)." },
      { id:36, level:6, typ:"mc", frage:"Für welche Werte von \\(c\\) hat die Gleichung \\(e^x=c\\) eine Lösung, und wie viele sind es jeweils?", optionen:["Für \\(c>0\\) genau eine Lösung, für \\(c\\le 0\\) keine — der Wertebereich ist \\(y>0\\).","Für jedes reelle \\(c\\) genau eine Lösung, denn \\(\\ln c\\) ist überall definiert.","Für \\(c>0\\) zwei Lösungen, für \\(c=0\\) genau eine, für \\(c<0\\) keine Lösung.","Für \\(c>1\\) genau eine Lösung, für \\(0<c\\le 1\\) keine — Logarithmen sind dort negativ."], korrekt:0, tipp:"Überlege getrennt für positive, für null und für negative \\(c\\), welche Werte die \\(e\\)-Funktion überhaupt annimmt.", loesungsweg:"Der Wertebereich von \\(e^x\\) ist \\(y>0\\), und die Funktion ist streng monoton steigend, nimmt also jeden Wert höchstens einmal an. Daraus ergibt sich die Fallunterscheidung: für \\(c>0\\) gibt es genau eine Lösung \\(x=\\ln c\\); für \\(c=0\\) keine, weil \\(e^x\\) der Achse nur beliebig nahe kommt; für \\(c<0\\) keine, weil \\(e^x\\) stets positiv ist. Auch \\(0<c<1\\) ist erlaubt — dann ist \\(\\ln c\\) negativ, etwa \\(e^x=0{,}5\\) mit \\(x=\\ln 0{,}5\\approx -0{,}69\\). Ein negativer Logarithmus ist eine gültige Lösung, kein Widerspruch." }];
