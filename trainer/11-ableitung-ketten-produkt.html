<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-ableitung-ketten-produkt';
    const THEMA_CONFIG = { name: 'Ketten- & Produktregel', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — innere und äußere Funktion erkennen
      { id: 1, level: 1, typ: "mc", frage: "Gegeben ist \\(f(x) = (2x+1)^3\\). Welcher Term ist die innere Funktion?", optionen: ["\\(2x+1\\)", "\\(x^3\\)", "\\(2x\\)", "\\((2x+1)^3\\)"], korrekt: 0, tipp: "Frage dich, welcher Rechenschritt zuerst auf \\(x\\) angewendet wird.", loesungsweg: "Bei einer Verkettung wird die innere Funktion zuerst ausgeführt. Hier rechnet man erst \\(2x+1\\) aus und potenziert das Ergebnis danach: $$u(x) = 2x+1, \\qquad v(u) = u^3$$ Die innere Funktion ist also \\(2x+1\\); ihre Ableitung \\(u' = 2\\) tritt später als Faktor auf." },
      { id: 2, level: 1, typ: "mc", frage: "Gegeben ist \\(f(x) = e^{3x}\\). Welcher Term ist die innere Funktion?", optionen: ["\\(3x\\)", "\\(e^x\\)", "\\(3\\)", "\\(e^{3x}\\)"], korrekt: 0, tipp: "Der Exponent wird zuerst berechnet.", loesungsweg: "Bei einer Verkettung ist die innere Funktion diejenige, die zuerst auf \\(x\\) angewendet wird — hier der Exponent: $$u(x) = 3x, \\qquad v(u) = e^u$$ Erst wird verdreifacht, dann exponentiert. Die Ableitung lautet entsprechend \\(f'(x) = 3e^{3x}\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Gegeben ist \\(f(x) = \\sin(x^2)\\). Welcher Term ist die äußere Funktion?", optionen: ["\\(\\sin(u)\\)", "\\(u^2\\)", "\\(\\sin(x)\\)", "\\(x^2\\)"], korrekt: 0, tipp: "Die äußere Funktion wird zuletzt ausgeführt.", loesungsweg: "Die äußere Funktion ist die, die zuletzt angewendet wird. Hier wird erst quadriert, dann der Sinus gebildet: $$u(x) = x^2, \\qquad v(u) = \\sin u$$ Die äußere Funktion ist also \\(\\sin u\\). Vertauscht ergäbe sich \\((\\sin x)^2\\) — eine ganz andere Funktion." },
      { id: 4, level: 1, typ: "mc", frage: "Wie lautet die Kettenregel für eine verkettete Funktion \\(f(x) = v(u(x))\\)?", optionen: ["\\(v'(u(x)) \\cdot u'(x)\\)", "\\(v'(x) \\cdot u'(x)\\)", "\\(v(u'(x))\\)", "\\(v'(u(x)) + u'(x)\\)"], korrekt: 0, tipp: "Äußere Ableitung mal innere Ableitung.", loesungsweg: "Die Kettenregel lautet $$f'(x) = v'(u(x)) \\cdot u'(x)$$ in Worten: äußere Ableitung an der Stelle der inneren Funktion, mal innere Ableitung. Der Faktor \\(u'(x)\\) — die Nachdifferenzierung — wird am häufigsten vergessen." },
      { id: 5, level: 1, typ: "mc", frage: "Wie lautet die Produktregel für \\((u \\cdot v)'\\)?", optionen: ["\\(u' \\cdot v + u \\cdot v'\\)", "\\(u' \\cdot v'\\)", "\\(u \\cdot v'\\)", "\\(u' + v'\\)"], korrekt: 0, tipp: "Das Ergebnis besteht aus zwei Summanden.", loesungsweg: "Die Produktregel besteht aus <b>zwei</b> Summanden, in denen jeweils ein Faktor abgeleitet wird: $$(uv)' = u'v + uv'$$ Einfach beide Faktoren abzuleiten (\\(u'v'\\)) ist falsch. Probe an \\(f(x) = x \\cdot x = x^2\\): die Regel liefert \\(1 \\cdot x + x \\cdot 1 = 2x\\) ✓, \\(u'v' = 1\\) dagegen nicht." },
      { id: 6, level: 1, typ: "mc", frage: "Gegeben ist \\(f(x) = \\sqrt{5x-3}\\). Welcher Term ist die innere Funktion?", optionen: ["\\(5x-3\\)", "\\(\\sqrt{x}\\)", "\\(5x\\)", "\\(x-3\\)"], korrekt: 0, tipp: "Was steht unter der Wurzel?", loesungsweg: "Zuerst wird der Term unter der Wurzel berechnet, dann die Wurzel gezogen: $$u(x) = 5x-3, \\qquad v(u) = \\sqrt u$$ Die innere Funktion ist also \\(5x-3\\); die innere Ableitung \\(u' = 5\\) tritt beim Ableiten als Faktor auf." },
      // LEVEL 2 — Kettenregel bei Potenzen einer Klammer
      { id: 7, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (3x+1)^4\\). Berechne \\(f'(1)\\).", loesung: 768, toleranz: 0, tipp: "Äußere Ableitung bilden und mit der inneren Ableitung multiplizieren.", loesungsweg: "Kettenregel mit \\(u = 3x+1\\) und \\(u' = 3\\): $$f'(x) = 4(3x+1)^3 \\cdot 3 = 12(3x+1)^3$$ Einsetzen: $$f'(1) = 12 \\cdot 4^3 = 12 \\cdot 64 = 768$$ Die Klammer wird zuerst ausgerechnet, erst danach potenziert." },
      { id: 8, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (2x-3)^5\\). Berechne \\(f'(2)\\).", loesung: 10, toleranz: 0, tipp: "Der Exponent sinkt um eins, die innere Ableitung kommt als Faktor hinzu.", loesungsweg: "Mit \\(u = 2x-3\\) und \\(u' = 2\\): $$f'(x) = 5(2x-3)^4 \\cdot 2 = 10(2x-3)^4$$ An der Stelle \\(x = 2\\) ist die Klammer \\(2 \\cdot 2 - 3 = 1\\): $$f'(2) = 10 \\cdot 1^4 = 10$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (x+4)^3\\). Berechne \\(f'(-2)\\).", loesung: 12, toleranz: 0, tipp: "Die innere Ableitung ist hier \\(1\\) — die Kettenregel ändert also nichts.", loesungsweg: "Mit \\(u = x+4\\) und \\(u' = 1\\): $$f'(x) = 3(x+4)^2 \\cdot 1 = 3(x+4)^2$$ Einsetzen: $$f'(-2) = 3 \\cdot (-2+4)^2 = 3 \\cdot 4 = 12$$ Steht in der Klammer nur \\(x\\) plus eine Zahl, sieht die Kettenregel aus wie die Potenzregel." },
      { id: 10, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (5x+2)^2\\). Berechne \\(f'(1)\\).", loesung: 70, toleranz: 0, tipp: "Zwei Wege führen zum Ziel: Kettenregel oder vorher ausmultiplizieren.", loesungsweg: "Kettenregel mit \\(u = 5x+2\\), \\(u' = 5\\): $$f'(x) = 2(5x+2) \\cdot 5 = 10(5x+2)$$ $$f'(1) = 10 \\cdot 7 = 70$$ Probe durch Ausmultiplizieren: \\(f(x) = 25x^2+20x+4\\) hat die Ableitung \\(50x+20\\), und \\(50+20 = 70\\) ✓" },
      { id: 11, level: 2, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = (4x-1)^3\\)?", optionen: ["\\(12(4x-1)^2\\)", "\\(3(4x-1)^2\\)", "\\(4(4x-1)^2\\)", "\\(12(4x-1)^3\\)"], korrekt: 0, tipp: "Die innere Ableitung der Klammer ist \\(4\\).", loesungsweg: "Kettenregel mit \\(u = 4x-1\\) und \\(u' = 4\\): $$f'(x) = 3(4x-1)^2 \\cdot 4 = 12(4x-1)^2$$ Ohne die innere Ableitung käme \\(3(4x-1)^2\\) heraus — der typische Fehler. Der Exponent sinkt dabei von \\(3\\) auf \\(2\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (1-2x)^3\\). Berechne \\(f'(2)\\).", loesung: -54, toleranz: 0, tipp: "Achte auf das Vorzeichen der inneren Ableitung.", loesungsweg: "Mit \\(u = 1-2x\\) und \\(u' = -2\\): $$f'(x) = 3(1-2x)^2 \\cdot (-2) = -6(1-2x)^2$$ Einsetzen: $$f'(2) = -6 \\cdot (1-4)^2 = -6 \\cdot 9 = -54$$ Das Quadrat ist positiv, das Minuszeichen stammt allein aus der inneren Ableitung." },
      // LEVEL 3 — Kettenregel bei der e-Funktion
      { id: 13, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^{2x}\\). Berechne \\(f'(1)\\). (2 Dezimalen)", loesung: 14.78, toleranz: 0.02, tipp: "Die e-Funktion bleibt erhalten, der Exponent liefert die innere Ableitung.", loesungsweg: "Mit \\(u = 2x\\) und \\(u' = 2\\): $$f'(x) = e^{2x} \\cdot 2 = 2e^{2x}$$ Einsetzen: $$f'(1) = 2e^2 \\approx 2 \\cdot 7{,}389 \\approx 14{,}78$$ Der Exponent bleibt beim Ableiten unverändert stehen." },
      { id: 14, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^{-3x}\\). Berechne \\(f'(1)\\). (4 Dezimalen)", loesung: -0.1494, toleranz: 0.001, tipp: "Die innere Ableitung ist negativ.", loesungsweg: "Mit \\(u = -3x\\) und \\(u' = -3\\): $$f'(x) = -3e^{-3x}$$ Einsetzen: $$f'(1) = -3e^{-3} = -\\frac{3}{e^3} \\approx -0{,}1494$$ Der Wert ist negativ und betragsmäßig klein — \\(e^{-3x}\\) fällt für wachsendes \\(x\\) immer flacher." },
      { id: 15, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^{x^2}\\). Berechne \\(f'(1)\\). (2 Dezimalen)", loesung: 5.44, toleranz: 0.02, tipp: "Die innere Funktion steht im Exponenten; leite sie gesondert ab.", loesungsweg: "Kettenregel mit \\(u = x^2\\), \\(u' = 2x\\): $$f'(x) = e^{x^2} \\cdot 2x$$ $$f'(1) = e^1 \\cdot 2 = 2e \\approx 5{,}44$$ Der Faktor \\(2x\\) darf nicht in den Exponenten geschrieben werden — er steht davor." },
      { id: 16, level: 3, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = e^{5x+1}\\)?", optionen: ["\\(5e^{5x+1}\\)", "\\(e^{5x+1}\\)", "\\((5x+1)e^{5x}\\)", "\\(5e^{5x}\\)"], korrekt: 0, tipp: "Die innere Funktion bleibt im Exponenten stehen.", loesungsweg: "Die innere Funktion \\(5x+1\\) hat die Ableitung \\(5\\); die e-Funktion bleibt beim Ableiten erhalten: $$f'(x) = e^{5x+1} \\cdot 5 = 5e^{5x+1}$$ Der Exponent ändert sich <b>nicht</b> — die innere Funktion bleibt im Exponenten stehen und tritt zusätzlich als Faktor auf." },
      { id: 17, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 3e^{-2x}\\). Berechne \\(f'(-1)\\). (2 Dezimalen)", loesung: -44.33, toleranz: 0.05, tipp: "Der Vorfaktor bleibt, die innere Ableitung kommt hinzu.", loesungsweg: "Faktor- und Kettenregel zusammen: $$f'(x) = 3 \\cdot e^{-2x} \\cdot (-2) = -6e^{-2x}$$ Einsetzen: $$f'(-1) = -6e^{2} \\approx -6 \\cdot 7{,}389 \\approx -44{,}33$$ Aus \\(-2 \\cdot (-1) = 2\\) wird ein <b>positiver</b> Exponent — hier geht leicht ein Vorzeichen verloren." },
      { id: 18, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^{-x^2}\\). Berechne \\(f'(1)\\). (2 Dezimalen)", loesung: -0.74, toleranz: 0.02, tipp: "Leite den gesamten Exponenten ab, Vorzeichen eingeschlossen.", loesungsweg: "Mit \\(u = -x^2\\) und \\(u' = -2x\\): $$f'(x) = e^{-x^2} \\cdot (-2x)$$ $$f'(1) = e^{-1} \\cdot (-2) = -\\frac2e \\approx -0{,}74$$ Das negative Vorzeichen passt zur Anschauung: Die Glockenkurve fällt rechts ihres höchsten Punktes." },
      // LEVEL 4 — Produktregel, Verfahren wählen, Umkehraufgabe
      { id: 19, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2 \\cdot e^x\\). Berechne \\(f'(-1)\\). (3 Dezimalen)", loesung: -0.368, toleranz: 0.005, tipp: "Beide Faktoren müssen abgeleitet werden; das Ausklammern lohnt sich.", loesungsweg: "Produktregel mit \\(u = x^2\\), \\(u' = 2x\\), \\(v = e^x\\), \\(v' = e^x\\): $$f'(x) = 2xe^x + x^2e^x = e^x(x^2+2x)$$ Einsetzen: $$f'(-1) = e^{-1}(1-2) = -\\frac1e \\approx -0{,}368$$ Der Klammerterm ist negativ, die e-Funktion stets positiv — daher das Minuszeichen." },
      { id: 20, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x \\cdot \\sin(x)\\). Berechne \\(f'(\\pi)\\). (3 Dezimalen)", loesung: -3.142, toleranz: 0.005, tipp: "Erinnere dich an die Werte von Sinus und Kosinus bei \\(\\pi\\).", loesungsweg: "Produktregel mit \\(u = x\\), \\(v = \\sin x\\): $$f'(x) = \\sin x + x \\cos x$$ Mit \\(\\sin\\pi = 0\\) und \\(\\cos\\pi = -1\\): $$f'(\\pi) = 0 + \\pi \\cdot (-1) = -\\pi \\approx -3{,}142$$ Der erste Summand verschwindet, der zweite trägt allein." },
      { id: 21, level: 4, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = (x-1) \\cdot e^x\\)?", optionen: ["\\(x e^x\\)", "\\(e^x\\)", "\\((x-1)e^x\\)", "\\((x+1)e^x\\)"], korrekt: 0, tipp: "Beide Summanden der Produktregel enthalten \\(e^x\\) — klammere aus.", loesungsweg: "Produktregel mit \\(u = x-1\\), \\(u' = 1\\), \\(v = e^x\\), \\(v' = e^x\\): $$f'(x) = 1 \\cdot e^x + (x-1)e^x = e^x(1 + x - 1) = xe^x$$ Die beiden Einsen heben sich auf — deshalb ist das Ergebnis deutlich einfacher als der Ausgangsterm." },
      { id: 22, level: 4, typ: "numerisch", frage: "Für \\(f(x) = e^{ax}\\) gilt \\(f'(1) = 2e^2\\). Wie groß ist \\(a\\)?", loesung: 2, toleranz: 0, tipp: "Leite mit dem Buchstaben ab und vergleiche Faktor und Exponent.", loesungsweg: "Die Kettenregel liefert $$f'(x) = a \\cdot e^{ax} \\;\\Rightarrow\\; f'(1) = a e^{a}$$ Der Vergleich mit \\(2e^2\\) zeigt, dass \\(a\\) sowohl als Faktor als auch im Exponenten die \\(2\\) sein muss: $$a e^a = 2e^2 \\;\\Rightarrow\\; a = 2$$ Eine weitere Lösung gibt es nicht: für \\(a < 0\\) wäre \\(ae^a\\) negativ, und für \\(a > 0\\) wächst \\(ae^a\\) streng." },
      { id: 23, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (x^2+1)^2\\). Berechne \\(f'(2)\\).", loesung: 40, toleranz: 0, tipp: "Hier führen Kettenregel und vorheriges Ausmultiplizieren gleichermaßen zum Ziel.", loesungsweg: "Kettenregel mit \\(u = x^2+1\\), \\(u' = 2x\\): $$f'(x) = 2(x^2+1) \\cdot 2x = 4x(x^2+1)$$ $$f'(2) = 4 \\cdot 2 \\cdot 5 = 40$$ Probe über den ausmultiplizierten Term \\(f(x) = x^4+2x^2+1\\): \\(f'(x) = 4x^3+4x\\), also \\(f'(2) = 32+8 = 40\\) ✓" },
      { id: 24, level: 4, typ: "numerisch", frage: "Die Wirkstoffkonzentration beträgt \\(c(t) = 5t \\cdot e^{-0{,}5t}\\) (in mg/l, \\(t\\) in Stunden). Wie groß ist die momentane Änderungsrate nach \\(4\\) Stunden? (3 Dezimalen)", loesung: -0.677, toleranz: 0.005, tipp: "Die Änderungsrate ist die Ableitung; der zweite Faktor braucht die Kettenregel.", loesungsweg: "Produktregel, der zweite Faktor zusätzlich mit der Kettenregel: $$c'(t) = 5e^{-0{,}5t} + 5t \\cdot (-0{,}5)e^{-0{,}5t} = 5e^{-0{,}5t}(1 - 0{,}5t)$$ Einsetzen: $$c'(4) = 5e^{-2}(1-2) = -5e^{-2} \\approx -0{,}677$$ Die Konzentration nimmt nach vier Stunden also um rund \\(0{,}68\\) mg/l je Stunde ab." },
      // LEVEL 5 — Ketten- und Produktregel verzahnt, Parameter, Fehlersuche
      { id: 25, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = x \\cdot e^{2x}\\) hat genau eine Stelle mit waagerechter Tangente. An welcher? (1 Dezimale)", loesung: -0.5, toleranz: 0.01, tipp: "Klammere die e-Funktion aus und überlege, welcher Faktor null werden kann.", loesungsweg: "Produkt- und Kettenregel greifen ineinander: $$f'(x) = 1 \\cdot e^{2x} + x \\cdot 2e^{2x} = e^{2x}(1+2x)$$ Da \\(e^{2x}\\) für kein \\(x\\) null wird, bleibt nur $$1 + 2x = 0 \\;\\Rightarrow\\; x = -0{,}5$$ Das ist die einzige Lösung — die lineare Klammer hat nur eine Nullstelle." },
      { id: 26, level: 5, typ: "numerisch", frage: "Für \\(f(x) = x^2 \\cdot e^{-x}\\) gibt es zwei Stellen mit waagerechter Tangente. Gib die größere an.", loesung: 2, toleranz: 0, tipp: "Nach dem Ausklammern entsteht ein Produkt aus zwei einfachen Faktoren.", loesungsweg: "Produkt- und Kettenregel: $$f'(x) = 2xe^{-x} + x^2(-e^{-x}) = e^{-x}(2x - x^2) = e^{-x} \\cdot x(2-x)$$ Der Faktor \\(e^{-x}\\) wird nie null, also $$x = 0 \\quad\\text{oder}\\quad x = 2$$ Beide Stellen sind zu betrachten; die größere ist \\(x = 2\\). Dort liegt der Hochpunkt, bei \\(x = 0\\) der Tiefpunkt." },
      { id: 27, level: 5, typ: "mc", frage: "Jemand leitet \\(f(x) = \\sin(3x)\\) ab und erhält \\(f'(x) = \\cos(3x)\\). Worin liegt der Fehler?", optionen: ["Die innere Ableitung \\(3\\) fehlt als Faktor", "Die äußere Ableitung müsste \\(-\\cos(3x)\\) lauten", "Es hätte die Produktregel angewendet werden müssen", "Der Faktor \\(3\\) gehört in das Argument des Kosinus"], korrekt: 0, tipp: "Prüfe, ob beide Bestandteile der Kettenregel vorkommen.", loesungsweg: "Die äußere Ableitung ist richtig — aus \\(\\sin\\) wird \\(\\cos\\). Vergessen wurde die Nachdifferenzierung: $$f'(x) = \\cos(3x) \\cdot 3 = 3\\cos(3x)$$ Das Argument \\(3x\\) bleibt unverändert, der Faktor \\(3\\) tritt <b>vor</b> den Kosinus. Eine Produktregel ist nicht nötig, denn \\(\\sin(3x)\\) ist kein Produkt, sondern eine Verkettung." },
      { id: 28, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = (x+a) \\cdot e^x\\) hat an der Stelle \\(x = 1\\) eine waagerechte Tangente. Wie groß ist \\(a\\)?", loesung: -2, toleranz: 0, tipp: "Stelle die Ableitung mit dem Buchstaben auf und setze die Bedingung ein.", loesungsweg: "Produktregel mit \\(u = x+a\\), \\(u' = 1\\): $$f'(x) = e^x + (x+a)e^x = e^x(1 + x + a)$$ Die Bedingung \\(f'(1) = 0\\) und \\(e^1 \\neq 0\\) ergeben $$1 + 1 + a = 0 \\;\\Rightarrow\\; a = -2$$ Probe: \\(f(x) = (x-2)e^x\\) hat \\(f'(x) = e^x(x-1)\\), das ist bei \\(x = 1\\) null ✓" },
      { id: 29, level: 5, typ: "numerisch", frage: "Im Intervall \\((0; \\pi)\\) hat der Graph von \\(f(x) = e^{-x}\\sin(x)\\) genau eine Stelle mit waagerechter Tangente. An welcher? (3 Dezimalen)", loesung: 0.785, toleranz: 0.005, tipp: "Nach dem Ausklammern entsteht eine rein trigonometrische Gleichung.", loesungsweg: "Produkt- und Kettenregel: $$f'(x) = -e^{-x}\\sin x + e^{-x}\\cos x = e^{-x}(\\cos x - \\sin x)$$ Da \\(e^{-x}\\) nie null wird, bleibt $$\\cos x = \\sin x \\;\\Rightarrow\\; \\tan x = 1$$ Im Intervall \\((0;\\pi)\\) löst das nur $$x = \\frac{\\pi}{4} \\approx 0{,}785$$ Die zweite Lösung der Tangensgleichung, \\(\\frac{5\\pi}{4}\\), liegt außerhalb." },
      { id: 30, level: 5, typ: "mc", frage: "Welcher Term ist die Ableitung von \\(f(x) = \\sqrt{x^2+3}\\)?", optionen: ["\\(\\frac{x}{\\sqrt{x^2+3}}\\)", "\\(\\frac{1}{2\\sqrt{x^2+3}}\\)", "\\(\\frac{2x}{\\sqrt{x^2+3}}\\)", "\\(\\frac{x}{2\\sqrt{x^2+3}}\\)"], korrekt: 0, tipp: "Schreibe die Wurzel als Potenz und leite dann äußere und innere Funktion ab.", loesungsweg: "Mit \\(u = x^2+3\\) und \\(\\sqrt u = u^{1/2}\\) gilt $$f'(x) = \\frac{1}{2\\sqrt{x^2+3}} \\cdot 2x = \\frac{2x}{2\\sqrt{x^2+3}} = \\frac{x}{\\sqrt{x^2+3}}$$ Die innere Ableitung \\(2x\\) kürzt sich gegen die \\(2\\) der äußeren Ableitung — wer eines von beiden vergisst, landet bei einem der drei anderen Terme." },
      // LEVEL 6 — Abi-Format: mehrschrittig mit Begründungsanteil
      { id: 31, level: 6, typ: "numerisch", frage: "Die Wirkstoffkonzentration im Blut wird für \\(t \\ge 0\\) durch \\(c(t) = 8t \\cdot e^{-0{,}4t}\\) (in mg/l, \\(t\\) in Stunden) beschrieben. Zeigen Sie, dass die Konzentration genau einen Höchstwert annimmt, und geben Sie den Zeitpunkt an. (1 Dezimale)", loesung: 2.5, toleranz: 0.01, tipp: "Klammern Sie die e-Funktion aus; ihr Vorzeichen entscheidet über die Anzahl der Lösungen.", loesungsweg: "Produkt- und Kettenregel: $$c'(t) = 8e^{-0{,}4t} + 8t(-0{,}4)e^{-0{,}4t} = 8e^{-0{,}4t}(1 - 0{,}4t)$$ Der Faktor \\(8e^{-0{,}4t}\\) ist für jedes \\(t\\) positiv, also entscheidet allein die Klammer: $$1 - 0{,}4t = 0 \\;\\Rightarrow\\; t = 2{,}5$$ Es gibt genau eine Lösung, denn die Klammer ist linear. Links davon ist sie positiv (Anstieg), rechts negativ (Abfall) — also liegt dort der Höchstwert von rund \\(7{,}36\\) mg/l." },
      { id: 32, level: 6, typ: "mc", frage: "Beurteilen Sie die Behauptung: <b>Für jedes \\(k \\neq 0\\) hat der Graph von \\(f(x) = e^{kx}\\) keine Stelle mit waagerechter Tangente.</b>", optionen: ["Richtig: \\(e^{kx}\\) ist stets positiv und \\(k\\) ist nicht null", "Falsch: für negative \\(k\\) wird die Ableitung an einer Stelle null", "Richtig, aber nur für \\(k > 0\\); bei \\(k < 0\\) gibt es eine solche Stelle", "Falsch: an der Stelle \\(x = 0\\) ist die Ableitung stets gleich null"], korrekt: 0, tipp: "Stellen Sie die Ableitung auf und prüfen Sie, ob ein Faktor überhaupt null werden kann.", loesungsweg: "Die Kettenregel liefert $$f'(x) = k \\cdot e^{kx}$$ Ein Produkt wird nur null, wenn ein Faktor null wird. Die e-Funktion ist für jedes Argument <b>positiv</b>, und \\(k\\) ist nach Voraussetzung ungleich null. Also ist \\(f'(x) \\neq 0\\) für alle \\(x\\) — die Behauptung stimmt. Das Vorzeichen von \\(k\\) spielt dabei keine Rolle: es entscheidet nur, ob der Graph steigt oder fällt. An der Stelle \\(x=0\\) ist \\(f'(0) = k \\neq 0\\)." },
      { id: 33, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x) = (x^2 + c) \\cdot e^{x}\\) soll genau eine Stelle mit waagerechter Tangente haben. Wie groß muss \\(c\\) sein?", loesung: 1, toleranz: 0, tipp: "Nach dem Ausklammern entscheidet die Diskriminante über die Anzahl der Lösungen.", loesungsweg: "Produktregel und Ausklammern: $$f'(x) = 2xe^x + (x^2+c)e^x = e^x(x^2 + 2x + c)$$ Da \\(e^x\\) nie null wird, hängt alles an der quadratischen Klammer. Genau eine Lösung entsteht bei verschwindender Diskriminante: $$D = 2^2 - 4c = 4 - 4c = 0 \\;\\Rightarrow\\; c = 1$$ Für \\(c < 1\\) gäbe es zwei Stellen, für \\(c > 1\\) keine. Bei \\(c = 1\\) ist \\(x^2+2x+1 = (x+1)^2\\), die doppelte Nullstelle \\(x = -1\\) gehört zu einem Sattelpunkt." },
      { id: 34, level: 6, typ: "numerisch", frage: "Zwei Zerfallsmodelle sind \\(A(t) = 100e^{-0{,}1t}\\) und \\(B(t) = 100e^{-0{,}2t}\\). Zu welchem Zeitpunkt \\(t\\) ist die momentane Abnahmerate von \\(A\\) genauso groß wie die von \\(B\\)? (2 Dezimalen)", loesung: 6.93, toleranz: 0.05, tipp: "Setzen Sie die Ableitungen gleich und fassen Sie die Potenzen zu einer zusammen.", loesungsweg: "Die Raten sind $$A'(t) = -10e^{-0{,}1t}, \\qquad B'(t) = -20e^{-0{,}2t}$$ Gleichsetzen und durch \\(-10e^{-0{,}2t}\\) teilen: $$e^{-0{,}1t} = 2e^{-0{,}2t} \\;\\Rightarrow\\; e^{0{,}1t} = 2$$ $$0{,}1t = \\ln 2 \\;\\Rightarrow\\; t = 10\\ln 2 \\approx 6{,}93$$ Anfangs fällt \\(B\\) doppelt so schnell; weil \\(B\\) aber schneller schrumpft, gleichen sich die Raten nach rund \\(6{,}9\\) Zeiteinheiten an." },
      { id: 35, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x) = (x^2 - 4) \\cdot e^{x}\\) hat zwei Stellen mit waagerechter Tangente. Geben Sie die kleinere an. (3 Dezimalen)", loesung: -3.236, toleranz: 0.005, tipp: "Klammern Sie die e-Funktion aus und lösen Sie die quadratische Gleichung vollständig.", loesungsweg: "Produktregel und Ausklammern: $$f'(x) = 2xe^x + (x^2-4)e^x = e^x(x^2 + 2x - 4)$$ Die e-Funktion wird nie null, also $$x^2 + 2x - 4 = 0 \\;\\Rightarrow\\; x = -1 \\pm \\sqrt{1+4} = -1 \\pm \\sqrt5$$ Beide Lösungen sind reell: \\(x_1 \\approx -3{,}236\\) und \\(x_2 \\approx 1{,}236\\). Gefragt ist die kleinere, also \\(-1-\\sqrt5 \\approx -3{,}236\\); dort liegt der Hochpunkt, an der zweiten Stelle der Tiefpunkt." },
      { id: 36, level: 6, typ: "mc", frage: "Beurteilen Sie die Behauptung: <b>Die Ableitung von \\(f(x) = \\sin^2(x)\\) ist \\(f'(x) = 2\\sin(x)\\cos(x)\\).</b>", optionen: ["Richtig: äußere Ableitung \\(2\\sin x\\), innere Ableitung \\(\\cos x\\)", "Falsch: richtig wäre \\(2\\sin(x)\\), die innere Ableitung entfällt", "Falsch: auf ein Quadrat lässt sich die Kettenregel nicht anwenden", "Richtig, aber nur im Bereich \\(0 < x < \\pi\\), sonst kippt das Vorzeichen"], korrekt: 0, tipp: "Schreiben Sie den Term als \\((\\sin x)^2\\) und bestimmen Sie innere und äußere Funktion.", loesungsweg: "Es handelt sich um die Verkettung \\(u(x) = \\sin x\\) mit \\(v(u) = u^2\\). Die Kettenregel liefert $$f'(x) = 2\\sin x \\cdot \\cos x$$ Die Behauptung stimmt also. Eine Probe bestätigt es: wegen \\(2\\sin x\\cos x = \\sin(2x)\\) müsste \\(f(x) = \\sin^2 x\\) dieselbe Ableitung haben wie \\(-\\tfrac12\\cos(2x)\\) — und tatsächlich unterscheiden sich beide Funktionen nur um die Konstante \\(\\tfrac12\\)." }];
