<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketten- & Produktregel - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-ableitung-ketten-produkt';
    const THEMA_CONFIG = { name: 'Ketten- & Produktregel', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — innere/äußere Funktion erkennen
      { id: 1, level: 1, typ: "mc", frage: "Bei \\(f(x) = (2x+1)^3\\): innere Funktion?", optionen: ["\\(2x+1\\)", "\\(x^3\\)", "\\(2x\\)", "\\((2x+1)^3\\)"], korrekt: 0, tipp: "Was steht in der Klammer?", loesungsweg: "Innere Funktion: \\(u(x) = 2x+1\\), äußere: \\(v(u)=u^3\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Bei \\(f(x) = e^{3x}\\): innere Funktion?", optionen: ["\\(3x\\)", "\\(e^x\\)", "\\(3\\)", "\\(e^{3x}\\)"], korrekt: 0, tipp: "Exponent ist die innere Funktion.", loesungsweg: "Bei einer Verkettung ist die innere Funktion diejenige, die zuerst auf \\(x\\) angewendet wird — hier der Exponent: $$u(x) = 3x, \\qquad v(u) = e^u$$ Erst wird verdreifacht, dann exponentiert. Die Ableitung lautet entsprechend \\(f'(x) = 3e^{3x}\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Bei \\(f(x) = \\sin(x^2)\\): äußere Funktion?", optionen: ["\\(\\sin(u)\\)", "\\(u^2\\)", "\\(\\sin(x)\\)", "\\(x^2\\)"], korrekt: 0, tipp: "Was wird außen angewendet?", loesungsweg: "Die äußere Funktion ist die, die zuletzt angewendet wird. Hier wird erst quadriert, dann der Sinus gebildet: $$u(x) = x^2, \\qquad v(u) = \\sin u$$ Die äußere Funktion ist also \\(\\sin u\\). Vertauscht ergäbe sich \\((\\sin x)^2\\) — eine ganz andere Funktion." },
      { id: 4, level: 1, typ: "mc", frage: "Kettenregel für \\(f(x) = v(u(x))\\)?", optionen: ["\\(v'(u(x)) \\cdot u'(x)\\)", "\\(v'(x) \\cdot u'(x)\\)", "\\(v(u'(x))\\)", "\\(v'(u(x)) + u'(x)\\)"], korrekt: 0, tipp: "Äußere Ableitung mal innere Ableitung.", loesungsweg: "Die Kettenregel lautet $$f'(x) = v'(u(x)) \\cdot u'(x)$$ in Worten: äußere Ableitung an der Stelle der inneren Funktion, mal innere Ableitung. Der Faktor \\(u'(x)\\) — die „Nachdifferenzierung\" — wird am häufigsten vergessen." },
      { id: 5, level: 1, typ: "mc", frage: "Produktregel \\((u\\cdot v)'\\) lautet …", optionen: ["\\(u' \\cdot v + u \\cdot v'\\)", "\\(u' \\cdot v'\\)", "\\(u \\cdot v'\\)", "\\(u' + v'\\)"], korrekt: 0, tipp: "Zwei Summanden.", loesungsweg: "Die Produktregel besteht aus <b>zwei</b> Summanden, in denen jeweils ein Faktor abgeleitet wird: $$(uv)' = u'v + uv'$$ Einfach beide Faktoren abzuleiten (\\(u'v'\\)) ist falsch. Probe an \\(f(x) = x \\cdot x = x^2\\): die Regel liefert \\(1 \\cdot x + x \\cdot 1 = 2x\\) ✓, \\(u'v' = 1\\) dagegen nicht." },
      { id: 6, level: 1, typ: "mc", frage: "Bei \\(f(x) = \\sqrt{5x-3}\\): innere Funktion?", optionen: ["\\(5x-3\\)", "\\(\\sqrt{x}\\)", "\\(5x\\)", "\\(x-3\\)"], korrekt: 0, tipp: "Unter der Wurzel.", loesungsweg: "Zuerst wird der Term unter der Wurzel berechnet, dann die Wurzel gezogen: $$u(x) = 5x-3, \\qquad v(u) = \\sqrt u$$ Die innere Funktion ist also \\(5x-3\\); die innere Ableitung \\(u' = 5\\) tritt beim Ableiten als Faktor auf." },
      // LEVEL 2 — einfache Kettenregel
      { id: 7, level: 2, typ: "numerisch", frage: "\\(f(x) = (3x+1)^4\\). \\(f'(0)\\)?", loesung: 12, toleranz: 0, tipp: "\\(4(3x+1)^3 \\cdot 3\\).", loesungsweg: "\\(f'(x) = 12(3x+1)^3\\). \\(f'(0) = 12\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "\\(f(x) = (2x-3)^5\\). \\(f'(2)\\)?", loesung: 10, toleranz: 0, tipp: "Kettenregel.", loesungsweg: "\\(f'(x) = 10(2x-3)^4\\). \\(f'(2) = 10\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "\\(f(x) = (x+4)^3\\). \\(f'(-3)\\)?", loesung: 3, toleranz: 0, tipp: "innere Ableitung \\(=1\\).", loesungsweg: "\\(f'(x) = 3(x+4)^2\\). \\(f'(-3) = 3\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "\\(f(x) = (5x+2)^2\\). \\(f'(0)\\)?", loesung: 20, toleranz: 0, tipp: "Kettenregel.", loesungsweg: "\\(f'(x) = 10(5x+2)\\). \\(f'(0) = 20\\)." },
      { id: 11, level: 2, typ: "mc", frage: "Ableitung von \\(f(x) = (4x-1)^3\\)?", optionen: ["\\(12(4x-1)^2\\)", "\\(3(4x-1)^2\\)", "\\(4(4x-1)^2\\)", "\\(12(4x-1)^3\\)"], korrekt: 0, tipp: "Innere Ableitung: \\(4\\).", loesungsweg: "Kettenregel mit \\(u = 4x-1\\) und \\(u' = 4\\): $$f'(x) = 3(4x-1)^2 \\cdot 4 = 12(4x-1)^2$$ Ohne die innere Ableitung käme \\(3(4x-1)^2\\) heraus — der typische Fehler. Der Exponent sinkt dabei von \\(3\\) auf \\(2\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "\\(f(x) = (1-2x)^3\\). \\(f'(0)\\)?", loesung: -6, toleranz: 0, tipp: "Innere Ableitung \\(=-2\\).", loesungsweg: "\\(f'(x) = -6(1-2x)^2\\). \\(f'(0) = -6\\)." },
      // LEVEL 3 — Kettenregel mit e-Funktion
      { id: 13, level: 3, typ: "numerisch", frage: "\\(f(x) = e^{2x}\\). \\(f'(0)\\)?", loesung: 2, toleranz: 0, tipp: "\\((e^u)' = e^u \\cdot u'\\).", loesungsweg: "\\(f'(x) = 2e^{2x}\\). \\(f'(0) = 2\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(f(x) = e^{-3x}\\). \\(f'(0)\\)?", loesung: -3, toleranz: 0, tipp: "\\(u'=-3\\).", loesungsweg: "\\(f'(x) = -3e^{-3x}\\). \\(f'(0) = -3\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "\\(f(x) = e^{x^2}\\). \\(f'(1)\\)? (2 Dezimalen)", loesung: 5.44, toleranz: 0.02, tipp: "Innere Ableitung \\(2x\\).", loesungsweg: "Kettenregel mit \\(u = x^2\\), \\(u' = 2x\\): $$f'(x) = e^{x^2} \\cdot 2x$$ $$f'(1) = e^1 \\cdot 2 = 2e \\approx 5{,}44$$" },
      { id: 16, level: 3, typ: "mc", frage: "Ableitung von \\(f(x) = e^{5x+1}\\)?", optionen: ["\\(5e^{5x+1}\\)", "\\(e^{5x+1}\\)", "\\((5x+1)e^{5x}\\)", "\\(5e^{5x}\\)"], korrekt: 0, tipp: "Kettenregel.", loesungsweg: "Die innere Funktion \\(5x+1\\) hat die Ableitung \\(5\\); die e-Funktion bleibt beim Ableiten erhalten: $$f'(x) = e^{5x+1} \\cdot 5 = 5e^{5x+1}$$ Der Exponent ändert sich <b>nicht</b> — die innere Funktion bleibt im Exponenten stehen und tritt zusätzlich als Faktor auf." },
      { id: 17, level: 3, typ: "numerisch", frage: "\\(f(x) = 3e^{-2x}\\). \\(f'(0)\\)?", loesung: -6, toleranz: 0, tipp: "Faktor- + Kettenregel.", loesungsweg: "\\(f'(x) = -6e^{-2x}\\). \\(f'(0) = -6\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "\\(f(x) = e^{-x^2}\\). \\(f'(1)\\)? (2 Dezimalen)", loesung: -0.74, toleranz: 0.02, tipp: "\\(u' = -2x\\).", loesungsweg: "Mit \\(u = -x^2\\) und \\(u' = -2x\\): $$f'(x) = e^{-x^2} \\cdot (-2x)$$ $$f'(1) = e^{-1} \\cdot (-2) = -\\frac2e \\approx -0{,}74$$ Das negative Vorzeichen passt zur Anschauung: Die Glockenkurve fällt rechts des Maximums bei \\(x = 0\\)." },
      // LEVEL 4 — Produktregel
      { id: 19, level: 4, typ: "numerisch", frage: "\\(f(x) = x^2 \\cdot e^x\\). \\(f'(1)\\)? (2 Dezimalen)", loesung: 8.15, toleranz: 0.02, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = e^x(x^2 + 2x)\\). \\(f'(1) = 3e \\approx 8{,}15\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "\\(f(x) = x \\cdot \\sin(x)\\). \\(f'(0)\\)?", loesung: 0, toleranz: 0, tipp: "\\(u=x\\), \\(v=\\sin x\\).", loesungsweg: "\\(f'(x) = \\sin x + x\\cos x\\). \\(f'(0) = 0\\)." },
      { id: 21, level: 4, typ: "mc", frage: "Ableitung von \\(f(x) = x^2 \\cdot e^x\\)?", optionen: ["\\(e^x(x^2 + 2x)\\)", "\\(2xe^x\\)", "\\(e^x(x^2 - 2x)\\)", "\\(x^2 e^x + 2x\\)"], korrekt: 0, tipp: "Produktregel.", loesungsweg: "Produktregel mit \\(u = x^2\\), \\(u' = 2x\\), \\(v = e^x\\), \\(v' = e^x\\): $$f'(x) = 2x \\cdot e^x + x^2 \\cdot e^x = e^x(x^2+2x)$$ Das Ausklammern von \\(e^x\\) ist nicht nur schöner, es erleichtert auch die spätere Nullstellensuche: Da \\(e^x\\) nie null wird, genügt \\(x^2+2x = 0\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "\\(f(x) = (3x-1)e^x\\). \\(f'(0)\\)?", loesung: 2, toleranz: 0, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = e^x(3x+2)\\). \\(f'(0) = 2\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "\\(f(x) = x^2 \\cos(x)\\). \\(f'(0)\\)?", loesung: 0, toleranz: 0, tipp: "Produktregel, \\(\\cos'=-\\sin\\).", loesungsweg: "\\(f'(x) = 2x\\cos x - x^2\\sin x\\). \\(f'(0) = 0\\)." },
      { id: 24, level: 4, typ: "mc", frage: "Ableitung von \\(f(x) = x \\cdot e^x - 3x^2\\)?", optionen: ["\\(e^x + xe^x - 6x\\)", "\\(xe^x - 6x\\)", "\\(e^x + xe^x - 3x\\)", "\\(e^x - 6x\\)"], korrekt: 0, tipp: "Produktregel für \\(xe^x\\).", loesungsweg: "Der erste Summand verlangt die Produktregel, der zweite nur die Potenzregel: $$\\left(xe^x\\right)' = 1 \\cdot e^x + x \\cdot e^x = e^x + xe^x$$ $$f'(x) = e^x + xe^x - 6x$$ Aus \\(-3x^2\\) wird \\(-6x\\), nicht \\(-3x\\)." },
      // LEVEL 5 — Kombinationen Ketten + Produkt
      { id: 25, level: 5, typ: "numerisch", frage: "\\(f(x) = x \\cdot e^{2x}\\). \\(f'(0)\\)?", loesung: 1, toleranz: 0, tipp: "Produktregel; \\(v'=2e^{2x}\\).", loesungsweg: "\\(f'(x) = e^{2x}(1+2x)\\). \\(f'(0) = 1\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "\\(f(x) = x^2 \\cdot e^{-x}\\). \\(f'(0)\\)?", loesung: 0, toleranz: 0, tipp: "Produkt + Kette.", loesungsweg: "\\(f'(x) = e^{-x}(2x - x^2)\\). \\(f'(0) = 0\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "\\(f(x) = e^{-x} \\sin(x)\\). \\(f'(0)\\)?", loesung: 1, toleranz: 0, tipp: "Produkt + Kette.", loesungsweg: "\\(f'(x) = e^{-x}(\\cos x - \\sin x)\\). \\(f'(0) = 1\\)." },
      { id: 28, level: 5, typ: "mc", frage: "Ableitung von \\(f(x) = x \\sin(3x)\\)?", optionen: ["\\(\\sin(3x) + 3x\\cos(3x)\\)", "\\(3\\cos(3x)\\)", "\\(\\sin(3x) + x\\cos(3x)\\)", "\\(x\\cos(3x) + 3\\sin(3x)\\)"], korrekt: 0, tipp: "Produktregel, \\(v'=3\\cos(3x)\\).", loesungsweg: "Produktregel mit \\(u = x\\), \\(v = \\sin(3x)\\). Für \\(v'\\) ist zusätzlich die Kettenregel nötig: \\(v' = 3\\cos(3x)\\). $$f'(x) = 1 \\cdot \\sin(3x) + x \\cdot 3\\cos(3x) = \\sin(3x) + 3x\\cos(3x)$$ Die \\(3\\) gehört zum Kosinusterm — hier greifen beide Regeln ineinander." },
      { id: 29, level: 5, typ: "numerisch", frage: "\\(f(x) = (2x^2+1)^{-3}\\). \\(f'(1)\\)? (4 Dezimalen)", loesung: -0.1481, toleranz: 0.001, tipp: "Kettenregel.", loesungsweg: "\\(f'(x) = -12x(2x^2+1)^{-4}\\). \\(f'(1) = -12/81 \\approx -0{,}1481\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "\\(f(x) = \\sin(2x+1)\\). \\(f'(0)\\)? (2 Dezimalen, Bogenmaß)", loesung: 1.08, toleranz: 0.02, tipp: "Kettenregel.", loesungsweg: "\\(f'(x) = 2\\cos(2x+1)\\). \\(f'(0) = 2\\cos(1) \\approx 1{,}08\\)." },
      // LEVEL 6 — doppelt verschachtelt
      { id: 31, level: 6, typ: "numerisch", frage: "\\(f(x) = e^{\\sin x}\\). \\(f'(0)\\)?", loesung: 1, toleranz: 0, tipp: "Doppelte Kettenregel.", loesungsweg: "\\(f'(x) = e^{\\sin x}\\cos x\\). \\(f'(0) = 1\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "\\(f(x) = \\sin(e^x)\\). \\(f'(0)\\)? (2 Dezimalen)", loesung: 0.54, toleranz: 0.02, tipp: "Doppelte Kette.", loesungsweg: "\\(f'(x) = \\cos(e^x)\\cdot e^x\\). \\(f'(0) = \\cos(1) \\approx 0{,}54\\)." },
      { id: 33, level: 6, typ: "numerisch", frage: "\\(f(x) = e^{-x^2+2x}\\). \\(f'(1)\\)?", loesung: 0, toleranz: 0, tipp: "\\(u' = -2x+2\\).", loesungsweg: "\\(f'(x) = e^{u}(-2x+2)\\). \\(f'(1) = e \\cdot 0 = 0\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "\\(f(x) = (x^2+1)\\sin(x)\\). \\(f'(\\pi/2)\\)? (2 Dezimalen)", loesung: 3.14, toleranz: 0.02, tipp: "Produktregel.", loesungsweg: "Produktregel mit \\(u = x^2+1\\), \\(v = \\sin x\\): $$f'(x) = 2x\\sin x + (x^2+1)\\cos x$$ An der Stelle \\(\\tfrac{\\pi}{2}\\) ist \\(\\sin = 1\\) und \\(\\cos = 0\\), der zweite Summand fällt also weg: $$f'\\!\\left(\\tfrac{\\pi}{2}\\right) = 2 \\cdot \\tfrac{\\pi}{2} \\cdot 1 + 0 = \\pi \\approx 3{,}14$$" },
      { id: 35, level: 6, typ: "numerisch", frage: "\\(f(x) = \\sin(x)\\cos(2x)\\). \\(f'(0)\\)?", loesung: 1, toleranz: 0, tipp: "Produkt + Kette.", loesungsweg: "\\(f'(x) = \\cos x\\cos(2x) - 2\\sin x\\sin(2x)\\). \\(f'(0) = 1\\)." },
      { id: 36, level: 6, typ: "mc", frage: "\\((\\cos(3x^2))' =\\)", optionen: ["\\(-6x\\sin(3x^2)\\)", "\\(-\\sin(3x^2)\\)", "\\(-3\\sin(3x^2)\\)", "\\(6x\\cos(3x^2)\\)"], korrekt: 0, tipp: "Äußere: \\(-\\sin\\); innere: \\(6x\\).", loesungsweg: "\\((\\cos u)' = -\\sin u \\cdot u' = -6x\\sin(3x^2)\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
