<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lineare Funktionen - Grundlagen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-lineare-funktionen-grund';
    const THEMA_CONFIG = { name: 'Lineare Funktionen - Grundlagen', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Die allgemeine Form einer linearen Funktion lautet …", optionen: ["\\(y = mx^2 + n\\)", "\\(y = mx + n\\)", "\\(y = \\frac{m}{x}\\)", "\\(y = m \\cdot n\\)"], korrekt: 1, tipp: "Geradengleichung.", loesungsweg: "Lineare Funktion: \\(y = mx + n\\) mit Anstieg \\(m\\) und absolutem Glied \\(n\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Was bedeutet \\(m\\) in \\(y = mx + n\\)?", optionen: ["y-Achsenabschnitt", "Anstieg (Steigung)", "Nullstelle", "x-Achsenabschnitt"], korrekt: 1, tipp: "Steilheit der Geraden.", loesungsweg: "\\(m\\) ist der <b>Anstieg</b> - wie stark die Gerade pro Schritt nach rechts steigt (oder fällt)." },
      { id: 3, level: 1, typ: "mc", frage: "Was bedeutet \\(n\\) in \\(y = mx + n\\)?", optionen: ["Anstieg", "Nullstelle", "Absolutes Glied / y-Achsenabschnitt", "Definitionsbereich"], korrekt: 2, tipp: "Wert bei \\(x = 0\\).", loesungsweg: "\\(n\\) ist das absolute Glied: Schnittpunkt mit der y-Achse, also \\(f(0) = n\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne \\(f(3)\\) für \\(f(x) = 2x + 1\\).", loesung: 7, toleranz: 0, tipp: "Einsetzen.", loesungsweg: "$$f(3) = 2 \\cdot 3 + 1 = 7$$" },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne \\(f(0)\\) für \\(f(x) = -3x + 5\\).", loesung: 5, toleranz: 0, tipp: "Bei \\(x = 0\\).", loesungsweg: "$$f(0) = -3 \\cdot 0 + 5 = 5$$" },
      { id: 6, level: 1, typ: "numerisch", frage: "Berechne \\(f(-2)\\) für \\(f(x) = x + 4\\).", loesung: 2, toleranz: 0, tipp: "\\(-2 + 4\\).", loesungsweg: "$$f(-2) = -2 + 4 = 2$$" },
      // LEVEL 2
      { id: 7, level: 2, typ: "mc", frage: "Welcher Anstieg gehört zu \\(y = 4x - 7\\)?", optionen: ["\\(m = -7\\)", "\\(m = 4\\)", "\\(m = 7\\)", "\\(m = -4\\)"], korrekt: 1, tipp: "Zahl vor \\(x\\).", loesungsweg: "In der Form \\(y = mx + n\\) ist \\(m\\) der Faktor vor \\(x\\): $$m = 4$$ Er gibt an, um wie viel \\(y\\) steigt, wenn \\(x\\) um \\(1\\) wächst. Die \\(-7\\) ist dagegen der \\(y\\)-Achsenabschnitt \\(n\\)." },
      { id: 8, level: 2, typ: "mc", frage: "Welches absolute Glied hat \\(y = -2x + 3\\)?", optionen: ["\\(n = -2\\)", "\\(n = 3\\)", "\\(n = -3\\)", "\\(n = 2\\)"], korrekt: 1, tipp: "Summand ohne \\(x\\).", loesungsweg: "\\(n = 3\\), Schnittpunkt mit der y-Achse: \\((0; 3)\\)." },
      { id: 9, level: 2, typ: "mc", frage: "Welche Funktion verläuft durch den Ursprung?", optionen: ["\\(y = 2x + 1\\)", "\\(y = 3x\\)", "\\(y = -x + 2\\)", "\\(y = 5\\)"], korrekt: 1, tipp: "\\(n = 0\\).", loesungsweg: "Ursprungsgeraden haben \\(n = 0\\): \\(y = 3x\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Gib den Anstieg von \\(y = \\frac{1}{2}x + 3\\) an.", loesung: 0.5, toleranz: 0.01, tipp: "Vorfaktor von \\(x\\).", loesungsweg: "$$m = \\frac{1}{2} = 0{,}5$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Gib den y-Achsenabschnitt von \\(y = 3x - 8\\) an.", loesung: -8, toleranz: 0, tipp: "Konstantes Glied.", loesungsweg: "Der \\(y\\)-Achsenabschnitt ist das konstante Glied, also der Funktionswert bei \\(x = 0\\): $$f(0) = 3 \\cdot 0 - 8 = -8$$ Der Graph schneidet die \\(y\\)-Achse also unterhalb des Ursprungs." },
      { id: 12, level: 2, typ: "numerisch", frage: "Für \\(f(x) = 5x - 3\\): Welchen Wert liefert \\(f(2)\\)?", loesung: 7, toleranz: 0, tipp: "Einsetzen.", loesungsweg: "Einsetzen von \\(x = 2\\): $$f(2) = 5 \\cdot 2 - 3 = 10 - 3 = 7$$ Erst multiplizieren, dann subtrahieren — Punkt vor Strich." },
      // LEVEL 3
      { id: 13, level: 3, typ: "mc", frage: "Welche Gerade ist fallend?", optionen: ["\\(y = 2x + 1\\)", "\\(y = -3x + 4\\)", "\\(y = x\\)", "\\(y = 5\\)"], korrekt: 1, tipp: "Negativer Anstieg.", loesungsweg: "Bei \\(m < 0\\) fällt die Gerade: \\(y = -3x + 4\\) hat \\(m = -3\\)." },
      { id: 14, level: 3, typ: "mc", frage: "Welche Gerade ist parallel zur x-Achse?", optionen: ["\\(y = 2x\\)", "\\(y = 4\\)", "\\(x = 3\\)", "\\(y = x + 1\\)"], korrekt: 1, tipp: "\\(m = 0\\).", loesungsweg: "\\(y = 4\\) ist eine konstante Funktion - Parallele zur x-Achse." },
      { id: 15, level: 3, typ: "mc", frage: "Die Nullstelle einer linearen Funktion ist …", optionen: ["Der Wert \\(y = 0\\) gesetzt und nach \\(x\\) aufgelöst", "Der y-Achsenabschnitt", "Der Anstieg", "Der Wendepunkt"], korrekt: 0, tipp: "Schnitt mit x-Achse.", loesungsweg: "Nullstelle: \\(f(x) = 0\\), d. h. \\(mx + n = 0 \\Rightarrow x = -\\frac{n}{m}\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Berechne die Nullstelle von \\(f(x) = 2x - 6\\).", loesung: 3, toleranz: 0, tipp: "\\(2x - 6 = 0\\).", loesungsweg: "$$2x - 6 = 0 \\implies x = 3$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Berechne die Nullstelle von \\(f(x) = -\\frac{1}{2}x + 4\\).", loesung: 8, toleranz: 0, tipp: "Gleich 0 setzen.", loesungsweg: "$$-\\frac{1}{2}x + 4 = 0 \\implies x = 8$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne die Nullstelle von \\(f(x) = 5x + 10\\).", loesung: -2, toleranz: 0, tipp: "\\(5x = -10\\).", loesungsweg: "$$5x + 10 = 0 \\implies x = -2$$" },
      // LEVEL 4
      { id: 19, level: 4, typ: "mc", frage: "Welche Gerade ist steiler?", optionen: ["\\(y = 2x\\)", "\\(y = 3x\\)", "\\(y = \\frac{1}{2}x\\)", "\\(y = -x\\)"], korrekt: 1, tipp: "Betrag des Anstiegs.", loesungsweg: "Die Steilheit hängt vom <b>Betrag</b> des Anstiegs ab, nicht vom Vorzeichen: $$|3| > |2| > |-1| > \\left|\\tfrac12\\right|$$ Am steilsten ist also \\(y = 3x\\). Die Gerade \\(y = -x\\) fällt zwar, ist aber genauso steil wie \\(y = x\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Eine Gerade verläuft durch \\(A(2|1)\\) und \\(B(4|7)\\). An welcher Stelle schneidet sie die \\(y\\)-Achse? Gib den \\(y\\)-Wert an.", loesung: -5, toleranz: 0, tipp: "Erst den Anstieg aus beiden Punkten, dann einen Punkt einsetzen.", loesungsweg: "Anstieg aus zwei Punkten: $$m = \\frac{7-1}{4-2} = 3$$ Punkt \\(A\\) in \\(y = 3x + n\\) einsetzen: \\(1 = 6 + n\\), also \\(n = -5\\). Die Gerade \\(y = 3x - 5\\) schneidet die \\(y\\)-Achse bei \\(-5\\). Probe mit \\(B\\): \\(3 \\cdot 4 - 5 = 7\\) ✓" },
      { id: 21, level: 4, typ: "mc", frage: "Welcher Punkt liegt auf \\(y = 3x - 1\\)?", optionen: ["\\((2; 4)\\)", "\\((1; 2)\\)", "\\((0; 0)\\)", "\\((3; 9)\\)"], korrekt: 1, tipp: "Einsetzen und prüfen.", loesungsweg: "\\(f(1) = 3 \\cdot 1 - 1 = 2\\) ✓. Also liegt \\((1; 2)\\) auf der Geraden." },
      { id: 22, level: 4, typ: "numerisch", frage: "Berechne den Anstieg durch \\(A(2;3)\\) und \\(B(5;12)\\).", loesung: 3, toleranz: 0, tipp: "\\(\\frac{\\Delta y}{\\Delta x}\\).", loesungsweg: "$$m = \\frac{12 - 3}{5 - 2} = \\frac{9}{3} = 3$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Die Gerade \\(y = mx + 4\\) geht durch \\(P(2|10)\\). Bestimme \\(m\\).", loesung: 3, toleranz: 0, tipp: "Die Koordinaten von \\(P\\) erfüllen die Gleichung.", loesungsweg: "Punkt einsetzen: $$10 = m \\cdot 2 + 4 \\;\\Rightarrow\\; 2m = 6 \\;\\Rightarrow\\; m = 3$$ Probe: \\(3 \\cdot 2 + 4 = 10\\) ✓ Typischer Fehler: \\(m = 10 : 2 = 5\\) — dabei wird das absolute Glied \\(4\\) vergessen." },
      { id: 24, level: 4, typ: "numerisch", frage: "Eine Gerade verläuft durch \\(A(1|2)\\) und \\(B(3|8)\\). Berechne den Funktionswert an der Stelle \\(x = 5\\).", loesung: 14, toleranz: 0, tipp: "Zuerst die Funktionsgleichung aufstellen.", loesungsweg: "Anstieg: \\(m = \\frac{8-2}{3-1} = 3\\). Mit \\(A\\): \\(2 = 3 + n\\), also \\(n = -1\\) und \\(f(x) = 3x - 1\\). $$f(5) = 15 - 1 = 14$$ Kürzer: Von \\(x = 3\\) bis \\(x = 5\\) sind es zwei Schritte, also \\(8 + 2 \\cdot 3 = 14\\) ✓" },
      // LEVEL 5
      { id: 25, level: 5, typ: "mc", frage: "Lea berechnet den Anstieg der Geraden durch \\(A(1|5)\\) und \\(B(4|{-1})\\): $$m = \\frac{5 - (-1)}{4 - 1} = 2$$ Was ist dazu zu sagen?", optionen: ["Falsch — Zähler und Nenner in derselben Reihenfolge: \\(m = \\frac{-1 - 5}{4 - 1} = -2\\)", "Richtig — \\(m = 2\\), die Reihenfolge der Punkte im Zähler spielt keine Rolle", "Falsch — es gilt \\(m = \\frac{4 - 1}{-1 - 5} = -0{,}5\\), \\(x\\)-Differenz durch \\(y\\)-Differenz", "Falsch — der Betrag stimmt nicht, richtig ist \\(m = 5 - (-1) = 6\\)"], korrekt: 0, tipp: "Die Gerade fällt von \\(A\\) nach \\(B\\). Passt ein positiver Anstieg dazu?", loesungsweg: "Beim Differenzenquotienten gehört zum ersten Punkt im Zähler auch der erste Punkt im Nenner: $$m = \\frac{y_B - y_A}{x_B - x_A} = \\frac{-1 - 5}{4 - 1} = \\frac{-6}{3} = -2$$ Lea hat im Zähler \\(A - B\\), im Nenner \\(B - A\\) gerechnet — das Vorzeichen kippt. Kontrolle: Von \\(A\\) nach \\(B\\) geht es \\(3\\) nach rechts und \\(6\\) nach unten, die Gerade fällt ✓" },
      { id: 26, level: 5, typ: "numerisch", frage: "Für eine lineare Funktion \\(f\\) gilt \\(f(2) = 1\\) und \\(f(6) = 13\\). Gib das absolute Glied \\(n\\) an.", loesung: -5, toleranz: 0, tipp: "Beide Angaben sind Punkte des Graphen.", loesungsweg: "Die Angaben liefern die Punkte \\((2|1)\\) und \\((6|13)\\): $$m = \\frac{13 - 1}{6 - 2} = 3$$ Einsetzen von \\((2|1)\\): \\(1 = 3 \\cdot 2 + n\\), also \\(n = -5\\). Probe mit dem zweiten Punkt: \\(3 \\cdot 6 - 5 = 13\\) ✓" },
      { id: 27, level: 5, typ: "numerisch", frage: "Eine Gerade verläuft durch \\(P(-2|6)\\) und \\(Q(4|{-3})\\). An welcher Stelle schneidet sie die \\(x\\)-Achse?", loesung: 2, toleranz: 0, tipp: "Erst die Gleichung der Geraden, dann \\(y = 0\\) setzen.", loesungsweg: "Anstieg: $$m = \\frac{-3 - 6}{4 - (-2)} = \\frac{-9}{6} = -1{,}5$$ Mit \\(P\\): \\(6 = -1{,}5 \\cdot (-2) + n = 3 + n\\), also \\(n = 3\\) und \\(y = -1{,}5x + 3\\). Nullstelle: \\(-1{,}5x + 3 = 0 \\Rightarrow x = 2\\). Probe: \\((2|0)\\) liegt genau zwischen \\(P\\) und \\(Q\\) — passt zur Lage der beiden Punkte ✓" },
      { id: 28, level: 5, typ: "mc", frage: "Tom sucht die Nullstelle von \\(f(x) = -4x + 6\\): „\\(-4x + 6 = 0\\), also \\(-4x = 6\\) und \\(x = -1{,}5\\).“ Was ist dazu zu sagen?", optionen: ["Falsch — beim Umstellen wird \\(6\\) subtrahiert: \\(-4x = -6\\), also \\(x = 1{,}5\\)", "Richtig — \\(x = -1{,}5\\), denn \\(6 : (-4) = -1{,}5\\), das Minus bleibt", "Falsch — die Nullstelle ist \\(x = 6 - 4 = 2\\), die Differenz der beiden Zahlen", "Falsch — die Nullstelle ist das absolute Glied \\(6\\), dort schneidet \\(f\\) die Achse"], korrekt: 0, tipp: "Probe: Setze Toms Ergebnis in \\(f\\) ein.", loesungsweg: "Die \\(6\\) steht links als Summand und muss auf beiden Seiten abgezogen werden: $$-4x + 6 = 0 \\;\\mid\\; -6 \\quad\\Rightarrow\\quad -4x = -6 \\quad\\Rightarrow\\quad x = 1{,}5$$ Probe: \\(f(1{,}5) = -6 + 6 = 0\\) ✓ Toms Wert liefert \\(f(-1{,}5) = 6 + 6 = 12 \\neq 0\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Eine Gerade \\(g\\) hat die Nullstelle \\(x = 4\\) und schneidet die \\(y\\)-Achse bei \\(6\\). Berechne \\(g(10)\\).", loesung: -9, toleranz: 0, tipp: "Beide Angaben beschreiben je einen Punkt der Geraden.", loesungsweg: "Nullstelle und Achsenabschnitt sind die Punkte \\((4|0)\\) und \\((0|6)\\): $$m = \\frac{0 - 6}{4 - 0} = -1{,}5, \\qquad g(x) = -1{,}5x + 6$$ $$g(10) = -15 + 6 = -9$$ Probe: \\(g(4) = -6 + 6 = 0\\) ✓" },
      { id: 30, level: 5, typ: "numerisch", frage: "Für welchen Wert von \\(a\\) liegt der Punkt \\(P(a|{-3})\\) auf der Geraden durch \\(A(0|5)\\) und \\(B(2|1)\\)?", loesung: 4, toleranz: 0, tipp: "Erst die Geradengleichung, dann \\(y = -3\\) einsetzen.", loesungsweg: "Anstieg: \\(m = \\frac{1 - 5}{2 - 0} = -2\\); \\(A\\) liegt auf der \\(y\\)-Achse, also \\(n = 5\\) und \\(y = -2x + 5\\). Bedingung für \\(P\\): $$-3 = -2a + 5 \\;\\Rightarrow\\; -8 = -2a \\;\\Rightarrow\\; a = 4$$ Probe: \\(-2 \\cdot 4 + 5 = -3\\) ✓" },
      // LEVEL 6
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Die Geraden \\(g\\!: y = 2x - 3\\) und \\(h\\!: 4x - 2y = 6\\) schneiden sich in genau einem Punkt.“", optionen: ["Falsch — \\(h\\) nach \\(y\\) umgestellt ergibt ebenfalls \\(y = 2x - 3\\): dieselbe Gerade", "Richtig — der Schnittpunkt ist \\((0|{-3})\\), denn dort schneidet \\(g\\) die \\(y\\)-Achse", "Falsch — die Geraden sind parallel und haben keinen gemeinsamen Punkt, beide haben Anstieg \\(2\\)", "Richtig — der Schnittpunkt ist \\((1{,}5|0)\\), denn dort schneidet \\(g\\) die \\(x\\)-Achse"], korrekt: 0, tipp: "Bringe \\(h\\) in die Form \\(y = mx + n\\) und vergleiche \\(m\\) und \\(n\\).", loesungsweg: "Umstellen von \\(h\\): $$4x - 2y = 6 \\;\\Rightarrow\\; -2y = -4x + 6 \\;\\Rightarrow\\; y = 2x - 3$$ Gleicher Anstieg <b>und</b> gleiches absolutes Glied: \\(g\\) und \\(h\\) sind identisch, jeder Punkt von \\(g\\) liegt auch auf \\(h\\). Die Punkte \\((0|{-3})\\) und \\((1{,}5|0)\\) liegen zwar auf beiden Geraden, sind aber keine einzelnen Schnittpunkte." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für welchen Wert von \\(k\\) sind die Geraden \\(y = (2k - 1)x + 4\\) und \\(y = 5x - 2\\) parallel?", loesung: 3, toleranz: 0, tipp: "Parallele Geraden haben denselben Anstieg.", loesungsweg: "Parallel bedeutet gleicher Anstieg bei verschiedenem absoluten Glied: $$2k - 1 = 5 \\;\\Rightarrow\\; k = 3$$ Die absoluten Glieder \\(4\\) und \\(-2\\) sind verschieden, die Geraden also wirklich parallel und nicht identisch ✓" },
      { id: 33, level: 6, typ: "mc", frage: "Behauptung: „Verdoppelt man bei \\(y = 3x + 2\\) den \\(x\\)-Wert, dann verdoppelt sich auch der \\(y\\)-Wert.“", optionen: ["Falsch — das gilt nur für Ursprungsgeraden; hier: \\(x = 1 \\mapsto 5\\), aber \\(x = 2 \\mapsto 8\\)", "Richtig — weil der Anstieg konstant ist, wächst \\(y\\) im gleichen Verhältnis wie \\(x\\)", "Richtig, aber nur für positive \\(x\\)-Werte — bei negativen kehrt sich das Verhältnis um", "Falsch — der \\(y\\)-Wert verdreifacht sich, weil \\(m = 3\\) den Faktor angibt"], korrekt: 0, tipp: "Prüfe die Behauptung an einem Zahlenbeispiel.", loesungsweg: "Beispiel: \\(f(1) = 5\\), \\(f(2) = 8 \\neq 10\\). Verdoppelt sich \\(x\\), so verdoppelt sich nur der Anteil \\(3x\\); das absolute Glied \\(2\\) bleibt: $$f(2x) = 6x + 2 \\neq 2 \\cdot (3x + 2) = 6x + 4$$ Nur bei \\(n = 0\\) (proportionale Zuordnung) gilt „doppeltes \\(x\\), doppeltes \\(y\\)“." },
      { id: 34, level: 6, typ: "numerisch", frage: "Die Geraden \\(g\\!: y = -x + 7\\) und \\(h\\!: y = 2x + n\\) schneiden sich auf der \\(x\\)-Achse. Bestimme \\(n\\).", loesung: -14, toleranz: 0, tipp: "Wo schneidet \\(g\\) die \\(x\\)-Achse? Dieser Punkt liegt auch auf \\(h\\).", loesungsweg: "Nullstelle von \\(g\\): \\(-x + 7 = 0 \\Rightarrow x = 7\\), Schnittpunkt \\((7|0)\\). Dieser Punkt muss \\(h\\) erfüllen: $$0 = 2 \\cdot 7 + n \\;\\Rightarrow\\; n = -14$$ Probe: \\(h(7) = 14 - 14 = 0\\) ✓" },
      { id: 35, level: 6, typ: "numerisch", frage: "Für welchen Wert von \\(c\\) hat die Gerade \\(y = (c - 2)x + 8\\) keine Nullstelle?", loesung: 2, toleranz: 0, tipp: "Wann liegt eine Gerade waagerecht?", loesungsweg: "Fallunterscheidung: Für \\(c \\neq 2\\) ist der Anstieg von null verschieden, und \\((c - 2)x + 8 = 0\\) hat die Lösung \\(x = -\\frac{8}{c - 2}\\). Für \\(c = 2\\) lautet die Gleichung \\(y = 8\\): eine waagerechte Gerade oberhalb der \\(x\\)-Achse, die sie nie schneidet. Also $$c = 2$$" },
      { id: 36, level: 6, typ: "numerisch", frage: "Die Geraden \\(g\\!: y = 2x + 1\\) und \\(h\\!: y = mx + 7\\) sollen sich an der Stelle \\(x = 2\\) schneiden. Bestimme \\(m\\).", loesung: -1, toleranz: 0, tipp: "Der Schnittpunkt liegt auf \\(g\\) — berechne zuerst seine \\(y\\)-Koordinate.", loesungsweg: "Schnittpunkt auf \\(g\\): \\(g(2) = 5\\), also \\(S(2|5)\\). \\(S\\) muss auch auf \\(h\\) liegen: $$5 = 2m + 7 \\;\\Rightarrow\\; 2m = -2 \\;\\Rightarrow\\; m = -1$$ Probe: \\(h(2) = -2 + 7 = 5\\) ✓ Die Gerade \\(h\\) fällt, \\(g\\) steigt — sie kreuzen sich tatsächlich." }];
    </script>
