<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <title>Ganzrationale Funktionen - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-ganzrationale-funktionen';
    const THEMA_CONFIG = { name: 'Ganzrationale Funktionen', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht: Grundbegriffe ==========
      { id: 1, level: 1, typ: "mc", frage: "Was ist eine ganzrationale Funktion?", optionen: ["Eine Funktion mit Bruch im Nenner mit x", "Eine Summe von Potenzen von x mit ganzzahligen, nicht-negativen Exponenten", "Eine Wurzelfunktion", "Eine trigonometrische Funktion"], korrekt: 1, tipp: "Stichwort: Polynom.", loesungsweg: "Eine <b>ganzrationale Funktion</b> (Polynomfunktion) hat die Form \\(f(x) = a_n x^n + \\dots + a_1 x + a_0\\)." },
      { id: 2, level: 1, typ: "mc", frage: "Welchen Grad hat \\(f(x) = 3x^4 - 2x + 1\\)?", optionen: ["\\(1\\)", "\\(3\\)", "\\(4\\)", "\\(5\\)"], korrekt: 2, tipp: "Der Grad ist der höchste Exponent.", loesungsweg: "Der höchste Exponent ist \\(4\\), also Grad \\(4\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Welche Funktion ist NICHT ganzrational?", optionen: ["\\(f(x) = x^3 - 5\\)", "\\(f(x) = 2x + 7\\)", "\\(f(x) = \\frac{1}{x} + 2\\)", "\\(f(x) = x^2 + x\\)"], korrekt: 2, tipp: "\\(\\frac{1}{x} = x^{-1}\\) hat einen negativen Exponenten.", loesungsweg: "\\(\\frac{1}{x}\\) hat Exponent \\(-1\\) — nicht ganzrational." },
      { id: 4, level: 1, typ: "numerisch", frage: "Welchen Grad hat \\(f(x) = 5x^2 - x^5 + 3\\)?", loesung: 5, toleranz: 0, tipp: "Höchster Exponent.", loesungsweg: "\\(x^5\\) hat den höchsten Exponenten, also Grad \\(5\\)." },
      { id: 5, level: 1, typ: "mc", frage: "Wie heißt der Koeffizient vor der höchsten Potenz?", optionen: ["Absolutglied", "Leitkoeffizient", "Nullstelle", "Exponent"], korrekt: 1, tipp: "„Leit-\" steht vorne.", loesungsweg: "Der <b>Leitkoeffizient</b> steht vor der höchsten Potenz." },
      { id: 6, level: 1, typ: "mc", frage: "Was ist das Absolutglied von \\(f(x) = 2x^3 - 4x + 7\\)?", optionen: ["\\(2\\)", "\\(-4\\)", "\\(7\\)", "\\(3\\)"], korrekt: 2, tipp: "Das Glied ohne \\(x\\).", loesungsweg: "Das Absolutglied ist der konstante Summand: \\(7\\)." },
      // ========== LEVEL 2 -- leicht: Funktionswerte ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne \\(f(2)\\) für \\(f(x) = x^3 - 2x\\).", loesung: 4, toleranz: 0, tipp: "Einsetzen: \\(8 - 4\\).", loesungsweg: "$$f(2) = 2^3 - 2 \\cdot 2 = 8 - 4 = 4$$" },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne \\(f(-1)\\) für \\(f(x) = x^4 - x^2 + 3\\).", loesung: 3, toleranz: 0, tipp: "\\((-1)^4 = 1\\), \\((-1)^2 = 1\\).", loesungsweg: "$$f(-1) = 1 - 1 + 3 = 3$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne \\(f(0)\\) für \\(f(x) = 3x^5 - 2x^3 + 7\\).", loesung: 7, toleranz: 0, tipp: "Alle Potenzen von 0 sind 0.", loesungsweg: "$$f(0) = 0 - 0 + 7 = 7$$" },
      { id: 10, level: 2, typ: "numerisch", frage: "Berechne \\(f(3)\\) für \\(f(x) = x^2 - 4x + 1\\).", loesung: -2, toleranz: 0, tipp: "\\(9 - 12 + 1\\).", loesungsweg: "$$f(3) = 9 - 12 + 1 = -2$$" },
      { id: 11, level: 2, typ: "mc", frage: "Für welches \\(x\\) ist \\(f(x) = x^2 - 9\\) gleich null?", optionen: ["nur \\(x = 3\\)", "nur \\(x = -3\\)", "\\(x = 3\\) und \\(x = -3\\)", "\\(x = 9\\)"], korrekt: 2, tipp: "Satz vom Nullprodukt: \\((x-3)(x+3) = 0\\).", loesungsweg: "\\(x^2 - 9 = (x-3)(x+3)\\). Nullstellen: \\(x = \\pm 3\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(f(-2)\\) für \\(f(x) = x^3 + x^2\\).", loesung: -4, toleranz: 0, tipp: "\\(-8 + 4\\).", loesungsweg: "$$f(-2) = -8 + 4 = -4$$" },
      // ========== LEVEL 3 -- nervenschonend: Nullstellen ==========
      { id: 13, level: 3, typ: "mc", frage: "Nullstellen von \\(f(x) = x^2 - 5x\\)?", optionen: ["\\(0\\) und \\(5\\)", "\\(0\\) und \\(-5\\)", "\\(5\\) und \\(-5\\)", "nur \\(5\\)"], korrekt: 0, tipp: "Ausklammern: \\(x(x - 5)\\).", loesungsweg: "\\(x(x - 5) = 0 \\implies x = 0\\) oder \\(x = 5\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Wie viele Nullstellen hat \\(f(x) = x^2 + 1\\) in \\(\\mathbb{R}\\)?", loesung: 0, toleranz: 0, tipp: "\\(x^2 \\geq 0\\), also \\(x^2 + 1 \\geq 1\\).", loesungsweg: "\\(x^2 + 1 > 0\\) für alle \\(x\\) — keine reellen Nullstellen." },
      { id: 15, level: 3, typ: "numerisch", frage: "Nullstelle von \\(f(x) = 2x - 6\\)?", loesung: 3, toleranz: 0, tipp: "\\(2x - 6 = 0\\).", loesungsweg: "$$2x - 6 = 0 \\implies x = 3$$" },
      { id: 16, level: 3, typ: "mc", frage: "Nullstellen von \\(f(x) = x^3 - 4x\\)?", optionen: ["\\(0\\), \\(2\\), \\(-2\\)", "nur \\(0\\) und \\(4\\)", "nur \\(2\\)", "\\(0\\) und \\(4\\)"], korrekt: 0, tipp: "\\(x^3 - 4x = x(x^2 - 4) = x(x-2)(x+2)\\).", loesungsweg: "\\(x(x-2)(x+2) = 0\\): \\(x = 0, 2, -2\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Anzahl maximaler Nullstellen einer Funktion vom Grad 4?", loesung: 4, toleranz: 0, tipp: "Grad = maximale Nullstellenzahl.", loesungsweg: "Eine ganzrationale Funktion vom Grad \\(n\\) hat höchstens \\(n\\) Nullstellen." },
      { id: 18, level: 3, typ: "mc", frage: "Welches Verhalten hat \\(f(x) = -x^3\\) für \\(x \\to \\infty\\)?", optionen: ["\\(f(x) \\to \\infty\\)", "\\(f(x) \\to -\\infty\\)", "\\(f(x) \\to 0\\)", "\\(f(x) \\to 1\\)"], korrekt: 1, tipp: "Negativer Leitkoeffizient, ungerader Grad.", loesungsweg: "Für \\(x \\to \\infty\\) geht \\(-x^3 \\to -\\infty\\)." },
      // ========== LEVEL 4 -- mittel: Symmetrie & Verhalten ==========
      { id: 19, level: 4, typ: "mc", frage: "Welche Funktion ist <b>weder</b> achsensymmetrisch zur y-Achse <b>noch</b> punktsymmetrisch zum Ursprung?", optionen: ["\\(f(x) = x^4 - 2x^2\\)", "\\(f(x) = x^3 - 5x\\)", "\\(f(x) = x^4 + x^3\\)", "\\(f(x) = x^2 + 3\\)"], korrekt: 2, tipp: "Symmetrie verlangt <b>nur</b> gerade oder <b>nur</b> ungerade Exponenten.", loesungsweg: "Achsensymmetrie verlangt ausschließlich gerade, Punktsymmetrie ausschließlich ungerade Exponenten. $$x^4 + x^3$$ mischt beides und erfüllt deshalb keine von beiden. Probe: \\(f(-1) = 1 - 1 = 0\\), aber \\(f(1) = 1 + 1 = 2\\) — weder gleich noch entgegengesetzt. Die übrigen drei haben einheitliche Exponenten; die Konstante \\(3\\) zählt dabei als \\(3x^0\\), also als gerade." },
      { id: 20, level: 4, typ: "mc", frage: "Für welche Funktion gilt \\(f(-x) = -f(x)\\)?", optionen: ["\\(f(x) = x^4 - 2x^2\\)", "\\(f(x) = x^5 + x\\)", "\\(f(x) = x^2 + 3\\)", "\\(f(x) = x^4 + x^3\\)"], korrekt: 1, tipp: "Die Bedingung beschreibt Punktsymmetrie zum Ursprung.", loesungsweg: "Die Bedingung \\(f(-x) = -f(x)\\) ist die Definition der Punktsymmetrie zum Ursprung; erfüllt ist sie genau dann, wenn nur ungerade Exponenten vorkommen. $$f(-x) = (-x)^5 + (-x) = -x^5 - x = -f(x)$$ Bei \\(x^4 - 2x^2\\) und \\(x^2 + 3\\) gilt dagegen \\(f(-x) = f(x)\\) — das ist Achsensymmetrie. \\(x^4 + x^3\\) mischt beide Sorten und ist überhaupt nicht symmetrisch." },
      { id: 21, level: 4, typ: "numerisch", frage: "Nullstelle von \\(f(x) = x^2 - 6x + 9\\)?", loesung: 3, toleranz: 0, tipp: "Binomische Formel: \\((x - 3)^2\\).", loesungsweg: "$$x^2 - 6x + 9 = (x - 3)^2 = 0 \\implies x = 3$$ (doppelt)" },
      { id: 22, level: 4, typ: "mc", frage: "Verhalten von \\(f(x) = x^4 - 3x^2\\) für \\(x \\to -\\infty\\)?", optionen: ["\\(\\to \\infty\\)", "\\(\\to -\\infty\\)", "\\(\\to 0\\)", "\\(\\to 1\\)"], korrekt: 0, tipp: "Gerader Grad, positiver Leitkoeffizient.", loesungsweg: "Bei geradem Grad mit positivem Leitkoeffizient: \\(f \\to \\infty\\) für \\(x \\to \\pm\\infty\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Berechne die Summe aller Nullstellen von \\(f(x) = x^2 - 7x + 10\\).", loesung: 7, toleranz: 0, tipp: "\\((x-2)(x-5)\\). Oder Satz von Vieta: Summe = \\(-\\frac{b}{a}\\).", loesungsweg: "Faktorisieren nach Vieta: Gesucht sind zwei Zahlen mit Summe \\(7\\) und Produkt \\(10\\) — das sind \\(2\\) und \\(5\\). $$x^2-7x+10 = (x-2)(x-5)$$ $$2+5 = 7$$ Schneller geht es direkt über Vieta: Die Summe der Nullstellen ist \\(-\\frac ba = 7\\), ohne dass man sie einzeln bestimmen muss." },
      { id: 24, level: 4, typ: "numerisch", frage: "Produkt der Nullstellen von \\(f(x) = x^2 - 7x + 10\\)?", loesung: 10, toleranz: 0, tipp: "Vieta: Produkt = \\(\\frac{c}{a}\\).", loesungsweg: "Nach Vieta ist das Produkt der Nullstellen das Absolutglied (bei Leitkoeffizient \\(1\\)): $$x_1 \\cdot x_2 = \\frac ca = 10$$ Probe mit den Nullstellen \\(2\\) und \\(5\\): \\(2 \\cdot 5 = 10\\) ✓" },
      // ========== LEVEL 5 -- anspruchsvoll: Faktorisieren ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Die Funktion \\(f(x) = x^3 + a x^2 + b x\\) hat die Nullstellen \\(0\\), \\(2\\) und \\(3\\). Bestimme \\(a\\).", loesung: -5, toleranz: 0, tipp: "Schreibe die Funktion zuerst als Produkt ihrer Linearfaktoren und multipliziere aus.", loesungsweg: "Aus den Nullstellen folgt die Produktform: $$f(x) = x(x-2)(x-3)$$ Ausmultipliziert: $$x(x^2 - 5x + 6) = x^3 - 5x^2 + 6x$$ Vergleich der Koeffizienten liefert \\(a = -5\\) (und \\(b = 6\\))." },
      { id: 26, level: 5, typ: "mc", frage: "Zur Gleichung \\(x^3 = 4x\\) wird gerechnet: „Beide Seiten durch \\(x\\) teilen ergibt \\(x^2 = 4\\), also \\(x = 2\\) oder \\(x = -2\\).“ Wie ist diese Rechnung zu bewerten?", optionen: ["Richtig, es gibt genau zwei Lösungen", "Falsch, die Lösung \\(x = 0\\) fehlt", "Falsch, es gibt gar keine Lösung", "Falsch, \\(x = -2\\) ist keine Lösung"], korrekt: 1, tipp: "Prüfe, ob der Term, durch den geteilt wurde, selbst null werden kann.", loesungsweg: "Durch \\(x\\) darf nur geteilt werden, wenn \\(x \\neq 0\\) ist. Richtig geht es über das Nullprodukt: $$x^3 - 4x = x(x-2)(x+2) = 0$$ Die Lösungsmenge ist \\(\\{-2;\\,0;\\,2\\}\\) — beim Teilen geht <b>\\(x = 0\\)</b> verloren. Probe: \\(0^3 = 4 \\cdot 0\\) ✓" },
      { id: 27, level: 5, typ: "numerisch", frage: "Eine ganzrationale Funktion dritten Grades mit Leitkoeffizient \\(1\\) hat bei \\(x = 2\\) eine doppelte und bei \\(x = -3\\) eine einfache Nullstelle. Berechne \\(f(0)\\).", loesung: 12, toleranz: 0, tipp: "Stelle die Funktion als Produkt von Linearfaktoren auf; die doppelte Nullstelle liefert einen Faktor zweimal.", loesungsweg: "Produktform mit der Vielfachheit: $$f(x) = (x-2)^2 (x+3)$$ Einsetzen von \\(x = 0\\): $$f(0) = (-2)^2 \\cdot 3 = 4 \\cdot 3 = 12$$ Bei \\(x = 2\\) berührt der Graph die \\(x\\)-Achse (gerade Vielfachheit), bei \\(x = -3\\) schneidet er sie." },
      { id: 28, level: 5, typ: "mc", frage: "Für welche Werte von \\(c\\) hat \\(f(x) = x^4 + c\\) keine reelle Nullstelle?", optionen: ["Für alle Werte \\(c > 0\\)", "Für alle Werte \\(c < 0\\)", "Nur für den Wert \\(c = 0\\)", "Für alle Werte von \\(c\\)"], korrekt: 0, tipp: "Überlege, welche Werte \\(x^4\\) annehmen kann, und setze das mit \\(-c\\) in Beziehung.", loesungsweg: "Aus \\(x^4 + c = 0\\) folgt \\(x^4 = -c\\). Eine vierte Potenz ist nie negativ: $$x^4 \\ge 0$$ Für \\(c > 0\\) wäre \\(-c < 0\\) — unlösbar, es gibt <b>keine</b> Nullstelle. Für \\(c < 0\\) gibt es zwei Lösungen \\(x = \\pm\\sqrt[4]{-c}\\), für \\(c = 0\\) die vierfache Nullstelle \\(x = 0\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Von \\(f(x) = 2x^3 - 8x^2 + 6x\\) sollen die Nullstellen bestimmt werden. Berechne das Produkt der von null verschiedenen Nullstellen.", loesung: 3, toleranz: 0, tipp: "Klammere zuerst so weit wie möglich aus und behandle den Restterm anschließend.", loesungsweg: "Ausklammern und faktorisieren: $$2x^3 - 8x^2 + 6x = 2x(x^2 - 4x + 3) = 2x(x-1)(x-3)$$ Die Nullstellen sind \\(0\\), \\(1\\) und \\(3\\). Das Produkt der von null verschiedenen ist $$1 \\cdot 3 = 3$$ Der Faktor \\(2\\) ändert an den Nullstellen nichts, er streckt den Graphen nur." },
      { id: 30, level: 5, typ: "numerisch", frage: "Für \\(f(x) = (x+1)^2 (x-a)\\) gilt \\(f(0) = -6\\). Bestimme \\(a\\).", loesung: 6, toleranz: 0, tipp: "Setze \\(x = 0\\) in die Produktform ein und löse die entstehende Gleichung nach dem Parameter auf.", loesungsweg: "Einsetzen: $$f(0) = (0+1)^2 \\cdot (0-a) = -a$$ Mit \\(-a = -6\\) folgt \\(a = 6\\). Die Funktion ist \\(f(x) = (x+1)^2(x-6)\\) — sie berührt die \\(x\\)-Achse bei \\(-1\\) und schneidet sie bei \\(6\\)." },
      // ========== LEVEL 6 -- wagnerisch: Transfer ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Jede ganzrationale Funktion ungeraden Grades hat mindestens eine reelle Nullstelle.“ Prüfe die Behauptung.", optionen: ["Falsch, \\(f(x) = x^3 + 8\\) hat keine", "Richtig, die Funktion wechselt das Vorzeichen", "Falsch, es kommt auf den Leitkoeffizienten an", "Richtig, aber nur bei Leitkoeffizient \\(1\\)"], korrekt: 1, tipp: "Vergleiche das Verhalten des Graphen für sehr große und für sehr kleine \\(x\\)-Werte.", loesungsweg: "Bei ungeradem Grad verhält sich der Graph an den Rändern <b>entgegengesetzt</b>: etwa \\(f(x) \\to -\\infty\\) für \\(x \\to -\\infty\\) und \\(f(x) \\to \\infty\\) für \\(x \\to \\infty\\). Da der Graph keine Sprünge hat, muss er die \\(x\\)-Achse dazwischen treffen. Bei negativem Leitkoeffizienten dreht sich nur die Richtung um, der Vorzeichenwechsel bleibt. Gegenbeispiel gibt es also keines: \\(x^3 + 8\\) hat die Nullstelle \\(-2\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Gegeben sind \\(x^4 + 1\\), \\(x^3 - x\\), \\(x^2 + 2x\\) und \\(x^4 - 16\\). Bei wie vielen dieser Funktionen ist der Graph achsensymmetrisch zur \\(y\\)-Achse?", loesung: 2, toleranz: 0, tipp: "Prüfe je Funktion, ob ausschließlich gerade Exponenten vorkommen — die Konstante zählt dabei mit.", loesungsweg: "Achsensymmetrie liegt genau bei ausschließlich geraden Exponenten vor (\\(c = c \\cdot x^0\\)): \\(x^4 + 1\\) ✓, \\(x^4 - 16\\) ✓. Dagegen ist \\(x^3 - x\\) punktsymmetrisch (nur ungerade Exponenten), und \\(x^2 + 2x\\) mischt beide Sorten und ist gar nicht symmetrisch. Also sind es <b>2</b> Funktionen." },
      { id: 33, level: 6, typ: "numerisch", frage: "Die Funktion \\(f(x) = x^3 + a x^2 + b x + c\\) hat die Nullstellen \\(-1\\), \\(1\\) und \\(4\\). Bestimme \\(c\\).", loesung: 4, toleranz: 0, tipp: "Stelle die Produktform auf und lies das Absolutglied als Funktionswert an einer geeigneten Stelle ab.", loesungsweg: "Produktform: \\(f(x) = (x+1)(x-1)(x-4)\\). Ausmultipliziert: $$(x^2-1)(x-4) = x^3 - 4x^2 - x + 4$$ Also \\(c = 4\\). Schneller: \\(c = f(0) = 1 \\cdot (-1) \\cdot (-4) = 4\\) — das Absolutglied ist stets der Funktionswert an der Stelle \\(0\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Wie viele verschiedene reelle Nullstellen kann \\(f(x) = x^4 + b x^2\\) bei geeigneter Wahl von \\(b\\) höchstens haben?", loesung: 3, toleranz: 0, tipp: "Klammere aus und unterscheide die Fälle nach dem Vorzeichen von \\(b\\).", loesungsweg: "Ausklammern: \\(f(x) = x^2(x^2 + b)\\). Fallunterscheidung: Für \\(b > 0\\) ist \\(x^2 + b > 0\\), es bleibt nur \\(x = 0\\). Für \\(b = 0\\) ebenfalls nur \\(x = 0\\). Für \\(b < 0\\) kommt $$x^2 = -b \\;\\Longrightarrow\\; x = \\pm\\sqrt{-b}$$ hinzu, zusammen mit \\(x = 0\\) also <b>3</b> verschiedene Nullstellen. Vier sind unmöglich, weil \\(x = 0\\) stets doppelt auftritt." },
      { id: 35, level: 6, typ: "mc", frage: "Behauptung: „Eine ganzrationale Funktion geraden Grades hat stets eine gerade Anzahl verschiedener reeller Nullstellen.“ Prüfe die Behauptung.", optionen: ["Richtig, das folgt aus dem Randverhalten", "Falsch, \\(f(x) = x^4\\) hat genau eine", "Richtig, Nullstellen treten immer paarweise auf", "Falsch, \\(f(x) = x^4 + 1\\) hat genau drei"], korrekt: 1, tipp: "Suche ein Gegenbeispiel mit einer Nullstelle hoher Vielfachheit.", loesungsweg: "Gegenbeispiel: \\(f(x) = x^4\\) hat nur die <b>eine</b> Stelle \\(x = 0\\) als Nullstelle (allerdings mit Vielfachheit 4). Die Anzahl der <i>verschiedenen</i> Nullstellen ist also ungerade, die Behauptung damit falsch. Zählt man die Vielfachheiten mit, stimmt die Aussage über Vorzeichenwechsel wieder; \\(x^4 + 1\\) hat übrigens gar keine reelle Nullstelle." },
      { id: 36, level: 6, typ: "numerisch", frage: "Eine ganzrationale Funktion dritten Grades hat die Nullstellen \\(-2\\), \\(0\\) und \\(3\\); ihr Graph verläuft durch den Punkt \\(P(1 \\mid 12)\\). Bestimme den Leitkoeffizienten \\(a\\).", loesung: -2, toleranz: 0, tipp: "Setze zuerst die Produktform mit unbekanntem Vorfaktor an und nutze den Punkt als zweite Bedingung.", loesungsweg: "Ansatz aus den Nullstellen: $$f(x) = a \\cdot x(x+2)(x-3)$$ Punktprobe mit \\(P(1 \\mid 12)\\): $$a \\cdot 1 \\cdot 3 \\cdot (-2) = -6a = 12 \\;\\Longrightarrow\\; a = -2$$ Die Funktion lautet \\(f(x) = -2x^3 + 2x^2 + 12x\\). Ohne den Punkt wäre die Funktion nur bis auf den Streckfaktor bestimmt." }];
    </script>
