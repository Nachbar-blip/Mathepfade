<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logarithmus - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-logarithmus';
    const THEMA_CONFIG = { name: 'Logarithmus', bereich: 'analysis' };
    const AUFGABEN = [
      // ========== LEVEL 1 -- babyleicht ==========
      { id: 1, level: 1, typ: "mc", frage: "Was bedeutet \\(\\log_2 8 = 3\\)?", optionen: ["\\(2 \\cdot 8 = 3\\)", "\\(2^3 = 8\\)", "\\(3^2 = 8\\)", "\\(\\frac{8}{2} = 3\\)"], korrekt: 1, tipp: "Logarithmus = gesuchter Exponent.", loesungsweg: "\\(\\log_2 8 = 3\\) bedeutet: Mit welchem Exponenten muss man \\(2\\) potenzieren, um \\(8\\) zu erhalten? Antwort: \\(3\\), weil \\(2^3 = 8\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "Berechne \\(\\log_2 16\\).", loesung: 4, toleranz: 0, tipp: "\\(2^? = 16\\).", loesungsweg: "\\(2^4 = 16\\), also \\(\\log_2 16 = 4\\)." },
      { id: 3, level: 1, typ: "numerisch", frage: "Berechne \\(\\log_{10} 100\\).", loesung: 2, toleranz: 0, tipp: "\\(10^? = 100\\).", loesungsweg: "\\(10^2 = 100\\), also \\(\\log_{10} 100 = 2\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne \\(\\log_{10} 1000\\).", loesung: 3, toleranz: 0, tipp: "\\(10^3 = 1000\\).", loesungsweg: "Der Logarithmus beantwortet die Frage: Mit welchem Exponenten muss man die Basis versehen? $$10^x = 1000 \\;\\Rightarrow\\; x = 3$$ Also \\(\\log_{10} 1000 = 3\\). Bei Zehnerpotenzen ist das einfach die Anzahl der Nullen." },
      { id: 5, level: 1, typ: "numerisch", frage: "\\(\\log_a 1 = ?\\) (für beliebige Basis \\(a > 0\\))", loesung: 0, toleranz: 0, tipp: "\\(a^0 = 1\\).", loesungsweg: "Es gilt stets \\(\\log_a 1 = 0\\), da \\(a^0 = 1\\)." },
      { id: 6, level: 1, typ: "numerisch", frage: "\\(\\log_a a = ?\\)", loesung: 1, toleranz: 0, tipp: "\\(a^1 = a\\).", loesungsweg: "Stets \\(\\log_a a = 1\\), da \\(a^1 = a\\)." },
      // ========== LEVEL 2 -- leicht ==========
      { id: 7, level: 2, typ: "numerisch", frage: "Berechne \\(\\log_3 27\\).", loesung: 3, toleranz: 0, tipp: "\\(3^3 = 27\\).", loesungsweg: "$$3^x = 27 = 3^3 \\;\\Rightarrow\\; x = 3$$ Also \\(\\log_3 27 = 3\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Berechne \\(\\log_5 125\\).", loesung: 3, toleranz: 0, tipp: "\\(5^3 = 125\\).", loesungsweg: "$$5^x = 125 = 5^3 \\;\\Rightarrow\\; x = 3$$ Der Trick besteht jedes Mal darin, den Numerus als Potenz der Basis zu schreiben." },
      { id: 9, level: 2, typ: "numerisch", frage: "Berechne \\(\\log_2 \\frac{1}{4}\\).", loesung: -2, toleranz: 0, tipp: "\\(\\frac{1}{4} = 2^{-2}\\).", loesungsweg: "\\(\\log_2 \\frac{1}{4} = \\log_2 2^{-2} = -2\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Berechne \\(\\log_{10} 0{,}01\\).", loesung: -2, toleranz: 0, tipp: "\\(0{,}01 = 10^{-2}\\).", loesungsweg: "$$10^x = 0{,}01 = 10^{-2} \\;\\Rightarrow\\; x = -2$$ Für Numeri zwischen \\(0\\) und \\(1\\) ist der Logarithmus stets <b>negativ</b>. Für \\(x \\le 0\\) ist er dagegen gar nicht definiert, denn eine positive Basis liefert nie null oder einen negativen Wert." },
      { id: 11, level: 2, typ: "mc", frage: "Was ist der Definitionsbereich von \\(f(x) = \\log_a x\\)?", optionen: ["\\(\\mathbb{R}\\)", "\\(\\mathbb{R}_{> 0}\\)", "\\(\\mathbb{R}_{\\geq 0}\\)", "\\(\\mathbb{Z}\\)"], korrekt: 1, tipp: "Nur positive Argumente.", loesungsweg: "Der Logarithmus ist nur für \\(x > 0\\) definiert: \\(D = \\mathbb{R}_{> 0}\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Berechne \\(\\log_2 64\\).", loesung: 6, toleranz: 0, tipp: "\\(2^6 = 64\\).", loesungsweg: "\\(2^6 = 64\\), also \\(\\log_2 64 = 6\\)." },
      // ========== LEVEL 3 -- nervenschonend ==========
      { id: 13, level: 3, typ: "numerisch", frage: "Logarithmusgesetz: \\(\\log_a(xy) = \\log_a x + \\log_a y\\). Berechne \\(\\log_2(4 \\cdot 8)\\).", loesung: 5, toleranz: 0, tipp: "\\(\\log_2 4 + \\log_2 8 = 2 + 3\\).", loesungsweg: "\\(\\log_2 4 + \\log_2 8 = 2 + 3 = 5\\). Kontrolle: \\(\\log_2 32 = 5\\) ✓" },
      { id: 14, level: 3, typ: "numerisch", frage: "\\(\\log_a \\frac{x}{y} = \\log_a x - \\log_a y\\). Berechne \\(\\log_2 \\frac{64}{4}\\).", loesung: 4, toleranz: 0, tipp: "\\(6 - 2 = 4\\).", loesungsweg: "\\(\\log_2 64 - \\log_2 4 = 6 - 2 = 4\\). Kontrolle: \\(\\log_2 16 = 4\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "\\(\\log_a(x^n) = n \\cdot \\log_a x\\). Berechne \\(\\log_2 8^3\\).", loesung: 9, toleranz: 0, tipp: "\\(3 \\cdot \\log_2 8 = 3 \\cdot 3\\).", loesungsweg: "\\(\\log_2 8^3 = 3 \\cdot \\log_2 8 = 3 \\cdot 3 = 9\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Vereinfache \\(\\log_a x + \\log_a y\\).", optionen: ["\\(\\log_a(x + y)\\)", "\\(\\log_a(xy)\\)", "\\(\\log_a(x \\cdot a^y)\\)", "\\(\\log_a\\frac{x}{y}\\)"], korrekt: 1, tipp: "1. Logarithmusgesetz.", loesungsweg: "Das erste Logarithmusgesetz macht aus einem Produkt eine Summe: $$\\log_a x + \\log_a y = \\log_a(xy)$$ Es folgt unmittelbar aus \\(a^m \\cdot a^n = a^{m+n}\\). Die Zusammenfassung zu \\(\\log_a(x+y)\\) wäre falsch — für Summen im Numerus gibt es kein Gesetz." },
      { id: 17, level: 3, typ: "mc", frage: "Vereinfache \\(\\log_a x - \\log_a y\\).", optionen: ["\\(\\log_a(x - y)\\)", "\\(\\log_a \\frac{x}{y}\\)", "\\(\\log_a(x \\cdot y)\\)", "\\(\\log_a \\frac{y}{x}\\)"], korrekt: 1, tipp: "2. Logarithmusgesetz.", loesungsweg: "Entsprechend wird aus der Differenz ein Quotient: $$\\log_a x - \\log_a y = \\log_a \\frac{x}{y}$$ Auf die Reihenfolge kommt es an: \\(\\tfrac xy\\), nicht \\(\\tfrac yx\\). Grundlage ist \\(\\tfrac{a^m}{a^n} = a^{m-n}\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Berechne \\(\\log_3 81\\).", loesung: 4, toleranz: 0, tipp: "\\(3^4 = 81\\).", loesungsweg: "$$3^x = 81 = 3^4 \\;\\Rightarrow\\; x = 4$$ Denn \\(3 \\cdot 3 \\cdot 3 \\cdot 3 = 81\\)." },
      // ========== LEVEL 4 -- mittel ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Löse \\(2^x = 16\\).", loesung: 4, toleranz: 0, tipp: "\\(x = \\log_2 16\\).", loesungsweg: "\\(x = \\log_2 16 = 4\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Löse \\(3^x = \\frac{1}{9}\\).", loesung: -2, toleranz: 0, tipp: "\\(\\frac{1}{9} = 3^{-2}\\).", loesungsweg: "\\(3^x = 3^{-2} \\implies x = -2\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Berechne \\(\\log_2 32 + \\log_2 2\\).", loesung: 6, toleranz: 0, tipp: "\\(5 + 1\\).", loesungsweg: "\\(5 + 1 = 6\\). Oder: \\(\\log_2(32 \\cdot 2) = \\log_2 64 = 6\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Berechne \\(\\log_{10} 10000 - \\log_{10} 10\\).", loesung: 3, toleranz: 0, tipp: "\\(4 - 1\\).", loesungsweg: "\\(4 - 1 = 3\\). Oder: \\(\\log_{10} 1000 = 3\\)." },
      { id: 23, level: 4, typ: "mc", frage: "\\(\\log_a a^n = ?\\)", optionen: ["\\(a\\)", "\\(n\\)", "\\(a \\cdot n\\)", "\\(1\\)"], korrekt: 1, tipp: "Umkehrfunktion.", loesungsweg: "Logarithmus und Potenz zur selben Basis sind Umkehrfunktionen, sie heben einander auf: $$\\log_a a^n = n$$ Das ist die definierende Eigenschaft des Logarithmus. Ebenso gilt umgekehrt \\(a^{\\log_a x} = x\\)." },
      { id: 24, level: 4, typ: "numerisch", frage: "Berechne \\(\\log_2 \\sqrt{2}\\) als Dezimalzahl.", loesung: 0.5, toleranz: 0.01, tipp: "\\(\\sqrt{2} = 2^{1/2}\\).", loesungsweg: "\\(\\log_2 2^{1/2} = \\frac{1}{2} = 0{,}5\\)." },
      // ========== LEVEL 5 -- anspruchsvoll ==========
      { id: 25, level: 5, typ: "mc", frage: "In einer Rechnung steht: „\\(\\lg(8 + 2) = \\lg 8 + \\lg 2\\)\u201c. Wie ist dieser Schritt zu bewerten?", optionen: ["Richtig, so lautet das Summengesetz", "Falsch, das Gesetz gilt für Produkte", "Falsch, man muss subtrahieren", "Richtig, aber nur zur Basis 10"], korrekt: 1, tipp: "Setze auf beiden Seiten die Zahlenwerte ein und vergleiche die Ergebnisse.", loesungsweg: "Probe: Links steht \\(\\lg 10 = 1\\), rechts $$\\lg 8 + \\lg 2 = \\lg(8 \\cdot 2) = \\lg 16 \\approx 1{,}204$$ Die Werte stimmen nicht überein. Das Gesetz \\(\\log(a \\cdot b) = \\log a + \\log b\\) gilt für <b>Produkte</b>, nicht für Summen — für \\(\\log(a+b)\\) gibt es keine Zerlegung." },
      { id: 26, level: 5, typ: "numerisch", frage: "Berechne \\(\\log_2\\left(\\sqrt{8} \\cdot 4\\right)\\) als Dezimalzahl.", loesung: 3.5, toleranz: 0.01, tipp: "Schreibe beide Faktoren als Potenzen derselben Basis und fasse zusammen.", loesungsweg: "Beide Faktoren als Zweierpotenzen: $$\\sqrt{8} = 8^{1/2} = 2^{3/2}, \\qquad 4 = 2^2$$ Produkt: \\(2^{3/2} \\cdot 2^2 = 2^{7/2}\\), also $$\\log_2 2^{7/2} = \\tfrac72 = 3{,}5$$ Alternativ über das Produktgesetz: \\(\\log_2\\sqrt8 + \\log_2 4 = 1{,}5 + 2\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für \\(f(x) = \\log_a x\\) gilt \\(f(81) = 4\\). Bestimme die Basis \\(a\\).", loesung: 3, toleranz: 0, tipp: "Schreibe die Bedingung als Potenzgleichung um.", loesungsweg: "Die Logarithmengleichung in Potenzform: $$\\log_a 81 = 4 \\;\\Longleftrightarrow\\; a^4 = 81$$ Wegen \\(3^4 = 81\\) und \\(a > 0\\) ist \\(a = 3\\). Die negative Lösung \\(-3\\) scheidet aus, weil die Basis eines Logarithmus positiv sein muss." },
      { id: 28, level: 5, typ: "numerisch", frage: "Löse die Gleichung \\(3 \\cdot 2^{x+1} = 96\\).", loesung: 4, toleranz: 0, tipp: "Isoliere zuerst die Potenz, bevor du die Exponenten vergleichst.", loesungsweg: "Durch \\(3\\) teilen: \\(2^{x+1} = 32\\). Beide Seiten als Zweierpotenz: $$2^{x+1} = 2^5 \\;\\Longrightarrow\\; x + 1 = 5 \\;\\Longrightarrow\\; x = 4$$ Probe: \\(3 \\cdot 2^5 = 3 \\cdot 32 = 96\\) ✓" },
      { id: 29, level: 5, typ: "numerisch", frage: "Berechne \\(\\log_5\\left(x^3\\right) - 3 \\cdot \\log_5 x\\) für \\(x = 7\\).", loesung: 0, toleranz: 0, tipp: "Vereinfache den Term mit dem Potenzgesetz für Logarithmen, bevor du einsetzt.", loesungsweg: "Nach dem Potenzgesetz ist \\(\\log_5(x^3) = 3\\log_5 x\\). Damit gilt $$3\\log_5 x - 3\\log_5 x = 0$$ für <b>jedes</b> zulässige \\(x\\), also auch für \\(x = 7\\). Der konkrete Wert \\(\\log_5 7 \\approx 1{,}209\\) wird gar nicht gebraucht." },
      { id: 30, level: 5, typ: "numerisch", frage: "Berechne \\(\\log_4 32\\) als Dezimalzahl.", loesung: 2.5, toleranz: 0.01, tipp: "Führe Basis und Numerus auf dieselbe kleinere Basis zurück.", loesungsweg: "Mit \\(4 = 2^2\\) und \\(32 = 2^5\\) suchen wir \\(y\\) mit \\(4^y = 32\\): $$\\left(2^2\\right)^y = 2^5 \\;\\Longrightarrow\\; 2y = 5 \\;\\Longrightarrow\\; y = 2{,}5$$ Probe: \\(4^{2{,}5} = 4^2 \\cdot \\sqrt4 = 16 \\cdot 2 = 32\\) ✓" },
      // ========== LEVEL 6 -- wagnerisch ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Für alle positiven Zahlen \\(a\\) und \\(b\\) gilt \\(\\lg(a \\cdot b) = \\lg a \\cdot \\lg b\\).\u201c Prüfe die Behauptung.", optionen: ["Richtig, so lautet das Produktgesetz", "Falsch, rechts müsste addiert werden", "Richtig, sofern beide größer 1 sind", "Falsch, links müsste geteilt werden"], korrekt: 1, tipp: "Suche ein Gegenbeispiel mit bequemen Zehnerpotenzen.", loesungsweg: "Gegenbeispiel \\(a = b = 10\\): Links steht \\(\\lg 100 = 2\\), rechts $$\\lg 10 \\cdot \\lg 10 = 1 \\cdot 1 = 1$$ Die Behauptung ist also <b>falsch</b>. Richtig lautet das Gesetz \\(\\lg(a\\cdot b) = \\lg a + \\lg b\\): Ein Produkt im Numerus wird zur Summe, weil beim Multiplizieren von Potenzen die Exponenten addiert werden." },
      { id: 32, level: 6, typ: "numerisch", frage: "Gegeben sind \\(\\log_2 1\\), \\(\\log_2 0{,}5\\), \\(\\log_2 8\\) und \\(\\log_2 0{,}25\\). Wie viele dieser vier Werte sind negativ?", loesung: 2, toleranz: 0, tipp: "Vergleiche je Numerus mit der Zahl \\(1\\) und überlege, welcher Exponent dann nötig ist.", loesungsweg: "Fallunterscheidung bei Basis \\(2 > 1\\): Für einen Numerus größer \\(1\\) ist der Logarithmus positiv, für \\(1\\) genau null, für einen Numerus zwischen \\(0\\) und \\(1\\) negativ. $$\\log_2 0{,}5 = -1, \\qquad \\log_2 0{,}25 = -2$$ Dagegen sind \\(\\log_2 1 = 0\\) und \\(\\log_2 8 = 3\\) nicht negativ. Es sind also <b>2</b> Werte." },
      { id: 33, level: 6, typ: "numerisch", frage: "Für \\(f(x) = c \\cdot \\log_2 x\\) gilt \\(f(8) = 12\\). Berechne \\(f(32)\\).", loesung: 20, toleranz: 0, tipp: "Bestimme aus der ersten Angabe den Faktor und setze dann die zweite Stelle ein.", loesungsweg: "Aus \\(f(8) = c \\cdot \\log_2 8 = 3c = 12\\) folgt \\(c = 4\\). Damit $$f(32) = 4 \\cdot \\log_2 32 = 4 \\cdot 5 = 20$$ Obwohl \\(32\\) das Vierfache von \\(8\\) ist, wächst der Funktionswert nur um \\(8\\) — der Logarithmus wächst sehr langsam." },
      { id: 34, level: 6, typ: "mc", frage: "Wie verhält sich \\(f(x) = \\log_a x\\) mit \\(a > 1\\) im Vergleich zu einer Potenzfunktion \\(x^c\\) mit \\(c > 0\\) für große \\(x\\)?", optionen: ["Sie wächst schneller als jede Potenzfunktion", "Sie wächst langsamer als jede Potenzfunktion", "Sie ist für große \\(x\\) konstant", "Sie fällt für alle \\(x > 1\\) streng"], korrekt: 1, tipp: "Vergleiche beide an einer sehr großen Zehnerpotenz, etwa an einer Million.", loesungsweg: "Beispiel \\(a = 10\\), \\(c = 0{,}5\\) an der Stelle \\(x = 10^6\\): $$\\lg 10^6 = 6 \\qquad \\text{gegen} \\qquad \\sqrt{10^6} = 1000$$ Der Logarithmus bleibt weit zurück und wächst <b>langsamer</b> als jede Potenzfunktion mit positivem Exponenten. Anschaulich: Damit der Logarithmus um \\(1\\) steigt, muss der Numerus mit \\(a\\) multipliziert werden." },
      { id: 35, level: 6, typ: "numerisch", frage: "Für welche kleinste ganze Zahl \\(x\\) ist der Term \\(\\log_3(x - 4)\\) definiert?", loesung: 5, toleranz: 0, tipp: "Überlege, welche Werte der Numerus eines Logarithmus annehmen darf.", loesungsweg: "Der Numerus muss echt positiv sein: $$x - 4 > 0 \\;\\Longrightarrow\\; x > 4$$ Die kleinste ganze Zahl darüber ist <b>5</b>; \\(x = 4\\) scheidet aus, weil \\(\\log_3 0\\) nicht existiert — keine Potenz von \\(3\\) ergibt null." },
      { id: 36, level: 6, typ: "numerisch", frage: "Wie viele Stellen hat die Zahl \\(2^{30}\\) im Dezimalsystem? Bekannt ist \\(\\lg 2 \\approx 0{,}301\\).", loesung: 10, toleranz: 0, tipp: "Der dekadische Logarithmus einer Zahl sagt, zwischen welchen Zehnerpotenzen sie liegt.", loesungsweg: "Mit dem Potenzgesetz: $$\\lg 2^{30} = 30 \\cdot 0{,}301 = 9{,}03$$ Die Zahl liegt also zwischen \\(10^9\\) und \\(10^{10}\\) und hat damit <b>10</b> Stellen (Stellenzahl = Exponent der unteren Zehnerpotenz plus eins). Probe: \\(2^{30} = 1\\,073\\,741\\,824\\)." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
