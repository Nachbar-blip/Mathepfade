<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK: Newton-Verfahren - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-lk-newton';
    const THEMA_CONFIG = { name: 'LK: Newton-Verfahren', bereich: 'analysis' };
    const AUFGABEN = [
      // L1
      { id:1, level:1, typ:"mc", frage:"Newton-Iteration:", optionen:["\\(x_{n+1}=x_n-f(x_n)\\)","\\(x_{n+1}=x_n-\\frac{f(x_n)}{f'(x_n)}\\)","\\(x_{n+1}=x_n+f(x_n)\\)","\\(x_{n+1}=\\frac{f'(x_n)}{f(x_n)}\\)"], korrekt:1, tipp:"Standardformel.", loesungsweg:"Man ersetzt die Funktion an der Stelle \\(x_n\\) durch ihre Tangente und nimmt deren Nullstelle als nächste Näherung. Die Tangente \\(y = f(x_n) + f'(x_n)(x - x_n)\\) wird null bei $$x_{n+1} = x_n - \\frac{f(x_n)}{f'(x_n)}$$ Die Ableitung im Nenner ist also kein Zufall, sondern die Steigung der Tangente." },
      { id:2, level:1, typ:"mc", frage:"Zweck des Newton-Verfahrens:", optionen:["Ableitungen bestimmen","Nullstellen näherungsweise finden","Integrale berechnen","Extrema finden"], korrekt:1, tipp:"Iteratives Nullstellenverfahren.", loesungsweg:"Viele Gleichungen lassen sich nicht exakt auflösen — etwa \\(\\cos x = x\\). Das Newton-Verfahren liefert dafür eine <b>Näherung</b>, die sich mit jedem Schritt verbessert. Für Extrema wendet man es auf \\(f'\\) statt auf \\(f\\) an." },
      { id:3, level:1, typ:"mc", frage:"Wann versagt Newton?", optionen:["\\(f'(x_n)=0\\)","\\(f(x_n)>0\\)","\\(x_n>0\\)","nie"], korrekt:0, tipp:"Division.", loesungsweg:"Bei \\(f'(x_n)=0\\) Division durch Null." },
      { id:4, level:1, typ:"numerisch", frage:"\\(f(x)=x^2-2\\), Startwert 1. \\(x_1\\) (gerundet)?", loesung:1.5, toleranz:0.01, tipp:"\\(1-\\frac{-1}{2}=1{,}5\\).", loesungsweg:"\\(x_1=1-\\frac{-1}{2}=1{,}5\\)." },
      { id:5, level:1, typ:"numerisch", frage:"\\(f(x)=x^2-2\\), \\(x_0=1\\): \\(x_2\\) (gerundet)?", loesung:1.417, toleranz:0.01, tipp:"\\(1{,}5-\\frac{0{,}25}{3}\\).", loesungsweg:"Erster Schritt: \\(f(1) = -1\\), \\(f'(1) = 2\\), also \\(x_1 = 1 + \\tfrac12 = 1{,}5\\). Zweiter Schritt mit \\(f(1{,}5) = 0{,}25\\) und \\(f'(1{,}5) = 3\\): $$x_2 = 1{,}5 - \\frac{0{,}25}{3} \\approx 1{,}4167$$" },
      { id:6, level:1, typ:"numerisch", frage:"\\(f(x)=x^2-2\\), \\(x_0=1\\): Die Iteration konvergiert gegen? (gerundet)", loesung:1.414, toleranz:0.01, tipp:"\\(\\sqrt 2\\).", loesungsweg:"Die Iteration sucht die Nullstelle von \\(x^2 - 2\\), also die Lösung von \\(x^2 = 2\\): $$\\sqrt{2} \\approx 1{,}4142$$ Schon \\(x_2 \\approx 1{,}4167\\) stimmt auf zwei Nachkommastellen — das Verfahren verdoppelt die Zahl der richtigen Stellen bei jedem Schritt." },
      // L2
      { id:7, level:2, typ:"numerisch", frage:"\\(f(x)=x^2-5\\), \\(x_0=2\\). \\(x_1\\) (gerundet)?", loesung:2.25, toleranz:0.01, tipp:"\\(f(2)=-1, f'(2)=4\\).", loesungsweg:"Mit \\(f(2) = 4 - 5 = -1\\) und \\(f'(x) = 2x\\), also \\(f'(2) = 4\\): $$x_1 = 2 - \\frac{-1}{4} = 2 + 0{,}25 = 2{,}25$$" },
      { id:8, level:2, typ:"numerisch", frage:"\\(f(x)=x^2-5\\), \\(x_0=2\\): \\(x_2\\) (gerundet)?", loesung:2.2361, toleranz:0.005, tipp:"\\(f(2{,}25)=0{,}0625, f'(2{,}25)=4{,}5\\).", loesungsweg:"Mit \\(f(2{,}25) = 5{,}0625 - 5 = 0{,}0625\\) und \\(f'(2{,}25) = 4{,}5\\): $$x_2 = 2{,}25 - \\frac{0{,}0625}{4{,}5} \\approx 2{,}2361$$" },
      { id:9, level:2, typ:"numerisch", frage:"\\(f(x)=x^2-5\\), \\(x_0=2\\): Grenzwert (gerundet)?", loesung:2.236, toleranz:0.005, tipp:"\\(\\sqrt 5\\).", loesungsweg:"Gesucht ist die Nullstelle von \\(x^2 - 5\\), also $$\\sqrt{5} \\approx 2{,}2361$$ Bereits \\(x_2\\) trifft diesen Wert auf vier Nachkommastellen." },
      { id:10, level:2, typ:"numerisch", frage:"\\(f(x)=x^3-x-1\\), \\(x_0=1\\). \\(x_1\\) (gerundet)?", loesung:1.5, toleranz:0.01, tipp:"\\(f(1)=-1, f'(1)=2\\).", loesungsweg:"Mit \\(f(1) = 1 - 1 - 1 = -1\\) und \\(f'(x) = 3x^2 - 1\\), also \\(f'(1) = 2\\): $$x_1 = 1 - \\frac{-1}{2} = 1{,}5$$" },
      { id:11, level:2, typ:"numerisch", frage:"\\(f(x)=x^3-x-1\\), \\(x_0=1\\): \\(x_2\\) (gerundet)?", loesung:1.3478, toleranz:0.01, tipp:"\\(f(1{,}5)=0{,}875, f'(1{,}5)=5{,}75\\).", loesungsweg:"Mit \\(f(1{,}5) = 3{,}375 - 1{,}5 - 1 = 0{,}875\\) und \\(f'(1{,}5) = 3 \\cdot 2{,}25 - 1 = 5{,}75\\): $$x_2 = 1{,}5 - \\frac{0{,}875}{5{,}75} \\approx 1{,}3478$$" },
      { id:12, level:2, typ:"numerisch", frage:"Nullstelle (gerundet)?", loesung:1.3247, toleranz:0.005, tipp:"Plastische Zahl.", loesungsweg:"Die Folge konvergiert gegen die einzige reelle Nullstelle von \\(x^3 - x - 1\\): $$x \\approx 1{,}3247$$ Diese Zahl heißt plastische Zahl; sie lässt sich nicht als Bruch oder Wurzelausdruck einfacher Art schreiben — genau deshalb braucht es ein Näherungsverfahren." },
      // L3
      { id:13, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-2\\), \\(x_0=1\\). \\(x_1\\) (gerundet)?", loesung:1.333, toleranz:0.01, tipp:"\\(f(1)=-1, f'(1)=3\\).", loesungsweg:"Mit \\(f(1) = -1\\) und \\(f'(x) = 3x^2\\), also \\(f'(1) = 3\\): $$x_1 = 1 - \\frac{-1}{3} = \\frac{4}{3} \\approx 1{,}333$$" },
      { id:14, level:3, typ:"numerisch", frage:"\\(f(x)=x^3-2\\), \\(x_0=1\\): Die Iteration konvergiert gegen? (gerundet)", loesung:1.26, toleranz:0.01, tipp:"\\(\\sqrt[3]{2}\\).", loesungsweg:"Gesucht ist die Nullstelle von \\(x^3 - 2\\), also $$\\sqrt[3]{2} \\approx 1{,}2599$$" },
      { id:15, level:3, typ:"numerisch", frage:"\\(f(x)=\\cos x - x\\), \\(x_0=1\\). \\(x_1\\) (gerundet)?", loesung:0.7504, toleranz:0.02, tipp:"\\(f(1)=\\cos1-1\\approx -0{,}4597, f'(1)=-\\sin1-1\\approx -1{,}8415\\).", loesungsweg:"Mit \\(f(x) = \\cos x - x\\) ist \\(f'(x) = -\\sin x - 1\\). An der Stelle \\(1\\): \\(f(1) \\approx -0{,}4597\\), \\(f'(1) \\approx -1{,}8415\\). $$x_1 = 1 - \\frac{-0{,}4597}{-1{,}8415} \\approx 1 - 0{,}2496 = 0{,}7504$$ Beide Vorzeichen sind negativ — der Quotient wird dadurch positiv und <b>verkleinert</b> den Startwert." },
      { id:16, level:3, typ:"numerisch", frage:"\\(f(x)=\\cos x - x\\), \\(x_0=1\\): Grenzwert (gerundet)?", loesung:0.739, toleranz:0.01, tipp:"Dottie-Zahl.", loesungsweg:"Die Folge nähert sich der Lösung von \\(\\cos x = x\\): $$x \\approx 0{,}7391$$ Diese Zahl heißt Dottie-Zahl. Sie ist der einzige Fixpunkt des Kosinus und lässt sich nicht geschlossen darstellen." },
      { id:17, level:3, typ:"numerisch", frage:"\\(f(x)=e^x-2\\), \\(x_0=1\\). \\(x_1\\) (gerundet)?", loesung:0.736, toleranz:0.02, tipp:"\\(f(1)=e-2\\approx 0{,}7183, f'(1)=e\\).", loesungsweg:"Mit \\(f(1) = e - 2 \\approx 0{,}7183\\) und \\(f'(x) = e^x\\), also \\(f'(1) = e \\approx 2{,}7183\\): $$x_1 = 1 - \\frac{0{,}7183}{2{,}7183} \\approx 1 - 0{,}2642 = 0{,}736$$" },
      { id:18, level:3, typ:"numerisch", frage:"Grenzwert: \\(\\ln 2\\) (gerundet)?", loesung:0.693, toleranz:0.01, tipp:"\\(\\ln 2\\).", loesungsweg:"Die Nullstelle von \\(e^x - 2\\) ist die Lösung von \\(e^x = 2\\): $$x = \\ln 2 \\approx 0{,}6931$$ Schon der erste Schritt lag mit \\(0{,}736\\) recht nah daran." },
      // L4
      { id:19, level:4, typ:"numerisch", frage:"\\(f(x)=x^2-3\\), \\(x_0=2\\). \\(x_2\\) (gerundet)?", loesung:1.732, toleranz:0.01, tipp:"\\(x_1=1{,}75\\), dann weiter.", loesungsweg:"Erster Schritt: \\(f(2) = 1\\), \\(f'(2) = 4\\), also \\(x_1 = 2 - \\tfrac14 = 1{,}75\\). Zweiter Schritt mit \\(f(1{,}75) = 0{,}0625\\) und \\(f'(1{,}75) = 3{,}5\\): $$x_2 = 1{,}75 - \\frac{0{,}0625}{3{,}5} \\approx 1{,}7321$$ Das ist bereits \\(\\sqrt3\\) auf vier Nachkommastellen." },
      { id:20, level:4, typ:"numerisch", frage:"\\(f(x)=x-\\cos x\\), \\(x_0=0{,}5\\). \\(x_1\\) (gerundet)?", loesung:0.755, toleranz:0.02, tipp:"\\(f(0{,}5)=0{,}5-0{,}8776=-0{,}3776\\), \\(f'(0{,}5)=1+\\sin0{,}5=1{,}479\\).", loesungsweg:"Mit \\(f(x) = x - \\cos x\\) ist \\(f'(x) = 1 + \\sin x\\). An der Stelle \\(0{,}5\\): \\(f(0{,}5) \\approx 0{,}5 - 0{,}8776 = -0{,}3776\\), \\(f'(0{,}5) \\approx 1{,}4794\\). $$x_1 = 0{,}5 + \\frac{0{,}3776}{1{,}4794} \\approx 0{,}755$$" },
      { id:21, level:4, typ:"mc", frage:"Konvergenzordnung Newton typisch:", optionen:["linear","quadratisch","kubisch","langsam"], korrekt:1, tipp:"Fehler quadriert sich.", loesungsweg:"Quadratische Konvergenz (bei einfacher NST)." },
      { id:22, level:4, typ:"numerisch", frage:"\\(f(x)=x^2-x-1\\), \\(x_0=1\\). \\(x_1\\) (gerundet)?", loesung:2, toleranz:0, tipp:"\\(f(1)=-1, f'(1)=1\\).", loesungsweg:"Mit \\(f(1) = 1 - 1 - 1 = -1\\) und \\(f'(x) = 2x - 1\\), also \\(f'(1) = 1\\): $$x_1 = 1 - \\frac{-1}{1} = 2$$ Der erste Schritt springt also recht weit — das Verfahren korrigiert das in den folgenden Schritten." },
      { id:23, level:4, typ:"numerisch", frage:"\\(f(x)=x^2-x-1\\), \\(x_0=1\\): \\(x_2\\) (gerundet)?", loesung:1.6667, toleranz:0.01, tipp:"\\(f(2)=1, f'(2)=3\\).", loesungsweg:"Mit \\(f(2) = 4 - 2 - 1 = 1\\) und \\(f'(2) = 3\\): $$x_2 = 2 - \\frac{1}{3} \\approx 1{,}6667$$" },
      { id:24, level:4, typ:"numerisch", frage:"Grenzwert (Goldener Schnitt, gerundet)?", loesung:1.618, toleranz:0.01, tipp:"\\(\\phi\\).", loesungsweg:"Die positive Nullstelle von \\(x^2 - x - 1\\) ist der Goldene Schnitt: $$\\varphi = \\frac{1+\\sqrt5}{2} \\approx 1{,}618$$" },
      // L5
      { id:25, level:5, typ:"numerisch", frage:"\\(f(x)=x^3-3x+1\\), \\(x_0=1\\). \\(x_1\\) (gerundet)?", loesung:1, toleranz:0, tipp:"\\(f(1)=-1, f'(1)=0\\). Problem!", loesungsweg:"Division durch 0! Newton versagt. Iteration würde divergieren — bleibt formal undefiniert; als „nicht definiert\" markieren." },
      { id:26, level:5, typ:"numerisch", frage:"\\(f(x)=x^3-3x+1\\), \\(x_0=2\\): \\(x_1\\) (gerundet)?", loesung:1.667, toleranz:0.02, tipp:"\\(f(2)=3, f'(2)=9\\).", loesungsweg:"Mit \\(f(2) = 8 - 6 + 1 = 3\\) und \\(f'(x) = 3x^2 - 3\\), also \\(f'(2) = 9\\): $$x_1 = 2 - \\frac{3}{9} = 2 - \\frac13 \\approx 1{,}667$$" },
      { id:27, level:5, typ:"numerisch", frage:"\\(f(x)=\\tan x - x\\), \\(x_0=4{,}5\\). \\(x_1\\) (gerundet)?", loesung:4.49, toleranz:0.1, tipp:"Sorgfältig rechnen.", loesungsweg:"Mit \\(f(x) = \\tan x - x\\) ist \\(f'(x) = \\frac{1}{\\cos^2 x} - 1 = \\tan^2 x\\). An der Stelle \\(4{,}5\\): \\(\\tan 4{,}5 \\approx 4{,}637\\), also \\(f \\approx 0{,}137\\) und \\(f' \\approx 21{,}5\\). $$x_1 = 4{,}5 - \\frac{0{,}137}{21{,}5} \\approx 4{,}494$$ Bei der Tangensfunktion ist Vorsicht geboten: In der Nähe der Polstellen wird \\(f'\\) sehr groß und das Verfahren springt weit." },
      { id:28, level:5, typ:"mc", frage:"Abbruchkriterium typisch:", optionen:["\\(|x_{n+1}-x_n|<\\epsilon\\)","\\(n=100\\)","\\(f(x_n)=\\infty\\)","nie"], korrekt:0, tipp:"Differenz klein.", loesungsweg:"Da die exakte Nullstelle unbekannt ist, kann man den Fehler nicht direkt messen. Stattdessen bricht man ab, wenn sich die Näherung kaum noch ändert: $$|x_{n+1} - x_n| < \\varepsilon$$ Eine feste Schrittzahl wäre willkürlich — mal zu früh, mal verschwenderisch." },
      { id:29, level:5, typ:"numerisch", frage:"\\(f(x)=x^2-a\\) Newton-Iter \\(x_{n+1}=\\frac{x_n+a/x_n}{2}\\): für \\(a=10, x_0=3\\), \\(x_1\\)?", loesung:3.167, toleranz:0.01, tipp:"\\((3+10/3)/2\\).", loesungsweg:"Dies ist das Heron-Verfahren, ein Sonderfall des Newton-Verfahrens für \\(f(x) = x^2 - a\\): $$x_1 = \\frac{3 + \\frac{10}{3}}{2} = \\frac{\\frac{19}{3}}{2} = \\frac{19}{6} \\approx 3{,}167$$ Gemittelt werden die Näherung und der zugehörige Quotient \\(a/x_n\\) — einer liegt stets über, der andere unter der Wurzel." },
      { id:30, level:5, typ:"numerisch", frage:"Newton-Iteration \\(x_{n+1}=\\frac{x_n+a/x_n}{2}\\) mit \\(a=10\\), \\(x_0=3\\): \\(x_2\\) (gerundet)?", loesung:3.162, toleranz:0.01, tipp:"Heron.", loesungsweg:"$$x_2 = \\frac{\\frac{19}{6} + \\frac{10}{19/6}}{2} = \\frac{3{,}1667 + 3{,}1579}{2} \\approx 3{,}1623$$ Das ist \\(\\sqrt{10}\\) auf vier Nachkommastellen — nach nur zwei Schritten." },
      // L6
      { id:31, level:6, typ:"numerisch", frage:"\\(f(x)=x\\ln x -1\\), \\(x_0=2\\). \\(x_1\\) (gerundet)?", loesung:1.772, toleranz:0.05, tipp:"\\(f(2)=2\\ln 2-1\\approx 0{,}386\\), \\(f'=\\ln x+1\\approx 1{,}693\\).", loesungsweg:"Mit \\(f(x) = x\\ln x - 1\\) liefert die Produktregel \\(f'(x) = \\ln x + 1\\). An der Stelle \\(2\\): \\(f(2) = 2\\ln 2 - 1 \\approx 0{,}3863\\), \\(f'(2) = \\ln 2 + 1 \\approx 1{,}6931\\). $$x_1 = 2 - \\frac{0{,}3863}{1{,}6931} \\approx 1{,}772$$" },
      { id:32, level:6, typ:"numerisch", frage:"\\(f(x)=x^5-2\\), \\(x_0=1\\). \\(x_1\\) (gerundet)?", loesung:1.2, toleranz:0.01, tipp:"\\(f(1)=-1, f'(1)=5\\).", loesungsweg:"Mit \\(f(1) = 1 - 2 = -1\\) und \\(f'(x) = 5x^4\\), also \\(f'(1) = 5\\): $$x_1 = 1 - \\frac{-1}{5} = 1{,}2$$" },
      { id:33, level:6, typ:"numerisch", frage:"Grenzwert: \\(\\sqrt[5]{2}\\) (gerundet)?", loesung:1.149, toleranz:0.01, tipp:"\\(2^{0{,}2}\\).", loesungsweg:"Gesucht ist die Nullstelle von \\(x^5 - 2\\), also $$\\sqrt[5]{2} = 2^{0{,}2} \\approx 1{,}149$$ Der erste Schritt lieferte \\(1{,}2\\) — schon recht nah." },
      { id:34, level:6, typ:"mc", frage:"Bei doppelter Nullstelle konvergiert Newton:", optionen:["quadratisch","linear","gar nicht","dreimal so schnell"], korrekt:1, tipp:"Langsamer.", loesungsweg:"Nur linear bei mehrfachen Nullstellen." },
      { id:35, level:6, typ:"numerisch", frage:"Heron \\(\\sqrt{50}\\), \\(x_0=7\\), \\(x_1\\)?", loesung:7.071, toleranz:0.01, tipp:"\\((7+50/7)/2\\).", loesungsweg:"Heron-Verfahren für \\(\\sqrt{50}\\) mit dem Startwert \\(7\\): $$x_1 = \\frac{7 + \\frac{50}{7}}{2} = \\frac{7 + 7{,}1429}{2} \\approx 7{,}0714$$ Weil \\(7^2 = 49\\) knapp unter \\(50\\) liegt, ist \\(\\frac{50}{7}\\) knapp darüber — das Mittel trifft die Wurzel fast genau." },
      { id:36, level:6, typ:"numerisch", frage:"Grenzwert \\(\\sqrt{50}\\)?", loesung:7.071, toleranz:0.01, tipp:"Exakt.", loesungsweg:"$$\\sqrt{50} = 5\\sqrt{2} \\approx 7{,}0711$$ Der erste Heron-Schritt lag mit \\(7{,}0714\\) bereits auf drei Nachkommastellen richtig." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
