<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-lk-newton';
    const THEMA_CONFIG = { name: 'ln-Funktion (eA)', bereich: 'analysis' };
    const AUFGABEN = [
      // L1 -- Grundwerte, Umkehrung, Definitionsbereich
      { id:1, level:1, typ:"numerisch", frage:"Berechne \\(\\ln e\\).", loesung:1, toleranz:0, tipp:"Frage dich, mit welchem Exponenten man \\(e\\) potenzieren muss, um \\(e\\) zu erhalten.", loesungsweg:"Der natürliche Logarithmus fragt nach dem Exponenten zur Basis \\(e\\): $$\\ln e = x \\;\\Leftrightarrow\\; e^{x} = e^{1}$$ Also ist \\(x = 1\\). Das ist der Grundgedanke hinter jedem Logarithmus — er ist die Umkehrung des Potenzierens." },
      { id:2, level:1, typ:"numerisch", frage:"Berechne \\(\\ln 1\\).", loesung:0, toleranz:0, tipp:"Welcher Exponent macht aus \\(e\\) die Zahl \\(1\\)?", loesungsweg:"Gesucht ist der Exponent \\(x\\) mit \\(e^{x} = 1\\). Jede Potenz mit dem Exponenten \\(0\\) ergibt \\(1\\): $$e^{0} = 1 \\;\\Rightarrow\\; \\ln 1 = 0$$ Der Graph von \\(\\ln\\) schneidet die \\(x\\)-Achse deshalb genau bei \\(x = 1\\)." },
      { id:3, level:1, typ:"numerisch", frage:"Löse \\(e^{x} = 5\\) und gib \\(x\\) gerundet an.", loesung:1.609, toleranz:0.01, tipp:"Wende auf beiden Seiten die Umkehrfunktion von \\(e^{x}\\) an.", loesungsweg:"Der natürliche Logarithmus hebt die Exponentialfunktion auf: $$e^{x} = 5 \\;\\Rightarrow\\; \\ln\\left(e^{x}\\right) = \\ln 5 \\;\\Rightarrow\\; x = \\ln 5$$ $$x = \\ln 5 \\approx 1{,}6094$$ Probe: \\(e^{1{,}6094} \\approx 5\\)." },
      { id:4, level:1, typ:"mc", frage:"Der Definitionsbereich von \\(f(x) = \\ln x\\) ist:", optionen:["\\(x > 0\\)","\\(x \\geq 0\\)","alle reellen Zahlen","\\(x \\neq 0\\)"], korrekt:0, tipp:"Überlege, welche Werte die Funktion \\(e^{x}\\) überhaupt annimmt.", loesungsweg:"Die Exponentialfunktion \\(e^{x}\\) nimmt ausschließlich <b>positive</b> Werte an. Weil \\(\\ln\\) ihre Umkehrfunktion ist, können auch nur positive Zahlen in den Logarithmus eingesetzt werden: $$D = \\{x \\in \\mathbb{R} \\mid x > 0\\}$$ Für \\(x = 0\\) gibt es keinen Exponenten mit \\(e^{x} = 0\\); der Graph hat dort eine senkrechte Asymptote." },
      { id:5, level:1, typ:"numerisch", frage:"Berechne \\(\\ln\\left(e^{4}\\right)\\).", loesung:4, toleranz:0, tipp:"Logarithmus und Exponentialfunktion heben sich gegenseitig auf.", loesungsweg:"Der Logarithmus gibt den Exponenten zurück: $$\\ln\\left(e^{4}\\right) = 4$$ Allgemein gilt \\(\\ln\\left(e^{a}\\right) = a\\) für jedes reelle \\(a\\) — die beiden Funktionen sind Umkehrfunktionen voneinander." },
      { id:6, level:1, typ:"numerisch", frage:"Berechne \\(e^{\\ln 7}\\).", loesung:7, toleranz:0, tipp:"Setze das Ergebnis des Logarithmus als Exponenten ein und lies die Definition rückwärts.", loesungsweg:"\\(\\ln 7\\) ist genau die Zahl, mit der man \\(e\\) potenzieren muss, um \\(7\\) zu bekommen. Setzt man sie ein, kommt also \\(7\\) heraus: $$e^{\\ln 7} = 7$$ Diese Beziehung gilt für jede positive Zahl und wird beim Lösen von Exponentialgleichungen dauernd gebraucht." },
      // L2 -- Ableitung von ln, Vielfache, Summen, Tangentenanstieg
      { id:7, level:2, typ:"numerisch", frage:"\\(f(x) = \\ln x\\). Berechne \\(f'(2)\\).", loesung:0.5, toleranz:0.001, tipp:"Die Ableitung des natürlichen Logarithmus ist ein einfacher Bruch.", loesungsweg:"Die Ableitung lautet $$f'(x) = \\frac{1}{x}$$ Einsetzen der Stelle: $$f'(2) = \\frac{1}{2} = 0{,}5$$ Weil \\(\\frac1x\\) für alle \\(x>0\\) positiv ist, steigt der Graph von \\(\\ln\\) überall — aber immer flacher." },
      { id:8, level:2, typ:"numerisch", frage:"\\(f(x) = 4\\ln x\\). Berechne \\(f'(2)\\).", loesung:2, toleranz:0, tipp:"Ein konstanter Faktor bleibt beim Ableiten stehen.", loesungsweg:"Der Faktor \\(4\\) bleibt erhalten: $$f'(x) = 4 \\cdot \\frac{1}{x} = \\frac{4}{x}$$ $$f'(2) = \\frac{4}{2} = 2$$" },
      { id:9, level:2, typ:"numerisch", frage:"\\(f(x) = \\ln x + x^{2}\\). Berechne \\(f'(1)\\).", loesung:3, toleranz:0, tipp:"Summanden werden einzeln abgeleitet.", loesungsweg:"Summandenweise ableiten: $$f'(x) = \\frac{1}{x} + 2x$$ An der Stelle \\(1\\): $$f'(1) = \\frac{1}{1} + 2 \\cdot 1 = 1 + 2 = 3$$" },
      { id:10, level:2, typ:"numerisch", frage:"Welche Steigung hat die Tangente an den Graphen von \\(f(x) = \\ln x\\) an der Stelle \\(x = 4\\)?", loesung:0.25, toleranz:0.001, tipp:"Die Tangentensteigung ist der Wert der Ableitung an dieser Stelle.", loesungsweg:"$$f'(x) = \\frac{1}{x} \\;\\Rightarrow\\; f'(4) = \\frac{1}{4} = 0{,}25$$ Die Tangente ist also deutlich flacher als bei \\(x = 1\\), wo die Steigung noch \\(1\\) beträgt." },
      { id:11, level:2, typ:"mc", frage:"Die Ableitung von \\(f(x) = 5\\ln x\\) ist:", optionen:["\\(\\frac{5}{x}\\)","\\(\\frac{1}{5x}\\)","\\(\\frac{5}{x^{2}}\\)","\\(5\\ln x\\)"], korrekt:0, tipp:"Zuerst den Faktor herausziehen, dann den Logarithmus ableiten.", loesungsweg:"Der konstante Faktor bleibt beim Ableiten unverändert stehen, der Logarithmus wird zu \\(\\frac1x\\): $$f'(x) = 5 \\cdot \\frac{1}{x} = \\frac{5}{x}$$ Ein Faktor im Zähler wird also nicht zum Nenner — das ist die häufigste Verwechslung." },
      { id:12, level:2, typ:"numerisch", frage:"Welche Steigung hat die Tangente an den Graphen von \\(f(x) = \\ln x\\) in seinem Schnittpunkt mit der \\(x\\)-Achse?", loesung:1, toleranz:0, tipp:"Bestimme zuerst die Stelle des Schnittpunkts, dann dort die Ableitung.", loesungsweg:"Erster Schritt — Schnittpunkt mit der \\(x\\)-Achse: $$\\ln x = 0 \\;\\Rightarrow\\; x = 1$$ Zweiter Schritt — Ableitung dort: $$f'(1) = \\frac{1}{1} = 1$$ Die Tangente im Punkt \\((1 \\mid 0)\\) hat also die Gleichung \\(y = x - 1\\)." },
      // L3 -- Kettenregel, Stammfunktion von 1/x, bestimmtes Integral
      { id:13, level:3, typ:"numerisch", frage:"\\(f(x) = \\ln(2x+1)\\). Berechne \\(f'(1)\\) gerundet.", loesung:0.667, toleranz:0.005, tipp:"Äußere Funktion ist der Logarithmus, innere Funktion der Klammerterm.", loesungsweg:"Kettenregel mit \\(u = 2x+1\\) und \\(u' = 2\\): $$f'(x) = \\frac{1}{2x+1} \\cdot 2 = \\frac{2}{2x+1}$$ An der Stelle \\(1\\) ist \\(2x+1 = 3\\): $$f'(1) = \\frac{2}{3} \\approx 0{,}667$$" },
      { id:14, level:3, typ:"mc", frage:"Eine Stammfunktion von \\(f(x) = \\frac{1}{x}\\) für \\(x > 0\\) ist:", optionen:["\\(\\ln x + C\\)","\\(-\\frac{1}{x^{2}} + C\\)","\\(\\frac{1}{2}x^{2} + C\\)","\\(x\\ln x + C\\)"], korrekt:0, tipp:"Leite die vier Vorschläge ab und vergleiche mit \\(f\\).", loesungsweg:"Die Potenzregel versagt hier, weil sie für den Exponenten \\(-1\\) eine Division durch null erzeugen würde. Statt ihrer nutzt man die Ableitung des Logarithmus rückwärts: $$\\left(\\ln x\\right)' = \\frac{1}{x} \\;\\Rightarrow\\; \\int \\frac{1}{x}\\,dx = \\ln x + C \\quad (x>0)$$ Die Probe bei den anderen Vorschlägen liefert \\(\\frac{2}{x^{3}}\\), \\(x\\) und \\(\\ln x + 1\\) — keiner passt." },
      { id:15, level:3, typ:"numerisch", frage:"Berechne \\(\\int_{1}^{e} \\frac{1}{x}\\,dx\\).", loesung:1, toleranz:0, tipp:"Erst die Stammfunktion bilden, dann die Grenzen einsetzen.", loesungsweg:"Stammfunktion und Grenzen: $$\\int_{1}^{e} \\frac{1}{x}\\,dx = \\Big[\\ln x\\Big]_{1}^{e} = \\ln e - \\ln 1 = 1 - 0 = 1$$ Die Fläche unter der Hyperbel von \\(1\\) bis \\(e\\) hat also genau den Inhalt \\(1\\) — daran ist die Zahl \\(e\\) gerade festgemacht." },
      { id:16, level:3, typ:"numerisch", frage:"Berechne \\(\\int_{1}^{e} \\frac{3}{x}\\,dx\\).", loesung:3, toleranz:0, tipp:"Der konstante Faktor darf vor das Integral gezogen werden.", loesungsweg:"$$\\int_{1}^{e} \\frac{3}{x}\\,dx = 3\\Big[\\ln x\\Big]_{1}^{e} = 3(\\ln e - \\ln 1) = 3 \\cdot 1 = 3$$ Eine Stammfunktion von \\(\\frac{3}{x}\\) ist also \\(3\\ln x\\), nicht \\(\\ln(3x)\\) — auch wenn beide dieselbe Ableitung haben, unterscheiden sie sich um die Konstante \\(\\ln 3\\)." },
      { id:17, level:3, typ:"numerisch", frage:"\\(f(x) = \\ln\\left(x^{2}+1\\right)\\). Berechne \\(f'(2)\\).", loesung:0.8, toleranz:0.005, tipp:"Innere Funktion ist der ganze Klammerterm; leite ihn gesondert ab.", loesungsweg:"Kettenregel mit \\(u = x^{2}+1\\) und \\(u' = 2x\\): $$f'(x) = \\frac{2x}{x^{2}+1}$$ An der Stelle \\(2\\) ist \\(x^{2}+1 = 5\\): $$f'(2) = \\frac{4}{5} = 0{,}8$$" },
      { id:18, level:3, typ:"numerisch", frage:"\\(f(x) = x\\ln x\\). Berechne \\(f'(e)\\).", loesung:2, toleranz:0, tipp:"Hier stehen zwei Faktoren, die beide von \\(x\\) abhängen.", loesungsweg:"Produktregel mit \\(u = x\\), \\(u' = 1\\), \\(v = \\ln x\\), \\(v' = \\frac1x\\): $$f'(x) = 1 \\cdot \\ln x + x \\cdot \\frac{1}{x} = \\ln x + 1$$ An der Stelle \\(e\\): $$f'(e) = \\ln e + 1 = 1 + 1 = 2$$" },
      // L4 -- AFB II: einschaetzen, Umkehraufgabe, Modell, Flaeche ohne Verfahrensansage
      { id:19, level:4, typ:"numerisch", frage:"Die Gleichung \\(\\ln x = 2 - x\\) hat genau eine Lösung. Sie liegt zwischen zwei aufeinanderfolgenden ganzen Zahlen. Gib die kleinere dieser beiden Zahlen an.", loesung:1, toleranz:0, tipp:"Vergleiche beide Seiten an mehreren ganzzahligen Stellen und achte darauf, wo sich das Größenverhältnis umdreht.", loesungsweg:"Beide Seiten an ganzen Stellen vergleichen. Bei \\(x = 1\\): links \\(\\ln 1 = 0\\), rechts \\(2 - 1 = 1\\) — die rechte Seite ist größer. Bei \\(x = 2\\): links \\(\\ln 2 \\approx 0{,}69\\), rechts \\(2 - 2 = 0\\) — jetzt ist die linke Seite größer. Zwischen \\(1\\) und \\(2\\) dreht sich das Verhältnis also um, dort muss der Schnittpunkt liegen. Gesucht ist die kleinere Zahl, das ist \\(1\\). Der genaue Wert liegt bei etwa \\(1{,}557\\); er lässt sich nicht geschlossen angeben — genau deshalb schätzt man ein." },
      { id:20, level:4, typ:"numerisch", frage:"Der Graph von \\(g(x) = e^{x}\\) verläuft durch den Punkt \\(P(a \\mid 20)\\). Bestimme \\(a\\) gerundet.", loesung:2.996, toleranz:0.01, tipp:"Setze die Koordinaten des Punktes in die Funktionsgleichung ein und überlege, wie du nach dem Exponenten auflöst.", loesungsweg:"Punktprobe: $$e^{a} = 20$$ Gesucht ist der Exponent, also der natürliche Logarithmus von \\(20\\): $$a = \\ln 20 \\approx 2{,}9957$$ Genau das leistet die Umkehrfunktion: Sie ordnet dem Funktionswert \\(20\\) die Stelle \\(a\\) zu." },
      { id:21, level:4, typ:"numerisch", frage:"Der Graph von \\(f(x) = \\frac{1}{x}\\), die \\(x\\)-Achse und die Geraden \\(x = 1\\) und \\(x = 4\\) begrenzen ein Flächenstück. Wie groß ist sein Inhalt (gerundet)?", loesung:1.386, toleranz:0.01, tipp:"Kläre zuerst, welches Werkzeug einen Flächeninhalt unter einem Graphen liefert, und welche Stammfunktion hier passt.", loesungsweg:"Der Inhalt ist das bestimmte Integral über \\([1;4]\\): $$A = \\int_{1}^{4} \\frac{1}{x}\\,dx = \\Big[\\ln x\\Big]_{1}^{4} = \\ln 4 - \\ln 1$$ $$A = \\ln 4 \\approx 1{,}3863$$ Der Graph liegt im Intervall ganz oberhalb der \\(x\\)-Achse, das Integral ist also unmittelbar der Flächeninhalt." },
      { id:22, level:4, typ:"numerisch", frage:"An welcher Stelle hat der Graph von \\(f(x) = \\ln x\\) die Steigung \\(0{,}2\\)?", loesung:5, toleranz:0, tipp:"Setze den Ausdruck für die Steigung mit dem gegebenen Wert gleich und löse nach \\(x\\) auf.", loesungsweg:"Die Steigung ist \\(f'(x) = \\frac1x\\). Gefordert: $$\\frac{1}{x} = 0{,}2 = \\frac{1}{5}$$ Kehrwerte vergleichen: $$x = 5$$ Das ist eine Umkehraufgabe: Gegeben ist der Ableitungswert, gesucht die Stelle." },
      { id:23, level:4, typ:"numerisch", frage:"Ein Bakterienbestand wächst nach \\(N(t) = 200 \\cdot e^{0{,}05t}\\), wobei \\(t\\) die Zeit in Stunden ist. Nach welcher Zeit hat er sich verdoppelt (gerundet in Stunden)?", loesung:13.86, toleranz:0.1, tipp:"Formuliere zuerst, was Verdoppelung für \\(N(t)\\) bedeutet; der Anfangswert kürzt sich dann heraus.", loesungsweg:"Verdoppelung bedeutet \\(N(t) = 400\\): $$200 \\cdot e^{0{,}05t} = 400 \\;\\Rightarrow\\; e^{0{,}05t} = 2$$ Logarithmieren: $$0{,}05t = \\ln 2 \\;\\Rightarrow\\; t = \\frac{\\ln 2}{0{,}05} \\approx 13{,}86$$ Der Anfangswert \\(200\\) fiel heraus — die Verdoppelungszeit hängt nur vom Wachstumsexponenten ab." },
      { id:24, level:4, typ:"numerisch", frage:"Von \\(f_{k}(x) = \\ln(kx)\\) mit \\(k > 0\\) ist bekannt, dass der Graph die \\(x\\)-Achse bei \\(x = 4\\) schneidet. Bestimme \\(k\\).", loesung:0.25, toleranz:0.001, tipp:"Übersetze die Aussage über den Schnittpunkt in eine Gleichung für \\(k\\).", loesungsweg:"Schnittpunkt mit der \\(x\\)-Achse heißt \\(f_{k}(4) = 0\\): $$\\ln(4k) = 0$$ Der Logarithmus ist genau bei Argument \\(1\\) null: $$4k = 1 \\;\\Rightarrow\\; k = \\frac{1}{4} = 0{,}25$$ Probe: \\(f_{0{,}25}(4) = \\ln 1 = 0\\)." },
      // L5 -- AFB III: Parameter aus Bedingung, Fehler finden, zwei Verfahren verbinden
      { id:25, level:5, typ:"numerisch", frage:"Bestimme \\(a > 1\\) so, dass \\(\\int_{1}^{a} \\frac{1}{x}\\,dx = 2\\) gilt (gerundet).", loesung:7.389, toleranz:0.01, tipp:"Werte das Integral mit der oberen Grenze als Unbekannte aus und löse die entstehende Gleichung nach dieser Grenze auf.", loesungsweg:"Erster Schritt — Integral mit unbekannter Grenze: $$\\int_{1}^{a} \\frac{1}{x}\\,dx = \\Big[\\ln x\\Big]_{1}^{a} = \\ln a - 0 = \\ln a$$ Zweiter Schritt — Bedingung einsetzen und auflösen: $$\\ln a = 2 \\;\\Rightarrow\\; a = e^{2} \\approx 7{,}3891$$ Wer hier \\(a = 2e\\) oder \\(a = \\frac{e}{2}\\) erhält, hat das Logarithmieren mit dem Multiplizieren verwechselt." },
      { id:26, level:5, typ:"mc", frage:"Zur Gleichung \\(\\ln(x+3) = 2\\) wird dieser Weg vorgelegt: (1) \\(\\ln x + \\ln 3 = 2\\), (2) \\(\\ln(3x) = 2\\), (3) \\(3x = e^{2}\\), (4) \\(x = \\frac{e^{2}}{3} \\approx 2{,}46\\). Welche Beurteilung trifft zu?", optionen:["Fehler in (1): eine Summe im Argument darf nicht in Summanden aufgeteilt werden","Fehler in (2): eine Summe von Logarithmen gehört zur Summe der Argumente","Fehler in (3): die Umkehrung des Logarithmus ist dort falsch angewandt worden","Kein Fehler: der Weg führt auf die richtige Lösung dieser Gleichung"], korrekt:0, tipp:"Prüfe jeden Schritt einzeln an einem Zahlenbeispiel und mache am Ende die Probe in der Ausgangsgleichung.", loesungsweg:"Schritt (1) ist der Fehler. Es gibt kein Gesetz \\(\\ln(a+b) = \\ln a + \\ln b\\). Gegenbeispiel mit \\(a = b = 1\\): $$\\ln 2 \\approx 0{,}693 \\quad\\text{gegen}\\quad \\ln 1 + \\ln 1 = 0$$ Die Logarithmengesetze betreffen <b>Produkte</b>, nicht Summen: \\(\\ln(ab) = \\ln a + \\ln b\\). Die Schritte (2) und (3) sind für sich genommen richtig — sie bauen nur auf der falschen ersten Zeile auf. Der richtige Weg wendet die Umkehrfunktion sofort auf das ganze Argument an: $$\\ln(x+3) = 2 \\;\\Rightarrow\\; x+3 = e^{2} \\;\\Rightarrow\\; x = e^{2} - 3 \\approx 4{,}389$$ Die Probe entlarvt den vorgelegten Wert: \\(\\ln(2{,}46+3) = \\ln 5{,}46 \\approx 1{,}70 \\neq 2\\)." },
      { id:27, level:5, typ:"numerisch", frage:"\\(f(x) = x\\ln x\\) für \\(x > 0\\). Bestimme die Stelle des Extremums (gerundet).", loesung:0.368, toleranz:0.005, tipp:"Bilde die Ableitung des Produkts, setze sie null und löse die entstehende Logarithmusgleichung; bestimme anschließend die Art des Extremums.", loesungsweg:"Ableitung mit der Produktregel: $$f'(x) = \\ln x + 1$$ Nullsetzen: $$\\ln x + 1 = 0 \\;\\Rightarrow\\; \\ln x = -1 \\;\\Rightarrow\\; x = e^{-1} = \\frac{1}{e} \\approx 0{,}3679$$ Art bestimmen über \\(f''(x) = \\frac{1}{x}\\): an der Stelle \\(\\frac1e\\) ist \\(f'' = e > 0\\), es liegt also ein <b>Minimum</b> vor. Der zugehörige Wert ist \\(f\\left(\\frac1e\\right) = -\\frac{1}{e} \\approx -0{,}368\\) — die Funktion nimmt trotz positiver Faktoren negative Werte an, weil \\(\\ln x\\) für \\(x<1\\) negativ ist." },
      { id:28, level:5, typ:"numerisch", frage:"\\(f(x) = \\ln x - \\frac{x}{2}\\) für \\(x > 0\\). Welchen größten Funktionswert nimmt \\(f\\) an (gerundet)?", loesung:-0.307, toleranz:0.01, tipp:"Zwei Schritte: erst die Stelle des Extremums bestimmen, dann den Funktionswert dort berechnen und die Art prüfen.", loesungsweg:"Erster Schritt — Extremstelle: $$f'(x) = \\frac{1}{x} - \\frac{1}{2} = 0 \\;\\Rightarrow\\; x = 2$$ Art: \\(f''(x) = -\\frac{1}{x^{2}} < 0\\) für alle \\(x > 0\\), der Graph ist überall rechtsgekrümmt — also ein <b>Maximum</b>, und zwar das absolute. Zweiter Schritt — Wert dort: $$f(2) = \\ln 2 - 1 \\approx 0{,}6931 - 1 = -0{,}3069$$ Der größte Wert ist also negativ: Der Graph verläuft vollständig unterhalb der \\(x\\)-Achse." },
      { id:29, level:5, typ:"numerisch", frage:"Für \\(f(x) = a\\ln x + b\\) gilt \\(f(1) = 3\\) und \\(f(e) = 7\\). Bestimme \\(a\\).", loesung:4, toleranz:0, tipp:"Setze beide Bedingungen ein; eine der beiden Gleichungen enthält nur einen der Parameter.", loesungsweg:"Erste Bedingung, mit \\(\\ln 1 = 0\\): $$f(1) = a \\cdot 0 + b = b = 3$$ Zweite Bedingung, mit \\(\\ln e = 1\\): $$f(e) = a \\cdot 1 + b = a + 3 = 7 \\;\\Rightarrow\\; a = 4$$ Die Funktion ist \\(f(x) = 4\\ln x + 3\\). Probe: \\(f(1) = 3\\), \\(f(e) = 7\\)." },
      { id:30, level:5, typ:"numerisch", frage:"Eine Tangente an den Graphen von \\(f(x) = \\ln x\\) verläuft durch den Ursprung. Bestimme die \\(x\\)-Koordinate ihres Berührpunktes (gerundet).", loesung:2.718, toleranz:0.01, tipp:"Stelle die Tangente an einer allgemeinen Stelle auf und nutze, dass der Ursprung ihre Gleichung erfüllen muss.", loesungsweg:"Tangente an der unbekannten Stelle \\(u > 0\\): $$y = \\ln u + \\frac{1}{u}(x - u)$$ Der Ursprung \\((0 \\mid 0)\\) liegt darauf: $$0 = \\ln u + \\frac{1}{u}(0 - u) = \\ln u - 1$$ $$\\ln u = 1 \\;\\Rightarrow\\; u = e \\approx 2{,}7183$$ Der Berührpunkt ist \\(\\left(e \\mid 1\\right)\\), die Tangente lautet \\(y = \\frac{x}{e}\\). Hier greifen zwei Dinge zusammen: die allgemeine Tangentengleichung und eine Logarithmusgleichung." },
      // L6 -- AFB III: Behauptung pruefen, Schar, Fallunterscheidung, Abi-Format eA
      { id:31, level:6, typ:"mc", frage:"Beurteilen Sie die Behauptung „Für alle \\(x > 0\\) gilt \\(\\ln x < \\sqrt{x}\\)“. Welche Begründung trägt?", optionen:["Sie trifft zu: \\(h(x) = \\sqrt{x} - \\ln x\\) hat bei \\(x = 4\\) sein Minimum, und dort ist \\(h > 0\\)","Sie trifft zu: \\(\\ln x\\) ist für alle \\(x > 0\\) negativ, die Wurzel dagegen stets positiv","Sie trifft nicht zu: an der Stelle \\(x = 2\\) ist der Logarithmus größer als die Wurzel","Sie trifft nicht zu: die Graphen berühren sich bei \\(x = e\\), danach führt der Logarithmus"], korrekt:0, tipp:"Untersuche die Differenz der beiden Terme als eigene Funktion; eine Aussage über alle \\(x\\) prüft man an deren kleinstem Wert.", loesungsweg:"Die Behauptung wird zur Frage, ob \\(h(x) = \\sqrt{x} - \\ln x\\) stets positiv ist. $$h'(x) = \\frac{1}{2\\sqrt{x}} - \\frac{1}{x} = 0 \\;\\Rightarrow\\; x = 2\\sqrt{x} \\;\\Rightarrow\\; \\sqrt{x} = 2 \\;\\Rightarrow\\; x = 4$$ Links von \\(4\\) ist \\(h'\\) negativ, rechts positiv — bei \\(x = 4\\) liegt das absolute Minimum: $$h(4) = 2 - \\ln 4 \\approx 2 - 1{,}386 = 0{,}614 > 0$$ Weil schon der kleinste Wert der Differenz positiv ist, gilt \\(\\ln x < \\sqrt{x}\\) für jedes \\(x > 0\\). Der zweite Vorschlag ist falsch, weil \\(\\ln x\\) für \\(x > 1\\) positiv ist; der dritte scheitert am Zahlenbeispiel \\(\\ln 2 \\approx 0{,}69\\) gegen \\(\\sqrt{2} \\approx 1{,}41\\); der vierte behauptet einen Berührpunkt, den es nicht gibt." },
      { id:32, level:6, typ:"mc", frage:"Beurteilen Sie: „Die Graphen der Schar \\(f_{k}(x) = \\ln(kx)\\) mit \\(k > 0\\) gehen alle durch Verschiebung in \\(y\\)-Richtung auseinander hervor.“ Welche Beurteilung trägt?", optionen:["Sie trifft zu, denn der Term lässt sich zu \\(\\ln x + \\ln k\\) umformen","Sie trifft nicht zu, denn die Graphen sind in \\(x\\)-Richtung gestaucht","Sie trifft nicht zu, denn alle Graphen haben dieselbe Nullstelle","Sie trifft zu, denn der Parameter steht im Argument des Logarithmus"], korrekt:0, tipp:"Forme den Funktionsterm mit einem Logarithmengesetz so um, dass der Parameter aus dem Argument verschwindet.", loesungsweg:"Das Produktgesetz trennt den Parameter ab: $$f_{k}(x) = \\ln(kx) = \\ln x + \\ln k$$ Zum Graphen von \\(\\ln x\\) wird also die Konstante \\(\\ln k\\) addiert — das ist genau eine Verschiebung in \\(y\\)-Richtung, nach oben für \\(k > 1\\) und nach unten für \\(0 < k < 1\\); bei \\(k = 1\\) bleibt der Graph unverändert. Die Nullstellen sind dabei <b>nicht</b> gleich: \\(f_{k}\\) ist null bei \\(x = \\frac{1}{k}\\). Bemerkenswert ist, dass eine Stauchung in \\(x\\)-Richtung beim Logarithmus dasselbe bewirkt wie eine Verschiebung in \\(y\\)-Richtung — bei kaum einer anderen Funktion ist das so." },
      { id:33, level:6, typ:"numerisch", frage:"Für welches \\(k > 0\\) hat der Graph von \\(f_{k}(x) = \\ln(kx)\\) in seinem Schnittpunkt mit der \\(x\\)-Achse die Steigung \\(4\\)?", loesung:4, toleranz:0, tipp:"Bestimme zuerst die Nullstelle in Abhängigkeit von \\(k\\) und werte dort die Ableitung aus.", loesungsweg:"Erster Schritt — Nullstelle: $$\\ln(kx) = 0 \\;\\Rightarrow\\; kx = 1 \\;\\Rightarrow\\; x = \\frac{1}{k}$$ Zweiter Schritt — Ableitung: mit der Kettenregel ist $$f_{k}'(x) = \\frac{k}{kx} = \\frac{1}{x}$$ Die Ableitung ist also für die ganze Schar dieselbe. An der Nullstelle: $$f_{k}'\\left(\\tfrac{1}{k}\\right) = k$$ Gefordert ist die Steigung \\(4\\), also \\(k = 4\\). Nebenbefund: Die Steigung an der eigenen Nullstelle ist stets gleich dem Parameter." },
      { id:34, level:6, typ:"numerisch", frage:"Gegeben ist die Schar \\(f_{a}(x) = x - a\\ln x\\) mit \\(a > 0\\) und \\(x > 0\\). Zeigen Sie, dass jeder Graph der Schar genau eine Extremstelle besitzt, und geben Sie für \\(a = 6\\) den zugehörigen Extremwert gerundet an.", loesung:-4.751, toleranz:0.01, tipp:"Untersuche die Ableitung auf Nullstellen in Abhängigkeit von \\(a\\), begründe die Art über die zweite Ableitung und setze erst zum Schluss den konkreten Parameter ein.", loesungsweg:"Nachweis für beliebiges \\(a > 0\\): $$f_{a}'(x) = 1 - \\frac{a}{x} = 0 \\;\\Rightarrow\\; x = a$$ Das ist die einzige Lösung, und sie liegt wegen \\(a > 0\\) stets im Definitionsbereich \\(x>0\\). Art: $$f_{a}''(x) = \\frac{a}{x^{2}} > 0 \\quad\\text{für alle } x > 0$$ Jeder Graph der Schar hat also genau eine Extremstelle, und zwar ein Minimum bei \\(x = a\\). Für \\(a = 6\\) liegt es bei \\(x = 6\\): $$f_{6}(6) = 6 - 6\\ln 6 \\approx 6 - 10{,}7506 = -4{,}7506$$ Die Ortskurve aller Minima ist \\(y = x - x\\ln x\\)." },
      { id:35, level:6, typ:"numerisch", frage:"Der Graph von \\(f(x) = \\frac{1}{x}\\), die \\(x\\)-Achse und die Geraden \\(x = 1\\) und \\(x = b\\) mit \\(b > 1\\) begrenzen ein Flächenstück. Gib die größte ganze Zahl \\(b\\) an, für die dessen Inhalt noch kleiner als \\(1\\) ist.", loesung:2, toleranz:0, tipp:"Beschreibe den Inhalt als Funktion der rechten Grenze, formuliere die Bedingung als Ungleichung und prüfe dann die ganzzahligen Kandidaten am Grenzfall.", loesungsweg:"Inhalt in Abhängigkeit von \\(b\\): $$A(b) = \\int_{1}^{b} \\frac{1}{x}\\,dx = \\ln b$$ Bedingung: $$\\ln b < 1 \\;\\Leftrightarrow\\; b < e \\approx 2{,}7183$$ Weil \\(A\\) streng monoton wächst, entscheidet allein dieser Grenzfall. Ganzzahlige Kandidaten: \\(b = 2\\) liefert \\(\\ln 2 \\approx 0{,}693 < 1\\), \\(b = 3\\) liefert \\(\\ln 3 \\approx 1{,}099 > 1\\). Größte passende ganze Zahl ist damit \\(2\\). Der Grenzfall \\(b = e\\) selbst ist ausgeschlossen, weil dort der Inhalt genau \\(1\\) ist und nicht kleiner." },
      { id:36, level:6, typ:"numerisch", frage:"Die Tangente an den Graphen von \\(g(x) = e^{x}\\) an der Stelle \\(x = 1\\) und die Tangente an den Graphen von \\(f(x) = \\ln x\\) an der Stelle \\(x = 1\\) schneiden sich. Bestimmen Sie die \\(x\\)-Koordinate des Schnittpunktes gerundet.", loesung:-0.582, toleranz:0.01, tipp:"Stelle beide Tangenten getrennt auf und setze anschließend ihre Funktionsterme gleich.", loesungsweg:"Erste Tangente, an \\(g(x) = e^{x}\\) bei \\(x = 1\\): Berührpunkt \\((1 \\mid e)\\), Steigung \\(g'(1) = e\\). $$y = e + e(x-1) = ex$$ Zweite Tangente, an \\(f(x) = \\ln x\\) bei \\(x = 1\\): Berührpunkt \\((1 \\mid 0)\\), Steigung \\(f'(1) = 1\\). $$y = x - 1$$ Gleichsetzen: $$ex = x - 1 \\;\\Rightarrow\\; x(e-1) = -1 \\;\\Rightarrow\\; x = -\\frac{1}{e-1} \\approx -0{,}5820$$ Beide Tangenten treffen sich also links der \\(y\\)-Achse. Der Vergleich zeigt zugleich, wie unterschiedlich steil die beiden Umkehrfunktionen an derselben Stelle verlaufen: \\(e \\approx 2{,}72\\) gegen \\(1\\)." }];
