<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxplot &amp; Quartile - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-stoch-boxplot';
    const THEMA_CONFIG = { name: 'Boxplot & Quartile', bereich: 'stochastik' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Ein Boxplot zeigt NICHT …", optionen:["Median","Quartile","Ausreißer","Mittelwert"], korrekt:3, tipp:"Mittelwert nicht direkt.", loesungsweg:"Mittelwert ist im Boxplot nicht enthalten." },
      { id:2, level:1, typ:"mc", frage:"Das untere Quartil \\(Q_1\\) trennt …", optionen:["Median von Max","25% unterste vom Rest","50% ab","Max von Min"], korrekt:1, tipp:"25%.", loesungsweg:"Ordnet man die Daten der Größe nach, so liegt das untere Quartil dort, wo das erste Viertel endet: Unterhalb von \\(Q_1\\) liegen \\(25\\,\\%\\) aller Werte, oberhalb die restlichen \\(75\\,\\%\\). Der Median teilt dagegen bei \\(50\\,\\%\\)." },
      { id:3, level:1, typ:"mc", frage:"Interquartilsabstand?", optionen:["\\(Q_3-Q_1\\)","Max-Min","Q2","\\(Q_3+Q_1\\)"], korrekt:0, tipp:"IQR.", loesungsweg:"Der Interquartilsabstand misst die Breite der Box, also den Bereich, in dem die mittleren \\(50\\,\\%\\) der Daten liegen: $$\\text{IQR} = Q_3 - Q_1$$ Anders als die Spannweite \\(\\text{Max} - \\text{Min}\\) reagiert er kaum auf einzelne Ausreißer." },
      { id:4, level:1, typ:"numerisch", frage:"Daten 1,2,3,4,5,6,7. Median?", loesung:4, toleranz:0, tipp:"Mitte.", loesungsweg:"Bei \\(7\\) geordneten Werten ist der mittlere der vierte — drei liegen darunter, drei darüber: $$1,2,3,\\underline{4},5,6,7 \\;\\Rightarrow\\; \\text{Median} = 4$$" },
      { id:5, level:1, typ:"numerisch", frage:"1,2,3,4,5,6,7,8. Median?", loesung:4.5, toleranz:0.01, tipp:"Mitte von 4 und 5.", loesungsweg:"Bei einer <b>geraden</b> Anzahl gibt es keinen mittleren Wert; man nimmt das Mittel der beiden inneren: $$\\frac{4+5}{2} = 4{,}5$$" },
      { id:6, level:1, typ:"numerisch", frage:"1,2,3,4,5. Spannweite?", loesung:4, toleranz:0, tipp:"Max-Min.", loesungsweg:"Die Spannweite ist der Abstand zwischen größtem und kleinstem Wert: $$5 - 1 = 4$$" },
      { id:7, level:2, typ:"numerisch", frage:"Daten 2,4,6,8,10,12,14,16. \\(Q_1\\)?", loesung:5, toleranz:0.1, tipp:"Median der unteren Hälfte.", loesungsweg:"Bei \\(8\\) Werten umfasst die untere Hälfte die ersten vier: \\(2, 4, 6, 8\\). Deren Median ist das Mittel der beiden inneren: $$Q_1 = \\frac{4+6}{2} = 5$$" },
      { id:8, level:2, typ:"numerisch", frage:"Daten 2,4,6,8,10,12,14,16. \\(Q_3\\)?", loesung:13, toleranz:0.1, tipp:"Median obere Hälfte.", loesungsweg:"Die obere Hälfte ist \\(10, 12, 14, 16\\); ihr Median ist $$Q_3 = \\frac{12+14}{2} = 13$$" },
      { id:9, level:2, typ:"numerisch", frage:"Daten 2,4,6,8,10,12,14,16. IQR?", loesung:8, toleranz:0.1, tipp:"\\(Q_3-Q_1\\).", loesungsweg:"$$\\text{IQR} = Q_3 - Q_1 = 13 - 5 = 8$$ In diesem Bereich liegen die mittleren vier der acht Werte." },
      { id:10, level:2, typ:"numerisch", frage:"Daten 3,5,7,9,11,13,15. \\(Q_1\\)?", loesung:5, toleranz:0, tipp:"Untere Hälfte 3,5,7.", loesungsweg:"Bei \\(7\\) Werten bleibt der Median (das vierte Element \\(9\\)) außen vor; die untere Hälfte ist \\(3, 5, 7\\) mit dem mittleren Wert $$Q_1 = 5$$" },
      { id:11, level:2, typ:"numerisch", frage:"Gleiche: \\(Q_3\\)?", loesung:13, toleranz:0, tipp:"Obere Hälfte 11,13,15.", loesungsweg:"Die obere Hälfte ist \\(11, 13, 15\\), ihr mittlerer Wert ist $$Q_3 = 13$$ Der Median selbst wird bei ungerader Anzahl keiner Hälfte zugerechnet." },
      { id:12, level:2, typ:"mc", frage:"Die Box umfasst …", optionen:["25% der Daten","50% der Daten","75% der Daten","alle"], korrekt:1, tipp:"Von \\(Q_1\\) bis \\(Q_3\\).", loesungsweg:"Die Box reicht von \\(Q_1\\) bis \\(Q_3\\). Unterhalb von \\(Q_1\\) liegen \\(25\\,\\%\\), oberhalb von \\(Q_3\\) ebenfalls \\(25\\,\\%\\) — dazwischen also $$100\\,\\% - 25\\,\\% - 25\\,\\% = 50\\,\\%$$ Eine breite Box heißt daher: Die mittlere Hälfte der Daten streut stark." },
      { id:13, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. Median?", loesung:11, toleranz:0, tipp:"6. Wert.", loesungsweg:"Bei \\(11\\) Werten ist der sechste der mittlere (fünf davor, fünf danach): $$4,7,8,9,10,\\underline{11},12,13,15,18,22$$ Der Median ist \\(11\\)." },
      { id:14, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. \\(Q_1\\)?", loesung:8, toleranz:0.5, tipp:"Median 4,7,8,9,10 = 8.", loesungsweg:"Die untere Hälfte ohne den Median ist \\(4, 7, 8, 9, 10\\); ihr mittlerer Wert ist $$Q_1 = 8$$" },
      { id:15, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. \\(Q_3\\)?", loesung:15, toleranz:0.5, tipp:"Median 12,13,15,18,22.", loesungsweg:"Die obere Hälfte ist \\(12, 13, 15, 18, 22\\); ihr mittlerer Wert ist $$Q_3 = 15$$" },
      { id:16, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. IQR?", loesung:7, toleranz:0.5, tipp:"15-8.", loesungsweg:"$$\\text{IQR} = Q_3 - Q_1 = 15 - 8 = 7$$" },
      { id:17, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. Spannweite?", loesung:18, toleranz:0, tipp:"22-4.", loesungsweg:"$$\\text{Spannweite} = 22 - 4 = 18$$ Sie ist mehr als doppelt so groß wie der IQR — ein Hinweis darauf, dass die Randwerte weit außen liegen." },
      { id:18, level:3, typ:"mc", frage:"In welcher Reihenfolge liegen Werte im Boxplot (links nach rechts)?", optionen:["Min, Q1, Median, Q3, Max","Max, Q3, Median, Q1, Min","Q1, Min, Median, Max, Q3","Median, Q1, Q3, Min, Max"], korrekt:0, tipp:"Aufsteigend.", loesungsweg:"Der Boxplot zeigt die fünf Kennwerte in aufsteigender Reihenfolge: linker Whisker bis \\(\\text{Min}\\), Boxrand \\(Q_1\\), Strich im Inneren \\(\\text{Median}\\), Boxrand \\(Q_3\\), rechter Whisker bis \\(\\text{Max}\\). Weil die Daten geordnet sind, kann diese Reihenfolge gar nicht anders sein." },
      { id:19, level:4, typ:"numerisch", frage:"Ein Wert \\(x\\) heißt Ausreißer nach Tukey, wenn \\(x<Q_1-1{,}5\\cdot IQR\\) oder \\(x>Q_3+1{,}5\\cdot IQR\\). Bei \\(Q_1=10, Q_3=20\\) ist die untere Grenze?", loesung:-5, toleranz:0.1, tipp:"\\(10-1{,}5\\cdot 10\\).", loesungsweg:"Zuerst der Interquartilsabstand: \\(\\text{IQR} = 20 - 10 = 10\\). Dann die untere Grenze: $$Q_1 - 1{,}5 \\cdot \\text{IQR} = 10 - 15 = -5$$ Werte unterhalb von \\(-5\\) gälten als Ausreißer nach unten." },
      { id:20, level:4, typ:"numerisch", frage:"Ein Wert hei\u00dft Ausrei\u00dfer nach Tukey, wenn er unter \\(Q_1-1{,}5\\cdot IQR\\) oder \u00fcber \\(Q_3+1{,}5\\cdot IQR\\) liegt. Bei \\(Q_1=10\\), \\(Q_3=20\\): Wie lautet die obere Grenze?", loesung:35, toleranz:0.1, tipp:"\\(20+15\\).", loesungsweg:"Mit \\(\\text{IQR} = 20 - 10 = 10\\) ergibt sich: $$Q_3 + 1{,}5 \\cdot \\text{IQR} = 20 + 15 = 35$$" },
      { id:21, level:4, typ:"numerisch", frage:"Daten: 5,5,7,8,9,10,11,12,13,14,30. Spannweite?", loesung:25, toleranz:0, tipp:"30-5.", loesungsweg:"$$\\text{Spannweite} = 30 - 5 = 25$$ Der Wert \\(30\\) liegt weit über allen anderen und bläht die Spannweite auf." },
      { id:22, level:4, typ:"numerisch", frage:"Daten: 5,5,7,8,9,10,11,12,13,14,30. Median?", loesung:10, toleranz:0, tipp:"6. Wert bei n=11.", loesungsweg:"Bei \\(11\\) Werten ist der sechste der Median: $$5,5,7,8,9,\\underline{10},11,12,13,14,30$$ Der Median ist \\(10\\) — der Ausreißer \\(30\\) verschiebt ihn nicht." },
      { id:23, level:4, typ:"numerisch", frage:"Daten: 5,5,7,8,9,10,11,12,13,14,30. \\(Q_3\\)?", loesung:13, toleranz:0.5, tipp:"Median 11,12,13,14,30 = 13.", loesungsweg:"Die obere Hälfte ohne den Median ist \\(11, 12, 13, 14, 30\\); ihr mittlerer Wert ist $$Q_3 = 13$$ Auch hier bleibt der Ausreißer wirkungslos, weil nur die Position zählt." },
      { id:24, level:4, typ:"mc", frage:"Ein symmetrischer Boxplot zeigt …", optionen:["ausgeglichene Verteilung","Ausreißer rechts","stark linksschief","viele extreme Werte"], korrekt:0, tipp:"Symmetrie.", loesungsweg:"Symmetrisch heißt: Der Median liegt etwa in der Mitte der Box, und beide Whisker sind ungefähr gleich lang. Die Daten verteilen sich dann gleichmäßig nach oben und unten — es gibt keine Seite mit auffällig vielen extremen Werten." },
      { id:25, level:5, typ:"numerisch", frage:"Klasse A: Median 7, Q1=5, Q3=9. IQR?", loesung:4, toleranz:0, tipp:"9-5.", loesungsweg:"$$\\text{IQR} = Q_3 - Q_1 = 9 - 5 = 4$$ Die mittleren \\(50\\,\\%\\) der Klasse liegen also zwischen den Noten \\(5\\) und \\(9\\) Punkten." },
      { id:26, level:5, typ:"numerisch", frage:"Noten: 1,1,2,2,2,3,3,4,4,5,6. Median?", loesung:3, toleranz:0, tipp:"6. Wert.", loesungsweg:"Bei \\(11\\) Noten ist die sechste der Median: $$1,1,2,2,2,\\underline{3},3,4,4,5,6$$ Der Median ist \\(3\\)." },
      { id:27, level:5, typ:"numerisch", frage:"Noten: 1,1,2,2,2,3,3,4,4,5,6. \\(Q_1\\) (untere H\u00e4lfte 1,1,2,2,2)?", loesung:2, toleranz:0, tipp:"Median der unt. Hälfte.", loesungsweg:"Die untere Hälfte ist \\(1, 1, 2, 2, 2\\); ihr mittlerer (dritter) Wert ist $$Q_1 = 2$$" },
      { id:28, level:5, typ:"numerisch", frage:"Noten: 1,1,2,2,2,3,3,4,4,5,6. \\(Q_3\\) (obere H\u00e4lfte 3,4,4,5,6)?", loesung:4, toleranz:0, tipp:"Median.", loesungsweg:"Die obere Hälfte ist \\(3, 4, 4, 5, 6\\); ihr mittlerer (dritter) Wert ist $$Q_3 = 4$$ Der IQR beträgt damit \\(4 - 2 = 2\\)." },
      { id:29, level:5, typ:"numerisch", frage:"Zwei Klassen: A mit IQR=3, B mit IQR=8. Welche streut mehr? (A=1, B=2)", loesung:2, toleranz:0, tipp:"Größerer IQR.", loesungsweg:"Der Interquartilsabstand misst, wie breit die mittleren \\(50\\,\\%\\) streuen. Mit \\(\\text{IQR} = 8\\) gegenüber \\(3\\) liegen die Werte in Klasse <b>B</b> deutlich weiter auseinander. Über den Median sagt das nichts — beide Klassen könnten denselben haben." },
      { id:30, level:5, typ:"mc", frage:"Die „Whisker\" (Antennen) reichen bei Standardboxplots bis …", optionen:["Q1 und Q3","Median","Min/Max innerhalb 1,5·IQR","immer Max/Min"], korrekt:2, tipp:"Tukey-Konvention.", loesungsweg:"Bis zu Min/Max im Bereich 1,5·IQR." },
      { id:31, level:6, typ:"numerisch", frage:"Datensatz: 2,5,7,8,9,10,12,13,14,16,20,35. Gibt es nach Tukey einen oberen Ausreißer? Ja=1, Nein=0. (\\(Q_1=7{,}5; Q_3=15\\))", loesung:1, toleranz:0, tipp:"Obere Grenze \\(15+1{,}5\\cdot 7{,}5=26{,}25\\).", loesungsweg:"Obere Ausreißergrenze: $$Q_3 + 1{,}5 \\cdot \\text{IQR} = 15 + 1{,}5 \\cdot 7{,}5 = 15 + 11{,}25 = 26{,}25$$ Der größte Wert \\(35\\) liegt darüber, ist also ein Ausreißer. Im Boxplot endet der Whisker dann bei \\(20\\), und \\(35\\) wird als einzelner Punkt eingezeichnet." },
      { id:32, level:6, typ:"numerisch", frage:"Datensatz: 2,5,7,8,9,10,12,13,14,16,20,35. IQR?", loesung:7.5, toleranz:0.1, tipp:"15-7,5.", loesungsweg:"$$\\text{IQR} = Q_3 - Q_1 = 15 - 7{,}5 = 7{,}5$$" },
      { id:33, level:6, typ:"numerisch", frage:"Zwei Klassen im Notenvergleich. Boxplot A: Median 3, IQR 1. Boxplot B: Median 3, IQR 3. Welche ist homogener? (A=1, B=2)", loesung:1, toleranz:0, tipp:"Kleinerer IQR.", loesungsweg:"Homogen heißt: wenig Streuung. Bei gleichem Median entscheidet der Interquartilsabstand — Klasse <b>A</b> mit \\(\\text{IQR} = 1\\) hat die schmalere Box, ihre Noten liegen also enger beieinander. In Klasse B ist die Leistung breiter gestreut, obwohl die Mitte dieselbe ist." },
      { id:34, level:6, typ:"numerisch", frage:"Wenn Median = Q1 = Q3, was trifft immer zu? (Box hat Breite 0 = 1, alle Werte sind gleich = 2)", loesung:1, toleranz:0, tipp:"\\(Q_3 - Q_1\\) ist die Boxbreite.", loesungsweg:"\\(Q_1=\\text{Median}=Q_3 \\Rightarrow Q_3-Q_1=0\\): die Box hat Breite 0. Dass ALLE Werte gleich sind, folgt nicht (nur die mittleren 50%). → 1." },
      { id:35, level:6, typ:"numerisch", frage:"Bei n=20 geordneten Werten: Position des Medians?", loesung:10.5, toleranz:0.1, tipp:"Zwischen 10. und 11.", loesungsweg:"Bei gerader Anzahl liegt der Median zwischen den beiden mittleren Werten. Allgemein steht er an der Position $$\\frac{n+1}{2} = \\frac{21}{2} = 10{,}5$$ also zwischen dem \\(10.\\) und dem \\(11.\\) Wert; sein Zahlenwert ist deren Mittel." },
      { id:36, level:6, typ:"numerisch", frage:"Verteilung rechtsschief: Typischerweise gilt …? (Median>Mittelwert=1, Median<Mittelwert=2, Median=Mittelwert=3)", loesung:2, toleranz:0, tipp:"Rechte Ausreißer ziehen Mittelwert hoch.", loesungsweg:"Rechtsschief heißt: Der lange Ausläufer zeigt nach rechts, dort liegen einzelne große Werte. Diese ziehen den <b>Mittelwert</b> nach oben, während der Median als reiner Positionswert unbeeindruckt bleibt. Also gilt $$\\text{Median} < \\text{Mittelwert}$$ Bei linksschiefen Verteilungen ist es umgekehrt." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
