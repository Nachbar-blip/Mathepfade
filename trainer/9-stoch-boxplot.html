<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxplot &amp; Quartile - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '9-stoch-boxplot';
    const THEMA_CONFIG = { name: 'Boxplot & Quartile', bereich: 'stochastik' };
    const AUFGABEN = [
      { id:1, level:1, typ:"mc", frage:"Ein Boxplot zeigt NICHT …", optionen:["Median","Quartile","Ausreißer","Mittelwert"], korrekt:3, tipp:"Mittelwert nicht direkt.", loesungsweg:"Mittelwert ist im Boxplot nicht enthalten." },
      { id:2, level:1, typ:"mc", frage:"Das untere Quartil \\(Q_1\\) trennt …", optionen:["Median von Max","25% unterste vom Rest","50% ab","Max von Min"], korrekt:1, tipp:"25%.", loesungsweg:"Ordnet man die Daten der Größe nach, so liegt das untere Quartil dort, wo das erste Viertel endet: Unterhalb von \\(Q_1\\) liegen \\(25\\,\\%\\) aller Werte, oberhalb die restlichen \\(75\\,\\%\\). Der Median teilt dagegen bei \\(50\\,\\%\\)." },
      { id:3, level:1, typ:"mc", frage:"Interquartilsabstand?", optionen:["\\(Q_3-Q_1\\)","Max-Min","Q2","\\(Q_3+Q_1\\)"], korrekt:0, tipp:"IQR.", loesungsweg:"Der Interquartilsabstand misst die Breite der Box, also den Bereich, in dem die mittleren \\(50\\,\\%\\) der Daten liegen: $$\\text{IQR} = Q_3 - Q_1$$ Anders als die Spannweite \\(\\text{Max} - \\text{Min}\\) reagiert er kaum auf einzelne Ausreißer." },
      { id:4, level:1, typ:"numerisch", frage:"Daten 1,2,3,4,5,6,7. Median?", loesung:4, toleranz:0, tipp:"Mitte.", loesungsweg:"Bei \\(7\\) geordneten Werten ist der mittlere der vierte — drei liegen darunter, drei darüber: $$1,2,3,\\underline{4},5,6,7 \\;\\Rightarrow\\; \\text{Median} = 4$$" },
      { id:5, level:1, typ:"numerisch", frage:"1,2,3,4,5,6,7,8. Median?", loesung:4.5, toleranz:0.01, tipp:"Mitte von 4 und 5.", loesungsweg:"Bei einer <b>geraden</b> Anzahl gibt es keinen mittleren Wert; man nimmt das Mittel der beiden inneren: $$\\frac{4+5}{2} = 4{,}5$$" },
      { id:6, level:1, typ:"numerisch", frage:"1,2,3,4,5. Spannweite?", loesung:4, toleranz:0, tipp:"Max-Min.", loesungsweg:"Die Spannweite ist der Abstand zwischen größtem und kleinstem Wert: $$5 - 1 = 4$$" },
      { id:7, level:2, typ:"numerisch", frage:"Daten 2,4,6,8,10,12,14,16. \\(Q_1\\)?", loesung:5, toleranz:0.1, tipp:"Median der unteren Hälfte.", loesungsweg:"Bei \\(8\\) Werten umfasst die untere Hälfte die ersten vier: \\(2, 4, 6, 8\\). Deren Median ist das Mittel der beiden inneren: $$Q_1 = \\frac{4+6}{2} = 5$$" },
      { id:8, level:2, typ:"numerisch", frage:"Daten 2,4,6,8,10,12,14,16. \\(Q_3\\)?", loesung:13, toleranz:0.1, tipp:"Median obere Hälfte.", loesungsweg:"Die obere Hälfte ist \\(10, 12, 14, 16\\); ihr Median ist $$Q_3 = \\frac{12+14}{2} = 13$$" },
      { id:9, level:2, typ:"numerisch", frage:"Daten 2,4,6,8,10,12,14,16. IQR?", loesung:8, toleranz:0.1, tipp:"\\(Q_3-Q_1\\).", loesungsweg:"$$\\text{IQR} = Q_3 - Q_1 = 13 - 5 = 8$$ In diesem Bereich liegen die mittleren vier der acht Werte." },
      { id:10, level:2, typ:"numerisch", frage:"Daten 3,5,7,9,11,13,15. \\(Q_1\\)?", loesung:5, toleranz:0, tipp:"Untere Hälfte 3,5,7.", loesungsweg:"Bei \\(7\\) Werten bleibt der Median (das vierte Element \\(9\\)) außen vor; die untere Hälfte ist \\(3, 5, 7\\) mit dem mittleren Wert $$Q_1 = 5$$" },
      { id:11, level:2, typ:"numerisch", frage:"Daten 3, 5, 7, 9, 11, 13, 15. Bestimme \\(Q_3\\).", loesung:13, toleranz:0, tipp:"Obere Hälfte ohne den Median betrachten.", loesungsweg:"Der Median ist \\(9\\) (vierter von sieben Werten) und gehört zu keiner Hälfte. Die obere Hälfte ist \\(11, 13, 15\\), ihr mittlerer Wert ist $$Q_3 = 13$$" },
      { id:12, level:2, typ:"mc", frage:"Die Box umfasst …", optionen:["25% der Daten","50% der Daten","75% der Daten","alle"], korrekt:1, tipp:"Von \\(Q_1\\) bis \\(Q_3\\).", loesungsweg:"Die Box reicht von \\(Q_1\\) bis \\(Q_3\\). Unterhalb von \\(Q_1\\) liegen \\(25\\,\\%\\), oberhalb von \\(Q_3\\) ebenfalls \\(25\\,\\%\\) — dazwischen also $$100\\,\\% - 25\\,\\% - 25\\,\\% = 50\\,\\%$$ Eine breite Box heißt daher: Die mittlere Hälfte der Daten streut stark." },
      { id:13, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. Median?", loesung:11, toleranz:0, tipp:"6. Wert.", loesungsweg:"Bei \\(11\\) Werten ist der sechste der mittlere (fünf davor, fünf danach): $$4,7,8,9,10,\\underline{11},12,13,15,18,22$$ Der Median ist \\(11\\)." },
      { id:14, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. \\(Q_1\\)?", loesung:8, toleranz:0.5, tipp:"Betrachte die untere Hälfte des Datensatzes bis vor den Median und bestimme deren mittleren Wert.", loesungsweg:"Die untere Hälfte ohne den Median ist \\(4, 7, 8, 9, 10\\); ihr mittlerer Wert ist $$Q_1 = 8$$" },
      { id:15, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. \\(Q_3\\)?", loesung:15, toleranz:0.5, tipp:"Median 12,13,15,18,22.", loesungsweg:"Die obere Hälfte ist \\(12, 13, 15, 18, 22\\); ihr mittlerer Wert ist $$Q_3 = 15$$" },
      { id:16, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. IQR?", loesung:7, toleranz:0.5, tipp:"15-8.", loesungsweg:"$$\\text{IQR} = Q_3 - Q_1 = 15 - 8 = 7$$" },
      { id:17, level:3, typ:"numerisch", frage:"Datensatz 4,7,8,9,10,11,12,13,15,18,22. Spannweite?", loesung:18, toleranz:0, tipp:"22-4.", loesungsweg:"$$\\text{Spannweite} = 22 - 4 = 18$$ Sie ist mehr als doppelt so groß wie der IQR — ein Hinweis darauf, dass die Randwerte weit außen liegen." },
      { id:18, level:3, typ:"mc", frage:"In welcher Reihenfolge liegen Werte im Boxplot (links nach rechts)?", optionen:["Min, Q1, Median, Q3, Max","Max, Q3, Median, Q1, Min","Q1, Min, Median, Max, Q3","Median, Q1, Q3, Min, Max"], korrekt:0, tipp:"Aufsteigend.", loesungsweg:"Der Boxplot zeigt die fünf Kennwerte in aufsteigender Reihenfolge: linker Whisker bis \\(\\text{Min}\\), Boxrand \\(Q_1\\), Strich im Inneren \\(\\text{Median}\\), Boxrand \\(Q_3\\), rechter Whisker bis \\(\\text{Max}\\). Weil die Daten geordnet sind, kann diese Reihenfolge gar nicht anders sein." },
      { id:19, level:4, typ:"numerisch", frage:"Für eine Datenreihe gilt \\(Q_1 = 10\\) und \\(Q_3 = 20\\). Unterhalb welches Wertes gilt ein Datenwert nach der \\(1{,}5\\)-IQR-Regel als Ausreißer?", loesung:-5, toleranz:0.1, tipp:"Zuerst den Interquartilsabstand bilden, dann vom unteren Quartil aus nach unten gehen.", loesungsweg:"Interquartilsabstand: \\(\\text{IQR} = 20 - 10 = 10\\). Untere Grenze: $$Q_1 - 1{,}5 \\cdot \\text{IQR} = 10 - 15 = -5$$ Werte unterhalb von \\(-5\\) gälten als Ausreißer nach unten." },
      { id:20, level:4, typ:"numerisch", frage:"Für eine Datenreihe gilt \\(Q_1 = 10\\) und \\(Q_3 = 20\\). Oberhalb welches Wertes gilt ein Datenwert nach der \\(1{,}5\\)-IQR-Regel als Ausreißer?", loesung:35, toleranz:0.1, tipp:"Vom oberen Quartil aus das Anderthalbfache des Interquartilsabstands nach oben gehen.", loesungsweg:"Mit \\(\\text{IQR} = 20 - 10 = 10\\) ergibt sich: $$Q_3 + 1{,}5 \\cdot \\text{IQR} = 20 + 15 = 35$$" },
      { id:21, level:4, typ:"numerisch", frage:"Daten: 5,5,7,8,9,10,11,12,13,14,30. Spannweite?", loesung:25, toleranz:0, tipp:"30-5.", loesungsweg:"$$\\text{Spannweite} = 30 - 5 = 25$$ Der Wert \\(30\\) liegt weit über allen anderen und bläht die Spannweite auf." },
      { id:22, level:4, typ:"numerisch", frage:"Daten: 5,5,7,8,9,10,11,12,13,14,30. Median?", loesung:10, toleranz:0, tipp:"6. Wert bei n=11.", loesungsweg:"Bei \\(11\\) Werten ist der sechste der Median: $$5,5,7,8,9,\\underline{10},11,12,13,14,30$$ Der Median ist \\(10\\) — der Ausreißer \\(30\\) verschiebt ihn nicht." },
      { id:23, level:4, typ:"numerisch", frage:"Daten: 5,5,7,8,9,10,11,12,13,14,30. \\(Q_3\\)?", loesung:13, toleranz:0.5, tipp:"Median der oberen Hälfte ohne den Gesamtmedian.", loesungsweg:"Die obere Hälfte ohne den Median ist \\(11, 12, 13, 14, 30\\); ihr mittlerer Wert ist $$Q_3 = 13$$ Auch hier bleibt der Ausreißer wirkungslos, weil nur die Position zählt." },
      { id:24, level:4, typ:"mc", frage:"Ein symmetrischer Boxplot zeigt …", optionen:["ausgeglichene Verteilung","Ausreißer rechts","stark linksschief","viele extreme Werte"], korrekt:0, tipp:"Symmetrie.", loesungsweg:"Symmetrisch heißt: Der Median liegt etwa in der Mitte der Box, und beide Whisker sind ungefähr gleich lang. Die Daten verteilen sich dann gleichmäßig nach oben und unten — es gibt keine Seite mit auffällig vielen extremen Werten." },
      { id:25, level:5, typ:"numerisch", frage:"Gemessene Wartezeiten in Minuten: \\(14,\\ 9,\\ 22,\\ 11,\\ 17,\\ 9,\\ 25,\\ 13\\). Bestimme den Interquartilsabstand.", loesung:9.5, toleranz:0.01, tipp:"Die Werte sind noch nicht geordnet; danach beide Quartile bestimmen.", loesungsweg:"Geordnet: \\(9, 9, 11, 13, 14, 17, 22, 25\\). Untere Hälfte \\(9, 9, 11, 13\\): \\(Q_1 = \\frac{9+11}{2} = 10\\). Obere Hälfte \\(14, 17, 22, 25\\): \\(Q_3 = \\frac{17+22}{2} = 19{,}5\\). $$\\text{IQR} = 19{,}5 - 10 = 9{,}5$$" },
      { id:26, level:5, typ:"mc", frage:"Für die Daten \\(3, 5, 6, 8, 10, 12, 15\\) bestimmt jemand \\(Q_1 = 5{,}5\\) mit der Begründung: „Die untere Hälfte ist \\(3, 5, 6, 8\\), ihr Median ist \\(\\frac{5+6}{2}\\).“ Was ist dazu zu sagen?", optionen:["Falsch, der Median \\(8\\) zählt zu keiner Hälfte; untere Hälfte \\(3, 5, 6\\), also \\(Q_1 = 5\\)", "Richtig, bei ungerader Anzahl gehört der Median immer zur unteren Hälfte", "Falsch, die untere Hälfte ist nur \\(3, 5\\), also ist \\(Q_1 = \\frac{3+5}{2} = 4\\)", "Falsch, \\(Q_1\\) ist stets das Mittel aus Minimum und Median, also \\(\\frac{3+8}{2} = 5{,}5\\)"], korrekt:0, tipp:"Wie viele Werte liegen unterhalb des Medians, wenn die Reihe sieben Werte hat?", loesungsweg:"Bei \\(7\\) Werten ist der vierte (\\(8\\)) der Median; unterhalb liegen genau drei Werte: \\(3, 5, 6\\). Deren Median ist $$Q_1 = 5$$ Der Median selbst wird bei ungerader Anzahl keiner Hälfte zugerechnet. Ebenso ist \\(Q_3 = 12\\) (aus \\(10, 12, 15\\))." },
      { id:27, level:5, typ:"numerisch", frage:"Punktzahlen eines Tests: \\(4,\\ 6,\\ 7,\\ 7,\\ 8,\\ 9,\\ 10,\\ 11,\\ 12,\\ 30\\). Wie viele dieser Werte sind nach der \\(1{,}5\\)-IQR-Regel Ausreißer?", loesung:1, toleranz:0, tipp:"Zuerst beide Quartile bestimmen, dann die beiden Grenzen; erst danach die Werte damit vergleichen.", loesungsweg:"Untere Hälfte \\(4, 6, 7, 7, 8\\): \\(Q_1 = 7\\). Obere Hälfte \\(9, 10, 11, 12, 30\\): \\(Q_3 = 11\\). \\(\\text{IQR} = 4\\). Grenzen: $$7 - 1{,}5 \\cdot 4 = 1 \\qquad 11 + 1{,}5 \\cdot 4 = 17$$ Nur \\(30 > 17\\) liegt außerhalb: ein Ausreißer." },
      { id:28, level:5, typ:"numerisch", frage:"Die geordnete Datenreihe \\(2,\\ 5,\\ 7,\\ x,\\ 12,\\ 15\\) hat den Median \\(8{,}5\\). Bestimme \\(x\\).", loesung:10, toleranz:0, tipp:"Bei sechs Werten liegt der Median zwischen dem dritten und vierten Wert.", loesungsweg:"Median bei \\(6\\) Werten: Mittel des dritten und vierten Werts. $$\\frac{7 + x}{2} = 8{,}5 \\quad\\Rightarrow\\quad x = 10$$ Das passt zur Ordnung \\(7 \\le 10 \\le 12\\)." },
      { id:29, level:5, typ:"mc", frage:"Zwei Klassen schreiben denselben Test. Klasse A: Min \\(2\\), \\(Q_1 = 5\\), Median \\(8\\), \\(Q_3 = 11\\), Max \\(14\\). Klasse B: Min \\(4\\), \\(Q_1 = 7\\), Median \\(8\\), \\(Q_3 = 9\\), Max \\(16\\). Welche Aussage ist richtig?", optionen:["In Klasse B liegt die mittlere Hälfte der Ergebnisse enger zusammen als in A", "Klasse B hat die kleinere Spannweite als Klasse A", "Klasse A hat den höheren Median als Klasse B", "In Klasse A liegt die Hälfte der Ergebnisse über \\(11\\) Punkten"], korrekt:0, tipp:"Prüfe jede Aussage einzeln mit der passenden Kenngröße: IQR, Spannweite, Median, Quartile.", loesungsweg:"IQR: A \\(11 - 5 = 6\\), B \\(9 - 7 = 2\\): In B liegt die mittlere Hälfte enger zusammen. Spannweiten: A \\(12\\), B \\(12\\), also gleich. Die Mediane sind gleich (\\(8\\)). Über \\(Q_3 = 11\\) liegt in A nur ein Viertel, nicht die Hälfte." },
      { id:30, level:5, typ:"numerisch", frage:"Datenreihe: \\(21,\\ 9,\\ 14,\\ 6,\\ 18,\\ 8,\\ 13,\\ 11\\). Um wie viel ist der Mittelwert größer als der Median?", loesung:0.5, toleranz:0.01, tipp:"Für den Median muss geordnet werden; für den Mittelwert nicht.", loesungsweg:"Geordnet: \\(6, 8, 9, 11, 13, 14, 18, 21\\); Median \\(\\frac{11+13}{2} = 12\\). Summe \\(100\\), Mittelwert \\(\\frac{100}{8} = 12{,}5\\). $$12{,}5 - 12 = 0{,}5$$" },
      { id:31, level:6, typ:"mc", frage:"Behauptung: „Haben zwei Datenreihen denselben Boxplot, so bestehen sie aus denselben Werten.“ Stimmt das?", optionen:["Nein, der Boxplot zeigt nur fünf Kennwerte, die übrigen Werte können abweichen", "Ja, denn die fünf Kennwerte legen alle Werte der Reihe eindeutig fest", "Nein, aber beide Reihen haben dann zwingend denselben Mittelwert", "Ja, sofern beide Reihen gleich viele Werte enthalten"], korrekt:0, tipp:"Suche zwei verschiedene Reihen mit gleichem Minimum, Maximum, Median und gleichen Quartilen.", loesungsweg:"Gegenbeispiel — Reihe 1: \\(1,\\ 2,\\ 3,\\ 4,\\ 5,\\ 6,\\ 7\\); Reihe 2: \\(1,\\ 2,\\ 3,\\ 4,\\ 6,\\ 6,\\ 7\\). Beide haben Minimum \\(1\\), \\(Q_1 = 2\\), Median \\(4\\), \\(Q_3 = 6\\) und Maximum \\(7\\), also denselben Boxplot, bestehen aber nicht aus denselben Werten. Sogar die Mittelwerte unterscheiden sich: \\(4\\) gegenüber \\(\\frac{29}{7} \\approx 4{,}14\\). Ein Boxplot verdichtet die Daten und verliert dabei Information." },
      { id:32, level:6, typ:"numerisch", frage:"Die geordnete Datenreihe \\(3,\\ 4,\\ 4,\\ x,\\ 9,\\ 10\\) soll denselben Median wie Mittelwert haben. Bestimme \\(x\\).", loesung:9, toleranz:0, tipp:"Beide Kenngrößen enthalten \\(x\\); setze die beiden Terme gleich.", loesungsweg:"Median (sechs Werte): \\(\\frac{4 + x}{2}\\). Mittelwert: \\(\\frac{30 + x}{6}\\). $$\\frac{4+x}{2} = \\frac{30+x}{6} \\quad\\Rightarrow\\quad 12 + 3x = 30 + x \\quad\\Rightarrow\\quad x = 9$$ Probe: Median \\(6{,}5\\), Mittelwert \\(\\frac{39}{6} = 6{,}5\\); und \\(4 \\le 9 \\le 9\\) passt zur Ordnung." },
      { id:33, level:6, typ:"numerisch", frage:"Ein Boxplot zu fünf Messwerten zeigt: Minimum \\(2\\), \\(Q_1 = 4\\), Median \\(7\\), \\(Q_3 = 11\\), Maximum \\(14\\). Berechne den Mittelwert der fünf Werte.", loesung:7.4, toleranz:0.01, tipp:"Bei fünf Werten bestehen die Hälften aus je zwei Werten; damit lassen sich die fehlenden beiden Werte aus den Quartilen zurückrechnen.", loesungsweg:"Geordnet: \\(2, a, 7, b, 14\\). Untere Hälfte \\(2, a\\): \\(\\frac{2+a}{2} = 4 \\Rightarrow a = 6\\). Obere Hälfte \\(b, 14\\): \\(\\frac{b+14}{2} = 11 \\Rightarrow b = 8\\). $$\\bar{x} = \\frac{2+6+7+8+14}{5} = 7{,}4$$" },
      { id:34, level:6, typ:"mc", frage:"In einer Datenreihe gilt \\(Q_1 = \\text{Median}\\). Was folgt daraus sicher?", optionen:["Etwa ein Viertel der Werte ist genau gleich dem Median", "Alle Werte unterhalb des Medians sind untereinander gleich", "Die Reihe enthält einen Ausreißer nach unten", "Das ist unmöglich, \\(Q_1\\) ist immer kleiner als der Median"], korrekt:0, tipp:"Welche Werte liegen zwischen \\(Q_1\\) und dem Median, wenn beide gleich sind?", loesungsweg:"Zwischen \\(Q_1\\) und dem Median liegt das zweite Viertel der geordneten Werte. Sind beide gleich, müssen alle Werte dieses Viertels diesen Wert haben: Die linke Boxhälfte hat Breite \\(0\\). Beispiel: \\(1, 5, 5, 5, 8, 9, 12\\) mit \\(Q_1 = 5 = \\text{Median}\\); das Minimum \\(1\\) ist davon verschieden, ein Ausreißer ist nicht nötig." },
      { id:35, level:6, typ:"numerisch", frage:"Datenreihe: \\(5,\\ 7,\\ 8,\\ 9,\\ 11\\). Der größte Wert \\(11\\) wird durch \\(41\\) ersetzt. Um wie viel mehr steigt dadurch der Mittelwert als der Median?", loesung:6, toleranz:0.01, tipp:"Berechne beide Kenngrößen vor und nach der Änderung.", loesungsweg:"Vorher: Median \\(8\\), Mittelwert \\(\\frac{40}{5} = 8\\). Nachher (\\(5, 7, 8, 9, 41\\)): Median weiterhin \\(8\\), Mittelwert \\(\\frac{70}{5} = 14\\). $$\\text{Anstieg Mittelwert} - \\text{Anstieg Median} = 6 - 0 = 6$$ Der Median ist gegen Ausreißer robust, der Mittelwert nicht." },
      { id:36, level:6, typ:"mc", frage:"Ein Boxplot ist symmetrisch: Der Median liegt genau in der Mitte der Box, beide Whisker sind gleich lang. Behauptung: „Dann sind Median und Mittelwert gleich.“ Stimmt das?", optionen:["Nein, die Werte innerhalb der Viertel können ungleich verteilt sein", "Ja, ein symmetrischer Boxplot bedeutet symmetrisch verteilte Daten", "Ja, weil bei symmetrischen Boxplots keine Ausreißer auftreten", "Nein, der Mittelwert ist bei symmetrischem Boxplot immer größer"], korrekt:0, tipp:"Konstruiere sieben Werte mit Min \\(0\\), \\(Q_1 = 1\\), Median \\(5\\), \\(Q_3 = 9\\), Max \\(10\\) und rechne den Mittelwert aus.", loesungsweg:"Gegenbeispiel: \\(0, 1, 1, 5, 6, 9, 10\\) hat Min \\(0\\), \\(Q_1 = 1\\), Median \\(5\\), \\(Q_3 = 9\\), Max \\(10\\): Der Boxplot ist symmetrisch zu \\(5\\). Der Mittelwert ist aber $$\\frac{0+1+1+5+6+9+10}{7} = \\frac{32}{7} \\approx 4{,}57 \\neq 5$$ Der Boxplot sagt nichts über die Lage der Werte innerhalb der Viertel; dort können sie ungleich verteilt sein." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
