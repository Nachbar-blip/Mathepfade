<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Kreissektor &amp; Bogenlänge - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-kreissektor';
    const THEMA_CONFIG = { name: 'Kreissektor & Bogenlänge', bereich: 'geometrie' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundlagen Kreis ==========
      { id: 1, level: 1, typ: "mc", frage: "Wie heißt der Teil einer Kreisfläche, der von zwei Radien und einem Bogen begrenzt wird?", optionen: ["Kreissehne", "Kreissegment", "Kreissektor", "Kreisbogen"], korrekt: 2, tipp: "„Sektor\" kommt von lat. „Schneider\" — wie ein Tortenstück.", loesungsweg: "Ein Kreissektor wird von zwei Radien und einem Kreisbogen begrenzt — wie ein Tortenstück." },
      { id: 2, level: 1, typ: "mc", frage: "Welche Formel gibt den Umfang eines Kreises mit Radius \\(r\\)?", optionen: ["\\(U = \\pi r\\)", "\\(U = 2\\pi r\\)", "\\(U = \\pi r^2\\)", "\\(U = 4\\pi r\\)"], korrekt: 1, tipp: "Umfang = 2 mal Pi mal Radius.", loesungsweg: "Der Kreisumfang ist proportional zum Radius; der Proportionalitätsfaktor ist \\(2\\pi\\): $$U = 2\\pi r = \\pi d$$ Mit dem Durchmesser gerechnet entfällt die \\(2\\). Die Formel \\(\\pi r^2\\) gehört dagegen zur Fläche — sie trägt den Radius im Quadrat." },
      { id: 3, level: 1, typ: "mc", frage: "Welche Formel gibt die Fläche eines Kreises?", optionen: ["\\(A = 2\\pi r\\)", "\\(A = \\pi r^2\\)", "\\(A = \\pi d\\)", "\\(A = r^2\\)"], korrekt: 1, tipp: "Fläche hat die Einheit Quadrat — der Radius muss quadriert werden.", loesungsweg: "$$A = \\pi r^2$$ Dass der Radius quadriert wird, verlangt schon die Einheit: Eine Fläche hat die Einheit Quadratzentimeter, der Umfang nur Zentimeter. Doppelter Radius bedeutet also vierfache Fläche, aber nur doppelten Umfang." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne den Umfang eines Kreises mit \\(r = 5\\,\\text{cm}\\) (in cm, auf 2 Dezimalen, mit \\(\\pi = 3{,}14159\\)).", loesung: 31.42, toleranz: 0.05, tipp: "\\(U = 2\\pi r = 2\\pi \\cdot 5\\).", loesungsweg: "$$U = 2\\pi r = 2\\pi \\cdot 5 = 10\\pi \\approx 31{,}42\\,\\text{cm}$$ Zur groben Kontrolle: \\(\\pi \\approx 3\\), also rund \\(30\\,\\text{cm}\\) ✓" },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne die Fläche eines Kreises mit \\(r = 3\\,\\text{cm}\\) (cm², 2 Dezimalen).", loesung: 28.27, toleranz: 0.05, tipp: "\\(A = \\pi r^2 = 9\\pi\\).", loesungsweg: "$$A = \\pi r^2 = \\pi \\cdot 9 \\approx 28{,}27\\,\\text{cm}^2$$ Quadriert wird nur der Radius, nicht das \\(\\pi\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Wie viele Grad hat ein Vollkreis?", optionen: ["\\(90°\\)", "\\(180°\\)", "\\(270°\\)", "\\(360°\\)"], korrekt: 3, tipp: "Ein ganzer Kreis hat …", loesungsweg: "$$\\text{Vollkreis} = 360°$$ Die Einteilung in \\(360\\) Teile stammt aus dem babylonischen Sechzigersystem; \\(360\\) hat besonders viele Teiler, sodass sich Halbe, Drittel, Viertel und Sechstel ohne Bruch angeben lassen." },
      // ========== LEVEL 2 — Bogenlänge ==========
      { id: 7, level: 2, typ: "mc", frage: "Welche Formel gibt die Bogenlänge \\(b\\) bei Radius \\(r\\) und Mittelpunktswinkel \\(\\alpha\\) (in Grad)?", optionen: ["\\(b = \\tfrac{\\alpha}{360°} \\cdot 2\\pi r\\)", "\\(b = \\tfrac{\\alpha}{180°} \\cdot \\pi r\\)", "\\(b = \\alpha \\cdot r\\)", "Beide A und B sind richtig"], korrekt: 3, tipp: "Anteil am Gesamtumfang.", loesungsweg: "Bogenanteil = \\(\\tfrac{\\alpha}{360°}\\) vom Umfang \\(2\\pi r\\). Beide Schreibweisen sind äquivalent." },
      { id: 8, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 10\\), \\(\\alpha = 90°\\). Berechne die Bogenlänge (2 Dezimalen).", loesung: 15.71, toleranz: 0.05, tipp: "\\(\\tfrac{90}{360} = \\tfrac{1}{4}\\) vom Umfang.", loesungsweg: "\\(b = \\tfrac{1}{4} \\cdot 2\\pi \\cdot 10 = 5\\pi \\approx 15{,}71\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 6\\), \\(\\alpha = 60°\\). Bogenlänge (2 Dezimalen).", loesung: 6.28, toleranz: 0.05, tipp: "\\(\\tfrac{60}{360} = \\tfrac{1}{6}\\).", loesungsweg: "\\(b = \\tfrac{1}{6} \\cdot 2\\pi \\cdot 6 = 2\\pi \\approx 6{,}28\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 4\\), \\(\\alpha = 180°\\). Bogenlänge (2 Dezimalen).", loesung: 12.57, toleranz: 0.05, tipp: "Halbkreis.", loesungsweg: "Ein Winkel von \\(180°\\) ist der halbe Vollkreis, die Bogenlänge also der halbe Umfang: $$b = \\frac{180°}{360°} \\cdot 2\\pi \\cdot 4 = \\pi \\cdot 4 \\approx 12{,}57$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 12\\), \\(\\alpha = 45°\\). Bogenlänge (2 Dezimalen).", loesung: 9.42, toleranz: 0.05, tipp: "\\(\\tfrac{45}{360} = \\tfrac{1}{8}\\).", loesungsweg: "\\(b = \\tfrac{1}{8} \\cdot 24\\pi = 3\\pi \\approx 9{,}42\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Im Bogenmaß gilt für die Bogenlänge bei Radius \\(r\\) und Winkel \\(x\\) (Bogenmaß):", optionen: ["\\(b = r + x\\)", "\\(b = r \\cdot x\\)", "\\(b = \\tfrac{r}{x}\\)", "\\(b = \\pi r x\\)"], korrekt: 1, tipp: "Bogenmaß ist definiert als Bogenlänge durch Radius.", loesungsweg: "Bei \\(r = 1\\) entspricht \\(b = x\\). Allgemein: \\(b = r \\cdot x\\)." },
      // ========== LEVEL 3 — Sektorfläche ==========
      { id: 13, level: 3, typ: "mc", frage: "Formel für die Fläche eines Kreissektors mit Radius \\(r\\) und Winkel \\(\\alpha\\) in Grad:", optionen: ["\\(A = \\tfrac{\\alpha}{360°} \\cdot \\pi r^2\\)", "\\(A = \\tfrac{\\alpha}{180°} \\cdot \\pi r^2\\)", "\\(A = \\alpha \\cdot r^2\\)", "\\(A = \\tfrac{1}{2} r \\alpha\\)"], korrekt: 0, tipp: "Anteil an der Gesamtfläche \\(\\pi r^2\\).", loesungsweg: "Der Sektor ist derselbe Anteil der Kreisfläche, den der Winkel am Vollwinkel ausmacht: $$A_{\\text{Sektor}} = \\frac{\\alpha}{360°} \\cdot \\pi r^2$$ Für \\(\\alpha = 360°\\) ergibt sich die volle Kreisfläche ✓, für \\(\\alpha = 90°\\) ein Viertel davon. Der Nenner ist \\(360°\\), nicht \\(180°\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Sektor mit \\(r = 10\\), \\(\\alpha = 90°\\). Fläche (2 Dezimalen).", loesung: 78.54, toleranz: 0.1, tipp: "\\(\\tfrac{1}{4}\\) des Gesamtkreises.", loesungsweg: "\\(A = \\tfrac{1}{4} \\cdot \\pi \\cdot 100 = 25\\pi \\approx 78{,}54\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Sektor mit \\(r = 6\\), \\(\\alpha = 60°\\). Fläche (2 Dezimalen).", loesung: 18.85, toleranz: 0.1, tipp: "\\(\\tfrac{1}{6}\\) des Gesamtkreises.", loesungsweg: "\\(A = \\tfrac{1}{6} \\cdot 36\\pi = 6\\pi \\approx 18{,}85\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Sektor mit \\(r = 12\\), \\(\\alpha = 30°\\). Fläche (2 Dezimalen).", loesung: 37.70, toleranz: 0.1, tipp: "\\(\\tfrac{30}{360} = \\tfrac{1}{12}\\).", loesungsweg: "\\(A = \\tfrac{1}{12} \\cdot 144\\pi = 12\\pi \\approx 37{,}70\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Sektor mit \\(r = 5\\), \\(\\alpha = 144°\\). Fläche (2 Dezimalen).", loesung: 31.42, toleranz: 0.1, tipp: "\\(\\tfrac{144}{360} = \\tfrac{2}{5}\\).", loesungsweg: "\\(A = \\tfrac{2}{5} \\cdot 25\\pi = 10\\pi \\approx 31{,}42\\)." },
      { id: 18, level: 3, typ: "mc", frage: "Eine alternative Formel: \\(A_{\\text{Sektor}} = \\tfrac{1}{2} r \\cdot b\\) — was ist \\(b\\)?", optionen: ["Durchmesser", "Bogenlänge", "Sehne", "Höhe"], korrekt: 1, tipp: "Analog zur Dreiecksfläche \\(\\tfrac{1}{2} \\cdot g \\cdot h\\).", loesungsweg: "In \\(A = \\tfrac12 r \\cdot b\\) ist \\(b\\) die <b>Bogenlänge</b>. Die Formel entspricht der Dreiecksfläche \\(\\tfrac12 \\cdot g \\cdot h\\): Man denkt sich den Sektor aus vielen schmalen Dreiecken der Höhe \\(r\\) zusammengesetzt, deren Grundseiten zusammen den Bogen ergeben. Einsetzen von \\(b = \\tfrac{\\alpha}{360°} 2\\pi r\\) führt zurück auf die bekannte Sektorformel." },
      // ========== LEVEL 4 — Rückwärts / gemischt ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Ein Sektor hat \\(r = 10\\) und Fläche \\(A = 50\\). Wie groß ist der Mittelpunktswinkel in Grad (2 Dezimalen)?", loesung: 57.30, toleranz: 0.5, tipp: "\\(50 = \\tfrac{\\alpha}{360} \\cdot 100\\pi\\). Auflösen nach \\(\\alpha\\).", loesungsweg: "\\(\\alpha = \\tfrac{50 \\cdot 360}{100\\pi} = \\tfrac{180}{\\pi} \\approx 57{,}30°\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Sektor mit Bogenlänge \\(b = 10\\) und \\(r = 5\\). Wie groß ist \\(\\alpha\\) in Grad (2 Dezimalen)?", loesung: 114.59, toleranz: 0.5, tipp: "\\(10 = \\tfrac{\\alpha}{360} \\cdot 10\\pi\\).", loesungsweg: "\\(\\alpha = \\tfrac{10 \\cdot 360}{10\\pi} = \\tfrac{360}{\\pi} \\approx 114{,}59°\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Ein Sektor hat Fläche \\(A = 12{,}57\\) und \\(\\alpha = 90°\\). Berechne den Radius (1 Dezimale).", loesung: 4.0, toleranz: 0.1, tipp: "\\(A = \\tfrac{1}{4}\\pi r^2 \\Rightarrow r^2 = \\tfrac{4A}{\\pi}\\).", loesungsweg: "\\(r^2 = \\tfrac{4 \\cdot 12{,}57}{\\pi} \\approx 16 \\Rightarrow r = 4\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Sektor hat Bogenlänge \\(b = 6\\pi\\) und \\(\\alpha = 120°\\). Berechne den Radius.", loesung: 9, toleranz: 0.1, tipp: "\\(b = \\tfrac{\\alpha}{360} \\cdot 2\\pi r\\).", loesungsweg: "\\(6\\pi = \\tfrac{1}{3} \\cdot 2\\pi r \\Rightarrow r = 9\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Kreis mit \\(r = 8\\): Wie groß ist der Winkel (in Grad), wenn die Bogenlänge \\(2\\pi\\) beträgt?", loesung: 45, toleranz: 0.5, tipp: "\\(2\\pi = \\tfrac{\\alpha}{360} \\cdot 16\\pi\\).", loesungsweg: "\\(\\alpha = \\tfrac{2\\pi \\cdot 360}{16\\pi} = 45°\\)." },
      { id: 24, level: 4, typ: "mc", frage: "Was ist der Unterschied zwischen Kreissektor und Kreissegment?", optionen: ["Sektor: Sehne und Bogen; Segment: zwei Radien", "Sektor: zwei Radien und Bogen; Segment: Sehne und Bogen", "Sektor: zwei Sehnen; Segment: Radius und Bogen", "Sektor: Radius und Sehne; Segment: zwei Radien"], korrekt: 1, tipp: "Überlege bei beiden Figuren, welche Linien den Rand bilden — gerade Verbindungen zum Mittelpunkt oder nicht.", loesungsweg: "Sektor: 2 Radien + Bogen (Tortenstück). Segment: Sehne + Bogen (Mondsichel-artig)." },
      // ========== LEVEL 5 — Umkehraufgaben und zusammengesetzte Flächen ==========
      { id: 25, level: 5, typ: "numerisch", frage: "Ein Kreissektor mit dem Radius \\(6\\,\\text{cm}\\) hat den Umfang \\(28\\,\\text{cm}\\); dazu zählen die beiden geraden Begrenzungen und der Bogen. Berechne den Mittelpunktswinkel in Grad auf eine Dezimale.", loesung: 152.8, toleranz: 0.2, tipp: "Ziehe zuerst die beiden geraden Begrenzungen vom Umfang ab; was übrig bleibt, gehört zum Bogen.", loesungsweg: "Die beiden Radien tragen \\(2 \\cdot 6 = 12\\,\\text{cm}\\) bei, der Bogen also $$b = 28 - 12 = 16\\,\\text{cm}$$ Der volle Umfang wäre \\(2\\pi \\cdot 6 \\approx 37{,}70\\,\\text{cm}\\). Der Bogen macht davon den Anteil \\(\\frac{16}{37{,}70}\\) aus: $$\\alpha = \\frac{16}{37{,}70} \\cdot 360° \\approx 152{,}8°$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Kreissektor mit dem Radius \\(9\\,\\text{cm}\\) hat den Flächeninhalt \\(60\\,\\text{cm}^2\\). Berechne seine Bogenlänge in cm auf zwei Dezimalen.", loesung: 13.33, toleranz: 0.05, tipp: "Es gibt einen Zusammenhang zwischen Sektorfläche, Radius und Bogen, in dem der Winkel gar nicht vorkommt.", loesungsweg: "Für den Sektor gilt \\(A = \\frac{1}{2} \\cdot r \\cdot b\\) — der Winkel wird dafür nicht gebraucht. Umstellen nach \\(b\\): $$b = \\frac{2A}{r} = \\frac{2 \\cdot 60}{9} = \\frac{120}{9} \\approx 13{,}33\\,\\text{cm}$$ Kontrolle über den Winkel: \\(\\alpha = \\frac{13{,}33}{2\\pi \\cdot 9} \\cdot 360° \\approx 84{,}9°\\), und damit \\(A = \\frac{84{,}9}{360} \\cdot 81\\pi \\approx 60\\) ✓" },
      { id: 27, level: 5, typ: "mc", frage: "Ein Schüler bestimmt den Flächeninhalt eines Sektors mit \\(r = 8\\) und \\(\\alpha = 45°\\) als \\(\\frac{45}{360} \\cdot 2\\pi \\cdot 8 \\approx 6{,}28\\). Wo steckt der Fehler?", optionen: ["Der Bruch muss umgekehrt werden", "Er hat mit dem Umfang gerechnet", "Der Winkel gehört ins Bogenmaß", "Der Radius wurde nicht halbiert"], korrekt: 1, tipp: "Vergleiche die verwendete Kreisgröße mit der gesuchten und achte auf die Einheit des Ergebnisses.", loesungsweg: "Der Schüler nimmt den Anteil vom <b>Umfang</b> \\(2\\pi r\\) statt von der Fläche \\(\\pi r^2\\); sein Ergebnis ist deshalb eine Länge und keine Fläche. Richtig ist $$A = \\frac{45°}{360°} \\cdot \\pi \\cdot 8^2 = \\frac{1}{8} \\cdot 64\\pi = 8\\pi \\approx 25{,}13$$ Der Bruch \\(\\frac{45}{360}\\) selbst war korrekt gebildet." },
      { id: 28, level: 5, typ: "numerisch", frage: "Ein Kreissektor hat die Bogenlänge \\(10\\,\\text{cm}\\) und den Flächeninhalt \\(45\\,\\text{cm}^2\\). Berechne den Radius in cm.", loesung: 9, toleranz: 0.05, tipp: "Setze die beiden Angaben in den Zusammenhang ein, der Fläche, Radius und Bogen ohne den Winkel verbindet.", loesungsweg: "Aus \\(A = \\frac{1}{2} \\cdot r \\cdot b\\) folgt $$r = \\frac{2A}{b} = \\frac{2 \\cdot 45}{10} = 9\\,\\text{cm}$$ Der Mittelpunktswinkel ließe sich anschließend ergänzen: \\(\\alpha = \\frac{10}{2\\pi \\cdot 9} \\cdot 360° \\approx 63{,}7°\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Aus einem Viertelkreis mit dem Radius \\(10\\,\\text{cm}\\) wird das Dreieck entfernt, das von den beiden Radien und der Verbindungsstrecke ihrer Endpunkte begrenzt wird. Berechne den Inhalt der Restfläche in cm² auf zwei Dezimalen.", loesung: 28.54, toleranz: 0.1, tipp: "Die Restfläche ist die Differenz zweier bekannter Figuren; die beiden Radien des Viertelkreises stehen senkrecht aufeinander.", loesungsweg: "Sektorfläche: $$A_S = \\frac{90°}{360°} \\cdot \\pi \\cdot 100 = 25\\pi \\approx 78{,}54\\,\\text{cm}^2$$ Das Dreieck ist rechtwinklig mit den Katheten \\(10\\) und \\(10\\): \\(A_D = \\frac{1}{2} \\cdot 10 \\cdot 10 = 50\\,\\text{cm}^2\\). Rest: $$78{,}54 - 50 = 28{,}54\\,\\text{cm}^2$$ Diese Restfläche heißt Kreissegment." },
      { id: 30, level: 5, typ: "numerisch", frage: "Ein Kreis wird durch zwei Radien vollständig in zwei Sektoren zerlegt, deren Flächeninhalte sich wie \\(2 : 3\\) verhalten. Berechne den kleineren der beiden Mittelpunktswinkel in Grad.", loesung: 144, toleranz: 0.2, tipp: "Die Flächen verhalten sich genauso wie die zugehörigen Mittelpunktswinkel; zusammen ergeben diese den vollen Winkel.", loesungsweg: "Beide Sektoren haben denselben Radius, ihre Flächen sind also den Winkeln proportional. Der Vollwinkel wird in \\(2 + 3 = 5\\) gleiche Teile zerlegt: $$\\alpha_1 = \\frac{2}{5} \\cdot 360° = 144°$$ Der zweite Winkel ist \\(\\frac{3}{5} \\cdot 360° = 216°\\); Probe: \\(144° + 216° = 360°\\) ✓" },
      // ========== LEVEL 6 — Behauptungen, Grenzfälle, Transfer ==========
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Verdoppelt man den Mittelpunktswinkel eines Sektors und halbiert zugleich seinen Radius, so bleibt der Flächeninhalt unverändert.“ Wie ist das zu bewerten?", optionen: ["richtig, beides gleicht sich aus", "falsch, die Fläche halbiert sich", "falsch, die Fläche verdoppelt sich", "richtig, aber nur bei \\(90°\\)"], korrekt: 1, tipp: "Achte darauf, dass der Radius in der Sektorformel quadriert auftritt, der Winkel dagegen nicht.", loesungsweg: "Es gilt \\(A = \\frac{\\alpha}{360°} \\cdot \\pi r^2\\). Mit dem doppelten Winkel und dem halben Radius: $$A_{\\text{neu}} = \\frac{2\\alpha}{360°} \\cdot \\pi \\left(\\frac{r}{2}\\right)^2 = \\frac{2\\alpha}{360°} \\cdot \\frac{\\pi r^2}{4} = \\frac{A}{2}$$ Die Halbierung des Radius viertelt die Fläche, die Verdopplung des Winkels verdoppelt sie — zusammen bleibt die Hälfte. Die Behauptung ist falsch." },
      { id: 32, level: 6, typ: "numerisch", frage: "Für welchen Radius stimmen in jedem Sektor eines Kreises die Maßzahl der Bogenlänge und die Maßzahl des Flächeninhalts überein, unabhängig vom Mittelpunktswinkel?", loesung: 2, toleranz: 0.02, tipp: "Stelle Fläche und Bogenlänge so dar, dass beide denselben Faktor enthalten, und vergleiche die übrigen Faktoren.", loesungsweg: "Für jeden Sektor gilt \\(A = \\frac{1}{2} r b\\). Gleichheit der Maßzahlen bedeutet $$\\frac{1}{2} r b = b$$ Da \\(b > 0\\) ist, darf durch \\(b\\) geteilt werden: \\(\\frac{r}{2} = 1\\), also \\(r = 2\\). Der Winkel kürzt sich vollständig heraus — die Bedingung gilt daher für alle Sektoren dieses Kreises zugleich." },
      { id: 33, level: 6, typ: "numerisch", frage: "Aus einem Kreisring mit dem Außenradius \\(10\\,\\text{cm}\\) und dem Innenradius \\(4\\,\\text{cm}\\) wird ein Stück mit dem Mittelpunktswinkel \\(72°\\) herausgeschnitten. Berechne dessen Flächeninhalt in cm² auf zwei Dezimalen.", loesung: 52.78, toleranz: 0.1, tipp: "Denke dir das Stück als Differenz zweier Sektoren mit demselben Winkel und unterschiedlichen Radien.", loesungsweg: "Der Winkel macht den Anteil \\(\\frac{72°}{360°} = \\frac{1}{5}\\) aus. Äußerer Sektor: \\(\\frac{1}{5} \\cdot 100\\pi = 20\\pi\\); innerer Sektor: \\(\\frac{1}{5} \\cdot 16\\pi = 3{,}2\\pi\\). Differenz: $$20\\pi - 3{,}2\\pi = 16{,}8\\pi \\approx 52{,}78\\,\\text{cm}^2$$ Kürzer: \\(\\frac{1}{5} \\cdot \\pi (100 - 16)\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Der Mantel eines Kegels wird aufgeschnitten und flach ausgebreitet; dabei entsteht ein Kreissektor mit dem Radius \\(12\\,\\text{cm}\\) und dem Mittelpunktswinkel \\(150°\\). Berechne den Radius des Grundkreises dieses Kegels in cm.", loesung: 5, toleranz: 0.05, tipp: "Beim Zusammenrollen wird der Bogen des Sektors genau zum Rand des Grundkreises; vergleiche diese beiden Längen.", loesungsweg: "Bogenlänge des Sektors: $$b = \\frac{150°}{360°} \\cdot 2\\pi \\cdot 12 = \\frac{5}{12} \\cdot 24\\pi = 10\\pi \\approx 31{,}42\\,\\text{cm}$$ Dieser Bogen bildet den Umfang des Grundkreises: $$2\\pi r = 10\\pi \\;\\Rightarrow\\; r = 5\\,\\text{cm}$$ Der Sektorradius \\(12\\,\\text{cm}\\) ist die Mantellinie des Kegels." },
      { id: 35, level: 6, typ: "mc", frage: "Behauptung: „Der Flächeninhalt eines Kreissegments beträgt stets die Hälfte des Inhalts des zugehörigen Sektors.“ Wie ist das zu bewerten?", optionen: ["richtig, die Sehne halbiert ihn", "falsch, der Anteil hängt vom Winkel ab", "richtig, weil ein Dreieck fehlt", "falsch, das Segment ist stets größer"], korrekt: 1, tipp: "Vergleiche für einen sehr kleinen und einen sehr großen Mittelpunktswinkel, wie viel das abgezogene Dreieck vom Sektor ausmacht.", loesungsweg: "Das Segment ist der Sektor ohne das Dreieck aus den beiden Radien und der Sehne. Bei \\(60°\\) und \\(r = 10\\) ergibt sich \\(52{,}36 - 43{,}30 \\approx 9{,}06\\), also nur etwa \\(17\\,\\%\\) des Sektors. Bei \\(180°\\) fällt das Dreieck ganz weg, das Segment ist dann der gesamte Halbkreis, also \\(100\\,\\%\\). Der Anteil wächst mit dem Winkel; die Behauptung ist <b>falsch</b>." },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Kreissektor mit dem Mittelpunktswinkel \\(40°\\) hat denselben Flächeninhalt wie ein Quadrat mit der Seitenlänge \\(6\\,\\text{cm}\\). Berechne den Radius des Sektors in cm auf zwei Dezimalen.", loesung: 10.16, toleranz: 0.05, tipp: "Bestimme zuerst den Flächeninhalt der Vergleichsfigur und stelle die Sektorbeziehung danach nach dem Radius um.", loesungsweg: "Das Quadrat hat den Inhalt \\(6^2 = 36\\,\\text{cm}^2\\). Für den Sektor gilt $$\\frac{40°}{360°} \\cdot \\pi r^2 = 36 \\;\\Rightarrow\\; \\frac{\\pi r^2}{9} = 36 \\;\\Rightarrow\\; r^2 = \\frac{324}{\\pi} \\approx 103{,}13$$ Wurzel ziehen: \\(r \\approx 10{,}16\\,\\text{cm}\\)." }];
    </script>
