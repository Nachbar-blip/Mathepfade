<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreissektor &amp; Bogenlänge - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '10-kreissektor';
    const THEMA_CONFIG = { name: 'Kreissektor & Bogenlänge', bereich: 'geometrie' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundlagen Kreis ==========
      { id: 1, level: 1, typ: "mc", frage: "Wie heißt der Teil einer Kreisfläche, der von zwei Radien und einem Bogen begrenzt wird?", optionen: ["Kreissehne", "Kreissegment", "Kreissektor", "Kreisbogen"], korrekt: 2, tipp: "„Sektor\" kommt von lat. „Schneider\" — wie ein Tortenstück.", loesungsweg: "Ein Kreissektor wird von zwei Radien und einem Kreisbogen begrenzt — wie ein Tortenstück." },
      { id: 2, level: 1, typ: "mc", frage: "Welche Formel gibt den Umfang eines Kreises mit Radius \\(r\\)?", optionen: ["\\(U = \\pi r\\)", "\\(U = 2\\pi r\\)", "\\(U = \\pi r^2\\)", "\\(U = 4\\pi r\\)"], korrekt: 1, tipp: "Umfang = 2 mal Pi mal Radius.", loesungsweg: "\\(U = 2\\pi r\\)." },
      { id: 3, level: 1, typ: "mc", frage: "Welche Formel gibt die Fläche eines Kreises?", optionen: ["\\(A = 2\\pi r\\)", "\\(A = \\pi r^2\\)", "\\(A = \\pi d\\)", "\\(A = r^2\\)"], korrekt: 1, tipp: "Fläche hat die Einheit Quadrat — der Radius muss quadriert werden.", loesungsweg: "\\(A = \\pi r^2\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "Berechne den Umfang eines Kreises mit \\(r = 5\\,\\text{cm}\\) (in cm, auf 2 Dezimalen, mit \\(\\pi = 3{,}14159\\)).", loesung: 31.42, toleranz: 0.05, tipp: "\\(U = 2\\pi r = 2\\pi \\cdot 5\\).", loesungsweg: "\\(U = 10\\pi \\approx 31{,}42\\,\\text{cm}\\)." },
      { id: 5, level: 1, typ: "numerisch", frage: "Berechne die Fläche eines Kreises mit \\(r = 3\\,\\text{cm}\\) (cm², 2 Dezimalen).", loesung: 28.27, toleranz: 0.05, tipp: "\\(A = \\pi r^2 = 9\\pi\\).", loesungsweg: "\\(A = 9\\pi \\approx 28{,}27\\,\\text{cm}^2\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Wie viele Grad hat ein Vollkreis?", optionen: ["\\(90°\\)", "\\(180°\\)", "\\(270°\\)", "\\(360°\\)"], korrekt: 3, tipp: "Ein ganzer Kreis hat …", loesungsweg: "Vollkreis: \\(360°\\)." },
      // ========== LEVEL 2 — Bogenlänge ==========
      { id: 7, level: 2, typ: "mc", frage: "Welche Formel gibt die Bogenlänge \\(b\\) bei Radius \\(r\\) und Mittelpunktswinkel \\(\\alpha\\) (in Grad)?", optionen: ["\\(b = \\tfrac{\\alpha}{360°} \\cdot 2\\pi r\\)", "\\(b = \\tfrac{\\alpha}{180°} \\cdot \\pi r\\)", "\\(b = \\alpha \\cdot r\\)", "Beide A und B sind richtig"], korrekt: 3, tipp: "Anteil am Gesamtumfang.", loesungsweg: "Bogenanteil = \\(\\tfrac{\\alpha}{360°}\\) vom Umfang \\(2\\pi r\\). Beide Schreibweisen sind äquivalent." },
      { id: 8, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 10\\), \\(\\alpha = 90°\\). Berechne die Bogenlänge (2 Dezimalen).", loesung: 15.71, toleranz: 0.05, tipp: "\\(\\tfrac{90}{360} = \\tfrac{1}{4}\\) vom Umfang.", loesungsweg: "\\(b = \\tfrac{1}{4} \\cdot 2\\pi \\cdot 10 = 5\\pi \\approx 15{,}71\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 6\\), \\(\\alpha = 60°\\). Bogenlänge (2 Dezimalen).", loesung: 6.28, toleranz: 0.05, tipp: "\\(\\tfrac{60}{360} = \\tfrac{1}{6}\\).", loesungsweg: "\\(b = \\tfrac{1}{6} \\cdot 2\\pi \\cdot 6 = 2\\pi \\approx 6{,}28\\)." },
      { id: 10, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 4\\), \\(\\alpha = 180°\\). Bogenlänge (2 Dezimalen).", loesung: 12.57, toleranz: 0.05, tipp: "Halbkreis.", loesungsweg: "\\(b = \\pi \\cdot 4 \\approx 12{,}57\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Kreis mit \\(r = 12\\), \\(\\alpha = 45°\\). Bogenlänge (2 Dezimalen).", loesung: 9.42, toleranz: 0.05, tipp: "\\(\\tfrac{45}{360} = \\tfrac{1}{8}\\).", loesungsweg: "\\(b = \\tfrac{1}{8} \\cdot 24\\pi = 3\\pi \\approx 9{,}42\\)." },
      { id: 12, level: 2, typ: "mc", frage: "Im Bogenmaß gilt für die Bogenlänge bei Radius \\(r\\) und Winkel \\(x\\) (Bogenmaß):", optionen: ["\\(b = r + x\\)", "\\(b = r \\cdot x\\)", "\\(b = \\tfrac{r}{x}\\)", "\\(b = \\pi r x\\)"], korrekt: 1, tipp: "Bogenmaß ist definiert als Bogenlänge durch Radius.", loesungsweg: "Bei \\(r = 1\\) entspricht \\(b = x\\). Allgemein: \\(b = r \\cdot x\\)." },
      // ========== LEVEL 3 — Sektorfläche ==========
      { id: 13, level: 3, typ: "mc", frage: "Formel für die Fläche eines Kreissektors mit Radius \\(r\\) und Winkel \\(\\alpha\\) in Grad:", optionen: ["\\(A = \\tfrac{\\alpha}{360°} \\cdot \\pi r^2\\)", "\\(A = \\tfrac{\\alpha}{180°} \\cdot \\pi r^2\\)", "\\(A = \\alpha \\cdot r^2\\)", "\\(A = \\tfrac{1}{2} r \\alpha\\)"], korrekt: 0, tipp: "Anteil an der Gesamtfläche \\(\\pi r^2\\).", loesungsweg: "\\(A_{\\text{Sektor}} = \\tfrac{\\alpha}{360°} \\cdot \\pi r^2\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Sektor mit \\(r = 10\\), \\(\\alpha = 90°\\). Fläche (2 Dezimalen).", loesung: 78.54, toleranz: 0.1, tipp: "\\(\\tfrac{1}{4}\\) des Gesamtkreises.", loesungsweg: "\\(A = \\tfrac{1}{4} \\cdot \\pi \\cdot 100 = 25\\pi \\approx 78{,}54\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Sektor mit \\(r = 6\\), \\(\\alpha = 60°\\). Fläche (2 Dezimalen).", loesung: 18.85, toleranz: 0.1, tipp: "\\(\\tfrac{1}{6}\\) des Gesamtkreises.", loesungsweg: "\\(A = \\tfrac{1}{6} \\cdot 36\\pi = 6\\pi \\approx 18{,}85\\)." },
      { id: 16, level: 3, typ: "numerisch", frage: "Sektor mit \\(r = 12\\), \\(\\alpha = 30°\\). Fläche (2 Dezimalen).", loesung: 37.70, toleranz: 0.1, tipp: "\\(\\tfrac{30}{360} = \\tfrac{1}{12}\\).", loesungsweg: "\\(A = \\tfrac{1}{12} \\cdot 144\\pi = 12\\pi \\approx 37{,}70\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Sektor mit \\(r = 5\\), \\(\\alpha = 144°\\). Fläche (2 Dezimalen).", loesung: 31.42, toleranz: 0.1, tipp: "\\(\\tfrac{144}{360} = \\tfrac{2}{5}\\).", loesungsweg: "\\(A = \\tfrac{2}{5} \\cdot 25\\pi = 10\\pi \\approx 31{,}42\\)." },
      { id: 18, level: 3, typ: "mc", frage: "Eine alternative Formel: \\(A_{\\text{Sektor}} = \\tfrac{1}{2} r \\cdot b\\) — was ist \\(b\\)?", optionen: ["Durchmesser", "Bogenlänge", "Sehne", "Höhe"], korrekt: 1, tipp: "Analog zur Dreiecksfläche \\(\\tfrac{1}{2} \\cdot g \\cdot h\\).", loesungsweg: "\\(b\\) ist die Bogenlänge: \\(A = \\tfrac{1}{2} r b\\)." },
      // ========== LEVEL 4 — Rückwärts / gemischt ==========
      { id: 19, level: 4, typ: "numerisch", frage: "Ein Sektor hat \\(r = 10\\) und Fläche \\(A = 50\\). Wie groß ist der Mittelpunktswinkel in Grad (2 Dezimalen)?", loesung: 57.30, toleranz: 0.5, tipp: "\\(50 = \\tfrac{\\alpha}{360} \\cdot 100\\pi\\). Auflösen nach \\(\\alpha\\).", loesungsweg: "\\(\\alpha = \\tfrac{50 \\cdot 360}{100\\pi} = \\tfrac{180}{\\pi} \\approx 57{,}30°\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Sektor mit Bogenlänge \\(b = 10\\) und \\(r = 5\\). Wie groß ist \\(\\alpha\\) in Grad (2 Dezimalen)?", loesung: 114.59, toleranz: 0.5, tipp: "\\(10 = \\tfrac{\\alpha}{360} \\cdot 10\\pi\\).", loesungsweg: "\\(\\alpha = \\tfrac{10 \\cdot 360}{10\\pi} = \\tfrac{360}{\\pi} \\approx 114{,}59°\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Ein Sektor hat Fläche \\(A = 12{,}57\\) und \\(\\alpha = 90°\\). Berechne den Radius (1 Dezimale).", loesung: 4.0, toleranz: 0.1, tipp: "\\(A = \\tfrac{1}{4}\\pi r^2 \\Rightarrow r^2 = \\tfrac{4A}{\\pi}\\).", loesungsweg: "\\(r^2 = \\tfrac{4 \\cdot 12{,}57}{\\pi} \\approx 16 \\Rightarrow r = 4\\)." },
      { id: 22, level: 4, typ: "numerisch", frage: "Ein Sektor hat Bogenlänge \\(b = 6\\pi\\) und \\(\\alpha = 120°\\). Berechne den Radius.", loesung: 9, toleranz: 0.1, tipp: "\\(b = \\tfrac{\\alpha}{360} \\cdot 2\\pi r\\).", loesungsweg: "\\(6\\pi = \\tfrac{1}{3} \\cdot 2\\pi r \\Rightarrow r = 9\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Kreis mit \\(r = 8\\): Wie groß ist der Winkel (in Grad), wenn die Bogenlänge \\(2\\pi\\) beträgt?", loesung: 45, toleranz: 0.5, tipp: "\\(2\\pi = \\tfrac{\\alpha}{360} \\cdot 16\\pi\\).", loesungsweg: "\\(\\alpha = \\tfrac{2\\pi \\cdot 360}{16\\pi} = 45°\\)." },
      { id: 24, level: 4, typ: "mc", frage: "Was ist der Unterschied zwischen Kreissektor und Kreissegment?", optionen: ["Kein Unterschied", "Sektor von 2 Radien + Bogen; Segment von Sehne + Bogen", "Sektor ist kleiner", "Segment hat keinen Winkel"], korrekt: 1, tipp: "Segment ist die Fläche zwischen Sehne und Bogen.", loesungsweg: "Sektor: 2 Radien + Bogen (Tortenstück). Segment: Sehne + Bogen (Mondsichel-artig)." },
      // ========== LEVEL 5 — Bogenmaß ==========
      { id: 25, level: 5, typ: "mc", frage: "Wie wird \\(180°\\) in Bogenmaß ausgedrückt?", optionen: ["\\(\\tfrac{\\pi}{2}\\)", "\\(\\pi\\)", "\\(2\\pi\\)", "\\(\\pi^2\\)"], korrekt: 1, tipp: "Halbkreis im Einheitskreis hat Bogenlänge \\(\\pi\\).", loesungsweg: "\\(180° = \\pi\\,\\text{rad}\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Sektor mit \\(r = 6\\) und Winkel \\(\\tfrac{\\pi}{3}\\) (Bogenmaß). Bogenlänge (2 Dezimalen).", loesung: 6.28, toleranz: 0.05, tipp: "\\(b = r \\cdot x\\).", loesungsweg: "\\(b = 6 \\cdot \\tfrac{\\pi}{3} = 2\\pi \\approx 6{,}28\\)." },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Sektor mit \\(r = 4\\) und Winkel \\(\\tfrac{\\pi}{2}\\). Berechne die Fläche (2 Dezimalen).", loesung: 12.57, toleranz: 0.1, tipp: "\\(A = \\tfrac{1}{2} r^2 x\\) (Bogenmaß).", loesungsweg: "\\(A = 0{,}5 \\cdot 16 \\cdot \\tfrac{\\pi}{2} = 4\\pi \\approx 12{,}57\\)." },
      { id: 28, level: 5, typ: "mc", frage: "Im Bogenmaß gilt für die Sektorfläche:", optionen: ["\\(A = \\tfrac{1}{2} r x\\)", "\\(A = \\tfrac{1}{2} r^2 x\\)", "\\(A = r^2 x\\)", "\\(A = \\pi r^2 x\\)"], korrekt: 1, tipp: "Analog zu \\(A = \\tfrac{1}{2} r b\\), aber mit \\(b = rx\\).", loesungsweg: "\\(A = \\tfrac{1}{2} r b = \\tfrac{1}{2} r (rx) = \\tfrac{1}{2} r^2 x\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Umrechnung: \\(225°\\) in Bogenmaß (Dezimal, 2 Dezimalen).", loesung: 3.93, toleranz: 0.05, tipp: "\\(x = \\tfrac{\\alpha \\cdot \\pi}{180}\\).", loesungsweg: "\\(x = \\tfrac{225\\pi}{180} = \\tfrac{5\\pi}{4} \\approx 3{,}93\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Umrechnung: \\(\\tfrac{3\\pi}{2}\\) in Grad.", loesung: 270, toleranz: 0, tipp: "\\(\\pi = 180°\\).", loesungsweg: "\\(\\tfrac{3\\pi}{2} = \\tfrac{3 \\cdot 180°}{2} = 270°\\)." },
      // ========== LEVEL 6 — Transfer ==========
      { id: 31, level: 6, typ: "numerisch", frage: "Ein Kreissegment besteht aus Sektor minus Dreieck. Sektor mit \\(r = 10, \\alpha = 60°\\). Dreiecksfläche: \\(\\tfrac{1}{2} \\cdot 10 \\cdot 10 \\cdot \\sin 60°\\). Berechne die Segmentfläche (2 Dezimalen).", loesung: 9.06, toleranz: 0.2, tipp: "Sektor: \\(\\tfrac{1}{6} \\cdot 100\\pi\\). Dreieck: \\(50 \\cdot \\sin 60°\\).", loesungsweg: "Sektor: \\(\\tfrac{100\\pi}{6} \\approx 52{,}36\\). Dreieck: \\(50 \\cdot 0{,}866 = 43{,}30\\). Segment: \\(52{,}36 - 43{,}30 \\approx 9{,}06\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Pizza mit \\(r = 15\\,\\text{cm}\\) wird in 8 gleiche Stücke geschnitten. Wie groß ist die Bogenlänge des Randes eines Stückes (cm, 2 Dezimalen)?", loesung: 11.78, toleranz: 0.1, tipp: "Ein Achtel des Umfangs.", loesungsweg: "\\(b = \\tfrac{1}{8} \\cdot 2\\pi \\cdot 15 = \\tfrac{15\\pi}{4} \\approx 11{,}78\\)." },
      { id: 33, level: 6, typ: "numerisch", frage: "Ein Uhrzeiger (Minutenzeiger, Länge 20 cm) bewegt sich in 15 Minuten um wie viele cm am Ende (2 Dezimalen)?", loesung: 31.42, toleranz: 0.1, tipp: "15 min = Viertelkreis, \\(\\alpha = 90°\\).", loesungsweg: "\\(b = \\tfrac{1}{4} \\cdot 2\\pi \\cdot 20 = 10\\pi \\approx 31{,}42\\,\\text{cm}\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Ein Rasensprenger wässert einen Sektor mit \\(r = 8\\,\\text{m}\\) und \\(\\alpha = 120°\\). Welche Fläche (m², 2 Dezimalen)?", loesung: 67.02, toleranz: 0.2, tipp: "\\(\\tfrac{1}{3}\\) des Kreises.", loesungsweg: "\\(A = \\tfrac{1}{3} \\cdot 64\\pi = \\tfrac{64\\pi}{3} \\approx 67{,}02\\,\\text{m}^2\\)." },
      { id: 35, level: 6, typ: "mc", frage: "Verdoppelt man den Radius eines Sektors bei gleichem Winkel, wie ändert sich die Fläche?", optionen: ["bleibt gleich", "verdoppelt sich", "vervierfacht sich", "verzehnfacht sich"], korrekt: 2, tipp: "Fläche \\(\\sim r^2\\).", loesungsweg: "Fläche ist proportional zu \\(r^2\\). Bei Verdoppelung: \\(2^2 = 4\\)-fach." },
      { id: 36, level: 6, typ: "numerisch", frage: "Ein Zirkusring besteht aus einem Kreisring: Außenradius \\(r_1 = 10\\), Innenradius \\(r_2 = 6\\). Berechne die Fläche (2 Dezimalen).", loesung: 201.06, toleranz: 0.5, tipp: "\\(A = \\pi(r_1^2 - r_2^2)\\).", loesungsweg: "\\(A = \\pi(100 - 36) = 64\\pi \\approx 201{,}06\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
