<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ableitungsregeln - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-ableitungsregeln';
    const THEMA_CONFIG = { name: 'Ableitungsregeln', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — Potenzregel
      { id: 1, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3\\). Berechne \\(f'(2)\\).", loesung: 12, toleranz: 0, tipp: "Potenzregel: \\((x^n)' = n \\cdot x^{n-1}\\).", loesungsweg: "\\(f'(x) = 3x^2\\). \\(f'(2) = 3 \\cdot 4 = 12\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^5\\). Berechne \\(f'(1)\\).", loesung: 5, toleranz: 0, tipp: "Potenzregel anwenden.", loesungsweg: "\\(f'(x) = 5x^4\\). \\(f'(1) = 5\\)." },
      { id: 3, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^4\\). Berechne \\(f'(3)\\).", loesung: 108, toleranz: 0, tipp: "\\(f'(x) = 4x^3\\).", loesungsweg: "\\(f'(3) = 4 \\cdot 27 = 108\\)." },
      { id: 4, level: 1, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = x^6\\)?", optionen: ["\\(6x^5\\)", "\\(5x^6\\)", "\\(6x^7\\)", "\\(x^5\\)"], korrekt: 0, tipp: "Potenzregel.", loesungsweg: "\\(f'(x) = 6x^5\\)." },
      { id: 5, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2\\). Berechne \\(f'(5)\\).", loesung: 10, toleranz: 0, tipp: "\\(f'(x) = 2x\\).", loesungsweg: "\\(f'(5) = 10\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Was ist die Ableitung von \\(f(x) = 7\\)?", optionen: ["\\(7\\)", "\\(1\\)", "\\(0\\)", "\\(7x\\)"], korrekt: 2, tipp: "Steigung einer horizontalen Geraden.", loesungsweg: "Konstanten haben Ableitung \\(0\\)." },
      // LEVEL 2 — Summen- und Faktorregel
      { id: 7, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 3x^2 - 4x + 1\\). Berechne \\(f'(2)\\).", loesung: 8, toleranz: 0, tipp: "Jeden Summanden einzeln ableiten.", loesungsweg: "\\(f'(x) = 6x - 4\\). \\(f'(2) = 8\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 5x^3 + 2x\\). Berechne \\(f'(1)\\).", loesung: 17, toleranz: 0, tipp: "Summen- und Faktorregel.", loesungsweg: "\\(f'(x) = 15x^2 + 2\\). \\(f'(1) = 17\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = -2x^3 + 6x^2 - x\\). Berechne \\(f'(0)\\).", loesung: -1, toleranz: 0, tipp: "\\(x=0\\) einsetzen.", loesungsweg: "\\(f'(x) = -6x^2 + 12x - 1\\). \\(f'(0) = -1\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = 4x^3 - 6x^2 + 2x - 5\\)?", optionen: ["\\(12x^2 - 12x + 2\\)", "\\(12x^2 - 6x + 2\\)", "\\(4x^2 - 6x + 2\\)", "\\(12x^2 - 12x - 5\\)"], korrekt: 0, tipp: "Konstante fällt weg.", loesungsweg: "\\(f'(x) = 12x^2 - 12x + 2\\)." },
      { id: 11, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{2}x^4 - 3x + 7\\). Berechne \\(f'(2)\\).", loesung: 13, toleranz: 0, tipp: "Faktor bleibt.", loesungsweg: "\\(f'(x) = 2x^3 - 3\\). \\(f'(2) = 13\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = -x^2 + 8x - 3\\). Berechne \\(f'(4)\\).", loesung: 0, toleranz: 0, tipp: "Was bedeutet \\(f'=0\\)?", loesungsweg: "\\(f'(x) = -2x + 8\\). \\(f'(4) = 0\\). Extremstelle!" },
      // LEVEL 3 — negative Exponenten
      { id: 13, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3 - 3x^2 + 3x - 1\\). Berechne \\(f'(1)\\).", loesung: 0, toleranz: 0, tipp: "Ableiten, einsetzen.", loesungsweg: "\\(f'(x) = 3x^2 - 6x + 3\\). \\(f'(1) = 0\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{x}\\). Berechne \\(f'(2)\\).", loesung: -0.25, toleranz: 0.01, tipp: "\\(\\frac{1}{x} = x^{-1}\\).", loesungsweg: "\\(f'(x) = -x^{-2} = -\\frac{1}{x^2}\\). \\(f'(2) = -0{,}25\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 2x^3 + \\frac{3}{x}\\). Berechne \\(f'(1)\\).", loesung: 3, toleranz: 0, tipp: "\\(\\frac{3}{x} = 3x^{-1}\\).", loesungsweg: "\\(f'(x) = 6x^2 - 3x^{-2}\\). \\(f'(1) = 3\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = \\frac{4}{x^2}\\)?", optionen: ["\\(-\\frac{8}{x^3}\\)", "\\(\\frac{8}{x^3}\\)", "\\(-\\frac{4}{x^3}\\)", "\\(\\frac{4}{x}\\)"], korrekt: 0, tipp: "Schreibe als \\(4x^{-2}\\).", loesungsweg: "\\(f'(x) = -8x^{-3} = -\\frac{8}{x^3}\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^4 - 4x^3 + 6x^2\\). Berechne \\(f'(-1)\\).", loesung: -28, toleranz: 0, tipp: "\\(f'(x) = 4x^3 - 12x^2 + 12x\\).", loesungsweg: "\\(f'(-1) = -4 - 12 - 12 = -28\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{3}x^3 - \\frac{1}{2}x^2 + x\\). Berechne \\(f'(3)\\).", loesung: 7, toleranz: 0, tipp: "Einzeln ableiten.", loesungsweg: "\\(f'(x) = x^2 - x + 1\\). \\(f'(3) = 7\\)." },
      // LEVEL 4 — Produktregel, e^x, sin
      { id: 19, level: 4, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = e^x\\)?", optionen: ["\\(e^x\\)", "\\(xe^{x-1}\\)", "\\(\\frac{e^x}{x}\\)", "\\(e^{x+1}\\)"], korrekt: 0, tipp: "Einzige Funktion, die sich selbst reproduziert.", loesungsweg: "\\((e^x)' = e^x\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2 \\cdot e^x\\). Berechne \\(f'(0)\\).", loesung: 0, toleranz: 0, tipp: "Produktregel!", loesungsweg: "\\(f'(x) = e^x(x^2 + 2x)\\). \\(f'(0) = 0\\)." },
      { id: 21, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 3e^x + 2x^2\\). Berechne \\(f'(0)\\).", loesung: 3, toleranz: 0, tipp: "Summenregel.", loesungsweg: "\\(f'(x) = 3e^x + 4x\\). \\(f'(0) = 3\\)." },
      { id: 22, level: 4, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = \\sin(x)\\)?", optionen: ["\\(\\cos(x)\\)", "\\(-\\cos(x)\\)", "\\(-\\sin(x)\\)", "\\(\\sin(x)\\)"], korrekt: 0, tipp: "Ableitungskette sin→cos→-sin→-cos.", loesungsweg: "\\((\\sin x)' = \\cos x\\)." },
      { id: 23, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x \\cdot \\sin(x)\\). Berechne \\(f'(0)\\).", loesung: 0, toleranz: 0, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = \\sin x + x\\cos x\\). \\(f'(0) = 0\\)." },
      { id: 24, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2 \\cdot e^x\\). Berechne \\(f'(1)\\). Runde auf 2 Dezimalen.", loesung: 8.15, toleranz: 0.02, tipp: "Produktregel.", loesungsweg: "\\(f'(1) = 3e \\approx 8{,}15\\)." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (2x+1) \\cdot x^3\\). Berechne \\(f'(1)\\).", loesung: 11, toleranz: 0, tipp: "Ausmultiplizieren oder Produktregel.", loesungsweg: "\\(f(x) = 2x^4 + x^3\\), \\(f'(x) = 8x^3 + 3x^2\\). \\(f'(1) = 11\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2 \\cdot \\cos(x)\\). Berechne \\(f'(0)\\).", loesung: 0, toleranz: 0, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = 2x\\cos x - x^2\\sin x\\). \\(f'(0) = 0\\)." },
      { id: 27, level: 5, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = x \\cdot e^x - 3x^2\\)?", optionen: ["\\(e^x + xe^x - 6x\\)", "\\(xe^x - 6x\\)", "\\(e^x + xe^x - 3x\\)", "\\(e^x - 6x\\)"], korrekt: 0, tipp: "Produktregel für \\(xe^x\\).", loesungsweg: "\\(f'(x) = e^x + xe^x - 6x\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 2\\sin(x) + 3\\cos(x)\\). Berechne \\(f'(0)\\).", loesung: 2, toleranz: 0, tipp: "Beachte Vorzeichen.", loesungsweg: "\\(f'(x) = 2\\cos x - 3\\sin x\\). \\(f'(0) = 2\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3 - 6x^2 + 9x + 1\\). Für welches größere \\(x\\) gilt \\(f'(x) = 0\\)?", loesung: 3, toleranz: 0, tipp: "Faktorisieren.", loesungsweg: "\\(f'(x) = 3(x-1)(x-3)\\). \\(x=3\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^x + x^2 - 4x\\). Berechne \\(f'(0)\\).", loesung: -3, toleranz: 0, tipp: "Summenregel.", loesungsweg: "\\(f'(x) = e^x + 2x - 4\\). \\(f'(0) = -3\\)." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^x \\cdot \\sin(x)\\). Berechne \\(f'(0)\\).", loesung: 1, toleranz: 0, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = e^x(\\sin x + \\cos x)\\). \\(f'(0) = 1\\)." },
      { id: 32, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^x \\cdot \\cos(x)\\). Berechne \\(f'(0)\\).", loesung: 1, toleranz: 0, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = e^x(\\cos x - \\sin x)\\). \\(f'(0) = 1\\)." },
      { id: 33, level: 6, typ: "mc", frage: "Gegeben \\(f(x) = x^2 e^x\\). Welche Aussage stimmt?", optionen: ["\\(f'(x) = e^x(x^2 + 2x)\\)", "\\(f'(x) = 2xe^x\\)", "\\(f'(x) = e^x(x^2 - 2x)\\)", "\\(f'(x) = x^2 e^x + 2x\\)"], korrekt: 0, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = e^x(x^2 + 2x)\\)." },
      { id: 34, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (x^2+1)\\sin(x)\\). Berechne \\(f'(\\pi/2)\\). Runde auf 2 Dezimalen.", loesung: 3.14, toleranz: 0.02, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = 2x\\sin x + (x^2+1)\\cos x\\). Bei \\(\\pi/2\\): \\(\\pi \\approx 3{,}14\\)." },
      { id: 35, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (3x-1)e^x\\). Berechne \\(f'(0)\\).", loesung: 2, toleranz: 0, tipp: "Produktregel.", loesungsweg: "\\(f'(x) = e^x(3x + 2)\\). \\(f'(0) = 2\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x e^x + \\sin(x) - x^3\\). Berechne \\(f'(0)\\).", loesung: 2, toleranz: 0, tipp: "Einzeln ableiten.", loesungsweg: "\\(f'(x) = e^x + xe^x + \\cos x - 3x^2\\). \\(f'(0) = 2\\)." }
    ];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
