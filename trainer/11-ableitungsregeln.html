<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ableitungsregeln - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-ableitungsregeln';
    const THEMA_CONFIG = { name: 'Ableitungsregeln', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — Potenzregel
      { id: 1, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3\\). Berechne \\(f'(2)\\).", loesung: 12, toleranz: 0, tipp: "Potenzregel: \\((x^n)' = n \\cdot x^{n-1}\\).", loesungsweg: "\\(f'(x) = 3x^2\\). \\(f'(2) = 3 \\cdot 4 = 12\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^5\\). Berechne \\(f'(1)\\).", loesung: 5, toleranz: 0, tipp: "Potenzregel anwenden.", loesungsweg: "\\(f'(x) = 5x^4\\). \\(f'(1) = 5\\)." },
      { id: 3, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^4\\). Berechne \\(f'(3)\\).", loesung: 108, toleranz: 0, tipp: "\\(f'(x) = 4x^3\\).", loesungsweg: "\\(f'(3) = 4 \\cdot 27 = 108\\)." },
      { id: 4, level: 1, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = x^6\\)?", optionen: ["\\(6x^5\\)", "\\(5x^6\\)", "\\(6x^7\\)", "\\(x^5\\)"], korrekt: 0, tipp: "Potenzregel.", loesungsweg: "Potenzregel: Der Exponent wird als Faktor nach vorn gezogen und um eins verringert. $$\\left(x^n\\right)' = n \\cdot x^{n-1} \\;\\Rightarrow\\; f'(x) = 6x^5$$ Der Exponent sinkt, er steigt nicht — \\(6x^7\\) wäre die häufigste Verwechslung." },
      { id: 5, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2\\). Berechne \\(f'(5)\\).", loesung: 10, toleranz: 0, tipp: "\\(f'(x) = 2x\\).", loesungsweg: "$$f'(x) = 2x \\;\\Rightarrow\\; f'(5) = 10$$ Das ist die Steigung der Tangente an die Normalparabel im Punkt \\((5|25)\\), nicht der Funktionswert." },
      { id: 6, level: 1, typ: "mc", frage: "Was ist die Ableitung von \\(f(x) = 7\\)?", optionen: ["\\(7\\)", "\\(1\\)", "\\(0\\)", "\\(7x\\)"], korrekt: 2, tipp: "Steigung einer horizontalen Geraden.", loesungsweg: "Der Graph einer konstanten Funktion ist eine waagerechte Gerade; ihre Steigung ist überall null. $$f(x) = 7 \\;\\Rightarrow\\; f'(x) = 0$$ Deshalb fällt bei jedem Polynom das konstante Glied beim Ableiten weg." },
      // LEVEL 2 — Summen- und Faktorregel
      { id: 7, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 3x^2 - 4x + 1\\). Berechne \\(f'(2)\\).", loesung: 8, toleranz: 0, tipp: "Jeden Summanden einzeln ableiten.", loesungsweg: "\\(f'(x) = 6x - 4\\). \\(f'(2) = 8\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 5x^3 + 2x\\). Berechne \\(f'(1)\\).", loesung: 17, toleranz: 0, tipp: "Summen- und Faktorregel.", loesungsweg: "\\(f'(x) = 15x^2 + 2\\). \\(f'(1) = 17\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = -2x^3 + 6x^2 - x\\). Berechne \\(f'(0)\\).", loesung: -1, toleranz: 0, tipp: "\\(x=0\\) einsetzen.", loesungsweg: "\\(f'(x) = -6x^2 + 12x - 1\\). \\(f'(0) = -1\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = 4x^3 - 6x^2 + 2x - 5\\)?", optionen: ["\\(12x^2 - 12x + 2\\)", "\\(12x^2 - 6x + 2\\)", "\\(4x^2 - 6x + 2\\)", "\\(12x^2 - 12x - 5\\)"], korrekt: 0, tipp: "Konstante fällt weg.", loesungsweg: "Jeden Summanden einzeln nach der Potenzregel ableiten: $$f'(x) = 3 \\cdot 4x^2 - 2 \\cdot 6x + 2 = 12x^2 - 12x + 2$$ Aus \\(2x\\) wird \\(2\\), und die Konstante \\(-5\\) verschwindet." },
      { id: 11, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{2}x^4 - 3x + 7\\). Berechne \\(f'(2)\\).", loesung: 13, toleranz: 0, tipp: "Faktor bleibt.", loesungsweg: "\\(f'(x) = 2x^3 - 3\\). \\(f'(2) = 13\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = -x^2 + 8x - 3\\). Berechne \\(f'(4)\\).", loesung: 0, toleranz: 0, tipp: "Was bedeutet \\(f'=0\\)?", loesungsweg: "\\(f'(x) = -2x + 8\\). \\(f'(4) = 0\\). Extremstelle!" },
      // LEVEL 3 — negative Exponenten
      { id: 13, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3 - 3x^2 + 3x - 1\\). Berechne \\(f'(1)\\).", loesung: 0, toleranz: 0, tipp: "Ableiten, einsetzen.", loesungsweg: "\\(f'(x) = 3x^2 - 6x + 3\\). \\(f'(1) = 0\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{x}\\). Berechne \\(f'(2)\\).", loesung: -0.25, toleranz: 0.01, tipp: "\\(\\frac{1}{x} = x^{-1}\\).", loesungsweg: "\\(f'(x) = -x^{-2} = -\\frac{1}{x^2}\\). \\(f'(2) = -0{,}25\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 2x^3 + \\frac{3}{x}\\). Berechne \\(f'(1)\\).", loesung: 3, toleranz: 0, tipp: "\\(\\frac{3}{x} = 3x^{-1}\\).", loesungsweg: "\\(f'(x) = 6x^2 - 3x^{-2}\\). \\(f'(1) = 3\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = \\frac{4}{x^2}\\)?", optionen: ["\\(-\\frac{8}{x^3}\\)", "\\(\\frac{8}{x^3}\\)", "\\(-\\frac{4}{x^3}\\)", "\\(\\frac{4}{x}\\)"], korrekt: 0, tipp: "Schreibe als \\(4x^{-2}\\).", loesungsweg: "\\(f'(x) = -8x^{-3} = -\\frac{8}{x^3}\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^4 - 4x^3 + 6x^2\\). Berechne \\(f'(-1)\\).", loesung: -28, toleranz: 0, tipp: "\\(f'(x) = 4x^3 - 12x^2 + 12x\\).", loesungsweg: "\\(f'(-1) = -4 - 12 - 12 = -28\\)." },
      { id: 18, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{3}x^3 - \\frac{1}{2}x^2 + x\\). Berechne \\(f'(3)\\).", loesung: 7, toleranz: 0, tipp: "Einzeln ableiten.", loesungsweg: "\\(f'(x) = x^2 - x + 1\\). \\(f'(3) = 7\\)." },
      // LEVEL 4 — Produktregel, e^x, sin
      { id: 19, level: 4, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = e^x\\)?", optionen: ["\\(e^x\\)", "\\(xe^{x-1}\\)", "\\(\\frac{e^x}{x}\\)", "\\(e^{x+1}\\)"], korrekt: 0, tipp: "Einzige Funktion, die sich selbst reproduziert.", loesungsweg: "Die natürliche Exponentialfunktion ist die einzige Funktion, die mit ihrer Ableitung übereinstimmt: $$\\left(e^x\\right)' = e^x$$ Genau deshalb wird die Basis \\(e\\) gewählt — bei \\(2^x\\) käme der Faktor \\(\\ln 2\\) hinzu. Die Potenzregel gilt hier <b>nicht</b>, denn die Variable steht im Exponenten." },
      { id: 20, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2 \\cdot e^x\\). Berechne \\(f'(2)\\) (2 Dezimalen).", loesung: 59.11, toleranz: 0.05, tipp: "Beide Summanden tragen hier bei.", loesungsweg: "Produktregel mit \\(u = x^2\\), \\(v = e^x\\): $$f'(x) = 2xe^x + x^2e^x = e^x(x^2+2x)$$ $$f'(2) = e^2(4+4) = 8e^2 \\approx 59{,}11$$" },
      { id: 21, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 3e^x + 2x^2\\). Berechne \\(f'(1)\\) (2 Dezimalen).", loesung: 12.15, toleranz: 0.05, tipp: "Jeden Summanden einzeln ableiten.", loesungsweg: "$$f'(x) = 3e^x + 4x$$ $$f'(1) = 3e + 4 \\approx 8{,}155 + 4 \\approx 12{,}15$$ Der Faktor \\(3\\) bleibt beim Ableiten von \\(e^x\\) stehen." },
      { id: 22, level: 4, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = \\sin(x)\\)?", optionen: ["\\(\\cos(x)\\)", "\\(-\\cos(x)\\)", "\\(-\\sin(x)\\)", "\\(\\sin(x)\\)"], korrekt: 0, tipp: "Ableitungskette sin→cos→-sin→-cos.", loesungsweg: "$$\\left(\\sin x\\right)' = \\cos x$$ Die Ableitungen laufen im Viererzyklus: \\(\\sin \\to \\cos \\to -\\sin \\to -\\cos \\to \\sin\\). Nach vier Schritten ist man wieder am Anfang." },
      { id: 23, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x \\cdot \\sin(x)\\). Berechne \\(f'\\!\\left(\\frac{\\pi}{4}\\right)\\) (3 Dezimalen).", loesung: 1.262, toleranz: 0.005, tipp: "\\(\\sin\\frac{\\pi}{4} = \\cos\\frac{\\pi}{4} = \\frac{\\sqrt2}{2}\\).", loesungsweg: "Produktregel mit \\(u = x\\), \\(v = \\sin x\\): $$f'(x) = \\sin x + x\\cos x$$ Mit \\(\\sin\\frac{\\pi}{4} = \\cos\\frac{\\pi}{4} = \\frac{\\sqrt2}{2} \\approx 0{,}7071\\): $$f'\\!\\left(\\frac{\\pi}{4}\\right) = 0{,}7071 + \\frac{\\pi}{4} \\cdot 0{,}7071 \\approx 1{,}262$$" },
      { id: 24, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2 \\cdot e^x\\). Berechne \\(f'(1)\\). Runde auf 2 Dezimalen.", loesung: 8.15, toleranz: 0.02, tipp: "Produktregel.", loesungsweg: "Produktregel mit \\(u = x^2\\), \\(v = e^x\\): $$f'(x) = 2xe^x + x^2e^x = e^x(x^2+2x)$$ $$f'(1) = e \\cdot 3 = 3e \\approx 8{,}15$$" },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (2x+1) \\cdot x^3\\). Berechne \\(f'(1)\\).", loesung: 11, toleranz: 0, tipp: "Ausmultiplizieren oder Produktregel.", loesungsweg: "\\(f(x) = 2x^4 + x^3\\), \\(f'(x) = 8x^3 + 3x^2\\). \\(f'(1) = 11\\)." },
      { id: 26, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2 \\cdot \\cos(x)\\). Berechne \\(f'(1)\\) im Bogenmaß (3 Dezimalen).", loesung: 0.239, toleranz: 0.005, tipp: "\\(\\cos 1 \\approx 0{,}5403\\), \\(\\sin 1 \\approx 0{,}8415\\) — im Bogenmaß rechnen.", loesungsweg: "Produktregel; die Ableitung des Kosinus bringt ein Minuszeichen: $$f'(x) = 2x\\cos x - x^2\\sin x$$ $$f'(1) = 2 \\cdot 0{,}5403 - 0{,}8415 \\approx 0{,}239$$ Das Vorzeichen im zweiten Summanden wird am häufigsten vergessen." },
      { id: 27, level: 5, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = x \\cdot e^x - 3x^2\\)?", optionen: ["\\(e^x + xe^x - 6x\\)", "\\(xe^x - 6x\\)", "\\(e^x + xe^x - 3x\\)", "\\(e^x - 6x\\)"], korrekt: 0, tipp: "Produktregel für \\(xe^x\\).", loesungsweg: "Der erste Summand verlangt die Produktregel, der zweite nur die Potenzregel: $$\\left(xe^x\\right)' = 1 \\cdot e^x + x \\cdot e^x$$ $$f'(x) = e^x + xe^x - 6x$$ Aus \\(-3x^2\\) wird \\(-6x\\), nicht \\(-3x\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 2\\sin(x) + 3\\cos(x)\\). Berechne \\(f'\\!\\left(\\frac{\\pi}{6}\\right)\\) (3 Dezimalen).", loesung: 0.232, toleranz: 0.005, tipp: "\\(\\cos\\frac{\\pi}{6} = \\frac{\\sqrt3}{2}\\), \\(\\sin\\frac{\\pi}{6} = \\frac12\\).", loesungsweg: "$$f'(x) = 2\\cos x - 3\\sin x$$ $$f'\\!\\left(\\frac{\\pi}{6}\\right) = 2 \\cdot \\frac{\\sqrt3}{2} - 3 \\cdot \\frac12 = \\sqrt3 - 1{,}5 \\approx 0{,}232$$ Aus \\(+3\\cos\\) wird \\(-3\\sin\\) — das Vorzeichen kippt nur beim Kosinus." },
      { id: 29, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3 - 6x^2 + 9x + 1\\). Für welches größere \\(x\\) gilt \\(f'(x) = 0\\)?", loesung: 3, toleranz: 0, tipp: "Faktorisieren.", loesungsweg: "\\(f'(x) = 3(x-1)(x-3)\\). \\(x=3\\)." },
      { id: 30, level: 5, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^x + x^2 - 4x\\). Berechne \\(f'(1)\\) (3 Dezimalen).", loesung: 0.718, toleranz: 0.005, tipp: "\\(e \\approx 2{,}718\\).", loesungsweg: "$$f'(x) = e^x + 2x - 4$$ $$f'(1) = e + 2 - 4 = e - 2 \\approx 0{,}718$$ Der Wert ist knapp positiv: Bei \\(x = 1\\) steigt die Funktion gerade eben wieder." },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "Für \\(f(x) = e^x \\cdot \\sin(x)\\) ist die Tangente an genau einer Stelle des Intervalls \\([0;\\pi]\\) waagerecht. An welcher? (3 Dezimalen, Bogenmaß)", loesung: 2.356, toleranz: 0.005, tipp: "Die Bedingung führt auf \\(\\tan x = -1\\).", loesungsweg: "Waagerechte Tangente heißt \\(f'(x) = 0\\). Mit der Produktregel: $$f'(x) = e^x\\sin x + e^x\\cos x = e^x(\\sin x + \\cos x)$$ Da \\(e^x\\) nie null wird, bleibt $$\\sin x + \\cos x = 0 \\;\\Rightarrow\\; \\tan x = -1$$ Im Intervall \\([0;\\pi]\\) ist das $$x = \\frac{3\\pi}{4} \\approx 2{,}356$$ Dass der Faktor \\(e^x\\) ausgeklammert werden darf, ist hier der entscheidende Schritt — er macht aus der Gleichung eine rein trigonometrische." },
      { id: 32, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = e^x \\cdot \\cos(x)\\). Berechne \\(f'(\\pi)\\) (3 Dezimalen).", loesung: -23.141, toleranz: 0.05, tipp: "\\(\\cos\\pi = -1\\), \\(\\sin\\pi = 0\\), \\(e^{\\pi} \\approx 23{,}141\\).", loesungsweg: "Produktregel: $$f'(x) = e^x\\cos x - e^x\\sin x = e^x(\\cos x - \\sin x)$$ $$f'(\\pi) = e^{\\pi}(-1 - 0) = -e^{\\pi} \\approx -23{,}141$$ Das Minuszeichen im zweiten Summanden stammt von \\((\\cos x)' = -\\sin x\\)." },
      { id: 33, level: 6, typ: "mc", frage: "Gegeben \\(f(x) = x^2 e^x\\). Welche Aussage stimmt?", optionen: ["\\(f'(x) = e^x(x^2 + 2x)\\)", "\\(f'(x) = 2xe^x\\)", "\\(f'(x) = e^x(x^2 - 2x)\\)", "\\(f'(x) = x^2 e^x + 2x\\)"], korrekt: 0, tipp: "Produktregel.", loesungsweg: "Produktregel mit \\(u = x^2\\), \\(u' = 2x\\), \\(v = e^x\\), \\(v' = e^x\\): $$f'(x) = 2xe^x + x^2e^x = e^x(x^2+2x)$$ Das Ausklammern von \\(e^x\\) lohnt sich für die Nullstellensuche: Da \\(e^x\\) nie null wird, genügt \\(x^2+2x = 0\\), also \\(x = 0\\) oder \\(x = -2\\). Die Antwort \\(2xe^x\\) ließe den zweiten Summanden weg — ein typischer Fehler." },
      { id: 34, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = (x^2+1)\\sin(x)\\). Berechne \\(f'(\\pi/2)\\). Runde auf 2 Dezimalen.", loesung: 3.14, toleranz: 0.02, tipp: "Produktregel.", loesungsweg: "Produktregel mit \\(u = x^2+1\\), \\(v = \\sin x\\): $$f'(x) = 2x\\sin x + (x^2+1)\\cos x$$ An der Stelle \\(\\tfrac{\\pi}{2}\\) ist \\(\\sin = 1\\) und \\(\\cos = 0\\), der zweite Summand entfällt also: $$f'\\!\\left(\\tfrac{\\pi}{2}\\right) = \\pi \\approx 3{,}14$$" },
      { id: 35, level: 6, typ: "numerisch", frage: "Für \\(f(x) = (3x-1)e^x\\) ist die Tangente an genau einer Stelle waagerecht. An welcher? (3 Dezimalen)", loesung: -0.667, toleranz: 0.005, tipp: "\\(e^x\\) wird nie null — es bleibt eine lineare Gleichung.", loesungsweg: "Produktregel mit \\(u = 3x-1\\), \\(v = e^x\\): $$f'(x) = 3e^x + (3x-1)e^x = e^x(3x+2)$$ Da \\(e^x > 0\\) für jedes \\(x\\) gilt, wird das Produkt nur null, wenn der zweite Faktor null wird: $$3x + 2 = 0 \\;\\Rightarrow\\; x = -\\frac23 \\approx -0{,}667$$ Wegen \\(f''\\!\\left(-\\tfrac23\\right) = 3e^{-2/3} > 0\\) liegt dort ein Tiefpunkt." },
      { id: 36, level: 6, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x e^x + \\sin(x) - x^3\\). Berechne \\(f'(1)\\) im Bogenmaß (3 Dezimalen).", loesung: 2.977, toleranz: 0.005, tipp: "\\(e \\approx 2{,}718\\), \\(\\cos 1 \\approx 0{,}5403\\).", loesungsweg: "Der erste Summand verlangt die Produktregel, die übrigen die Standardableitungen: $$f'(x) = e^x + xe^x + \\cos x - 3x^2$$ $$f'(1) = e + e + 0{,}5403 - 3 = 2e - 2{,}4597 \\approx 2{,}977$$ Aus \\(xe^x\\) werden <b>zwei</b> Summanden — das ist die Stelle, an der am häufigsten einer verloren geht." }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
