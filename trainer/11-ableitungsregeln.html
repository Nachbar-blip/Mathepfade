<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '11-ableitungsregeln';
    const THEMA_CONFIG = { name: 'Ableitungsregeln', bereich: 'analysis' };
    const AUFGABEN = [
      // LEVEL 1 — Potenzregel
      { id: 1, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3\\). Berechne \\(f'(2)\\).", loesung: 12, toleranz: 0, tipp: "Potenzregel: \\((x^n)' = n \\cdot x^{n-1}\\).", loesungsweg: "Die Potenzregel zieht den Exponenten als Faktor nach vorn und verringert ihn um eins: $$f'(x) = 3x^{3-1} = 3x^2$$ Einsetzen der Stelle: $$f'(2) = 3 \\cdot 2^2 = 12$$ Das ist die Steigung der Tangente im Punkt \\((2|8)\\), nicht der Funktionswert \\(8\\)." },
      { id: 2, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^5\\). Berechne \\(f'(1)\\).", loesung: 5, toleranz: 0, tipp: "Potenzregel anwenden.", loesungsweg: "Der Exponent \\(5\\) wird zum Faktor, der neue Exponent ist \\(4\\): $$f'(x) = 5x^4$$ Da jede Potenz von \\(1\\) wieder \\(1\\) ergibt, bleibt $$f'(1) = 5 \\cdot 1 = 5$$ An der Stelle \\(x = 1\\) liest man den Faktor vor der Potenz also unmittelbar ab." },
      { id: 3, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^4\\). Berechne \\(f'(3)\\).", loesung: 108, toleranz: 0, tipp: "\\(f'(x) = 4x^3\\).", loesungsweg: "Potenzregel: $$f'(x) = 4x^3$$ Einsetzen: $$f'(3) = 4 \\cdot 3^3 = 4 \\cdot 27 = 108$$ Erst potenzieren, dann mit \\(4\\) multiplizieren — die Reihenfolge der Rechenarten wird hier leicht verwechselt." },
      { id: 4, level: 1, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = x^6\\)?", optionen: ["\\(6x^5\\)", "\\(5x^6\\)", "\\(6x^7\\)", "\\(x^5\\)"], korrekt: 0, tipp: "Potenzregel.", loesungsweg: "Potenzregel: Der Exponent wird als Faktor nach vorn gezogen und um eins verringert. $$\\left(x^n\\right)' = n \\cdot x^{n-1} \\;\\Rightarrow\\; f'(x) = 6x^5$$ Der Exponent sinkt, er steigt nicht — \\(6x^7\\) wäre die häufigste Verwechslung." },
      { id: 5, level: 1, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^2\\). Berechne \\(f'(5)\\).", loesung: 10, toleranz: 0, tipp: "\\(f'(x) = 2x\\).", loesungsweg: "$$f'(x) = 2x \\;\\Rightarrow\\; f'(5) = 10$$ Das ist die Steigung der Tangente an die Normalparabel im Punkt \\((5|25)\\), nicht der Funktionswert." },
      { id: 6, level: 1, typ: "mc", frage: "Was ist die Ableitung von \\(f(x) = 7\\)?", optionen: ["\\(7\\)", "\\(1\\)", "\\(0\\)", "\\(7x\\)"], korrekt: 2, tipp: "Steigung einer horizontalen Geraden.", loesungsweg: "Der Graph einer konstanten Funktion ist eine waagerechte Gerade; ihre Steigung ist überall null. $$f(x) = 7 \\;\\Rightarrow\\; f'(x) = 0$$ Deshalb fällt bei jedem Polynom das konstante Glied beim Ableiten weg." },
      // LEVEL 2 — Summen- und Faktorregel
      { id: 7, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 3x^2 - 4x + 1\\). Berechne \\(f'(2)\\).", loesung: 8, toleranz: 0, tipp: "Jeden Summanden einzeln ableiten.", loesungsweg: "\\(f'(x) = 6x - 4\\). \\(f'(2) = 8\\)." },
      { id: 8, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 5x^3 + 2x\\). Berechne \\(f'(1)\\).", loesung: 17, toleranz: 0, tipp: "Summen- und Faktorregel.", loesungsweg: "\\(f'(x) = 15x^2 + 2\\). \\(f'(1) = 17\\)." },
      { id: 9, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = -2x^3 + 6x^2 - x\\). Berechne \\(f'(0)\\).", loesung: -1, toleranz: 0, tipp: "\\(x=0\\) einsetzen.", loesungsweg: "\\(f'(x) = -6x^2 + 12x - 1\\). \\(f'(0) = -1\\)." },
      { id: 10, level: 2, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = 4x^3 - 6x^2 + 2x - 5\\)?", optionen: ["\\(12x^2 - 12x + 2\\)", "\\(12x^2 - 6x + 2\\)", "\\(4x^2 - 6x + 2\\)", "\\(12x^2 - 12x - 5\\)"], korrekt: 0, tipp: "Konstante fällt weg.", loesungsweg: "Jeden Summanden einzeln nach der Potenzregel ableiten: $$f'(x) = 3 \\cdot 4x^2 - 2 \\cdot 6x + 2 = 12x^2 - 12x + 2$$ Aus \\(2x\\) wird \\(2\\), und die Konstante \\(-5\\) verschwindet." },
      { id: 11, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{2}x^4 - 3x + 7\\). Berechne \\(f'(2)\\).", loesung: 13, toleranz: 0, tipp: "Faktor bleibt.", loesungsweg: "\\(f'(x) = 2x^3 - 3\\). \\(f'(2) = 13\\)." },
      { id: 12, level: 2, typ: "numerisch", frage: "Gegeben ist \\(f(x) = -x^2 + 8x - 3\\). Berechne \\(f'(4)\\).", loesung: 0, toleranz: 0, tipp: "Was bedeutet \\(f'=0\\)?", loesungsweg: "\\(f'(x) = -2x + 8\\). \\(f'(4) = 0\\). Extremstelle!" },
      // LEVEL 3 — negative Exponenten
      { id: 13, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^3 - 3x^2 + 3x - 1\\). Berechne \\(f'(1)\\).", loesung: 0, toleranz: 0, tipp: "Ableiten, einsetzen.", loesungsweg: "\\(f'(x) = 3x^2 - 6x + 3\\). \\(f'(1) = 0\\)." },
      { id: 14, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{x}\\). Berechne \\(f'(2)\\).", loesung: -0.25, toleranz: 0.01, tipp: "\\(\\frac{1}{x} = x^{-1}\\).", loesungsweg: "\\(f'(x) = -x^{-2} = -\\frac{1}{x^2}\\). \\(f'(2) = -0{,}25\\)." },
      { id: 15, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = 2x^3 + \\frac{3}{x}\\). Berechne \\(f'(1)\\).", loesung: 3, toleranz: 0, tipp: "\\(\\frac{3}{x} = 3x^{-1}\\).", loesungsweg: "\\(f'(x) = 6x^2 - 3x^{-2}\\). \\(f'(1) = 3\\)." },
      { id: 16, level: 3, typ: "mc", frage: "Wie lautet die Ableitung von \\(f(x) = \\frac{4}{x^2}\\)?", optionen: ["\\(-\\frac{8}{x^3}\\)", "\\(\\frac{8}{x^3}\\)", "\\(-\\frac{4}{x^3}\\)", "\\(\\frac{4}{x}\\)"], korrekt: 0, tipp: "Schreibe als \\(4x^{-2}\\).", loesungsweg: "\\(f'(x) = -8x^{-3} = -\\frac{8}{x^3}\\)." },
      { id: 17, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = x^4 - 4x^3 + 6x^2\\). Berechne \\(f'(-1)\\).", loesung: -28, toleranz: 0, tipp: "Jeden Summanden einzeln ableiten und die negative Stelle sorgfältig einsetzen.", loesungsweg: "Gliedweise ableiten: $$f'(x) = 4x^3 - 12x^2 + 12x$$ Einsetzen von \\(x = -1\\): $$f'(-1) = 4 \\cdot (-1) - 12 \\cdot 1 + 12 \\cdot (-1) = -4 - 12 - 12 = -28$$ Die dritte Potenz bleibt negativ, das Quadrat wird positiv — daran scheitern die meisten Vorzeichenfehler." },
      { id: 18, level: 3, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{3}x^3 - \\frac{1}{2}x^2 + x\\). Berechne \\(f'(3)\\).", loesung: 7, toleranz: 0, tipp: "Einzeln ableiten.", loesungsweg: "\\(f'(x) = x^2 - x + 1\\). \\(f'(3) = 7\\)." },
      // LEVEL 4 — Verfahren wählen, Umkehraufgaben, Modell aus Text
      { id: 19, level: 4, typ: "numerisch", frage: "Der Graph von \\(f(x) = x^4 - 2x^3\\) hat an einer Stelle \\(x > 0\\) eine waagerechte Tangente. An welcher? (1 Dezimale)", loesung: 1.5, toleranz: 0.01, tipp: "Setze die Ableitung gleich null und klammere die kleinste Potenz aus.", loesungsweg: "Waagerechte Tangente bedeutet \\(f'(x) = 0\\): $$f'(x) = 4x^3 - 6x^2 = 2x^2(2x-3)$$ Das Produkt wird null, wenn ein Faktor null wird: $$2x^2 = 0 \\;\\Rightarrow\\; x = 0, \\qquad 2x - 3 = 0 \\;\\Rightarrow\\; x = 1{,}5$$ Beide Stellen sind Lösungen der Gleichung; wegen der Bedingung \\(x > 0\\) bleibt \\(x = 1{,}5\\)." },
      { id: 20, level: 4, typ: "numerisch", frage: "Für \\(f(x) = a \\cdot x^3\\) gilt \\(f'(2) = 36\\). Wie groß ist \\(a\\)?", loesung: 3, toleranz: 0, tipp: "Leite mit dem Buchstaben ab und setze die Stelle ein — es entsteht eine Gleichung für \\(a\\).", loesungsweg: "Der Faktor \\(a\\) bleibt beim Ableiten stehen: $$f'(x) = 3a x^2 \\;\\Rightarrow\\; f'(2) = 12a$$ Aus der Bedingung folgt $$12a = 36 \\;\\Rightarrow\\; a = 3$$ Die Aufgabe läuft rückwärts: nicht der Wert der Ableitung, sondern der Bauplan der Funktion ist gesucht." },
      { id: 21, level: 4, typ: "numerisch", frage: "Ein Bestand wird durch \\(N(t) = 0{,}5t^3 - 3t^2 + 20\\) beschrieben (\\(t\\) in Tagen). Zu welchem Zeitpunkt \\(t > 0\\) ändert sich der Bestand momentan nicht?", loesung: 4, toleranz: 0, tipp: "Momentan keine Änderung heißt: die Änderungsrate hat den Wert null.", loesungsweg: "Die momentane Änderung ist die Ableitung: $$N'(t) = 1{,}5t^2 - 6t = 1{,}5t(t-4)$$ Nullsetzen liefert \\(t = 0\\) und \\(t = 4\\); im Zeitraum \\(t > 0\\) ist das $$t = 4$$ Vorher schrumpft der Bestand, danach wächst er wieder — bei \\(t = 4\\) liegt der niedrigste Stand." },
      { id: 22, level: 4, typ: "mc", frage: "Welche Funktion hat die Ableitung \\(f'(x) = 6x^2 - 4x\\)?", optionen: ["\\(f(x) = 2x^3 - 2x^2 + 5\\)", "\\(f(x) = 6x^3 - 4x^2\\)", "\\(f(x) = 3x^2 - 2x + 1\\)", "\\(f(x) = 12x - 4 + 5x\\)"], korrekt: 0, tipp: "Leite die vier Vorschläge der Reihe nach ab und vergleiche.", loesungsweg: "Die Probe entscheidet. Ableiten von \\(2x^3 - 2x^2 + 5\\) ergibt $$f'(x) = 6x^2 - 4x$$ das konstante Glied \\(5\\) fällt weg. Bei \\(6x^3 - 4x^2\\) käme \\(18x^2 - 8x\\) heraus, bei \\(3x^2 - 2x + 1\\) nur \\(6x - 2\\). Rückwärts zu denken ist ungewohnt: die Exponenten müssen <b>steigen</b>, nicht sinken." },
      { id: 23, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{2x^3 - 5}{x^2}\\). Berechne \\(f'(1)\\).", loesung: 12, toleranz: 0, tipp: "Zerlege den Bruch in zwei Summanden, dann genügen Potenz- und Summenregel.", loesungsweg: "Zuerst wird der Bruch gliedweise zerlegt, dann ist keine Quotientenregel nötig: $$f(x) = \\frac{2x^3}{x^2} - \\frac{5}{x^2} = 2x - 5x^{-2}$$ $$f'(x) = 2 + 10x^{-3} = 2 + \\frac{10}{x^3}$$ $$f'(1) = 2 + 10 = 12$$ Das Umschreiben vorweg ist hier die eigentliche Leistung." },
      { id: 24, level: 4, typ: "numerisch", frage: "Gegeben ist \\(f(x) = \\frac{1}{x}\\). Für welches \\(x > 0\\) gilt \\(f'(x) = -\\frac{1}{9}\\)?", loesung: 3, toleranz: 0, tipp: "Bilde die Ableitung als Potenz und löse die entstehende Gleichung nach \\(x\\) auf.", loesungsweg: "Mit \\(\\frac1x = x^{-1}\\) folgt $$f'(x) = -x^{-2} = -\\frac{1}{x^2}$$ Die Bedingung wird zur Gleichung $$-\\frac{1}{x^2} = -\\frac19 \\;\\Rightarrow\\; x^2 = 9 \\;\\Rightarrow\\; x = \\pm 3$$ Wegen \\(x > 0\\) bleibt \\(x = 3\\). Die Steigung ist überall negativ — die Hyperbel fällt in beiden Ästen." },
      // LEVEL 5 — zwei Bedingungen, zwei Verfahren, Fehlersuche
      { id: 25, level: 5, typ: "numerisch", frage: "Für \\(f(x) = ax^3 + bx\\) gilt \\(f'(1) = 0\\) und \\(f'(2) = 9\\). Wie groß ist \\(b\\)?", loesung: -3, toleranz: 0, tipp: "Beide Bedingungen liefern je eine Gleichung in \\(a\\) und \\(b\\) — ein Gleichungssystem.", loesungsweg: "Die Ableitung enthält beide Parameter: $$f'(x) = 3ax^2 + b$$ Die zwei Bedingungen ergeben $$3a + b = 0 \\qquad\\text{und}\\qquad 12a + b = 9$$ Subtraktion der ersten von der zweiten Gleichung: \\(9a = 9\\), also \\(a = 1\\) und damit $$b = -3a = -3$$ Probe: \\(f'(x) = 3x^2 - 3\\) hat bei \\(x = 1\\) den Wert \\(0\\) und bei \\(x = 2\\) den Wert \\(9\\) ✓" },
      { id: 26, level: 5, typ: "mc", frage: "Jemand leitet \\(f(x) = \\frac{5}{x^2}\\) ab und erhält \\(f'(x) = \\frac{5}{2x}\\). Worin liegt der Fehler?", optionen: ["Der Nenner wurde abgeleitet statt in eine Potenz umgeschrieben", "Der Faktor \\(5\\) muss beim Ableiten ebenfalls verringert werden", "Der Exponent wurde um zwei statt nur um eins verringert", "Für negative Exponenten ist die Potenzregel nicht gültig"], korrekt: 0, tipp: "Leite den Term selbst sorgfältig ab und vergleiche dein Ergebnis Schritt für Schritt mit der vorgelegten Rechnung.", loesungsweg: "Man darf nicht Zähler und Nenner getrennt ableiten. Richtig ist das Umschreiben: $$f(x) = 5x^{-2} \\;\\Rightarrow\\; f'(x) = -10x^{-3} = -\\frac{10}{x^3}$$ Das Ergebnis ist <b>negativ</b> und hat \\(x^3\\) im Nenner — die falsche Rechnung hat beides nicht. Die Potenzregel gilt sehr wohl für negative Exponenten, und der Faktor \\(5\\) bleibt unverändert stehen." },
      { id: 27, level: 5, typ: "numerisch", frage: "Für \\(f(x) = x^3 - 3x^2\\) gibt es zwei Stellen, an denen \\(f'\\) und \\(f''\\) denselben Wert haben. Gib die größere an. (3 Dezimalen)", loesung: 3.414, toleranz: 0.005, tipp: "Stelle beide Ableitungen auf, setze sie gleich und löse die quadratische Gleichung.", loesungsweg: "Zwei Ableitungen werden gebraucht: $$f'(x) = 3x^2 - 6x, \\qquad f''(x) = 6x - 6$$ Gleichsetzen und ordnen: $$3x^2 - 6x = 6x - 6 \\;\\Rightarrow\\; 3x^2 - 12x + 6 = 0 \\;\\Rightarrow\\; x^2 - 4x + 2 = 0$$ $$x = 2 \\pm \\sqrt{2} \\;\\Rightarrow\\; x_1 \\approx 0{,}586, \\quad x_2 \\approx 3{,}414$$ Beide Lösungen sind reell und müssen betrachtet werden; gefragt ist die größere: \\(2 + \\sqrt2 \\approx 3{,}414\\)." },
      { id: 28, level: 5, typ: "numerisch", frage: "Der Graph von \\(f(x) = x + \\frac{4}{x}\\) hat für \\(x > 0\\) genau eine Stelle mit waagerechter Tangente. An welcher?", loesung: 2, toleranz: 0, tipp: "Schreibe den zweiten Summanden als Potenz, leite ab und setze die Ableitung gleich null.", loesungsweg: "Mit \\(\\frac4x = 4x^{-1}\\) folgt $$f'(x) = 1 - 4x^{-2} = 1 - \\frac{4}{x^2}$$ Nullsetzen: $$\\frac{4}{x^2} = 1 \\;\\Rightarrow\\; x^2 = 4 \\;\\Rightarrow\\; x = \\pm 2$$ Beide Werte lösen die Gleichung, doch nur \\(x = 2\\) liegt im geforderten Bereich \\(x > 0\\); die Stelle \\(x = -2\\) gehört zum linken Ast. Dort liegt der tiefste Punkt des rechten Astes mit \\(f(2) = 4\\)." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Becken enthält \\(V(t) = 120 - 6t + 0{,}1t^3\\) Liter (\\(t\\) in Minuten, \\(0 \\le t \\le 10\\)). Ab wann nimmt die Wassermenge nicht mehr ab? (2 Dezimalen)", loesung: 4.47, toleranz: 0.02, tipp: "Die Zu- und Abnahme steckt in der Änderungsrate; suche deren Vorzeichenwechsel.", loesungsweg: "Die momentane Änderung der Wassermenge ist $$V'(t) = -6 + 0{,}3t^2$$ Der Übergang von Abnahme zu Zunahme liegt bei \\(V'(t) = 0\\): $$0{,}3t^2 = 6 \\;\\Rightarrow\\; t^2 = 20 \\;\\Rightarrow\\; t = \\sqrt{20} \\approx 4{,}47$$ Die negative Lösung \\(-\\sqrt{20}\\) liegt außerhalb des Zeitraums. Vorher ist \\(V'(t) < 0\\) (Abnahme), danach \\(V'(t) > 0\\) — bei \\(t \\approx 4{,}47\\) ist der Wasserstand am niedrigsten." },
      { id: 30, level: 5, typ: "mc", frage: "Für welche Werte des Parameters \\(p\\) hat der Graph von \\(f(x) = x^3 + px\\) keine Stelle mit waagerechter Tangente?", optionen: ["für alle \\(p > 0\\)", "für alle \\(p < 0\\)", "nur für \\(p = 0\\)", "für kein \\(p\\)"], korrekt: 0, tipp: "Setze die Ableitung gleich null und überlege, wann die Gleichung lösbar ist.", loesungsweg: "Die Bedingung lautet $$f'(x) = 3x^2 + p = 0 \\;\\Rightarrow\\; x^2 = -\\frac{p}{3}$$ Ein Quadrat ist nie negativ, also ist die Gleichung nur lösbar, wenn \\(-\\frac{p}{3} \\ge 0\\), also \\(p \\le 0\\) gilt. Für \\(p > 0\\) gibt es demnach <b>keine</b> Lösung und damit keine waagerechte Tangente. Der Grenzfall \\(p = 0\\) liefert die doppelte Lösung \\(x = 0\\) — dort ist die Tangente waagerecht (Sattelpunkt), also gehört \\(p = 0\\) nicht zur Antwort." },
      // LEVEL 6 — Abi-Format: mehrschrittig mit Begründungsanteil
      { id: 31, level: 6, typ: "numerisch", frage: "Der Wasserstand eines Speichers wird für \\(0 \\le t \\le 8\\) (in Tagen) durch \\(h(t) = 0{,}25t^3 - 3t^2 + 9t + 5\\) (in Metern) beschrieben. Zeigen Sie, dass der Wasserstand an genau zwei Tagen momentan unverändert bleibt, und geben Sie den späteren an.", loesung: 6, toleranz: 0, tipp: "Die Bedingung führt auf eine quadratische Gleichung; prüfen Sie beide Lösungen auf den Zeitraum.", loesungsweg: "Unverändert heißt \\(h'(t) = 0\\): $$h'(t) = 0{,}75t^2 - 6t + 9$$ Division durch \\(0{,}75\\) ergibt $$t^2 - 8t + 12 = 0 \\;\\Rightarrow\\; t = 4 \\pm \\sqrt{16-12} = 4 \\pm 2$$ also \\(t_1 = 2\\) und \\(t_2 = 6\\). Beide liegen im Zeitraum \\([0; 8]\\) — damit sind es genau zwei Tage, mehr kann eine quadratische Gleichung nicht liefern. Der spätere ist $$t = 6$$ Zwischen den beiden Zeitpunkten fällt der Wasserstand, davor und danach steigt er." },
      { id: 32, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x) = ax^2 + \\frac{b}{x}\\) hat an der Stelle \\(x = 1\\) eine waagerechte Tangente, und es gilt \\(f(1) = 3\\). Wie groß ist \\(a\\)?", loesung: 1, toleranz: 0, tipp: "Jede der beiden Angaben liefert eine Gleichung in \\(a\\) und \\(b\\); lösen Sie das System.", loesungsweg: "Der zweite Summand wird als Potenz geschrieben: \\(f(x) = ax^2 + bx^{-1}\\), also $$f'(x) = 2ax - bx^{-2}$$ Die waagerechte Tangente gibt \\(f'(1) = 2a - b = 0\\), der Funktionswert gibt \\(f(1) = a + b = 3\\). Aus der ersten Gleichung folgt \\(b = 2a\\), eingesetzt: $$a + 2a = 3 \\;\\Rightarrow\\; a = 1, \\quad b = 2$$ Probe: \\(f'(x) = 2x - \\frac{2}{x^2}\\) ist bei \\(x=1\\) gleich null ✓ und \\(f(1) = 1 + 2 = 3\\) ✓" },
      { id: 33, level: 6, typ: "mc", frage: "Beurteilen Sie die Behauptung: <b>Der Graph von \\(f(x) = x^3 - 9x^2 + 27x + 4\\) besitzt keine waagerechte Tangente.</b>", optionen: ["Falsch: bei \\(x = 3\\) wird \\(f'\\) null, dort liegt ein Sattelpunkt", "Richtig: \\(f'\\) ist stets positiv und nimmt nirgends den Wert null an", "Falsch: \\(f'\\) hat zwei verschiedene Nullstellen, also zwei waagerechte Tangenten", "Richtig: der Graph einer Funktion dritten Grades ist niemals waagerecht"], korrekt: 0, tipp: "Bilden Sie \\(f'\\) und prüfen Sie mit der binomischen Formel, ob sich ein Quadrat abspalten lässt.", loesungsweg: "Die Ableitung lässt sich als Quadrat schreiben: $$f'(x) = 3x^2 - 18x + 27 = 3(x-3)^2$$ Sie ist überall \\(\\ge 0\\), wird aber an der Stelle \\(x = 3\\) tatsächlich null — die Behauptung ist also falsch. Weil \\(f'\\) dort das Vorzeichen <b>nicht</b> wechselt, liegt kein Extrempunkt, sondern ein Sattelpunkt mit waagerechter Tangente vor. Eine doppelte Nullstelle ist nur <b>eine</b> Stelle, nicht zwei." },
      { id: 34, level: 6, typ: "numerisch", frage: "Der Graph von \\(f(x) = \\frac13 x^3 - 2x^2 + 5x\\) hat an jeder Stelle eine Tangente. Wie groß ist die kleinste Steigung, die dabei überhaupt vorkommt?", loesung: 1, toleranz: 0, tipp: "Die Ableitung ist selbst eine Parabel — bringen Sie sie mit der quadratischen Ergänzung in die Scheitelform.", loesungsweg: "Die Tangentensteigungen sind die Werte der Ableitung: $$f'(x) = x^2 - 4x + 5$$ Das ist eine nach oben geöffnete Parabel; ihren kleinsten Wert liefert die quadratische Ergänzung: $$f'(x) = (x^2 - 4x + 4) + 1 = (x-2)^2 + 1$$ Ein Quadrat ist nie negativ, also gilt \\(f'(x) \\ge 1\\) für <b>jedes</b> \\(x\\), und der Wert \\(1\\) wird bei \\(x = 2\\) auch angenommen: $$f'(2) = 4 - 8 + 5 = 1$$ Die kleinste vorkommende Tangentensteigung ist somit \\(1\\). Dass die Diskriminante \\(16 - 20\\) negativ ist, bestätigt: \\(f'\\) hat keine Nullstelle, eine waagerechte Tangente gibt es nirgends." },
      { id: 35, level: 6, typ: "numerisch", frage: "Der Umsatz eines Betriebs wird durch \\(U(x) = -0{,}1x^3 + 3x^2\\) (in Tausend Euro) bei \\(x\\) Beratern beschrieben, \\(0 \\le x \\le 20\\). Bei welcher Anzahl Berater wächst der Umsatz am stärksten?", loesung: 10, toleranz: 0, tipp: "Gesucht ist die größte Änderungsrate — untersuchen Sie also die Ableitung auf ihren Höchstwert.", loesungsweg: "Die Wachstumsgeschwindigkeit ist $$U'(x) = -0{,}3x^2 + 6x$$ Sie ist selbst eine nach unten geöffnete Parabel und am größten, wo ihre Ableitung null wird: $$U''(x) = -0{,}6x + 6 = 0 \\;\\Rightarrow\\; x = 10$$ Weil \\(U''\\) dort von \\(+\\) nach \\(-\\) wechselt, ist das tatsächlich das Maximum von \\(U'\\) und nicht ein Minimum. Der Umsatz wächst bei \\(10\\) Beratern am schnellsten, nämlich um \\(U'(10) = 30\\) Tausend Euro je zusätzlichem Berater." },
      { id: 36, level: 6, typ: "mc", frage: "Ein Bestand wird durch \\(N(t) = 100 + 20t - t^2\\) beschrieben (\\(0 \\le t \\le 12\\)). Beurteilen Sie: <b>Der Bestand wächst im gesamten Zeitraum.</b>", optionen: ["Falsch: ab \\(t = 10\\) ist die Änderungsrate negativ, der Bestand nimmt ab", "Richtig: der Bestand bleibt im ganzen Zeitraum über dem Anfangswert \\(100\\)", "Falsch: der Bestand nimmt von Beginn an ab, weil \\(-t^2\\) stärker wirkt", "Richtig: die Änderungsrate ist überall positiv, denn \\(20 > 2t\\) gilt stets"], korrekt: 0, tipp: "Untersuchen Sie das Vorzeichen der Änderungsrate über dem gesamten Zeitraum.", loesungsweg: "Die Änderungsrate ist $$N'(t) = 20 - 2t$$ Sie ist positiv für \\(t < 10\\), null bei \\(t = 10\\) und negativ für \\(t > 10\\). Da der Zeitraum bis \\(t = 12\\) reicht, fällt der Bestand am Ende wieder: die Behauptung ist falsch. Dass \\(N(12) = 196\\) noch über dem Anfangswert \\(N(0) = 100\\) liegt, ändert nichts — <b>Wachstum</b> ist eine Aussage über die Rate, nicht über den Vergleich zweier Werte. Und \\(20 > 2t\\) gilt gerade nicht für alle \\(t\\) des Zeitraums." }];
