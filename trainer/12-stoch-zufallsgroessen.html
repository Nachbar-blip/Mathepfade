<!DOCTYPE html>

<head>

<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '12-stoch-zufallsgroessen';
    const THEMA_CONFIG = { name: 'Zufallsgrößen', bereich: 'stochastik' };
    const AUFGABEN = [
      // ========== LEVEL 1 — Grundbegriffe ==========
      { id:1, level:1, typ:"mc", frage:"Was ist eine Zufallsgröße?", optionen:["eine Zuordnung von jedem Ergebnis zu einer Zahl","eine Zuordnung von jedem Ergebnis zu einem Wort","eine Zuordnung von jeder Zahl zu einem Ergebnis","eine Zuordnung von jeder Zahl zu einem Diagramm"], korrekt:0, tipp:"Achte auf die Richtung der Zuordnung und darauf, was am Ende herauskommt.", loesungsweg:"Eine Zufallsgröße \\(X\\) ordnet <b>jedem Ergebnis</b> eines Zufallsexperiments eine reelle <b>Zahl</b> zu. Beim Wurf zweier Würfel kann das etwa die Augensumme sein. Die Richtung ist wesentlich: Eingabe ist das Ergebnis, Ausgabe die Zahl — umgekehrt wäre es keine Zufallsgröße. Erst durch diese Zuordnung lässt sich mit dem Ausgang eines Zufallsversuchs rechnen." },
      { id:2, level:1, typ:"mc", frage:"Was ist die Wahrscheinlichkeitsverteilung einer Zufallsgröße?", optionen:["die Zuordnung jedes Werts zu seiner Wahrscheinlichkeit","die Aufzählung aller Werte ohne ihre Wahrscheinlichkeit","der Mittelwert aller Werte der Zufallsgröße","die mittlere Abweichung vom Erwartungswert"], korrekt:0, tipp:"Frage, welche zwei Angaben eine Verteilung zusammenbringt.", loesungsweg:"Die Verteilung ordnet jedem möglichen Wert \\(x_i\\) seine Wahrscheinlichkeit \\(P(X=x_i)\\) zu; beides zusammen macht sie aus. Eine bloße Liste der Werte genügt nicht. Die Summe aller Wahrscheinlichkeiten ergibt \\(1\\) — das ist zugleich die schnellste Kontrolle. Mittelwert und mittlere Abweichung werden aus der Verteilung erst berechnet, sie sind nicht die Verteilung selbst." },
      { id:3, level:1, typ:"numerisch", frage:"Die Wahrscheinlichkeiten \\(P(X=1)=0{,}2\\), \\(P(X=2)=0{,}5\\), \\(P(X=3)=?\\). Wie groß ist die fehlende Wahrscheinlichkeit?", loesung:0.3, toleranz:0.001, tipp:"Summe muss 1 sein.", loesungsweg:"Die Wahrscheinlichkeiten einer Verteilung ergeben zusammen immer genau \\(1\\), denn einer der Werte muss eintreten: $$P(X=3) = 1 - 0{,}2 - 0{,}5 = 0{,}3$$ Diese Summenprobe eignet sich auch als schnelle Kontrolle jeder selbst aufgestellten Verteilung." },
      { id:4, level:1, typ:"mc", frage:"Welche Formel gilt für den Erwartungswert?", optionen:["\\(E(X) = \\sum x_i\\)","\\(E(X) = \\sum x_i P(X=x_i)\\)","\\(E(X) = \\max x_i\\)","\\(E(X) = n\\cdot p^2\\)"], korrekt:1, tipp:"Gewichtetes Mittel.", loesungsweg:"\\(E(X) = \\sum_i x_i \\cdot P(X=x_i)\\)." },
      { id:5, level:1, typ:"mc", frage:"Wie ist die Varianz definiert?", optionen:["\\(V(X) = E(X) - \\mu\\)","\\(V(X) = E((X-\\mu)^2)\\)","\\(V(X) = \\sqrt{E(X)}\\)","\\(V(X) = \\mu^2\\)"], korrekt:1, tipp:"Mittlere quadratische Abweichung.", loesungsweg:"\\(V(X) = E((X-\\mu)^2) = \\sum (x_i-\\mu)^2 P(X=x_i)\\)." },
      { id:6, level:1, typ:"mc", frage:"Wie berechnet man die Standardabweichung aus der Varianz?", optionen:["\\(\\sigma = V\\)","\\(\\sigma = V^2\\)","\\(\\sigma = \\sqrt{V}\\)","\\(\\sigma = \\tfrac{1}{V}\\)"], korrekt:2, tipp:"Wurzel ziehen.", loesungsweg:"Die Varianz ist ein Mittel <b>quadrierter</b> Abweichungen und trägt deshalb die quadrierte Einheit. Um zur ursprünglichen Einheit zurückzukommen, zieht man die Wurzel: $$\\sigma = \\sqrt{V(X)}$$ Deshalb ist \\(\\sigma\\) und nicht \\(V\\) die Größe, die man direkt mit Abständen vom Erwartungswert vergleichen kann." },
      // ========== LEVEL 2 — Erwartungswert berechnen ==========
      { id:7, level:2, typ:"numerisch", frage:"Wurf eines fairen Würfels. Zufallsgröße \\(X\\) = Augenzahl. Berechne \\(E(X)\\) (1 Dez.).", loesung:3.5, toleranz:0.05, tipp:"Alle Augenzahlen gleich wahrscheinlich.", loesungsweg:"$$E(X) = \\tfrac{1}{6}(1+2+3+4+5+6) = \\tfrac{21}{6} = 3{,}5$$" },
      { id:8, level:2, typ:"numerisch", frage:"\\(X\\) mit \\(P(X=0)=0{,}4\\), \\(P(X=1)=0{,}3\\), \\(P(X=2)=0{,}3\\). Berechne \\(E(X)\\).", loesung:0.9, toleranz:0.01, tipp:"Summe \\(x_i \\cdot P\\).", loesungsweg:"Der Erwartungswert ist die mit den Wahrscheinlichkeiten gewichtete Summe der Werte: $$E(X) = 0 \\cdot 0{,}4 + 1 \\cdot 0{,}3 + 2 \\cdot 0{,}3 = 0 + 0{,}3 + 0{,}6 = 0{,}9$$ Das arithmetische Mittel \\(\\frac{0+1+2}{3} = 1\\) wäre falsch — die Werte sind nicht gleich wahrscheinlich." },
      { id:9, level:2, typ:"numerisch", frage:"\\(X\\) mit \\(P(X=-1)=0{,}5\\), \\(P(X=1)=0{,}5\\). Berechne \\(E(X)\\).", loesung:0, toleranz:0.01, tipp:"Symmetrisch.", loesungsweg:"$$E(X) = (-1) \\cdot 0{,}5 + 1 \\cdot 0{,}5 = -0{,}5 + 0{,}5 = 0$$ Die Verteilung ist symmetrisch zu null; bei jeder solchen Verteilung liegt der Erwartungswert im Symmetriezentrum. Dass \\(E(X) = 0\\) ist, heißt keineswegs, dass \\(X\\) meist null wird — den Wert \\(0\\) nimmt \\(X\\) hier nie an." },
      { id:10, level:2, typ:"numerisch", frage:"Ein Glücksrad zahlt \\(5\\,€\\) mit der Wahrscheinlichkeit \\(0{,}2\\) aus, sonst nichts. Berechne den erwarteten Gewinn in Euro.", loesung:1, toleranz:0.01, tipp:"Jeden möglichen Ausgang mit seiner Wahrscheinlichkeit gewichten — auch den, bei dem nichts ausgezahlt wird.", loesungsweg:"$$E(X) = 5 \\cdot 0{,}2 + 0 \\cdot 0{,}8 = 1\\,€$$ Auf lange Sicht ergibt sich also ein durchschnittlicher Gewinn von \\(1\\,€\\) pro Spiel — ein Wert, der bei einem einzelnen Spiel nie auftritt." },
      { id:11, level:2, typ:"numerisch", frage:"\\(X\\) mit \\(P(X=10)=0{,}1\\), \\(P(X=20)=0{,}6\\), \\(P(X=30)=0{,}3\\). Berechne \\(E(X)\\).", loesung:22, toleranz:0.01, tipp:"Gewichtet mitteln.", loesungsweg:"$$E(X) = 10 \\cdot 0{,}1 + 20 \\cdot 0{,}6 + 30 \\cdot 0{,}3 = 1 + 12 + 9 = 22$$ Der Wert liegt näher an \\(20\\) als an \\(30\\), weil \\(20\\) die größte Wahrscheinlichkeit trägt." },
      { id:12, level:2, typ:"numerisch", frage:"\\(X\\) ist binomialverteilt mit \\(n=20\\) und \\(p=0{,}25\\). Berechne \\(E(X)\\).", loesung:5, toleranz:0, tipp:"Für die Binomialverteilung gibt es eine kurze Formel aus den beiden Parametern — die Verteilung muss man nicht aufschreiben.", loesungsweg:"Bei einer Binomialverteilung folgt der Erwartungswert direkt aus den beiden Parametern: $$E(X) = n \\cdot p = 20 \\cdot 0{,}25 = 5$$ Die allgemeine Formel \\(E(X)=\\sum x_i P(X=x_i)\\) liefert dasselbe, verlangt hier aber \\(21\\) Summanden. \\(E(X)=5\\) heißt: bei vielen Versuchsreihen mit je \\(20\\) Versuchen liegt die mittlere Trefferzahl bei \\(5\\)." },
      // ========== LEVEL 3 — Varianz und Standardabweichung ==========
      { id:13, level:3, typ:"numerisch", frage:"\\(X\\): \\(P(X=0)=0{,}5\\), \\(P(X=1)=0{,}5\\). Berechne \\(V(X)\\).", loesung:0.25, toleranz:0.01, tipp:"Zuerst den Erwartungswert bestimmen, dann jede Abweichung davon quadrieren und mit ihrer Wahrscheinlichkeit gewichten.", loesungsweg:"Erwartungswert: \\(\\mu = 0 \\cdot 0{,}5 + 1 \\cdot 0{,}5 = 0{,}5\\). Varianz als mittlere quadratische Abweichung: $$V(X) = (0-0{,}5)^2 \\cdot 0{,}5 + (1-0{,}5)^2 \\cdot 0{,}5 = 0{,}125 + 0{,}125 = 0{,}25$$ Das ist der größtmögliche Wert für eine Zufallsgröße mit nur den Werten \\(0\\) und \\(1\\) — die Unsicherheit ist bei \\(p = 0{,}5\\) am größten." },
      { id:14, level:3, typ:"numerisch", frage:"\\(X\\) ist die Augenzahl eines fairen Würfels. Berechne \\(V(X)\\) (2 Nachkommastellen).", loesung:2.92, toleranz:0.05, tipp:"Alle sechs Abweichungen vom Erwartungswert quadrieren und mitteln; beim fairen Würfel hat jede dasselbe Gewicht.", loesungsweg:"Beim Laplace-Würfel ist \\(\\mu = 3{,}5\\), und jede Augenzahl hat die Wahrscheinlichkeit \\(\\tfrac16\\). $$V(X) = \\tfrac{1}{6}\\sum_{k=1}^{6}(k-3{,}5)^2 = \\tfrac{6{,}25+2{,}25+0{,}25+0{,}25+2{,}25+6{,}25}{6} = \\tfrac{17{,}5}{6} \\approx 2{,}92$$ Die äußeren Augenzahlen tragen am meisten bei, weil ihre Abweichung quadriert wird." },
      { id:15, level:3, typ:"numerisch", frage:"\\(X\\) ist die Augenzahl eines fairen Würfels. Berechne \\(\\sigma\\) (2 Nachkommastellen).", loesung:1.71, toleranz:0.05, tipp:"Die Standardabweichung entsteht aus der Varianz durch einen letzten Rechenschritt, der die ursprüngliche Einheit zurückholt.", loesungsweg:"Mit \\(\\mu = 3{,}5\\) ergibt sich zunächst die Varianz: $$V(X) = \\frac{(1-3{,}5)^2 + \\dots + (6-3{,}5)^2}{6} = \\frac{17{,}5}{6} \\approx 2{,}9167$$ Weil darin quadrierte Abweichungen stecken, folgt die Standardabweichung durch Wurzelziehen: $$\\sigma = \\sqrt{2{,}9167} \\approx 1{,}71$$ Der Wert ist direkt mit Abständen auf der Augenskala vergleichbar: typische Würfe liegen etwa \\(1{,}7\\) Augen neben \\(3{,}5\\)." },
      { id:16, level:3, typ:"numerisch", frage:"\\(X\\): \\(P(X=-2)=0{,}25\\), \\(P(X=0)=0{,}5\\), \\(P(X=2)=0{,}25\\). Berechne \\(V(X)\\).", loesung:2, toleranz:0.01, tipp:"Prüfe zuerst, ob die Verteilung symmetrisch liegt — das vereinfacht den Erwartungswert und damit die ganze Rechnung.", loesungsweg:"Die Verteilung ist symmetrisch zu null, also \\(\\mu = 0\\). Damit fallen die Abweichungen mit den Werten selbst zusammen: $$V(X) = (-2)^2 \\cdot 0{,}25 + 0^2 \\cdot 0{,}5 + 2^2 \\cdot 0{,}25 = 1 + 0 + 1 = 2$$ Der mittlere Wert trägt nichts bei, weil er genau auf dem Erwartungswert liegt. Zur Kontrolle: \\(\\sigma = \\sqrt{2} \\approx 1{,}41\\) — das ist weniger als der Abstand \\(2\\) der äußeren Werte, weil in der Hälfte der Fälle \\(0\\) herauskommt." },
      { id:17, level:3, typ:"mc", frage:"Welche Formel ist äquivalent zu \\(V(X)\\)?", optionen:["\\(E(X^2)-E(X)^2\\)","\\(E(X)^2-E(X^2)\\)","\\(E(X)+\\mu\\)","\\(\\sum P(X=x_i)\\)"], korrekt:0, tipp:"Verschiebungssatz.", loesungsweg:"Ausmultiplizieren der Definition \\(V(X) = E\\big((X-\\mu)^2\\big)\\) liefert den Verschiebungssatz: $$V(X) = E(X^2) - E(X)^2$$ Er spart Arbeit, weil man die Abweichungen nicht einzeln bilden muss. Die Reihenfolge ist entscheidend — umgekehrt käme ein negativer Wert heraus, und eine Varianz ist nie negativ." },
      { id:18, level:3, typ:"numerisch", frage:"\\(X\\): \\(P(X=1)=0{,}3\\), \\(P(X=2)=0{,}5\\), \\(P(X=3)=0{,}2\\). Berechne \\(V(X)\\) (2 Nachkommastellen).", loesung:0.49, toleranz:0.02, tipp:"Über den Verschiebungssatz geht es kürzer als über die einzelnen Abweichungen — dafür braucht man zwei Erwartungswerte.", loesungsweg:"Zuerst die beiden Erwartungswerte: $$E(X) = 1 \\cdot 0{,}3 + 2 \\cdot 0{,}5 + 3 \\cdot 0{,}2 = 1{,}9$$ $$E(X^2) = 1 \\cdot 0{,}3 + 4 \\cdot 0{,}5 + 9 \\cdot 0{,}2 = 4{,}1$$ Verschiebungssatz: $$V(X) = E(X^2) - E(X)^2 = 4{,}1 - 1{,}9^2 = 4{,}1 - 3{,}61 = 0{,}49$$ Die Reihenfolge ist entscheidend — umgekehrt käme ein negativer Wert heraus, und eine Varianz ist nie negativ." },
      // ========== LEVEL 4 — Faires Spiel, Modell aus Text, Umkehraufgabe ==========
      { id:19, level:4, typ:"mc", frage:"Was bedeutet es, dass ein Glücksspiel <b>fair</b> ist?", optionen:["Der erwartete Nettogewinn beträgt null","Jeder Teilnehmer hat eine Gewinnchance","Alle Ausgänge sind gleich wahrscheinlich","Niemand kann bei dem Spiel verlieren"], korrekt:0, tipp:"Betrachte die Zufallsgröße „Gewinn abzüglich Einsatz“ und frage nach ihrem Erwartungswert.", loesungsweg:"Fair heißt: Auf lange Sicht verschafft das Spiel keiner Seite einen Vorteil. Als Zufallsgröße nimmt man den <b>Nettogewinn</b> \\(X = \\text{Auszahlung} - \\text{Einsatz}\\); die Bedingung lautet $$E(X) = 0$$ Gleiche Wahrscheinlichkeiten aller Ausgänge sind dafür weder nötig noch hinreichend — ein Spiel mit sehr ungleichen Wahrscheinlichkeiten kann fair sein, wenn die Auszahlungen passend gewählt sind. Dass jeder gewinnen <i>kann</i>, sagt über den Erwartungswert gar nichts." },
      { id:20, level:4, typ:"numerisch", frage:"Ein Spiel kostet \\(2\\,€\\) Einsatz. Mit der Wahrscheinlichkeit \\(0{,}2\\) wird \\(10\\,€\\) ausgezahlt, sonst nichts. Berechne den erwarteten Nettogewinn in Euro.", loesung:0, toleranz:0.01, tipp:"Erst die erwartete Auszahlung bestimmen, dann den Einsatz abziehen, der in jedem Fall fällig wird.", loesungsweg:"Die erwartete Auszahlung ist $$0{,}2 \\cdot 10\\,€ + 0{,}8 \\cdot 0\\,€ = 2\\,€$$ Der Einsatz wird unabhängig vom Ausgang fällig und geht deshalb voll ab: $$E(X) = 2\\,€ - 2\\,€ = 0$$ Das Spiel ist also fair. Nicht fair wäre es, den Einsatz nur im Verlustfall abzuziehen — er ist bereits bezahlt, wenn die Auszahlung erfolgt." },
      { id:21, level:4, typ:"numerisch", frage:"Bei einem Spiel gewinnt man mit der Wahrscheinlichkeit \\(\\tfrac16\\) genau \\(30\\,€\\), sonst nichts. Wie hoch muss der Einsatz \\(k\\) sein, damit das Spiel fair ist? (in Euro)", loesung:5, toleranz:0.01, tipp:"Umkehraufgabe: Setze die Fairness-Bedingung an und löse nach dem Einsatz auf.", loesungsweg:"Fairness bedeutet, dass die erwartete Auszahlung genau den Einsatz deckt: $$E(\\text{Auszahlung}) = k$$ $$\\frac16 \\cdot 30\\,€ = 5\\,€ \\;\\Rightarrow\\; k = 5\\,€$$ Bei einem höheren Einsatz ist das Spiel für den Anbieter günstig, bei einem niedrigeren für den Spieler. Die Zahl \\(5\\,€\\) tritt als einzelner Spielausgang nie auf — sie ist ein Mittelwert über viele Spiele." },
      { id:22, level:4, typ:"numerisch", frage:"Ein Automat zahlt bei einem Einsatz von \\(1\\,€\\) mit der Wahrscheinlichkeit \\(0{,}15\\) einen Gewinn von \\(5\\,€\\) und mit der Wahrscheinlichkeit \\(0{,}05\\) einen Gewinn von \\(10\\,€\\) aus; sonst zahlt er nichts. Berechne den erwarteten Nettogewinn je Spiel in Euro.", loesung:0.25, toleranz:0.01, tipp:"Erst die Verteilung der Auszahlung aus dem Text vollständig aufstellen — auch der Fall ohne Gewinn gehört dazu —, dann den Einsatz abziehen.", loesungsweg:"Die Auszahlung nimmt drei Werte an: \\(10\\,€\\) mit \\(0{,}05\\), \\(5\\,€\\) mit \\(0{,}15\\) und \\(0\\,€\\) mit der Restwahrscheinlichkeit \\(0{,}80\\). $$E(A) = 10 \\cdot 0{,}05 + 5 \\cdot 0{,}15 + 0 \\cdot 0{,}80 = 0{,}5 + 0{,}75 = 1{,}25\\,€$$ $$E(X) = 1{,}25\\,€ - 1\\,€ = 0{,}25\\,€$$ Der Automat ist für den Spieler also günstig. Die Restwahrscheinlichkeit steht nicht im Text und muss selbst erschlossen werden; ohne sie ist die Verteilung unvollständig." },
      { id:23, level:4, typ:"mc", frage:"Für ein Spielangebot gilt \\(E(X) \\lt 0\\), wobei \\(X\\) der Nettogewinn des Spielers ist. Was folgt daraus?", optionen:["Der Spieler macht auf Dauer Verlust","Der Spieler gewinnt auf Dauer Geld","Der Anbieter macht auf Dauer Verlust","Auf Dauer gleicht sich alles aus"], korrekt:0, tipp:"Deute den Erwartungswert als durchschnittlichen Ausgang bei sehr vielen Wiederholungen.", loesungsweg:"Der Erwartungswert ist der Durchschnitt, dem sich die mittleren Nettogewinne bei vielen Spielen annähern. Ist er negativ, so verliert der Spieler im Mittel je Spiel diesen Betrag — bei \\(E(X) = -0{,}50\\,€\\) und \\(200\\) Spielen also etwa \\(100\\,€\\). Für den Anbieter gilt das Gegenteil, sein Erwartungswert ist der Gegenwert. Einzelne große Gewinne widersprechen dem nicht: sie sind zu selten, um den Durchschnitt zu drehen." },
      { id:24, level:4, typ:"numerisch", frage:"Ein Vertreter schließt an einem Arbeitstag \\(0\\), \\(1\\) oder \\(2\\) Verträge ab, und zwar mit den Wahrscheinlichkeiten \\(0{,}5\\), \\(0{,}3\\) und \\(0{,}2\\). Mit wie vielen Verträgen kann er in einem Monat mit \\(20\\) Arbeitstagen rechnen?", loesung:14, toleranz:0.01, tipp:"Zuerst den Erwartungswert für einen einzelnen Tag; der Monat folgt daraus in einem zweiten Schritt.", loesungsweg:"Erwartungswert für einen Tag: $$E(X) = 0 \\cdot 0{,}5 + 1 \\cdot 0{,}3 + 2 \\cdot 0{,}2 = 0{,}7$$ Der Erwartungswert ist additiv, die Tage summieren sich also: $$20 \\cdot 0{,}7 = 14$$ Er kann mit rund \\(14\\) Verträgen rechnen. Der Tageswert \\(0{,}7\\) tritt selbst nie ein — Erwartungswerte müssen keine möglichen Ausgänge sein; erst die Summe über viele Tage wird zu einer realistischen Zahl." },
      // ========== LEVEL 5 — Verteilung aus Bedingungen, Transformation, Fehlersuche ==========
      { id:25, level:5, typ:"numerisch", frage:"Eine Zufallsgröße \\(X\\) nimmt nur die Werte \\(0\\), \\(2\\) und \\(5\\) an. Es ist \\(P(X=0)=0{,}3\\) und \\(E(X)=2{,}9\\). Bestimme \\(P(X=5)\\).", loesung:0.5, toleranz:0.01, tipp:"Zwei Bedingungen stehen zur Verfügung: die Summe aller Wahrscheinlichkeiten und der Erwartungswert.", loesungsweg:"Mit \\(a = P(X=2)\\) und \\(b = P(X=5)\\) gilt $$0{,}3 + a + b = 1 \\;\\Rightarrow\\; a + b = 0{,}7$$ $$0 \\cdot 0{,}3 + 2a + 5b = 2{,}9$$ Einsetzen von \\(a = 0{,}7 - b\\): $$2(0{,}7-b) + 5b = 2{,}9 \\;\\Rightarrow\\; 1{,}4 + 3b = 2{,}9 \\;\\Rightarrow\\; b = 0{,}5$$ Also \\(P(X=5)=0{,}5\\) und \\(P(X=2)=0{,}2\\). Probe: \\(0{,}4 + 2{,}5 = 2{,}9\\)." },
      { id:26, level:5, typ:"numerisch", frage:"Für \\(P(X=1)=0{,}1\\) und \\(P(X=4)=0{,}9\\) rechnet jemand \\(E(X)=\\tfrac{1+4}{2}=2{,}5\\). Berechne den richtigen Erwartungswert.", loesung:3.7, toleranz:0.01, tipp:"Vergleiche den benutzten Mittelwert mit der Definition — welche Größen fehlen darin?", loesungsweg:"Der vorgelegte Weg mittelt die Werte, ohne die Wahrscheinlichkeiten zu beachten. Richtig ist die Gewichtung: $$E(X) = 1 \\cdot 0{,}1 + 4 \\cdot 0{,}9 = 0{,}1 + 3{,}6 = 3{,}7$$ Der falsche Wert \\(2{,}5\\) liegt weit daneben und ist auch sachlich unhaltbar: in \\(90\\,\\%\\) der Fälle nimmt \\(X\\) den Wert \\(4\\) an, der Durchschnitt muss also nahe bei \\(4\\) liegen. Das arithmetische Mittel der Werte stimmt nur, wenn alle Wahrscheinlichkeiten gleich sind." },
      { id:27, level:5, typ:"numerisch", frage:"Für eine Zufallsgröße \\(X\\) ist \\(E(X)=4\\) und \\(\\sigma(X)=3\\). Berechne \\(E\\big((2X-7)^2\\big)\\).", loesung:37, toleranz:0, tipp:"Setze \\(Y=2X-7\\) und bestimme zuerst Erwartungswert und Varianz von \\(Y\\); danach hilft der Verschiebungssatz.", loesungsweg:"Zwei Verfahren greifen ineinander: lineare Transformation und Verschiebungssatz. Mit \\(Y = 2X-7\\) gilt $$E(Y) = 2 \\cdot 4 - 7 = 1, \\qquad V(Y) = 2^2 \\cdot 3^2 = 36$$ Der Verschiebungssatz \\(V(Y) = E(Y^2) - E(Y)^2\\) nach \\(E(Y^2)\\) aufgelöst: $$E(Y^2) = V(Y) + E(Y)^2 = 36 + 1 = 37$$ Der naheliegende Ansatz \\(E(Y^2) = E(Y)^2 = 1\\) wäre falsch — das Quadrieren ist keine lineare Operation und darf nicht in den Erwartungswert hineingezogen werden." },
      { id:28, level:5, typ:"numerisch", frage:"Ein Glücksrad zahlt \\(0\\,€\\) mit der Wahrscheinlichkeit \\(0{,}5\\), \\(4\\,€\\) mit \\(0{,}3\\) und \\(10\\,€\\) mit \\(0{,}2\\) aus. Der Anbieter will je Spiel im Mittel \\(0{,}50\\,€\\) verdienen. Welchen Einsatz muss er verlangen? (in Euro)", loesung:3.7, toleranz:0.01, tipp:"Erst die erwartete Auszahlung, dann die geforderte Marge als zusätzliche Bedingung ansetzen.", loesungsweg:"Erwartete Auszahlung: $$E(A) = 0 \\cdot 0{,}5 + 4 \\cdot 0{,}3 + 10 \\cdot 0{,}2 = 1{,}2 + 2 = 3{,}2\\,€$$ Der Gewinn des Anbieters je Spiel ist Einsatz minus erwartete Auszahlung: $$k - 3{,}2\\,€ = 0{,}50\\,€ \\;\\Rightarrow\\; k = 3{,}70\\,€$$ Bei \\(3{,}20\\,€\\) wäre das Spiel fair; die Marge ist genau der Betrag, um den der Einsatz darüber liegt." },
      { id:29, level:5, typ:"mc", frage:"Jemand begründet \\(V(2X) = V(X) + V(X)\\) damit, dass \\(2X = X + X\\) sei. Wo steckt der Fehler?", optionen:["Der Additionssatz gilt nur für unabhängige Größen","Die Varianz ist bei Summen grundsätzlich nicht additiv","Der Faktor \\(2\\) darf nicht vor \\(X\\) stehen bleiben","Die Varianz von \\(X+X\\) ist stets gleich null"], korrekt:0, tipp:"Prüfe die Voraussetzung des Additionssatzes für Varianzen — und ob \\(X\\) von sich selbst unabhängig sein kann.", loesungsweg:"Die Regel \\(V(X+Y) = V(X) + V(Y)\\) setzt <b>Unabhängigkeit</b> voraus. Eine Zufallsgröße ist von sich selbst aber nicht unabhängig: kennt man den ersten Summanden, kennt man den zweiten genau. Richtig ist die Transformationsregel $$V(2X) = 2^2 \\cdot V(X) = 4\\,V(X)$$ also das Vierfache statt des Doppelten. Anschaulich: \\(2X\\) streckt jede Abweichung auf das Doppelte, quadrierte Abweichungen also auf das Vierfache." },
      { id:30, level:5, typ:"numerisch", frage:"Eine Zufallsgröße nimmt nur die Werte \\(1\\) und \\(a\\) an, wobei \\(P(X=1)=0{,}25\\) ist. Bestimme \\(a\\) so, dass \\(E(X)=4\\) gilt.", loesung:5, toleranz:0.01, tipp:"Aus der Summenbedingung folgt die zweite Wahrscheinlichkeit; der unbekannte Wert bleibt als Variable in der Erwartungswertformel stehen.", loesungsweg:"Wegen \\(P(X=1)=0{,}25\\) ist \\(P(X=a)=0{,}75\\). Die Erwartungswertformel wird zur Gleichung für \\(a\\): $$0{,}25 \\cdot 1 + 0{,}75\\,a = 4 \\;\\Rightarrow\\; 0{,}75\\,a = 3{,}75 \\;\\Rightarrow\\; a = 5$$ Der Erwartungswert \\(4\\) liegt nahe bei \\(5\\), weil dieser Wert mit \\(75\\,\\%\\) das größte Gewicht trägt." },
      // ========== LEVEL 6 — Abi-Format (gA) ==========
      { id:31, level:6, typ:"numerisch", frage:"Eine Versicherung zahlt im Schadensfall \\(5000\\,€\\); ein Schaden tritt je Vertrag und Jahr mit der Wahrscheinlichkeit \\(0{,}4\\,\\%\\) ein. Berechnen Sie die Standardabweichung des Jahresgewinns je Vertrag bei einer Prämie von \\(30\\,€\\) (1 Nachkommastelle) und begründen Sie, ob die Prämienhöhe diesen Wert beeinflusst.", loesung:315.6, toleranz:2, tipp:"Die Verteilung des Gewinns aufstellen und überlegen, wie sich eine in jedem Fall gleiche Konstante auf die Streuung auswirkt.", loesungsweg:"Der Jahresgewinn \\(X\\) nimmt zwei Werte an: \\(30\\,€\\) mit \\(0{,}996\\) und \\(30\\,€ - 5000\\,€ = -4970\\,€\\) mit \\(0{,}004\\). Bequemer rechnet man über die Auszahlung \\(A\\) und die Regel \\(V(X) = V(30 - A) = V(A)\\): $$V(A) = 0{,}004 \\cdot 0{,}996 \\cdot 5000^2 = 99\\,600$$ $$\\sigma = \\sqrt{99\\,600} \\approx 315{,}6\\,€$$ <b>Begründung:</b> Die Prämie ist eine feste Zahl, die zu jedem Ausgang gleichermaßen hinzukommt; sie verschiebt die Verteilung, ändert aber die Abstände zwischen den Ausgängen nicht — also \\(V(X+c)=V(X)\\). Die Streuung hängt damit allein von Schadenhöhe und Schadenwahrscheinlichkeit ab. Bemerkenswert ist das Verhältnis: der erwartete Gewinn beträgt \\(30 - 20 = 10\\,€\\), die Streuung mehr als das Dreißigfache davon — erst sehr viele unabhängige Verträge machen das Geschäft berechenbar." },
      { id:32, level:6, typ:"mc", frage:"„Zwei Zufallsgrößen mit demselben Erwartungswert haben auch dieselbe Standardabweichung.“ Beurteilen Sie diese Behauptung.", optionen:["Richtig, denn \\(\\sigma\\) wird aus \\(\\mu\\) berechnet","Falsch, gleiche Mitte lässt jede Streuung zu","Falsch, die Standardabweichung ist immer größer","Richtig, sofern beide Größen dieselben Werte annehmen"], korrekt:1, tipp:"Suche zwei Verteilungen mit gleichem Mittelwert, von denen eine viel weiter streut als die andere.", loesungsweg:"Der Erwartungswert beschreibt die Lage, die Standardabweichung die Streuung — beides ist unabhängig voneinander. Gegenbeispiel: \\(X\\) nimmt \\(0\\) und \\(2\\) je mit \\(0{,}5\\) an, \\(Y\\) nimmt \\(-100\\) und \\(102\\) je mit \\(0{,}5\\) an. Beide haben \\(E = 1\\), aber $$\\sigma(X) = 1, \\qquad \\sigma(Y) = 101$$ Zur Berechnung von \\(\\sigma\\) braucht man \\(\\mu\\), \\(\\mu\\) allein bestimmt \\(\\sigma\\) aber nicht. Auch die Einschränkung auf dieselben Werte trifft es nicht: gleiche Werte bei verschiedenen Wahrscheinlichkeiten liefern verschiedene Streuungen." },
      { id:33, level:6, typ:"numerisch", frage:"Eine binomialverteilte Zufallsgröße hat \\(E(X)=24\\) und \\(V(X)=14{,}4\\). Bestimmen Sie den Stichprobenumfang \\(n\\).", loesung:60, toleranz:0, tipp:"Für die Binomialverteilung lassen sich Erwartungswert und Varianz beide durch \\(n\\) und \\(p\\) ausdrücken; der Quotient vereinfacht sich stark.", loesungsweg:"Für eine Binomialverteilung gilt \\(E(X) = np\\) und \\(V(X) = np(1-p)\\). Division der zweiten Gleichung durch die erste kürzt \\(np\\) heraus: $$1 - p = \\frac{14{,}4}{24} = 0{,}6 \\;\\Rightarrow\\; p = 0{,}4$$ $$n = \\frac{24}{0{,}4} = 60$$ Probe: \\(60 \\cdot 0{,}4 = 24\\) und \\(60 \\cdot 0{,}4 \\cdot 0{,}6 = 14{,}4\\). Die Lösung ist eindeutig, weil hier zwei Angaben vorliegen; aus \\(V\\) allein ergäbe sich für \\(p\\) noch ein zweiter Wert." },
      { id:34, level:6, typ:"numerisch", frage:"Ein Spiel kostet \\(1\\,€\\) Einsatz. Ein Würfel wird einmal geworfen; bei \\(5\\) oder \\(6\\) wird die Augenzahl in Euro ausgezahlt, sonst nichts. Berechnen Sie die Standardabweichung des Nettogewinns (2 Nachkommastellen).", loesung:2.61, toleranz:0.05, tipp:"Zuerst die Verteilung des Nettogewinns vollständig aufschreiben, dann \\(E(X)\\) und \\(E(X^2)\\) bestimmen.", loesungsweg:"Der Nettogewinn \\(X\\) nimmt drei Werte an: $$P(X=-1)=\\tfrac46, \\quad P(X=4)=\\tfrac16, \\quad P(X=5)=\\tfrac16$$ $$E(X) = \\frac{-4 + 4 + 5}{6} = \\frac56 \\approx 0{,}833$$ $$E(X^2) = \\frac{4 \\cdot 1 + 16 + 25}{6} = \\frac{45}{6} = 7{,}5$$ $$V(X) = 7{,}5 - \\left(\\tfrac56\\right)^2 \\approx 6{,}806 \\;\\Rightarrow\\; \\sigma \\approx 2{,}61$$ Die Streuung ist damit mehr als dreimal so groß wie der Erwartungswert: das Spiel ist im Mittel günstig, der einzelne Ausgang aber kaum vorhersagbar." },
      { id:35, level:6, typ:"mc", frage:"„Bei einem fairen Spiel ist die Standardabweichung des Nettogewinns gleich null.“ Beurteilen Sie diese Behauptung.", optionen:["Richtig, denn der erwartete Gewinn ist ja null","Falsch, die einzelnen Ausgänge weichen weiterhin ab","Falsch, bei fairen Spielen ist \\(\\sigma\\) stets sehr groß","Richtig, sofern Einsatz und Auszahlung übereinstimmen"], korrekt:1, tipp:"Überlege, welche Zufallsgrößen überhaupt die Standardabweichung null haben.", loesungsweg:"\\(\\sigma = 0\\) gilt genau dann, wenn die Zufallsgröße konstant ist — ein Spiel ohne jedes Risiko. Fairness betrifft dagegen nur die <b>Lage</b>: \\(E(X) = 0\\). Beispiel: Einsatz \\(2\\,€\\), Auszahlung \\(10\\,€\\) mit \\(p = 0{,}2\\). Dann ist \\(E(X) = 0\\), aber $$E(X^2) = 0{,}2 \\cdot 64 + 0{,}8 \\cdot 4 = 16 \\;\\Rightarrow\\; \\sigma = 4$$ Faire Spiele können also beliebig riskant sein. Umgekehrt ist \\(\\sigma\\) auch nicht grundsätzlich groß — sie hängt allein von den Auszahlungen ab." },
      { id:36, level:6, typ:"numerisch", frage:"Zwei unabhängige Zufallsgrößen haben \\(V(X)=9\\) und \\(V(Y)=16\\). Berechnen Sie \\(\\sigma(X+Y)\\) und begründen Sie, warum \\(\\sigma(X)+\\sigma(Y)\\) ein falsches Ergebnis liefert.", loesung:5, toleranz:0.01, tipp:"Erst überlegen, welche der beiden Kenngrößen sich bei unabhängigen Summanden addiert — und welche nicht.", loesungsweg:"Bei <b>unabhängigen</b> Zufallsgrößen addieren sich die Varianzen, nicht die Standardabweichungen: $$V(X+Y) = 9 + 16 = 25 \\;\\Rightarrow\\; \\sigma(X+Y) = \\sqrt{25} = 5$$ <b>Begründung:</b> \\(\\sigma(X) + \\sigma(Y) = 3 + 4 = 7\\) wäre zu groß. Das Wurzelziehen lässt sich nicht auf eine Summe verteilen: \\(\\sqrt{9+16} \\ne \\sqrt9 + \\sqrt{16}\\). Sachlich steckt dahinter, dass sich unabhängige Abweichungen teilweise ausgleichen — mal nach oben, mal nach unten. Nur wenn \\(Y\\) vollständig von \\(X\\) abhinge, etwa \\(Y = \\tfrac43 X\\), addierten sich die Standardabweichungen tatsächlich." }];
