<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zählprinzip &amp; Baumdiagramme - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../spirale.css">
    <style>:root { --spirale-primary: #10b981; --spirale-secondary: #059669; }</style>
</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-stoch-zaehlprinzip';
    const THEMA_CONFIG = { name: 'Zählprinzip & Baumdiagramme', bereich: 'stochastik' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Das Zählprinzip besagt: Wenn es in Stufe 1 \\(n_1\\) Möglichkeiten und in Stufe 2 \\(n_2\\) gibt, dann gesamt ...", optionen: ["\\(n_1 + n_2\\)", "\\(n_1 \\cdot n_2\\)", "\\(n_1 - n_2\\)", "\\(n_1^{n_2}\\)"], korrekt: 1, tipp: "Produktregel.", loesungsweg: "Zu jeder der \\(n_1\\) Möglichkeiten der ersten Stufe gehören sämtliche \\(n_2\\) Möglichkeiten der zweiten. Im Baumdiagramm verzweigt sich also jeder Ast erneut: $$\\text{Gesamt} = n_1 \\cdot n_2$$ Addiert würde nur, wenn man sich zwischen den Stufen <b>entscheiden</b> müsste, statt beide zu durchlaufen." },
      { id: 2, level: 1, typ: "numerisch", frage: "3 Hosen, 4 Shirts. Anzahl Outfits?", loesung: 12, toleranz: 0, tipp: "\\(3 \\cdot 4\\).", loesungsweg: "Zu jeder der \\(3\\) Hosen passen alle \\(4\\) Shirts: $$3 \\cdot 4 = 12 \\text{ Outfits}$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "Münze zweimal. Anzahl Ausgänge?", loesung: 4, toleranz: 0, tipp: "\\(2 \\cdot 2\\).", loesungsweg: "Jeder Wurf hat \\(2\\) Ausgänge, und der zweite Wurf verzweigt jeden der ersten: $$2 \\cdot 2 = 4$$ Die Ergebnismenge ist \\(\\{KK, KZ, ZK, ZZ\\}\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "Würfel dreimal. Anzahl Ausgänge?", loesung: 216, toleranz: 0, tipp: "\\(6^3\\).", loesungsweg: "Drei Stufen mit je \\(6\\) Möglichkeiten: $$6 \\cdot 6 \\cdot 6 = 6^3 = 216$$" },
      { id: 5, level: 1, typ: "mc", frage: "Die Pfadregel (Multiplikationsregel) sagt: Wahrscheinlichkeit eines Pfades ist ...", optionen: ["Summe der Astwahrscheinlichkeiten", "Produkt der Astwahrscheinlichkeiten", "Maximum der Astwahrscheinlichkeiten", "Anzahl der Aeste"], korrekt: 1, tipp: "Entlang eines Pfades multiplizieren.", loesungsweg: "Entlang eines Pfades werden die Wahrscheinlichkeiten <b>multipliziert</b>." },
      { id: 6, level: 1, typ: "mc", frage: "Die Summenregel (für Ereignisse aus mehreren Pfaden) sagt ...", optionen: ["multiplizieren", "addieren", "subtrahieren", "dividieren"], korrekt: 1, tipp: "Pfade desselben Ereignisses werden addiert.", loesungsweg: "Wahrscheinlichkeiten mehrerer günstiger Pfade werden <b>addiert</b>." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "PIN 4-stellig (0-9, Wiederholung erlaubt). Anzahl?", loesung: 10000, toleranz: 0, tipp: "\\(10^4\\).", loesungsweg: "Vier Stellen mit je \\(10\\) Ziffern, Wiederholung erlaubt: $$10^4 = 10\\,000$$ Die PINs reichen von \\(0000\\) bis \\(9999\\) — genau \\(10\\,000\\) Stück." },
      { id: 8, level: 2, typ: "numerisch", frage: "5 Bücher in Reihe. Anordnungen?", loesung: 120, toleranz: 0, tipp: "\\(5! = 120\\).", loesungsweg: "Für den ersten Platz gibt es \\(5\\) Bücher zur Auswahl, für den zweiten nur noch \\(4\\), dann \\(3\\), \\(2\\), \\(1\\): $$5 \\cdot 4 \\cdot 3 \\cdot 2 \\cdot 1 = 5! = 120$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "3 Personen auf 3 Plätze. Möglichkeiten?", loesung: 6, toleranz: 0, tipp: "\\(3!\\).", loesungsweg: "$$3! = 3 \\cdot 2 \\cdot 1 = 6$$ Mit jeder Besetzung des ersten Platzes schrumpft die Auswahl für die folgenden." },
      { id: 10, level: 2, typ: "numerisch", frage: "Menü: 3 Vorspeisen, 4 Hauptspeisen, 2 Desserts. Menüs?", loesung: 24, toleranz: 0, tipp: "\\(3 \\cdot 4 \\cdot 2\\).", loesungsweg: "Drei Stufen, die unabhängig kombiniert werden: $$3 \\cdot 4 \\cdot 2 = 24 \\text{ Menüs}$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Münze 4-mal. Anzahl Ausgänge?", loesung: 16, toleranz: 0, tipp: "\\(2^4\\).", loesungsweg: "Vier Würfe mit je \\(2\\) Ausgängen: $$2^4 = 16$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Autokennzeichen: 1 Buchstabe (26) + 2 Ziffern (10). Anzahl?", loesung: 2600, toleranz: 0, tipp: "\\(26 \\cdot 10 \\cdot 10\\).", loesungsweg: "Eine Stufe mit \\(26\\) Buchstaben, zwei Stufen mit je \\(10\\) Ziffern: $$26 \\cdot 10 \\cdot 10 = 2600$$" },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "Urne: 3 rot, 2 blau. 1. Zug Wahrsch. für rot?", loesung: 0.6, toleranz: 0.01, tipp: "3/5.", loesungsweg: "Von \\(5\\) Kugeln sind \\(3\\) rot, und alle sind gleich wahrscheinlich: $$P = \\frac{3}{5} = 0{,}6$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Urne: 3 rot, 2 blau. Mit Zurücklegen. \\(P(\\text{rot, rot})\\)?", loesung: 0.36, toleranz: 0.01, tipp: "\\(0{,}6 \\cdot 0{,}6\\).", loesungsweg: "Mit Zurücklegen bleibt die Zusammensetzung gleich, beide Züge haben dieselbe Wahrscheinlichkeit. Entlang eines Pfades wird multipliziert: $$0{,}6 \\cdot 0{,}6 = 0{,}36$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Urne: 3 rot, 2 blau. Ohne Zurücklegen. \\(P(\\text{rot, rot})\\) (4 Nachk.)?", loesung: 0.3, toleranz: 0.01, tipp: "\\(\\frac{3}{5} \\cdot \\frac{2}{4}\\).", loesungsweg: "Ohne Zurücklegen ändert sich die Urne: Beim zweiten Zug sind nur noch \\(2\\) von \\(4\\) Kugeln rot. $$\\frac{3}{5} \\cdot \\frac{2}{4} = 0{,}6 \\cdot 0{,}5 = 0{,}3$$ Der Unterschied zu \\(0{,}36\\) mit Zurücklegen zeigt, wie stark die Entnahme wirkt." },
      { id: 16, level: 3, typ: "numerisch", frage: "Münze 3-mal. \\(P(\\text{KKZ})\\) als Pfad?", loesung: 0.125, toleranz: 0.001, tipp: "\\((1/2)^3\\).", loesungsweg: "Jeder einzelne Wurf hat die Wahrscheinlichkeit \\(\\tfrac12\\); der Pfad Kopf-Kopf-Zahl ist genau eine Möglichkeit: $$\\left(\\tfrac12\\right)^3 = \\tfrac18 = 0{,}125$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Schüttel-Box: 70 % Blau. 2-mal ziehen (mit Zurück). \\(P(\\text{Blau, Blau})\\)?", loesung: 0.49, toleranz: 0.01, tipp: "\\(0{,}7^2\\).", loesungsweg: "Mit Zurücklegen sind die Züge unabhängig: $$0{,}7 \\cdot 0{,}7 = 0{,}49$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Elfmeter: Treffer 80%. 3-mal schiessen. \\(P(\\text{3x Treffer})\\) (4 Nachk.)?", loesung: 0.512, toleranz: 0.01, tipp: "\\(0{,}8^3\\).", loesungsweg: "Drei unabhängige Schüsse, jeder mit der Trefferwahrscheinlichkeit \\(0{,}8\\): $$0{,}8^3 = 0{,}512$$" },
      // LEVEL 4
      { id: 19, level: 4, typ: "numerisch", frage: "Urne 4 rot, 6 blau. Mit Zurück. 2 Züge. \\(P(\\text{genau 1 rot})\\)?", loesung: 0.48, toleranz: 0.01, tipp: "2 Pfade: RB + BR.", loesungsweg: "„Genau ein Rot\" lässt sich auf <b>zwei</b> Wegen erreichen: erst Rot dann Blau, oder erst Blau dann Rot. Entlang jedes Pfades wird multipliziert, die Pfade werden addiert: $$0{,}4 \\cdot 0{,}6 + 0{,}6 \\cdot 0{,}4 = 2 \\cdot 0{,}24 = 0{,}48$$ Das Übersehen des zweiten Pfades ist der häufigste Fehler bei dieser Aufgabenart." },
      { id: 20, level: 4, typ: "numerisch", frage: "Urne 3 rot, 2 blau. Ohne Zurück. 2 Züge. \\(P(\\text{1. rot, 2. blau})\\)?", loesung: 0.3, toleranz: 0.01, tipp: "\\(\\frac{3}{5} \\cdot \\frac{2}{4}\\).", loesungsweg: "Ohne Zurücklegen: Beim ersten Zug \\(3\\) von \\(5\\) rot, danach sind noch \\(4\\) Kugeln übrig, davon \\(2\\) blau. $$\\frac{3}{5} \\cdot \\frac{2}{4} = 0{,}3$$ Hier ist die Reihenfolge vorgegeben, es gibt also nur diesen einen Pfad." },
      { id: 21, level: 4, typ: "numerisch", frage: "Münze 3-mal. \\(P(\\text{genau 2 Kopf})\\)?", loesung: 0.375, toleranz: 0.01, tipp: "3 Pfade, je \\(1/8\\).", loesungsweg: "Genau zweimal Kopf bei drei Würfen: KKZ, KZK, ZKK — drei Pfade mit je \\(\\tfrac18\\): $$3 \\cdot \\tfrac18 = \\tfrac38 = 0{,}375$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Elfmeter 80%. 3 Schuss. \\(P(\\text{genau 2 Treffer})\\)?", loesung: 0.384, toleranz: 0.01, tipp: "3 Pfade: TTN, TNT, NTT. Je \\(0{,}8^2 \\cdot 0{,}2\\).", loesungsweg: "Der Nicht-Treffer kann an erster, zweiter oder dritter Stelle stehen — drei Pfade mit je \\(0{,}8^2 \\cdot 0{,}2 = 0{,}128\\): $$3 \\cdot 0{,}128 = 0{,}384$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Würfel 2-mal. \\(P(\\text{beide 6})\\) (4 Nachk.)?", loesung: 0.0278, toleranz: 0.001, tipp: "\\(1/36\\).", loesungsweg: "Zwei unabhängige Würfe: $$\\frac{1}{6} \\cdot \\frac{1}{6} = \\frac{1}{36} \\approx 0{,}0278$$" },
      { id: 24, level: 4, typ: "mc", frage: "„Mindestens eine 6\" bei 2 Würfen hat \\(P = ?\\) (4 Nachk.)", optionen: ["\\(0{,}1667\\)", "\\(0{,}3056\\)", "\\(0{,}5000\\)", "\\(0{,}8333\\)"], korrekt: 1, tipp: "1 - P(keine 6) = 1 - (5/6)^2.", loesungsweg: "Über das Gegenereignis geht es schneller als über alle günstigen Pfade. „Keine 6\" bedeutet zweimal eine der fünf anderen Augenzahlen: $$P(\\text{keine 6}) = \\left(\\tfrac56\\right)^2 = \\tfrac{25}{36}$$ $$P(\\text{mind. eine 6}) = 1 - \\tfrac{25}{36} = \\tfrac{11}{36} \\approx 0{,}3056$$ Wer stattdessen \\(\\tfrac16 + \\tfrac16\\) rechnet, zählt den Fall „zweimal 6\" doppelt." },
      // LEVEL 5
      { id: 25, level: 5, typ: "numerisch", frage: "Produktionstest: 5% Ausschuss. 3 Teile. \\(P(\\text{alle OK})\\) (4 Nachk.)?", loesung: 0.8574, toleranz: 0.005, tipp: "\\(0{,}95^3\\).", loesungsweg: "Ein Teil ist mit \\(95\\,\\%\\) in Ordnung; die drei Prüfungen sind unabhängig: $$0{,}95^3 \\approx 0{,}8574$$" },
      { id: 26, level: 5, typ: "numerisch", frage: "Produktionstest: 5% Ausschuss, 3 Teile geprüft. \\(P(\\text{mind. 1 Ausschuss})\\) (4 Nachk.)?", loesung: 0.1426, toleranz: 0.005, tipp: "1 - P(alle OK).", loesungsweg: "Das Gegenereignis zu „mindestens ein Ausschuss\" ist „alle in Ordnung\": $$1 - 0{,}95^3 \\approx 1 - 0{,}8574 = 0{,}1426$$ Bei „mindestens\"-Aufgaben lohnt fast immer der Umweg über das Gegenereignis." },
      { id: 27, level: 5, typ: "numerisch", frage: "Urne 2 rot, 3 blau. Ohne Zurück. 2 Züge. \\(P(\\text{beide gleich farbig})\\) (4 Nachk.)?", loesung: 0.4, toleranz: 0.01, tipp: "\\(\\frac{2}{5}\\cdot\\frac{1}{4} + \\frac{3}{5}\\cdot\\frac{2}{4}\\).", loesungsweg: "$$2/20 + 6/20 = 8/20 = 0{,}4$$" },
      { id: 28, level: 5, typ: "numerisch", frage: "3-stellige Zahl aus Ziffern 1-5, ohne Wdh. Anzahl?", loesung: 60, toleranz: 0, tipp: "\\(5 \\cdot 4 \\cdot 3\\).", loesungsweg: "Ohne Wiederholung schrumpft die Auswahl mit jeder Stelle: $$5 \\cdot 4 \\cdot 3 = 60$$" },
      { id: 29, level: 5, typ: "numerisch", frage: "Lottoklasse: 6 Fragen a 4 Antworten. Zufällig alle richtig? (4 Nachk.)", loesung: 0.0002, toleranz: 0.0001, tipp: "\\((1/4)^6\\).", loesungsweg: "Bei jeder Frage ist die Wahrscheinlichkeit \\(\\tfrac14\\), und alle sechs müssen stimmen: $$\\left(\\tfrac14\\right)^6 = \\frac{1}{4096} \\approx 0{,}0002$$ Reines Raten führt also in etwa zwei von zehntausend Fällen zum vollen Erfolg." },
      { id: 30, level: 5, typ: "numerisch", frage: "Urne 3 rot, 2 blau. Mit Zurück. 3 Züge. \\(P(\\text{alle rot})\\) (4 Nachk.)?", loesung: 0.216, toleranz: 0.005, tipp: "\\(0{,}6^3\\).", loesungsweg: "Mit Zurücklegen bleibt die Wahrscheinlichkeit in jedem Zug bei \\(0{,}6\\): $$0{,}6^3 = 0{,}216$$" },
      // LEVEL 6
      { id: 31, level: 6, typ: "numerisch", frage: "4 aus 7 ohne Wdh, Reihenfolge wichtig. Anzahl?", loesung: 840, toleranz: 0, tipp: "\\(7 \\cdot 6 \\cdot 5 \\cdot 4\\).", loesungsweg: "Für den ersten Platz gibt es \\(7\\) Möglichkeiten, dann \\(6\\), \\(5\\) und \\(4\\): $$7 \\cdot 6 \\cdot 5 \\cdot 4 = 840$$ Weil die Reihenfolge zählt, wird nicht durch \\(4!\\) geteilt — das wäre bei einer Auswahl ohne Reihenfolge nötig." },
      { id: 32, level: 6, typ: "numerisch", frage: "Buchstabenwort „MATHE\" alle Anordnungen?", loesung: 120, toleranz: 0, tipp: "\\(5!\\).", loesungsweg: "Das Wort hat \\(5\\) verschiedene Buchstaben: $$5! = 120$$ Wären Buchstaben doppelt vorhanden, müsste man durch deren Fakultäten teilen." },
      { id: 33, level: 6, typ: "numerisch", frage: "Urne 5 rot, 5 blau. Ohne Zurück, 3 Züge. \\(P(\\text{1.rot, 2.blau, 3.rot})\\) (4 Nachk.)?", loesung: 0.1389, toleranz: 0.005, tipp: "\\(\\frac{5}{10}\\cdot\\frac{5}{9}\\cdot\\frac{4}{8}\\).", loesungsweg: "Ohne Zurücklegen ändert sich die Urne nach jedem Zug: $$\\frac{5}{10} \\cdot \\frac{5}{9} \\cdot \\frac{4}{8} = \\frac{100}{720} \\approx 0{,}1389$$ Beim dritten Zug sind nur noch \\(4\\) rote von \\(8\\) Kugeln übrig, weil vorher schon eine rote entnommen wurde." },
      { id: 34, level: 6, typ: "numerisch", frage: "Test: 70% bestehen. 4 Schüler unabhängig. \\(P(\\text{alle bestehen})\\) (4 Nachk.)?", loesung: 0.2401, toleranz: 0.005, tipp: "\\(0{,}7^4\\).", loesungsweg: "Vier unabhängige Schüler: $$0{,}7^4 = 0{,}2401$$ Obwohl jeder einzeln recht sicher besteht, schaffen es alle vier nur in etwa einem Viertel der Fälle." },
      { id: 35, level: 6, typ: "mc", frage: "Warum werden bei Baumdiagrammen entlang Pfad multipliziert?", optionen: ["wegen Kommutativität", "weil sich die Astwahrscheinlichkeiten auf den bisherigen Pfad beziehen (Multiplikationssatz)", "weil die Summe immer 1 ist", "zufällig"], korrekt: 1, tipp: "Pfadregel.", loesungsweg: "Jeder Schritt bedingt den nächsten -- Wahrsch. werden multipliziert." },
      { id: 36, level: 6, typ: "numerisch", frage: "Urne 2 rot, 3 blau. Ohne Zurück. 2 Züge. \\(P(\\text{mind. 1 rot})\\) (4 Nachk.)?", loesung: 0.7, toleranz: 0.01, tipp: "1 - P(beide blau) = \\(1 - \\frac{3}{5}\\cdot\\frac{2}{4}\\).", loesungsweg: "Gegenereignis ist „beide blau\", ohne Zurücklegen: $$P(\\text{beide blau}) = \\frac{3}{5} \\cdot \\frac{2}{4} = 0{,}3$$ $$P(\\text{mind. 1 rot}) = 1 - 0{,}3 = 0{,}7$$" }];
    </script>
    <script src="../spirale-engine.js"></script>
</body>
</html>
