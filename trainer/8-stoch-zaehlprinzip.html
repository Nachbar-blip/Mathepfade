<!DOCTYPE html>
<html lang="de">
<head>

    <title>Zählprinzip &amp; Baumdiagramme - Mathepfade</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

</head>
<body>
    <div class="spirale-container" id="app"></div>
    <script>
    const THEMA_KEY = '8-stoch-zaehlprinzip';
    const THEMA_CONFIG = { name: 'Zählprinzip & Baumdiagramme', bereich: 'stochastik' };
    const AUFGABEN = [
      // LEVEL 1
      { id: 1, level: 1, typ: "mc", frage: "Das Zählprinzip besagt: Wenn es in Stufe 1 \\(n_1\\) Möglichkeiten und in Stufe 2 \\(n_2\\) gibt, dann gesamt ...", optionen: ["\\(n_1 + n_2\\)", "\\(n_1 \\cdot n_2\\)", "\\(n_1 - n_2\\)", "\\(n_1^{n_2}\\)"], korrekt: 1, tipp: "Produktregel.", loesungsweg: "Zu jeder der \\(n_1\\) Möglichkeiten der ersten Stufe gehören sämtliche \\(n_2\\) Möglichkeiten der zweiten. Im Baumdiagramm verzweigt sich also jeder Ast erneut: $$\\text{Gesamt} = n_1 \\cdot n_2$$ Addiert würde nur, wenn man sich zwischen den Stufen <b>entscheiden</b> müsste, statt beide zu durchlaufen." },
      { id: 2, level: 1, typ: "numerisch", frage: "3 Hosen, 4 Shirts. Anzahl Outfits?", loesung: 12, toleranz: 0, tipp: "\\(3 \\cdot 4\\).", loesungsweg: "Zu jeder der \\(3\\) Hosen passen alle \\(4\\) Shirts: $$3 \\cdot 4 = 12 \\text{ Outfits}$$" },
      { id: 3, level: 1, typ: "numerisch", frage: "Münze zweimal. Anzahl Ausgänge?", loesung: 4, toleranz: 0, tipp: "\\(2 \\cdot 2\\).", loesungsweg: "Jeder Wurf hat \\(2\\) Ausgänge, und der zweite Wurf verzweigt jeden der ersten: $$2 \\cdot 2 = 4$$ Die Ergebnismenge ist \\(\\{KK, KZ, ZK, ZZ\\}\\)." },
      { id: 4, level: 1, typ: "numerisch", frage: "Würfel dreimal. Anzahl Ausgänge?", loesung: 216, toleranz: 0, tipp: "\\(6^3\\).", loesungsweg: "Drei Stufen mit je \\(6\\) Möglichkeiten: $$6 \\cdot 6 \\cdot 6 = 6^3 = 216$$" },
      { id: 5, level: 1, typ: "mc", frage: "Die Pfadregel (Multiplikationsregel) sagt: Wahrscheinlichkeit eines Pfades ist ...", optionen: ["Summe der Astwahrscheinlichkeiten", "Produkt der Astwahrscheinlichkeiten", "Maximum der Astwahrscheinlichkeiten", "Anzahl der Aeste"], korrekt: 1, tipp: "Entlang eines Pfades multiplizieren.", loesungsweg: "Entlang eines Pfades werden die Wahrscheinlichkeiten <b>multipliziert</b> — jeder Ast gibt an, welcher Anteil der bisherigen Fälle weitergeht. Beispiel: zweimal Kopf \\(= \\tfrac12 \\cdot \\tfrac12 = \\tfrac14\\)." },
      { id: 6, level: 1, typ: "mc", frage: "Die Summenregel (für Ereignisse aus mehreren Pfaden) sagt ...", optionen: ["multiplizieren", "addieren", "subtrahieren", "dividieren"], korrekt: 1, tipp: "Pfade desselben Ereignisses werden addiert.", loesungsweg: "Führen mehrere Pfade zum selben Ereignis, werden ihre Wahrscheinlichkeiten <b>addiert</b>. Beispiel „genau einmal Kopf bei zwei Würfen\": KZ und ZK, \\(\\tfrac14 + \\tfrac14 = \\tfrac12\\)." },
      // LEVEL 2
      { id: 7, level: 2, typ: "numerisch", frage: "PIN 4-stellig (0-9, Wiederholung erlaubt). Anzahl?", loesung: 10000, toleranz: 0, tipp: "\\(10^4\\).", loesungsweg: "Vier Stellen mit je \\(10\\) Ziffern, Wiederholung erlaubt: $$10^4 = 10\\,000$$ Die PINs reichen von \\(0000\\) bis \\(9999\\) — genau \\(10\\,000\\) Stück." },
      { id: 8, level: 2, typ: "numerisch", frage: "5 Bücher in Reihe. Anordnungen?", loesung: 120, toleranz: 0, tipp: "\\(5! = 120\\).", loesungsweg: "Für den ersten Platz gibt es \\(5\\) Bücher zur Auswahl, für den zweiten nur noch \\(4\\), dann \\(3\\), \\(2\\), \\(1\\): $$5 \\cdot 4 \\cdot 3 \\cdot 2 \\cdot 1 = 5! = 120$$" },
      { id: 9, level: 2, typ: "numerisch", frage: "3 Personen auf 3 Plätze. Möglichkeiten?", loesung: 6, toleranz: 0, tipp: "\\(3!\\).", loesungsweg: "$$3! = 3 \\cdot 2 \\cdot 1 = 6$$ Mit jeder Besetzung des ersten Platzes schrumpft die Auswahl für die folgenden." },
      { id: 10, level: 2, typ: "numerisch", frage: "Menü: 3 Vorspeisen, 4 Hauptspeisen, 2 Desserts. Menüs?", loesung: 24, toleranz: 0, tipp: "\\(3 \\cdot 4 \\cdot 2\\).", loesungsweg: "Drei Stufen, die unabhängig kombiniert werden: $$3 \\cdot 4 \\cdot 2 = 24 \\text{ Menüs}$$" },
      { id: 11, level: 2, typ: "numerisch", frage: "Münze 4-mal. Anzahl Ausgänge?", loesung: 16, toleranz: 0, tipp: "\\(2^4\\).", loesungsweg: "Vier Würfe mit je \\(2\\) Ausgängen: $$2^4 = 16$$" },
      { id: 12, level: 2, typ: "numerisch", frage: "Autokennzeichen: 1 Buchstabe (26) + 2 Ziffern (10). Anzahl?", loesung: 2600, toleranz: 0, tipp: "\\(26 \\cdot 10 \\cdot 10\\).", loesungsweg: "Eine Stufe mit \\(26\\) Buchstaben, zwei Stufen mit je \\(10\\) Ziffern: $$26 \\cdot 10 \\cdot 10 = 2600$$" },
      // LEVEL 3
      { id: 13, level: 3, typ: "numerisch", frage: "Urne: 3 rot, 2 blau. Wahrscheinlichkeit für rot beim 1. Zug?", loesung: 0.6, toleranz: 0.01, tipp: "3/5.", loesungsweg: "Von \\(5\\) Kugeln sind \\(3\\) rot, und alle sind gleich wahrscheinlich: $$P = \\frac{3}{5} = 0{,}6$$" },
      { id: 14, level: 3, typ: "numerisch", frage: "Urne: 3 rot, 2 blau. Mit Zurücklegen. \\(P(\\text{rot, rot})\\)?", loesung: 0.36, toleranz: 0.01, tipp: "\\(0{,}6 \\cdot 0{,}6\\).", loesungsweg: "Mit Zurücklegen bleibt die Zusammensetzung gleich, beide Züge haben dieselbe Wahrscheinlichkeit. Entlang eines Pfades wird multipliziert: $$0{,}6 \\cdot 0{,}6 = 0{,}36$$" },
      { id: 15, level: 3, typ: "numerisch", frage: "Urne: 3 rot, 2 blau. Ohne Zurücklegen. \\(P(\\text{rot, rot})\\) (4 Nachk.)?", loesung: 0.3, toleranz: 0.01, tipp: "\\(\\frac{3}{5} \\cdot \\frac{2}{4}\\).", loesungsweg: "Ohne Zurücklegen ändert sich die Urne: Beim zweiten Zug sind nur noch \\(2\\) von \\(4\\) Kugeln rot. $$\\frac{3}{5} \\cdot \\frac{2}{4} = 0{,}6 \\cdot 0{,}5 = 0{,}3$$ Der Unterschied zu \\(0{,}36\\) mit Zurücklegen zeigt, wie stark die Entnahme wirkt." },
      { id: 16, level: 3, typ: "numerisch", frage: "Münze 3-mal. \\(P(\\text{KKZ})\\) als Pfad?", loesung: 0.125, toleranz: 0.001, tipp: "\\((1/2)^3\\).", loesungsweg: "Jeder einzelne Wurf hat die Wahrscheinlichkeit \\(\\tfrac12\\); der Pfad Kopf-Kopf-Zahl ist genau eine Möglichkeit: $$\\left(\\tfrac12\\right)^3 = \\tfrac18 = 0{,}125$$" },
      { id: 17, level: 3, typ: "numerisch", frage: "Schüttel-Box: 70 % Blau. 2-mal ziehen (mit Zurück). \\(P(\\text{Blau, Blau})\\)?", loesung: 0.49, toleranz: 0.01, tipp: "\\(0{,}7^2\\).", loesungsweg: "Mit Zurücklegen sind die Züge unabhängig: $$0{,}7 \\cdot 0{,}7 = 0{,}49$$" },
      { id: 18, level: 3, typ: "numerisch", frage: "Elfmeter: Treffer 80 %. 3-mal schießen. \\(P(\\text{3x Treffer})\\) (4 Nachk.)?", loesung: 0.512, toleranz: 0.01, tipp: "\\(0{,}8^3\\).", loesungsweg: "Drei unabhängige Schüsse, jeder mit der Trefferwahrscheinlichkeit \\(0{,}8\\): $$0{,}8^3 = 0{,}512$$" },
      // LEVEL 4
      { id: 19, level: 4, typ: "numerisch", frage: "Urne 4 rot, 6 blau. Mit Zurück. 2 Züge. \\(P(\\text{genau 1 rot})\\)?", loesung: 0.48, toleranz: 0.01, tipp: "2 Pfade: RB + BR.", loesungsweg: "„Genau ein Rot\" lässt sich auf <b>zwei</b> Wegen erreichen: erst Rot dann Blau, oder erst Blau dann Rot. Entlang jedes Pfades wird multipliziert, die Pfade werden addiert: $$0{,}4 \\cdot 0{,}6 + 0{,}6 \\cdot 0{,}4 = 2 \\cdot 0{,}24 = 0{,}48$$ Das Übersehen des zweiten Pfades ist der häufigste Fehler bei dieser Aufgabenart." },
      { id: 20, level: 4, typ: "numerisch", frage: "Urne 3 rot, 2 blau. Ohne Zurück. 2 Züge. \\(P(\\text{1. rot, 2. blau})\\)?", loesung: 0.3, toleranz: 0.01, tipp: "\\(\\frac{3}{5} \\cdot \\frac{2}{4}\\).", loesungsweg: "Ohne Zurücklegen: Beim ersten Zug \\(3\\) von \\(5\\) rot, danach sind noch \\(4\\) Kugeln übrig, davon \\(2\\) blau. $$\\frac{3}{5} \\cdot \\frac{2}{4} = 0{,}3$$ Hier ist die Reihenfolge vorgegeben, es gibt also nur diesen einen Pfad." },
      { id: 21, level: 4, typ: "numerisch", frage: "Münze 3-mal. \\(P(\\text{genau 2 Kopf})\\)?", loesung: 0.375, toleranz: 0.01, tipp: "3 Pfade, je \\(1/8\\).", loesungsweg: "Genau zweimal Kopf bei drei Würfen: KKZ, KZK, ZKK — drei Pfade mit je \\(\\tfrac18\\): $$3 \\cdot \\tfrac18 = \\tfrac38 = 0{,}375$$" },
      { id: 22, level: 4, typ: "numerisch", frage: "Elfmeter 80 %. 3 Schuss. \\(P(\\text{genau 2 Treffer})\\)?", loesung: 0.384, toleranz: 0.01, tipp: "3 Pfade: TTN, TNT, NTT. Je \\(0{,}8^2 \\cdot 0{,}2\\).", loesungsweg: "Der Nicht-Treffer kann an erster, zweiter oder dritter Stelle stehen — drei Pfade mit je \\(0{,}8^2 \\cdot 0{,}2 = 0{,}128\\): $$3 \\cdot 0{,}128 = 0{,}384$$" },
      { id: 23, level: 4, typ: "numerisch", frage: "Würfel 2-mal. \\(P(\\text{beide 6})\\) (4 Nachk.)?", loesung: 0.0278, toleranz: 0.001, tipp: "\\(1/36\\).", loesungsweg: "Zwei unabhängige Würfe: $$\\frac{1}{6} \\cdot \\frac{1}{6} = \\frac{1}{36} \\approx 0{,}0278$$" },
      { id: 24, level: 4, typ: "mc", frage: "„Mindestens eine 6\" bei 2 Würfen hat \\(P = ?\\) (4 Nachk.)", optionen: ["\\(0{,}1667\\)", "\\(0{,}3056\\)", "\\(0{,}5000\\)", "\\(0{,}8333\\)"], korrekt: 1, tipp: "1 - P(keine 6) = 1 - (5/6)^2.", loesungsweg: "Über das Gegenereignis geht es schneller als über alle günstigen Pfade. „Keine 6\" bedeutet zweimal eine der fünf anderen Augenzahlen: $$P(\\text{keine 6}) = \\left(\\tfrac56\\right)^2 = \\tfrac{25}{36}$$ $$P(\\text{mind. eine 6}) = 1 - \\tfrac{25}{36} = \\tfrac{11}{36} \\approx 0{,}3056$$ Wer stattdessen \\(\\tfrac16 + \\tfrac16\\) rechnet, zählt den Fall „zweimal 6\" doppelt." },
      // LEVEL 5
      { id: 25, level: 5, typ: "mc", frage: "Urne mit 4 roten und 6 blauen Kugeln, zweimal ziehen <b>ohne</b> Zurücklegen. Lea rechnet: \\(P(\\text{rot, rot}) = 0{,}4 \\cdot 0{,}4 = 0{,}16\\). Was ist dazu zu sagen?", optionen: ["Richtig.", "Falsch: Beim zweiten Zug sind nur noch 3 von 9 Kugeln rot, richtig ist \\(0{,}4 \\cdot \\frac{3}{9} \\approx 0{,}133\\).", "Falsch: Man muss \\(0{,}4 + 0{,}4 = 0{,}8\\) rechnen.", "Falsch: Richtig ist \\(0{,}4 \\cdot 0{,}6 = 0{,}24\\)."], korrekt: 1, tipp: "Wie sieht die Urne nach dem ersten Zug aus?", loesungsweg: "Ohne Zurücklegen ändert sich die Urne: Nach einer roten Kugel sind noch \\(3\\) rote von \\(9\\) übrig. $$P = \\frac{4}{10} \\cdot \\frac{3}{9} = \\frac{12}{90} \\approx 0{,}133$$ Leas Rechnung gilt nur <b>mit</b> Zurücklegen. Addiert wird entlang eines Pfades nie." },
      { id: 26, level: 5, typ: "numerisch", frage: "Ein Glücksrad hat vier gleich große Felder: drei rote und ein grünes. Es wird zweimal gedreht. \\(P(\\text{genau einmal grün})\\)? (3 Nachk.)", loesung: 0.375, toleranz: 0.005, tipp: "Grün kann beim ersten oder beim zweiten Drehen kommen.", loesungsweg: "Zwei Pfade führen zu genau einem Grün: grün-rot und rot-grün, jeder mit \\(\\frac14 \\cdot \\frac34\\): $$2 \\cdot \\frac14 \\cdot \\frac34 = \\frac{6}{16} = 0{,}375$$" },
      { id: 27, level: 5, typ: "numerisch", frage: "Ein Zahlenschloss hat drei Ringe mit jeweils gleich vielen Ziffern. Insgesamt gibt es 512 Einstellungen. Wie viele Ziffern hat jeder Ring?", loesung: 8, toleranz: 0, tipp: "Zählprinzip rückwärts: welche Zahl dreimal mit sich multipliziert ergibt 512?", loesungsweg: "Nach dem Zählprinzip gilt \\(n \\cdot n \\cdot n = n^3 = 512\\). Ausprobieren: \\(7^3 = 343\\), \\(8^3 = 512\\) ✓ Jeder Ring hat \\(8\\) Ziffern." },
      { id: 28, level: 5, typ: "mc", frage: "Eine Münze wird viermal geworfen. Ben rechnet: \\(P(\\text{genau dreimal Kopf}) = \\left(\\frac12\\right)^3 = \\frac18\\). Was ist dazu zu sagen?", optionen: ["Richtig.", "Falsch: Es gibt vier Pfade mit genau drei Kopf (KKKZ, KKZK, KZKK, ZKKK) mit je \\(\\frac{1}{16}\\), also \\(P = \\frac{4}{16} = \\frac14\\).", "Falsch: \\(P = \\frac{3}{8}\\).", "Falsch: \\(P = \\frac{1}{16}\\), weil vier Würfe gemacht werden."], korrekt: 1, tipp: "Wie viele Würfe hat jeder Pfad, und wie viele Pfade passen?", loesungsweg: "Jeder Pfad hat <b>vier</b> Würfe, also die Wahrscheinlichkeit \\(\\left(\\frac12\\right)^4 = \\frac{1}{16}\\). Genau drei Kopf: Der eine Zahl-Wurf kann an vier Stellen stehen — vier Pfade: $$4 \\cdot \\frac{1}{16} = \\frac14$$ Ben hat den vierten Wurf (die Zahl) im Pfad vergessen und nur einen der vier Pfade gezählt." },
      { id: 29, level: 5, typ: "numerisch", frage: "Ein Schütze trifft mit der Wahrscheinlichkeit 0,9. Er schießt zweimal. \\(P(\\text{höchstens ein Treffer})\\)? (2 Nachk.)", loesung: 0.19, toleranz: 0.01, tipp: "Das Gegenereignis von „höchstens einer\" ist „beide\".", loesungsweg: "„Höchstens ein Treffer\" ist das Gegenereignis von „zwei Treffer\": $$P = 1 - 0{,}9 \\cdot 0{,}9 = 1 - 0{,}81 = 0{,}19$$ Zur Kontrolle über die Pfade: TN + NT + NN \\(= 0{,}09 + 0{,}09 + 0{,}01 = 0{,}19\\) ✓" },
      { id: 30, level: 5, typ: "numerisch", frage: "Urne mit 2 roten und 3 blauen Kugeln, zweimal ziehen ohne Zurücklegen. \\(P(\\text{die zweite Kugel ist rot})\\)? (1 Nachk.)", loesung: 0.4, toleranz: 0.01, tipp: "Die erste Kugel kann rot oder blau sein — zwei Pfade.", loesungsweg: "Zwei Pfade enden mit einer roten Kugel: $$\\text{rot-rot: } \\frac25 \\cdot \\frac14 = \\frac{2}{20}, \\qquad \\text{blau-rot: } \\frac35 \\cdot \\frac24 = \\frac{6}{20}$$ $$P = \\frac{2}{20} + \\frac{6}{20} = \\frac{8}{20} = 0{,}4$$ Das ist dieselbe Wahrscheinlichkeit wie für „erste Kugel rot\" — solange man den ersten Zug nicht kennt, ist der zweite genauso zufällig." },
      // LEVEL 6
      { id: 31, level: 6, typ: "mc", frage: "Behauptung: „Wirft man eine Münze dreimal, so ist \\(P(\\text{mindestens einmal Kopf}) = 3 \\cdot \\frac12 = 1{,}5\\) — also sicher.\" Stimmt das?", optionen: ["Ja — drei Chancen zu je \\(\\frac12\\).", "Nein — Wahrscheinlichkeiten verschiedener Würfe werden nicht so addiert; über das Gegenereignis: \\(1 - \\left(\\frac12\\right)^3 = \\frac78\\).", "Nein — es bleibt bei \\(\\frac12\\), weil jeder Wurf gleich ist.", "Nein — \\(P = \\frac38\\), ein Pfad von acht."], korrekt: 1, tipp: "Kann eine Wahrscheinlichkeit größer als 1 sein?", loesungsweg: "Ein Wert über \\(1\\) ist unmöglich — schon das zeigt den Fehler. „Mindestens einmal Kopf\" ist das Gegenereignis von „dreimal Zahl\": $$P = 1 - \\left(\\tfrac12\\right)^3 = 1 - \\tfrac18 = \\tfrac78$$ Addiert werden nur die Wahrscheinlichkeiten <b>verschiedener Pfade</b> desselben Ereignisses, nicht die Chancen einzelner Würfe." },
      { id: 32, level: 6, typ: "numerisch", frage: "In einer Urne liegen 3 rote und einige blaue Kugeln. Zieht man zweimal <b>mit</b> Zurücklegen, so ist \\(P(\\text{zweimal rot}) = \\frac{1}{16}\\). Wie viele blaue Kugeln liegen in der Urne?", loesung: 9, toleranz: 0, tipp: "Welche Wahrscheinlichkeit für rot ergibt mit sich selbst multipliziert \\(\\frac{1}{16}\\)?", loesungsweg: "Mit Zurücklegen gilt \\(P(\\text{rot, rot}) = p^2\\) mit \\(p = P(\\text{rot})\\): $$p^2 = \\tfrac{1}{16} \\implies p = \\tfrac14$$ Also \\(\\frac{3}{3 + x} = \\frac14\\), d. h. \\(3 + x = 12\\) und \\(x = 9\\) blaue Kugeln." },
      { id: 33, level: 6, typ: "numerisch", frage: "Urne mit 4 roten und 2 blauen Kugeln, zweimal ziehen ohne Zurücklegen. \\(P(\\text{beide Kugeln haben dieselbe Farbe})\\)? (3 Nachk.)", loesung: 0.467, toleranz: 0.005, tipp: "Zwei Fälle: beide rot oder beide blau.", loesungsweg: "$$\\text{rot-rot: } \\frac46 \\cdot \\frac35 = \\frac{12}{30}, \\qquad \\text{blau-blau: } \\frac26 \\cdot \\frac15 = \\frac{2}{30}$$ $$P = \\frac{12}{30} + \\frac{2}{30} = \\frac{14}{30} \\approx 0{,}467$$ Der Fall „beide blau\" ist selten, darf aber nicht vergessen werden." },
      { id: 34, level: 6, typ: "mc", frage: "Urne mit 5 roten und 5 blauen Kugeln, zweimal ziehen <b>ohne</b> Zurücklegen. Behauptung: „\\(P(\\text{verschiedene Farben}) = \\frac12\\), denn zwei der vier Pfade RR, RB, BR, BB passen.\" Was ist dazu zu sagen?", optionen: ["Richtig.", "Falsch: Die vier Pfade sind ohne Zurücklegen nicht gleich wahrscheinlich; richtig ist \\(2 \\cdot \\frac{5}{10} \\cdot \\frac59 = \\frac59\\).", "Falsch: Richtig ist \\(\\frac14\\).", "Falsch: Richtig ist \\(\\frac{4}{9}\\)."], korrekt: 1, tipp: "Berechne RB und BR mit den Pfadregeln — sind sie wirklich je \\(\\frac14\\)?", loesungsweg: "Ohne Zurücklegen: $$P(RB) = \\frac{5}{10} \\cdot \\frac59 = \\frac{25}{90}, \\qquad P(BR) = \\frac{25}{90}$$ $$P(\\text{verschieden}) = \\frac{50}{90} = \\frac59 \\approx 0{,}556$$ Die Pfade RR und BB haben dagegen je \\(\\frac{20}{90}\\) — Pfade zählen ist nur erlaubt, wenn sie gleich wahrscheinlich sind. Mit Zurücklegen wäre \\(\\frac12\\) richtig." },
      { id: 35, level: 6, typ: "numerisch", frage: "Ein Glücksrad hat die unbekannte Gewinnwahrscheinlichkeit \\(p\\). Bei zwei Drehungen beträgt die Wahrscheinlichkeit für „kein Gewinn\" 0,49. Wie groß ist \\(p\\)? (2 Nachk.)", loesung: 0.3, toleranz: 0.01, tipp: "„Kein Gewinn\" bei beiden Drehungen ist ein Pfad mit zwei gleichen Ästen.", loesungsweg: "Pfad Niete-Niete: $$(1 - p)^2 = 0{,}49 \\implies 1 - p = 0{,}7 \\implies p = 0{,}3$$ Die Gewinnwahrscheinlichkeit beträgt \\(30\\,\\%\\)." },
      { id: 36, level: 6, typ: "numerisch", frage: "Vier Personen, darunter Anna und Ben, setzen sich zufällig auf vier Stühle in einer Reihe. \\(P(\\text{Anna und Ben sitzen nebeneinander})\\)? (2 Nachk.)", loesung: 0.5, toleranz: 0.01, tipp: "Zähle die Sitzordnungen, bei denen die beiden ein Nachbarpaar bilden.", loesungsweg: "Alle Sitzordnungen: \\(4 \\cdot 3 \\cdot 2 \\cdot 1 = 24\\). Nebeneinander heißt: Stühle \\(1\\)-\\(2\\), \\(2\\)-\\(3\\) oder \\(3\\)-\\(4\\) (drei Paare), Anna links oder rechts (\\(2\\)), und die anderen beiden auf den Rest (\\(2\\)): $$3 \\cdot 2 \\cdot 2 = 12 \\implies P = \\frac{12}{24} = 0{,}5$$" }];
    </script>
